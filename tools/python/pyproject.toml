[project]
name = "ipas-textbook-code"
version = "0.1.0"
description = "教材程式段落的實測環境（只在本機執行，不部署）"
requires-python = "==3.12.*"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "torch",
  "mlflow",
  "xgboost>=3.4.1",
  "imbalanced-learn>=0.14.2",
  "shap>=0.54.1",
  "statsmodels>=0.15.0",
  "tensorflow>=2.21.0",
  "lightgbm>=4.7.0",
  "umap-learn>=0.5.12",
  "lime>=0.2.0.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
