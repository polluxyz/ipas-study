<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="360" height="740" role="img" aria-labelledby="title desc"><title id="title">視覺語言匹配生成少樣本與模態擴展</title><desc id="desc">比較三種交付路徑，並以獨立區塊說明新增模態仍需編碼與對齊。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#475569"/></marker></defs><rect width="360" height="740" fill="#ffffff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#172033"><text x="180" y="26" font-size="18" text-anchor="middle">輸出任務決定模組</text><text x="180" y="58" font-size="16" text-anchor="middle">匹配：CLIP</text><rect x="25" y="74" width="310" height="40" rx="7" fill="#e7effb" stroke="#334155" /><text x="180" y="99" font-size="15" text-anchor="middle">圖片＋文字候選 → 雙編碼器</text><path d="M180,116 L180,135" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="25" y="139" width="310" height="40" rx="7" fill="#fff1d6" stroke="#334155" /><text x="180" y="164" font-size="15" text-anchor="middle">比較分數 → 選既有候選</text><text x="180" y="218" font-size="16" text-anchor="middle">生成：BLIP／BLIP-2</text><rect x="25" y="234" width="310" height="40" rx="7" fill="#e7effb" stroke="#334155" /><text x="180" y="259" font-size="15" text-anchor="middle">圖片＋問題 → 視覺與語言介面</text><path d="M180,276 L180,296" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="25" y="300" width="310" height="40" rx="7" fill="#fff1d6" stroke="#334155" /><text x="180" y="325" font-size="15" text-anchor="middle">文字生成 → 新答案／圖說</text><text x="180" y="379" font-size="16" text-anchor="middle">少樣本：Flamingo</text><rect x="25" y="395" width="310" height="40" rx="7" fill="#e7effb" stroke="#334155" /><text x="180" y="420" font-size="15" text-anchor="middle">圖文示例 → 待回答的圖與問題</text><path d="M180,437 L180,457" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="25" y="461" width="310" height="40" rx="7" fill="#fff1d6" stroke="#334155" /><text x="180" y="486" font-size="15" text-anchor="middle">推論脈絡 → 接續文字答案</text><text x="180" y="539" font-size="16" text-anchor="middle">擴展介面：設計示意（補充）</text><rect x="25" y="555" width="310" height="40" rx="7" fill="#e7effb" stroke="#334155" /><text x="180" y="580" font-size="15" text-anchor="middle">新感測模態 → 專用編碼與投影</text><path d="M180,597 L180,617" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="25" y="621" width="310" height="40" rx="7" fill="#e7effb" stroke="#334155" /><text x="180" y="646" font-size="15" text-anchor="middle">配對與對齊 → 共享骨幹</text><text x="180" y="695" font-size="14" text-anchor="middle">新增模態不等於自動新增輸出解碼器</text><text x="180" y="720" font-size="13" text-anchor="middle">示意圖；不表示既有模型支援任意感測</text></g></svg>
