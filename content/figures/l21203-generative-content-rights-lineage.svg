<svg xmlns="http://www.w3.org/2000/svg" width="360" height="572" viewBox="0 0 360 572" role="img" aria-labelledby="title desc">
<title id="title">生成素材的權利與紀錄鏈</title><desc id="desc">素材權利與模型條款分別核對，再連結提示、人工編修、輸出與發布決定。紀錄鏈可追查應用操作，但不保證還原模型全部訓練來源。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#10233f} .box{fill:#eff6ff;stroke:#1d4e89;stroke-width:1.6} .hold{fill:#fff7ed;stroke:#9a3412;stroke-width:1.6;stroke-dasharray:5 3} .line{fill:none;stroke:#334155;stroke-width:1.8;marker-end:url(#arrow)}</style>
<rect width="360" height="572" fill="#fff"/><rect class="box" x="15" y="20" width="158" height="68" rx="9"/><text x="94" y="47" text-anchor="middle" font-size="17" font-weight="700">素材來源與權利</text><text x="94" y="71" text-anchor="middle" font-size="14">用途、授權版本</text><rect class="box" x="187" y="20" width="158" height="68" rx="9"/><text x="266" y="47" text-anchor="middle" font-size="17" font-weight="700">模型與服務條款</text><text x="266" y="71" text-anchor="middle" font-size="14">模型、契約版本</text><path class="line" d="M94 88V114H180V137"/><path class="line" d="M266 88V114H180"/><rect class="box" x="30" y="140" width="300" height="68" rx="9"/><text x="180" y="167" text-anchor="middle" font-size="17" font-weight="700">提示與生成紀錄</text><text x="180" y="191" text-anchor="middle" font-size="14">已知輸入、模型、生成設定</text><path class="line" d="M180 208V237"/><rect class="box" x="30" y="240" width="300" height="68" rx="9"/><text x="180" y="267" text-anchor="middle" font-size="17" font-weight="700">人工編修與輸出版本</text><text x="180" y="291" text-anchor="middle" font-size="14">保留來源關聯及實際成品</text><path class="line" d="M180 308V337"/><rect class="box" x="30" y="340" width="300" height="68" rx="9"/><text x="180" y="367" text-anchor="middle" font-size="17" font-weight="700">發布前權利查核</text><text x="180" y="391" text-anchor="middle" font-size="14">相似比對、人物同意、使用範圍</text><path class="line" d="M180 408V437"/><rect class="box" x="30" y="440" width="300" height="68" rx="9"/><text x="180" y="467" text-anchor="middle" font-size="17" font-weight="700">核准、限用或暫停</text><text x="180" y="491" text-anchor="middle" font-size="14">決策人、限制、後續處置</text><text x="180" y="542" text-anchor="middle" font-size="14">教學示意；有追溯紀錄仍須核對權利</text></svg>