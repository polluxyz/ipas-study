<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780" role="img" aria-labelledby="title desc"><title id="title">PIA 五步與後續驗證</title><desc id="desc">由資料流盤點、風險辨識、影響分析、策略擬定到治理責任分工。虛線框是補充的驗證與重評。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#475569"/></marker></defs><rect width="360" height="780" rx="12" fill="#f8fafc"/><g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" fill="#172554" text-anchor="middle"><text x="180" y="30" font-size="20" font-weight="700">把風險接到責任</text><rect x="20" y="50" width="320" height="70" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="77" font-size="17" font-weight="700">一、盤點資料流</text><text x="180" y="102" font-size="15">來源、處理、儲存、使用到刪除</text><path d="M180 120V148" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="150" width="320" height="70" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="177" font-size="17" font-weight="700">二、辨識風險</text><text x="180" y="202" font-size="15">在哪個環節影響誰？</text><path d="M180 220V248" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="250" width="320" height="70" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="277" font-size="17" font-weight="700">三、分析影響</text><text x="180" y="302" font-size="15">個人權益及組織可能受何損害？</text><path d="M180 320V348" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="350" width="320" height="70" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="377" font-size="17" font-weight="700">四、擬定策略</text><text x="180" y="402" font-size="15">技術控制與管理措施</text><path d="M180 420V448" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="450" width="320" height="70" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="477" font-size="17" font-weight="700">五、分配治理責任</text><text x="180" y="502" font-size="15">誰執行？誰有權決定？</text><path d="M180 520V553" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="555" width="320" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="6 4"/><text x="180" y="582" font-size="17" font-weight="700">補充｜驗證、記錄、重評</text><text x="180" y="607" font-size="15">未達條件：暫緩並回報</text><path d="M20 590H9V85H18" fill="none" stroke="#475569" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="180" y="682" font-size="15">實線框：指引五步</text><text x="180" y="709" font-size="15">虛線框與回箭頭：補充追蹤</text><text x="180" y="751" font-size="14">教學示意；措施完成須有證據</text></g></svg>
