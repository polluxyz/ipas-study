<svg xmlns="http://www.w3.org/2000/svg" width="390" height="585" viewBox="0 0 390 585" role="img" aria-labelledby="title desc" lang="zh-Hant">
  <title id="title">SMOTE：少數類別鄰居間的一步插值</title>
  <desc id="desc">起點為圓點（2,4），少數類別鄰居為方點（4,6），虛線連接兩點；使用 0.25 的插值比例，得到菱形合成點（2.5,4.5）。只使用訓練摺；這是教學插值，不代表真實病例。</desc>
  <style>
    :root { color-scheme: light dark; --bg:#f9fbf9; --ink:#263a45; --muted:#465b66; --grid:#d4dfe1; --teal:#006b66; --orange:#9a3c00; --purple:#683d8f; --panel:#edf5f4; }
    @media (prefers-color-scheme: dark) { :root { --bg:#15252b; --ink:#e4edf1; --muted:#bbcbd2; --grid:#46535e; --teal:#78ded2; --orange:#ffbf86; --purple:#d8b9ff; --panel:#24373d; } }
    text { font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; fill:var(--ink); font-size:14px; }
    .title { font-size:20px; font-weight:700; } .muted { fill:var(--muted); } .small { font-size:13px; }
    .axis { stroke:var(--ink); stroke-width:1.5; } .grid { stroke:var(--grid); stroke-width:1; }
    .circle { fill:var(--teal); } .square { fill:var(--orange); } .diamond { fill:var(--purple); }
    .segment { stroke:var(--muted); stroke-width:2; stroke-dasharray:6 4; fill:none; }
  </style>
  <rect width="390" height="585" rx="12" fill="var(--bg)"/>
  <text x="20" y="34" class="title">SMOTE：少數類別間插值</text>
  <text x="20" y="59" class="muted">沿著起點到鄰居的線段產生新點</text>
  <text x="20" y="90" class="small muted">已標準化檢驗值二</text>
  <path class="grid" d="M62 120H350 M62 180H350 M62 240H350 M62 300H350 M62 360H350 M62 420H350 M110 120V420 M170 120V420 M230 120V420 M290 120V420 M350 120V420"/>
  <path class="axis" d="M62 120V420H350" fill="none"/>
  <g class="small muted" text-anchor="end"><text x="52" y="425">1</text><text x="52" y="365">2</text><text x="52" y="305">3</text><text x="52" y="245">4</text><text x="52" y="185">5</text><text x="52" y="125">6</text></g>
  <g class="small muted" text-anchor="middle"><text x="110" y="442">1</text><text x="170" y="442">2</text><text x="230" y="442">3</text><text x="290" y="442">4</text><text x="350" y="442">5</text></g>
  <text x="350" y="465" class="small muted" text-anchor="end">已標準化檢驗值一</text>
  <path class="segment" d="M170 240L290 120"/>
  <circle class="circle" cx="170" cy="240" r="6"/>
  <rect class="square" x="284" y="114" width="12" height="12"/>
  <path class="diamond" d="M200 201l8 9 -8 9 -8 -9z"/>
  <text x="72" y="262" class="small">起點 (2, 4)</text>
  <path d="M143 251L164 241" class="axis" fill="none"/>
  <text x="212" y="205" class="small">合成點</text><text x="212" y="223" class="small">(2.5, 4.5)</text>
  <text x="184" y="100" class="small">少數類別鄰居 (4, 6)</text>
  <rect x="20" y="482" width="350" height="85" rx="8" fill="var(--panel)"/>
  <text x="32" y="507">合成點 = 起點 + 0.25 × (鄰居 − 起點)</text>
  <text x="32" y="532" class="small muted">只使用訓練摺；此為教學插值，</text>
  <text x="32" y="552" class="small muted">不代表真實病例。</text>
</svg>
