<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 515" role="img"><title>三層漂移證據分流</title><desc>輸入、關係與效能分開調查；輸出分布是行為線索，不等於真值</desc><rect width="360" height="515" fill="#fff"/><g font-family="sans-serif" font-size="15" fill="#172554"><text x="14" y="25" >先問變的是哪一層</text><rect x="10" y="50" width="340" height="108" rx="10" fill="#eff6ff" stroke="#2563eb"/><text x="23" y="77" font-weight="bold">輸入層 P(X)</text><text x="23" y="107" >新客戶或產品長得是否不同？</text><text x="23" y="135" >比較特徵；無真值也能做。</text><rect x="10" y="180" width="340" height="108" rx="10" fill="#eff6ff" stroke="#2563eb"/><text x="23" y="207" font-weight="bold">關係層 P(Y|X)</text><text x="23" y="237" >相同特徵的實際結果是否不同？</text><text x="23" y="265" >回收真值，按相同條件比較。</text><rect x="10" y="310" width="340" height="108" rx="10" fill="#eff6ff" stroke="#2563eb"/><text x="23" y="337" font-weight="bold">效能層</text><text x="23" y="367" >這次預測是否更常出錯？</text><text x="23" y="395" >配對預測與真值，計算指標。</text><text x="14" y="465" >另查：輸出分布、閾值及版本變更。</text><text x="14" y="493" >三層可各自改變，排列不代表必然因果。</text></g></svg>
