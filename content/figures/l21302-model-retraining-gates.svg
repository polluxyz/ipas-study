<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 582" role="img" aria-labelledby="title desc"><title id="title">再訓練候選的晉升門控</title><desc id="desc">教學示意：觸發只產生候選，通過獨立評估及資源門檻後才核准。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs><rect width="360" height="582" rx="8" fill="#fff"/><g font-family="sans-serif" fill="#172b4d"><text x="180" y="28" font-size="17" text-anchor="middle">再訓練候選的晉升門控</text><rect x="20" y="55" width="320" height="64" rx="6" fill="#eff6ff" stroke="#64748b"/><text x="180" y="80" font-size="14" text-anchor="middle">監控異常→先查原因</text><text x="180" y="102" font-size="14" text-anchor="middle">資料未合格：先修復或補證據</text><path d="M180,122 V144" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="152" width="320" height="64" rx="6" fill="#eff6ff" stroke="#64748b"/><text x="180" y="177" font-size="14" text-anchor="middle">凍結訓練資料與標註版本</text><text x="180" y="199" font-size="14" text-anchor="middle">固定切分、種子及候選產物</text><path d="M180,219 V241" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="249" width="320" height="64" rx="6" fill="#eff6ff" stroke="#64748b"/><text x="180" y="274" font-size="14" text-anchor="middle">獨立EV集：現行對候選</text><text x="180" y="296" font-size="14" text-anchor="middle">整體、長尾、群差、證據量</text><path d="M180,316 V338" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="346" width="320" height="64" rx="6" fill="#eff6ff" stroke="#64748b"/><text x="180" y="371" font-size="14" text-anchor="middle">部署測試：延遲、記憶體</text><text x="180" y="393" font-size="14" text-anchor="middle">API、特徵規則及回復相容性</text><path d="M180,413 V435" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="443" width="320" height="86" rx="6" fill="#fff7ed" stroke="#64748b"/><text x="180" y="468" font-size="14" text-anchor="middle">未過：拒絕晉升並記原因</text><text x="180" y="490" font-size="14" text-anchor="middle">通過：負責人核准，分批發布</text><text x="180" y="512" font-size="14" text-anchor="middle">線上再觀察，必要時回復</text><text x="180" y="556" font-size="12" text-anchor="middle">完成訓練≠通過驗證≠完成發布</text></g></svg>
