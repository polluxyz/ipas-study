<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 536" role="img" aria-labelledby="title desc"><title id="title">電信服務合規盤點順序</title><desc id="desc">箭頭是盤點順序，不是資料傳輸方向。先確認服務及用戶權益，再查TEL-1與TEL-2。TEL-3實際由受託方往日本，另查欄位、權限及跨境，缺證據先停。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="360" height="536" rx="12" fill="#f8fafc"/><g font-family="system-ui, 'Microsoft JhengHei', sans-serif" fill="#0f172a"><text x="180" y="30" text-anchor="middle" font-size="18" font-weight="700">電信服務合規盤點順序</text><rect x="18" y="50" width="324" height="78" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="180" y="79" font-size="18" font-weight="700" text-anchor="middle">電信業者及用戶</text><text x="180" y="107" font-size="16" text-anchor="middle">服務條件、權益與申訴</text><path d="M180 130V153" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="18" y="163" width="324" height="78" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="180" y="192" font-size="18" font-weight="700" text-anchor="middle">TEL-1 國內受託處理</text><text x="180" y="220" font-size="16" text-anchor="middle">資料欄位、目的與權限</text><path d="M180 243V266" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="18" y="276" width="324" height="78" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="180" y="305" font-size="18" font-weight="700" text-anchor="middle">TEL-2 回交風險提示</text><text x="180" y="333" font-size="16" text-anchor="middle">值班員覆核及服務責任</text><path d="M180 356V379" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="18" y="389" width="324" height="78" rx="9" fill="#fef3c7" stroke="#475569"/><text x="180" y="418" font-size="18" font-weight="700" text-anchor="middle">另查 TEL-3 日本除錯</text><text x="180" y="446" font-size="16" text-anchor="middle">缺清冊先停，補查跨境保障</text><text x="180" y="506" text-anchor="middle" font-size="16">教學示意｜個案結論須另行查核</text></g></svg>
