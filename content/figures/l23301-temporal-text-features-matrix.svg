<svg xmlns="http://www.w3.org/2000/svg" width="360" height="410" viewBox="0 0 360 410" role="img" aria-labelledby="title desc"><title id="title">時間與文字的固定表示流程</title><desc id="desc">從同一筆已知時間與文字分別取特徵，文字只在訓練集fit，再依原索引合併。</desc><rect width="360" height="410" fill="white"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="16" y="28" font-size="18" text-anchor="start" fill="#172b4d">同一筆樣本，兩條表示路線</text><rect x="16" y="48" width="328" height="57" rx="8" fill="#eaf2ff" stroke="#94a3b8"/><text x="28" y="73" font-size="16" text-anchor="start" fill="#172b4d">時間戳 ＋ 原文字</text><text x="28" y="95" font-size="14" text-anchor="start" fill="#172b4d">先確認兩欄在截止點已知</text><line x1="180" y1="106" x2="180" y2="125" stroke="#64748b" stroke-width="2" /><line x1="90" y1="125" x2="270" y2="125" stroke="#64748b" stroke-width="2" /><line x1="90" y1="125" x2="90" y2="144" stroke="#64748b" stroke-width="2" /><line x1="270" y1="125" x2="270" y2="144" stroke="#64748b" stroke-width="2" /><rect x="16" y="145" width="156" height="118" rx="8" fill="#eaf2ff" stroke="#94a3b8"/><rect x="188" y="145" width="156" height="118" rx="8" fill="#eaf2ff" stroke="#94a3b8"/><text x="94" y="172" font-size="17" text-anchor="middle" fill="#172b4d">時間拆解</text><text x="94" y="203" font-size="15" text-anchor="middle" fill="#172b4d">星期／工作日</text><text x="94" y="233" font-size="14" text-anchor="middle" fill="#172b4d">業務時區固定</text><text x="266" y="172" font-size="17" text-anchor="middle" fill="#172b4d">文字轉數值</text><text x="266" y="203" font-size="15" text-anchor="middle" fill="#172b4d">分詞／固定詞欄</text><text x="266" y="233" font-size="14" text-anchor="middle" fill="#172b4d">只用訓練fit</text><line x1="90" y1="263" x2="90" y2="286" stroke="#64748b" stroke-width="2" /><line x1="270" y1="263" x2="270" y2="286" stroke="#64748b" stroke-width="2" /><line x1="90" y1="286" x2="270" y2="286" stroke="#64748b" stroke-width="2" /><line x1="180" y1="286" x2="180" y2="308" stroke="#64748b" stroke-width="2" /><rect x="16" y="309" width="328" height="65" rx="8" fill="#eef8f0" stroke="#94a3b8"/><text x="180" y="336" font-size="17" text-anchor="middle" fill="#172b4d">依相同列索引合併</text><text x="180" y="360" font-size="15" text-anchor="middle" fill="#172b4d">對齊同一筆未來目標</text><text x="16" y="398" font-size="12" text-anchor="start" fill="#172b4d">資料：教學合成資料</text></g></svg>
