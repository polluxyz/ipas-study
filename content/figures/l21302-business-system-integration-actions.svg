<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 788" role="img" aria-labelledby="title desc"><title id="title">預測如何成為作業</title><desc id="desc">零售推薦流向 CRM 促銷，逾時先待確認；需求預測供 ERP 採購。POS 回饋、MES 複檢及具體數值是教學補充。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#285177"/></marker></defs><rect width="360" height="788" fill="white"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="16" fill="#172d43"><text x="180" y="30" text-anchor="middle" font-weight="700">預測如何成為作業</text><text x="180" y="50" text-anchor="middle" font-size="12">教學合成資料</text><text x="180" y="70" text-anchor="middle" font-weight="700">零售促銷</text><rect x="30" y="90" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="114" text-anchor="middle"><tspan x="180" dy="0">POS 交易 → 推薦模型（補充）</tspan><tspan x="180" dy="22">r01：rec-v2，分數 0.90（補充）</tspan></text><path d="M180 150 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="176" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="200" text-anchor="middle"><tspan x="180" dy="0">業務規則 → CRM</tspan><tspan x="180" dy="22">寄促銷券；逾時則待確認（補充）</tspan></text><path d="M180 236 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="262" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="286" text-anchor="middle"><tspan x="180" dy="0">POS 回報兌換與銷售（補充）</tspan><tspan x="180" dy="22">行銷追蹤執行與成效</tspan></text><text x="180" y="364" text-anchor="middle" font-weight="700">零售採購</text><rect x="30" y="384" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="408" text-anchor="middle"><tspan x="180" dy="0">POS 歷史 → 需求預測（補充）</tspan><tspan x="180" dy="22">demand-v1：需求 120、現貨 80</tspan></text><path d="M180 444 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="470" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="494" text-anchor="middle"><tspan x="180" dy="0">ERP 產生 40 件採購草案</tspan><tspan x="180" dy="22">採購人員核可後才下單（補充）</tspan></text><text x="180" y="572" text-anchor="middle" font-weight="700">製造複檢（補充）</text><rect x="30" y="592" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="616" text-anchor="middle"><tspan x="180" dy="0">影像 → 檢驗模型 → MES</tspan><tspan x="180" dy="22">m01：瑕疵分數 0.90</tspan></text><path d="M180 652 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="678" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="702" text-anchor="middle"><tspan x="180" dy="0">品管複檢 → 回寫處置</tspan><tspan x="180" dy="22">模型預測與執行結果分別保存</tspan></text></g></svg>
