<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" role="img" aria-labelledby="title desc"><title id="title">端雲分工與中介層</title><desc id="desc">訓練模型由公有雲或私有環境發布到近端；中介層連接兩環境，管理同步、服務呼叫與狀態追蹤。</desc><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#142c40;font-size:14px}.h{font-size:17px;font-weight:700}.s{font-size:12px}.box{fill:#edf6fb;stroke:#266080;stroke-width:1.5}.arrow{fill:none;stroke:#266080;stroke-width:2}</style><rect width="360" height="490" fill="#fff"/><text x="16" y="28" class="h">訓練、同步與推論分工</text><rect class="box" x="16" y="44" width="328" height="64" rx="8"/><text x="28" y="69" class="h">公有雲：允許資料的訓練／推論</text><text x="28" y="92" class="">接收核可資料；發布模型與版本</text><path class="arrow" d="M180 108 v20 m-5 -6 l5 6 5 -6"/><text x="190" y="123" class="s">模型／核可資料 ⇅</text><rect class="box" x="16" y="138" width="328" height="64" rx="8"/><text x="28" y="163" class="h">中介整合層／服務網格</text><text x="28" y="186" class="">同步流程｜授權呼叫｜狀態追蹤</text><path class="arrow" d="M180 202 v20 m-5 -6 l5 6 5 -6"/><text x="190" y="217" class="s">受控交換 ⇅</text><rect class="box" x="16" y="232" width="328" height="64" rx="8"/><text x="28" y="257" class="h">私有環境：受限資料與內部推論</text><text x="28" y="280" class="">資料同步由流程負責；網格管理通訊</text><path class="arrow" d="M180 296 v20 m-5 -6 l5 6 5 -6"/><text x="190" y="311" class="s">核可模型向下；事件向上</text><rect class="box" x="16" y="326" width="328" height="64" rx="8"/><text x="28" y="351" class="h">邊緣：即時推論與回應</text><text x="28" y="374" class="">困難請求先查權限，再決定升級路徑</text><text x="16" y="421" class="">跨環境都記：請求 ID、模型版、前處理版</text><text x="16" y="447" class="s">圖示分工；不表示所有資料都能跨環境傳送</text><text x="16" y="472" class="s">資料：教學示意，依指引 5-15、5-18</text></svg>
