<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 485" role="img" aria-labelledby="title desc"><title id="title">相同四葉，不同生長形狀</title><desc id="desc">教學示意：上圖逐層形成四葉，最深兩層；下圖反覆選高增益葉，四葉但最深三層。不是實測訓練結果。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#374151"/></marker></defs><rect width="360" height="485" fill="#fff"/><g font-family="sans-serif" fill="#152a43"><text x="180" y="25" text-anchor="middle" font-size="17">逐層示意：四葉、較均勻</text><path d="M180 52 L95 95" fill="none" stroke="#374151" stroke-width="2" /><path d="M180 52 L265 95" fill="none" stroke="#374151" stroke-width="2" /><path d="M95 95 L45 145" fill="none" stroke="#374151" stroke-width="2" /><path d="M95 95 L130 145" fill="none" stroke="#374151" stroke-width="2" /><path d="M265 95 L230 145" fill="none" stroke="#374151" stroke-width="2" /><path d="M265 95 L315 145" fill="none" stroke="#374151" stroke-width="2" /><circle cx="180" cy="52" r="8" fill="#fff" stroke="#265c9e" stroke-width="2"/><circle cx="95" cy="95" r="8" fill="#fff" stroke="#265c9e" stroke-width="2"/><circle cx="265" cy="95" r="8" fill="#fff" stroke="#265c9e" stroke-width="2"/><circle cx="45" cy="145" r="10" fill="#e5efff" stroke="#265c9e" stroke-width="2"/><text x="45" y="175" text-anchor="middle" font-size="14">左左</text><circle cx="130" cy="145" r="10" fill="#e5efff" stroke="#265c9e" stroke-width="2"/><text x="130" y="175" text-anchor="middle" font-size="14">左右</text><circle cx="230" cy="145" r="10" fill="#e5efff" stroke="#265c9e" stroke-width="2"/><text x="230" y="175" text-anchor="middle" font-size="14">右左</text><circle cx="315" cy="145" r="10" fill="#e5efff" stroke="#265c9e" stroke-width="2"/><text x="315" y="175" text-anchor="middle" font-size="14">右右</text><path d="M15 195 L345 195" fill="none" stroke="#374151" stroke-width="2" /><text x="180" y="222" text-anchor="middle" font-size="17">葉優先示意：四葉、局部更深</text><path d="M180 250 L105 295" fill="none" stroke="#374151" stroke-width="2" /><path d="M180 250 L260 295" fill="none" stroke="#374151" stroke-width="2" /><path d="M105 295 L65 342" fill="none" stroke="#374151" stroke-width="2" /><path d="M105 295 L155 342" fill="none" stroke="#374151" stroke-width="2" /><path d="M65 342 L30 392" fill="none" stroke="#374151" stroke-width="2" /><path d="M65 342 L95 392" fill="none" stroke="#374151" stroke-width="2" /><circle cx="180" cy="250" r="8" fill="#fff" stroke="#265c9e" stroke-width="2"/><circle cx="105" cy="295" r="8" fill="#fff" stroke="#265c9e" stroke-width="2"/><circle cx="65" cy="342" r="8" fill="#fff" stroke="#265c9e" stroke-width="2"/><circle cx="260" cy="295" r="10" fill="#e5efff" stroke="#265c9e" stroke-width="2"/><text x="260" y="325" text-anchor="middle" font-size="14">右</text><circle cx="155" cy="342" r="10" fill="#e5efff" stroke="#265c9e" stroke-width="2"/><text x="155" y="372" text-anchor="middle" font-size="14">左右</text><circle cx="30" cy="392" r="10" fill="#e5efff" stroke="#265c9e" stroke-width="2"/><text x="30" y="422" text-anchor="middle" font-size="14">左左左</text><circle cx="95" cy="392" r="10" fill="#e5efff" stroke="#265c9e" stroke-width="2"/><text x="95" y="422" text-anchor="middle" font-size="14">左左右</text><text x="180" y="452" text-anchor="middle" font-size="15">先分最大增益葉，可能沿同側長深</text><text x="180" y="477" text-anchor="middle" font-size="15">葉數限制與深度限制要分開看</text></g></svg>
