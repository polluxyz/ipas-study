<svg xmlns="http://www.w3.org/2000/svg" width="360" height="574" viewBox="0 0 360 574" role="img" aria-labelledby="title desc"><title id="title">安全通訊的分工</title><desc id="desc">教學合成流程。核對對方身分與金鑰綁定；經認證的金鑰交換；通道加密並驗證訊息完整性；接收端核對輪次、接收者與 nonce；通過才聚合；用過的 nonce 拒絕。公鑰與憑證不是私鑰；產生本次通道祕密；對稱式流量金鑰留兩端；這些欄位也納入認證範圍；重送合法訊息也可能有害。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker></defs><rect width="360" height="574" fill="#ffffff"/><g fill="#0f172a" font-family="sans-serif"><text x="180" y="30" text-anchor="middle" font-size="19" font-weight="bold">安全通訊的分工</text><rect x="14" y="54" width="332" height="72" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="81" text-anchor="middle" font-size="15">核對對方身分與金鑰綁定</text><text x="180" y="106" text-anchor="middle" font-size="13">公鑰與憑證不是私鑰</text><path d="M180 128v23" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="155" width="332" height="72" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="182" text-anchor="middle" font-size="15">經認證的金鑰交換</text><text x="180" y="207" text-anchor="middle" font-size="13">產生本次通道祕密</text><path d="M180 229v23" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="256" width="332" height="72" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="283" text-anchor="middle" font-size="15">通道加密並驗證訊息完整性</text><text x="180" y="308" text-anchor="middle" font-size="13">對稱式流量金鑰留兩端</text><path d="M180 330v23" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="357" width="332" height="72" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="384" text-anchor="middle" font-size="15">接收端核對輪次、接收者與 nonce</text><text x="180" y="409" text-anchor="middle" font-size="13">這些欄位也納入認證範圍</text><path d="M180 431v23" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="458" width="332" height="72" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="485" text-anchor="middle" font-size="15">通過才聚合；用過的 nonce 拒絕</text><text x="180" y="510" text-anchor="middle" font-size="13">重送合法訊息也可能有害</text></g><text x="180" y="565" text-anchor="middle" fill="#334155" font-size="12">教學示意；不代表已部署或驗證安全協議</text></svg>
