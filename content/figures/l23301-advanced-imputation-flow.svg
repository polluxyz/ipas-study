<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 575" role="img" aria-labelledby="title desc">
<title id="title">相似樣本與模型補值流程</title><desc id="desc">三種方法都只能從訓練資料建立規則，差別在取一筆供體、聚合鄰居或學得預測函數。</desc>
<rect width="360" height="575" fill="#f8fafc"/>
<g font-family="sans-serif" font-size="15" fill="#0f172a"><rect x="15" y="12" width="330" height="74" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="28" y="39">同一訓練集：只用已觀測欄位</text><text x="28" y="62">缺值列 → 找有觀測值的訓練供體</text><rect x="15" y="124" width="330" height="74" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="28" y="151">Hot Deck：挑一筆相似供體</text><text x="28" y="174">直接取供體的實際觀測值</text><rect x="15" y="236" width="330" height="74" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="28" y="263">KNN：找鄰近供體，再聚合</text><text x="28" y="286">數值欄可平均；尺度會影響誰最近</text><rect x="15" y="348" width="330" height="74" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="28" y="375">模型：其他欄位 → 缺值欄位</text><text x="28" y="398">訓練有值的列，預測缺值的列</text><rect x="15" y="460" width="330" height="74" rx="8" fill="#fef3c7" stroke="#64748b"/><text x="28" y="487">驗證列只接受轉換，不當供體</text><text x="28" y="510">補得合理，仍不等於找回真值</text></g></svg>