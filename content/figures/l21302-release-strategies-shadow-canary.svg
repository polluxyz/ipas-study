<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="title desc"><title id="title">新版輸出是否給使用者？</title><desc id="desc">影子輸出只到觀測紀錄，金絲雀輸出給少量使用者；影子不能直接量測新推薦真實點擊。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#416583"/></marker></defs><rect width="360" height="420" fill="#fff"/><g font-family="sans-serif"><text x="180" y="29" text-anchor="middle" font-size="18" fill="#152b40">新版輸出是否給使用者？</text><rect x="16" y="52" width="328" height="150" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="78" text-anchor="middle" font-size="16" fill="#152b40">影子：複製請求（補充）</text><text x="180" y="101" text-anchor="middle" font-size="16" fill="#152b40">使用者 → 舊版 → 舊結果</text><text x="180" y="124" text-anchor="middle" font-size="16" fill="#152b40">複製請求 → 新版 → 只存紀錄</text><text x="180" y="147" text-anchor="middle" font-size="16" fill="#152b40">使用者不看新版輸出</text><rect x="16" y="225" width="328" height="150" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="251" text-anchor="middle" font-size="16" fill="#152b40">金絲雀：真實分流（補充）</text><text x="180" y="274" text-anchor="middle" font-size="16" fill="#152b40">多數使用者 → 舊版 → 舊結果</text><text x="180" y="297" text-anchor="middle" font-size="16" fill="#152b40">少數使用者 → 新版 → 新結果</text><text x="180" y="320" text-anchor="middle" font-size="16" fill="#152b40">新版可取得真實曝光與點擊</text><text x="180" y="404" text-anchor="middle" font-size="13" fill="#152b40">教學示意｜非實際部署</text></g></svg>
