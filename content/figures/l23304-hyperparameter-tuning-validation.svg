<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img"><title>搜尋期間的訓練、驗證與測試界線</title><desc>240筆合成資料先保留48筆測試。192筆開發資料內做五摺交叉驗證，前處理只在訓練摺擬合，驗證分數選設定。固定設定後重訓192筆，最後才碰測試資料。</desc><rect width="360" height="520" fill="#fff"/><g font-family="sans-serif" font-size="15" fill="#182a3a" text-anchor="middle"><g stroke="#52677a" fill="#e8f2fa"><rect x="20" y="15" width="320" height="52" rx="8"/><rect x="20" y="100" width="320" height="85" rx="8"/><rect x="20" y="220" width="320" height="70" rx="8"/><rect x="20" y="324" width="320" height="65" rx="8"/></g><rect x="20" y="430" width="320" height="65" rx="8" fill="#fff2df" stroke="#945300" stroke-dasharray="6 4"/><text x="180" y="47">240 筆 → 開發 192 筆／測試 48 筆</text><text x="180" y="127">開發資料內固定五摺索引</text><text x="180" y="151">每輪：訓練 153／154 筆</text><text x="180" y="174">驗證 39／38 筆</text><text x="180" y="248">前處理與模型只擬合訓練摺</text><text x="180" y="273">五個驗證 AUC 平均 → 比較候選</text><text x="180" y="351">20 組 × 5 摺 → 100 次擬合</text><text x="180" y="376">固定設定 → 開發 192 筆重訓 1 次</text><text x="180" y="457">最後一次測試：48 筆</text><text x="180" y="482">結果不能回頭挑參數</text><path d="M180 67v33m-6-6 6 6 6-6M180 185v35m-6-6 6 6 6-6M180 290v34m-6-6 6 6 6-6M180 389v41m-6-6 6 6 6-6" fill="none" stroke="#52677a" stroke-width="2"/></g></svg>
