<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 285" role="img" aria-labelledby="title desc"><title id="title">長距離訊息的兩種路徑</title><desc id="desc">上排單向 RNN 經過三段相鄰傳遞；下排全自注意力可由位置一直接連到四。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#30445c"/></marker></defs><rect width="360" height="285" fill="#fff"/><g font-family="sans-serif" font-size="14" fill="#18334c"><text x="16" y="24" >長距離訊息的兩種路徑</text><text x="16" y="54" >RNN：狀態依時間往右傳</text><rect x="18" y="70" width="66" height="36" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="51" y="93" text-anchor="middle">位置 1</text><rect x="102" y="70" width="66" height="36" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="135" y="93" text-anchor="middle">位置 2</text><rect x="186" y="70" width="66" height="36" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="219" y="93" text-anchor="middle">位置 3</text><rect x="270" y="70" width="66" height="36" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="303" y="93" text-anchor="middle">位置 4</text><path d="M84 88 L102 88" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M168 88 L186 88" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M252 88 L270 88" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="16" y="150" >全自注意力：同層直接配對</text><rect x="18" y="167" width="66" height="36" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="51" y="190" text-anchor="middle">位置 1</text><rect x="102" y="167" width="66" height="36" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="135" y="190" text-anchor="middle">位置 2</text><rect x="186" y="167" width="66" height="36" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="219" y="190" text-anchor="middle">位置 3</text><rect x="270" y="167" width="66" height="36" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="303" y="190" text-anchor="middle">位置 4</text><path d="M51 209 L303 209" stroke="#30445c