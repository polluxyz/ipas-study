<svg xmlns="http://www.w3.org/2000/svg" width="360" height="600" viewBox="0 0 360 600" role="img" aria-labelledby="title desc"><title id="title">梯度尺度與更新順序</title><desc id="desc">先放大損失再反向，更新前還原梯度，然後裁剪及scaler.step；已呼叫unscale後scaler.step不再除尺度，最後更新縮放因子。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#475569"/></marker></defs><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#172554;font-size:14px}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}.alt{fill:#f0fdf4;stroke:#15803d;stroke-width:1.5}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:1.5}.line{fill:none;stroke:#475569;stroke-width:1.5;marker-end:url(#arrow)}</style><rect width="360" height="600" fill="white"/><rect x="30" y="12" width="300" height="64" rx="8" class="box"/><text x="180" y="36" text-anchor="middle">scale：放大損失</text><text x="180" y="57" text-anchor="middle">本次反向使用同一尺度</text><path d="M180 76L180 102" class="line"/><rect x="30" y="106" width="300" height="64" rx="8" class="box"/><text x="180" y="130" text-anchor="middle">backward：算放大梯度</text><text x="180" y="151" text-anchor="middle">不是更新權重</text><path d="M180 170L180 196" class="line"/><rect x="30" y="200" width="300" height="64" rx="8" class="alt"/><text x="180" y="224" text-anchor="middle">unscale：還原梯度</text><text x="180" y="245" text-anchor="middle">同個優化器本次只做一次</text><path d="M180 264L180 290" class="line"/><rect x="30" y="294" width="300" height="64" rx="8" class="alt"/><text x="180" y="318" text-anchor="middle">clip：原尺度裁剪</text><text x="180" y="339" text-anchor="middle">使用原本的梯度門檻</text><path d="M180 358L180 384" class="line"/><rect x="30" y="388" width="300" height="64" rx="8" class="box"/><text x="180" y="412" text-anchor="middle">scaler.step：檢查並更新</text><text x="180" y="433" text-anchor="middle">非有限梯度時可略過更新</text><path d="M180 452L180 478" class="line"/><rect x="30" y="482" width="300" height="64" rx="8" class="box"/><text x="180" y="506" text-anchor="middle">update：調整下次尺度</text><text x="180" y="527" text-anchor="middle">下一次再清零梯度</text><text x="180" y="590" text-anchor="middle" style="font-size:12px;fill:#475569">教學示意圖</text></svg>
