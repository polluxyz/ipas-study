<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 608" role="img" aria-labelledby="title desc"><title id="title">從模型回查來源</title><desc id="desc">模型成果回查來源實驗，再找到資料與設定；程式、切分、種子及內容指紋為補充的重現欄位。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#416583"/></marker></defs><rect width="360" height="608" fill="#fff"/><g font-family="sans-serif"><text x="180" y="29" text-anchor="middle" font-size="18" fill="#152b40">從模型回查來源</text><rect x="20" y="54" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="80" text-anchor="middle" font-size="16" fill="#152b40">模型成果 rec-v3</text><text x="180" y="103" text-anchor="middle" font-size="16" fill="#152b40">內容指紋（補充）</text><path d="M 180 126 L 180 150" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><rect x="20" y="152" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="178" text-anchor="middle" font-size="16" fill="#152b40">來源實驗 retail-run-2</text><text x="180" y="201" text-anchor="middle" font-size="16" fill="#152b40">訓練參數與驗證結果</text><path d="M 180 224 L 180 248" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><rect x="20" y="250" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="276" text-anchor="middle" font-size="16" fill="#152b40">資料版本 retail-d1</text><text x="180" y="299" text-anchor="middle" font-size="16" fill="#152b40">資料指紋（補充）</text><path d="M 180 322 L 180 346" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><rect x="20" y="348" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="374" text-anchor="middle" font-size="16" fill="#152b40">程式與環境（補充）</text><text x="180" y="397" text-anchor="middle" font-size="16" fill="#152b40">程式內容及環境描述</text><path d="M 180 420 L 180 444" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><rect x="20" y="446" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="472" text-anchor="middle" font-size="16" fill="#152b40">切分與種子（補充）</text><text x="180" y="495" text-anchor="middle" font-size="16" fill="#152b40">固定索引；種子 21302</text><text x="180" y="562" text-anchor="middle" font-size="14" fill="#152b40">箭頭表示回查，不表示重新訓練</text><text x="180" y="592" text-anchor="middle" font-size="13" fill="#152b40">教學示意｜非實際部署</text></g></svg>
