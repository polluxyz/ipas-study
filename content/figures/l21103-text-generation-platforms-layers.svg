<svg xmlns="http://www.w3.org/2000/svg" width="360" height="365" viewBox="0 0 360 365" role="img" aria-labelledby="title desc"><title id="title">模型與對話產品分層</title><desc id="desc">由使用者進入對話產品，產品再呼叫選定語言模型。模型與產品並非同一層。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#475569"/></marker></defs><rect width="360" height="365" rx="12" fill="#f8fafc"/><g font-family="sans-serif" font-size="15" fill="#172554"><text x="18" y="28" font-size="15">客服需求：整理來源並回覆</text><rect x="24" y="48" width="312" height="62" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="36" y="72" font-size="15">使用者：輸入問題與來源文件</text><path d="M180 110L180 131" stroke="#475569" fill="none" marker-end="url(#arrow)"/><rect x="24" y="136" width="312" height="73" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="36" y="160" font-size="15">產品／應用層：ChatGPT 或客服入口</text><text x="36" y="183" font-size="15">管理對話、呈現內容與工具調用</text><path d="M180 209L180 230" stroke="#475569" fill="none" marker-end="url(#arrow)"/><rect x="24" y="235" width="312" height="62" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="36" y="259" font-size="15">模型層：選定的 GPT 系列模型</text><text x="36" y="282" font-size="15">依上下文生成文字</text><text x="24" y="326" font-size="14">同一產品的功能與底層模型須分別查核</text><text x="24" y="349" font-size="13">示意圖；不表示固定版本或帳號能力</text></g></svg>
