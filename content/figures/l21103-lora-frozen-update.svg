<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" role="img" aria-labelledby="title desc"><title id="title">完整微調與 LoRA 更新位置</title><desc id="desc">完整微調直接更新 W。LoRA 輸入分兩路，凍結 W 的基底路與可學 A、B 的旁路，輸出相加，基底仍然存在。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#344861"/></marker></defs><rect width="360" height="640" fill="#fff"/><g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="180" y="28" text-anchor="middle" font-size="15" fill="#172b4d">完整微調：更新原權重</text><rect x="30" y="47" width="300" height="60" rx="9" fill="#fff3d6" stroke="#9b6413" stroke-width="2" /><text x="180" y="71" text-anchor="middle" font-size="15" fill="#172b4d">W：8×6，直接更新</text><text x="180" y="145" text-anchor="middle" font-size="15" fill="#172b4d">LoRA：基底與旁路相加</text><text x="180" y="179" text-anchor="middle" font-size="15" fill="#172b4d">輸入 x：6 維</text><path d="M180 192 L90 224" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M180 192 L270 224" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="15" y="228" width="150" height="68" rx="9" fill="#eaf1fa" stroke="#47678f" stroke-width="2" stroke-dasharray="5 3"/><text x="90" y="252" text-anchor="middle" font-size="15" fill="#172b4d">W：8×6</text><text x="90" y="274" text-anchor="middle" font-size="15" fill="#172b4d">凍結，不更新</text><rect x="195" y="228" width="150" height="68" rx="9" fill="#fff3d6" stroke="#9b6413" stroke-width="2" /><text x="270" y="252" text-anchor="middle" font-size="15" fill="#172b4d">A：2×6</text><text x="270" y="274" text-anchor="middle" font-size="15" fill="#172b4d">可學</text><path d="M270 296 L270 326" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="195" y="330" width="150" height="68" rx="9" fill="#fff3d6" stroke="#9b6413" stroke-width="2" /><text x="270" y="354" text-anchor="middle" font-size="15" fill="#172b4d">B：8×2</text><text x="270" y="376" text-anchor="middle" font-size="15" fill="#172b4d">可學</text><path d="M90 296 L90 435" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M270 398 L270 435" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M90 435 L160 470" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M270 435 L200 470" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="180" y="487" text-anchor="middle" font-size="15" fill="#172b4d">相加：Wx＋BAx</text><text x="180" y="520" text-anchor="middle" font-size="15" fill="#172b4d">輸出 y：8 維</text><text x="180" y="557" text-anchor="middle" font-size="14" fill="#172b4d">本例 alpha / rank＝1</text><text x="180" y="581" text-anchor="middle" font-size="14" fill="#172b4d">虛線＝凍結；實線暖色＝更新</text><text x="180" y="624" text-anchor="middle" font-size="13" fill="#172b4d">教學示意；非模型實測</text></g></svg>
