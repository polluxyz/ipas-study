<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="title desc"><title id="title">全域範數與逐值裁剪</title><desc id="desc">梯度由3,4全域縮成1.2,1.6，方向不變；逐值截到2,2會改方向。</desc><rect width="360" height="320" fill="#fff"/><style>path{fill:none}text{font-family:Arial,'Microsoft JhengHei',sans-serif;fill:#172033;font-size:13px} .muted{fill:#485366} .a{stroke:#175d9c;fill:none;stroke-width:2.5}.b{stroke:#ae4d13;fill:none;stroke-width:2.5;stroke-dasharray:6 4}</style><text x="18" y="22">教學向量：全域縮放與逐值截斷</text><path d="M45 250V50M45 250H310" stroke="#667085"/><text x="15" y="35">g₂</text><text x="314" y="265">g₁</text><text x="25" y="204">1</text><text x="91" y="267">1</text><text x="25" y="154">2</text><text x="141" y="267">2</text><text x="25" y="104">3</text><text x="191" y="267">3</text><text x="25" y="54">4</text><text x="241" y="267">4</text><path d="M45 250L195 50" class="a"/><path d="M45 250L105 170" stroke="#175d9c" stroke-width="6"/><path d="M45 250L145 150" class="b"/><circle cx="195" cy="50" r="4" fill="#175d9c"/><text x="202" y="50">原始 (3,4)</text><text x="158" y="155">逐值 (2,2)</text><text x="115" y="190">範數 (1.2,1.6)</text><text x="18" y="286">範數 5 → 2；兩軸同乘 0.4</text><text x="18" y="308">教學合成；兩軸均為梯度分量</text></svg>