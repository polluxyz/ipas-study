<svg xmlns="http://www.w3.org/2000/svg" width="360" height="568" viewBox="0 0 360 568" role="img" aria-labelledby="title desc">
<title id="title">生成與多模態查核生命週期</title><desc id="desc">四站依序是蒐集、訓練、發布、監控。每站保留證據，變更、申訴及事件會讓用途回到重新查核。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#10233f} .box{fill:#eff6ff;stroke:#1d4e89;stroke-width:1.6} .hold{fill:#fff7ed;stroke:#9a3412;stroke-width:1.6;stroke-dasharray:5 3} .line{fill:none;stroke:#334155;stroke-width:1.8;marker-end:url(#arrow)}</style>
<rect width="360" height="568" fill="#fff"/><rect class="box" x="30" y="20" width="300" height="68" rx="9"/><text x="180" y="47" text-anchor="middle" font-size="17" font-weight="700">蒐集</text><text x="180" y="71" text-anchor="middle" font-size="14">來源、用途、個資與模態流向</text><path class="line" d="M180 88V115"/><rect class="box" x="30" y="118" width="300" height="68" rx="9"/><text x="180" y="145" text-anchor="middle" font-size="17" font-weight="700">訓練與測試</text><text x="180" y="169" text-anchor="middle" font-size="14">版本、權限、群體影響與控制</text><path class="line" d="M180 186V213"/><rect class="box" x="30" y="216" width="300" height="68" rx="9"/><text x="180" y="243" text-anchor="middle" font-size="17" font-weight="700">發布</text><text x="180" y="267" text-anchor="middle" font-size="14">真偽、素材權利與核准範圍</text><path class="line" d="M180 284V311"/><rect class="box" x="30" y="314" width="300" height="68" rx="9"/><text x="180" y="341" text-anchor="middle" font-size="17" font-weight="700">監控</text><text x="180" y="365" text-anchor="middle" font-size="14">事件、申訴、人工接手與改善</text><path class="line" d="M180 382V409"/><rect class="hold" x="30" y="412" width="300" height="68" rx="9"/><text x="180" y="439" text-anchor="middle" font-size="17" font-weight="700">變更或重大事件：再審</text><text x="180" y="463" text-anchor="middle" font-size="14">資料、模型、用途及工具權限</text><path class="line" d="M180 480V508H346V54H332"/><text x="180" y="545" text-anchor="middle" font-size="14">教學示意；每站都有主責與證據</text></svg>