<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 474" role="img"><title>輸出與損失的格式約定</title><desc>單標籤多類有 logits 和機率兩種替代路徑，整數與獨熱標籤各選相符 API。</desc><rect width="360" height="474" fill="#fffdf7"/><g font-family="sans-serif" fill="#0f172a" font-size="16"><text x="180" y="30" text-anchor="middle" font-weight="700">輸出與損失的格式約定</text><rect x="12" y="66" width="336" height="62" rx="8" fill="#fef3c7" stroke="#334155"/><text x="180" y="90" text-anchor="middle">先定任務：三類單選</text><text x="180" y="111" text-anchor="middle">每筆只有一個正確類別</text><rect x="12" y="156" width="336" height="62" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="180" y="180" text-anchor="middle">logits：每筆三個分數</text><text x="180" y="201" text-anchor="middle">整數標籤 N 或獨熱 N×3</text><rect x="12" y="246" width="336" height="62" rx="8" fill="#fef3c7" stroke="#334155"/><text x="180" y="270" text-anchor="middle">路徑一：logits 直接算損失</text><text x="180" y="291" text-anchor="middle">PyTorch CE／Keras 設 True</text><rect x="12" y="336" width="336" height="62" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="180" y="360" text-anchor="middle">路徑二：先 Softmax 再算損失</text><text x="180" y="381" text-anchor="middle">Keras from_logits 設 False</text><text x="180" y="459" text-anchor="middle" font-size="12">路徑一與路徑二擇一，不連續做兩次轉換</text></g></svg>