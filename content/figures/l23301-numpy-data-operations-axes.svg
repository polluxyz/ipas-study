<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 303" role="img"><title>NumPy兩個軸的聚合方向</title><desc>兩列兩欄皆為攝氏溫度；axis=0消去列軸，axis=1消去欄軸。</desc><rect width="360" height="303" fill="#fff"/><g fill="#0f172a" font-family="sans-serif"><text x="16" y="24" font-size="15" >同單位溫度陣列：shape=(2, 2)</text><text x="112" y="53" font-size="13" >第0欄</text><text x="224" y="53" font-size="13" >第1欄</text><rect x="85" y="70" width="100" height="52" fill="#dbeafe" stroke="#2563eb"/><text x="135" y="103" font-size="18" text-anchor="middle">10</text><rect x="197" y="70" width="100" height="52" fill="#dbeafe" stroke="#2563eb"/><text x="247" y="103" font-size="18" text-anchor="middle">20</text><rect x="85" y="135" width="100" height="52" fill="#dbeafe" stroke="#2563eb"/><text x="135" y="168" font-size="18" text-anchor="middle">30</text><rect x="197" y="135" width="100" height="52" fill="#dbeafe" stroke="#2563eb"/><text x="247" y="168" font-size="18" text-anchor="middle">80</text><text x="16" y="102" font-size="13" >第0列</text><text x="16" y="167" font-size="13" >第1列</text><text x="16" y="224" font-size="13" >axis=0 沿列聚合 → [20, 50] °C</text><text x="16" y="252" font-size="13" >axis=1 沿欄聚合 → [15, 55] °C</text><text x="16" y="282" font-size="12" >看消去的軸，再讀留下來的結果位置。</text></g></svg>
