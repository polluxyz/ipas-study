<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" role="img" aria-labelledby="title desc"><title id="title">單點風險與備援切換</title><desc id="desc">同一節點失效會造成中斷；健康檢查先移除故障節點，入口再改送已就緒的獨立備援。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#31566b"/></marker></defs><rect width="360" height="610" fill="#ffffff"/><g fill="#16364b" font-family="sans-serif"><text x="180" y="27" text-anchor="middle" font-size="17">單點風險與備援切換</text><text x="180" y="66" text-anchor="middle" font-size="16">單節點：失效就沒有服務</text><rect x="24" y="83" width="116" height="52" rx="9" fill="#e8f2fa" stroke="#31566b"/><text x="82" y="106" text-anchor="middle" font-size="14">入口</text><path d="M143 109 H204" fill="none" stroke="#31566b" stroke-width="2" marker-end="url(#arrow)"/><rect x="210" y="83" width="126" height="52" rx="9" fill="#fff0eb" stroke="#31566b" stroke-dasharray="5 4"/><text x="273" y="106" text-anchor="middle" font-size="14">故障節點</text><text x="180" y="164" text-anchor="middle" font-size="14">多個容器共用主機仍有共同風險</text><text x="180" y="221" text-anchor="middle" font-size="16">冗餘：準備獨立的接手節點</text><rect x="82" y="239" width="196" height="64" rx="9" fill="#e8f2fa" stroke="#31566b"/><text x="180" y="262" text-anchor="middle" font-size="14">健康檢查偵測故障</text><text x="180" y="283" text-anchor="middle" font-size="14">移除異常目的地</text><path d="M180 303 V329" fill="none" stroke="#31566b" stroke-width="2" marker-end="url(#arrow)"/><rect x="112" y="334" width="136" height="48" rx="9" fill="#e8f2fa" stroke="#31566b"/><text x="180" y="357" text-anchor="middle" font-size="14">入口重新導流</text><path d="M180 382 V405 H90 V429" fill="none" stroke="#31566b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 4"/><path d="M180 405 H270 V429" fill="none" stroke="#31566b" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="433" width="144" height="64" rx="9" fill="#fff0eb" stroke="#31566b" stroke-dasharray="5 4"/><text x="90" y="456" text-anchor="middle" font-size="14">原節點：故障</text><text x="90" y="477" text-anchor="middle" font-size="14">不接新請求</text><rect x="198" y="433" width="144" height="64" rx="9" fill="#e8f2fa" stroke="#31566b"/><text x="270" y="456" text-anchor="middle" font-size="14">備援：已就緒</text><text x="270" y="477" text-anchor="middle" font-size="14">接手並觀察</text><text x="180" y="536" text-anchor="middle" font-size="14">也要檢查入口、資料層與備援容量</text><text x="180" y="562" text-anchor="middle" font-size="14">實線：接手；虛線：停止導流</text><text x="180" y="598" text-anchor="middle" font-size="12">教學合成示意；箭頭表示控制或請求方向</text></g></svg>