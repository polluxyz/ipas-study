<svg xmlns="http://www.w3.org/2000/svg" width="360" height="395" viewBox="0 0 360 395" role="img" aria-labelledby="title desc"><title id="title">集成：方法與具體模型</title><desc id="desc">集成模型包含Bagging系與Boosting系；投票是整合輸出的方式，不是同一層的具體模型名稱。</desc><rect width="360" height="395" fill="#fff"/><g fill="#16283a" font-family="sans-serif"><text x="180" y="27" font-size="17" text-anchor="middle">集成：方法與具體模型</text><rect x="100" y="48" width="160" height="38" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="72" font-size="15" text-anchor="middle">集成模型</text><path d="M180 86L90 118" stroke="#526577" stroke-width="2" fill="none"/><path d="M180 86L270 118" stroke="#526577" stroke-width="2" fill="none"/><rect x="15" y="118" width="150" height="38" rx="8" fill="#edf3fa" stroke="#526577"/><text x="90" y="142" font-size="15" text-anchor="middle">Bagging方法</text><rect x="195" y="118" width="150" height="38" rx="8" fill="#edf3fa" stroke="#526577"/><text x="270" y="142" font-size="15" text-anchor="middle">Boosting方法</text><path d="M90 156L90 189" stroke="#526577" stroke-width="2" fill="none"/><path d="M270 156L270 189" stroke="#526577" stroke-width="2" fill="none"/><rect x="15" y="189" width="150" height="42" rx="8" fill="#edf3fa" stroke="#526577"/><text x="90" y="215" font-size="15" text-anchor="middle">Random Forest</text><rect x="195" y="189" width="150" height="42" rx="8" fill="#edf3fa" stroke="#526577"/><text x="270" y="215" font-size="15" text-anchor="middle">GBDT</text><text x="270" y="262" font-size="13" text-anchor="middle">XGBoost／LightGBM</text><text x="270" y="283" font-size="13" text-anchor="middle">相關演算法與實作</text><rect x="35" y="312" width="290" height="42" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="338" font-size="15" text-anchor="middle">輸出整合：投票、機率、連續值</text><text x="180" y="382" font-size="12" text-anchor="middle">教學合成資料／流程示意</text></g></svg>
