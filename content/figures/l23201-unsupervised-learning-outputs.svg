<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" role="img" aria-labelledby="title desc">
  <title id="title">無標籤學習的三種輸出</title>
  <desc id="desc">同一份不含目標標籤的資料，依任務產生群編號、低維座標或潛在編碼；輸出的形式不同，皆需查核業務語意。</desc>
  <style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#172b4d;font-size:14px}.head{font-size:17px;font-weight:700}.box{fill:#f5f8fc;stroke:#91a6bf;stroke-width:1.3}.arrow{fill:none;stroke:#526e91;stroke-width:2}</style>
  <rect width="360" height="430" rx="12" fill="#fff"/>
  <text x="18" y="29" class="head">先選任務，再決定輸出形式</text>
  <rect x="20" y="46" width="320" height="57" rx="8" class="box"/>
  <text x="35" y="70">顧客：訂單次數、金額</text>
  <text x="35" y="92">設備：溫度、振動　　沒有目標答案</text>
  <path d="M180 104 V122 M175 116 L180 122 L185 116" class="arrow"/>
  <rect x="20" y="130" width="320" height="72" rx="8" class="box"/>
  <circle cx="41" cy="154" r="6" fill="#1463b5"/><rect x="35" y="175" width="12" height="12" fill="#a14700"/>
  <text x="59" y="155" class="head">分群 → 群編號</text>
  <text x="59" y="182">誰與誰同群；編號可以換名</text>
  <rect x="20" y="214" width="320" height="72" rx="8" class="box"/>
  <path d="M35 270 V235 M35 270 H52" class="arrow"/><circle cx="44" cy="250" r="4" fill="#1463b5"/>
  <text x="59" y="240" class="head">投影 → 低維座標</text>
  <text x="59" y="266">把原資料放入較少的座標軸</text>
  <rect x="20" y="298" width="320" height="72" rx="8" class="box"/>
  <rect x="34" y="318" width="6" height="23" fill="#1463b5"/><rect x="43" y="330" width="6" height="11" fill="#6b46a2"/>
  <text x="59" y="324" class="head">表示 → 潛在編碼</text>
  <text x="59" y="350">供重建、搜尋或後續模型使用</text>
  <text x="20" y="399">輸出結構 ≠ 已確認的客群或故障類型</text>
  <text x="20" y="420" font-size="12">教學示意；箭頭表示依需求選擇，非串接三步</text>
</svg>
