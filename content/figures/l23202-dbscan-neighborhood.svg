<svg xmlns="http://www.w3.org/2000/svg" width="360" height="315" viewBox="0 0 360 315" role="img"><title>核心、邊界與雜訊</title><desc>教學合成資料。第一段為一維等距座標，己在斷軸另一側；丁的半徑內含戊，戊不能繼續擴張。</desc><rect width="360" height="315" fill="#fff"/><g font-family="Microsoft JhengHei, sans-serif" font-size="12" fill="#182b3a"><text x="12" y="20" >半徑 0.31；MinPts＝4（含自身）</text><rect x="31.00" y="70" width="248.00" height="65" fill="#edf3f6"/><text x="48" y="55" >丁的鄰域：-0.01 到 0.61</text><circle cx="35.0" cy="110" r="6" fill="#156b92"/><text x="29.0" y="95" >甲</text><text x="30.0" y="135" >0.0</text><text x="20" y="175" >甲：鄰域 4 點；核心</text><circle cx="75.0" cy="110" r="6" fill="#156b92"/><text x="69.0" y="95" >乙</text><text x="70.0" y="135" >0.1</text><text x="20" y="197" >乙：鄰域 4 點；核心</text><circle cx="115.0" cy="110" r="6" fill="#156b92"/><text x="109.0" y="95" >丙</text><text x="110.0" y="135" >0.2</text><text x="20" y="219" >丙：鄰域 4 點；核心</text><circle cx="155.0" cy="110" r="6" fill="#156b92"/><text x="149.0" y="95" >丁</text><text x="150.0" y="135" >0.3</text><text x="20" y="241" >丁：鄰域 5 點；核心</text><circle cx="275.0" cy="110" r="6" fill="#b04d16"/><text x="269.0" y="95" >戊</text><text x="270.0" y="135" >0.6</text><text x="20" y="263" >戊：鄰域 2 點；邊界</text><circle cx="325" cy="110" r="6" fill="#555555"/><text x="319" y="95" >己</text><text x="320" y="135" >2.0</text><text x="20" y="285" >己：鄰域 1 點；雜訊</text><text x="190" y="151" >// 己為遠點，橫軸在此斷開</text></g></svg>