<svg xmlns="http://www.w3.org/2000/svg" width="360" height="815" viewBox="0 0 360 815" role="img" aria-labelledby="title desc"><title id="title">DPIA 處理前的判斷與文件流程</title><desc id="desc">補充示意：核對法規與高風險條件，評估必要性比例性、個人風險及措施，記錄殘餘影響。仍有無法降低的高風險時，依適用法律事前諮詢。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#475569"/></marker></defs><rect width="360" height="815" rx="12" fill="#f8fafc"/><g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" fill="#172554" text-anchor="middle"><text x="180" y="30" font-size="20" font-weight="700">補充｜處理前評估與決策</text><rect x="20" y="50" width="320" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="6 4"/><text x="180" y="77" font-size="17" font-weight="700">核對適用性及高風險條件</text><text x="180" y="102" font-size="15">記錄啟動或不啟動的依據</text><path d="M180 120V148" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="150" width="320" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="6 4"/><text x="180" y="177" font-size="17" font-weight="700">描述目的與資料流</text><text x="180" y="202" font-size="15">確認必要性、比例性與替代方式</text><path d="M180 220V248" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="250" width="320" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="6 4"/><text x="180" y="277" font-size="17" font-weight="700">個人權利風險與控制</text><text x="180" y="302" font-size="15">指定措施、責任及驗證證據</text><path d="M180 320V348" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="350" width="320" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="6 4"/><text x="180" y="377" font-size="17" font-weight="700">記錄殘餘影響並審查</text><text x="180" y="402" font-size="15">控制後仍有什麼個人風險？</text><path d="M180 420V448" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="450" width="320" height="70" rx="9" fill="#fff7ed" stroke="#64748b"/><text x="180" y="477" font-size="17" font-weight="700">仍有無法降低的高風險？</text><text x="180" y="502" font-size="15">依適用法律判斷後續程序</text><path d="M180 520V553" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="266" y="541.5" font-size="14">是</text><rect x="20" y="555" width="320" height="70" rx="9" fill="#fff7ed" stroke="#64748b"/><text x="180" y="582" font-size="17" font-weight="700">暫緩並依法事前諮詢</text><text x="180" y="607" font-size="15">內部簽核不能取代主管機關程序</text><rect x="20" y="665" width="320" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="6 4"/><text x="180" y="692" font-size="17" font-weight="700">無上述高風險｜記錄決策</text><text x="180" y="717" font-size="15">落實其他要求；變更時重評</text><path d="M340 485H350V700H342" fill="none" stroke="#475569" marker-end="url(#arrow)"/><text x="320" y="643" font-size="14">否</text><text x="180" y="780" font-size="14">教學示意；完成評估不自動取得合法依據</text></g></svg>
