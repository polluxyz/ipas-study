<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 650" width="360" height="650" role="img" aria-labelledby="title desc"><title id="title">Scrum活動與產物時序</title><desc id="desc">短衝包住規劃、每日站會、開發、展示及回顧；第一輪原型回饋接到第二輪。</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#475569"/></marker></defs><style>text{font-family:'Microsoft JhengHei',sans-serif;font-size:13px;fill:#172033} .small{font-size:12px}.head{font-size:16px;font-weight:700}.muted{fill:#475569} .box{fill:#f8fafc;stroke:#64748b;stroke-width:1.2} .link{fill:none;stroke:#475569;stroke-width:1.3;marker-end:url(#arrow)}</style><rect width="360" height="650" fill="#fff"/><text x="12" y="26" class="head">Scrum：短衝內檢視與調整</text><text x="12" y="49" class="">客服與維護共用節奏；教學示意</text><rect class="box" x="12" y="65" width="336" height="52" rx="5"/><text x="25" y="87" class="">產品待辦：需求、價值排序與回饋</text><text x="25" y="106" class="small">產品負責人維護；不等於本輪全部承諾</text><rect x="8" y="139" width="344" height="365" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-dasharray="5 3"/><text x="20" y="162" class="head">第一輪短衝：11/02–11/13</text><rect class="box" x="22" y="177" width="316" height="57" rx="5"/><text x="32" y="200" class="">短衝規劃</text><text x="32" y="221" class="small">目標：可查詢或告警的內部原型</text><path class="link" d="M180 234V254"/><rect class="box" x="22" y="254" width="316" height="57" rx="5"/><text x="32" y="277" class="">開發＋每日站會</text><text x="32" y="298" class="small">A至E；檢視進展與阻礙，調整計畫</text><path class="link" d="M180 311V331"/><rect class="box" x="22" y="331" width="316" height="57" rx="5"/><text x="32" y="354" class="">展示成果</text><text x="32" y="375" class="small">原型v1 → 使用者回饋：補例外說明</text><path class="link" d="M180 388V408"/><rect class="box" x="22" y="408" width="316" height="57" rx="5"/><text x="32" y="431" class="">回顧檢討</text><text x="32" y="452" class="small">權限等待 → 下輪提早申請</text><path class="link" d="M180 117V139"/><path class="link" d="M180 504V531"/><rect class="box" x="12" y="533" width="336" height="70" rx="5"/><text x="24" y="556" class="">第二輪：11/16–11/27</text><text x="24" y="577" class="small">F試用決議＋依回饋新增的原型更新</text><text x="24" y="594" class="small">新工作另估；短衝時間框維持固定</text><text x="12" y="630" class="small">產品回饋回到待辦；流程改善進下輪規劃。</text><path class="link" d="M22 359H3V91H12"/><path class="link" d="M338 436H356V568H348" stroke-dasharray="5 3"/></svg>
