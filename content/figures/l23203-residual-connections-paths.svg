<svg xmlns="http://www.w3.org/2000/svg" width="360" height="695" viewBox="0 0 360 695" role="img" aria-labelledby="title desc"><title id="title">普通堆疊與殘差路徑</title><desc id="desc">殘差區塊另有恆等捷徑回到加號。主分支及捷徑形狀一致才逐項相加；虛線呈現反向梯度捷徑。 教學合成資料，數值由 L23203-E-tensors.json 重建。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#334155"/></marker></defs><rect width="360" height="695" fill="#ffffff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#0f172a"><text x="18" y="29" font-size="17" font-weight="700">普通堆疊與殘差路徑</text><text x="18" y="57" font-size="15" font-weight="700">普通堆疊：只有主分支</text><rect x="40" y="75" width="280" height="44" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="52" y="98" font-size="15" font-weight="700">輸入 X</text><path d="M180,119 L180,140" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="140" width="280" height="30" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="52" y="163" font-size="15" font-weight="700">第一層 F₁</text><path d="M180,170 L180,183" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="183" width="280" height="30" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="52" y="206" font-size="15" font-weight="700">第二層 F₂</text><path d="M180,213 L180,226" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="226" width="280" height="30" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="52" y="249" font-size="15" font-weight="700">輸出 F₂(F₁(X))</text><text x="18" y="290" font-size="15" font-weight="700">殘差區塊：主分支＋恆等捷徑</text><rect x="40" y="309" width="280" height="52" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="52" y="332" font-size="15" font-weight="700">輸入 X</text><text x="52" y="354" font-size="14">左上通道 (1, 4)</text><path d="M180,361 L180,400" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="400" width="220" height="52" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="112" y="423" font-size="15" font-weight="700">主分支 F(X)</text><text x="112" y="445" font-size="14">左上 (0.5, 2)</text><path d="M70,361 L45,361 L45,510 L162,510" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="50" y="386" font-size="14" font-weight="700">捷徑 X</text><path d="M180,452 L180,492" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><circle cx="180" cy="510" r="17" fill="#fef3c7" stroke="#475569"/><text x="174" y="516" font-size="22" font-weight="700">+</text><path d="M164,518 L20,518 L20,335 L40,335" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><path d="M180,528 L180,550" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="550" width="280" height="52" rx="9" fill="#fef3c7" stroke="#475569"/><text x="52" y="573" font-size="15" font-weight="700">相加結果 Y</text><text x="52" y="595" font-size="14">左上 (1.5, 6)，仍為兩通道</text><text x="18" y="628" font-size="13">數字為補充算例；圖只畫到加號出口</text><text x="18" y="654" font-size="13">虛線：梯度沿捷徑回到輸入</text><text x="18" y="680" font-size="12">教學示意／合成資料；非成效評估</text></g></svg>
