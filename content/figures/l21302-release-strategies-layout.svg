<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img" aria-labelledby="title desc"><title id="title">新舊版本怎麼交接</title><desc id="desc">三個獨立策略示意：藍綠切換環境，金絲雀分真實流量，滾動逐批替換副本。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#416583"/></marker></defs><rect width="360" height="520" fill="#fff"/><g font-family="sans-serif"><text x="180" y="29" text-anchor="middle" font-size="18" fill="#152b40">新舊版本怎麼交接</text><rect x="16" y="55" width="328" height="126" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="81" text-anchor="middle" font-size="16" fill="#152b40">藍綠：兩套環境</text><text x="180" y="104" text-anchor="middle" font-size="16" fill="#152b40">舊版環境 → 切換 → 新版環境</text><text x="180" y="127" text-anchor="middle" font-size="16" fill="#152b40">切換前先驗證新版</text><rect x="16" y="201" width="328" height="126" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="227" text-anchor="middle" font-size="16" fill="#152b40">金絲雀：先少量真實流量</text><text x="180" y="250" text-anchor="middle" font-size="16" fill="#152b40">舊版多數流量／新版少量流量</text><text x="180" y="273" text-anchor="middle" font-size="16" fill="#152b40">觀察後再決定是否擴張</text><rect x="16" y="347" width="328" height="126" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="373" text-anchor="middle" font-size="16" fill="#152b40">滾動：逐批替換副本</text><text x="180" y="396" text-anchor="middle" font-size="16" fill="#152b40">舊舊舊 → 新舊舊 → 新新新</text><text x="180" y="419" text-anchor="middle" font-size="16" fill="#152b40">過渡期間新舊並存</text><text x="180" y="504" text-anchor="middle" font-size="13" fill="#152b40">教學示意｜非實際部署</text></g></svg>
