<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 442" role="img" aria-labelledby="title desc"><title id="title">共享編碼器和雙任務頭</title><desc id="desc">同一契約經共享編碼器後分為句級分類和逐詞實體標註，兩項損失共同更新共享參數。 教學示意圖。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#425c74"/></marker></defs><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#172b40;font-size:14px} .small{font-size:12px}.box{fill:#edf5fc;stroke:#356b98;stroke-width:1.5}.alt{fill:#fff3da;stroke:#946715;stroke-width:1.5}.line{fill:none;stroke:#425c74;stroke-width:1.5;marker-end:url(#arrow)}</style><rect width="360" height="442" rx="10" fill="#fff"/><text x="180" y="25" text-anchor="middle" class="">法律文本：兩個目標共享表示</text><rect x="50" y="46" width="260" height="38" rx="7" class="box"/><text x="180" y="70" text-anchor="middle" class="">契約詞元＋有效位置遮罩</text><path class="line" d="M180 84L180 103"/><rect x="50" y="108" width="260" height="40" rx="7" class="box"/><text x="180" y="133" text-anchor="middle" class="">共享文本編碼器</text><path class="line" d="M125 148L90 180"/><path class="line" d="M235 148L270 180"/><rect x="15" y="185" width="150" height="42" rx="7" class="box"/><text x="90" y="211" text-anchor="middle" class="">句級分類頭</text><rect x="195" y="185" width="150" height="42" rx="7" class="alt"/><text x="270" y="211" text-anchor="middle" class="">逐詞 NER 頭</text><path class="line" d="M90 227L90 249"/><path class="line" d="M270 227L270 249"/><rect x="15" y="254" width="150" height="42" rx="7" class="box"/><text x="90" y="280" text-anchor="middle" class="">分類損失</text><rect x="195" y="254" width="150" height="42" rx="7" class="alt"/><text x="270" y="280" text-anchor="middle" class="">標註損失</text><path class="line" d="M90 296L147 326"/><path class="line" d="M270 296L213 326"/><rect x="50" y="332" width="260" height="40" rx="7" class="box"/><text x="180" y="357" text-anchor="middle" class="">加權總損失 → 反向傳播</text><text x="180" y="402" text-anchor="middle" class="small">兩項梯度都回到共享編碼器</text><text x="180" y="433" text-anchor="middle" class="small">教學合成資料／示意圖</text></svg>
