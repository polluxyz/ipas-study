<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 650" role="img" aria-labelledby="title desc"><title id="title">代理元件與多模態入口</title><desc id="desc">文字、圖片與語音經感知形成任務條件。指令與模型利用檢索及記憶選擇工具，回傳經觀察查核才形成回覆。權限閘門會限制工具操作。 圖資為教學示意。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#355d82"/></marker></defs><style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#16304a;font-size:16px} .small{font-size:14px} .box{fill:#eef5fc;stroke:#355d82;stroke-width:1.5} .gate{fill:#fff4d6;stroke:#8d640a;stroke-width:1.5} .end{fill:#eaf5ee;stroke:#32744b;stroke-width:1.5} .human{fill:#fceee9;stroke:#9a4c32;stroke-width:1.5} .arrow{fill:none;stroke:#355d82;stroke-width:2;marker-end:url(#arrow)}</style><rect width="360" height="650" fill="#fff"/><rect x="55" y="15" width="250" height="54" rx="9" class="box"/><text x="180" y="47" text-anchor="middle">文字、圖片、語音</text><path d="M180 69 V91" class="arrow"/><rect x="55" y="93" width="250" height="54" rx="9" class="box"/><text x="180" y="125" text-anchor="middle">感知：辨識對象與日期</text><path d="M180 147 V169" class="arrow"/><rect x="55" y="171" width="250" height="54" rx="9" class="box"/><text x="180" y="203" text-anchor="middle">指令與模型：選擇下一步</text><path d="M180 225 V247" class="arrow"/><rect x="15" y="249" width="155" height="65" rx="9" class="box"/><text x="92.5" y="275.5" text-anchor="middle">檢索：任務資料</text><text x="92.5" y="297.5" text-anchor="middle">來源仍須查核</text><rect x="190" y="249" width="155" height="65" rx="9" class="box"/><text x="267.5" y="275.5" text-anchor="middle">記憶：條件與偏好</text><text x="267.5" y="297.5" text-anchor="middle">舊值不等於新事實</text><path d="M92 314 V338 H180 V354" class="arrow"/><path d="M268 314 V338 H180" class="arrow"/><rect x="55" y="356" width="250" height="54" rx="9" class="gate"/><text x="180" y="388" text-anchor="middle">權限閘門：只執行允許操作</text><path d="M180 410 V432" class="arrow"/><rect x="55" y="434" width="250" height="54" rx="9" class="box"/><text x="180" y="466" text-anchor="middle">工具執行 → 實際回傳</text><path d="M180 488 V510" class="arrow"/><rect x="55" y="512" width="250" height="54" rx="9" class="gate"/><text x="180" y="544" text-anchor="middle">觀察：核對來源、日期與值</text><path d="M180 566 V588" class="arrow"/><rect x="55" y="590" width="250" height="44" rx="9" class="end"/><text x="180" y="617" text-anchor="middle">回覆結果或交人工</text></svg>
