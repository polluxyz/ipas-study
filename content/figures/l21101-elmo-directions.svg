<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430" role="img" aria-labelledby="title desc"><title id="title">ELMo 雙向資訊</title><desc id="desc">The bank approved my loan 的正反向序列在 bank 位置對齊，合併狀態後交給任務。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs><rect width="360" height="430" fill="#ffffff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#172b4d"><text x="180" y="29" font-size="16" text-anchor="middle">同一個 bank 位置，對齊兩方向</text><text x="180" y="64" font-size="16" text-anchor="middle">正向：從 The 走到 bank</text><rect x="5" y="86" width="65" height="36" rx="8" fill="#eef4ff" stroke="#536683"/><text x="37.5" y="110" font-size="14" text-anchor="middle">The</text><rect x="76" y="86" width="65" height="36" rx="8" fill="#e4f5eb" stroke="#536683"/><text x="108.5" y="110" font-size="14" text-anchor="middle">bank</text><rect x="147" y="86" width="65" height="36" rx="8" fill="#eeeeee" stroke="#536683"/><text x="179.5" y="110" font-size="13" text-anchor="middle">approved</text><rect x="218" y="86" width="65" height="36" rx="8" fill="#eeeeee" stroke="#536683"/><text x="250.5" y="110" font-size="14" text-anchor="middle">my</text><rect x="289" y="86" width="65" height="36" rx="8" fill="#eeeeee" stroke="#536683"/><text x="321.5" y="110" font-size="14" text-anchor="middle">loan</text><path d="M71 104 L75 104" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="5" y="206" width="65" height="36" rx="8" fill="#eeeeee" stroke="#536683"/><text x="37.5" y="230" font-size="14" text-anchor="middle">The</text><rect x="76" y="206" width="65" height="36" rx="8" fill="#e4f5eb" stroke="#536683"/><text x="108.5" y="230" font-size="14" text-anchor="middle">bank</text><rect x="147" y="206" width="65" height="36" rx="8" fill="#eef4ff" stroke="#536683"/><text x="179.5" y="230" font-size="13" text-anchor="middle">approved</text><rect x="218" y="206" width="65" height="36" rx="8" fill="#eef4ff" stroke="#536683"/><text x="250.5" y="230" font-size="14" text-anchor="middle">my</text><rect x="289" y="206" width="65" height="36" rx="8" fill="#eef4ff" stroke="#536683"/><text x="321.5" y="230" font-size="14" text-anchor="middle">loan</text><path d="M146 224 L142 224" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M217 224 L213 224" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M288 224 L284 224" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="180" y="167" font-size="16" text-anchor="middle">反向：從 loan 經中間詞走到 bank</text><path d="M108 123 L108 140 L2 140 L2 315 L25 315" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M108 243 L108 267 L180 267 L180 287" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="27" y="290" width="306" height="50" rx="8" fill="#e4f5eb" stroke="#536683"/><text x="180" y="321" font-size="16" text-anchor="middle">同位置串接 → 多層混合</text><path d="M180 343 L180 366" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="55" y="377" width="250" height="36" rx="8" fill="#eef4ff" stroke="#536683"/><text x="180" y="401" font-size="16" text-anchor="middle">交給標註或分類任務</text></g></svg>
