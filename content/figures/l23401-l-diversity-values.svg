<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 575" role="img" aria-labelledby="title desc"><title id="title">三種版本的敏感值種類</title><desc id="desc">每版每群都四人，從同質到兩種值再到三種值；種類數不代表比例平均。</desc><rect width="360" height="575" fill="#fff"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" fill="#172554"><text x="14" y="25" font-size="17" >群大小不變，敏感值版本切換</text><text x="14" y="48" font-size="12" >甲／乙／丙是類別標籤，沒有大小順序</text><rect x="12" y="65" width="336" height="143" rx="6" fill="#eef2ff" /><text x="24" y="89" font-size="16" >同質版：最小種類數 1</text><text x="25" y="118" font-size="13" >第1群</text><rect x="87" y="100" width="42" height="24" rx="6" fill="#0369a1" /><text x="108" y="118" font-size="14" fill="white" text-anchor="middle">甲</text><rect x="136" y="100" width="42" height="24" rx="6" fill="#0369a1" /><text x="157" y="118" font-size="14" fill="white" text-anchor="middle">甲</text><rect x="185" y="100" width="42" height="24" rx="6" fill="#0369a1" /><text x="206" y="118" font-size="14" fill="white" text-anchor="middle">甲</text><rect x="234" y="100" width="42" height="24" rx="6" fill="#0369a1" /><text x="255" y="118" font-size="14" fill="white" text-anchor="middle">甲</text><text x="292" y="118" font-size="12" >1 種</text><text x="25" y="147" font-size="13" >第2群</text><rect x="87" y="129" width="42" height="24" rx="6" fill="#a16207" /><text x="108" y="147" font-size="14" fill="white" text-anchor="middle">乙</text><rect x="136" y="129" width="42" height="24" rx="6" fill="#a16207" /><text x="157" y="147" font-size="14" fill="white" text-anchor="middle">乙</text><rect x="185" y="129" width="42" height="24" rx="6" fill="#a16207" /><text x="206" y="147" font-size="14" fill="white" text-anchor="middle">乙</text><rect x="234" y="129" width="42" height="24" rx="6" fill="#a16207" /><text x="255" y="147" font-size="14" fill="white" text-anchor="middle">乙</text><text x="292" y="147" font-size="12" >1 種</text><text x="25" y="176" font-size="13" >第3群</text><rect x="87" y="158" width="42