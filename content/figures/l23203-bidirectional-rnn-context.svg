<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" role="img" aria-labelledby="title desc"><title id="title">雙向 RNN 的位置與截止點</title><desc id="desc">在位置二，正向狀態看過位置一到二，反向狀態看過位置四到二；第四點收齊後可使用整個歷史視窗，但第二點即時決策不可看第三與第四點。</desc><style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#172b4d;font-size:15px} .head{font-size:18px;font-weight:700}.small{font-size:13px}.box{fill:#e8f2ff;stroke:#245b9e;stroke-width:1.5}.memory{fill:#e6f6ec;stroke:#246d42;stroke-width:1.5}.gate{fill:#fff2cf;stroke:#8f6413;stroke-width:1.5}.line{fill:none;stroke:#245b9e;stroke-width:1.8;marker-end:url(#arrow)}.back{fill:none;stroke:#9c3b32;stroke-width:1.8;stroke-dasharray:5 3;marker-end:url(#red)}.mute{fill:#fff;stroke:#687782;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245b9e"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9c3b32"/></marker></defs><rect width="360" height="440" fill="#fff" rx="10"/><text x="180" y="28" text-anchor="middle" class="head">同一視窗，兩種讀取方向</text><text x="48" y="63" text-anchor="middle" class="">位置 1</text><rect x="21" y="175" width="54" height="36" rx="8" class="box"/><text x="48" y="198" text-anchor="middle" class="">x1</text><path d="M48 175L48 124" class="line"/><path d="M48 211L48 250" class="line"/><rect x="21" y="85" width="54" height="36" rx="8" class="box"/><text x="48" y="108" text-anchor="middle" class="">正1</text><rect x="21" y="255" width="54" height="36" rx="8" class="memory"/><text x="48" y="278" text-anchor="middle" class="">反1</text><text x="136" y="63" text-anchor="middle" class="">位置 2</text><rect x="109" y="175" width="54" height="36" rx="8" class="box"/><text x="136" y="198" text-anchor="middle" class="">x2</text><path d="M136 175L136 124" class="line"/><path d="M136 211L136 250" class="line"/><rect x="109" y="85" width="54" height="36" rx="8" class="box"/><text x="136" y="108" text-anchor="middle" class="">正2</text><rect x="109" y="255" width="54" height="36" rx="8" class="memory"/><text x="136" y="278" text-anchor="middle" class="">反2</text><text x="224" y="63" text-anchor="middle" class="">位置 3</text><rect x="197" y="175" width="54" height="36" rx="8" class="box"/><text x="224" y="198" text-anchor="middle" class="">x3</text><path d="M224 175L224 124" class="line"/><path d="M224 211L224 250" class="line"/><rect x="197" y="85" width="54" height="36" rx="8" class="box"/><text x="224" y="108" text-anchor="middle" class="">正3</text><rect x="197" y="255" width="54" height="36" rx="8" class="memory"/><text x="224" y="278" text-anchor="middle" class="">反3</text><text x="312" y="63" text-anchor="middle" class="">位置 4</text><rect x="285" y="175" width="54" height="36" rx="8" class="box"/><text x="312" y="198" text-anchor="middle" class="">x4</text><path d="M312 175L312 124" class="line"/><path d="M312 211L312 250" class="line"/><rect x="285" y="85" width="54" height="36" rx="8" class="box"/><text x="312" y="108" text-anchor="middle" class="">正4</text><rect x="285" y="255" width="54" height="36" rx="8" class="memory"/><text x="312" y="278" text-anchor="middle" class="">反4</text><path d="M75 103L108 103" class="line"/><path d="M108 273L75 273" class="back"/><path d="M163 103L196 103" class="line"/><path d="M196 273L163 273" class="back"/><path d="M251 103L284 103" class="line"/><path d="M284 273L251 273" class="back"/><text x="180" y="153" text-anchor="middle" class="">正向 →</text><text x="180" y="319" text-anchor="middle" class="">← 反向</text><rect x="21" y="340" width="318" height="36" rx="8" class="gate"/><text x="180" y="363" text-anchor="middle" class="">第 2 點即時決策：只能用位置 1、2</text><rect x="21" y="391" width="318" height="36" rx="8" class="memory"/><text x="180" y="414" text-anchor="middle" class="">第 4 點收齊後：可用整個視窗</text></svg>
