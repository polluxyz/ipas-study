<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 510" role="img" aria-labelledby="title desc"><title id="title">金融委外及跨境資料流</title><desc id="desc">教學示意。FIN-1由臺灣銀行傳到甲公司，FIN-2回交銀行驗收，FIN-3往日本複委託商備份。委託方核對用途，受託方執行，跨境缺保障先停。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="360" height="510" rx="12" fill="#f8fafc"/><g font-family="system-ui, 'Microsoft JhengHei', sans-serif" fill="#0f172a"><text x="180" y="30" text-anchor="middle" font-size="17" font-weight="700">教學合成資料｜金融三流</text><rect x="16" y="50" width="272" height="78" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="152" y="79" font-size="18" font-weight="700" text-anchor="middle">臺灣銀行｜委託方</text><text x="152" y="107" font-size="16" text-anchor="middle">核對用途與契約保障</text><path d="M152 130V178" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="165" y="159" font-size="16">FIN-1 交付資料</text><rect x="16" y="190" width="272" height="78" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="152" y="219" font-size="18" font-weight="700" text-anchor="middle">臺灣甲公司｜受託方</text><text x="152" y="247" font-size="16" text-anchor="middle">限約定用途處理</text><path d="M152 270V318" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="165" y="299" font-size="16">FIN-3 海外備份</text><rect x="16" y="330" width="272" height="78" rx="9" fill="#fef3c7" stroke="#475569"/><text x="152" y="359" font-size="18" font-weight="700" text-anchor="middle">日本複委託商</text><text x="152" y="387" font-size="16" text-anchor="middle">保障條款待補，先停此流</text><path d="M288 229H309V90H290" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="333" y="160" text-anchor="middle" transform="rotate(-90 333 160)" font-size="16">FIN-2 回交驗收</text><text x="180" y="445" text-anchor="middle" font-size="16">法遵核對適用法規與實際流向</text><text x="180" y="473" text-anchor="middle" font-size="16">證據齊備仍不等於已獲許可</text></g></svg>
