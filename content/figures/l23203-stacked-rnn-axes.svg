<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">RNN 時間軸與堆疊層軸</title><desc id="desc">第二層每個位置接收同一步第一層狀態與同層前一步狀態，時間展開不同於增加層數。</desc><style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#172b4d;font-size:15px} .head{font-size:18px;font-weight:700}.small{font-size:13px}.box{fill:#e8f2ff;stroke:#245b9e;stroke-width:1.5}.memory{fill:#e6f6ec;stroke:#246d42;stroke-width:1.5}.gate{fill:#fff2cf;stroke:#8f6413;stroke-width:1.5}.line{fill:none;stroke:#245b9e;stroke-width:1.8;marker-end:url(#arrow)}.back{fill:none;stroke:#9c3b32;stroke-width:1.8;stroke-dasharray:5 3;marker-end:url(#red)}.mute{fill:#fff;stroke:#687782;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245b9e"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9c3b32"/></marker></defs><rect width="360" height="350" fill="#fff" rx="10"/><text x="180" y="28" text-anchor="middle" class="head">橫向是時間，向上是層數</text><text x="94" y="63" text-anchor="middle" class="">時間 1</text><rect x="70" y="85" width="50" height="40" rx="8" class="memory"/><text x="95" y="110" text-anchor="middle" class="">上1</text><rect x="70" y="180" width="50" height="40" rx="8" class="box"/><text x="95" y="205" text-anchor="middle" class="">下1</text><text x="95" y="284" text-anchor="middle" class="">x1</text><path d="M95 263L95 224" class="line"/><path d="M95 176L95 129" class="line"/><text x="196" y="63" text-anchor="middle" class="">時間 2</text><rect x="172" y="85" width="50" height="40" rx="8" class="memory"/><text x="197" y="110" text-anchor="middle" class="">上2</text><rect x="172" y="180" width="50" height="40" rx="8" class="box"/><text x="197" y="205" text-anchor="middle" class="">下2</text><text x="197" y="284" text-anchor="middle" class="">x2</text><path d="M197 263L197 224" class="line"/><path d="M197 176L197 129" class="line"/><text x="298" y="63" text-anchor="middle" class="">時間 3</text><rect x="274" y="85" width="50" height="40" rx="8" class="memory"/><text x="299" y="110" text-anchor="middle" class="">上3</text><rect x="274" y="180" width="50" height="40" rx="8" class="box"/><text x="299" y="205" text-anchor="middle" class="">下3</text><text x="299" y="284" text-anchor="middle" class="">x3</text><path d="M299 263L299 224" class="line"/><path d="M299 176L299 129" class="line"/><path d="M120 105L168 105" class="line"/><path d="M120 200L168 200" class="line"/><path d="M222 105L270 105" class="line"/><path d="M222 200L270 200" class="line"/><text x="32" y="109" text-anchor="middle" class="small">第2層</text><text x="32" y="204" text-anchor="middle" class="small">第1層</text><text x="180" y="323" text-anchor="middle" class="small">各層參數不同；同層各時間步共享</text></svg>
