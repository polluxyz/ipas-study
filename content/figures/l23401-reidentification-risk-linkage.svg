<svg xmlns="http://www.w3.org/2000/svg" width="360" height="545" viewBox="0 0 360 545" role="img" aria-labelledby="title desc"><title id="title">年齡與地區的外部連結風險</title><desc id="desc">去掉姓名後，研究表中的年齡與地區仍可與外部假人表連結。唯一候選是警訊，不唯一仍可能推知敏感值。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#475569"/></marker></defs><rect width="360" height="545" rx="12" fill="#f8fafc"/><g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" fill="#172554" text-anchor="middle"><text x="180" y="30" font-size="20" font-weight="700">沒有姓名仍有連結路徑</text><rect x="20" y="55" width="320" height="70" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="82" font-size="17" font-weight="700">研究表｜假識別碼與診斷</text><text x="180" y="107" font-size="15">仍保留年齡、地區</text><path d="M180 125V168" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="266" y="151.5" font-size="14">相同欄位</text><rect x="20" y="170" width="320" height="70" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="197" font-size="17" font-weight="700">外部假人表｜假人與線索</text><text x="180" y="222" font-size="15">年齡、地區作為連結條件</text><path d="M180 240V283" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="285" width="320" height="70" rx="9" fill="#fff7ed" stroke="#64748b"/><text x="180" y="312" font-size="17" font-weight="700">交叉比對｜找出候選</text><text x="180" y="337" font-size="15">唯一候選：可能把診斷連回個人</text><path d="M180 355V398" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="400" width="320" height="70" rx="9" fill="#fff7ed" stroke="#64748b"/><text x="180" y="427" font-size="17" font-weight="700">不唯一仍須檢查敏感內容</text><text x="180" y="452" font-size="15">候選診斷相同，仍可能被推知</text><text x="180" y="515" font-size="14">教學合成資料；此圖不作匿名保證</text></g></svg>
