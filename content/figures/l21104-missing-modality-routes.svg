<svg xmlns="http://www.w3.org/2000/svg" width="360" height="708" viewBox="0 0 360 708" role="img" aria-labelledby="title desc"><title id="title">缺失模態的訓練與回退示意</title><desc id="desc">補充示意。訓練階段模擬缺失並輸入遮罩，推論保留真實可用標記；只有核可組合自動處理，其餘交人工，生成的資料不算現場真值。</desc><style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#172033;font-size:16px} .head{font-size:19px;font-weight:700} .small{font-size:14px} .box{fill:#edf5ff;stroke:#264e7a;stroke-width:1.5} .green{fill:#e8f4ee;stroke:#286247;stroke-width:1.5} .orange{fill:#fff2df;stroke:#875d20;stroke-width:1.5} .line{fill:none;stroke:#334e68;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334e68"/></marker></defs><rect width="360" height="708" rx="12" fill="#ffffff"/><text x="180" y="28" text-anchor="middle" class="head">缺失標記跟著資料走（補充）</text><rect x="18" y="50" width="324" height="62" rx="9" class="box"/><text x="180.0" y="86.0" text-anchor="middle" class="">訓練：完整來源＋人工真值</text><path d="M180,112 L180,132" class="line"/><rect x="18" y="136" width="324" height="66" rx="9" class="box"/><text x="180.0" y="163.0" text-anchor="middle" class="">模態遮罩：模擬整路缺失</text><text x="180.0" y="185.0" text-anchor="middle" class="">例如 111 → 101，保留原標籤</text><path d="M180,202 L180,222" class="line"/><rect x="18" y="226" width="324" height="62" rx="9" class="box"/><text x="180.0" y="262.0" text-anchor="middle" class="">可用分支＋遮罩 → 訓練與驗證</text><text x="180" y="322" text-anchor="middle" class="head">推論：檢查真實來源與時效</text><rect x="18" y="342" width="324" height="62" rx="9" class="box"/><text x="180.0" y="378.0" text-anchor="middle" class="">遮罩順序：影像／文字／感測</text><path d="M180,404 L180,424" class="line"/><rect x="18" y="428" width="324" height="62" rx="9" class="box"/><text x="180.0" y="464.0" text-anchor="middle" class="">是否屬於已核可的來源組合？</text><path d="M106,490 L106,538" class="line"/><path d="M254,490 L254,538" class="line"/><text x="70" y="522" text-anchor="middle" class="">是</text><text x="290" y="522" text-anchor="middle" class="">否</text><rect x="18" y="542" width="168" height="80" rx="9" class="green"/><text x="102.0" y="565.0" text-anchor="middle" class="">111／110</text><text x="102.0" y="587.0" text-anchor="middle" class="">101／011</text><text x="102.0" y="609.0" text-anchor="middle" class="">可用分支融合</text><rect x="198" y="542" width="144" height="80" rx="9" class="orange"/><text x="270.0" y="576.0" text-anchor="middle" class="">單路或 000</text><text x="270.0" y="598.0" text-anchor="middle" class="">人工／拒答</text><text x="180" y="655" text-anchor="middle" class="">兩條路徑都記錄：原因、結果、覆蓋</text><text x="180" y="690" text-anchor="middle" class="small">本例政策示意；未驗證組合不可默認可用</text></svg>
