<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 654" role="img" aria-labelledby="title desc"><title id="title">模型的生命週期</title><desc id="desc">由資料、訓練、驗證、部署到監控，檢查變動後再回資料準備；驗證失敗不發布。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#285177"/></marker></defs><rect width="360" height="654" fill="white"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="16" fill="#172d43"><text x="180" y="30" text-anchor="middle" font-weight="700">模型的生命週期</text><text x="180" y="50" text-anchor="middle" font-size="12">示意圖</text><text x="180" y="70" text-anchor="middle" font-weight="700">由實驗進入營運</text><rect x="30" y="90" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="114" text-anchor="middle"><tspan x="180" dy="0">資料準備</tspan><tspan x="180" dy="22">資料版本與特徵規則</tspan></text><path d="M180 150 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="176" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="200" text-anchor="middle"><tspan x="180" dy="0">訓練與測試</tspan><tspan x="180" dy="22">程式、環境與實驗紀錄</tspan></text><path d="M180 236 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="262" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="286" text-anchor="middle"><tspan x="180" dy="0">驗證品質與服務相容性</tspan><tspan x="180" dy="22">未通過 → 保留現行版（補充）</tspan></text><path d="M180 322 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="348" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="372" text-anchor="middle"><tspan x="180" dy="0">部署推論服務</tspan><tspan x="180" dy="22">指定模型版與回退版本</tspan></text><path d="M180 408 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="434" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="458" text-anchor="middle"><tspan x="180" dy="0">監控與回饋</tspan><tspan x="180" dy="22">延遲、錯誤與有標籤的品質</tspan></text><path d="M180 494 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="520" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="544" text-anchor="middle"><tspan x="180" dy="0">調查異常、回訓與優化</tspan><tspan x="180" dy="22">回到資料準備，再訓練與驗證</tspan></text><path d="M30 549 H12 V119 H28" stroke="#285177" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow)"/><text x="180" y="602" text-anchor="middle" font-size="14">虛線：回饋循環；驗證未過不發布</text></g></svg>
