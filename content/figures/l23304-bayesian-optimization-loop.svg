<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 450" role="img"><title>貝氏最佳化的觀察與選點循環</title><desc>只用已完成的候選評分建立代理，取得函數選下一組超參數。真正訓練與驗證後，把觀察值加入紀錄再更新。測試集不進入循環。</desc><rect width="360" height="450" fill="#fff"/><g font-family="sans-serif" font-size="15" fill="#182a3a" text-anchor="middle"><g fill="#e8f2fa" stroke="#52677a"><rect x="35" y="15" width="290" height="62" rx="8"/><rect x="35" y="112" width="290" height="62" rx="8"/><rect x="35" y="209" width="290" height="62" rx="8"/><rect x="35" y="306" width="290" height="62" rx="8"/></g><text x="180" y="40">① 已做實驗的設定與真實分數</text><text x="180" y="64">只含開發資料的驗證結果</text><text x="180" y="138">② 擬合／更新代理模型</text><text x="180" y="161">預測平均與不確定性</text><text x="180" y="235">③ 取得函數選下一組設定</text><text x="180" y="258">利用好區域，也探索未知</text><text x="180" y="332">④ 真正訓練與驗證</text><text x="180" y="355">新增觀察，回到步驟①</text><text x="180" y="406">預算用完才停止；每次不保證進步</text><text x="180" y="431">測試集不參與這個循環</text><path d="M180 77v35m-6-6 6 6 6-6M180 174v35m-6-6 6 6 6-6M180 271v35m-6-6 6 6 6-6M35 337H12V45h23m-6-6 6 6-6 6" fill="none" stroke="#52677a" stroke-width="2"/></g></svg>
