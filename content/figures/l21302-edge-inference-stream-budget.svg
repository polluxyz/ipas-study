<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 452" role="img" aria-labelledby="title desc"><title id="title">串流四段預算</title><desc id="desc">同一影像請求串行加總；端側四十毫秒、私有五十四毫秒、公有八十毫秒。紅虛線為五十毫秒驗收門檻。</desc><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#142c40;font-size:14px}.h{font-size:17px;font-weight:700}.s{font-size:12px}.box{fill:#edf6fb;stroke:#266080;stroke-width:1.5}.arrow{fill:none;stroke:#266080;stroke-width:2}</style><rect width="360" height="452" fill="#fff"/><text x="16" y="26" class="h">影像串流：攝影到回應</text><text x="16" y="60" class="">端側：10 + 2 + 24 + 4 = 40 ms</text><rect x="16" y="70" width="40" height="25" fill="#bdd8ec" stroke="#304a60"/><rect x="56" y="70" width="8" height="25" fill="#f1d193" stroke="#304a60"/><rect x="64" y="70" width="96" height="25" fill="#8dcbbd" stroke="#304a60"/><rect x="160" y="70" width="16" height="25" fill="#cdb8e8" stroke="#304a60"/><path d="M216 66 v35" stroke="#b1322b" stroke-dasharray="4 2"/><text x="16" y="143" class="">私有：10 + 6 + 34 + 4 = 54 ms</text><rect x="16" y="153" width="40" height="25" fill="#bdd8ec" stroke="#304a60"/><rect x="56" y="153" width="24" height="25" fill="#f1d193" stroke="#304a60"/><rect x="80" y="153" width="136" height="25" fill="#8dcbbd" stroke="#304a60"/><rect x="216" y="153" width="16" height="25" fill="#cdb8e8" stroke="#304a60"/><path d="M216 149 v35" stroke="#b1322b" stroke-dasharray="4 2"/><text x="16" y="226" class="">公有：10 + 40 + 26 + 4 = 80 ms</text><rect x="16" y="236" width="40" height="25" fill="#bdd8ec" stroke="#304a60"/><rect x="56" y="236" width="160" height="25" fill="#f1d193" stroke="#304a60"/><rect x="216" y="236" width="104" height="25" fill="#8dcbbd" stroke="#304a60"/><rect x="320" y="236" width="16" height="25" fill="#cdb8e8" stroke="#304a60"/><path d="M216 232 v35" stroke="#b1322b" stroke-dasharray="4 2"/><text x="16" y="314" class="s">0</text><text x="200" y="314" class="s">50 ms 門檻</text><text x="306" y="314" class="s">80 ms</text><rect x="16" y="334" width="14" height="14" fill="#bdd8ec" stroke="#304a60"/><text x="37" y="346" class="">攝影</text><rect x="180" y="334" width="14" height="14" fill="#f1d193" stroke="#304a60"/><text x="201" y="346" class="">傳輸</text><rect x="16" y="362" width="14" height="14" fill="#8dcbbd" stroke="#304a60"/><text x="37" y="374" class="">推論段</text><rect x="180" y="362" width="14" height="14" fill="#cdb8e8" stroke="#304a60"/><text x="201" y="374" class="">回應</text><text x="16" y="411" class="s">推論段含前處理、排隊與 kernel。</text><text x="16" y="434" class="s">合成固定紀錄；各段串行、不重疊。</text></svg>
