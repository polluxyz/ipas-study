<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 535" width="360" height="535" role="img" aria-labelledby="title desc"><title id="title">Trello看板線框</title><desc id="desc">同六工作包，A與B完成，C進行中，D到F待辦，卡片列主要責任、前置及期限。</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#475569"/></marker></defs><style>text{font-family:'Microsoft JhengHei',sans-serif;font-size:13px;fill:#172033} .small{font-size:12px}.head{font-size:16px;font-weight:700}.muted{fill:#475569} .box{fill:#f8fafc;stroke:#64748b;stroke-width:1.2} .link{fill:none;stroke:#475569;stroke-width:1.3;marker-end:url(#arrow)}</style><rect width="360" height="535" fill="#fff"/><text x="12" y="26" class="head">Trello：同六工作包的看板</text><text x="12" y="49" class="">2026-11-06日終快照；教學線框</text><rect x="6" y="66" width="112" height="398" rx="6" fill="#f1f5f9"/><text x="16" y="91" class="">待辦</text><rect class="box" x="11" y="104" width="102" height="102" rx="5"/><text x="18" y="125" class="">D 模型</text><text x="18" y="146" class="small">王負責</text><text x="18" y="166" class="small">截止11/10</text><text x="18" y="186" class="small">前置:B</text><rect class="box" x="11" y="217" width="102" height="102" rx="5"/><text x="18" y="238" class="">E 整合</text><text x="18" y="259" class="small">李負責</text><text x="18" y="279" class="small">截止11/13</text><text x="18" y="299" class="small">前置:C/D</text><rect class="box" x="11" y="330" width="102" height="102" rx="5"/><text x="18" y="351" class="">F 決議</text><text x="18" y="372" class="small">周負責</text><text x="18" y="392" class="small">截止11/16</text><text x="18" y="412" class="small">前置:E</text><rect x="125" y="66" width="112" height="398" rx="6" fill="#f1f5f9"/><text x="135" y="91" class="">進行中</text><rect class="box" x="130" y="104" width="102" height="102" rx="5"/><text x="137" y="125" class="">C 介面</text><text x="137" y="146" class="small">陳負責</text><text x="137" y="166" class="small">截止11/09</text><text x="137" y="186" class="small">前置:A</text><rect x="244" y="66" width="112" height="398" rx="6" fill="#f1f5f9"/><text x="254" y="91" class="">完成</text><rect class="box" x="249" y="104" width="102" height="102" rx="5"/><text x="256" y="125" class="">A 來源</text><text x="256" y="146" class="small">林負責</text><text x="256" y="166" class="small">截止11/03</text><text x="256" y="186" class="small">前置:無</text><rect class="box" x="249" y="217" width="102" height="102" rx="5"/><text x="256" y="238" class="">B 資料</text><text x="256" y="259" class="small">林負責</text><text x="256" y="279" class="small">截止11/06</text><text x="256" y="299" class="small">前置:A</text><text x="12" y="490" class="small">E卡片連到C、D，開始前核對前置證據。</text><text x="12" y="513" class="small">附件記資料版與驗收；移欄不代表自動驗收。</text></svg>
