<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">同一序列的三次投影</title><desc id="desc">輸入 X 分別投影成 Q、K、V。Q 和 K 配分並以 Softmax 轉權重，V 按權重彙整，形成每個位置的新表示。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#30445c"/></marker></defs><rect width="360" height="360" fill="#fff"/><g font-family="sans-serif" font-size="14" fill="#18334c"><text x="16" y="24" >同一序列的三次投影</text><rect x="110" y="50" width="140" height="35" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="180" y="72.5" text-anchor="middle">輸入 X：L×d</text><path d="M180 86 L60 119" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="10" y="122" width="100" height="44" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="60" y="149" text-anchor="middle">Q＝XWq</text><path d="M180 86 L180 119" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="130" y="122" width="100" height="44" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="180" y="149" text-anchor="middle">K＝XWk</text><path d="M180 86 L300 119" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="250" y="122" width="100" height="44" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="300" y="149" text-anchor="middle">V＝XWv</text><path d="M60 168 L105 207" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M180 168 L155 207" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="28" y="210" width="200" height="38" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="128" y="234" text-anchor="middle">縮放點積→Softmax</text><path d="M130 250 L130 280" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M300 168 L300 299" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M300 299 L232 299" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="28" y="283" width="200" height="35" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="128" y="305.5" text-anchor="middle">權重 × V → 新表示</text><text x="16" y="348" font-size="12">教學合成資料／示意圖</text></g></svg>
