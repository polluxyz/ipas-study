<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 266" role="img" aria-labelledby="title desc">
<title id="title">統計均等：比較全群</title><desc id="desc">全群選取率A50%、B70%，不符合嚴格統計均等。</desc>
<rect width="360" height="266" rx="12" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#0f172a" font-size="17"><text x="18" y="30" font-size="21" font-weight="bold">統計均等：比較全群</text><text x="18" y="62" font-weight="bold">全群的有利選取率</text><text x="18" y="92">A：50%（10/20）</text><rect x="18" y="102" width="300" height="18" rx="3" fill="#e2e8f0"/><rect x="18" y="102" width="150" height="18" rx="3" fill="#0369a1"/><text x="18" y="151">B：70%（14/20）</text><rect x="18" y="161" width="300" height="18" rx="3" fill="#e2e8f0"/><rect x="18" y="161" width="210" height="18" rx="3" fill="#b45309"/><text x="18" y="210" font-size="14">0%</text><text x="155" y="210" font-size="14">50%</text><text x="282" y="210" font-size="14">100%</text><text x="18" y="247" font-size="14">教學合成：每群20人，固定稽核集</text></g></svg>
