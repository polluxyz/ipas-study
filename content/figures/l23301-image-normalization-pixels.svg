<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" role="img" aria-labelledby="t d"><title id="t">像素數值轉換</title><desc id="d">2乘2校準像素0、85、170、255，正規化再用固定均值標準差標準化。</desc><rect width="360" height="440" fill="#fff"/><g fill="#172033" font-family="Microsoft JhengHei, sans-serif"><text x="12" y="24" font-size="17">同一批像素：位置不變，數值改變</text><text x="12" y="55" font-size="14">原始8位元像素</text><rect x="12" y="67" width="145" height="32" fill="#e2e8f0"/><text x="26" y="89" font-size="14">0</text><rect x="167" y="67" width="145" height="32" fill="#e2e8f0"/><text x="181" y="89" font-size="14">85</text><rect x="12" y="102" width="145" height="32" fill="#e2e8f0"/><text x="26" y="124" font-size="14">170</text><rect x="167" y="102" width="145" height="32" fill="#e2e8f0"/><text x="181" y="124" font-size="14">255</text><text x="12" y="180" font-size="14">除以255：正規化</text><rect x="12" y="192" width="145" height="32" fill="#e2e8f0"/><text x="26" y="214" font-size="14">0</text><rect x="167" y="192" width="145" height="32" fill="#e2e8f0"/><text x="181" y="214" font-size="14">0.333</text><rect x="12" y="227" width="145" height="32" fill="#e2e8f0"/><text x="26" y="249" font-size="14">0.667</text><rect x="167" y="227" width="145" height="32" fill="#e2e8f0"/><text x="181" y="249" font-size="14">1</text><text x="12" y="305" font-size="14">減0.5再除0.25：標準化</text><rect x="12" y="317" width="145" height="32" fill="#e2e8f0"/><text x="26" y="339" font-size="14">-2</text><rect x="167" y="317" width="145" height="32" fill="#e2e8f0"/><text x="181" y="339" font-size="14">-0.667</text><rect x="12" y="352" width="145" height="32" fill="#e2e8f0"/><text x="26" y="374" font-size="14">0.667</text><rect x="167" y="352" width="145" height="32" fill="#e2e8f0"/><text x="181" y="374" font-size="14">2</text><text x="12" y="430" font-size="11">教學合成資料；由共用JSON計算</text></g></svg>
