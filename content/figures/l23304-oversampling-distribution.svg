<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-labelledby="t d"><title id="t">過採樣與欠採樣的共同計數</title><desc id="d">五個資料區段採相同筆數刻度；驗證與測試均不改比例。</desc><style>text{font-family:Arial,'Microsoft JhengHei',sans-serif;font-size:14px;fill:#172033}.small{font-size:12px}.head{font-weight:bold;font-size:16px}.neg{fill:#2563eb}.pos{fill:#c2410c}.line{fill:none;stroke-width:3}</style><rect width="360" height="480" fill="#fff"/><text x="12" y="24" class="head">同一資料、不同訓練筆數</text><text x="12" y="46" class="small">藍條：負類　橘條：正類；橫軸為筆數</text><text x="12" y="72">原始訓練（共120筆）</text><text x="12" y="94">負</text><rect class="neg" x="42" y="82" width="232" height="13"/><text x="280" y="94">114</text><text x="12" y="114">正</text><rect class="pos" x="42" y="102" width="12.210526315789473" height="13"/><text x="60.21052631578947" y="114">6</text><text x="12" y="148">過採樣訓練（共228筆）</text><text x="12" y="170">負</text><rect class="neg" x="42" y="158" width="232" height="13"/><text x="280" y="170">114</text><text x="12" y="190">正</text><rect class="pos" x="42" y="178" width="232" height="13"/><text x="280" y="190">114</text><text x="12" y="224">欠採樣訓練（共12筆）</text><text x="12" y="246">負</text><rect class="neg" x="42" y="234" width="12.210526315789473" height="13"/><text x="60.21052631578947" y="246">6</text><text x="12" y="266">正</text><rect class="pos" x="42" y="254" width="12.210526315789473" height="13"/><text x="60.21052631578947" y="266">6</text><text x="12" y="300">驗證：維持原分布（共40筆）</text><text x="12" y="322">負</text><rect class="neg" x="42" y="310" width="77.33333333333333" height="13"/><text x="125.33333333333333" y="322">38</text><text x="12" y="342">正</text><rect class="pos" x="42" y="330" width="4.0701754385964914" height="13"/><text x="52.07017543859649" y="342">2</text><text x="12" y="376">測試：維持原分布（共40筆）</text><text x="12" y="398">負</text><rect class="neg" x="42" y="386" width="77.33333333333333" height="13"/><text x="125.33333333333333" y="398">38</text><text x="12" y=