<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 370" role="img"><title>詞嵌入的投影示意</title><desc>只畫人工三維向量前兩維，不能據此判讀所有三維距離。</desc><rect width="360" height="370" fill="#fff"/><g font-family="sans-serif" font-size="15" fill="#172b4d"><text x="12" y="25" >三維手設向量的前兩維投影</text><path d="M48 64V264H330" fill="none" stroke="#52657e" stroke-width="2"/><text x="9" y="57" >第 2 維</text><text x="243" y="294" >第 1 維</text><circle cx="298" cy="228" r="6" fill="#1b559e"/><text x="305" y="249" >訂</text><circle cx="273" cy="210" r="6" fill="#1b559e"/><text x="280" y="201" >改</text><circle cx="73" cy="228" r="6" fill="#1b559e"/><text x="80" y="249" >書</text><circle cx="98" cy="84" r="6" fill="#1b559e"/><text x="105" y="105" >票</text><text x="12" y="325" >相似度用完整三維計算；圖未畫第 3 維。</text><text x="12" y="352" >手設示意，非模型訓練結果。</text></g></svg>
