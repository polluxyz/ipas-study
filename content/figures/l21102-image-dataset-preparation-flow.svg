<svg xmlns="http://www.w3.org/2000/svg" width="360" height="464" viewBox="0 0 360 464" role="img" aria-labelledby="l21102-image-dataset-preparation-flow-title l21102-image-dataset-preparation-flow-desc"><title id="l21102-image-dataset-preparation-flow-title">影像分類資料準備流程</title><desc id="l21102-image-dataset-preparation-flow-desc">收集與標註後清洗，依來源分組及類別檢查切分。訓練可增強並學模型，驗證選設定，測試只在鎖定後評估。固定轉換在三個集合一致。</desc><rect width="360" height="464" fill="#fff"/><g font-family="sans-serif"><rect x="24" y="15" width="312" height="40" rx="6" fill="#eef5fc" stroke="#345"/><text x="40" y="41" font-size="15" fill="#172b4d">收集＋標註：來源、類別與版本</text><path d="M180 55v20m-5-5 5 5 5-5" fill="none" stroke="#345" stroke-width="2"/><rect x="24" y="77" width="312" height="40" rx="6" fill="#eef5fc" stroke="#345"/><text x="40" y="103" font-size="15" fill="#172b4d">清洗：模糊、重複、標錯</text><path d="M180 117v20m-5-5 5 5 5-5" fill="none" stroke="#345" stroke-width="2"/><rect x="24" y="139" width="312" height="40" rx="6" fill="#eef5fc" stroke="#345"/><text x="40" y="165" font-size="15" fill="#172b4d">先分來源群，再查各集合類別數</text><path d="M180 179v20m-5-5 5 5 5-5" fill="none" stroke="#345" stroke-width="2"/><rect x="24" y="201" width="312" height="40" rx="6" fill="#eef5fc" stroke="#345"/><text x="40" y="227" font-size="15" fill="#172b4d">固定輸入契約：尺寸、通道、尺度</text><path d="M180 241v20m-5-5 5 5 5-5" fill="none" stroke="#345" stroke-width="2"/><rect x="24" y="263" width="312" height="40" rx="6" fill="#e6f4ea" stroke="#345"/><text x="40" y="289" font-size="15" fill="#172b4d">訓練：合理增強、學習模型</text><path d="M180 303v20m-5-5 5 5 5-5" fill="none" stroke="#345" stroke-width="2"/><rect x="24" y="325" width="312" height="40" rx="6" fill="#eef5fc" stroke="#345"/><text x="40" y="351" font-size="15" fill="#172b4d">驗證：比較設定、檢查錯誤</text><path d="M180 365v20m-5-5 5 5 5-5" fill="none" stroke="#345" stroke-width="2"/><rect x="24" y="387" width="312" height="40" rx="6" fill="#eef5fc" stroke="#345"/><text x="40" y="413" font-size="15" fill="#172b4d">鎖定後測試：獨立評估、保存版本</text><text x="24" y="451" font-size="15" fill="#172b4d">同源影格或變體不跨集合。</text></g></svg>
