<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 495" role="img" aria-labelledby="title desc"><title id="title">線性可分與 XOR 點集</title><desc id="desc">兩張圖使用相同四個座標。OR 的一個角落可切開；XOR 的同類分居對角。</desc><style>text{font-family:system-ui,sans-serif;font-size:14px;fill:#182b42}.box{fill:#edf4fb;stroke:#24648d;stroke-width:1.5}.line{fill:none;stroke:#24648d;stroke-width:2}.back{fill:none;stroke:#a04435;stroke-width:2;stroke-dasharray:5 3}</style><rect width="360" height="495" fill="#fff"/><text x="180" y="30" text-anchor="middle">OR：x₁ + x₂ = 0.25 可分</text><path class="line" d="M50 200H315M65 215V50"/><text x="315" y="223" text-anchor="middle">x₁</text><text x="45" y="45" text-anchor="middle">x₂</text><text x="65" y="223" text-anchor="middle">0</text><text x="295" y="223" text-anchor="middle">1</text><text x="49" y="69" text-anchor="middle">1</text><path class="back" d="M46.599999999999994 155.45L140.9 210.8"/><text x="148" y="166.25" text-anchor="middle">z = 0</text><text x="122.5" y="223" text-anchor="middle">0.25</text><text x="43" y="170.25" text-anchor="middle">0.25</text><circle cx="65" cy="200" r="8" fill="#fff" stroke="#24648d" stroke-width="2"/><path d="M287 192h16v16h-16z" fill="#a04435"/><path d="M57 57h16v16h-16z" fill="#a04435"/><path d="M287 57h16v16h-16z" fill="#a04435"/><text x="180" y="235" text-anchor="middle">○ 標籤 0　■ 標籤 1</text><text x="180" y="255" text-anchor="middle">XOR：對角同類，無單一直線可分</text><path class="line" d="M50 425H315M65 440V275"/><text x="315" y="448" text-anchor="middle">x₁</text><text x="45" y="270" text-anchor="middle">x₂</text><text x="65" y="448" text-anchor="middle">0</text><text x="295" y="448" text-anchor="middle">1</text><text x="49" y="294" text-anchor="middle">1</text><circle cx="65" cy="425" r="8" fill="#fff" stroke="#24648d" stroke-width="2"/><path d="M287 417h16v16h-16z" fill="#a04435"/><path d="M57 282h16v16h-16z" fill="#a04435"/><circle cx="295" cy="290" r="8" fill="#fff" stroke="#24648d" stroke-width="2"/><text x="180" y="460" 