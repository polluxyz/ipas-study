<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 510" role="img" aria-labelledby="title desc"><title id="title">AutoML固定搜尋與封存測試流程</title><desc id="desc">開發60筆內三摺比較三候選，選定後重訓，再使用封存20筆評估。</desc><rect width="360" height="510" fill="#fff"/><g font-family="sans-serif"><text x="180" y="25" font-size="17" text-anchor="middle" fill="#172b4d">搜尋與最終測試分開</text><rect x="90" y="45" width="180" height="42" rx="8" fill="#eef5fa" stroke="#126a9b"/><text x="180.0" y="71.0" font-size="13" text-anchor="middle" fill="#172b4d">80 筆先固定索引</text><rect x="15" y="113" width="195" height="54" rx="8" fill="#eef5fa" stroke="#126a9b"/><text x="112.5" y="145.0" font-size="13" text-anchor="middle" fill="#172b4d">開發集 60 筆：3 摺</text><rect x="230" y="113" width="115" height="54" rx="8" fill="#eef5fa" stroke="#126a9b"/><text x="287.5" y="145.0" font-size="13" text-anchor="middle" fill="#172b4d">封存 20 筆</text><rect x="15" y="211" width="195" height="54" rx="8" fill="#eef5fa" stroke="#126a9b"/><text x="112.5" y="243.0" font-size="13" text-anchor="middle" fill="#172b4d">三候選各訓練 3 次</text><rect x="15" y="309" width="195" height="54" rx="8" fill="#eef5fa" stroke="#126a9b"/><text x="112.5" y="341.0" font-size="13" text-anchor="middle" fill="#172b4d">選定規格，再重訓</text><rect x="90" y="406" width="255" height="54" rx="8" fill="#eef5fa" stroke="#126a9b"/><text x="217.5" y="438.0" font-size="13" text-anchor="middle" fill="#172b4d">人工核可後，測試一次</text><line x1="180" y1="87" x2="112" y2="113" stroke="#126a9b" stroke-width="1.5" stroke-dasharray=""/><line x1="180" y1="87" x2="287" y2="113" stroke="#126a9b" stroke-width="1.5" stroke-dasharray=""/><line x1="112" y1="167" x2="112" y2="211" stroke="#126a9b" stroke-width="1.5" stroke-dasharray=""/><line x1="112" y1="265" x2="112" y2="309" stroke="#126a9b" stroke-width="1.5" stroke-dasharray=""/><line x1="112" y1="363" x2="155" y2="406" stroke="#126a9b" stroke-width="1.5" stroke-dasharray=""/><line x1="287" y1="167" x2="287" y2="406" stroke="#126a9b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="220" y="492" font-size="13" text-anchor="middle" fill="#172b4d">測試標籤不回流挑候選</text></g></svg>
