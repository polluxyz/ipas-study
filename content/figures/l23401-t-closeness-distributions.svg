<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 528" role="img" aria-labelledby="title desc"><title id="title">群內與全體敏感值分布</title><desc id="desc">由偏斜版計數轉為比例；第 3 群與全體距離最大，為 0.5。</desc><rect width="360" height="528" fill="#fff"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" fill="#172554"><text x="14" y="25" font-size="17" >偏斜版：群內對照全體分布</text><text x="14" y="48" font-size="12" >甲＝氣喘　乙＝糖尿病　丙＝偏頭痛</text><text x="16" y="74" font-size="15" >全體（12 人）　距離 0.00</text><rect x="16" y="86" width="164" height="30" rx="6" fill="#0369a1" /><text x="98" y="106" font-size="12" fill="white" text-anchor="middle">甲 50.0%</text><rect x="180" y="86" width="109.33333333333333" height="30" rx="6" fill="#a16207" /><text x="234.66666666666666" y="106" font-size="12" fill="white" text-anchor="middle">乙 33.3%</text><rect x="289.3333333333333" y="86" width="54.666666666666664" height="30" rx="6" fill="#7e22ce" /><text x="316.66666666666663" y="106" font-size="12" fill="white" text-anchor="middle">丙 16.7%</text><text x="16" y="139" font-size="12" >甲 50.0%　乙 33.3%　丙 16.7%</text><text x="16" y="174" font-size="15" >第1群（4 人）　距離 0.25</text><rect x="16" y="186" width="246" height="30" rx="6" fill="#0369a1" /><text x="139" y="206" font-size="12" fill="white" text-anchor="middle">甲 75.0%</text><rect x="262" y="186" width="82" height="30" rx="6" fill="#a16207" /><text x="303" y="206" font-size="12" fill="white" text-anchor="middle">乙 25.0%</text><text x="16" y="239" font-size="12" >甲 75.0%　乙 25.0%　丙 0.0%</text><text x="16" y="274" font-size="15" >第2群（4 人）　距離 0.25</text><rect x="16" y="286" width="246" height="30" rx="6" fill="#0369a1" /><text x="139" y="306" font-size="12" fill="white" text-anchor="middle">甲 75.0%</text><rect x="262" y="286" width="82" height="30" rx="6" fill="#a16207" /><text x="303" y="306" font-size="12" fill="white" text-anchor="middle">乙 25.0%</text><text x="16" y="339" font-size="12" >甲 75.0%　乙 25.0%　丙 0.0%</text><text x="16" y="374" font-size="15" >第3群（4 人）　距離 0.50</text><rect x="16" y="386" width="164" height="30" rx="6" fill="#a16207" /><text x="98" y="406" font-size="12" fill="white" text-anchor="middle">乙 50.0%</text><rect x="180" y="386" width="164" height="30" rx="6" fill="#7e22ce" /><text x="262" y="406" font-size="12" fill="white" text-anchor="middle">丙 50.0%</text><text x="16" y="439" font-size="12" >甲 0.0%　乙 50.0%　丙 50.0%</text><text x="16" y="484" font-size="14" >t=0.3：第3群距離 0.50，整表失敗。</text><text x="16" y="508" font-size="12" >等距類別 EMD；每條比例加總為 100%。</text></g></svg>
