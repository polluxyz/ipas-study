<svg xmlns="http://www.w3.org/2000/svg" width="360" height="510" viewBox="0 0 360 510" role="img" aria-labelledby="title desc">
<title id="title">從評估輸入到導入方案輸出</title><desc id="desc">評估資料、技術及成本條件，界定範疇與驗收，分派任務及資源，彙整主文件，最後審查；發現缺口時回到範疇與資源重新規劃。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs>
<rect width="360" height="510" rx="12" fill="#f8fafc"/>
<g font-family="sans-serif" text-anchor="middle" fill="#0f172a">
<text x="180" y="28" font-size="18" font-weight="700">評估結論如何變成計畫</text>
<g stroke="#64748b" fill="#e0f2fe"><rect x="28" y="48" width="280" height="65" rx="8"/><rect x="28" y="138" width="280" height="65" rx="8"/><rect x="28" y="228" width="280" height="65" rx="8"/><rect x="28" y="318" width="280" height="65" rx="8"/><rect x="28" y="408" width="280" height="65" rx="8"/></g>
<g font-size="16"><text x="168" y="73">輸入：價值、資料、IT、成本</text><text x="168" y="95">條件、證據與未解缺口</text><text x="168" y="163">界定：目標、範疇與驗收</text><text x="168" y="185">先決定這次做哪些事</text><text x="168" y="253">配置：任務、角色與資源</text><text x="168" y="275">誰做、何時做、用多少</text><text x="168" y="343">輸出：導入規劃主文件</text><text x="168" y="365">任務表、時程表及預算一致</text><text x="168" y="433">審查：通過、補件或縮範圍</text><text x="168" y="455">條件未滿足就回頭調整</text></g>
<text x="180" y="496" font-size="13">依學習指引重繪；例子採教學合成資料</text></g>
<g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"><path d="M168 113V136"/><path d="M168 203V226"/><path d="M168 293V316"/><path d="M168 383V406"/><path d="M308 440H334V170H310" stroke-dasharray="5 4"/></g>
</svg>
