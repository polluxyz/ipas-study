<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 605" role="img" aria-labelledby="title desc">
<title id="title">同一序列的三種填補</title><desc id="desc">前填得到10、10、10、40、40；後填與內插需要未來觀測，最後一點仍無可用右端點。</desc>
<rect width="360" height="605" fill="#f8fafc"/>
<g font-family="sans-serif" font-size="15" fill="#0f172a"><text x="14" y="24">觀測：10、缺、缺、40、缺</text><text x="14" y="58">前填：僅沿用較早值</text><line x1="32" y1="153" x2="330" y2="153" stroke="#64748b"/><text x="36" y="174" font-size="13">0</text><circle cx="40" cy="138.0" r="4" fill="#0369a1"/><text x="31" y="128.0" font-size="13">10</text><text x="105" y="174" font-size="13">1</text><rect x="105" y="134.0" width="8" height="8" fill="#b45309"/><text x="100" y="128.0" font-size="13">10</text><text x="174" y="174" font-size="13">2</text><rect x="174" y="134.0" width="8" height="8" fill="#b45309"/><text x="169" y="128.0" font-size="13">10</text><text x="243" y="174" font-size="13">3</text><circle cx="247" cy="93.0" r="4" fill="#0369a1"/><text x="238" y="83.0" font-size="13">40</text><text x="312" y="174" font-size="13">4</text><rect x="312" y="89.0" width="8" height="8" fill="#b45309"/><text x="307" y="83.0" font-size="13">40</text><text x="14" y="218">後填：需要較晚值</text><line x1="32" y1="313" x2="330" y2="313" stroke="#64748b"/><text x="36" y="334" font-size="13">0</text><circle cx="40" cy="298.0" r="4" fill="#0369a1"/><text x="31" y="288.0" font-size="13">10</text><text x="105" y="334" font-size="13">1</text><rect x="105" y="249.0" width="8" height="8" fill="#b45309"/><text x="100" y="243.0" font-size="13">40</text><text x="174" y="334" font-size="13">2</text><rect x="174" y="249.0" width="8" height="8" fill="#b45309"/><text x="169" y="243.0" font-size="13">40</text><text x="243" y="334" font-size="13">3</text><circle cx="247" cy="253.0" r="4" fill="#0369a1"/><text x="238" y="243.0" font-size="13">40</text><text x="312" y="334" font-size="13">4</text><text x="304" y="292" font-size="13">缺</text><text x="14" y="378">線性插值：只補內部缺口</text><line x1="32" y1="473" x2="330" y2="473" stroke="#64748b"/><text x="36" y="494" font-size="13">0</text><circle cx="40" cy="458.0" r="4" fill="#0369a1"/><text x="31" y="448.0" font-size="13">10</text><text x="105" y="494" font-size="13">1</text><rect x="105" y="439.0" width="8" height="8" fill="#b45309"/><text x="100" y="433.0" font-size="13">20</text><text x="174" y="494" font-size="13">2</text><rect x="174" y="424.0" width="8" height="8" fill="#b45309"/><text x="169" y="418.0" font-size="13">30</text><text x="243" y="494" font-size="13">3</text><circle cx="247" cy="413.0" r="4" fill="#0369a1"/><text x="238" y="403.0" font-size="13">40</text><text x="312" y="494" font-size="13">4</text><text x="304" y="452" font-size="13">缺</text><text x="14" y="552">橫軸：分鐘；縱向位置：溫度°C</text><text x="14" y="580">圓點=原觀測；方點=填補值</text></g></svg>