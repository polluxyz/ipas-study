<svg xmlns="http://www.w3.org/2000/svg" width="360" height="340" viewBox="0 0 360 340" role="img" aria-labelledby="title desc"><title id="title">訓練中的精度分工</title><desc id="desc">大量矩陣運算與部分激活可用低精度，敏感運算及必要狀態保留較高精度；實際精度由硬體、算子和實作決定。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#475569"/></marker></defs><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#172554;font-size:14px}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}.alt{fill:#f0fdf4;stroke:#15803d;stroke-width:1.5}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:1.5}.line{fill:none;stroke:#475569;stroke-width:1.5;marker-end:url(#arrow)}</style><rect width="360" height="340" fill="white"/><text x="180" y="25" text-anchor="middle">同一次訓練，依運算需求分工</text><rect x="25" y="45" width="310" height="64" rx="8" class="alt"/><text x="180" y="69" text-anchor="middle">大量矩陣運算、部分激活</text><text x="180" y="90" text-anchor="middle">可使用 FP16 等低精度</text><path d="M180 109L180 137" class="line"/><rect x="25" y="139" width="310" height="64" rx="8" class="box"/><text x="180" y="163" text-anchor="middle">數值敏感的運算</text><text x="180" y="184" text-anchor="middle">保留 FP32 等較高精度</text><path d="M180 203L180 231" class="line"/><rect x="25" y="233" width="310" height="64" rx="8" class="box"/><text x="180" y="257" text-anchor="middle">更新與必要訓練狀態</text><text x="180" y="278" text-anchor="middle">不能假定所有容量都減半</text><text x="180" y="330" text-anchor="middle" style="font-size:12px;fill:#475569">教學示意圖</text></svg>
