<svg xmlns="http://www.w3.org/2000/svg" width="360" height="338" viewBox="0 0 360 338" role="img" aria-labelledby="l21102-grad-cam-gradient-flow-title l21102-grad-cam-gradient-flow-desc"><title id="l21102-grad-cam-gradient-flow-title">從目標分數的梯度到粗熱圖</title><desc id="l21102-grad-cam-gradient-flow-desc">前向保存卷積特徵與目標分數。反向計算特徵梯度，平均成通道權重，組合特徵並經ReLU產生熱圖；沒有更新參數。</desc><rect width="360" height="338" fill="#fff"/><g font-family="sans-serif"><rect x="22" y="14" width="316" height="39" rx="6" fill="#eef5fc" stroke="#345"/><text x="34" y="40" font-size="15" fill="#172b4d">前向：影像 → 卷積特徵 A</text><path d="M180 53v18m-5-5 5 5 5-5" fill="none" stroke="#345" stroke-width="2"/><rect x="22" y="75" width="316" height="39" rx="6" fill="#eef5fc" stroke="#345"/><text x="34" y="101" font-size="15" fill="#172b4d">指定目標：Softmax 前分數</text><path d="M180 114v18m-5-5 5 5 5-5" fill="none" stroke="#345" stroke-width="2"/><rect x="22" y="136" width="316" height="39" rx="6" fill="#eef5fc" stroke="#345"/><text x="34" y="162" font-size="15" fill="#172b4d">反向：目標對 A 的梯度</text><path d="M180 175v18m-5-5 5 5 5-5" fill="none" stroke="#345" stroke-width="2"/><rect x="22" y="197" width="316" height="39" rx="6" fill="#eef5fc" stroke="#345"/><text x="34" y="223" font-size="15" fill="#172b4d">空間平均：每通道的權重</text><path d="M180 236v18m-5-5 5 5 5-5" fill="none" stroke="#345" stroke-width="2"/><rect x="22" y="258" width="316" height="39" rx="6" fill="#eef5fc" stroke="#345"/><text x="34" y="284" font-size="15" fill="#172b4d">加權特徵＋ReLU → 粗熱圖</text><text x="22" y="331" font-size="14" fill="#172b4d">只計算解釋，不執行優化器更新。</text></g></svg>
