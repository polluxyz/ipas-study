<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 592" role="img" aria-labelledby="title desc"><title id="title">事前、輸出與人工審查</title><desc id="desc">開始前限定用途、來源、日期與權限，查證後生成草稿，分查格式、事實、偏見與操作宣告。未通過、缺證據或越權時轉人工，通過才交付允許範圍的內容。 圖資為教學示意。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#355d82"/></marker></defs><style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#16304a;font-size:16px} .small{font-size:14px} .box{fill:#eef5fc;stroke:#355d82;stroke-width:1.5} .gate{fill:#fff4d6;stroke:#8d640a;stroke-width:1.5} .end{fill:#eaf5ee;stroke:#32744b;stroke-width:1.5} .human{fill:#fceee9;stroke:#9a4c32;stroke-width:1.5} .arrow{fill:none;stroke:#355d82;stroke-width:2;marker-end:url(#arrow)}</style><rect width="360" height="592" fill="#fff"/><rect x="55" y="15" width="250" height="65" rx="9" class="box"/><text x="180" y="41.5" text-anchor="middle">事前：用途、來源與日期</text><text x="180" y="63.5" text-anchor="middle">訂明工具權限及人工接手點</text><path d="M180 80 V102" class="arrow"/><rect x="55" y="104" width="250" height="54" rx="9" class="box"/><text x="180" y="136" text-anchor="middle">取得有效證據，生成草稿</text><path d="M180 158 V180" class="arrow"/><path d="M305 130 H347 V449 H305" class="arrow"/><text class="small" x="304" y="98">缺證據</text><rect x="55" y="182" width="250" height="87" rx="9" class="gate"/><text x="180" y="208.5" text-anchor="middle">輸出：格式能否使用？</text><text x="180" y="230.5" text-anchor="middle">事實有依據？表述有偏見？</text><text x="180" y="252.5" text-anchor="middle">是否宣稱未完成的操作？</text><path d="M180 269 V305" class="arrow"/><text class="small" x="190" y="292">全數通過</text><rect x="55" y="307" width="250" height="54" rx="9" class="end"/><text x="180" y="339" text-anchor="middle">交付允許範圍的內容</text><path d="M305 225 H333 V414 H305" class="arrow"/><text class="small" x="310" y="392">未過</text><rect x="55" y="416" width="250" height="65" rx="9" class="human"/><text x="180" y="442.5" text-anchor="middle">退回修正或交人工</text><text x="180" y="464.5" text-anchor="middle">缺證據、越權、高影響先暫停</text><path d="M180 481 V511" class="arrow"/><rect x="55" y="513" width="250" height="54" rx="9" class="box"/><text x="180" y="545" text-anchor="middle">保留原因與修正版，再驗收</text></svg>
