<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" role="img" aria-labelledby="title desc"><title id="title">依瓶頸選部署優化</title><desc id="desc">先判別容量、傳輸與運算瓶頸，分別選模型壓縮、端雲分工或推論引擎，再回到品質與性能驗收。</desc><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#142c40;font-size:14px}.h{font-size:17px;font-weight:700}.s{font-size:12px}.box{fill:#edf6fb;stroke:#266080;stroke-width:1.5}.arrow{fill:none;stroke:#266080;stroke-width:2}</style><rect width="360" height="440" fill="#fff"/><text x="16" y="28" class="h">先找瓶頸，再選方法</text><rect class="box" x="16" y="48" width="328" height="64" rx="8"/><text x="28" y="73" class="h">容量放不下</text><text x="28" y="96" class="">輕量架構、剪枝、量化、蒸餾</text><rect class="box" x="16" y="128" width="328" height="64" rx="8"/><text x="28" y="153" class="h">傳輸占太久</text><text x="28" y="176" class="">評估近端推論與雲邊分工</text><rect class="box" x="16" y="208" width="328" height="64" rx="8"/><text x="28" y="233" class="h">運算或排程占太久</text><text x="28" y="256" class="">推論引擎；必要時再評估批次</text><path class="arrow" d="M180 272 v20 m-5 -6 l5 6 5 -6"/><text x="190" y="287" class="s">改善後重新驗收</text><rect class="box" x="16" y="304" width="328" height="64" rx="8"/><text x="28" y="329" class="h">共同驗收</text><text x="28" y="352" class="">品質｜峰值容量｜單筆延遲｜吞吐</text><text x="16" y="397" class="s">LoRA 減少更新負擔，基底仍需保留。（補充）</text><text x="16" y="422" class="s">教學示意：不同方法可搭配，效益須量測。</text></svg>
