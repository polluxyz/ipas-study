<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" role="img" aria-labelledby="title desc"><title id="title">森林的雙重隨機</title><desc id="desc">教學示意：每棵樹有放回取樣，每個節點再抽候選特徵；兩者不是同一個動作。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#374151"/></marker></defs><rect width="360" height="410" fill="#fff"/><g font-family="sans-serif" fill="#152a43"><text x="180" y="25" text-anchor="middle" font-size="17">每樹抽樣 × 每節點抽特徵</text><rect x="50" y="45" width="260" height="45" rx="8" fill="#e5efff" stroke="#265c9e"/><text x="180" y="68" text-anchor="middle" font-size="15">第一層：重抽訓練樣本</text><path d="M180 90 L180 118" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><rect x="55" y="125" width="250" height="65" rx="8" fill="#e5efff" stroke="#265c9e"/><text x="180" y="148" text-anchor="middle" font-size="15">第二層：節點候選特徵</text><text x="180" y="170" text-anchor="middle" font-size="15">例如只考慮面積、屋齡</text><path d="M180 190 L180 218" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><rect x="55" y="225" width="250" height="45" rx="8" fill="#e5efff" stroke="#265c9e"/><text x="180" y="248" text-anchor="middle" font-size="15">在候選中選最佳分裂</text><path d="M180 270 L95 305" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><path d="M180 270 L265 305" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="312" width="140" height="65" rx="8" fill="#e5efff" stroke="#265c9e"/><text x="95" y="335" text-anchor="middle" font-size="15">左側新節點</text><text x="95" y="357" text-anchor="middle" font-size="15">重新抽候選</text><rect x="195" y="312" width="140" height="65" rx="8" fill="#e5efff" stroke="#265c9e"/><text x="265" y="335" text-anchor="middle" font-size="15">右側新節點</text><text x="265" y="357" text-anchor="middle" font-size="15">重新抽候選</text><text x="180" y="402" text-anchor="middle" font-size="15">各樹完成後，才整合預測</text></g></svg>
