<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 608" role="img" aria-labelledby="title desc"><title id="title">變更後的三種檢查</title><desc id="desc">程式或資料變更觸發流程；影響分類與固定產物為補充欄位。任何門檻失敗都阻擋交付。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#416583"/></marker></defs><rect width="360" height="608" fill="#fff"/><g font-family="sans-serif"><text x="180" y="29" text-anchor="middle" font-size="18" fill="#152b40">變更後的三種檢查</text><rect x="20" y="54" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="80" text-anchor="middle" font-size="16" fill="#152b40">程式或資料變動</text><text x="180" y="103" text-anchor="middle" font-size="16" fill="#152b40">保留來源版本</text><path d="M 180 126 L 180 150" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><rect x="20" y="152" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="178" text-anchor="middle" font-size="16" fill="#152b40">依變更安排檢查（補充）</text><text x="180" y="201" text-anchor="middle" font-size="16" fill="#152b40">文件／小樣本／完整驗證</text><path d="M 180 224 L 180 248" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><rect x="20" y="250" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="276" text-anchor="middle" font-size="16" fill="#152b40">單元測試：行為正確？</text><text x="180" y="299" text-anchor="middle" font-size="16" fill="#152b40">模型品質：預測達標？</text><path d="M 180 322 L 180 346" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><rect x="20" y="348" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="374" text-anchor="middle" font-size="16" fill="#152b40">效能基準：延遲合格？</text><text x="180" y="397" text-anchor="middle" font-size="16" fill="#152b40">輸出結果與報告</text><path d="M 180 420 L 180 444" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><rect x="20" y="446" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="472" text-anchor="middle" font-size="16" fill="#152b40">全部通過 → 交付候選產物</text><text x="180" y="495" text-anchor="middle" font-size="16" fill="#152b40">任一失敗 → 阻擋並修正</text><text x="180" y="562" text-anchor="middle" font-size="14" fill="#152b40">訓練完成仍須通過各類門檻</text><text x="180" y="592" text-anchor="middle" font-size="13" fill="#152b40">教學示意｜非實際部署</text></g></svg>
