<svg xmlns="http://www.w3.org/2000/svg" width="360" height="562" viewBox="0 0 360 562" role="img" aria-labelledby="title desc"><title id="title">編解碼的變長輸入與輸出</title><desc id="desc">交通摘要、交通翻譯及請假摘要使用共用 JSON；每組分別顯示來源與目標詞元，內容長度不含結束符號。</desc><rect width="360" height="562" fill="#fff"/><g font-family="sans-serif"><text x="180" y="26" font-size="20" text-anchor="middle" fill="#172b4d">同一流程，長度可以不同</text><text x="18" y="62" font-size="16" text-anchor="start" fill="#172b4d">S1 摘要：6 → 3 個內容詞元</text><rect x="15" y="72" width="105" height="25" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="67" y="89" font-size="14" text-anchor="middle" fill="#172b4d">發車前</text><rect x="126" y="72" width="105" height="25" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="178" y="89" font-size="14" text-anchor="middle" fill="#172b4d">至少30分鐘</text><rect x="237" y="72" width="105" height="25" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="289" y="89" font-size="14" text-anchor="middle" fill="#172b4d">辦理</text><rect x="15" y="102" width="105" height="25" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="67" y="119" font-size="14" text-anchor="middle" fill="#172b4d">一般退票</text><rect x="126" y="102" width="105" height="25" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="178" y="119" font-size="14" text-anchor="middle" fill="#172b4d">可退</text><rect x="237" y="102" width="105" height="25" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="289" y="119" font-size="14" text-anchor="middle" fill="#172b4d">90%</text><text x="180" y="147" font-size="14" text-anchor="middle" fill="#172b4d">↓ 編碼器 → 來源表示 → 解碼器 ↓</text><rect x="15" y="159" width="105" height="25" rx="8" fill="#ecfdf5" stroke="#7c91aa"/><text x="67" y="176" font-size="13" text-anchor="middle" fill="#172b4d">至少提前30分鐘</text><rect x="126" y="159" width="105" height="25" rx="8" fill="#ecfdf5" stroke="#7c91aa"/><text x="178" y="176" font-size="13" text-anchor="middle" fill="#172b4d">一般退票</text><rect x="237" y="159" width="105" height="25" rx="8" fill="#ecfdf5" stroke="#7c91aa"/><text x="289" y="176" font-size="13" text-anchor="middle" fill="#172b4d">退90%</text><text x="18" y="226" font-size="16" text-anchor="start" fill="#172b4d">S2 翻譯：2 → 4 個內容詞元</text><rect x="15" y="236" width="105" height="25" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="67" y="253" font-size="14" text-anchor="middle" fill="#172b4d">我要</text><rect x="126" y="236" width="105" height="25" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="178" y="253" font-size="14" text-anchor="middle" fill="#172b4d">退票</text><text x="180" y="281" font-size="14" text-anchor="middle" fill="#172b4d">↓ 編碼器 → 來源表示 → 解碼器 ↓</text><rect x="15" y="293" width="105" height="25" rx="8" fill="#ecfdf5" stroke="#7c91aa"/><text x="67" y="310" font-size="13" text-anchor="middle" fill="#172b4d">I</text><rect x="126" y="293" width="105" height="25" rx="8" fill="#ecfdf5" stroke="#7c91aa"/><text x="178" y="310" font-size="13" text-anchor="middle" fill="#172b4d">want</text><rect x="237" y="293" width="105" height="25" rx="8" fill="#ecfdf5" stroke="#7c91aa"/><text x="289" y="310" font-size="13" text-anchor="middle" fill="#172b4d">a</text><rect x="15" y="323" width="105" height="25" rx="8" fill="#ecfdf5" stroke="#7c91aa"/><text x="67" y="340" font-size="13" text-anchor="middle" fill="#172b4d">refund</text><text x="18" y="390" font-size="16" text-anchor="start" fill="#172b4d">S3 摘要：6 → 3 個內容詞元</text><rect x="15" y="400" width="105" height="25" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="67" y="417" font-size="14" text-anchor="middle" fill="#172b4d">病假員工</text><rect x="126" y="400" width="105" height="25" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="178" y="417" font-size="14" text-anchor="middle" fill="#172b4d">已經</text><rect x="237" y="400" width="105" height="25" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="289" y="417" font-size="14" text-anchor="middle" fill="#172b4d">返工</text><rect x="15" y="430" width="105" height="25" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="67" y="447" font-size="14" text-anchor="middle" fill="#172b4d">須在2天內</text><rect x="126" y="430" width="105" height="25" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="178" y="447" font-size="14" text-anchor="middle" fill="#172b4d">補交</text><rect x="237" y="430" width="105" height="25" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="289" y="447" font-size="14" text-anchor="middle" fill="#172b4d">證明</text><text x="180" y="475" font-size="14" text-anchor="middle" fill="#172b4d">↓ 編碼器 → 來源表示 → 解碼器 ↓</text><rect x="15" y="487" width="105" height="25" rx="8" fill="#ecfdf5" stroke="#7c91aa"/><text x="67" y="504" font-size="13" text-anchor="middle" fill="#172b4d">返工後</text><rect x="126" y="487" width="105" height="25" rx="8" fill="#ecfdf5" stroke="#7c91aa"/><text x="178" y="504" font-size="13" text-anchor="middle" fill="#172b4d">2天內</text><rect x="237" y="487" width="105" height="25" rx="8" fill="#ecfdf5" stroke="#7c91aa"/><text x="289" y="504" font-size="13" text-anchor="middle" fill="#172b4d">補證明</text><text x="180" y="542" font-size="13" text-anchor="middle" fill="#172b4d">人工切詞與參考輸出；結束符號另算</text></g></svg>
