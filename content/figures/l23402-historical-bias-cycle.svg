<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-labelledby="title desc">
<title id="title">歷史制度如何進入模型</title><desc id="desc">舊制度產生核准標籤、模型重現並回到決策，需從規準與版本介入。</desc>
<rect width="360" height="480" rx="12" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#0f172a" font-size="17"><text x="18" y="32" font-size="21" font-weight="bold">歷史制度如何進入模型</text><rect x="18" y="55" width="324" height="74" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="30" y="83" font-weight="bold">舊制度可能不平等</text><text x="30" y="110" font-size="16">核准紀錄忠實反映舊規則</text><path d="M180 131v19m-5-5 5 5 5-5" fill="none" stroke="#334155" stroke-width="2"/><rect x="18" y="155" width="324" height="74" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="30" y="183" font-weight="bold">把舊決策當學習標籤</text><text x="30" y="210" font-size="16">模型重現核准，不等於學會資格</text><path d="M180 231v19m-5-5 5 5 5-5" fill="none" stroke="#334155" stroke-width="2"/><rect x="18" y="255" width="324" height="74" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="30" y="283" font-weight="bold">沿用輸出作新決策</text><text x="30" y="310" font-size="16">不利結果可能再次進入資料</text><path d="M180 331v19m-5-5 5 5 5-5" fill="none" stroke="#334155" stroke-width="2"/><rect x="18" y="355" width="324" height="74" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="30" y="383" font-weight="bold">介入：修規準、保留版本</text><text x="30" y="410" font-size="16">分開檢查舊決策與新資格證據</text><text x="18" y="462" font-size="14">教學示意：節點表示追查位置，非因果證明</text></g></svg>
