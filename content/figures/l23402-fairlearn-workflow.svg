<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 598" role="img" aria-labelledby="title desc"><title id="title">Fairlearn評估與約束訓練流程</title><desc id="desc">分群評估先找傷害，約束訓練在訓練資料上進行，驗證選擇後仍需獨立評估。；教學示意圖，非數據圖。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#215674"/></marker></defs><rect width="360" height="598" fill="#fff"/><g font-family="Microsoft JhengHei, sans-serif" fill="#173f56"><text x="180" y="26" text-anchor="middle" font-size="16">Fairlearn評估與約束訓練流程</text><rect x="40" y="48" width="280" height="76" rx="10" fill="#ecf9f2" stroke="#215674"/><text x="180" y="76" text-anchor="middle" font-size="18" font-weight="700">1. 找出傷害與群體</text><text x="180" y="102" text-anchor="middle" font-size="15">先定公平目標及接受範圍</text><path d="M180 125v23" stroke="#215674" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="152" width="280" height="76" rx="10" fill="#e7f2ff" stroke="#215674"/><text x="180" y="180" text-anchor="middle" font-size="18" font-weight="700">2. 分群評估</text><text x="180" y="206" text-anchor="middle" font-size="15">MetricFrame：總體與各群</text><path d="M180 229v23" stroke="#215674" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="256" width="280" height="76" rx="10" fill="#ecf9f2" stroke="#215674"/><text x="180" y="284" text-anchor="middle" font-size="18" font-weight="700">3. 約束重訓</text><text x="180" y="310" text-anchor="middle" font-size="15">訓練資料＋群體＋約束</text><path d="M180 333v23" stroke="#215674" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="360" width="280" height="76" rx="10" fill="#e7f2ff" stroke="#215674"/><text x="180" y="388" text-anchor="middle" font-size="18" font-weight="700">4. 驗證選擇候選</text><text x="180" y="414" text-anchor="middle" font-size="15">公平差距與預測效能並看</text><path d="M180 437v23" stroke="#215674" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="464" width="280" height="76" rx="10" fill="#ecf9f2" stroke="#215674"/><text x="180" y="492" text-anchor="middle" font-size="18" font-weight="700">5. 獨立評估再部署</text><text x="180" y="518" text-anchor="middle" font-size="15">新資料復評・保留設定</text><path d="M38 540H18V86H36" fill="none" stroke="#215674" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="180" y="582" text-anchor="middle" font-size="14">虛線：依發現回到前面重新檢查</text></g></svg>
