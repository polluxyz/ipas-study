<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 582" role="img" aria-labelledby="title desc"><title id="title">資料、重訓與回復管線</title><desc id="desc">教學示意：每個品質關卡可停止流程；回復要確認實際服務。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs><rect width="360" height="582" rx="8" fill="#fff"/><g font-family="sans-serif" fill="#172b4d"><text x="180" y="28" font-size="17" text-anchor="middle">資料、重訓與回復管線</text><rect x="20" y="55" width="320" height="64" rx="6" fill="#eff6ff" stroke="#64748b"/><text x="180" y="80" font-size="14" text-anchor="middle">警報→資料、管線、環境調查</text><text x="180" y="102" font-size="14" text-anchor="middle">可修來源：先修來源再監控</text><path d="M180,122 V144" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="152" width="320" height="64" rx="6" fill="#eff6ff" stroke="#64748b"/><text x="180" y="177" font-size="14" text-anchor="middle">回收事件ID、版本與真值</text><text x="180" y="199" font-size="14" text-anchor="middle">查時戳、重複及群體代表性</text><path d="M180,219 V241" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="249" width="320" height="64" rx="6" fill="#eff6ff" stroke="#64748b"/><text x="180" y="274" font-size="14" text-anchor="middle">標註分歧→第二人覆核</text><text x="180" y="296" font-size="14" text-anchor="middle">凍結資料版，隔離獨立EV集</text><path d="M180,316 V338" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="346" width="320" height="64" rx="6" fill="#eff6ff" stroke="#64748b"/><text x="180" y="371" font-size="14" text-anchor="middle">訓練→獨立候選驗證</text><text x="180" y="393" font-size="14" text-anchor="middle">未過：保留證據，不進發布</text><path d="M180,413 V435" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="443" width="320" height="86" rx="6" fill="#fff7ed" stroke="#64748b"/><text x="180" y="468" font-size="14" text-anchor="middle">核准→受控發布→持續監控</text><text x="180" y="490" font-size="14" text-anchor="middle">異常：相容舊版／預設邏輯</text><text x="180" y="512" font-size="14" text-anchor="middle">確認載入、路由及恢復指標</text><text x="180" y="556" font-size="12" text-anchor="middle">舊版也失效時，改人工覆核或限制服務</text></g></svg>
