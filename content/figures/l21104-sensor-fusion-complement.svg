<svg xmlns="http://www.w3.org/2000/svg" width="360" height="588" viewBox="0 0 360 588" role="img" aria-labelledby="title desc"><title id="title">感測互補與時空對齊</title><desc id="desc">攝影機、雷達與光達各有線索，經時間同步、空間座標校正、物體配對後，才融合成車道與障礙物感知。座標與細部分工為補充。</desc><style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#172033;font-size:16px} .head{font-size:19px;font-weight:700} .small{font-size:14px} .box{fill:#edf5ff;stroke:#264e7a;stroke-width:1.5} .green{fill:#e8f4ee;stroke:#286247;stroke-width:1.5} .orange{fill:#fff2df;stroke:#875d20;stroke-width:1.5} .line{fill:none;stroke:#334e68;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334e68"/></marker></defs><rect width="360" height="588" rx="12" fill="#ffffff"/><text x="180" y="30" text-anchor="middle" class="head">先互補，再確認同一事件</text><rect x="18" y="52" width="324" height="64" rx="9" class="box"/><text x="180.0" y="89.0" text-anchor="middle" class="">攝影機：車道、標誌、外觀</text><rect x="18" y="128" width="156" height="76" rx="9" class="box"/><text x="96.0" y="160.0" text-anchor="middle" class="">雷達</text><text x="96.0" y="182.0" text-anchor="middle" class="">距離、徑向速度</text><rect x="186" y="128" width="156" height="76" rx="9" class="box"/><text x="264.0" y="160.0" text-anchor="middle" class="">光達</text><text x="264.0" y="182.0" text-anchor="middle" class="">距離、空間輪廓</text><path d="M180,116 L180,224" class="line"/><path d="M96,204 L96,224" class="line"/><path d="M264,204 L264,224" class="line"/><rect x="18" y="228" width="324" height="62" rx="9" class="box"/><text x="180.0" y="253.0" text-anchor="middle" class="">時間同步</text><text x="180.0" y="275.0" text-anchor="middle" class="">時鐘、採樣率、事件時間</text><path d="M180,290 L180,310" class="line"/><rect x="18" y="314" width="324" height="70" rx="9" class="box"/><text x="180.0" y="343.0" text-anchor="middle" class="">空間校正與物體配對（補充）</text><text x="180.0" y="365.0" text-anchor="middle" class="">安裝位置／方向 → 共同座標</text><path d="M180,384 L180,404" class="line"/><rect x="18" y="408" width="324" height="64" rx="9" class="green"/><text x="180.0" y="434.0" text-anchor="middle" class="">融合模型</text><text x="180.0" y="456.0" text-anchor="middle" class="">整合相符、有效的量測</text><path d="M180,472 L180,492" class="line"/><rect x="18" y="496" width="324" height="58" rx="9" class="green"/><text x="180.0" y="530.0" text-anchor="middle" class="">車道與障礙物的環境感知</text><text x="180" y="576" text-anchor="middle" class="small">流程示意；未執行感知模型</text></svg>
