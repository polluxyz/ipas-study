<svg xmlns="http://www.w3.org/2000/svg" width="360" height="415" viewBox="0 0 360 415" role="img" aria-labelledby="title desc"><title id="title">事件時間與可用時間</title><desc id="desc">以真實時間比例畫出事件、預測截止與晚到入庫；入庫時間晚於截止點。</desc><rect width="360" height="415" fill="white"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="16" y="28" font-size="17" text-anchor="start" fill="#172b4d">晚到資料：發生在先，入庫在後</text><rect x="16" y="49" width="328" height="154" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="28" y="76" font-size="16" text-anchor="start" fill="#172b4d">10月8日的 8 次點擊</text><text x="28" y="106" font-size="16" text-anchor="start" fill="#172b4d">事件：10月8日18:00</text><text x="28" y="135" font-size="16" text-anchor="start" fill="#172b4d">截止：10月9日18:00</text><text x="28" y="164" font-size="16" text-anchor="start" fill="#172b4d">入庫：10月9日19:00</text><line x1="40" y1="249" x2="320" y2="249" stroke="#64748b" stroke-width="2" /><circle cx="40" cy="249" r="5" fill="#1456a0"/><rect x="294.2" y="244" width="10" height="10" fill="#9a3412"/><circle cx="310" cy="249" r="5" fill="#1456a0"/><text x="40" y="232" font-size="14" text-anchor="start" fill="#172b4d">發生</text><text x="270" y="227" font-size="14" text-anchor="end" fill="#172b4d">截止</text><text x="335" y="275" font-size="14" text-anchor="end" fill="#172b4d">入庫</text><line x1="299.2" y1="211" x2="299.2" y2="289" stroke="#9a3412" stroke-width="2" stroke-dasharray="4 3"/><text x="16" y="323" font-size="17" text-anchor="start" fill="#172b4d">截止點仍看不到這筆昨天值</text><text x="16" y="350" font-size="15" text-anchor="start" fill="#172b4d">→ lag1 缺值；完整 rolling3 也缺值</text><text x="16" y="380" font-size="13" text-anchor="start" fill="#172b4d">圓點＝事件／入庫；方點＝預測截止</text><text x="16" y="403" font-size="12" text-anchor="start" fill="#172b4d">資料：教學合成資料</text></g></svg>
