<svg xmlns="http://www.w3.org/2000/svg" width="360" height="490" viewBox="0 0 360 490" role="img" aria-labelledby="title desc"><title id="title">文本生成與人工驗收路徑</title><desc id="desc">先定任務與來源，再產生草稿。事實與內容檢查合格後由人工驗收，不合格返回修正。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#475569"/></marker></defs><rect width="360" height="490" rx="12" fill="#f8fafc"/><g font-family="sans-serif" font-size="15" fill="#172554"><rect x="24" y="18" width="312" height="56" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="36" y="42" font-size="15">1 定任務：對象、格式、驗收標準</text><path d="M180 74L180 91" stroke="#475569" fill="none" marker-end="url(#arrow)"/><rect x="24" y="96" width="312" height="56" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="36" y="120" font-size="15">2 備來源：時限、條件、版本</text><path d="M180 152L180 169" stroke="#475569" fill="none" marker-end="url(#arrow)"/><rect x="24" y="174" width="312" height="56" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="36" y="198" font-size="15">3 生成草稿：保留來源與候選</text><path d="M180 230L180 247" stroke="#475569" fill="none" marker-end="url(#arrow)"/><rect x="24" y="252" width="312" height="71" rx="8" fill="#fef3c7" stroke="#64748b"/><text x="36" y="276" font-size="15">4 查核：事實、完整性、不當內容</text><text x="36" y="299" font-size="15">不合格：補證據或修正後再查</text><path d="M180 323L180 340" stroke="#475569" fill="none" marker-end="url(#arrow)"/><rect x="24" y="345" width="312" height="56" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="36" y="369" font-size="15">5 人工驗收：依任務確認可用</text><path d="M180 401L180 418" stroke="#475569" fill="none" marker-end="url(#arrow)"/><rect x="24" y="423" width="312" height="48" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="36" y="447" font-size="15">6 發布與回饋：保留修正紀錄</text><path d="M336 287L350 287L350 201L336 201" stroke="#475569" fill="none" marker-end="url(#arrow)"/></g></svg>
