<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 285" role="img" aria-labelledby="title desc"><title id="title">探針位置 0、3 的注意力權重</title><desc id="desc">只抽出原句位置 0、3，並非完整四詞句的注意力子矩陣。熱圖數值由兩詞的 QK 轉置除根號二，再做逐列 Softmax 計算；右圖遮住第一列未來鍵。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#30445c"/></marker></defs><rect width="360" height="285" fill="#fff"/><g font-family="sans-serif" font-size="14" fill="#18334c"><text x="16" y="24" >探針位置 0、3 的注意力權重</text><text x="18" y="58" >兩鍵皆可讀</text><text x="53" y="82" font-size="12" text-anchor="middle">鍵0</text><text x="128" y="82" font-size="12" text-anchor="middle">鍵3</text><rect x="18" y="94" width="71" height="54" fill="rgb(178,203,255)" stroke="#536a82"/><text x="53" y="125" text-anchor="middle" font-size="13">0.6698</text><rect x="93" y="94" width="71" height="54" fill="rgb(212,227,255)" stroke="#536a82"/><text x="128" y="125" text-anchor="middle" font-size="13">0.3302</text><rect x="18" y="155" width="71" height="54" fill="rgb(212,227,255)" stroke="#536a82"/><text x="53" y="186" text-anchor="middle" font-size="13">0.3302</text><rect x="93" y="155" width="71" height="54" fill="rgb(178,203,255)" stroke="#536a82"/><text x="128" y="186" text-anchor="middle" font-size="13">0.6698</text><text x="192" y="58" >因果遮罩</text><text x="227" y="82" font-size="12" text-anchor="middle">鍵0</text><text x="302" y="82" font-size="12" text-anchor="middle">鍵3</text><rect x="192" y="94" width="71" height="54" fill="rgb(145,180,255)" stroke="#536a82"/><text x="227" y="125" text-anchor="middle" font-size="13">1.0000</text><rect x="267" y="94" width="71" height="54" fill="#eee" stroke="#536a82"/><text x="302" y="125" text-anchor="middle" font-size="13">0.0000</text><rect x="192" y="155" width="71" height="54" fill="rgb(212,227,255)" stroke="#536a82"/><text x="227" y="186" text-anchor="middle" font-size="13">0.3302</text><rect x="267" y="155" width="71" height="54" fill="rgb(178,203,255)" stroke="#536a82"/><text x="302" y="186" text-anchor="middle" font-size="13">0.6698</text><text x="18" y="245" >列順序：查詢位置 0、3；每列和為 1</text><text x="16" y="273" font-size="12">教學合成資料／示意圖</text></g></svg>
