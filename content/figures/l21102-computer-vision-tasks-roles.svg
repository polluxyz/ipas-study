<svg xmlns="http://www.w3.org/2000/svg" width="360" height="550" viewBox="0 0 360 550" role="img" aria-labelledby="t d"><title id="t">三類技術的角色</title><desc id="d">影像處理改像素；機器學習用資料調整規則或表示；模式辨識產生類別與位置。順序是教學概括，深度模型可合併特徵與辨識。</desc><rect width="360" height="550" fill="#ffffff"/><g font-family="sans-serif" fill="#172033"><text x="16" y="28" font-size="15">從影像到可用的判斷</text><rect x="22" y="50" width="316" height="68" fill="#eef6fa" rx="8" stroke="#4b6478"/><text x="36" y="75" font-size="17">輸入影像</text><text x="36" y="99" font-size="14">T01：8 × 6 RGB</text><text x="171" y="138" font-size="20">↓</text><rect x="22" y="145" width="316" height="68" fill="#eef6fa" rx="8" stroke="#4b6478"/><text x="36" y="170" font-size="17">影像處理</text><text x="36" y="194" font-size="14">去雜訊、調整亮度 → 影像</text><text x="171" y="233" font-size="20">↓</text><rect x="22" y="240" width="316" height="68" fill="#eef6fa" rx="8" stroke="#4b6478"/><text x="36" y="265" font-size="17">特徵與學習</text><text x="36" y="289" font-size="14">人工設計，或由模型學習特徵</text><text x="171" y="328" font-size="20">↓</text><rect x="22" y="335" width="316" height="68" fill="#eef6fa" rx="8" stroke="#4b6478"/><text x="36" y="360" font-size="17">模式辨識</text><text x="36" y="384" font-size="14">依特徵判類／定位 → 標記</text><text x="171" y="423" font-size="20">↓</text><rect x="22" y="430" width="316" height="68" fill="#eef6fa" rx="8" stroke="#4b6478"/><text x="36" y="455" font-size="17">應用決策</text><text x="36" y="479" font-size="14">例如發出行人接近提醒</text><text x="16" y="540" font-size="14">示意流程；深度模型可合併中間步驟</text></g></svg>
