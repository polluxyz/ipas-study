<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1025" width="360" height="1025" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">補值、縮放、PCA、LDA 的擬合邊界</title><desc id="desc">錯誤以全部十二列擬合；正確只用第一摺八列訓練 X，以及 LDA 所需訓練 y。四列驗證只能轉換與評分。圖中參數來自本批 fold-boundaries JSON。</desc>
<style>:root{color-scheme:light dark;--bg:#fbfcfe;--ink:#203548;--muted:#486174;--train:#08665f;--trainbg:#eaf5f1;--val:#a14d0e;--valbg:#fff2df;--bad:#a72840;--badbg:#fff0f2;--line:#8ba0af}
@media(prefers-color-scheme:dark){:root{--bg:#16242e;--ink:#ecf2f6;--muted:#bdcdd8;--train:#83ded0;--trainbg:#203d3b;--val:#ffd198;--valbg:#463426;--bad:#ffabc0;--badbg:#442c35;--line:#93a6b4}}
text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:var(--ink);font-size:16px}.head{font-size:21px;font-weight:700}.strong{font-weight:700}.small{font-size:15px}.muted{fill:var(--muted)}.box{fill:var(--bg);stroke:var(--line);stroke-width:1.3}.train{fill:var(--trainbg);stroke:var(--train);stroke-width:1.5}.val{fill:var(--valbg);stroke:var(--val);stroke-width:1.5;stroke-dasharray:5 3}.bad{fill:var(--badbg);stroke:var(--bad);stroke-width:1.5;stroke-dasharray:2 3}.arrow{stroke:var(--muted);stroke-width:1.8;fill:none;marker-end:url(#arrow)}.rule{stroke:var(--line);stroke-width:1}</style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--muted)"/></marker></defs>
<rect width="360" height="1025" rx="10" fill="var(--bg)"/><text x="18" y="32" class="head">四種轉換，同一條訓練邊界</text><text x="18" y="59" class="small muted">教學合成設備資料｜索引由 0 起</text><rect x="12" y="77" width="336" height="111" rx="8" class="bad"/><text x="24" y="102" class="strong">× 錯誤：先用全部 12 列 fit</text><text x="24" y="128" class="">補值、縮放、PCA：讀全部 X</text><text x="24" y="154" class="">LDA：還讀全部 y</text><text x="24" y="179" class="">驗證資訊已進入學得參數</text><text x="18" y="220" class="strong">✓ 正確：先固定第一摺</text><rect x="12" y="238" width="336" height="98" rx="8" class="train"/><text x="24" y="265" class="strong">訓練 X、y：8 列</text><text x="24" y="292" class="">0, 1, 2, 4, 6, 7, 10, 11</text><text x="24" y="320" class="">只有這些索引可以參與 fit</text><path d="M180 341V364" class="arrow"/><rect x="12" y="373" width="336" height="102" rx="8" class="train"/><text x="24" y="400" class="strong">① 補值 → ② 縮放</text><text x="24" y="427" class="">③ PCA（X）或 LDA（X、y）</text><text x="24" y="454" class="">④ 分類器：使用訓練 X、y</text><text x="18" y="511" class="strong">第一摺學得的參數</text><rect x="12" y="532" width="336" height="60" rx="8" class="box"/><text x="24" y="555" class="strong">補值平均</text><text x="24" y="580" class="">7.250 / 17.500 / 5.000</text><rect x="12" y="600" width="336" height="60" rx="8" class="box"/><text x="24" y="623" class="strong">縮放尺度</text><text x="24" y="648" class="">5.379 / 6.240 / 2.915</text><rect x="12" y="668" width="336" height="60" rx="8" class="box"/><text x="24" y="691" class="strong">PCA 主方向</text><text x="24" y="716" class="">0.606 / 0.607 / 0.515</text><rect x="12" y="736" width="336" height="60" rx="8" class="box"/><text x="24" y="759" class="strong">LDA 判別方向</text><text x="24" y="784" class="">1.803 / -0.155 / 1.860</text><rect x="12" y="821" width="336" height="120" rx="8" class="val"/><text x="24" y="849" class="strong">驗證 X：4 列，只能 transform</text><text x="24" y="877" class="">3, 5, 8, 9</text><text x="24" y="903" class="">沿用補值 → 尺度 → 固定方向</text><text x="24" y="928" class="">再 predict；驗證 y 只評分</text><text x="18" y="973" class="strong">PCA 不讀 y，也不能看驗證 X。</text><text x="18" y="1001" class="small muted">方向值相對各流程的標準化座標。</text></svg>
