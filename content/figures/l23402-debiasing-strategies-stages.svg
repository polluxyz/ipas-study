<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 730" width="360" height="730" role="img" aria-labelledby="title desc"><title id="title">依操作條件選三階段介入</title><desc id="desc">教學示意。可重訓時，前處理與訓練中是平行選項，不是必須依序執行。不能重訓時，先查推論可否取得群體，再判斷分群閾值；所有分支都回到分群復評。</desc><defs><marker id="arrow" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="360" height="730" fill="#fff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#172d43"><text x="180" y="28" font-size="16" text-anchor="middle">先診斷：選取率、TPR、FPR</text><rect x="70" y="48" width="220" height="48" rx="8" fill="#edf4ff" stroke="#35659b"/><text x="180" y="72" font-size="14" text-anchor="middle">能否重訓模型？</text><path d="M120,96 L120,156" fill="none" stroke="#52657a" stroke-width="2" /><text x="141" y="127" font-size="14" text-anchor="start">可以</text><path d="M60,156 L180,156" fill="none" stroke="#52657a" stroke-width="2" /><path d="M60,156 L60,190" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/><path d="M180,156 L180,190" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/><path d="M270,96 L296,132" fill="none" stroke="#52657a" stroke-width="2" /><text x="296" y="157" font-size="14" text-anchor="middle">不可以</text><path d="M296,164 L296,190" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/><rect x="8" y="190" width="105" height="110" rx="8" fill="#edf4ff" stroke="#35659b"/><text x="60.5" y="214" font-size="14" text-anchor="middle">可改資料</text><text x="60.5" y="236" font-size="14" text-anchor="middle">前處理</text><text x="60.5" y="258" font-size="14" text-anchor="middle">抽樣／特徵</text><text x="60.5" y="280" font-size="14" text-anchor="middle">固定權重</text><rect x="127" y="190" width="105" height="110" rx="8" fill="#edf4ff" stroke="#35659b"/><text x="179.5" y="214" font-size="14" text-anchor="middle">可改目標</text><text x="179.5" y="236" font-size="14" text-anchor="middle">訓練中</text><text x="179.5" y="258" font-size="14" text-anchor="middle">約束／對抗</text><rect x="244" y="190" width="108" height="110" rx="8" fill="#edf4ff" stroke="#35659b"/><text x="298" y="214" font-size="14" text-anchor="middle">固定模型</text><text x="298" y="236" font-size="14" text-anchor="middle">後處理</text><text x="298" y="258" font-size="14" text-anchor="middle">先查群體欄</text><path d="M298,300 L298,325" fill="none" stroke="#52657a" stroke-width="2" /><path d="M280,325 L357,325" fill="none" stroke="#52657a" stroke-width="2" /><path d="M280,325 L280,350" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/><path d="M357,325 L357,505" fill="none" stroke="#52657a" stroke-width="2" /><path d="M357,505 L352,505" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/><rect x="235" y="350" width="117" height="80" rx="8" fill="#edf4ff" stroke="#35659b"/><text x="293.5" y="374" font-size="14" text-anchor="middle">可取得群體</text><text x="293.5" y="396" font-size="14" text-anchor="middle">分群閾值</text><text x="293.5" y="418" font-size="14" text-anchor="middle">可評估</text><rect x="235" y="465" width="117" height="80" rx="8" fill="#fff2e3" stroke="#35659b"/><text x="293.5" y="489" font-size="14" text-anchor="middle">無群體欄</text><text x="293.5" y="511" font-size="14" text-anchor="middle">分群閾值</text><text x="293.5" y="533" font-size="14" text-anchor="middle">無法直接用</text><path d="M60,300 L60,588" fill="none" stroke="#52657a" stroke-width="2" /><path d="M180,300 L180,588" fill="none" stroke="#52657a" stroke-width="2" /><path d="M235,390 L222,390" fill="none" stroke="#52657a" stroke-width="2" /><path d="M222,390 L222,588" fill="none" stroke="#52657a" stroke-width="2" /><path d="M294,545 L294,588" fill="none" stroke="#52657a" stroke-width="2" /><path d="M60,588 L294,588" fill="none" stroke="#52657a" stroke-width="2" /><path d="M180,588 L180,620" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="620" width="310" height="69" rx="8" fill="#edf4ff" stroke="#35659b"/><text x="180" y="644" font-size="14" text-anchor="middle">所有分支都回到分群復評</text><text x="180" y="666" font-size="14" text-anchor="middle">固定資料與版本，每次先只改一項</text><text x="180" y="715" font-size="12" text-anchor="middle">教學示意；群體差距不能直接推得因果</text></g></svg>
