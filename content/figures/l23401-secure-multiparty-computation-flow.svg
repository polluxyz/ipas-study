<svg xmlns="http://www.w3.org/2000/svg" width="360" height="574" viewBox="0 0 360 574" role="img" aria-labelledby="title desc"><title id="title">多方計算與信任假設</title><desc id="desc">教學合成流程。甲、乙、丙各持私人輸入；各方轉為受協議保護的訊息；多方交換份額或其他協議訊息；共同計算約定的總和；只向指定接收者重建結果。原始列不集中；每方只見授權的協議視圖；保護取決於串通與攻擊模型；不是寄出全部明文再相加；結果本身可能洩漏資訊。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker></defs><rect width="360" height="574" fill="#ffffff"/><g fill="#0f172a" font-family="sans-serif"><text x="180" y="30" text-anchor="middle" font-size="19" font-weight="bold">多方計算與信任假設</text><rect x="14" y="54" width="332" height="72" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="81" text-anchor="middle" font-size="15">甲、乙、丙各持私人輸入</text><text x="180" y="106" text-anchor="middle" font-size="13">原始列不集中</text><path d="M180 128v23" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="155" width="332" height="72" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="182" text-anchor="middle" font-size="15">各方轉為受協議保護的訊息</text><text x="180" y="207" text-anchor="middle" font-size="13">每方只見授權的協議視圖</text><path d="M180 229v23" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="256" width="332" height="72" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="283" text-anchor="middle" font-size="15">多方交換份額或其他協議訊息</text><text x="180" y="308" text-anchor="middle" font-size="13">保護取決於串通與攻擊模型</text><path d="M180 330v23" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="357" width="332" height="72" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="384" text-anchor="middle" font-size="15">共同計算約定的總和</text><text x="180" y="409" text-anchor="middle" font-size="13">不是寄出全部明文再相加</text><path d="M180 431v23" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="458" width="332" height="72" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="485" text-anchor="middle" font-size="15">只向指定接收者重建結果</text><text x="180" y="510" text-anchor="middle" font-size="13">結果本身可能洩漏資訊</text></g><text x="180" y="565" text-anchor="middle" fill="#334155" font-size="12">教學示意；不代表已部署或驗證安全協議</text></svg>
