<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 550" role="img"><title>從症狀選擇模型優化方向</title><desc>先排除資料與評估錯誤，再分辨泛化不足、訓練不穩與部署資源不足。每條路都要重驗預測品質及資源限制，不能只憑單次分數診斷。</desc><rect width="360" height="550" fill="#fff"/><g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#182a3a"><g fill="#e8f2fa" stroke="#52677a"><rect x="25" y="14" width="310" height="65" rx="8"/><rect x="25" y="114" width="310" height="78" rx="8"/><rect x="25" y="220" width="310" height="78" rx="8"/><rect x="25" y="326" width="310" height="78" rx="8"/><rect x="25" y="444" width="310" height="82" rx="8"/></g><text x="180" y="40">先查資料分割、標籤與指標</text><text x="180" y="63">記錄症狀與資源門檻</text><text x="180" y="138">① 訓練好，驗證差</text><text x="180" y="163">查泛化 → 正則化、增強</text><text x="180" y="184" font-size="13">風險：限制過強、破壞標籤</text><text x="180" y="244">② 損失震盪或不收斂</text><text x="180" y="269">查訓練 → 學習率、優化器</text><text x="180" y="290" font-size="13">風險：步長太小、成本增加</text><text x="180" y="350">③ 品質達標，延遲或記憶體超標</text><text x="180" y="375">查部署 → 壓縮、加速</text><text x="180" y="396" font-size="13">風險：精度下降、硬體不支援</text><text x="180" y="470">三條是診斷分支，並非必做順序</text><text x="180" y="493">每次改動後：同條件重新驗證</text><text x="180" y="516" font-size="13">記錄品質、耗時、大小與副作用</text><path d="M180 79v18H12v268h13m-6-6 6 6-6 6M12 150h13m-6-6 6 6-6 6M12 256h13m-6-6 6 6-6 6M335 150h17v285H180v9m-6-6 6 6 6-6M335 260h17M335 365h17" fill="none" stroke="#52677a" stroke-width="2"/></g></svg>
