<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430" role="img" aria-labelledby="title desc"><title id="title">子詞組合</title><desc id="desc">教學合成資料：固定邊界與 n=3，完整三段子詞共同組合向量。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs><rect width="360" height="430" fill="#ffffff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#172b4d"><text x="180" y="32" font-size="16" text-anchor="middle">未登錄詞：固定字元 n=3</text><rect x="70" y="52" width="220" height="44" rx="8" fill="#eef4ff" stroke="#536683"/><text x="180" y="80" font-size="16" text-anchor="middle">&lt;霧嶼坪&gt;</text><path d="M180 99 L180 125" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="145" width="150" height="40" rx="8" fill="#eef4ff" stroke="#536683"/><text x="93" y="171" font-size="16" text-anchor="middle">&lt;霧嶼</text><rect x="190" y="145" width="152" height="40" rx="8" fill="#eef4ff" stroke="#536683"/><text x="266" y="171" font-size="16" text-anchor="middle">向量 (1,0)</text><path d="M170 165 L186 165" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="199" width="150" height="40" rx="8" fill="#eef4ff" stroke="#536683"/><text x="93" y="225" font-size="16" text-anchor="middle">霧嶼坪</text><rect x="190" y="199" width="152" height="40" rx="8" fill="#eef4ff" stroke="#536683"/><text x="266" y="225" font-size="16" text-anchor="middle">向量 (0,2)</text><path d="M170 219 L186 219" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="253" width="150" height="40" rx="8" fill="#eef4ff" stroke="#536683"/><text x="93" y="279" font-size="16" text-anchor="middle">嶼坪&gt;</text><rect x="190" y="253" width="152" height="40" rx="8" fill="#eef4ff" stroke="#536683"/><text x="266" y="279" font-size="16" text-anchor="middle">向量 (2,1)</text><path d="M170 273 L186 273" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 303 L180 333" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="343" width="270" height="44" rx="8" fill="#e4f5eb" stroke="#536683"/><text x="180" y="371" font-size="15" text-anchor="middle">加總 (3,3) → 平均 (1,1)</text><text x="180" y="414" font-size="14" text-anchor="middle">教學手設向量；子詞不必是語素</text></g></svg>
