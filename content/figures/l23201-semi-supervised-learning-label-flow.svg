<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 700" role="img"><title>半監督的標籤資料流</title><desc>教學合成資料：24 筆人工標籤建立基準，48 筆未知樣本提供特徵；偽標籤須篩選查核，24 筆驗證與24筆測試不回流。</desc><rect width="360" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#34445a"/></marker></defs><g font-family="sans-serif" font-size="15" fill="#172238"><text x="180" y="25" text-anchor="middle">教學合成：72 筆訓練池</text><rect x="30" y="45" width="300" height="66" rx="8" fill="#e8f3fa" stroke="#52677b"/><text x="180" y="71" text-anchor="middle">24 筆有標籤 → 初始模型</text><text x="180" y="93" text-anchor="middle">只用這部分訓練＝監督式基準</text><path d="M180 111V140" stroke="#34445a" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="145" width="300" height="66" rx="8" fill="#e8f3fa" stroke="#52677b"/><text x="180" y="171" text-anchor="middle">48 筆未標籤：只讀特徵</text><text x="180" y="193" text-anchor="middle">模型提出候選類別與信心</text><path d="M180 211V240" stroke="#34445a" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="245" width="300" height="66" rx="8" fill="#fff0dc" stroke="#52677b"/><text x="180" y="271" text-anchor="middle">篩選與人工抽查</text><text x="180" y="293" text-anchor="middle">低信心先保留，錯誤需修正</text><path d="M180 311V340" stroke="#34445a" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="345" width="300" height="66" rx="8" fill="#e8f3fa" stroke="#52677b"/><text x="180" y="371" text-anchor="middle">人工標籤＋選取的偽標籤</text><text x="180" y="393" text-anchor="middle">重新訓練，保留每筆來源</text><path d="M330 378H346V177H332" fill="none" stroke="#34445a" stroke-dasharray="5 3" marker-end="url(#arrow)"/><path d="M180 411V440" stroke="#34445a" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="445" width="300" height="66" rx="8" fill="#e8f3fa" stroke="#52677b"/><text x="180" y="471" text-anchor="middle">24 筆驗證獨立保留</text><text x="180" y="493" text-anchor="middle">比較基準；答案不回流</text><path d="M180 511V540" stroke="#34445a" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="545" width="300" height="66" rx="8" fill="#e8f3fa" stroke="#52677b"/><text x="180" y="571" text-anchor="middle">鎖定後才用 24 筆測試</text><text x="180" y="593" text-anchor="middle">不能拿測試標籤選偽標籤</text><text x="180" y="645" text-anchor="middle">虛線：可重複；不是保證改善</text><text x="180" y="671" text-anchor="middle">半監督：同時利用兩類訓練資料</text></g></svg>
