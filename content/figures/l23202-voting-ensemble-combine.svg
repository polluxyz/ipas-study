<svg xmlns="http://www.w3.org/2000/svg" width="360" height="365" viewBox="0 0 360 365" role="img" aria-labelledby="title desc"><title id="title">相同預測，不同整合順序</title><desc id="desc">三個模型的輸出，硬投票先取類別；軟投票先平均每類機率，再取最大類。</desc><rect width="360" height="365" fill="#fff"/><g fill="#16283a" font-family="sans-serif"><text x="180" y="27" font-size="17" text-anchor="middle">相同預測，不同整合順序</text><rect x="45" y="48" width="270" height="40" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="73" font-size="15" text-anchor="middle">甲、乙、丙的各類機率</text><path d="M180 88L90 121" stroke="#526577" stroke-width="2" fill="none"/><path d="M180 88L270 121" stroke="#526577" stroke-width="2" fill="none"/><rect x="15" y="121" width="150" height="42" rx="8" fill="#edf3fa" stroke="#526577"/><text x="90" y="147" font-size="15" text-anchor="middle">先各取最大類</text><rect x="195" y="121" width="150" height="42" rx="8" fill="#edf3fa" stroke="#526577"/><text x="270" y="147" font-size="15" text-anchor="middle">先平均每類機率</text><path d="M90 163L90 198" stroke="#526577" stroke-width="2" fill="none"/><path d="M270 163L270 198" stroke="#526577" stroke-width="2" fill="none"/><rect x="15" y="198" width="150" height="42" rx="8" fill="#edf3fa" stroke="#526577"/><text x="90" y="224" font-size="15" text-anchor="middle">類別票加總</text><rect x="195" y="198" width="150" height="42" rx="8" fill="#edf3fa" stroke="#526577"/><text x="270" y="224" font-size="15" text-anchor="middle">再取最大類</text><text x="90" y="275" font-size="16" text-anchor="middle">硬投票</text><text x="270" y="275" font-size="16" text-anchor="middle">軟投票</text><text x="180" y="317" font-size="14" text-anchor="middle">硬票也可以先指定模型權重</text><text x="180" y="352" font-size="12" text-anchor="middle">教學合成資料／流程示意</text></g></svg>
