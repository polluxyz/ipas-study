<svg xmlns="http://www.w3.org/2000/svg" width="360" height="674" viewBox="0 0 360 674" role="img" aria-labelledby="title desc"><title id="title">語音辨識到理解、任務及合成</title><desc id="desc">語音波形經 ASR 變文字，NLU 取意圖與參數，任務層查資料與形成回覆，TTS 輸出語音。Whisper 位於辨識端，翻譯依需求放在文字鏈上。</desc><style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#172033;font-size:16px} .head{font-size:19px;font-weight:700} .small{font-size:14px} .box{fill:#edf5ff;stroke:#264e7a;stroke-width:1.5} .green{fill:#e8f4ee;stroke:#286247;stroke-width:1.5} .orange{fill:#fff2df;stroke:#875d20;stroke-width:1.5} .line{fill:none;stroke:#334e68;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334e68"/></marker></defs><rect width="360" height="674" rx="12" fill="#ffffff"/><text x="180" y="28" text-anchor="middle" class="head">每一段都有不同輸入輸出</text><rect x="18" y="50" width="324" height="54" rx="9" class="box"/><text x="180.0" y="82.0" text-anchor="middle" class="">使用者語音：音訊波形</text><path d="M180,104 L180,124" class="line"/><rect x="18" y="128" width="324" height="62" rx="9" class="box"/><text x="180.0" y="153.0" text-anchor="middle" class="">ASR 辨識（例如 Whisper）</text><text x="180.0" y="175.0" text-anchor="middle" class="">音訊 → 轉寫文字</text><path d="M180,190 L180,210" class="line"/><rect x="18" y="214" width="324" height="62" rx="9" class="box"/><text x="180.0" y="239.0" text-anchor="middle" class="">NLU 理解</text><text x="180.0" y="261.0" text-anchor="middle" class="">文字 → 意圖、地點、日期</text><path d="M180,276 L180,296" class="line"/><rect x="18" y="300" width="324" height="70" rx="9" class="box"/><text x="180.0" y="329.0" text-anchor="middle" class="">任務層查詢／執行</text><text x="180.0" y="351.0" text-anchor="middle" class="">依結果形成回覆文字</text><path d="M180,370 L180,390" class="line"/><rect x="18" y="394" width="324" height="62" rx="9" class="box"/><text x="180.0" y="419.0" text-anchor="middle" class="">需要跨語言時：文字翻譯</text><text x="180.0" y="441.0" text-anchor="middle" class="">保留地名、日期與原意</text><path d="M180,456 L180,476" class="line"/><rect x="18" y="480" width="324" height="62" rx="9" class="box"/><text x="180.0" y="505.0" text-anchor="middle" class="">TTS 合成</text><text x="180.0" y="527.0" text-anchor="middle" class="">回覆文字 → 可播放音訊</text><path d="M180,542 L180,562" class="line"/><rect x="18" y="566" width="324" height="54" rx="9" class="green"/><text x="180.0" y="598.0" text-anchor="middle" class="">使用者收到語音回應</text><text x="180" y="646" text-anchor="middle" class="small">辨識錯字可能沿後續模組傳遞</text></svg>
