<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 355" role="img"><title>Softmax 與逐項 Sigmoid</title><desc>客服同一列的三類分數，Softmax 總和一，逐項 Sigmoid 不受此限制。</desc><rect width="360" height="355" fill="#fff"/><g font-family="sans-serif"><text x="16" y="25" font-size="17" fill="#17243a">同一筆客服訊息：類別軸的差異</text><text x="18" y="50" font-size="13" fill="#17243a">輸入分數：-1、0、1</text><text x="16" y="90" font-size="13" fill="#17243a">查詢</text><rect x="66" y="75" width="18.00611463407609" height="16" fill="#175e9c"/><text x="270" y="90" font-size="13" fill="#17243a">0.0900</text><rect x="66" y="97" width="53.78828427399902" height="10" fill="#b66c29"/><text x="16" y="155" font-size="13" fill="#17243a">退款</text><rect x="66" y="140" width="48.94569421095953" height="16" fill="#175e9c"/><text x="270" y="155" font-size="13" fill="#17243a">0.2447</text><rect x="66" y="162" width="100" height="10" fill="#b66c29"/><text x="16" y="220" font-size="13" fill="#17243a">變更</text><rect x="66" y="205" width="133.04819115496434" height="16" fill="#175e9c"/><text x="270" y="220" font-size="13" fill="#17243a">0.6652</text><rect x="66" y="227" width="146.211715726001" height="10" fill="#b66c29"/><text x="18" y="292" font-size="13" fill="#17243a">粗條：Softmax，總和 1.0000</text><text x="18" y="314" font-size="13" fill="#17243a">細條：逐項 Sigmoid，總和 1.5000</text><text x="18" y="337" font-size="12" fill="#17243a">長條長度表示機率；同一類別軸比較。</text></g></svg>
