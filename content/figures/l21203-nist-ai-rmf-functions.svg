<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 477" width="360" height="477" role="img" aria-labelledby="title desc"><title id="title">NIST AI RMF四功能關係</title><desc id="desc">Govern包住Map、Measure、Manage。雙向箭頭及回路表示可反覆回饋，並非只走一次的線性階段。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#324f69"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8" fill="#324f69"/></marker></defs><rect width="360" height="477" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="180" y="26" font-size="18" text-anchor="middle" fill="#162b42">四功能持續互相回饋</text><rect x="14" y="47" width="332" height="383" rx="14" fill="#f2f6fa" stroke="#355b7b" stroke-width="2"/><text x="180" y="75" font-size="16" text-anchor="middle" fill="#162b42">Govern：權責、政策與容忍度</text><rect x="58" y="100" width="244" height="68" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="180" y="123" font-size="15" text-anchor="middle" fill="#162b42">Map：辨識使用情境</text><text x="180" y="145" font-size="15" text-anchor="middle" fill="#162b42">用途、影響群體與限制</text><path d="M180,175 L180,198" stroke="#324f69" stroke-width="2" fill="none" marker-end="url(#a)" marker-start="url(#b)"/><rect x="58" y="207" width="244" height="68" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="180" y="230" font-size="15" text-anchor="middle" fill="#162b42">Measure：提出證據</text><text x="180" y="252" font-size="15" text-anchor="middle" fill="#162b42">測試、監測與不確定性</text><path d="M180,282 L180,305" stroke="#324f69" stroke-width="2" fill="none" marker-end="url(#a)" marker-start="url(#b)"/><rect x="58" y="314" width="244" height="68" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="180" y="337" font-size="15" text-anchor="middle" fill="#162b42">Manage：投入資源處置</text><text x="180" y="359" font-size="15" text-anchor="middle" fill="#162b42">限制、停用、復原與溝通</text><path d="M58,348 L36,348 L36,133 L56,133" stroke="#324f69" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="180" y="413" font-size="13" text-anchor="middle" fill="#162b42">Govern 貫穿，其他功能可回頭重做</text><text x="180" y="455" font-size="13" text-anchor="middle" fill="#162b42">自願框架；不是一次性的檢查清單</text></g></svg>
