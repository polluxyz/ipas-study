<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 518" role="img" aria-labelledby="title desc"><title id="title">單體與服務拆分</title><desc id="desc">單體一起發布；拆分後特徵、推論、流程服務各自部署。故障隔離仍需逾時、替代結果與非同步安排。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#285177"/></marker></defs><rect width="360" height="518" fill="white"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="16" fill="#172d43"><text x="180" y="30" text-anchor="middle" font-weight="700">單體與服務拆分</text><text x="180" y="50" text-anchor="middle" font-size="12">示意圖</text><text x="180" y="70" text-anchor="middle" font-weight="700">單體：共同部署單位</text><rect x="30" y="90" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="114" text-anchor="middle"><tspan x="180" dy="0">特徵＋推論＋促銷流程</tspan><tspan x="180" dy="22">修改推論時，一起驗證發布</tspan></text><text x="180" y="192" text-anchor="middle" font-weight="700">微服務：依責任分開部署</text><rect x="30" y="212" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="236" text-anchor="middle"><tspan x="180" dy="0">特徵服務</tspan><tspan x="180" dy="22">獨立維護 f1 與資料介面</tspan></text><path d="M180 272 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="298" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="322" text-anchor="middle"><tspan x="180" dy="0">推論服務</tspan><tspan x="180" dy="22">獨立更新 rec-v2，依流量擴展</tspan></text><path d="M180 358 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="384" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="408" text-anchor="middle"><tspan x="180" dy="0">企業流程服務</tspan><tspan x="180" dy="22">CRM／MES 失效時暫存待處理</tspan></text><text x="180" y="466" text-anchor="middle" font-size="14">服務間經 API／事件連接；仍會互相影響</text></g></svg>
