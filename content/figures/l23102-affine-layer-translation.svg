<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img" aria-labelledby="t d"><title id="t">偏差讓原點平移</title><desc id="d">教學合成幾何。A=diag(2,1)。上圖線性縮放後原點不動，下圖另加偏差(2,1)，整個矩形與原點都移動。黑點是輸入(1,1)的輸出。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#087f8c"/></marker></defs><rect width="360" height="500" fill="#fff"/><g font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#172b4d"><text x="15" y="27" font-size="16">相同縮放，再比較有無偏差</text><text x="16" y="58" font-size="15">線性：Ax，原點不動</text><line x1="25" y1="203" x2="330" y2="203" stroke="#a5afb9" stroke-width="1.5"  /><line x1="50" y1="221" x2="50" y2="78" stroke="#a5afb9" stroke-width="1.5"  /><polyline points="50,203 138,203 138,159 50,159 50,203" fill="none" stroke="#087f8c" stroke-width="2.5"/><circle cx="50" cy="203" r="4" fill="#172b4d"/><text x="38" y="223" font-size="14">O</text><text x="63" y="195" font-size="14">零輸入→零輸出</text><circle cx="138" cy="159" r="5" fill="#172b4d"/><text x="145" y="154" font-size="14">(2,1)</text><text x="16" y="283" font-size="15">仿射：Ax+b，b=(2,1)</text><line x1="25" y1="428" x2="330" y2="428" stroke="#a5afb9" stroke-width="1.5"  /><line x1="50" y1="446" x2="50" y2="303" stroke="#a5afb9" stroke-width="1.5"  /><polyline points="138,384 226,384 226,340 138,340 138,384" fill="none" stroke="#087f8c" stroke-width="2.5"/><circle cx="50" cy="428" r="4" fill="#172b4d"/><text x="38" y="448" font-size="14">O</text><line x1="50" y1="428" x2="138" y2="384" stroke="#087f8c" stroke-width="3" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="145" y="404" font-size="14">原點的輸出 b</text><circle cx="226" cy="340" r="5" fill="#172b4d"/><text x="233" y="335" font-size="14">(4,2)</text></g></svg>