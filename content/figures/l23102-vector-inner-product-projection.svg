<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 315" role="img" aria-labelledby="t d"><title id="t">內積與水平投影</title><desc id="d">教學合成座標。u=(3,4)，水平單位向量 e=(1,0)，投影為 (3,0)，原向量長5、投影長3。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#087f8c"/></marker></defs><rect width="360" height="315" fill="#fff"/><g font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#172b4d"><text x="18" y="26" font-size="16">內積看指定方向，長度看整支箭頭</text><line x1="45" y1="255" x2="320" y2="255" stroke="#a5afb9" stroke-width="1.5"  /><line x1="45" y1="270" x2="45" y2="42" stroke="#a5afb9" stroke-width="1.5"  /><text x="312" y="277" font-size="14">x</text><text x="24" y="47" font-size="14">y</text><line x1="45" y1="255" x2="180" y2="75" stroke="#087f8c" stroke-width="3"  marker-end="url(#arrow)"/><line x1="180" y1="75" x2="180" y2="255" stroke="#596b80" stroke-width="1.5" stroke-dasharray="5 4" /><line x1="45" y1="255" x2="180" y2="255" stroke="#087f8c" stroke-width="3"  marker-end="url(#arrow)"/><text x="194" y="78" font-size="14">u=(3,4)</text><text x="194" y="101" font-size="14">長度 5</text><text x="85" y="243" font-size="14">投影=(3,0)</text><text x="28" y="277" font-size="14">O</text><line x1="90" y1="251" x2="90" y2="259" stroke="#a5afb9" stroke-width="1.5"  /><text x="85" y="277" font-size="14">1</text><line x1="180" y1="251" x2="180" y2="259" stroke="#a5afb9" stroke-width="1.5"  /><text x="175" y="277" font-size="14">3</text><line x1="41" y1="210" x2="49" y2="210" stroke="#a5afb9" stroke-width="1.5"  /><text x="25" y="215" font-size="14">1</text><line x1="41" y1="75" x2="49" y2="75" stroke="#a5afb9" stroke-width="1.5"  /><text x="25" y="80" font-size="14">4</text><text x="14" y="307" font-size="14">座標無單位；e=(1,0)，內積為 3</text></g></svg>