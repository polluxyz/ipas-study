<svg xmlns="http://www.w3.org/2000/svg" width="360" height="395" viewBox="0 0 360 395" role="img" aria-labelledby="title desc"><title id="title">相同稀疏程度的錯誤聚焦反例</title><desc id="desc">同一值序列，原第四列輸出2.08，保留最大格後輸出8，誤留第一格輸出0；所有數值從 JSON 算出。</desc><rect width="360" height="395" fill="#fff"/><g font-family="sans-serif"><text x="180" y="26" font-size="20" text-anchor="middle" fill="#172b4d">稀疏，不等於選對位置</text><text x="180" y="52" font-size="15" text-anchor="middle" fill="#172b4d">共同值：[0, 0, 0, 8]</text><rect x="20" y="70" width="320" height="80" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="33" y="92" font-size="16" text-anchor="start" fill="#172b4d">原第4列</text><text x="33" y="115" font-size="13" text-anchor="start" fill="#172b4d">權重：[0.25, 0.24, 0.25, 0.26]</text><text x="33" y="136" font-size="15" text-anchor="start" fill="#172b4d">非零格 4；加權輸出 2.08</text><rect x="20" y="166" width="320" height="80" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="33" y="188" font-size="16" text-anchor="start" fill="#172b4d">保留最大格</text><text x="33" y="211" font-size="13" text-anchor="start" fill="#172b4d">權重：[0, 0, 0, 1]</text><text x="33" y="232" font-size="15" text-anchor="start" fill="#172b4d">非零格 1；加權輸出 8</text><rect x="20" y="262" width="320" height="80" rx="8" fill="#fff7ed" stroke="#7c91aa"/><text x="33" y="284" font-size="16" text-anchor="start" fill="#172b4d">反例：誤留第1格</text><text x="33" y="307" font-size="13" text-anchor="start" fill="#172b4d">權重：[1, 0, 0, 0]</text><text x="33" y="328" font-size="15" text-anchor="start" fill="#172b4d">非零格 1；加權輸出 0</text><text x="180" y="375" font-size="13" text-anchor="middle" fill="#172b4d">題設：第4格才有本查詢需要的線索</text></g></svg>
