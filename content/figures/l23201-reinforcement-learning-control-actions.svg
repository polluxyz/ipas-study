<svg xmlns="http://www.w3.org/2000/svg" width="360" height="373" viewBox="0 0 360 373" role="img" aria-labelledby="title desc"><title id="title">先辨認動作集合</title><desc id="desc">導航以三個按鈕表示離散選項；機械臂以負30到30度的區間表示連續控制，角度僅作教學示意。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#355878"/></marker></defs><rect width="360" height="373" rx="10" fill="#fff"/><g fill="#142c42" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="16" y="27" font-size="18">先辨認動作集合</text><rect x="16" y="50" width="328" height="115" rx="8" fill="#eaf2fa" stroke="#355878"/><text x="29" y="76" font-size="17">離散：從有限選項擇一</text><rect x="30" y="94" width="90" height="45" rx="8" fill="#eaf2fa" stroke="#355878"/><text x="43" y="122" font-size="15">左轉</text><rect x="133" y="94" width="90" height="45" rx="8" fill="#eaf2fa" stroke="#355878"/><text x="146" y="122" font-size="15">前進</text><rect x="236" y="94" width="90" height="45" rx="8" fill="#eaf2fa" stroke="#355878"/><text x="249" y="122" font-size="15">右轉</text><rect x="16" y="187" width="328" height="139" rx="8" fill="#eaf2fa" stroke="#355878"/><text x="29" y="216" font-size="16">連續：設定許可區間中的角度</text><path d="M45 260H315" stroke="#355878" stroke-width="3"/><path d="M45 250V270" stroke="#355878"/><text x="30" y="295" font-size="14">-30°</text><path d="M180 250V270" stroke="#355878"/><text x="165" y="295" font-size="14">0°</text><path d="M315 250V270" stroke="#355878"/><text x="300" y="295" font-size="14">30°</text><text x="29" y="350" font-size="14">看控制輸出；不要看機器是否在移動</text></g></svg>
