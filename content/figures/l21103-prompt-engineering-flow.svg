<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" role="img" aria-labelledby="title desc"><title id="title">提示與驗收流程</title><desc id="desc">背景、任務、格式及示例送入固定權重模型，輸出要驗收，不合格時迭代提示。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#344861"/></marker></defs><rect width="360" height="470" fill="#fff"/><g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="180" y="28" text-anchor="middle" font-size="15" fill="#172b4d">提示設計與固定案例</text><rect x="30" y="48" width="300" height="68" rx="9" fill="#eaf1fa" stroke="#47678f" stroke-width="2" stroke-dasharray="5 3"/><text x="180" y="72" text-anchor="middle" font-size="15" fill="#172b4d">背景・任務・格式・示例</text><text x="180" y="94" text-anchor="middle" font-size="15" fill="#172b4d">來源文本清楚分隔</text><path d="M180 116 L180 144" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="146" width="300" height="62" rx="9" fill="#eaf1fa" stroke="#47678f" stroke-width="2" stroke-dasharray="5 3"/><text x="180" y="170" text-anchor="middle" font-size="15" fill="#172b4d">語言模型：權重固定</text><path d="M180 208 L180 234" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="236" width="300" height="62" rx="9" fill="#eaf1fa" stroke="#47678f" stroke-width="2" stroke-dasharray="5 3"/><text x="180" y="260" text-anchor="middle" font-size="15" fill="#172b4d">輸出：待驗收候選</text><path d="M180 298 L180 326" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="328" width="300" height="62" rx="9" fill="#eaf1fa" stroke="#47678f" stroke-width="2" stroke-dasharray="5 3"/><text x="180" y="352" text-anchor="middle" font-size="15" fill="#172b4d">核對格式・內容・依據</text><text x="180" y="425" text-anchor="middle" font-size="14" fill="#172b4d">失敗 → 修改提示 → 重測固定案例</text><text x="180" y="454" text-anchor="middle" font-size="13" fill="#172b4d">教學示意；非模型實測</text></g></svg>
