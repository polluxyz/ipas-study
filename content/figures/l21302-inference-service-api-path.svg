<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 568" role="img" aria-labelledby="title desc"><title id="title">請求到推論回應</title><desc id="desc">入口驗證與限速，負載分配後驗證內容、前處理、指定版本推論並記錄回應；框架與模型伺服器角色不同。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#285177"/></marker></defs><rect width="360" height="568" fill="white"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="16" fill="#172d43"><text x="180" y="30" text-anchor="middle" font-weight="700">請求到推論回應</text><text x="180" y="50" text-anchor="middle" font-size="12">教學合成資料</text><text x="180" y="70" text-anchor="middle" font-weight="700">一次即時推論</text><rect x="30" y="90" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="114" text-anchor="middle"><tspan x="180" dy="0">網站／App → HTTPS 入口</tspan><tspan x="180" dy="22">驗證 → 授權 → 限速、日誌</tspan></text><path d="M180 150 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="176" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="200" text-anchor="middle"><tspan x="180" dy="0">負載平衡 → API 包裝層</tspan><tspan x="180" dy="22">Flask／FastAPI 驗證請求</tspan></text><path d="M180 236 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="262" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="286" text-anchor="middle"><tspan x="180" dy="0">前處理與特徵讀取</tspan><tspan x="180" dy="22">依模型版本套用相同特徵規則</tspan></text><path d="M180 322 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="348" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="372" text-anchor="middle"><tspan x="180" dy="0">模型推論</tspan><tspan x="180" dy="22">rec-v2 或 inspect-v3</tspan></text><path d="M180 408 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="434" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="458" text-anchor="middle"><tspan x="180" dy="0">HTTP 回應與推論日誌</tspan><tspan x="180" dy="22">request_id、版本、結果及耗時</tspan></text><text x="180" y="516" text-anchor="middle" font-size="14">逾時與替代結果放在呼叫端；快取需含版本</text></g></svg>
