<svg xmlns="http://www.w3.org/2000/svg" width="360" height="520" viewBox="0 0 360 520" role="img" aria-labelledby="title desc"><title id="title">GAN 的兩階段交替更新</title><desc id="desc">先把真資料和生成器輸出送入判別器，只更新判別器；再經固定判別器回傳梯度，只更新生成器。</desc><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#18243a;font-size:14px}.small{font-size:12px}.heading{font-size:17px;font-weight:700}.box{fill:#eef3fa;stroke:#50647e;stroke-width:1.5}.arrow{stroke:#50647e;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#50647e"/></marker></defs><rect width="360" height="520" fill="#fff"/><text class="heading" x="18" y="28">一輪分成兩個更新階段</text><rect class="box" x="35" y="48" width="290" height="60" rx="10"/><text x="180" y="72" text-anchor="middle">① 更新判別器 D</text><text class="small" x="180" y="93" text-anchor="middle">真資料 x 與假資料 G(z) 分別進 D</text><text x="30" y="139">真資料 → D → 目標 1</text><text x="30" y="169">噪聲 z → G → 假資料 → D → 目標 0</text><text x="30" y="199">切斷假資料到 G 的梯度，只更新 D。</text><path class="arrow" d="M180 214V241"/><rect class="box" x="35" y="250" width="290" height="60" rx="10"/><text x="180" y="274" text-anchor="middle">② 更新生成器 G</text><text class="small" x="180" y="295" text-anchor="middle">噪聲 z → G → 固定的 D → 目標 1</text><text x="30" y="344">保留 D 對輸入的梯度，回傳到 G。</text><text x="30" y="374">D 的參數不更新；G 的參數更新。</text><path class="arrow" d="M180 393V419"/><rect class="box" x="35" y="428" width="290" height="60" rx="10"/><text x="180" y="452" text-anchor="middle">重複交替，再檢查樣本與多樣性</text><text class="small" x="180" y="473" text-anchor="middle">訓練步數增加不保證收斂或覆蓋完整</text></svg>