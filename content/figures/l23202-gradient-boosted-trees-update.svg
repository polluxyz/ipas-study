<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="title desc"><title id="title">梯度提升更新流程</title><desc id="desc">教學示意：每一輪由目前分數計算損失的負梯度，擬合新樹並乘學習率加入。分類要再轉機率。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#374151"/></marker></defs><rect width="360" height="420" fill="#fff"/><g font-family="sans-serif" fill="#152a43"><text x="180" y="25" text-anchor="middle" font-size="16">每輪重算目標，不只看上一棵樹</text><rect x="70" y="45" width="220" height="45" rx="8" fill="#e5efff" stroke="#265c9e"/><text x="180" y="68" text-anchor="middle" font-size="15">目前分數 F</text><path d="M180 90 L180 118" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><rect x="55" y="125" width="250" height="65" rx="8" fill="#e5efff" stroke="#265c9e"/><text x="180" y="148" text-anchor="middle" font-size="15">平方損失：真值減預測</text><text x="180" y="170" text-anchor="middle" font-size="15">其他損失：對應負梯度</text><path d="M180 190 L180 218" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><rect x="70" y="225" width="220" height="45" rx="8" fill="#e5efff" stroke="#265c9e"/><text x="180" y="248" text-anchor="middle" font-size="15">新樹學習修正 h</text><path d="M180 270 L180 298" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="305" width="260" height="45" rx="8" fill="#e5efff" stroke="#265c9e"/><text x="180" y="328" text-anchor="middle" font-size="15">新分數＝舊分數＋學習率×h</text><path d="M180 350 L180 375" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><text x="180" y="399" text-anchor="middle" font-size="16">分類：累積分數 → 機率 → 決策</text></g></svg>
