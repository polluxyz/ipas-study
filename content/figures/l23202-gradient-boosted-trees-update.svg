<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1262" role="img" aria-labelledby="title desc">
  <title id="title">每棵新樹只學『還差多少』</title>
  <desc id="desc">資料是教學合成的甲、乙、丙、丁 4 間房。真實房價依序為 100、120、180、200 萬元。3 個面板的房價軸皆從 80 到 220 萬元，比例尺相同。起點：先猜平均 150，4 間都預測 150；還差多少依序為 −50、−30、+30、+50，平均平方誤差 1700。第 1 條說明列：第 1 棵新樹只切 1 刀，把甲乙分一組、丙丁分一組，學到各組差距的平均 −40、−40、+40、+40；乘學習率 0.5 後，將 −20、−20、+20、+20 加回預測。第 1 棵樹之後：預測為 130、130、170、170；還差多少為 −30、−10、+10、+30，平均平方誤差 500。第 2 條說明列：第 2 棵新樹把甲乙分一組、丙丁分一組，學到 −20、−20、+20、+20；乘學習率 0.5 後，將 −10、−10、+10、+10 加回預測。第 2 棵樹之後：預測為 120、120、180、180；還差多少為 −20、0、0、+20，平均平方誤差 200。深色圓點是真實房價，藍色短橫線是目前預測，橘色垂直線段連接預測與真實房價；差距為 0 時不畫橘線。還差多少等於真實房價減目前預測，負號表示預測太高，正號表示預測太低。</desc>
  <rect width="720" height="1262" fill="#fff"/>
