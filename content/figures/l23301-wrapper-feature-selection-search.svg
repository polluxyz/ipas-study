<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 464" role="img" aria-labelledby="title desc">
<title id="title">Wrapper 的搜尋回饋迴圈</title>
<desc id="desc">前向後向選擇比較候選集合的驗證表現；RFE 以擬合模型的重要性刪欄。兩者均有反覆訓練迴圈，保留測試集不參與搜尋。</desc>
<rect width="360" height="464" rx="8" fill="#fff"/>
<style>text{font:15px sans-serif;fill:#142b40}.box{fill:#eff6fc;stroke:#3569ad;stroke-width:1.5}.arrow{stroke:#506477;stroke-width:1.8;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477"/></marker></defs>
<text x="180" y="28" text-anchor="middle">欄位清單改變，模型重新擬合</text>
<rect x="35" y="48" width="290" height="46" rx="7" class="box"/>
<text x="180" y="77" text-anchor="middle">提出候選欄位集合</text>
<path d="M180 94V120" class="arrow"/>
<rect x="35" y="127" width="290" height="46" rx="7" class="box"/>
<text x="180" y="156" text-anchor="middle">以指定模型訓練</text>
<path d="M180 173V199" class="arrow"/>
<rect x="35" y="206" width="290" height="78" rx="7" class="box"/>
<text x="180" y="231" text-anchor="middle">前向／後向：比較候選驗證分數</text>
<text x="180" y="257" text-anchor="middle">RFE：依當輪重要性淘汰</text>
<path d="M180 284V310" class="arrow"/>
<rect x="35" y="317" width="290" height="46" rx="7" class="box"/>
<text x="180" y="346" text-anchor="middle">更新集合，或達到停止條件</text>
<path d="M35 340H15V71H35" class="arrow"/>
<path d="M180 363V393" class="arrow"/>
<rect x="35" y="400" width="290" height="45" rx="7" fill="#fff5e8" stroke="#a84b16"/>
<text x="180" y="429" text-anchor="middle">固定流程後，才用保留測試集</text>
</svg>
