<svg xmlns="http://www.w3.org/2000/svg" width="360" height="590" viewBox="0 0 360 590" role="img" aria-labelledby="title desc"><title id="title">從人工特徵到深層特徵</title><desc id="desc">六階段的策略演進；不同方法長期並存。 教學合成資料，數值由 L23203-E-tensors.json 重建。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#334155"/></marker></defs><rect width="360" height="590" fill="#ffffff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#0f172a"><text x="18" y="29" font-size="17" font-weight="700">從人工特徵到深層特徵</text><text x="18" y="53" font-size="14">演進順序：看設計，不當品質排名</text><rect x="25" y="72" width="310" height="58" rx="9" fill="#f1f5f9" stroke="#475569"/><text x="37" y="95" font-size="15" font-weight="700">人工特徵 → 分類器</text><text x="37" y="117" font-size="14">人先設計紋理、邊緣等描述</text><path d="M180,130 L180,148" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="150" width="310" height="58" rx="9" fill="#f1f5f9" stroke="#475569"/><text x="37" y="173" font-size="15" font-weight="700">早期 LeNet</text><text x="37" y="195" font-size="14">簡單結構，手寫數字分類</text><path d="M180,208 L180,226" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="228" width="310" height="58" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="37" y="251" font-size="15" font-weight="700">2012 AlexNet</text><text x="37" y="273" font-size="14">ReLU、GPU、Dropout</text><path d="M180,286 L180,304" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="306" width="310" height="58" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="37" y="329" font-size="15" font-weight="700">2014 VGG ／ GoogLeNet</text><text x="37" y="351" font-size="14">小核堆疊 ／ 多尺度分支</text><path d="M180,364 L180,382" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="384" width="310" height="58" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="37" y="407" font-size="15" font-weight="700">2015 ResNet</text><text x="37" y="429" font-size="14">輸入沿捷徑回來相加</text><path d="M180,442 L180,460" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="462" width="310" height="58" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="37" y="485" font-size="15" font-weight="700">2016 DenseNet</text><text x="37" y="507" font-size="14">較早特徵供後層重用</text><text x="18" y="548" font-size="13">2014–2016：arXiv 首次公開年（補充）</text><text x="18" y="575" font-size="12">教學示意／合成資料；非成效評估</text></g></svg>
