<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 425" role="img" aria-labelledby="title desc"><title id="title">位置、動作與追蹤狀態</title><desc id="desc">實體點位映射到虛擬方框，捏合放大，失效時停止更新；教學合成資料</desc><rect width="360" height="425" fill="#fff"/><g font-family="sans-serif"><text x="16" y="27" font-size="18" fill="#17243b">真實位置 → 虛擬世界的對應</text><text x="16" y="56" font-size="16" fill="#17243b">真實 x 軸（公尺），z 固定為 1</text><path d="M30 105H330" stroke="#456783" stroke-width="2"/><circle cx="100" cy="105" r="7" fill="#225843" stroke="#225843" stroke-width="2"/><text x="90" y="89" font-size="15" fill="#17243b">0.1</text><text x="83" y="135" font-size="14" fill="#17243b">0</text><circle cx="170" cy="105" r="7" fill="#225843" stroke="#225843" stroke-width="2"/><text x="160" y="89" font-size="15" fill="#17243b">0.2</text><text x="153" y="135" font-size="14" fill="#17243b">100</text><circle cx="240" cy="105" r="7" fill="#225843" stroke="#225843" stroke-width="2"/><text x="230" y="89" font-size="15" fill="#17243b">0.3</text><text x="223" y="135" font-size="14" fill="#17243b">200</text><circle cx="310" cy="105" r="7" fill="white" stroke="#225843" stroke-width="2"/><text x="300" y="89" font-size="15" fill="#17243b">0.4</text><text x="293" y="135" font-size="14" fill="#17243b">300</text><text x="16" y="161" font-size="15" fill="#17243b">時間（ms）；空心末點只有離線真值</text><text x="16" y="195" font-size="16" fill="#17243b">↓ 已校準：原點、尺度與方向一致</text><text x="16" y="230" font-size="16" fill="#17243b">虛擬疊圖：方框跟著有效位置移動</text><rect x="90" y="255" width="20" height="20" fill="#e1f0e6" stroke="#225843" stroke-width="2"/><rect x="160" y="255" width="20" height="20" fill="#e1f0e6" stroke="#225843" stroke-width="2"/><rect x="228" y="253" width="24" height="24" fill="#e1f0e6" stroke="#225843" stroke-width="2"/><text x="16" y="305" font-size="16" fill="#17243b">200 ms 捏合 → 放大為 1.2 倍</text><text x="16" y="335" font-size="16" fill="#17243b">VR：同一動作改為操作虛擬物件</text><text x="16" y="370" font-size="16" fill="#17243b">300 ms 失去追蹤 → 暫停疊圖與操作</text><text x="16" y="401" font-size="15" fill="#17243b">方向與位置分開更新；像素不等於公尺</text></g></svg>
