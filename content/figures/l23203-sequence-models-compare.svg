<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="title desc"><title id="title">同一序列的三模型比較</title><desc id="desc">三種模型都逐步讀取同一段輸入；基本 RNN 傳遞 h，LSTM 傳遞 h 與 c 並有三門，GRU 傳遞 h 並有兩門。</desc><style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#172b4d;font-size:15px} .head{font-size:18px;font-weight:700}.small{font-size:13px}.box{fill:#e8f2ff;stroke:#245b9e;stroke-width:1.5}.memory{fill:#e6f6ec;stroke:#246d42;stroke-width:1.5}.gate{fill:#fff2cf;stroke:#8f6413;stroke-width:1.5}.line{fill:none;stroke:#245b9e;stroke-width:1.8;marker-end:url(#arrow)}.back{fill:none;stroke:#9c3b32;stroke-width:1.8;stroke-dasharray:5 3;marker-end:url(#red)}.mute{fill:#fff;stroke:#687782;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245b9e"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9c3b32"/></marker></defs><rect width="360" height="420" fill="#fff" rx="10"/><text x="180" y="28" text-anchor="middle" class="head">同資料、同視窗再比較</text><rect x="25" y="52" width="310" height="42" rx="8" class="box"/><text x="180" y="78" text-anchor="middle" class="">共同輸入：第 1、2、3、4 點</text><path d="M25 73L12 73L12 329" fill="none" stroke="#245b9e" stroke-width="1.8"/><path d="M12 153L22 153" class="line"/><path d="M12 241L22 241" class="line"/><path d="M12 329L22 329" class="line"/><rect x="24" y="123" width="312" height="60" rx="8" class="box"/><text x="180" y="158" text-anchor="middle" class="">基本 RNN：h → h；無顯式門控</text><rect x="24" y="211" width="312" height="60" rx="8" class="memory"/><text x="180" y="246" text-anchor="middle" class="">LSTM：h、c → h、c；三門</text><rect x="24" y="299" width="312" height="60" rx="8" class="gate"/><text x="180" y="334" text-anchor="middle" class="">GRU：h → h；兩門</text><text x="180" y="199" text-anchor="middle" class="small">每一列都獨立讀同一段輸入</text><text x="180" y="392" text-anchor="middle" class="small">結構差異不等於真實任務的成效排名</text></svg>
