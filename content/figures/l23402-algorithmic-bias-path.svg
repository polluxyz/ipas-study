<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-labelledby="title desc">
<title id="title">偏見沿流程傳遞</title><desc id="desc">資料與歷史制度、標註、模型到決策各有偏見入口及責任角色。</desc>
<rect width="360" height="480" rx="12" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#0f172a" font-size="17"><text x="18" y="32" font-size="21" font-weight="bold">偏見沿流程傳遞</text><rect x="18" y="55" width="324" height="74" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="30" y="83" font-weight="bold">資料：來源與歷史制度</text><text x="30" y="110" font-size="16">資料負責人查母體、語言、影像條件</text><path d="M180 131v19m-5-5 5 5 5-5" fill="none" stroke="#334155" stroke-width="2"/><rect x="18" y="155" width="324" height="74" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="30" y="183" font-weight="bold">標註：規準與主觀判斷</text><text x="30" y="210" font-size="16">標註負責人保留分歧與覆核</text><path d="M180 231v19m-5-5 5 5 5-5" fill="none" stroke="#334155" stroke-width="2"/><rect x="18" y="255" width="324" height="74" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="30" y="283" font-weight="bold">模型：目標、架構與簡化</text><text x="30" y="310" font-size="16">模型團隊查分群錯誤與版本</text><path d="M180 331v19m-5-5 5 5 5-5" fill="none" stroke="#334155" stroke-width="2"/><rect x="18" y="355" width="324" height="74" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="30" y="383" font-weight="bold">決策：面試、貸款與醫療</text><text x="30" y="410" font-size="16">業務及治理角色處理權益與申訴</text><text x="18" y="462" font-size="14">教學示意：節點表示追查位置，非因果證明</text></g></svg>
