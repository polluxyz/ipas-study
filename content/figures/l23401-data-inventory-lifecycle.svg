<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" role="img" aria-labelledby="title desc"><title id="title">資料生命週期地圖</title><desc id="desc">教學合成資料：醫務部將研究副本交研究室，客服部將分析副本交分析部。各副本分別到期刪除；對外逐筆公開尚未核准。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#475569"/></marker></defs><rect width="360" height="800" rx="12" fill="#f8fafc"/><g font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" fill="#172554" text-anchor="middle"><text x="180" y="30" font-size="20" font-weight="700">來源與副本分別追蹤</text><rect x="20" y="50" width="320" height="70" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="77" font-size="17" font-weight="700">醫務部｜來源資料</text><text x="180" y="102" font-size="15">院內來源區；來源期限獨立管理</text><path d="M180 120V148" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="266" y="139" font-size="14">研究用途</text><rect x="20" y="150" width="320" height="70" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="177" font-size="17" font-weight="700">研究室｜研究副本</text><text x="180" y="202" font-size="15">受控伺服器；核准成員存取</text><path d="M180 220V248" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="250" width="320" height="70" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="277" font-size="17" font-weight="700">研究副本到期處置</text><text x="180" y="302" font-size="15">刪除並留下紀錄</text><path d="M20 343H340" stroke="#94a3b8" stroke-dasharray="5 5"/><rect x="20" y="365" width="320" height="70" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="392" font-size="17" font-weight="700">客服部｜來源資料</text><text x="180" y="417" font-size="15">客服區；來源期限獨立管理</text><path d="M180 435V463" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="266" y="454" font-size="14">分析用途</text><rect x="20" y="465" width="320" height="70" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="492" font-size="17" font-weight="700">分析部｜分析副本</text><text x="180" y="517" font-size="15">受控伺服器；核准成員存取</text><path d="M180 535V563" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="565" width="320" height="70" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="592" font-size="17" font-weight="700">分析副本到期處置</text><text x="180" y="617" font-size="15">刪除並留下紀錄</text><rect x="20" y="665" width="320" height="70" rx="9" fill="#fff7ed" stroke="#64748b"/><text x="180" y="692" font-size="17" font-weight="700">擬議對外輸出｜尚未核准</text><text x="180" y="717" font-size="15">須先評估用途與再識別風險</text><text x="180" y="772" font-size="14">教學合成資料；來源刪除仍須追查副本</text></g></svg>
