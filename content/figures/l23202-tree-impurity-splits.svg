<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 485" role="img" aria-labelledby="title desc"><title id="title">有用與無用切分</title><desc id="desc">兩種切分都使用同六筆，父節點熵固定；子節點大小不一時須加權；資料：教學合成資料。</desc><rect width="360" height="485" fill="#fff"/><g fill="#172c43" font-family="Arial,Microsoft JhengHei,sans-serif"><text x="12" y="26" font-size="17" >同一父節點，比較兩種切分</text><rect x="30" y="48" width="300" height="58" rx="8" fill="#eaf2fa" stroke="#172c43"/><text x="180" y="82" font-size="14" text-anchor="middle">父：未違約3、違約3；熵1</text><text x="18" y="135" font-size="16" >負債≤350千元</text><rect x="12" y="153" width="162" height="54" rx="8" fill="#eaf2fa" stroke="#172c43"/><text x="93" y="185" font-size="14" text-anchor="middle">3未違約 / 1違約</text><rect x="186" y="153" width="162" height="54" rx="8" fill="#eaf2fa" stroke="#172c43"/><text x="267" y="185" font-size="14" text-anchor="middle">0未違約 / 2違約</text><text x="18" y="236" font-size="14" >加權子熵 0.5409；增益 0.4591</text><text x="18" y="262" font-size="13" >子節點筆數 4、2；要按筆數加權</text><text x="18" y="315" font-size="16" >收入≤35千元</text><rect x="12" y="333" width="162" height="54" rx="8" fill="#eaf2fa" stroke="#172c43"/><text x="93" y="365" font-size="14" text-anchor="middle">1未違約 / 1違約</text><rect x="186" y="333" width="162" height="54" rx="8" fill="#eaf2fa" stroke="#172c43"/><text x="267" y="365" font-size="14" text-anchor="middle">2未違約 / 2違約</text><text x="18" y="416" font-size="14" >加權子熵 1.0000；增益 0.0000</text><text x="18" y="442" font-size="13" >子節點筆數 2、4；要按筆數加權</text><text x="12" y="475" font-size="11" >資料：教學合成；固定規則計算</text></g></svg>
