<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 474" role="img"><title>組層、設定與執行分工</title><desc>資料依序由四維轉五維再成三類，compile 設定訓練規則，fit 執行訓練。</desc><rect width="360" height="474" fill="#fffdf7"/><g font-family="sans-serif" fill="#0f172a" font-size="16"><text x="180" y="30" text-anchor="middle" font-weight="700">組層、設定與執行分工</text><rect x="12" y="66" width="336" height="62" rx="8" fill="#fef3c7" stroke="#334155"/><text x="180" y="90" text-anchor="middle">輸入：N×4</text><text x="180" y="111" text-anchor="middle">N 是這一批的樣本數</text><path d="M180 128v22m-5-6 5 6 5-6" fill="none" stroke="#334155" stroke-width="2"/><rect x="12" y="156" width="336" height="62" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="180" y="180" text-anchor="middle">隱藏層：N×5</text><text x="180" y="201" text-anchor="middle">Dense 加 ReLU</text><path d="M180 218v22m-5-6 5 6 5-6" fill="none" stroke="#334155" stroke-width="2"/><rect x="12" y="246" width="336" height="62" rx="8" fill="#fef3c7" stroke="#334155"/><text x="180" y="270" text-anchor="middle">輸出層：N×3</text><text x="180" y="291" text-anchor="middle">保留三類 logits</text><path d="M180 308v22m-5-6 5 6 5-6" fill="none" stroke="#334155" stroke-width="2"/><rect x="12" y="336" width="336" height="62" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="180" y="360" text-anchor="middle">compile：損失與優化器</text><text x="180" y="381" text-anchor="middle">fit：讀資料並更新權重</text><text x="180" y="459" text-anchor="middle" font-size="12">教學示意；各框架接口需核對版本</text></g></svg>