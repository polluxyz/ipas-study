<svg xmlns="http://www.w3.org/2000/svg" width="360" height="472" viewBox="0 0 360 472" role="img" aria-labelledby="title desc"><title id="title">前處理與目標編碼的邊界</title><desc id="desc">上方是外部隔離；中間在訓練內做折外估計；測試標籤沒有流入路徑。</desc><rect width="360" height="472" fill="#fff"/><g font-family="sans-serif" fill="#15334c"><text x="180" y="23" text-anchor="middle" font-size="17">前處理與目標編碼的邊界</text><rect x="16" y="40" width="328" height="68" rx="9" fill="#edf4fc" stroke="#245b8c"/><text x="180" y="65" text-anchor="middle" font-size="17" font-weight="bold">先留出外部驗證與測試</text><text x="180" y="89" text-anchor="middle" font-size="14">它們的標籤不參與編碼</text><path d="M180 110v22m-5-6 5 6 5-6" stroke="#245b8c" fill="none" stroke-width="2"/><rect x="16" y="136" width="328" height="68" rx="9" fill="#edf4fc" stroke="#245b8c"/><text x="180" y="161" text-anchor="middle" font-size="17" font-weight="bold">訓練資料內部切折</text><text x="180" y="185" text-anchor="middle" font-size="14">其他折估計 → 留出折表示</text><path d="M180 206v22m-5-6 5 6 5-6" stroke="#245b8c" fill="none" stroke-width="2"/><rect x="16" y="232" width="328" height="68" rx="9" fill="#edf4fc" stroke="#245b8c"/><text x="180" y="257" text-anchor="middle" font-size="17" font-weight="bold">輪流得到訓練折外表示</text><text x="180" y="281" text-anchor="middle" font-size="14">每列都避開自己的標籤</text><path d="M180 302v22m-5-6 5 6 5-6" stroke="#245b8c" fill="none" stroke-width="2"/><rect x="16" y="328" width="328" height="68" rx="9" fill="#edf4fc" stroke="#245b8c"/><text x="180" y="353" text-anchor="middle" font-size="17" font-weight="bold">轉換外部驗證與測試</text><text x="180" y="377" text-anchor="middle" font-size="14">只套用整份訓練學到的映射</text><text x="180" y="459" text-anchor="middle" font-size="14">時間資料的內部估計也須遵守時間</text></g></svg>
