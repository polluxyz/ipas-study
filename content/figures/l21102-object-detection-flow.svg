<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 570" role="img" aria-labelledby="t d"><title id="t">一階段與二階段偵測</title><desc id="d">上下流程使用同底圖；二階段先由RPN提區域再分類及修框</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#45556c"/></marker></defs><rect width="360" height="570" fill="#fff"/><g fill="#15243b" font-family="sans-serif"><text x="16" y="26" font-size="16">一階段：YOLO / SSD</text><rect x="30" y="42" width="300" height="42" rx="6" fill="#e6f1fa" stroke="#36506c"/><text x="40" y="69" font-size="16">同一張影像 → 特徵</text><path d="M180 84L180 97" stroke="#45556c" stroke-width="2"/><polygon points="180,104 183,97 177,97" fill="#45556c"/><rect x="30" y="104" width="300" height="46" rx="6" fill="#e6f1fa" stroke="#36506c"/><text x="40" y="133" font-size="16">直接預測：類別＋框</text><path d="M180 150L180 163" stroke="#45556c" stroke-width="2"/><polygon points="180,170 183,163 177,163" fill="#45556c"/><rect x="30" y="170" width="300" height="40" rx="6" fill="#e6f1fa" stroke="#36506c"/><text x="40" y="196" font-size="16">篩選後的物件清單</text><text x="16" y="250" font-size="16">二階段：Faster R-CNN</text><rect x="30" y="266" width="300" height="40" rx="6" fill="#e6f1fa" stroke="#36506c"/><text x="40" y="292" font-size="16">同一張影像 → 共享特徵</text><path d="M180 306L180 319" stroke="#45556c" stroke-width="2"/><polygon points="180,326 183,319 177,319" fill="#45556c"/><rect x="30" y="326" width="300" height="40" rx="6" fill="#e6f1fa" stroke="#36506c"/><text x="40" y="352" font-size="16">RPN：提出可能有物件的區域</text><path d="M180 366L180 379" stroke="#45556c" stroke-width="2"/><polygon points="180,386 183,379 177,379" fill="#45556c"/><rect x="30" y="386" width="300" height="40" rx="6" fill="#e6f1fa" stroke="#36506c"/><text x="40" y="412" font-size="16">候選區域 → 區域特徵</text><path d="M180 426L180 439" stroke="#45556c" stroke-width="2"/><polygon points="180,446 183,439 177,439" fill="#45556c"/><rect x="30" y="446" width="300" height="44" rx="6" fill="#e6f1fa" stroke="#36506c"/><text x="40" y="474" font-size="16">分類＋框座標修正</text><text x="20" y="523" font-size="15">階段看有無先提區域，再辨識區域。</text><text x="20" y="548" font-size="15">不代表網路只有一層或兩層。</text></g></svg>
