<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 326" role="img" aria-labelledby="title desc"><title id="title">換代碼仍可能連回身分</title><desc id="desc">教學全合成紀錄。假名化有映射路徑；即使沒有映射，年齡與地區也可能被外部名冊連結。</desc><rect width="360" height="326" fill="#f8fafc"/><g font-family="sans-serif" fill="#0f172a"><rect x="12" y="12" width="336" height="76" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="24" y="37" font-size="15">原紀錄：假醫甲／M01／31歲東區</text><text x="24" y="61" font-size="15">醫療費用：1,000 元</text><text x="175" y="108" font-size="22">↓</text><rect x="12" y="120" width="336" height="76" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="24" y="145" font-size="15">換碼：P-01／31歲東區／1,000元</text><text x="24" y="169" font-size="15">映射表隔離保存，持有者仍可回連</text><text x="175" y="218" font-size="22">↓</text><rect x="12" y="230" width="336" height="76" rx="8" fill="#fef3c7" stroke="#334155"/><text x="24" y="255" font-size="15">外部名冊：假醫甲／31歲東區</text><text x="24" y="279" font-size="15">年齡＋地區 → 原表只剩一個候選</text></g></svg>
