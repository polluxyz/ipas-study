<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 450" width="360" height="450" role="img" aria-labelledby="title desc"><title id="title">B群閾值調整前後</title><desc id="desc">由L23402-B-credit.json逐筆計算。分數不變，B閾值由0.5升至0.7，選取率及假陽率下降，真陽率不變。</desc><defs><marker id="arrow" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="360" height="450" fill="#fff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#172d43"><text x="180" y="27" font-size="16" text-anchor="middle">B群：固定分數，只改閾值</text><text x="15" y="55" font-size="14" text-anchor="start">實線框：0.5　虛線框：0.7</text><text x="12" y="95" font-size="15" text-anchor="start">選取率</text><rect x="74" y="107" width="147" height="20" fill="#dceaff" stroke="#35659b" stroke-width="2" /><text x="227" y="122" font-size="14" text-anchor="start">70%</text><rect x="74" y="136" width="105" height="20" fill="#fff" stroke="#a15324" stroke-width="2" stroke-dasharray="4 3"/><text x="185" y="151" font-size="14" text-anchor="start">50%</text><text x="12" y="194" font-size="15" text-anchor="start">TPR</text><rect x="74" y="206" width="168" height="20" fill="#dceaff" stroke="#35659b" stroke-width="2" /><text x="248" y="221" font-size="14" text-anchor="start">80%</text><rect x="74" y="235" width="168" height="20" fill="#fff" stroke="#a15324" stroke-width="2" stroke-dasharray="4 3"/><text x="248" y="250" font-size="14" text-anchor="start">80%</text><text x="12" y="293" font-size="15" text-anchor="start">FPR</text><rect x="74" y="305" width="126" height="20" fill="#dceaff" stroke="#35659b" stroke-width="2" /><text x="206" y="320" font-size="14" text-anchor="start">60%</text><rect x="74" y="334" width="42" height="20" fill="#fff" stroke="#a15324" stroke-width="2" stroke-dasharray="4 3"/><text x="122" y="349" font-size="14" text-anchor="start">20%</text><path d="M116,301 L116,358" fill="none" stroke="#218164" stroke-width="2" stroke-dasharray="3 3"/><text x="128" y="293" font-size="13" text-anchor="start">A＝20%（參考線）</text><text x="180" y="405" font-size="12" text-anchor="middle">橫向長度：群體內比例，完整寬度為100%</text><text x="180" y="433" font-size="13" text-anchor="middle">教學合成資料；四個被移出者皆為負例</text></g></svg>
