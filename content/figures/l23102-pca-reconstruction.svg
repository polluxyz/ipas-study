<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc">
  <title id="title">壓縮後再還原：少留會丟資訊</title>
  <desc id="desc">製程第 01 筆的溫度、壓力、振動原始值為 8、18、4。只留 1 個主成分再還原，得到 8、18、5，振動的變化被丟掉，只能填平均 5。留 2 個主成分再還原，得到 8、18、4，完全還原。這 6 筆的 3 欄只有 2 種獨立變化。表中只有振動 5 的格子與原始值不同，以橘色方框標示。</desc>
  <rect width="720" height="470" fill="#fff"/>
  <g font-family="Arial,Microsoft JhengHei,sans-serif" fill="#172c43">
    <text x="24" y="43" font-size="24" font-weight="700">壓縮後再還原：少留會丟資訊</text>
    <text x="24" y="76" font-size="16">製程第 01 筆：比較還原後的 3 欄</text>

    <g font-size="18" font-weight="700" text-anchor="middle">
      <text x="237" y="130">溫度</text>
      <text x="323" y="130">壓力</text>
      <text x="409" y="130">振動</text>
    </g>

    <g font-size="18">
      <text x="24" y="188">原始第 01 筆</text>
      <text x="24" y="284">只留 1 個主成分</text>
      <text x="24" y="380">留 2 個主成分</text>
    </g>

    <g fill="#eaf2fb">
      <rect x="199" y="146" width="76" height="72" rx="8"/>
      <rect x="285" y="146" width="76" height="72" rx="8"/>
      <rect x="371" y="146" width="76" height="72" rx="8"/>
      <rect x="199" y="242" width="76" height="72" rx="8"/>
      <rect x="285" y="242" width="76" height="72" rx="8"/>
      <rect x="199" y="338" width="76" height="72" rx="8"/>
      <rect x="285" y="338" width="76" height="72" rx="8"/>
      <rect x="371" y="338" width="76" height="72" rx="8"/>
    </g>
    <rect x="371" y="242" width="76" height="72" fill="#fff" stroke="#ac4200" stroke-width="3"/>

    <g font-size="30" font-weight="700" text-anchor="middle">
      <text x="237" y="193">8</text>
      <text x="323" y="193">18</text>
      <text x="409" y="193">4</text>
      <text x="237" y="289">8</text>
      <text x="323" y="289">18</text>
      <text x="409" y="289" fill="#ac4200">5</text>
      <text x="237" y="385">8</text>
      <text x="323" y="385">18</text>
      <text x="409" y="385">4</text>
    </g>

    <path d="M 452 278 H 470" fill="none" stroke="#ac4200" stroke-width="2"/>
    <g font-size="17" fill="#ac4200">
      <text x="484" y="269">振動的變化被丟掉，</text>
      <text x="484" y="295">只能填平均 5</text>
    </g>

    <path d="M 452 374 H 470" fill="none" stroke="#172c43" stroke-width="2"/>
    <text x="484" y="355" font-size="18" font-weight="700">完全還原：</text>
    <g font-size="17">
      <text x="484" y="381">這 6 筆的 3 欄</text>
      <text x="484" y="407">只有 2 種獨立變化</text>
    </g>

    <text x="24" y="449" font-size="13">資料：教學合成</text>
  </g>
</svg>
