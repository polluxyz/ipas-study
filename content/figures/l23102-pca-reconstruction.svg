<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430" role="img" aria-labelledby="title desc"><title id="title">PCA近似重建</title><desc id="desc">由同一矩陣的SVD算出第一筆在保留一方向和兩方向後的重建。</desc><rect width="360" height="430" fill="white"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="18" y="29" fill="#4b5563" font-size="16" text-anchor="start">第一筆：截斷後再映回原欄位</text><rect x="24" y="57" width="312" height="67" rx="6" fill="#eaf2fa" stroke="#175fa5"/><text x="38" y="82" fill="#175fa5" font-size="15" text-anchor="start">原始資料</text><text x="38" y="108" fill="#4b5563" font-size="14" text-anchor="start">8、18、4（溫度、壓力、振動）</text><rect x="24" y="147" width="312" height="67" rx="6" fill="#eaf2fa" stroke="#175fa5"/><text x="38" y="172" fill="#175fa5" font-size="15" text-anchor="start">保留1方向重建</text><text x="38" y="198" fill="#4b5563" font-size="14" text-anchor="start">8、18、5（溫度、壓力、振動）</text><rect x="24" y="237" width="312" height="67" rx="6" fill="#eaf2fa" stroke="#175fa5"/><text x="38" y="262" fill="#175fa5" font-size="15" text-anchor="start">保留2方向重建</text><text x="38" y="288" fill="#4b5563" font-size="14" text-anchor="start">8、18、4（溫度、壓力、振動）</text><text x="18" y="353" fill="#4b5563" font-size="14" text-anchor="start">保留1方向：第三欄回到均值5</text><text x="18" y="380" fill="#4b5563" font-size="14" text-anchor="start">保留2方向：本例秩2，完整重建</text><text x="18" y="407" fill="#4b5563" font-size="13" text-anchor="start">索引01；單位為指數；教學合成資料</text></g></svg>
