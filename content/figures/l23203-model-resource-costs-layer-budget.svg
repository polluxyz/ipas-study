<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 474" role="img"><title>同一網路，兩種成本排序</title><desc>由合成資料架構計算卷積與分類頭的參數及 MAC，參數多不等於計算多。</desc><rect width="360" height="474" fill="#fffdf7"/><g font-family="sans-serif" fill="#0f172a" font-size="16"><text x="180" y="30" text-anchor="middle" font-weight="700">同一網路，兩種成本排序</text><rect x="12" y="66" width="336" height="62" rx="8" fill="#fef3c7" stroke="#334155"/><text x="180" y="90" text-anchor="middle">影像：8×8×3</text><text x="180" y="111" text-anchor="middle">單張前向，只計權重乘加</text><path d="M180 128v22m-5-6 5 6 5-6" fill="none" stroke="#334155" stroke-width="2"/><rect x="12" y="156" width="336" height="62" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="180" y="180" text-anchor="middle">卷積輸出：6×6×2</text><text x="180" y="201" text-anchor="middle">56 個參數；1944 MAC</text><path d="M180 218v22m-5-6 5 6 5-6" fill="none" stroke="#334155" stroke-width="2"/><rect x="12" y="246" width="336" height="62" rx="8" fill="#fef3c7" stroke="#334155"/><text x="180" y="270" text-anchor="middle">展平 72 維 → 3 類 Dense</text><text x="180" y="291" text-anchor="middle">219 個參數；216 MAC</text><path d="M180 308v22m-5-6 5 6 5-6" fill="none" stroke="#334155" stroke-width="2"/><rect x="12" y="336" width="336" height="62" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="180" y="360" text-anchor="middle">Dense 的參數最多</text><text x="180" y="381" text-anchor="middle">卷積的 MAC 最多</text><text x="180" y="459" text-anchor="middle" font-size="12">數字由 L23203-C-frameworks.json 計算</text></g></svg>