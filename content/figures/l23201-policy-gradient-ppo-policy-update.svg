<svg xmlns="http://www.w3.org/2000/svg" width="360" height="376" viewBox="0 0 360 376" role="img" aria-labelledby="title desc"><title id="title">策略變動與裁剪誘因</title><desc id="desc">三條機率橫條同尺度。0.6是正優勢下裁剪誘因的平台起點，不是實際新策略的硬界線。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#355878"/></marker></defs><rect width="360" height="376" rx="10" fill="#fff"/><g fill="#142c42" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="16" y="27" font-size="18">策略變動與裁剪誘因</text><text x="16" y="54" font-size="14">教學候選策略；不是訓練結果</text><text x="16" y="84" font-size="15">舊交付機率 0.50</text><rect x="16" y="92" width="160" height="18" fill="#335f91" stroke="#355878"/><text x="16" y="143" font-size="15">正優勢參考位置 0.60</text><rect x="16" y="151" width="192" height="18" fill="#f2bf57" stroke="#355878"/><text x="16" y="202" font-size="15">新候選機率 0.80</text><rect x="16" y="210" width="256" height="18" fill="#335f91" stroke="#355878"/><rect x="16" y="256" width="328" height="100" rx="8" fill="#eaf2fa" stroke="#355878"/><text x="28" y="280" font-size="15">機率比 1.6；優勢 2</text><text x="28" y="309" font-size="15">原目標 3.2 → 裁剪後 2.4</text><text x="28" y="339" font-size="14">超過參考位置，並未被硬性拉回</text></g></svg>
