<svg xmlns="http://www.w3.org/2000/svg" width="360" height="563" viewBox="0 0 360 563" role="img" aria-labelledby="title desc"><title id="title">RAG 檢索與生成控制點</title><desc id="desc">問題經來源準備與過濾後取回證據，生成答案並核對引用；切塊、權限及輸出控制為補充。</desc><rect width="360" height="563" fill="#fff"/><g font-family="sans-serif"><text x="180" y="26" font-size="20" text-anchor="middle" fill="#172b4d">檢索到生成的控制點</text><rect x="20" y="44" width="320" height="60" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="180" y="67" font-size="17" text-anchor="middle" fill="#172b4d">文件準備：離線（補充）</text><text x="180" y="89" font-size="14" text-anchor="middle" fill="#172b4d">切塊 → 嵌入／索引</text><path d="M180 105 v18 m-5 -5 5 5 5 -5" fill="none" stroke="#172b4d" stroke-width="2"/><rect x="20" y="124" width="320" height="60" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="180" y="147" font-size="17" text-anchor="middle" fill="#172b4d">查詢：問題＋既有索引</text><text x="180" y="169" font-size="14" text-anchor="middle" fill="#172b4d">保留使用者條件</text><path d="M180 185 v18 m-5 -5 5 5 5 -5" fill="none" stroke="#172b4d" stroke-width="2"/><rect x="20" y="204" width="320" height="60" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="180" y="227" font-size="17" text-anchor="middle" fill="#172b4d">版本與權限（補充）</text><text x="180" y="249" font-size="14" text-anchor="middle" fill="#172b4d">適用、可信、可存取才交給模型</text><path d="M180 265 v18 m-5 -5 5 5 5 -5" fill="none" stroke="#172b4d" stroke-width="2"/><rect x="20" y="284" width="320" height="60" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="180" y="307" font-size="17" text-anchor="middle" fill="#172b4d">檢索相關段落</text><text x="180" y="329" font-size="14" text-anchor="middle" fill="#172b4d">必要時融合與重排（補充）</text><path d="M180 345 v18 m-5 -5 5 5 5 -5" fill="none" stroke="#172b4d" stroke-width="2"/><rect x="20" y="364" width="320" height="60" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="180" y="387" font-size="17" text-anchor="middle" fill="#172b4d">問題＋證據 → 生成</text><text x="180" y="409" font-size="14" text-anchor="middle" fill="#172b4d">文件內容不取得指令權限（補充）</text><path d="M180 425 v18 m-5 -5 5 5 5 -5" fill="none" stroke="#172b4d" stroke-width="2"/><rect x="20" y="444" width="320" height="60" rx="8" fill="#eff6ff" stroke="#7c91aa"/><text x="180" y="467" font-size="17" text-anchor="middle" fill="#172b4d">答案＋引用</text><text x="180" y="489" font-size="14" text-anchor="middle" fill="#172b4d">逐項核對主張（補充）</text><text x="180" y="545" font-size="13" text-anchor="middle" fill="#172b4d">教學示意；先找資料，再據以回答</text></g></svg>
