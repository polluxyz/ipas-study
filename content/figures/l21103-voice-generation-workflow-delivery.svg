<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 540" width="360" height="540" role="img" aria-labelledby="title desc"><title id="title">語音服務從用途到交付的檢查</title><desc id="desc">依序確認用途及稿本、語言音色與情緒、平台合成、品質延遲驗收與發布；稿本來源及聲音同意不完整時停止發布。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#3a506b"/></marker></defs><rect width="360" height="540" fill="#fff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="180" y="28" font-size="17" fill="#172033" text-anchor="middle">語音服務：每一站都有交付條件</text><rect x="18" y="44" width="324" height="64" rx="8" fill="#edf4ff" stroke="#53657e"/><text x="180" y="69" font-size="15" fill="#172033" text-anchor="middle">用途與稿本</text><text x="180" y="92" font-size="15" fill="#172033" text-anchor="middle">教材／客服／角色／家居</text><path d="M180 109V131" fill="none" stroke="#3a506b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="18" y="136" width="324" height="64" rx="8" fill="#edf4ff" stroke="#53657e"/><text x="180" y="161" font-size="15" fill="#172033" text-anchor="middle">語言、音色、語速與情緒</text><text x="180" y="184" font-size="15" fill="#172033" text-anchor="middle">核對稿本來源及聲音同意</text><path d="M180 201V223" fill="none" stroke="#3a506b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="18" y="228" width="324" height="41" rx="8" fill="#edf4ff" stroke="#53657e"/><text x="180" y="253" font-size="15" fill="#172033" text-anchor="middle">選平台 → 合成波形或串流</text><path d="M180 270V292" fill="none" stroke="#3a506b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="18" y="297" width="324" height="64" rx="8" fill="#edf4ff" stroke="#53657e"/><text x="180" y="322" font-size="15" fill="#172033" text-anchor="middle">品質與內容、生成延遲驗收</text><text x="180" y="345" font-size="15" fill="#172033" text-anchor="middle">多語及方言分別檢查</text><path d="M180 362V384" fill="none" stroke="#3a506b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="18" y="389" width="324" height="41" rx="8" fill="#eef8ed" stroke="#53657e"/><text x="180" y="414" font-size="15" fill="#172033" text-anchor="middle">交付與標示合成來源</text><text x="180" y="470" font-size="16" fill="#94351b" text-anchor="middle">來源／同意不完整 → 停止發布</text><text x="180" y="500" font-size="13" fill="#172033" text-anchor="middle">具體門檻與失敗回復另約定（補充）</text></g></svg>
