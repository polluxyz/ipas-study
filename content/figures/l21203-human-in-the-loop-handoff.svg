<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 635" width="360" height="635" role="img" aria-labelledby="title desc"><title id="title">人工覆核與停止自動化的流程</title><desc id="desc">需要覆核時先攔下決策。資訊時間權限不足或超時，升級並走安全替代流程；最後留存追溯紀錄。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#324f69"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8" fill="#324f69"/></marker></defs><rect width="360" height="635" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="180" y="27" font-size="18" text-anchor="middle" fill="#162b42">決策前的人工作用</text><rect x="25" y="47" width="310" height="65" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="180" y="70" font-size="15" text-anchor="middle" fill="#162b42">模型建議＋原始資訊</text><text x="180" y="92" font-size="15" text-anchor="middle" fill="#162b42">保留版本、限制與理由</text><path d="M180,112 L180,133" stroke="#324f69" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="25" y="140" width="310" height="65" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="180" y="163" font-size="15" text-anchor="middle" fill="#162b42">需要覆核或出現異常</text><text x="180" y="185" font-size="15" text-anchor="middle" fill="#162b42">在不可逆決策前攔下</text><path d="M180,205 L180,227" stroke="#324f69" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="25" y="234" width="310" height="65" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="180" y="257" font-size="15" text-anchor="middle" fill="#162b42">覆核人：資訊／專業／時間／權限</text><text x="180" y="279" font-size="15" text-anchor="middle" fill="#162b42">可要求補件、推翻或停止</text><path d="M130,299 L96,331" stroke="#324f69" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M230,299 L264,331" stroke="#324f69" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="13" y="340" width="162" height="86" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="94" y="363" font-size="15" text-anchor="middle" fill="#162b42">證據足夠、來得及</text><text x="94" y="385" font-size="15" text-anchor="middle" fill="#162b42">人員決策並留理由</text><text x="94" y="407" font-size="15" text-anchor="middle" fill="#162b42">可推翻模型建議</text><rect x="185" y="340" width="162" height="86" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="266" y="363" font-size="15" text-anchor="middle" fill="#162b42">不足、超時或缺席</text><text x="266" y="385" font-size="15" text-anchor="middle" fill="#162b42">升級權責主管</text><text x="266" y="407" font-size="15" text-anchor="middle" fill="#162b42">停止自動化路徑</text><path d="M264,426 L264,447" stroke="#324f69" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="185" y="454" width="162" height="65" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="266" y="477" font-size="15" text-anchor="middle" fill="#162b42">安全替代流程</text><text x="266" y="499" font-size="15" text-anchor="middle" fill="#162b42">臨床必要照護不停</text><path d="M96,426 L96,540" stroke="#324f69" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M264,519 L264,540" stroke="#324f69" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="25" y="547" width="310" height="65" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="180" y="570" font-size="15" text-anchor="middle" fill="#162b42">保存決策、時間與後續處置</text><text x="180" y="592" font-size="15" text-anchor="middle" fill="#162b42">查核改善，再決定是否恢復</text></g></svg>
