<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 345" role="img"><title>KS 最大累積差距</title><desc>由固定五加五筆連續量測排序，畫右連續階梯；垂直線是統計量，不是 p 值</desc><rect width="360" height="345" fill="#fff"/><g font-family="sans-serif" font-size="15" fill="#172554"><text x="14" y="25" >兩份量測的累積比例（ECDF）</text><text x="14" y="49" >實線：參考；虛線：當期</text><path d="M45 245H325" stroke="#cbd5e1"/><text x="10" y="250" >0.0</text><path d="M45 155H325" stroke="#cbd5e1"/><text x="10" y="160" >0.5</text><path d="M45 65H325" stroke="#cbd5e1"/><text x="10" y="70" >1.0</text><path d="M45 245H85V209H125V173H165V137H205V101H245V65H325" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M45 245H145V209H185V173H225V137H265V101H305V65H325" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="7 4"/><text x="45" y="268" text-anchor="middle">0</text><text x="125" y="268" text-anchor="middle">2</text><text x="205" y="268" text-anchor="middle">4</text><text x="285" y="268" text-anchor="middle">6</text><path d="M125 173V245" stroke="#111827" stroke-width="3"/><text x="14" y="195" >最大差距 0.4</text><text x="180" y="292" text-anchor="middle">量測值（毫米）</text><text x="14" y="323" >例如 2 毫米處：0.4 − 0.0 = 0.4。</text></g></svg>
