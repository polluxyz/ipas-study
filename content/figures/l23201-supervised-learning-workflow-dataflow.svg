<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 650" role="img"><title>監督式學習資料用途</title><desc>教學合成資料：訓練、驗證與測試彼此隔離；驗證結果回饋到設定，測試在鎖定後才使用。</desc><rect width="360" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#34445a"/></marker></defs><g font-family="sans-serif" font-size="15" fill="#172238"><text x="180" y="25" text-anchor="middle">教學合成：120 筆固定索引</text><rect x="30" y="45" width="300" height="66" rx="8" fill="#e8f3fa" stroke="#52677b"/><text x="180" y="71" text-anchor="middle">準備、定義標籤並切分</text><text x="180" y="93" text-anchor="middle">三份資料彼此隔離</text><path d="M180 111V140" stroke="#34445a" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="145" width="300" height="66" rx="8" fill="#e8f3fa" stroke="#52677b"/><text x="180" y="171" text-anchor="middle">72 筆訓練：學參數</text><text x="180" y="193" text-anchor="middle">前處理也只在訓練集擬合</text><path d="M180 211V240" stroke="#34445a" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="245" width="300" height="66" rx="8" fill="#e8f3fa" stroke="#52677b"/><text x="180" y="271" text-anchor="middle">24 筆驗證：比較設定</text><text x="180" y="293" text-anchor="middle">依回饋調整後，再用訓練集學習</text><path d="M330 278H346V177H332" fill="none" stroke="#34445a" stroke-dasharray="5 3" marker-end="url(#arrow)"/><path d="M180 311V345" stroke="#34445a" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="350" width="300" height="66" rx="8" fill="#e8f3fa" stroke="#52677b"/><text x="180" y="376" text-anchor="middle">鎖定模型與前處理</text><text x="180" y="398" text-anchor="middle">停止以驗證結果改動</text><path d="M180 416V450" stroke="#34445a" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="455" width="300" height="66" rx="8" fill="#fff0dc" stroke="#52677b"/><text x="180" y="481" text-anchor="middle">24 筆測試：最終評估</text><text x="180" y="503" text-anchor="middle">不能用測試答案繼續挑設定</text><path d="M180 521V555" stroke="#34445a" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="560" width="300" height="66" rx="8" fill="#e8f3fa" stroke="#52677b"/><text x="180" y="586" text-anchor="middle">部署完整預測流程</text><text x="180" y="608" text-anchor="middle">新資料只輸入可取得的特徵</text></g></svg>
