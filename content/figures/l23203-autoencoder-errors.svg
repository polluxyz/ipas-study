<svg xmlns="http://www.w3.org/2000/svg" width="360" height="410" viewBox="0 0 360 410" role="img" aria-labelledby="title desc"><title id="title">重建誤差與漏報限制</title><desc id="desc">由共用例子算出正常0、含噪0.02、偏離關係0.5、符合關係但超出範圍0；小誤差不保證正常。</desc><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#18243a;font-size:14px}.small{font-size:12px}.heading{font-size:17px;font-weight:700}.box{fill:#eef3fa;stroke:#50647e;stroke-width:1.5}.arrow{stroke:#50647e;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#50647e"/></marker></defs><rect width="360" height="410" fill="#fff"/><text class="heading" x="18" y="27">每筆輸入對重建的 MSE</text><text class="small" x="18" y="49">固定矩陣；感測值已無量綱化</text><text x="18" y="82">正常</text><rect x="140" y="66" width="0" height="23" fill="#267a77"/><text x="148" y="82">0</text><text x="18" y="143">含噪輸入</text><rect x="140" y="127" width="5.999999999999997" height="23" fill="#267a77"/><text x="154" y="143">0.02</text><text x="18" y="204">偏離關係</text><rect x="140" y="188" width="150" height="23" fill="#267a77"/><text x="298" y="204">0.5</text><text x="18" y="265">符合關係但超範圍</text><rect x="140" y="249" width="0" height="23" fill="#267a77"/><text x="148" y="265">0</text><text x="18" y="337">門檻 0.1 只抓到本例的偏離關係。</text><text x="18" y="364">符合關係但超出範圍，誤差仍為 0。</text><text class="small" x="18" y="393">教學合成資料；這不是故障機率。</text></svg>