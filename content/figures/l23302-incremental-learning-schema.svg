<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 535" role="img" aria-labelledby="title desc">
<title id="title">新增樣本與特徵變動的決策流程</title>
<desc id="desc">固定兩欄的新批次可接續partial_fit；新增第三欄先停止直接更新，可從一開始用固定雜湊或另建字典版本重訓。形狀一致仍需核對欄位語意。</desc>
<rect width="360" height="535" fill="#fff"/>
<g font-family="sans-serif" font-size="13" fill="#172c46" stroke-linejoin="round">
<rect x="25" y="15" width="310" height="65" rx="6" fill="#e8eef5" stroke="#64748b"/>
<text x="42" y="41">舊批 20×2：x、x_squared</text><text x="42" y="64">模型記住兩欄的權重與語意</text>
<path d="M180 80 V105" stroke="#64748b"/><text x="169" y="104">↓</text>
<rect x="25" y="115" width="310" height="50" rx="6" fill="#fff1df" stroke="#b34b00"/>
<text x="43" y="145">新批：只增加樣本，還是增加欄位？</text>
<path d="M180 165 V190 H95 V210 M180 190 H270 V210" fill="none" stroke="#64748b"/>
<text x="50" y="204">原兩欄</text><text x="278" y="204">新增第三欄</text>
<rect x="15" y="220" width="155" height="80" rx="6" fill="#e8f4f1" stroke="#247663"/>
<text x="27" y="246">新批 20×2</text><text x="27" y="268">核對順序與單位</text><text x="27" y="289">再 partial_fit</text>
<rect x="190" y="220" width="155" height="80" rx="6" fill="#fff1df" stroke="#b34b00"/>
<text x="202" y="246">新批 20×3</text><text x="202" y="268">兩維模型拒絕</text><text x="202" y="289">先處理表示契約</text>
<path d="M270 300 V325" stroke="#64748b"/><text x="259" y="324">↓</text>
<rect x="25" y="335" width="310" height="80" rx="6" fill="#e8eef5" stroke="#64748b"/>
<text x="42" y="361">方案一：從第一批就固定 8 維雜湊</text><text x="42" y="384">新名稱映入原欄；接受碰撞代價</text><text x="42" y="405">既有兩維權重不能直接當八維權重</text>
<rect x="25" y="432" width="310" height="62" rx="6" fill="#e8eef5" stroke="#64748b"/>
<text x="42" y="458">方案二：字典 v2 對齊舊新資料</text><text x="42" y="481">建立新版模型，再獨立驗證</text>
<text x="25" y="520">更新前後均檢查新批與歷史留樣</text>
</g></svg>
