<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 355" role="img" aria-labelledby="title desc">
  <title id="title">同一混合句的字、詞與子詞對齊</title>
  <desc id="desc">教學合成句我用books訂位有九個字元。人工詞級切分為我、用、books、訂位四個詞。簡化子詞切分為我、用、book、s、訂、位六個單位。不含空白或特殊符號。</desc>
  <rect width="360" height="355" rx="10" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#0f172a" font-size="17">
    <text x="18" y="30" font-size="18" font-weight="700">相同文字，不同輸入邊界</text>
    <text x="18" y="64">字元：9 個</text><text x="18" y="145">詞：4 個</text><text x="18" y="226">本例子詞：6 個</text>
  </g>
  <g fill="#fff" stroke="#64748b">
    <rect x="18" y="78" width="36" height="38"/><rect x="54" y="78" width="36" height="38"/><rect x="90" y="78" width="36" height="38"/><rect x="126" y="78" width="36" height="38"/><rect x="162" y="78" width="36" height="38"/><rect x="198" y="78" width="36" height="38"/><rect x="234" y="78" width="36" height="38"/><rect x="270" y="78" width="36" height="38"/><rect x="306" y="78" width="36" height="38"/>
  </g>
  <g fill="#dbeafe" stroke="#1d4ed8"><rect x="18" y="159" width="36" height="38"/><rect x="54" y="159" width="36" height="38"/><rect x="90" y="159" width="180" height="38"/><rect x="270" y="159" width="72" height="38"/></g>
  <g fill="#dcfce7" stroke="#15803d"><rect x="18" y="240" width="36" height="38"/><rect x="54" y="240" width="36" height="38"/><rect x="90" y="240" width="144" height="38"/><rect x="234" y="240" width="36" height="38"/><rect x="270" y="240" width="36" height="38"/><rect x="306" y="240" width="36" height="38"/></g>
  <g font-family="sans-serif" fill="#0f172a" font-size="18" text-anchor="middle">
    <text x="36" y="103">我</text><text x="72" y="103">用</text><text x="108" y="103">b</text><text x="144" y="103">o</text><text x="180" y="103">o</text><text x="216" y="103">k</text><text x="252" y="103">s</text><text x="288" y="103">訂</text><text x="324" y="103">位</text>
    <text x="36" y="184">我</text><text x="72" y="184">用</text><text x="180" y="184">books</text><text x="306" y="184">訂位</text>
    <text x="36" y="265">我</text><text x="72" y="265">用</text><text x="162" y="265">book</text><text x="252" y="265">s</text><text x="288" y="265">訂</text><text x="324" y="265">位</text>
    <text x="180" y="313" font-size="15">字元位置對齊；空白與特殊符號未計入</text><text x="180" y="337" font-size="14">教學合成資料，不代表特定模型的輸出</text>
  </g>
</svg>
