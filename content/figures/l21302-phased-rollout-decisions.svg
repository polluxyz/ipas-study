<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 724" role="img" aria-labelledby="title desc"><title id="title">擴量、暫停與回復（補充）</title><desc id="desc">5%、30%、100%均需門控；先查回復門檻，再查延遲惡化的暫停優化條件及證據量，全部合格才能擴量。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#416583"/></marker></defs><rect width="360" height="724" fill="#fff"/><g font-family="sans-serif"><text x="180" y="29" text-anchor="middle" font-size="18" fill="#152b40">擴量、暫停與回復（補充）</text><rect x="12" y="58" width="96" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="60" y="84" text-anchor="middle" font-size="16" fill="#152b40">5%</text><text x="60" y="107" text-anchor="middle" font-size="16" fill="#152b40">新版比例</text><rect x="132" y="58" width="96" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="84" text-anchor="middle" font-size="16" fill="#152b40">30%</text><text x="180" y="107" text-anchor="middle" font-size="16" fill="#152b40">新版比例</text><rect x="252" y="58" width="96" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="300" y="84" text-anchor="middle" font-size="16" fill="#152b40">100%</text><text x="300" y="107" text-anchor="middle" font-size="16" fill="#152b40">新版比例</text><path d="M 109 93 L 130 93" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><path d="M 229 93 L 250 93" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><text x="180" y="154" text-anchor="middle" font-size="15" fill="#152b40">各階段都先驗收，再前進</text><path d="M 180 169 L 180 193" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><rect x="16" y="197" width="328" height="74" rx="9" fill="#fff0e8" stroke="#416583"/><text x="180" y="223" text-anchor="middle" font-size="16" fill="#152b40">觸發約定的回復門檻？</text><text x="180" y="246" text-anchor="middle" font-size="16" fill="#152b40">是 → 回復舊版，核對恢復</text><path d="M 180 274 L 180 298" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><text x="255" y="291" text-anchor="middle" font-size="13" fill="#152b40">否，繼續判斷</text><rect x="16" y="301" width="328" height="74" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="327" text-anchor="middle" font-size="16" fill="#152b40">延遲惡化達暫停門檻？</text><text x="180" y="350" text-anchor="middle" font-size="16" fill="#152b40">是 → 暫停擴量，分析與優化</text><path d="M 180 378 L 180 402" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><text x="255" y="397" text-anchor="middle" font-size="13" fill="#152b40">否，繼續判斷</text><rect x="16" y="405" width="328" height="74" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="431" text-anchor="middle" font-size="16" fill="#152b40">時間或樣本等證據不足？</text><text x="180" y="454" text-anchor="middle" font-size="16" fill="#152b40">是 → 暫停擴量，補齊證據</text><path d="M 180 482 L 180 506" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><text x="255" y="501" text-anchor="middle" font-size="13" fill="#152b40">否，證據齊全</text><rect x="16" y="509" width="328" height="74" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="535" text-anchor="middle" font-size="16" fill="#152b40">合格且證據齊全 → 擴量</text><text x="180" y="558" text-anchor="middle" font-size="16" fill="#152b40">已在全量 → 維持並持續監控</text><rect x="16" y="607" width="328" height="74" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="633" text-anchor="middle" font-size="16" fill="#152b40">回復點：模型＋API＋特徵規則</text><text x="180" y="656" text-anchor="middle" font-size="16" fill="#152b40">修改產物後重新驗證與觀察</text><text x="180" y="708" text-anchor="middle" font-size="13" fill="#152b40">教學示意｜非實際部署</text></g></svg>
