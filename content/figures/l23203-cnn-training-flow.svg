<svg xmlns="http://www.w3.org/2000/svg" width="360" height="716" viewBox="0 0 360 716" role="img" aria-labelledby="title desc"><title id="title">CNN 的前向與反向</title><desc id="desc">前向從影像經卷積、ReLU、池化、展平到 logits；logits 與標籤進損失，虛線分別回到卷積與 Linear，表示優化器更新兩者的權重及偏置。Softmax 另作展示，不先送入本例交叉熵。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L7 3 Z" fill="#475569"/></marker></defs><rect width="360" height="716" fill="#fff"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" fill="#0f172a"><text x="16" y="28" font-size="18" text-anchor="start">CNN 的前向與反向</text><rect x="68" y="56" width="256" height="58" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="196" y="79" font-size="16" text-anchor="middle">影像輸入</text><text x="196" y="101" font-size="14" text-anchor="middle">8×8×3</text><path d="M196 114 L196 133" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="68" y="134" width="256" height="58" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="196" y="157" font-size="16" text-anchor="middle">卷積：學局部模式</text><text x="196" y="179" font-size="14" text-anchor="middle">6×6×2</text><path d="M196 192 L196 211" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="68" y="212" width="256" height="58" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="196" y="235" font-size="16" text-anchor="middle">ReLU：加入非線性</text><text x="196" y="257" font-size="14" text-anchor="middle">6×6×2</text><path d="M196 270 L196 289" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="68" y="290" width="256" height="58" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="196" y="313" font-size="16" text-anchor="middle">池化：區域摘要</text><text x="196" y="335" font-size="14" text-anchor="middle">3×3×2</text><path d="M196 348 L196 367" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="68" y="368" width="256" height="58" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="196" y="391" font-size="16" text-anchor="middle">Flatten：重排</text><text x="196" y="413" font-size="14" text-anchor="middle">18 維，batch 保留</text><path d="M196 426 L196 445" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="68" y="446" width="256" height="58" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="196" y="469" font-size="16" text-anchor="middle">Linear：組合特徵</text><text x="196" y="491" font-size="14" text-anchor="middle">2 個 logits</text><path d="M171 504 L116 546" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><path d="M221 504 L265 546" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="42" y="548" width="146" height="58" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="115" y="571" font-size="16" text-anchor="middle">損失＋真實標籤</text><text x="115" y="593" font-size="14" text-anchor="middle">反向求梯度</text><rect x="204" y="548" width="140" height="58" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="274" y="571" font-size="16" text-anchor="middle">Softmax</text><text x="274" y="593" font-size="14" text-anchor="middle">展示機率</text><path d="M42 576 H26 V164 H64" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M26 476 H64" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="180" y="643" font-size="14" text-anchor="middle">虛線：優化器依梯度更新可訓練參數</text><text x="180" y="672" font-size="14" text-anchor="middle">前向沿實線走；展示機率是另一分支</text><text x="16" y="702" font-size="12" text-anchor="start">來源：教學合成資料</text></g></svg>
