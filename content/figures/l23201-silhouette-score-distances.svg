<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 365" role="img" aria-labelledby="title desc"><title id="title">群內與鄰群距離</title><desc id="desc">教學合成資料四筆子集；圓點為群零，方點為群一。由 E01 向同群及外群全體計算歐氏距離。</desc><style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#172b4d;font-size:13px}.head{font-size:16px;font-weight:700}.small{font-size:12px}.axis{stroke:#60738d;stroke-width:1.5}.inside{stroke:#1463b5;stroke-width:2.5}.outside{stroke:#a14700;stroke-width:2;stroke-dasharray:5 4}</style><rect width="360" height="365" fill="#fff" rx="12"/><text x="18" y="28" class="head">同群看其他點，鄰群看整群平均</text><text x="18" y="50" class="">金額換算值（千元）</text><line x1="35" y1="235" x2="335" y2="235" class="axis"/><line x1="35" y1="235" x2="35" y2="73" class="axis"/><line x1="45" y1="220" x2="45" y2="120" class="inside"/><line x1="45" y1="220" x2="285" y2="220" class="outside"/><line x1="45" y1="220" x2="285" y2="120" class="outside"/><circle cx="45" cy="220" r="6" fill="#1463b5" stroke="#fff"/><text x="33" y="240" class="">E01</text><circle cx="45" cy="120" r="6" fill="#1463b5" stroke="#fff"/><text x="33" y="107" class="">E02</text><rect x="279" y="214" width="12" height="12" fill="#a14700" stroke="#fff"/><text x="273" y="240" class="">E09</text><rect x="279" y="114" width="12" height="12" fill="#a14700" stroke="#fff"/><text x="273" y="107" class="">E10</text><text x="59" y="174" class="">距離 2</text><text x="170" y="213" class="">距離 6</text><text x="175" y="157" class="">距離 6.3246</text><text x="215" y="265" class="">訂單次數（次）</text><text x="18" y="291" class="">a＝2.0000　b＝6.1623</text><text x="18" y="315" class="">E01 輪廓係數＝0.6754</text><text x="18" y="344" class="small">教學合成資料；只計四筆，非完整 24 筆</text></svg>