<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">主張與來源核對</title><desc id="desc">客服候選B聲稱一日內回覆，來源是三日。逐項核對可分辨語句通順與事實正確。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#475569"/></marker></defs><rect width="360" height="350" rx="12" fill="#f8fafc"/><g font-family="sans-serif" font-size="15" fill="#172554"><text x="18" y="27" font-size="15">CS01：語句自然，仍須比對主張</text><rect x="20" y="46" width="320" height="65" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="32" y="70" font-size="15">來源 CS01-S1-p1</text><text x="32" y="93" font-size="15">客服會在三日內回覆申請。</text><path d="M180 111L180 132" stroke="#475569" fill="none" marker-end="url(#arrow)"/><rect x="20" y="138" width="320" height="65" rx="8" fill="#fef3c7" stroke="#64748b"/><text x="32" y="162" font-size="15">候選 B</text><text x="32" y="185" font-size="15">客服於一日內回覆申請。</text><path d="M180 203L180 224" stroke="#475569" fill="none" marker-end="url(#arrow)"/><rect x="20" y="230" width="320" height="65" rx="8" fill="#fee2e2" stroke="#64748b"/><text x="32" y="254" font-size="15">核對結果：期限與來源矛盾</text><text x="32" y="277" font-size="15">修正為三日，再交人工覆核。</text><text x="20" y="323" font-size="13">依據：本組教學合成資料；不是實際客服政策</text></g></svg>
