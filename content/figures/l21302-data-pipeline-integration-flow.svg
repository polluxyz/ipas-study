<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 782" role="img" aria-labelledby="title desc"><title id="title">從多種資料到可用特徵</title><desc id="desc">倉儲、湖、IoT 與 API 經擷取轉換清理入庫；事件分流至即時特徵及離線倉儲。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#285177"/></marker></defs><rect width="360" height="782" fill="white"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="16" fill="#172d43"><text x="180" y="30" text-anchor="middle" font-weight="700">從多種資料到可用特徵</text><text x="180" y="50" text-anchor="middle" font-size="12">示意圖；下半部為補充流程</text><text x="180" y="70" text-anchor="middle" font-weight="700">異質來源先整合</text><rect x="30" y="90" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="114" text-anchor="middle"><tspan x="180" dy="0">資料倉儲／資料湖</tspan><tspan x="180" dy="22">IoT 感測／第三方 API</tspan></text><path d="M180 150 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="176" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="200" text-anchor="middle"><tspan x="180" dy="0">擷取 → 格式轉換</tspan><tspan x="180" dy="22">保留來源 ID，統一時間與單位</tspan></text><path d="M180 236 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="262" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="286" text-anchor="middle"><tspan x="180" dy="0">清理 → 入庫</tspan><tspan x="180" dy="22">隔離壞資料，保存版本與品質紀錄</tspan></text><text x="180" y="364" text-anchor="middle" font-weight="700">即時與離線分流（補充）</text><rect x="30" y="384" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="408" text-anchor="middle"><tspan x="180" dy="0">事件 → Kafka</tspan><tspan x="180" dy="22">保存事件，交給串流處理</tspan></text><path d="M180 444 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="470" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="494" text-anchor="middle"><tspan x="180" dy="0">特徵計算 → Redis／特徵儲存</tspan><tspan x="180" dy="22">寫入 f1 及特徵時間</tspan></text><path d="M180 530 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="556" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="580" text-anchor="middle"><tspan x="180" dy="0">推論服務讀取新特徵</tspan><tspan x="180" dy="22">過期時依規則降級或重算</tspan></text><path d="M330 413 H348 V677 H332" stroke="#285177" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow)"/><rect x="30" y="648" width="300" height="58" rx="8" fill="#f7f3e7" stroke="#285177"/><text x="180" y="672" text-anchor="middle"><tspan x="180" dy="0">離線倉儲保存歷史事件</tspan><tspan x="180" dy="22">供訓練、稽核與回放</tspan></text><text x="180" y="730" text-anchor="middle" font-size="14">虛線：同一批事件另存離線歷史</text></g></svg>
