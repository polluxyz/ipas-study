<svg xmlns="http://www.w3.org/2000/svg" width="360" height="335" viewBox="0 0 360 335" role="img" aria-labelledby="title desc"><title id="title">先在類別內估計詞證據</title><desc id="desc">類別先驗乘以同類內各詞機率，正規化後比較後驗。條件獨立是給定類別後的假設。</desc><rect width="360" height="335" fill="#fff"/><g fill="#16283a" font-family="sans-serif"><text x="180" y="27" font-size="17" text-anchor="middle">先在類別內估計詞證據</text><rect x="90" y="48" width="180" height="38" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="72" font-size="15" text-anchor="middle">有標籤的訓練文件</text><path d="M180 86L60 113" stroke="#526577" stroke-width="2" fill="none"/><rect x="10" y="113" width="100" height="38" rx="8" fill="#edf3fa" stroke="#526577"/><text x="60" y="137" font-size="15" text-anchor="middle">促銷類文件</text><path d="M60 151L60 178" stroke="#526577" stroke-width="2" fill="none"/><rect x="10" y="178" width="100" height="38" rx="8" fill="#edf3fa" stroke="#526577"/><text x="60" y="202" font-size="15" text-anchor="middle">類內詞機率</text><path d="M60 216L180 244" stroke="#526577" stroke-width="2" fill="none"/><path d="M180 86L180 113" stroke="#526577" stroke-width="2" fill="none"/><rect x="130" y="113" width="100" height="38" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="137" font-size="15" text-anchor="middle">工作類文件</text><path d="M180 151L180 178" stroke="#526577" stroke-width="2" fill="none"/><rect x="130" y="178" width="100" height="38" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="202" font-size="15" text-anchor="middle">類內詞機率</text><path d="M180 216L180 244" stroke="#526577" stroke-width="2" fill="none"/><path d="M180 86L300 113" stroke="#526577" stroke-width="2" fill="none"/><rect x="250" y="113" width="100" height="38" rx="8" fill="#edf3fa" stroke="#526577"/><text x="300" y="137" font-size="15" text-anchor="middle">私人類文件</text><path d="M300 151L300 178" stroke="#526577" stroke-width="2" fill="none"/><rect x="250" y="178" width="100" height="38" rx="8" fill="#edf3fa" stroke="#526577"/><text x="300" y="202" font-size="15" text-anchor="middle">類內詞機率</text><path d="M300 216L180 244" stroke="#526577" stroke-width="2" fill="none"/><rect x="55" y="244" width="250" height="44" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="271" font-size="15" text-anchor="middle">先驗 × 詞證據 → 正規化</text><text x="180" y="309" font-size="14" text-anchor="middle">相乘之前，先說明條件獨立</text><text x="180" y="322" font-size="12" text-anchor="middle">教學合成資料／流程示意</text></g></svg>
