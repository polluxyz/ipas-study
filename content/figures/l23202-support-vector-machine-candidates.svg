<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" role="img" aria-labelledby="title desc">
  <title id="title">很多條線都能分類，SVM 選離兩類都最遠的線</title>
  <desc id="desc">二維平面上有 7 個藍色圓點和 7 個橘色三角形。3 條垂直的候選分類邊界都能把兩群分開。A 靠藍群太近，B 靠橘群太近，新資料稍偏就可能分錯。較粗的 C 位於空隙正中間，離兩類最近的點都最遠，是這組可分資料的 SVM 選擇。</desc>
  <rect width="700" height="600" fill="#fff"/>
  <g font-family="Arial,Microsoft JhengHei,sans-serif" fill="#172c43">
    <text x="32" y="40" font-size="24" font-weight="700">能分開兩類的線很多，選哪條？</text>
    <text x="32" y="73" font-size="16">A、B、C 都分得開；看哪條離兩類最近的點都最遠。</text>

    <g stroke="#172c43" stroke-width="1.5" fill="none">
      <path d="M70 130V440H650"/>
      <path d="m65 138 5-8 5 8M642 435l8 5-8 5"/>
    </g>
    <text x="44" y="115" font-size="14">特徵 2</text>
    <text x="596" y="469" font-size="14">特徵 1</text>

    <g stroke="#172c43" fill="none">
      <path d="M275 150V405M415 150V405" stroke-width="2" opacity="0.6"/>
      <path d="M345 150V405" stroke-width="4.5"/>
    </g>
    <g font-size="20" text-anchor="middle" font-weight="700">
      <text x="275" y="133">A</text>
      <text x="345" y="133">C</text>
      <text x="415" y="133">B</text>
    </g>

    <g fill="#2463a6">
      <circle cx="118" cy="157" r="6"/>
      <circle cx="120" cy="245" r="7"/>
      <circle cx="150" cy="195" r="7"/>
      <circle cx="155" cy="325" r="7"/>
      <circle cx="205" cy="225" r="7"/>
      <circle cx="210" cy="365" r="7"/>
      <circle cx="260" cy="250" r="7"/>
      <circle cx="260" cy="320" r="7"/>
    </g>
    <text x="134" y="163" font-size="15">藍群</text>
    <g fill="#ac4200">
      <path d="m513 150 7 13h-14Z"/>
      <path d="m570 237 8 15h-16Z"/>
      <path d="m540 187 8 15h-16Z"/>
      <path d="m535 317 8 15h-16Z"/>
      <path d="m485 217 8 15h-16Z"/>
      <path d="m480 357 8 15h-16Z"/>
      <path d="m430 242 8 15h-16Z"/>
      <path d="m430 312 8 15h-16Z"/>
    </g>
    <text x="529" y="163" font-size="15">橘群</text>

    <g font-size="16">
      <text x="34" y="504" font-weight="700">A 靠藍群太近</text>
      <text x="34" y="530">新資料稍偏就可能分錯</text>
      <text x="260" y="504" font-weight="700">C 離兩類都最遠</text>
      <text x="260" y="530" font-weight="700">→ SVM 的選擇</text>
      <text x="486" y="504" font-weight="700">B 靠橘群太近</text>
      <text x="486" y="530">新資料稍偏就可能分錯</text>
    </g>
    <text x="32" y="578" font-size="13">資料：教學合成</text>
  </g>
</svg>
