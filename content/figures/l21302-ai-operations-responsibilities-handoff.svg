<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 577" role="img" aria-labelledby="title desc"><title id="title">部門責任交接</title><desc id="desc">業務提出需求，客服回收互動，資料模型團隊提出修正，法務風險審查和資訊部署各負其責；教學示意圖，框內為職責或檢查點。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#385c78"/></marker></defs><rect width="360" height="577" fill="#fff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#172f43"><text x="180" y="30" text-anchor="middle" font-size="20" font-weight="700">部門責任交接</text><text x="180" y="51" text-anchor="middle" font-size="13">教學示意圖・沿箭頭追蹤交付</text><rect x="28" y="65" width="304" height="64" rx="9" fill="#eef5fb" stroke="#385c78"/><text x="180" y="90" text-anchor="middle" font-size="18" font-weight="700">業務、行銷</text><text x="180" y="114" text-anchor="middle" font-size="16">提出需求與成效指標</text><path d="M180 130v23" stroke="#385c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="156" width="304" height="64" rx="9" fill="#eef5fb" stroke="#385c78"/><text x="180" y="181" text-anchor="middle" font-size="18" font-weight="700">客服、營運</text><text x="180" y="205" text-anchor="middle" font-size="16">回收互動與異常反應</text><path d="M180 221v23" stroke="#385c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="247" width="304" height="64" rx="9" fill="#eef5fb" stroke="#385c78"/><text x="180" y="272" text-anchor="middle" font-size="18" font-weight="700">資料、模型人員（補充）</text><text x="180" y="296" text-anchor="middle" font-size="16">定位問題、提出候選及證據</text><path d="M180 312v23" stroke="#385c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="338" width="304" height="64" rx="9" fill="#eef5fb" stroke="#385c78"/><text x="180" y="363" text-anchor="middle" font-size="18" font-weight="700">法務、風險</text><text x="180" y="387" text-anchor="middle" font-size="16">審查隱私、公平與揭露</text><path d="M180 403v23" stroke="#385c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="429" width="304" height="64" rx="9" fill="#eef5fb" stroke="#385c78"/><text x="180" y="454" text-anchor="middle" font-size="18" font-weight="700">資訊與現場共同驗收</text><text x="180" y="478" text-anchor="middle" font-size="16">資訊部署維運；現場核對效果</text><text x="180" y="557" text-anchor="middle" font-size="15">箭頭是交付；審查可以提早並行</text></g></svg>
