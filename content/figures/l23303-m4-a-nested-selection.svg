<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 970" width="360" height="970" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">巢狀驗證的內層最佳分數與外層結果</title><desc id="desc">同一批三個候選在每個外層訓練資料內搜尋。第四摺內層最佳 MAE 0.610 箱，重訓後獨立外層為 10.437 箱；其餘摺也呈現相反高低。完整評估四十次擬合，最後搜尋重訓十次。</desc>
<style>:root{color-scheme:light dark;--bg:#fbfcfe;--ink:#203548;--muted:#486174;--train:#08665f;--trainbg:#eaf5f1;--val:#a14d0e;--valbg:#fff2df;--bad:#a72840;--badbg:#fff0f2;--line:#8ba0af}
@media(prefers-color-scheme:dark){:root{--bg:#16242e;--ink:#ecf2f6;--muted:#bdcdd8;--train:#83ded0;--trainbg:#203d3b;--val:#ffd198;--valbg:#463426;--bad:#ffabc0;--badbg:#442c35;--line:#93a6b4}}
text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:var(--ink);font-size:16px}.head{font-size:21px;font-weight:700}.strong{font-weight:700}.small{font-size:15px}.muted{fill:var(--muted)}.box{fill:var(--bg);stroke:var(--line);stroke-width:1.3}.train{fill:var(--trainbg);stroke:var(--train);stroke-width:1.5}.val{fill:var(--valbg);stroke:var(--val);stroke-width:1.5;stroke-dasharray:5 3}.bad{fill:var(--badbg);stroke:var(--bad);stroke-width:1.5;stroke-dasharray:2 3}.arrow{stroke:var(--muted);stroke-width:1.8;fill:none;marker-end:url(#arrow)}.rule{stroke:var(--line);stroke-width:1}</style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--muted)"/></marker></defs>
<rect width="360" height="970" rx="10" fill="var(--bg)"/><text x="18" y="32" class="head">選參數的分數，另留資料檢查</text><text x="18" y="59" class="small muted">教學合成出貨資料｜MAE 單位：箱</text><rect x="12" y="78" width="336" height="95" rx="8" class="train"/><text x="24" y="105" class="strong">每個外層：6 筆訓練</text><text x="24" y="132" class="">內層只在這 6 筆中切 3 摺</text><text x="24" y="158" class="">候選 alpha 固定為 0.1、1、10</text><path d="M180 178V202" class="arrow"/><rect x="12" y="211" width="336" height="98" rx="8" class="train"/><text x="24" y="238" class="strong">依內層平均 MAE 最小者選參數</text><text x="24" y="266" class="">用選中的設定，在 6 筆上重訓</text><text x="24" y="292" class="">搜尋時，前處理只用內層訓練 fit</text><path d="M180 314V338" class="arrow"/><rect x="12" y="347" width="336" height="95" rx="8" class="val"/><text x="24" y="375" class="strong">獨立外層：另 2 筆評估</text><text x="24" y="401" class="">不參與選參數，不挑最好外層</text><text x="24" y="426" class="">每個外層都重做上面的流程</text><text x="18" y="479" class="strong">同批候選，內外結果分開報</text><text x="18" y="507" class="small">外層 / alpha   內層最佳   外層 MAE</text><rect x="12" y="526" width="336" height="38" rx="8" class="box"/><text x="23" y="551" class="">1 / 1</text><text x="138" y="551" class="">7.267</text><text x="251" y="551" class="">3.333</text><rect x="12" y="571" width="336" height="38" rx="8" class="box"/><text x="23" y="596" class="">2 / 1</text><text x="138" y="596" class="">7.568</text><text x="251" y="596" class="">3.061</text><rect x="12" y="616" width="336" height="38" rx="8" class="box"/><text x="23" y="641" class="">3 / 1</text><text x="138" y="641" class="">9.499</text><text x="251" y="641" class="">3.165</text><rect x="12" y="661" width="336" height="38" rx="8" class="bad"/><text x="23" y="686" class="">4 / 0.1</text><text x="138" y="686" class="">0.610</text><text x="251" y="686" class="">10.437</text><text x="18" y="736" class="strong">第四摺：0.610 不能當獨立成效。</text><text x="18" y="764" class="">前三摺反而是外層誤差較小。</text><text x="18" y="792" class="small muted">單次高低不證明、也不推翻偏差。</text><rect x="12" y="818" width="336" height="92" rx="8" class="box"/><text x="24" y="845" class="strong">成本：4 × (3 × 3 + 1) = 40</text><text x="24" y="872" class="">最後全部 8 筆重新搜尋與重訓</text><text x="24" y="898" class="">再加 10 次，共 50 次；alpha=1</text><text x="18" y="945" class="small muted">最後模型仍未取得獨立測試成績。</text></svg>
