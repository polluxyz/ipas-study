<svg xmlns="http://www.w3.org/2000/svg" width="390" height="675" viewBox="0 0 390 675" role="img" aria-labelledby="title desc" lang="zh-Hant"><title id="title">訓練、驗證與測試的角色</title><desc id="desc">S01 至 S10 依序分為驗證、訓練、訓練、驗證、訓練、訓練、測試、訓練、訓練、測試；開發時訓練與驗證形成迴圈，選定設定後以訓練和驗證集重新擬合，最後以保留測試集評估。</desc><style>
:root { color-scheme: light dark; --bg:#f9fbf9; --ink:#263a45; --muted:#465b66; --train:#006b66; --train-bg:#edf5f4; --val:#9a3c00; --val-bg:#fff0e3; --test:#504ca2; --test-bg:#efedff; --rule:#a5b8bd; }
@media (prefers-color-scheme:dark) { :root { --bg:#15252b; --ink:#e4edf1; --muted:#bbcbd2; --train:#78ded2; --train-bg:#24373d; --val:#ffbf86; --val-bg:#3a2e25; --test:#c7bcff; --test-bg:#363048; --rule:#71868c; } }
text { font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; fill:var(--ink); font-size:14px; }
.bg { fill:var(--bg) } .title { font-size:22px; font-weight:700 } .sub,.note { fill:var(--muted); font-size:13px } .strong { font-weight:700 } .small { font-size:12px } .tiny { font-size:11px } .id { font-size:11px; font-weight:700 } .train { fill:var(--train-bg); stroke:var(--train); stroke-width:1.4 } .val { fill:url(#hatch); stroke:var(--val); stroke-width:1.5; stroke-dasharray:4 2 } .test { fill:var(--test-bg); stroke:var(--test); stroke-width:1.5; stroke-dasharray:1 2 } .hb { fill:var(--val-bg) } .hl { stroke:var(--val); stroke-width:1; opacity:.25 } .line { stroke:var(--muted); stroke-width:1.5; fill:none; marker-end:url(#arrow) } .rule { stroke:var(--rule); fill:none } .box { fill:var(--bg); stroke:var(--rule); stroke-width:1.3 } 
</style><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect class="hb" width="8" height="8"/><path class="hl" d="M0 8L8 0"/></pattern><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--muted)"/></marker></defs><rect class="bg" width="390" height="675" rx="12"/><text x="18" y="35" class="title" >訓練、驗證與測試</text><text x="18" y="58" class="sub" >同一批 10 筆資料，依角色分開使用</text><text x="18" y="86" class="strong" >原始欄序</text><text x="18" y="105" class="note" >類別 0＝負類；1＝正類</text><g data-index="1" data-label="0" data-use="val"><rect class="val" x="18" y="120" width="32" height="42" rx="4"/><text x="34" y="136" class="id" text-anchor="middle">S01</text><text x="34" y="153" class="small strong" text-anchor="middle">驗</text><text x="34" y="182" class="small" text-anchor="middle">0</text></g><g data-index="2" data-label="0" data-use="train"><rect class="train" x="53.5" y="120" width="32" height="42" rx="4"/><text x="69.5" y="136" class="id" text-anchor="middle">S02</text><text x="69.5" y="153" class="small strong" text-anchor="middle">訓</text><text x="69.5" y="182" class="small" text-anchor="middle">0</text></g><g data-index="3" data-label="0" data-use="train"><rect class="train" x="89" y="120" width="32" height="42" rx="4"/><text x="105" y="136" class="id" text-anchor="middle">S03</text><text x="105" y="153" class="small strong" text-anchor="middle">訓</text><text x="105" y="182" class="small" text-anchor="middle">0</text></g><g data-index="4" data-label="1" data-use="val"><rect class="val" x="124.5" y="120" width="32" height="42" rx="4"/><text x="140.5" y="136" class="id" text-anchor="middle">S04</text><text x="140.5" y="153" class="small strong" text-anchor="middle">驗</text><text x="140.5" y="182" class="small" text-anchor="middle">1</text></g><g data-index="5" data-label="1" data-use="train"><rect class="train" x="160" y="120" width="32" height="42" rx="4"/><text x="176" y="136" class="id" text-anchor="middle">S05</text><text x="176" y="153" class="small strong" text-anchor="middle">訓</text><text x="176" y="182" class="small" text-anchor="middle">1</text></g><g data-index="6" data-label="1" data-use="train"><rect class="train" x="195.5" y="120" width="32" height="42" rx="4"/><text x="211.5" y="136" class="id" text-anchor="middle">S06</text><text x="211.5" y="153" class="small strong" text-anchor="middle">訓</text><text x="211.5" y="182" class="small" text-anchor="middle">1</text></g><g data-index="7" data-label="0" data-use="test"><rect class="test" x="231" y="120" width="32" height="42" rx="4"/><text x="247" y="136" class="id" text-anchor="middle">S07</text><text x="247" y="153" class="small strong" text-anchor="middle">測</text><text x="247" y="182" class="small" text-anchor="middle">0</text></g><g data-index="8" data-label="1" data-use="train"><rect class="train" x="266.5" y="120" width="32" height="42" rx="4"/><text x="282.5" y="136" class="id" text-anchor="middle">S08</text><text x="282.5" y="153" class="small strong" text-anchor="middle">訓</text><text x="282.5" y="182" class="small" text-anchor="middle">1</text></g><g data-index="9" data-label="0" data-use="train"><rect class="train" x="302" y="120" width="32" height="42" rx="4"/><text x="318" y="136" class="id" text-anchor="middle">S09</text><text x="318" y="153" class="small strong" text-anchor="middle">訓</text><text x="318" y="182" class="small" text-anchor="middle">0</text></g><g data-index="10" data-label="1" data-use="test"><rect class="test" x="337.5" y="120" width="32" height="42" rx="4"/><text x="353.5" y="136" class="id" text-anchor="middle">S10</text><text x="353.5" y="153" class="small strong" text-anchor="middle">測</text><text x="353.5" y="182" class="small" text-anchor="middle">1</text></g><text x="18" y="205" class="small" >訓：訓練 6 筆（3 負／3 正）</text><text x="18" y="224" class="small" >驗：驗證 2 筆（1 負／1 正）</text><text x="18" y="243" class="small" >測：測試 2 筆（1 負／1 正）</text><path class="rule" d="M18 257H372"/><text x="18" y="282" class="strong" >開發迴圈</text><rect class="train" x="20" y="296" width="145" height="53" rx="4"/><text x="92" y="318" class="strong" text-anchor="middle">訓練集</text><text x="92" y="338" class="small" text-anchor="middle">學習模型參數</text><rect class="val" x="223" y="296" width="145" height="53" rx="4"/><text x="295" y="318" class="strong" text-anchor="middle">驗證集</text><text x="295" y="338" class="small" text-anchor="middle">比較設定</text><path class="line" d="M165 312H221"/><path class="line" d="M223 336H167"/><text x="18" y="382" class="strong" >選定設定後</text><rect class="train" x="20" y="395" width="348" height="44" rx="4"/><text x="194" y="423" class="strong" text-anchor="middle">訓練＋驗證：共 8 筆開發資料</text><path class="line" d="M194 439V458"/><rect class="box" x="20" y="461" width="348" height="44" rx="4"/><text x="194" y="489" class="strong" text-anchor="middle">重新擬合前處理與模型</text><path class="line" d="M194 505V524"/><rect class="test" x="20" y="527" width="348" height="44" rx="4"/><text x="194" y="555" class="strong" text-anchor="middle">測試集：最後評估</text><text x="18" y="606" class="note" >比例 6:2:2 只是示例。</text><text x="18" y="628" class="note" >本圖不按時間切；不是未來交易預測方案。</text><text x="18" y="653" class="note" >資料：L23303-splits.json</text></svg>
