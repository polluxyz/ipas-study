<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 465" role="img"><title>BN 統計軸與模式</title><desc>同一特徵沿四筆樣本計算平均與變異；訓練更新移動統計，推論沿用儲存值。</desc><rect width="360" height="465" fill="#fff"/><g font-family="sans-serif"><text x="16" y="25" font-size="17" fill="#17243a">4 筆 × 2 特徵：沿直欄計算</text><text x="16" y="49" font-size="13" fill="#17243a">列＝樣本；欄＝特徵，欄與欄不混合。</text><text x="16" y="85" font-size="13" fill="#17243a">樣本 1</text><rect x="96" y="64" width="80" height="32" rx="3" fill="#e0edf8"/><text x="126" y="85" font-size="15" fill="#17243a">1</text><rect x="194" y="64" width="80" height="32" rx="3" fill="#f8e8d3"/><text x="224" y="85" font-size="15" fill="#17243a">10</text><text x="16" y="123" font-size="13" fill="#17243a">樣本 2</text><rect x="96" y="102" width="80" height="32" rx="3" fill="#e0edf8"/><text x="126" y="123" font-size="15" fill="#17243a">3</text><rect x="194" y="102" width="80" height="32" rx="3" fill="#f8e8d3"/><text x="224" y="123" font-size="15" fill="#17243a">14</text><text x="16" y="161" font-size="13" fill="#17243a">樣本 3</text><rect x="96" y="140" width="80" height="32" rx="3" fill="#e0edf8"/><text x="126" y="161" font-size="15" fill="#17243a">5</text><rect x="194" y="140" width="80" height="32" rx="3" fill="#f8e8d3"/><text x="224" y="161" font-size="15" fill="#17243a">18</text><text x="16" y="199" font-size="13" fill="#17243a">樣本 4</text><rect x="96" y="178" width="80" height="32" rx="3" fill="#e0edf8"/><text x="126" y="199" font-size="15" fill="#17243a">7</text><rect x="194" y="178" width="80" height="32" rx="3" fill="#f8e8d3"/><text x="224" y="199" font-size="15" fill="#17243a">22</text><text x="98" y="239" font-size="13" fill="#17243a">↓ 同欄統計</text><text x="197" y="239" font-size="13" fill="#17243a">↓ 同欄統計</text><text x="92" y="266" font-size="13" fill="#17243a">平均 4</text><text x="194" y="266" font-size="13" fill="#17243a">平均 16</text><text x="92" y="291" font-size="13" fill="#17243a">變異 5</text><text x="194" y="291" font-size="13" fill="#17243a">變異 20</text><text x="16" y="329" font-size="15" fill="#17243a">線性層 → BN → 激活 → 下一層</text><text x="16" y="360" font-size="13" fill="#17243a">訓練：當批統計算輸出，更新移動統計。</text><text x="16" y="387" font-size="13" fill="#17243a">推論：用已存統計，不重新估計當批。</text><text x="16" y="422" font-size="13" fill="#17243a">LayerNorm：改沿同一列的特徵統計。</text><text x="16" y="447" font-size="12" fill="#17243a">教學合成資料；軸與流程細節為補充。</text></g></svg>
