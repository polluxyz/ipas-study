<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 246" role="img" aria-labelledby="title desc"><title id="title">整體SHAP平均絕對貢獻</title><desc id="desc">負債0.9、收入0.6、年齡0.24，與個案方向是不同問題。</desc><rect width="360" height="246" fill="#fff"/><g font-family="sans-serif"><text x="16" y="25" font-size="16" text-anchor="start" fill="#172b4d">同一背景 80 筆：平均絕對貢獻</text><text x="15" y="71" font-size="14" text-anchor="start" fill="#172b4d">收入</text><rect x="83" y="52" width="131.99999999999972" height="26" fill="#126a9b"/><text x="340" y="72" font-size="14" text-anchor="end" fill="#172b4d">0.60</text><text x="15" y="118" font-size="14" text-anchor="start" fill="#172b4d">負債比</text><rect x="83" y="99" width="198.0000000000002" height="26" fill="#126a9b"/><text x="340" y="119" font-size="14" text-anchor="end" fill="#172b4d">0.90</text><text x="15" y="165" font-size="14" text-anchor="start" fill="#172b4d">年齡</text><rect x="83" y="146" width="52.79999999999997" height="26" fill="#126a9b"/><text x="340" y="166" font-size="14" text-anchor="end" fill="#172b4d">0.24</text><text x="180" y="210" font-size="13" text-anchor="middle" fill="#172b4d">單位：log-odds；絕對值不保留方向</text><text x="180" y="233" font-size="12" text-anchor="middle" fill="#172b4d">教學合成資料；不是因果重要性</text></g></svg>
