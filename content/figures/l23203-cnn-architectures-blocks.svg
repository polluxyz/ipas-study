<svg xmlns="http://www.w3.org/2000/svg" width="360" height="835" viewBox="0 0 360 835" role="img" aria-labelledby="title desc"><title id="title">小核堆疊與多尺度分支</title><desc id="desc">上方為兩層小核，下方為四條平行分支，所有分支高寬相同後再拼接。 教學合成資料，數值由 L23203-E-tensors.json 重建。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#334155"/></marker></defs><rect width="360" height="835" fill="#ffffff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#0f172a"><text x="18" y="29" font-size="17" font-weight="700">小核堆疊與多尺度分支</text><text x="18" y="57" font-size="15" font-weight="700">VGG 風格：同一路徑重複小核</text><rect x="40" y="72" width="280" height="44" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="52" y="95" font-size="15" font-weight="700">輸入 6×6×2</text><path d="M180,116 L180,138" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="138" width="280" height="44" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="52" y="161" font-size="15" font-weight="700">3×3 卷積＋ReLU，2 通道</text><path d="M180,182 L180,204" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="204" width="280" height="44" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="52" y="227" font-size="15" font-weight="700">3×3 卷積，維持 2 通道</text><text x="20" y="275" font-size="14">兩層 3×3：72；一層 5×5：100 權重</text><text x="18" y="315" font-size="15" font-weight="700">Inception 風格：平行分支再拼接</text><rect x="25" y="334" width="310" height="44" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="37" y="357" font-size="15" font-weight="700">同一輸入 6×6×2</text><path d="M180,378 L180,392 L35,392 L35,645" fill="none" stroke="#334155" stroke-width="2"/><path d="M35,432 L90,432" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="90" y="408" width="240" height="51" rx="9" fill="#dcfce7" stroke="#475569"/><text x="102" y="431" font-size="15" font-weight="700">1×1 卷積</text><text x="102" y="453" font-size="14">輸出 6×6×2</text><path d="M330,432 L345,432" fill="none" stroke="#334155" stroke-width="2"/><path d="M35,500 L90,500" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="90" y="476" width="240" height="51" rx="9" fill="#dcfce7" stroke="#475569"/><text x="102" y="499" font-size="15" font-weight="700">1×1→3×3 卷積</text><text x="102" y="521" font-size="14">輸出 6×6×2</text><path d="M330,500 L345,500" fill="none" stroke="#334155" stroke-width="2"/><path d="M35,568 L90,568" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="90" y="544" width="240" height="51" rx="9" fill="#dcfce7" stroke="#475569"/><text x="102" y="567" font-size="15" font-weight="700">1×1→5×5 卷積</text><text x="102" y="589" font-size="14">輸出 6×6×1</text><path d="M330,568 L345,568" fill="none" stroke="#334155" stroke-width="2"/><path d="M35,636 L90,636" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="90" y="612" width="240" height="51" rx="9" fill="#dcfce7" stroke="#475569"/><text x="102" y="635" font-size="15" font-weight="700">3×3 池化→1×1 卷積</text><text x="102" y="657" font-size="14">輸出 6×6×1</text><path d="M330,636 L345,636" fill="none" stroke="#334155" stroke-width="2"/><path d="M345,432 L345,698 L180,698 L180,716" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="716" width="310" height="55" rx="9" fill="#fef3c7" stroke="#475569"/><text x="37" y="739" font-size="15" font-weight="700">沿通道拼接</text><text x="37" y="761" font-size="14">輸出 6×6×6；高寬不變</text><text x="18" y="797" font-size="13">尺寸及通道配置為本組補充算例</text><text x="18" y="820" font-size="12">教學示意／合成資料；非成效評估</text></g></svg>
