<svg xmlns="http://www.w3.org/2000/svg" width="360" height="450" viewBox="0 0 360 450" role="img" aria-labelledby="title desc"><title id="title">按全域順序共享前綴</title><desc id="desc">根的分支B7、A1、C1、D1；B下A4與C2；BA下C2與D1。各節點計數由交易表建立。</desc><rect width="360" height="450" fill="#fff"/><g fill="#16283a" font-family="sans-serif"><text x="180" y="27" font-size="17" text-anchor="middle">按全域順序共享前綴</text><path d="M180 81L70 129" stroke="#526577" stroke-width="2" fill="none"/><path d="M70 161L40 219" stroke="#526577" stroke-width="2" fill="none"/><path d="M40 251L25 309" stroke="#526577" stroke-width="2" fill="none"/><rect x="1" y="309" width="48" height="32" rx="8" fill="#edf3fa" stroke="#526577"/><text x="25" y="330" font-size="15" text-anchor="middle">C:2</text><path d="M40 251L80 309" stroke="#526577" stroke-width="2" fill="none"/><rect x="56" y="309" width="48" height="32" rx="8" fill="#edf3fa" stroke="#526577"/><text x="80" y="330" font-size="15" text-anchor="middle">D:1</text><rect x="16" y="219" width="48" height="32" rx="8" fill="#edf3fa" stroke="#526577"/><text x="40" y="240" font-size="15" text-anchor="middle">A:4</text><path d="M70 161L110 219" stroke="#526577" stroke-width="2" fill="none"/><rect x="86" y="219" width="48" height="32" rx="8" fill="#edf3fa" stroke="#526577"/><text x="110" y="240" font-size="15" text-anchor="middle">C:2</text><rect x="46" y="129" width="48" height="32" rx="8" fill="#edf3fa" stroke="#526577"/><text x="70" y="150" font-size="15" text-anchor="middle">B:7</text><path d="M180 81L180 129" stroke="#526577" stroke-width="2" fill="none"/><path d="M180 161L180 219" stroke="#526577" stroke-width="2" fill="none"/><rect x="156" y="219" width="48" height="32" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="240" font-size="15" text-anchor="middle">D:1</text><rect x="156" y="129" width="48" height="32" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="150" font-size="15" text-anchor="middle">A:1</text><path d="M180 81L250 129" stroke="#526577