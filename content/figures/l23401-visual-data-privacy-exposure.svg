<svg xmlns="http://www.w3.org/2000/svg" width="360" height="570" viewBox="0 0 360 570" role="img"><title>視覺資料生命週期</title><desc>收集後原圖、標註副本、快取備份及報告都有暴露路徑；逐站控制並追查到期處置。</desc><style>text{font-family:system-ui,"Microsoft JhengHei",sans-serif;font-size:14px;fill:#172554}.small{font-size:12px}.head{font-size:16px;font-weight:bold}rect{stroke:#334155}path{fill:none;stroke:#334155;stroke-width:2}</style><rect x="0" y="0" width="360" height="570" fill="#fff" stroke="none"/><text x="20" y="28" class="head">同一影像的暴露路徑</text><rect x="20" y="48" width="320" height="65" rx="8" fill="#eff6ff"/><text x="34" y="73" class="">相機收集</text><text x="34" y="97" class="small">先確認目的、告知及必要拍攝範圍</text><path d="M180 113v20m-5 -5l5 5 5 -5"/><rect x="20" y="140" width="320" height="65" rx="8" fill="#eff6ff"/><text x="34" y="165" class="">原圖庫：保全主管</text><text x="34" y="189" class="small">原圖仍在；保存 7 天為本例假設</text><path d="M180 205v20m-5 -5l5 5 5 -5"/><rect x="20" y="232" width="320" height="65" rx="8" fill="#eff6ff"/><text x="34" y="257" class="">裁切／遮罩後的標註副本</text><text x="34" y="281" class="small">標註員與工程師；抽查人臉、車牌及兒童</text><path d="M180 297v20m-5 -5l5 5 5 -5"/><rect x="20" y="324" width="320" height="65" rx="8" fill="#eff6ff"/><text x="34" y="349" class="">訓練快取與備份</text><text x="34" y="373" class="small">處理後不等於可任意複製，仍查權限</text><path d="M180 389v20m-5 -5l5 5 5 -5"/><rect x="20" y="416" width="320" height="65" rx="8" fill="#eff6ff"/><text x="34" y="441" class="">報告與匯出</text><text x="34" y="465" class="small">業務只取聚合結果；其他匯出另審</text><text x="20" y="519" class="">到期：沿每個副本追查刪除與例外</text><text x="20" y="547" class="">遮罩不能代替原圖權限與用途審查。</text></svg>
