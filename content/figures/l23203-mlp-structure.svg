<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">二輸入二隱藏一輸出全連接網路</title><desc id="desc">每個隱藏神經元都接兩個輸入，每個輸出都接全部隱藏單元，沒有返回上一層的預測連線。</desc><style>text{font-family:system-ui,sans-serif;font-size:14px;fill:#182b42}.box{fill:#edf4fb;stroke:#24648d;stroke-width:1.5}.line{fill:none;stroke:#24648d;stroke-width:2}.back{fill:none;stroke:#a04435;stroke-width:2;stroke-dasharray:5 3}</style><rect width="360" height="360" fill="#fff"/><text x="180" y="23" text-anchor="middle">每條跨層連線各有一個權重</text><path class="line" d="M130 80L130 180"/><path class="line" d="M130 80L280 180"/><path class="line" d="M280 80L130 180"/><path class="line" d="M280 80L280 180"/><path class="line" d="M130 180L205 280"/><path class="line" d="M280 180L205 280"/><circle cx="130" cy="80" r="24" fill="#edf4fb" stroke="#24648d"/><text x="130" y="84" text-anchor="middle">x₁</text><circle cx="280" cy="80" r="24" fill="#edf4fb" stroke="#24648d"/><text x="280" y="84" text-anchor="middle">x₂</text><circle cx="130" cy="180" r="24" fill="#edf4fb" stroke="#24648d"/><text x="130" y="184" text-anchor="middle">h₁</text><circle cx="280" cy="180" r="24" fill="#edf4fb" stroke="#24648d"/><text x="280" y="184" text-anchor="middle">h₂</text><circle cx="205" cy="280" r="24" fill="#edf4fb" stroke="#24648d"/><text x="205" y="284" text-anchor="middle">p</text><text x="45" y="84" text-anchor="middle">輸入：2</text><text x="45" y="180" text-anchor="middle">隱藏：2</text><text x="45" y="201" text-anchor="middle">ReLU</text><text x="45" y="280" text-anchor="middle">輸出：1</text><text x="45" y="301" text-anchor="middle">Sigmoid</text><text x="180" y="351" text-anchor="middle" style="font-size:11px">教學合成資料／示意圖</text></svg>
