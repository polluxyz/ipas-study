<svg xmlns="http://www.w3.org/2000/svg" width="360" height="340" viewBox="0 0 360 340" role="img" aria-labelledby="title desc"><title id="title">六筆房屋的單層迴歸樹</title><desc id="desc">根據面積35坪切分。左葉三筆平均50、SSE200，右葉三筆平均110、SSE200。</desc><rect width="360" height="340" fill="#fff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="16" y="25" font-size="17" text-anchor="start" fill="#454d58">六筆房屋的單層迴歸樹</text><rect x="83" y="52" width="194" height="62" rx="8" fill="#eef4fa" stroke="#185aa5"/><text x="180.0" y="76" font-size="15" text-anchor="middle" fill="#454d58">面積 ≤ 35坪？</text><line x1="140.00" y1="114.00" x2="90.00" y2="158.00" stroke="#454d58" stroke-width="2"/><line x1="220.00" y1="114.00" x2="270.00" y2="158.00" stroke="#454d58" stroke-width="2"/><text x="103" y="138" font-size="14" text-anchor="start" fill="#454d58">是</text><text x="246" y="138" font-size="14" text-anchor="start" fill="#454d58">否</text><rect x="14" y="158" width="155" height="104" rx="8" fill="#eef4fa" stroke="#185aa5"/><text x="91.5" y="182" font-size="15" text-anchor="middle" fill="#454d58">40,50,60</text><text x="91.5" y="206" font-size="15" text-anchor="middle" fill="#454d58">平均 50</text><text x="91.5" y="230" font-size="15" text-anchor="middle" fill="#454d58">SSE 200</text><rect x="191" y="158" width="155" height="104" rx="8" fill="#eef4fa" stroke="#185aa5"/><text x="268.5" y="182" font-size="15" text-anchor="middle" fill="#454d58">100,110,120</text><text x="268.5" y="206" font-size="15" text-anchor="middle" fill="#454d58">平均 110</text><text x="268.5" y="230" font-size="15" text-anchor="middle" fill="#454d58">SSE 200</text><text x="180" y="294" font-size="16" text-anchor="middle" fill="#454d58">總SSE＝400</text><text x="16" y="328" font-size="12" text-anchor="start" fill="#454d58">教學合成資料；非實際市場結果</text></g></svg>
