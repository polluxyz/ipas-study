<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 464" role="img" aria-labelledby="title desc"><title id="title">影像切塊與投影流程</title><desc id="desc">8×8×3 影像切成四個 4×4×3 區塊，各展平 48 維，投影為 6 維，加分類詞元及位置資訊成 5×6。 教學示意圖。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#425c74"/></marker></defs><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#172b40;font-size:14px} .small{font-size:12px}.box{fill:#edf5fc;stroke:#356b98;stroke-width:1.5}.alt{fill:#fff3da;stroke:#946715;stroke-width:1.5}.line{fill:none;stroke:#425c74;stroke-width:1.5;marker-end:url(#arrow)}</style><rect width="360" height="464" rx="10" fill="#fff"/><text x="180" y="25" text-anchor="middle" class="">8×8×3 影像 → 四個區塊</text><rect x="24" y="55" width="64" height="64" fill="#edf5fc" stroke="#356b98"/><text x="56" y="85" text-anchor="middle" class="">區塊 0</text><text x="56" y="106" text-anchor="middle" class="small">4×4×3</text><rect x="90" y="55" width="64" height="64" fill="#fff3da" stroke="#356b98"/><text x="122" y="85" text-anchor="middle" class="">區塊 1</text><text x="122" y="106" text-anchor="middle" class="small">4×4×3</text><rect x="24" y="121" width="64" height="64" fill="#fff3da" stroke="#356b98"/><text x="56" y="151" text-anchor="middle" class="">區塊 2</text><text x="56" y="172" text-anchor="middle" class="small">4×4×3</text><rect x="90" y="121" width="64" height="64" fill="#edf5fc" stroke="#356b98"/><text x="122" y="151" text-anchor="middle" class="">區塊 3</text><text x="122" y="172" text-anchor="middle" class="small">4×4×3</text><rect x="192" y="71" width="145" height="42" rx="7" class="box"/><text x="264.5" y="97" text-anchor="middle" class="">四列 × 48 維</text><path class="line" d="M159 120L188 98"/><text x="264" y="143" text-anchor="middle" class="small">同一線性投影</text><path class="line" d="M264 113L264 153"/><rect x="192" y="158" width="145" height="42" rx="7" class="box"/><text x="264.5" y="184" text-anchor="middle" class="">四列 × 6 維</text><path class="line" d="M264 200L264 219"/><rect x="25" y="225" width="310" height="42" rx="7" class="alt"/><text x="180" y="251" text-anchor="middle" class="">加入分類詞元：五列 × 6 維</text><path class="line" d="M180 267L180 287"/><rect x="25" y="293" width="310" height="42" rx="7" class="box"/><text x="180" y="319" text-anchor="middle" class="">加位置向量 → Transformer</text><path class="line" d="M180 335L180 355"/><rect x="25" y="361" width="310" height="42" rx="7" class="box"/><text x="180" y="387" text-anchor="middle" class="">分類詞元表示 → 病葉／健康</text><text x="180" y="429" text-anchor="middle" class="small">順序：左上、右上、左下、右下</text><text x="180" y="455" text-anchor="middle" class="small">教學合成資料／示意圖</text></svg>
