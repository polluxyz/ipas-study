<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 530" width="360" height="530" role="img" aria-labelledby="title desc"><title id="title">治理責任貫穿規劃到營運</title><desc id="desc">每階段明確指定責任與回報。營運發現風險後回到規劃，並非部署後才開始管理。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#324f69"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8" fill="#324f69"/></marker></defs><rect width="360" height="530" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="180" y="26" font-size="18" text-anchor="middle" fill="#162b42">全生命週期治理</text><rect x="45" y="48" width="285" height="68" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="187.5" y="71" font-size="15" text-anchor="middle" fill="#162b42">規劃：用途與風險清單</text><text x="187.5" y="93" font-size="15" text-anchor="middle" fill="#162b42">業務、法遵與管理層</text><path d="M187,116 L187,136" stroke="#324f69" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="45" y="136" width="285" height="68" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="187.5" y="159" font-size="15" text-anchor="middle" fill="#162b42">開發：資料與模型控制</text><text x="187.5" y="181" font-size="15" text-anchor="middle" fill="#162b42">資料、模型及資安主責</text><path d="M187,204 L187,224" stroke="#324f69" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="45" y="224" width="285" height="68" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="187.5" y="247" font-size="15" text-anchor="middle" fill="#162b42">測試：效果、權益與安全</text><text x="187.5" y="269" font-size="15" text-anchor="middle" fill="#162b42">驗證、法遵及倫理審查</text><path d="M187,292 L187,312" stroke="#324f69" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="45" y="312" width="285" height="68" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="187.5" y="335" font-size="15" text-anchor="middle" fill="#162b42">部署：條件與核准</text><text x="187.5" y="357" font-size="15" text-anchor="middle" fill="#162b42">權責主管決定放行</text><path d="M187,380 L187,400" stroke="#324f69" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="45" y="400" width="285" height="68" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="187.5" y="423" font-size="15" text-anchor="middle" fill="#162b42">營運：監測、申訴與停用</text><text x="187.5" y="445" font-size="15" text-anchor="middle" fill="#162b42">營運回報，新風險重新評估</text><path d="M45,434 L20,434 L20,82 L43,82" stroke="#324f69" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="180" y="511" font-size="13" text-anchor="middle" fill="#162b42">每階段：執行責任 → 核准／回報</text></g></svg>
