<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" role="img" aria-labelledby="t d"><title id="t">人體與工業點位的可見性</title><desc id="d">T01行人背對鏡頭，有頭、可見左腕與已標註但被遮擋的右腕；左右依本人。M01示意兩孔及未標記缺口。v=0佔位不代表真的在原點。</desc><rect width="360" height="640" fill="#ffffff"/><g font-family="sans-serif" fill="#172033"><text x="16" y="28" font-size="15">點位與可見性：同樣有座標，意義不同</text><text x="16" y="60" font-size="14">T01／個體 1：背對鏡頭</text><rect x="50" y="88" width="256" height="192" fill="#e5eef4" /><line x1="50" y1="88" x2="50" y2="280" stroke="#334155" stroke-width="2" stroke-opacity=".12"/><line x1="82" y1="88" x2="82" y2="280" stroke="#334155" stroke-width="2" stroke-opacity=".12"/><line x1="114" y1="88" x2="114" y2="280" stroke="#334155" stroke-width="2" stroke-opacity=".12"/><line x1="146" y1="88" x2="146" y2="280" stroke="#334155" stroke-width="2" stroke-opacity=".12"/><line x1="178" y1="88" x2="178" y2="280" stroke="#334155" stroke-width="2" stroke-opacity=".12"/><line x1="210" y1="88" x2="210" y2="280" stroke="#334155" stroke-width="2" stroke-opacity=".12"/><line x1="242" y1="88" x2="242" y2="280" stroke="#334155" stroke-width="2" stroke-opacity=".12"/><line x1="274" y1="88" x2="274" y2="280" stroke="#334155" stroke-width="2" stroke-opacity=".12"/><line x1="306" y1="88" x2="306" y2="280" stroke="#334155" stroke-width="2" stroke-opacity=".12"/><line x1="50" y1="88" x2="306" y2="88" stroke="#334155" stroke-width="2" stroke-opacity=".12"/><line x1="50" y1="120" x2="306" y2="120" stroke="#334155" stroke-width="2" stroke-opacity=".12"/><line x1="50" y1="152" x2="306" y2="152" stroke="#334155" stroke-width="2" stroke-opacity=".12"/><line x1="50" y1="184" x2="306" y2="184" stroke="#334155" stroke-width="2" stroke-opacity=".12"/><line x1="50" y1="216" x2="306" y2="216" stroke="#334155" stroke-width="2" stroke-opacity=".12"/><line x1="50" y1="248" x2="306" y2="248" stroke="#334155" stroke-width="2" stroke-opacity=".12"/><line x1="50" y1="280" x2="306" y2="280" stroke="#334155" stroke-width="2" stroke-opacity=".12"/><circle cx="98" cy="136" r="7" fill="#155e75" stroke="#155e75" stroke-width="2" /><circle cx="88.4" cy="168" r="7" fill="#155e75" stroke="#155e75" stroke-width="2" /><circle cx="139.6" cy="168" r="7" fill="#fff" stroke="#155e75" stroke-width="2" stroke-dasharray="3 2"/><text x="165" y="140" font-size="14">實心：v=2 可見</text><text x="165" y="170" font-size="14">空心：v=1 遮擋</text><text x="165" y="200" font-size="14">v=0 不畫在原點</text><text x="48" y="83" font-size="12">(0,0)</text><text x="12" y="111" font-size="12">y↓</text><text x="165" y="301" font-size="12">x→；單位：像素</text><text x="16" y="330" font-size="14">人體點序：頭、左腕、右腕</text><text x="16" y="359" font-size="14">左／右依本人，不依觀看者</text><text x="16" y="390" font-size="15">M01／個體 1：工業定位點</text><rect x="50" y="420" width="256" height="130" fill="#ece8df" /><circle cx="98" cy="460" r="10" fill="none" stroke="#b45309" stroke-width="3"/><text x="80" y="505" font-size="14">左孔</text><circle cx="226" cy="460" r="10" fill="none" stroke="#b45309" stroke-width="3"/><text x="208" y="505" font-size="14">右孔</text><text x="16" y="582" font-size="14">缺口無可靠點位：v=0，(0,0)為佔位</text><text x="16" y="612" font-size="14">座標與表格相同；此面板放大局部示意</text></g></svg>
