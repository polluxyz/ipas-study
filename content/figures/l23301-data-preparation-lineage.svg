<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 595" role="img" aria-labelledby="title desc">
<title id="title">資料血緣與fit邊界</title><desc id="desc">原始快照與固定切分可追溯到特徵和模型；只有訓練資料可估計轉換參數。</desc>
<rect width="360" height="595" fill="#f8fafc"/>
<g font-family="sans-serif" font-size="15" fill="#0f172a"><rect x="15" y="12" width="330" height="74" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="28" y="39">原始快照 v1：ID、時間、欄位型態</text><text x="28" y="62">單位／格式檢查：保留處理紀錄</text><text x="167" y="119">↓</text><rect x="15" y="132" width="330" height="74" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="28" y="159">固定列索引：先分訓練與驗證</text><text x="28" y="182">真值、缺值原因只供教學核算</text><text x="167" y="239">↓</text><rect x="15" y="251" width="330" height="74" rx="8" fill="#dcfce7" stroke="#64748b"/><text x="28" y="278">只有訓練列可 fit</text><text x="28" y="301">學得填補值、尺度或模型參數</text><text x="167" y="358">↓</text><rect x="15" y="370" width="330" height="74" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="28" y="397">相同轉換套到訓練與驗證</text><text x="28" y="420">→ 特徵版本 → 模型版本 → 評估</text><rect x="15" y="480" width="330" height="74" rx="8" fill="#fee2e2" stroke="#64748b"/><text x="28" y="507">禁止：驗證資料回流 fit</text><text x="28" y="530">每個交叉驗證訓練摺都重新 fit</text></g></svg>