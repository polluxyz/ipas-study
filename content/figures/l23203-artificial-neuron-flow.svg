<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 285" role="img" aria-labelledby="title desc"><title id="title">單一人工神經元</title><desc id="desc">兩個輸入乘各自權重，加總後只加一次偏置，最後通過激活。</desc><style>text{font-family:system-ui,sans-serif;font-size:14px;fill:#182b42}.box{fill:#edf4fb;stroke:#24648d;stroke-width:1.5}.line{fill:none;stroke:#24648d;stroke-width:2}.back{fill:none;stroke:#a04435;stroke-width:2;stroke-dasharray:5 3}</style><rect width="360" height="285" fill="#fff"/><rect class="box" x="55" y="20" width="250" height="58" rx="7"/><text x="180" y="42" text-anchor="middle">x₁ = 1，x₂ = 0</text><text x="180" y="61" text-anchor="middle">w₁ = 1，w₂ = 1</text><path class="line" d="M180 78V102m-4 -6l4 6l4 -6"/><rect class="box" x="55" y="102" width="250" height="58" rx="7"/><text x="180" y="124" text-anchor="middle">加權求和 + 偏置</text><text x="180" y="143" text-anchor="middle">z = 1×1 + 1×0 − 0.25</text><path class="line" d="M180 160V184m-4 -6l4 6l4 -6"/><rect class="box" x="55" y="184" width="250" height="58" rx="7"/><text x="180" y="206" text-anchor="middle">激活：ReLU</text><text x="180" y="225" text-anchor="middle">a = max(0, 0.75) = 0.75</text><text x="180" y="276" text-anchor="middle" style="font-size:11px">教學合成資料／示意圖</text></svg>
