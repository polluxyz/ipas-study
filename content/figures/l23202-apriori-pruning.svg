<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc"><title id="title">先檢查子集，再計數候選</title><desc id="desc">同一交易表在最低2筆下，BD不頻繁因此ABD剪枝；ABC全部兩項子集頻繁，仍須計數才可保留。</desc><rect width="360" height="420" fill="#fff"/><g fill="#16283a" font-family="sans-serif"><text x="180" y="27" font-size="17" text-anchor="middle">先檢查子集，再計數候選</text><text x="180" y="62" font-size="15" text-anchor="middle">門檻：2筆／10筆</text><rect x="25" y="85" width="310" height="40" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="110" font-size="15" text-anchor="middle">AB:4　AC:2　AD:2　BC:4</text><text x="180" y="156" font-size="15" text-anchor="middle">非頻繁：BD:1、CD:1</text><path d="M100 171L100 202" stroke="#526577" stroke-width="2" fill="none"/><path d="M265 171L265 202" stroke="#526577" stroke-width="2" fill="none"/><rect x="15" y="202" width="160" height="44" rx="8" fill="#edf3fa" stroke="#526577"/><text x="95" y="229" font-size="15" text-anchor="middle">ABC：所有子集通過</text><rect x="190" y="202" width="155" height="44" rx="8" fill="#fff0e8" stroke="#526577"/><text x="267.5" y="229" font-size="15" text-anchor="middle">ABD：含BD，剪除</text><path d="M95 246L95 280" stroke="#526577" stroke-width="2" fill="none"/><rect x="15" y="280" width="160" height="42" rx="8" fill="#edf3fa" stroke="#526577"/><text x="95" y="306" font-size="15" text-anchor="middle">實際計數ABC:2</text><text x="180" y="365" font-size="14" text-anchor="middle">子集通過是必要條件，非充分條件</text><text x="180" y="407" font-size="12" text-anchor="middle">教學合成資料／流程示意</text></g></svg>
