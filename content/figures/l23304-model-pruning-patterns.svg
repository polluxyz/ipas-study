<svg xmlns="http://www.w3.org/2000/svg" width="360" height="405" viewBox="0 0 360 405" role="img" aria-labelledby="title desc"><title id="title">兩類剪枝的結構差異</title><desc id="desc">左側整個隱藏單元移除時，下一層對應輸入也要移除；右側零散權重置零仍可保留原矩陣形狀。格子只示意位置，不是本組實際遮罩。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#475569"/></marker></defs><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#172554;font-size:14px}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}.alt{fill:#f0fdf4;stroke:#15803d;stroke-width:1.5}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:1.5}.line{fill:none;stroke:#475569;stroke-width:1.5;marker-end:url(#arrow)}</style><rect width="360" height="405" fill="white"/><text x="180" y="26" text-anchor="middle">同一層矩陣的兩種處理</text><rect x="12" y="48" width="160" height="48" rx="8" class="box"/><text x="92" y="72" text-anchor="middle">結構化：整排移除</text><rect x="192" y="48" width="156" height="48" rx="8" class="box"/><text x="270" y="72" text-anchor="middle">非結構化：零散置零</text><rect x="39" y="115" width="20" height="20" fill="#dbeafe" stroke="#475569"/><rect x="221" y="115" width="20" height="20" fill="white" stroke="#475569"/><text x="231" y="130" text-anchor="middle">0</text><rect x="64" y="115" width="20" height="20" fill="#dbeafe" stroke="#475569"/><rect x="246" y="115" width="20" height="20" fill="#dbeafe" stroke="#475569"/><rect x="89" y="115" width="20" height="20" fill="#dbeafe" stroke="#475569"/><rect x="271" y="115" width="20" height="20" fill="#dbeafe" stroke="#475569"/><rect x="114" y="115" width="20" height="20" fill="#dbeafe" stroke="#475569"/><rect x="296" y="115" width="20" height="20" fill="white" stroke="#475569"/><text x="306" y="130" text-anchor="middle">0</text><rect x="39" y="143" width="20" height="20" fill="#dbeafe" stroke="#475569"/><rect x="221" y="143" width="20" height="20" fill="#dbeafe" stroke="#475569"/><rect x="64" y="143" width="20" height="20" fill="#d