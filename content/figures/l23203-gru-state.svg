<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" role="img" aria-labelledby="title desc"><title id="title">GRU 與 LSTM 的狀態對照</title><desc id="desc">GRU 的重置門調節候選對舊狀態變換的使用，更新門混合舊狀態和候選；LSTM 另傳遞細胞狀態。</desc><style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#172b4d;font-size:15px} .head{font-size:18px;font-weight:700}.small{font-size:13px}.box{fill:#e8f2ff;stroke:#245b9e;stroke-width:1.5}.memory{fill:#e6f6ec;stroke:#246d42;stroke-width:1.5}.gate{fill:#fff2cf;stroke:#8f6413;stroke-width:1.5}.line{fill:none;stroke:#245b9e;stroke-width:1.8;marker-end:url(#arrow)}.back{fill:none;stroke:#9c3b32;stroke-width:1.8;stroke-dasharray:5 3;marker-end:url(#red)}.mute{fill:#fff;stroke:#687782;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245b9e"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9c3b32"/></marker></defs><rect width="360" height="600" fill="#fff" rx="10"/><text x="180" y="28" text-anchor="middle" class="head">GRU：一份狀態、兩個門</text><rect x="22" y="55" width="316" height="40" rx="8" class="memory"/><text x="180" y="80" text-anchor="middle" class="">共同輸入 x 與舊狀態 h 前</text><path d="M92 95L92 124" class="line"/><path d="M268 95L268 124" class="line"/><rect x="22" y="129" width="140" height="42" rx="8" class="gate"/><text x="92" y="155" text-anchor="middle" class="">重置門 r</text><rect x="198" y="129" width="140" height="42" rx="8" class="gate"/><text x="268" y="155" text-anchor="middle" class="">更新門 z</text><rect x="30" y="212" width="300" height="46" rx="8" class="box"/><text x="180" y="230" text-anchor="middle" class="">候選 n：Tanh（輸入</text><text x="180" y="249" text-anchor="middle" class="">＋ r × 舊狀態變換）</text><path d="M92 171L92 208" class="line"/><path d="M338 149L348 149L348 305L340 305" class="line"/><path d="M22 76L12 76L12 235L28 235" class="line"/><path d="M12 235L12 305L20 305" class="line"/><path d="M180 258L180 282" class="line"/><rect x="22" y="287" width="316" height="46" rx="8" class="memory"/><text x="180" y="315" text-anchor="middle" class="">新 h ＝ z × 舊 h ＋ (1−z) × n</text><text x="180" y="360" text-anchor="middle" class="small">z 大：多保留舊 h；r 小：少用舊資訊</text><rect x="22" y="397" width="316" height="40" rx="8" class="memory"/><text x="180" y="422" text-anchor="middle" class="">對照：LSTM 傳遞 h 與 c</text><rect x="22" y="460" width="140" height="40" rx="8" class="gate"/><text x="92" y="485" text-anchor="middle" class="">三門管理細胞</text><rect x="198" y="460" width="140" height="40" rx="8" class="memory"/><text x="268" y="485" text-anchor="middle" class="">獨立細胞 c</text><text x="180" y="539" text-anchor="middle" class="">GRU 沒有獨立的 c</text><text x="180" y="568" text-anchor="middle" class="small">示意採本頁 PyTorch 更新門方向</text></svg>
