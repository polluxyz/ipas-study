<svg xmlns="http://www.w3.org/2000/svg" width="360" height="432" viewBox="0 0 360 432" role="img" aria-labelledby="title desc"><title id="title">F01 的時鐘校正與採樣率</title><desc id="desc">由共用事件資料生成。先減去感測時鐘偏移，再處理採樣間隔；複製量測不會產生新資訊。</desc><style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#172033;font-size:16px} .head{font-size:19px;font-weight:700} .small{font-size:14px} .box{fill:#edf5ff;stroke:#264e7a;stroke-width:1.5} .green{fill:#e8f4ee;stroke:#286247;stroke-width:1.5} .orange{fill:#fff2df;stroke:#875d20;stroke-width:1.5} .line{fill:none;stroke:#334e68;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334e68"/></marker></defs><rect width="360" height="432" rx="12" fill="#ffffff"/><text x="180" y="30" text-anchor="middle" class="head">相同事件，時鐘數字不同</text><rect x="18" y="54" width="324" height="68" rx="9" class="box"/><text x="180.0" y="82.0" text-anchor="middle" class="">F01 影像原始時間</text><text x="180.0" y="104.0" text-anchor="middle" class="">10000 ms（偏移 0 ms）</text><rect x="18" y="136" width="324" height="68" rx="9" class="box"/><text x="180.0" y="164.0" text-anchor="middle" class="">F01 感測原始時間</text><text x="180.0" y="186.0" text-anchor="middle" class="">10050 ms（快 50 ms）</text><path d="M180,204 L180,224" class="line"/><rect x="18" y="228" width="324" height="72" rx="9" class="green"/><text x="180.0" y="258.0" text-anchor="middle" class="">感測校正到共同時鐘</text><text x="180.0" y="280.0" text-anchor="middle" class="">10050 − 50 = 10000 ms</text><text x="180" y="334" text-anchor="middle" class="">影像 20 Hz：每 50 ms 一幀</text><text x="180" y="362" text-anchor="middle" class="">感測 10 Hz：每 100 ms 一筆</text><text x="180" y="392" text-anchor="middle" class="small">校時後仍須按採樣時間配對</text><text x="180" y="418" text-anchor="middle" class="small">教學合成資料；單位 ms、Hz</text></svg>
