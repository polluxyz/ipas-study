<svg xmlns="http://www.w3.org/2000/svg" width="360" height="460" viewBox="0 0 360 460" role="img" aria-labelledby="title desc"><title id="title">教學潛在原型與分布取樣</title><desc id="desc">從共用資料畫出商品八群原型、指定平均標準差的尺度橢圓，以及固定種子取得的一個取樣十字。不是實際模型學得的潛在空間，也不是信賴區間。</desc><rect width="360" height="460" fill="#f8fafc"/><g font-family="sans-serif" fill="#0f172a"><path d="M38 320H326M180 330V47" fill="none" stroke="#475569"/><path d="M70 316V324M176 320H184" stroke="#475569"/><text x="70" y="345" font-size="14" text-anchor="middle">-2</text><text x="165" y="325" font-size="14" text-anchor="end">-2</text><path d="M125 316V324M176 255H184" stroke="#475569"/><text x="125" y="345" font-size="14" text-anchor="middle">-1</text><text x="165" y="260" font-size="14" text-anchor="end">-1</text><path d="M180 316V324M176 190H184" stroke="#475569"/><text x="180" y="345" font-size="14" text-anchor="middle">0</text><text x="165" y="195" font-size="14" text-anchor="end">0</text><path d="M235 316V324M176 125H184" stroke="#475569"/><text x="235" y="345" font-size="14" text-anchor="middle">1</text><text x="165" y="130" font-size="14" text-anchor="end">1</text><path d="M290 316V324M176 60H184" stroke="#475569"/><text x="290" y="345" font-size="14" text-anchor="middle">2</text><text x="165" y="65" font-size="14" text-anchor="end">2</text><text x="180" y="25" font-size="18" text-anchor="middle">八群原型與一次潛在取樣</text><text x="180" y="370" font-size="14" text-anchor="middle">教學軸一（無單位）</text><text x="22" y="48" font-size="14" text-anchor="middle">軸二</text><text x="25" y="67" font-size="14" text-anchor="middle">無單位</text><circle cx="229.500" cy="255.000" r="3" fill="#64748b"/><circle cx="240.500" cy="255.000" r="3" fill="#64748b"/><circle cx="235.000" cy="248.500" r="3" fill="#64748b"/><text x="235" y="241" font-size="14" text-anchor="middle">P01</text><circle cx="119.500" cy="255.000" r="3" fill="#64748b"/><circle cx="130.500" cy="255.000" r="3" fill="#64748b"/><circle cx="125.000" cy="248.500" r="3" fill="#64748b"/><text x="125" y="241" font-size="14" text-anchor="middle">P02</text><circle cx="119.500" cy="125.000" r="3" fill="#64748b"/><circle cx="130.500" cy="125.000" r="3" fill="#64748b"/><circle cx="125.000" cy="118.500" r="3" fill="#64748b"/><text x="125" y="111" font-size="14" text-anchor="middle">P03</text><circle cx="229.500" cy="125.000" r="3" fill="#64748b"/><circle cx="240.500" cy="125.000" r="3" fill="#64748b"/><circle cx="235.000" cy="118.500" r="3" fill="#64748b"/><text x="235" y="111" font-size="14" text-anchor="middle">P04</text><circle cx="284.500" cy="255.000" r="3" fill="#64748b"/><circle cx="295.500" cy="255.000" r="3" fill="#64748b"/><circle cx="290.000" cy="248.500" r="3" fill="#64748b"/><text x="290" y="241" font-size="14" text-anchor="middle">P05</text><circle cx="64.500" cy="255.000" r="3" fill="#64748b"/><circle cx="75.500" cy="255.000" r="3" fill="#64748b"/><circle cx="70.000" cy="248.500" r="3" fill="#64748b"/><text x="70" y="241" font-size="14" text-anchor="middle">P06</text><circle cx="64.500" cy="125.000" r="3" fill="#64748b"/><circle cx="75.500" cy="125.000" r="3" fill="#64748b"/><circle cx="70.000" cy="118.500" r="3" fill="#64748b"/><text x="70" y="111" font-size="14" text-anchor="middle">P07</text><circle cx="284.500" cy="125.000" r="3" fill="#64748b"/><circle cx="295.500" cy="125.000" r="3" fill="#64748b"/><circle cx="290.000" cy="118.500" r="3" fill="#64748b"/><text x="290" y="111" font-size="14" text-anchor="middle">P08</text><ellipse cx="235" cy="255" rx="27.5" ry="16.25" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M237.380 271.900h12M243.380 265.900v12" stroke="#b45309" stroke-width="3"/><text x="180" y="396" font-size="14" text-anchor="middle">橢圓：均值周圍一個標準差尺度</text><text x="180" y="418" font-size="14" text-anchor="middle">十字：種子 42 的一次取樣</text><text x="180" y="440" font-size="14" text-anchor="middle">教學合成；遊戲沿用相同原型群</text></g></svg>
