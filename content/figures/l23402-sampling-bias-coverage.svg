<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 458" role="img" aria-labelledby="title desc">
<title id="title">母體與樣本的群體比例</title><desc id="desc">母體A/B各半，標記樣本A占80%、B占20%；分母是母體或樣本全體。</desc>
<rect width="360" height="458" rx="12" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#0f172a" font-size="17"><text x="18" y="30" font-size="21" font-weight="bold">母體與樣本的群體比例</text><text x="18" y="62" font-weight="bold">部署母體</text><text x="18" y="92">A 占母體：50%（20/40）</text><rect x="18" y="102" width="300" height="18" rx="3" fill="#e2e8f0"/><rect x="18" y="102" width="150" height="18" rx="3" fill="#0369a1"/><text x="18" y="151">B 占母體：50%（20/40）</text><rect x="18" y="161" width="300" height="18" rx="3" fill="#e2e8f0"/><rect x="18" y="161" width="150" height="18" rx="3" fill="#b45309"/><text x="18" y="210" font-size="14">0%</text><text x="155" y="210" font-size="14">50%</text><text x="282" y="210" font-size="14">100%</text><text x="18" y="254" font-weight="bold">訓練來源樣本示範</text><text x="18" y="284">A 占樣本：80%（16/20）</text><rect x="18" y="294" width="300" height="18" rx="3" fill="#e2e8f0"/><rect x="18" y="294" width="240" height="18" rx="3" fill="#0369a1"/><text x="18" y="343">B 占樣本：20%（4/20）</text><rect x="18" y="353" width="300" height="18" rx="3" fill="#e2e8f0"/><rect x="18" y="353" width="60" height="18" rx="3" fill="#b45309"/><text x="18" y="402" font-size="14">0%</text><text x="155" y="402" font-size="14">50%</text><text x="282" y="402" font-size="14">100%</text><text x="18" y="439" font-size="14">教學合成；樣本標記未用於訓練</text></g></svg>
