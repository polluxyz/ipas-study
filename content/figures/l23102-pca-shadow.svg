      <circle cx="613.200" cy="202.200" r="4.5"/>
      <circle cx="629.200" cy="227.800" r="4.5"/></g>
    <g><rect class="shadow" x="430.130" y="381.205" width="6" height="6"/>
      <rect class="shadow" x="437.468" y="374.449" width="6" height="6"/>
      <rect class="shadow" x="473.233" y="341.513" width="6" height="6"/>
      <rect class="shadow" x="472.461" y="342.224" width="6" height="6"/>
      <rect class="shadow" x="514.742" y="303.288" width="6" height="6"/>
      <rect class="shadow" x="507.454" y="310.000" width="6" height="6"/>
      <rect class="shadow" x="546.683" y="273.874" width="6" height="6"/>
      <rect class="shadow" x="556.935" y="264.433" width="6" height="6"/>
