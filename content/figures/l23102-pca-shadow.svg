      <line x1="629.200" y1="227.800" x2="617.165" y2="214.731" /></g>
    <g class="original"><circle cx="427.600" cy="378.200" r="4.5"/>
      <circle cx="450.000" cy="387.800" r="4.5"/>
      <circle cx="466.000" cy="333.400" r="4.5"/>
      <circle cx="485.200" cy="355.800" r="4.5"/>
      <circle cx="504.400" cy="291.800" r="4.5"/>
