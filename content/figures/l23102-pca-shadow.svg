      <rect class="shadow" x="169.234" y="510.000" width="6" height="6"/>
    </g>
    <text class="result" x="190" y="559">變化小</text>
  </g>
  <g id="direction-b">
    <text class="panel-title" x="530" y="137">方向乙：影子散得最開</text>
    <g class="axes">
      <line x1="397.200" y1="295.000" x2="662.800" y2="295.000" />
      <line x1="530.000" y1="427.800" x2="530.000" y2="162.200" />
