      <line x1="466.000" y1="333.400" x2="476.233" y2="344.513" />
      <line x1="485.200" y1="355.800" x2="475.461" y2="345.224" />
      <line x1="504.400" y1="291.800" x2="517.742" y2="306.288" />
      <line x1="520.400" y1="323.800" x2="510.454" y2="313.000" />
      <line x1="542.800" y1="269.400" x2="549.683" y2="276.874" />
      <line x1="558.800" y1="266.200" x2="559.935" y2="267.433" />
      <line x1="571.600" y1="240.600" x2="579.618" y2="249.307" />
      <line x1="590.800" y1="263.000" x2="578.846" y2="250.019" />
