      <rect class="shadow" x="176.767" y="280.887" width="6" height="6"/>
      <rect class="shadow" x="196.739" y="302.576" width="6" height="6"/>
      <rect class="shadow" x="173.658" y="277.512" width="6" height="6"/>
      <rect class="shadow" x="196.946" y="302.800" width="6" height="6"/>
      <rect class="shadow" x="180.117" y="284.526" width="6" height="6"/>
      <rect class="shadow" x="185.865" y="290.767" width="6" height="6"/>
      <rect class="shadow" x="178.982" y="283.293" width="6" height="6"/>
      <rect class="shadow" x="198.954" y="304.981" width="6" height="6"/>
      <rect class="shadow" x="178.936" y="283.243" width="6" height="6"/>
      <rect class="shadow" x="199.035" y="305.069" width="6" height="6"/></g>
    <g aria-label="把影子攤平，兩格使用相同比例">
      <line x1="46.000" y1="513.000" x2="334.000" y2="513.000" class="strip"/>
      <line x1="190.000" y1="503.000" x2="190.000" y2="523.000" class="strip"/>
      <rect class="shadow" x="195.164" y="510.000" width="6" height="6"/>
      <rect class="shadow" x="172.928" y="510.000" width="6" height="6"/>
      <rect class="shadow" x="202.107" y="510.000" width="6" height="6"/>
      <rect class="shadow" x="172.623" y="510.000" width="6" height="6"/>
      <rect class="shadow" x="206.696" y="510.000" width="6" height="6"/>
      <rect class="shadow" x="172.318" y="510.000" width="6" height="6"/>
      <rect class="shadow" x="197.161" y="510.000" width="6" height="6"/>
      <rect class="shadow" x="188.676" y="510.000" width="6" height="6"/>
