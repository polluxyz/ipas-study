<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 612" role="img" aria-labelledby="pca-shadow-title pca-shadow-desc">
  <title id="pca-shadow-title">同一團點，換一個方向拍影子</title>
  <desc id="pca-shadow-desc">兩格使用相同的12筆教學合成資料，橫軸為溫度偏差，縱軸為壓力偏差，平均在原點。藍色圓點是原始資料，細虛線把每個點垂直投影到通過平均值的直線，橘色方塊是影子。左格沿方向甲投影，影子擠在中心附近，變化小。右格沿方向乙投影，影子散得最開，這個方向就是第一主成分。下方將影子攤平，兩格使用相同比例。</desc>
  <style>
    text { font-family:Arial,Microsoft JhengHei,sans-serif; fill:#172c43; }
    .heading { font-size:24px; font-weight:700; text-anchor:middle; }
    .subtitle { font-size:15px; text-anchor:middle; }
    .legend { font-size:14px; }
    .panel-title { font-size:18px; font-weight:700; text-anchor:middle; }
    .axes { stroke:#172c43; stroke-width:1; opacity:.18; }
    .axis-label { font-size:13px; text-anchor:middle; }
    .direction { stroke:#172c43; stroke-width:2; }
    .projection { stroke:#172c43; stroke-width:1; stroke-dasharray:3 4; opacity:.5; }
    .original { fill:#2463a6; stroke:#fff; stroke-width:1; }
    .shadow { fill:#ac4200; stroke:#fff; stroke-width:.8; }
    .strip { stroke:#172c43; stroke-width:1; opacity:.3; }
    .result { font-size:18px; font-weight:700; text-anchor:middle; }
    .source { font-size:13px; text-anchor:middle; }
  </style>
  <rect width="720" height="612" fill="#fff"/>
  <text class="heading" x="360" y="36">同一團點，換一個方向拍影子</text>
  <text class="subtitle" x="360" y="65">把點垂直投影到線上，看看影子散得多開。</text>
  <g class="legend" transform="translate(142 94)">
    <circle cx="0" cy="-5" r="4.5" fill="#2463a6"/>
    <text x="12">原始的點</text>
    <rect x="116" y="-8" width="6" height="6" fill="#ac4200"/>
    <text x="133">影子</text>
    <line x1="218" y1="-5" x2="246" y2="-5" class="projection"/>
    <text x="255">垂直投影</text>
  </g>
  <g id="direction-a">
    <text class="panel-title" x="190" y="137">方向甲：影子擠在一起</text>
    <g class="axes">
      <line x1="57.200" y1="295.000" x2="322.800" y2="295.000" />
      <line x1="190.000" y1="427.800" x2="190.000" y2="162.200" />
    </g>
    <text class="axis-label" x="190" y="449">溫度偏差</text>
    <text class="axis-label" transform="translate(39 295) rotate(-90)">壓力偏差</text>
    <line x1="288.631" y1="402.105" x2="91.369" y2="187.895" class="direction"/>
    <g class="projection"><line x1="87.600" y1="378.200" x2="184.470" y2="288.995" />
      <line x1="110.000" y1="387.800" x2="199.532" y2="305.351" />
      <line x1="126.000" y1="333.400" x2="179.767" y2="283.887" />
