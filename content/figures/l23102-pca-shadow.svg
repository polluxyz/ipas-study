      <line x1="530.000" y1="503.000" x2="530.000" y2="523.000" class="strip"/>
      <rect class="shadow" x="395.313" y="510.000" width="6" height="6"/>
      <rect class="shadow" x="405.288" y="510.000" width="6" height="6"/>
      <rect class="shadow" x="453.909" y="510.000" width="6" height="6"/>
      <rect class="shadow" x="452.858" y="510.000" width="6" height="6"/>
      <rect class="shadow" x="510.336" y="510.000" width="6" height="6"/>
