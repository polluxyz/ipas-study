      <rect class="shadow" x="567.695" y="510.000" width="6" height="6"/>
      <rect class="shadow" x="594.452" y="510.000" width="6" height="6"/>
      <rect class="shadow" x="593.402" y="510.000" width="6" height="6"/>
      <rect class="shadow" x="651.066" y="510.000" width="6" height="6"/>
      <rect class="shadow" x="645.494" y="510.000" width="6" height="6"/>
