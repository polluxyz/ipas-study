<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 474" role="img"><title>執行方式與部署地點分開</title><desc>TensorFlow 2 即時執行可搭配圖執行；部署依伺服器、網頁或裝置選工具。</desc><rect width="360" height="474" fill="#fffdf7"/><g font-family="sans-serif" fill="#0f172a" font-size="16"><text x="180" y="30" text-anchor="middle" font-weight="700">執行方式與部署地點分開</text><rect x="12" y="66" width="336" height="62" rx="8" fill="#fef3c7" stroke="#334155"/><text x="180" y="90" text-anchor="middle">開發：即時查看張量</text><text x="180" y="111" text-anchor="middle">穩定運算可轉成圖</text><rect x="12" y="156" width="336" height="62" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="180" y="180" text-anchor="middle">若運算放在伺服器</text><text x="180" y="201" text-anchor="middle">TensorFlow Serving</text><rect x="12" y="246" width="336" height="62" rx="8" fill="#fef3c7" stroke="#334155"/><text x="180" y="270" text-anchor="middle">若運算放在網頁</text><text x="180" y="291" text-anchor="middle">TensorFlow.js</text><rect x="12" y="336" width="336" height="62" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="180" y="360" text-anchor="middle">若運算放在邊緣裝置</text><text x="180" y="381" text-anchor="middle">Lite／LiteRT 等工具</text><text x="180" y="459" text-anchor="middle" font-size="12">下方列部署選項，並非依序經過三個平台</text></g></svg>