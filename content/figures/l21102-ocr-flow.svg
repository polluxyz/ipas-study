<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 354" role="img" aria-labelledby="title desc"><title id="title">OCR 的三段輸出</title><desc id="desc">定位：原圖中的文字框：原圖座標與文字真值成對保存；裁切：取出框內文字影像：偏框造成缺字，辨識端無法補回；轉錄：影像變成字串：保留原字串，異常交人工確認；教學合成資料</desc><rect width="360" height="354" fill="#fff"/><g font-family="sans-serif"><text x="16" y="26" font-size="19" fill="#17243b">OCR 的三段輸出</text><rect x="16" y="44" width="328" height="62" rx="8" fill="#eef4fa" stroke="#456783"/><text x="28" y="69" font-size="17" fill="#17243b">定位：原圖中的文字框</text><text x="28" y="92" font-size="15" fill="#17243b">原圖座標與文字真值成對保存</text><text x="171" y="126" font-size="20" fill="#17243b">↓</text><rect x="16" y="132" width="328" height="62" rx="8" fill="#eef4fa" stroke="#456783"/><text x="28" y="157" font-size="17" fill="#17243b">裁切：取出框內文字影像</text><text x="28" y="180" font-size="15" fill="#17243b">偏框造成缺字，辨識端無法補回</text><text x="171" y="214" font-size="20" fill="#17243b">↓</text><rect x="16" y="220" width="328" height="62" rx="8" fill="#eef4fa" stroke="#456783"/><text x="28" y="245" font-size="17" fill="#17243b">轉錄：影像變成字串</text><text x="28" y="268" font-size="15" fill="#17243b">保留原字串，異常交人工確認</text><text x="16" y="324" font-size="14" fill="#17243b">框、裁切圖與字串分開檢查</text></g></svg>
