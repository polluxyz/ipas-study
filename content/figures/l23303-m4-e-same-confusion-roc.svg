<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 730" role="img" aria-labelledby="title desc"><title id="title">相同四格不同ROC-AUC</title><desc id="desc">A與B在閾值0.5都為TP2 FP1 FN1 TN2，曲線AUC卻不同。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#172b4d;font-size:20px}.small{font-size:17px}.value{font-size:27px;font-weight:bold}.axis{font-size:21px;font-weight:bold}</style><rect width="620" height="730" fill="#fff"/><text class="axis" x="90" y="36">同一閾值四格，不能決定整條 ROC</text><path d="M90 510H510 M90 90V510" stroke="#c8d1de" fill="none"/><text class="small" x="90" y="540" text-anchor="middle">0</text><text class="small" x="72" y="516" text-anchor="end">0</text><path d="M90 370H510 M230 90V510" stroke="#c8d1de" fill="none"/><text class="small" x="230" y="540" text-anchor="middle">1/3</text><text class="small" x="72" y="376" text-anchor="end">1/3</text><path d="M90 230H510 M370 90V510" stroke="#c8d1de" fill="none"/><text class="small" x="370" y="540" text-anchor="middle">2/3</text><text class="small" x="72" y="236" text-anchor="end">2/3</text><path d="M90 90H510 M510 90V510" stroke="#c8d1de" fill="none"/><text class="small" x="510" y="540" text-anchor="middle">1</text><text class="small" x="72" y="96" text-anchor="end">1</text><path d="M90 90V510H510" fill="none" stroke="#172b4d" stroke-width="2"/><polyline points="90,510 90,370 90,230 230,230 230,90 370,90 510,90" fill="none" stroke="#1763af" stroke-width="5" stroke-dasharray=""/><polyline points="90,510 230,510 230,370 230,230 370,230 510,90" fill="none" stroke="#b14b08" stroke-width="5" stroke-dasharray="9 6"/><circle cx="230" cy="230" r="8" fill="#fff" stroke="#172b4d" stroke-width="3"/><text x="248" y="212">共同 t=0.5</text><text x="285" y="580">FPR（橫軸）</text><text x="8" y="70">TPR</text><text x="90" y="625" fill="#1763af">A 實線：AUC=8/9≈0.889</text><text x="90" y="660" fill="#b14b08">B 虛線：AUC=1/2=0.500</text><text class="small" x="90" y="700">B 的 0.3 同分整批加入；合成評估資料。</text></svg>
