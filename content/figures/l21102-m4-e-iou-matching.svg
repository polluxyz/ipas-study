<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 780" role="img" aria-labelledby="title desc"><title id="title">指定面積與固定框匹配</title><desc id="desc">交集40、真值100、預測80。兩門檻逐框重新配對，P1 P3互換成敗。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#172b4d;font-size:20px}.small{font-size:17px}.value{font-size:27px;font-weight:bold}.axis{font-size:21px;font-weight:bold}</style><rect width="590" height="780" fill="#fff"/><text class="axis" x="28" y="35">交集 40，聯集 140</text><rect x="30" y="70" width="220" height="220" fill="#d8e9ff" stroke="#1763af" stroke-width="3" stroke-dasharray=""/><rect x="162" y="70" width="176" height="220" fill="#ffe0b8" stroke="#b14b08" stroke-width="3" stroke-dasharray="8 4"/><rect x="162" y="70" width="88" height="220" fill="#d3c4ed" stroke="#4d3873"/><text x="45" y="115">G：100</text><text x="170" y="190">40</text><text x="260" y="115">B：80</text><text x="30" y="333">IoU = 40 / (100+80−40) = 2/7</text><text class="small" x="30" y="365">G(0,0,10,10)；B(6,0,14,10)，連續邊界。</text><text class="axis" x="30" y="418">同批框：同類、一對一、IoU ≥ 門檻</text><rect x="25" y="442" width="535" height="39" fill="#fff" stroke="#c8d1de"/><text x="40" y="469">框</text><text x="110" y="469">IoU／限制</text><text x="370" y="469">0.5</text><text x="465" y="469">0.7</text><rect x="25" y="482" width="535" height="39" fill="#eff4fa" stroke="#c8d1de"/><text x="40" y="509">P1</text><text x="110" y="509">G1：0.5</text><text x="370" y="509">TP</text><text x="465" y="509">FP</text><rect x="25" y="522" width="535" height="39" fill="#fff" stroke="#c8d1de"/><text x="40" y="549">P2</text><text x="110" y="549">G2：0.7</text><text x="370" y="549">TP</text><text x="465" y="549">TP</text><rect x="25" y="562" width="535" height="39" fill="#eff4fa" stroke="#c8d1de"/><text x="40" y="589">P3</text><text class="small" x="110" y="589">G1：1；0.5時已占用</text><text x="370" y="589">FP</text><text x="465" y="589">TP</text><rect x="25" y="602" width="535" height="39" fill="#fff" stroke="#c8d1de"/><text x="40" y="629">P4</text><text x="110" y="629">0／無匹配</text><text x="370" y="629">FP</text><text x="465" y="629">FP</text><rect x="25" y="642" width="535" height="39" fill="#eff4fa" stroke="#c8d1de"/><text x="40" y="669">P5</text><text x="110" y="669">1／錯類</text><text x="370" y="669">FP</text><text x="465" y="669">FP</text><text class="small" x="30" y="718">依 P1→P5 信心排序；兩門檻皆 TP=2、FP=3、FN=1。</text><text class="small" x="30" y="750">G3（凹痕）皆未匹配。座標與逐步判讀見正文。</text></svg>
