<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 555" role="img" aria-labelledby="title desc"><title id="title">K-匿名的等價類</title><desc id="desc">醫療偏斜版全部 12 筆，依年齡區間與地區分為 3 群，最小群 4 人。</desc><rect width="360" height="555" fill="#fff"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" fill="#172554"><text x="14" y="25" font-size="17" >準識別欄位相同，才是同一群</text><text x="14" y="48" font-size="12" >教學合成資料；索引不隨表公開</text><rect x="12" y="65" width="336" height="128" rx="6" fill="#eef2ff" /><text x="24" y="90" font-size="16" >30–39／北區：4 人</text><text x="28" y="114" font-size="14" >M01　氣喘</text><text x="28" y="134" font-size="14" >M02　氣喘</text><text x="28" y="154" font-size="14" >M03　氣喘</text><text x="28" y="174" font-size="14" >M04　糖尿病</text><rect x="12" y="207" width="336" height="128" rx="6" fill="#eef2ff" /><text x="24" y="232" font-size="16" >40–49／中區：4 人</text><text x="28" y="256" font-size="14" >M05　氣喘</text><text x="28" y="276" font-size="14" >M06　氣喘</text><text x="28" y="296" font-size="14" >M07　氣喘</text><text x="28" y="316" font-size="14" >M08　糖尿病</text><rect x="12" y="349" width="336" height="128" rx="6" fill="#eef2ff" /><text x="24" y="374" font-size="16" >50–59／南區：4 人</text><text x="28" y="398" font-size="14" >M09　糖尿病</text><text x="28" y="418" font-size="14" >M10　糖尿病</text><text x="28" y="438" font-size="14" >M11　偏頭痛</text><text x="28" y="458" font-size="14" >M12　偏頭痛</text><text x="14" y="512" font-size="15" >最小筆數為 4，K=4 通過。</text><text x="14" y="536" font-size="12" >金融表沿用相同分組，群大小也相同。</text></g></svg>
