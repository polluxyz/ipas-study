<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 348" role="img" aria-labelledby="title desc"><title id="title">延遲與記憶體預算篩選</title><desc id="desc">同一任務的模擬卡，線性及 TCN 都在預算內，GRU 同時超出兩項。</desc><style>text{font:14px sans-serif;fill:#172033}line{stroke:#52637a;stroke-width:1.5}.small{font-size:12px}.blue{fill:#12639b}.orange{fill:#a74713}</style><rect width="360" height="348" fill="#fff"/><text x="14" y="23" >邊緣預算：15 ms、64 MiB（模擬）</text><line x1="44" y1="48" x2="44" y2="252" /><line x1="44" y1="252" x2="340" y2="252" /><line x1="236" y1="48" x2="236" y2="252" stroke-dasharray="4 3"/><line x1="44" y1="117" x2="340" y2="117" stroke-dasharray="4 3"/><text x="37" y="273" class="small">0</text><text x="133" y="273" class="small">32</text><text x="229" y="273" class="small">64</text><text x="325" y="273" class="small">96</text><text x="14" y="256" class="small">0</text><text x="14" y="211" class="small">5</text><text x="14" y="166" class="small">10</text><text x="14" y="121" class="small">15</text><text x="14" y="76" class="small">20</text><circle cx="104" cy="216" r="5" fill="#12639b"/><text x="84" y="204" >線性</text><text x="86" y="238" class="small">20, 4</text><circle cx="284" cy="90" r="5" fill="#12639b"/><text x="264" y="78" >GRU</text><text x="266" y="112" class="small">80, 18</text><circle cx="188" cy="144" r="5" fill="#12639b"/><text x="168" y="132" >TCN</text><text x="170" y="166" class="small">48, 12</text><text x="14" y="46" class="small">端到端 p95（ms）</text><text x="182" y="297" class="small">峰值記憶體（MiB）</text><text x="14" y="325" >虛線左下區才同時滿足兩項預算</text></svg>