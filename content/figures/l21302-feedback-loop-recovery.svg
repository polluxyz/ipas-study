<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 577" role="img" aria-labelledby="title desc"><title id="title">互動回收與人工回饋</title><desc id="desc">線上互動保留版本，經人工核對後分流，通過驗證才發布並持續觀察；教學示意圖，框內為職責或檢查點。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#385c78"/></marker></defs><rect width="360" height="577" fill="#fff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#172f43"><text x="180" y="30" text-anchor="middle" font-size="20" font-weight="700">互動回收與人工回饋</text><text x="180" y="51" text-anchor="middle" font-size="13">教學示意圖・沿箭頭追蹤交付</text><rect x="28" y="65" width="304" height="64" rx="9" fill="#eef5fb" stroke="#385c78"/><text x="180" y="90" text-anchor="middle" font-size="18" font-weight="700">互動與服務紀錄</text><text x="180" y="114" text-anchor="middle" font-size="16">每日看使用與效能</text><path d="M180 130v23" stroke="#385c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="156" width="304" height="64" rx="9" fill="#eef5fb" stroke="#385c78"/><text x="180" y="181" text-anchor="middle" font-size="18" font-weight="700">錯誤與一般樣本</text><text x="180" y="205" text-anchor="middle" font-size="16">每週由現場回報、人工核對</text><path d="M180 221v23" stroke="#385c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="247" width="304" height="64" rx="9" fill="#eef5fb" stroke="#385c78"/><text x="180" y="272" text-anchor="middle" font-size="18" font-weight="700">許可、成熟標籤、品質</text><text x="180" y="296" text-anchor="middle" font-size="16">未成熟或有分歧先留待查</text><path d="M180 312v23" stroke="#385c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="338" width="304" height="64" rx="9" fill="#eef5fb" stroke="#385c78"/><text x="180" y="363" text-anchor="middle" font-size="18" font-weight="700">訓練與獨立評估分流</text><text x="180" y="387" text-anchor="middle" font-size="16">點擊不能直接當成正確答案</text><path d="M180 403v23" stroke="#385c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="429" width="304" height="64" rx="9" fill="#eef5fb" stroke="#385c78"/><text x="180" y="454" text-anchor="middle" font-size="18" font-weight="700">候選驗證後核准發布</text><text x="180" y="478" text-anchor="middle" font-size="16">每月重評；新互動再回到入口</text><text x="180" y="557" text-anchor="middle" font-size="15">門控細節為補充；原則是回收再優化</text></g></svg>
