<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 577" role="img" aria-labelledby="title desc"><title id="title">協調與教育循環</title><desc id="desc">產品協調人整理共同指標，需求衝突由授權人裁決，事故走快速止損通道，教育演練後回收理解落差；教學示意圖，框內為職責或檢查點。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#385c78"/></marker></defs><rect width="360" height="577" fill="#fff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#172f43"><text x="180" y="30" text-anchor="middle" font-size="20" font-weight="700">協調與教育循環</text><text x="180" y="51" text-anchor="middle" font-size="13">教學示意圖・沿箭頭追蹤交付</text><rect x="28" y="65" width="304" height="64" rx="9" fill="#eef5fb" stroke="#385c78"/><text x="180" y="90" text-anchor="middle" font-size="18" font-weight="700">產品協調人彙整問題</text><text x="180" y="114" text-anchor="middle" font-size="16">需求、指標、證據用相同定義</text><path d="M180 130v23" stroke="#385c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="156" width="304" height="64" rx="9" fill="#eef5fb" stroke="#385c78"/><text x="180" y="181" text-anchor="middle" font-size="18" font-weight="700">依事件選決策通道</text><text x="180" y="205" text-anchor="middle" font-size="16">需求衝突排優先；事故先止損</text><path d="M180 221v23" stroke="#385c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="247" width="304" height="64" rx="9" fill="#eef5fb" stroke="#385c78"/><text x="180" y="272" text-anchor="middle" font-size="18" font-weight="700">授權負責人決定與留痕</text><text x="180" y="296" text-anchor="middle" font-size="16">記條件、承辦人及驗收人</text><path d="M180 312v23" stroke="#385c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="338" width="304" height="64" rx="9" fill="#eef5fb" stroke="#385c78"/><text x="180" y="363" text-anchor="middle" font-size="18" font-weight="700">跨部門示範與回述</text><text x="180" y="387" text-anchor="middle" font-size="16">讓非技術同仁練轉人工與回報</text><path d="M180 403v23" stroke="#385c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="429" width="304" height="64" rx="9" fill="#eef5fb" stroke="#385c78"/><text x="180" y="454" text-anchor="middle" font-size="18" font-weight="700">核對結果，再調整規則</text><text x="180" y="478" text-anchor="middle" font-size="16">理解落差回到下一輪工作小組</text><text x="180" y="557" text-anchor="middle" font-size="15">具體路由與回述方法為補充</text></g></svg>
