<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-labelledby="t d"><title id="t">嵌入索引查表與 one-hot</title><desc id="d">教學合成嵌入表有4類2維。索引1與one-hot(0,1,0,0)都選中乙型第二列，得到(0,1)。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#087f8c"/></marker></defs><rect width="360" height="480" fill="#fff"/><g font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#172b4d"><text x="14" y="27" font-size="16">索引與 one-hot，選的是同一列</text><rect x="20" y="50" width="140" height="55" rx="6" fill="#e6f4f1" stroke="#8395a7"/><text x="30" y="73" font-size="14">索引 1</text><text x="30" y="95" font-size="14">乙型</text><rect x="200" y="50" width="140" height="55" rx="6" fill="#e6f4f1" stroke="#8395a7"/><text x="209" y="73" font-size="14">one-hot</text><text x="209" y="95" font-size="14">(0,1,0,0)</text><line x1="90" y1="105" x2="90" y2="135" stroke="#087f8c" stroke-width="3"  marker-end="url(#arrow)"/><line x1="270" y1="105" x2="270" y2="135" stroke="#087f8c" stroke-width="3"  marker-end="url(#arrow)"/><text x="28" y="158" font-size="14">查表選列</text><text x="198" y="158" font-size="14">矩陣相乘選列</text><rect x="63" y="177" width="234" height="160" rx="6" fill="#f4f7fa" stroke="#8395a7"/><text x="83" y="205" font-size="14">0 甲型  (1,0)</text><rect x="73" y="215" width="214" height="32" rx="6" fill="#e6f4f1" stroke="#8395a7"/><text x="83" y="241" font-size="14">1 乙型  (0,1)</text><text x="83" y="277" font-size="14">2 丙型  (1,1)</text><text x="83" y="313" font-size="14">3 丁型  (−1,1)</text><line x1="180" y1="341" x2="180" y2="370" stroke="#087f8c" stroke-width="3"  marker-end="url(#arrow)"/><rect x="85" y="382" width="190" height="44" rx="6" fill="#e6f4f1" stroke="#8395a7"/><text x="111" y="410" font-size="14">輸出向量 (0,1)</text><text x="19" y="461" font-size="14">教學手設嵌入表：4 類別 × 2 維表示</text></g></svg>