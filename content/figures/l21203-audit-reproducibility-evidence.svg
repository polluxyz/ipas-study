<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 536" role="img" aria-labelledby="title desc"><title id="title">可追溯與可重現證據</title><desc id="desc">從固定資料及模型版本，到明確設定與程序，再到原始結果及第三方查核。整條鏈都受權限範圍限制，重做評估不等於重訓模型。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="360" height="536" rx="12" fill="#f8fafc"/><g font-family="system-ui, 'Microsoft JhengHei', sans-serif" fill="#0f172a"><text x="180" y="30" text-anchor="middle" font-size="18" font-weight="700">可追溯與可重現證據</text><rect x="18" y="50" width="324" height="78" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="180" y="79" font-size="18" font-weight="700" text-anchor="middle">固定輸入版本</text><text x="180" y="107" font-size="16" text-anchor="middle">資料分割、模型與處理紀錄</text><path d="M180 130V153" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="18" y="163" width="324" height="78" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="180" y="192" font-size="18" font-weight="700" text-anchor="middle">固定設定與程序</text><text x="180" y="220" font-size="16" text-anchor="middle">環境、種子、規則與順序</text><path d="M180 243V266" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="18" y="276" width="324" height="78" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="180" y="305" font-size="18" font-weight="700" text-anchor="middle">保存原始結果</text><text x="180" y="333" font-size="16" text-anchor="middle">輸出、限制及變更理由</text><path d="M180 356V379" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="18" y="389" width="324" height="78" rx="9" fill="#fef3c7" stroke="#475569"/><text x="180" y="418" font-size="18" font-weight="700" text-anchor="middle">第三方受控查核</text><text x="180" y="446" font-size="16" text-anchor="middle">限權重做並保存接取紀錄</text><text x="180" y="506" text-anchor="middle" font-size="16">教學示意｜個案結論須另行查核</text></g></svg>
