<svg xmlns="http://www.w3.org/2000/svg" width="360" height="440" viewBox="0 0 360 440" role="img" aria-labelledby="title desc"><title id="title">奇異值與截斷誤差</title><desc id="desc">從共用矩陣計算三個奇異值及各保留維數的重建誤差。</desc><rect width="360" height="440" fill="white"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="18" y="28" fill="#4b5563" font-size="16" text-anchor="start">製程中心化矩陣：奇異值</text><line x1="45" y1="55" x2="45" y2="230" stroke="#4b5563" stroke-width="2"/><line x1="45" y1="230" x2="335" y2="230" stroke="#4b5563" stroke-width="2"/><rect x="74" y="88.0" width="48" height="142.0" fill="#175fa5"/><text x="98" y="76.0" fill="#175fa5" font-size="14" text-anchor="middle">4.4721</text><text x="98" y="254" fill="#4b5563" font-size="14" text-anchor="middle">方向1</text><rect x="166" y="152.22339683426642" width="48" height="77.77660316573358" fill="#175fa5"/><text x="190" y="140.22339683426642" fill="#175fa5" font-size="14" text-anchor="middle">2.4495</text><text x="190" y="254" fill="#4b5563" font-size="14" text-anchor="middle">方向2</text><rect x="258" y="230.0" width="48" height="1.0377903379079893e-14" fill="#175fa5"/><text x="282" y="218.0" fill="#175fa5" font-size="14" text-anchor="middle">0.0000</text><text x="282" y="254" fill="#4b5563" font-size="14" text-anchor="middle">方向3</text><text x="18" y="283" fill="#4b5563" font-size="14" text-anchor="start">縱軸：奇異值（指數）</text><text x="30" y="318" fill="#4b5563" font-size="14" text-anchor="start">保留 1 方向 → 平方誤差 6</text><text x="30" y="348" fill="#4b5563" font-size="14" text-anchor="start">保留 2 方向 → 平方誤差 0</text><text x="30" y="378" fill="#4b5563" font-size="14" text-anchor="start">保留 3 方向 → 平方誤差 0</text><text x="18" y="417" fill="#4b5563" font-size="14" text-anchor="start">誤差單位：指數平方；教學合成資料</text></g></svg>
