<svg xmlns="http://www.w3.org/2000/svg" width="360" height="376" viewBox="0 0 360 376" role="img" aria-labelledby="title desc"><title id="title">資料準備到模型選擇</title><desc id="desc">順序由資料可信度到表示，再到模型能力；資源限制也要通過。</desc><rect width="360" height="376" fill="#fff"/><g font-family="sans-serif" fill="#15334c"><text x="180" y="23" text-anchor="middle" font-size="17">資料準備到模型選擇</text><rect x="16" y="40" width="328" height="68" rx="9" fill="#edf4fc" stroke="#245b8c"/><text x="180" y="65" text-anchor="middle" font-size="17" font-weight="bold">1　收集與清理</text><text x="180" y="89" text-anchor="middle" font-size="14">來源、品質、預測目標</text><path d="M180 110v22m-5-6 5 6 5-6" stroke="#245b8c" fill="none" stroke-width="2"/><rect x="16" y="136" width="328" height="68" rx="9" fill="#edf4fc" stroke="#245b8c"/><text x="180" y="161" text-anchor="middle" font-size="17" font-weight="bold">2　特徵工程</text><text x="180" y="185" text-anchor="middle" font-size="14">填補、編碼、產生與篩選</text><path d="M180 206v22m-5-6 5 6 5-6" stroke="#245b8c" fill="none" stroke-width="2"/><rect x="16" y="232" width="328" height="68" rx="9" fill="#edf4fc" stroke="#245b8c"/><text x="180" y="257" text-anchor="middle" font-size="17" font-weight="bold">3　比較候選模型</text><text x="180" y="281" text-anchor="middle" font-size="14">任務、驗證品質、部署成本</text><text x="180" y="363" text-anchor="middle" font-size="14">資料品質不能由大模型補救</text></g></svg>
