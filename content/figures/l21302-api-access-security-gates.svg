<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 482" role="img" aria-labelledby="title desc"><title id="title">存取請求的多道檢查</title><desc id="desc">TLS 保護通道；入口驗證憑證再檢查動作和資料權限，並限速與留存必要日誌；失敗不進推論。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#285177"/></marker></defs><rect width="360" height="482" fill="white"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="16" fill="#172d43"><text x="180" y="30" text-anchor="middle" font-weight="700">存取請求的多道檢查</text><text x="180" y="50" text-anchor="middle" font-size="12">示意圖</text><text x="180" y="70" text-anchor="middle" font-weight="700">每一層回答不同問題</text><rect x="30" y="90" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="114" text-anchor="middle"><tspan x="180" dy="0">HTTPS／TLS</tspan><tspan x="180" dy="22">傳輸途中是否受到保護</tspan></text><path d="M180 150 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="176" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="200" text-anchor="middle"><tspan x="180" dy="0">Gateway 驗證憑證</tspan><tspan x="180" dy="22">簽章、發行者、對象及到期時間</tspan></text><path d="M180 236 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="262" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="286" text-anchor="middle"><tspan x="180" dy="0">授權檢查</tspan><tspan x="180" dy="22">角色、scope 與資料歸屬</tspan></text><path d="M180 322 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="348" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="372" text-anchor="middle"><tspan x="180" dy="0">限速、內容驗證、推論</tspan><tspan x="180" dy="22">紀錄 request_id 與拒絕原因</tspan></text><text x="180" y="430" text-anchor="middle" font-size="14">缺憑證 → 401；有效但不允許 → 403</text></g></svg>
