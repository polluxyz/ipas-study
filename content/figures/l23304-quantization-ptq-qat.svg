<svg xmlns="http://www.w3.org/2000/svg" width="360" height="440" viewBox="0 0 360 440" role="img" aria-labelledby="title desc"><title id="title">PTQ 與 QAT 流程</title><desc id="desc">兩條路都從浮點模型開始；靜態PTQ先校準，QAT先模擬量化並用訓練資料微調，轉換後都在保留資料及目標硬體驗收。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#475569"/></marker></defs><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#172554;font-size:14px}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}.alt{fill:#f0fdf4;stroke:#15803d;stroke-width:1.5}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:1.5}.line{fill:none;stroke:#475569;stroke-width:1.5;marker-end:url(#arrow)}</style><rect width="360" height="440" fill="white"/><rect x="10" y="15" width="160" height="52" rx="8" class="box"/><text x="90" y="39" text-anchor="middle">靜態 PTQ</text><rect x="190" y="15" width="160" height="52" rx="8" class="box"/><text x="270" y="39" text-anchor="middle">QAT</text><path d="M90 67L90 90" class="line"/><path d="M270 67L270 90" class="line"/><rect x="10" y="92" width="160" height="64" rx="8" class="box"/><text x="90" y="116" text-anchor="middle">已訓練浮點模型</text><text x="90" y="137" text-anchor="middle">代表性輸入校準</text><rect x="190" y="92" width="160" height="64" rx="8" class="box"/><text x="270" y="116" text-anchor="middle">浮點模型加入</text><text x="270" y="137" text-anchor="middle">模擬量化誤差</text><path d="M90 156L90 185" class="line"/><path d="M270 156L270 185" class="line"/><rect x="10" y="187" width="160" height="64" rx="8" class="alt"/><text x="90" y="211" text-anchor="middle">設定數值範圍</text><text x="90" y="232" text-anchor="middle">轉換低精度模型</text><rect x="190" y="187" width="160" height="64" rx="8" class="alt"/><text x="270" y="211" text-anchor="middle">訓練資料微調</text><text x="270" y="232" text-anchor="middle">再轉換低精度模型</text><path d="M90 251L130 285" class="line"/><path d="M270 251L230 285" class="line"/><rect x="30" y="287" width="300" height="64" rx="8" class="box"/><text x="180" y="311" text-anchor="middle">保留測試資料驗收品質</text><text x="180" y="332" text-anchor="middle">目標硬體量測延遲與記憶體</text><text x="180" y="389" text-anchor="middle">測試資料不拿來調尺度或微調</text><text x="180" y="430" text-anchor="middle" style="font-size:12px;fill:#475569">教學示意圖</text></svg>
