<svg xmlns="http://www.w3.org/2000/svg" width="360" height="620" viewBox="0 0 360 620" role="img" aria-labelledby="title desc">
<title id="title">倫理審查與再審流程</title><desc id="desc">部署前先提出風險、影響與措施證據。證據不足退回主責補證，通過才在指定範圍放行。申訴或變更觸發再審；利益衝突須先揭露。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#10233f} .box{fill:#eff6ff;stroke:#1d4e89;stroke-width:1.6} .hold{fill:#fff7ed;stroke:#9a3412;stroke-width:1.6;stroke-dasharray:5 3} .line{fill:none;stroke:#334155;stroke-width:1.8;marker-end:url(#arrow)}</style>
<rect width="360" height="620" fill="#fff"/><rect class="box" x="30" y="18" width="300" height="68" rx="9"/><text x="180" y="45" text-anchor="middle" font-size="17" font-weight="700">1　提出用途與證據</text><text x="180" y="69" text-anchor="middle" font-size="14">版本、受影響者、風險與措施</text><path class="line" d="M180 86V112"/><rect class="box" x="30" y="114" width="300" height="68" rx="9"/><text x="180" y="141" text-anchor="middle" font-size="17" font-weight="700">2　跨領域審查</text><text x="180" y="165" text-anchor="middle" font-size="14">技術、法律、人權、風險；先揭露利益</text><path class="line" d="M180 182V208"/><rect class="box" x="30" y="210" width="300" height="68" rx="9"/><text x="180" y="237" text-anchor="middle" font-size="17" font-weight="700">3　證據是否足夠？</text><text x="180" y="261" text-anchor="middle" font-size="14">負責人、限制與驗收條件一併查</text><path class="line" d="M100 278V313"/><path class="line" d="M260 278V313"/><text x="72" y="301" font-size="14">未通過</text><text x="246" y="301" font-size="14">通過</text><rect class="hold" x="20" y="315" width="150" height="68" rx="9"/><text x="95" y="342" text-anchor="middle" font-size="17" font-weight="700">退回補證</text><text x="95" y="366" text-anchor="middle" font-size="14">主責改善再送審</text><rect class="box" x="190" y="315" width="150" height="68" rx="9"/><text x="265" y="342" text-anchor="middle" font-size="17" font-weight="700">限範圍放行</text><text x="265" y="366" text-anchor="middle" font-size="14">保留核准與限制</text><path class="line" d="M20 349H8V148H28"/><path class="line" d="M265 383V414"/><rect class="box" x="30" y="416" width="300" height="68" rx="9"/><text x="180" y="443" text-anchor="middle" font-size="17" font-weight="700">4　監控與申訴</text><text x="180" y="467" text-anchor="middle" font-size="14">事件、用途或版本變更觸發再審</text><path class="line" d="M180 484V520H348V148H332"/><text x="180" y="550" text-anchor="middle" font-size="14">實線：審查方向　虛線框：未通過處置</text><text x="180" y="580" text-anchor="middle" font-size="14">教學示意；不是所有企業的法定程序</text></svg>