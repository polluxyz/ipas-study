<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 432" role="img" aria-labelledby="title desc"><title id="title">GPU 批次與空檔</title><desc id="desc">前兩批用相同比例顯示 host 與 kernel；單筆全程二百八十八毫秒，四筆合批全程一百二十毫秒。</desc><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#142c40;font-size:14px}.h{font-size:17px;font-weight:700}.s{font-size:12px}.box{fill:#edf6fb;stroke:#266080;stroke-width:1.5}.arrow{fill:none;stroke:#266080;stroke-width:2}</style><rect width="360" height="432" fill="#fff"/><text x="16" y="28" class="h">同 24 請求，後端同時到達</text><text x="16" y="63" class="">每批 1 筆：前兩批時間軸</text><rect x="16" y="75" width="28" height="28" fill="#f1d193" stroke="#304a60"/><rect x="44" y="75" width="56" height="28" fill="#8dcbbd" stroke="#304a60"/><text x="16" y="123" class="s">0 ms</text><rect x="100" y="75" width="28" height="28" fill="#f1d193" stroke="#304a60"/><rect x="128" y="75" width="56" height="28" fill="#8dcbbd" stroke="#304a60"/><text x="100" y="123" class="s">12 ms</text><text x="184" y="123" class="s">24 ms</text><text x="16" y="147" class="">全程 288 ms；空檔 96 ms</text><text x="16" y="169" class="">吞吐 83.33 req/s</text><text x="16" y="195" class="">每批 4 筆：前兩批時間軸</text><rect x="16" y="207" width="28" height="28" fill="#f1d193" stroke="#304a60"/><rect x="44" y="207" width="112" height="28" fill="#8dcbbd" stroke="#304a60"/><text x="16" y="255" class="s">0 ms</text><rect x="156" y="207" width="28" height="28" fill="#f1d193" stroke="#304a60"/><rect x="184" y="207" width="112" height="28" fill="#8dcbbd" stroke="#304a60"/><text x="156" y="255" class="s">20 ms</text><text x="296" y="255" class="s">40 ms</text><text x="16" y="279" class="">全程 120 ms；空檔 24 ms</text><text x="16" y="301" class="">吞吐 200.00 req/s</text><rect x="16" y="340" width="16" height="16" fill="#f1d193" stroke="#304a60"/><text x="40" y="353" class="">host 空檔</text><rect x="170" y="340" width="16" height="16" fill="#8dcbbd" stroke="#304a60"/><text x="194" y="353" class="">kernel</text><text x="16" y="386" class="s">圖只放大前兩批；全程數值由 24 筆核算。</text><text x="16" y="410" class="s">不含外圍 30 ms；非 GPU 實測。</text></svg>
