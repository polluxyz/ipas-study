<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 577" role="img" aria-labelledby="title desc"><title id="title">更新與發布分開</title><desc id="desc">資料到達後先預測，真值成熟才更新候選，通過離線回放及上線觀察門檻才能正式擴量；教學示意圖，框內為職責或檢查點。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#385c78"/></marker></defs><rect width="360" height="577" fill="#fff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#172f43"><text x="180" y="30" text-anchor="middle" font-size="20" font-weight="700">更新與發布分開</text><text x="180" y="51" text-anchor="middle" font-size="13">教學示意圖・沿箭頭追蹤交付</text><rect x="28" y="65" width="304" height="64" rx="9" fill="#eef5fb" stroke="#385c78"/><text x="180" y="90" text-anchor="middle" font-size="18" font-weight="700">先預測，保留當時版本</text><text x="180" y="114" text-anchor="middle" font-size="16">當下不能偷看未來標籤</text><path d="M180 130v23" stroke="#385c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="156" width="304" height="64" rx="9" fill="#eef5fb" stroke="#385c78"/><text x="180" y="181" text-anchor="middle" font-size="18" font-weight="700">等待標籤與品質核對</text><text x="180" y="205" text-anchor="middle" font-size="16">格式相容、來源可靠才接收</text><path d="M180 221v23" stroke="#385c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="247" width="304" height="64" rx="9" fill="#eef5fb" stroke="#385c78"/><text x="180" y="272" text-anchor="middle" font-size="18" font-weight="700">沿用舊狀態更新候選</text><text x="180" y="296" text-anchor="middle" font-size="16">AutoML搜尋配置是另一條路</text><path d="M180 312v23" stroke="#385c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="338" width="304" height="64" rx="9" fill="#eef5fb" stroke="#385c78"/><text x="180" y="363" text-anchor="middle" font-size="18" font-weight="700">離線驗證與舊情境回放</text><text x="180" y="387" text-anchor="middle" font-size="16">未過門檻保留舊版，查原因</text><path d="M180 403v23" stroke="#385c78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="28" y="429" width="304" height="64" rx="9" fill="#eef5fb" stroke="#385c78"/><text x="180" y="454" text-anchor="middle" font-size="18" font-weight="700">人工核准後小量觀察</text><text x="180" y="478" text-anchor="middle" font-size="16">異常停止更新、回復相容舊版</text><text x="180" y="557" text-anchor="middle" font-size="15">門控流程為補充；線上不等於免驗證</text></g></svg>
