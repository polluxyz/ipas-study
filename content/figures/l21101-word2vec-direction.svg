<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 402" role="img"><title>CBOW 與 Skip-gram 預測方向</title><desc>兩圖共用 T02 的中心詞訂及半徑二上下文。不、要、明天、的合併後預測訂是 CBOW；訂分別預測四詞是 Skip-gram。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1b559e"/></marker></defs><rect width="360" height="402" fill="white"/><g font-family="sans-serif" font-size="18" fill="#172b4d" text-anchor="middle"><text x="180" y="27">CBOW：上下文 → 中心</text><rect x="20" y="43" width="320" height="42" rx="7" fill="#eef3f9"/><text x="180" y="70">不　要　明天　的</text><path d="M180 91V129" stroke="#1b559e" stroke-width="3" marker-end="url(#arrow)"/><rect x="135" y="139" width="90" height="40" rx="7" fill="#d9e9ff"/><text x="180" y="166">訂</text><text x="180" y="218">Skip-gram：中心 → 周邊</text><rect x="135" y="233" width="90" height="40" rx="7" fill="#d9e9ff"/><text x="180" y="260">訂</text><g stroke="#1b559e" stroke-width="2" marker-end="url(#arrow)"><path d="M180 279L45 325"/><path d="M180 279L135 325"/><path d="M180 279L225 325"/><path d="M180 279L315 325"/></g><g fill="#eef3f9"><rect x="7" y="332" width="76" height="40" rx="5"/><rect x="97" y="332" width="76" height="40" rx="5"/><rect x="187" y="332" width="76" height="40" rx="5"/><rect x="277" y="332" width="76" height="40" rx="5"/></g><text x="45" y="359">不</text><text x="135" y="359">要</text><text x="225" y="359">明天</text><text x="315" y="359">的</text><text x="180" y="395" font-size="14">同一句、同一視窗；教學示意。</text></g></svg>
