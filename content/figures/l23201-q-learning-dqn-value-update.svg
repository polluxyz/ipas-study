<svg xmlns="http://www.w3.org/2000/svg" width="360" height="447" viewBox="0 0 360 447" role="img" aria-labelledby="title desc"><title id="title">Q的表示與一次更新</title><desc id="desc">上方是Q表查詢與網路近似的示意，下方由W05與舊Q快照計算舊值、新值和目標，橫條長度共用比例。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#355878"/></marker></defs><rect width="360" height="447" rx="10" fill="#fff"/><g fill="#142c42" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="16" y="27" font-size="18">Q的表示與一次更新</text><text x="16" y="54" font-size="14">表格與網路，表示同一類動作價值</text><rect x="16" y="69" width="328" height="43" rx="8" fill="#eaf2fa" stroke="#355878"/><text x="28" y="96" font-size="15">Q表：狀態＋動作 → 查格子</text><rect x="16" y="125" width="328" height="58" rx="8" fill="#eaf2fa" stroke="#355878"/><text x="28" y="149" font-size="15">DQN：狀態／影像 → 網路</text><text x="28" y="170" font-size="14">→ 各個離散動作的Q值</text><text x="16" y="210" font-size="15">B抓取，α=0.5，γ=0.9</text><text x="16" y="240" font-size="15">舊Q值：1.00</text><rect x="16" y="248" width="115.38461538461539" height="18" fill="#335f91"/><text x="16" y="300" font-size="15">新Q值：1.80</text><rect x="16" y="308" width="207.69230769230768" height="18" fill="#8a4c16"/><text x="16" y="360" font-size="15">目標值：2.60</text><rect x="16" y="368" width="300" height="18" fill="#335f91"/><text x="16" y="427" font-size="13">橫條共用比例；新值向目標靠近</text></g></svg>
