<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 325" role="img" aria-labelledby="title desc"><title id="title">框匹配的兩種失敗</title><desc id="desc">M11 偏框未達 IoU 門檻，M09 重複框不能重複使用真值；教學合成資料</desc><rect width="360" height="325" fill="#fff"/><g font-family="sans-serif"><text x="16" y="27" font-size="18" fill="#17243b">同一真值，只能配到一個預測</text><text x="16" y="55" font-size="16" fill="#17243b">實線真值；虛線偏框</text><rect x="30" y="78" width="120" height="120" fill="#e1f0e6" stroke="#225843" stroke-width="3"/><rect x="120" y="78" width="120" height="120" fill="none" stroke="#89512f" stroke-width="3" stroke-dasharray="7 5"/><text x="16" y="230" font-size="16" fill="#17243b">M11 偏框：交集 4，聯集 28</text><text x="16" y="258" font-size="16" fill="#17243b">IoU = 4/28，未達 0.5</text><text x="16" y="294" font-size="16" fill="#17243b">M09 的兩個正框：先到 TP，重複 FP</text></g></svg>
