<svg xmlns="http://www.w3.org/2000/svg" width="360" height="472" viewBox="0 0 360 472" role="img" aria-labelledby="title desc"><title id="title">品質閘門與處置</title><desc id="desc">發現問題後須回來源查核、修正或隔離，再重查才能放行。</desc><rect width="360" height="472" fill="#fff"/><g font-family="sans-serif" fill="#15334c"><text x="180" y="23" text-anchor="middle" font-size="17">品質閘門與處置</text><rect x="16" y="40" width="328" height="68" rx="9" fill="#edf4fc" stroke="#245b8c"/><text x="180" y="65" text-anchor="middle" font-size="17" font-weight="bold">盤點來源與用途</text><text x="180" y="89" text-anchor="middle" font-size="14">必要欄位、時間、單位</text><path d="M180 110v22m-5-6 5 6 5-6" stroke="#245b8c" fill="none" stroke-width="2"/><rect x="16" y="136" width="328" height="68" rx="9" fill="#edf4fc" stroke="#245b8c"/><text x="180" y="161" text-anchor="middle" font-size="17" font-weight="bold">逐項檢核</text><text x="180" y="185" text-anchor="middle" font-size="14">完整、一致、準確、即時、唯一</text><path d="M180 206v22m-5-6 5 6 5-6" stroke="#245b8c" fill="none" stroke-width="2"/><rect x="16" y="232" width="328" height="68" rx="9" fill="#edf4fc" stroke="#245b8c"/><text x="180" y="257" text-anchor="middle" font-size="17" font-weight="bold">回來源修正或先隔離</text><text x="180" y="281" text-anchor="middle" font-size="14">保留問題與處置紀錄</text><path d="M180 302v22m-5-6 5 6 5-6" stroke="#245b8c" fill="none" stroke-width="2"/><rect x="16" y="328" width="328" height="68" rx="9" fill="#edf4fc" stroke="#245b8c"/><text x="180" y="353" text-anchor="middle" font-size="17" font-weight="bold">重新檢核後才放行</text><text x="180" y="377" text-anchor="middle" font-size="14">語料另查標籤與代表性</text><text x="180" y="459" text-anchor="middle" font-size="14">有異常不等於必須刪除</text></g></svg>
