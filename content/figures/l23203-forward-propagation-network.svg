<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 336" role="img" aria-labelledby="title desc"><title id="title">固定雙層網路的資料流</title><desc id="desc">資料沿實線往下；隱藏層寬度二，輸出層寬度一；兩個全連接層皆含偏置。</desc><style>text{font-family:system-ui,sans-serif;font-size:14px;fill:#182b42}.box{fill:#edf4fb;stroke:#24648d;stroke-width:1.5}.line{fill:none;stroke:#24648d;stroke-width:2}.back{fill:none;stroke:#a04435;stroke-width:2;stroke-dasharray:5 3}</style><rect width="360" height="336" fill="#fff"/><rect class="box" x="70" y="15" width="220" height="52" rx="7"/><text x="180" y="37" text-anchor="middle">輸入 x = [1, 0]</text><text x="180" y="56" text-anchor="middle">形狀 (2,)</text><path class="line" d="M180 67V88m-4 -6l4 6l4 -6"/><rect class="box" x="45" y="88" width="270" height="60" rx="7"/><text x="180" y="110" text-anchor="middle">全連接 W₁：2×2，b₁：2</text><text x="180" y="129" text-anchor="middle">z₁ = [0.75, −0.25]</text><path class="line" d="M180 148V169m-4 -6l4 6l4 -6"/><rect class="box" x="70" y="169" width="220" height="52" rx="7"/><text x="180" y="191" text-anchor="middle">ReLU 隱藏層</text><text x="180" y="210" text-anchor="middle">h = [0.75, 0]</text><path class="line" d="M180 221V242m-4 -6l4 6l4 -6"/><rect class="box" x="45" y="242" width="270" height="60" rx="7"/><text x="180" y="264" text-anchor="middle">全連接 W₂：1×2，b₂：1</text><text x="180" y="283" text-anchor="middle">z₂ = 0.25；p = 0.562177</text><text x="180" y="327" text-anchor="middle" style="font-size:11px">教學合成資料／示意圖</text></svg>
