<svg xmlns="http://www.w3.org/2000/svg" width="360" height="380" viewBox="0 0 360 380" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">三條合成文字分類路線的標註量與 macro-F1</title>
<desc id="desc">固定600筆測試、400筆驗證；訓練200、1000、2000筆。實線圓點是詞級邏輯迴歸，虛線方點是字元線性SVM，點線三角是詞級多項式朴素貝氏。點是五輪平均，短線是描述性標準差，不是信賴區間。2000筆時三線重合。橫軸線性，縱軸截斷為0.72到0.90。完整數值見正文與JSON。</desc>
<style>:root{color-scheme:light dark;--bg:#f9fbf9;--ink:#263a45;--grid:#d4dfe1;--a:#006b66;--b:#9a3c00;--c:#6840a0}@media(prefers-color-scheme:dark){:root{--bg:#14242c;--ink:#e4eeee;--grid:#40525b;--a:#75d6c9;--b:#ffc194;--c:#cfafff}}text{font-family:"Microsoft JhengHei",sans-serif;font-size:14px;fill:var(--ink)}</style>
<rect width="360" height="380" rx="8" fill="var(--bg)"/>
<text x="18" y="26" style="font-size:17px;font-weight:bold">同一測試集，比較標註量</text>
<text x="18" y="49">macro-F1（五輪平均 ± 描述標準差）</text>
<text x="18" y="72" style="font-size:13px">縱軸截斷；2000 筆時三線重合</text>
