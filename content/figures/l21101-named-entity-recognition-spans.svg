<svg xmlns="http://www.w3.org/2000/svg" width="360" height="352" viewBox="0 0 360 352" role="img" aria-labelledby="title desc"><title id="title">命名實體的字元邊界</title><desc id="desc">原句前十字林安於青禾醫院掛號，索引零到九；林安為PERSON零到二，青禾醫院為ORG三到七；右界均不包含。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#172033;font-size:14px}.small{font-size:12px}.title{font-size:17px;font-weight:700}.box{fill:#eff6ff;stroke:#1d4ed8;stroke-width:1.5}.warning{fill:#fff7ed;stroke:#9a3412;stroke-width:1.5}.edge{fill:none;stroke:#334155;stroke-width:1.7;marker-end:url(#arrow)}</style><rect width="360" height="352" fill="#fff"/><text x="180" y="27" text-anchor="middle" class="title">實體範圍與原文字元</text><text x="180" y="54" text-anchor="middle" class="small">零起算；左含、右不含</text><text x="35" y="83" text-anchor="middle" class="small">0</text><rect x="23" y="95" width="27" height="34" fill="#f8fafc" stroke="#94a3b8"/><text x="36" y="118" text-anchor="middle" class="">林</text><text x="67" y="83" text-anchor="middle" class="small">1</text><rect x="55" y="95" width="27" height="34" fill="#f8fafc" stroke="#94a3b8"/><text x="68" y="118" text-anchor="middle" class="">安</text><text x="99" y="83" text-anchor="middle" class="small">2</text><rect x="87" y="95" width="27" height="34" fill="#f8fafc" stroke="#94a3b8"/><text x="100" y="118" text-anchor="middle" class="">於</text><text x="131" y="83" text-anchor="middle" class="small">3</text><rect x="119" y="95" width="27" height="34" fill="#f8fafc" stroke="#94a3b8"/><text x="132" y="118" text-anchor="middle" class="">青</text><text x="163" y="83" text-anchor="middle" class="small">4</text><rect x="151" y="95" width="27" height="34" fill="#f8fafc" stroke="#94a3b8"/><text x="164" y="118" text-anchor="middle" class="">禾</text><text x="195" y="83" text-anchor="middle" class="small">5</text><rect x="183" y="95" width="27" height="34" fill="#f8fafc" stroke="#94a3b8"/><text x="196" y="118" text-anchor="middle" class="">醫</text><text x="227" y="83" text-anchor="middle" class="small">6</text><rect x="215" y="95" width="27" height="34" fill="#f8fafc" stroke="#94a3b8"/><text x="228" y="118" text-anchor="middle" class="">院</text><text x="259" y="83" text-anchor="middle" class="small">7</text><rect x="247" y="95" width="27" height="34" fill="#f8fafc" stroke="#94a3b8"/><text x="260" y="118" text-anchor="middle" class="">掛</text><text x="291" y="83" text-anchor="middle" class="small">8</text><rect x="279" y="95" width="27" height="34" fill="#f8fafc" stroke="#94a3b8"/><text x="292" y="118" text-anchor="middle" class="">號</text><text x="323" y="83" text-anchor="middle" class="small">9</text><rect x="311" y="95" width="27" height="34" fill="#f8fafc" stroke="#94a3b8"/><text x="324" y="118" text-anchor="middle" class="">，</text><rect x="20" y="155" width="85" height="38" rx="8" class="box"/><text x="62.5" y="179" text-anchor="middle" class="">林安</text><text x="62" y="215" text-anchor="middle" class="small">PERSON</text><text x="62" y="237" text-anchor="middle" class="small">[0,2)</text><rect x="120" y="155" width="155" height="38" rx="8" class="box"/><text x="197.5" y="179" text-anchor="middle" class="">青禾醫院</text><text x="197" y="215" text-anchor="middle" class="small">ORG</text><text x="197" y="237" text-anchor="middle" class="small">[3,7)</text><path d="M61 131V150M181 131V150" class="edge"/><text x="180" y="282" text-anchor="middle" class="">於、掛、號不放入這兩段實體</text><text x="180" y="309" text-anchor="middle" class="small">完整原句另含日期：11月5日</text><text x="180" y="338" text-anchor="middle" class="small">資料來源：教學合成資料M01</text></svg>
