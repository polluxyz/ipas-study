<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" role="img" aria-labelledby="title desc"><title id="title">對齊訓練、測試與防護</title><desc id="desc">理想答案先做 SFT，候選排序學獎勵模型，再以獎勵調整策略；紅隊在另一流程發現風險，決定修正後回歸測試，並保留上線防護。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#344861"/></marker></defs><rect width="360" height="760" fill="#fff"/><g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="180" y="28" text-anchor="middle" font-size="15" fill="#172b4d">訓練流程：傳統 RLHF</text><rect x="30" y="45" width="300" height="55" rx="9" fill="#fff3d6" stroke="#9b6413" stroke-width="2" /><text x="180" y="69" text-anchor="middle" font-size="15" fill="#172b4d">輸入＋理想答 → SFT</text><path d="M180 100 L180 124" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="126" width="300" height="68" rx="9" fill="#fff3d6" stroke="#9b6413" stroke-width="2" /><text x="180" y="150" text-anchor="middle" font-size="15" fill="#172b4d">同輸入候選的偏好排序</text><text x="180" y="172" text-anchor="middle" font-size="15" fill="#172b4d">→ 訓練獎勵模型</text><path d="M180 194 L180 218" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="220" width="300" height="68" rx="9" fill="#fff3d6" stroke="#9b6413" stroke-width="2" /><text x="180" y="244" text-anchor="middle" font-size="15" fill="#172b4d">獎勵評分 → 調整生成策略</text><text x="180" y="266" text-anchor="middle" font-size="15" fill="#172b4d">參考模型限制過度偏移</text><text x="180" y="333" text-anchor="middle" font-size="15" fill="#172b4d">測試與修正：不等同訓練</text><rect x="30" y="348" width="300" height="55" rx="9" fill="#eaf1fa" stroke="#47678f" stroke-width="2" stroke-dasharray="5 3"/><text x="180" y="372" text-anchor="middle" font-size="15" fill="#172b4d">紅隊測試 → 記錄失效</text><path d="M180 403 L180 426" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="428" width="300" height="68" rx="9" fill="#eaf1fa" stroke="#47678f" stroke-width="2" stroke-dasharray="5 3"/><text x="180" y="452" text-anchor="middle" font-size="15" fill="#172b4d">按原因修正</text><text x="180" y="474" text-anchor="middle" font-size="15" fill="#172b4d">資料、模型、權限或流程</text><path d="M180 496 L180 519" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="521" width="300" height="68" rx="9" fill="#eaf1fa" stroke="#47678f" stroke-width="2" stroke-dasharray="5 3"/><text x="180" y="545" text-anchor="middle" font-size="15" fill="#172b4d">回歸測試＋正常案例</text><text x="180" y="567" text-anchor="middle" font-size="15" fill="#172b4d">檢查風險與誤擋</text><path d="M180 589 L180 612" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="614" width="300" height="68" rx="9" fill="#eaf1fa" stroke="#47678f" stroke-width="2" stroke-dasharray="5 3"/><text x="180" y="638" text-anchor="middle" font-size="15" fill="#172b4d">上線防護與監控</text><text x="180" y="660" text-anchor="middle" font-size="15" fill="#172b4d">發現新失效 → 再修正</text><text x="180" y="719" text-anchor="middle" font-size="14" fill="#172b4d">測試記錄本身不更新模型參數</text><text x="180" y="744" text-anchor="middle" font-size="13" fill="#172b4d">教學示意；非模型實測</text></g></svg>
