<svg xmlns="http://www.w3.org/2000/svg" width="360" height="530" viewBox="0 0 360 530" role="img" aria-labelledby="title desc"><title id="title">真實與候選輸出的模式計數</title><desc id="desc">三類正常資料各8張；漏模式候選為12、12、0；每類一原型候選各8張但只有3張不同圖。</desc><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#18243a;font-size:14px}.small{font-size:12px}.heading{font-size:17px;font-weight:700}.box{fill:#eef3fa;stroke:#50647e;stroke-width:1.5}.arrow{stroke:#50647e;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#50647e"/></marker></defs><rect width="360" height="530" fill="#fff"/><text class="heading" x="18" y="27">商品形狀的模式覆蓋</text><text class="small" x="18" y="49">每組 24 張；由固定樣本索引計數</text><text x="18" y="82" font-weight="700">正常資料</text><text class="small" x="178" y="82">不同圖：24</text><text class="small" x="18" y="106">橫紋 8 張</text><rect x="18" y="115" width="60" height="17" fill="#267a77"/><text class="small" x="131" y="106">直紋 8 張</text><rect x="131" y="115" width="60" height="17" fill="#267a77"/><text class="small" x="244" y="106">十字 8 張</text><rect x="244" y="115" width="60" height="17" fill="#a15c25"/><text x="18" y="179" font-weight="700">平衡抽取</text><text class="small" x="178" y="179">不同圖：24</text><text class="small" x="18" y="203">橫紋 8 張</text><rect x="18" y="212" width="60" height="17" fill="#267a77"/><text class="small" x="131" y="203">直紋 8 張</text><rect x="131" y="212" width="60" height="17" fill="#267a77"/><text class="small" x="244" y="203">十字 8 張</text><rect x="244" y="212" width="60" height="17" fill="#a15c25"/><text x="18" y="276" font-weight="700">漏掉十字</text><text class="small" x="178" y="276">不同圖：12</text><text class="small" x="18" y="300">橫紋 12 張</text><rect x="18" y="309" width="90" height="17" fill="#267a77"/><text class="small" x="131" y="300">直紋 12 張</text><rect x="131" y="309" width="90" height="17" fill="#267a77"/><text class="small" x="244" y="300">十字 0 張</text><rect x="244" y="309" width="0" height="17" fill="#a15c25"/><text x="18" y="373" font-weight="700">每類一原型</text><text class="small" x="178" y="373">不同圖：3</text><text class="small" x="18" y="397">橫紋 8 張</text><rect x="18" y="406" width="60" height="17" fill="#267a77"/><text class="small" x="131" y="397">直紋 8 張</text><rect x="131" y="406" width="60" height="17" fill="#267a77"/><text class="small" x="244" y="397">十字 8 張</text><rect x="244" y="406" width="60" height="17" fill="#a15c25"/><text x="18" y="482">覆蓋全類別，也可能每類只剩一張。</text><text class="small" x="18" y="509">全部模板合格率均為 100%，仍要檢查重複。</text></svg>