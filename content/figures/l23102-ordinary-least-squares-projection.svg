<svg xmlns="http://www.w3.org/2000/svg" width="360" height="415" viewBox="0 0 360 415" role="img" aria-labelledby="title desc"><title id="title">目標投影與正交殘差</title><desc id="desc">目標向量y投影到設計矩陣的欄空間，殘差與該空間正交；非原始特徵點的散點圖。</desc><rect width="360" height="415" fill="white"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="18" y="28" fill="#4b5563" font-size="16" text-anchor="start">OLS：目標向量的正交投影</text><text x="18" y="53" fill="#4b5563" font-size="14" text-anchor="start">六維觀測空間的示意截面</text><rect x="23" y="285" width="310" height="38" rx="6" fill="#f4f7fa" stroke="#175fa5"/><line x1="45" y1="285" x2="228" y2="285" stroke="#175fa5" stroke-width="4"/><line x1="45" y1="285" x2="228" y2="130" stroke="#175fa5" stroke-width="3"/><line x1="228" y1="285" x2="228" y2="130" stroke="#a4470c" stroke-width="3" stroke-dasharray="5 4"/><line x1="212" y1="285" x2="212" y2="269" stroke="#4b5563" stroke-width="2"/><line x1="212" y1="269" x2="228" y2="269" stroke="#4b5563" stroke-width="2"/><circle cx="45" cy="285" r="4" fill="#175fa5"/><circle cx="228" cy="130" r="5" fill="#175fa5"/><circle cx="228" cy="285" r="5" fill="#175fa5"/><text x="29" y="273" fill="#4b5563" font-size="14" text-anchor="start">0</text><text x="244" y="132" fill="#175fa5" font-size="15" text-anchor="start">目標 y</text><text x="245" y="215" fill="#a4470c" font-size="15" text-anchor="start">殘差 r</text><text x="125" y="271" fill="#175fa5" font-size="15" text-anchor="start">預測 ŷ</text><text x="42" y="311" fill="#4b5563" font-size="15" text-anchor="start">設計矩陣 D 的欄空間</text><text x="18" y="361" fill="#4b5563" font-size="16" text-anchor="start">y ＝ ŷ ＋ r；Dᵀr ＝ 0</text><text x="18" y="390" fill="#4b5563" font-size="13" text-anchor="start">示意圖：不把六維座標誤當輸入軸</text></g></svg>
