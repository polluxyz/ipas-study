<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 618" width="360" height="618" role="img" aria-labelledby="title desc"><title id="title">M3AE 可見輸入與遮罩目標</title><desc id="desc">首筆資料遮住圖塊一、三及文字索引二；編碼器不讀原始遮蔽內容，重建端輸出對應目標。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#475569"/></marker></defs><rect width="360" height="618" fill="#ffffff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#172033"><text x="180" y="26" font-size="18" text-anchor="middle">圖塊與詞元：遮住後再重建</text><text x="180" y="56" font-size="15" text-anchor="middle">圖片位置</text><rect x="12" y="70" width="75" height="43" rx="7" fill="#e7effb" stroke="#334155" /><text x="49.5" y="96.5" font-size="15" text-anchor="middle">圖塊 0</text><rect x="99" y="70" width="75" height="43" rx="7" fill="#fff1d6" stroke="#334155" stroke-dasharray="5 4"/><text x="136.5" y="96.5" font-size="15" text-anchor="middle">圖塊 1</text><rect x="186" y="70" width="75" height="43" rx="7" fill="#e7effb" stroke="#334155" /><text x="223.5" y="96.5" font-size="15" text-anchor="middle">圖塊 2</text><rect x="273" y="70" width="75" height="43" rx="7" fill="#fff1d6" stroke="#334155" stroke-dasharray="5 4"/><text x="310.5" y="96.5" font-size="15" text-anchor="middle">圖塊 3</text><text x="180" y="143" font-size="15" text-anchor="middle">文字位置</text><rect x="12" y="157" width="75" height="43" rx="7" fill="#e7effb" stroke="#334155" /><text x="49.5" y="183.5" font-size="15" text-anchor="middle">紅色</text><rect x="99" y="157" width="75" height="43" rx="7" fill="#e7effb" stroke="#334155" /><text x="136.5" y="183.5" font-size="15" text-anchor="middle">杯子</text><rect x="186" y="157" width="75" height="43" rx="7" fill="#fff1d6" stroke="#334155" stroke-dasharray="5 4"/><text x="223.5" y="183.5" font-size="15" text-anchor="middle">杯口</text><rect x="273" y="157" width="75" height="43" rx="7" fill="#e7effb" stroke="#334155" /><text x="310.5" y="183.5" font-size="15" text-anchor="middle">缺損</text><text x="180" y="229" font-size="14" text-anchor="middle">實線可見；虛線位置從輸入移除</text><path d="M180,240 L180,263" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="32" y="267" width="296" height="45" rx="7" fill="#e7effb" stroke="#334155" /><text x="180" y="294.5" font-size="15" text-anchor="middle">統一編碼器：只讀可見圖文</text><path d="M180,314 L180,340" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="32" y="344" width="296" height="45" rx="7" fill="#fff1d6" stroke="#334155" /><text x="180" y="371.5" font-size="15" text-anchor="middle">重建解碼器：補遮罩位置</text><path d="M180,391 L180,408" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M180,408 L92,426" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M180,408 L267,426" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="15" y="430" width="155" height="66" rx="7" fill="#e7effb" stroke="#334155" /><text x="92.5" y="468" font-size="15" text-anchor="middle">圖片頭 → 像素</text><rect x="190" y="430" width="155" height="66" rx="7" fill="#e7effb" stroke="#334155" /><text x="267.5" y="468" font-size="15" text-anchor="middle">文字頭 → 詞元</text><text x="92" y="525" font-size="14" text-anchor="middle">目標：圖塊 1、3</text><text x="267" y="525" font-size="14" text-anchor="middle">目標：「杯口」</text><text x="180" y="572" font-size="15" text-anchor="middle">原始被遮內容只當訓練目標</text><text x="180" y="599" font-size="13" text-anchor="middle">來源：R01 教學合成資料；非模型實測</text></g></svg>
