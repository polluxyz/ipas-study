<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480" role="img" aria-labelledby="title desc">
  <title id="title">依學習目標區別生成式與鑑別式建模</title>
  <desc id="desc">同一份郵件資料，鑑別式路徑直接學由輸入到類別的判斷，生成式路徑學資料分布以合成內容，也可利用分布做分類。生成語言模型的表示還能接下游分類器。作者繪製教學示意圖，非實測資料。</desc>
  <rect width="360" height="480" rx="12" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif" fill="#172b46">
    <text x="18" y="30" font-size="18" font-weight="700">相同資料，學習目標可以不同</text>
    <rect x="16" y="49" width="328" height="51" rx="8" fill="#e8edf4" stroke="#64748b"/>
    <text x="29" y="80" font-size="15">資料：郵件內容及可用類別標籤</text>
    <text x="180" y="124" text-anchor="middle" font-size="23">↓</text>
    <rect x="16" y="137" width="328" height="103" rx="8" fill="#e1efff" stroke="#326aa3"/>
    <text x="29" y="163" font-size="17" font-weight="700">路徑一：鑑別式建模</text>
    <text x="29" y="191" font-size="15">學輸入 → 目標的決策</text>
    <text x="29" y="217" font-size="14">例：直接判斷配送或退款類別</text>
    <rect x="16" y="254" width="328" height="103" rx="8" fill="#e1f4ed" stroke="#27785c"/>
    <text x="29" y="280" font-size="17" font-weight="700">路徑二：生成式建模</text>
    <text x="29" y="308" font-size="15">學資料分布 → 生成或推斷</text>
    <text x="29" y="334" font-size="14">能合成內容，也可能用來分類</text>
    <rect x="16" y="371" width="328" height="79" rx="8" fill="#fff1db" stroke="#9c6a1d"/>
    <text x="29" y="397" font-size="16" font-weight="700">組合：生成表示 → 分類器</text>
    <text x="29" y="426" font-size="14">表示的來源與下游目標分開判讀</text>
    <text x="18" y="470" font-size="12">教學示意｜兩條路徑是選項，沒有先後順序</text>
  </g>
</svg>
