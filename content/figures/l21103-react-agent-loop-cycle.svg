<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 646" role="img" aria-labelledby="title desc"><title id="title">ReAct 查證與停止迴圈</title><desc id="desc">簡短依據安排工具行動，實際觀察經查核後決定完成、修正或交人工。修正回到決策節點，且受呼叫預算限制。 圖資為教學示意。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#355d82"/></marker></defs><style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#16304a;font-size:16px} .small{font-size:14px} .box{fill:#eef5fc;stroke:#355d82;stroke-width:1.5} .gate{fill:#fff4d6;stroke:#8d640a;stroke-width:1.5} .end{fill:#eaf5ee;stroke:#32744b;stroke-width:1.5} .human{fill:#fceee9;stroke:#9a4c32;stroke-width:1.5} .arrow{fill:none;stroke:#355d82;stroke-width:2;marker-end:url(#arrow)}</style><rect width="360" height="646" fill="#fff"/><rect x="55" y="15" width="250" height="54" rx="9" class="box"/><text x="180" y="47" text-anchor="middle">簡短依據：還缺什麼資訊</text><path d="M180 69 V91" class="arrow"/><rect x="55" y="93" width="250" height="54" rx="9" class="box"/><text x="180" y="125" text-anchor="middle">行動：工具與具體輸入</text><path d="M180 147 V169" class="arrow"/><rect x="55" y="171" width="250" height="54" rx="9" class="box"/><text x="180" y="203" text-anchor="middle">觀察：回傳值或錯誤</text><path d="M180 225 V247" class="arrow"/><rect x="55" y="249" width="250" height="65" rx="9" class="gate"/><text x="180" y="275.5" text-anchor="middle">查核來源、對象及日期</text><text x="180" y="297.5" text-anchor="middle">有效且欄位完整？</text><path d="M180 314 V349" class="arrow"/><text class="small" x="190" y="338">是</text><rect x="55" y="351" width="250" height="44" rx="9" class="end"/><text x="180" y="378" text-anchor="middle">完成：依證據回覆</text><path d="M305 282 H334 V436 H305" class="arrow"/><text class="small" x="311" y="407">否</text><rect x="55" y="438" width="250" height="65" rx="9" class="gate"/><text x="180" y="464.5" text-anchor="middle">可修正且仍有預算？</text><text x="180" y="486.5" text-anchor="middle">本例每代理最多呼叫兩次</text><path d="M55 471 H25 V42 H55" class="arrow"/><text class="small" x="29" y="422">是：修正查詢</text><path d="M180 503 V550" class="arrow"/><text class="small" x="190" y="535">否</text><rect x="55" y="552" width="250" height="65" rx="9" class="human"/><text x="180" y="578.5" text-anchor="middle">停止並交人工</text><text x="180" y="600.5" text-anchor="middle">附上失敗與缺漏證據</text></svg>
