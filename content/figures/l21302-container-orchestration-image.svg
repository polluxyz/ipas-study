<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 510" role="img" aria-labelledby="title desc"><title id="title">從映像封裝到多副本部署</title><desc id="desc">Docker 建立映像，Kubernetes 將副本排程到節點並在故障後補建。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#31566b"/></marker></defs><rect width="360" height="510" fill="#ffffff"/><g fill="#16364b" font-family="sans-serif"><text x="180" y="27" text-anchor="middle" font-size="17">從映像封裝到多副本部署</text><rect x="65" y="48" width="230" height="64" rx="9" fill="#e8f2fa" stroke="#31566b"/><text x="180" y="71" text-anchor="middle" font-size="14">Docker：建構容器映像</text><text x="180" y="92" text-anchor="middle" font-size="14">程式＋套件＋載入規則</text><path d="M180 112 V146" fill="none" stroke="#31566b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="150" width="230" height="64" rx="9" fill="#e8f2fa" stroke="#31566b"/><text x="180" y="173" text-anchor="middle" font-size="14">Kubernetes：宣告與編排</text><text x="180" y="194" text-anchor="middle" font-size="14">排程、目標副本與恢復</text><path d="M180 214 V238 H92 V264" fill="none" stroke="#31566b" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 238 H268 V264" fill="none" stroke="#31566b" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="268" width="148" height="82" rx="9" fill="#e8f2fa" stroke="#31566b"/><text x="92" y="291" text-anchor="middle" font-size="14">節點甲</text><text x="92" y="312" text-anchor="middle" font-size="14">Pod：推論容器</text><rect x="194" y="268" width="148" height="82" rx="9" fill="#e8f2fa" stroke="#31566b"/><text x="268" y="291" text-anchor="middle" font-size="14">節點乙</text><text x="268" y="312" text-anchor="middle" font-size="14">Pod：推論容器</text><text x="180" y="380" text-anchor="middle" font-size="14">故障副本退出 → 控制器補建</text><path d="M180 391 V413" fill="none" stroke="#31566b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="418" width="230" height="52" rx="9" fill="#e8f2fa" stroke="#31566b"/><text x="180" y="441" text-anchor="middle" font-size="14">新副本就緒後才接流量</text><text x="180" y="498" text-anchor="middle" font-size="12">教學合成示意；箭頭表示控制或請求方向</text></g></svg>