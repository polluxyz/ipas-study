<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 690" role="img" aria-labelledby="title desc"><title id="title">同八筆資料，框內算一次平均</title><desc id="desc">每個框是一批，框後更新一次。資料索引固定1到8，不洗牌；依序讀完各框才算一輪。</desc><rect width="480" height="690" fill="#fff"/><g fill="#172331" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif"><text x="20" y="34" font-size="24" text-anchor="start">同八筆資料，框內算一次平均</text><text x="20" y="66" font-size="20" text-anchor="start">索引1–8；目標值依序為−1、+1交替</text><text x="20" y="105" font-size="23" text-anchor="start">全批：1次更新</text><rect x="22" y="120" width="320" height="48" rx="5" fill="#e4f1f8" stroke="#08628c" stroke-width="2"/><text x="46" y="152" font-size="22" text-anchor="middle">1</text><text x="85" y="152" font-size="22" text-anchor="middle">2</text><text x="124" y="152" font-size="22" text-anchor="middle">3</text><text x="163" y="152" font-size="22" text-anchor="middle">4</text><text x="202" y="152" font-size="22" text-anchor="middle">5</text><text x="241" y="152" font-size="22" text-anchor="middle">6</text><text x="280" y="152" font-size="22" text-anchor="middle">7</text><text x="319" y="152" font-size="22" text-anchor="middle">8</text><text x="20" y="241" font-size="23" text-anchor="start">單筆：8次更新</text><rect x="22" y="256" width="47" height="48" rx="5" fill="#e4f1f8" stroke="#08628c" stroke-width="2"/><text x="46" y="288" font-size="22" text-anchor="middle">1</text><rect x="75" y="256" width="47" height="48" rx="5" fill="#e4f1f8" stroke="#08628c" stroke-width="2"/><text x="99" y="288" font-size="22" text-anchor="middle">2</text><rect x="128" y="256" width="47" height="48" rx="5" fill="#e4f1f8" stroke="#08628c" stroke-width="2"/><text x="152" y="288" font-size="22" text-anchor="middle">3</text><rect x="181" y="256" width="47" height="48" rx="5" fill="#e4f1f8" stroke="#08628c" stroke-width="2"/><text x="205" y="288" font-size="22" text-anchor="middle">4</text><rect x="234" y="256" width="47" height="48" rx="5" fill="#e4f1f8" stroke="#08628c" stroke-width="2"/><text x="258" y="288" font-size="22" text-anchor="middle">5</text><rect x="287" y="256" width="47" height="48" rx="5" fill="#e4f1f8" stroke="#08628c" stroke-width="2"/><text x="311" y="288" font-size="22" text-anchor="middle">6</text><rect x="340" y="256" width="47" height="48" rx="5" fill="#e4f1f8" stroke="#08628c" stroke-width="2"/><text x="364" y="288" font-size="22" text-anchor="middle">7</text><rect x="393" y="256" width="47" height="48" rx="5" fill="#e4f1f8" stroke="#08628c" stroke-width="2"/><text x="417" y="288" font-size="22" text-anchor="middle">8</text><text x="20" y="377" font-size="23" text-anchor="start">小批保留尾批：3次更新</text><rect x="22" y="392" width="125" height="48" rx="5" fill="#e4f1f8" stroke="#08628c" stroke-width="2"/><text x="46" y="424" font-size="22" text-anchor="middle">1</text><text x="85" y="424" font-size="22" text-anchor="middle">2</text><text x="124" y="424" font-size="22" text-anchor="middle">3</text><rect x="153" y="392" width="125" height="48" rx="5" fill="#e4f1f8" stroke="#08628c" stroke-width="2"/><text x="177" y="424" font-size="22" text-anchor="middle">4</text><text x="216" y="424" font-size="22" text-anchor="middle">5</text><text x="255" y="424" font-size="22" text-anchor="middle">6</text><rect x="284" y="392" width="86" height="48" rx="5" fill="#e4f1f8" stroke="#08628c" stroke-width="2"/><text x="308" y="424" font-size="22" text-anchor="middle">7</text><text x="347" y="424" font-size="22" text-anchor="middle">8</text><text x="20" y="513" font-size="23" text-anchor="start">小批捨棄尾批：2次更新</text><rect x="22" y="528" width="125" height="48" rx="5" fill="#e4f1f8" stroke="#08628c" stroke-width="2"/><text x="46" y="560" font-size="22" text-anchor="middle">1</text><text x="85" y="560" font-size="22" text-anchor="middle">2</text><text x="124" y="560" font-size="22" text-anchor="middle">3</text><rect x="153" y="528" width="125" height="48" rx="5" fill="#e4f1f8" stroke="#08628c" stroke-width="2"/><text x="177" y="560" font-size="22" text-anchor="middle">4</text><text x="216" y="560" font-size="22" text-anchor="middle">5</text><text x="255" y="560" font-size="22" text-anchor="middle">6</text><text x="288" y="560" font-size="20" text-anchor="start">7、8略過</text><text x="20" y="672" font-size="17" text-anchor="start">教學合成資料｜固定列序與尾批取捨</text></g></svg>
