<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 525" role="img" aria-labelledby="t d"><title id="t">訓練和評估的兩條流程</title><desc id="d">24個訓練來源可產生48次輸入，但4張驗證及4張測試維持固定前處理。</desc><rect width="360" height="525" fill="#fff"/><g fill="#172033" font-family="Microsoft JhengHei, sans-serif"><text x="12" y="25" font-size="17">先按原始物件切分，再做增強</text><rect x="20" y="45" width="320" height="62" rx="6" fill="#e2e8f0"/><text x="32" y="70" font-size="15">每域16張原始影像</text><text x="32" y="93" font-size="13">同來源的所有變體繼承同一 split</text><text x="170" y="132" font-size="22">↓</text><rect x="20" y="145" width="320" height="62" rx="6" fill="#e2e8f0"/><text x="32" y="170" font-size="15">訓練：每域索引0–11，共24張</text><text x="32" y="193" font-size="13">隨機增強 → 固定尺寸 / 像素轉換</text><text x="170" y="232" font-size="22">↓</text><rect x="20" y="245" width="320" height="62" rx="6" fill="#e2e8f0"/><text x="32" y="270" font-size="15">原圖加每張1個變體：48次輸入</text><text x="32" y="293" font-size="13">原始來源仍為24個，不是48個新物件</text><rect x="20" y="335" width="320" height="62" rx="6" fill="#e2e8f0"/><text x="32" y="360" font-size="15">驗證：每域索引12–13，共4張</text><text x="32" y="383" font-size="13">固定尺寸 / 像素轉換；不隨機增強</text><rect x="20" y="425" width="320" height="62" rx="6" fill="#e2e8f0"/><text x="32" y="450" font-size="15">測試：每域索引14–15，共4張</text><text x="32" y="473" font-size="13">鎖定設定後評估；不拿來挑增強</text><text x="12" y="515" font-size="11">教學合成資料；由共用JSON計算</text></g></svg>
