<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img"><title>固定模型四期效能</title><desc>由同一份摘要依固定閾值計算，各期都需完整真值；連線只表比較順序</desc><rect width="360" height="360" fill="#fff"/><g font-family="sans-serif" font-size="15" fill="#172554"><text x="14" y="25" >固定 v1 模型｜準確率（%）</text><path d="M48 250H325" stroke="#cbd5e1"/><text x="12" y="255" >0</text><path d="M48 155H325" stroke="#cbd5e1"/><text x="12" y="160" >50</text><path d="M48 60H325" stroke="#cbd5e1"/><text x="12" y="65" >100</text><polyline points="48,79 138,79 228,136 318,136" fill="none" stroke="#2563eb" stroke-width="3"/><circle cx="48" cy="79" r="5" fill="#2563eb"/><text x="48" y="103" text-anchor="middle">90%</text><text x="48" y="275" text-anchor="middle">P0</text><circle cx="138" cy="79" r="5" fill="#2563eb"/><text x="138" y="103" text-anchor="middle">90%</text><text x="138" y="275" text-anchor="middle">P1</text><circle cx="228" cy="136" r="5" fill="#2563eb"/><text x="228" y="121" text-anchor="middle">60%</text><text x="228" y="275" text-anchor="middle">P2</text><circle cx="318" cy="136" r="5" fill="#2563eb"/><text x="318" y="121" text-anchor="middle">60%</text><text x="318" y="275" text-anchor="middle">P3</text><text x="14" y="310" >P0→P1：輸入移動，準確率仍相同。</text><text x="14" y="338" >P0→P2：參數不變，準確率卻衰退。</text></g></svg>
