<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 595" width="360" height="595" role="img" aria-labelledby="title desc"><title id="title">轉寫評估與時間端點</title><desc id="desc">補充示意：參考文字與 TTS 經固定 ASR 的轉寫對齊計數；延遲的請求、首段音訊、完整音訊三個端點不能混用。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#3a506b"/></marker></defs><rect width="360" height="595" fill="#fff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="180" y="27" font-size="17" fill="#172033" text-anchor="middle">WER：先釐清轉寫鏈（補充）</text><rect x="18" y="44" width="324" height="64" rx="8" fill="#edf4ff" stroke="#53657e"/><text x="180" y="69" font-size="15" fill="#172033" text-anchor="middle">參考稿本 → TTS → 固定 ASR</text><text x="180" y="92" font-size="15" fill="#172033" text-anchor="middle">參考文字 ↔ ASR 轉寫對齊</text><path d="M180 109V130" fill="none" stroke="#3a506b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="18" y="135" width="324" height="87" rx="8" fill="#edf4ff" stroke="#53657e"/><text x="180" y="160" font-size="15" fill="#172033" text-anchor="middle">九點 → 十點：替換 S</text><text x="180" y="183" font-size="15" fill="#172033" text-anchor="middle">堂 → 空白：刪除 D</text><text x="180" y="206" font-size="15" fill="#172033" text-anchor="middle">空白 → 謝謝：插入 I</text><text x="180" y="266" font-size="14" fill="#172033" text-anchor="middle">E01：參考 10 詞，最少編輯 3 次</text><text x="180" y="310" font-size="17" fill="#172033" text-anchor="middle">延遲：同一用戶端時鐘（補充）</text><rect x="18" y="328" width="324" height="41" rx="8" fill="#edf4ff" stroke="#53657e"/><text x="180" y="353" font-size="15" fill="#172033" text-anchor="middle">t₀：送出合成請求</text><path d="M180 370V391" fill="none" stroke="#3a506b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="18" y="396" width="324" height="64" rx="8" fill="#edf4ff" stroke="#53657e"/><text x="180" y="421" font-size="15" fill="#172033" text-anchor="middle">t首段：收到可播放音訊</text><text x="180" y="444" font-size="15" fill="#172033" text-anchor="middle">t首段 − t₀：首段延遲</text><path d="M180 461V482" fill="none" stroke="#3a506b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="18" y="487" width="324" height="64" rx="8" fill="#eef8ed" stroke="#53657e"/><text x="180" y="512" font-size="15" fill="#172033" text-anchor="middle">t完整：收到全部音訊</text><text x="180" y="535" font-size="15" fill="#172033" text-anchor="middle">t完整 − t₀：完成延遲</text><text x="180" y="578" font-size="14" fill="#172033" text-anchor="middle">首位元組抵達不一定已可播放</text></g></svg>
