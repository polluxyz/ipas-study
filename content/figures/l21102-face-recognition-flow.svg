<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 354" role="img" aria-labelledby="title desc"><title id="title">人臉框不是身分</title><desc id="desc">偵測：找人臉區域：輸出框與偵測信心；特徵：裁切、對齊與擷取：輸出供比較的人臉表示；比對：與登錄特徵比較：輸出相似度、候選身分或未確認；教學合成資料</desc><rect width="360" height="354" fill="#fff"/><g font-family="sans-serif"><text x="16" y="26" font-size="19" fill="#17243b">人臉框不是身分</text><rect x="16" y="44" width="328" height="62" rx="8" fill="#eef4fa" stroke="#456783"/><text x="28" y="69" font-size="17" fill="#17243b">偵測：找人臉區域</text><text x="28" y="92" font-size="15" fill="#17243b">輸出框與偵測信心</text><text x="171" y="126" font-size="20" fill="#17243b">↓</text><rect x="16" y="132" width="328" height="62" rx="8" fill="#eef4fa" stroke="#456783"/><text x="28" y="157" font-size="17" fill="#17243b">特徵：裁切、對齊與擷取</text><text x="28" y="180" font-size="15" fill="#17243b">輸出供比較的人臉表示</text><text x="171" y="214" font-size="20" fill="#17243b">↓</text><rect x="16" y="220" width="328" height="62" rx="8" fill="#eef4fa" stroke="#456783"/><text x="28" y="245" font-size="17" fill="#17243b">比對：與登錄特徵比較</text><text x="28" y="268" font-size="15" fill="#17243b">輸出相似度、候選身分或未確認</text><text x="16" y="324" font-size="14" fill="#17243b">需覆核的事件在身分採用前攔下</text></g></svg>
