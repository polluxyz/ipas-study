<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 536" role="img" aria-labelledby="title desc"><title id="title">醫療 AI 適用性查核</title><desc id="desc">依序描述預期用途，檢查錯誤風險，向官方確認器材屬性與分類，最後查品質及上市要求，疑義留待主管機關確認。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="360" height="536" rx="12" fill="#f8fafc"/><g font-family="system-ui, 'Microsoft JhengHei', sans-serif" fill="#0f172a"><text x="180" y="30" text-anchor="middle" font-size="18" font-weight="700">醫療 AI 適用性查核</text><rect x="18" y="50" width="324" height="78" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="180" y="79" font-size="18" font-weight="700" text-anchor="middle">描述預期用途</text><text x="180" y="107" font-size="16" text-anchor="middle">誰使用、對臨床有何作用</text><path d="M180 130V153" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="18" y="163" width="324" height="78" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="180" y="192" font-size="18" font-weight="700" text-anchor="middle">檢查錯誤風險</text><text x="180" y="220" font-size="16" text-anchor="middle">漏判、誤判與使用限制</text><path d="M180 243V266" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="18" y="276" width="324" height="78" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="180" y="305" font-size="18" font-weight="700" text-anchor="middle">確認醫材適用範圍</text><text x="180" y="333" font-size="16" text-anchor="middle">屬性及分類有疑義就查詢</text><path d="M180 356V379" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="18" y="389" width="324" height="78" rx="9" fill="#fef3c7" stroke="#475569"/><text x="180" y="418" font-size="18" font-weight="700" text-anchor="middle">核對品質及上市要求</text><text x="180" y="446" font-size="16" text-anchor="middle">證據、版本與許可範圍</text><text x="180" y="506" text-anchor="middle" font-size="16">教學示意｜個案結論須另行查核</text></g></svg>
