<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 315" role="img"><title>獨立詞位與共享維度</title><desc>上方兩個六維 one-hot 分別表示訂與改，下方兩個三維手設向量使用共享座標。數值僅示意，不代表訓練成果。</desc><rect width="360" height="315" fill="white"/><g font-family="sans-serif" font-size="17" fill="#172b4d"><text x="15" y="28">獨立詞位：訂、改、票、書、book、books</text><rect x="13" y="44" width="334" height="95" rx="6" fill="#eef3f9"/><text x="25" y="79">訂  (1, 0, 0, 0, 0, 0)</text><text x="25" y="115">改  (0, 1, 0, 0, 0, 0)</text><text x="15" y="174">共享維度：每詞共同使用三個位置</text><rect x="13" y="187" width="334" height="86" rx="6" fill="#d9e9ff"/><text x="25" y="219">訂  (1, 0.2, 0.1)</text><text x="25" y="253">改  (0.9, 0.3, 0.1)</text><text x="15" y="300" font-size="15">手設示意；稠密本身不保證語意品質。</text></g></svg>
