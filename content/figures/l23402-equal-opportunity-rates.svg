<g font-family="sans-serif" fill="#0f172a" font-size="17"><text x="18" y="30" font-size="21" font-weight="bold">機會平等：先看真實正例</text><text x="18" y="62" font-weight="bold">真實正例中的選取率（TPR）</text><text x="18" y="92">A：80%（8/10）</text><rect x="18" y="102" width="300" height="18" rx="3" fill="#e2e8f0"/><rect x="18" y="102" width="240" height="18" rx="3" fill="#0369a1"/><text x="18" y="151">B：80%（8/10）</text><rect x="18" y="161" width="300" height="18" rx="3" fill="#e2e8f0"/><rect x="18" y="161" width="240" height="18" rx="3" fill="#b45309"/><text x="18" y="210" font-size="14">0%</text><text x="155" y="210" font-size="14">50%</text><text x="282" y="210" font-size="14">100%</text><text x="18" y="247" font-size="14">教學合成：每群20人，固定稽核集</text></g></svg>
