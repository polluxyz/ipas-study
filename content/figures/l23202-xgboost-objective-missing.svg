<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 390" role="img" aria-labelledby="title desc"><title id="title">XGBoost目標與缺值路徑</title><desc id="desc">教學示意：擬合改善與複雜度共同決定新樹；同一節點的缺值走向由訓練學得。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#374151"/></marker></defs><rect width="360" height="390" fill="#fff"/><g font-family="sans-serif" fill="#152a43"><text x="180" y="25" text-anchor="middle" font-size="17">新樹要同時考量兩件事</text><rect x="15" y="45" width="155" height="65" rx="8" fill="#e5efff" stroke="#265c9e"/><text x="92.5" y="68" text-anchor="middle" font-size="15">損失改善</text><text x="92.5" y="90" text-anchor="middle" font-size="15">一階、二階資訊</text><rect x="190" y="45" width="155" height="65" rx="8" fill="#e5efff" stroke="#265c9e"/><text x="267.5" y="68" text-anchor="middle" font-size="15">複雜度控制</text><text x="267.5" y="90" text-anchor="middle" font-size="15">葉數、葉權重</text><path d="M90 110 L180 145" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><path d="M270 110 L180 145" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><rect x="85" y="152" width="190" height="45" rx="8" fill="#e5efff" stroke="#265c9e"/><text x="180" y="175" text-anchor="middle" font-size="15">收入低於閾值？</text><path d="M180 197 L80 255" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><path d="M180 197 L280 255" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><text x="78" y="233" text-anchor="middle" font-size="14">一般左支</text><text x="283" y="233" text-anchor="middle" font-size="14">一般右支</text><rect x="25" y="265" width="110" height="45" rx="8" fill="#e5efff" stroke="#265c9e"/><text x="80" y="288" text-anchor="middle" font-size="15">左側葉</text><rect x="225" y="265" width="110" height="45" rx="8" fill="#e5efff" stroke="#265c9e"/><text x="280" y="288" text-anchor="middle" font-size="15">右側葉</text><path d="M275 174 H345 V330 H280 V312" fill="none" stroke="#8a4a00" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="315" y="163" text-anchor="middle" font-size="14">缺值</text><text x="180" y="356" text-anchor="middle" font-size="16">本節點示意：缺值學得走右</text><text x="180" y="380" text-anchor="middle" font-size="15">別的節點可能學得走左</text></g></svg>
