<svg xmlns="http://www.w3.org/2000/svg" width="360" height="580" viewBox="0 0 360 580" role="img" aria-labelledby="title desc"><title id="title">同一卷積，不同分類頭</title><desc id="desc">上方為含池化的主模型；虛線後為比較用的無池化替代路徑，不是接續執行的下一層。所有維度、參數與 MAC 由共享 JSON 計算。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L7 3 Z" fill="#475569"/></marker></defs><rect width="360" height="580" fill="#fff"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" fill="#0f172a"><text x="16" y="28" font-size="18" text-anchor="start">同一卷積，不同分類頭</text><rect x="32" y="60" width="296" height="58" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="180" y="83" font-size="16" text-anchor="middle">輸入 8×8×3</text><text x="180" y="105" font-size="14" text-anchor="middle">兩個領域共用規格</text><path d="M180 118 L180 142" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="32" y="145" width="296" height="58" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="180" y="168" font-size="16" text-anchor="middle">卷積 6×6×2</text><text x="180" y="190" font-size="14" text-anchor="middle">56 個共享參數</text><path d="M180 203 L180 228" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="32" y="232" width="296" height="58" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="180" y="255" font-size="16" text-anchor="middle">路徑一：池化 3×3×2</text><text x="180" y="277" font-size="14" text-anchor="middle">展平 18 維 → 二類頭</text><text x="180" y="320" font-size="16" text-anchor="middle">Dense 參數 38，MAC 36</text><path d="M32 174 H16 V397 H30" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="32" y="368" width="296" height="58" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="180" y="391" font-size="16" text-anchor="middle">替代路徑二：跳過池化</text><text x="180" y="413" font-size="14" text-anchor="middle">展平 72 維 → 二類頭</text><text x="180" y="456" font-size="16" text-anchor="middle">Dense 參數 146，MAC 144</text><text x="180" y="504" font-size="15" text-anchor="middle">兩路徑的卷積形狀與參數相同</text><text x="180" y="532" font-size="15" text-anchor="middle">跳過池化會增加分類頭輸入長度</text><text x="16" y="566" font-size="12" text-anchor="start">來源：教學合成資料</text></g></svg>
