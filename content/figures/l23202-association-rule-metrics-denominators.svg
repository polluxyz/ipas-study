<svg xmlns="http://www.w3.org/2000/svg" width="360" height="370" viewBox="0 0 360 370" role="img" aria-labelledby="title desc"><title id="title">同一交易表，三種分母</title><desc id="desc">三指標均以同一共同出現筆數為基礎，支持度除全部交易，信賴度除前件數，提升度再除後件基準。</desc><rect width="360" height="370" fill="#fff"/><g fill="#16283a" font-family="sans-serif"><text x="180" y="27" font-size="17" text-anchor="middle">同一交易表，三種分母</text><rect x="45" y="48" width="270" height="40" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="73" font-size="15" text-anchor="middle">A有5筆；B有7筆；AB有4筆</text><text x="180" y="125" font-size="16" text-anchor="middle">支持度</text><rect x="25" y="139" width="310" height="36" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="162" font-size="15" text-anchor="middle">4 ÷ 全部10 = 0.4</text><text x="180" y="199" font-size="16" text-anchor="middle">信賴度 A⇒B</text><rect x="25" y="213" width="310" height="36" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="236" font-size="15" text-anchor="middle">4 ÷ 前件5 = 0.8</text><text x="180" y="273" font-size="16" text-anchor="middle">提升度 A⇒B</text><rect x="25" y="287" width="310" height="36" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="310" font-size="15" text-anchor="middle">0.8 ÷ 後件基準0.7 ≈ 1.1429</text><text x="180" y="357" font-size="12" text-anchor="middle">教學合成資料／流程示意</text></g></svg>
