<svg xmlns="http://www.w3.org/2000/svg" width="360" height="534" viewBox="0 0 360 534" role="img" aria-labelledby="title desc">
  <title id="title">生成內容的交付形式與模態路徑</title>
  <desc id="desc">文字到文字可產生摘要，文字到圖像可產生概念圖，文字到音訊可產生語音或音樂，分鏡到影片可產生連續影格。圖像與文字也可共同輸入再輸出文字或圖文；多模態與前四類可重疊。作者繪製教學示意圖，非實測資料。</desc>
  <rect width="360" height="534" rx="12" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif" fill="#172b46">
    <text x="18" y="29" font-size="18" font-weight="700">輸入條件 → 生成模組 → 交付</text>
    <text x="18" y="53" font-size="14">分類先看交付，再記下完整模態路徑</text>
    <rect x="14" y="71" width="332" height="70" rx="8" fill="#e1efff" stroke="#326aa3"/>
    <text x="27" y="97" font-size="17" font-weight="700">文字 → 文字</text>
    <text x="27" y="122" font-size="14">條款或會議紀錄 → 草稿、摘要</text>
    <rect x="14" y="153" width="332" height="70" rx="8" fill="#e1f4ed" stroke="#27785c"/>
    <text x="27" y="179" font-size="17" font-weight="700">文字 → 圖像</text>
    <text x="27" y="204" font-size="14">外觀與結構限制 → 新概念圖</text>
    <rect x="14" y="235" width="332" height="70" rx="8" fill="#fff1db" stroke="#9c6a1d"/>
    <text x="27" y="261" font-size="17" font-weight="700">文字 → 音訊</text>
    <text x="27" y="286" font-size="14">朗讀文字或音樂條件 → 聲音波形</text>
    <rect x="14" y="317" width="332" height="70" rx="8" fill="#f0e9ff" stroke="#77549e"/>
    <text x="27" y="343" font-size="17" font-weight="700">分鏡 → 影片</text>
    <text x="27" y="368" font-size="14">內容及時序條件 → 連續影格</text>
    <rect x="14" y="405" width="332" height="99" rx="8" fill="#e8edf4" stroke="#64748b" stroke-dasharray="5 3"/>
    <text x="27" y="431" font-size="17" font-weight="700">多模態路徑：可與上列重疊</text>
    <text x="27" y="458" font-size="15">圖像＋文字 → 新文字或圖文</text>
    <text x="27" y="484" font-size="14">多種輸入，不保證所有模態都能輸出</text>
    <text x="18" y="525" font-size="12">教學示意｜檢索既有圖像並非合成新圖</text>
  </g>
</svg>
