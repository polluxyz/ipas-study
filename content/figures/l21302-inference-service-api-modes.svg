<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 554" role="img" aria-labelledby="title desc"><title id="title">三種介接互動</title><desc id="desc">REST 與 gRPC 可一問一答，gRPC 也可雙向串流；Webhook 在事件完成後另發通知。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#285177"/></marker></defs><rect width="360" height="554" fill="white"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="16" fill="#172d43"><text x="180" y="30" text-anchor="middle" font-weight="700">三種介接互動</text><text x="180" y="50" text-anchor="middle" font-size="12">示意圖</text><text x="180" y="70" text-anchor="middle" font-weight="700">REST：請求與回應</text><rect x="30" y="90" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="114" text-anchor="middle"><tspan x="180" dy="0">App → POST 請求 → API</tspan><tspan x="180" dy="22">API → JSON 結果 → App</tspan></text><text x="180" y="192" text-anchor="middle" font-weight="700">gRPC：遠端方法</text><rect x="30" y="212" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="236" text-anchor="middle"><tspan x="180" dy="0">內部服務 → 型別化方法 → 模型</tspan><tspan x="180" dy="22">可一問一答，也可雙向串流（補充）</tspan></text><text x="180" y="314" text-anchor="middle" font-weight="700">Webhook：完成後通知</text><rect x="30" y="334" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="358" text-anchor="middle"><tspan x="180" dy="0">先提交檢驗工作</tspan><tspan x="180" dy="22">取得工作 ID</tspan></text><path d="M180 394 v22" stroke="#285177" fill="none" marker-end="url(#arrow)"/><rect x="30" y="420" width="300" height="58" rx="8" fill="#eef5fc" stroke="#285177"/><text x="180" y="444" text-anchor="middle"><tspan x="180" dy="0">工作完成 → 回呼接收端</tspan><tspan x="180" dy="22">另一次 HTTP 請求送事件</tspan></text><text x="180" y="502" text-anchor="middle" font-size="14">Webhook 是事件通知，不等於雙向長連線</text></g></svg>
