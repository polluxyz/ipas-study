<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 545" role="img" aria-labelledby="title desc">
<title id="title">同欄位的三種缺失原因</title><desc id="desc">三種機制是資料生成假設；缺失指標只記錄結果，不足以辨認原因。</desc>
<rect width="360" height="545" fill="#f8fafc"/>
<g font-family="sans-serif" font-size="15" fill="#0f172a"><rect x="15" y="12" width="330" height="51" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="28" y="39">先問：哪個因素決定是否缺值？</text><rect x="15" y="100" width="330" height="74" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="28" y="127">MCAR：獨立隨機抽樣 → 缺值</text><text x="28" y="150">不依賴已觀測或未觀測值</text><rect x="15" y="211" width="330" height="74" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="28" y="238">MAR：已記錄維護時段 → 缺值</text><text x="28" y="261">給定已觀測資訊後，不再依賴真值</text><rect x="15" y="322" width="330" height="74" rx="8" fill="#e0f2fe" stroke="#64748b"/><text x="28" y="349">MNAR：未量到的高溫真值 → 缺值</text><text x="28" y="372">給定已觀測資訊後，仍依賴未觀測值</text><rect x="15" y="433" width="330" height="74" rx="8" fill="#fef3c7" stroke="#64748b"/><text x="28" y="460">缺失指標：缺值=1；原有值=0</text><text x="28" y="483">保留缺失訊號，不能證明機制</text></g></svg>