<svg xmlns="http://www.w3.org/2000/svg" width="390" height="920" viewBox="0 0 390 920" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">前處理的資料邊界</title><desc id="desc">錯誤流程先用全部資料與標籤選特徵，驗證標籤已影響特徵清單。正確流程先切摺，只在訓練資料擬合特徵選擇與分類器；驗證資料仍會套用訓練學得的同一轉換，再預測與評分。</desc>
<style>
:root{color-scheme:light dark;--bg:#f9fbf9;--ink:#263a45;--muted:#465b66;--train:#006b66;--train-bg:#edf5f4;--val:#9a3c00;--val-bg:#fff0e3;--test:#504ca2;--test-bg:#efedff;--rule:#a5b8bd;--bad:#a33036;--bad-bg:#fff1f0}
@media(prefers-color-scheme:dark){:root{--bg:#15252b;--ink:#e4edf1;--muted:#bbcbd2;--train:#78ded2;--train-bg:#24373d;--val:#ffbf86;--val-bg:#3a2e25;--test:#c7bcff;--test-bg:#363048;--rule:#71868c;--bad:#ffaaa9;--bad-bg:#3d272b}}
text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:var(--ink);font-size:14px}.title{font-size:22px;font-weight:700}.heading{font-size:17px;font-weight:700}.strong{font-weight:700}.note{font-size:13px;fill:var(--muted)}.small{font-size:12px}.code{font-family:Consolas,monospace;font-size:13px}.bg{fill:var(--bg)}.box{fill:var(--bg);stroke:var(--rule);stroke-width:1.3}.train{fill:var(--train-bg);stroke:var(--train);stroke-width:1.4}.val{fill:url(#hatch);stroke:var(--val);stroke-width:1.4;stroke-dasharray:4 2}.test{fill:var(--test-bg);stroke:var(--test);stroke-width:1.5;stroke-dasharray:1 3}.badbox{fill:var(--bad-bg);stroke:var(--bad);stroke-width:1.4}.badtext{fill:var(--bad);font-weight:700}.hb{fill:var(--val-bg)}.hl{stroke:var(--val);stroke-width:1;opacity:.23}.line{stroke:var(--muted);stroke-width:1.4;fill:none;marker-end:url(#arrow)}.learn{stroke:var(--train);stroke-width:1.4;stroke-dasharray:4 3;fill:none;marker-end:url(#learn-arrow)}.leak{stroke:var(--bad);stroke-width:1.6;stroke-dasharray:4 3;fill:none;marker-end:url(#bad-arrow)}.rule{stroke:var(--rule);fill:none}.boundary{fill:none;stroke:var(--train);stroke-width:1.4;stroke-dasharray:5 3}.unused{fill:var(--bg);stroke:var(--rule);stroke-width:1}.cell{font-size:12px;font-weight:700}
</style><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect class="hb" width="8" height="8"/><path class="hl" d="M0 8L8 0"/></pattern><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--muted)"/></marker><marker id="learn-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--train)"/></marker><marker id="bad-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--bad)"/></marker></defs>
<rect class="bg" width="390" height="920" rx="12"/>
<text x="18" y="35" class="title" text-anchor="start">前處理的資料邊界</text><text x="18" y="59" class="note" text-anchor="start">教學示意：追蹤哪些資訊參與 fit</text><text x="18" y="92" class="heading badtext" text-anchor="start">× 錯誤：選特徵後才切摺</text><rect x="40" y="109" width="296" height="43" rx="5" class="badbox"/><text x="188" y="136" class="strong" text-anchor="middle">全部資料與標籤</text><path d="M188 152V170" class="line"/><rect x="40" y="173" width="296" height="51" rx="5" class="badbox"/><text x="188" y="194" class="strong" text-anchor="middle">選特徵</text><text x="188" y="213" class="code" text-anchor="middle">fit_transform(X, y)</text><path d="M188 224V242" class="line"/><rect x="40" y="245" width="296" height="42" rx="5" class="box"/><text x="188" y="271" class="strong" text-anchor="middle">切摺</text><path d="M188 287V305" class="line"/><rect x="40" y="308" width="296" height="42" rx="5" class="box"/><text x="188" y="334" class="strong" text-anchor="middle">訓練分類器／驗證</text><path d="M336 329H362V198H338" class="leak"/><text x="40" y="377" class="badtext" text-anchor="start">洩漏：驗證標籤已影響特徵清單</text><path d="M18 396H372" class="rule"/><text x="18" y="426" class="heading" text-anchor="start">✓ 正確：先切摺，再學規則</text><rect x="118" y="443" width="154" height="40" rx="5" class="box"/><text x="195" y="469" class="strong" text-anchor="middle">先切摺</text><path d="M158 483V498H99V516" class="line"/><path d="M232 483V498H291V516" class="line"/><rect x="20" y="519" width="158" height="43" rx="5" class="train"/><text x="99" y="546" class="strong" text-anchor="middle">訓練資料</text><rect x="212" y="519" width="158" height="43" rx="5" class="val"/><text x="291" y="546" class="strong" text-anchor="middle">驗證資料</text><path d="M99 562V581" class="line"/><path d="M291 562V654" class="line"/><rect x="20" y="584" width="158" height="49" rx="5" class="train"/><text x="99" y="604" class="strong" text-anchor="middle">fit 特徵選擇</text><text x="99" y="623" class="small" text-anchor="middle">只學訓練的特徵清單</text><path d="M99 633V652" class="line"/><rect x="20" y="655" width="158" height="49" rx="5" class="train"/><text x="99" y="684" class="strong" text-anchor="middle">transform</text><rect x="212" y="655" width="158" height="49" rx="5" class="val"/><text x="291" y="675" class="strong" text-anchor="middle">只套用同一轉換</text><text x="291" y="694" class="code" text-anchor="middle">transform</text><path d="M178 607H195V642H291V653" class="learn"/><text x="216" y="635" class="small" text-anchor="start">沿用特徵清單</text><path d="M99 704V724" class="line"/><rect x="20" y="727" width="158" height="44" rx="5" class="train"/><text x="99" y="754" class="strong" text-anchor="middle">fit 分類器</text><path d="M291 704V724" class="line"/><rect x="212" y="727" width="158" height="44" rx="5" class="val"/><text x="291" y="754" class="strong" text-anchor="middle">預測 → 評分</text><path d="M178 750H210" class="learn"/><text x="219" y="796" class="small" text-anchor="start">沿用已訓練分類器</text><path d="M18 814H372" class="rule"/><text x="18" y="841" class="strong" text-anchor="start">fit 只能看訓練；驗證只 transform</text><text x="18" y="865" class="small" text-anchor="start">驗證資料仍須轉換，不能保留原始特徵直接評分。</text><text x="18" y="894" class="note" text-anchor="start">教學流程示意，非實測數據圖。</text>
</svg>
