<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="t d"><title id="t">向量長度與箭頭合成</title><desc id="d">教學合成座標。u=(3,4)、v=(1,2)，u+v=(4,6)，將 v 平移到 u 的末端可觀察合成。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#087f8c"/></marker></defs><rect width="360" height="320" fill="#fff"/><g font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#172b4d"><text x="16" y="25" font-size="16">u 的長度是 5；相加是箭頭接箭頭</text><line x1="50" y1="265" x2="320" y2="265" stroke="#a5afb9" stroke-width="1.5"  /><line x1="50" y1="280" x2="50" y2="40" stroke="#a5afb9" stroke-width="1.5"  /><text x="322" y="280" font-size="14">x</text><text x="14" y="43" font-size="14">y</text><line x1="50" y1="265" x2="158" y2="121" stroke="#087f8c" stroke-width="3"  marker-end="url(#arrow)"/><line x1="50" y1="265" x2="86" y2="193" stroke="#087f8c" stroke-width="3"  marker-end="url(#arrow)"/><line x1="158" y1="121" x2="194" y2="49" stroke="#087f8c" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="50" y1="265" x2="194" y2="49" stroke="#596b80" stroke-width="1.5" stroke-dasharray="4 4" /><text x="190" y="180" font-size="14">u=(3,4)</text><text x="95" y="235" font-size="14">v=(1,2)</text><text x="208" y="60" font-size="14">u+v=(4,6)</text><text x="176" y="113" font-size="14">平移後的 v</text><line x1="86" y1="261" x2="86" y2="269" stroke="#a5afb9" stroke-width="1.5"  /><text x="81" y="285" font-size="14">1</text><line x1="158" y1="261" x2="158" y2="269" stroke="#a5afb9" stroke-width="1.5"  /><text x="153" y="285" font-size="14">3</text><line x1="194" y1="261" x2="194" y2="269" stroke="#a5afb9" stroke-width="1.5"  /><text x="189" y="285" font-size="14">4</text><line x1="46" y1="121" x2="54" y2="121" stroke="#a5afb9" stroke-width="1.5"  /><text x="30" y="126" font-size="14">4</text><line x1="46" y1="49" x2="54" y2="49" stroke="#a5afb9" stroke-width="1.5"  /><text x="30" y="54" font-size="14">6</text><text x="15" y="310" font-size="14">座標無單位；虛線呈現平移與合成</text></g></svg>