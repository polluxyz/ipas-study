<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 390" role="img" aria-labelledby="title desc"><title id="title">核方法示意流程</title><desc id="desc">製造例子的兩個瑕疵區域不宜強迫用原座標的一條直線表示；這是示意圖，非已擬合的模型邊界。</desc><rect width="360" height="390" fill="#fff"/><g fill="#172c43" font-family="Arial,Microsoft JhengHei,sans-serif"><text x="15" y="28" font-size="17" >非線性關係用核函數比較</text><rect x="20" y="52" width="320" height="66" rx="8" fill="#eaf2fa" stroke="#172c43"/><text x="180" y="90" font-size="14" text-anchor="middle">原座標：低壓力 或 高振動 → 瑕疵</text><line x1="180" y1="118" x2="180" y2="158" stroke="#172c43" /><rect x="20" y="158" width="320" height="66" rx="8" fill="#eaf2fa" stroke="#172c43"/><text x="180" y="196" font-size="14" text-anchor="middle">RBF：依點與點的距離算相似度</text><line x1="180" y1="224" x2="180" y2="264" stroke="#172c43" /><rect x="20" y="264" width="320" height="66" rx="8" fill="#eaf2fa" stroke="#172c43"/><text x="180" y="302" font-size="14" text-anchor="middle">隱含特徵空間：尋找分類超平面</text><text x="28" y="355" font-size="14" >核方法不保證任意資料都能完美分開</text><text x="12" y="380" font-size="11" >示意圖；非擬合結果</text></g></svg>
