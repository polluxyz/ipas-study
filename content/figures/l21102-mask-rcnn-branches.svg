<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 475" role="img" aria-labelledby="t d"><title id="t">Mask R-CNN在偵測架構新增遮罩分支</title><desc id="d">訓練時分類框修正與遮罩分支平行；推論先修框與篩選，兩物件遮罩面積由T01資料推得</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#45556c"/></marker></defs><rect width="360" height="475" fill="#fff"/><g fill="#15243b" font-family="sans-serif"><text x="16" y="26" font-size="16">訓練分支：Faster R-CNN 的延伸</text><rect x="25" y="45" width="310" height="42" rx="6" fill="#e6f1fa" stroke="#36506c"/><text x="35" y="72" font-size="16">影像 → 共享特徵 → RPN</text><path d="M180 87L180 100" stroke="#45556c" stroke-width="2"/><polygon points="180,107 183,100 177,100" fill="#45556c"/><rect x="25" y="108" width="310" height="42" rx="6" fill="#e6f1fa" stroke="#36506c"/><text x="35" y="135" font-size="16">候選區域 → 區域特徵對齊</text><path d="M180 150L180 170" stroke="#45556c" stroke-width="2"/><polygon points="180,177 183,170 177,170" fill="#45556c"/><rect x="20" y="180" width="152" height="65" rx="6" fill="#e6f1fa" stroke="#36506c"/><text x="30" y="218.5" font-size="16">類別＋框修正</text><rect x="188" y="180" width="152" height="65" rx="6" fill="#e6f1fa" stroke="#36506c"/><text x="198" y="218.5" font-size="16">新增遮罩分支</text><path d="M180 164L102.904757466825 176.8492070888625" stroke="#45556c" stroke-width="2"/><polygon points="96,178 103.39795442874107,179.80838886035895 102.41156050490893,173.89002531736605" fill="#45556c"/><path d="M180 164L257.095242533175 176.8492070888625" stroke="#45556c" stroke-width="2"/><polygon points="264,178 257.58843949509105,173.89002531736605 256.60204557125894,179.80838886035895" fill="#45556c"/><text x="16" y="285" font-size="16">每個物件各自輸出，不是每類一張：</text><text x="20" y="319" font-size="16">行人 ID1：類別、框、5 格遮罩</text><text x="20" y="351" font-size="16">行人 ID2：類別、框、4 格遮罩</text><text x="16" y="390" font-size="15">數字取自 T01 的可見像素。</text><text x="16" y="420" font-size="15">Mask R-CNN 不替所有背景逐像素判類。</text><text x="16" y="449" font-size="15">推論：先修框及篩選，再預測遮罩。</text></g></svg>
