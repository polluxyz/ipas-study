<svg xmlns="http://www.w3.org/2000/svg" width="360" height="460" viewBox="0 0 360 460" role="img" aria-labelledby="title desc">
<title id="title">總等待與條件剩餘等待</title>
<desc id="desc">發生率每分鐘十五分之一通，已等十五分鐘後再等十五分鐘的條件機率為e的負一次方。 教學合成模型示意，非觀測頻數。</desc>
<rect width="360" height="460" fill="white"/>
<g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif">
<text x="180" y="27" font-size="18" text-anchor="middle" fill="#182b40">固定率下的剩餘等待</text>
<text x="180" y="60" font-size="16" text-anchor="middle" fill="#182b40">總等待時間T（分鐘）</text>
<path d="M35 140 L325 140" fill="none" stroke="#182b40" stroke-width="2"/>
<path d="M35 134 L35 146" fill="none" stroke="#182b40" stroke-width="2"/>
<text x="35" y="169" font-size="16" text-anchor="middle" fill="#182b40">0</text>
<path d="M180 134 L180 146" fill="none" stroke="#182b40" stroke-width="2"/>
<text x="180" y="169" font-size="16" text-anchor="middle" fill="#182b40">15</text>
<path d="M325 134 L325 146" fill="none" stroke="#182b40" stroke-width="2"/>
<text x="325" y="169" font-size="16" text-anchor="middle" fill="#182b40">30</text>
<path d="M35 290 L325 290" fill="none" stroke="#182b40" stroke-width="2"/>
<path d="M35 284 L35 296" fill="none" stroke="#182b40" stroke-width="2"/>
<text x="35" y="319" font-size="16" text-anchor="middle" fill="#182b40">0</text>
<path d="M180 284 L180 296" fill="none" stroke="#182b40" stroke-width="2"/>
<text x="180" y="319" font-size="16" text-anchor="middle" fill="#182b40">15</text>
<path d="M325 284 L325 296" fill="none" stroke="#182b40" stroke-width="2"/>
<text x="325" y="319" font-size="16" text-anchor="middle" fill="#182b40">30</text>
<text x="180" y="99" font-size="17" text-anchor="middle" fill="#182b40">從起點問：T &gt; 30</text>
<path d="M35 122 L325 122" fill="none" stroke="#155e95" stroke-width="2"/>
<text x="180" y="201" font-size="16" text-anchor="middle" fill="#182b40">機率 e⁻² ≈ 0.1353</text>
<text x="180" y="249" font-size="16" text-anchor="middle" fill="#182b40">已知T &gt; 15，再問是否超過30</text>
<rect x="35" y="274" width="145" height="12" rx="5" fill="#e0e5ea" stroke="#778a9c"/>
<path d="M180 269 L325 269" fill="none" stroke="#a34c00" stroke-width="2"/>
<text x="106" y="351" font-size="15" text-anchor="middle" fill="#182b40">已等15分鐘</text>
<text x="257" y="351" font-size="15" text-anchor="middle" fill="#182b40">再等15分鐘</text>
<text x="180" y="389" font-size="17" text-anchor="middle" fill="#182b40">條件機率 e⁻² / e⁻¹ = e⁻¹</text>
<text x="180" y="418" font-size="16" text-anchor="middle" fill="#182b40">等同從起點等待超過15分鐘</text>
<text x="12" y="448" font-size="13" text-anchor="start" fill="#182b40">來源：教學合成模型示意</text>
</g>
</svg>
