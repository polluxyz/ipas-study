<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" role="img"><title>條件機率頻數樹</title><desc>由真值分支到檢驗判定；反向條件要合併兩條陽性路徑。</desc><style>text{font-family:system-ui,"Microsoft JhengHei",sans-serif;fill:#172b4d;font-size:14px}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:1.4}.line{fill:none;stroke:#536579;stroke-width:1.5}.small{font-size:12px}.bold{font-weight:700}</style><rect width="360" height="350" fill="white"/><text x="180" y="24" text-anchor="middle" class="bold">教學合成資料：醫療篩檢頻數樹</text><rect class="box" x="105" y="39" width="150" height="38" rx="7"/><text x="180" y="64" text-anchor="middle" class="">全部 10,000 人</text><path class="line" d="M180 77 L90 110"/><rect class="box" x="20" y="110" width="140" height="48" rx="7"/><text x="90" y="130" text-anchor="middle" class="">有病 1,000 人</text><text x="90" y="149" text-anchor="middle" class="small">占全部 10%</text><path class="line" d="M180 77 L270 110"/><rect class="box" x="200" y="110" width="140" height="48" rx="7"/><text x="270" y="130" text-anchor="middle" class="">無病 9,000 人</text><text x="270" y="149" text-anchor="middle" class="small">占全部 90%</text><path class="line" d="M90 158 L47 203"/><text x="47" y="190" text-anchor="middle" class="small">90%</text><rect class="box" x="8" y="203" width="78" height="55" rx="5"/><text x="47" y="225" text-anchor="middle" class="">陽性</text><text x="47" y="247" text-anchor="middle" class="">900 人</text><path class="line" d="M90 158 L133 203"/><text x="133" y="190" text-anchor="middle" class="small">10%</text><rect class="box" x="94" y="203" width="78" height="55" rx="5"/><text x="133" y="225" text-anchor="middle" class="">陰性</text><text x="133" y="247" text-anchor="middle" class="">100 人</text><path class="line" d="M270 158 L227 203"/><text x="227" y="190" text-anchor="middle" class="small">5%</text><rect class="box" x="188" y="203" width="78" height="55" rx="5"/><text x="227" y="225" text-anchor="middle" class="">陽性</text><text x="227" y="247" text-anchor="middle" class="">450 人</text><path class="line" d="M270 158 L313 203"/><text x="313" y="190" text-anchor="middle" class="small">95%</text><rect class="box" x="274" y="203" width="78" height="55" rx="5"/><text x="313" y="225" text-anchor="middle" class="">陰性</text><text x="313" y="247" text-anchor="middle" class="">8,550 人</text><text x="180" y="284" text-anchor="middle" class="">陽性共 1,350 人；有病占 900/1350 = 66.67%</text><text x="180" y="308" text-anchor="middle" class="small">每個分支比例以該分支的上一層為分母</text><text x="180" y="329" text-anchor="middle" class="small">原始 1,000 人各格乘 10，僅為比例展開</text></svg>