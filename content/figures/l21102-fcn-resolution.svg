<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img" aria-labelledby="t d"><title id="t">FCN上下採樣形狀</title><desc id="d">數字來自共用例子的fcn shapes，NCHW表示批次通道高寬</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#45556c"/></marker></defs><rect width="360" height="500" fill="#fff"/><g fill="#15243b" font-family="sans-serif"><text x="16" y="26" font-size="16">FCN：保留空間，再恢復解析度</text><rect x="25" y="48" width="310" height="64" rx="6" fill="#e6f1fa" stroke="#36506c"/><text x="35" y="86" font-size="16">輸入 NCHW</text><text x="38" y="100" font-size="15">1 × 3 × 8 × 8</text><path d="M180 112L180 131" stroke="#45556c" stroke-width="2"/><polygon points="180,138 183,131 177,131" fill="#45556c"/><rect x="25" y="140" width="310" height="64" rx="6" fill="#e6f1fa" stroke="#36506c"/><text x="35" y="178" font-size="16">卷積／下採樣特徵</text><text x="38" y="192" font-size="15">1 × 4 × 2 × 2</text><path d="M180 204L180 223" stroke="#45556c" stroke-width="2"/><polygon points="180,230 183,223 177,223" fill="#45556c"/><rect x="25" y="232" width="310" height="64" rx="6" fill="#e6f1fa" stroke="#36506c"/><text x="35" y="270" font-size="16">1×1 卷積：每類分數</text><text x="38" y="284" font-size="15">1 × 3 × 2 × 2</text><path d="M180 296L180 315" stroke="#45556c" stroke-width="2"/><polygon points="180,322 183,315 177,315" fill="#45556c"/><rect x="25" y="324" width="310" height="64" rx="6" fill="#e6f1fa" stroke="#36506c"/><text x="35" y="362" font-size="16">上採樣：每類分數</text><text x="38" y="376" font-size="15">1 × 3 × 8 × 8</text><text x="20" y="448" font-size="15">沿類別軸選分數最高者 → 8×8 類別圖</text><text x="20" y="478" font-size="15">解析度變大，不保證被丟掉的細節復原。</text></g></svg>
