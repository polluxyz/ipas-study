<svg xmlns="http://www.w3.org/2000/svg" width="360" height="416" viewBox="0 0 360 416" role="img" aria-labelledby="title desc"><title id="title">短序列的 DTW 距離表</title><desc id="desc">由 F-S1 的序列 [1, 2, 3] 與 [1, 1, 2, 3] 計算絕對差 DTW。綠色粗框依序為最短路徑 [(1, 1), (1, 2), (2, 3), (3, 4)]，成本 0。本圖為補充。</desc><style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#172033;font-size:16px} .head{font-size:19px;font-weight:700} .small{font-size:14px} .box{fill:#edf5ff;stroke:#264e7a;stroke-width:1.5} .green{fill:#e8f4ee;stroke:#286247;stroke-width:1.5} .orange{fill:#fff2df;stroke:#875d20;stroke-width:1.5} .line{fill:none;stroke:#334e68;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334e68"/></marker></defs><rect width="360" height="416" rx="12" fill="#ffffff"/><text x="180" y="28" text-anchor="middle" class="head">DTW 累積成本與合法路徑</text><text x="180" y="55" text-anchor="middle" class="small">列為 Y，欄為 X；框線標示路徑</text><text x="135.0" y="90" text-anchor="middle" class="">X1=1</text><text x="209.0" y="90" text-anchor="middle" class="">X2=2</text><text x="283.0" y="90" text-anchor="middle" class="">X3=3</text><text x="52" y="136.0" text-anchor="middle" class="">Y1=1</text><rect x="98" y="105" width="74" height="52" fill="#dcefe4" stroke="#1e5b3a" stroke-width="3"/><text x="135.0" y="137.0" text-anchor="middle" class="">0</text><rect x="172" y="105" width="74" height="52" fill="#f6f8fb" stroke="#a7b5c5" stroke-width="1"/><text x="209.0" y="137.0" text-anchor="middle" class="">1</text><rect x="246" y="105" width="74" height="52" fill="#f6f8fb" stroke="#a7b5c5" stroke-width="1"/><text x="283.0" y="137.0" text-anchor="middle" class="">3</text><text x="52" y="188.0" text-anchor="middle" class="">Y2=1</text><rect x="98" y="157" width="74" height="52" fill="#dcefe4" stroke="#1e5b3a" stroke-width="3"/><text x="135.0" y="189.0" text-anchor="middle" class="">0</text><rect x="172" y="157" width="74" height="52" fill="#f6f8fb" stroke="#a7b5c5" stroke-width="1"/><text x="209.0" y="189.0" text-anchor="middle" class="">1</text><rect x="246" y="157" width="74" height="52" fill="#f6f8fb" stroke="#a7b5c5" stroke-width="1"/><text x="283.0" y="189.0" text-anchor="middle" class="">3</text><text x="52" y="240.0" text-anchor="middle" class="">Y3=2</text><rect x="98" y="209" width="74" height="52" fill="#f6f8fb" stroke="#a7b5c5" stroke-width="1"/><text x="135.0" y="241.0" text-anchor="middle" class="">1</text><rect x="172" y="209" width="74" height="52" fill="#dcefe4" stroke="#1e5b3a" stroke-width="3"/><text x="209.0" y="241.0" text-anchor="middle" class="">0</text><rect x="246" y="209" width="74" height="52" fill="#f6f8fb" stroke="#a7b5c5" stroke-width="1"/><text x="283.0" y="241.0" text-anchor="middle" class="">1</text><text x="52" y="292.0" text-anchor="middle" class="">Y4=3</text><rect x="98" y="261" width="74" height="52" fill="#f6f8fb" stroke="#a7b5c5" stroke-width="1"/><text x="135.0" y="293.0" text-anchor="middle" class="">3</text><rect x="172" y="261" width="74" height="52" fill="#f6f8fb" stroke="#a7b5c5" stroke-width="1"/><text x="209.0" y="293.0" text-anchor="middle" class="">1</text><rect x="246" y="261" width="74" height="52" fill="#dcefe4" stroke="#1e5b3a" stroke-width="3"/><text x="283.0" y="293.0" text-anchor="middle" class="">0</text><text x="180" y="344" text-anchor="middle" class="">終點累積成本 = 0</text><text x="180" y="373" text-anchor="middle" class="">只可右、下或右下前進；不可倒退</text><text x="180" y="401" text-anchor="middle" class="small">教學進度特徵；成本單位同特徵</text></svg>
