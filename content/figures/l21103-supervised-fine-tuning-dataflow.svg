<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 590" role="img" aria-labelledby="title desc"><title id="title">監督式微調資料流</title><desc id="desc">指令、輸入及理想答案形成示範，模型預測和理想答案算損失，梯度只更新選定參數，驗證與最終測試不更新權重。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#344861"/></marker></defs><rect width="360" height="590" fill="#fff"/><g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="180" y="28" text-anchor="middle" font-size="15" fill="#172b4d">SFT：示範 → 損失 → 更新</text><rect x="30" y="48" width="300" height="68" rx="9" fill="#eaf1fa" stroke="#47678f" stroke-width="2" stroke-dasharray="5 3"/><text x="180" y="72" text-anchor="middle" font-size="15" fill="#172b4d">訓練：指令＋輸入</text><text x="180" y="94" text-anchor="middle" font-size="15" fill="#172b4d">理想答：監督目標</text><path d="M180 116 L180 140" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="142" width="300" height="48" rx="9" fill="#eaf1fa" stroke="#47678f" stroke-width="2" stroke-dasharray="5 3"/><text x="180" y="166" text-anchor="middle" font-size="15" fill="#172b4d">模型產生訓練預測</text><path d="M180 190 L180 216" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="218" width="300" height="68" rx="9" fill="#eaf1fa" stroke="#47678f" stroke-width="2" stroke-dasharray="5 3"/><text x="180" y="242" text-anchor="middle" font-size="15" fill="#172b4d">預測 vs 理想答 → 損失</text><text x="180" y="264" text-anchor="middle" font-size="15" fill="#172b4d">反向傳播至選定參數</text><path d="M180 286 L180 310" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="312" width="300" height="68" rx="9" fill="#fff3d6" stroke="#9b6413" stroke-width="2" /><text x="180" y="336" text-anchor="middle" font-size="15" fill="#172b4d">完整微調：更新 W</text><text x="180" y="358" text-anchor="middle" font-size="15" fill="#172b4d">LoRA：W 凍結，只更新 A、B</text><path d="M180 380 L180 407" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="409" width="300" height="68" rx="9" fill="#eaf1fa" stroke="#47678f" stroke-width="2" stroke-dasharray="5 3"/><text x="180" y="433" text-anchor="middle" font-size="15" fill="#172b4d">驗證：比較設定，不更新</text><text x="180" y="455" text-anchor="middle" font-size="15" fill="#172b4d">測試：最後驗收，不參與選擇</text><text x="180" y="535" text-anchor="middle" font-size="14" fill="#172b4d">資料目標與參數形式分開決定</text><text x="180" y="574" text-anchor="middle" font-size="13" fill="#172b4d">教學示意；非模型實測</text></g></svg>
