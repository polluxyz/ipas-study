<svg xmlns="http://www.w3.org/2000/svg" width="360" height="425" viewBox="0 0 360 425" role="img" aria-labelledby="title desc"><title id="title">歷史視窗與未來目標</title><desc id="desc">前三天的點擊2、4、6平均4，昨天值6；當天與未來目標不在歷史視窗中。</desc><rect width="360" height="425" fill="white"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="16" y="28" font-size="17" text-anchor="start" fill="#172b4d">10月8日 18:00 預測未來24小時</text><rect x="16" y="48" width="328" height="190" rx="8" fill="#eaf2ff" stroke="#94a3b8"/><text x="28" y="75" font-size="16" text-anchor="start" fill="#172b4d">前3天歷史視窗，不含當期</text><circle cx="42" cy="106" r="5" fill="#1456a0"/><text x="60" y="111" font-size="16" text-anchor="start" fill="#172b4d">10月5日：2次點擊</text><circle cx="42" cy="151" r="5" fill="#1456a0"/><text x="60" y="156" font-size="16" text-anchor="start" fill="#172b4d">10月6日：4次點擊</text><circle cx="42" cy="196" r="5" fill="#1456a0"/><text x="60" y="201" font-size="16" text-anchor="start" fill="#172b4d">10月7日：6次點擊</text><text x="28" y="226" font-size="16" text-anchor="start" fill="#172b4d">rolling3 = 4；lag1 = 6</text><line x1="42" y1="248" x2="42" y2="320" stroke="#9a3412" stroke-width="2" stroke-dasharray="5 4"/><rect x="37" y="260" width="10" height="10" fill="#9a3412"/><text x="60" y="269" font-size="16" text-anchor="start" fill="#172b4d">10月8日：截止點</text><text x="60" y="296" font-size="15" text-anchor="start" fill="#172b4d">當日8次尚不可讀</text><rect x="16" y="329" width="328" height="60" rx="8" fill="#fff3e8" stroke="#94a3b8"/><text x="28" y="355" font-size="16" text-anchor="start" fill="#172b4d">預測目標：未來24小時是否購買</text><text x="28" y="377" font-size="14" text-anchor="start" fill="#172b4d">不能把目標期間的真實結果作輸入</text><text x="16" y="413" font-size="12" text-anchor="start" fill="#172b4d">資料：教學合成資料</text></g></svg>
