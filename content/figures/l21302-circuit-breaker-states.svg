<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 675" role="img" aria-labelledby="title desc"><title id="title">斷路器狀態與降級</title><desc id="desc">關閉時正常呼叫，失敗達門檻則開啟；等待後半開，探測成功達標才關閉，失敗則回到開啟。降級另提供 FAQ 或人工複檢。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#31566b"/></marker></defs><rect width="360" height="675" fill="#ffffff"/><g fill="#16364b" font-family="sans-serif"><text x="180" y="27" text-anchor="middle" font-size="17">斷路器狀態與降級</text><rect x="90" y="50" width="180" height="60" rx="9" fill="#e8f2fa" stroke="#31566b"/><text x="180" y="73" text-anchor="middle" font-size="14">關閉 Closed</text><text x="180" y="94" text-anchor="middle" font-size="14">正常呼叫，記錄失敗</text><path d="M180 110 V163" fill="none" stroke="#31566b" stroke-width="2" marker-end="url(#arrow)"/><text x="246" y="141" text-anchor="middle" font-size="14">失敗達門檻</text><rect x="90" y="167" width="180" height="60" rx="9" fill="#fff0eb" stroke="#31566b"/><text x="180" y="190" text-anchor="middle" font-size="14">開啟 Open</text><text x="180" y="211" text-anchor="middle" font-size="14">阻擋下游呼叫</text><path d="M180 227 V280" fill="none" stroke="#31566b" stroke-width="2" marker-end="url(#arrow)"/><text x="235" y="258" text-anchor="middle" font-size="14">等待到期</text><rect x="90" y="284" width="180" height="60" rx="9" fill="#e8f2fa" stroke="#31566b"/><text x="180" y="307" text-anchor="middle" font-size="14">半開 Half-open</text><text x="180" y="328" text-anchor="middle" font-size="14">少量探測</text><path d="M90 314 H23 V80 H88" fill="none" stroke="#31566b" stroke-width="2" marker-end="url(#arrow)"/><text x="52" y="198" text-anchor="middle" font-size="13">成功</text><text x="52" y="219" text-anchor="middle" font-size="13">達標</text><path d="M270 314 H336 V197 H273" fill="none" stroke="#31566b" stroke-width="2" marker-end="url(#arrow)"/><text x="309" y="269" text-anchor="middle" font-size="13">探測</text><text x="309" y="290" text-anchor="middle" font-size="13">失敗</text><text x="180" y="393" text-anchor="middle" font-size="15">阻擋或呼叫失敗 → 受控替代流程</text><path d="M180 406 V426 H23 V578" fill="none" stroke="#31566b" stroke-width="2"/><path d="M23 477 H37" fill="none" stroke="#31566b" stroke-width="2" marker-end="url(#arrow)"/><path d="M23 578 H37" fill="none" stroke="#31566b" stroke-width="2" marker-end="url(#arrow)"/><rect x="39" y="443" width="282" height="72" rx="9" fill="#e8f2fa" stroke="#31566b"/><text x="180" y="466" text-anchor="middle" font-size="14">客服：FAQ＋轉人工</text><text x="180" y="487" text-anchor="middle" font-size="14">標記降級、保留內容有效期</text><rect x="39" y="542" width="282" height="72" rx="9" fill="#e8f2fa" stroke="#31566b"/><text x="180" y="565" text-anchor="middle" font-size="14">製造：人工複檢</text><text x="180" y="586" text-anchor="middle" font-size="14">保留工件編號，不自動放行</text><text x="180" y="663" text-anchor="middle" font-size="12">教學合成示意；箭頭表示控制或請求方向</text></g></svg>