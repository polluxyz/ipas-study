<svg xmlns="http://www.w3.org/2000/svg" width="360" height="330" viewBox="0 0 360 330" role="img"><title>四點平均連結樹狀圖</title><desc>教學合成資料。甲乙先合併，再加入丙，最後加入丁；葉子左右順序不代表距離。</desc><rect width="360" height="330" fill="#fff"/><g font-family="Microsoft JhengHei, sans-serif" font-size="12" fill="#182b3a"><text x="15" y="20" >平均連結：高度是群間平均距離</text><line x1="205.00" y1="260.00" x2="205.00" y2="233.00" stroke="#526878" /><line x1="205.00" y1="233.00" x2="275.00" y2="233.00" stroke="#526878" /><line x1="275.00" y1="233.00" x2="275.00" y2="260.00" stroke="#526878" /><line x1="135.00" y1="260.00" x2="135.00" y2="165.50" stroke="#526878" /><line x1="135.00" y1="165.50" x2="240.00" y2="165.50" stroke="#526878" /><line x1="240.00" y1="165.50" x2="240.00" y2="233.00" stroke="#526878" /><line x1="65.00" y1="260.00" x2="65.00" y2="62.00" stroke="#526878" /><line x1="65.00" y1="62.00" x2="187.50" y2="62.00" stroke="#526878" /><line x1="187.50" y1="62.00" x2="187.50" y2="165.50" stroke="#526878" /><text x="60" y="281" >丁</text><text x="130" y="281" >丙</text><text x="200" y="281" >甲</text><text x="270" y="281" >乙</text><line x1="40.00" y1="179.00" x2="320.00" y2="179.00" stroke="#b04d16" stroke-dasharray="5 3"/><text x="12" y="183" >3</text><line x1="40.00" y1="125.00" x2="320.00" y2="125.00" stroke="#b04d16" stroke-dasharray="5 3"/><text x="12" y="129" >5</text><text x="16" y="308" >高度 3：3 群；高度 5：2 群</text></g></svg>