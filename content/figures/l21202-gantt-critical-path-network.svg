<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 570" width="360" height="570" role="img" aria-labelledby="title desc"><title id="title">相依與關鍵路徑</title><desc id="desc">A分叉至B與C，B至D，C與D匯合至E，E至F。</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#475569"/></marker></defs><style>text{font-family:'Microsoft JhengHei',sans-serif;font-size:13px;fill:#172033} .small{font-size:12px}.head{font-size:16px;font-weight:700}.muted{fill:#475569} .box{fill:#f8fafc;stroke:#64748b;stroke-width:1.2} .link{fill:none;stroke:#475569;stroke-width:1.3;marker-end:url(#arrow)}</style><rect width="360" height="570" fill="#fff"/><text x="12" y="26" class="head">六工作包相依圖</text><text x="12" y="49" class="">教學合成資料；箭頭＝阻擋後項</text><path class="link" d="M180 130L88 160" style="stroke-width:3"/><path class="link" d="M180 130L272 160" /><path class="link" d="M88 220L88 250" style="stroke-width:3"/><path class="link" d="M272 220L180 340" /><path class="link" d="M88 310L180 340" style="stroke-width:3"/><path class="link" d="M180 400L180 430" style="stroke-width:3"/><rect class="box" x="110" y="70" width="140" height="60" rx="5"/><text x="118" y="90" class="">A 來源與範圍盤點</text><text x="118" y="109" class="small">2日；0→2</text><text x="118" y="124" class="small">總浮時 0日</text><rect class="box" x="18" y="160" width="140" height="60" rx="5"/><text x="26" y="180" class="">B 清理標註資料</text><text x="26" y="199" class="small">3日；2→5</text><text x="26" y="214" class="small">總浮時 0日</text><rect class="box" x="202" y="160" width="140" height="60" rx="5"/><text x="210" y="180" class="">C 查詢介面</text><text x="210" y="199" class="small">4日；2→6</text><text x="210" y="214" class="small">總浮時 1日</text><rect class="box" x="18" y="250" width="140" height="60" rx="5"/><text x="26" y="270" class="">D 回答模型</text><text x="26" y="289" class="small">2日；5→7</text><text x="26" y="304" class="small">總浮時 0日</text><rect class="box" x="110" y="340" width="140" height="60" rx="5"/><text x="118" y="360" class="">E 整合與品質驗證</text><text x="118" y="379" class="small">3日；7→10</text><text x="118" y="394" class="small">總浮時 0日</text><rect class="box" x="110" y="430" width="140" height="60" rx="5"/><text x="118" y="450" class="">F 試用決議</text><text x="118" y="469" class="small">1日；10→11</text><text x="118" y="484" class="small">總浮時 0日</text><text x="12" y="527" class="">粗線鏈：A→B→D→E→F，共11日。</text><text x="12" y="550" class="small">C支線10日；延長1日後兩條鏈同為關鍵。</text></svg>
