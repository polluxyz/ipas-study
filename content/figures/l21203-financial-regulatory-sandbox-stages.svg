<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 536" role="img" aria-labelledby="title desc"><title id="title">金融創新受控試驗</title><desc id="desc">先檢查受管金融業務與創新性，再申請審查。獲准後依範圍試行，最後評估成效及退出，不能直接推成正式營運資格。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="360" height="536" rx="12" fill="#f8fafc"/><g font-family="system-ui, 'Microsoft JhengHei', sans-serif" fill="#0f172a"><text x="180" y="30" text-anchor="middle" font-size="18" font-weight="700">金融創新受控試驗</text><rect x="18" y="50" width="324" height="78" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="180" y="79" font-size="18" font-weight="700" text-anchor="middle">描述創新金融服務</text><text x="180" y="107" font-size="16" text-anchor="middle">確認用途及可能風險</text><path d="M180 130V153" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="18" y="163" width="324" height="78" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="180" y="192" font-size="18" font-weight="700" text-anchor="middle">申請及審查</text><text x="180" y="220" font-size="16" text-anchor="middle">提出範圍與保護措施</text><path d="M180 243V266" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="18" y="276" width="324" height="78" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="180" y="305" font-size="18" font-weight="700" text-anchor="middle">依核准條件試行</text><text x="180" y="333" font-size="16" text-anchor="middle">資料安全、監控與補救</text><path d="M180 356V379" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="18" y="389" width="324" height="78" rx="9" fill="#fef3c7" stroke="#475569"/><text x="180" y="418" font-size="18" font-weight="700" text-anchor="middle">評估與後續安排</text><text x="180" y="446" font-size="16" text-anchor="middle">確認成效、退場及營運要求</text><text x="180" y="506" text-anchor="middle" font-size="16">教學示意｜個案結論須另行查核</text></g></svg>
