<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 370" role="img"><title>有效極端值的限界前後</title><desc>80°C是有佐證的有效量測，IQR限界特徵為48.75°C；兩者不是同一筆原始數值。</desc><rect width="360" height="370" fill="#fff"/><g fill="#0f172a" font-family="sans-serif"><text x="16" y="24" font-size="15" >有效極端值：保留或限界</text><text x="16" y="55" font-size="12" >原始與轉換欄分開保存（教學合成）</text><text x="16" y="90" font-size="13" >保留原值</text><rect x="55" y="102" width="208" height="26" fill="#2563eb"/><text x="268" y="121" font-size="13" >80</text><text x="16" y="180" font-size="13" >限界特徵</text><rect x="55" y="192" width="126.75" height="26" fill="#d97706"/><text x="186.75" y="211" font-size="13" >48.75</text><line x1="55" y1="250" x2="315" y2="250" stroke="#475569" /><text x="55" y="270" font-size="12" text-anchor="middle">0</text><text x="120" y="270" font-size="12" text-anchor="middle">25</text><text x="185" y="270" font-size="12" text-anchor="middle">50</text><text x="250" y="270" font-size="12" text-anchor="middle">75</text><text x="315" y="270" font-size="12" text-anchor="middle">100</text><text x="270" y="292" font-size="12" >溫度（°C）</text><text x="16" y="321" font-size="13" >IQR上界=48.75；原值差異=31.25°C</text><text x="16" y="349" font-size="12" >候選標記仍保留，並回到任務判斷用途。</text></g></svg>
