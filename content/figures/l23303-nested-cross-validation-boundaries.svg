<svg xmlns="http://www.w3.org/2000/svg" width="390" height="875" viewBox="0 0 390 875" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">巢狀交叉驗證的邊界</title><desc id="desc">外層先切分訓練與驗證資料。三摺內層搜尋完全位於外層訓練資料內，每個候選設定在內層擬合前處理及模型，以內層驗證選參數。選完後在全部外層訓練資料重訓，才以隔離的外層驗證資料評分。外層驗證不參與前處理擬合與調參，各外層重新搜尋後平均分數。</desc>
<style>
:root{color-scheme:light dark;--bg:#f9fbf9;--ink:#263a45;--muted:#465b66;--train:#006b66;--train-bg:#edf5f4;--val:#9a3c00;--val-bg:#fff0e3;--test:#504ca2;--test-bg:#efedff;--rule:#a5b8bd;--bad:#a33036;--bad-bg:#fff1f0}
@media(prefers-color-scheme:dark){:root{--bg:#15252b;--ink:#e4edf1;--muted:#bbcbd2;--train:#78ded2;--train-bg:#24373d;--val:#ffbf86;--val-bg:#3a2e25;--test:#c7bcff;--test-bg:#363048;--rule:#71868c;--bad:#ffaaa9;--bad-bg:#3d272b}}
text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:var(--ink);font-size:14px}.title{font-size:22px;font-weight:700}.heading{font-size:17px;font-weight:700}.strong{font-weight:700}.note{font-size:13px;fill:var(--muted)}.small{font-size:12px}.code{font-family:Consolas,monospace;font-size:13px}.bg{fill:var(--bg)}.box{fill:var(--bg);stroke:var(--rule);stroke-width:1.3}.train{fill:var(--train-bg);stroke:var(--train);stroke-width:1.4}.val{fill:url(#hatch);stroke:var(--val);stroke-width:1.4;stroke-dasharray:4 2}.test{fill:var(--test-bg);stroke:var(--test);stroke-width:1.5;stroke-dasharray:1 3}.badbox{fill:var(--bad-bg);stroke:var(--bad);stroke-width:1.4}.badtext{fill:var(--bad);font-weight:700}.hb{fill:var(--val-bg)}.hl{stroke:var(--val);stroke-width:1;opacity:.23}.line{stroke:var(--muted);stroke-width:1.4;fill:none;marker-end:url(#arrow)}.learn{stroke:var(--train);stroke-width:1.4;stroke-dasharray:4 3;fill:none;marker-end:url(#learn-arrow)}.leak{stroke:var(--bad);stroke-width:1.6;stroke-dasharray:4 3;fill:none;marker-end:url(#bad-arrow)}.rule{stroke:var(--rule);fill:none}.boundary{fill:none;stroke:var(--train);stroke-width:1.4;stroke-dasharray:5 3}.unused{fill:var(--bg);stroke:var(--rule);stroke-width:1}.cell{font-size:12px;font-weight:700}
</style><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect class="hb" width="8" height="8"/><path class="hl" d="M0 8L8 0"/></pattern><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--muted)"/></marker><marker id="learn-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--train)"/></marker><marker id="bad-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--bad)"/></marker></defs>
<rect class="bg" width="390" height="875" rx="12"/>
<text x="18" y="35" class="title" text-anchor="start">巢狀交叉驗證的邊界</text><text x="18" y="60" class="note" text-anchor="start">教學示意：內層選設定，外層估成效</text><text x="18" y="93" class="heading" text-anchor="start">① 外層先切分</text><rect x="18" y="110" width="174" height="68" rx="5" class="train"/><text x="105" y="139" class="strong" text-anchor="middle">外層訓練資料</text><text x="105" y="161" class="small" text-anchor="middle">只在此搜尋設定</text><rect x="209" y="110" width="163" height="83" rx="5" class="val"/><text x="290" y="136" class="strong" text-anchor="middle">外層驗證資料</text><text x="290" y="157" class="small" text-anchor="middle">不參與前處理與調參</text><text x="290" y="179" class="small" text-anchor="middle">評估時只套用已學轉換</text><path d="M105 178V215" class="line"/><rect x="18" y="219" width="330" height="490" rx="8" class="boundary"/><text x="32" y="247" class="heading" text-anchor="start">② 只切外層訓練資料</text><text x="32" y="275" class="small strong" text-anchor="start">每個候選設定：做完三摺內層驗證</text><text x="32" y="310" class="small" text-anchor="start">內 1</text><rect x="79" y="287" width="75" height="32" rx="5" class="val"/><text x="116.5" y="308" class="small" text-anchor="middle">內層驗證</text><rect x="161" y="287" width="75" height="32" rx="5" class="train"/><text x="198.5" y="308" class="small" text-anchor="middle">內層訓練</text><rect x="243" y="287" width="75" height="32" rx="5" class="train"/><text x="280.5" y="308" class="small" text-anchor="middle">內層訓練</text><text x="32" y="355" class="small" text-anchor="start">內 2</text><rect x="79" y="332" width="75" height="32" rx="5" class="train"/><text x="116.5" y="353" class="small" text-anchor="middle">內層訓練</text><rect x="161" y="332" width="75" height="32" rx="5" class="val"/><text x="198.5" y="353" class="small" text-anchor="middle">內層驗證</text><rect x="243" y="332" width="75" height="32" rx="5" class="train"/><text x="280.5" y="353" class="small" text-anchor="middle">內層訓練</text><text x="32" y="400" class="small" text-anchor="start">內 3</text><rect x="79" y="377" width="75" height="32" rx="5" class="train"/><text x="116.5" y="398" class="small" text-anchor="middle">內層訓練</text><rect x="161" y="377" width="75" height="32" rx="5" class="train"/><text x="198.5" y="398" class="small" text-anchor="middle">內層訓練</text><rect x="243" y="377" width="75" height="32" rx="5" class="val"/><text x="280.5" y="398" class="small" text-anchor="middle">內層驗證</text><text x="32" y="435" class="small" text-anchor="start">每個內層摺，只在內層訓練部分 fit：</text><rect x="32" y="450" width="302" height="45" rx="5" class="train"/><text x="183" y="478" class="strong" text-anchor="middle">前處理 → 訓練 → 內層驗證</text><path d="M183 495V519" class="line"/><rect x="32" y="522" width="302" height="50" rx="5" class="box"/><text x="183" y="544" class="strong" text-anchor="middle">依內層平均分數</text><text x="183" y="564" class="strong" text-anchor="middle">選參數</text><path d="M183 572V597" class="line"/><rect x="32" y="600" width="302" height="73" rx="5" class="train"/><text x="183" y="625" class="strong" text-anchor="middle">③ 外層訓練資料重訓</text><text x="183" y="648" class="small" text-anchor="middle">用選定設定，重新擬合前處理與模型</text><path d="M183 673V746" class="line"/><path d="M372 151H380V734H294V746" class="line"/><rect x="32" y="749" width="340" height="48" rx="5" class="val"/><text x="202" y="779" class="strong" text-anchor="middle">④ 外層驗證評分</text><text x="18" y="827" class="strong" text-anchor="start">每個外層重新搜尋，最後平均外層分數。</text><text x="18" y="851" class="small" text-anchor="start">外層分數不回流選參數；此圖不表示資料筆數。</text>
</svg>
