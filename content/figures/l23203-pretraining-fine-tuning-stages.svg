<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 454" role="img" aria-labelledby="title desc"><title id="title">預訓練微調提示的分工</title><desc id="desc">大量語料經預訓練更新參數，下游資料再微調；提示只進入推論輸入。 教學示意圖。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#425c74"/></marker></defs><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#172b40;font-size:14px} .small{font-size:12px}.box{fill:#edf5fc;stroke:#356b98;stroke-width:1.5}.alt{fill:#fff3da;stroke:#946715;stroke-width:1.5}.line{fill:none;stroke:#425c74;stroke-width:1.5;marker-end:url(#arrow)}</style><rect width="360" height="454" rx="10" fill="#fff"/><text x="180" y="25" text-anchor="middle" class="">資料和參數沿哪條路前進？</text><rect x="40" y="46" width="280" height="38" rx="7" class="box"/><text x="180" y="70" text-anchor="middle" class="">大量通用文本</text><path class="line" d="M180 84L180 100"/><rect x="40" y="106" width="280" height="38" rx="7" class="box"/><text x="180" y="130" text-anchor="middle" class="">預訓練：更新通用參數</text><path class="line" d="M180 144L180 166"/><rect x="40" y="172" width="280" height="42" rx="7" class="alt"/><text x="180" y="198" text-anchor="middle" class="">下游訓練資料 → 微調參數</text><path class="line" d="M180 214L180 234"/><rect x="40" y="240" width="280" height="38" rx="7" class="box"/><text x="180" y="264" text-anchor="middle" class="">選定模型：推論時固定權重</text><path class="line" d="M180 278L180 300"/><rect x="40" y="306" width="280" height="38" rx="7" class="box"/><text x="180" y="330" text-anchor="middle" class="">指令＋內容＋可能的示範</text><path class="line" d="M180 344L180 365"/><text x="180" y="389" text-anchor="middle" class="">推論輸出：類別或摘要</text><text x="180" y="417" text-anchor="middle" class="small">驗證選方案；最終測試留到選定後</text><text x="180" y="445" text-anchor="middle" class="small">教學合成資料／示意圖</text></svg>
