<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="title desc"><title id="title">RNN 三步時間展開</title><desc id="desc">當下輸入與同層前一步狀態產生新狀態，三步共享同一套權重。</desc><style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#172b4d;font-size:15px} .head{font-size:18px;font-weight:700}.small{font-size:13px}.box{fill:#e8f2ff;stroke:#245b9e;stroke-width:1.5}.memory{fill:#e6f6ec;stroke:#246d42;stroke-width:1.5}.gate{fill:#fff2cf;stroke:#8f6413;stroke-width:1.5}.line{fill:none;stroke:#245b9e;stroke-width:1.8;marker-end:url(#arrow)}.back{fill:none;stroke:#9c3b32;stroke-width:1.8;stroke-dasharray:5 3;marker-end:url(#red)}.mute{fill:#fff;stroke:#687782;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245b9e"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9c3b32"/></marker></defs><rect width="360" height="300" fill="#fff" rx="10"/><text x="180" y="30" text-anchor="middle" class="head">同一層，沿時間重複運算</text><text x="65" y="70" text-anchor="middle" class="">輸入 x1</text><path d="M65 80L65 120" class="line"/><rect x="35" y="125" width="60" height="45" rx="8" class="box"/><text x="65" y="152.5" text-anchor="middle" class="">h1</text><path d="M65 170L65 203" class="line"/><text x="65" y="228" text-anchor="middle" class="">輸出 1</text><text x="180" y="70" text-anchor="middle" class="">輸入 x2</text><path d="M180 80L180 120" class="line"/><rect x="150" y="125" width="60" height="45" rx="8" class="box"/><text x="180" y="152.5" text-anchor="middle" class="">h2</text><path d="M180 170L180 203" class="line"/><text x="180" y="228" text-anchor="middle" class="">輸出 2</text><text x="295" y="70" text-anchor="middle" class="">輸入 x3</text><path d="M295 80L295 120" class="line"/><rect x="265" y="125" width="60" height="45" rx="8" class="box"/><text x="295" y="152.5" text-anchor="middle" class="">h3</text><path d="M295 170L295 203" class="line"/><text x="295" y="228" text-anchor="middle" class="">輸出 3</text><path d="M10 147L33 147" class="line"/><path d="M97 147L148 147" class="line"/><path d="M212 147L263 147" class="line"/><text x="180" y="265" text-anchor="middle" class="">各步共用 Wₓ、Wₕ 與偏差</text><text x="180" y="288" text-anchor="middle" class="small">教學示意；輸出頭可依任務安排</text></svg>
