<svg xmlns="http://www.w3.org/2000/svg" width="360" height="810" viewBox="0 0 360 810" role="img" aria-labelledby="title desc"><title id="title">三個固定配對的距離</title><desc id="desc">圓心是 a，虛線圓半徑是 margin。P01 相似配對不使用 margin，淡圓只供幾何對照。P01 與 P02 幾何相同但標籤不同。P03 不相似且距離超過 margin，損失為零。</desc><style>text{font-family:"Microsoft JhengHei",sans-serif;font-size:14px;fill:#152538} .grid{stroke:#cbd5e1;stroke-width:1}.axis{stroke:#334155;stroke-width:1.4}.title{font-size:17px;font-weight:700}</style><rect width="360" height="810" fill="#fff"/><text x="16" y="25" class="title">配對標籤決定幾何目標</text><text x="16" y="54" >P01：相似，拉近</text><circle cx="115" cy="155" r="95" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="5 4" opacity="0.25"/><line x1="16" y1="155" x2="338" y2="155" class="grid"/><line x1="115" y1="60" x2="115" y2="250" class="grid"/><line x1="115" y1="155" x2="134" y2="155" stroke="#1d4ed8" stroke-width="3"/><circle cx="115" cy="155" r="5" fill="#1d4ed8"/><path d="M134,149l6,6 -6,6 -6,-6z" fill="#a14609"/><text x="105" y="177" text-anchor="end">a</text><text x="142" y="142" >b</text><text x="225" y="100" >不使用 m</text><text x="225" y="125" >D=0.2</text><text x="225" y="205" >損失 0.04</text><text x="16" y="271" >標籤 y=1；相似配對不使用 margin</text><text x="16" y="294" >P02：不相似，分開</text><circle cx="115" cy="395" r="95" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="5 4" /><line x1="16" y1="395" x2="338" y2="395" class="grid"/><line x1="115" y1="300" x2="115" y2="490" class="grid"/><line x1="115" y1="395" x2="134" y2="395" stroke="#1d4ed8" stroke-width="3"/><circle cx="115" cy="395" r="5" fill="#1d4ed8"/><path d="M134,389l6,6 -6,6 -6,-6z" fill="#a14609"/><text x="105" y="417" text-anchor="end">a</text><text x="142" y="382" >b</text><text x="225" y="340" >m=1</text><text x="225" y="365" >D=0.2</text><text x="225" y="445" >損失 0.64</text><text x="16" y="511" >標籤 y=0；圓為 margin 邊界</text><text x="16" y="534" >P03：不相似，分開</text><circle cx="115" cy="635" r="95" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="5 4" /><line x1="16" y1="635" x2="338" y2="635" class="grid"/><line x1="115" y1="540" x2="115" y2="730" class="grid"/><line x1="115" y1="635" x2="229" y2="635" stroke="#1d4ed8" stroke-width="3"/><circle cx="115" cy="635" r="5" fill="#1d4ed8"/><path d="M229,629l6,6 -6,6 -6,-6z" fill="#a14609"/><text x="105" y="657" text-anchor="end">a</text><text x="237" y="622" >b</text><text x="225" y="580" >m=1</text><text x="225" y="605" >D=1.2</text><text x="225" y="685" >損失 0</text><text x="16" y="751" >標籤 y=0；圓為 margin 邊界</text><text x="16" y="790" >資料：教學合成二維嵌入，單位任意</text></svg>
