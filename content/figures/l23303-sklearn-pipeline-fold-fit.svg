<svg xmlns="http://www.w3.org/2000/svg" width="390" height="778" viewBox="0 0 390 778" role="img" aria-labelledby="title desc" lang="zh-Hant">
<title id="title">Pipeline：逐摺重新學習</title><desc id="desc">交叉驗證每摺複製全新 Pipeline。訓練摺依序執行 scale.fit_transform、select.fit_transform、model.fit；驗證摺依序執行 scale.transform、select.transform、model.predict，再與驗證標籤評分。虛線箭頭表示沿用平均、尺度、特徵清單與已訓練模型，驗證階段不重新 fit。時間及病人分組仍由 splitter 決定。</desc>
<style>
:root{color-scheme:light dark;--bg:#f9fbf9;--ink:#263a45;--muted:#465b66;--train:#006b66;--train-bg:#edf5f4;--val:#9a3c00;--val-bg:#fff0e3;--test:#504ca2;--test-bg:#efedff;--rule:#a5b8bd;--bad:#a33036;--bad-bg:#fff1f0}
@media(prefers-color-scheme:dark){:root{--bg:#15252b;--ink:#e4edf1;--muted:#bbcbd2;--train:#78ded2;--train-bg:#24373d;--val:#ffbf86;--val-bg:#3a2e25;--test:#c7bcff;--test-bg:#363048;--rule:#71868c;--bad:#ffaaa9;--bad-bg:#3d272b}}
text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:var(--ink);font-size:14px}.title{font-size:22px;font-weight:700}.heading{font-size:17px;font-weight:700}.strong{font-weight:700}.note{font-size:13px;fill:var(--muted)}.small{font-size:12px}.code{font-family:Consolas,monospace;font-size:13px}.bg{fill:var(--bg)}.box{fill:var(--bg);stroke:var(--rule);stroke-width:1.3}.train{fill:var(--train-bg);stroke:var(--train);stroke-width:1.4}.val{fill:url(#hatch);stroke:var(--val);stroke-width:1.4;stroke-dasharray:4 2}.test{fill:var(--test-bg);stroke:var(--test);stroke-width:1.5;stroke-dasharray:1 3}.badbox{fill:var(--bad-bg);stroke:var(--bad);stroke-width:1.4}.badtext{fill:var(--bad);font-weight:700}.hb{fill:var(--val-bg)}.hl{stroke:var(--val);stroke-width:1;opacity:.23}.line{stroke:var(--muted);stroke-width:1.4;fill:none;marker-end:url(#arrow)}.learn{stroke:var(--train);stroke-width:1.4;stroke-dasharray:4 3;fill:none;marker-end:url(#learn-arrow)}.leak{stroke:var(--bad);stroke-width:1.6;stroke-dasharray:4 3;fill:none;marker-end:url(#bad-arrow)}.rule{stroke:var(--rule);fill:none}.boundary{fill:none;stroke:var(--train);stroke-width:1.4;stroke-dasharray:5 3}.unused{fill:var(--bg);stroke:var(--rule);stroke-width:1}.cell{font-size:12px;font-weight:700}
</style><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect class="hb" width="8" height="8"/><path class="hl" d="M0 8L8 0"/></pattern><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--muted)"/></marker><marker id="learn-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--train)"/></marker><marker id="bad-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--bad)"/></marker></defs>
<rect class="bg" width="390" height="778" rx="12"/>
<text x="18" y="35" class="title" text-anchor="start">Pipeline：逐摺重新學習</text><text x="18" y="59" class="note" text-anchor="start">教學示意：兩支路，共用同一套已學規則</text><rect x="12" y="78" width="366" height="574" rx="8" class="boundary"/><text x="24" y="107" class="heading" text-anchor="start">每個摺複製一個新的 Pipeline</text><rect x="24" y="126" width="156" height="50" rx="5" class="train"/><text x="102" y="147" class="strong" text-anchor="middle">交叉驗證</text><text x="102" y="166" class="strong" text-anchor="middle">訓練摺</text><rect x="210" y="126" width="156" height="50" rx="5" class="val"/><text x="288" y="147" class="strong" text-anchor="middle">交叉驗證</text><text x="288" y="166" class="strong" text-anchor="middle">驗證摺</text><path d="M102 176V207" class="line"/><path d="M288 176V207" class="line"/><rect x="24" y="210" width="156" height="64" rx="5" class="train"/><text x="102" y="234" class="code" text-anchor="middle">scale.fit_transform</text><text x="102" y="258" class="small" text-anchor="middle">學平均、尺度，再轉換</text><rect x="210" y="210" width="156" height="64" rx="5" class="val"/><text x="288" y="234" class="code" text-anchor="middle">scale.transform</text><text x="288" y="258" class="small" text-anchor="middle">沿用平均、尺度</text><path d="M180 242H208" class="learn"/><rect x="24" y="325" width="156" height="64" rx="5" class="train"/><text x="102" y="349" class="code" text-anchor="middle">select.fit_transform</text><text x="102" y="373" class="small" text-anchor="middle">學特徵清單，再轉換</text><rect x="210" y="325" width="156" height="64" rx="5" class="val"/><text x="288" y="349" class="code" text-anchor="middle">select.transform</text><text x="288" y="373" class="small" text-anchor="middle">沿用特徵清單</text><path d="M180 357H208" class="learn"/><rect x="24" y="440" width="156" height="64" rx="5" class="train"/><text x="102" y="464" class="code" text-anchor="middle">model.fit</text><text x="102" y="488" class="small" text-anchor="middle">學分類器參數</text><rect x="210" y="440" width="156" height="64" rx="5" class="val"/><text x="288" y="464" class="code" text-anchor="middle">model.predict</text><text x="288" y="488" class="small" text-anchor="middle">沿用已訓練分類器</text><path d="M180 472H208" class="learn"/><path d="M102 274V323" class="line"/><path d="M288 274V323" class="line"/><path d="M102 389V438" class="line"/><path d="M288 389V438" class="line"/><path d="M288 504V533" class="line"/><rect x="210" y="536" width="156" height="52" rx="5" class="val"/><text x="288" y="557" class="code" text-anchor="middle">score</text><text x="288" y="577" class="small" text-anchor="middle">預測與驗證標籤比對</text><text x="24" y="624" class="small" text-anchor="start">虛線 → 沿用已學規則；驗證不重新 fit。</text><text x="18" y="684" class="heading" text-anchor="start">下一摺：重新學習全部步驟</text><text x="18" y="712" class="note" text-anchor="start">平均、尺度、特徵清單與模型都重新擬合。</text><path d="M18 729H372" class="rule"/><text x="18" y="757" class="note" text-anchor="start">時間／病人分組仍由 splitter 決定。</text>
</svg>
