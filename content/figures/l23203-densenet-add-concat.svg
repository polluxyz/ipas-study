<svg xmlns="http://www.w3.org/2000/svg" width="360" height="670" viewBox="0 0 360 670" role="img" aria-labelledby="title desc"><title id="title">相加與拼接的同輸入對照</title><desc id="desc">相加維持兩通道，密集拼接變成四通道，第二層再新增兩通道，總共六通道。 教學合成資料，數值由 L23203-E-tensors.json 重建。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#334155"/></marker></defs><rect width="360" height="670" fill="#ffffff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#0f172a"><text x="18" y="29" font-size="17" font-weight="700">相加與拼接的同輸入對照</text><rect x="35" y="63" width="290" height="57" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="47" y="86" font-size="15" font-weight="700">同一個左上位置</text><text x="47" y="108" font-size="14">輸入 X=(1, 4)</text><path d="M180,120 L180,142" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="142" width="290" height="57" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="47" y="165" font-size="15" font-weight="700">第一層 F(X)=0.5X</text><text x="47" y="187" font-size="14">新增特徵 (0.5, 2)</text><text x="18" y="239" font-size="15" font-weight="700">ResNet：逐項相加</text><rect x="35" y="252" width="290" height="57" rx="9" fill="#fef3c7" stroke="#475569"/><text x="47" y="275" font-size="15" font-weight="700">Y=(1.5, 6)</text><text x="18" y="334" font-size="15" font-weight="700">DenseNet：保留特徵，沿通道拼接</text><rect x="35" y="348" width="290" height="57" rx="9" fill="#dcfce7" stroke="#475569"/><text x="47" y="371" font-size="15" font-weight="700">[X,F(X)]=(1, 4, 0.5, 2)</text><text x="47" y="393" font-size="14">2+2=4 通道</text><path d="M180,405 L180,429" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="429" width="290" height="65" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="47" y="452" font-size="15" font-weight="700">第二層讀取全部四通道</text><text x="47" y="474" font-size="14">新增 2 通道：(3.75, 3.75)</text><path d="M180,494 L180,518" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="518" width="290" height="62" rx="9" fill="#dcfce7" stroke="#475569"/><text x="47" y="541" font-size="15" font-weight="700">保留原輸入及兩層新特徵</text><text x="47" y="563" font-size="14">總通道 2+2+2=6</text><text x="18" y="608" font-size="13">只看位置數值；每通道高寬均為 2×2</text><text x="18" y="633" font-size="13">張量數字與第二層細節為補充算例</text><text x="18" y="655" font-size="12">教學示意／合成資料；非成效評估</text></g></svg>
