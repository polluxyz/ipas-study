<svg xmlns="http://www.w3.org/2000/svg" width="360" height="710" viewBox="0 0 360 710" role="img" aria-labelledby="title desc"><title id="title">局部卷積分解與整體縮放</title><desc id="desc">逐通道卷積後還要逐點混合；複合縮放同時考慮深度、寬度與解析度，數字只作成本估算。 教學合成資料，數值由 L23203-E-tensors.json 重建。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#334155"/></marker></defs><rect width="360" height="710" fill="#ffffff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#0f172a"><text x="18" y="29" font-size="17" font-weight="700">局部卷積分解與整體縮放</text><text x="18" y="55" font-size="14">局部：先各通道看空間，再混合通道</text><rect x="35" y="73" width="290" height="45" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="47" y="96" font-size="15" font-weight="700">同一輸入 CHW：3×8×8</text><path d="M180,118 L180,141" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="141" width="290" height="62" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="47" y="164" font-size="15" font-weight="700">逐通道 3×3 卷積</text><text x="47" y="186" font-size="14">3×6×6；27 個權重</text><path d="M180,203 L180,227" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="227" width="290" height="62" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="47" y="250" font-size="15" font-weight="700">逐點 1×1 卷積混合通道</text><text x="47" y="272" font-size="14">2×6×6；6 個權重</text><text x="18" y="321" font-size="14" font-weight="700">分離共 33；標準 54 個無偏置權重</text><text x="18" y="348" font-size="14">卷積 MAC：1188 對 1944</text><text x="18" y="396" font-size="15" font-weight="700">整體：複合縮放一起看三個維度</text><rect x="35" y="416" width="290" height="45" rx="9" fill="#dcfce7" stroke="#475569"/><text x="47" y="439" font-size="15" font-weight="700">深度 d：1.2 倍層數</text><rect x="35" y="475" width="290" height="45" rx="9" fill="#dcfce7" stroke="#475569"/><text x="47" y="498" font-size="15" font-weight="700">寬度 w：1.1 倍通道</text><rect x="35" y="534" width="290" height="45" rx="9" fill="#dcfce7" stroke="#475569"/><text x="47" y="557" font-size="15" font-weight="700">解析度 r：高寬各 1.15 倍</text><text x="18" y="595" font-size="13">φ=1：倍率取原論文搜尋的 α、β、γ</text><text x="18" y="613" font-size="14">一般卷積近似成本 d × w² × r²</text><text x="18" y="639" font-size="14" font-weight="700">代入約 1.92027 倍；不是裝置延遲</text><text x="18" y="670" font-size="13">上、下為可搭配的策略，不互斥</text><text x="18" y="695" font-size="12">教學示意／合成資料；非成效評估</text></g></svg>
