<svg xmlns="http://www.w3.org/2000/svg" width="360" height="472" viewBox="0 0 360 472" role="img" aria-labelledby="title desc"><title id="title">候選到驗證的回饋循環</title><desc id="desc">前三步形成選特徵循環；測試保留到方案固定後，不提供回饋。</desc><rect width="360" height="472" fill="#fff"/><g font-family="sans-serif" fill="#15334c"><text x="180" y="23" text-anchor="middle" font-size="17">候選到驗證的回饋循環</text><rect x="16" y="40" width="328" height="68" rx="9" fill="#edf4fc" stroke="#245b8c"/><text x="180" y="65" text-anchor="middle" font-size="17" font-weight="bold">提出一組候選特徵</text><text x="180" y="89" text-anchor="middle" font-size="14">原始組、全部組或精簡組</text><path d="M180 110v22m-5-6 5 6 5-6" stroke="#245b8c" fill="none" stroke-width="2"/><rect x="16" y="136" width="328" height="68" rx="9" fill="#edf4fc" stroke="#245b8c"/><text x="180" y="161" text-anchor="middle" font-size="17" font-weight="bold">只在訓練部分擬合</text><text x="180" y="185" text-anchor="middle" font-size="14">填補、篩選、模型</text><path d="M180 206v22m-5-6 5 6 5-6" stroke="#245b8c" fill="none" stroke-width="2"/><rect x="16" y="232" width="328" height="68" rx="9" fill="#edf4fc" stroke="#245b8c"/><text x="180" y="257" text-anchor="middle" font-size="17" font-weight="bold">以同一驗證資料比較</text><text x="180" y="281" text-anchor="middle" font-size="14">品質、欄數與運作成本</text><path d="M180 302v22m-5-6 5 6 5-6" stroke="#245b8c" fill="none" stroke-width="2"/><rect x="16" y="328" width="328" height="68" rx="9" fill="#edf4fc" stroke="#245b8c"/><text x="180" y="353" text-anchor="middle" font-size="17" font-weight="bold">回饋下一組候選</text><text x="180" y="377" text-anchor="middle" font-size="14">未勝出 → 回到第一步</text><text x="180" y="459" text-anchor="middle" font-size="14">最終測試：方案固定後才使用</text></g></svg>
