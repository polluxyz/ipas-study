<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="360" height="760" role="img" aria-labelledby="title desc"><title id="title">校準前後的分群可靠度圖</title><desc id="desc">由本組獨立校準擬合集估映射，再以獨立校準稽核集逐桶核對。每桶10筆，橫軸平均分數、縱軸實際正例比例。</desc><defs><marker id="arrow" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="360" height="760" fill="#fff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#172d43"><text x="180" y="24" font-size="16" text-anchor="middle">分桶核對：平均分數與實際比例</text><text x="180" y="58" font-size="16" text-anchor="middle">原始分數</text><path d="M61,295 L296,295" fill="none" stroke="#52657a" stroke-width="2" /><path d="M61,75 L61,295" fill="none" stroke="#52657a" stroke-width="2" /><path d="M61,295 L296,75" fill="none" stroke="#83909d" stroke-width="2" stroke-dasharray="4 4"/><text x="61" y="315" font-size="12" text-anchor="middle">0.0</text><text x="52" y="299" font-size="12" text-anchor="end">0.0</text><text x="178.5" y="315" font-size="12" text-anchor="middle">0.5</text><text x="52" y="189" font-size="12" text-anchor="end">0.5</text><text x="296" y="315" font-size="12" text-anchor="middle">1.0</text><text x="52" y="79" font-size="12" text-anchor="end">1.0</text><text x="185" y="338" font-size="13" text-anchor="middle">平均原始分數</text><text x="8" y="62" font-size="12" text-anchor="start">實際比例</text><circle cx="131.5" cy="251" r="6" fill="#35659b"/><text x="122.5" y="241" font-size="12" text-anchor="end">A n=10</text><circle cx="249" cy="163" r="6" fill="#35659b"/><text x="240" y="153" font-size="12" text-anchor="end">A n=10</text><path d="M131.5,200 l7,7 l-7,7 l-7,-7 z" fill="#a15324"/><text x="122.5" y="197" font-size="12" text-anchor="end">B n=10</text><path d="M249,112 l7,7 l-7,7 l-7,-7 z" fill="#a15324"/><text x="240" y="109" font-size="12" text-anchor="end">B n=10</text><text x="180" y="378" font-size="16" text-anchor="middle">校準後分數</text><path d="M61,615 L296,615" fill="none" stroke="#52657a" stroke-width="2" /><path d="M61,395 L61,615" fill="none" stroke="#52657a" stroke-width="2" /><path d="M61,615 L296,395" fill="none" stroke="#83909d" stroke-width="2" stroke-dasharray="4 4"/><text x="61" y="635" font-size="12" text-anchor="middle">0.0</text><text x="52" y="619" font-size="12" text-anchor="end">0.0</text><text x="178.5" y="635" font-size="12" text-anchor="middle">0.5</text><text x="52" y="509" font-size="12" text-anchor="end">0.5</text><text x="296" y="635" font-size="12" text-anchor="middle">1.0</text><text x="52" y="399" font-size="12" text-anchor="end">1.0</text><text x="185" y="658" font-size="13" text-anchor="middle">平均校準機率</text><text x="8" y="382" font-size="12" text-anchor="start">實際比例</text><circle cx="108" cy="571" r="6" fill="#35659b"/><text x="99" y="561" font-size="12" text-anchor="end">A n=10</text><circle cx="202" cy="483" r="6" fill="#35659b"/><text x="193" y="473" font-size="12" text-anchor="end">A n=10</text><path d="M155,520 l7,7 l-7,7 l-7,-7 z" fill="#a15324"/><text x="146" y="517" font-size="12" text-anchor="end">B n=10</text><path d="M249,432 l7,7 l-7,7 l-7,-7 z" fill="#a15324"/><text x="240" y="429" font-size="12" text-anchor="end">B n=10</text><text x="180" y="720" font-size="12" text-anchor="middle">圓點A／菱形B；虛線為完全吻合的位置</text><text x="180" y="744" font-size="13" text-anchor="middle">教學合成資料；僅驗證有資料的分數</text></g></svg>
