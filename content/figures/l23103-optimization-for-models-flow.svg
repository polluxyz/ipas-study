<svg xmlns="http://www.w3.org/2000/svg" width="360" height="570" viewBox="0 0 360 570" role="img" aria-labelledby="title desc">
<title id="title">預測訓練與對抗交替更新的流程</title><desc id="desc">一般預測固定訓練資料更新參數，再用保留資料評估。GAN 先固定一方、更新另一方，交替進行。</desc>
<rect width="360" height="570" fill="#fff"/>
<g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="15.00" y="25.00" font-size="16" fill="#19324d" text-anchor="start">一般預測：更新同一組參數</text><rect x="35" y="45" width="290" height="40" rx="5" fill="#eaf2fa" stroke="#708aa4"/><text x="180.00" y="71.00" font-size="14" fill="#19324d" text-anchor="middle">訓練資料＋目前參數</text><line x1="180.00" y1="85.00" x2="180.00" y2="105.00" stroke="#6b7c8e" stroke-width="1" stroke-dasharray=""/><text x="180.00" y="104.00" font-size="12" fill="#19324d" text-anchor="middle">▼</text><rect x="35" y="110" width="290" height="40" rx="5" fill="#eaf2fa" stroke="#708aa4"/><text x="180.00" y="136.00" font-size="14" fill="#19324d" text-anchor="middle">產生預測，計算目標</text><line x1="180.00" y1="150.00" x2="180.00" y2="170.00" stroke="#6b7c8e" stroke-width="1" stroke-dasharray=""/><text x="180.00" y="169.00" font-size="12" fill="#19324d" text-anchor="middle">▼</text><rect x="35" y="175" width="290" height="40" rx="5" fill="#eaf2fa" stroke="#708aa4"/><text x="180.00" y="201.00" font-size="14" fill="#19324d" text-anchor="middle">求解或算梯度，更新參數</text><line x1="180.00" y1="215.00" x2="180.00" y2="235.00" stroke="#6b7c8e" stroke-width="1" stroke-dasharray=""/><text x="180.00" y="234.00" font-size="12" fill="#19324d" text-anchor="middle">▼</text><rect x="35" y="240" width="290" height="40" rx="5" fill="#eaf2fa" stroke="#708aa4"/><text x="180.00" y="266.00" font-size="14" fill="#19324d" text-anchor="middle">另用保留資料評估</text><text x="15.00" y="328.00" font-size="16" fill="#19324d" text-anchor="start">GAN：交替更新兩組參數</text><rect x="35" y="350" width="290" height="40" rx="5" fill="#e9f4ee" stroke="#708aa4"/><text x="180.00" y="376.00" font-size="14" fill="#19324d" text-anchor="middle">固定生成器 → 更新鑑別器</text><line x1="180.00" y1="390.00" x2="180.00" y2="410.00" stroke="#6b7c8e" stroke-width="1" stroke-dasharray=""/><text x="180.00" y="409.00" font-size="12" fill="#19324d" text-anchor="middle">▼</text><rect x="35" y="415" width="290" height="40" rx="5" fill="#e9f4ee" stroke="#708aa4"/><text x="180.00" y="441.00" font-size="14" fill="#19324d" text-anchor="middle">固定鑑別器 → 更新生成器</text><line x1="180.00" y1="455.00" x2="180.00" y2="475.00" stroke="#6b7c8e" stroke-width="1" stroke-dasharray=""/><text x="180.00" y="474.00" font-size="12" fill="#19324d" text-anchor="middle">▼</text><rect x="35" y="480" width="290" height="40" rx="5" fill="#e9f4ee" stroke="#708aa4"/><text x="180.00" y="506.00" font-size="14" fill="#19324d" text-anchor="middle">重複交替，檢查訓練狀態</text><text x="15.00" y="552.00" font-size="13" fill="#19324d" text-anchor="start">流程示意；不表示任意設定都會收斂</text></g></svg>