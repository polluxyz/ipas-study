<svg xmlns="http://www.w3.org/2000/svg" width="360" height="574" viewBox="0 0 360 574" role="img" aria-labelledby="title desc"><title id="title">輸入到輸出的簽章稽核</title><desc id="desc">教學合成流程。記錄輸入版本與模型版本；組合輸出摘要與訊息欄位；發送方私鑰簽署完整清單；接收方核對公鑰綁定並驗簽；保存清單、簽章與接收處置。先固定被簽內容的位元組；包含接收者、nonce 與輪次；簽署私鑰只由發送方控制；另查金鑰效期與失陷狀態；受保護日誌接上後續輸出。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker></defs><rect width="360" height="574" fill="#ffffff"/><g fill="#0f172a" font-family="sans-serif"><text x="180" y="30" text-anchor="middle" font-size="19" font-weight="bold">輸入到輸出的簽章稽核</text><rect x="14" y="54" width="332" height="72" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="81" text-anchor="middle" font-size="15">記錄輸入版本與模型版本</text><text x="180" y="106" text-anchor="middle" font-size="13">先固定被簽內容的位元組</text><path d="M180 128v23" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="155" width="332" height="72" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="182" text-anchor="middle" font-size="15">組合輸出摘要與訊息欄位</text><text x="180" y="207" text-anchor="middle" font-size="13">包含接收者、nonce 與輪次</text><path d="M180 229v23" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="256" width="332" height="72" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="283" text-anchor="middle" font-size="15">發送方私鑰簽署完整清單</text><text x="180" y="308" text-anchor="middle" font-size="13">簽署私鑰只由發送方控制</text><path d="M180 330v23" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="357" width="332" height="72" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="384" text-anchor="middle" font-size="15">接收方核對公鑰綁定並驗簽</text><text x="180" y="409" text-anchor="middle" font-size="13">另查金鑰效期與失陷狀態</text><path d="M180 431v23" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="458" width="332" height="72" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="485" text-anchor="middle" font-size="15">保存清單、簽章與接收處置</text><text x="180" y="510" text-anchor="middle" font-size="13">受保護日誌接上後續輸出</text></g><text x="180" y="565" text-anchor="middle" fill="#334155" font-size="12">教學示意；不代表已部署或驗證安全協議</text></svg>
