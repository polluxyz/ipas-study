<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="title desc"><title id="title">固定輸入輸出的深度與寬度比較</title><desc id="desc">輸入2輸出1，隱藏層加寬或加深各增加參數，兩者是不同的架構變化。</desc><rect width="360" height="260" fill="#fff"/><style>path{fill:none}text{font-family:Arial,'Microsoft JhengHei',sans-serif;fill:#172033;font-size:13px} .muted{fill:#485366} .a{stroke:#175d9c;fill:none;stroke-width:2.5}.b{stroke:#ae4d13;fill:none;stroke-width:2.5;stroke-dasharray:6 4}</style><rect x="12" y="18" width="336" height="60" fill="#f1f3f6" rx="6"/><text x="22" y="40">基準：2 → 4 → 1</text><text x="22" y="63">隱藏層 1 層；參數 17 個</text><rect x="12" y="88" width="336" height="60" fill="#f1f3f6" rx="6"/><text x="22" y="110">只加寬：2 → 32 → 1</text><text x="22" y="133">隱藏層 1 層；參數 129 個</text><rect x="12" y="158" width="336" height="60" fill="#f1f3f6" rx="6"/><text x="22" y="180">只加深：2 → 寬4隱藏層×6 → 1</text><text x="22" y="203">隱藏層 6 層；參數 117 個</text><text x="15" y="248">各層含偏差；隱藏激活不另加參數。</text></svg>