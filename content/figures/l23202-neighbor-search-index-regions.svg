<svg xmlns="http://www.w3.org/2000/svg" width="360" height="325" viewBox="0 0 360 325" role="img"><title>區域下界與剪枝</title><desc>教學合成資料。只有區域到查詢點的距離下界超過查詢半徑，才能安全略過。</desc><rect width="360" height="325" fill="#fff"/><g font-family="Microsoft JhengHei, sans-serif" font-size="12" fill="#182b3a"><text x="15" y="20" >半徑查詢：先排除不相交的區域</text><rect x="25" y="45" width="310" height="190" fill="#f5f8fa" stroke="#526878"/><line x1="190.00" y1="45.00" x2="190.00" y2="235.00" stroke="#526878" /><line x1="25.00" y1="145.00" x2="190.00" y2="145.00" stroke="#526878" /><circle cx="90" cy="100" r="42" fill="none" stroke="#b04d16"/><circle cx="90" cy="100" r="4" fill="#b04d16"/><text x="60" y="90" >查詢點 q</text><text x="210" y="100" >整區跳過</text><text x="208" y="120" >最短距離 &gt; r</text><text x="30" y="260" >KD-Tree：沿座標軸切區域</text><text x="30" y="282" >Ball Tree：以球心和半徑包住子集</text><text x="30" y="304" >圖為示意；實際距離由相同資料核對</text></g></svg>