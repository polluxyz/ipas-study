<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 474" role="img"><title>梯度與參數更新的時點</title><desc>每批清梯度、前向、反向、更新的流程；backward 不更新參數，step 不清梯度。</desc><rect width="360" height="474" fill="#fffdf7"/><g font-family="sans-serif" fill="#0f172a" font-size="16"><text x="180" y="30" text-anchor="middle" font-weight="700">梯度與參數更新的時點</text><rect x="12" y="66" width="336" height="62" rx="8" fill="#fef3c7" stroke="#334155"/><text x="180" y="90" text-anchor="middle">zero_grad：清除舊梯度</text><text x="180" y="111" text-anchor="middle">權重維持原值</text><path d="M180 128v22m-5-6 5 6 5-6" fill="none" stroke="#334155" stroke-width="2"/><rect x="12" y="156" width="336" height="62" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="180" y="180" text-anchor="middle">前向：分數與損失</text><text x="180" y="201" text-anchor="middle">依實際執行建立反向路徑</text><path d="M180 218v22m-5-6 5 6 5-6" fill="none" stroke="#334155" stroke-width="2"/><rect x="12" y="246" width="336" height="62" rx="8" fill="#fef3c7" stroke="#334155"/><text x="180" y="270" text-anchor="middle">backward：累積梯度</text><text x="180" y="291" text-anchor="middle">權重尚未更新</text><path d="M180 308v22m-5-6 5 6 5-6" fill="none" stroke="#334155" stroke-width="2"/><rect x="12" y="336" width="336" height="62" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="180" y="360" text-anchor="middle">step：使用梯度更新權重</text><text x="180" y="381" text-anchor="middle">梯度仍在，下批另行清理</text><text x="180" y="459" text-anchor="middle" font-size="12">教學示意；各框架接口需核對版本</text></g></svg>