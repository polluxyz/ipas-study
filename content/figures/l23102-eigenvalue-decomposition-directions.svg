<svg xmlns="http://www.w3.org/2000/svg" width="360" height="435" viewBox="0 0 360 435" role="img" aria-labelledby="title desc"><title id="title">特徵方向的伸縮</title><desc id="desc">對稱矩陣在兩個正交方向上分別伸長三倍與一倍。</desc><rect width="360" height="435" fill="white"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="18" y="28" fill="#4b5563" font-size="16" text-anchor="start">沿特徵方向，只改變伸縮倍數</text><line x1="28" y1="185" x2="332" y2="185" stroke="#9ca3af" stroke-width="2"/><line x1="180" y1="45" x2="180" y2="330" stroke="#9ca3af" stroke-width="2"/><line x1="180" y1="185" x2="291" y2="74" stroke="#175fa5" stroke-width="4"/><circle cx="217" cy="148" r="6" fill="#175fa5"/><circle cx="291" cy="74" r="4" fill="#175fa5"/><line x1="180" y1="185" x2="217" y2="222" stroke="#a4470c" stroke-width="4"/><circle cx="217" cy="222" r="6" fill="#a4470c"/><circle cx="217" cy="222" r="4" fill="#a4470c"/><text x="225" y="62" fill="#175fa5" font-size="16" text-anchor="start">3v₁</text><text x="231" y="165" fill="#175fa5" font-size="16" text-anchor="start">v₁</text><text x="224" y="239" fill="#a4470c" font-size="16" text-anchor="start">Av₂＝1v₂</text><text x="18" y="365" fill="#4b5563" font-size="14" text-anchor="start">A = [[2, 1], [1, 2]]</text><text x="18" y="390" fill="#4b5563" font-size="14" text-anchor="start">v₁=(1, 1)，v₂=(1, -1)</text><text x="18" y="415" fill="#4b5563" font-size="14" text-anchor="start">教學矩陣；座標為無單位分量</text></g></svg>
