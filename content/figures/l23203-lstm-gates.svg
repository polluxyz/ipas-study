<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 590" role="img" aria-labelledby="title desc"><title id="title">LSTM 的細胞與三門</title><desc id="desc">遺忘門保留舊細胞，輸入門控制候選寫入，兩項相加得到新細胞，輸出門再讀出隱藏狀態。</desc><style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#172b4d;font-size:15px} .head{font-size:18px;font-weight:700}.small{font-size:13px}.box{fill:#e8f2ff;stroke:#245b9e;stroke-width:1.5}.memory{fill:#e6f6ec;stroke:#246d42;stroke-width:1.5}.gate{fill:#fff2cf;stroke:#8f6413;stroke-width:1.5}.line{fill:none;stroke:#245b9e;stroke-width:1.8;marker-end:url(#arrow)}.back{fill:none;stroke:#9c3b32;stroke-width:1.8;stroke-dasharray:5 3;marker-end:url(#red)}.mute{fill:#fff;stroke:#687782;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245b9e"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9c3b32"/></marker></defs><rect width="360" height="590" fill="#fff" rx="10"/><text x="180" y="30" text-anchor="middle" class="head">LSTM：保留、寫入、讀出</text><rect x="100" y="55" width="160" height="38" rx="8" class="memory"/><text x="180" y="79" text-anchor="middle" class="">舊細胞 c 前</text><path d="M180 93L180 112" class="line"/><rect x="75" y="116" width="210" height="42" rx="8" class="gate"/><text x="180" y="142" text-anchor="middle" class="">遺忘門 f × 舊細胞</text><path d="M180 158L180 174L350 174L350 276L340 276" class="line"/><rect x="18" y="188" width="145" height="40" rx="8" class="box"/><text x="90.5" y="213" text-anchor="middle" class="">候選內容 g</text><rect x="197" y="188" width="145" height="40" rx="8" class="gate"/><text x="269.5" y="213" text-anchor="middle" class="">輸入門 i</text><path d="M90 228L90 240L87.5 240M270 228L270 240L87.5 240" fill="none" stroke="#245b9e" stroke-width="1.8"/><path d="M87.5 240L87.5 255" class="line"/><rect x="15" y="255" width="145" height="42" rx="8" class="gate"/><text x="87.5" y="281" text-anchor="middle" class="">寫入 i × g</text><path d="M160 276L177 276" class="line"/><rect x="180" y="255" width="160" height="42" rx="8" class="memory"/><text x="260" y="281" text-anchor="middle" class="">保留項＋寫入項</text><path d="M260 297L260 322" class="line"/><rect x="180" y="327" width="160" height="40" rx="8" class="memory"/><text x="260" y="352" text-anchor="middle" class="">新細胞 c</text><path d="M260 367L260 390" class="line"/><rect x="197" y="395" width="127" height="40" rx="8" class="box"/><text x="260.5" y="420" text-anchor="middle" class="">Tanh 轉換</text><rect x="22" y="395" width="130" height="40" rx="8" class="gate"/><text x="87" y="420" text-anchor="middle" class="">輸出門 o</text><path d="M87 435L87 475" class="line"/><path d="M260 435L260 475" class="line"/><rect x="70" y="480" width="220" height="42" rx="8" class="box"/><text x="180" y="506" text-anchor="middle" class="">相乘，得到隱藏狀態 h</text><text x="180" y="553" text-anchor="middle" class="small">三門由當下輸入與舊 h 產生</text><text x="180" y="578" text-anchor="middle" class="small">教學示意；細胞與隱藏狀態分開傳遞</text></svg>
