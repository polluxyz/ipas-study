<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 765" width="360" height="765" role="img" aria-labelledby="title desc"><title id="title">資料特徵與決策融合的三條流程</title><desc id="desc">決策融合放在兩個分支各自輸出預測之後；特徵融合放在共同預測頭之前。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#475569"/></marker></defs><rect width="360" height="765" fill="#ffffff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#172033"><text x="180" y="26" font-size="18" text-anchor="middle">依合併位置區別融合方式</text><text x="180" y="60" font-size="16" text-anchor="middle">資料層：先確認可兼容與同步</text><rect x="15" y="77" width="155" height="40" rx="7" fill="#e7effb" stroke="#334155" /><text x="92.5" y="102" font-size="15" text-anchor="middle">來源甲原始訊號</text><rect x="190" y="77" width="155" height="40" rx="7" fill="#e7effb" stroke="#334155" /><text x="267.5" y="102" font-size="15" text-anchor="middle">來源乙原始訊號</text><path d="M92,119 L138,141" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M267,119 L222,141" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="55" y="145" width="250" height="40" rx="7" fill="#fff1d6" stroke="#334155" /><text x="180" y="170" font-size="15" text-anchor="middle">原始資料合併</text><path d="M180,187 L180,203" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="55" y="207" width="250" height="39" rx="7" fill="#e7effb" stroke="#334155" /><text x="180" y="231.5" font-size="15" text-anchor="middle">共同模型 → 預測</text><text x="180" y="281" font-size="16" text-anchor="middle">特徵層：先各自抽特徵</text><rect x="15" y="298" width="155" height="40" rx="7" fill="#e7effb" stroke="#334155" /><text x="92.5" y="323" font-size="15" text-anchor="middle">照片 → CNN</text><rect x="190" y="298" width="155" height="40" rx="7" fill="#e7effb" stroke="#334155" /><text x="267.5" y="323" font-size="15" text-anchor="middle">文字／語音 → RNN</text><path d="M92,340 L92,357" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M267,340 L267,357" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="15" y="361" width="155" height="40" rx="7" fill="#e7effb" stroke="#334155" /><text x="92.5" y="386" font-size="15" text-anchor="middle">影像向量</text><rect x="190" y="361" width="155" height="40" rx="7" fill="#e7effb" stroke="#334155" /><text x="267.5" y="386" font-size="15" text-anchor="middle">序列向量</text><path d="M92,403 L138,423" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M267,403 L222,423" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="55" y="427" width="250" height="40" rx="7" fill="#fff1d6" stroke="#334155" /><text x="180" y="452" font-size="15" text-anchor="middle">融合層 → 共同預測頭</text><text x="180" y="505" font-size="16" text-anchor="middle">決策層：先各自完成預測</text><rect x="15" y="522" width="155" height="40" rx="7" fill="#e7effb" stroke="#334155" /><text x="92.5" y="547" font-size="15" text-anchor="middle">圖片模型＋預測頭</text><rect x="190" y="522" width="155" height="40" rx="7" fill="#e7effb" stroke="#334155" /><text x="267.5" y="547" font-size="15" text-anchor="middle">文字模型＋預測頭</text><path d="M92,564 L92,580" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M267,564 L267,580" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="15" y="584" width="155" height="40" rx="7" fill="#e7effb" stroke="#334155" /><text x="92.5" y="609" font-size="15" text-anchor="middle">同一正類的機率</text><rect x="190" y="584" width="155" height="40" rx="7" fill="#e7effb" stroke="#334155" /><text x="267.5" y="609" font-size="15" text-anchor="middle">同一正類的機率</text><path d="M92,626 L138,648" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M267,626 L222,648" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="55" y="652" width="250" height="40" rx="7" fill="#fff1d6" stroke="#334155" /><text x="180" y="677" font-size="15" text-anchor="middle">加權／投票 → 最終決策</text><text x="180" y="723" font-size="14" text-anchor="middle">此處晚期融合指決策融合</text><text x="180" y="748" font-size="13" text-anchor="middle">示意圖；正類固定為「需人工複核」</text></g></svg>
