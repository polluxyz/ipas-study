<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 627" role="img"><title>主動學習的標註迴圈</title><desc>模型只排序未標註的訓練候選池，人員提供新標籤，再重訓並重新打分。驗證與測試資料留在迴圈外。</desc><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;font-size:14px;fill:#142c45}.heading{font-size:17px;font-weight:700}.axis{stroke:#65798d;fill:none}.old{stroke:#67788c;stroke-dasharray:5 4;fill:none;stroke-width:2}.new{stroke:#006e77;fill:none;stroke-width:3}.box{fill:#eff6fa;stroke:#55758b;stroke-width:1.5}.arrow{stroke:#526d82;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#526d82"/></marker></defs><rect width="360" height="627" rx="12" fill="#fff"/><text x="18" y="30" class="heading">先選哪筆，再請人標註</text><rect class="box" x="20" y="53" width="300" height="82" rx="8"/><text x="35" y="84" class="heading">已標註訓練資料</text><text x="35" y="112">起始 8 筆，訓練第一版模型</text><path class="arrow" d="M170 135V160"/><rect class="box" x="20" y="166" width="300" height="82" rx="8"/><text x="35" y="197" class="heading">未標註訓練候選池</text><text x="35" y="225">起始 8 筆，由模型重新打分</text><path class="arrow" d="M170 248V273"/><rect class="box" x="20" y="279" width="300" height="82" rx="8"/><text x="35" y="310" class="heading">選樣 → 人工標註</text><text x="35" y="338">每批 2 筆；新增預算共 4 筆</text><path class="arrow" d="M170 361V386"/><rect class="box" x="20" y="392" width="300" height="82" rx="8"/><text x="35" y="423" class="heading">加入已標註集並重訓</text><text x="35" y="451">移除已選樣本，下一批重新計分</text><path class="arrow" d="M320 433H342V94H326"/><text x="18" y="526">預算用完或獨立驗證不再改善，就停下</text><text x="18" y="556">驗證4筆、測試4筆：都不進候選池</text><text x="18" y="587">增樣：產生訓練變體；選樣：取得新答案</text><text x="18" y="612">來源：本組教學合成流程</text></svg>
