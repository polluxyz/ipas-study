<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 429" role="img" aria-labelledby="title desc"><title id="title">三種長序列策略</title><desc id="desc">局部連鄰近；稀疏模式增加指定全域點；近似模式將鍵值彙整再供查詢使用，並非刪去所有遠距位置。 教學示意圖。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#425c74"/></marker></defs><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#172b40;font-size:14px} .small{font-size:12px}.box{fill:#edf5fc;stroke:#356b98;stroke-width:1.5}.alt{fill:#fff3da;stroke:#946715;stroke-width:1.5}.line{fill:none;stroke:#425c74;stroke-width:1.5;marker-end:url(#arrow)}</style><rect width="360" height="429" rx="10" fill="#fff"/><text x="180" y="26" text-anchor="middle" class="">局部：讀取鄰近位置</text><rect x="15" y="47" width="95" height="34" rx="7" class="box"/><text x="62.5" y="69" text-anchor="middle" class="">位置甲</text><rect x="130" y="47" width="95" height="34" rx="7" class="box"/><text x="177.5" y="69" text-anchor="middle" class="">位置乙</text><rect x="245" y="47" width="95" height="34" rx="7" class="box"/><text x="292.5" y="69" text-anchor="middle" class="">位置丙</text><path class="line" d="M110 58L127 58"/><path class="line" d="M225 58L242 58"/><path class="line" d="M130 72L113 72"/><path class="line" d="M245 72L228 72"/><text x="180" y="107" text-anchor="middle" class="small">雙向鄰近且含自身；遠距經多層</text><text x="180" y="143" text-anchor="middle" class="">稀疏：局部＋指定全域點</text><rect x="125" y="157" width="110" height="34" rx="7" class="alt"/><text x="180" y="179" text-anchor="middle" class="">全域位置</text><rect x="20" y="214" width="110" height="34" rx="7" class="box"/><text x="75" y="236" text-anchor="middle" class="">局部區段甲</text><rect x="230" y="214" width="110" height="34" rx="7" class="box"/><text x="285" y="236" text-anchor="middle" class="">局部區段乙</text><path class="line" d="M149 191L92 211"/><path class="line" d="M210 191L268 211"/><path class="line" d="M81 214L135 193"/><path class="line" d="M279 214L227 193"/><text x="180" y="287" text-anchor="middle" class="">近似：不必建立完整配對矩陣</text><rect x="15" y="305" width="110" height="40" rx="7" class="box"/><text x="70" y="330" text-anchor="middle" class="">所有鍵和值</text><path class="line" d="M125 325L148 325"/><rect x="153" y="305" width="94" height="40" rx="7" class="alt"/><text x="200" y="330" text-anchor="middle" class="">特徵彙整</text><path class="line" d="M247 325L269 325"/><rect x="274" y="305" width="73" height="40" rx="7" class="box"/><text x="310.5" y="330" text-anchor="middle" class="">查詢</text><text x="180" y="381" text-anchor="middle" class="small">保留全域作用；仍須驗證近似誤差</text><text x="180" y="420" text-anchor="middle" class="small">教學合成資料／示意圖</text></svg>
