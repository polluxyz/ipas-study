<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" role="img" aria-labelledby="title desc"><title id="title">數值精度與位元預算</title><desc id="desc">FP32 每值用32位元，INT8每值用8位元；低精度使用較少格點，靠尺度和零點近似原值。圖只示意表示方法，不是準確率對比。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#475569"/></marker></defs><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#172554;font-size:14px}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}.alt{fill:#f0fdf4;stroke:#15803d;stroke-width:1.5}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:1.5}.line{fill:none;stroke:#475569;stroke-width:1.5;marker-end:url(#arrow)}</style><rect width="360" height="300" fill="white"/><text x="180" y="25" text-anchor="middle">同一個數值，表示方式改變</text><rect x="20" y="45" width="320" height="54" rx="8" class="box"/><text x="180" y="69" text-anchor="middle">FP32：每值 32 位元</text><path d="M180 99L180 135" class="line"/><rect x="90" y="137" width="180" height="54" rx="8" class="alt"/><text x="180" y="161" text-anchor="middle">INT8：每值 8 位元</text><text x="180" y="224" text-anchor="middle">尺度與零點把整數映回近似原值</text><text x="180" y="251" text-anchor="middle">捨入或超界都可能造成誤差</text><text x="180" y="290" text-anchor="middle" style="font-size:12px;fill:#475569">教學示意圖</text></svg>
