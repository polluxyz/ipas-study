<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 442" role="img" aria-labelledby="title desc"><title id="title">先排序與匹配，再累計與平均</title><desc id="desc">固定規則後按偵測信心排序：IoU 門檻、類別與影格先固定；依序匹配並累計 TP／FP：每個真值只用一次，同時形成 PR；單類別 PR → AP：沿召回率積分精確率包絡；同領域、同協定 AP → mAP：平均各類別，不平均每個框的 IoU；教學合成資料</desc><rect width="360" height="442" fill="#fff"/><g font-family="sans-serif"><text x="16" y="26" font-size="19" fill="#17243b">先排序與匹配，再累計與平均</text><rect x="16" y="44" width="328" height="62" rx="8" fill="#eef4fa" stroke="#456783"/><text x="28" y="69" font-size="17" fill="#17243b">固定規則後按偵測信心排序</text><text x="28" y="92" font-size="15" fill="#17243b">IoU 門檻、類別與影格先固定</text><text x="171" y="126" font-size="20" fill="#17243b">↓</text><rect x="16" y="132" width="328" height="62" rx="8" fill="#eef4fa" stroke="#456783"/><text x="28" y="157" font-size="17" fill="#17243b">依序匹配並累計 TP／FP</text><text x="28" y="180" font-size="15" fill="#17243b">每個真值只用一次，同時形成 PR</text><text x="171" y="214" font-size="20" fill="#17243b">↓</text><rect x="16" y="220" width="328" height="62" rx="8" fill="#eef4fa" stroke="#456783"/><text x="28" y="245" font-size="17" fill="#17243b">單類別 PR → AP</text><text x="28" y="268" font-size="15" fill="#17243b">沿召回率積分精確率包絡</text><text x="171" y="302" font-size="20" fill="#17243b">↓</text><rect x="16" y="308" width="328" height="62" rx="8" fill="#eef4fa" stroke="#456783"/><text x="28" y="333" font-size="17" fill="#17243b">同領域、同協定 AP → mAP</text><text x="28" y="356" font-size="15" fill="#17243b">平均各類別，不平均每個框的 IoU</text><text x="16" y="412" font-size="14" fill="#17243b">圖中流程是教學 AP 約定</text></g></svg>
