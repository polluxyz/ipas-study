<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" role="img" aria-labelledby="title desc"><title id="title">編碼器與解碼器的資料流</title><desc id="desc">編碼器自注意力與 FFN 輸出給解碼器跨注意力的鍵和值；目標前綴先經遮罩自注意力提出查詢；圖示原始架構各子層附殘差和 LayerNorm。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#30445c"/></marker></defs><rect width="360" height="460" fill="#fff"/><g font-family="sans-serif" font-size="14" fill="#18334c"><text x="16" y="24" >編碼器與解碼器的資料流</text><rect x="18" y="55" width="144" height="38" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="90" y="79" text-anchor="middle">來源嵌入＋位置</text><rect x="198" y="55" width="144" height="38" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="270" y="79" text-anchor="middle">目標前綴＋位置</text><path d="M90 94 L90 115" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M270 94 L270 115" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="18" y="118" width="144" height="44" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="90" y="145" text-anchor="middle">多頭自注意力</text><rect x="198" y="118" width="144" height="44" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="270" y="145" text-anchor="middle">遮罩多頭自注意力</text><path d="M90 164 L90 188" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M270 164 L270 188" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="18" y="190" width="144" height="44" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="90" y="217" text-anchor="middle">逐位置 FFN</text><rect x="198" y="190" width="144" height="44" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="270" y="217" text-anchor="middle">跨注意力</text><path d="M163 212 L196 212" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="174" y="198" text-anchor="middle" font-size="12">K,V</text><path d="M270 236 L270 258" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="198" y="260" width="144" height="38" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="270" y="284" text-anchor="middle">逐位置 FFN</text><path d="M270 300 L270 323" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="198" y="325" width="144" height="38" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="270" y="349" text-anchor="middle">詞彙投影＋輸出</text><text x="18" y="280" >左：編碼器一層</text><text x="18" y="308" >右：解碼器一層</text><text x="18" y="395" >各子層附殘差相加與 LayerNorm</text><text x="18" y="420" >輸出詞接回目標前綴，直到結束</text><text x="16" y="448" font-size="12">教學合成資料／示意圖</text></g></svg>
