<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480" role="img" aria-labelledby="title desc"><title id="title">教師到學生的知識傳遞</title><desc id="desc">同一輸入送入固定教師及學生；教師輸出提供學習訊息，學生更新後單獨部署。教師錯誤也可能傳遞。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#475569"/></marker></defs><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#172554;font-size:14px}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}.alt{fill:#f0fdf4;stroke:#15803d;stroke-width:1.5}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:1.5}.line{fill:none;stroke:#475569;stroke-width:1.5;marker-end:url(#arrow)}</style><rect width="360" height="480" fill="white"/><rect x="90" y="12" width="180" height="42" rx="8" class="box"/><text x="180" y="36" text-anchor="middle">同一訓練輸入</text><path d="M130 54L90 90" class="line"/><path d="M230 54L270 90" class="line"/><rect x="10" y="92" width="160" height="64" rx="8" class="box"/><text x="90" y="116" text-anchor="middle">教師模型</text><text x="90" y="137" text-anchor="middle">已訓練好，固定</text><rect x="190" y="92" width="160" height="64" rx="8" class="alt"/><text x="270" y="116" text-anchor="middle">學生模型</text><text x="270" y="137" text-anchor="middle">待學習的較小模型</text><path d="M90 156L90 186" class="line"/><path d="M270 156L270 186" class="line"/><rect x="10" y="188" width="160" height="64" rx="8" class="box"/><text x="90" y="212" text-anchor="middle">教師輸出</text><text x="90" y="233" text-anchor="middle">可能帶有偏誤</text><rect x="190" y="188" width="160" height="64" rx="8" class="alt"/><text x="270" y="212" text-anchor="middle">學生輸出</text><text x="270" y="233" text-anchor="middle">與教師及標籤比較</text><path d="M90 252L130 286" class="line"/><path d="M270 252L230 286" class="line"/><rect x="40" y="288" width="280" height="64" rx="8" class="box"/><text x="180" y="312" text-anchor="middle">計算學生學習目標</text><text x="180" y="333" text-anchor="middle">教師分支不更新；學生更新</text><path d="M180 352L180 380" class="line"/><rect x="40" y="382" width="280" height="64" rx="8" class="alt"/><text x="180" y="406" text-anchor="middle">部署只使用學生</text><text x="180" y="427" text-anchor="middle">重查品質、大小、延遲</text><text x="180" y="470" text-anchor="middle" style="font-size:12px;fill:#475569">教學示意圖</text></svg>
