<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1010" width="360" height="1010" role="img" aria-labelledby="title desc"><title id="title">文字、頻譜、波形與 VITS 的分工</title><desc id="desc">示意：Tacotron 2 逐步預測頻譜，FastSpeech 2 並行預測頻譜，再接聲碼器；VITS 由文字條件與潛在表示生成波形，訓練另有聲音後驗編碼與對抗訊號。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#3a506b"/></marker></defs><rect width="360" height="1010" fill="#fff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="180" y="27" font-size="17" fill="#172033" text-anchor="middle">兩階段合成：先頻譜，再波形</text><rect x="18" y="42" width="324" height="41" rx="8" fill="#edf4ff" stroke="#53657e"/><text x="180" y="67" font-size="15" fill="#172033" text-anchor="middle">文字：請播放安全課程</text><path d="M180 84V107" fill="none" stroke="#3a506b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="18" y="112" width="324" height="64" rx="8" fill="#edf4ff" stroke="#53657e"/><text x="180" y="137" font-size="15" fill="#172033" text-anchor="middle">Tacotron 2：逐步預測頻譜</text><text x="180" y="160" font-size="15" fill="#172033" text-anchor="middle">FastSpeech 2：並行預測頻譜</text><path d="M180 177V201" fill="none" stroke="#3a506b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="18" y="206" width="324" height="64" rx="8" fill="#edf4ff" stroke="#53657e"/><text x="180" y="231" font-size="15" fill="#172033" text-anchor="middle">梅爾頻譜：時間 × 頻率的特徵</text><text x="180" y="254" font-size="15" fill="#172033" text-anchor="middle">是中間表示，不能直接當音檔</text><path d="M180 271V295" fill="none" stroke="#3a506b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="18" y="300" width="324" height="41" rx="8" fill="#edf4ff" stroke="#53657e"/><text x="180" y="325" font-size="15" fill="#172033" text-anchor="middle">聲碼器：聲學特徵 → 波形</text><path d="M180 342V366" fill="none" stroke="#3a506b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="18" y="371" width="324" height="41" rx="8" fill="#eef8ed" stroke="#53657e"/><text x="180" y="396" font-size="15" fill="#172033" text-anchor="middle">波形 → 播放語音</text><text x="180" y="455" font-size="17" fill="#172033" text-anchor="middle">VITS：端到端路徑</text><rect x="18" y="472" width="324" height="64" rx="8" fill="#edf4ff" stroke="#53657e"/><text x="180" y="497" font-size="15" fill="#172033" text-anchor="middle">推論：文字＋語者條件</text><text x="180" y="520" font-size="15" fill="#172033" text-anchor="middle">文字條件先驗 → 潛在表示</text><path d="M180 537V560" fill="none" stroke="#3a506b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="18" y="565" width="324" height="41" rx="8" fill="#eef8ed" stroke="#53657e"/><text x="180" y="590" font-size="15" fill="#172033" text-anchor="middle">波形解碼器 → 可播放語音</text><text x="180" y="650" font-size="17" fill="#172033" text-anchor="middle">訓練分支細節（補充）</text><rect x="18" y="668" width="324" height="64" rx="8" fill="#edf4ff" stroke="#53657e"/><text x="180" y="693" font-size="15" fill="#172033" text-anchor="middle">真實聲音 → 後驗編碼器</text><text x="180" y="716" font-size="15" fill="#172033" text-anchor="middle">取得聲音潛在表示</text><path d="M180 733V756" fill="none" stroke="#3a506b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="18" y="761" width="324" height="64" rx="8" fill="#edf4ff" stroke="#53657e"/><text x="180" y="786" font-size="15" fill="#172033" text-anchor="middle">流模型協調文字與聲音的表示</text><text x="180" y="809" font-size="15" fill="#172033" text-anchor="middle">解碼器生成波形</text><path d="M180 826V849" fill="none" stroke="#3a506b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="18" y="854" width="324" height="64" rx="8" fill="#fff5e7" stroke="#53657e"/><text x="180" y="879" font-size="15" fill="#172033" text-anchor="middle">真實／合成聲音 → 判別器</text><text x="180" y="902" font-size="15" fill="#172033" text-anchor="middle">對抗訊號改善生成；推論不用它</text><text x="180" y="957" font-size="14" fill="#172033" text-anchor="middle">各方塊為架構示意，非聲學實測</text><text x="180" y="981" font-size="14" fill="#172033" text-anchor="middle">自然度、可懂度仍須另外驗收</text></g></svg>
