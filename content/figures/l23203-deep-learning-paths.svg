<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="title desc"><title id="title">特徵由誰決定</title><desc id="desc">兩條流程都要清理輸入，但深度表示與預測器可一起從訓練損失調整。</desc><style>text{font-family:system-ui,sans-serif;font-size:14px;fill:#182b42}.box{fill:#edf4fb;stroke:#24648d;stroke-width:1.5}.line{fill:none;stroke:#24648d;stroke-width:2}.back{fill:none;stroke:#a04435;stroke-width:2;stroke-dasharray:5 3}</style><rect width="360" height="330" fill="#fff"/><text x="180" y="23" text-anchor="middle">兩條建模流程</text><rect class="box" x="14" y="40" width="153" height="60" rx="7"/><text x="90.5" y="62" text-anchor="middle">人工設計特徵</text><text x="90.5" y="81" text-anchor="middle">邊緣、紋理、統計量</text><rect class="box" x="193" y="40" width="153" height="60" rx="7"/><text x="269.5" y="62" text-anchor="middle">清理後的輸入</text><text x="269.5" y="81" text-anchor="middle">像素、數值欄位</text><path class="line" d="M90 100V125m-4 -6l4 6l4 -6"/><path class="line" d="M270 100V125m-4 -6l4 6l4 -6"/><rect class="box" x="14" y="125" width="153" height="60" rx="7"/><text x="90.5" y="147" text-anchor="middle">固定特徵表示</text><text x="90.5" y="166" text-anchor="middle">訓練預測器</text><rect class="box" x="193" y="125" width="153" height="60" rx="7"/><text x="269.5" y="147" text-anchor="middle">可學習的多層表示</text><text x="269.5" y="166" text-anchor="middle">與預測器一起訓練</text><path class="line" d="M90 185V210m-4 -6l4 6l4 -6"/><path class="line" d="M270 185V210m-4 -6l4 6l4 -6"/><rect class="box" x="14" y="210" width="153" height="54" rx="7"/><text x="90.5" y="232" text-anchor="middle">輸出與損失</text><rect class="box" x="193" y="210" width="153" height="54" rx="7"/><text x="269.5" y="232" text-anchor="middle">輸出與損失</text><text x="180" y="297" text-anchor="middle">都需要資料品質與獨立驗證</text><text x="180" y="321" text-anchor="middle" style="font-size:11px">教學合成資料／示意圖</text></svg>
