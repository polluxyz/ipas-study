<svg xmlns="http://www.w3.org/2000/svg" width="360" height="560" viewBox="0 0 360 560" role="img" aria-labelledby="title desc"><title id="title">對話狀態與人工交接</title><desc id="desc">教學示意：辨認需求後追問缺值，確認條件才執行及核對結果；使用者要求人工、反覆澄清失敗或後端錯誤時轉人工。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#172033;font-size:14px}.small{font-size:12px}.title{font-size:17px;font-weight:700}.box{fill:#eff6ff;stroke:#1d4ed8;stroke-width:1.5}.warning{fill:#fff7ed;stroke:#9a3412;stroke-width:1.5}.edge{fill:none;stroke:#334155;stroke-width:1.7;marker-end:url(#arrow)}</style><rect width="360" height="560" fill="#fff"/><text x="180" y="28" text-anchor="middle" class="title">任務對話：確認後才執行</text><rect x="55" y="48" width="250" height="40" rx="8" class="box"/><text x="180" y="73" text-anchor="middle" class="">辨認需求／保留已知條件</text><path d="M180 88V112" class="edge"/><rect x="55" y="114" width="250" height="40" rx="8" class="box"/><text x="180" y="139" text-anchor="middle" class="">缺少欄位：追問並更新狀態</text><path d="M180 154V178" class="edge"/><rect x="55" y="180" width="250" height="40" rx="8" class="box"/><text x="180" y="205" text-anchor="middle" class="">欄位齊全：重述並請確認</text><path d="M180 220V244" class="edge"/><rect x="55" y="246" width="250" height="40" rx="8" class="box"/><text x="180" y="271" text-anchor="middle" class="">已確認：執行並核對後端結果</text><path d="M55 68H25V368H55" class="edge"/><path d="M55 134H25M55 266H25" fill="none" stroke="#334155" stroke-width="1.5"/><text x="180" y="324" text-anchor="middle" class="">任一步達交接條件 → 轉人工</text><rect x="55" y="346" width="250" height="46" rx="8" class="warning"/><text x="180" y="374" text-anchor="middle" class="">交付已確認資訊與卡住步驟</text><text x="180" y="426" text-anchor="middle" class="">交接條件（本組教學規則）</text><text x="180" y="452" text-anchor="middle" class="">要求人工／連續兩次澄清失敗</text><text x="180" y="474" text-anchor="middle" class="">後端失敗／服務權限外承諾</text><text x="180" y="516" text-anchor="middle" class="">開放式對話也需保留前文與監督</text><text x="180" y="544" text-anchor="middle" class="small">資料來源：教學合成對話</text></svg>
