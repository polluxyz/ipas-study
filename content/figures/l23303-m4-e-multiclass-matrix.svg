<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 485" role="img" aria-labelledby="title desc"><title id="title">三類混淆矩陣</title><desc id="desc">列實際、欄預測，三類各十件。刮痕和凹痕雙向混淆共五件。</desc><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#172b4d;font-size:20px}.small{font-size:17px}.value{font-size:27px;font-weight:bold}.axis{font-size:21px;font-weight:bold}</style><rect width="580" height="485" fill="#fff"/><text class="axis" x="300" y="34">預測類別 →</text><text class="axis" x="18" y="82">實際 ↓</text><text x="218" y="82" text-anchor="middle">刮痕</text><text x="115" y="140">刮痕</text><text x="328" y="82" text-anchor="middle">凹痕</text><text x="115" y="220">凹痕</text><text x="438" y="82" text-anchor="middle">良品</text><text x="115" y="300">良品</text><rect x="166" y="100" width="104" height="74" rx="5" fill="#cfe2ff" stroke="#6b7e99"/><text class="value" x="218" y="146" text-anchor="middle">7</text><rect x="276" y="100" width="104" height="74" rx="5" fill="#ffe6b4" stroke="#6b7e99"/><text class="value" x="328" y="146" text-anchor="middle">3</text><rect x="386" y="100" width="104" height="74" rx="5" fill="#f0f3f7" stroke="#6b7e99"/><text class="value" x="438" y="146" text-anchor="middle">0</text><rect x="166" y="180" width="104" height="74" rx="5" fill="#ffe6b4" stroke="#6b7e99"/><text class="value" x="218" y="226" text-anchor="middle">2</text><rect x="276" y="180" width="104" height="74" rx="5" fill="#cfe2ff" stroke="#6b7e99"/><text class="value" x="328" y="226" text-anchor="middle">7</text><rect x="386" y="180" width="104" height="74" rx="5" fill="#ffe6b4" stroke="#6b7e99"/><text class="value" x="438" y="226" text-anchor="middle">1</text><rect x="166" y="260" width="104" height="74" rx="5" fill="#f0f3f7" stroke="#6b7e99"/><text class="value" x="218" y="306" text-anchor="middle">0</text><rect x="276" y="260" width="104" height="74" rx="5" fill="#ffe6b4" stroke="#6b7e99"/><text class="value" x="328" y="306" text-anchor="middle">1</text><rect x="386" y="260" width="104" height="74" rx="5" fill="#cfe2ff" stroke="#6b7e99"/><text class="value" x="438" y="306" text-anchor="middle">9</text><text x="32" y="385">刮痕 → 凹痕：3 件（V08–V10）</text><text x="32" y="420">凹痕 → 刮痕：2 件（V11–V12）</text><text class="small" x="32" y="457">共 30 件；合成評估資料；不能由計數推論原因。</text></svg>
