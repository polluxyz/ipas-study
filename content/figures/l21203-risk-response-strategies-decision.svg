<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" width="360" height="620" role="img" aria-labelledby="title desc"><title id="title">四策略的決策條件</title><desc id="desc">各列是獨立判斷的條件與策略，並無策略之間的先後箭頭。依事件可組合多個策略，共同要求驗證、核准及追蹤。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#324f69"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8" fill="#324f69"/></marker></defs><rect width="360" height="620" fill="#fff"/><g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif"><text x="180" y="27" font-size="18" text-anchor="middle" fill="#162b42">四策略的判斷與追蹤</text><rect x="25" y="47" width="310" height="65" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="180" y="70" font-size="15" text-anchor="middle" fill="#162b42">先確認用途與不可接受的影響</text><text x="180" y="92" font-size="15" text-anchor="middle" fill="#162b42">依條件選擇，可組合策略</text><path d="M180,112 L180,136" stroke="#324f69" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="180" y="159" font-size="14" text-anchor="middle" fill="#162b42">條件 → 對策（各列獨立判斷）</text><rect x="42" y="180" width="293" height="64" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="188.5" y="203" font-size="15" text-anchor="middle" fill="#162b42">不允許或難控制 → 迴避</text><text x="188.5" y="225" font-size="15" text-anchor="middle" fill="#162b42">記錄代價及重新評估條件</text><rect x="42" y="258" width="293" height="64" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="188.5" y="281" font-size="15" text-anchor="middle" fill="#162b42">能降低機率或衝擊 → 緩解</text><text x="188.5" y="303" font-size="15" text-anchor="middle" fill="#162b42">對準來源，驗證效果與副作用</text><rect x="42" y="336" width="293" height="64" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="188.5" y="359" font-size="15" text-anchor="middle" fill="#162b42">有合格保單或契約 → 轉移</text><text x="188.5" y="381" font-size="15" text-anchor="middle" fill="#162b42">確認承擔範圍與殘餘責任</text><rect x="42" y="414" width="293" height="64" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="188.5" y="437" font-size="15" text-anchor="middle" fill="#162b42">殘餘符合核准條件 → 接受</text><text x="188.5" y="459" font-size="15" text-anchor="middle" fill="#162b42">寫下門檻、期限與重評觸發</text><path d="M33,190 L20,190 L20,478 L33,478 M20,334 L10,334 L10,514 L180,514 L180,531" stroke="#324f69" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="25" y="539" width="310" height="65" rx="8" fill="#e9f1f7" stroke="#617a92"/><text x="180" y="562" font-size="15" text-anchor="middle" fill="#162b42">共同要求：驗證、核准與追蹤</text><text x="180" y="584" font-size="15" text-anchor="middle" fill="#162b42">條件改變就回頭重評</text></g></svg>
