<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="title desc"><title id="title">訓練與生成的時間線</title><desc id="desc">上排四個已知右移輸入的條件預測同時算，下排新詞有串接依賴。位置編碼在兩種情境都使用，因果遮罩限制可見目標。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#30445c"/></marker></defs><rect width="360" height="330" fill="#fff"/><g font-family="sans-serif" font-size="14" fill="#18334c"><text x="16" y="24" >訓練與生成的時間線</text><text x="16" y="55" >訓練：答案已知，輸入右移並遮住未來</text><rect x="18" y="78" width="66" height="40" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="51" y="103" text-anchor="middle">位置0</text><rect x="102" y="78" width="66" height="40" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="135" y="103" text-anchor="middle">位置1</text><rect x="186" y="78" width="66" height="40" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="219" y="103" text-anchor="middle">位置2</text><rect x="270" y="78" width="66" height="40" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="303" y="103" text-anchor="middle">位置3</text><text x="16" y="150" >四個條件預測可同時計算</text><text x="16" y="192" >生成：新詞逐步接回前綴</text><rect x="18" y="218" width="66" height="40" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="51" y="243" text-anchor="middle">新詞1</text><path d="M84 238 L102 238" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="102" y="218" width="66" height="40" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="135" y="243" text-anchor="middle">新詞2</text><path d="M168 238 L186 238" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="186" y="218" width="66" height="40" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="219" y="243" text-anchor="middle">新詞3</text><path d="M252 238 L270 238" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="270" y="218" width="66" height="40" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="303" y="243" text-anchor="middle">新詞4</text><text x="16" y="290" >往右前進要先取得前一步生成結果</text><text x="16" y="318" font-size="12">教學合成資料／示意圖</text></g></svg>
