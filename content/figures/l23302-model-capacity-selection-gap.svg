<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">模擬候選的訓練與驗證誤差</title><desc id="desc">分組點圖，不是學習輪次或連續容量曲線；線性、GRU、TCN 的驗證減訓練差距分別為 2、5、5 kWh，數字是固定模擬假設。</desc><style>text{font:14px sans-serif;fill:#172033}line{stroke:#52637a;stroke-width:1.5}.small{font-size:12px}.blue{fill:#12639b}.orange{fill:#a74713}</style><rect width="360" height="360" fill="#fff"/><text x="14" y="23" >固定候選卡的擬合差距（模擬）</text><text x="14" y="45" class="small">橫軸：候選；縱軸：能源 MAE（kWh）</text><line x1="34" y1="70" x2="34" y2="242" /><line x1="34" y1="242" x2="340" y2="242" /><text x="12" y="244" class="small">0</text><text x="12" y="208" class="small">2</text><text x="12" y="172" class="small">4</text><text x="12" y="136" class="small">6</text><text x="12" y="100" class="small">8</text><circle cx="57" cy="132" r="5" fill="#12639b"/><rect x="72" y="91" width="10" height="10" fill="#a74713"/><text x="49" y="264" >線性</text><text x="52" y="122" class="small blue">6</text><text x="72" y="86" class="small orange">8</text><circle cx="170" cy="204" r="5" fill="#12639b"/><rect x="185" y="109" width="10" height="10" fill="#a74713"/><text x="162" y="264" >GRU</text><text x="165" y="194" class="small blue">2</text><text x="185" y="104" class="small orange">7</text><circle cx="283" cy="222" r="5" fill="#12639b"/><rect x="298" y="127" width="10" height="10" fill="#a74713"/><text x="275" y="264" >TCN</text><text x="278" y="212" class="small blue">1</text><text x="298" y="122" class="small orange">6</text><text x="14" y="294" >圓：訓練；方：三摺驗證平均</text><text x="14" y="316" >差距：2、5、5 kWh</text><text x="14" y="338" class="small">候選為類別，排列不代表容量順序</text></svg>