<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 600" width="360" height="600" role="img" aria-labelledby="title desc"><title id="title">主模型與群體辨識對手</title><desc id="desc">教學示意。實線箭頭為資料流；對手輸出群體預測，真實群體標籤從側邊輸入損失。虛線為回傳主模型的抵抗更新訊號，標籤不是對手輸出。</desc><defs><marker id="arrow" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="360" height="600" fill="#fff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#172d43"><rect x="65" y="15" width="230" height="48" rx="8" fill="#edf4ff" stroke="#35659b"/><text x="180" y="39" font-size="14" text-anchor="middle">一般特徵：資格訊號與代理欄</text><path d="M180,63 L180,95" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="95" width="200" height="48" rx="8" fill="#edf4ff" stroke="#35659b"/><text x="180" y="119" font-size="14" text-anchor="middle">主模型：預測資格</text><path d="M180,143 L180,175" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/><rect x="75" y="175" width="210" height="48" rx="8" fill="#edf4ff" stroke="#35659b"/><text x="180" y="199" font-size="14" text-anchor="middle">主模型分數／表示</text><path d="M180,223 L180,260" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="260" width="200" height="48" rx="8" fill="#edf4ff" stroke="#35659b"/><text x="180" y="284" font-size="14" text-anchor="middle">對手：猜敏感群體</text><path d="M180,308 L180,330" fill="none" stroke="#52657a" stroke-width="2" /><path d="M180,330 L272,330" fill="none" stroke="#52657a" stroke-width="2" /><path d="M272,330 L272,350" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/><rect x="10" y="350" width="165" height="70" rx="8" fill="#edf4ff" stroke="#35659b"/><text x="92.5" y="374" font-size="14" text-anchor="middle">真實群體標籤</text><text x="92.5" y="396" font-size="14" text-anchor="middle">受控監督輸入</text><path d="M175,385 L205,385" fill="none" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/><rect x="205" y="350" width="135" height="70" rx="8" fill="#edf4ff" stroke="#35659b"/><text x="272.5" y="374" font-size="14" text-anchor="middle">群體損失</text><text x="272.5" y="396" font-size="14" text-anchor="middle">比較預測與真值</text><path d="M272,420 L272,439" fill="none" stroke="#a15324" stroke-width="2" stroke-dasharray="5 4"/><path d="M272,439 L5,439" fill="none" stroke="#a15324" stroke-width="2" stroke-dasharray="5 4"/><path d="M5,439 L5,119" fill="none" stroke="#a15324" stroke-width="2" stroke-dasharray="5 4"/><path d="M5,119 L80,119" fill="none" stroke="#a15324" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="12" y="474" font-size="14" text-anchor="start">對手：讓群體損失降低（努力猜對）</text><text x="12" y="504" font-size="14" text-anchor="start">主模型：降低任務損失，抵抗群體辨識</text><text x="180" y="547" font-size="13" text-anchor="middle">虛線：回傳抵抗辨識的更新訊號</text><text x="180" y="581" font-size="14" text-anchor="middle">仍須獨立查任務能力與分群錯誤</text></g></svg>
