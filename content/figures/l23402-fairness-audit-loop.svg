<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 702" role="img" aria-labelledby="title desc"><title id="title">公平性稽核與申訴改善閉環</title><desc id="desc">政策、上線與更新審查、日常監控、人工覆核、修正重核和回饋通知形成循環；申訴可在運行中觸發調查。；教學示意圖，非數據圖。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#215674"/></marker></defs><rect width="360" height="702" fill="#fff"/><g font-family="Microsoft JhengHei, sans-serif" fill="#173f56"><text x="180" y="26" text-anchor="middle" font-size="16">公平性稽核與申訴改善閉環</text><rect x="40" y="48" width="280" height="76" rx="10" fill="#ecf9f2" stroke="#215674"/><text x="180" y="76" text-anchor="middle" font-size="18" font-weight="700">1. 政策及具名責任</text><text x="180" y="102" text-anchor="middle" font-size="15">公平目標・接受範圍・負責人</text><path d="M180 125v23" stroke="#215674" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="152" width="280" height="76" rx="10" fill="#e7f2ff" stroke="#215674"/><text x="180" y="180" text-anchor="middle" font-size="18" font-weight="700">2. 新上線及重大更新稽核</text><text x="180" y="206" text-anchor="middle" font-size="15">分群測試・委員會審查</text><path d="M180 229v23" stroke="#215674" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="256" width="280" height="76" rx="10" fill="#ecf9f2" stroke="#215674"/><text x="180" y="284" text-anchor="middle" font-size="18" font-weight="700">3. 日常監控與定期稽核</text><text x="180" y="310" text-anchor="middle" font-size="15">群體差距・真值覆蓋・版本</text><path d="M180 333v23" stroke="#215674" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="360" width="280" height="76" rx="10" fill="#e7f2ff" stroke="#215674"/><text x="180" y="388" text-anchor="middle" font-size="18" font-weight="700">4. 警示或申訴觸發覆核</text><text x="180" y="414" text-anchor="middle" font-size="15">先減輕傷害，再查資料與模型</text><path d="M180 437v23" stroke="#215674" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="464" width="280" height="76" rx="10" fill="#ecf9f2" stroke="#215674"/><text x="180" y="492" text-anchor="middle" font-size="18" font-weight="700">5. 修正與獨立重核</text><text x="180" y="518" text-anchor="middle" font-size="15">新資料復評・保留原始證據</text><path d="M180 541v23" stroke="#215674" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="568" width="280" height="76" rx="10" fill="#e7f2ff" stroke="#215674"/><text x="180" y="596" text-anchor="middle" font-size="18" font-weight="700">6. 通知並持續追蹤</text><text x="180" y="622" text-anchor="middle" font-size="15">回覆申訴者・更新報告及政策</text><path d="M38 644H18V86H36" fill="none" stroke="#215674" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="180" y="686" text-anchor="middle" font-size="14">虛線：依發現回到前面重新檢查</text></g></svg>
