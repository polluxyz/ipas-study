<svg xmlns="http://www.w3.org/2000/svg" width="360" height="500" viewBox="0 0 360 500" role="img"><title>對抗防禦控制點</title><desc>沿網路、輸入、模型與業務輸出追查控制；訓練需反覆重算攻擊。</desc><style>text{font-family:system-ui,"Microsoft JhengHei",sans-serif;font-size:14px;fill:#172554}.small{font-size:12px}.head{font-size:16px;font-weight:bold}rect{stroke:#334155}path{fill:none;stroke:#334155;stroke-width:2}</style><rect x="0" y="0" width="360" height="500" fill="#fff" stroke="none"/><text x="20" y="28" class="head">控制點與模型更新</text><rect x="20" y="48" width="320" height="65" rx="8" fill="#eff6ff"/><text x="34" y="73" class="">網路入口：防火牆／驗證</text><text x="34" y="97" class="small">限制連線與身分，不能直接改分類邊界</text><path d="M180 113v20m-5 -5l5 5 5 -5"/><rect x="20" y="140" width="320" height="65" rx="8" fill="#eff6ff"/><text x="34" y="165" class="">輸入檢查</text><text x="34" y="189" class="small">查格式與像素範圍，合法格式仍可能有害</text><path d="M180 205v20m-5 -5l5 5 5 -5"/><rect x="20" y="232" width="320" height="65" rx="8" fill="#eff6ff"/><text x="34" y="257" class="">模型：對抗訓練後的權重</text><text x="34" y="281" class="small">訓練迴圈：產生有害輸入 → 更新 → 重算</text><path d="M180 297v20m-5 -5l5 5 5 -5"/><rect x="20" y="324" width="320" height="65" rx="8" fill="#eff6ff"/><text x="34" y="349" class="">業務規則／人工覆核</text><text x="34" y="373" class="small">處理高風險輸出，代價是人力與延遲</text><text x="20" y="425" class="">評估：原圖 + 針對新模型重算的攻擊</text><text x="20" y="451" class="">條件：固定幅度、索引及模型版本</text><text x="20" y="477" class="">不同控制分工，沒有單點保證。</text></svg>
