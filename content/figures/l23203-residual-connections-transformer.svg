<svg xmlns="http://www.w3.org/2000/svg" width="360" height="710" viewBox="0 0 360 710" role="img" aria-labelledby="title desc"><title id="title">Transformer 的子層捷徑</title><desc id="desc">注意力子層與前饋子層分別有輸入加回輸出的捷徑，虛線呈現由加號回到子層輸入的梯度路徑；這裡不畫正規化和 Dropout。 教學合成資料，數值由 L23203-E-tensors.json 重建。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#334155"/></marker></defs><rect width="360" height="710" fill="#ffffff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#0f172a"><text x="18" y="29" font-size="17" font-weight="700">Transformer 的子層捷徑</text><text x="18" y="56" font-size="14">形狀：批次 × 詞元 × 特徵</text><rect x="50" y="73" width="270" height="45" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="62" y="96" font-size="15" font-weight="700">子層輸入 X：2×4×8</text><path d="M180,118 L180,154" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="154" width="220" height="45" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="112" y="177" font-size="15" font-weight="700">注意力子層</text><path d="M70,118 L35,118 L35,247 L162,247" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="45" y="145" font-size="13">捷徑</text><path d="M180,199 L180,229" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><circle cx="180" cy="247" r="17" fill="#fef3c7" stroke="#475569"/><text x="174" y="253" font-size="22" font-weight="700">+</text><path d="M180,264 L180,290" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><path d="M164,254 L15,254 L15,92 L50,92" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="50" y="290" width="270" height="45" rx="9" fill="#fef3c7" stroke="#475569"/><text x="62" y="313" font-size="15" font-weight="700">相加結果 Z：2×4×8</text><path d="M180,335 L180,373" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="100" y="373" width="220" height="45" rx="9" fill="#e0f2fe" stroke="#475569"/><text x="112" y="396" font-size="15" font-weight="700">前饋子層</text><path d="M70,335 L35,335 L35,466 L162,466" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="45" y="362" font-size="13">捷徑</text><path d="M180,418 L180,448" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><circle cx="180" cy="466" r="17" fill="#fef3c7" stroke="#475569"/><text x="174" y="472" font-size="22" font-weight="700">+</text><path d="M180,483 L180,510" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><path d="M164,473 L15,473 L15,309 L50,309" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="50" y="510" width="270" height="45" rx="9" fill="#fef3c7" stroke="#475569"/><text x="62" y="533" font-size="15" font-weight="700">相加結果 Y：2×4×8</text><text x="18" y="585" font-size="14">兩次相加各有自己的子層輸入</text><text x="18" y="611" font-size="13">只突出相加；略去正規化與 Dropout</text><text x="18" y="636" font-size="13">形狀數字為補充算例</text><text x="18" y="662" font-size="13">虛線：梯度沿各自捷徑回傳</text><text x="18" y="695" font-size="12">教學示意／合成資料；非成效評估</text></g></svg>
