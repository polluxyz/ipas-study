<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-labelledby="title desc"><title id="title">分類樹的判斷路徑</title><desc id="desc">金融訓練54筆的實測樹；葉節點保留兩類筆數，不能只看類別名稱；資料：教學合成資料。</desc><rect width="360" height="480" fill="#fff"/><g fill="#172c43" font-family="Arial,Microsoft JhengHei,sans-serif"><text x="12" y="24" font-size="17" >深度上限2：實測金融分類樹</text><rect x="30" y="50" width="300" height="58" rx="8" fill="#eaf2fa" stroke="#172c43"/><text x="180" y="84" font-size="14" text-anchor="middle">借款餘額 ≤ 408 千元？</text><line x1="180" y1="108" x2="90" y2="160" stroke="#172c43" /><line x1="180" y1="108" x2="270" y2="160" stroke="#172c43" /><text x="71" y="135" font-size="12" >是</text><text x="280" y="135" font-size="12" >否</text><rect x="6" y="160" width="168" height="65" rx="8" fill="#eaf2fa" stroke="#172c43"/><text x="90" y="197.5" font-size="14" text-anchor="middle">收入 ≤ 45 千元？</text><text x="18" y="250" font-size="13" >節點共 29 筆</text><rect x="186" y="160" width="168" height="65" rx="8" fill="#eaf2fa" stroke="#172c43"/><text x="270" y="197.5" font-size="14" text-anchor="middle">收入 ≤ 75 千元？</text><text x="198" y="250" font-size="13" >節點共 25 筆</text><rect x="4" y="310" width="82" height="50" rx="8" fill="#eaf2fa" stroke="#172c43"/><text x="45" y="340" font-size="14" text-anchor="middle">違約</text><text x="45" y="387" font-size="13" text-anchor="middle">6 / 8</text><text x="45" y="288" font-size="12" text-anchor="middle">是</text><rect x="94" y="310" width="82" height="50" rx="8" fill="#eaf2fa" stroke="#172c43"/><text x="135" y="340" font-size="14" text-anchor="middle">未違約</text><text x="135" y="387" font-size="13" text-anchor="middle">15 / 0</text><text x="135" y="288" font-size="12" text-anchor="middle">否</text><rect x="184" y="310" width="82" height="50" rx="8" fill="#eaf2fa" stroke="#172c43"/><text x="225" y="340" font-size="14" text-anchor="middle">違約</text><text x="225" y="387" font-size="13" text-anchor="middle">0 / 18</text><text x="225" y="288" font-size="12" text-anchor="middle">是</text><rect x="274" y="310" width="82" height="50" rx="8" fill="#eaf2fa" stroke="#172c43"/><text x="315" y="340" font-size="14" text-anchor="middle">違約</text><text x="315" y="387" font-size="13" text-anchor="middle">2 / 5</text><text x="315" y="288" font-size="12" text-anchor="middle">否</text><line x1="90" y1="225" x2="45" y2="310" stroke="#172c43" /><line x1="90" y1="225" x2="135" y2="310" stroke="#172c43" /><line x1="270" y1="225" x2="225" y2="310" stroke="#172c43" /><line x1="270" y1="225" x2="315" y2="310" stroke="#172c43" /><text x="14" y="422" font-size="14" >葉下數字：未違約筆數 / 違約筆數</text><text x="14" y="448" font-size="14" >葉用多數類別；純度與深度共同決定停止</text><text x="12" y="470" font-size="11" >資料：教學合成；固定規則計算</text></g></svg>
