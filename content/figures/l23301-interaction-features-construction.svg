<svg xmlns="http://www.w3.org/2000/svg" width="360" height="345" viewBox="0 0 360 345" role="img" aria-labelledby="title desc"><title id="title">乘積與歷史聚合</title><desc id="desc">上半部以同列單價乘數量，下半部按顧客、前七天與可用時間加總點擊。</desc><rect width="360" height="345" fill="white"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="16" y="28" font-size="18" text-anchor="start" fill="#172b4d">同列乘積：兩欄共同決定</text><rect x="16" y="45" width="328" height="64" rx="8" fill="#eaf2ff" stroke="#94a3b8"/><text x="28" y="71" font-size="16" text-anchor="start" fill="#172b4d">單價 30 元／件 × 數量 2 件</text><text x="28" y="96" font-size="16" text-anchor="start" fill="#172b4d">→ 報價總額 60 元</text><text x="16" y="148" font-size="18" text-anchor="start" fill="#172b4d">歷史聚合：先圈出同一顧客</text><rect x="16" y="164" width="328" height="102" rx="8" fill="#eaf2ff" stroke="#94a3b8"/><text x="28" y="192" font-size="16" text-anchor="start" fill="#172b4d">顧客 A ＋ 前 7 天 ＋ 已入庫</text><text x="28" y="219" font-size="15" text-anchor="start" fill="#172b4d">2 ＋ 4 ＋ 6 ＋ 8 ＋ 10 ＋ 2 ＋ 4</text><text x="28" y="248" font-size="16" text-anchor="start" fill="#172b4d">→ 歷史點擊 36 次</text><text x="16" y="306" font-size="15" text-anchor="start" fill="#172b4d">群組、時間窗與可用時間都要固定</text><text x="16" y="333" font-size="12" text-anchor="start" fill="#172b4d">資料：教學合成資料</text></g></svg>
