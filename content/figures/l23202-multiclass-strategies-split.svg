<svg xmlns="http://www.w3.org/2000/svg" width="360" height="460" viewBox="0 0 360 460" role="img" aria-labelledby="title desc"><title id="title">三類任務的兩種分解</title><desc id="desc">OvR對每類建立一對其餘模型，OvO則對每對類別建立模型。三類時模型數相同但任務不同。</desc><rect width="360" height="460" fill="#fff"/><g fill="#16283a" font-family="sans-serif"><text x="180" y="27" font-size="17" text-anchor="middle">三類任務的兩種分解</text><text x="180" y="63" font-size="16" text-anchor="middle">OvR：每類對其餘</text><rect x="70" y="80" width="220" height="34" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="102" font-size="15" text-anchor="middle">0 對 {1,2}</text><rect x="70" y="126" width="220" height="34" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="148" font-size="15" text-anchor="middle">1 對 {0,2}</text><rect x="70" y="172" width="220" height="34" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="194" font-size="15" text-anchor="middle">2 對 {0,1}</text><text x="180" y="242" font-size="14" text-anchor="middle">比較各模型對該類的分數</text><text x="180" y="280" font-size="16" text-anchor="middle">OvO：每對各比一次</text><rect x="70" y="296" width="220" height="30" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="316" font-size="15" text-anchor="middle">0 對 1</text><rect x="70" y="335" width="220" height="30" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="355" font-size="15" text-anchor="middle">0 對 2</text><rect x="70" y="374" width="220" height="30" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="394" font-size="15" text-anchor="middle">1 對 2</text><text x="180" y="430" font-size="14" text-anchor="middle">整合勝票；平手依既定規則</text><text x="180" y="447" font-size="12" text-anchor="middle">教學合成資料／流程示意</text></g></svg>
