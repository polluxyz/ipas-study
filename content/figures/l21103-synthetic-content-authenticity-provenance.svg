<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 700" width="360" height="700" role="img" aria-labelledby="title desc"><title id="title">合成影音的來源鏈與獨立核驗</title><desc id="desc">上半部為生成新聞、人像、語音到誤導及詐騙的風險；下半部補充來源、同意、製作與發布紀錄，再搭配偵測及官方管道人工確認；來源憑證不保證內容事實。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#3a506b"/></marker></defs><rect width="360" height="700" fill="#fff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="180" y="27" font-size="17" fill="#172033" text-anchor="middle">逼真的內容，也可能誤導行動</text><rect x="18" y="43" width="324" height="64" rx="8" fill="#edf4ff" stroke="#53657e"/><text x="180" y="68" font-size="15" fill="#172033" text-anchor="middle">生成新聞／人像／語音</text><text x="180" y="91" font-size="15" fill="#172033" text-anchor="middle">組合成深偽影音</text><path d="M180 108V129" fill="none" stroke="#3a506b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="18" y="134" width="324" height="64" rx="8" fill="#fff5e7" stroke="#53657e"/><text x="180" y="159" font-size="15" fill="#172033" text-anchor="middle">冒名指令、假報導</text><text x="180" y="182" font-size="15" fill="#172033" text-anchor="middle">詐騙／市場誤導／名譽受損</text><text x="180" y="242" font-size="17" fill="#172033" text-anchor="middle">核驗來源鏈（補充）</text><rect x="18" y="258" width="324" height="64" rx="8" fill="#edf4ff" stroke="#53657e"/><text x="180" y="283" font-size="15" fill="#172033" text-anchor="middle">原始來源與同意</text><text x="180" y="306" font-size="15" fill="#172033" text-anchor="middle">稿本、錄音、音色用途</text><path d="M180 323V345" fill="none" stroke="#3a506b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="18" y="350" width="324" height="64" rx="8" fill="#edf4ff" stroke="#53657e"/><text x="180" y="375" font-size="15" fill="#172033" text-anchor="middle">製作 → 修改 → 發布紀錄</text><text x="180" y="398" font-size="15" fill="#172033" text-anchor="middle">檔案連結、工具、版本與標示</text><path d="M180 415V437" fill="none" stroke="#3a506b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="18" y="442" width="324" height="64" rx="8" fill="#edf4ff" stroke="#53657e"/><text x="180" y="467" font-size="15" fill="#172033" text-anchor="middle">偵測器／來源憑證提供線索</text><text x="180" y="490" font-size="15" fill="#172033" text-anchor="middle">不能單靠分數或標記下結論</text><path d="M180 507V529" fill="none" stroke="#3a506b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="18" y="534" width="324" height="64" rx="8" fill="#eef8ed" stroke="#53657e"/><text x="180" y="559" font-size="15" fill="#172033" text-anchor="middle">從既有官方管道人工確認</text><text x="180" y="582" font-size="15" fill="#172033" text-anchor="middle">查本人、原始證據及交易流程</text><text x="180" y="637" font-size="16" fill="#94351b" text-anchor="middle">未核實 → 暫停轉帳與轉傳</text><text x="180" y="669" font-size="14" fill="#172033" text-anchor="middle">來源紀錄完整 ≠ 每句內容都真實</text></g></svg>
