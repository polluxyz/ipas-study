<svg xmlns="http://www.w3.org/2000/svg" width="360" height="371" viewBox="0 0 360 371" role="img" aria-labelledby="title desc"><title id="title">訓練循環與評估分支</title><desc id="desc">前三格是指引的初始化、互動與更新循環；另接固定策略的評估，避免一面測試一面學習。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#355878"/></marker></defs><rect width="360" height="371" rx="10" fill="#fff"/><g fill="#142c42" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="16" y="27" font-size="18">訓練循環與評估分支</text><rect x="62" y="49" width="236" height="44" rx="8" fill="#eaf2fa" stroke="#355878"/><text x="83" y="77" font-size="15">初始化策略或價值</text><path d="M180 93 L180 114" fill="none" stroke="#355878" stroke-width="2"  marker-end="url(#arrow)"/><rect x="62" y="116" width="236" height="44" rx="8" fill="#eaf2fa" stroke="#355878"/><text x="83" y="144" font-size="15">互動、收集狀態與回饋</text><path d="M180 160 L180 181" fill="none" stroke="#355878" stroke-width="2"  marker-end="url(#arrow)"/><rect x="62" y="183" width="236" height="44" rx="8" fill="#eaf2fa" stroke="#355878"/><text x="83" y="211" font-size="15">更新策略或價值估計</text><path d="M180 227 L180 249" fill="none" stroke="#355878" stroke-width="2"  marker-end="url(#arrow)"/><rect x="62" y="251" width="236" height="44" rx="8" fill="#eaf2fa" stroke="#355878"/><text x="83" y="279" font-size="15">固定版本，另外做評估</text><path d="M62 205 L28 205" fill="none" stroke="#355878" stroke-width="2"  marker-end="url(#arrow)"/><path d="M28 205 L28 138" fill="none" stroke="#355878" stroke-width="2"  marker-end="url(#arrow)"/><path d="M28 138 L62 138" fill="none" stroke="#355878" stroke-width="2"  marker-end="url(#arrow)"/><text x="15" y="183" font-size="13">重複</text><text x="62" y="321" font-size="14">評估：凍結更新，核對整段表現</text><text x="62" y="348" font-size="13">報酬、成功率、穩定性、收斂速度</text></g></svg>
