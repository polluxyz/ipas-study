<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400" role="img" aria-labelledby="title desc"><title id="title">實體到關係三元組</title><desc id="desc">合成短文L01：晴川法院受理星禾公司提出的甲案。法院與公司各有一條有向關係指向甲案，不新增法院與公司間的關係。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#172033;font-size:14px}.small{font-size:12px}.title{font-size:17px;font-weight:700}.box{fill:#eff6ff;stroke:#1d4ed8;stroke-width:1.5}.warning{fill:#fff7ed;stroke:#9a3412;stroke-width:1.5}.edge{fill:none;stroke:#334155;stroke-width:1.7;marker-end:url(#arrow)}</style><rect width="360" height="400" fill="#fff"/><text x="180" y="28" text-anchor="middle" class="title">三個實體，兩條有證據的關係</text><rect x="15" y="65" width="145" height="42" rx="8" class="box"/><text x="87.5" y="91" text-anchor="middle" class="">晴川法院</text><rect x="200" y="65" width="145" height="42" rx="8" class="box"/><text x="272.5" y="91" text-anchor="middle" class="">星禾公司</text><text x="87" y="131" text-anchor="middle" class="small">COURT</text><text x="272" y="131" text-anchor="middle" class="small">ORG</text><path d="M87 144V178L150 227" class="edge"/><path d="M272 144V178L210 227" class="edge"/><text x="72" y="185" text-anchor="middle" class="">受理</text><text x="291" y="185" text-anchor="middle" class="">提出</text><rect x="110" y="231" width="140" height="44" rx="8" class="box"/><text x="180" y="258" text-anchor="middle" class="">甲案</text><text x="180" y="299" text-anchor="middle" class="small">CASE</text><text x="180" y="330" text-anchor="middle" class="">主體 → 關係 → 客體</text><text x="180" y="355" text-anchor="middle" class="small">同句共現不代表任意兩點都有邊</text><text x="180" y="382" text-anchor="middle" class="small">資料來源：教學合成資料L01</text></svg>
