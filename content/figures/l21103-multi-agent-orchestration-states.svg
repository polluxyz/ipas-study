<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 784" role="img" aria-labelledby="title desc"><title id="title">驗收、重試、轉派與人工接手</title><desc id="desc">協調者先派主代理，驗收有效證據即完成。可修正的失敗在額度內重試，主代理額度用完最多轉派備援一次，備援也失敗就由人工接手。 圖資為教學示意。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#355d82"/></marker></defs><style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#16304a;font-size:16px} .small{font-size:14px} .box{fill:#eef5fc;stroke:#355d82;stroke-width:1.5} .gate{fill:#fff4d6;stroke:#8d640a;stroke-width:1.5} .end{fill:#eaf5ee;stroke:#32744b;stroke-width:1.5} .human{fill:#fceee9;stroke:#9a4c32;stroke-width:1.5} .arrow{fill:none;stroke:#355d82;stroke-width:2;marker-end:url(#arrow)}</style><rect width="360" height="784" fill="#fff"/><rect x="55" y="15" width="250" height="54" rx="9" class="box"/><text x="180" y="47" text-anchor="middle">協調者：目標、權限、驗收</text><path d="M180 69 V91" class="arrow"/><rect x="55" y="93" width="250" height="54" rx="9" class="box"/><text x="180" y="125" text-anchor="middle">派工：主代理或備援</text><path d="M180 147 V169" class="arrow"/><rect x="55" y="171" width="250" height="54" rx="9" class="gate"/><text x="180" y="203" text-anchor="middle">工具結果 → 協調者驗收</text><path d="M180 225 V255" class="arrow"/><text class="small" x="190" y="246">通過</text><rect x="55" y="257" width="250" height="44" rx="9" class="end"/><text x="180" y="284" text-anchor="middle">接納證據，停止工具查詢</text><path d="M305 198 H335 V345 H305" class="arrow"/><text class="small" x="309" y="319">拒收</text><rect x="55" y="347" width="250" height="65" rx="9" class="gate"/><text x="180" y="373.5" text-anchor="middle">記錄原因，能自動修正？</text><text x="180" y="395.5" text-anchor="middle">越權、缺條件或衝突 → 人工</text><path d="M305 380 H350 V674 H305" class="arrow"/><text class="small" x="322" y="430">否</text><path d="M180 412 V441" class="arrow"/><text class="small" x="190" y="434">可修正</text><rect x="55" y="443" width="250" height="65" rx="9" class="gate"/><text x="180" y="469.5" text-anchor="middle">該代理仍有重試額度？</text><text x="180" y="491.5" text-anchor="middle">每代理首次加重試共兩次</text><path d="M55 475 H20 V120 H55" class="arrow"/><text class="small" x="24" y="433">有：同代理再試</text><path d="M180 508 V537" class="arrow"/><text class="small" x="190" y="530">無</text><rect x="55" y="539" width="250" height="65" rx="9" class="gate"/><text x="180" y="565.5" text-anchor="middle">尚未轉派且總額度未滿？</text><text x="180" y="587.5" text-anchor="middle">最多轉派一次，總呼叫四次</text><path d="M55 571 H35 V154 H180 V147" class="arrow"/><text class="small" x="41" y="529">是：轉派備援</text><path d="M180 604 V639" class="arrow"/><text class="small" x="190" y="630">否</text><rect x="55" y="641" width="250" height="65" rx="9" class="human"/><text x="180" y="667.5" text-anchor="middle">交人工：原目標、錯誤、</text><text x="180" y="689.5" text-anchor="middle">缺漏、已花預算及接手人</text><text class="small" x="55" y="747">重試不重置總預算；不把未知標成功</text></svg>
