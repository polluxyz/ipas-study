<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 706" role="img" aria-labelledby="title desc"><title id="title">版本晉升與實際部署</title><desc id="desc">整張圖為補充：登錄版本連回實驗與報告，驗證失敗會阻擋，approved不代表已載入。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#416583"/></marker></defs><rect width="360" height="706" fill="#fff"/><g font-family="sans-serif"><text x="180" y="29" text-anchor="middle" font-size="18" fill="#152b40">版本晉升與實際部署</text><rect x="20" y="54" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="80" text-anchor="middle" font-size="16" fill="#152b40">登錄：固定版本與來源</text><text x="180" y="103" text-anchor="middle" font-size="16" fill="#152b40">retail-run-2 → rec-v3</text><path d="M 180 126 L 180 150" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><rect x="20" y="152" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="178" text-anchor="middle" font-size="16" fill="#152b40">驗證標籤 pending</text><text x="180" y="201" text-anchor="middle" font-size="16" fill="#152b40">檢查測試與報告</text><path d="M 180 224 L 180 248" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><rect x="20" y="250" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="276" text-anchor="middle" font-size="16" fill="#152b40">失敗 → rejected，阻擋</text><text x="180" y="299" text-anchor="middle" font-size="16" fill="#152b40">通過 → approved，可發布</text><path d="M 180 322 L 180 346" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><rect x="20" y="348" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="374" text-anchor="middle" font-size="16" fill="#152b40">發布清單指定版本</text><text x="180" y="397" text-anchor="middle" font-size="16" fill="#152b40">別名只是可變的參照</text><path d="M 180 420 L 180 444" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><rect x="20" y="446" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="472" text-anchor="middle" font-size="16" fill="#152b40">部署系統實際載入</text><text x="180" y="495" text-anchor="middle" font-size="16" fill="#152b40">核對指紋、路由與時間</text><path d="M 180 518 L 180 542" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><rect x="20" y="544" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="570" text-anchor="middle" font-size="16" fill="#152b40">失敗事件保留並回復</text><text x="180" y="593" text-anchor="middle" font-size="16" fill="#152b40">rec-v3 → rec-v2</text><text x="180" y="660" text-anchor="middle" font-size="14" fill="#152b40">標籤為教學政策，非通用內建狀態</text><text x="180" y="690" text-anchor="middle" font-size="13" fill="#152b40">教學示意｜非實際部署</text></g></svg>
