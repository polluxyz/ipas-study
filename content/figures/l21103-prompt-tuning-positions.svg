<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-labelledby="title desc"><title id="title">三種更新位置</title><desc id="desc">文字提示不更新參數，軟提示只更新輸入連續向量，完整權重微調更新模型權重。虛線框表示凍結，實線框表示更新。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#344861"/></marker></defs><rect width="360" height="640" fill="#fff"/><g font-family="Noto Sans TC,Microsoft JhengHei,sans-serif"><text x="180" y="28" text-anchor="middle" font-size="15" fill="#172b4d">比較「哪裡被更新」</text><text x="180" y="58" text-anchor="middle" font-size="15" fill="#172b4d">① 文字提示：沒有參數訓練</text><rect x="30" y="72" width="300" height="48" rx="9" fill="#eaf1fa" stroke="#47678f" stroke-width="2" stroke-dasharray="5 3"/><text x="180" y="96" text-anchor="middle" font-size="15" fill="#172b4d">可讀指令＋示例 → 輸入</text><path d="M180 120 L180 140" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="142" width="300" height="48" rx="9" fill="#eaf1fa" stroke="#47678f" stroke-width="2" stroke-dasharray="5 3"/><text x="180" y="166" text-anchor="middle" font-size="15" fill="#172b4d">模型 W：凍結</text><text x="180" y="230" text-anchor="middle" font-size="15" fill="#172b4d">② 軟提示：訓練輸入端 P</text><rect x="30" y="245" width="300" height="68" rx="9" fill="#fff3d6" stroke="#9b6413" stroke-width="2" /><text x="180" y="269" text-anchor="middle" font-size="15" fill="#172b4d">可學 P：4×6 向量</text><text x="180" y="291" text-anchor="middle" font-size="15" fill="#172b4d">接在原文字嵌入前</text><path d="M180 313 L180 334" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="336" width="300" height="48" rx="9" fill="#eaf1fa" stroke="#47678f" stroke-width="2" stroke-dasharray="5 3"/><text x="180" y="360" text-anchor="middle" font-size="15" fill="#172b4d">模型 W、原詞嵌入：凍結</text><text x="180" y="425" text-anchor="middle" font-size="15" fill="#172b4d">③ 完整權重微調：訓練 W</text><rect x="30" y="440" width="300" height="48" rx="9" fill="#eaf1fa" stroke="#47678f" stroke-width="2" stroke-dasharray="5 3"/><text x="180" y="464" text-anchor="middle" font-size="15" fill="#172b4d">任務輸入＋理想答案</text><path d="M180 488 L180 510" stroke="#344861" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="512" width="300" height="48" rx="9" fill="#fff3d6" stroke="#9b6413" stroke-width="2" /><text x="180" y="536" text-anchor="middle" font-size="15" fill="#172b4d">模型 W：更新</text><text x="180" y="597" text-anchor="middle" font-size="14" fill="#172b4d">虛線＝凍結；實線暖色＝更新</text><text x="180" y="624" text-anchor="middle" font-size="13" fill="#172b4d">教學示意；非模型實測</text></g></svg>
