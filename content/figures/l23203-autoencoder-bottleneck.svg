<svg xmlns="http://www.w3.org/2000/svg" width="360" height="410" viewBox="0 0 360 410" role="img" aria-labelledby="title desc"><title id="title">自編碼器的瓶頸重建路徑</title><desc id="desc">四維輸入經編碼成二維，再解碼回四維；損失比較輸入和重建，不是類別。教學示意。</desc><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#18243a;font-size:14px}.small{font-size:12px}.heading{font-size:17px;font-weight:700}.box{fill:#eef3fa;stroke:#50647e;stroke-width:1.5}.arrow{stroke:#50647e;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#50647e"/></marker></defs><rect width="360" height="410" fill="#fff"/><text class="heading" x="20" y="28">從輸入回到輸入的維度</text><rect class="box" x="35" y="48" width="290" height="60" rx="10"/><text x="180" y="72" text-anchor="middle">輸入 x：4 個感測讀值</text><text class="small" x="180" y="93" text-anchor="middle">目標：保留正常訊號的結構</text><path class="arrow" d="M180 110V136"/><rect class="box" x="35" y="144" width="290" height="60" rx="10"/><text x="180" y="168" text-anchor="middle">編碼器 → 瓶頸 z：2 個值</text><text class="small" x="180" y="189" text-anchor="middle">有限容量，不能隨意逐值照搬</text><path class="arrow" d="M180 206V232"/><rect class="box" x="35" y="240" width="290" height="60" rx="10"/><text x="180" y="264" text-anchor="middle">解碼器 → 重建 x̂：4 個值</text><text class="small" x="180" y="285" text-anchor="middle">與 x 比較，計算重建損失</text><text x="20" y="337">標準重建：輸入 x → 目標 x</text><text x="20" y="365">去噪訓練：受擾輸入 → 乾淨目標</text><text class="small" x="20" y="394">教學示意；圖中維度採本組共用例子。</text></svg>