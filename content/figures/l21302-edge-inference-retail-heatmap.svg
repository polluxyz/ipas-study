<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">零售區域停留熱點圖</title><desc id="desc">依同一批二十四筆影格的區域與停留秒數彙整；區域零最久，深淺只表示停留時間。</desc><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#142c40;font-size:14px}.h{font-size:17px;font-weight:700}.s{font-size:12px}.box{fill:#edf6fb;stroke:#266080;stroke-width:1.5}.arrow{fill:none;stroke:#266080;stroke-width:2}</style><rect width="360" height="360" fill="#fff"/><text x="16" y="28" class="h">零售：位置與停留轉為熱點圖</text><rect x="16" y="50" width="160" height="100" rx="8" fill="hsl(25 85% 65%)" stroke="#714b27"/><text x="30" y="79" class="h">區域 0</text><text x="30" y="107" class="">30 秒</text><text x="30" y="131" class="s">6 筆逐影格紀錄</text><rect x="184" y="50" width="160" height="100" rx="8" fill="hsl(25 85% 77%)" stroke="#714b27"/><text x="198" y="79" class="h">區域 1</text><text x="198" y="107" class="">18 秒</text><text x="198" y="131" class="s">6 筆逐影格紀錄</text><rect x="16" y="160" width="160" height="100" rx="8" fill="hsl(25 85% 80%)" stroke="#714b27"/><text x="30" y="189" class="h">區域 2</text><text x="30" y="217" class="">15 秒</text><text x="30" y="241" class="s">6 筆逐影格紀錄</text><rect x="184" y="160" width="160" height="100" rx="8" fill="hsl(25 85% 86%)" stroke="#714b27"/><text x="198" y="189" class="h">區域 3</text><text x="198" y="217" class="">9 秒</text><text x="198" y="241" class="s">6 筆逐影格紀錄</text><text x="16" y="290" class="s">總停留 72 秒；越深表示累積越久。</text><text x="16" y="315" class="s">固定區域示意；不代表真實店鋪格局。</text><text x="16" y="340" class="s">資料：L21302-B 教學合成紀錄，非實測。</text></svg>
