<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 325" role="img" aria-labelledby="title desc"><title id="title">正規化先找統計軸</title><desc id="desc">左邊實線框為單筆特徵內的 LayerNorm；右邊虛線框為二維 Batch Normalization 跨樣本統計。序列 LayerNorm(d) 固定樣本和位置沿最後特徵軸計算。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#30445c"/></marker></defs><rect width="360" height="325" fill="#fff"/><g font-family="sans-serif" font-size="14" fill="#18334c"><text x="16" y="24" >正規化先找統計軸</text><text x="18" y="57" >左：LN 每列特徵；右：二維 BN 每欄</text><rect x="18" y="82" width="60" height="40" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="48" y="107" text-anchor="middle">x11</text><rect x="88" y="82" width="60" height="40" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="118" y="107" text-anchor="middle">x12</text><rect x="18" y="137" width="60" height="40" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="48" y="162" text-anchor="middle">x21</text><rect x="88" y="137" width="60" height="40" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="118" y="162" text-anchor="middle">x22</text><rect x="195" y="82" width="60" height="40" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="225" y="107" text-anchor="middle">x11</text><rect x="265" y="82" width="60" height="40" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="295" y="107" text-anchor="middle">x12</text><rect x="195" y="137" width="60" height="40" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="225" y="162" text-anchor="middle">x21</text><rect x="265" y="137" width="60" height="40" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="295" y="162" text-anchor="middle">x22</text><rect x="14" y="78" width="138" height="48" fill="none" stroke="#147d64" stroke-width="3"/><rect x="14" y="133" width="138" height="48" fill="none" stroke="#147d64" stroke-width="3"/><rect x="191" y="78" width="68" height="103" fill="none" stroke="#855d17" stroke-dasharray="5 3" stroke-width="3"/><rect x="261" y="78" width="68" height="103" fill="none" stroke="#855d17" stroke-dasharray="5 3" stroke-width="3"/><text x="18" y="218" >序列張量：N × L × d</text><text x="18" y="249" >LN(d)：固定 N、L，沿 d 算統計</text><text x="18" y="280" >二維 BN：固定特徵欄，沿 N 統計</text><text x="16" y="313" font-size="12">教學合成資料／示意圖</text></g></svg>
