<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="title desc"><title id="title">內容與位置分開，再逐維相加</title><desc id="desc">詞嵌入跟著字詞移動，位置向量留在格子中，二者逐維相加；原句及換序句使用相同位置零和一。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#30445c"/></marker></defs><rect width="360" height="330" fill="#fff"/><g font-family="sans-serif" font-size="14" fill="#18334c"><text x="16" y="24" >內容與位置分開，再逐維相加</text><text x="16" y="57" >原序：</text><rect x="18" y="75" width="144" height="42" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="90" y="101" text-anchor="middle">客戶嵌入＋位置0</text><rect x="198" y="75" width="144" height="42" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="270" y="101" text-anchor="middle">退款嵌入＋位置1</text><text x="16" y="152" >換序：</text><rect x="18" y="170" width="144" height="42" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="90" y="196" text-anchor="middle">退款嵌入＋位置0</text><rect x="198" y="170" width="144" height="42" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="270" y="196" text-anchor="middle">客戶嵌入＋位置1</text><text x="18" y="255" >詞嵌入：內容；位置向量：順序</text><text x="18" y="285" >位置由格子決定，不由詞彙 ID 決定</text><text x="16" y="318" font-size="12">教學合成資料／示意圖</text></g></svg>
