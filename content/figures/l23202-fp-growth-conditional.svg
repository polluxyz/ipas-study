<svg xmlns="http://www.w3.org/2000/svg" width="360" height="390" viewBox="0 0 360 390" role="img" aria-labelledby="title desc"><title id="title">以C為後綴的條件挖掘</title><desc id="desc">C的條件模式基BA權重2、B權重2、空權重1；條件樹B4下A2，得到BC4、AC2、ABC2。</desc><rect width="360" height="390" fill="#fff"/><g fill="#16283a" font-family="sans-serif"><text x="180" y="27" font-size="17" text-anchor="middle">以C為後綴的條件挖掘</text><rect x="65" y="53" width="230" height="32" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="74" font-size="15" text-anchor="middle">BA：2</text><rect x="65" y="96" width="230" height="32" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="117" font-size="15" text-anchor="middle">B：2</text><rect x="65" y="139" width="230" height="32" rx="8" fill="#edf3fa" stroke="#526577"/><text x="180" y="160" font-size="15" text-anchor="middle">空前綴：1</text><text x="180" y="208" font-size="14" text-anchor="middle">空前綴只計入C本身</text><rect x="80" y="232" width="80" height="36" rx="8" fill="#edf3fa" stroke="#526577"/><text x="120" y="255" font-size="15" text-anchor="middle">B:4</text><path d="M160 250L220 250" stroke="#526577" stroke-width="2" fill="none"/><rect x="220" y="232" width="80" height="36" rx="8" fill="#edf3fa" stroke="#526577"/><text x="260" y="255" font-size="15" text-anchor="middle">A:2</text><text x="180" y="302" font-size="14" text-anchor="middle">條件樹：共用B前綴，再接到A</text><text x="180" y="340" font-size="16" text-anchor="middle">BC:4　AC:2　ABC:2</text><text x="180" y="377" font-size="12" text-anchor="middle">教學合成資料／流程示意</text></g></svg>
