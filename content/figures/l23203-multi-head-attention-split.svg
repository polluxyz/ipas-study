<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 385" role="img" aria-labelledby="title desc"><title id="title">多頭沿特徵軸拆合</title><desc id="desc">同一個兩位置二維輸入經兩組一維子空間注意力，再沿特徵拼接成兩維，最後右乘輸出矩陣。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#30445c"/></marker></defs><rect width="360" height="385" fill="#fff"/><g font-family="sans-serif" font-size="14" fill="#18334c"><text x="16" y="24" >多頭沿特徵軸拆合</text><rect x="80" y="52" width="200" height="38" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="180" y="76" text-anchor="middle">輸入：2 位置 × 2 特徵</text><path d="M140 92 L90 122" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M220 92 L270 122" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="18" y="125" width="144" height="45" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="90" y="152.5" text-anchor="middle">頭 1：2×1</text><rect x="198" y="125" width="144" height="45" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="270" y="152.5" text-anchor="middle">頭 2：2×1</text><path d="M90 171 L140 220" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M270 171 L220 220" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="80" y="223" width="200" height="38" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="180" y="247" text-anchor="middle">特徵拼接：2×2</text><path d="M180 263 L180 280" stroke="#30445c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="80" y="283" width="200" height="38" rx="6" fill="#eef5ff" stroke="#315e8c"/><text x="180" y="307" text-anchor="middle">輸出投影 Wo：2×2</text><text x="20" y="351" >各頭有自己的權重，皆保留兩位置</text><text x="16" y="373" font-size="12">教學合成資料／示意圖</text></g></svg>
