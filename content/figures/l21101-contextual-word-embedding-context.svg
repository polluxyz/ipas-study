<svg xmlns="http://www.w3.org/2000/svg" width="360" height="465" viewBox="0 0 360 465" role="img" aria-labelledby="title desc"><title id="title">相同詞與不同語境</title><desc id="desc">B01 與 R01 共用 bank 詞位；固定查表相同，語境型表示依各句產生。向量為手設示意。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs><rect width="360" height="465" fill="#ffffff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#172b4d"><text x="180" y="30" font-size="16" text-anchor="middle">相同拼字 bank，當次語境不同</text><rect x="12" y="52" width="336" height="80" rx="8" fill="#eef4ff" stroke="#536683"/><text x="180" y="98" font-size="16" text-anchor="middle">B01 銀行：approved、loan</text><path d="M180 135 L180 158" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="169" width="150" height="67" rx="8" fill="#f0f3f8" stroke="#536683"/><text x="93" y="208.5" font-size="14" text-anchor="middle">靜態 (1,1)</text><rect x="192" y="169" width="150" height="67" rx="8" fill="#e4f5eb" stroke="#536683"/><text x="267" y="208.5" font-size="14" text-anchor="middle">語境型 (0.9,0.1)</text><rect x="12" y="260" width="336" height="80" rx="8" fill="#eef4ff" stroke="#536683"/><text x="180" y="306" font-size="16" text-anchor="middle">R01 河岸：collapsed、rain</text><path d="M180 343 L180 366" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="377" width="150" height="48" rx="8" fill="#f0f3f8" stroke="#536683"/><text x="93" y="407" font-size="14" text-anchor="middle">靜態 (1,1)</text><rect x="192" y="377" width="150" height="48" rx="8" fill="#e4f5eb" stroke="#536683"/><text x="267" y="407" font-size="14" text-anchor="middle">語境型 (0.2,0.8)</text><text x="180" y="452" font-size="14" text-anchor="middle">同模型、同層、同切分的教學示意</text></g></svg>
