<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 580" role="img">
  <title>模型預標註、人工校對、獨立抽查</title>
  <desc>三步標註流程的示意。虛線預框與實線修正框的左、上、下邊界重合，只有右側多含背景；由人員修正後，再由另一人抽查，有錯則退回修正。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526d82"/></marker></defs>
  <style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#142c45;font-size:15px}.h{font-size:18px;font-weight:700}.box{fill:#eff6fa;stroke:#55758b;stroke-width:1.5}.arr{fill:none;stroke:#526d82;stroke-width:2;marker-end:url(#a)}</style>
  <rect width="360" height="580" rx="12" fill="white"/>
  <text x="18" y="29" class="h">省下重畫時間，保留人的判定</text>
  <rect class="box" x="24" y="53" width="308" height="78" rx="8"/>
  <text x="40" y="82" class="h">模型預標註</text><text x="40" y="109">產生建議類別、框或文字區段</text>
  <path class="arr" d="M178 132V160"/>
  <rect class="box" x="24" y="166" width="308" height="78" rx="8"/>
  <text x="40" y="195" class="h">人工校對</text><text x="40" y="222">核對原始資料，修錯類與誤框</text>
  <path class="arr" d="M178 245V274"/>
  <rect class="box" x="24" y="280" width="308" height="78" rx="8"/>
  <text x="40" y="309" class="h">獨立抽查</text><text x="40" y="336">發現殘留錯誤就退回、擴查</text>
  <text x="24" y="396">誤框例：虛線多含背景，實線貼合刮痕</text>
  <rect x="70" y="420" width="220" height="105" fill="#eef0f2" stroke="#526d82"/>
  <path d="M118 458l20 21 15-8 17 18" fill="none" stroke="#142c45" stroke-width="5"/>
  <rect x="108" y="449" width="133" height="48" fill="none" stroke="#a34800" stroke-width="3" stroke-dasharray="6 4"/>
  <rect x="108" y="449" width="76" height="48" fill="none" stroke="#006e77" stroke-width="3"/>
  <text x="24" y="555">教學示意；抽查不等於證明全批零錯誤</text>
</svg>
