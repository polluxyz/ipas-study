<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400" role="img"><title>高維鄰近到低維座標的兩種機制</title><desc>t-SNE 用高斯與 t 分布機率的 KL 目標，UMAP 建模糊鄰域圖並近似連結；兩者均不保證所有距離。</desc><rect width="360" height="400" fill="white"/><g font-family="Microsoft JhengHei,sans-serif" font-size="14" fill="#182b3a"><text x="15" y="24">共同輸入：同尺度的高維特徵矩陣</text><path d="M180 35V55M180 55H90V75M180 55H270V75" fill="none" stroke="#526878"/><rect x="12" y="80" width="158" height="165" rx="7" fill="#e8f1f5"/><rect x="190" y="80" width="158" height="165" rx="7" fill="#f9ede4"/><text x="28" y="104">t-SNE</text><text x="24" y="135">高維：高斯鄰近機率</text><text x="24" y="165">低維：t 分布機率</text><text x="24" y="195">KL 差異作為目標</text><text x="24" y="225">調整低維座標</text><text x="208" y="104">UMAP</text><text x="201" y="135">找局部近鄰</text><text x="201" y="165">建立模糊連結強度</text><text x="201" y="195">交叉熵近似連結圖</text><text x="201" y="225">調整低維座標</text><path d="M90 250V275H270V250M180 275V300" fill="none" stroke="#526878"/><text x="30" y="326">低維嵌入：供探索鄰域結構</text><text x="30" y="354">群間距離、群大小要回原空間查核</text><text x="30" y="380">示意圖；箭頭表示處理步驟</text></g></svg>
