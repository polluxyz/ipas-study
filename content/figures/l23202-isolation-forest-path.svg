<svg xmlns="http://www.w3.org/2000/svg" width="360" height="330" viewBox="0 0 360 330" role="img"><title>兩點的切割路徑</title><desc>教學合成資料。9 一次切割被分開，0 三次；此樹只教路徑，不代表真實訓練樹。</desc><rect width="360" height="330" fill="#fff"/><g font-family="Microsoft JhengHei, sans-serif" font-size="12" fill="#182b3a"><text x="15" y="20" >一棵示意樹：相同隨機切割規則</text><line x1="180.00" y1="61.00" x2="105.00" y2="98.00" stroke="#526878" /><line x1="180.00" y1="61.00" x2="275.00" y2="98.00" stroke="#526878" /><line x1="105.00" y1="121.00" x2="60.00" y2="161.00" stroke="#526878" /><line x1="105.00" y1="121.00" x2="170.00" y2="161.00" stroke="#526878" /><line x1="60.00" y1="184.00" x2="35.00" y2="223.00" stroke="#526878" /><line x1="60.00" y1="184.00" x2="115.00" y2="223.00" stroke="#526878" /><text x="180" y="55" text-anchor="middle">x &lt; 5</text><text x="105" y="115" text-anchor="middle">x &lt; 1.5</text><text x="275" y="115" text-anchor="middle">9：1 次</text><text x="60" y="178" text-anchor="middle">x &lt; 0.5</text><text x="170" y="178" text-anchor="middle">2、3</text><text x="35" y="240" text-anchor="middle">0：3 次</text><text x="115" y="240" text-anchor="middle">1：3 次</text><text x="18" y="286" >少數且偏遠的 9，較快被單獨分開</text><text x="18" y="308" >森林平均多棵樹；不是只看一條路徑</text></g></svg>