<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 552" width="360" height="552" role="img" aria-labelledby="title desc"><title id="title">多模態的編碼與任務交付</title><desc id="desc">四類來源各自編碼後，再依系統設計進入共享表示與任務分支。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#475569"/></marker></defs><rect width="360" height="552" fill="#ffffff"/><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#172033"><text x="180" y="26" font-size="17" text-anchor="middle">不同結構先適配，再決定交付</text><rect x="12" y="48" width="158" height="43" rx="7" fill="#e7effb" stroke="#334155" /><text x="91" y="74.5" font-size="15" text-anchor="middle">文字：離散詞序</text><path d="M172,69 L187,69" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="190" y="48" width="148" height="43" rx="7" fill="#e7effb" stroke="#334155" /><text x="264" y="74.5" font-size="15" text-anchor="middle">詞元表示</text><path d="M338,69 H350" fill="none" stroke="#475569" stroke-width="1.6"/><rect x="12" y="113" width="158" height="43" rx="7" fill="#e7effb" stroke="#334155" /><text x="91" y="139.5" font-size="15" text-anchor="middle">影像：空間圖塊</text><path d="M172,134 L187,134" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="190" y="113" width="148" height="43" rx="7" fill="#e7effb" stroke="#334155" /><text x="264" y="139.5" font-size="15" text-anchor="middle">影像編碼</text><path d="M338,134 H350" fill="none" stroke="#475569" stroke-width="1.6"/><rect x="12" y="178" width="158" height="43" rx="7" fill="#e7effb" stroke="#334155" /><text x="91" y="204.5" font-size="15" text-anchor="middle">聲音：時間與頻譜</text><path d="M172,199 L187,199" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="190" y="178" width="148" height="43" rx="7" fill="#e7effb" stroke="#334155" /><text x="264" y="204.5" font-size="15" text-anchor="middle">聲音編碼</text><path d="M338,199 H350" fill="none" stroke="#475569" stroke-width="1.6"/><rect x="12" y="243" width="158" height="43" rx="7" fill="#e7effb" stroke="#334155" /><text x="91" y="269.5" font-size="15" text-anchor="middle">感測：帶時間數值</text><path d="M172,264 L187,264" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="190" y="243" width="148" height="43" rx="7" fill="#e7effb" stroke="#334155" /><text x="264" y="269.5" font-size="15" text-anchor="middle">時序編碼</text><path d="M338,264 H350" fill="none" stroke="#475569" stroke-width="1.6"/><path d="M350,69 V300 H180 V314" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="26" y="318" width="308" height="45" rx="7" fill="#fff1d6" stroke="#334155" /><text x="180" y="345.5" font-size="15" text-anchor="middle">對齊／融合或共享表示</text><path d="M180,365 L180,393" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M180,384 L69,398" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M180,384 L291,398" fill="none" stroke="#475569" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="14" y="401" width="106" height="48" rx="7" fill="#e7effb" stroke="#334155" /><text x="67" y="430" font-size="15" text-anchor="middle">理解</text><rect x="127" y="401" width="106" height="48" rx="7" fill="#e7effb" stroke="#334155" /><text x="180" y="430" font-size="15" text-anchor="middle">生成</text><rect x="240" y="401" width="106" height="48" rx="7" fill="#e7effb" stroke="#334155" /><text x="293" y="430" font-size="15" text-anchor="middle">代理行動</text><text x="180" y="479" font-size="14" text-anchor="middle">理解：類別／答案；生成：新內容</text><text x="180" y="505" font-size="14" text-anchor="middle">代理：依目標選工具，讀結果再行動</text><text x="180" y="535" font-size="13" text-anchor="middle">示意圖；每套系統只實作所需分支</text></g></svg>
