<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-labelledby="title desc"><title id="title">數量、分流與換版</title><desc id="desc">擴縮改副本數，負載平衡分配請求，滾動更新逐批將舊版替換成就緒新版。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#31566b"/></marker></defs><rect width="360" height="640" fill="#ffffff"/><g fill="#16364b" font-family="sans-serif"><text x="180" y="27" text-anchor="middle" font-size="17">數量、分流與換版</text><text x="180" y="64" text-anchor="middle" font-size="16">擴縮：改變副本數</text><rect x="18" y="79" width="126" height="48" rx="9" fill="#e8f2fa" stroke="#31566b"/><text x="81" y="102" text-anchor="middle" font-size="14">現有副本</text><path d="M147 103 H204" fill="none" stroke="#31566b" stroke-width="2" marker-end="url(#arrow)"/><rect x="210" y="79" width="132" height="48" rx="9" fill="#e8f2fa" stroke="#31566b"/><text x="276" y="102" text-anchor="middle" font-size="14">增加／減少</text><text x="180" y="160" text-anchor="middle" font-size="14">依負載及容量設定目標</text><text x="180" y="211" text-anchor="middle" font-size="16">負載平衡：分配請求</text><rect x="90" y="226" width="180" height="48" rx="9" fill="#e8f2fa" stroke="#31566b"/><text x="180" y="249" text-anchor="middle" font-size="14">入口：只送健康副本</text><path d="M180 274 V292 H90 V308" fill="none" stroke="#31566b" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 292 H270 V308" fill="none" stroke="#31566b" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="312" width="144" height="48" rx="9" fill="#e8f2fa" stroke="#31566b"/><text x="90" y="335" text-anchor="middle" font-size="14">就緒副本甲</text><rect x="198" y="312" width="144" height="48" rx="9" fill="#e8f2fa" stroke="#31566b"/><text x="270" y="335" text-anchor="middle" font-size="14">就緒副本乙</text><text x="180" y="411" text-anchor="middle" font-size="16">滾動更新：分批換版</text><rect x="18" y="430" width="142" height="70" rx="9" fill="#e8f2fa" stroke="#31566b"/><text x="89" y="453" text-anchor="middle" font-size="14">舊版仍服務</text><text x="89" y="474" text-anchor="middle" font-size="14">先保留容量</text><rect x="200" y="430" width="142" height="70" rx="9" fill="#fff3de" stroke="#31566b" stroke-dasharray="5 4"/><text x="271" y="453" text-anchor="middle" font-size="14">新版啟動</text><text x="271" y="474" text-anchor="middle" font-size="14">等待就緒</text><path d="M270 501 V528 H90 V550" fill="none" stroke="#31566b" stroke-width="2" marker-end="url(#arrow)"/><rect x="18" y="554" width="324" height="48" rx="9" fill="#e8f2fa" stroke="#31566b"/><text x="180" y="577" text-anchor="middle" font-size="14">新版接流量 → 舊請求排空後退出</text><text x="180" y="628" text-anchor="middle" font-size="12">教學合成示意；箭頭表示控制或請求方向</text></g></svg>