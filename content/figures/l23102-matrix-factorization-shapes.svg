<svg xmlns="http://www.w3.org/2000/svg" width="360" height="450" viewBox="0 0 360 450" role="img" aria-labelledby="title desc"><title id="title">矩陣分解形狀</title><desc id="desc">六乘三分解為六乘二與二乘三，精確秩二，小例儲存數量相同。</desc><rect width="360" height="450" fill="white"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><text x="18" y="27" fill="#4b5563" font-size="16" text-anchor="start">原資料 → 樣本係數 × 特徵模式</text><rect x="60" y="52" width="240" height="73" rx="6" fill="#eaf2fa" stroke="#175fa5"/><text x="180" y="80" fill="#175fa5" font-size="16" text-anchor="middle">中心化資料 Xc</text><text x="180" y="105" fill="#4b5563" font-size="16" text-anchor="middle">6 筆 × 3 特徵</text><rect x="60" y="164" width="240" height="73" rx="6" fill="#eaf2fa" stroke="#175fa5"/><text x="180" y="192" fill="#175fa5" font-size="16" text-anchor="middle">係數 A</text><text x="180" y="217" fill="#4b5563" font-size="16" text-anchor="middle">6 筆 × 2 方向</text><rect x="60" y="276" width="240" height="73" rx="6" fill="#eaf2fa" stroke="#175fa5"/><text x="180" y="304" fill="#175fa5" font-size="16" text-anchor="middle">模式 B</text><text x="180" y="329" fill="#4b5563" font-size="16" text-anchor="middle">2 方向 × 3 特徵</text><text x="180" y="149" fill="#4b5563" font-size="22" text-anchor="middle">＝</text><text x="180" y="260" fill="#4b5563" font-size="22" text-anchor="middle">×</text><text x="180" y="376" fill="#4b5563" font-size="15" text-anchor="middle">共同的「2方向」必須對齊</text><text x="18" y="406" fill="#4b5563" font-size="14" text-anchor="start">原表 18 個數；兩因子 18 個數</text><text x="18" y="430" fill="#4b5563" font-size="14" text-anchor="start">教學合成資料；本圖表示形狀</text></g></svg>
