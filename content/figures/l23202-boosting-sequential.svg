<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img" aria-labelledby="title desc"><title id="title">Boosting的逐輪相依</title><desc id="desc">教學示意：每輪取得既有預測的錯誤資訊，訓練新模型後更新整體組合。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#374151"/></marker></defs><rect width="360" height="400" fill="#fff"/><g font-family="sans-serif" fill="#152a43"><text x="180" y="25" text-anchor="middle" font-size="17">已有組合 → 找不足 → 加入修正</text><rect x="70" y="45" width="220" height="45" rx="8" fill="#e5efff" stroke="#265c9e"/><text x="180" y="68" text-anchor="middle" font-size="15">目前整體預測</text><path d="M180 90 L180 118" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><rect x="70" y="125" width="220" height="65" rx="8" fill="#e5efff" stroke="#265c9e"/><text x="180" y="148" text-anchor="middle" font-size="15">與真值比較</text><text x="180" y="170" text-anchor="middle" font-size="15">建立本輪學習目標</text><path d="M180 190 L180 217" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><rect x="70" y="224" width="220" height="45" rx="8" fill="#e5efff" stroke="#265c9e"/><text x="180" y="247" text-anchor="middle" font-size="15">訓練新的弱學習器</text><path d="M180 269 L180 296" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><rect x="70" y="303" width="220" height="65" rx="8" fill="#e5efff" stroke="#265c9e"/><text x="180" y="326" text-anchor="middle" font-size="15">保留舊組合</text><text x="180" y="348" text-anchor="middle" font-size="15">加入縮小後的新修正</text><path d="M290 335 H330 V68 H292" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/><text x="180" y="393" text-anchor="middle" font-size="15">回到起點，再做下一輪</text></g></svg>
