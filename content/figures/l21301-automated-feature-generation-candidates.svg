<svg xmlns="http://www.w3.org/2000/svg" width="360" height="472" viewBox="0 0 360 472" role="img" aria-labelledby="title desc"><title id="title">從規則產生候選特徵</title><desc id="desc">候選由受控規則產生；每欄可回溯來源，驗證後才決定是否留下。</desc><rect width="360" height="472" fill="#fff"/><g font-family="sans-serif" fill="#15334c"><text x="180" y="23" text-anchor="middle" font-size="17">從規則產生候選特徵</text><rect x="16" y="40" width="328" height="68" rx="9" fill="#edf4fc" stroke="#245b8c"/><text x="180" y="65" text-anchor="middle" font-size="17" font-weight="bold">確認可用欄位</text><text x="180" y="89" text-anchor="middle" font-size="14">語意、實體、當時能否取得</text><path d="M180 110v22m-5-6 5 6 5-6" stroke="#245b8c" fill="none" stroke-width="2"/><rect x="16" y="136" width="328" height="68" rx="9" fill="#edf4fc" stroke="#245b8c"/><text x="180" y="161" text-anchor="middle" font-size="17" font-weight="bold">設定允許的運算</text><text x="180" y="185" text-anchor="middle" font-size="14">日期、轉換、多項式、滯後</text><path d="M180 206v22m-5-6 5 6 5-6" stroke="#245b8c" fill="none" stroke-width="2"/><rect x="16" y="232" width="328" height="68" rx="9" fill="#edf4fc" stroke="#245b8c"/><text x="180" y="257" text-anchor="middle" font-size="17" font-weight="bold">建立並檢查候選</text><text x="180" y="281" text-anchor="middle" font-size="14">欄位來源、單位、數量</text><path d="M180 302v22m-5-6 5 6 5-6" stroke="#245b8c" fill="none" stroke-width="2"/><rect x="16" y="328" width="328" height="68" rx="9" fill="#edf4fc" stroke="#245b8c"/><text x="180" y="353" text-anchor="middle" font-size="17" font-weight="bold">交給訓練與驗證</text><text x="180" y="377" text-anchor="middle" font-size="14">無效候選回查生成規則</text><text x="180" y="459" text-anchor="middle" font-size="14">提出候選不代表已證明有效</text></g></svg>
