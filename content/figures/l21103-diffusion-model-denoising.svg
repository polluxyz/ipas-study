<svg xmlns="http://www.w3.org/2000/svg" width="360" height="490" viewBox="0 0 360 490" role="img" aria-labelledby="title desc">
<title id="title">擴散的加噪訓練與條件去噪生成</title>
<desc id="desc">訓練時乾淨資料加噪，去噪器比較預測與已知目標；生成時從隨機噪聲反覆更新成影像，文字編碼結果引導每一步去噪。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs>
<rect width="360" height="490" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#0f172a" font-size="16" text-anchor="middle">
<text x="180" y="28" font-weight="bold" font-size="19">擴散的兩個方向</text>
<rect x="15" y="48" width="330" height="119" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="180" y="74" font-weight="bold">訓練：乾淨 → 加噪</text><text x="180" y="102">抽時間步，構造含噪資料</text><text x="180" y="128">去噪器預測 → 對照已知噪聲</text><text x="180" y="151" font-size="14">比較目標，更新模型參數</text>
<text x="180" y="200" font-weight="bold">生成：噪聲 → 去噪</text>
<rect x="20" y="220" width="130" height="43" rx="7" fill="#fef3c7" stroke="#a16207"/><text x="85" y="248">隨機噪聲</text>
<rect x="210" y="220" width="130" height="43" rx="7" fill="#ede9fe" stroke="#7c3aed"/><text x="275" y="248">文字 → 編碼</text>
<path d="M85 264V295H180M275 264V295H180" fill="none" stroke="#334155" stroke-width="2"/>
<rect x="65" y="315" width="230" height="55" rx="7" fill="#dcfce7" stroke="#15803d"/><text x="180" y="338">條件去噪器與取樣器</text><text x="180" y="359" font-size="14">依時間步反覆更新</text>
<path d="M180 295V312" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M296 343H325V392H180V374" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M110 371V415" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="420" width="290" height="46" rx="7" fill="#fff" stroke="#334155"/><text x="180" y="449">最終表示 → 圖像或解碼後圖像</text>
</g></svg>
