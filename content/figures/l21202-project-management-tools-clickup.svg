<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 612" width="360" height="612" role="img" aria-labelledby="title desc"><title id="title">ClickUp客服清單與里程碑線框</title><desc id="desc">四工具皆用客服案同六工作包追狀態、負責人、期限與前置，兩個里程碑連到可檢查證據。</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#475569"/></marker></defs><style>text{font-family:'Microsoft JhengHei',sans-serif;font-size:13px;fill:#172033} .small{font-size:12px}.head{font-size:16px;font-weight:700}.muted{fill:#475569} .box{fill:#f8fafc;stroke:#64748b;stroke-width:1.2} .link{fill:none;stroke:#475569;stroke-width:1.3;marker-end:url(#arrow)}</style><rect width="360" height="612" fill="#fff"/><text x="12" y="26" class="head">ClickUp：客服工作清單</text><text x="12" y="49" class="">同六包結構與日期；教學線框</text><rect class="box" x="10" y="66" width="340" height="53" rx="5"/><text x="20" y="87" class="">A 來源與範圍盤點｜林</text><text x="20" y="108" class="small">完成；截止11/03；前置無</text><rect class="box" x="10" y="125" width="340" height="53" rx="5"/><text x="20" y="146" class="">B 清理標註資料｜林</text><text x="20" y="167" class="small">完成；截止11/06；前置A</text><rect class="box" x="10" y="184" width="340" height="53" rx="5"/><text x="20" y="205" class="">C 查詢介面｜陳</text><text x="20" y="226" class="small">進行中；截止11/09；前置A</text><rect class="box" x="10" y="243" width="340" height="53" rx="5"/><text x="20" y="264" class="">D 回答模型｜王</text><text x="20" y="285" class="small">待辦；截止11/10；前置B</text><rect class="box" x="10" y="302" width="340" height="53" rx="5"/><text x="20" y="323" class="">E 整合與品質驗證｜李</text><text x="20" y="344" class="small">待辦；截止11/13；前置C/D</text><rect class="box" x="10" y="361" width="340" height="53" rx="5"/><text x="20" y="382" class="">F 試用決議｜周</text><text x="20" y="403" class="small">待辦；截止11/16；前置E</text><rect class="box" x="10" y="434" width="340" height="91" rx="5"/><text x="20" y="457" class="">◆ M1 11/13日終：可用客服原型</text><text x="20" y="479" class="small">□ 固定驗證至少16/20；20項整合全過</text><text x="20" y="500" class="small">□ 存取檢查；操作說明；證據文件連結</text><text x="20" y="517" class="small">連外部文件前確認各角色可用的權限</text><rect class="box" x="10" y="540" width="340" height="52" rx="5"/><text x="20" y="562" class="">◆ M2 11/16日終：試用決議</text><text x="20" y="582" class="small">試用範圍、負責人與未結風險皆有紀錄</text></svg>
