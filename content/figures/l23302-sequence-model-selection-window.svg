<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 435" role="img" aria-labelledby="title desc"><title id="title">時間視窗與三摺時間序列交叉驗證</title><desc id="desc">同一摺內，長短視窗共享驗證目標；三摺向後續週驗證，視窗只向歷史延伸，長短視窗的右端相同。</desc><style>text{font:14px sans-serif;fill:#172033}line{stroke:#52637a;stroke-width:1.5}.small{font-size:12px}.blue{fill:#12639b}.orange{fill:#a74713}</style><rect width="360" height="435" fill="#fff"/><text x="14" y="23" >同一預測起點，只能讀已發生的週</text><text x="14" y="54" >摺 1：訓練 1–52</text><text x="14" y="74" class="orange">驗證 53–64 週</text><rect x="166" y="42" width="176" height="13" fill="#e4e9ed"/><rect x="166" y="42" width="88" height="13" fill="#12639b"/><rect x="254" y="42" width="20.307692307692307" height="13" fill="#a74713"/><text x="14" y="116" >摺 2：訓練 1–64</text><text x="14" y="136" class="orange">驗證 65–76 週</text><rect x="166" y="104" width="176" height="13" fill="#e4e9ed"/><rect x="166" y="104" width="108.3076923076923" height="13" fill="#12639b"/><rect x="274.3076923076923" y="104" width="20.307692307692307" height="13" fill="#a74713"/><text x="14" y="178" >摺 3：訓練 1–76</text><text x="14" y="198" class="orange">驗證 77–88 週</text><rect x="166" y="166" width="176" height="13" fill="#e4e9ed"/><rect x="166" y="166" width="128.6153846153846" height="13" fill="#12639b"/><rect x="294.61538461538464" y="166" width="20.307692307692307" height="13" fill="#a74713"/><text x="14" y="225" class="small">藍：訓練；橘：後續驗證</text><text x="14" y="255" class="small">第一個目標：第 53 週，輸入都截止 52 週</text><text x="14" y="295" >16 週</text><rect x="70" y="285" width="256" height="14" fill="#12639b"/><line x1="326" y1="282" x2="326" y2="303" stroke-dasharray="3 2"/><text x="70" y="317" class="small">37</text><text x="14" y="337" >8 週</text><rect x="198" y="327" width="128" height="14" fill="#12639b"/><line x1="326" y1="324" x2="326" y2="345" stroke-dasharray="3 2"/><text x="198" y="359" class="small">45</text><text x="302" y="384" class="small">52 → 53</text><text x="14" y="413" class="orange">最後第 89–104 週保留測試</text></svg>