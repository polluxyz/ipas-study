ht="55" rx="6" fill="#e6f1fa" stroke="#36506c"/><text x="88" y="259.5" font-size="16">瓶頸 2×2</text><path d="M280 253L308 253" stroke="#45556c" stroke-width="2"/><polygon points="315,253 308,250 308,256" fill="#45556c"/><path d="M315 253L315 203" stroke="#45556c" stroke-width="2"/><polygon points="315,196 312,203 318,203" fill="#45556c"/><text x="16" y="316" font-size="16">虛線：相同尺度的跳接，保留定位線索</text><text x="16" y="347" font-size="16">串接範例（NCHW）：</text><rect x="20" y="365" width="320" height="46" rx="6" fill="#e6f1fa" stroke="#36506c"/><text x="30" y="394" font-size="16">上採樣：1×8×8×8</text><rect x="20" y="425" width="320" height="46" rx="6" fill="#e6f1fa" stroke="#36506c"/><text x="30" y="454" font-size="16">編碼跳接：1×4×8×8</text><path d="M180 471L180 486" stroke="#45556c" stroke-width="2"/><polygon points="180,493 183,486 177,486" fill="#45556c"/><rect x="20" y="496" width="320" height="46" rx="6" fill="#e6f1fa" stroke="#36506c"/><text x="30" y="525" font-size="16">通道串接：1×12×8×8</text><text x="16" y="578" font-size="15">原始論文有裁切；此圖採同尺寸示意。</text></g></svg>
