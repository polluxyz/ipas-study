<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 550" role="img" aria-labelledby="title desc"><title id="title">固定驗證集，只換訓練子樣本</title><desc id="desc">五個訓練子樣本，驗證12筆固定，degree1與degree9分別重訓；折線只引導比較，種子不是時間順序。</desc><rect width="480" height="550" fill="#fff"/><g fill="#172331" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif"><text x="20" y="34" font-size="24" text-anchor="start">固定驗證集，只換訓練子樣本</text><path d="M20 66h30" stroke="#08628c" stroke-width="3" /><text x="60" y="72" font-size="20" text-anchor="start">線性模型（degree1）</text><path d="M20 94h30" stroke="#af4800" stroke-width="3" stroke-dasharray="8 4"/><text x="60" y="100" font-size="20" text-anchor="start">九次模型（degree9）</text><text x="20" y="158" font-size="22" text-anchor="start">分數波動≠單次訓練驗證差</text><text x="76" y="186" font-size="18" text-anchor="start">固定驗證MSE（無單位）</text><path d="M76 390H448" stroke="#d3d8df"/><text x="68" y="396" font-size="17" text-anchor="end">0.02</text><path d="M76 314H448" stroke="#d3d8df"/><text x="68" y="320" font-size="17" text-anchor="end">0.04</text><path d="M76 238.00000000000003H448" stroke="#d3d8df"/><text x="68" y="244.00000000000003" font-size="17" text-anchor="end">0.06</text><path d="M76 200V390H448" fill="none" stroke="#172331"/><text x="76" y="414" font-size="18" text-anchor="middle">101</text><text x="169" y="414" font-size="18" text-anchor="middle">102</text><text x="262" y="414" font-size="18" text-anchor="middle">103</text><text x="355" y="414" font-size="18" text-anchor="middle">104</text><text x="448" y="414" font-size="18" text-anchor="middle">105</text><text x="270" y="442" font-size="19" text-anchor="middle">訓練子樣本種子（非時間）</text><polyline points="76.00,234.54 169.00,279.63 262.00,278.72 355.00,270.39 448.00,285.07" fill="none" stroke="#08628c" stroke-width="3" /><circle cx="76" cy="234.54240391239307" r="3" fill="#08628c"/><circle cx="169" cy="279.62965673769713" r="3" fill="#08628c"/><circle cx="262" cy="278.71925311056384" r="3" fill="#08628c"/><circle cx="355" cy="270.3921525696725" r="3" fill="#08628c"/><circle cx="448" cy="285.06861510352354" r="3" fill="#08628c"/><polyline points="76.00,350.97 169.00,350.54 262.00,216.50 355.00,349.29 448.00,227.46" fill="none" stroke="#af4800" stroke-width="3" stroke-dasharray="8 4"/><circle cx="76" cy="350.9687728853599" r="3" fill="#af4800"/><circle cx="169" cy="350.5374116616811" r="3" fill="#af4800"/><circle cx="262" cy="216.4958597808638" r="3" fill="#af4800"/><circle cx="355" cy="349.29279523686785" r="3" fill="#af4800"/><circle cx="448" cy="227.4560401069481" r="3" fill="#af4800"/><text x="20" y="532" font-size="17" text-anchor="start">教學合成資料｜CPU實測；點為實際紀錄</text></g></svg>
