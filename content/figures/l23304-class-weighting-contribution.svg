<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 363" role="img" aria-labelledby="t d"><title id="t">訓練損失貢獻與過度補償</title><desc id="d">原始、只加權、過採樣後又加權三種方案，類別總損失由JSON計數與權重計算。</desc><style>text{font-family:Arial,'Microsoft JhengHei',sans-serif;font-size:14px;fill:#172033}.small{font-size:12px}.head{font-weight:bold;font-size:16px}.neg{fill:#2563eb}.pos{fill:#c2410c}.line{fill:none;stroke-width:3}</style><rect width="360" height="363" fill="#fff"/><text x="12" y="24" class="head">數量 × 權重 × 原損失</text><text x="12" y="47" class="small">假設各筆原損失都為0.2；橫軸為損失總和</text><text x="12" y="78">原始：權重都為1</text><text x="12" y="102">負</text><rect class="neg" x="42" y="90" width="11.842105263157896" height="14"/><text x="59.8421052631579" y="102">22.8</text><text x="12" y="125">正</text><rect class="pos" x="42" y="113" width="0.6232686980609419" height="14"/><text x="48.62326869806094" y="125">1.2</text><text x="12" y="170">只調權重：負1、正19</text><text x="12" y="194">負</text><rect class="neg" x="42" y="182" width="11.842105263157896" height="14"/><text x="59.8421052631579" y="194">22.8</text><text x="12" y="217">正</text><rect class="pos" x="42" y="205" width="11.842105263157897" height="14"/><text x="59.8421052631579" y="217">22.8</text><text x="12" y="262">複製後再乘原權重</text><text x="12" y="286">負</text><rect class="neg" x="42" y="274" width="11.842105263157896" height="14"/><text x="59.8421052631579" y="286">22.8</text><text x="12" y="309">正</text><rect class="pos" x="42" y="297" width="225" height="14"/><text x="273" y="309">433.2</text><text x="12" y="344" class="small">教學合成資料；共用同一水平刻度</text></svg>
