<svg xmlns="http://www.w3.org/2000/svg" width="360" height="742" viewBox="0 0 360 742" role="img" aria-labelledby="title desc">
<title id="title">跨模態聯結與報告暴露路徑</title><desc id="desc">影像、生理與文字平行輸入，共同人員索引仍能把人臉遮罩圖和心率班表連到身分。融合報告原限職安人員，一般採購能讀即是另一暴露點。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#10233f} .box{fill:#eff6ff;stroke:#1d4e89;stroke-width:1.6} .hold{fill:#fff7ed;stroke:#9a3412;stroke-width:1.6;stroke-dasharray:5 3} .line{fill:none;stroke:#334155;stroke-width:1.8;marker-end:url(#arrow)}</style>
<rect width="360" height="742" fill="#fff"/><text x="180" y="25" text-anchor="middle" font-size="14">三路平行輸入；沒有互相轉換</text><rect class="box" x="20" y="44" width="264" height="68" rx="9"/><text x="152" y="71" text-anchor="middle" font-size="17" font-weight="700">影像</text><text x="152" y="95" text-anchor="middle" font-size="14">人臉已遮罩</text><rect class="box" x="20" y="152" width="264" height="68" rx="9"/><text x="152" y="179" text-anchor="middle" font-size="17" font-weight="700">生理訊號</text><text x="152" y="203" text-anchor="middle" font-size="14">心率序列</text><rect class="box" x="20" y="260" width="264" height="68" rx="9"/><text x="152" y="287" text-anchor="middle" font-size="17" font-weight="700">文字</text><text x="152" y="311" text-anchor="middle" font-size="14">班表與人員索引</text><path d="M284 78H328V368H180" fill="none" stroke="#334155" stroke-width="1.8"/><path d="M284 186H328M284 294H328" fill="none" stroke="#334155" stroke-width="1.8"/><path class="line" d="M180 368V393"/><rect class="hold" x="30" y="396" width="300" height="68" rx="9"/><text x="180" y="423" text-anchor="middle" font-size="17" font-weight="700">暴露點一：共同索引</text><text x="180" y="447" text-anchor="middle" font-size="14">遮罩後仍可能連回同一人</text><path class="line" d="M180 464V491"/><rect class="box" x="30" y="494" width="300" height="68" rx="9"/><text x="180" y="521" text-anchor="middle" font-size="17" font-weight="700">融合與生成報告</text><text x="180" y="545" text-anchor="middle" font-size="14">原定僅職安人員可讀</text><path class="line" d="M180 562V589"/><rect class="hold" x="30" y="592" width="300" height="68" rx="9"/><text x="180" y="619" text-anchor="middle" font-size="17" font-weight="700">暴露點二：採購也可讀</text><text x="180" y="643" text-anchor="middle" font-size="14">應限制連結與輸出存取</text><text x="180" y="694" text-anchor="middle" font-size="14">虛線框：風險位置；不能只靠顏色判讀</text><text x="180" y="721" text-anchor="middle" font-size="14">教學合成資料；不含真實個資</text></svg>