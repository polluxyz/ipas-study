<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 712" role="img" aria-labelledby="title desc"><title id="title">鄰近資料集與拉普拉斯輸出分布</title><desc id="desc">原表十二人，刪除 M01 後十一人；氣喘計數由六變五。同尺度拉普拉斯輸出的分布重疊，圖不是隱私證明。</desc><rect width="360" height="712" fill="#fff"/><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" fill="#172554"><text x="14" y="25" font-size="17" >只刪一人，其餘紀錄保持不變</text><text x="14" y="48" font-size="12" >教學合成醫療表；每人一列</text><rect x="12" y="65" width="336" height="145" rx="6" fill="#eef2ff" /><text x="24" y="90" font-size="16" >D：12 人，氣喘 6 人</text><rect x="25" y="102" width="70" height="25" rx="6" fill="#fde68a" /><text x="60" y="120" font-size="13" text-anchor="middle">M01</text><rect x="105" y="102" width="70" height="25" rx="6" fill="#dbeafe" /><text x="140" y="120" font-size="13" text-anchor="middle">M02</text><rect x="185" y="102" width="70" height="25" rx="6" fill="#dbeafe" /><text x="220" y="120" font-size="13" text-anchor="middle">M03</text><rect x="265" y="102" width="70" height="25" rx="6" fill="#dbeafe" /><text x="300" y="120" font-size="13" text-anchor="middle">M04</text><rect x="25" y="133" width="70" height="25" rx="6" fill="#dbeafe" /><text x="60" y="151" font-size="13" text-anchor="middle">M05</text><rect x="105" y="133" width="70" height="25" rx="6" fill="#dbeafe" /><text x="140" y="151" font-size="13" text-anchor="middle">M06</text><rect x="185" y="133" width="70" height="25" rx="6" fill="#dbeafe" /><text x="220" y="151" font-size="13" text-anchor="middle">M07</text><rect x="265" y="133" width="70" height="25" rx="6" fill="#dbeafe" /><text x="300" y="151" font-size="13" text-anchor="middle">M08</text><rect x="25" y="164" width="70" height="25" rx="6" fill="#dbeafe" /><text x="60" y="182" font-size="13" text-anchor="middle">M09</text><rect x="105" y="164" width="70" height="25" rx="6" fill="#dbeafe" /><text x="140" y="182" font-size="13" text-anchor="middle">M10</text><rect x="185" y="164" width="70" height="25" rx="6" fill="#dbeafe"