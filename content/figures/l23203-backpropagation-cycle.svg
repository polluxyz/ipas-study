<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" role="img" aria-labelledby="title desc"><title id="title">同一網路的前向與梯度回傳</title><desc id="desc">左側實線往下算預測與損失，右側虛線由損失往上乘局部導數求參數梯度；底部優化器才更新參數。</desc><style>text{font-family:system-ui,sans-serif;font-size:14px;fill:#182b42}.box{fill:#edf4fb;stroke:#24648d;stroke-width:1.5}.line{fill:none;stroke:#24648d;stroke-width:2}.back{fill:none;stroke:#a04435;stroke-width:2;stroke-dasharray:5 3}</style><rect width="360" height="490" fill="#fff"/><text x="90" y="23" text-anchor="middle">前向：資料往下</text><text x="270" y="23" text-anchor="middle">反向：梯度往上</text><rect class="box" x="14" y="40" width="153" height="56" rx="7"/><text x="90.5" y="62" text-anchor="middle">輸入 x = [1, 0]</text><text x="90.5" y="81" text-anchor="middle">固定舊參數</text><path class="line" d="M90 96V120m-4 -6l4 6l4 -6"/><rect class="box" x="14" y="120" width="153" height="56" rx="7"/><text x="90.5" y="142" text-anchor="middle">隱藏 h = [0.75, 0]</text><text x="90.5" y="161" text-anchor="middle">ReLU 局部導數 [1, 0]</text><path class="line" d="M90 176V200m-4 -6l4 6l4 -6"/><rect class="box" x="14" y="200" width="153" height="56" rx="7"/><text x="90.5" y="222" text-anchor="middle">z₂ = 0.25</text><text x="90.5" y="241" text-anchor="middle">p = 0.562177</text><path class="line" d="M90 256V280m-4 -6l4 6l4 -6"/><rect class="box" x="14" y="280" width="153" height="56" rx="7"/><text x="90.5" y="302" text-anchor="middle">真實標籤 y = 1</text><text x="90.5" y="321" text-anchor="middle">損失 L = −ln(p)</text><path class="back" d="M167 308H193m-6 -4l6 4l-6 4"/><rect class="box" x="193" y="280" width="153" height="56" rx="7"/><text x="269.5" y="302" text-anchor="middle">由損失開始</text><text x="269.5" y="321" text-anchor="middle">dL/dL = 1</text><path class="back" d="M270 280V256m-4 6l4 -6l4 6"/><rect class="box" x="193" y="200" width="153" height="56" rx="7"/><text x="269.5" y="222" text-anchor="middle">δ = p − 1</text><text x="269.5" y="241" text-anchor="middle">約 −0.437823</text><path class="back" d="M270 200V176m-4 6l4 -6l4 6"/><rect class="box" x="193" y="120" width="153" height="56" rx="7"/><text x="269.5" y="142" text-anchor="middle">回傳 δ × [1, −2]</text><text x="269.5" y="161" text-anchor="middle">再乘 ReLU 局部導數</text><path class="back" d="M270 120V96m-4 6l4 -6l4 6"/><rect class="box" x="193" y="40" width="153" height="56" rx="7"/><text x="269.5" y="62" text-anchor="middle">得到各參數梯度</text><text x="269.5" y="81" text-anchor="middle">W₁、b₁、W₂、b₂</text><path class="back" d="M346 68H354V376H270"/><rect class="box" x="35" y="376" width="290" height="58" rx="7"/><text x="180" y="398" text-anchor="middle">優化器讀梯度後才更新</text><text x="180" y="417" text-anchor="middle">θ新 = θ舊 − 0.1 × 梯度</text><text x="180" y="459" text-anchor="middle">下一次前向再使用新參數</text><text x="180" y="481" text-anchor="middle" style="font-size:11px">教學合成資料／示意圖</text></svg>
