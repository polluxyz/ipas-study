<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 706" role="img" aria-labelledby="title desc"><title id="title">通過門控後才交付</title><desc id="desc">測試通過後送入目標環境，藍綠切換和A/B分流置於受控上線；指引3-58已有異常回復，核對細節為補充。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#416583"/></marker></defs><rect width="360" height="706" fill="#fff"/><g font-family="sans-serif"><text x="180" y="29" text-anchor="middle" font-size="18" fill="#152b40">通過門控後才交付</text><rect x="20" y="54" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="80" text-anchor="middle" font-size="16" fill="#152b40">候選模型通過測試</text><text x="180" y="103" text-anchor="middle" font-size="16" fill="#152b40">固定產物及證據（補充）</text><path d="M 180 126 L 180 150" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><rect x="20" y="152" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="178" text-anchor="middle" font-size="16" fill="#152b40">測試環境載入與驗收</text><text x="180" y="201" text-anchor="middle" font-size="16" fill="#152b40">環境相容檢查（補充）</text><path d="M 180 224 L 180 248" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><rect x="20" y="250" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="276" text-anchor="middle" font-size="16" fill="#152b40">決定發布資格</text><text x="180" y="299" text-anchor="middle" font-size="16" fill="#152b40">核可或自動政策（補充）</text><path d="M 180 322 L 180 346" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><rect x="20" y="348" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="374" text-anchor="middle" font-size="16" fill="#152b40">受控上線：藍綠切換</text><text x="180" y="397" text-anchor="middle" font-size="16" fill="#152b40">需要成效比較時安排 A/B</text><path d="M 180 420 L 180 444" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><rect x="20" y="446" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="472" text-anchor="middle" font-size="16" fill="#152b40">觀測服務與業務結果</text><text x="180" y="495" text-anchor="middle" font-size="16" fill="#152b40">未達門檻依計畫處理</text><path d="M 180 518 L 180 542" fill="none" stroke="#416583" stroke-width="2"  marker-end="url(#a)"/><rect x="20" y="544" width="320" height="70" rx="9" fill="#edf5fc" stroke="#416583"/><text x="180" y="570" text-anchor="middle" font-size="16" fill="#152b40">異常 → 回復舊版</text><text x="180" y="593" text-anchor="middle" font-size="16" fill="#152b40">核對載入與指標（補充）</text><text x="180" y="660" text-anchor="middle" font-size="14" fill="#152b40">每個目標環境都要辨識模型版本</text><text x="180" y="690" text-anchor="middle" font-size="13" fill="#152b40">教學示意｜非實際部署</text></g></svg>
