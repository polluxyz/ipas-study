<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 458" role="img" aria-labelledby="title desc">
<title id="title">均衡機率：兩項都要比較</title><desc id="desc">TPR跨群相等，FPR跨群不相等，均衡機率不成立。</desc>
<rect width="360" height="458" rx="12" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#0f172a" font-size="17"><text x="18" y="30" font-size="21" font-weight="bold">均衡機率：兩項都要比較</text><text x="18" y="62" font-weight="bold">真實正例中的選取率（TPR）</text><text x="18" y="92">A：80%（8/10）</text><rect x="18" y="102" width="300" height="18" rx="3" fill="#e2e8f0"/><rect x="18" y="102" width="240" height="18" rx="3" fill="#0369a1"/><text x="18" y="151">B：80%（8/10）</text><rect x="18" y="161" width="300" height="18" rx="3" fill="#e2e8f0"/><rect x="18" y="161" width="240" height="18" rx="3" fill="#b45309"/><text x="18" y="210" font-size="14">0%</text><text x="155" y="210" font-size="14">50%</text><text x="282" y="210" font-size="14">100%</text><text x="18" y="254" font-weight="bold">真實負例中的誤選率（FPR）</text><text x="18" y="284">A：20%（2/10）</text><rect x="18" y="294" width="300" height="18" rx="3" fill="#e2e8f0"/><rect x="18" y="294" width="60" height="18" rx="3" fill="#0369a1"/><text x="18" y="343">B：60%（6/10）</text><rect x="18" y="353" width="300" height="18" rx="3" fill="#e2e8f0"/><rect x="18" y="353" width="180" height="18" rx="3" fill="#b45309"/><text x="18" y="402" font-size="14">0%</text><text x="155" y="402" font-size="14">50%</text><text x="282" y="402" font-size="14">100%</text><text x="18" y="439" font-size="14">教學合成：每群20人，固定稽核集</text></g></svg>
