<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="title desc"><title id="title">因果遮罩：對角線與左側可讀</title><desc id="desc">從零起算的每一列只能讀到自身及左側鍵，叉號為未來位置；不含填補遮罩。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#30445c"/></marker></defs><rect width="360" height="320" fill="#fff"/><g font-family="sans-serif" font-size="14" fill="#18334c"><text x="16" y="24" >因果遮罩：對角線與左側可讀</text><text x="16" y="54" >列＝查詢位置；欄＝鍵位置</text><text x="97" y="83" >0</text><text x="154" y="83" >1</text><text x="211" y="83" >2</text><text x="268" y="83" >3</text><text x="42" y="117" >0</text><rect x="77" y="94" width="49" height="36" fill="#d9eee9" stroke="#657080"/><text x="101" y="117" text-anchor="middle">可讀</text><rect x="134" y="94" width="49" height="36" fill="#f3e6e6" stroke="#657080"/><text x="158" y="117" text-anchor="middle">×</text><rect x="191" y="94" width="49" height="36" fill="#f3e6e6" stroke="#657080"/><text x="215" y="117" text-anchor="middle">×</text><rect x="248" y="94" width="49" height="36" fill="#f3e6e6" stroke="#657080"/><text x="272" y="117" text-anchor="middle">×</text><text x="42" y="160" >1</text><rect x="77" y="137" width="49" height="36" fill="#d9eee9" stroke="#657080"/><text x="101" y="160" text-anchor="middle">可讀</text><rect x="134" y="137" width="49" height="36" fill="#d9eee9" stroke="#657080"/><text x="158" y="160" text-anchor="middle">可讀</text><rect x="191" y="137" width="49" height="36" fill="#f3e6e6" stroke="#657080"/><text x="215" y="160" text-anchor="middle">×</text><rect x="248" y="137" width="49" height="36" fill="#f3e6e6" stroke="#657080"/><text x="272" y="160" text-anchor="middle">×</text><text x="42" y="203" >2</text><rect x="77" y="180" width="49" height="36" fill="#d9eee9" stroke="#657080"/><text x="101" y="203" text-anchor="middle">可讀</text><rect x="134" y="180" width="49" height="36" fill="#d9eee9" stroke="#657080"/><text x="158" y="203" text-anchor="middle">可讀</text><rect x="191" y="180" width="49" height="36" fill="#d9eee9" stroke="#657080"/><text x="215" y="203" text-anchor="middle">可讀</text><rect x="248" y="180" width="49" height="36" fill="#f3e6e6" stroke="#657080"/><text x="272" y="203" text-anchor="middle">×</text><text x="42" y="246" >3</text><rect x="77" y="223" width="49" height="36" fill="#d9eee9" stroke="#657080"/><text x="101" y="246" text-anchor="middle">可讀</text><rect x="134" y="223" width="49" height="36" fill="#d9eee9" stroke="#657080"/><text x="158" y="246" text-anchor="middle">可讀</text><rect x="191" y="223" width="49" height="36" fill="#d9eee9" stroke="#657080"/><text x="215" y="246" text-anchor="middle">可讀</text><rect x="248" y="223" width="49" height="36" fill="#d9eee9" stroke="#657080"/><text x="272" y="246" text-anchor="middle">可讀</text><text x="16" y="293" >× 表示遮住；可讀區包含對角線</text><text x="16" y="308" font-size="12">教學合成資料／示意圖</text></g></svg>
