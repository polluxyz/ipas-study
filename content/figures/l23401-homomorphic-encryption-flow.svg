<svg xmlns="http://www.w3.org/2000/svg" width="360" height="574" viewBox="0 0 360 574" role="img" aria-labelledby="title desc"><title id="title">同態加密與持鑰者</title><desc id="desc">教學合成流程。資料方：用共同公鑰加密；資料方 → 雲端：密文；雲端：只計算密文；雲端 → 持鑰者：結果密文；持鑰者：私鑰解密結果。原始資料留資料方；私鑰不送雲端；加密／評估金鑰可供運算；不得交還任意解密查詢；明文結果仍須限制用途。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker></defs><rect width="360" height="574" fill="#ffffff"/><g fill="#0f172a" font-family="sans-serif"><text x="180" y="30" text-anchor="middle" font-size="19" font-weight="bold">同態加密與持鑰者</text><rect x="14" y="54" width="332" height="72" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="81" text-anchor="middle" font-size="15">資料方：用共同公鑰加密</text><text x="180" y="106" text-anchor="middle" font-size="13">原始資料留資料方</text><path d="M180 128v23" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="155" width="332" height="72" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="182" text-anchor="middle" font-size="15">資料方 → 雲端：密文</text><text x="180" y="207" text-anchor="middle" font-size="13">私鑰不送雲端</text><path d="M180 229v23" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="256" width="332" height="72" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="283" text-anchor="middle" font-size="15">雲端：只計算密文</text><text x="180" y="308" text-anchor="middle" font-size="13">加密／評估金鑰可供運算</text><path d="M180 330v23" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="357" width="332" height="72" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="384" text-anchor="middle" font-size="15">雲端 → 持鑰者：結果密文</text><text x="180" y="409" text-anchor="middle" font-size="13">不得交還任意解密查詢</text><path d="M180 431v23" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="14" y="458" width="332" height="72" rx="9" fill="#eff6ff" stroke="#64748b"/><text x="180" y="485" text-anchor="middle" font-size="15">持鑰者：私鑰解密結果</text><text x="180" y="510" text-anchor="middle" font-size="13">明文結果仍須限制用途</text></g><text x="180" y="565" text-anchor="middle" fill="#334155" font-size="12">教學示意；不代表已部署或驗證安全協議</text></svg>
