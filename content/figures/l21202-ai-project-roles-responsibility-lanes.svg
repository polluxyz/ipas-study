<g font-size="15" text-anchor="middle"><text x="56" y="75">專案</text><text x="56" y="96">負責人</text><text x="56" y="148">資料</text><text x="56" y="169">工程師</text><text x="56" y="221">模型</text><text x="56" y="242">開發者</text><text x="56" y="294">體驗設計</text><text x="56" y="315">兼業務顧問</text><text x="56" y="367">系統</text><text x="56" y="388">架構師</text><text x="56" y="440">測試</text><text x="56" y="461">工程師</text></g>
<g font-size="15"><text x="112" y="75">目標、資源、進度協調</text><text x="112" y="96">交付：計畫 v1</text><text x="112" y="148">取得、清理與整合資料</text><text x="112" y="169">交付：資料與切分 v1</text><text x="112" y="221">設計、訓練與調整模型</text><text x="112" y="242">交付：模型與實驗紀錄 v1</text><text x="112" y="294">操作體驗／業務指標定義</text><text x="112" y="315">交付：操作流程與規則 v1</text><text x="112" y="367">資料流、API 與部署設計</text><text x="112" y="388">交付：API 與部署說明 v1</text><text x="112" y="440">功能、負載與異常驗證</text><text x="112" y="461">交付：測試與審查紀錄 v1</text></g>
<text x="180" y="507" font-size="14" text-anchor="middle">虛線：跨角色核對同一份交付紀錄</text><text x="180" y="530" font-size="13" text-anchor="middle">依指引職責重繪；兼任為教學假設</text></g>
