<svg xmlns="http://www.w3.org/2000/svg" width="360" height="548" viewBox="0 0 360 548" role="img" aria-labelledby="title desc">
<title id="title">AI 專案責任泳道</title><desc id="desc">六個職務席位分別交付範疇、資料、模型、流程與規則、部署介面、測試報告。體驗設計兼業務顧問在教學例子由同一席位兼任，但責任分開。虛線表示文件需跨角色核對，不表示時間順序。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs>
<rect width="360" height="548" rx="12" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#0f172a"><text x="180" y="28" font-size="18" text-anchor="middle" font-weight="700">責任泳道：看交付，不看排程</text>
<g fill="#e0f2fe" stroke="#64748b"><rect x="12" y="48" width="324" height="65" rx="7"/><rect x="12" y="121" width="324" height="65" rx="7"/><rect x="12" y="194" width="324" height="65" rx="7"/><rect x="12" y="267" width="324" height="65" rx="7"/><rect x="12" y="340" width="324" height="65" rx="7"/><rect x="12" y="413" width="324" height="65" rx="7"/></g>
