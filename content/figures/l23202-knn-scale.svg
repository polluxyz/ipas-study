<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 415" role="img" aria-labelledby="title desc"><title id="title">尺度影響近鄰排序</title><desc id="desc">同六筆和同一查詢點；兩格依各自距離排序，不直接比較跨格長度；資料：教學合成資料。</desc><rect width="360" height="415" fill="#fff"/><g fill="#172c43" font-family="Arial,Microsoft JhengHei,sans-serif"><text x="12" y="26" font-size="17" >改尺度後，最近鄰排序會改變</text><text x="15" y="66" font-size="14" >原始數字：負債量級主導距離</text><text x="14" y="98" font-size="12" >F028</text><rect x="62" y="84" width="33.01844782447636" height="18" fill="#2463a6"/><text x="269" y="98" font-size="12" >28.901</text><text x="14" y="128" font-size="12" >F038</text><rect x="62" y="114" width="142.90244682060265" height="18" fill="#2463a6"/><text x="269" y="128" font-size="12" >125.081</text><text x="14" y="158" font-size="12" >F011</text><rect x="62" y="144" width="200" height="18" fill="#2463a6"/><text x="269" y="158" font-size="12" >175.058</text><text x="15" y="216" font-size="14" >換算座標：兩軸以固定工程單位表示</text><text x="14" y="248" font-size="12" >F038</text><rect x="62" y="234" width="147.04855382572052" height="18" fill="#2463a6"/><text x="269" y="248" font-size="12" >1.329</text><text x="14" y="278" font-size="12" >F028</text><rect x="62" y="264" width="162.86109603065515" height="18" fill="#2463a6"/><text x="269" y="278" font-size="12" >1.471</text><text x="14" y="308" font-size="12" >F011</text><rect x="62" y="294" width="200" height="18" fill="#2463a6"/><text x="269" y="308" font-size="12" >1.807</text><text x="15" y="382" font-size="14" >每格橫軸各用自己的距離單位，勿比條長</text><text x="12" y="405" font-size="11" >資料：教學合成；固定規則計算</text></g></svg>
