<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-labelledby="title desc">
<title id="title">標註分歧的覆核流程</title><desc id="desc">標註分歧需要規準及跨文化覆核，多數票不自動等同公平。</desc>
<rect width="360" height="480" rx="12" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#0f172a" font-size="17"><text x="18" y="32" font-size="21" font-weight="bold">標註分歧的覆核流程</text><rect x="18" y="55" width="324" height="74" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="30" y="83" font-weight="bold">同一素材，兩位標註者</text><text x="30" y="110" font-size="16">保留各自答案與語境</text><path d="M180 131v19m-5-5 5 5 5-5" fill="none" stroke="#334155" stroke-width="2"/><rect x="18" y="155" width="324" height="74" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="30" y="183" font-weight="bold">分歧先回到規準</text><text x="30" y="210" font-size="16">查文化理解與群體刻板印象</text><path d="M180 231v19m-5-5 5 5 5-5" fill="none" stroke="#334155" stroke-width="2"/><rect x="18" y="255" width="324" height="74" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="30" y="283" font-weight="bold">修訂規準，再重標</text><text x="30" y="310" font-size="16">保留版本，避免直接覆寫真值</text><path d="M180 331v19m-5-5 5 5 5-5" fill="none" stroke="#334155" stroke-width="2"/><rect x="18" y="355" width="324" height="74" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="30" y="383" font-weight="bold">獨立樣本再評估</text><text x="30" y="410" font-size="16">一致性與群體錯誤分開報告</text><text x="18" y="462" font-size="14">教學示意：節點表示追查位置，非因果證明</text></g></svg>
