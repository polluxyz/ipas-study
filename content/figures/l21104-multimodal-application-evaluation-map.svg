<svg xmlns="http://www.w3.org/2000/svg" width="360" height="628" viewBox="0 0 360 628" role="img" aria-labelledby="title desc"><title id="title">由任務到多模態驗收</title><desc id="desc">醫療、零售與互動應用先定輸出及錯誤代價，再選分類、區域、文字或延遲指標。驗收另確認真值、同步、隱私及缺失回退，不直接平均不同單位。</desc><style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;fill:#172033;font-size:16px} .head{font-size:19px;font-weight:700} .small{font-size:14px} .box{fill:#edf5ff;stroke:#264e7a;stroke-width:1.5} .green{fill:#e8f4ee;stroke:#286247;stroke-width:1.5} .orange{fill:#fff2df;stroke:#875d20;stroke-width:1.5} .line{fill:none;stroke:#334e68;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334e68"/></marker></defs><rect width="360" height="628" rx="12" fill="#ffffff"/><text x="180" y="28" text-anchor="middle" class="head">交付不同，驗收也不同</text><rect x="18" y="50" width="324" height="68" rx="9" class="box"/><text x="180.0" y="78.0" text-anchor="middle" class="">來源：影像、文字、聲音、感測</text><text x="180.0" y="100.0" text-anchor="middle" class="">確認同一對象與事件時間</text><path d="M180,118 L180,138" class="line"/><rect x="18" y="142" width="324" height="74" rx="9" class="box"/><text x="180.0" y="173.0" text-anchor="middle" class="">任務與錯誤代價</text><text x="180.0" y="195.0" text-anchor="middle" class="">漏報、誤報、錯字或等待過久</text><path d="M180,216 L180,236" class="line"/><rect x="18" y="240" width="324" height="70" rx="9" class="box"/><text x="180.0" y="269.0" text-anchor="middle" class="">醫療：分類、警報、報告</text><text x="180.0" y="291.0" text-anchor="middle" class="">Accuracy／FPR／ROUGE</text><rect x="18" y="324" width="324" height="70" rx="9" class="box"/><text x="180.0" y="353.0" text-anchor="middle" class="">零售：推薦、區域、情感</text><text x="180.0" y="375.0" text-anchor="middle" class="">Precision／IoU／F1</text><rect x="18" y="408" width="324" height="70" rx="9" class="box"/><text x="180.0" y="437.0" text-anchor="middle" class="">互動：姿態、轉寫、回應</text><text x="180.0" y="459.0" text-anchor="middle" class="">準確率／WER／延遲</text><path d="M180,478 L180,498" class="line"/><rect x="18" y="502" width="324" height="88" rx="9" class="green"/><text x="180.0" y="529.0" text-anchor="middle" class="">驗收卡（補充）</text><text x="180.0" y="551.0" text-anchor="middle" class="">真值、分母、門檻、時間端點</text><text x="180.0" y="573.0" text-anchor="middle" class="">另查隱私／同步／缺失回退</text><text x="180" y="616" text-anchor="middle" class="small">流程示意；不同指標不直接相加</text></svg>
