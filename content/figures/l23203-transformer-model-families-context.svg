<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 324" role="img" aria-labelledby="title desc"><title id="title">雙向與因果的可見內容</title><desc id="desc">上方 BERT 還原第三個遮蔽詞可看左右；下方 GPT 依前綴預測第三詞，不看未來。 教學示意圖。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#425c74"/></marker></defs><style>text{font-family:system-ui,'Microsoft JhengHei',sans-serif;fill:#172b40;font-size:14px} .small{font-size:12px}.box{fill:#edf5fc;stroke:#356b98;stroke-width:1.5}.alt{fill:#fff3da;stroke:#946715;stroke-width:1.5}.line{fill:none;stroke:#425c74;stroke-width:1.5;marker-end:url(#arrow)}</style><rect width="360" height="324" rx="10" fill="#fff"/><text x="180" y="26" text-anchor="middle" class="">BERT：還原第三個被遮詞</text><rect x="12" y="55" width="76" height="40" rx="7" class="box"/><text x="50" y="80" text-anchor="middle" class="">甲方</text><rect x="98" y="55" width="60" height="40" rx="7" class="box"/><text x="128" y="80" text-anchor="middle" class="">應</text><rect x="168" y="55" width="83" height="40" rx="7" class="alt"/><text x="209.5" y="80" text-anchor="middle" class="">[MASK]</text><rect x="261" y="55" width="85" height="40" rx="7" class="box"/><text x="303.5" y="80" text-anchor="middle" class="">設備</text><path class="line" d="M50 104L200 104"/><path class="line" d="M302 118L218 118"/><text x="180" y="146" text-anchor="middle" class="small">左右可見線索 → 預測「交付」</text><text x="180" y="184" text-anchor="middle" class="">GPT：依前綴預測第三詞</text><rect x="12" y="204" width="76" height="40" rx="7" class="box"/><text x="50" y="229" text-anchor="middle" class="">甲方</text><rect x="98" y="204" width="60" height="40" rx="7" class="box"/><text x="128" y="229" text-anchor="middle" class="">應</text><rect x="168" y="204" width="83" height="40" rx="7" class="alt"/><text x="209.5" y="229" text-anchor="middle" class="">交付？</text><rect x="261" y="204" width="85" height="40" rx="7" class="box"/><text x="303.5" y="229" text-anchor="middle" class="">未來</text><path class="line" d="M51 258L202 258"/><text x="180" y="286" text-anchor="middle" class="small">只讀前綴；未來位置不可讀</text><text x="180" y="315" text-anchor="middle" class="small">教學合成資料／示意圖</text></svg>
