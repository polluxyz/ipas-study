<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 442" role="img" aria-labelledby="title desc"><title id="title">先問要交付什麼</title><desc id="desc">整張 CT → 類別：標整張影像，交醫師覆核；MRI 病灶 → 像素遮罩：專業標註輪廓，不以框代替；產線 → 瑕疵框或尺寸：定位和量測需求分開驗收；商店影片 → 軌跡與互動事件：跨影格關聯後才能談停留；教學合成資料</desc><rect width="360" height="442" fill="#fff"/><g font-family="sans-serif"><text x="16" y="26" font-size="19" fill="#17243b">先問要交付什麼</text><rect x="16" y="44" width="328" height="62" rx="8" fill="#eef4fa" stroke="#456783"/><text x="28" y="69" font-size="17" fill="#17243b">整張 CT → 類別</text><text x="28" y="92" font-size="15" fill="#17243b">標整張影像，交醫師覆核</text><rect x="16" y="132" width="328" height="62" rx="8" fill="#eef4fa" stroke="#456783"/><text x="28" y="157" font-size="17" fill="#17243b">MRI 病灶 → 像素遮罩</text><text x="28" y="180" font-size="15" fill="#17243b">專業標註輪廓，不以框代替</text><rect x="16" y="220" width="328" height="62" rx="8" fill="#eef4fa" stroke="#456783"/><text x="28" y="245" font-size="17" fill="#17243b">產線 → 瑕疵框或尺寸</text><text x="28" y="268" font-size="15" fill="#17243b">定位和量測需求分開驗收</text><rect x="16" y="308" width="328" height="62" rx="8" fill="#eef4fa" stroke="#456783"/><text x="28" y="333" font-size="17" fill="#17243b">商店影片 → 軌跡與互動事件</text><text x="28" y="356" font-size="15" fill="#17243b">跨影格關聯後才能談停留</text><text x="16" y="412" font-size="14" fill="#17243b">不同輸出，對應不同標註責任</text></g></svg>
