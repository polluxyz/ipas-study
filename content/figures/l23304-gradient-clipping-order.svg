<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img" aria-labelledby="title desc"><title id="title">反傳後更新前的裁剪位置</title><desc id="desc">一般流程：清梯度、前向與損失、反傳、裁剪、更新；AMP先還原梯度再裁剪。</desc><rect width="360" height="400" fill="#fff"/><style>path{fill:none}text{font-family:Arial,'Microsoft JhengHei',sans-serif;fill:#172033;font-size:13px} .muted{fill:#485366} .a{stroke:#175d9c;fill:none;stroke-width:2.5}.b{stroke:#ae4d13;fill:none;stroke-width:2.5;stroke-dasharray:6 4}</style><rect x="25" y="20" width="310" height="42" rx="6" fill="#f1f3f6" stroke="#667085"/><text x="180" y="46" text-anchor="middle">清梯度 zero_grad</text><path d="M180 62v15" stroke="#667085"/><text x="185" y="76">↓</text><rect x="25" y="80" width="310" height="42" rx="6" fill="#f1f3f6" stroke="#667085"/><text x="180" y="106" text-anchor="middle">前向 → 計算 loss</text><path d="M180 122v15" stroke="#667085"/><text x="185" y="136">↓</text><rect x="25" y="140" width="310" height="42" rx="6" fill="#f1f3f6" stroke="#667085"/><text x="180" y="166" text-anchor="middle">反傳 backward：產生梯度</text><path d="M180 182v15" stroke="#667085"/><text x="185" y="196">↓</text><rect x="25" y="200" width="310" height="42" rx="6" fill="#f1f3f6" stroke="#667085"/><text x="180" y="226" text-anchor="middle">AMP：unscale_ 還原尺度</text><path d="M180 242v15" stroke="#667085"/><text x="185" y="256">↓</text><rect x="25" y="260" width="310" height="42" rx="6" fill="#e7f1fa" stroke="#667085"/><text x="180" y="286" text-anchor="middle">裁剪 .grad → 檢查範數</text><path d="M180 302v15" stroke="#667085"/><text x="185" y="316">↓</text><rect x="25" y="320" width="310" height="42" rx="6" fill="#f1f3f6" stroke="#667085"/><text x="180" y="346" text-anchor="middle">step 更新 → AMP update</text><text x="25" y="392">未啟用 AMP 時略過還原與 scaler 操作。</text></svg>