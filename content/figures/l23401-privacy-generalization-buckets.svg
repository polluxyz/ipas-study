<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 346" role="img" aria-labelledby="title desc"><title id="title">固定地區精度比較兩種年齡桶寬</title><desc id="desc">從共用資料算出兩種分組大小；兩者均採城區與郊區，只改年齡桶寬。</desc><rect width="360" height="346" fill="#f8fafc"/><g font-family="sans-serif" fill="#0f172a"><rect x="12" y="12" width="336" height="76" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="24" y="37" font-size="15">同一張12筆醫療表</text><text x="24" y="61" font-size="15">比較年齡與地區的組合大小</text><rect x="12" y="110" width="336" height="76" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="24" y="135" font-size="15">五歲桶＋城／郊：4群</text><text x="24" y="159" font-size="15">群大小：2、4、2、4</text><rect x="12" y="208" width="336" height="76" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="24" y="233" font-size="15">十歲桶＋城／郊：2群</text><text x="24" y="257" font-size="15">群大小：6、6</text><text x="22" y="320" font-size="15">組合變粗：候選較多，細節也會減少</text></g></svg>
