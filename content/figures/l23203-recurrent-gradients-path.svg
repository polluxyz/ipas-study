<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="title desc"><title id="title">狀態與梯度的相反方向</title><desc id="desc">狀態由初始狀態到第四步依次計算，末端損失的梯度沿原路反傳並連乘局部導數。</desc><style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#172b4d;font-size:15px} .head{font-size:18px;font-weight:700}.small{font-size:13px}.box{fill:#e8f2ff;stroke:#245b9e;stroke-width:1.5}.memory{fill:#e6f6ec;stroke:#246d42;stroke-width:1.5}.gate{fill:#fff2cf;stroke:#8f6413;stroke-width:1.5}.line{fill:none;stroke:#245b9e;stroke-width:1.8;marker-end:url(#arrow)}.back{fill:none;stroke:#9c3b32;stroke-width:1.8;stroke-dasharray:5 3;marker-end:url(#red)}.mute{fill:#fff;stroke:#687782;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245b9e"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9c3b32"/></marker></defs><rect width="360" height="330" fill="#fff" rx="10"/><text x="180" y="28" text-anchor="middle" class="head">前向狀態與時間反傳</text><rect x="15" y="80" width="52" height="42" rx="8" class="box"/><text x="41" y="106" text-anchor="middle" class="">h0</text><rect x="84" y="80" width="52" height="42" rx="8" class="box"/><text x="110" y="106" text-anchor="middle" class="">h1</text><rect x="153" y="80" width="52" height="42" rx="8" class="box"/><text x="179" y="106" text-anchor="middle" class="">h2</text><rect x="222" y="80" width="52" height="42" rx="8" class="box"/><text x="248" y="106" text-anchor="middle" class="">h3</text><rect x="291" y="80" width="52" height="42" rx="8" class="box"/><text x="317" y="106" text-anchor="middle" class="">h4</text><path d="M67 101L82 101" class="line"/><path d="M136 101L151 101" class="line"/><path d="M205 101L220 101" class="line"/><path d="M274 101L289 101" class="line"/><text x="180" y="59" text-anchor="middle" class="">實線：狀態由早到晚</text><path d="M317 122L317 167" class="line"/><text x="300" y="191" text-anchor="middle" class="">末端損失</text><path d="M291 144L250 144" class="back"/><path d="M222 144L181 144" class="back"/><path d="M153 144L112 144" class="back"/><path d="M84 144L43 144" class="back"/><text x="180" y="225" text-anchor="middle" class="">虛線：梯度由晚到早</text><text x="180" y="255" text-anchor="middle" class="">每跨一步，受局部導數影響</text><text x="180" y="284" text-anchor="middle" class="">路徑越長，可能衰減或放大</text><text x="180" y="312" text-anchor="middle" class="small">共享權重的各步貢獻最後加總</text></svg>
