<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 507" role="img" aria-labelledby="title desc"><title id="title">訊號到調查與處置</title><desc id="desc">教學示意：資料、模型與服務分開監控；品質須等真值配對。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs><rect width="360" height="507" rx="8" fill="#fff"/><g font-family="sans-serif" fill="#172b4d"><text x="180" y="28" font-size="17" text-anchor="middle">訊號到調查與處置</text><rect x="20" y="55" width="320" height="86" rx="6" fill="#eff6ff" stroke="#64748b"/><text x="180" y="80" font-size="14" text-anchor="middle">資料：分布、缺值、畫質</text><text x="180" y="102" font-size="14" text-anchor="middle">預測：分數、決策、版本</text><text x="180" y="124" font-size="14" text-anchor="middle">服務：失敗、延遲、吞吐量</text><path d="M180,144 V166" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="174" width="320" height="64" rx="6" fill="#eff6ff" stroke="#64748b"/><text x="180" y="199" font-size="14" text-anchor="middle">規則、持續時間、通知路由</text><text x="180" y="221" font-size="14" text-anchor="middle">記錄參考期、監控窗與接收人</text><path d="M180,241 V263" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="271" width="320" height="64" rx="6" fill="#eff6ff" stroke="#64748b"/><text x="180" y="296" font-size="14" text-anchor="middle">先查管線，再查活動與組成</text><text x="180" y="318" font-size="14" text-anchor="middle">配對真值後查整體及群體品質</text><path d="M180,338 V360" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="368" width="320" height="86" rx="6" fill="#fff7ed" stroke="#64748b"/><text x="180" y="393" font-size="14" text-anchor="middle">資料／模型／服務負責人接手</text><text x="180" y="415" font-size="14" text-anchor="middle">修復、限制服務或產生候選</text><text x="180" y="437" font-size="14" text-anchor="middle">確認恢復，留下處理紀錄</text><text x="180" y="481" font-size="12" text-anchor="middle">真值未到：品質待確認，不以預測代替</text></g></svg>
