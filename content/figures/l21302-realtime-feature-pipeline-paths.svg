<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 455" role="img" aria-labelledby="title desc"><title id="title">批次與串流特徵路徑</title><desc id="desc">批次與串流兩條獨立資料路徑匯入線上儲存；歷史訓練走離線路徑，定義由特徵儲存平台管理。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs><rect width="360" height="455" rx="8" fill="#fff"/><g font-family="sans-serif" fill="#172b4d"><text x="180" y="28" font-size="17" text-anchor="middle">特徵的批次與串流雙路徑</text><text x="180" y="58" font-size="14" text-anchor="middle">共用特徵定義、版本及時間規則</text><rect x="10" y="82" width="165" height="86" rx="6" fill="#f1f5f9" stroke="#64748b"/><text x="92.5" y="107" font-size="14" text-anchor="middle">批次：歷史事件</text><text x="92.5" y="129" font-size="14" text-anchor="middle">倉儲→穩定摘要</text><text x="92.5" y="151" font-size="14" text-anchor="middle">離線保留歷史</text><rect x="185" y="82" width="165" height="86" rx="6" fill="#fff7ed" stroke="#64748b"/><text x="267.5" y="107" font-size="14" text-anchor="middle">串流：近期事件</text><text x="267.5" y="129" font-size="14" text-anchor="middle">短窗聚合→最新值</text><text x="267.5" y="151" font-size="14" text-anchor="middle">檢查落後及亂序</text><path d="M92,170 V202 H268 V170 M180,202 V213" stroke="#334155" stroke-width="2" fill="none"/><path d="M180,213 V233" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="241" width="320" height="64" rx="6" fill="#eff6ff" stroke="#64748b"/><text x="180" y="266" font-size="14" text-anchor="middle">特徵儲存平台管理定義及取用</text><text x="180" y="288" font-size="14" text-anchor="middle">物化／寫入低延遲線上儲存</text><path d="M180,308 V333" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="20" y="341" width="320" height="64" rx="6" fill="#eff6ff" stroke="#64748b"/><text x="180" y="366" font-size="14" text-anchor="middle">請求→低延遲讀取→模型</text><text x="180" y="388" font-size="14" text-anchor="middle">核對事件年齡、可用時間與版本</text><text x="180" y="435" font-size="12" text-anchor="middle">兩路獨立更新；歷史訓練另走離線取用</text></g></svg>
