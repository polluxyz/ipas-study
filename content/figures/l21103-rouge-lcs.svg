<svg xmlns="http://www.w3.org/2000/svg" width="360" height="325" viewBox="0 0 360 325" role="img" aria-labelledby="title desc"><title id="title">ROUGE-L的最長公共子序列</title><desc id="desc">客服候選A把申請移到句首。所有詞仍存在，但保持先後順序的最長公共子序列只含五個詞。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#475569"/></marker></defs><rect width="360" height="325" rx="12" fill="#f8fafc"/><g font-family="sans-serif" font-size="15" fill="#172554"><text x="18" y="26" font-size="15">CS04：詞都相同，先後次序仍不同</text><text x="18" y="52" font-size="14">參考</text><rect x="16" y="62" width="49" height="37" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="28" y="86" font-size="15">客服</text><rect x="71" y="62" width="49" height="37" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="83" y="86" font-size="15">於</text><rect x="126" y="62" width="49" height="37" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="138" y="86" font-size="15">兩日</text><rect x="181" y="62" width="49" height="37" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="193" y="86" font-size="15">內</text><rect x="236" y="62" width="49" height="37" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="248" y="86" font-size="15">回覆</text><rect x="291" y="62" width="49" height="37" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="303" y="86" font-size="15">申請</text><path d="M40 101L95 160" stroke="#0369a1" stroke-width="2"/><path d="M95 101L150 160" stroke="#0369a1" stroke-width="2"/><path d="M150 101L205 160" stroke="#0369a1" stroke-width="2"/><path d="M205 101L260 160" stroke="#0369a1" stroke-width="2"/><path d="M260 101L315 160" stroke="#0369a1" stroke-width="2"/><rect x="16" y="162" width="49" height="37" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="28" y="186" font-size="15">申請</text><rect x="71" y="162" width="49" height="37" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="83" y="186" font-size="15">客服</text><rect x="126" y="162" width="49" height="37" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="138" y="186" font-size="15">於</text><rect x="181" y="162" width="49" height="37" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="193" y="186" font-size="15">兩日</text><rect x="236" y="162" width="49" height="37" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="248" y="186" font-size="15">內</text><rect x="291" y="162" width="49" height="37" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="303" y="186" font-size="15">回覆</text><text x="18" y="224" font-size="14">候選 A：申請移到句首</text><text x="18" y="254" font-size="15">單詞重疊 6；LCS 長度 5</text><text x="18" y="280" font-size="14">連線須由左往右，不可交叉倒走</text><text x="18" y="307" font-size="14">LCS 可跳過詞，但必須保留順序</text></g></svg>
