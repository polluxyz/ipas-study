stem: 某飲料商以線性迴歸預測銷量。資料顯示氣溫每升高 1 度，週末的銷量增幅比平日大；目前模型只有「氣溫」與「是否週末」兩欄。團隊希望保留線性迴歸，並讓氣溫的影響可隨週末狀態改變。最適合加入哪項特徵？
options:
  A: 加入氣溫的標準化數值，讓平日與週末共用另一個氣溫係數
  B: 加入氣溫乘以週末指標，讓兩種日期具有不同的氣溫斜率
  C: 加入週末指標的平方值，讓模型增加一個日期狀態係數
  D: 加入相同的週末指標欄，讓模型增加一個週末基準係數
answer: B
explanation:
  summary: 交互作用特徵可表達條件改變時的效果差異。
  correct: 氣溫乘以週末指標的交互作用，在平日為 0，在週末隨氣溫變動。加入這欄後，線性迴歸能為週末增加不同的氣溫斜率，對應題幹描述。
  wrong:
    A: 標準化氣溫仍只是氣溫的線性轉換，不能讓同一個氣溫斜率因週末而改變。
    C: 週末指標只有 0 與 1，平方後仍是原指標，只能影響日期狀態的基準值。
    D: 複製週末指標不會增加新的資訊，仍只調整週末與平日的基準差距。
