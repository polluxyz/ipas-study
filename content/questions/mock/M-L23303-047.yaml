stem: 某團隊比較 2 個警報模型各自的一個操作點。甲的真陽率為 0.85、假陽率為 0.04；乙為 0.80、0.06。兩者用在同一批案件，行動方式與成本相同，每次漏報與誤報都有正成本。若只比較這兩個操作點，哪項判斷最正確？
options:
  A: 選乙作為本次較低成本的操作點
  B: 先取得完整 ROC 曲線才能判定
  C: 選甲作為本次較低成本的操作點
  D: 將這兩個操作點視為成本相同
answer: C
explanation:
  summary: 同一批案件中，較高真陽率且較低假陽率可同時降低兩種錯誤。
  correct: 甲會漏掉較少正類，也會誤報較少負類。兩種錯誤都有正成本，且其他條件相同，因此甲在這兩個固定操作點的總錯誤成本較低，不需先知道成本比例或整體 AUC。
  wrong:
    A: 乙在同一批案件上同時漏報更多、誤報更多，兩種錯誤又都有正成本，因此乙的成本較高。
    B: 整體 AUC 用來比較跨門檻的排序能力，本例只比較已知的兩個操作點，資訊已足夠。
    D: 甲在兩種錯誤上都有明確優勢，且錯誤都有正成本，因此兩個操作點的成本不同。
