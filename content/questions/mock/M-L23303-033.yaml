stem: 某平台有 600 位買家與 800 件商品的互動紀錄。驗證目標要求買家與商品都未出現在訓練資料，且每筆紀錄都要保留在其中一側。買家可連結多件商品，商品也可連結多位買家。若資料可分成多個互不相連的群組，哪項分組最適合？
options:
  A: 以每筆紀錄的買家編號分組，再將整組分到訓練或驗證
  B: 將經由共同買家或商品連通的紀錄合為一組，再整組切分
  C: 以每筆紀錄的商品編號分組，再將整組分到訓練或驗證
  D: 以每筆紀錄的買家與商品編號配對分組，再將整組切分
answer: B
explanation:
  summary: 多種共享實體的隔離需要涵蓋連通關係。
  correct: 共用買家或共用商品的紀錄必須放在同側。沿這些關係連通的整組紀錄一起分配，可同時隔離買家與商品，也不需捨棄跨側紀錄。
  wrong:
    A: 同一商品仍可能由不同買家的紀錄出現在兩側，只隔離買家不足以達成雙重新對象目標。
    C: 同一買家仍可能透過不同商品出現在兩側，只隔離商品不足以達成目標。
    D: 不同配對可共用同一買家或商品，配對不重複不等於 2 種實體都不重複。
