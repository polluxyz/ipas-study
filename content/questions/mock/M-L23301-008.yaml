stem: 某模型以 10 秒振動訊號判斷轉軸是否超速，標籤依實際振動頻率是否超過 60 Hz 決定。工程師將訊號時間軸壓縮為原來的 0.8 倍，再以相同取樣率輸出 10 秒片段，卻沿用原標籤。最需要優先檢查哪項問題？
options:
  A: 只要輸出長度仍是 10 秒，標籤就一定保持不變
  B: 變換會提高訊號頻率，可能改變是否超速的標籤
  C: 時間變形只會改振幅，不可能影響每秒週期數
  D: 應對驗證訊號套同樣變形，讓原標籤錯配自動抵銷
answer: B
explanation:
  summary: 時序增強須保留任務標籤所依據的物理意義。
  correct: B 正確。時間壓縮後頻率會提高，例如原本接近門檻的正常訊號可能被變成超速訊號。應限制變形範圍、依任務重新標註，或改用確定保留標籤的增強。固定輸出長度不足以保證標籤不變。
  wrong:
    A: 相同長度不代表頻率不變；頻率才是本題標籤的依據。
    C: 時間軸壓縮會改變週期長度，因此影響每秒週期數。
    D: 在驗證資料複製錯配不會恢復標籤語意，反而改變評估對象。
