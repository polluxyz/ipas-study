stem: 某模型以 10 秒振動訊號判斷轉軸是否超速，標籤依實際振動頻率是否超過 60 Hz 決定。工程師將訊號時間軸壓縮為原來的 0.8 倍，再以相同取樣率輸出 10 秒片段，卻沿用原標籤。最需要優先檢查哪項問題？
options:
  A: 變換使頻率降為原來的 0.8 倍，可能將超速訊號改為正常
  B: 變換會提高訊號頻率，可能改變是否超速的標籤
  C: 相同取樣率使每秒週期數不變，可沿用原本的超速標籤
  D: 將壓縮後的訊號振幅縮為 0.8 倍，可沿用原本的超速標籤
answer: B
explanation:
  summary: 時序增強須保留任務標籤所依據的物理意義。
  correct: B 正確。時間壓縮後頻率會提高，例如原本接近門檻的正常訊號可能被變成超速訊號。應限制變形範圍、依任務重新標註，或改用確定保留標籤的增強。固定輸出長度不足以保證標籤不變。
  wrong:
    A: 時間縮為 0.8 倍時，頻率應變為原來的 1/0.8=1.25 倍，並非降為 0.8 倍；標籤風險是正常訊號可能跨入超速範圍。
    C: 取樣率是每秒記錄幾個數值，不是訊號每秒振動幾次；維持取樣率不會抵銷時間壓縮造成的頻率提高。
    D: 縮小振幅改變振動幅度，不會把壓縮後的週期拉長；本題按頻率決定標籤，調低振幅不能恢復原標籤的有效性。
