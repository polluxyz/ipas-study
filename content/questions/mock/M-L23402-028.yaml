stem: |
  某影像辨識器的兩個群體各有 2,000 張訓練影像。第一群涵蓋室內、戶外；第二群只有室內。部署將包含兩群的戶外影像，獨立測試發現第二群戶外辨識特別差，但室內表現相近。若優先處理已知的資料涵蓋問題，最適合採取哪個措施？
options:
  A: 補蒐第二群戶外影像，涵蓋預期部署條件
  B: 重複抽取第二群室內影像，提高該群訓練權重
  C: 減少第一群戶外影像，讓兩群場景分布接近
  D: 調高第二群室內樣本權重，維持現有影像內容
answer: A
explanation:
  summary: 群體總數平衡仍可能缺少特定場景，需補足缺失的條件。
  correct: 已知缺口是第二群缺乏戶外訓練影像，而非群體總數不足。補蒐該群在戶外的資料，才能直接擴大相關條件的涵蓋。新資料仍須另留獨立測試，確認改善是否轉移到部署場景。
  wrong:
    B: 重複室內影像可改變訓練權重，卻沒有提供第二群的戶外變化，不能直接補足已知的場景缺口。
    C: 移除第一群戶外影像會減少有效覆蓋。兩群分布變得相近，不表示已具備部署所需的戶外資料。
    D: 提高室內樣本權重主要改變現有資料的影響力，沒有補充缺失的戶外外觀資訊。
