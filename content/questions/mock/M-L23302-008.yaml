stem: 某推薦系統只收集到 8 萬組偏好資料，每組記錄同一使用者較喜歡商品甲或乙，沒有評分。需求是替每位使用者排序新商品，不需預測絕對分數。最適合的建模目標為何？
options:
  A: 將商品編號當成連續目標，以均方誤差預測偏好商品的編號
  B: 建立使用者與商品的評分函數，以成對排序損失學習分數差
  C: 建立商品影像自編碼器，以像素重建誤差作為使用者偏好分數
  D: 將偏好商品設成固定類別，對未見商品沿用同一類別輸出頭
answer: B
explanation:
  summary: 只有成對偏好時，排序目標可直接使用相對次序作監督。
  correct: 成對排序損失要求較受喜愛商品的分數高於另一商品，不需要虛構絕對評分。評分函數應同時使用使用者與商品特徵，才能對新商品產生可比較的分數。
  wrong:
    A: 商品編號的數值差距不代表偏好差距；用迴歸預測編號沒有對應到排序任務。
    C: 重建誤差衡量影像重建程度，不是已觀察的個人偏好次序。
    D: 固定商品類別輸出頭沒有未見商品的輸出位置，也沒有利用現有成對監督的結構。
