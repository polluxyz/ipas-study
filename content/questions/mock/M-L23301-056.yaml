stem: 某工廠整理已結束的加熱實驗，每分鐘記錄一次溫度。某個短缺口兩側的讀值都已取得，附近溫度呈平緩上升，沒有啟停事件。分析人員要補出銜接缺口兩側趨勢的歷史曲線。哪項做法最適合？
options:
  A: 使用整場實驗的平均溫度補齊缺口
  B: 使用缺口前最後一筆溫度補齊缺口
  C: 使用缺口兩側的時間與溫度做線性插值
  D: 使用整場實驗出現最多的溫度補齊缺口
answer: C
explanation:
  summary: 歷史資料的短缺口可利用兩側觀測插值。
  correct: 線性插值會利用缺口兩側的讀值與時間位置，補出兩端之間的局部趨勢。本例處理已結束的實驗，兩側觀測都能使用。這不表示重建值就是當時真值。
  wrong:
    A: 整場平均值忽略缺口發生的位置，可能無法銜接附近的上升趨勢。
    B: 前值填補適用於沿用最近狀態，但會在缺口內形成水平段，沒有利用已知的後側讀值。
    D: 眾數表示整場常見讀值，與缺口附近的局部變化不一定一致。
