stem: 某團隊準備中英對照句訓練翻譯模型。匯出時，英文欄被獨立排序；兩欄句子各自流暢，卻有多數列不是互譯關係。若要讓模型學習正確的來源到譯文對應，最適合先做哪項修正？
options:
  A: 按兩欄各自的句子長度排序，再以同列配對
  B: 依共同句對編號還原配對，再核對互譯內容
  C: 對兩欄各自刪除停用詞，再保留目前的配對
  D: 依英文句子的流暢度篩選，再保留目前的配對
answer: B
explanation:
  summary: 翻譯訓練需要逐筆語意對齊，單邊語料品質不足以保證有效監督。
  correct: 序列到序列的翻譯訓練會用來源句預測同筆目標句。配對錯誤會提供錯誤的監督訊號，應先還原並核對逐筆互譯關係。
  wrong:
    A: 來源與譯文長度可能不同。長度排序可改善批次效率，但不能證明同列的兩句互譯。
    C: 停用詞處理可改變文字特徵，沒有恢復跨語言句對，還可能刪掉翻譯所需的語法資訊。
    D: 流暢度只能評估目標句本身，無法確認它是否忠實翻譯同列來源句。
