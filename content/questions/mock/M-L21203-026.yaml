stem: 某公司評估外部模型服務。供應商承諾「客戶輸入不拿來訓練」，但技術文件另載明輸入會留存 30 天作異常調查，支援人員可能在核准後讀取。公司主要關切未公開設計圖在供應商端的留存與存取。哪項處置最適合？
options:
  A: 取得不訓練承諾後，以模型測試分數決定設計圖的傳送範圍
  B: 確認傳輸採用加密後，以連線憑證決定設計圖的傳送範圍
  C: 另核對留存、刪除及人員存取條件，再決定可送出的資料範圍
  D: 確認服務回應速度後，以每次請求的字數決定設計圖的傳送範圍
answer: C
explanation:
  summary: 不供訓練與不被留存、讀取是不同的資料處理條件。
  correct: 不拿來訓練只限制一種用途，不能推導輸入不落地或沒有人員可讀取。留存、刪除及存取條件直接對應公司關切，需要另外確認並據此限制傳送資料。
  wrong:
    A: 模型測試分數衡量任務品質，無法說明供應商保存設計圖多久或哪些人可讀取。
    B: 加密連線保護傳輸，沒有回答接收端留存與授權人員存取的條件。
    D: 字數與回應速度影響用量及效能，短輸入仍可能含有完整的關鍵設計資訊。
