stem: 某家具公司要產出 120 張不同材質的椅子情境圖。所有圖片須保留同一份設計線稿的輪廓，只靠文字提示時，椅腳位置經常改變。哪種調整最直接符合需求？
options:
  A: 只提高文字提示的長度，以更長敘述取代既有線稿的幾何條件
  B: 加入線稿或邊緣條件的可控生成流程，再檢查輪廓一致性
  C: 固定每次生成的隨機種子，依材質替換文字提示以保留輪廓
  D: 提高文字引導強度，依提示中的椅腳描述鎖定線條位置
answer: B
explanation:
  summary: 結構條件對影像生成的控制。
  correct: 需求同時包含材質變化與輪廓保留。將既有線稿當作生成條件，比單靠文字更直接提供幾何限制；仍須檢查生成結果是否符合設計。
  wrong:
    A: 更長文字不會精確提供所有線條位置，沒有直接利用已存在的結構資料。
    C: 固定種子有助於重現生成結果，但沒有提供指定線稿的幾何位置；更換材質提示仍可能改變輪廓。
    D: 文字引導強度調整結果對文字條件的依從程度，文字描述仍不足以精確指定線稿中每條線的位置。
