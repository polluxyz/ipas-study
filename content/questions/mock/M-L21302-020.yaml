stem: 某影像服務的圖形處理器可處理互動請求與夜間離線工作。互動請求須在 150 毫秒內回應，但離線批次一次占用運算資源 2 秒，造成互動請求排隊；兩類工作皆無故障。若離線工作可延後，最適合的排程調整為何？
options:
  A: 提高離線批次大小，先縮短整批離線工作的總完成時間
  B: 依兩類請求的到達順序共用佇列，維持現有離線批次大小
  C: 分開佇列並保留互動容量，限制離線工作占用或移至離峰執行
  D: 延長互動請求的伺服器逾時，讓請求能等待離線批次完成
answer: C
explanation:
  summary: 混合工作負載須兼顧互動期限與批次占用時間。
  correct: 題目瓶頸是長批次占用使短期限請求等待。分開佇列並提供可落實的互動容量保留，再限制離線占用或改到離峰，可保護互動期限；只設優先順序而無可用容量仍可能被正在執行的長批次阻塞。
  wrong:
    A: 較大批次可能提高離線吞吐，卻可能延長單次資源占用，沒有保護互動請求的期限。
    B: 先到先服務仍會讓互動請求排在長批次後方，未處理題目已知的等待來源。
    D: 延長逾時不能滿足 150 毫秒的回應要求，只會讓客戶端等候更久。
