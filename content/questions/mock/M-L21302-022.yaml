stem: 某推論服務以中央處理器使用率超過 70% 作為擴容條件。壓力測試時中央處理器只有 25%，圖形處理器卻已飽和，待處理佇列持續增長，且長時間超過回應期限。新增圖形處理器副本可分攤工作。最適合的擴容訊號調整為何？
options:
  A: 改用排隊等待時間等需求訊號，搭配圖形處理器容量與擴容驗證
  B: 提高中央處理器門檻，讓單一副本累積更多請求再觸發擴容
  C: 改用模型離線準確率，依準確率是否低於門檻判斷增加副本
  D: 改以每個月的平均請求量設定副本數，維持固定容量到月底
answer: A
explanation:
  summary: 擴容訊號要對應服務的實際瓶頸與期限。
  correct: 已知瓶頸在圖形處理器與持續排隊，中央處理器使用率無法反映未滿足的需求。以等待時間或佇列需求搭配容量規劃，並驗證擴容反應及副本啟動時間，才與本例回應期限直接相關。
  wrong:
    B: 提高已無法觸發的中央處理器門檻，會使擴容更晚，未處理圖形處理器飽和。
    C: 離線準確率描述預測品質，不反映目前佇列與運算容量需求。
    D: 月平均會掩蓋尖峰及持續排隊，固定到月底也無法回應題目當下的容量不足。
