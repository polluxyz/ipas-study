stem: 某文件平台每週更換專案類別，只有各類的文字說明，尚無對應標註文件。文件常用同義說法，不含類別名稱。團隊要先評估現成模型能否按這些說明分類，最適合哪項試驗？
options:
  A: 按類別名稱的精確字串比對結果，分派文件類別
  B: 把文件分成指定群數，再按群集編號對應類別
  C: 沿用舊專案分類器，按新類別順序替換輸出名稱
  D: 把新類別說明列為候選，執行零樣本文字分類
answer: D
explanation:
  summary: 沒有新類別標註時，可試驗以類別說明作零樣本分類。
  correct: D 利用現成模型比較文件與候選類別的語意，不必先取得各新類的訓練樣本。這是可先試驗的起點，並不代表免除後續人工建立評估案例。
  wrong:
    A: 精確字串比對只能找到相同用字，無法處理本題以同義說法表達、未出現類別名稱的文件。
    B: 分群依資料相似性形成群集，群集編號沒有新專案類別的語意，不能按編號直接對應。
    C: 舊分類器學到的是舊類別的判定邊界，替換顯示名稱不會讓模型學到新類別的定義。
