stem: 某報告任務的 4 個代理使用同一授權身分與同一知識庫快照。追蹤顯示，各代理反覆對完全相同的查詢條件執行同一文件擷取，取得的證據也相同。團隊要減少重複工具費，且保留各代理不同的分析任務。最適合如何調整？
options:
  A: 將各代理的最終答案合併成較短版本，再進行報告彙整
  B: 為各代理設定相同的生成隨機種子，再維持獨立文件擷取
  C: 將各代理改用較小的生成模型，再維持既有工具呼叫流程
  D: 以查詢條件、快照與授權範圍索引任務內共用的證據
answer: D
explanation:
  summary: 相同資料條件下的重複擷取，可透過任務內證據共用降低成本。
  correct: 題目已確認查詢、快照與授權相同。以這些條件索引共用證據，可讓代理重用已擷取結果，再各自分析；條件不同時不得直接套用同一份證據。
  wrong:
    A: 最後縮短答案可能減少彙整輸入量，但文件擷取已重複付費，沒有處理這項成本來源。
    B: 生成隨機種子不會讓各代理的工具呼叫自動共用結果，重複擷取仍照常發生。
    C: 小模型可能降低生成費，卻未減少題目指出的重複文件擷取次數。
