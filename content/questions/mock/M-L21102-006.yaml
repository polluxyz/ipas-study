stem: 某印刷廠要檢出高解析影像中的細字缺筆。整張影像直接縮至模型固定輸入尺寸後，人工也看不清缺筆。原始影像細節清楚，團隊可接受逐區推論，但不能更換模型。哪個處理最適合？
options:
  A: 維持整張縮小的輸入，提高亮度以取代已消失的筆畫
  B: 從原始影像切出足夠細緻的區塊，推論後對回原位置
  C: 維持整張縮小的輸入，增加訓練輪數以辨識缺失細節
  D: 先把整張影像縮小，再放大回原尺寸以補回缺筆結構
answer: B
explanation:
  summary: 縮圖已抹除關鍵細節時，可用原始區塊保留局部資訊。
  correct: 原始影像仍包含缺筆線索，逐區處理可避免把整張影像的細節壓縮到固定尺寸。切塊要涵蓋待檢文字，並將結果對回原圖；必要時讓區塊重疊以降低邊界遺漏。
  wrong:
    A: 亮度調整處理明暗差異，不能取代因解析度降低而消失的筆畫結構。
    C: 當推論輸入已缺少判斷線索，增加訓練輪數不能直接解決前處理造成的資訊損失。
    D: 一般縮小再放大不會還原已丟失的真實細節，畫面變大不代表證據恢復。
