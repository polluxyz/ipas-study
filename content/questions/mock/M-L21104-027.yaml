rev: 1
source: mock
subject: 1
type: 情境
codes: [L21104]
concepts: [multimodal-deployment-optimization]
stem: |
  某維修助理讓使用者對同一張照片連續提問。影像編碼占每輪耗時的 70%，編碼器與影像前處理固定，且影像表示不依賴問題文字。團隊希望減少等待，又能回答每輪不同的問題。最適合採取哪項優化？
options:
  A: 快取照片的影像表示，每輪與新問題融合，照片變動時重算
  B: 快取照片的第一則答案，每輪以該答案取代新的融合判斷
  C: 快取照片的完整融合結果，每輪以該結果回應新的問題
  D: 快取第一個問題的文字表示，每輪與照片重新編碼後融合
answer: A
explanation:
  summary: 可重用的模態表示與依問題改變的融合結果，快取範圍不同。
  correct: 題目已限定影像表示只取決於照片與固定編碼流程，因此照片未變時可以重用。新問題仍須重新融合，照片或其相關處理版本改變時則需使快取失效。
  wrong:
    B: 答案與提問內容有關。第一則答案無法代表同一張照片的其他問題，重用答案會跳過必要的新判斷。
    C: 完整融合結果含有當時問題的影響。照片相同不代表不同問題的融合結果也相同。
    D: 問題每輪改變，重用第一個文字表示會遺失新問題。重新執行占時最多的影像編碼，也未處理主要耗時來源。
