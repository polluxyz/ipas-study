stem: 某倉庫模型使用「包裹重量」與「箱型」。近期這 2 個欄位各自的分布與訓練期相同，但配對抽查發現重包裹改用小箱的比例明顯增加。維運團隊想判斷監控是否漏掉輸入變化。最正確的做法為何？
options:
  A: 維持逐欄分布監控，將這次差異解讀為模型輸出的隨機波動
  B: 只比較模型分數的平均值，以平均值是否改變判定有無輸入漂移
  C: 只調整重量欄位的分箱數，繼續用重量分布代表兩欄配對狀態
  D: 加入箱型內的重量分布或聯合分布比較，再檢查真值品質
answer: D
explanation:
  summary: 各欄分布穩定不代表欄位間的聯合關係穩定。
  correct: 重量與箱型的邊際分布可不變，但它們的配對關係仍能改變。按箱型比較重量，或檢查聯合分布，可捕捉這類輸入變化；是否影響預測品質仍須對照真值。
  wrong:
    A: 題目已有配對關係改變的證據，僅用逐欄分布不能排除這種輸入變化。
    B: 模型分數平均值可能掩蓋輸入配對變動，不能用單一輸出平均值判定輸入是否漂移。
    C: 即使重量分箱更細，單看重量仍沒有記錄它與箱型的配對關係。
