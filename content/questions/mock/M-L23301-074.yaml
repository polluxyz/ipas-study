stem: 某設備廠希望把 80 個量測欄位減少至約 15 個。維修手冊要求模型輸入仍是可直接查到原始名稱的量測值，例如壓力與流量，不能改成混合多個量測值的座標。下列方法何者最符合需求？
options:
  A: 將量測值轉為前 15 個主成分
  B: 將量測值壓縮成 15 維自動編碼器表示
  C: 將量測值投影成 15 個隨機線性組合
  D: 依統計關聯從現有量測欄位選出約 15 個
answer: D
explanation:
  summary: 需要保留原始欄位意義時，應區分特徵選擇與特徵轉換。
  correct: 從既有量測欄位挑選子集，能保留各欄的名稱及物理意義。主成分或其他低維表示則會產生新的座標。
  wrong:
    A: 主成分通常混合多個原始欄位，其座標不再等於某一項原始壓力或流量。
    B: 自動編碼器的壓縮表示是模型學到的新特徵，不能直接當成保留原始名稱的量測欄位。
    C: 隨機線性組合也會混合原始量測值，降低維度並不等於保留原始欄位。
