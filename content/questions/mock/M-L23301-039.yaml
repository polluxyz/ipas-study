stem: 某設備每秒取樣一次。工程師確認，連續過熱 20 秒比零散過熱 20 次更容易造成損壞。目前特徵只有最近 1 分鐘的平均溫度與過熱門檻以上筆數，無法區分這兩種模式。哪項新增特徵最適合？
options:
  A: 最近 1 分鐘的最高溫度
  B: 最近 1 分鐘的最低溫度
  C: 最近 1 分鐘的溫度總和
  D: 最近 1 分鐘最長連續過熱秒數
answer: D
explanation:
  summary: 連續狀態的持續時間需要保留觀測順序。
  correct: 本例關鍵是過熱是否連續。最長連續過熱秒數直接表示這種時間結構，可區分總過熱次數相同但排列不同的紀錄。計算窗口只使用預測時已取得的讀值。
  wrong:
    A: 最高溫度反映尖峰幅度，不能辨識同樣過熱次數是否連續發生。
    B: 最低溫度反映窗口內最冷的讀值，無法直接表示連續過熱的長度。
    C: 固定取樣筆數下，溫度總和與平均值帶有相同的彙總資訊，仍未保留順序。
