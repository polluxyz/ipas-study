stem: |
  某客服平台要在收到第一封來信時，立即分派到 4 個部門。離線測試以歷史結案工單為輸入，包含來信與後來的客服回覆，準確率達 98%。人工發現回覆常直接寫出承辦部門。若要評估收到來信當下的分流能力，最適合如何修正測試輸入？
options:
  A: 保留結案全文，將各部門的測試工單數調成相同
  B: 保留結案全文，移除客戶姓名及工單流水號欄位
  C: 保留結案全文，換成另一月份的工單作為測試集
  D: 限定為分派前可取得的來信，重新訓練並做測試
answer: D
explanation:
  summary: 客服分流的輸入必須限於派單當時可取得的文字。
  correct: 後續回覆帶有處理結果，也是在首次派單後才出現的資訊。訓練與測試都應使用當時能取得的來信，才能衡量上線時實際可用的分流能力。
  wrong:
    A: 平衡測試類別有助觀察各部門表現，但後續回覆仍提前透露承辦部門。
    B: 移除身分欄位可以處理部分不必要資訊，不能排除客服回覆透露的派單結果。
    C: 換月份可檢查時間上的泛化，但每筆輸入仍包含首次分派當下尚不存在的回覆。
guide_refs: [guide-1:3-30, guide-3:5-18]
