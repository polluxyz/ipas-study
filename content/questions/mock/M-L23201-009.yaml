stem: 某裝置有 2 個二元開關。狀態 (0,0)、(1,1) 標為正常，(0,1)、(1,0) 標為異常。資料已包含 4 種狀態且標籤沒有雜訊。團隊以單一線性分界訓練，卻無法將訓練資料全數分對。下列改善方向何者最適合？
options:
  A: 加入兩開關的交互作用特徵，再訓練分類器
  B: 維持原有線性特徵，只增加同樣狀態的樣本
  C: 維持原有線性特徵，只將梯度下降步長調小
  D: 維持原有線性特徵，只降低現有的正則化強度
answer: A
explanation:
  summary: 線性不可分的資料需要改變表示或容許非線性邊界。
  correct: 4 個狀態構成互斥或關係，二維中無法由一條直線分開。加入 x₁x₂ 後，可用 x₁+x₂-2x₁x₂ 判別異常，擴充了模型可表示的規律。
  wrong:
    B: 重複增加相同 4 種狀態，不會改變其線性不可分的幾何結構。
    C: 調整步長能改善求解過程，但不能讓單一直線表示原本不存在的分界。
    D: 減弱正則化會容許較大係數，但邊界仍是直線，無法解決此表示能力限制。
