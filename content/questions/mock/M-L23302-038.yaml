stem: 某零件專案用 200 張與 600 張標註圖做先導實驗。增加資料後，同一模型的訓練分數大致不變，保留驗證分數明顯改善，但兩者仍有差距。團隊只能選一項主要投入。依現有證據，下列方案何者最值得優先驗證？
options:
  A: 補充具代表性的標註圖，持續追蹤驗證改善
  B: 擴大網路的層數與寬度，優先壓低訓練誤差
  C: 增加相同圖片的訓練輪數，優先提升訓練分數
  D: 篩掉較難的訓練圖片，優先降低訓練資料難度
answer: A
explanation:
  summary: 學習曲線能協助分配收集資料與擴大模型的投入。
  correct: 增加標註已顯示能改善未見資料表現，訓練分數卻沒有明顯改變。這支持優先檢驗更多代表性資料的效益，並持續觀察是否逐漸飽和。
  wrong:
    B: 目前主要證據是增加資料縮小泛化差距，擴大模型雖可能更會擬合，卻沒有優先改善驗證的直接依據。
    C: 延長訓練可能繼續提高擬合程度，但題目沒有顯示訓練不足是主因，且可能擴大泛化差距。
    D: 移除困難圖片可能提高訓練分數，卻降低對實際困難案例的代表性，不能取代補足資料。
