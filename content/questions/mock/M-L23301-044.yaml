stem: 某團隊先把全部 8 位元影像的像素除以事先固定的 255，再進行 5 摺交叉驗證。這個除數來自像素格式，並非觀察資料後估計。各摺分類器只使用訓練資料擬合。若要避免前處理造成資料洩漏，後續安排何者最適合？
options:
  A: 保留固定轉換，再以全部影像估計每通道平均值進行中心化
  B: 改以各摺訓練與驗證影像各自的最大像素值作為縮放除數
  C: 將固定轉換只套用於訓練影像，驗證影像維持原始像素值
  D: 保留全部影像的固定轉換，需擬合的處理器另在各摺訓練
answer: D
explanation:
  summary: 事先固定的逐筆轉換，與使用驗證資料估計轉換參數不同。
  correct: 除以固定的 255 不需觀察其他影像，也沒有使用驗證標籤或統計量，因此可在切分前執行。若後續加入需估計平均值、尺度或特徵方向的處理器，則只能用各摺訓練資料擬合，再轉換驗證資料。
  wrong:
    A: 每通道平均值是從資料估計的參數。使用全部影像估計，就讓驗證資料參與前處理的擬合，與固定除以 255 的情況不同。
    B: 各自用最大像素值縮放會讓訓練與驗證使用不同的轉換參數；驗證轉換也不再是只沿用訓練流程。
    C: 分類器在縮放後像素上訓練，卻收到未縮放的驗證像素，輸入尺度不一致。避免洩漏不是省略驗證資料的同一固定轉換。
