stem: 某模型權重 w=(-2,1,3)，不計偏差。指定 L1 懲罰為 λΣ|wi|，L2 懲罰為 λΣwi²，兩者 λ 都是 0.5，沒有另加 1/2。兩種懲罰值依序為多少？
options:
  A: 3 與 7
  B: 1 與 7
  C: 6 與 14
  D: 3 與 3.5
answer: A
explanation:
  summary: L1/L2 懲罰數值。
  correct: L1 為 0.5×(2+1+3)=3。L2 為 0.5×(4+1+9)=7；本題已明確排除另外的 1/2 係數。
  wrong:
    B: 第一項直接把帶符號權重相加，沒有使用 L1 所要求的絕對值。
    C: 這是兩種未乘 λ 的總和，漏掉題目指定的 0.5。
    D: 第二項額外乘了 1/2，與本題明定的 L2 形式不同。
