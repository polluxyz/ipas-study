stem: 某工程師檢查動量更新方向。以下 v 是累積梯度，beta 是動量係數，lr 是學習率。程式沒有其他更新機制。執行後 w 的值及變動方向何者最正確？
code: |
  w = 2.0
  v = 10.0
  grad = -2.0
  beta = 0.9
  lr = 0.1
  v = beta * v + grad
  w = w - lr * v
  print(round(w, 1))
code_lang: python
options:
  A: w=2.7；歷史動量主導這次更新，所以參數增加
  B: w=1.8；只沿本次負梯度更新，所以參數減少
  C: w=2.2；只由本次梯度決定，所以參數增加
  D: w=1.3；歷史動量主導這次更新，所以參數減少
answer: D
explanation:
  summary: 動量的累積方向可能與本次梯度方向不同。
  correct: 新 v=0.9×10-2=7，因此 w=2-0.1×7=1.3。本次梯度雖為負，累積梯度仍為正，所以這一步使 w 減少。
  wrong:
    A: 新 v 為正，更新式是從 w 減去 lr×v，因此參數會減少，不會增加到 2.7。
    B: 若只使用本次梯度 -2，減去 lr×grad 應使 w 增加到 2.2，而不是減少到 1.8。
    C: 2.2 是忽略歷史 v 的普通梯度下降結果，沒有執行程式中的動量累積。
