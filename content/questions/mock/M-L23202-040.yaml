stem: 某商店的 1000 筆交易中，950 筆購買茶；100 筆購買杯，其中 90 筆也購買茶。團隊看到「買杯則買茶」的信賴度為 90%，就打算把杯列為茶的正向搭配。若只依這份交易的關聯指標，下列判斷何者最正確？
options:
  A: 信賴度達 90%，表示買杯者比一般顧客更常買茶
  B: 提升度小於 1，表示買杯者買茶的比例低於整體
  C: 支持度達 9%，表示買杯使買茶的比例提高 9 個百分點
  D: 反向規則具有相同提升度，因此反向信賴度也為 90%
answer: B
explanation:
  summary: 高信賴度仍須和後件商品的普遍程度比較。
  correct: 買杯者買茶的比例為 0.90，整體買茶比例為 0.95。提升度為 0.90/0.95，約 0.947，小於 1，不能據此當成正向搭配。
  wrong:
    A: 90% 低於整體的 95%，只看信賴度會忽略茶本來就很常被購買。
    C: 支持度 9% 是共同出現的交易占比，不是購買行為的增加幅度，也沒有因果意義。
    D: 提升度對交換方向是對稱的，但信賴度的分母不同；反向信賴度為 90/950，約 9.47%。
