stem: 某企業代理以對話識別碼保存工作記憶。不同員工登入後都從編號 1 開始，因此同一識別碼可能屬於不同員工。文件檢索權限檢查正常，但乙員工的回答引用了甲員工先前上傳的私人草稿。最適合先修正哪項設計？
options:
  A: 以租戶、使用者與對話識別碼隔離記憶，並驗證讀寫身分
  B: 依文件的檢索相似度排序工作記憶，再只保留最相關內容
  C: 對工作記憶產生更短摘要，再沿用原有的對話識別碼保存
  D: 將工作記憶改存加密資料庫，再按原有的對話識別碼載入
answer: A
explanation:
  summary: 對話記憶須使用足以區分身分範圍的儲存鍵。
  correct: 局部對話識別碼會碰撞，使不同員工載入同一記憶。加入租戶與使用者範圍，並驗證請求身分是否可讀寫該記憶，能直接處理私人草稿跨使用者流出的路徑。
  wrong:
    B: 相關性不能判斷資料屬於誰；私人草稿即使與乙的問題相關，也沒有因此取得分享授權。
    C: 摘要可能保留私人內容。沿用會碰撞的儲存鍵，仍會把摘要載入其他員工的對話。
    D: 加密可保護靜態資料，但服務解密後仍按錯誤識別碼載入，沒有修正記憶歸屬與存取範圍。
