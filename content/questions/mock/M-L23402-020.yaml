stem: 某團隊以獨立驗證集選模型。內部標準要求兩群合格者召回率都至少 0.75，且兩群差距不超過 0.05；達標者中選每月成本最低者。甲模型：(0.90,0.80)、成本 8；乙：(0.73,0.73)、成本 3；丙：(0.80,0.78)、成本 5；丁：(0.85,0.82)、成本 7。成本單位相同。最適合選哪個？
options:
  A: 甲模型
  B: 乙模型
  C: 丙模型
  D: 丁模型
answer: C
explanation:
  summary: 公平性差距、各群效能下限與成本需共同檢查。
  correct: 甲的差距為 0.10，乙的兩群召回率皆低於 0.75，因此都未達標。丙與丁都符合下限及差距要求；丙成本 5 低於丁的 7，故應選丙。
  wrong:
    A: 甲雖有較高的單群召回率，但兩群差距 0.10 超過 0.05，未達內部標準。
    B: 乙的差距為 0，但兩群召回率 0.73 皆低於下限；不能只以差距最小選模型。
    D: 丁符合各項效能標準，但成本高於同樣符合標準的丙，不符合達標後成本最低的規則。
