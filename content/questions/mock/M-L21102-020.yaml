stem: 某影像團隊處理 1,000 張遮罩標註。逐張從零標註需 6 分鐘。預標註試驗中，880 張各需 2 分鐘完成校對，另 120 張各需 6 分鐘重做；兩種時間皆含該張最終核對。模型執行不占人工時間。若維持相同品質，預標註方案共需多少人工分鐘？
options:
  A: 2,000 分鐘
  B: 2,480 分鐘
  C: 2,720 分鐘
  D: 6,000 分鐘
answer: B
explanation:
  summary: 預標註工時需合計校對與失敗重做兩類成本。
  correct: B 為 880×2＋120×6＝2,480 分鐘。與從零標註的 6,000 分鐘比較，這組試驗條件下減少 3,520 分鐘；不能只用模型產生標籤的速度估計人工成本。
  wrong:
    A: 1,000×2＝2,000 把需重做的 120 張也算成只需 2 分鐘，漏掉額外重做工時。
    C: 2,720 來自先算全部 1,000 張各 2 分鐘，再加 120 張各 6 分鐘；但題目 6 分鐘已是這些圖的完整工時，重複計入 240 分鐘。
    D: 6,000 是全部從零標註的工時，沒有採用已量到的 880 張校對只需 2 分鐘這項條件。
