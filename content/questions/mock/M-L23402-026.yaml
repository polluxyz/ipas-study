stem: |
  某篩選模型未輸入群體欄位，但保留地區與服務類型。資料有 4 種組合，各 100 人：北區／甲類、北區／乙類、南區／甲類、南區／乙類。第 1 與第 4 種組合屬第一群，第 2 與第 3 種屬第二群。每個地區、每個服務類型單獨看都是兩群各半。稽核想確認這 2 個欄位能否共同代理群體身分，最適合怎麼做？
options:
  A: 分別比較地區與群體的關聯，據此判定代理程度
  B: 評估地區與服務類型的組合能否辨識群體
  C: 分別比較服務類型與群體的關聯，據此判定代理程度
  D: 比較兩群樣本總數，據此判定欄位的代理程度
answer: B
explanation:
  summary: 單一欄位與群體無關聯，不代表欄位組合也無法透露群體。
  correct: 本例地區或服務類型單看都無法分群，但二者的組合能直接辨識群體。代理變數檢查需涵蓋組合關係，才能判斷模型是否仍可取得群體線索；能辨識群體本身也不等於已證明不公平結果。
  wrong:
    A: 只查地區會看到兩群各半，漏掉地區與服務類型的交互關係。模型仍可能從組合取得群體線索。
    C: 只查服務類型也會看到兩群各半，無法排除兩欄共同透露身分的情況。
    D: 兩群樣本總數相同只表示人數平衡，不能判斷輸入欄位能否推知某筆資料的群體身分。
