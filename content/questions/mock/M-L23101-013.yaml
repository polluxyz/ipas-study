stem: 某團隊以 12 組配對資料，檢驗兩版模型的平均誤差是否相同。雙尾檢定的 p 值為 0.28，事前顯著水準為 0.05。主管要確認差異是否小到可忽略，並已定義可接受範圍為 ±0.5。下列結論何者最正確？
options:
  A: 差異證據不足；等效性仍須依 ±0.5 另作檢驗
  B: 已證明兩版等效；等效範圍可直接設為 ±0.5
  C: 平均誤差相同的機率為 72%；可接受兩版等效
  D: 平均差落在 ±0.5 的機率為 28%；應拒絕等效
answer: A
explanation:
  summary: 未拒絕零差異假設，不等於證明差異在等效範圍內。
  correct: p=0.28 大於 0.05，只能說此檢定未取得足夠差異證據。要主張差異可忽略，須把 ±0.5 的實務界線納入等效性檢定，並檢查估計的不確定性。
  wrong:
    B: 差異檢定未顯著，可能只是樣本少或變異大。它沒有驗證平均差已落入預設的等效範圍。
    C: 1-p 不是平均誤差相同的機率。p 值不能轉成虛無假設為真的機率。
    D: p 值並非平均差落入某個範圍的機率。此數值本身也不能用來拒絕等效。
