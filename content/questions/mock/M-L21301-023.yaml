stem: 某團隊以舊模型預標 2,000 張影像，再讓 2 位標註員各自確認。兩人的一致率為 98%，但專家抽查發現兩人常一起接受舊模型漏掉的細小瑕疵。下一批若要確認標註正確性，哪項品質檢查最適合？
options:
  A: 增加預標模型的信心門檻，以高信心標籤占比作為品質指標
  B: 統計兩位標註員的作業速度，以每小時處理量作為品質指標
  C: 增加參與預標確認的人數，以同意預標的比例作為品質指標
  D: 加入不顯示預標的專家參考樣本，核對瑕疵漏標與標籤正確性
answer: D
explanation:
  summary: 標註者一致，仍可能一起受到預標結果影響。
  correct: 一致率只能顯示標註者彼此是否同意，不能證明共同答案正確。不顯示預標的專家參考樣本可減少相同提示造成的偏向，直接檢查細小瑕疵是否被漏掉。
  wrong:
    A: 高信心不能保證舊模型沒有系統性漏判。模型未辨認的細小瑕疵仍可能得到很高的正常信心。
    B: 處理速度反映效率，無法判定影像中的瑕疵有沒有被正確標記。
    C: 若新增人員仍受相同預標影響，多人同意也可能共同接受同一個錯誤。
