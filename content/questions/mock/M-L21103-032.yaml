stem: 某問答模型會自行填寫 0 至 100 的信心分數。人工核對 100 則自評 90 分以上的回答，只有 60 則事實正確。團隊想依信心自動放行。最適合先採取哪項措施？
options:
  A: 將提示改成以專家身分評分，再沿用 90 分的放行門檻
  B: 要求同一模型補寫信心理由，再按理由長度調整分數
  C: 把信心改成 5 個星級，再以最高星級作為放行條件
  D: 用獨立標註資料驗證分數與錯誤率，再訂放行條件
answer: D
explanation:
  summary: 模型自行陳述的信心需另以真實標註驗證。
  correct: D 以已核對的正誤資料檢驗分數是否具有區分能力及是否需要校準。現有結果已顯示高自評不等於同等正確率，不能把 90 分直接解讀為至少 90% 可靠。
  wrong:
    A: 專家角色是文字提示，沒有驗證自評分數的實際可靠性，不能據此沿用放行門檻。
    B: 信心理由也由同一模型產生，長度不能替代事實查核，可能只是更長地解釋錯誤。
    C: 換成星級只改顯示尺度，沒有改善分數與真實正誤之間已觀察到的落差。
