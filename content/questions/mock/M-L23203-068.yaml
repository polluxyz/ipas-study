stem: 某公司要把已收齊的申訴文件分成 8 類，不需產生回覆。團隊希望每個詞的表示可利用文件左右兩側內容，再直接接分類層。若以現成預訓練架構為起點，哪項最符合要求？
options:
  A: 採用單向解碼器，從最末位置輸出文件類別
  B: 採用雙向編碼器，彙整文件表示後輸出類別
  C: 採用單向循環網路，從最後狀態輸出類別
  D: 採用單向解碼器，逐字產生類別名稱文字
answer: B
explanation:
  summary: 雙向編碼器適合以完整上下文建立分類表示。
  correct: 需求明確指定各詞表示可讀左右文，且只需分類。雙向預訓練編碼器再接分類層符合這兩項條件，無須額外建立文字生成流程。
  wrong:
    A: 最末位置雖可取得前文，但單向解碼器中每個詞的表示不能讀取右側內容。
    C: 單向循環狀態只累積過去資訊，並未讓各詞表示同時納入左右文。
    D: 生成類別文字可完成分類任務，但單向架構不符合各詞表示可見左右文的指定條件。
