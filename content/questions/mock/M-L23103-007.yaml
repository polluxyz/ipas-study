stem: 某工程師因記憶體限制，把 100 筆資料拆成 80 筆與 20 筆兩批。兩批在相同參數處分別計算平均損失 L₁、L₂，最後只更新 1 次。模型不含批次相依運算或隨機層。若要與 100 筆平均損失的梯度一致，累積前應採用哪個損失？
options:
  A: 使用 0.8L₁+0.2L₂，再計算這次更新的梯度
  B: 使用 0.5L₁+0.5L₂，再計算這次更新的梯度
  C: 使用 0.2L₁+0.8L₂，再計算這次更新的梯度
  D: 使用 L₁+L₂，再計算這次更新的梯度
answer: A
explanation:
  summary: 不同大小批次的平均損失須按樣本數加權。
  correct: 全體平均損失為 (80L₁+20L₂)/100。微分具有線性性，因此採 0.8 與 0.2 加權可得到同一組參數處的全體平均梯度。
  wrong:
    B: 對兩個批次等權平均，會讓 20 筆的小批次與 80 筆的大批次有相同影響，小批次的每筆樣本被加重。
    C: 權重與批次大小相反，會更強地放大 20 筆小批次的影響。
    D: 直接相加兩個批次平均，既沒有按樣本數加權，也沒有得到全體平均的尺度。
