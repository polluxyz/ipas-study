stem: 某二元分類器在故障比例為 50% 的來源環境，對特定特徵 x 輸出已校準的故障機率 80%。目標環境故障比例降為 20%，且故障與正常各類別內的特徵分布維持不變。只校正類別先驗後，目標環境的 P(故障｜x) 最接近多少？
options:
  A: 50%
  B: 64%
  C: 80%
  D: 95%
answer: A
explanation:
  summary: 類別先驗改變時，須在勝算上校正後驗。
  correct: 來源後驗勝算為 0.8/0.2=4，來源先驗勝算為 1，因此 x 的似然比為 4。目標先驗勝算為 0.2/0.8=0.25，目標後驗勝算為 4×0.25=1，換成機率為 50%。
  wrong:
    B: 64% 對應直接用機率乘上正常比例 0.8，沒有同時正規化故障與正常的權重。
    C: 類別內特徵分布不變不代表後驗不變；目標環境的故障先驗已下降。
    D: 95% 會把降低的故障先驗朝相反方向校正；本例新先驗應降低故障後驗。
