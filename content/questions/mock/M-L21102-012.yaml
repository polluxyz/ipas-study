stem: 某倉庫已標出 2,000 張銘牌照片中文字行的邊界框，準備訓練能輸出品號字串的辨識器。資料目前只有文字框與「文字」類別。若採逐行監督訓練，最需要補上哪項標註？
options:
  A: 每個文字框與整張銘牌的面積比例
  B: 每個文字框所屬的拍攝視角類別
  C: 每個文字框所對應的正確轉錄字串
  D: 每張銘牌所對應的整體文字行數
answer: C
explanation:
  summary: 文字區域定位與文字內容辨識需要不同標註。
  correct: 邊界框只指出文字在哪裡。要學習從每行影像輸出品號字串，必須有與該框配對的正確轉錄，才能計算內容辨識的訓練誤差。
  wrong:
    A: 面積比例有助於描述文字區域大小，但無法指出品號應包含哪些字元。
    B: 視角標籤可用於校正或分析拍攝條件，沒有提供辨識器要生成的字串。
    D: 行數可以描述版面結構，不能取代逐行品號的內容真值。
