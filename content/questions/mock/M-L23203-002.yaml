code: |
  import torch
  backbone = torch.nn.Linear(2, 2, bias=False)
  head = torch.nn.Linear(2, 1, bias=False)
  with torch.no_grad():
      backbone.weight.copy_(torch.eye(2))
      head.weight.fill_(1.0)
  for parameter in backbone.parameters():
      parameter.requires_grad = False
  y = head(backbone(torch.ones(1, 2)))
  y.sum().backward()
  print(backbone.weight.grad is None)
  print(head.weight.grad is not None)
