stem: 某平台比較新舊推薦模型，希望判斷模型是否增加購買。試行組同時使用新版模型與 9 折優惠，對照組則使用舊版與原價，使用者已隨機分組。試行組購買率較高，團隊要決定是否全面發布新版。最適合補做哪項驗證？
options:
  A: 延長現有兩組的觀察時間，待每組累積更多購買事件後比較
  B: 增加現有試行組的使用者比例，維持兩組原有的優惠配置
  C: 比較兩組使用者的年齡與購買紀錄，確認隨機分組沒有明顯失衡
  D: 在相同優惠條件下隨機比較兩個模型，再觀察購買與服務指標
answer: D
explanation:
  summary: 發布驗證要區分模型效果與同時改動的業務條件。
  correct: 原配置同時改變模型與價格，無法將購買差異單獨歸因於模型。固定優惠條件後比較兩版，才能取得較直接的模型效果證據，並同步檢查服務品質。
  wrong:
    A: 更多觀察可降低抽樣波動，但價格差異仍與模型綁在一起，無法單獨辨識模型貢獻。
    B: 增加比例可收集更多試行資料，仍未拆開模型與優惠的共同影響，還會擴大未確認效果的發布範圍。
    C: 檢查分組平衡有價值，但兩組刻意配置不同優惠，事前使用者特徵平衡也不能排除價格效果。
