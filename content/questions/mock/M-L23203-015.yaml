stem: 某文字模型因記憶體限制，每批只能放 1 句。每個詞仍有 256 維特徵。團隊希望正規化每個詞的特徵，且同一句的結果不受同批其他句子影響。最適合的設計為何？
options:
  A: 以批次正規化合併不同句子的統計，讓詞向量共用批次尺度
  B: 以層正規化處理各詞的 256 維特徵，在單一詞向量內取統計
  C: 以 Softmax 處理整句所有詞的位置，把每個詞轉成位置機率
  D: 以最大池化取出各詞最大的特徵值，把 256 維壓成單一值
answer: B
explanation:
  summary: 正規化的統計軸須符合單筆表示與批次獨立的需求。
  correct: 層正規化可針對每個詞的特徵維度計算平均與變異數，不需跨句子收集統計。因此批次大小為 1 仍可運作，也符合題目指定的統計範圍。
  wrong:
    A: 跨句子統計會依賴同批樣本，與題目要求相反。單純替換批次統計的設定不等於在詞向量內正規化。
    C: Softmax 把分數轉成機率分布，沒有對各詞的 256 維表示進行所需的中心化與尺度調整。
    D: 最大池化會減少特徵維度；本題要保留詞向量並調整尺度，不是只取最大特徵。
