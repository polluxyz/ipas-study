stem: 某倉庫預測每日退貨件數，有些日子的實際退貨量為 0。驗收關心平均每天錯估幾件。團隊考慮平均絕對百分比誤差（MAPE），其逐筆誤差為「絕對偏差除以實際件數」，再取平均並乘 100%。下列評估安排何者最適合？
options:
  A: 採平均絕對誤差，納入零退貨日一起評估
  B: 採百分比誤差，僅保留實際退貨量非零的日子
  C: 採百分比誤差，將零退貨日的實際量改為 1 件
  D: 採平均有方向的誤差，讓高估與低估彼此抵銷
answer: A
explanation:
  summary: 有零實際值且關心件數偏差時，平均絕對誤差較符合目標。
  correct: 實際量為 0 時，題定的百分比誤差會除以 0。平均絕對誤差可保留零退貨日，且單位就是驗收要求的件數。
  wrong:
    B: 排除零退貨日會改變評估對象，無法反映包含零退貨日的整體日常預測品質。
    C: 把真實的 0 改成 1 會改變真值與誤差權重，評估不再直接對應實際件數偏差。
    D: 高估和低估可能互相抵銷，即使每天偏差很大也能得到接近 0，不能代表平均錯估件數。
