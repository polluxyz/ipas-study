stem: 某分類任務有 3 萬篇短文件、20 萬個稀疏詞頻欄位。小規模驗證支持近似線性分類邊界。部署裝置以模型常駐記憶體為主要限制，團隊也希望新訓練樣本增加時，不必保存每篇文件。下列起始模型何者最適合？
options:
  A: 採最近鄰分類器，保存文件向量供查詢時計距
  B: 採徑向基底核支援向量機，保存支援向量供預測
  C: 採無隱藏層自編碼器，使用文件重建誤差來分類
  D: 採支援稀疏輸入的邏輯迴歸，保存係數供預測
answer: D
explanation:
  summary: 高維稀疏且近似線性的分類任務，可先比較參數化線性模型。
  correct: 邏輯迴歸可直接使用稀疏詞頻，部署主要保存各欄係數與截距。參數大小依詞彙數與類別數決定，不需要像最近鄰保存整批文件，也不依支援向量數增加。
  wrong:
    A: 最近鄰需保存參考文件，新增樣本會增加常駐資料及查詢成本，不符合此處的部署偏好。
    B: 核模型需保存支援向量，數量可能隨樣本增加；題目已有近似線性邊界的證據，不需先付出核展開成本。
    C: 重建誤差反映文件可重建程度，不能直接代表這個有標註分類任務的不同類別。
