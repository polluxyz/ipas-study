stem: 某手冊查詢服務已取得正確段落。使用者可能問「在哪裡重設」或「多久要更換」。每個答案都在段落中連續出現，系統須回傳答案字串及起訖位置。問題類型會增加，最適合以哪種任務作為核心？
options:
  A: 以問題與段落為輸入，預測答案的文字範圍
  B: 以段落為輸入，標出其中的人名與地名範圍
  C: 以段落為輸入，挑選整篇手冊的代表關鍵詞
  D: 以問題為輸入，分類後取出固定的標準句子
answer: A
explanation:
  summary: 擷取式問答依問題在已知內容中定位答案。
  correct: A 讓同一段落隨問題改變而選取不同答案範圍，可直接保留字串與位置。這是擷取式問答，適用於本題已知答案為連續原文的條件。
  wrong:
    B: 人名與地名辨識只處理預定實體類型，不能依不同問題找出操作位置或更換週期。
    C: 代表關鍵詞反映段落主題，不保證回答使用者的特定問題，也不等於完整答案範圍。
    D: 固定句庫可服務有限且穩定的問法，本題答案依手冊段落而變，新增問題類型時也缺少可直接查取的固定答案。
