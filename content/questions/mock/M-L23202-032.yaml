stem: 某工程師固定資料與 eps，將 DBSCAN 的 min_samples 從 4 提高至 8。原先連接兩塊高密度區的狹窄區域，有些點的鄰域只有 5 至 7 點。關於重新分群的結果，下列敘述何者最正確？
options:
  A: 核心點集合可能擴大，原有群可能因而合併
  B: 核心點集合維持不變，只有群編號可能交換
  C: 核心點集合可能縮小，群數因此只能維持或減少
  D: 核心點集合可能縮小，原有群可能分裂成多群
answer: D
explanation:
  summary: 提高密度門檻可能切斷核心點連接路徑。
  correct: 固定半徑下，達到 8 點門檻的核心點原本也達到 4 點門檻，所以核心點集合不會擴大。連接區的點失去核心資格後，兩側可能分開，群數可增加。
  wrong:
    A: 提高最少點數不會讓原本未達門檻的點變成核心點，也不會創造新的核心連接。
    B: 鄰域只有 5 至 7 點的原核心點會失去資格，變動不只是群號交換。
    C: 核心點減少不代表群數必定減少；連接路徑中斷可把 1 群拆成 2 群。
