stem: 某故障分類器採等權 K 最近鄰。資料中有少量故障案例形成緊密小區域，外圍有大量正常案例。把 K 從 5 提高到 101 後，故障區附近的預測常被外圍正常票數改判。若要保留局部故障辨識能力，最適合優先採哪項作法？
options:
  A: 直接把 K 固定為 1，省略不同鄰居數的驗證比較
  B: 縮小 K 的候選範圍，以交叉驗證比較故障辨識
  C: 縮小 K 的候選範圍，只以整體正確率選擇最佳值
  D: 縮小 K 的候選範圍，以訓練集自我預測選擇最佳值
answer: B
explanation:
  summary: 鄰居數過多可能使少數類別的局部邊界被模糊。
  correct: 目前錯誤來自較遠的正常樣本壓過局部故障案例。較小 K 可保留局部結構，但也較受雜訊影響，所以需用交叉驗證比較故障辨識與整體表現。
  wrong:
    A: K 為 1 能保留很小的局部區域，但也容易受單一雜訊或錯標案例影響。未經驗證便固定為 1，不能確認故障辨識是否改善。
    C: 正常案例占多數時，即使漏判大量故障，整體正確率仍可能很高。只看這個指標，無法確認局部故障是否被辨識。
    D: 用建立鄰居集合的同一批資料自我預測，會高估辨識能力。尤其 K 為 1 且包含樣本本身時，命中率不能代表新案例的表現。
