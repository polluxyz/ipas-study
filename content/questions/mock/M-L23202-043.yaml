stem: 某故障分類器採等權 K 最近鄰。資料中有少量故障案例形成緊密小區域，外圍有大量正常案例。把 K 從 5 提高到 101 後，故障區附近的預測常被外圍正常票數改判。若要保留局部故障辨識能力，最適合優先採哪項作法？
options:
  A: 提高 K，讓每次投票涵蓋更多正常案例
  B: 降低 K 的候選範圍，以交叉驗證比較故障辨識
  C: 增加正常案例的投票權重，維持目前 K
  D: 把鄰居投票改成全訓練集的多數類別判斷
answer: B
explanation:
  summary: 鄰居數過多可能使少數類別的局部邊界被模糊。
  correct: 目前錯誤來自較遠的正常樣本壓過局部故障案例。較小 K 可保留局部結構，但也較受雜訊影響，所以需用交叉驗證比較故障辨識與整體表現。
  wrong:
    A: 更大的鄰居範圍會再納入外圍正常案例，與目前需要保留局部故障訊號的方向相反。
    C: 提高正常票權會加重題目已觀察到的多數類別壓制，沒有改善局部故障辨識。
    D: 全體多數類別會忽略新樣本所在的局部區域，無法利用緊密故障群的位置資訊。
