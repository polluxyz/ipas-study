stem: 某企業助理的問題有 80% 是固定格式的狀態查詢，其餘是跨文件推理。獨立驗收顯示，便宜的小模型只在狀態查詢達標，大模型在兩類都達標；現有入口規則可可靠區分這兩類任務。若要降低生成成本並維持各類門檻，最適合如何部署？
options:
  A: 將兩類任務平均分給小模型與大模型，再監測整體通過率
  B: 將兩類任務先交小模型，只在語言模型自評低信心時升級
  C: 將狀態查詢導向小模型，跨文件推理導向大模型並分群驗證
  D: 將兩類任務改由小模型處理，並將每次檢索文件數提高
answer: C
explanation:
  summary: 已知任務差異與品質邊界時，可依任務路由到符合門檻的模型。
  correct: 狀態查詢可用達標的小模型節省成本，跨文件推理仍使用已達標的大模型。分群驗證能確認路由後兩類都保持要求，避免占比高的簡單任務掩蓋推理任務退步。
  wrong:
    A: 平均分配會讓部分跨文件推理交給未達該類門檻的小模型，整體通過率也可能掩蓋此問題。
    B: 題目未證明模型自評能辨認推理失敗。未校驗的自評信心不能取代已有依據的任務分類規則。
    D: 更多文件不能保證小模型獲得缺少的推理能力，還可能增加輸入成本，需重新驗收才有採用依據。
