stem: 某倉儲 AI 分流系統的損失主要來自少見的「危險品誤送一般區」。試辦計畫只要求抽 500 件一般到貨，檢查總準確率達 95%；資料中危險品很少。若要讓驗收對應主要業務風險，最適合補上哪項安排？
options:
  A: 改抽 1,000 件一般到貨，仍以總準確率作為單一門檻
  B: 提高一般到貨的平均準確率門檻，維持相同的抽樣方式
  C: 加入更高尖峰到貨量，改以整體回應時間作為驗收
  D: 增設危險品代表性測試，明定誤送門檻及人工處理流程
answer: D
explanation:
  summary: 驗收資料與通過條件要涵蓋少見但損失嚴重的情境。
  correct: 一般抽樣可能無法提供足夠危險品證據。應另設具代表性的關鍵情境測試，指定可接受的誤送條件及人工處理方式。整體準確率可以保留，但不能替代對主要損失來源的驗證。
  wrong:
    A: 增加一般到貨數量未必提供足夠危險品案例，單一平均門檻仍可能掩蓋關鍵錯誤。
    B: 較高的整體門檻仍可能讓少數嚴重錯誤被大量一般貨物的正確結果稀釋。
    C: 負載與回應時間重要，但無法證明危險品會被送到正確區域，測到的是另一個問題。
