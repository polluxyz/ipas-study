stem: 某工廠以良品及瑕疵品訓練分類器。訓練後有 40 件樣本的損失特別高，其中多數是少見的裂縫形態。工程師回查原圖與複檢紀錄，確認影像清楚、裂縫真實且標籤正確。針對這 40 件樣本，下列處理何者最適合？
options:
  A: 降低這些樣本的訓練權重後再建模
  B: 改採目前模型的預測類別作為標籤
  C: 保留這些樣本並補充同類裂縫的有效案例
  D: 按訓練損失排序刪除這批樣本後再建模
answer: C
explanation:
  summary: 模型難以學習的稀有真實案例，不應直接視為錯誤資料。
  correct: 資料證據已確認樣本有效。高損失反映模型尚未學好少見形態，保留並增加同類真實案例可補足覆蓋範圍。
  wrong:
    A: 降低有效裂縫樣本的權重，會減少模型學習少見形態的機會，並未處理覆蓋不足。
    B: 目前模型正是未能辨認這些裂縫，採用它的預測會把已確認的正確標籤改錯。
    D: 依高損失刪除會排除業務需要辨認的真實裂縫，使資料更集中於容易的案例。
