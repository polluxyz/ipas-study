stem: 某系統把 10 維感測資料依序乘上 W₁（10×2）與 W₂（2×10），中間不加非線性運算。輸入資料張成 3 維線性子空間。團隊要求每筆輸入經兩層轉換後都能精確重建。下列判斷何者最正確？
options:
  A: 把 W₂ 設成 W₁ 的轉置，即可達成精確重建
  B: 把 W₂ 的每欄正規化，即可達成精確重建
  C: 把 W₁ 的非零元素放大，即可達成精確重建
  D: 把中間維度提高至至少 3，才可能達成精確重建
answer: D
explanation:
  summary: 線性串接的矩陣秩受中間維度限制。
  correct: 有效轉換 W₁W₂ 的秩最多為 2，無法在 3 維輸入子空間上保持恆等作用。中間至少要有 3 維，才有可能選到能精確保留該子空間的兩個矩陣；增加維度只是必要條件。
  wrong:
    A: 轉置能形成投影類型的運算，但經過 2 維中間表示後，仍無法保留 3 個獨立方向。
    B: 欄向量正規化可調整尺度，不能突破乘積矩陣秩最多為 2 的限制。
    C: 放大元素可改變縮放倍率，不能增加中間空間的維度或恢復已丟失的獨立方向。
