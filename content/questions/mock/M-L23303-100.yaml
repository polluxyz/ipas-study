stem: 某工程師用固定模型評估 4 筆驗證案件。truth 以案件編號保存真值，ids 與 pred 是載入流程回傳的案件編號及預測類別，兩者逐筆對應。每筆案件恰好預測一次。以下程式的輸出與評估修正，哪項最正確？
code: |
  truth = {101: 0, 102: 0, 103: 1, 104: 1}
  ids = [103, 101, 104, 102]
  pred = [1, 0, 1, 0]
  y = [truth[i] for i in sorted(truth)]
  accuracy = sum(t == p for t, p in zip(y, pred)) / len(y)
  print(accuracy)
code_lang: python
options:
  A: 輸出 0.5；保留目前順序，改算 F1 分數處理評估落差
  B: 輸出 0.5；分別排序 y 與 pred，再依位置計算分類準確率
  C: 輸出 0.5；只將 ids 排序，保留原 pred 再計算準確率
  D: 輸出 0.5；按 ids 取得真值，再與 pred 逐筆比較
answer: D
explanation:
  summary: 計算分類準確率前，須將每筆預測配回同一案件的真值。
  correct: y 按編號 101、102、103、104 排成 [0,0,1,1]，pred 卻按 ids 的順序回傳。zip 只依位置配對，因此只有第 2、3 個位置相等，印出 2/4=0.5。將 y 改為 [truth[i] for i in ids]，會得到 [1,0,1,0]，與 pred 完全相同，這 4 筆的準確率才是 1.0。這項修正還原案件配對，並未改變模型預測。
  wrong:
    A: F1 也需要逐筆比較同一案件的真值與預測。更換指標沒有修正配對錯誤，不能用來判斷模型品質。
    B: 各自排序會失去案件身分。即使兩份清單的類別數量相同，也可能把不同案件錯配成相等，不能據此判定預測正確。
    C: 只排序 ids 卻不一起調整 pred，會破壞兩者原有的逐筆對應。若要排序，必須連同預測一起移動，再配對同一編號的真值。
