stem: 某工程師把固定模型的 5 筆驗證資料分成 3 批，驗證期間不更新參數。程式中的 errors 是各批逐筆殘差，batch_mse 是各批均方誤差。若報表要求全部 5 筆的均方誤差，應採哪種彙總？
code: |
  errors = [[0., 2.], [1., 3.], [6.]]
  sizes = [len(batch) for batch in errors]
  batch_mse = [sum(e * e for e in batch) / len(batch)
               for batch in errors]
  print(sizes)
  print(batch_mse)
code_lang: python
options:
  A: 各批均方誤差直接加總，除以總筆數，得到 8.60
  B: 各批均方誤差直接加總，除以批次數，得到 14.33
  C: 各批均方誤差乘該批筆數後加總，除以批次數，得到 16.67
  D: 各批均方誤差乘該批筆數後加總，除以總筆數，得到 10.00
answer: D
explanation:
  summary: 彙總不等大批次的均方誤差，須先還原各批平方誤差和。
  correct: 程式印出批次筆數 [2,2,1] 與均方誤差 [2.0,5.0,36.0]。各批均方誤差乘該批筆數後，得到平方誤差和 4、10、36。全部平方誤差和為 50，除以 5 筆即為 10。直接平均各批數值會讓尾批單筆獲得過大的權重。
  wrong:
    A: 分子 2+5+36 已經包含各批自己的平均，不能再直接除以 5；須先乘回各批筆數。
    B: 14.33 是每批等權的平均，尾批只有 1 筆，卻與前兩批各占相同權重，不是逐筆等權的均方誤差。
    C: 分子已正確還原成 50，但分母用了 3 批。均方誤差的分母應是全部 5 筆觀測值。
