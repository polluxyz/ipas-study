stem: 某排程系統有 2 個代理，可能同時替不同訂單預留同一設備時段。兩者各自先查得時段可用，再各自寫入預約，造成重複占用。每筆訂單的識別碼都不同。若要保留並行規劃，最適合由預約工具提供哪項機制？
options:
  A: 為每筆訂單使用固定重試識別碼，重試時回傳先前結果
  B: 在寫入前再查一次時段，查詢完成後直接提交預約資料
  C: 在代理提示中加入占用清單，要求代理依清單選擇時段
  D: 在同一交易內檢查時段並預留，衝突時拒絕後到的寫入
answer: D
explanation:
  summary: 跨代理的資源競爭須由共同的寫入端保護一致性。
  correct: 查詢與預留必須構成不可被其他寫入穿插的操作，例如由交易與唯一限制落實。這樣即使兩個代理都曾讀到可用，也只有符合當下狀態的預約能成功。
  wrong:
    A: 重試識別碼能防止同一訂單重送，但本例是不同訂單競爭同一時段，不能以各自識別碼排除衝突。
    B: 第二次查詢與寫入之間仍可能有另一個代理完成預約，沒有消除檢查後狀態被改變的空隙。
    C: 提示中的清單只是狀態快照，其他代理仍可能同時占用該時段，不能代替共同寫入端的一致性控制。
