stem: 某 AI 排班服務設有員工回報管道。最近 18 件回報都指出輪椅使用者被安排到無法通行的作業區；客服已逐件修正，但月報只統計平均排程耗時。依 NIST AI RMF 1.0 的 MEASURE 3.3，哪項調整最適合？
options:
  A: 將客服結案速度列為評估項目，以完成修正的耗時追蹤
  B: 將排程運算速度列為評估項目，以各時段的平均值追蹤
  C: 將回報反映的通行失敗列為評估項目，以同類案件追蹤
  D: 將員工回報總量列為使用量項目，以登入人次標準化追蹤
answer: C
explanation:
  summary: 受影響者回報的問題應回到 AI 系統的評估指標。
  correct: MEASURE 3.3 不只要求回報及申訴管道，也要求把回饋整合進系統評估指標。這些回報指出具體的通行失敗，需要建立對應指標，才能追蹤模型或排程規則是否改善。
  wrong:
    A: 結案耗時衡量客服處理效率。即使客服很快修正，系統仍可能持續產生相同的通行障礙。
    B: 運算速度不反映排班位置是否可通行，增加速度統計無法追蹤回報指出的傷害。
    D: 按登入人次統計回報量沒有辨認通行失敗的性質，會把重要的特定問題混入一般使用量。
