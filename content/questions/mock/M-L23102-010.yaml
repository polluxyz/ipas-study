stem: 某二維感測分類器將輸入依序通過 2→32、32→16、16→1 的仿射層，層間沒有激活函數。輸出會隨輸入改變，最後依輸出是否大於 0 決定類別。工程師希望加深層數後能形成彎曲邊界。下列判斷何者最正確？
options:
  A: 每增加一個隱藏層，邊界就多一段線性折角
  B: 整串仍可合成一個仿射層，邊界仍是直線
  C: 隱藏維度超過輸入維度，邊界就會形成封閉曲線
  D: 每層都有偏差項，已足以讓邊界形成非線性曲線
answer: B
explanation:
  summary: 多個仿射層若未加入非線性，合成後仍是仿射映射。
  correct: 仿射映射的串接仍可寫成 Wx+b。增加中間維度不會改變此性質，所以輸出為 0 的分界仍是二維空間中的直線；要表示彎曲邊界，需要非線性運算。
  wrong:
    A: 線性折角需要如分段激活函數等非線性機制。單純串接仿射層不會產生折角。
    C: 擴大中間維度可增加參數，但串接後的映射形式仍為 Wx+b，不會因此生成封閉曲線。
    D: 偏差項提供平移。多次平移與線性變換合成後仍為仿射映射，不會產生非線性曲線。
