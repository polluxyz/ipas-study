stem: 某物流平台要區分「甲倉 調貨 至 乙倉」與「乙倉 調貨 至 甲倉」。空白代表已切好的詞。系統只用單詞計數的詞袋向量，未保留位置。兩句方向相反卻得到相同輸入，主要原因為何？
options:
  A: 兩句動詞相同，增加分類器層數就能還原被省略的順序
  B: 兩句各詞的計數相同，詞袋未記錄調貨方向所需的語序
  C: 兩句長度相同，詞袋會將各位置的語法角色平均成向量
  D: 兩句包含倉庫名稱，詞袋會自動把名稱合併成同一個詞
answer: B
explanation:
  summary: 單詞計數相同時，詞袋無法保留由語序表達的方向。
  correct: 兩句使用相同的詞且次數一致，差異僅在排列。單詞詞袋把排列資訊省略，因此下游模型看不到甲倉與乙倉的起訖關係。需要加入語序相關特徵或採用序列表示。
  wrong:
    A: 增加分類器深度無法從相同輸入辨認已被省略的資訊，必須先調整文字表示。
    C: 單詞詞袋統計詞頻，不計算各位置的語法角色。這兩句無法區分的原因是詞頻相同而語序未保留。
    D: 題目已指定切詞結果，詞袋會分別統計甲倉與乙倉，並不因為兩者都是倉庫就合併。
