stem: 某團隊要探索正則化強度，候選範圍由 0.000001 到 100，總預算只有 12 次試驗。前期觀察顯示，效果主要隨強度的倍數變化而改變，尚未找到最佳區域。若希望各個數量級都獲得相近探索機會，下列配置何者最適合？
options:
  A: 在原始數值區間等距安排候選，讓相鄰候選差值相同
  B: 將候選集中在整個區間的算術平均附近，再逐步擴大
  C: 在整個原始數值區間均勻隨機取樣，固定總試驗次數
  D: 在強度的對數區間等距安排候選，讓相鄰候選比值相近
answer: D
explanation:
  summary: 跨多個數量級的參數，應讓搜尋尺度符合變化方式。
  correct: 對數等距代表在原始尺度以相近倍數增加，能把有限候選分配到不同數量級。這符合題目已知的倍數敏感性。選出較佳區域後，再用相同驗證規則作細部搜尋。
  wrong:
    A: 原始尺度等距會把大部分候選放在較大數值區域，小數量級只分到很少機會，不符合探索目標。
    B: 算術平均附近偏向大數值區域，尚未有證據可優先集中在該處，也無法平衡各數量級。
    C: 固定試驗次數只控制預算。原始尺度的均勻取樣仍偏向覆蓋數值跨度較大的區間，並非各數量級機會相近。
