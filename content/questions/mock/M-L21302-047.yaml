stem: 某問答系統依序經過驗證、檢索、重排與生成 4 個服務。個別服務平均延遲正常，但部分請求總耗時達 8 秒。各服務目前只記自己的隨機紀錄編號。團隊想定位單次慢請求的耗時環節，最適合新增哪項觀測設計？
options:
  A: 增加各服務平均延遲的取樣頻率，並統一儀表板刻度
  B: 將每項服務的中央處理器用量與每日請求量放在同一圖表
  C: 跨服務傳遞同一追蹤識別碼，記錄各階段起訖與父子關係
  D: 在每項服務彙整最慢的 10 筆紀錄，再比較各自延遲排名
answer: C
explanation:
  summary: 分散式追蹤把同一請求在不同服務的操作串起來。
  correct: 同一追蹤識別碼與階段關係能還原該次請求的執行路徑。起訖時間可協助辨認耗時發生於檢索、重排、生成或其間等待，而非只看各服務的整體平均。
  wrong:
    A: 更密集的平均值仍混合多筆請求，不能指出同一筆慢請求實際經歷的階段。
    B: 資源與流量圖有助於找相關性，但缺少跨服務的單次請求關聯，無法還原題目要求的耗時路徑。
    D: 每項服務最慢的紀錄可能屬於不同請求。延遲排名相近不代表那些紀錄具有因果關係。
