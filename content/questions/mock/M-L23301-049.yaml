stem: 某設備的 100 個標準化特徵經主成分分析後，前 10 個成分保留 97% 輸入變異。獨立驗證發現，故障訊號主要位於被丟棄的低變異方向，降維後召回率下降。下列判斷何者最正確？
options:
  A: 保留 97% 變異可視為保留相同比例的分類資訊
  B: 將前 10 個成分重新標準化即可重建故障方向
  C: 提高後續分類器容量即可取回被丟棄的故障方向
  D: 應把故障辨識表現納入降維維度的選擇依據
answer: D
explanation:
  summary: 輸入變異的保留比例，不等於標籤資訊的保留比例。
  correct: 主成分分析依輸入變異排序，不會自動保留對故障最有用的方向。題目已確認低變異方向帶有故障訊號，應用訓練內的驗證比較保留維度，或比較有監督的篩選方法。
  wrong:
    A: 輸入變異與類別關聯是不同量，97% 的變異不能換算為 97% 的分類資訊。
    B: 重新縮放只能改變已保留成分的尺度，無法重建已丟棄的方向。
    C: 分類器只取得降維後的輸入，容量增加不能還原投影已移除的資訊。
