stem: 某團隊將長度 24 與 80 個詞元的句子組成批次，短句在句首填補至 80 個詞元，再送入雙向編碼器。檢查發現，短句的有效詞元仍把部分注意力分配給填補位置。若要排除填補位置對有效詞元表示的影響，最適合如何處理？
options:
  A: 把填補位置的值向量設為零向量
  B: 在注意力配分時遮掉填補位置的鍵
  C: 在有效詞元上加入更強的位置編碼
  D: 將注意力限制成只能讀取前方位置
answer: B
explanation:
  summary: 區分注意力遮罩與其他序列處理。
  correct: 應在注意力配分轉為權重之前遮掉填補位置的鍵，讓有效詞元不再讀取這些位置。只把填補的值設成零，仍可能讓權重分母包含填補位置。
  wrong:
    A: 零值可以減少填補內容直接加到輸出的量，但填補鍵仍可能分得權重，稀釋有效內容；這不等於從配分中排除填補。
    C: 位置編碼提供位置資訊，沒有指定哪些位置是填補，也不會自動排除填補鍵。
    D: 因果限制控制前後可見性，但本例填補在句首，有效詞元仍可讀到前方填補鍵；這也會改變雙向理解任務。
