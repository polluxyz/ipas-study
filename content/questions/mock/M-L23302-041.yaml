stem: 某影像模型經量化後符合裝置記憶體限制。相同驗證集的整體準確率維持 96%，但占比很低的細裂縫類別，召回率由 90% 降至 62%，低於業務要求。團隊要決定是否採用量化版。下列處理何者最適合？
options:
  A: 採量化版，依整體準確率不變作為品質通過依據
  B: 先調整量化方案並複驗各類別品質，再決定採用
  C: 降低量化版的輸入解析度，重新比較現場推論速度
  D: 採量化版，增加正常影像的驗證筆數後再算準確率
answer: B
explanation:
  summary: 壓縮後的模型必須重新符合各項業務品質要求。
  correct: 量化版雖能部署，細裂縫品質卻未達要求。應比較較保守的量化等方案，重新檢驗資源與各類別品質，不能直接以整體準確率通過驗收。
  wrong:
    A: 少數類別的退步可被多數正常影像掩蓋，整體準確率不變不代表業務門檻仍通過。
    C: 降低解析度可能改善速度，但不會直接修復量化造成的細裂縫漏判，還可能丟失細節。
    D: 增加正常影像只會改變整體分數的類別權重，沒有恢復細裂縫的偵測能力。
