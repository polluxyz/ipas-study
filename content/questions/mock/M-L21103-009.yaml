stem: 某生成模型要依公司自訂規則輸出「甲級、乙級、丙級」需求標籤。規則經常調整，目前有 6 個經確認的代表案例。團隊只能修改輸入文字，不能更新模型參數。哪項試驗最適合？
options:
  A: 用 6 個案例重新訓練詞向量，再替換模型嵌入表
  B: 對模型權重降低數值精度，讓模型自行推導分級標準
  C: 用 6 個案例更新額外適配矩陣，再沿用原輸入文字
  D: 在輸入中說明分級規則並附案例，測試未示範的需求
answer: D
explanation:
  summary: 權重固定且有代表案例時，可用少樣本提示傳達自訂規則。
  correct: 規則與輸入輸出示例可放進提示，讓模型在推論時參考。這符合只能修改輸入的限制，仍須用未示範案例檢驗是否能正確套用規則，而非只複述案例。
  wrong:
    A: 重新訓練並替換嵌入表涉及模型參數變動，也不會直接傳達完整的分級規則。
    B: 降低權重精度是壓縮方式，不會讓模型取得公司自訂的標籤定義，且超出只能改輸入的範圍。
    C: 適配矩陣是可訓練參數，更新它不符合本例禁止更新模型參數的條件。
