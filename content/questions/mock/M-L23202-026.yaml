stem: |
  某設計團隊用 K-means 將零件分群。兩項尺寸特徵已轉為可比較的尺度，某群質心為 (4.4,6.4)。該群有 4 件可送展的現有零件，座標如下。團隊要選出最接近該群質心的代表件，並以歐氏距離比較，不再更動座標。應選哪件零件？
options:
  A: "零件甲，特徵座標為 (1.0,2.0)"
  B: "零件乙，特徵座標為 (4.0,6.0)"
  C: "零件丙，特徵座標為 (5.4,5.4)"
  D: "零件丁，特徵座標為 (4.5,6.5)"
answer: D
explanation:
  summary: "用到質心的平方距離，選出現有零件中的代表件。"
  correct: "甲、乙、丙、丁到質心的平方距離依序為 30.92、0.32、2.00、0.02。丁的距離為 √0.02，約 0.141，為候選中最小。平方根不改變大小排序，可直接比較平方距離。指引說明平均質心的更新；本題選取實體代表件的計算屬延伸補充。"
  wrong:
    A: "甲到原點的距離最小，但題目比較的是到 (4.4,6.4) 的距離。甲的平方距離為 (1.0−4.4)²+(2.0−6.4)²=30.92。"
    B: "乙恰好等於質心逐座標取整數的結果，但平方距離仍為 0.4²+0.4²=0.32，比丁大。取整數不能代替候選距離比較。"
    C: "丙的座標差為 1 與 −1，平方距離為 1²+(−1)²=2。若先把有正負號的差相加再平方，會錯算成 0；歐氏距離須先分別平方再相加。"
guide_refs: [guide-3:4-41, guide-3:4-42]
