codes: [L23202]
concepts: [k-means]
stem: |
  某設計團隊用 K-means 將 3,000 件實體零件分群。每群須挑 1 件現有零件送展，並要求該零件到群質心的歐氏距離最小。質心包含平均尺寸，未必對應可製造零件。若保留分群結果，最適合如何挑選？
options:
  A: "將各群質心尺寸四捨五入至製造精度，直接以該尺寸作為送展代表"
  B: "在各群挑選出貨次數最多的零件，直接以該零件作為送展代表"
  C: "在各群挑選到原點距離最小的零件，直接以該零件作為送展代表"
  D: "在各群搜尋到質心距離最小的現有零件，以該零件作為送展代表"
answer: D
explanation:
  summary: "將平均質心與可選取的實體代表分開。"
  correct: "K-means 的質心是成員特徵平均，不必是現有樣本。以同一分群空間搜尋距離質心最近的群內零件，同時滿足現有零件與指定代表性準則。"
  wrong:
    A: "四捨五入只能得到尺寸值，不能保證存在該零件，也不能保證它是指定的最近現有樣本。"
    B: "出貨頻率衡量需求，不等於特徵空間中到群質心的距離。"
    C: "原點是座標基準，並非各群的中心，最近原點不等於最近質心。"
