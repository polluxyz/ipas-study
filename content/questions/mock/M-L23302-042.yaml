stem: 某公司要平均 2 個分類模型的機率。甲的輸出順序為「正常、故障」，乙為「故障、正常」，兩者單獨驗證皆合格。團隊要在整合前確認機率平均有正確語意。下列做法何者最適合？
options:
  A: 把兩個模型第一格與第二格直接分別平均
  B: 把兩個模型的同名類別機率對齊後分別平均
  C: 把各模型的機率由大到小排序後逐格平均
  D: 把各模型的最高機率取出後平均作為故障機率
answer: B
explanation:
  summary: 集成機率前要先對齊類別語意。
  correct: 正常機率只能和另一模型的正常機率整合，故障亦同。依類別名稱對齊後再平均，才能讓各輸出代表一致的事件。
  wrong:
    A: 同一格位置在兩模型代表不同事件，直接平均會把正常與故障的機率混合。
    C: 依大小排序只保留信心順序，會丟失每個機率所屬的類別。
    D: 最高機率可能屬於正常或故障，平均最高值不能直接解釋為故障機率。
