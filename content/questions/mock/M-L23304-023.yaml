stem: 某網路連續使用卷積甲、批次正規化、卷積乙。甲原本輸出 16 通道，乙接收這 16 通道。團隊實際刪除甲的第 3 與第 7 通道，想保留其餘通道的對應關係。最適合如何同步修改？
options:
  A: 保留正規化層，並刪除乙對應編號的輸出通道
  B: 刪除正規化層對應項，並刪除乙對應編號的輸出通道
  C: 刪除正規化層對應項，並刪除乙最後 2 個輸入通道
  D: 刪除正規化層對應項，並刪除乙對應編號的輸入通道
answer: D
explanation:
  summary: 結構化剪枝需沿相鄰層同步處理通道相依。
  correct: 甲的輸出通道同時對應正規化的各通道參數與統計，以及乙權重的輸入通道軸，必須依相同保留索引同步裁切。
  wrong:
    A: 正規化層仍期待 16 通道，且乙的輸出軸不負責接收甲的特徵，兩處都未對齊。
    B: 正規化層會對齊，但刪除乙輸出通道不會把其輸入從 16 改為 14。
    C: 輸入通道數雖然會變為 14，但刪錯位置會讓保留的甲通道接上不同的乙權重，破壞對應關係。
