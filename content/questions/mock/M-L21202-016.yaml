type: 情境
codes: [L21202]
concepts: [phased-rollout, proof-of-concept]
stem: |
  某備料 AI 在第一階段與人工流程平行運行，只記錄建議，不實際改變備料量。建議與主管決策的相符率達 96%，系統串接也已達標。團隊下一階段要驗證「採用建議是否減少報廢，且不增加缺貨」。最適合安排哪項工作？
options:
  A: 小範圍安排採用與比較流程，追蹤實際報廢與缺貨後再決定擴大
  B: 延長平行運行的紀錄期間，以建議相符率推估實際報廢改善幅度
  C: 將未執行建議套入原有銷量紀錄，以歷史模擬取代實際採用測試
  D: 增加平行運行的店數，以建議產生量作為下一階段的業務成效
answer: A
explanation:
  summary: 未執行的建議可檢查運作，但業務效果需要採用後的證據。
  correct: 第一階段沒有改變備料行為，因此尚未量到 AI 決策造成的報廢與缺貨。以可控範圍實際採用並設置比較流程，能取得下一階段擴大所需的業務證據。
  wrong:
    B: 相符率反映與主管決策接近的程度，並非實際報廢改善。延長未採用的紀錄期間仍不會觀察到介入後的結果。
    C: 歷史模擬可提供先期估計，但庫存、缺貨及後續需求可能隨決策改變。它不能取代本階段指定的實際採用驗證。
    D: 建議產生量代表系統涵蓋範圍，沒有顯示報廢或缺貨的變化，也無法支持業務效果已成立。
