stem: 某設備手冊含 300 列維修表格，表頭標明機型與壓力單位。系統按固定字數切塊後，部分區塊只有數值與零件名稱，沒有表頭；檢索雖找到對應列，答案卻常把單位與機型用錯。最適合先調整哪項入庫處理？
options:
  A: 將表格數值依大小排序，再依原字數設定重新切塊
  B: 提高每次檢索的相似度門檻，再減少送入模型的列數
  C: 對每列建立數值向量，再以壓力數值作為主要搜尋條件
  D: 按表格結構切塊，並為各區塊附上適用表頭與來源位置
answer: D
explanation:
  summary: 結構化表格的切塊須保留解讀數值所需的上下文。
  correct: 機型與單位決定表格列的意義。按結構切塊並附帶表頭及來源位置，可讓取回的區塊自帶解讀條件，降低只有數值卻失去適用範圍的問題。
  wrong:
    A: 數值排序會改變表格原有關聯，固定字數仍可能把列與表頭拆開，沒有保存解讀條件。
    B: 相似度門檻與列數只改變選取結果，未補回區塊已遺失的機型與單位。
    C: 以壓力數值為主要搜尋條件可能找到數值相近的其他機型；向量化數值也未保留被省略的表頭。
