stem: 某警報模型在甲廠誤報 40 件，在乙廠誤報 60 件。甲廠共有 1,000 件實際正常，乙廠共有 10,000 件實際正常。主管因此認為乙廠對正常品的誤報傾向較高。若比較的是假陽率，哪項判斷最正確？
options:
  A: 甲廠假陽率較高，應以各廠實際正常件數作分母
  B: 乙廠假陽率較高，應以各廠誤報件數直接排序
  C: 兩廠假陽率相同，應將誤報件數除以兩廠正常總數
  D: 資料仍不足，應取得兩廠實際瑕疵件數才能計算
answer: A
explanation:
  summary: 假陽率比較的是正常案件被誤報的比例。
  correct: 甲廠的假陽率為 40/1000=4%，乙廠為 60/10000=0.6%。乙廠的誤報件數較多，但正常案件基數大得多，不能直接由件數推論假陽率較高。
  wrong:
    B: 誤報件數會受正常案件量影響，兩廠的基數不同，直接排序不是假陽率比較。
    C: 兩廠合計正常件數不是任一廠假陽率的分母，且即使共用分母，40 與 60 也不會得到相同值。
    D: 假陽率的分母是實際正常件數，題目已提供；不需要瑕疵件數。
