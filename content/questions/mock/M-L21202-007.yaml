stem: 某客服中心試行 AI 回覆建議。員工已會操作介面，但訪談指出主管把「拒用 AI 次數」當成負面考核，員工因而直接接受可疑建議，也不回報錯誤。下一階段規劃最應優先調整哪項措施？
options:
  A: 增加介面操作測驗，通過後提高員工的建議採用目標
  B: 調整考核與回饋規則，將有依據的拒用納入品質改善
  C: 增加模型功能展示，以模型平均準確率建立使用信心
  D: 設定採用率獎勵門檻，以團隊競賽提升建議使用比例
answer: B
explanation:
  summary: 錯誤的採用誘因會抑制人工判斷與品質回饋。
  correct: 本例不是員工不會操作，而是拒用會受到負面評價。規劃應讓員工能提出有證據的拒用，並追蹤原因、回覆與修正。採用率須與回覆品質共同解讀，不能迫使員工接受錯誤內容。
  wrong:
    A: 員工已具操作能力，操作測驗沒有改變拒用會受罰的誘因，反而可能加重壓力。
    C: 平均準確率無法證明每筆建議正確，也未解除員工回報錯誤的顧慮。
    D: 獎勵採用比例會強化目前的行為誘因，可能讓可疑建議更容易被直接採用。
