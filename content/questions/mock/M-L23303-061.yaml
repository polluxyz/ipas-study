stem: 某多輸出模型同時預測溫度與耗電量。驗收規定溫度偏差 1°C 與耗電偏差 100 度具有相同代價，2 個目標在總分中等權。驗證集的兩項平均絕對誤差為 0.8°C 與 30 度。最適合用哪種方式彙總誤差？
options:
  A: 將兩項平均絕對誤差直接等權平均
  B: 將兩項 R² 各轉為 1−R² 再等權平均
  C: 將各項誤差除以各自真值標準差再平均
  D: 將各項誤差除以各自容許偏差再平均
answer: D
explanation:
  summary: 多輸出誤差要依指定代價換成可比較的尺度。
  correct: 驗收已指定 1°C 與 100 度的代價相同，故分別除以 1 與 100，得到 0.8 與 0.3，再等權平均為 0.55。這個彙總直接反映指定的相對代價，不會讓耗電量單位的數值較大而主導總分。
  wrong:
    A: 直接平均不同單位的原始誤差，等同讓數值較大的耗電誤差主導，沒有套用驗收指定的代價比例。
    B: R² 的尺度取決於各目標真值的變異，並不等於以 1°C 與 100 度為基準的絕對偏差代價。
    C: 標準差縮放反映資料分散程度，不是題幹指定的容許偏差比例。
