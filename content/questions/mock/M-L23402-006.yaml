stem: 某風險模型輸出 0 至 1 的分數。團隊要檢查「同樣分數在甲乙兩群是否代表相同事件風險」，目前只有各群最終通過率，沒有保存分數分布。若要直接檢查這項要求，最適合補充哪種資料與比較？
options:
  A: 保存各群的平均分數，調整到兩群平均值相同
  B: 保存各群的正向決策數，調整到兩群通過率相同
  C: 保存各群的正確預測數，調整到兩群準確率相同
  D: 保存分數與真實結果，在相近分數區間比較各群事件率
answer: D
explanation:
  summary: 分群體校準要檢查相同分數條件下的實際事件率。
  correct: 問題關心相同分數的風險意義，因此要把分數與之後觀察到的事件結果對齊，在相同或相近分數區間比較兩群的事件率，也檢查事件率與預測分數是否吻合。應同時檢查各區間樣本量與不確定性。各群通過率本身無法回答這項問題。
  wrong:
    A: 平均分數相同不保證每個分數區間的實際風險相同，平均也可能掩蓋不同的分數分布。
    B: 通過率相同關注正向決策比例，不代表同分數的實際事件率相同。
    C: 準確率只比較門檻判斷後的正誤比例，沒有保留分數與事件風險之間的對應。
