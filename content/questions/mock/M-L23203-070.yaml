stem: 某團隊沿用預訓練影像骨幹。模型說明要求將像素除以 255，再按指定均值與標準差轉換；新資料流程卻直接送入 0 至 255 的像素。分類效果不佳時，最適合優先修正哪項設定？
options:
  A: 套用骨幹指定的像素轉換，再評估新任務的表現
  B: 擴大新分類頭的輸出類別，再評估新任務的表現
  C: 增加每次更新使用的樣本，再評估新任務的表現
  D: 增加新分類頭的隱藏層數，再評估新任務的表現
answer: A
explanation:
  summary: 沿用預訓練表示時，也要核對輸入數值尺度。
  correct: 骨幹是在指定輸入轉換下取得權重。先排除新舊流程的數值尺度落差，才能判斷預訓練特徵是否適合新資料。
  wrong:
    B: 輸出類別數應由新任務定義，增加類別既不修正輸入尺度，也會改變任務。
    C: 較大批次改變每次更新的樣本量，並未讓骨幹接收它原本預期的數值範圍。
    D: 較深分類頭可能增加表達能力，但沒有優先處理已知的輸入轉換不一致。
