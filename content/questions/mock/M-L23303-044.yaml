stem: 某平台以異常為正類，待處理批次有 100 件異常與 9,900 件正常。每筆警報都需複核，本次要求預估複核量不超過 200 件。驗證估得三個門檻的真陽率／假陽率分別為：0.3：0.95／0.02；0.5：0.85／0.01；0.7：0.60／0.005。規則是預估複核量符合上限時，抓到最多異常。哪個門檻最適合？
options:
  A: 採 0.3，預估複核 198 件
  B: 採 0.5，預估複核 184 件
  C: 採 0.7，預估複核約 110 件
  D: 採 0.5，預估複核 99 件
answer: B
explanation:
  summary: 複核量同時包含抓到的異常與被誤報的正常案件。
  correct: 0.5 的複核量為 100×0.85+9900×0.01=184。0.3 的複核量為 95+198=293，超過容量；0.7 約為 109.5，雖符合容量卻只抓到 60 件異常。因此 0.5 符合規則。
  wrong:
    A: 198 只計入正常案件的誤報，還需加上 95 件真正異常，總量為 293。
    C: 此門檻符合容量限制，但抓到的異常少於 0.5，並非容量內的最佳選擇。
    D: 99 只是假陽性的數量，未計入 85 件真正異常，不能作為總複核量。
