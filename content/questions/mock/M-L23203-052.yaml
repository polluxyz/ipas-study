stem: 某團隊把彩色自然影像的預訓練骨幹用於單色紋理。重複實驗顯示：只訓練新頭的驗證分數為 0.70，微調最後 1 個區塊為 0.71，允許較前層一起小幅更新可達 0.84；資料切分與預算相同。最合理的後續方向為何？
options:
  A: 擴大微調範圍並以驗證選擇更新層數，檢查低層特徵的適用性
  B: 保留全部骨幹凍結並擴大分類頭，將調整集中在輸出映射
  C: 固定最後區塊的微調範圍並延長訓練，以訓練分數決定停止
  D: 恢復預訓練的分類頭並凍結骨幹，利用來源任務的既有邊界
answer: A
explanation:
  summary: 領域差異也可能涉及較前層，微調範圍需由驗證支持。
  correct: 多次驗證顯示開放較前層有明顯增益，支持檢查來源的低層表示是否適合新紋理。可逐步調整範圍，避免只依來源模型的通用性假設凍結。
  wrong:
    B: 只擴大頭不能改變凍結骨幹的特徵，未回應開放較前層後穩定改善的證據。
    C: 延長相同更新範圍沒有處理低層表示的限制，且訓練分數不能取代驗證選擇。
    D: 來源頭對應來源標籤與邊界，不能取代新任務頭，也不能修正骨幹的領域差異。
