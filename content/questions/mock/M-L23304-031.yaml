stem: 某團隊搜尋 80 組神經網路設定，僅訓練一次時，前 3 名驗證分數差距小於平常更換亂數種子造成的波動。團隊還有少量預算，測試集仍保留未用。若要降低把偶然高分當成最佳設定的機會，哪項安排最適合？
options:
  A: 增加 80 組新設定，各訓練一次後合併排名
  B: 讓第 1 名多訓練幾輪，再與原本排名比較
  C: 將前 3 名的訓練分數加入驗證分數後排名
  D: 讓前 3 名使用同一組多個種子重訓後比較
answer: D
explanation:
  summary: 候選差距小於訓練波動時，應估計候選的重複表現。
  correct: 讓前 3 名都使用同一組多個種子，可以比較平均驗證表現與波動，減少單次運氣影響。使用一致的種子集合也讓比較條件較一致；最後仍須保留獨立測試。
  wrong:
    A: 擴大單次試驗數會增加遇到偶然高分的機會，沒有估計現有候選的訓練波動。
    B: 只延長第 1 名的訓練會改變比較預算，也沒有確認其對種子變化是否穩定。
    C: 訓練分數不是獨立驗證證據，加入後可能偏好擬合訓練資料較強的設定。
