stem: 某據點欄位採獨熱編碼。min_frequency 讓訓練出現次數少於門檻的類別併成低頻欄；handle_unknown="infrequent_if_exist" 讓未見類別使用既有低頻欄。輸出的一般類別依字母序在前，低頻欄在最後。訓練有 3 筆 A、2 筆 B、1 筆 C、1 筆 E，min_frequency=2。新據點 D 的輸出向量為何？
code: |
  from sklearn.preprocessing import OneHotEncoder
  train = [["A"], ["A"], ["A"], ["B"], ["B"], ["C"], ["E"]]
  enc = OneHotEncoder(min_frequency=2,
                      handle_unknown="infrequent_if_exist", sparse_output=False)
  enc.fit(train)
  print(enc.get_feature_names_out().tolist())
  print(enc.transform([["D"]]).tolist())
code_lang: python
options:
  A: "[0, 0, 0]"
  B: "[0, 1]"
  C: "[0, 0, 0, 1]"
  D: "[0, 0, 1]"
answer: D
explanation:
  summary: 輸出向量由訓練類別次數與未見類別的處理設定決定。
  correct: A 有 3 筆，B 有 2 筆，兩者都保留獨立欄。C、E 各 1 筆，合併為低頻欄。欄位依序為 A、B、低頻欄，共 3 欄。D 未在訓練出現，依設定使用既有低頻欄，因此輸出 [0, 0, 1]。
  wrong:
    A: 本例已有低頻欄，未見類別 D 會啟用該欄，因此不是全零向量。
    B: B 的 2 筆等於門檻，沒有少於門檻。B 必須保留獨立欄，因此輸出有 3 欄，而非 2 欄。
    C: 輸出欄位在擬合後固定。轉換 D 時不會再新增專用欄，因此不會變成 4 欄。
