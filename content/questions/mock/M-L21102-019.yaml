stem: 某邊緣攝影機可供推論使用的記憶體為 64 MB。模型權重檔為 40 MB，完整載入後能成功啟動，但處理第一張高解析影像時失敗。量測顯示中間特徵圖與運算工作區使總峰值達 140 MB。最正確的判斷為何？
options:
  A: 以儲存壓縮後的權重檔大小，作為推論容量的驗收值
  B: 容量須計入中間張量與工作區，不能只比較權重檔
  C: 按模型層數套用其他裝置的量測，作為本機容量基準
  D: 相同參數模型沿用其他解析度的峰值，判定容量是否足夠
answer: B
explanation:
  summary: 邊緣推論的記憶體需求包含權重以外的執行資料。
  correct: B 能解釋為何成功載入不代表能完成推論。中間特徵圖與工作區也占用記憶體，須在實際輸入尺寸與執行環境量測峰值，再驗證降低用量的方案。
  wrong:
    A: 儲存壓縮可減少磁碟檔案，但執行時仍須配置張量；壓縮檔大小不能直接代表載入與執行峰值。
    C: 相同層數可有不同通道數、張量大小與執行工作區，其他裝置的結果不能僅憑層數套用。
    D: 參數個數沒有包含輸入尺寸引起的中間張量變化，相同參數在不同解析度下仍可能有不同峰值。
