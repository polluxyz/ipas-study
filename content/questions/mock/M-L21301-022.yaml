stem: 某農產分類專案只有 600 張已標註影像，外觀與現有通用影像模型學到的紋理相近。團隊只能使用單張圖形處理器進行少量實驗，且要建立獨立驗證集。哪項初始模型策略最適合兼顧資料量與實驗成本？
options:
  A: 先固定預訓練特徵擷取器，訓練小型分類頭，再依驗證結果評估微調
  B: 先用隨機權重訓練完整大型模型，再以增加訓練輪數降低驗證誤差
  C: 先更新預訓練模型的每一層，再以提高學習率縮短完整訓練的時間
  D: 先以隨機權重固定大型特徵擷取器，再訓練相同規模的小型分類頭
answer: A
explanation:
  summary: 小樣本且特徵相近時，可先利用預訓練表徵降低訓練負擔。
  correct: 固定已學到相關紋理的特徵擷取器，只訓練分類頭，可減少需估計的參數及實驗成本。獨立驗證結果再決定是否解凍部分層，並檢查遷移是否有幫助。
  wrong:
    B: 從零估計大型模型需要更多標註證據；增加輪數可能加重小樣本過擬合，不能保證降低驗證誤差。
    C: 全面更新增加訓練成本與小樣本變動，提高學習率也可能破壞有用表徵，不是本例最穩健的起點。
    D: 隨機且固定的特徵沒有利用題目已知的相關視覺知識，不能取得預訓練表徵提供的資料效率優勢。
