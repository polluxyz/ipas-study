stem: 某設備成本任務只有 320 筆表格資料。工程檢驗支持成本隨運轉時數近似線性增加，其他特徵呈加成效果。下季需預測略高於訓練最大時數的設備，團隊要先建立符合此趨勢的簡單基準。哪項模型最適合？
options:
  A: 以運轉時數等特徵訓練一般隨機森林迴歸
  B: 以運轉時數等特徵訓練帶 L2 正則化的線性迴歸
  C: 以運轉時數等特徵訓練最近鄰迴歸
  D: 以運轉時數等特徵訓練常數葉節點的提升樹迴歸
answer: B
explanation:
  summary: 可信的加成線性趨勢與外推需求，可用線性模型作為基準。
  correct: 線性迴歸直接表達加成趨勢，L2 正則化可在小樣本下限制係數波動。線性函數能延伸既有斜率至略高時數，但外推可靠性仍須用工程知識與驗證確認。
  wrong:
    A: 一般隨機森林以葉內目標平均預測，超過切分範圍時不會自然延伸已觀察到的線性斜率。
    C: 最近鄰用附近既有樣本的目標平均，缺少把線性趨勢延伸至範圍外的結構。
    D: 常數葉的提升樹雖能學非線性，範圍外仍落到既有葉節點，沒有持續線性增長的設計。
