stem: |
  某維修平台依故障機率規劃備料。模型在獨立測試的排序能力良好，但預測機率約 0.8 的 1,000 台設備中，實際故障比例只有 45%。標籤已完整取得，資料也代表部署對象。若要把分數用於估計備料需求，下列做法何者最適合？
options:
  A: 檢查各分數區間的實際故障率，校準後再以獨立資料驗證機率品質
  B: 維持機率解讀並提高故障判定門檻，以較少正類判斷修正分數意義
  C: 依排序能力通過備料驗收，將原分數直接視為設備故障的發生比例
  D: 改報告門檻為 0.5 的分類準確率，以正確分類比例取代機率檢查
answer: A
explanation:
  summary: 區分排序能力與機率可用性。
  correct: 高排序能力不保證分數對應真實發生率。0.8 區間只有 45% 故障，顯示直接當成機率會高估備料需求。校準需使用獨立於模型擬合的資料，並另外驗證。
  wrong:
    B: 改門檻會改變是否判為故障，不會修正 0.8 分數代表多少發生率。
    C: 排序指標看相對順序，不能證明分數與故障頻率一致。
    D: 單一門檻的正確率不能檢查各分數區間的機率意義。
