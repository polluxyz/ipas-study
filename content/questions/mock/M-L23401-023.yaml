stem: 某研究模型存在已確認的逆向推導風險。團隊希望先讓 12 家合作機構試用，並在出現大量重建查詢時停止該機構存取。合作機構不需離線執行，品質驗證可在服務端完成。最適合採哪種交付方式？
options:
  A: 提供加密權重檔，登入後發放本機解密金鑰
  B: 提供受控推論服務，設機構額度與停權機制
  C: 提供可下載權重檔，為每份檔案加機構浮水印
  D: 提供簽署的容器映像，讓機構在本機持續執行
answer: B
explanation:
  summary: 需要持續限制與撤銷查詢時，交付方式需保留服務端控制。
  correct: 受控服務能在伺服器端記錄使用、限制額度並停止某機構的後續查詢。本例不需要離線執行，採這種交付能保留查詢控制。這仍須搭配隱私評估，不能視為逆向風險已消失。
  wrong:
    A: 取得權重與解密金鑰後，合作機構可以離線查詢；停止後續登入無法可靠收回已解密的副本。
    C: 機構浮水印有助追查副本來源，但不限制已下載模型的查詢次數，也不能遠端停止本機執行。
    D: 簽署映像可驗證交付來源與完整性，但本機執行的副本不受服務端查詢額度控制。
