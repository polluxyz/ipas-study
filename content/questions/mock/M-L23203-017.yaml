stem: 某文件分類器把 12 個有效詞補齊成 64 格，再輸入雙向編碼器。補齊向量初值為零，但注意力投影包含偏差。團隊要求有效詞可互相參照，且不把補齊格當成資訊來源。最適合的調整為何？
options:
  A: 只加入因果遮罩，讓有效詞僅能參照自身與較前方的位置
  B: 遮住補齊位置的鍵，彙整分類表示時也排除補齊格
  C: 保留補齊位置的鍵，只將其位置編碼改成相同的零向量
  D: 增加補齊格的數量，讓有效詞能分配到更平均的注意力
answer: B
explanation:
  summary: 補齊遮罩與因果遮罩處理的限制不同。
  correct: 鍵的補齊遮罩讓有效詞不對補齊格分配注意力。若最後跨位置彙整，也要排除補齊輸出。零向量經投影及其他層後不保證仍無作用，不能代替明確遮罩。
  wrong:
    A: 因果遮罩限制前後順序，會阻擋題目允許的後方有效詞；它也不是識別補齊格的通用方法。
    C: 零位置編碼不會阻止補齊鍵參與注意力正規化；帶偏差的投影也可能產生非零表示。
    D: 更多補齊格可能分走更多注意力，並沒有滿足排除無效資訊的條件。
