stem: 某輸送帶攝影機在物件靜止時能拍清刻字，移動時筆畫沿運動方向拖長。現有解析度足夠，照明也可調整。若要優先從成像端減少這種模糊，最適合哪項試驗？
options:
  A: 延長曝光時間，並降低照明強度維持相同亮度
  B: 保持曝光時間，並以平滑濾波減少像素高頻變化
  C: 縮短曝光時間，並增加照明強度維持足夠亮度
  D: 保持曝光時間，並以直方圖均衡提高明暗對比
answer: C
explanation:
  summary: 運動模糊須優先控制曝光期間的物件位移。
  correct: C 減少感光期間物件移動的距離，照明補償則避免短曝光造成訊號太暗。應以實拍確認字跡、雜訊與設備照明限制，而非只看處理後影像是否更銳利。
  wrong:
    A: 延長曝光使同一筆畫在感光期間移動更遠，降低照明只能補償亮度，不能減少拖影。
    B: 平滑濾波主要抑制雜訊，也可能抹掉細字筆畫，並未減少曝光時已累積的運動軌跡。
    D: 直方圖均衡改變明暗分布，不會縮短感光期間的位移，不能從成像端消除拖影。
