stem: 某文字分類服務更換斷詞器後準確率大降。新舊詞彙表同為 30,000 項，但詞元「退款」的編號由 817 變成 241。模型嵌入表與分類權重都沿用舊版，兩個編號在舊表代表不同詞。最適合如何處理？
options:
  A: 恢復與模型配套的斷詞器及詞彙編號，再用固定資料驗證
  B: 維持新編號並提高分類判定門檻，降低錯誤結果的數量
  C: 依新詞頻重新排列詞彙編號，模型嵌入表維持舊有順序
  D: 將新斷詞結果補到與舊版相同長度，再沿用目前嵌入表
answer: A
explanation:
  summary: 詞元編號必須與模型嵌入表的對應一致。
  correct: 模型依編號讀取嵌入表。相同詞在新版本改用不同編號，卻沒有同步調整嵌入表，就會讀到別的詞的表示。先恢復配套版本可直接排除這項錯配；詞彙表大小相同不代表對應相同。
  wrong:
    B: 提高判定門檻可能減少輸出，但輸入仍讀取錯誤詞向量，沒有處理已確認的原因。
    C: 再次重排編號而不調整嵌入表，會產生更多錯配，詞頻高低不能決定舊嵌入列的語意。
    D: 補齊長度處理的是序列形狀，無法修正詞元編號與嵌入列之間的對應。
