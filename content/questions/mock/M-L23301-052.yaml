stem: 某中文評論已用空白分詞，單字「好」與「差」決定這 2 筆範例的不同標籤。下列預設向量化只留下共同詞「服務」。若要保留既有分詞邊界與單字訊號，哪項設定最適合？
code: |
  from sklearn.feature_extraction.text import TfidfVectorizer
  docs = ["服務 好", "服務 差"]
  vec = TfidfVectorizer()
  X = vec.fit_transform(docs).toarray()
  print(vec.get_feature_names_out().tolist(), (X[0] == X[1]).all())
code_lang: python
options:
  A: 將 min_df 設為 2，其他設定維持預設
  B: 將 use_idf 設為 False，其他設定維持預設
  C: 將 sublinear_tf 設為 True，其他設定維持預設
  D: 將 token_pattern 設為 r"(?u)\b\w+\b"，其他維持預設
answer: D
explanation:
  summary: 預設分詞規則可能捨棄已分好的單字詞。
  correct: 預設 token_pattern 只保留長度至少 2 的詞，因此「好」與「差」未進詞彙表。改成接受長度至少 1 的規則後，仍依空白邊界取詞，也能保留這 2 個單字。
  wrong:
    A: min_df 控制已抽取詞的文件出現門檻，不能讓被分詞規則排除的單字重新出現。
    B: 關閉逆文件頻率只改變權重，前面的分詞規則仍然排除單字。
    C: 次線性詞頻只處理已保留詞的次數，不能修復詞彙抽取時遺失的單字。
