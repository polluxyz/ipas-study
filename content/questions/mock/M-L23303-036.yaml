stem: 某平台每天為同一批 500 位既有會員預測隔日需求。會員編號是合法輸入，上線也會有這批會員的過往紀錄。本次只估計既有會員未來表現，沒有新會員需求。哪項保留資料設計最適合？
options:
  A: 按會員分組，保留 100 位會員的完整歷史作為驗證資料
  B: 按預測日期前後切分，使用既有會員較晚的紀錄作驗證
  C: 按每位會員隨機留出部分日期，讓每人兩側筆數相近
  D: 按需求量分層抽樣日期，讓每個月份都出現在訓練與驗證
answer: B
explanation:
  summary: 切分方式應反映新時間或新實體的目標。
  correct: 目標是同一批會員的未來需求，按日期向後保留可模擬這種使用情境。會員跨兩側並不自行構成洩漏，但每筆特徵與訓練標籤仍須在預測時已可取得。
  wrong:
    A: 這估計的是對未見會員的泛化能力，與本次既有會員的未來表現不同。
    C: 會員內隨機抽日期會讓較晚紀錄參與較早日期的模型訓練，未模擬每天向前預測。
    D: 需求量分層不會保證時間順序；讓每月同時出現在兩側仍可能使用較晚資料訓練。
