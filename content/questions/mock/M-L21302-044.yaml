stem: 某文件在知識庫切成 6 個區塊，回答快取另保留 2 小時。管理員刪除來源文件後，新問題仍能找到舊區塊，相同問題也會命中舊答案。刪除事件已能提供文件識別碼。若要讓撤下內容停止被使用，最適合補上哪項流程？
options:
  A: 依文件識別碼移除索引區塊，並使相關回答快取失效
  B: 將來源檔案的備份保存期限縮短，並重新整理檔案清單
  C: 重建向量索引的加速結構，並增加近期文件的排序權重
  D: 對新產生的答案縮短快取期限，並減少每次取回區塊數
answer: A
explanation:
  summary: 刪除須傳到索引與回答快取，才能移除衍生的使用入口。
  correct: 來源檔案、可檢索區塊及回答快取是不同儲存層。以文件識別碼追蹤區塊與依賴該文件的答案，才能讓刪除事件同步阻止檢索與快取回傳。
  wrong:
    B: 備份期限與來源清單不會刪除檢索層已儲存的區塊，也不會使既有答案快取失效。
    C: 加速結構重建仍會納入尚未移除的舊區塊；提高近期權重也不能保證撤下內容不被使用。
    D: 新答案的期限不會立即清除已存在的舊快取。減少取回數只改變數量，沒有依文件識別碼移除撤下內容。
