stem: 某研究助理讓 4 個代理核對設備保固年限，4 者都回答 5 年。追查發現，代理甲先寫摘要，其餘 3 者都引用甲的摘要；沒有代理讀過產品文件。若要提升這項結論的可信度，最適合增加哪個驗收步驟？
options:
  A: 追溯共同來源，另查產品文件的適用型號與保固條款
  B: 增加相同摘要的投票輪數，依多數決產生最終結論
  C: 改用不同模型閱讀甲的摘要，依模型間一致性驗收
  D: 隱藏代理名稱再評語句流暢度，依匿名評分驗收
answer: A
explanation:
  summary: 代理間一致不代表證據彼此獨立。
  correct: 4 個答案都依賴同一份未查證摘要，沒有增加獨立證據。追溯來源並核對實際型號與條款，才能驗證 5 年是否適用；票數只反映重複傳遞的結論。
  wrong:
    B: 相同來源的多輪投票會重複放大既有結論，不能補上產品文件的證據。
    C: 模型不同不代表資料來源獨立。都只讀同一摘要時，仍可能一致接受摘要中的錯誤。
    D: 匿名與流暢度評估能減少部分評分偏差，卻無法查出保固年限是否符合實際條款。
