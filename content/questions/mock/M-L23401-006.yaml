stem: 某平台分別分享購物紀錄表與健康活動表。兩表都刪除原始會員編號，並以相同格式計算未加鹽的 SHA-256 雜湊。接收者同時持有兩表，但不知道原始編號，兩表列序也不同。關於跨表關聯風險，哪項判斷最正確？
options:
  A: 必須先破解雜湊並還原會員編號，才能連結兩表紀錄
  B: 可直接用相同雜湊連結兩表，不必先還原會員編號
  C: 兩表列序不同便無法連結，因為雜湊只可依序比對
  D: 改用較長的共同雜湊便能阻斷連結，因為碰撞會減少
answer: B
explanation:
  summary: 相同識別碼的確定性雜湊仍可充當跨表關聯鍵。
  correct: 同一會員編號以相同格式執行相同雜湊，會得到相同摘要。接收者可用摘要比對，把購物與健康活動連在一起，不必知道真實編號。移除原始編號不等於消除可連結性；是否能連回真實身分則是另一項風險。
  wrong:
    A: 跨表關聯只需要比較摘要是否相同，不需要把摘要逆轉為原始會員編號。
    C: 可以依摘要建立索引或合併資料，不需維持原本列序；打亂順序不會改變摘要值。
    D: 本例的連結來自相同輸入產生相同輸出，不是不同輸入碰撞。加長共同摘要不會消除同一會員在兩表中的相同值。
