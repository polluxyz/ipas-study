stem: |
  某 AI 試辦由總部 8 位專家駐點支援 2 間店，處理時間與品質都達標。下一階段預計擴到 30 間店，每店只配置 1 位兼任人員，總部無法維持駐點支援。模型與介面已定版。安排擴大導入前，最適合補哪項驗證？
options:
  A: 保留專家駐點配置增加試辦店數，以相同支援條件再確認成效
  B: 增加試辦期間的模型離線題數，以較高分類分數確認擴店條件
  C: 延長現有專家駐點的觀察期間，以更長紀錄確認擴店後的表現
  D: 以預定兼任人力安排下一輪試辦，檢查負荷、例外處理及品質
answer: D
explanation:
  summary: 分階段驗證必須涵蓋下一階段真正可用的人力條件。
  correct: 已知成效來自高密度專家支援，不能直接推到兼任人力的營運配置。用預定人力測試工作負荷、例外案件與品質，才能確認擴大後是否仍可運作。
  wrong:
    A: 相同專家支援能增加同條件下的店數證據，但沒有驗證下一階段缺少駐點專家時的工作方式。
    B: 更多離線題可檢查模型表現，卻沒有量到兼任人員的負荷與例外處理能力，不能替代營運配置驗證。
    C: 延長觀察可涵蓋更多時間變化，但專家支援條件仍與預定配置不同，關鍵的人力落差沒有被測試。
