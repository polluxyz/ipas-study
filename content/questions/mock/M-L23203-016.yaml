stem: 某感測器模型想保留輸出長度，同時讓 3 個卷積權重讀到間隔較遠的位置。以下以 dilation=2、stride=1、padding=2 測試，權重皆為 1。關於中央位置 y[0,0,3]，何者最正確？
code: |
  import torch
  layer = torch.nn.Conv1d(1, 1, 3, padding=2, dilation=2, bias=False)
  with torch.no_grad():
      layer.weight.fill_(1.0)
  x = torch.arange(1.0, 8.0).reshape(1, 1, 7)
  y = layer(x)
  print(tuple(y.shape), y[0, 0, 3].item(), layer.weight.numel())
code_lang: python
options:
  A: 讀取輸入位置 2、3、4；擴張率只會改變輸出的取樣步幅
  B: 讀取輸入位置 1 到 5；擴張率會將權重由 3 個增加為 5 個
  C: 讀取輸入位置 0、3、6；擴張率會在相鄰權重間插入 2 格
  D: 讀取輸入位置 1、3、5；涵蓋 5 格範圍，但仍只有 3 個權重
answer: D
explanation:
  summary: 擴張卷積增加取樣間距，不必同步增加卷積權重數量。
  correct: dilation=2 表示相鄰權重對應的輸入位置相差 2。中央位置取索引 1、3、5，數值為 2、4、6，合計 12；有效涵蓋範圍為 5 格，但實際只取 3 點。
  wrong:
    A: 索引 2、3、4 是 dilation=1 的連續取樣。輸出位置的步幅由 stride 控制。
    B: 涵蓋範圍變大不代表每格都取樣；權重數仍由 kernel_size=3 決定。
    C: 索引 0、3、6 的間距是 3，對應的是 dilation=3，而不是 2。
