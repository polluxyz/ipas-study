stem: 某裝置的模型有 1000 萬個參數，每個值占 4 位元組。只計權重、梯度與優化器狀態，不計中間輸出及暫存。動量 SGD 為每個參數保存 1 個動量值；Adam 保存 2 個矩估計值，所有值都用相同精度。指定 1 MB=100 萬位元組，記憶體上限為 140 MB。兩種方案的占用與可行性何者最正確？
options:
  A: 動量 SGD 約 80 MB、Adam 約 120 MB；兩者都未超過 140 MB，皆符合上限。
  B: 動量 SGD 約 120 MB、Adam 約 160 MB；只有前者符合上限。
  C: 動量 SGD 約 40 MB、Adam 約 80 MB；兩者皆符合上限。
  D: 動量 SGD 約 160 MB、Adam 約 120 MB；只有後者符合上限。
answer: B
explanation:
  summary: 選優化器時，須把每個參數所附帶的歷史狀態計入記憶體。
  correct: 每份參數大小的陣列占 1000萬×4=4000萬位元組，即 40 MB。動量 SGD 需要權重、梯度、動量共 3 份，為 120 MB。Adam 需要權重、梯度與 2 份矩估計，共 4 份，為 160 MB。依指定的 140 MB 上限，只有動量 SGD 符合。本例已排除中間輸出與暫存，不能把結果當成完整訓練記憶體。
  wrong:
    A: 兩種方案都漏算了梯度這一份陣列，低估各 40 MB。
    C: 這只計優化器歷史狀態，沒有加入權重與梯度。
    D: 把兩種優化器的狀態數對調；Adam 才需要保存 2 份矩估計。
