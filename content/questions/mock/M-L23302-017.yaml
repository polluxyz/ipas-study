stem: 某零件檢索系統每天新增 30 種零件，每種先提供 3 張參考圖。零件常有相同平均亮度，但輪廓與孔位不同。團隊已有在相近零件驗證有效的影像嵌入模型，要求新增零件後即可按查詢圖的外觀找出相似候選，不必每次重訓分類頭。下列安排何者最適合？
options:
  A: 維持現有固定類別分類頭，按既有類別機率排序
  B: 以參考圖到整批共同中心的距離，建立固定候選順序
  C: 以全圖平均亮度當特徵，按平均亮度差異排序
  D: 建立參考圖的嵌入索引，按查詢與參考向量排序
answer: D
explanation:
  summary: 依動態新增項目與相似度檢索需求選擇模型輸出。
  correct: 既有模型已驗證能表示相近零件的外觀，因此可將新增參考圖編成向量並加入索引。查詢圖使用相同模型產生向量，再依相似度排序。這不需要為每種新零件增加分類輸出，也符合先提供候選的需求。
  wrong:
    A: 固定類別頭只輸出既有類別的分數。新零件尚未對應獨立輸出，不能直接用那些分數排序新增參考項目。
    B: 到整批共同中心的距離可衡量參考圖的中心程度，但沒有使用目前查詢圖，不能反映各次查詢需要的相似候選。
    C: 平均亮度只保留單一影像統計，會忽略形狀與紋理。題目已有驗證有效的外觀表示，單靠亮度差不符合這項外觀檢索需求。
