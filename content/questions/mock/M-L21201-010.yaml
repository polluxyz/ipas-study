stem: 某部門有 12 位固定月薪員工。AI 試辦每月釋出 240 小時，但部門沒有減少加班、委外或人數，主管卻把這些工時按薪資單價列為已實現的現金節省。公司本期目標是降低現金支出。評估時最適合採取哪項處理？
options:
  A: 依薪資單價保留現金節省，再以滿意度補充成效
  B: 區分可用工時與支出減少，核對可取消的實際付款
  C: 按 AI 回覆的筆數計價，再列為部門已節省支出
  D: 以員工採用率乘上薪資，再列為部門已節省支出
answer: B
explanation:
  summary: 工作時間釋出不會自動成為已實現的現金節省。
  correct: 固定薪資與其他付款未減少時，240 小時代表可重新配置的能力，不能直接宣告現金支出已降低。應找出確實可減少的加班或委外付款，或另外呈現工時效益，避免混用指標。
  wrong:
    A: 薪資單價可估計時間的價值，但支出未減少就不能當作已實現現金節省；滿意度也不能補上付款證據。
    C: 回覆筆數反映處理量，若沒有對應可避免的付款，換算後仍不是已實現的支出降低。
    D: 採用率反映使用程度，不直接決定固定薪資是否減少；乘上薪資仍不能證明現金流已改善。
