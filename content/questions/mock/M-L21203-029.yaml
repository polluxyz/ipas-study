stem: 某客服分類服務每週把使用者提交的「建議正確標籤」匯入再訓練資料。近期同一批新帳號提交 500 筆內容相近的回報，企圖讓特定詐騙訊息被學成一般通知。目前尚未開始本週訓練。最適合優先在哪個環節控制風險？
options:
  A: 在推論輸入端限制訊息長度，將較長訊息轉成標準格式
  B: 在回報納入訓練前查核來源與標籤，隔離可疑批次並保留追溯
  C: 在推論輸出端提高通知類的信心門檻，保留原有回報匯入流程
  D: 在訓練環節延長模型迭代輪數，使模型更充分學習回報資料
answer: B
explanation:
  summary: 惡意回報污染訓練資料時，應在資料被學習前查核。
  correct: 攻擊把錯誤標籤放進未來的訓練資料，屬於資料投毒。查核回報來源、複核標籤並隔離可疑批次，能阻止污染進入本週模型，也保留調查及重建資料的依據。
  wrong:
    A: 訊息長度限制處理推論輸入形態，正常長度的回報仍可攜帶錯誤標籤，沒有攔住訓練資料污染。
    C: 提高門檻可能暫時改變部分輸出，卻不會移除將被模型學習的錯誤回報。
    D: 延長訓練會讓模型繼續學習被污染的標籤，無法確認哪些回報可信。
