codes: [L21101]
concepts: [text-classification, dialogue-system]
stem: |
  某客服分流模型只讀客戶最新一句。客服先問「要補寄商品嗎」或「要取消續約嗎」，客戶都可能回答「好，麻煩你」。模型因而常混淆補寄與續約取消。兩種意圖的標註規則已確認，最適合優先調整哪項設計？
options:
  A: 增加最新一句的訓練筆數，維持原有輸入範圍
  B: 將常見的禮貌用語移除，再依剩餘字詞分流
  C: 納入同一對話中緊接之前的提問，再判定意圖
  D: 對兩種意圖分別增加權重，再訓練分流模型
answer: C
explanation:
  summary: 回應式短句的意圖可能由前一輪提問決定。
  correct: 這句回覆是在接受前一輪提出的處理方案。加入同一對話的前一提問，才有資訊區分客戶同意的是補寄還是取消續約。
  wrong:
    A: 增加相同短句的樣本不會提供所接受方案的內容，同句對應不同意圖的原因仍未處理。
    B: 去除禮貌用語可能減少冗詞，但無法補上客戶答應哪個方案的資訊。
    D: 權重會改變錯分的代價，無法由同一個缺少前文的短句決定不同的處理需求。
guide_refs: [guide-1:3-30, guide-1:3-31]
