stem: 某用電模型從每小時累積電表讀值建立用量特徵。電表平時只增不減，重置後從 0 累積，並記錄重置旗標。本例相鄰讀值由 980 降至 12，期間恰好在前次讀取後立即重置，且無其他故障。最適合如何處理這段特徵？
options:
  A: 依重置旗標改用本次累積值，並保留重置資訊
  B: 將兩次讀值差取絕對值，並作為本段實際用量
  C: 將兩次讀值差的負值截成 0，並作為本段用量
  D: 將原始負差值做 Z 分數轉換，並作為本段用量
answer: A
explanation:
  summary: 累積計數器重置需要依事件規則處理，不能當成一般負差分。
  correct: 重置發生在前次讀取後立即，因此重置後累積的 12 就是本段用量。保留重置旗標可記錄數值計算方式改變的原因。若不知道重置時間，則不能由兩個端點直接還原完整用量。
  wrong:
    B: 絕對差為 968，主要反映舊累積值被清除，並非這段的消耗量。
    C: 截成 0 會把本段實際累積的 12 丟掉；截斷可避免負值，卻不能還原重置後用量。
    D: 縮放只改變負差分的尺度，仍把重置誤當成用量變化，沒有修正數值的意義。
