stem: |
  某內容平台以「限制發文」為正向決策。這次稽核最關注守規會員被誤限的群體差異，暫不把違規會員是否漏限列為此項指標。已取得各群完整且可靠的實際違規標籤。哪個比較最能直接對應這次稽核目標？
options:
  A: 比較各群全體會員被限制發文的比例
  B: 比較各群實際違規會員被限制發文的比例
  C: 比較各群守規會員被限制發文的比例
  D: 比較各群被限制會員中實際違規者的比例
answer: C
explanation:
  summary: 檢查無辜者受限制的差異，分母應是實際守規者。
  correct: 守規會員屬實際負類，其中被限制者是假正。各群守規會員被限制的比例就是假正率，能直接反映題目指定的誤限差異。這是均衡機率所比較的兩種條件率之一，本題只聚焦假正率。
  wrong:
    A: 這是各群的整體限制率，混合了正確限制與誤限。群體中的違規比例不同時，限制率不能直接代表守規者被誤限的程度。
    B: 這是真正率，描述抓到違規會員的能力；它不會直接衡量守規會員被誤限的比例。
    D: 這是精確率，以被限制者為分母。題目關注的是守規者承受誤限的機率，應以守規者作分母。
