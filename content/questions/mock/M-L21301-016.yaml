stem: 某物流商合併 2 個倉庫的事件紀錄。甲庫儲存本地時間，乙庫儲存協調世界時，兩者時差為 8 小時，但欄位都只保留日期與時分。模型出現包裹「先送達再出庫」的紀錄。最適合先做哪項處理？
options:
  A: 將時間欄轉成單一日期欄，再以日期相同判定事件順序一致
  B: 將事件依資料列編號排序，再以排序結果重建包裹運送順序
  C: 確認各來源時區並轉到共同時間基準，再檢查事件先後關係
  D: 以全體時間差的中位數修補負值，再以修補結果計算運送時間
answer: C
explanation:
  summary: 多來源時間資料要先統一實際時間基準。
  correct: 同樣的日期時間字串可能代表不同實際時刻。應先依來源時區解讀並轉為共同時間基準，再核對出庫與送達順序，避免把表示差異誤認為真實流程錯誤。
  wrong:
    A: 刪除時分會損失順序資訊，無法修正跨日或同日內的時區差異。
    B: 資料列編號通常反映寫入或匯入順序，不必然是事件真正發生順序。
    D: 中位數修補掩蓋了已知的時區問題，還會把個別運送時間改成不對應實際事件的數值。
