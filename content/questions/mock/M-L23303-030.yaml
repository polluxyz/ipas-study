stem: 某團隊要觀察 12 筆獨立資料在不同 4 折切分下的波動。程式重建 3 次 KFold，卻得到相同分組。若要保留整次實驗可重現，並產生多輪不同分組，哪項調整最適合？
code: |
  import numpy as np
  from sklearn.model_selection import KFold
  X = np.arange(12)
  layouts = []
  for _ in range(3):
      cv = KFold(n_splits=4, shuffle=True, random_state=7)
      layouts.append(tuple(tuple(v.tolist()) for _, v in cv.split(X)))
  print(len(set(layouts)))
code_lang: python
options:
  A: 設定 4 折與 3 輪的 RepeatedKFold，並使用固定種子
  B: 改以 random_state=17，每輪重新建立同樣的 4 折 KFold
  C: 關閉目前 4 折 KFold 的 shuffle，重複呼叫 3 次 split
  D: 先建立 1 份 4 折清單，再隨機改變每輪取用折的先後順序
answer: A
explanation:
  summary: 固定種子重新建構切分器會重播相同隨機分組。
  correct: RepeatedKFold 可在同一次可重現的隨機流程內產生多輪分組。每輪仍是完整 4 折，而非反覆重播同一份 4 折清單。
  wrong:
    B: 改成另一個固定種子只會換成另一份分組，各次重新建構仍得到相同清單。
    C: 不打亂時，每次依原排列切分，無法觀察分組隨機性。
    D: 更動折的執行順序不會更動每折的成員，仍無法觀察重新切分的波動。
