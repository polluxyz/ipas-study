stem: 某系統輸出「正常程度」分數，越高代表越正常。團隊以故障為正類，直接把這個分數交給預設高分表示正類的 ROC-AUC 評估，得到 0.08。人工抽查也確認，多數故障的分數低於正常。哪項處理最適合優先執行？
options:
  A: 維持分數方向，先提高分類門檻後重算 AUC
  B: 維持分數方向，先提高故障類權重後重算 AUC
  C: 先反轉分數方向，再重算以故障為正類的 AUC
  D: 先將分數切成正常與故障，再用類別重算 AUC
answer: C
explanation:
  summary: AUC 評估前要對齊分數方向與正類定義。
  correct: 本例高分的語意與評估正類相反。用分數的負值等方式反轉排序，可讓高分表示較可能故障，再評估排序能力。反轉後 AUC 為 1−0.08=0.92。
  wrong:
    A: AUC 綜合不同門檻的排序表現，單獨提高某個分類門檻無法修正輸入分數方向。
    B: 類別權重是訓練或成本處理選擇，不能直接修正既有分數與正類語意相反的問題。
    D: 先切成類別會丟失原分數的排序資訊，也沒有先解決高分究竟代表哪個類別的問題。
