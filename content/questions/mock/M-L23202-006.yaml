stem: 某工廠收集 20 萬筆設備狀態，沒有可靠的故障標籤。團隊希望先列出少量異常候選，交給工程師逐筆確認。候選方法以隨機選特徵與切分值建樹，較少切分就被隔離的樣本得到較高異常程度。這最符合哪項方法與用途？
options:
  A: 局部離群因子；以樣本相對鄰近點的密度篩選異常
  B: 單類別支援向量機；以正常區域的決策邊界篩選異常
  C: 孤立森林；先產生異常候選，再由人員確認成因
  D: 孤立森林；以需要較多次切分才被隔離的樣本為異常
answer: C
explanation:
  summary: 孤立森林利用隨機切分的隔離難易偵測異常。
  correct: C 正確。較短的平均隔離路徑通常代表較容易被分出的異常候選。這類方法可在缺少故障標籤時先做篩選，但罕見的正常狀態也可能被標記，仍需人工確認與後續品質評估。
  wrong:
    A: 局部離群因子比較樣本與鄰近點的局部密度；可用於無標籤異常偵測，但不符合題幹的隨機切分與隔離路徑。
    B: 單類別支援向量機學習資料主要分布區域的決策邊界，以界外樣本為異常候選；不是按隨機樹的隔離路徑評分。
    D: 孤立森林的異常樣本通常較容易被隔離，平均切分次數較少；此選項把隔離路徑與異常程度的方向顛倒。
