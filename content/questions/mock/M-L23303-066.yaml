stem: 某二元模型已固定，團隊用額外 500 筆有標籤樣本擬合等張校準器（用單調映射調整機率），將原始分數映成事件機率。校準器在這 500 筆上誤差很小。團隊要估計校準後對同分布新樣本的機率品質，最適合採哪種評估？
options:
  A: 固定模型與校準器，在另一批有標籤樣本評估
  B: 固定模型與校準器，在原 500 筆打亂後評估
  C: 固定模型，依新樣本標籤重擬校準器後評估
  D: 固定模型，在原 500 筆改用更多分數桶評估
answer: A
explanation:
  summary: 校準器也是學習結果，其泛化品質需要獨立評估。
  correct: 等張校準器會利用標籤學習分數映射。同一批 500 筆的低誤差含有擬合效果，不能直接代表新樣本。應固定整條預測流程，再以另一批具代表性的有標籤資料檢查校準與機率誤差。
  wrong:
    B: 只打亂順序不會讓樣本脫離校準器的擬合資料，無法取得獨立評估。
    C: 用新樣本標籤重新擬合後再在同批評估，仍把評估資料用於學習，無法估計固定流程的泛化品質。
    D: 增加分桶數改變摘要解析度，並未移除校準器已看過這批標籤的影響。
