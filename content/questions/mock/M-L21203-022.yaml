stem: 某企業依美國國家標準暨技術研究院的 AI 風險管理框架（NIST AI RMF 1.0）建立治理清單。採購清單列出 6 套付費 AI，訪談另發現 3 個部門正使用免費模型處理真實客戶文件。依 GOVERN 1.6，最適合如何補足盤點？
options:
  A: 以採購金額排序現有清單，按金額安排各系統審查資源
  B: 將免費模型列入研發支出表，按使用帳號數分配教育訓練
  C: 將免費模型留在部門試用表，於付費採購時移入治理清單
  D: 將免費模型的實際用途納入清單，按風險安排管理資源
answer: D
explanation:
  summary: AI 系統盤點應涵蓋實際使用，不能只依採購付款紀錄。
  correct: GOVERN 1.6 要求建立 AI 系統盤點機制，並按組織風險優先順序配置資源。免費模型已處理真實文件，也會產生資料與用途風險，因此要納入治理範圍。
  wrong:
    A: 價格不代表資料敏感程度或錯誤後果；只整理付費項目仍會漏掉免費模型的實際風險。
    B: 帳號數可協助安排訓練，卻不能代替盤點模型用途、資料流及其風險，也沒有補齊治理清單。
    C: 是否付費不是風險開始發生的界線。已處理真實資料的試用服務，不能等採購才盤點。
