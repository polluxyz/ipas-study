stem: 某團隊要用客服對話訓練轉介判斷模型。任務必須辨認同段對話中的 2 位聯絡人，以及後續句子各自指向誰；真實姓名則不需保留。姓名位置已完成標記，最適合採哪種替換方式？
options:
  A: 同段對話中同一人使用相同代稱，不同人用不同代稱
  B: 同段對話中全部姓名使用相同代稱，其他文字不變
  C: 每次出現姓名都產生新代稱，不同位置用不同代稱
  D: 刪除每句包含姓名的整段文字，其餘句子依序保留
answer: A
explanation:
  summary: 文字去識別化仍須保留任務需要的人物對應關係。
  correct: 在同段對話內維持一致代稱，能保留誰被提到、後續句子指向誰等訊息。不同人使用不同代稱，則能避免把兩人的轉介關係混在一起。這項替換不代表其他文字已沒有識別風險。
  wrong:
    B: 全部姓名替成同一代稱會合併不同人物，模型無法區分轉介涉及的兩位聯絡人。
    C: 每次都換代稱會切斷同一人在不同句子的關係，破壞題目要求保留的指涉訊息。
    D: 整句刪除雖能減少姓名暴露，卻同時移除人物與轉介動作，容易讓剩餘對話失去必要語意。
