stem: 某文件分類任務需要聯合判讀文件開頭的條件與結尾的例外，單看任一片段皆不足。文件最長 3,000 個文字單位。候選預訓練模型的輸入上限為 512 或 4,096 個單位，皆已符合現場資源限制。下列起始方案何者最適合？
options:
  A: 採 4,096 上限模型，各段獨立分類後取信心最高段結果
  B: 採 512 上限模型，各段分類後以多數決輸出文件類別
  C: 採 512 上限模型，各段獨立分類後平均類別機率
  D: 採 4,096 上限模型，輸入完整文件訓練分類器
answer: D
explanation:
  summary: 選擇預訓練模型時，輸入長度要能保留任務所需的共同脈絡。
  correct: 完整文件能讓模型在同次判讀中處理開頭條件與結尾例外，且題目已確認資源可行。仍需驗證是否真的學會兩者的關係，不能僅依輸入上限推定準確率。
  wrong:
    A: 4,096 的輸入上限只表示模型可容納完整文件。各段獨立分類時，每次仍只看到一段；取信心最高段也只反映單一片段，無法聯合判讀開頭條件與結尾例外。
    B: 獨立段落的多數決無法直接學習跨段條件與例外的配對，較多片段也不等於整份文件的判斷。
    C: 平均獨立段落的類別機率沒有建立跨段特徵的交互關係，無法直接補足單看片段不足的限制。
