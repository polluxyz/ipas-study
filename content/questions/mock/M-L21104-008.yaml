stem: 某展場助理接收「介紹左邊那件」的語音與包含 3 件展品的畫面。現有系統只保留語音分支的「介紹」意圖分數，以及影像分支的「有展品」分數，常選錯目標。若要解析「左邊」指的是哪件展品，哪項設計最適合？
options:
  A: 提高語音意圖分數權重，再對既有分數加權平均
  B: 提高影像存在分數權重，再對既有分數加權平均
  C: 依兩個分支的最高分數，選出較可信的單模態結果
  D: 保留文字位置詞與影像區域特徵，建立跨模態互動
answer: D
explanation:
  summary: 指涉判斷需要保留可連結語句與影像區域的資訊。
  correct: 兩個既有分數都沒有指出目標展品。保留位置詞及各展品區域，再讓融合模型建立對應，才有資訊判斷「左邊那件」。本例的限制是過早丟失跨模態關係所需的細節。
  wrong:
    A: 意圖分數只能表示使用者想要介紹，調高權重不會補回展品位置。
    B: 存在分數只能表示畫面有展品，調高權重仍無法分辨左側目標。
    C: 單模態分數都未保留目標對應資訊，選較高分不能推得語句指向哪件展品。
