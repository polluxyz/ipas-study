stem: |
  某資格分派系統上線後，可立即保存每人的群體與是否入選，但獨立實際資格標籤須 6 個月後才取得。監控團隊目前要先計算一個不依賴實際資格、又能直接比較群體決策結果的公平性指標。下列何者最適合？
options:
  A: 各群合格者被選中的比例差距
  B: 各群不合格者被選中的比例差距
  C: 各群入選者中合格比例的差距
  D: 各群全體申請者入選比例的差距
answer: D
explanation:
  summary: 沒有真實標籤時，可先比較群體的整體入選率。
  correct: 各群整體入選率只需要群體與最終決策，能用目前資料計算統計均等差距。這項監控不代表已驗證機會平等或錯誤率公平，待資格標籤完整後仍須補查。
  wrong:
    A: 這是合格者的召回率差距，必須先知道哪些人實際合格。目前無法從入選決策反推出真實資格。
    B: 這是假正率差距，分母須為實際不合格者；目前尚無資格標籤，無法正確計算。
    C: 這是精確率差距，須知道入選者的實際資格。只有群體與入選結果，尚不足以計算。
