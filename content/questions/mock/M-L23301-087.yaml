stem: 某故障資料有 2,000 筆故障與 100 萬筆正常。正常資料包含 2 種運轉模式，其中罕見模式只占 0.1%，部署仍會遇到。訓練預算只允許保留 4,000 筆正常，工程師要求其中至少 200 筆來自罕見模式。最適合採哪項取樣設計？
options:
  A: 從全部正常資料均勻隨機取 4,000 筆，不按模式分組
  B: 按正常資料原始模式比例分配名額，再隨機取 4,000 筆
  C: 為正常資料各模式設定名額，再於各模式內隨機取樣
  D: 從罕見模式重複取樣至 4,000 筆，作為保留的正常資料
answer: C
explanation:
  summary: 欠採樣時可用群組名額確保罕見但重要的正常模式仍有代表。
  correct: 可給罕見模式至少 200 個名額，其餘配置給常見模式，再各自隨機取樣。這會改變正常資料內的模式比例，因此評估仍需使用代表部署分布的資料。
  wrong:
    A: 全體均勻抽樣只能給罕見模式很低的期望數量，無法確保至少 200 筆。
    B: 按 0.1% 原始比例分配，4,000 筆中只會配置約 4 筆，達不到保留要求。
    D: 這會讓保留的正常資料缺少常見模式，無法同時保有部署中的兩種正常行為。
