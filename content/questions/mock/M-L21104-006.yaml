stem: 某醫院整合影像與檢驗資料，每次就診產生一份風險判斷。同次就診可能有多張影像，檢驗則包含血糖、血氧等不同項目。資料已正確歸到各次就診。任一張影像的局部異常都應保留，不能被其他正常影像掩蓋；不同檢驗項目的意義也須保留。哪項特徵彙整最適合？
options:
  A: 影像與檢驗各取時間最新的一筆，再串接為就診特徵，以反映最近狀態
  B: 每張影像配上每筆檢驗，各自沿用就診標籤訓練，以充分利用所有資料
  C: 逐張擷取並保留影像異常線索，檢驗按項目分欄，再整合成就診特徵
  D: 影像與檢驗各算單一平均值，再串接為就診特徵，另保留兩路資料筆數
answer: C
explanation:
  summary: 多筆模態資料須先保留各自的關鍵意義，再形成就診層級的表示。
  correct: 影像先逐張擷取特徵，彙整時保留任一張的局部異常線索；檢驗則依血糖、血氧等項目分欄，不能把不同項目視為同一數值。最後才整合成一次就診的輸入。這樣同時符合判斷單位與兩種模態的資訊需求，具體彙整規則仍須驗證。
  wrong:
    A: 最新影像不一定包含其他影像的病灶，最新一筆檢驗也無法代表所有檢驗項目。時間新舊不能取代資訊是否完整的判斷。
    B: 所有交叉組合都沿用同一就診標籤，並未增加獨立就診樣本，反而讓資料筆數多的就診在訓練時占較大權重。單一組合也缺少其他影像與檢驗的線索。
    D: 影像的全體平均可能淡化局部異常；血糖與血氧的量測意義不同，合成一個平均值會失去項目資訊。保留筆數無法還原這些內容。
