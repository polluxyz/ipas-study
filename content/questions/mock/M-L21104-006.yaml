stem: 某醫院用檢驗數值與影像判斷同一次就診的風險。各來源時間都已同步，單路內容也正確。資料匯出後各自依檔名排序，再逐列拼接，抽查發現同列常是不同病人的資料；同一病人也可能一天就診多次。最直接的修正為何？
options:
  A: 改以檢查時間最接近者配對，再對無法配對的資料設置缺失狀態
  B: 改以兩路風險分數最接近者配對，再保留配對分數供人工抽查
  C: 依病人及就診識別碼配對，再核對每組資料確屬同一次就診
  D: 各來源都先按病人姓名排序，再把相同行號的資料串接成一組
answer: C
explanation:
  summary: 模態配對須指向同一實體與同一次事件。
  correct: 時間同步只能讓時刻可比較，不能保證同列屬於同一病人。病人識別碼排除跨人的混配，就診識別碼再區分同一病人的多次就診。按這兩項核對後融合，才能讓輸入共同描述本次目標。
  wrong:
    A: 相近時間仍可能有多位病人，也可能有同一人的不同就診，時間鄰近不足以確定身分。
    B: 不同病人也可能有相近風險分數，模型輸出相似不能作為病例配對依據。
    D: 姓名可能同名，且同一人有多次就診；獨立排序後的行號仍不是共同事件識別。
