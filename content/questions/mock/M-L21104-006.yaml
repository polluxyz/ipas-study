stem: 某醫院整合影像與檢驗資料，每次就診產生一份風險判斷。同次就診可能有多張影像，每張影像已轉成多維局部異常分數，各維分數越大表示對應異常越強；檢驗則包含血糖、血氧等不同項目。資料已正確歸到各次就診。任一張影像的局部異常都應保留，不能被其他正常影像掩蓋；不同檢驗項目的意義也須保留。哪項特徵彙整最適合？
options:
  A: 逐張擷取影像特徵後，僅取時間最新一張；檢驗按項目分欄，再串接成就診特徵
  B: 逐張擷取影像特徵後，對各維取平均值；檢驗按項目分欄，再串接成就診特徵
  C: 逐張擷取影像特徵後，對各維取最大值；檢驗按項目分欄，再串接成就診特徵
  D: 逐張擷取影像特徵後，對各維取中位數；檢驗按項目分欄，再串接成就診特徵
answer: C
explanation:
  summary: 多筆模態資料須先保留各自的關鍵意義，再形成就診層級的表示。
  correct: 各維是特徵向量中的各個數值欄位。本例各維分數越大代表對應異常越強，逐維取最大值可留下任一張影像的強訊號。例如某維在三張影像分別為 0.9、0.1、0.1，最大值仍為 0.9，不會被其他影像的低值拉低。檢驗按項目分欄，可保留血糖、血氧各自的意義，再與影像特徵串接。這是候選作法，仍須驗證特徵是否能表達局部異常，以及雜訊、誤報與實際風險判斷的表現。
  wrong:
    A: 最新影像可反映最近狀態，但不一定包含其他影像的局部異常。即使檢驗已按項目分欄，只取最新影像仍可能遺漏同次就診的影像線索。
    B: 逐維平均可彙整多張影像，但少數影像的高值可能被其他影像的低值拉低。例如 0.9、0.1、0.1 的平均約為 0.37，會淡化原本的強訊號。檢驗分欄不能補回這些影像資訊。
    D: 逐維中位數可降低極端值的影響，但局部異常也可能只出現在少數影像。例如 0.9、0.1、0.1 的中位數為 0.1，會忽略少數影像的強訊號。這與題目要求保留任一張的局部異常不符。
