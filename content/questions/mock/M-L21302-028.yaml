stem: 某服務有 2 個副本，視窗內分別處理 100 次與 9,900 次請求。儀表板目前把兩個副本各自的第 95 百分位延遲取平均，當成全服務的第 95 百分位延遲。若要正確監控全服務尾端延遲，最適合如何修改？
options:
  A: 依兩副本請求數加權平均各自百分位，將結果作為全服務百分位
  B: 取兩副本中較大的百分位延遲，將結果作為全服務百分位
  C: 彙整請求延遲樣本或可合併直方圖，再計算全服務百分位
  D: 先合併兩副本平均延遲再乘固定倍率，將結果作為全服務百分位
answer: C
explanation:
  summary: 全服務百分位必須由可合併的延遲分布計算。
  correct: 百分位描述整體排序中的位置，不是能直接平均的數值。應合併請求樣本後求百分位，或合併同一分桶規格的直方圖估計；直方圖的精度會受分桶寬度影響。
  wrong:
    A: 依請求數加權平均百分位仍無法重建整體排序，只有平均延遲等可加總統計量能直接這樣合併。
    B: 較大值反映較慢副本的尾端，可能被低流量副本主導，並不等於全體請求的百分位。
    D: 平均值不包含尾端分布形狀，不同分布可能有相同平均值卻有不同百分位，固定倍率不能可靠換算。
