stem: 某配送 AI 已加入路線限制措施，但測試仍發現雨天巷道有少量錯誤建議。團隊已核准在人工確認下繼續試行，交接文件卻只列「路線限制已完成」。為讓營運端正確承接，最應補上哪項資訊？
options:
  A: 整體錯誤率與路線建議採用率，以及依整體指標決定的擴量安排
  B: 措施後仍存在的雨天風險、適用限制，以及現場應採取的處置
  C: 每次模型更新的版本與發布紀錄，以及現場安裝版本的確認方式
  D: 既有路線限制的操作方式與啟用步驟，以及現場功能檢查的清單
answer: B
explanation:
  summary: 風險交接要說明控制後仍存在的風險與處置。
  correct: 措施完成後仍有錯誤，表示控制後的風險尚未消失。營運端需要知道何時不能直接採用建議、如何人工確認，以及出現問題時的處置，才能在核准範圍內使用系統。
  wrong:
    A: 整體指標可協助決定規模，但可能掩蓋雨天巷道的剩餘風險，沒有說明現場須注意的限制。
    C: 版本確認可避免裝錯模型，但即使版本正確，本例仍有雨天錯誤建議，需要另外交代風險與處置。
    D: 操作說明可協助啟用既有控制，但控制已啟用後仍有錯誤，功能清單不能代替剩餘風險的交接。
