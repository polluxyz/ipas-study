stem: 某客服團隊建立單一標籤的申訴分類資料。同一通電話因重複匯入而出現 2 列，輸入內容相同，卻分別標為「帳務」與「設備」。原始錄音與標註紀錄都可查閱。若要先修正這項訓練資料問題，哪項處理最適合？
options:
  A: 保留兩列，為較少見的類別提高樣本權重
  B: 依匯入時間保留較新的列，再進行類別編碼
  C: 回查錄音與標註規則，確認標籤後保留一列
  D: 將兩個類別編成相鄰數值，再取平均作標籤
answer: C
explanation:
  summary: 重複紀錄帶有衝突標籤時，須先確認正確標註。
  correct: 本例的兩列代表同一通電話，並非兩次獨立觀測。原始證據仍可取得，應依證據與標註規則解決衝突，再去除重複紀錄。
  wrong:
    A: 類別權重可調整學習偏好，卻無法判斷同一通電話哪個標籤正確，還會保留重複樣本。
    B: 較晚匯入只代表資料處理順序，不能證明標籤較準確。應先查標註證據。
    D: 帳務與設備是類別，不是可求平均的量值。相鄰編碼的平均值沒有可靠的標註意義。
