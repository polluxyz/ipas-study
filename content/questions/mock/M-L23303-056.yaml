stem: 某風險模型在代表性驗證集有 2,000 筆資料。1,000 筆皆預測 0.2，實際事件率為 0.4；另 1,000 筆皆預測 0.8，事件率為 0.6。全體平均預測與事件率同為 0.5。若要判斷機率校準，哪項結論最正確？
options:
  A: 兩個分數區段偏差方向相反，整體平均掩蓋偏差
  B: 整體平均吻合，兩個分數區段均可視為校準
  C: 高分區事件率較高，兩個分數區段均可視為校準
  D: 兩區筆數相同，兩個分數區段均可視為校準
answer: A
explanation:
  summary: 平均預測吻合整體事件率，不代表各分數都校準。
  correct: 0.2 分數區段低估事件率，0.8 區段則高估。兩區等大且偏差相反，整體平均剛好抵銷。校準要檢查同分數樣本的實際事件率，不能只核對全體平均。
  wrong:
    B: 整體平均只檢查總量，無法識別各分數區段的低估與高估。
    C: 高分區事件率較高顯示有區分能力，但 0.2 不等於 0.4、0.8 不等於 0.6，仍未校準。
    D: 相同筆數有助比較估計精度，卻不會讓預測機率自動等於觀察比例。
