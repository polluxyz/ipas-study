type: 情境
codes: [L23401]
concepts: [privacy-impact-assessment, privacy-governance]
stem: |
  某公司準備公開一個以內部健康資料訓練的模型。公司已刪除原始訓練檔，且模型對一般測試資料的分類準確率達 92%。但演練者僅透過模型回應，就推回部分參與者未公開的健康屬性，並由受控紀錄核對成功。針對這項模型逆向風險，最適合採用哪項發布判斷？
options:
  A: 將模型輸出的屬性洩漏列入發布前的隱私風險評估
  B: 以原始訓練檔已刪除作為通過隱私驗收的主要證據
  C: 以一般測試資料的分類準確率作為隱私驗收的指標
  D: 將演練得到的屬性判定納入模型預測能力的驗收
answer: A
explanation:
  summary: 原始資料刪除後，模型輸出仍可能洩漏私人屬性。
  correct: 演練已證實模型回應可被用來推回未公開資訊。模型本身及其輸出因此仍在隱私評估範圍，發布決策要處理這項已確認的洩漏風險。
  wrong:
    B: 刪除訓練檔減少原始檔被取得的風險，卻不能消除本例已由模型回應發生的資訊洩漏。
    C: 分類準確率衡量預測任務的表現，不衡量查詢者能否推回不應取得的私人資訊。
    D: 私人屬性被推回並不是原定公開服務的驗收目標，不能把隱私洩漏當成額外功能通過驗收。
