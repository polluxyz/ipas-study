stem: 某工廠的二元分類結果為：實際瑕疵且判瑕疵 80 件、實際瑕疵但判正常 20 件、實際正常但判瑕疵 40 件、實際正常且判正常 860 件。主管改以「正常」作正類，評估自動放行的可信度。正常類的精確率最接近多少？
options:
  A: 97.7%
  B: 89.6%
  C: 80.0%
  D: 66.7%
answer: A
explanation:
  summary: 改變正類定義時，精確率的分子與分母都要重新對應。
  correct: 以正常為正類，預測正常的 880 件中有 860 件真的正常，所以精確率為 860/(860+20)，約 97.7%。這才是被自動放行的案件中，實際正常所占的比例。
  wrong:
    B: 89.6% 約為 860/(860+100)，混入了實際瑕疵總數，並非預測正常的案件數。
    C: 80.0% 是瑕疵類的召回率 80/(80+20)，與正常放行的可信度不同。
    D: 66.7% 是以瑕疵為正類時的精確率 80/(80+40)，不是本次正常類的精確率。
