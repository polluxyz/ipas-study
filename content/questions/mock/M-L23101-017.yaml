stem: 某團隊從近似常態的量測母體獨立抽取 16 筆資料，樣本平均為 10 毫秒、樣本標準差為 4 毫秒，母體標準差未知。採雙尾 95% 的單一樣本 t 信賴區間，自由度 15 的臨界值取 2.131。母體平均的區間最接近何者？
options:
  A: "[7.869, 12.131] 毫秒"
  B: "[8.040, 11.960] 毫秒"
  C: "[9.467, 10.533] 毫秒"
  D: "[1.476, 18.524] 毫秒"
answer: A
explanation:
  summary: 平均數區間使用標準誤，未知母體標準差時使用 t 臨界值。
  correct: 平均數的估計標準誤為 4/√16=1 毫秒。區間為 10±2.131×1，即 [7.869,12.131]。指引 3-7 說明區間估計；本題補充其單一樣本 t 區間的計算。
  wrong:
    B: 此範圍使用常態臨界值 1.96，未依題目指定的自由度 15 使用 t 臨界值。
    C: 此範圍以 4/16 代替標準誤。平均數的標準誤應除以樣本數的平方根。
    D: 此範圍把樣本標準差 4 直接當成平均數的標準誤，漏掉除以 √16。
