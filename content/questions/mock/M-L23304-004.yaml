stem: 某模型有 1,000,000 個權重，原本每個用 32 位元儲存，候選改成每個 8 位元。指定 1 MB=1,000,000 bytes，不計尺度、零點及其他中繼資料。純權重容量如何變化？
options:
  A: 4 MB 變為 0.25 MB；容量減為原來的十六分之一
  B: 32 MB 變為 8 MB；因為位元可以直接當 byte 計算
  C: 4 MB 變為 1 MB；是否加速仍須另外量測
  D: 4 MB 變為 1 MB；所有硬體推論也必定快 4 倍
answer: C
explanation:
  summary: 量化容量與效能復評。
  correct: 原容量為 1,000,000×32/8=4,000,000 bytes，新容量為 1,000,000 bytes。位元數下降可減少純權重容量，但延遲與品質仍受硬體及實作影響。
  wrong:
    A: 32 位元改為 8 位元是四分之一，不是十六分之一。
    B: 1 byte 有 8 bits，計算容量必須將位元數除以 8。
    D: 容量比正確，但實際加速不由位元比例單獨決定，還需量測算子支援及完整路徑。
