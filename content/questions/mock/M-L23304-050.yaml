stem: 某分類模型把各層都轉成 8 位元後，準確率由 94% 降為 86%。逐層試驗顯示，僅輸出層對降精度特別敏感；保留輸出層浮點運算、其餘層用 8 位元時，準確率為 93.8%。部署引擎支援此組合，容量與延遲也達標。最適合採哪項方案？
options:
  A: 其餘層恢復浮點，輸出層維持 8 位元
  B: 其餘層維持 8 位元，輸出層降至 4 位元
  C: 輸出層保留浮點，其餘層維持 8 位元
  D: 輸出層改為 4 位元，其餘層也改為 4 位元
answer: C
explanation:
  summary: 量化可針對敏感層保留精度，以平衡品質與部署成本。
  correct: 試驗已確認輸出層是主要敏感來源。只保留該層的浮點運算，能恢復品質並符合部署限制，沒有必要讓不敏感的其餘層也回到浮點格式。
  wrong:
    A: 這個配置保留了敏感輸出層的量化誤差，卻提高其餘層的成本，與逐層試驗結果相反。
    B: 將敏感層降到更低位元通常會增加近似誤差，沒有利用已驗證有效的保留精度方案。
    D: 進一步降低各層精度可節省資源，但仍讓已確認敏感的輸出層承受更粗的近似，未採用已驗證有效的品質恢復方式。
