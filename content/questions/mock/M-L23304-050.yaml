stem: |
  某分類模型的全部層分成甲、乙、丙 3 組，32 位元浮點權重容量依序為 96、48、16 MB。
  各組改用 8 位元整數後，權重容量約為原浮點容量的 1/4；本例按此比例計算。
  容量只計權重，不計尺度、零點等中繼資料與執行時記憶體。
  所有配置都以同一驗證集評估。全浮點準確率為 94%，全 8 位元為 86%。
  逐組試驗每次只讓 1 組保留浮點，其餘組採 8 位元。
  保留甲、乙、丙組浮點時，準確率依序為 87.2%、87.1%、93.8%。
  候選方案須同時符合權重容量不超過 60 MB、準確率至少 93.5%。
  下列哪個配置符合這 2 項門檻？
options:
  A: 甲、乙、丙組均保留 32 位元浮點精度
  B: 甲、乙、丙組均改用 8 位元整數精度
  C: 甲、乙組用 8 位元，丙組保留浮點精度
  D: 甲、丙組用 8 位元，乙組保留浮點精度
answer: C
explanation:
  summary: 混合精度量化可保留部分層的浮點精度，並須同時計算容量與核對品質。
  correct: C 的容量為 96÷4＋48÷4＋16＝52 MB，未超過 60 MB。保留丙組浮點的準確率為 93.8%，也達到 93.5% 門檻。試驗顯示，保留丙組精度比保留甲組或乙組更能恢復品質。這是符合題定門檻的候選方案，仍須在實際部署引擎重測準確率、容量與延遲。
  wrong:
    A: 全浮點的容量為 96＋48＋16＝160 MB，超過 60 MB。準確率 94% 雖是最高值，仍不能取代容量門檻。
    B: 全 8 位元的容量為 96÷4＋48÷4＋16÷4＝40 MB，是選項中最小者。準確率只有 86%，低於 93.5%，不能只依容量選擇。
    D: 保留乙組浮點的容量為 96÷4＋48＋16÷4＝76 MB，超過 60 MB。準確率為 87.1%，也未達 93.5%；多保留浮點容量不代表品質就能恢復。
