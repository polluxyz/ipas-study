stem: 某檢索增強生成（Retrieval-Augmented Generation，RAG）系統先取 50 個候選段落，再直接把向量分數前 5 名送入生成模型。人工查核發現必要證據常在第 12 至 25 名，前 5 名只是用詞相近。生成端最多仍只能接收 5 段，最適合優先測試哪項修改？
options:
  A: 將生成模型的取樣溫度調低，沿用原先 5 段
  B: 將 50 個候選依相關性重排，再取前 5 段
  C: 將候選數從 50 增到 100，仍取原向量分數前 5 段
  D: 將每段壓成摘要後，沿用原向量分數前 5 段
answer: B
explanation:
  summary: 候選內已有證據時，可在送入生成前重排候選。
  correct: 必要證據已在 50 個候選中，問題出在候選到最終五段的排序。以問題與候選的內容做重排，再選五段，可直接針對這個失敗位置測試改善，仍須驗證效果。
  wrong:
    A: 降低溫度可減少輸出隨機性，但不會把排名較後的必要證據加入輸入，未處理排序問題。
    C: 擴大候選可能改善候選召回，但必要證據已在現有候選內；沿用相同前五名規則，沒有直接改善證據的後段排名。
    D: 摘要可減少送入內容的長度，但題目瓶頸是必要段落未被選中；只壓縮已選五段沒有改變選取結果。
