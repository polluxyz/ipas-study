stem: 某內部助理可讀取未公開投標價格，並將答案中的圖片網址交給瀏覽器載入。測試發現，惡意文件會誘導模型把投標價格放進攻擊者圖片網址的查詢參數；瀏覽器載入時便把參數送出。哪項控制最直接阻斷這條外洩路徑？
options:
  A: 要求圖片網址使用加密連線，並驗證網站憑證
  B: 隱藏答案畫面上的網址文字，僅顯示載入後的圖片
  C: 限制助理查閱價格文件的頻率，並記錄每次查閱時間
  D: 由呈現端限制可載入的外部來源，攔下未核准的圖片請求
answer: D
explanation:
  summary: 輸出中的外部資源請求也可能成為資料外洩通道。
  correct: 資料在瀏覽器請求圖片網址時傳出。呈現端對外部來源實施准許清單並攔截未核准請求，可以直接阻止該請求把價格送到攻擊者端。此控制須在真正發出請求前執行。
  wrong:
    A: 加密連線保護傳輸過程，攻擊者作為目的站仍能讀到收到的網址參數。
    B: 隱藏網址只改變畫面；瀏覽器仍會向同一網址請求圖片並傳送參數。
    C: 限制查閱頻率可降低存取量，但單次合法查閱的內容仍可能經圖片請求傳出。
