stem: 某模型要最小化 L(a,b)=(a-3)²+(b-1)²，並硬性要求 a+b=2。a、b 除此以外可取任意實數。工程師要找符合限制且損失最低的參數。下列組合何者最適合？
options:
  A: (1, 1)
  B: (1.5, 0.5)
  C: (2, 0)
  D: (3, -1)
answer: C
explanation:
  summary: 等式限制下，最小平方目標可化為單變數求解。
  correct: 由限制 b=2-a，代入得到 L=(a-3)²+(1-a)²=2(a-2)²+2。最小值在 a=2、b=0。這也是將無限制最適點 (3,1) 正交投影到直線 a+b=2 的結果。
  wrong:
    A: 此點符合限制，但損失為 4，高於 (2,0) 的 2。平均分配參數不是這個目標的最適條件。
    B: 此點把無限制解按比例縮小至總和 2，損失為 2.5。比例縮放不等於距離最近的等式投影。
    D: 此點保留 a=3 並只調整 b，損失為 4。允許兩個參數共同調整可以得到更低損失。
