stem: 某冷鏈車隊採混合部署。車上模型負責必要的溫度警報，雲端只補充歷史趨勢說明。現行系統卻在每次警報前同步等待雲端說明，山區斷線 3 分鐘便無法發出警報。車上已具備完整警報資料與算力。最適合的整合調整為何？
options:
  A: 讓車上獨立完成警報，將雲端說明改成可延後補上的輔助流程
  B: 保留警報前的雲端等待，增加車上推論副本以提高本地吞吐量
  C: 將車上模型也搬至雲端，讓警報與趨勢說明共用單一執行位置
  D: 保留同步相依關係，延長雲端逾時至足以涵蓋山區斷線期間
answer: A
explanation:
  summary: 混合部署的必要本地流程不應被非必要遠端步驟阻塞。
  correct: 本例本地已有完成警報的條件，雲端說明只是輔助功能。解除警報對雲端說明的同步依賴，可在斷線時維持必要警報，再於恢復連線後補充說明。
  wrong:
    B: 本地吞吐量不是已知瓶頸；即使增加副本，同步等待雲端的條件仍會阻止警報完成。
    C: 將警報也移到雲端會使斷線期間更依賴外網，不符合持續提供必要警報的條件。
    D: 延長逾時只是讓警報等更久，沒有解除斷線時阻塞必要流程的相依關係。
