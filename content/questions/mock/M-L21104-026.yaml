stem: |
  某導覽系統將中文解說翻譯後，同時產生外語字幕與配音。編輯把譯文中的「往左」修正為「往右」，字幕已更新，配音仍讀出舊版本；兩者播放時間沒有偏移。若要防止同類問題，最適合採取哪項設計？
options:
  A: 調整字幕顯示的起訖時間，重新同步現有字幕與音軌
  B: 對原始中文增加語音辨識校對，重新確認輸入文字
  C: 調整配音的音色與語速，重新產出原有版本的音軌
  D: 以同一核定譯文版本驅動字幕及配音，修改時重建兩者
answer: D
explanation:
  summary: 跨模態內容一致性需要共同的內容版本。
  correct: 本例的差異是字幕與配音使用不同版本的譯文。讓兩者連到同一核定版本，並在修改時重建及核對，可避免其中一種輸出繼續使用舊內容。
  wrong:
    A: 時間同步處理播放時點，不能把音軌中說出的往左改成往右。題目也已確認沒有時間偏移。
    B: 原始中文的辨識校對不能處理翻譯完成後的版本分歧。錯誤出現在已修訂譯文與衍生輸出的連動。
    C: 音色與語速影響聲音呈現。繼續使用舊版譯文產生音軌，仍會說出不同於字幕的方向。
