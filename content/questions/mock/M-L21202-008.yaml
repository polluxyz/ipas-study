stem: 某物流公司規劃更換工單分類模型。新版把「設備問題」拆成 3 個類別，但下游派工系統仍依舊類別碼分配技師；測試時新版模型本身已達標。若要避免上線後派錯人，規劃文件最應先補哪項工作？
options:
  A: 確認新舊類別的業務對應，與下游共同驗證派工規則
  B: 提高新版分類準確率，再沿用舊類別碼的派工設定
  C: 增加模型訓練資料量，再以離線分類成績作為驗收
  D: 擴充推論服務的處理量，再以介面成功回應作為驗收
answer: A
explanation:
  summary: 輸出分類變動必須連同下游業務規則一起規劃。
  correct: 新版輸出改變了派工系統依賴的語意契約。應由業務與系統團隊確認類別碼對應，並用代表性工單驗證實際派工。單獨通過模型測試不能代表整個業務流程正確。
  wrong:
    B: 準確率提升不會自動修改舊碼與技師的關係，仍可能把正確分類送往錯誤流程。
    C: 更多資料及離線成績只能改善或評估模型，未驗證下游如何使用新類別。
    D: 處理量與介面回應反映服務能力，不能證明類別語意及派工對應正確。
