codes: [L23203]
concepts: [residual-connections]
stem: |
  某已訓練的影像網路要插入同形狀的殘差區塊，輸出定義為輸入 x 加上新分支 F(x)。區塊相加後沒有額外激活，捷徑保持原值。團隊希望剛插入時盡量保留既有模型功能，再逐步學習修正。最適合的新分支初始化目標為何？
options:
  A: "將新分支 F(x) 的初始輸出設計為接近輸入 x"
  B: "將新分支 F(x) 的初始輸出設計為接近輸入的負值 -x"
  C: "將新分支 F(x) 的初始輸出設計為各元素皆接近 1"
  D: "將新分支 F(x) 的初始輸出設計為接近零向量"
answer: D
explanation:
  summary: "用殘差分支的初始輸出保留既有映射。"
  correct: "在題設的直接相加區塊中，F(x) 接近零時，輸出 x+F(x) 接近 x。這讓插入區塊起初較少擾動既有表示，再透過訓練學習所需修正。"
  wrong:
    A: "若分支也輸出 x，相加後接近 2x，會改變既有表示的尺度，並非保留原映射。"
    B: "輸出接近 x-x=0，會消除原表示，與保留既有模型功能的目標相反。"
    C: "分支各元素接近 1，會對原表示的各位置加入約 1 的偏移，不能像零分支那樣接近保留輸入。"
guide_refs: [guide-3:4-71, guide-3:4-81]
author: codex
review:
  status: verified
  blind_answer: D
