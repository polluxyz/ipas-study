stem: 某物流公司以每單包裝時間建立預測模型。訓練資料有 5% 的時間缺失，已確認與作業難度無關。已知時間大多介於 2 至 8 分鐘，少數大型訂單需 90 分鐘。團隊要先用單一代表值補齊缺失，並降低大型訂單對補值的拉動。哪項做法最適合？
options:
  A: 用已知包裝時間的中位數填補
  B: 用已知包裝時間的平均數填補
  C: 用已知包裝時間的最大值填補
  D: 用已知包裝時間的標準差填補
answer: A
explanation:
  summary: 依數值分布選擇單一補值統計量。
  correct: 中位數反映排序中央的位置，少數耗時很長的訂單較不會拉動它。這符合本例希望取得典型包裝時間的目標。
  wrong:
    B: 平均數會被少數 90 分鐘的訂單拉高，較不符合本例要求。
    C: 最大值代表最耗時的已知訂單，並非多數訂單的典型時間。
    D: 標準差描述時間的分散程度，不能作為典型時間的中心位置。
