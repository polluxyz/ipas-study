stem: 某公司以 2 個代理規劃備料。需求代理回傳「需 120 箱」，庫存代理回傳「可用 120 個」；每箱有 12 個。彙整代理把兩個 120 視為供需相等。若要處理這類協作錯誤，最適合修改哪項設計？
options:
  A: 讓需求與庫存代理採用同一模型，維持現有結果欄位
  B: 在結果契約加入數量與單位，彙整前換算並檢核
  C: 增加第 3 個代理投票，沿用現有數量字串格式
  D: 降低兩個代理的生成溫度，維持現有彙整比較方式
answer: B
explanation:
  summary: 代理結果必須保留可比較的單位，才能正確彙整。
  correct: 錯誤來自把不同單位的數字直接比較。結果契約若明列單位與換算依據，彙整者就能先轉成相同單位，再判斷缺口。同一模型或更多票數都不能代替單位檢核。
  wrong:
    A: 相同模型可能讓表述較一致，但缺少明確單位契約時，彙整者仍可能把箱與個當成同一尺度。
    C: 投票適合整合判斷，但目前缺的是可比的數量。多數代理重複接受同一比較錯誤，並不會修正單位。
    D: 低溫度能減少輸出變動，不能修正彙整規則對單位的誤解。穩定重複同一數字仍會判錯。
