stem: 某公司用可能性乘衝擊分數排序風險，另訂「可能造成重大人身傷害的風險須專案審查」。風險甲為 1×5，可能傷及人身；風險乙為 3×3，只造成短暫內部報表延誤。主管因甲分數較低，打算跳過甲的專案審查。最正確的處置為何？
options:
  A: 甲仍須依重大傷害條件送審，分數排序作為其他資源安排的參考
  B: 優先處理乙並結案甲，待甲的可能性級別上升後再啟動專案審查
  C: 以兩項風險的分數平均決定審查，先將甲乙併入同一風險項目
  D: 以近期事故次數重新排序，當期沒有發生事故的項目暫緩專案審查
answer: A
explanation:
  summary: 風險矩陣排序不能取代明訂的重大傷害審查。
  correct: 題幹另設重大人身傷害的審查條件，矩陣分數不能取代該條件。甲即使乘積低，也需要專案審查；排序分數可輔助安排資源，不能直接證明風險可接受。
  wrong:
    B: 乙分數較高可影響資源安排，但不能因此取消甲已觸發的重大傷害審查。
    C: 平均會掩蓋甲的重大傷害性質，也無法據此解除甲的審查條件。
    D: 尚未發生事故不代表嚴重風險不存在，事故次數不能取代事前訂定的傷害審查條件。
