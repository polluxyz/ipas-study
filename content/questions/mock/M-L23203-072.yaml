stem: 某分類模型的骨幹占 500 MB，微調時將骨幹凍結，只更新 5 MB 的分類頭。部署仍需執行完整骨幹。主管據此認為裝置只要存放 5 MB。下列判斷何者最正確？
options:
  A: 將凍結視為前處理完成，部署時只存分類頭
  B: 保存骨幹結構，部署時以初始化權重產生特徵
  C: 將凍結視為權重量化，部署時縮減骨幹數值精度
  D: 保存既有骨幹權重，部署時用來產生分類特徵
answer: D
explanation:
  summary: 減少可訓練參數，不等於減少推論所需權重。
  correct: 凍結表示微調時不更新骨幹權重。分類頭仍以骨幹特徵為輸入，部署既然保留完整運算，就仍需載入骨幹；若要降低大小，需另做壓縮或更換模型。
  wrong:
    A: 凍結只是停止更新權重，不代表新輸入的特徵已事先算好；部署仍要執行骨幹。
    B: 骨幹結構與學得的權重不同。重新初始化會改變特徵，無法保留原分類頭依賴的表示。
    C: 凍結不會改變權重的數值精度，量化需要額外處理與驗證，不能從凍結直接推得。
