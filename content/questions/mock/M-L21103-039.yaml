stem: |
  某公開展示的文案助理會逐字顯示生成結果，等整篇完成才做內容檢查。測試時，違規句子已出現在觀眾螢幕上，之後才被刪除。公司這一階段優先要求「未通過檢查的生成內容不得公開顯示」，可接受增加等待時間。最適合調整哪項流程？
options:
  A: 提高事後檢查頻率，縮短違規句子的畫面停留時間
  B: 將生成溫度調低，維持逐字顯示及整篇完成後檢查
  C: 加入違規範例微調，維持逐字顯示及整篇完成後檢查
  D: 在顯示前暫存完整文案，通過內容檢查後才公開呈現
answer: D
explanation:
  summary: 對外顯示的時點必須晚於必要的內容檢查。
  correct: 先暫存文案再檢查，才能讓未通過的內容停留在內部。題目允許增加等待時間，因此完整文案通過後才顯示，最直接符合本階段要求。
  wrong:
    A: 增加檢查頻率可縮短暴露時間，但違規內容仍可能先出現在螢幕上，不符合顯示前必須通過的要求。
    B: 降低生成溫度主要改變取樣方式，不能把內容檢查移到顯示之前，也不能作為逐字內容已通過檢查的證據。
    C: 微調可降低部分違規輸出的機會，卻不會讓每次輸出都先經檢查。顯示流程的時序問題仍未處理。
