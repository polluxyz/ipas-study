stem: |
  某設備商分析 12,000 筆客服紀錄，發現「AX20」「ax20」「ＡＸ２０」被詞頻模型視為 3 個不同詞。產品目錄確認這些寫法代表同一型號，大小寫不影響產品身分。團隊希望合併同一型號的寫法，並保留 AX21 等其他型號的差異。最適合優先測試哪項前處理？
options:
  A: 依型號字串的編輯距離合併近似詞，再重建詞頻特徵
  B: 將全半形與英文字母大小寫統一，再重建詞頻特徵
  C: 將型號字串拆為單一字元分別計數，再重建詞頻特徵
  D: 依型號字串的出現次數刪去低頻詞，再重建詞頻特徵
answer: B
explanation:
  summary: 已確認等價的字形可統一表示，但不同型號仍須區分。
  correct: 統一全半形與大小寫，可將 3 種寫法轉成 AX20，同時讓 AX21 保持不同。指引說明文字正規化與向量化的用途，未列出此型號規則；本例依產品目錄確認等價範圍，再以固定驗證資料檢查合併效果。
  wrong:
    A: 編輯距離衡量字串需要幾次修改才相同。AX20 與 AX21 也只差 1 個字元，僅按相近程度合併可能混入不同型號，不能取代已確認的等價規則。
    C: 單字元計數改變了表示單位，卻仍把大小寫與全半形視為不同字元，沒有直接統一同一型號的寫法。
    D: 詞頻低不代表寫法無效。刪去少見寫法會丟失該批紀錄的型號資訊，也沒有把各種寫法的詞頻合併。
