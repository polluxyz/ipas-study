concepts: [tokenization, text-classification]
stem: |
  某設備客服要依來信中的額定電壓分派維修團隊。「1.5V」與「15V」須交給不同團隊，但清理程式移除小數點後，兩者都變成「15V」。其他文字相同時，模型因而無法區分。最適合優先測試哪項調整？
options:
  A: 增加兩類來信的訓練筆數，沿用目前的文字清理
  B: 在文字清理時保留數值小數點，再切分數值與單位
  C: 提高文字分類模型的容量，沿用目前的文字清理
  D: 調高低電壓類別訓練權重，再重新訓練分類模型
answer: B
explanation:
  summary: 文字清理須保留會改變派單結果的數值符號。
  correct: 小數點決定電壓的意義。先保留小數點，才能讓後續文字表示保有兩種電壓的差異。此處需要修正輸入資訊的流失，再驗證派單表現。
  wrong:
    A: 增加筆數不會恢復已遭清除的小數點。兩種需求仍可能成為相同輸入。
    C: 更大的模型可以學習較複雜的規則，但無法從相同輸入辨認已被移除的差異。
    D: 類別權重會改變錯分兩類的代價，無法使相同文字重新帶有正確的電壓資訊。
