stem: |
  某分類器舊版在 2,000 件簡單案件上正確率為 94%，新版在另外 2,000 件複雜案件上為 91%。案件來源與難度不同，兩組標籤皆可靠。主管要判斷差異是否來自模型版本。下列補充評估何者最適合？
options:
  A: 各自增加相同來源的案件數，直接用兩組更精確的正確率決定版本
  B: 把兩組標籤比例各自調成相同，再以既有分數消除案件難度的影響
  C: 只比較兩版共同預測正確的案件，再以該子集估計版本差異
  D: 讓兩版評估同一批具代表性的保留案件，並用相同流程比較預測結果
answer: D
explanation:
  summary: 以共同評估資料區分模型差異與案件組成差異。
  correct: 目前分數同時受到模型版本與案件難度影響。兩版使用相同且未參與選擇的代表性案件，可控制評估對象差異，再檢查版本造成的表現差異。
  wrong:
    A: 增加筆數可以減少抽樣波動，但不能消除兩組案件難度不同的影響。
    B: 相同標籤比例不代表特徵與難度相同，仍無法隔離版本差異。
    C: 依預測正確與否挑子集會排除錯誤，無法代表待評估案件的版本差異。
