stem: |
  某團隊規定兩群合格者召回率差距不得超過 0.05。工程師重訓時，把「任務損失＋λ×群體差距」作為目標，並把 λ 從 1 提高至 10；模型已完成訓練，但尚未取得新驗證結果。對是否達到規定，最正確的判斷為何？
options:
  A: 以獨立驗證資料重算的群體差距判定是否達標
  B: 以原群體差距除以 λ 增加倍數後的值判定是否達標
  C: 以新舊訓練目標函數的數值高低判定是否達標
  D: 以新舊模型整體準確率的數值高低判定是否達標
answer: A
explanation:
  summary: 公平性懲罰的權重不是驗收上限，也不能換算成固定改善比例。
  correct: 加大 λ 表示更重視差距，但目標仍同時包含任務損失，實際結果受資料與最佳化影響。它不會自動保證獨立驗證差距不超過 0.05，仍須依驗收指標實測。
  wrong:
    B: 差距與 λ 之間沒有固定反比關係。提高 10 倍權重，不代表差距會縮成十分之一。
    C: 訓練目標同時包含任務損失與公平懲罰，總值較低不代表差距已低於 0.05。調整 λ 後，目標數值的尺度也不同，更不能代替獨立驗證差距。
    D: 整體準確率衡量全體正確比例，不能判斷兩群合格者召回率的差距。整體表現提高時，差距仍可能超過 0.05。
