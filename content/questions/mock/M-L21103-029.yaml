stem: 某文案服務試營運共完成 1,200 次生成，包含格式失敗後的重試。每次實際生成收費 0.015 元，失敗也收費。最後取得 900 份通過驗收的文案，沒有其他費用。每份合格文案的平均生成成本是多少？
options:
  A: 0.020 元
  B: 0.015 元
  C: 0.01125 元
  D: 0.005 元
answer: A
explanation:
  summary: 合格產出的單位成本須包含失敗及重試的費用。
  correct: A 為總生成費 1,200×0.015＝18 元，再除以 900 份合格產出，得到每份 0.020 元。分母應是可交付的文案數，而不是全部生成次數。
  wrong:
    B: 0.015 是單次生成價格，未把未通過驗收的生成費分攤到合格產出。
    C: 0.01125 是 900×0.015÷1,200，將合格產出與實際計費次數的角色顛倒。
    D: 0.005 是 300 次未通過生成的 4.5 元分攤到 900 份產出，只含失敗分攤，漏掉合格文案本身的生成費。
