stem: |
  某工廠巡檢助理已整合現場照片與語音逐字稿。需求包括聽到設備的異常摩擦聲時提醒技師。測試時，技師的說話內容都轉錄正確，但持續出現的摩擦聲沒有進入文字，照片也看不到設備內部。最適合增加哪種資訊？
options:
  A: 將逐字稿轉成更長的語意向量，供融合模型判斷
  B: 從原始音訊擷取非語音聲學特徵，供融合模型判斷
  C: 將現有照片轉成更詳細的文字描述，供融合模型判斷
  D: 從逐字稿擷取更多設備名稱與動詞，供融合模型判斷
answer: B
explanation:
  summary: 語音逐字稿不會保留音訊中的每一種環境訊息。
  correct: 摩擦聲屬於非語音的聲學證據，不能期待語音辨識將它寫成逐字稿。新增音訊事件或聲學特徵分支，才能把這項原本未使用的訊息送入判斷。
  wrong:
    A: 增加逐字稿表示的維度，不能恢復轉錄時未保留的摩擦聲。文字特徵仍只反映已有的語句。
    C: 更詳細的圖片描述可提供可見資訊，但照片沒有呈現設備內部，也未記錄摩擦聲，無法直接補上缺口。
    D: 設備名稱與動詞有助於理解技師的話，卻不能證明當下是否存在異常摩擦聲。
