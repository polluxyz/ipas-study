concepts: [multimodal-application-evaluation, multimodal-ai]
stem: |
  某工廠巡檢助理新增音訊分支，判斷設備是否出現異常摩擦聲。訓練用的 1.5 萬段錄音中，異常樣本多來自 A 產線，正常樣本多來自 B、C 產線。隨機切分的測試 F1 為 0.95，試用到 D 產線卻降到 0.60；抽查顯示模型依賴各產線不同的背景馬達聲。若要確認音訊特徵能否辨識摩擦聲本身，最適合先做哪項驗證？
options:
  A: 將音訊切成更短的時間窗，再以隨機切分重算分數
  B: 補齊各產線的正常與異常錄音，再依產線分組留出評估
  C: 將分類門檻調到測試分數最高，再以同一測試集確認
  D: 將現場照片併入融合模型，再以隨機切分重算分數
answer: B
explanation:
  summary: 標籤與產線綁在一起時，模型可能學到產線背景，而不是目標聲音。
  correct: 目前的標籤與產線來源高度相關，隨機切分時訓練與測試都有相同背景，分數看不出問題。補齊各產線的兩種標籤，再留出整條產線測試，可降低產線身分造成的偏差，並檢驗模型到新產線是否仍能辨識摩擦聲。這不保證已排除所有背景線索，必要時還要另做背景控制測試。
  wrong:
    A: 時間窗變短後，產線與標籤仍綁在一起。同一段錄音切出的片段還可能同時落在訓練與測試，分數更難反映新產線的表現。
    C: 調門檻只改變同一組分數的判定位置，不能分辨模型依賴的是摩擦聲還是背景聲。用同一測試集選門檻也會讓分數偏樂觀。
    D: 加入照片後，分數混合了兩種模態的貢獻，無法單獨回答音訊特徵的能力。隨機切分也沒有處理產線與標籤綁定的問題。
