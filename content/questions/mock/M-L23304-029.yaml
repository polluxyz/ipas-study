stem: 某團隊調整樹模型的最大深度，候選為 2、4、6、8。在相同切分與重複試驗下，平均驗證分數隨深度上升，深度 8 最佳且未出現明顯過擬合。運算預算與部署資源仍有餘裕。若要確認搜尋範圍是否過窄，下一輪最適合如何安排？
options:
  A: 只增加深度 2 到 8 之間的候選密度
  B: 只增加深度 8 的重複試驗次數
  C: 只縮小驗證集，提高每次訓練資料量
  D: 加入大於 8 的深度，沿用相同驗證流程
answer: D
explanation:
  summary: 最佳候選落在搜尋邊界時，可檢查邊界外的區域。
  correct: 目前只知道深度 8 優於已測的較淺候選，還不能知道更深是否有益。資源允許且沒有明顯過擬合證據時，可向上擴展範圍並沿用相同驗證流程，再比較收益與代價。
  wrong:
    A: 提高原區間密度能細查區間內結果，但沒有檢查最佳值所在上邊界之外的區域。
    B: 增加重複可改善波動估計，卻不能回答更大的深度是否更好。
    C: 縮小驗證集會改變評估的不確定性與資料配置，並未探索尚未測試的深度。
