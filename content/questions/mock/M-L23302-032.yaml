stem: 某團隊用 2 萬筆新資料訓練深度分類器，準確率為 91%；早期的邏輯迴歸基準只有 2 千筆訓練資料，準確率為 86%。兩者使用同一份保留驗證資料。主管想知道改善是否來自新架構，而非新增資料。下列比較安排何者最適合？
options:
  A: 用相同的 2 萬筆資料重訓基準，再比較兩種模型
  B: 保留早期基準的結果，增加深度分類器的訓練輪數
  C: 用深度分類器的訓練準確率，對照基準的驗證準確率
  D: 按兩種訓練資料量各自切出驗證集，再比較模型分數
answer: A
explanation:
  summary: 評估架構增益時，基準也要取得相同的資料條件。
  correct: 兩個模型目前同時差在架構與訓練資料量，無法把差距只歸因於架構。用相同資料重訓基準，並維持相同驗證條件，才較能判斷新架構的額外價值。
  wrong:
    B: 多訓練深度模型沒有消除資料量差異，仍無法分辨架構與資料各自的貢獻。
    C: 訓練分數與驗證分數用途不同，混在一起比較會把擬合能力當成泛化品質。
    D: 各自切出驗證集沒有控制原本的訓練量差異，還會讓評估樣本不同，不能隔離架構的貢獻。
