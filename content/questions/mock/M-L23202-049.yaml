stem: 某客服平台已有可靠的二元支援向量機訓練工具，現在要將每封郵件送往 4 個互斥部門之一。團隊希望沿用二元分類工具，保留全部部門標籤。下列建模安排何者最適合？
options:
  A: 訓練單一二元分類器，以一個分數門檻分派部門
  B: 把部門編為連續數字，使用支援向量迴歸後取整數
  C: 為各部門訓練該部門對其餘部門的分類器，再整合分數
  D: 先按郵件特徵分群，再按群組編號大小對應部門
answer: C
explanation:
  summary: 可將多類別任務拆成多個二元分類問題。
  correct: 一對其餘策略讓每個分類器判斷某部門與其他部門，再依共同定義的分數規則選出一個部門。它能沿用二元工具，也保留四種標籤的分類語意。
  wrong:
    A: 單一二元分類器的一個門檻只能分成兩側，不能直接表達四個互斥部門。
    B: 部門編號沒有連續大小與等距意義，迴歸後取整數會引入不合理的誤差關係。
    D: 群組編號是分群結果的識別值，大小不會自然對應既有部門語意。
