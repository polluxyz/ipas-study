stem: |
  某文件搜尋器以向量的餘弦相似度排序，也就是內積除以兩個向量的長度乘積。系統收到 1 份只有空白的文件，前處理後產生零向量。若依這個公式判讀零向量與其他非零文件向量的方向關係，哪項判斷最正確？
options:
  A: 方向無法比較，餘弦相似度未定義
  B: 方向彼此相同，餘弦相似度為 1
  C: 方向彼此相反，餘弦相似度為 −1
  D: 方向互相垂直，餘弦相似度為 0
answer: A
explanation:
  summary: 零向量沒有可比較的方向，不能直接給定幾何上的餘弦值。
  correct: 零向量的長度是 0，餘弦公式會除以 0，方向相似度未定義。應先辨識這種輸入，再依產品規則略過或提示缺少內容。這與非零向量恰好互相垂直不同。
  wrong:
    B: 相似度 1 表示非零向量方向相同；空白內容沒有方向，不能據此視為與每份文件相同。
    C: 相似度 −1 表示非零向量方向相反。零向量沒有反向方向，不能把空白內容視為最不相似的方向。
    D: 相似度 0 在幾何上表示非零向量互相垂直。直接把未定義值當成 0，會把無內容輸入混入有效的方向比較。
