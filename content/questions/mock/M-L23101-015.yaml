stem: 某故障診斷系統依第 1 項證據算出故障後驗機率為 50%。第 2 項證據與第 1 項在給定故障狀態後條件獨立，且這項新證據在故障設備出現的機率為 0.6，在正常設備為 0.2。納入第 2 項證據後，故障機率最接近多少？
options:
  A: 25%
  B: 50%
  C: 60%
  D: 75%
answer: D
explanation:
  summary: 前一次後驗可作為新證據更新時的先驗。
  correct: 第 2 次更新使用 0.5 作先驗。故障與正常的未正規化權重為 0.5×0.6=0.3 與 0.5×0.2=0.1，故後驗為 0.3/(0.3+0.1)=75%。條件獨立讓第 2 項證據可使用題目給定的類別條件機率。
  wrong:
    A: 25% 是更新後正常設備的機率，與題目要算的故障機率相反。
    B: 50% 只保留第 1 次後驗，沒有納入偏向故障的新證據。
    C: 60% 是新證據在故障設備出現的機率，不能直接當成觀察證據後的故障機率。
