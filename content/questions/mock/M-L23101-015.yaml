stem: 某診斷系統已觀察到警報 A，現在又收到另一感測器的警報 B。兩項警報不是同一筆紀錄，但在故障設備內仍可能相依。工程師要計算 P(A且B｜故障)。以下哪項拆法不需要額外假設兩警報條件獨立？
options:
  A: P(A｜故障) × P(B｜故障)
  B: P(A｜故障) ＋ P(B｜故障) − P(A且B｜故障)
  C: P(A｜故障) × P(B｜A)
  D: P(A｜故障) × P(B｜A且故障)
answer: D
explanation:
  summary: 第二項證據的機率須保留先前證據與類別條件。
  correct: 由條件機率的乘法關係，聯合機率可拆成 P(A｜故障)×P(B｜A且故障)。既然允許兩警報相依，B 的條件不能省略 A，也不能省略故障狀態。
  wrong:
    A: 這個拆法需要 A、B 在故障條件下獨立；題目沒有提供這項保證。
    B: 這個加減關係對應至少一項警報發生的聯集，不是兩警報同時出現的交集。
    C: P(B｜A) 混合了故障與正常設備，沒有維持目前需要的故障條件。
