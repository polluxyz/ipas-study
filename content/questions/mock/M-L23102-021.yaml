stem: 某團隊只有 4 筆樣本，每筆有 10 個實數特徵。資料先對每欄減去該欄樣本平均，再計算精確的樣本協方差矩陣。忽略浮點誤差，若要由這份資料找出具有非零變異的主成分，最多能有幾個？
options:
  A: 3 個
  B: 4 個
  C: 9 個
  D: 10 個
answer: A
explanation:
  summary: 逐欄中心化會讓樣本列之間形成線性相依。
  correct: 中心化後 4 個樣本列向量的總和為零，因此資料矩陣的秩最多為 4-1=3。協方差矩陣的秩與中心化資料矩陣相同，故非零特徵值最多 3 個。
  wrong:
    B: 4 是未考慮中心化時由樣本數得到的秩上限。中心化額外帶入列向量總和為零的相依關係。
    C: 9 是以特徵數減 1，但中心化造成的是樣本列的相依；本例的限制來自只有 4 筆樣本。
    D: 10 是特徵維度，卻忽略樣本數與中心化對資料秩的限制。
