stem: 某風險模型對每個群體分別使用嚴格遞增函數做分數校準。驗證資料與標籤不變，同群沒有分數合併或捨入。團隊仍以校準後分數 0.5 作二元決策。關於這次處理的影響，哪項判斷最正確？
options:
  A: 群內排序可能改變，0.5 門檻決策維持相同
  B: 群內排序維持相同，0.5 門檻決策維持相同
  C: 群內排序維持相同，0.5 門檻決策可能改變
  D: 群內排序可能改變，0.5 門檻決策可能改變
answer: C
explanation:
  summary: 嚴格遞增校準保留群內排序，但未必保留固定數值門檻的決策。
  correct: 嚴格遞增函數保留每群內任意兩人的分數大小關係，所以群內排序與 ROC-AUC 不變。原來在 0.5 一側的分數，校準後可能跨越 0.5，故二元決策未必相同。跨群排序則不保證保留。
  wrong:
    A: 在無分數合併或捨入的條件下，嚴格遞增函數不能顛倒同群排序，且固定門檻決策未必保留。
    B: 排序保留的判斷正確，但校準函數未必將 0.5 映回 0.5，二元決策可能改變。
    D: 固定門檻決策可能改變，但每群內使用嚴格遞增函數，不會改變該群排序。
