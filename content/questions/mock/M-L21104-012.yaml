stem: 某零售圖文模型要辨認從未見過的商品款式。資料含 2,000 款商品，每款有 8 張不同角度照片及相同商品說明。團隊把圖文配對逐筆隨機分到訓練集與測試集。若要讓分數反映新款商品的效果，最適合如何分割？
options:
  A: 依照片拍攝角度分割，讓各款商品在兩個集合都有樣本
  B: 依商品款式分組分割，同款照片與說明放在同一集合
  C: 依說明文字長度分割，讓兩個集合的平均字數接近
  D: 依照片亮度分層分割，讓兩個集合的影像品質接近
answer: B
explanation:
  summary: 多模態配對的分割單位須對應未來要泛化的對象。
  correct: 服務目標是新款商品。逐筆分割會讓同款的照片及重複說明跨越兩個集合，模型可能辨認已見款式。以款式分組，可直接評估未見款式的圖文理解能力。
  wrong:
    A: 分角度可以測已知款式的新視角，但同款說明與外觀仍在訓練集，不符合本題的新款目標。
    C: 文字長度平衡有助比較輸入規模，卻未隔離同款商品的重複說明，仍可能高估新款效果。
    D: 亮度平衡可降低品質分布差異，但同款資料仍可能跨集合，無法排除款式記憶造成的分數提升。
