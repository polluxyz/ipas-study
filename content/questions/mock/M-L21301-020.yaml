stem: 某瑕疵模型經 INT8（8 位元整數）量化後，已在目標裝置達到延遲要求。量化前後在同一批有真值的資料上，整體正確率都是 98%。上線條件另要求「不得增加量化前原能檢出的安全瑕疵之漏判」。抽查發現兩版預測有不一致。最適合補哪項驗證？
options:
  A: 比較兩版輸出分數的全體平均，差距小就判定沒有增加安全瑕疵漏判
  B: 分別列出兩版的完整混淆矩陣，總漏判數相同就判定逐件風險等價
  C: 對齊逐件預測與安全瑕疵真值，檢查原本命中而量化後漏判的案件
  D: 只檢查量化後新增檢出的安全瑕疵，以新增命中數抵銷其他漏判件數
answer: C
explanation:
  summary: 整體正確率相同，不代表量化前後在關鍵案件上作出相同決策。
  correct: 量化降低數值精度，可能讓接近分類門檻的案件改變結果。上線條件限制的是原本檢出的安全瑕疵，因此須逐件找出「原版命中、量化版漏判」的集合。其他案件改善不能抵銷此項條件，整體分數或總漏判數也無法指出被交換的案件。
  wrong:
    A: 全體平均分數可能掩蓋少數門檻附近的變動，且未核對安全瑕疵真值。
    B: 兩版可能漏掉不同案件，總漏判相同仍可能新增漏掉原版可檢出的安全瑕疵。
    D: 本次條件禁止特定新增漏判，並未允許用新命中案件抵銷。
