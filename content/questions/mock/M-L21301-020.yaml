stem: 某離線巡檢器要選擇分類模型。在同一裝置與獨立驗證集上，甲的 F1 為 0.92、推論 18 毫秒；乙為 0.94、推論 65 毫秒。需求為 F1 至少 0.90，且每次推論須低於 30 毫秒。團隊另有可供研究的甲乙集成方案，尚未實測。哪項初版選擇最適合？
options:
  A: 採乙作初版，將較高的驗證 F1 作為主要選型依據
  B: 採甲乙集成作初版，以兩種模型互補提高辨識品質
  C: 採甲作初版，將乙或集成列為完成速度驗證後的候選
  D: 採乙作初版，將多筆輸入合批後再重新評估處理速度
answer: C
explanation:
  summary: 模型選擇先符合硬性限制，再比較額外的分數收益。
  correct: 甲的品質及速度均有符合需求的實測證據。乙目前速度不合格，集成也沒有裝置實測；未來若完成優化並證明符合限制，才適合重新比較。
  wrong:
    A: 較高 F1 不能抵銷硬性的單次推論期限，乙目前沒有可部署的合格證據。
    B: 集成可能改善品質，也可能增加運算負擔；尚未實測不能當作符合時限的初版方案。
    D: 合批可能改善整體吞吐，卻可能增加等待時間；尚未驗證單次時限，不能先核准乙作初版。
