stem: 某電商要訓練模型預測訂單在出貨後 30 天內是否退貨。歷史資料每天更新；出貨滿 30 天的訂單才可確認未退貨。工程師把昨天出貨且尚未退貨的訂單標成負類，讓最新資料也能投入訓練。針對標籤品質，最適合如何處理？
options:
  A: 將近期無退貨訂單加入較高負類權重，再比較驗證分數
  B: 將近期無退貨訂單複製多份，再平衡新舊資料的筆數
  C: 將觀察期未滿的訂單標為結果未定，待期限完整後產生標籤
  D: 將近期無退貨訂單的出貨日期標準化，再與歷史負類合併
answer: C
explanation:
  summary: 尚未觀察到結果，不等於已確認負類。
  correct: 本任務的負類是完整 30 天內未退貨，不是目前尚未退貨。昨天出貨的訂單仍可能在期限內退貨，應保留結果未定的狀態，待觀察期完整後再形成這種二元分類的訓練標籤。
  wrong:
    A: 增加負類權重會放大尚未確定標籤的影響，沒有補上不足的結果觀察時間。
    B: 複製近期訂單增加同一個未定結果的出現次數，不能讓負類標籤變得可信。
    D: 日期縮放只改變特徵數值表示，無法知道尚未走完的 30 天內是否會發生退貨。
