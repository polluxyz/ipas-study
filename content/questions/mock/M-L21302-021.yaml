stem: 某客服分類模型的候選版通過程式測試，整體 F1 分數也提高。發布規格另要求「緊急停機」類別的召回率至少 95%，但候選版只有 89%，現行版則符合門檻。重訓管線最適合採取哪項處置？
options:
  A: 將候選版直接晉升，因為整體 F1 分數代表整體分類品質提高
  B: 先將候選版全面發布，再把緊急停機召回率列為下次重訓目標
  C: 將發布門檻改用候選版的整體 F1 分數，再由管線重新判定
  D: 阻止候選版晉升並保留現行版，修正後重新驗證既定發布條件
answer: D
explanation:
  summary: 發布須同時滿足整體品質與事前指定的必要門檻。
  correct: 緊急停機召回率是本例必要的發布條件。候選版即使通過程式測試且整體分數提高，仍未達到該門檻，應停止晉升並保留符合門檻的現行版，再改善候選。
  wrong:
    A: 整體 F1 分數不能代替指定類別的召回率，平均改善不代表必要條件達標。
    B: 先全面發布會讓未達必要條件的模型直接承接流量，沒有落實發布門檻。
    C: 看到候選結果才換成較有利的指標，並未解決緊急停機漏判，也偏離既定驗收條件。
