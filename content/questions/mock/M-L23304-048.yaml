stem: 某企業要以教師模型訓練客服分類的學生模型。抽查發現，教師經常把新推出的退貨原因判成舊類別；人工已確認一批新類別標籤正確。學生需涵蓋這些新類別，最適合如何安排訓練？
options:
  A: 納入新類別人工標籤，降低該類錯誤教師訊號的權重
  B: 增加新類別蒸餾次數，仍以教師最高機率類別作標籤
  C: 提高教師訊號的權重，將人工標籤保留作成果展示
  D: 提高教師輸出的銳利程度，讓學生更集中學最高分類
answer: A
explanation:
  summary: 蒸餾須防止教師的已知錯誤成為學生的主要監督訊號。
  correct: 教師在新類別上的錯誤已經確認，直接強化模仿會傳遞這些錯誤。應讓可靠的人工標籤參與訓練，並降低錯誤教師訊號的影響，再以新類別資料驗證學生表現。
  wrong:
    B: 增加模仿次數會重複強化教師在新類別上的錯誤，而不是補足正確的新類別知識。
    C: 提高教師權重會讓已知錯誤主導學習。人工標籤若只用來展示，無法在訓練中修正學生。
    D: 讓分布更銳利會強調教師最有信心的類別；教師對新類別判錯時，這會強化錯誤目標。
