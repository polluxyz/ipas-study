stem: 某團隊只比較樹深度 {2,8} 與學習率 {0.01,0.1}。同一驗證流程的準確率為：(2,0.01)=80%、(8,0.01)=79%、(2,0.1)=78%、(8,0.1)=90%。從 (2,0.01) 開始，一次只改 1 個參數，且只接受立即改善時，會停在 80%。若預算足夠試完這 4 組，哪項判斷最正確？
options:
  A: 完整比較可找出 (8,0.1)；兩參數存在需共同驗證的交互作用。
  B: 單參數逐次調整已足夠；兩個單改都不改善，就能排除兩者共同改動後改善。
  C: 應直接選較小學習率；學習率越小便保證驗證準確率越高。
  D: 應直接選較淺的樹；樹越深便保證驗證準確率越低。
answer: A
explanation:
  summary: 一次只接受單一參數改善，可能錯過需要聯合改變的最佳組合。
  correct: 從起點單改深度得到 79%，單改學習率得到 78%，因此只接受立即改善的流程會停住。但兩個參數共同改變時可到 90%。既然這個候選集合只有 4 組且預算足夠，完整比較能看見交互作用，不能用兩次單改失敗排除聯合改動。
  wrong:
    B: 單獨改動的結果不能代表共同改動，表中的 90% 已顯示這個限制。
    C: 本例較小學習率沒有形成一致較高的分數，必須和深度共同比較。
    D: 較深的樹在學習率 0.1 時反而表現較好，深度不是單向保證。
