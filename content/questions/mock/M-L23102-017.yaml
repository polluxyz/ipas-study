stem: 某團隊對協方差矩陣做特徵值分解，特徵值為 5、5、1。兩套工具回傳前 2 個單位特徵向量，在最大特徵值對應的二維子空間內使用不同的正交基底。若各自保留前 2 個方向並投影後重建，忽略浮點誤差，下列比較何者最正確？
options:
  A: 兩組逐點座標相同，重建結果可能不同
  B: 兩組逐點座標可能不同，重建結果相同
  C: 兩組逐點座標可能不同，保留變異量也不同
  D: 兩組逐點座標相同，保留變異量也不同
answer: B
explanation:
  summary: 完整保留重複特徵值的子空間，重建不受基底選擇影響。
  correct: 重複特徵值允許在對應子空間內旋轉正交基底。座標會隨基底改變，但前 2 個方向張成的空間相同，所以投影矩陣與重建結果相同，保留的變異量也同為 10。
  wrong:
    A: 不同基底通常會改變逐點座標；共同子空間的正交投影則不會因此改變。
    C: 保留變異量由保留的特徵值總和決定，兩組都保留 5+5，不能因基底不同而改變。
    D: 逐點座標不保證相同，而且兩組保留的特徵值總和相同，保留變異量不會改變。
