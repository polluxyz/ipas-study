stem: 某機台用負載預測耗電。殘差對預測值的散布沒有明顯曲線，但在相近預測值下，低溫紀錄多為 -8、高溫紀錄多為 +8。溫度是預測當下可取得、尚未輸入模型的欄位。最值得優先查驗哪項原因？
options:
  A: 低溫與高溫的殘差方向不同，顯示預測值的量測單位需要換算
  B: 低溫與高溫的殘差方向不同，顯示負載特徵之間有多重共線性
  C: 低溫與高溫的殘差方向不同，顯示相鄰時間的殘差具有相關性
  D: 低溫與高溫的殘差方向不同，顯示模型可能遺漏溫度相關訊息
answer: D
explanation:
  summary: 殘差也要對照未使用的可用特徵，尋找尚未捕捉的規律。
  correct: 相近預測值下，殘差方向仍隨溫度改變，表示現有輸入可能不足以描述條件平均值。可比較加入溫度後的驗證結果；殘差對預測值沒有曲線，並不能排除其他特徵相關的規律。
  wrong:
    A: 題目沒有單位不一致的證據。換算單位會一起改變兩組尺度，不能消除兩組相反的條件偏差。
    B: 共線性要檢查輸入特徵間的關係；尚未輸入的溫度與殘差有關，不能直接證明負載特徵共線。
    C: 時間相關要檢查時間順序或時滯。本題提供的是溫度條件差異，沒有相鄰時間的證據。
