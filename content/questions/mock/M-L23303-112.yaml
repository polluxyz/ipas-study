stem: 某物流模型的代表性驗證資料中，少數大量出貨案件有極大殘差。團隊已核對訂單與標籤，確認這些都是真實且未來仍會承接的業務。主管要估計未來每筆訂單的平均絕對誤差。對這些大殘差案件，哪種報告方式最適合？
options:
  A: 先排除大殘差案件，再用剩餘案件估計整體平均誤差
  B: 先降低大殘差案件權重，再用加權結果估計整體平均誤差
  C: 先以全體殘差的中位數，取代未來訂單的平均絕對誤差
  D: 保留全體案件計算平均誤差，再另列大量出貨案件的誤差
answer: D
explanation:
  summary: 真實且屬於服務範圍的大殘差案件，仍須納入整體預測評估。
  correct: 大殘差可以提示模型不擅長處理某類訂單，不能直接當成資料錯誤。這些案件已核對且仍屬未來業務，應保留在全體平均絕對誤差內。另列大量出貨案件的誤差，能協助診斷失準情況，也保留整體評估的代表性。
  wrong:
    A: 依模型已知的誤差大小移除真實案件，會讓評估只剩較容易預測的訂單，低估完整業務的平均誤差。
    B: 降低權重會減少大量出貨案件對報表的影響，但沒有依據表示未來業務會降低這些案件的比重。
    C: 殘差中位數描述中央位置，不是逐筆絕對誤差的平均；即使改用絕對殘差中位數，也不能取代指定的平均指標。
