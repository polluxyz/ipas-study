stem: 某影像分類器訓練時先將像素除以 255，再套用固定的逐通道均值與標準差。新服務直接把 0 至 255 的像素送入同一模型，準確率下降。尺寸與通道順序已確認一致。哪項修正最直接？
options:
  A: 在新服務重現訓練時的像素縮放與逐通道轉換
  B: 維持目前像素尺度，只把分類分數的判定門檻調高
  C: 把每張影像各自轉成均值 0，取代原本固定均值
  D: 維持目前像素尺度，把影像壓縮品質調到最高
answer: A
explanation:
  summary: 部署輸入的數值轉換必須與模型訓練時相容。
  correct: 模型是在固定的輸入數值尺度上學習。新服務省略縮放與標準化，改變了模型收到的數值分布。重現相同轉換能直接修正已確認的差異，並可用固定影像比對轉換結果。
  wrong:
    B: 調整輸出門檻不會恢復模型預期的輸入尺度，可能改變誤報與漏報卻未修正原因。
    C: 逐張重算均值與訓練時的固定統計不同，可能移除有用的亮度資訊，不能視為相同轉換。
    D: 壓縮品質影響影像編碼的細節保留，無法修正像素數值縮放與標準化缺漏。
