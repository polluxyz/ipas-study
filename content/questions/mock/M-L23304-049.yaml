stem: 某文件辨識服務採量化後，模型推論由 12 毫秒降為 5 毫秒。端到端延遲仍為 95 毫秒，其中影像解碼與縮放占 78 毫秒，其他步驟占 12 毫秒。精度已達標，模型檔也符合容量限制。若要優先改善目前最大的耗時來源，最適合採哪個方向？
options:
  A: 再降低權重位元數，優先測試更低精度的推論
  B: 增加學生模型蒸餾，優先減少模型內部的運算
  C: 提高模型剪枝比例，優先減少卷積通道的數量
  D: 調整解碼與縮放流程，優先減少資料前處理耗時
answer: D
explanation:
  summary: 量化的局部加速，不能取代對整體耗時來源的分析。
  correct: 量測顯示前處理占 78 毫秒，遠高於量化後的 5 毫秒推論。應先評估解碼、縮放與資料搬移的實作，並確認改善後仍保留辨識所需的影像品質。
  wrong:
    A: 更低精度主要影響模型推論，目前推論只占 5 毫秒；這不是題目指定要優先處理的最大耗時來源。
    B: 蒸餾可降低學生模型的推論成本，但不會直接加快模型前的影像解碼與縮放。
    C: 剪枝可減少部分網路運算，仍沒有處理目前占時最多的影像前處理。
