stem: 某分類器以故障為正類，在 100 筆測試資料中沒有發出任何警報。測試集實際有 5 筆故障、95 筆正常。報表發現精確率公式出現 0/0，擬直接填 1 來表示「沒有誤報」。哪項解讀最正確？
options:
  A: 精確率在此無定義；召回率為 0，不能填 1 宣稱警報可靠。
  B: 精確率在此等於 1；召回率為 0，沒有誤報便代表警報完全可靠。
  C: 精確率在此等於 0.95；召回率為 0，與準確率相同。
  D: 精確率在此無定義；召回率為 1，因為正常案件全數判對。
answer: A
explanation:
  summary: 沒有正類預測時，精確率的分母為零，不能據此宣稱完美。
  correct: 本例 TP=0、FP=0、FN=5、TN=95。精確率 TP/(TP＋FP) 的分母是 0，因此依公式無定義；召回率是 0/(0＋5)=0。工具可以約定回填值，但那是報表處理規則，不能用來證明模型發出的警報可信。準確率 95% 也不能取代精確率。
  wrong:
    B: 沒有任何正類預測可供計算，沒有誤報不等於精確率已有 100% 的證據。
    C: 0.95 是整體準確率，分母不同，不能搬來補精確率。
    D: 正常案件全判對對應特異度，不是故障召回率。
