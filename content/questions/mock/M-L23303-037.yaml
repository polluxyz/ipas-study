stem: 某疾病篩檢器在固定門檻下，真陽率為 0.9、假陽率為 0.1。團隊比較盛行率 50% 的研究樣本與盛行率 1% 的實際人群，假設兩率能維持。下列程式的實際人群精確率最接近多少？
code: |
  prevalence = 0.01
  tpr, fpr = 0.9, 0.1
  tp = prevalence * tpr
  fp = (1 - prevalence) * fpr
  print(round(tp / (tp + fp), 3))
code_lang: python
options:
  A: "0.083"
  B: "0.500"
  C: "0.900"
  D: "0.990"
answer: A
explanation:
  summary: 精確率會隨正類在母體中的比例改變。
  correct: 預期真陽性比例為 0.01×0.9=0.009，假陽性比例為 0.99×0.1=0.099。精確率為 0.009/(0.009+0.099)，約 0.083。固定真陽率與假陽率，並不能固定精確率；此處須使用實際人群的盛行率。
  wrong:
    B: 0.500 是研究樣本的正類占比，既不是實際人群盛行率，也不是本例精確率。
    C: 0.900 是召回率，分母是實際正類；精確率的分母則是被判為正類的個案。
    D: 0.990 是實際人群的負類占比，沒有納入真陽性與假陽性的比例。
