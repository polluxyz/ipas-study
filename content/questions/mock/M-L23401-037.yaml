codes: [L23401]
concepts: [privacy-impact-assessment]
stem: |
  某平台要測試外部查詢者能否猜出一筆紀錄曾參與訓練，這類風險稱為成員推論。初次演練只提供 200 筆訓練紀錄，攻擊程式將每筆都猜為「參與過」，報表因此記為全對。若要檢查程式是否真的能辨別參與狀態，最適合如何修改演練？
options:
  A: 維持這批訓練紀錄，改由較大的攻擊模型重做猜測
  B: 維持這批訓練紀錄，加入更多模型的分類預測指標
  C: 改用另一批訓練紀錄，對同一筆紀錄增加查詢次數
  D: 加入同來源的未參與紀錄，核對兩種狀態的辨別結果
answer: D
explanation:
  summary: 成員推論演練須包含成員與非成員，才能檢查辨別能力。
  correct: 只提供參與過訓練的紀錄，無法排除程式只是固定回答「參與過」。加入來自相同資料來源、未曾參與訓練的紀錄，再分別核對兩類結果，才能看出真正的辨別能力。
  wrong:
    A: 更換攻擊模型容量不會補上未參與紀錄，仍無法分辨固定猜成員與有效攻擊。
    B: 一般分類指標不會提供非成員的真實狀態，無法補足成員推論演練的對照。
    C: 即使更換紀錄並增加查詢，只要測試對象仍都是成員，固定回答的問題就仍存在。
