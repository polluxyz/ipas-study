stem: 某問答系統每則回覆都附 2 個可開啟的來源連結。抽查發現，連結內容雖談相同產品，卻沒有支持回覆所稱的「可耐熱 180 度」。團隊只驗證連結能否開啟。最適合增加哪項驗收？
options:
  A: 統計每則回覆的來源數量，優先接受附有更多連結者
  B: 只比較回覆與來源的關鍵字重疊，重疊較高就予以通過
  C: 逐項檢查關鍵主張能否由對應來源段落支持
  D: 改以回覆用語的肯定程度評分，優先接受語氣明確者
answer: C
explanation:
  summary: 來源存在不代表來源支持回覆中的具體主張。
  correct: 耐熱數字是可查核的主張，需要在對應證據中找到支持。連結可開啟與主題相關都不足以證明數字成立，應逐項驗證主張與來源段落的關係。
  wrong:
    A: 增加連結數只改變引用量，更多不支持主張的來源仍不能證明耐熱數字。
    B: 關鍵字相同可能只表示討論同一產品，沒有驗證具體數值與適用條件。
    D: 肯定語氣是表達方式，模型也可能以明確語氣陳述無依據內容。
