stem: 某公司核可 2 週、20 萬元驗證手寫表單辨識。最大未知是掃描模糊時能否讀對關鍵欄位；登入與資料庫元件可沿用。第一輪只要決定是否值得投入後續整合。最適合選哪個工作包？
options:
  A: 抽取代表性模糊表單，測試欄位正確率與人工修正時間
  B: 完成全套管理介面，測試登入及帳號權限的操作流程
  C: 建立大型資料庫叢集，測試多據點的資料同步與備份
  D: 製作一般清晰表單展示，測試使用者對畫面風格的評分
answer: A
explanation:
  summary: 短期原型應優先降低會影響投資決定的主要未知。
  correct: 本輪決策取決於模糊手寫欄位能否處理，而非既有登入功能。代表性困難樣本的欄位正確率與修正時間，可直接檢查辨識能力及人工負荷，支援是否進一步整合的決定。
  wrong:
    B: 管理介面與權限測試有實作價值，但現有元件可沿用，完成介面仍不能回答模糊手寫是否可用。
    C: 資料庫同步與備份屬整合及營運工作，在辨識可行性尚未確認時，無法優先消除本輪主要未知。
    D: 清晰表單展示較容易成功，卻不代表模糊樣本的效果；風格評分也無法量化關鍵欄位與修正負荷。
