stem: |
  某模型將 70% 的個別權重設為零，準確率維持達標，但部署延遲仍為 40 毫秒。裝置只提供密集矩陣運算，不支援稀疏加速；匯出後張量形狀也沒有改變。若要針對這個原因降低延遲，下列方向何者最適合？
options:
  A: 評估整個通道或神經元的移除，匯出較小張量後在目標裝置量測
  B: 保持張量形狀並增加零值權重比例，讓密集運算自動略過更多零值
  C: 保持張量形狀並重新排列零值位置，讓既有密集運算改採稀疏核心
  D: 保持張量形狀並壓縮模型檔案，讓解壓後的矩陣乘法減少運算次數
answer: A
explanation:
  summary: 區分權重稀疏與部署時實際減少運算的條件。
  correct: 既有密集運算仍會處理原張量，零值多不等於延遲會降低。真正移除通道或神經元並重建較小張量，才有機會減少密集運算量；效果須在目標裝置量測。
  wrong:
    B: 裝置沒有稀疏加速，增加零值不會讓原尺寸的密集矩陣運算自動跳過它們。
    C: 重新排列零值不會替裝置新增稀疏核心，也沒有改變密集運算的張量尺寸。
    D: 壓縮檔案可降低儲存或傳輸需求，解壓後張量相同，矩陣乘法次數不因此減少。
