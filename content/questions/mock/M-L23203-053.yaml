stem: 某模型目前梯度為 (3,4)。工程師要比較「每個分量截在 [−1,1]」與「把整體二範數縮到不超過 1」的差別。以下程式執行逐元素截斷，結果及與原方向的關係何者最正確？
code: |
  import torch
  p = torch.nn.Parameter(torch.zeros(2))
  p.grad = torch.tensor([3.0, 4.0])
  torch.nn.utils.clip_grad_value_([p], clip_value=1.0)
  print(p.grad.tolist())
code_lang: python
options:
  A: 約 (0.6,0.8)；兩種方法都保留原本方向。
  B: 約 (1.0,1.0)；分量都有上限，所以兩種方法都保留原方向。
  C: 約 (1.0,1.0)；只有整體範數縮放保留原方向。
  D: 約 (0.6,0.8)；只有逐元素截斷保留原方向。
answer: C
explanation:
  summary: 逐元素截斷可能改變分量比例，因此不保留整體方向。
  correct: clip_grad_value_ 分別把 3、4 截為 1、1，分量比例從 3:4 變成 1:1，方向改變。整體範數裁剪則把整組梯度乘上同一個係數，約得到 (0.6,0.8)，因此保留原方向。兩種上限的定義不同，不能直接互換。
  wrong:
    A: (0.6,0.8) 是整體二範數裁剪的結果，並非逐元素截斷。
    B: (1,1) 的方向與 (3,4) 不同；個別分量都受限不等於保留比例。
    D: 兩種方法的結果與方向性質都對調了。
