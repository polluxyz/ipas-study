stem: 某未加正則化的線性迴歸保留截距，將 3 種互斥且完整的方案各編成 1 個二元欄位。每筆恰有 1 欄為 1。工程師要避免由此表示造成的精確線性相依，並保留每種方案的平均差異。最適合採哪項調整？
options:
  A: 保留截距與 3 欄，將每個二元欄位各乘以不同正常數
  B: 保留截距並移除其中 1 欄，將該方案設為參考類別
  C: 保留截距與 3 欄，將訓練資料的列順序重新隨機排列
  D: 保留截距與 3 欄，為每種方案複製相同數量的資料列
answer: B
explanation:
  summary: 完整互斥類別的指標總和等於截距欄，會產生精確線性相依。
  correct: 3 個方案指標逐列相加恰為 1，與截距欄相同。保留截距並少用 1 個指標後，截距描述參考方案，其餘係數描述相對差異，仍可表達 3 種方案的不同平均值。
  wrong:
    A: 非零縮放只會改變線性相依關係的係數，仍可用加權和重建全 1 的截距欄。
    C: 列順序不會改變每列的指標總和，精確線性相依仍存在。
    D: 增加相同結構的資料列不會增加欄位的獨立性，指標總和仍等於截距。
