code: |
  import torch
  layer = torch.nn.Conv2d(3, 8, kernel_size=3, stride=2, padding=1, bias=True)
  x = torch.zeros(1, 3, 32, 32)
  print(tuple(layer(x).shape))
  print(sum(parameter.numel() for parameter in layer.parameters()))
