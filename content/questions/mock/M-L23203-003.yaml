stem: 某工程師把一般卷積改成分組卷積，以減少跨通道連接。候選層使用輸入通道 6、輸出通道 8、groups=3。分組卷積要求輸入與輸出通道數都能平均分給各組。若保留輸入、輸出通道數，只調整 groups，下列哪項能讓此層建立成功？
options:
  A: 改成 groups=4，因為輸出通道可分成 4 組。
  B: 改成 groups=2，因為兩種通道數都能整除 2。
  C: 維持 groups=3，因為輸入通道可分成 3 組。
  D: 改成 groups=6，因為每組只接 1 個輸入通道。
answer: B
explanation:
  summary: 分組卷積的組數必須同時整除輸入與輸出通道數。
  correct: 補充：分組卷積會把輸入與輸出通道一起分組，兩邊都須能整除 groups。6 與 8 的共同因數包含 2，因此 groups=2 可建立。只檢查其中一邊可整除，仍可能在建構卷積層時失敗。
  wrong:
    A: 8 可整除 4，但 6 不能，輸入通道無法平均分組。
    C: 6 可整除 3，但 8 不能，輸出通道無法平均分組。
    D: 每組有 1 個輸入仍不夠；8 個輸出通道不能平均分給 6 組。
