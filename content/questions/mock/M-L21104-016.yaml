stem: 某團隊訓練圖文對比模型，每批 64 組資料。目前只把原配對標成正例，其餘交叉配對都標成負例。人工抽查發現，批內有多張不同照片都符合「白色馬克杯」這句描述，卻被當成負例推遠。最適合如何調整訓練資料與目標？
options:
  A: 增加批次中的相似杯子照片，沿用每張圖僅有原配對正例的規則
  B: 核對可成立的圖文關係，將多個有效配對納入正例目標
  C: 為每張照片配置唯一檔名，把不同檔名的交叉配對維持為負例
  D: 提高原配對的損失權重，把其餘交叉配對持續當成負例
answer: B
explanation:
  summary: 對比學習的負例須與實際任務的語意關係一致。
  correct: 如果多張圖都符合描述，這些交叉配對在語意上也成立。將它們誤標為負例會給模型互相衝突的訊號。核對有效關係並支援多個正例，可減少錯誤推遠相符圖文的問題。
  wrong:
    A: 更多相似照片能增加資料變化，但沿用錯誤負例規則，可能增加批內語意相符卻被推遠的配對。
    C: 檔名只能辨認資料項目，不能決定照片是否符合一句描述；不同檔案仍可能是有效的語意配對。
    D: 加重原配對能強化原始連結，但其餘有效配對仍被懲罰，沒有消除標記關係的衝突。
