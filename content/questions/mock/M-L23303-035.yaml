stem: 某需求模型每 28 天才取得下一批真實銷量。部署時須在同一起點一次預測後續 28 天，期間不更新模型，也拿不到期間銷量。離線目前逐日驗證，隔日就使用前日真值更新特徵。哪項設計最符合部署條件？
options:
  A: 保留逐日更新特徵的驗證，將各天結果合成每 28 天一組
  B: 保留逐日更新特徵的驗證，將模型參數固定到第 28 天
  C: 每個起點一次產生 28 天預測，期間只用起點已知資訊
  D: 每個起點只產生第 28 天的預測，再比較不同起點結果
answer: C
explanation:
  summary: 多步預測的驗證需要符合資訊到達頻率。
  correct: 同一起點要預測完整 28 天，就不能用期間尚未收到的真實銷量。起點已知的未來排程可以使用；需要過去銷量的特徵則須採符合部署方式的推進。
  wrong:
    A: 事後分成 28 天一組只改變彙整方式，預測過程仍使用部署時拿不到的期間真值。
    B: 固定模型參數仍容許特徵取得期間真值，資訊條件依然比實際部署寬鬆。
    D: 只檢查第 28 天不能評估第 1 至 27 天的預測，沒有涵蓋一次交付完整 28 天的任務。
