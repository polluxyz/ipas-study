stem: 某影像模型甲只有 120 萬參數，卻比 240 萬參數的乙慢。裝置分析顯示，甲的特殊分支運算多次切回一般處理器，乙主要使用加速器支援的標準卷積。兩者品質相近，最適合優先驗證哪項架構調整？
options:
  A: 將甲每層的通道數等比例減半，保留既有分支形式
  B: 將甲的特殊分支換成加速器支援的單路徑運算
  C: 將乙的卷積分解成更多小型分支，以降低單層參數
  D: 將甲的分支數加倍並縮窄各分支，以維持總參數量
answer: B
explanation:
  summary: 參數數量不能代替目標裝置的運算支援與實測延遲。
  correct: 已知瓶頸是特殊運算造成的處理器切換。換成加速器支援的運算可直接減少這種回退及資料搬移，之後仍須實測延遲與品質。參數較少不代表裝置執行較快。
  wrong:
    A: 減少通道可能降低計算量，但保留特殊分支仍會發生已確認的回退，沒有直接處理主要瓶頸。
    C: 分解成小分支不保證裝置支援，反而可能讓乙也增加分支切換與搬移成本。
    D: 維持參數量不會維持執行成本，更多特殊分支可能造成更多處理器切換。
