stem: 某公司規劃使用文件辨識服務 24 個月。方案甲建置費 12 萬元，每月費用 2,000 元；方案乙建置費 2.4 萬元，每月費用 8,000 元。兩案功能、品質、用量上限與內部人力成本相同，期間內不調價，也無其他費用。僅以這段期間的總支出選擇，何者最適合？
options:
  A: 選方案乙，總支出為 2.4 萬元
  B: 選方案甲，總支出為 16.8 萬元
  C: 選方案乙，總支出為 19.2 萬元
  D: 選方案甲，總支出為 31.2 萬元
answer: B
explanation:
  summary: 比較服務方案須把建置費與使用期間費用合計。
  correct: 方案甲為 120,000 ＋ 24 × 2,000 ＝ 168,000 元。方案乙為 24,000 ＋ 24 × 8,000 ＝ 216,000 元。其他條件相同，24 個月內方案甲支出較低。
  wrong:
    A: 2.4 萬元只有方案乙的建置費，沒有計入 24 個月的持續費用。
    C: 19.2 萬元是方案乙的 24 個月月費總和，尚未加上建置費，且仍高於方案甲總支出。
    D: 31.2 萬元把方案乙的月費套進方案甲。方案甲每月費用為 2,000 元，不是 8,000 元。
