stem: 某企業對獨立樣本執行 5 折交叉驗證。各折都重新建立模型，前處理也僅由該折訓練資料估計。一名稽核人員發現，不同折的訓練資料互有重疊，因此認為評估無效。對這項疑慮，下列判斷何者最正確？
options:
  A: 不同折的訓練資料重疊，應刪除重複使用的訓練樣本
  B: 同一折內訓練與驗證分開，不同折訓練資料重疊屬正常設計
  C: 不同折的訓練資料重疊，應只保留最高分那一折作為報告
  D: 不同折的訓練資料重疊，應沿用前一折模型來統一學習結果
answer: B
explanation:
  summary: 交叉驗證的訓練集可在不同折之間重疊。
  correct: 5 折驗證會輪替保留不同子集，其餘子集作訓練，因此不同折的訓練資料通常重疊。關鍵是各折獨立訓練，且該折驗證資料不參與其建模。
  wrong:
    A: 不同折重新訓練時可使用相同樣本。刪除跨折重複的訓練樣本會改變原定的 5 折設計。
    C: 只報最高分會忽略其他折的結果，造成選擇偏差，也不能回應整體穩定性。
    D: 沿用前折模型會把先前學過的資訊帶到下一折，其中可能包含下一折驗證樣本，反而破壞獨立評估。
