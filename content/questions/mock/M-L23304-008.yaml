stem: |
  某工廠將浮點模型轉為 8 位元整數模型。團隊已使用具代表性的校準資料，也確認推論算子支援，但瑕疵召回率仍由 96% 降至 83%。裝置容量不允許回到浮點模型，且團隊有原始訓練資料與少量再訓練預算。下列方法何者最適合優先驗證？
options:
  A: 沿用原有權重，把校準資料量加倍後重新轉換，以更精確的範圍估計恢復召回率
  B: 把每通道量化改為全層共用一組參數，以統一的尺度減少權重被捨入的誤差
  C: 在再訓練時模擬量化誤差，產生量化模型後重測召回率與容量
  D: 在整數模型的輸出端加上溫度縮放，校正分數分布以找回被漏判的瑕疵
answer: C
explanation:
  summary: 在量化精度不足且允許再訓練時選擇量化感知訓練。
  correct: 量化感知訓練會在訓練期間模擬低精度造成的誤差，讓權重適應部署格式。題幹已排查校準代表性與算子支援，這是可優先驗證的方向，轉換後仍需重測。
  wrong:
    A: 校準資料已具代表性，加量對範圍估計的幫助有限。校準只決定量化範圍，權重仍未適應低精度。
    B: 全層共用尺度要涵蓋所有通道的範圍，數值範圍小的通道解析度會下降，捨入誤差通常變大。
    D: 溫度縮放不改變分數排序，只調整機率尺度，無法補回量化造成的辨識能力損失。
