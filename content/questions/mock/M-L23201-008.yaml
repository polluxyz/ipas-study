stem: 某團隊比較 2 個分類器。甲只保存固定數量的係數；乙使用不做壓縮的 K 最近鄰分類，保存全部訓練特徵及標籤。特徵維度與 K 固定，訓練樣本將從 1 萬增加到 100 萬。下列資源評估何者最正確？
options:
  A: 乙在訓練時不求固定係數，因此預測時不需要資料
  B: 兩者的模型儲存量都只由 K 決定，樣本數不影響
  C: 甲須保存每筆訓練資料，乙只須保存各類別中心
  D: 乙的資料儲存量隨樣本增加，甲的係數儲存量可維持固定
answer: D
explanation:
  summary: 惰性學習的模型狀態可以包含整份訓練資料。
  correct: 題設的 K 最近鄰分類器保留每筆資料以供查詢，因此樣本增加會提高儲存需求。甲的係數數量固定，所以保存係數所需空間可維持固定。
  wrong:
    A: K 最近鄰的預測正是透過查詢訓練資料完成。不求固定係數不代表預測不需要資料。
    B: K 決定每次投票的鄰居數量，不決定需要保存多少訓練樣本。甲也不是以 K 定義模型大小。
    C: 甲已明示只保存固定數量的係數。保存類別中心是另一種摘要方式，並非題設的 K 最近鄰分類器。
