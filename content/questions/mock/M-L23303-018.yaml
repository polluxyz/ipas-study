concepts:
  - mean-absolute-error
stem: 某服務比較兩台設備的預測誤差。甲有 90 筆紀錄，平均絕對誤差為 1；乙有 10 筆紀錄，平均絕對誤差為 9。新合約要求先等機率抽設備，再從該設備等機率抽 1 筆紀錄。舊報告則從全部 100 筆等機率抽紀錄。新合約指標與舊報告指標依序為何？
options:
  A: 1.8、1.8；兩者都應依紀錄數加權。
  B: 5.0、5.0；兩者都應依設備數等權。
  C: 5.0、1.8；兩者採用不同的抽取對象權重。
  D: 1.8、5.0；新合約才需要依每台設備的紀錄數加權。
answer: C
explanation:
  summary: 評估指標的權重須對齊部署時先抽設備或先抽紀錄的目標。
  correct: 新合約各設備被抽中的機率同為 1/2，因此誤差是 (1＋9)/2=5。舊報告各紀錄等權，誤差是 (90×1＋10×9)/100=1.8。兩者估計不同抽樣流程的平均誤差；差異不是哪個公式比較正確，而是合約是否要求設備等權。
  wrong:
    A: 新合約先等機率抽設備，不能讓量測較多的甲取得 90% 權重。
    B: 舊報告從全部紀錄抽取，甲的被抽取機率為 90%，並非兩台各半。
    D: 把兩種抽樣流程的指標對調；新合約才是設備等權。
