stem: |
  某機構的內部政策禁止將群體欄位作為模型預測輸入，但允許經授權的稽核團隊在隔離環境使用群體資料。模型已移除群體輸入，每筆案件的預測與真實結果均已保存。主管仍要持續比較各群錯誤率。哪項資料安排最符合這 2 個目標？
options:
  A: 僅保留群體欄位的整體人數表，刪除與案件的對應
  B: 改以模型預測的群體身分，作為各群錯誤率的分組
  C: 只保留全體正確件數，以整體準確率追蹤各群差異
  D: 隔離保留可對應案件的群體資料，僅供授權稽核連結
answer: D
explanation:
  summary: 預測不使用群體欄位，與稽核需要群體證據是不同的資料用途。
  correct: 稽核必須把群體、預測與真實結果對應，才能計算各群錯誤率。將群體資料隔離保留並限制於授權稽核，可同時滿足題目的輸入限制與監控需求。移除預測輸入，不等於可以省略群體影響的查核。
  wrong:
    A: 只有群體總人數，無法得知哪個群體出現哪些誤判，因此不足以計算各群錯誤率。
    B: 模型推測的群體可能分類錯誤，會把案件分到錯誤群體。已有授權真實資料時，不應用推測身分替代稽核分組。
    C: 整體準確率會合併群體差異，無法回答主管要求的各群錯誤率，也不能取代分群查核。
