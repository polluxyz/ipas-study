stem: 某耗材需求模型在甲、乙廠各驗證 500 筆。以實際值減預測值計算，甲廠殘差集中於 +12，乙廠集中於 -12，兩廠內的隨機波動都很小。全體平均殘差接近 0。若要找出可改善的系統性偏差，最適合優先比較哪項方案？
options:
  A: 將全體預測加上同一個常數，並以全體平均殘差選該常數
  B: 依全體殘差的四分位距做縮放，並以縮放後殘差重新評分
  C: 將兩廠資料合併後重新隨機排序，並以相同模型重新評分
  D: 將工廠別納入模型的輸入，並以留出資料檢查各廠偏差
answer: D
explanation:
  summary: 相反方向的群組偏差可以在整體平均中抵銷。
  correct: 甲廠被低估，乙廠被高估。工廠別提供可辨識這種方向差異的資訊，應比較納入工廠別後，各廠在留出資料上的殘差是否更接近 0。仍需驗證新方案，不能由平均值直接保證改善幅度。
  wrong:
    A: 全體平均殘差接近 0，估得的共同修正常數也接近 0，無法同時修正兩廠相反方向的偏差。
    B: 縮放評分數字不會改變原單位的預測，也沒有提供區分兩廠的模型資訊。
    C: 重新排序不會改變各廠預測與真值的配對，也不會改變殘差方向。
