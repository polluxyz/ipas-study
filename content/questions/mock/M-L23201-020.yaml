stem: 某團隊比較同一迴歸架構的 2 種正則化強度。訓練目標是均方誤差加上懲罰項。甲的訓練目標為 10、訓練均方誤差為 2；乙分別為 24、4。同一獨立驗證集的均方誤差為甲 9、乙 5。目標是降低新資料的平方預測誤差。下列選模依據何者最適合？
options:
  A: 選甲，依含懲罰訓練目標比較兩種設定
  B: 選乙，依相同驗證集的預測誤差比較
  C: 選甲，依未加懲罰的訓練誤差比較
  D: 選甲，依加上訓練懲罰項後的驗證目標比較
answer: B
explanation:
  summary: 不同懲罰強度的訓練目標不能直接取代共同驗證標準。
  correct: 兩種設定以相同驗證集與相同指標評估，乙的均方誤差較低，符合題目要改善新資料預測的目標。懲罰強度不同時，含懲罰訓練目標的數值也受懲罰尺度影響。
  wrong:
    A: 甲的訓練目標較小，不能代表未見資料誤差較小；不同懲罰強度還改變了比較尺度。
    C: 訓練誤差反映對已見資料的擬合，不能據此忽略甲較高的獨立驗證誤差。
    D: 將訓練懲罰項再加入驗證誤差，會把共同預測標準改成不同強度的目標。17 與 25 的比較不能取代題目指定的新資料預測誤差。
