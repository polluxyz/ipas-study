stem: 某供應商風險模型已採折外目標編碼。多數供應商有 300 筆紀錄，少數只有 1 至 2 筆。少量紀錄的編碼常在 0 與 1 間變動。若要降低這些編碼的估計波動，又保留供應商差異，哪項做法最適合？
options:
  A: 提高罕見供應商的編碼權重，讓其標籤平均更接近原始值
  B: 把供應商名稱依字母順序轉成整數，再當成風險大小輸入
  C: 依供應商樣本數，將標籤平均向訓練資料的整體平均平滑
  D: 把每個供應商的標籤平均切成高低兩類，再作為風險輸入
answer: C
explanation:
  summary: 折外處理與平滑處理分別解決洩漏與估計波動。
  correct: 平滑可讓資料少的供應商較依賴整體平均，資料多的供應商較依賴自身平均。整體平均與各組統計仍須在允許的訓練範圍內估計。
  wrong:
    A: 加強稀少樣本的權重會提高對偶然標籤的依賴，不能降低該組估計的波動。
    B: 名稱的字母順序不表示風險順序，這會引入沒有業務意義的數值距離。
    D: 二分會損失連續差異，少量紀錄仍可能在切點兩側跳動，沒有利用樣本數調整可靠度。
