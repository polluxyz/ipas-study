stem: 某模型資料平台在登入時，把分析師的負責區域寫入工作階段，之後查詢都使用這份登入狀態。分析師由甲區調到乙區時，管理員已更新權限表，但尚未到期的舊工作階段仍可查甲區明細。內規要求調區生效後立即停止舊區存取，且分析師仍須能查乙區。哪項修正最能符合要求？
options:
  A: 將工作階段期限改為 1 小時，期限到後才重讀權限
  B: 在下次登入時重新載入區域，保留目前的工作階段
  C: 調區時使舊授權狀態失效，後續查詢採用更新權限
  D: 調區時輪替帳號密碼，已建立的工作階段保持有效
answer: C
explanation:
  summary: 權限撤回須同步處理已建立的授權狀態，不能只更新權限表。
  correct: 舊工作階段仍帶有甲區授權，單改權限表沒有讓查詢採用新規則。調區時須使舊授權狀態失效，讓後續查詢依乙區權限執行。更新後應驗證甲區查詢遭拒，乙區查詢仍可使用。
  wrong:
    A: 縮短期限能縮小舊權限存續的時間，但到期前仍可查甲區，不符合立即停止的要求。
    B: 只在下次登入重讀權限，仍允許目前的工作階段繼續查甲區，沒有處理當下的撤回需求。
    D: 密碼輪替與工作階段失效是不同動作。此方案明確保留既有工作階段，舊區授權因此仍可使用。
