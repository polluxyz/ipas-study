stem: 某企業把 6 個區域的模型訓練資料放在同一平台。各區分析師角色相同，但只能讀取自己負責區域的明細。平台已完成登入驗證，測試卻發現同角色者可查到其他區明細。最適合補哪項控制？
options:
  A: 以多因素驗證提高登入的身分可信度
  B: 用加密通道保護跨區資料的傳輸內容
  C: 在資料查詢端檢查分析師角色與負責區域
  D: 將帳號與查詢對象記入資料存取日誌
answer: C
explanation:
  summary: 相同角色仍可能有不同資料範圍，授權須限制可讀資料。
  correct: 登入驗證確認使用者身分，資料授權還須判斷該人能讀哪個區域。後端依角色及區域篩選明細，才能在資料回傳前阻擋同角色的跨區越權。
  wrong:
    A: 多因素驗證提高冒用帳號的難度，但本例是已登入分析師取得超出職責的資料，仍須修正資料範圍授權。
    B: 通道加密防止傳輸途中被窺讀，不能限制已通過登入的分析師收到哪些明細。
    D: 增加日誌有利事後追查，但若查詢規則不變，跨區明細仍會回傳給無權讀取的人。
