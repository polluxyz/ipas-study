stem: 某設備警報模型以故障為正類。在同一批驗證案件上，甲門檻有 8 次漏報、100 次誤報；乙有 12 次漏報、20 次誤報；丙有 4 次漏報、150 次誤報；丁有 20 次漏報、10 次誤報。漏報每次損失 100 單位，誤報每次 5 單位，其他結果不計成本。若只按總成本選門檻，下列選擇何者最適合？
options:
  A: 採用甲門檻
  B: 採用乙門檻
  C: 採用丁門檻
  D: 採用丙門檻
answer: D
explanation:
  summary: 比較門檻時應合併漏報與誤報的代價。
  correct: 依漏報數乘以 100，再加上誤報數乘以 5，甲的總成本為 1300，乙為 1300，丙為 1150，丁為 2050。丙雖然誤報最多，較少漏報仍使它在本題成本設定下具有最低總成本。
  wrong:
    A: 甲的成本是 8×100+100×5=1300。只比較誤報次數會忽略漏報代價，總成本仍高於丙。
    B: 乙的成本是 12×100+20×5=1300。誤報比丙少，但多出的漏報代價超過省下的誤報代價。
    C: 丁的成本是 20×100+10×5=2050。誤報最少不代表總成本最低，漏報代價在此占了主要部分。
