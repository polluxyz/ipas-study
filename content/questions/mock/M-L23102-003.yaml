stem: 某團隊對中心化後的溫度與壓力做 PCA，未先標準化。兩特徵的協方差為 0，變異數分別為 4 與 9。另一份相同資料只將溫度單位改成原值的 10 倍，再重新中心化做 PCA。兩次都不白化。第一主成分最接近哪個特徵方向？
options:
  A: 兩次都是壓力；換單位不影響最大變異方向。
  B: 原資料是壓力；換單位後改成溫度方向。
  C: 原資料是溫度；換單位後改成壓力方向。
  D: 兩次都是溫度；PCA 一律優先處理第一欄。
answer: B
explanation:
  summary: 未標準化的 PCA 會受到特徵單位的平方尺度影響。
  correct: 協方差為 0 時，本例的主成分軸就是原特徵軸。原資料壓力變異數 9 大於溫度的 4，因此先選壓力。溫度乘 10 後變異數乘 100，變為 400，第一主成分改為溫度方向。這說明不同單位可能主導未標準化 PCA 的結果。
  wrong:
    A: 變異數會隨數值倍率的平方改變；中心化只移除平均值，沒有消除尺度。
    C: 原資料壓力的變異數較大，且換單位只會提高溫度的相對變異。
    D: PCA 依資料變異選方向，不按欄位順序優先選擇。
