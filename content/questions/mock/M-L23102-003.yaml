stem: 某工程師對中心化資料做 PCA，3 個主成分的變異量依序為 6、3、1。要求累積解釋變異比例至少 85%，且保留最少主成分。不做額外白化，應保留幾個？
options:
  A: 1 個，因為最大特徵值已大於其他任一個
  B: 2 個，累積比例為 90%
  C: 3 個，因為 85% 門檻要求沒有資訊損失
  D: 0 個，因為中心化後所有變異會相消
answer: B
explanation:
  summary: PCA 累積解釋變異。
  correct: 總變異為 10。只留第一個為 60%，前 2 個為 (6+3)/10=90%，因此最少保留 2 個。
  wrong:
    A: 最大方向個別占優不代表達到累積 85% 門檻，第一個只占 60%。
    C: 85% 允許捨去部分變異，前 2 個已達門檻，保留 3 個不是最少。
    D: 中心化讓各特徵平均數為零，不會讓變異全部變成零。
