codes: [L23202]
concepts: [knn]
stem: |
  某客服系統以 K 最近鄰分類新案件。每天有 500 筆新案件完成人工標註，特徵轉換已固定，團隊希望隔天查詢時能使用這批新案例。現有索引只含上月樣本。最直接的模型更新方式為何？
options:
  A: "用新標註估計線性係數，並更新分類器的係數檔案"
  B: "以新標註重新統計類別比例，並更新原有葉節點的輸出"
  C: "根據新標註新增修正誤差的決策樹，並更新樹的集成"
  D: "以相同特徵轉換處理新案例，並將案例與標籤加入鄰居索引"
answer: D
explanation:
  summary: "依最近鄰方法的記憶式推論方式更新案例。"
  correct: "K 最近鄰由查詢樣本與已保存案例的距離取得鄰居，再依鄰居標籤決策。把新案例與標籤加入可查詢索引，才能讓新案例參與隔天的鄰居搜尋。"
  wrong:
    A: "線性係數屬於參數式線性分類器，不是本例最近鄰索引的更新對象。"
    B: "葉節點比例屬於決策樹的預測設計，更新葉節點不會讓新案例進入最近鄰搜尋。"
    C: "逐輪新增決策樹屬於提升方法，並非維持既有最近鄰分類器的案例更新。"
