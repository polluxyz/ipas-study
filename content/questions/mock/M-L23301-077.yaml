stem: 某行銷專案有 8,000 個候選特徵。分析師先使用最終測試集的購買標籤，挑出相關性最高的 20 個特徵，再只用訓練集估計模型參數。主管認為參數沒有使用測試資料，評估就保持獨立。下列判斷何者最正確？
options:
  A: 特徵挑選已使用測試標籤，需改由訓練資料決定特徵
  B: 模型參數只用訓練集估計，最終測試分數仍可直接採用
  C: 選出的特徵少於樣本數，最終測試分數仍可直接採用
  D: 以多次隨機初始化重訓，可消除挑選特徵造成的評估偏差
answer: A
explanation:
  summary: 測試資料參與特徵挑選，也會影響模型選擇。
  correct: 挑選哪些特徵是建模決策的一部分。測試標籤已影響這項決策，即使參數只在訓練集估計，測試資料也不再獨立。
  wrong:
    B: 獨立性要求涵蓋特徵挑選等建模決策，並不限於參數估計。
    C: 特徵數與樣本數的大小關係不能恢復獨立性。從大量候選中挑選還可能利用測試集的偶然關聯。
    D: 隨機初始化可觀察訓練的隨機波動，但每次仍沿用被測試標籤影響的特徵，無法消除選擇偏差。
