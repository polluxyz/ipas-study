id: M-L23401-034
rev: 1
source: mock
subject: 1
type: 情境
codes: [L23401]
concepts: [data-outsourcing-governance, privacy-governance]
stem: |
  某公司委託廠商提供客服模型推論。廠商另提議，把服務期間接觸的對話用於訓練一個供其他客戶使用的共用模型。公司正在審查提議，尚未決定是否採用。若要確認資料用途的授權範圍，最適合優先核對哪組資訊？
options:
  A: 共用模型的準確率提升，以及廠商預估的維運費用
  B: 共用模型的訓練設備，以及廠商機房的備援容量
  C: 原先允許的利用目的，以及新增用途的授權依據
  D: 對話傳輸的加密方式，以及廠商金鑰的輪替頻率
answer: C
explanation:
  summary: 委外服務中的資料接觸權限，不等於新增訓練用途的授權。
  correct: 共用模型服務其他客戶，與原先客服推論的用途不同。應先核對原先允許的目的、契約範圍與新增用途的授權依據，再決定能否採用提議。
  wrong:
    A: 準確率與費用可評估商業效益，但效益本身不能證明對話可用於另一種目的。
    B: 設備與備援容量反映執行能力，不說明廠商是否獲准用這批資料訓練共用模型。
    D: 加密及金鑰管理有助保護傳輸資料，不能決定接收後允許如何利用。
