stem: 某設備巡檢系統用警報聲與影片定位故障。攝影機每秒拍 30 張，故障火花常只持續 0.1 秒。兩者時鐘已校正，但送入模型的影像每 2 秒才抽 1 張，因此經常只有聲音證據。最適合先調整哪項流程？
options:
  A: 提高抽出影像的解析度，保留每 2 秒抽 1 張的規則
  B: 依警報時刻擷取短片段，保留片段內足夠密集的影格
  C: 將已抽出的影像複製多份，配成與聲音相同的樣本數
  D: 延長聲音的分析時間窗，保留每 2 秒抽 1 張的規則
answer: B
explanation:
  summary: 短暫事件需要足夠的影格密度，時鐘同步不能補回漏取內容。
  correct: 原始影片含有較密集的影格，但稀疏抽樣可能跳過短暫火花。依警報附近的事件窗取回密集影格，才有機會讓模型同時看到聲音與視覺證據；仍須驗證事件窗是否涵蓋故障。
  wrong:
    A: 提高解析度只改善抽到的畫面細節，無法補回抽樣時已跳過的火花。
    C: 複製影像不會產生遺漏時刻的新資訊，樣本數相同也不代表事件證據齊全。
    D: 增加聲音範圍不會補回缺少的視覺瞬間，還可能加入與故障無關的聲音。
