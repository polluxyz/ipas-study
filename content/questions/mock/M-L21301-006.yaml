stem: 某物流商以重量與體積估算運送類別，採用歐氏距離的 K 最近鄰模型。重量欄位改用公克後，數值尺度由數十變成數萬；業務意義沒有改變，鄰居排序卻大幅變動。最合適的處理為何？
options:
  A: 把重量與體積直接相加成單一特徵，避免模型看到兩個不同單位
  B: 用訓練資料擬合各欄縮放規則，並將同一規則套用於新資料
  C: 將測試資料各自重新計算縮放範圍，再獨立決定每批資料的尺度
  D: 只增加鄰居數量，繼續以未縮放的原始數值比較兩種單位的距離
answer: B
explanation:
  summary: 距離模型對特徵單位與尺度的敏感性。
  correct: 歐氏距離受各欄數值尺度影響，單位改變可能使重量支配距離。應在訓練資料上決定適當縮放，並在推論時沿用，讓距離的比較基準一致。
  wrong:
    A: 重量與體積的單位不同，直接相加未定義合理意義，且會失去各欄資訊。
    C: 各批自行擬合會改變座標基準，也會讓評估資料參與前處理設定。
    D: 增加鄰居數不會消除單位造成的距離失衡，仍須處理特徵尺度。
