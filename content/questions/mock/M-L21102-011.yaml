stem: 某包裝線以紅色或綠色圓點區分兩種外觀相同的產品。灰階前處理後，兩種圓點的亮度分布幾乎重疊，形狀也相同。若要讓模型利用圓點色別，最適合比較哪項方案？
options:
  A: 對現有灰階影像做直方圖均衡後訓練
  B: 從原始彩色影像保留色彩通道後訓練
  C: 將現有灰階影像複製成三個通道後訓練
  D: 對現有灰階影像加強輪廓銳化後訓練
answer: B
explanation:
  summary: 前處理必須保留任務需要的色彩資訊。
  correct: 兩類的差別是色別，灰階已壓縮掉關鍵色彩訊號。應從原始彩色影像保留色彩表示，而不是只變更已灰階化的資料。
  wrong:
    A: 均衡化可以調整灰階對比，但兩類亮度已近乎重疊，無法據此還原原始紅綠差異。
    C: 複製會增加通道數，卻仍是同一個亮度值，沒有新增色別訊號。
    D: 銳化突出邊緣，適合處理輪廓清晰度；兩類形狀相同，這不是用來保留顏色的方法。
