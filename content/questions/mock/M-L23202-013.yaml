stem: 某工程師用平方誤差訓練單棵決策樹迴歸，葉節點輸出該葉訓練目標的平均，沒有額外線性模型。訓練目標都介於 20 至 80，新輸入卻超過已見特徵範圍。對這個新輸入的預測，下列何者最正確？
options:
  A: 仍依切分進入某個葉節點，輸出介於 20 至 80 的平均值
  B: 會依超出範圍的距離，自動增加葉節點的平均輸出
  C: 會沿最近兩個葉節點的斜率，繼續延伸到 80 以上
  D: 特徵超出訓練範圍，樹無法依既有切分找到葉節點
answer: A
explanation:
  summary: 單棵平均葉節點迴歸樹不做線性外推。
  correct: 新輸入仍可依切分條件走到某個既有葉節點。葉節點輸出是部分訓練目標的平均，因此不會超出訓練目標的最小值與最大值。
  wrong:
    B: 輸出由落入的葉節點決定，不會按距離門檻多遠而自動修正平均值。
    C: 題設的葉節點輸出常數平均值，不會估計葉節點間的斜率來外推。
    D: 數值切分仍可比較大於或小於門檻。超出已見範圍不會讓樹失去到達葉節點的路徑。
