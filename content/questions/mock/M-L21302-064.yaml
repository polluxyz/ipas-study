concepts: [concept-drift, retraining-pipeline]
stem: |
  某設備廠調整製程後，特徵與故障的關係持續改變。管線檢查與標註複核正常，新製程已累積 6 週可靠資料。每次重訓卻混入 3 年舊製程資料，候選版在新製程仍反覆失準。若要改善重訓效果，最適合優先驗證哪項調整？
options:
  A: "維持各期樣本等權，增加舊製程的樣本數後重做候選比較"
  B: "提高新製程資料的訓練比重，另用較晚的新製程資料驗證"
  C: "維持各期樣本等權，擴大樹的深度後以混合樣本隨機驗證"
  D: "提高舊製程資料的訓練比重，另用較早的舊製程資料驗證"
answer: B
explanation:
  summary: "使重訓資料與驗證資料反映持續的新製程。"
  correct: "已確認新製程的條件關係改變，且有可靠的新資料。提高新製程的權重或使用合適的近期視窗，可減少舊關係主導訓練；較晚的新製程資料可檢查未來適用性。"
  wrong:
    A: "更多舊製程樣本會加重舊關係的影響，沒有處理目前部署目標已改變的問題。"
    C: "更深的樹可能增加表達力，但混合隨機驗證仍主要衡量舊新混合表現，不能證明新製程改善。"
    D: "增加舊資料權重並用舊資料驗證，評估方向偏離目前要服務的新製程。"
