stem: 某蒸餾流程讓教師輸出順序為 [貓,狗,鳥]，學生輸出順序為 [狗,貓,鳥]。兩者機率都合法且合計為 1，卻直接按位置計算分布差異。最適合的修正為何？
options:
  A: 先將兩邊機率各自由大到小排序，再計算差異
  B: 先將教師欄位對齊學生類別順序，再計算差異
  C: 先對兩邊分數採相同溫度，再保留原順序計算差異
  D: 先將學生分數轉成獨熱向量，再保留原順序計算差異
answer: B
explanation:
  summary: 蒸餾的分布對齊必須保留相同的類別語意。
  correct: 分布的每個座標必須代表相同類別。先以 [狗,貓,鳥] 重排教師欄位，才能正確傳遞各類別的機率。
  wrong:
    A: 排序會失去類別身分；不同類別但信心相近也可能被視為匹配。
    C: 溫度改變分布尖銳程度，但不會把貓與狗的欄位交換。
    D: 獨熱化會刪掉軟機率資訊，且仍未修正欄位語意錯位。
