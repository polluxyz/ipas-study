stem: 某企業核可 8 週的 AI 文件分流試辦，範圍限繁體中文電子文件。第 3 週業務要求增加手寫掃描件與 2 種外語，仍要求沿用原驗收日；團隊尚未取得新增資料。專案負責人最適合如何處理？
options:
  A: 將新增內容列入本期，沿用原資料與門檻確認是否達標
  B: 先擴大模型功能，等接近驗收日再依實際結果修訂範圍
  C: 重估新增資料、測試與資源影響，經審查後更新範圍時程
  D: 把新增資料整理交給供應商，沿用原資源表與驗收安排
answer: C
explanation:
  summary: 需求擴大時，須重新確認資料、資源及驗收範圍。
  correct: 手寫與外語改變了資料與能力需求，原規劃不再足以代表新範圍。負責人應列出差異與影響，讓相關單位決定分期或補足資源，再更新可驗收的範圍及時程。
  wrong:
    A: 原資料不能代表新語言及手寫情境，沿用原驗收方式無法證明新增能力。
    B: 先投入再延後釐清範圍，會讓開發、資源與驗收期望不一致，增加返工風險。
    D: 委外不會讓資料準備與測試工作消失；仍需確認供應商能力、資源及交付安排。
