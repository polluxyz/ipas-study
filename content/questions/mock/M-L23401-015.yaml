stem: 某影像研究團隊要提供胸部影像給外部合作方。流程已移除檔頭的病人欄位，但抽查發現姓名曾直接印進部分影像像素。團隊希望保留肺部病灶細節。對這類遺漏，最適合補哪項措施？
options:
  A: 偵測並遮蔽像素中的識別文字，再驗證病灶細節
  B: 重新編碼全部影像的檔名，再驗證檔名是否唯一
  C: 加密影像傳輸的通道，再驗證傳輸憑證是否有效
  D: 將每張影像縮到低解析度，再驗證模型載入格式
answer: A
explanation:
  summary: 移除檔頭識別欄位，不能消除已存在影像像素中的姓名。
  correct: 姓名已成為畫面內容，需要找出識別文字的位置，直接改寫交付檔該處的儲存像素，不能只疊上可移除的圖層。之後再檢查是否漏字或傷及診斷區域。這比全面降低解析度更符合保留病灶細節的要求。去識別檢查需涵蓋檔頭、檔名及畫面內容。
  wrong:
    B: 檔名重編可以減少檔名洩漏，卻不會修改像素中已印出的姓名。
    C: 通道加密保護傳輸途中資料，合作方接收解密影像後仍可讀到像素中的姓名。
    D: 全面降解析度可能破壞病灶細節，且只驗證載入格式無法證明姓名已不可辨識。
