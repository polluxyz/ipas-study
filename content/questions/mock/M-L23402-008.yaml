stem: 某培訓計畫有甲群 300 人、乙群 100 人，總共必須錄取 120 人。本次只檢查兩群正向決策率的統計均等，不加入其他資格或效能條件。下列錄取配額何者最符合這項要求？
options:
  A: 甲 60 人、乙 60 人
  B: 甲 90 人、乙 30 人
  C: 甲 100 人、乙 20 人
  D: 甲 80 人、乙 40 人
answer: B
explanation:
  summary: 群大小不同時，相同錄取人數並不代表相同錄取率。
  correct: 總錄取率為 120/400=0.3。兩群要有相同正向決策率，配額就應為甲 300×0.3=90、乙 100×0.3=30。這只通過題目指定的比例要求，不能因此推得其他公平指標也通過。
  wrong:
    A: 各錄取 60 人時，兩群通過率分別為 20% 與 60%，人數相等不等於比例相等。
    C: 此配額的兩群通過率約為 33.3% 與 20%，並不相同。
    D: 此配額的兩群通過率約為 26.7% 與 40%，並不相同。
