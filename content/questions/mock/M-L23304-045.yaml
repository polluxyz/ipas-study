stem: 某工廠以「誤報率固定為 2% 時的瑕疵召回率」作為唯一選模指標。驗證資料足以穩定估計該指標。最近 6 輪的驗證交叉熵持續下降，但該指標持續下降。團隊要以早停減少對選模目標無益的訓練，最適合監控哪項數值？
options:
  A: 驗證集在誤報率 2% 下的瑕疵召回率
  B: 驗證集以兩類機率計算的平均交叉熵
  C: 訓練集在誤報率 2% 下的瑕疵召回率
  D: 驗證集按正常與瑕疵比例計算的準確率
answer: A
explanation:
  summary: 早停指標應對應實際選模目標。
  correct: 本例只以指定誤報率下的瑕疵召回率選模，因此應在驗證集監控該指標，並將較高值視為改善。交叉熵繼續下降，不代表這個操作條件下的召回率繼續提升。
  wrong:
    B: 交叉熵衡量機率預測的損失，與特定誤報率下的召回率不是同一個目標。本例兩者已呈現不同趨勢。
    C: 訓練資料參與模型更新，其召回率不能取代驗證資料對未見資料表現的估計。
    D: 準確率同時受到類別比例與誤判種類影響，不能取代指定誤報率下的瑕疵召回率。
