stem: 某工程師以普通梯度下降訓練線性模型。兩個獨立輸入特徵的標準差相差 1,000 倍。未加正則化的二次損失在兩個參數方向呈狹長等高線，較大步長會橫向來回跳，小步長則沿長軸前進很慢。若要改善這種尺度造成的收斂問題，下列做法何者最適合？
options:
  A: 只將目標值乘同一個常數，再重新選擇全域學習率
  B: 先改用較小批次估計梯度，再使用原本的特徵尺度
  C: 先以訓練資料的各欄標準差縮放特徵，再重新訓練
  D: 先以驗證損失設定提早停止，再使用原本的特徵尺度
answer: C
explanation:
  summary: 調整特徵尺度可改善損失在不同參數方向的曲率差異。
  correct: 此處的主要問題是輸入尺度差異造成參數方向的曲率差距。各欄按標準差縮放，可讓梯度下降使用單一學習率時較容易兼顧各方向。縮放統計量須由訓練資料估計。
  wrong:
    A: 目標整體縮放不會消除設計矩陣各欄的相對尺度差距，因此未處理狹長等高線的主要原因。
    B: 較小批次可降低每次更新的計算成本，但不會消除輸入尺度造成的曲率差距，還會增加梯度估計的波動。
    D: 提早停止依驗證表現控制訓練長度，主要用來限制過擬合。它不會修正各方向曲率的差距，本題也沒有提供泛化惡化的證據。
