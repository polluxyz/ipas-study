stem: 某維修中心想預測零件是否真的故障。歷史資料卻以「是否獲准免費換貨」當故障標籤；抽查確認，部分正常零件因客訴安撫而換貨，部分故障零件則因保固到期未換貨。若要讓模型符合預測目標，資料準備最適合先做哪項調整？
options:
  A: 提高未換貨案件的樣本權重
  B: 按免費換貨比例重新抽取訓練樣本
  C: 以檢測證據重新建立零件故障標籤
  D: 增加客訴次數及保固狀態作為輸入特徵
answer: C
explanation:
  summary: 業務處理結果不一定等於模型要學習的真實狀態。
  correct: 換貨決策同時受安撫政策與保固影響，與實際故障並不等同。必須依檢測證據建立符合預測目標的標籤。
  wrong:
    A: 加權會改變不同案件對訓練的影響，卻不能把換貨標籤轉成真實故障標籤。
    B: 重新抽樣只能改變換貨與未換貨的比例，不能消除兩者與故障狀態的錯配。
    D: 新增這些特徵可能更容易預測換貨決策，但沒有修正學習目標與真實故障的差異。
