stem: 某團隊取得來源測試準確率 98% 的預訓練模型，準備用於新相機拍攝的產品影像。新相機的照明與產品種類不同，目前只有未標註影像，尚未確認目標任務品質。若要判斷模型是否適合作為第一版，下列工作何者最應優先完成？
options:
  A: 量測新影像的推論速度，以可穩定執行作為品質依據
  B: 標註具代表性的新影像，依目標任務評估模型與基準
  C: 統計模型對新影像的平均最高機率，據此估計準確率
  D: 以模型預測建立新影像標籤，再與同一模型輸出比對
answer: B
explanation:
  summary: 來源任務的分數不能直接當作新場域的品質證據。
  correct: 新相機與產品改變了資料條件，需要以可信標註評估目標任務。和基準共同比較後，才能判斷預訓練表示是否值得採用或需要調整。
  wrong:
    A: 速度反映部署成本，不能確認分類結果是否正確；穩定執行不等於目標任務達標。
    C: 模型信心可能在不同資料上失準，平均最高機率沒有提供獨立的正確標籤。
    D: 以同一模型產生標籤再自我比對，只能得到與自身一致的結果，不能揭露真實錯誤。
