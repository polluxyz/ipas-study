stem: 某平台的異常案件只占 0.5%，主管尚未決定警報門檻。團隊希望多找出異常，主管也特別關心警報中有多少是真異常，以免複核人員處理大量無效警報。若先用同一驗證集比較模型的整體表現，最適合優先採用哪項指標？
options:
  A: 以同一驗證集的 PR-AUC 為主要指標
  B: 以同一驗證集的 ROC-AUC 為主要指標
  C: 以同一驗證集的對數損失為主要指標
  D: 以同一驗證集的 Brier 分數為主要指標
answer: A
explanation:
  summary: 選擇能對應稀少正類與跨門檻取捨的指標。
  correct: PR-AUC 彙整不同門檻下精確率與召回率的取捨，能同時觀察警報可信度與異常捕捉程度。本例異常只占 0.5%，大量正常案件使低假陽率仍可能對應不少誤報。ROC-AUC 也不依賴單一門檻，可用於比較排序能力，但未直接呈現警報中真異常的比例。因此本例優先用 PR-AUC 更貼近業務需求，選定門檻後仍需檢查該操作點。
  wrong:
    B: ROC-AUC 反映真陽率與假陽率的整體取捨，仍有參考價值。但本例特別關心稀少異常下的警報可信度，PR-AUC 更直接對應這項需求。
    C: 對數損失評估預測機率與真實標籤的差異，可檢查機率品質，但未直接呈現警報可信度與異常捕捉程度的取捨。
    D: Brier 分數是預測機率與真實標籤之間的平均平方誤差，適合評估機率品質，不能直接取代本例所需的精確率與召回率比較。
