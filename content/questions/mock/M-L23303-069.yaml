stem: 某平台的異常案件只占 0.5%，主管尚未決定警報門檻，希望先比較模型在「抓到多少異常」與「警報中有多少真異常」之間的整體取捨。PR 曲線以召回率與精確率描繪多個門檻，PR-AUC 是該曲線下面積。哪項指標最適合優先使用？
options:
  A: 在同一驗證集上的 PR-AUC
  B: 在同一驗證集上且門檻為 0.5 的準確率
  C: 在同一驗證集上且門檻為 0.5 的精確率
  D: 在同一驗證集上且門檻為 0.5 的召回率
answer: A
explanation:
  summary: 選擇能對應稀少正類與跨門檻取捨的指標。
  correct: PR-AUC 彙整不同門檻下精確率與召回率的取捨，符合本例尚未選定門檻的比較目的。選定部署門檻後，仍要檢查該操作點是否符合需求。
  wrong:
    B: 固定門檻的準確率受大量正常案件影響，不能回答多門檻下的異常捕捉與警報可信度取捨。
    C: 固定門檻的精確率只描述一個操作點的警報可信度，沒有涵蓋召回率與其他門檻。
    D: 固定門檻的召回率只描述一個操作點抓到的異常比例，沒有衡量警報中誤報的負擔。
