stem: 某權重 w 受硬性限制 0≤w≤2，團隊要最小化 L(w)=(w-5)²。求解器回傳 w=2，此處導數為 -6。工程師因導數不為 0 而懷疑解錯。下列判斷何者最正確？
options:
  A: w=2 可通過受限最小值驗收，無須原函數導數為零
  B: w=2 尚未通過受限最小值驗收，須另找零導數可行點
  C: w=2 應判為受限最大值，須改選左端點作為最小值
  D: w=2 的導數顯示目標非凸，須改採非凸問題的求解器
answer: A
explanation:
  summary: 受限問題的最適解可以在邊界，原函數的導數不必為零。
  correct: L 在區間 [0,2] 上隨 w 增加而下降，因此最小值出現在右端點 2。負梯度指向更大的 w，但這些下降方向不符合限制；零導數並非此邊界解的必要條件。
  wrong:
    B: 導數在 [0,2] 上都小於 0，沒有零導數的可行點。受限最小值仍存在於邊界，不能套用無約束的零導數驗收條件。
    C: 把 w 從 2 降向 0 會增加 (w-5)²。負導數表示增加 w 可下降，並不表示右端點是局部最大值。
    D: 凸性看函數的整體曲率。此二次函數的二階導數為 2，與特定點的一階導數是否為 0 無關。
