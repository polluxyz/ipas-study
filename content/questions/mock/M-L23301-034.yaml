stem: 某客服模型要使用服務據點的當地小時。2 個來源描述同一事件，一個記為 08:00、偏移 +08:00，另一個記為 00:00、偏移 +00:00。據點採固定 +08:00，沒有日光節約時間。哪項處理最適合？
options:
  A: 移除來源的時區偏移，直接從 2 個時間字串擷取小時
  B: 保留來源的時區偏移，直接從各來源的原時鐘擷取小時
  C: 依來源偏移解析為同一時刻，轉成據點時間後擷取小時
  D: 依來源偏移解析為同一時刻，轉成 +00:00 後擷取小時
answer: C
explanation:
  summary: 時間點對齊與當地時間特徵需要採用正確時區。
  correct: 先依偏移識別相同時刻，再轉到據點使用的 +08:00，2 個來源都會得到 8 時，符合要描述當地服務時段的需求。
  wrong:
    A: 移除偏移會把相同事件解讀成不同時間，分別得到 8 與 0。
    B: 直接取各來源的小時會讓相同事件得到不同特徵，未對齊據點時區。
    D: 轉成 +00:00 可統一時刻，但會取得 0 時，與據點的當地 8 時不同。
