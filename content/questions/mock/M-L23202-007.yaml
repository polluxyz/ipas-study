stem: |
  某物流團隊用單棵決策樹預測裝卸時間。每個葉節點輸出該節點訓練樣本的平均時間，訓練目標介於 10 至 40 分鐘。新倉庫需處理遠大於訓練範圍的貨量，現場時間約為 70 分鐘。主管認為只要加深這棵樹就能沿貨量趨勢向上推估。下列判斷何者最正確？
options:
  A: 加深仍受葉節點平均值限制，應補充新範圍資料或評估具外推能力的模型
  B: 加深可延續最後一段貨量斜率，應以更多葉節點估計新範圍的裝卸時間
  C: 提高葉節點最少樣本數即可放大預測範圍，應優先合併高貨量節點
  D: 將貨量改為標準化數值即可解除目標範圍限制，應優先固定縮放流程
answer: A
explanation:
  summary: 判斷以葉節點平均值預測的迴歸樹是否能外推。
  correct: 各葉節點的平均值都介於訓練目標的最小與最大值之間。增加深度可細分輸入空間，但不會自動延伸線性趨勢。新範圍資料或有合理外推假設的模型需要另行驗證。
  wrong:
    B: 這種樹輸出分段常數，葉節點沒有可延伸的貨量斜率。
    C: 合併節點會改變平均值，但平均值仍落在原有目標範圍內。
    D: 縮放改變的是輸入尺度，不會改變葉節點平均值的目標範圍。
