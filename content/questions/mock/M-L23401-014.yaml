stem: 某公司內規要求：專案到期後停止使用可識別的客服對話。原始資料庫已清除，但團隊在特徵快取、標註平台與訓練快照仍找到副本。若要降低再次漏清的風險，最適合優先補哪項管理措施？
options:
  A: 提高原始資料庫備份頻率，保存更多還原點
  B: 統一所有專案的模型格式，簡化載入程序
  C: 縮減訓練快照的特徵數，降低模型輸入維度
  D: 建立資料流向與副本清冊，連結保存期限及責任人
answer: D
explanation:
  summary: 資料保存範圍必須涵蓋衍生副本與流通路徑。
  correct: 清冊要追蹤資料從來源到快取、標註與快照的流向，記錄保存位置、期限及負責人。到期處置才能涵蓋全部可識別副本，並留下執行與覆核證據。只知道來源資料庫位置，無法完整執行題目的內規。
  wrong:
    A: 更多還原點有助復原服務，但也產生更多需管理的副本，不能取代資料到期處置的追蹤。
    B: 模型格式標準化處理模型載入，不會找出標註平台、快取及快照的個人資料副本。
    C: 少用特徵可能降低部分資料量，但沒有追蹤哪些副本仍含可識別對話，也無法確保到期停止使用。
