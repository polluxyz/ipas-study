stem: |
  某職務配對模型使用實作測驗分數。獨立職務分析顯示，測驗內容與工作所需技能直接相關，但測驗分數也與群體身分有統計關聯。目前尚未比較各群錯誤率。產品要決定是否移除此特徵。最適合採取哪項評估？
options:
  A: 綜合分數與群體的關聯、各群樣本數，評估移除特徵
  B: 綜合職務相關性與全體準確率，評估保留特徵
  C: 綜合職務必要性與分群效能，比較保留及移除的結果
  D: 綜合全體準確率與全體召回率，評估保留特徵
answer: C
explanation:
  summary: 與群體相關的特徵，需連同用途合理性與群體影響一起檢查。
  correct: 測驗具有職務相關性，不能只因群體關聯就斷言應刪除；同時，職務相關也不能替代公平性評估。應比較保留或移除後的任務效能與各群錯誤，檢查是否存在可降低不利影響的替代方式。
  wrong:
    A: 群體關聯與樣本數可提示稽核重點，但未比較使用特徵後的各群錯誤。僅憑關聯評估移除，也可能捨棄與任務相關的資訊。
    B: 職務相關與全體準確率支持任務效能，但仍未回答各群是否承受不同錯誤，缺少群體影響的證據。
    D: 兩項全體指標都會合併群體差異。即使全體表現良好，也不能據此判斷各群是否承受不同錯誤。
