stem: 某聯邦學習試驗有 3 個機構。各機構從相同全域參數出發，完成本地訓練後回傳單一參數與本輪樣本數。指定按樣本數做加權平均，不傳原始樣本。工程師應以哪個數值作為新的全域參數？
code: |
  clients = [(100, 1.0), (300, 3.0), (600, 6.0)]
  new_parameter = sum(n * w for n, w in clients) / sum(n for n, w in clients)
  print(round(new_parameter, 1))
code_lang: python
options:
  A: "2.0"
  B: "3.0"
  C: "3.3"
  D: "4.6"
answer: D
explanation:
  summary: 聯邦聚合的權重需依題定的樣本數規則計算。
  correct: 加權總和為 100×1+300×3+600×6=4600，除以總樣本數 1000，得到 4.6。機構數相同不代表各機構對樣本目標的權重相同。
  wrong:
    A: 2.0 是以樣本數的倒數加權的結果，會讓小機構權重較高，與指定按樣本數加權相反。
    B: 3.0 是這組本地參數的中位數，屬不同聚合規則，未使用題定的樣本數權重。
    C: 3.3 約為 3 個機構參數的等權平均，忽略各機構樣本數不同。
