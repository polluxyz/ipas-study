stem: 某團隊以 L(a,b)=(a+b-4)² 訓練 2 個參數，兩者可取任意實數。不同初始值的求解器分別回傳 (1,3) 與 (2,2)，損失都為 0。下列判斷何者最正確？
options:
  A: 函數存在多個局部谷底，因此應分類為非凸問題
  B: 只有 (2,2) 是最適解，因為兩個參數的大小較均衡
  C: 只有其中一組是最適解，另一組需要加入更多資料確認
  D: 兩組都是全域最適解，此凸函數沒有唯一最適參數
answer: D
explanation:
  summary: 凸函數可以有多個全域最適解，唯一性需要額外條件。
  correct: 平方值不小於 0，而 a+b=4 的每一組參數都使損失為 0。此目標是仿射函數的平方，為凸函數，但沿 a+b=4 的方向有平坦解集合，所以參數解不唯一。
  wrong:
    A: 多個最適參數不等於多個分隔的局部谷底。本例兩解之間的線段也都達到相同的最小值，符合凸性。
    B: 題目沒有平衡參數或範數懲罰。兩個參數大小均衡，並不會使既有目標低於 0。
    C: 對已給定的目標，兩組都直接達到非負平方的下界。增加資料會形成另一個目標，並非判斷本題最適性的必要步驟。
