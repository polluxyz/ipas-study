stem: 某企業每週重訓同一個分類模型。試驗顯示，早停可在驗證品質達標時，將訓練由 80 輪縮短為 35 輪。兩版模型的層數、參數數量、數值精度與推論流程相同。主管想把這項成果納入成本報告，哪個判斷最正確？
options:
  A: 可降低本次訓練耗時，單筆推論效益另行量測
  B: 可降低單筆運算量，節省幅度按訓練輪數估計
  C: 可縮小部署權重檔，節省幅度按訓練輪數估計
  D: 可減少推論所需層數，單筆延遲預期同步下降
answer: A
explanation:
  summary: 早停節省訓練資源，不等於縮小推論模型。
  correct: 早停減少的是參數更新的輪數。本例沒有改變部署模型的結構或精度，因此可以報告訓練時間的節省，但單筆推論是否改善須另外量測。
  wrong:
    B: 推論只執行部署模型的一次前向計算，不會重跑歷次訓練。少訓練幾輪不能按比例推算單筆運算量。
    C: 權重檔容量主要取決於參數數量、數值格式與儲存方式；訓練輪數減少不代表需要儲存的權重變少。
    D: 早停決定何時結束訓練，不會移除模型層。本例兩版層數相同，無法據此推論延遲下降。
