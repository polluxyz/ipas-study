stem: |
  某培訓篩選器的甲乙兩群各有 100 人，實際合格者分別為 80、20 人。兩群都選中 80% 的合格者，且沒有選中不合格者。本次以這批完整資料檢查指標，不考慮抽樣誤差。若維持兩群相同的 80% 合格者選中率及零誤選，對統計均等最正確的判斷為何？
options:
  A: 已達統計均等，因兩群合格者選中率相同
  B: 已達統計均等，因兩群不合格者誤選率相同
  C: 未達統計均等，兩群整體選中率為 64% 與 16%
  D: 未達統計均等，兩群整體選中率為 80% 與 20%
answer: C
explanation:
  summary: 合格比例不同時，相同合格者選中率與零誤選仍會產生不同整體選中率。
  correct: 甲選中 80×0.8=64 人，乙選中 20×0.8=16 人，整體選中率為 64% 與 16%。兩群符合機會平等，但統計均等要求整體選中率相同，故未成立。維持題幹兩項條件時，不能再把兩群選中率調成一致。
  wrong:
    A: 合格者選中率相同對應機會平等，並未把各群全部申請者放進分母，不能據此宣告統計均等。
    B: 不合格者誤選率同為 0，不代表總選中率相同。甲群實際合格者較多，即使誤選相同，選中總數仍較多。
    D: 80% 與 20% 是兩群實際合格比例，未乘上合格者被選中的 80%，因此不是最終整體選中率。
