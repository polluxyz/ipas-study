concepts:
  - equal-opportunity
  - statistical-parity
stem: |
  某培訓篩選器的甲、乙兩群各有 100 人。甲群實際合格 80 人，乙群實際合格 20 人。兩群的合格者選中率都須固定為 80%。不合格者誤選率指各群不合格者中被選中的比例。本次只依這 200 人計算，不考慮抽樣誤差。團隊要達成統計均等，使兩群整體選中率相同。若總誤選人數須最少，兩群的不合格者誤選率各應為多少？
options:
  A: 甲群誤選率為 0%，乙群誤選率為 80%
  B: 甲群誤選率為 60%，乙群誤選率為 0%
  C: 甲群誤選率為 0%，乙群誤選率為 60%
  D: 甲群誤選率為 60%，乙群誤選率為 60%
answer: C
explanation:
  summary: 固定合格者選中率後，推算達成統計均等所需的最少誤選人數。
  correct: |
    答案 C。本例依題定條件計算，指引未直接教授此最少誤選的推導。
    甲群選中合格者 80×0.8=64 人，乙群為 20×0.8=16 人。
    兩群合格者選中率相同，符合機會平等。固定此條件後，誤選只能增加選中總數。
    甲群至少選中 64 人，所以共同的整體選中率至少是 64%。
    若共同選中人數為 n，兩群總誤選人數為 (n−64)+(n−16)=2n−80。
    因此取最小可行值 n=64 時，總誤選人數最少，為 48 人。
    甲群不需誤選，誤選率為 0/(100−80)=0%。
    乙群須誤選 64−16=48 人，誤選率為 48/(100−20)=60%。
    兩群最終各選中 64 人，整體選中率皆為 64%。
    基礎比率（各群實際合格比例）分別為 80% 與 20%。
    本例固定合格者選中率為 80%，同時追求機會平等與統計均等，須付出誤選代價。
    實務上要依用途與錯誤造成的傷害取捨，不能只因指標相等就認定代價可接受。
  wrong:
    A: 把合格者選中率的 80% 套用到不合格者，並不能讓兩群相等。乙群會誤選 80×0.8=64 人，整體選中率為 (16+64)/100=80%，高於甲群的 64%，未達統計均等，誤選人數也比最少的 48 人多。
    B: 把誤選加在甲群會擴大差距。甲群整體選中率為 (64+20×0.6)/100=76%，乙群仍為 16%，未達統計均等。
    D: 兩群誤選率都為 60% 時，甲群整體選中率為 (64+20×0.6)/100=76%，乙群為 (16+80×0.6)/100=64%。誤選率相同仍未達統計均等，總誤選人數也增至 60 人。
