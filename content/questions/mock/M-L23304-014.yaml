stem: 某影像模型量化後，夜間資料的召回率由 0.88 降為 0.62，白天幾乎不變。靜態量化的啟用值範圍僅用白天資料校準；量測發現夜間特徵大量超出該範圍而被截限。最適合優先驗證哪項修正？
options:
  A: 增加白天校準影像的重複次數，沿用只含白天特徵的校準範圍
  B: 將分類門檻改用訓練集最佳值，沿用夜間特徵大量截限的量化器
  C: 以含白天與夜間條件的代表性資料重新校準，再分條件評估
  D: 只提高量化模型的推論批次大小，沿用現有啟用值範圍設定
answer: C
explanation:
  summary: 已定位到量化截限時，校準資料須涵蓋實際輸入條件。
  correct: 題目已確認夜間特徵超出校準範圍。納入代表性的夜間資料，可重新估計合適範圍，再檢查截限與召回率是否改善。若仍無法兼顧兩種條件，才進一步評估其他量化設計。
  wrong:
    A: 重複白天資料不會補入缺少的夜間分布，不能對準已確認的範圍問題。
    B: 門檻調整無法恢復被截限的特徵資訊；訓練集最佳門檻也不是夜間泛化改善的證據。
    D: 推論批次大小主要影響資源利用，沒有重新估計此靜態量化器的範圍。
