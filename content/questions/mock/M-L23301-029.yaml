stem: 某問卷有 4,000 筆數值資料，系統用 -999 表示未填答。工程師直接使用預設只辨認 NaN 的中位數補值器，之後再標準化。若要讓 -999 不參與補值統計，哪項處理最適合？
options:
  A: 先對含 -999 的數值估計縮放參數，再將縮放後數值補齊
  B: 先對含 -999 的數值估計中位數，再以該中位數替換 -999
  C: 先把 -999 截成有效數值的最小值，再估計補值與縮放參數
  D: 先將 -999 標為缺失，再以訓練資料估計補值與縮放參數
answer: D
explanation:
  summary: 數值形式的缺失代碼必須先被辨識。
  correct: -999 是缺失代碼，不是實際量測。先轉為缺失，可讓補值器從有效訓練值估計統計量，後續縮放也不會把代碼當成量測值。
  wrong:
    A: 縮放器會先把 -999 納入平均與尺度估計，後面補值不能撤回這個影響。
    B: 估計中位數時已納入 -999，缺失較多時可能使中位數向代碼偏移。
    C: 截成最小值會把未填答偽裝成真實低值，仍會參與補值與縮放統計。
