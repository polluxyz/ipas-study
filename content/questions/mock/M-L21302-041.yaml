stem: 某模型服務以 2% 錯誤率作為單一切換門檻，超過便切回舊版，低於便立刻重啟新版試行。錯誤率在門檻附近波動，造成每幾分鐘反覆切換。兩版均已通過基本安全驗證，團隊希望保留異常保護並減少反覆切換。最適合怎麼調整？
options:
  A: 設定回復與恢復的不同門檻，搭配持續觀察及重新試行的冷卻條件
  B: 將同一門檻調高到 3%，超過與低於門檻時仍立即切換版本
  C: 縮短每次錯誤率的取樣視窗，維持同一門檻及立即恢復規則
  D: 將新版試行流量改成固定比例，維持同一門檻及立即恢復規則
answer: A
explanation:
  summary: 不同切換門檻與冷卻條件能減少門檻附近的反覆切換。
  correct: 回復後需更明確且持續的恢復證據，並限制重新試行的頻率。採不同門檻及冷卻條件，可在保留異常回復能力的同時，降低小幅波動造成的反覆動作。
  wrong:
    B: 提高門檻改變可接受錯誤程度，卻未消除單一門檻兩側立即切換的結構，波動到新門檻仍會反覆切換。
    C: 更短視窗通常使錯誤率估計更易波動，且仍無恢復緩衝，不能處理本例的反覆切換。
    D: 固定比例可控制試行範圍，但跨過門檻後立即恢復的規則未變，仍可能反覆切換。
