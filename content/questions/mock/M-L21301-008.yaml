stem: 某設備商建立維修需求分類模型。溫度欄有 12% 缺失，查明原因是舊型感測器在保護停機時不回報；數值 0 則可能是真實低溫。團隊要保留停機所帶的資訊，且分類器不接受空值。哪項前處理最適合？
options:
  A: 以 0 填補空值，讓真實低溫與停機紀錄共用同一數值
  B: 刪除溫度空值列，讓分類器只學習有完整量測的設備
  C: 新增缺失指標，並用訓練資料決定溫度欄的填補值
  D: 刪除溫度欄位，改以其他感測器估計整批設備的狀態
answer: C
explanation:
  summary: 補值時保留缺失本身所代表的狀態。
  correct: 本例缺失與保護停機相關，不能只把空值當成一般溫度。缺失指標可保留未回報的狀態，補值則讓不接受空值的分類器能處理該欄；填補規則須由訓練資料建立。
  wrong:
    A: 填成 0 卻沒有缺失指標，會將停機缺失與真實低溫混在一起，不符合保留停機資訊的條件。
    B: 刪列會排除保護停機的案例，使模型失去題目要求保留的狀態資訊。
    D: 刪欄同時移除了溫度與未回報狀態。其他感測器未被證明能代替該停機訊號。
