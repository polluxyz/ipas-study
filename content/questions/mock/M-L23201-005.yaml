stem: 某排程代理可選擇立即接單或先維護設備。維護會讓當下產量下降，但可能減少接下來 20 個時段的停機。團隊以整段排程的總產量為目標。下列學習設計何者最適合？
options:
  A: 將本步產量最高的動作當標籤，以分類正確率選策略
  B: 依設備讀值分群，以群內距離代替整段排程的報酬
  C: 利用狀態與動作的互動，估計包含後續影響的累積報酬
  D: 以每步的即時產量選動作，將後續停機交由下一步評分
answer: C
explanation:
  summary: 序列決策須考慮動作的延遲效應。
  correct: 維護會影響後續設備狀態與產量，因此不能只依本步產量評價。以長期累積報酬學習策略，才與整段排程的總產量目標一致。
  wrong:
    A: 即時產量最大的動作未必有最高的整段總產量。這種標籤把短期指標當成最佳策略。
    B: 設備相似度不等於排程報酬。分群本身未學習動作如何影響後續狀態與產量。
    D: 只用即時產量選動作，會忽略本步維護對後續停機的影響，未衡量完整的決策後果。
