stem: 某裝置每天收到 5,000 筆附真實標籤的樣本，原始資料處理後即刪除，模型只有 10 MB 儲存空間。特徵欄位固定，團隊需要每天利用新樣本延續原模型的學習。下列訓練方式何者最符合條件？
options:
  A: 儲存歷來每筆樣本，預測時再找最接近的鄰居
  B: 固定現有模型參數，只重新計算當天的預測分數
  C: 使用可增量更新的模型，以當天樣本接續更新參數
  D: 每日重新讀取歷來全部樣本，從頭建立完整模型
answer: C
explanation:
  summary: 在無法保留歷史資料時辨認增量學習需求。
  correct: 增量更新保留模型狀態，再用新樣本更新參數，不要求每次重新讀取全部歷史資料。這符合固定欄位、有限儲存及持續學習的條件。
  wrong:
    A: 保存歷來樣本與儲存限制衝突，也不是題目要求的延續參數更新方式。
    B: 重新推論沒有更新參數，無法利用當天的真實標籤繼續學習。
    D: 題目指定原始資料已刪除，因此無法每天重讀完整歷史資料來從頭訓練。
