stem: |
  某設備租借平台要以模型決定是否人工複核。內部驗收要求審查員能依每筆輸入，逐步重現正式模型走過的規則，且每筆最多檢查 4 個條件。候選模型的驗證表現都達標。下列方案何者最符合這項要求？
options:
  A: 採用隨機森林並提供整體重要性排序，讓審查員依前 4 名特徵重現判斷
  B: 採用深度網路並提供局部近似模型，讓審查員以近似規則作為正式規則
  C: 採用最長路徑不超過 4 次判斷的決策樹，保留各筆實際經過的節點
  D: 採用梯度提升樹並提供個案特徵貢獻，讓審查員依前 4 項貢獻重現路徑
answer: C
explanation:
  summary: 依可重現規則路徑的要求選擇可解釋模型。
  correct: 題幹要求重現正式模型的實際規則，並限制每筆檢查條件數。限制最長判斷路徑的單棵決策樹可直接提供節點與分支，符合這兩項條件。
  wrong:
    A: 整體重要性排序不代表單筆預測經過的分支，前 4 名特徵無法重建森林的決策。
    B: 局部近似可能與正式模型不同，不能作為正式模型實際走過的規則。
    D: 特徵貢獻可解釋輸出，但前 4 項貢獻不是多棵樹的完整判斷路徑。
