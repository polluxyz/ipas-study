stem: 某補貨系統接到模型建議後建立採購單。客戶端等待 2 秒便逾時重送，但伺服器第一次其實已建單；同一建議因此產生 2 張採購單。團隊要支援網路逾時後重試，又避免重複業務動作。最適合的介接設計為何？
options:
  A: 每次重試都產生新請求編號，讓伺服器可分別處理各次建單
  B: 將重試間隔延長為 10 秒，讓伺服器在各次重試之間完成建單
  C: 把建單服務增加為多個副本，讓不同副本分別處理原請求與重試
  D: 讓同一補貨動作沿用唯一識別碼，伺服器去重並回傳既有建單結果
answer: D
explanation:
  summary: 跨系統重試要處理副作用的重複執行。
  correct: 同一動作沿用唯一識別碼，可讓伺服器辨識重試。伺服器須將去重檢查與建單納入一致的交易或唯一性控制，再回傳原結果，避免並行重試也重複建單。
  wrong:
    A: 每次換新編號會讓伺服器把重試視為不同動作，無法辨識同一建單要求。
    B: 延長間隔可能減少重疊，但已成功卻遺失回應的請求仍可能被再次執行。
    C: 增加副本可擴充處理容量，卻不會自動協調跨副本的同一建單動作。
