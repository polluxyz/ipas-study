stem: 某授信平台想檢查機會平等。系統保存每人的群體與是否核准，但還款結果只對獲貸者可見，被拒者沒有結果。團隊用獲貸者資料計算各群還款者被核准的比例。對這項稽核最正確的判斷為何？
options:
  A: 可直接比較，獲貸者都有後續結果，已具備完整標籤
  B: 可直接比較，把被拒者當成未還款者後重算即可
  C: 尚不足，需處理被拒者結果缺失與選擇偏差
  D: 尚不足，把兩群核准人數配成相同後重算即可
answer: C
explanation:
  summary: 只看到被核准者的結果，無法直接估計全體合格者的核准率。
  correct: 機會平等要以各群實際有還款能力者為分母，其中也可能包含被拒者。只在獲貸者中估計，樣本已受決策篩選，不能代表全部申請者。需另外設計可識別目標結果的資料收集或評估安排，並揭露假設及限制。
  wrong:
    A: 標籤只對核准者完整，不等於對全部申請者完整；被拒但具還款能力者被排除在分母之外。
    B: 沒有觀察到還款結果不等於不具還款能力，直接標負類會把既有拒絕決策當成真實資格。
    D: 核准人數配對不會補上被拒者的結果，無法修復目標分母缺失與決策篩選。
