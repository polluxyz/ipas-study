stem: 某審查器的甲乙兩群皆有相同真陽率 0.8 與假陽率 0.2，但實際正類比例分別為 0.5 與 0.2。下列程式計算預測正類中的真正類比例。對兩群精確率不同，最正確的解讀為何？
code: |
  tpr, fpr = 0.8, 0.2
  for name, base in [("甲", 0.5), ("乙", 0.2)]:
      tp = base * tpr
      fp = (1 - base) * fpr
      print(name, round(tp / (tp + fp), 3))
code_lang: python
options:
  A: 精確率應視為真負率，使用 1 減假陽率計算
  B: 兩群已達均衡機率，增加樣本可使精確率趨同
  C: 基率不同可使精確率不同，與兩率均等並不矛盾
  D: 精確率應取兩率的平均，兩群都應等於 0.5
answer: C
explanation:
  summary: 相同的條件錯誤率，不保證相同的預測正類可信度。
  correct: 甲的精確率為 0.4/(0.4+0.1)=0.8，乙為 0.16/(0.16+0.16)=0.5。真陽率與假陽率的條件分母分別是真正類與真負類；精確率以預測正類作分母，還受群體基率影響。這組數值可同時滿足均衡機率與不同精確率。
  wrong:
    A: 真負率是在實際負類中正確判負的比例，精確率則是在預測正類中實際為正的比例，兩者的條件分母不同。
    B: 本例以給定基率與兩率算出的理論精確率就不同；增加樣本可降低估計波動，但不會消除這個結構差異。
    D: 精確率不是兩率的算術平均，須把基率帶入真陽性與假陽性的比例再計算。
