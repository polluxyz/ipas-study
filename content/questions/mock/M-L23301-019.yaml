stem: 某團隊用 6000 句客服回饋訓練情感分類器。增強程式會隨機刪除功能詞，並沿用既有標籤。抽查發現「並不滿意」中的「不」常被刪除，句子變成「並滿意」。最適合如何調整？
options:
  A: 提高刪詞比例，讓模型學會忽略句子長短的差異
  B: 增加每句的複製次數，讓多數標籤抵銷刪詞誤差
  C: 保護否定詞等語意關鍵詞，檢查增強後標籤是否成立
  D: 把刪詞後句子補到相同長度，再沿用既有情感標籤
answer: C
explanation:
  summary: 文字增強要檢查刪詞是否改變情感標籤。
  correct: 否定詞會改變情感方向。刪掉「不」後再沿用負向標籤，會造成文本與標籤不一致。應限制增強操作，保護影響標籤的詞，並抽查增強結果；長度一致不能代表語意一致。
  wrong:
    A: 提高刪詞比例會更常移除決定情感的詞，沒有解決標籤錯置。
    B: 複製會重複相同錯置訊號，樣本數增加不會自動校正情感方向。
    D: 補長度只改變輸入形狀，無法恢復已被刪除的否定語意。
