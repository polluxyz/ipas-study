stem: 某交易分類資料有 2% 異常案件。團隊發現模型偏向正常類，且正常案件包含多種重要行為模式，合成異常交易也難以確保業務合理性。若希望保留資料內容並加強異常類對訓練的影響，最適合先比較哪項方案？
options:
  A: 在損失函數中提高異常類的權重
  B: 增加每次更新所使用的批次大小
  C: 對正常與異常樣本採相同倍數的複製
  D: 增加分類模型的層數與每層神經元數
answer: A
explanation:
  summary: 類別權重能調整學習重點，無須增刪或合成樣本。
  correct: 異常類權重提高後，其錯誤對訓練目標的影響增加。同時保留正常類的行為模式，且不需要合成難以確認有效性的交易。
  wrong:
    B: 較大批次能降低梯度的隨機波動，但不會改變異常類在損失中的相對影響。
    C: 兩類以相同比例複製，類別比例與相對貢獻仍相近，不能針對異常類補強。
    D: 增加容量可能提升表達能力，但不會直接修正類別不平衡造成的學習偏重。
