stem: |
  某平台以循環神經網路逐筆處理顧客的操作序列。同一顧客的序列會分成數個片段，片段之間需要保留記憶；不同顧客的序列則彼此獨立。測試發現乙顧客的預測受先前甲顧客影響，因服務共用一份持續累積的狀態。最適合如何調整？
options:
  A: "每個時間步清空狀態，同一顧客後續片段亦重新開始"
  B: "每處理固定 100 個片段清空狀態，其他片段持續累積"
  C: "將上一位顧客的狀態乘以 0.5，再交給下一位顧客使用"
  D: "依顧客保存狀態，同一顧客續接，新顧客使用初始狀態"
answer: D
explanation:
  summary: "依獨立序列邊界管理循環網路狀態。"
  correct: "循環狀態會把先前輸入帶入後續預測。按顧客隔離狀態，可保留同一顧客跨片段的脈絡，又不把另一位顧客的操作記憶當成當前顧客資訊。"
  wrong:
    A: "每個時間步都清空會消除同一顧客所需的序列依賴，不符合跨片段保留記憶的需求。"
    B: "固定片段數不一定對應顧客邊界，仍可能混入其他顧客狀態，或切斷同一顧客的記憶。"
    C: "縮小狀態只減弱前一位顧客的影響，沒有建立獨立序列的隔離，也可能影響狀態語意。"
