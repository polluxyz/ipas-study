stem: 某工程師以普通梯度下降訓練可微分模型，學習率降到 10⁻¹² 後，連續 10 步的損失變化都低於 10⁻⁸。目前梯度範數仍為 20，目標函數與資料都沒變。若要判斷是否已接近無約束的駐點，下列處置何者最適合？
options:
  A: 沿用損失差門檻，將目前位置記為已到達駐點
  B: 改用驗證集提早停止，將驗證最佳點視為已到達駐點
  C: 將停止步數延長 10 倍，按執行步數認定已到達駐點
  D: 檢查梯度範數與步長，重設可產生有效更新的學習率
answer: D
explanation:
  summary: 極小步長能造成損失停滯，不能代替小梯度的證據。
  correct: 普通梯度下降的更新量同時受學習率及梯度影響。學習率極小時，即使梯度仍大，損失差也可能很小。範數 20 不支持已接近零梯度的駐點，須檢查停止判準及步長。
  wrong:
    A: 損失差小可能只是更新量被步長壓低。此處已有大梯度的直接證據，不能認定到達駐點。
    B: 驗證集提早停止用來挑選泛化表現較佳的參數。驗證最佳點不等於訓練目標的零梯度位置，不能據此認定已到達駐點。
    C: 步數增加只延長計算。若每步更新仍極小，執行更多步不能作為已到駐點的證明。
