stem: |
  某平台抽查 900 則評論，其中 180 則同時包含作者與被引述者的看法。例如：「同事說：『客服很不耐煩，處理也很差。』我不同意，客服回覆很有耐心，處理也有效率。」營運團隊要分別追蹤作者本人與被引述者對客服的態度。就這則例子，最適合採用哪項標註方式？
options:
  A: 依引號切段，把引述段的負面評價同時記給同事與作者
  B: 依引號切段，引述段記給同事，「我不同意」當負面詞與後句平均記給作者
  C: 依引號切段，引述段記給同事，整則評論的平均情感記給作者
  D: 依引號切段，引述段記給同事，引號外的評價情感記給作者
answer: D
explanation:
  summary: 引述別人的評價，不代表作者認同該評價。
  correct: 本例同事對客服是負面，作者則明確不同意並給出正面評價。應保留兩邊的文字，利用引用範圍與發言線索分別標註。指引說明情感判斷及語境理解，未細列發言來源標註流程；本例依業務須追蹤兩位發言者的需求，將每段評價對應到表達態度的人。
  wrong:
    A: 引述別人的評價不代表作者認同。本例作者明確不同意，把引述段的負面評價記給作者，會得到相反的結論。
    B: 「我不同意」否定的是同事的說法，不是對客服的負面評價。把這句當負面詞計入平均，會壓低作者對客服的正面態度。
    C: 整則平均會混入同事的負面評價，使作者的正面態度被抵銷，無法反映作者本人的立場。
