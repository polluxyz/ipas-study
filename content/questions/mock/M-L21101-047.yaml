type: 情境
codes: [L21101]
concepts: [sentiment-analysis]
stem: |
  某客服中心要分析客戶本次回信的滿意度。回信前段是「問題已處理好，這次回覆很有效率」，後段自動引用先前的長篇抱怨，且有明確的引用標記。模型常把整封回信判為負面。若目標只評估客戶本次表達的態度，最適合如何調整輸入？
options:
  A: 把整封回信切成等長段落，再平均各段情感分數
  B: 對整封回信的負面詞降權，再計算本次情感分數
  C: 取整封回信篇幅最長段落，再判定該段情感標籤
  D: 依引用標記擷取本次新寫內容，再進行情感判定
answer: D
explanation:
  summary: 情感分析的文字範圍應對應要評估的發言時間。
  correct: 本次新增文字與被引用的舊抱怨代表不同時間的態度。引用標記提供可辨認的邊界，應據此選取本次內容，避免舊內容改變本次滿意度的判定。
  wrong:
    A: 等長分段和平均仍會把舊抱怨納入本次評估，且長篇引用會占較多段落。
    B: 全文負面詞降權可能同時壓低真正的新抱怨，並未辨認哪段是本次發言。
    C: 篇幅最長不代表發言最新。本例的長篇內容是舊抱怨，與評估目標不符。
