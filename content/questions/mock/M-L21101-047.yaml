concepts: [sentiment-analysis]
stem: |
  某平台抽查 900 則評論，其中 180 則同時包含作者與被引述者的看法。例如：「同事說：『客服很不耐煩，處理也很差。』我不同意，客服回覆很有耐心，處理也有效率。」營運團隊要分別追蹤作者本人與被引述者對客服的態度。最適合採用哪項標註方式？
options:
  A: 先計算整則評論的平均情感，再分別記入兩位發言者
  B: 先計算整則評論的正負句數，再以多數決標記兩位發言者
  C: 先統計整則評論的褒貶詞數，再依詞數標記兩位發言者
  D: 先辨認每段文字的發言來源，再分別標註兩人的態度
answer: D
explanation:
  summary: 引述別人的評價，不代表作者認同該評價。
  correct: 本例同事對客服是負面，作者則明確不同意並給出正面評價。應保留兩邊的文字，利用引用範圍與發言線索分別標註。指引說明情感判斷及語境理解，未細列發言來源標註流程；本例依業務須追蹤兩位發言者的需求，將每段評價對應到表達態度的人。
  wrong:
    A: 全文平均可能讓相反態度抵銷。將平均結果分別記給兩人，仍無法呈現同事不滿與作者滿意的差別。
    B: 句數多的一方不代表另一方的立場。全文多數決把兩人的表達合併，不能分別追蹤各自態度。
    C: 全文褒貶詞數沒有記錄詞語出自誰。即使詞頻計算正確，也無法據此分別決定作者與同事的態度。
