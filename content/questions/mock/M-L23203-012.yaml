stem: |
  某維修文件系統採用編碼器與解碼器產生摘要。程式整理後，來源文件仍經過編碼器，但解碼器只接收已產生的摘要文字，沒有其他來源連線。輸出仍流暢，卻很少反映文件中的不同故障內容。若要恢復依來源生成的能力，下列修正何者最適合？
options:
  A: 加深只讀取摘要前文的自注意力層，強化摘要文字內部的長距離關係
  B: 恢復解碼器對編碼器輸出的注意力連線，讓每步生成能讀取來源內容
  C: 延長摘要輸出的最大長度，讓解碼器累積更多已生成文字作為依據
  D: 增加摘要前文的注意力頭數，讓不同注意力頭分別記錄不同來源文件
answer: B
explanation:
  summary: 區分目標前文的自注意力與讀取來源的跨注意力。
  correct: 在這個架構中，解碼器需要透過對編碼器輸出的注意力取得來源內容。只讀摘要前文可學到流暢文字，卻缺少這份來源文件的表示。恢復來源連線才直接修正資訊缺口。
  wrong:
    A: 只處理摘要前文的層再深，也沒有新增讀取來源文件的通路。
    C: 增加輸出長度會增加生成文字，不能補上未輸入的來源資訊。
    D: 注意力頭只能處理其收到的表示，增加頭數不會自動讀到編碼器輸出。
