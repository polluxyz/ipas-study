stem: 某團隊在相同資料分布重抽 30 份訓練集，各自建立模型。對固定測試輸入，真實條件平均為 20。甲模型的預測集中在 10 附近；乙模型的預測分散於 5 至 35，平均接近 20。就此輸入的偏差與變異，下列判斷何者最正確？
options:
  A: 甲的偏差較低，乙的變異較低
  B: 甲的偏差較低，乙的變異較高
  C: 甲的偏差較高，乙的變異較低
  D: 甲的偏差較高，乙的變異較高
answer: D
explanation:
  summary: 偏差看平均預測的位置，變異看重訓預測的分散。
  correct: 甲的平均預測偏離真實條件平均，偏差較高。乙的平均較接近真值，但重抽訓練集後預測大幅變動，變異較高。
  wrong:
    A: 甲穩定不代表偏差小；乙預測分散也不代表變異小。兩項判斷都相反。
    B: 乙的變異較高沒錯，但甲集中在錯誤位置，不能判定甲偏差較低。
    C: 甲的偏差較高沒錯，但乙的預測範圍較廣，顯示變異較高。
