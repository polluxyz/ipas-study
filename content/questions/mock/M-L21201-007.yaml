stem: 某公司比較 2 個功能與品質相同的 AI 分類方案。甲的年固定費為 24 萬元，每件處理費 2 元；乙的年固定費為 8 萬元，每件處理費 6 元。兩案費用已含導入、維運與稅，沒有其他成本或級距折扣。若只比較當年總費用，兩案成本相等的年處理量為何？
options:
  A: 20,000 件
  B: 30,000 件
  C: 40,000 件
  D: 60,000 件
answer: C
explanation:
  summary: 同時考慮固定費與每件變動費，求出方案成本交會點。
  correct: 以件數 n 表示用量，令 240,000＋2n＝80,000＋6n，得到 160,000＝4n，因此 n＝40,000。此時兩案同為 320,000 元。高於此用量時，甲每件節省的費用才足以超過固定費差。
  wrong:
    A: 20,000 件時甲為 280,000 元、乙為 200,000 元，甲仍較貴。固定費差尚未由每件節省補回。
    B: 30,000 件時甲為 300,000 元、乙為 260,000 元，兩案仍相差 40,000 元，尚未相等。
    D: 60,000 件時甲為 360,000 元、乙為 440,000 元，甲已較便宜，並非兩案成本相等的用量。
