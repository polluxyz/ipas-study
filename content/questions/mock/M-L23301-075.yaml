stem: 某團隊用決策樹的驗證表現反覆選出 12 個特徵，之後準備改用線性分類器部署。主管認為這 12 個特徵對決策樹最好，因此對線性分類器也最好。下列判斷何者最正確？
options:
  A: 應以線性分類器重新驗證這組特徵的表現
  B: 可用決策樹的驗證分數代表線性分類器表現
  C: 可用特徵數相同確認兩種分類器的適用性相同
  D: 應以決策樹的特徵排名決定線性分類器的係數
answer: A
explanation:
  summary: 包裝法選出的特徵子集，效用會受所用模型影響。
  correct: 決策樹能利用的切分與交互作用，不一定能由線性分類器表達。更換模型後，需重新確認這組特徵是否適合新的部署模型。
  wrong:
    B: 決策樹的驗證分數只描述該模型與特徵組合，不能當成另一種模型的效能估計。
    C: 相同的輸入數量不代表相同的表達能力，也不能保證模型利用這些欄位的方式相同。
    D: 特徵排名沒有提供線性係數所需的方向與量值。線性分類器的係數仍須透過訓練估計。
