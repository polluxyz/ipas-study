stem: 某網路已把原始輸入轉成可比較的尺度，但訓練期間中間特徵的均值與變異仍明顯變動。團隊評估在隱藏層加入批次正規化。對這項做法的判斷，何者最正確？
options:
  A: 擴大原始輸入的縮放幅度，再觀察特徵變化
  B: 增加分類輸出的類別數量，再觀察特徵變化
  C: 提高訓練階段的丟棄比例，再觀察特徵變化
  D: 依當批統計調整中間特徵，再觀察特徵變化
answer: D
explanation:
  summary: 原始輸入縮放與中間特徵正規化作用於不同位置。
  correct: 即使輸入已縮放，前面層的參數更新仍會改變後面層接收的特徵。批次正規化處理中間表示，可作為穩定訓練的候選，但效果需驗證。
  wrong:
    A: 輸入縮放只作用於原始數值，擴大其幅度不能取代對訓練中間特徵的調整。
    B: 類別數由任務定義，增加輸出類別不會對中間特徵的均值與變異進行正規化。
    C: Dropout 隨機遮蔽部分輸出，並非依特徵統計調整尺度，不能視為相同處理。
