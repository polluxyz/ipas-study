stem: 某網路已把原始輸入轉成可比較的尺度，但訓練期間中間特徵的均值與變異仍明顯變動。團隊評估在隱藏層加入批次正規化。在訓練階段，這項處理使用哪種統計，調整哪個對象？
options:
  A: 以當批原始輸入的統計，調整原始輸入的尺度
  B: 以整份原始輸入的統計，固定中間特徵的尺度
  C: 以當批每層梯度的統計，調整該層梯度的尺度
  D: 以當批中間特徵的統計，調整對應隱藏層特徵
answer: D
explanation:
  summary: 原始輸入縮放與中間特徵正規化作用於不同位置。
  correct: 訓練時，批次正規化以當批中間特徵估計各特徵的均值與變異，再進行正規化。之後還可透過學習到的縮放與平移參數調整表示。即使原始輸入已縮放，隱藏層仍可使用這項處理。
  wrong:
    A: 這是在輸入端進行縮放。題目把批次正規化放在隱藏層，統計與調整的對象應是該處的中間特徵。
    B: 整份原始輸入的固定統計無法反映隱藏層隨參數更新而改變的特徵。訓練階段的批次正規化使用當批中間特徵統計。
    C: 梯度用於更新參數，並非隱藏層在前向運算時產生的特徵。調整梯度尺度與批次正規化處理的對象不同。
