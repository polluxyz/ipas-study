concepts: [diffusion-model]
stem: |
  某影像團隊訓練擴散模型，採用噪聲預測形式。每次取一張乾淨圖片，抽取時間步與一份已知高斯噪聲，再依時間步的比例混合成帶噪圖片。網路接收帶噪圖片與時間步。若以平方誤差訓練，最適合用哪個資料作為網路輸出的目標？
options:
  A: 本次取出的乾淨圖片像素
  B: 本次混合後的帶噪圖片像素
  C: 本次混合時加入的噪聲數值
  D: 另行獨立抽取的高斯噪聲數值
answer: C
explanation:
  summary: 噪聲預測形式以實際加入的噪聲建立學習目標。
  correct: 混合時的噪聲是已知值，可直接與網路預測比較。網路學會在指定時間步估計噪聲後，取樣程序才能利用這個估計逐步更新帶噪狀態。
  wrong:
    A: 乾淨圖片可用於其他參數化的訓練目標，但不是題目指定的噪聲預測目標。兩種目標對應的輸出意義不同。
    B: 帶噪圖片已是輸入。把它當目標會鼓勵複製輸入，沒有要求網路估計其中的噪聲。
    D: 獨立重抽的噪聲沒有參與本次圖片混合。它與輸入中的實際擾動不對應，不能提供所需的去噪學習訊號。
