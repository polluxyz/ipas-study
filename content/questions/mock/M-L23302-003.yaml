stem: 某預訓練影像模型原本接收 3 個輸入通道。團隊以同一張灰階圖複製成 3 通道時，第一層卷積可正常運作。卷積輸出是各輸入通道分別與該通道權重卷積後再相加，最後加上偏差。現在希望改成單通道卷積，並讓初始輸出與複製 3 通道的方法完全一致。忽略浮點誤差，偏差保持原值，單通道權重應如何設定？
options:
  A: 取原來 3 個輸入通道權重的平均。
  B: 只取原來第 1 個輸入通道的權重。
  C: 把原來 3 個輸入通道權重的和除以 9。
  D: 取原來 3 個輸入通道權重的總和。
answer: D
explanation:
  summary: 同一灰階輸入複製到多通道時，卷積的通道貢獻可合併相加。
  correct: 對相同灰階圖 x，原卷積的通道貢獻為 W1*x＋W2*x＋W3*x，加上原偏差。卷積對輸入通道是線性加總，因此以 W1＋W2＋W3 作單通道權重，可保留相同初始輸出。這只保證題目指定的複製灰階輸入等價，不代表真實彩色影像的資訊也被保留。
  wrong:
    A: 平均會把不含偏差的卷積貢獻縮成原來的 1/3，無法精確匹配。
    B: 只取第 1 通道會漏掉另外 2 個通道原有的貢獻。
    C: 再除以 9 會額外縮小輸出，沒有對應題目的等價條件。
