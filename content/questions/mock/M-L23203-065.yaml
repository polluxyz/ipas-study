stem: 某服務在整段客服對話結束後，才標記每句話所指的商品。部分代名詞要讀到後面的句子才能判定。團隊已有循環網路，現在要讓每句表示同時納入前後文，不需即時回覆。最適合如何調整？
options:
  A: 增加單向循環網路的層數
  B: 增加單向循環網路的狀態寬度
  C: 延長單向循環網路的訓練輪數
  D: 採用雙向循環網路結合兩側資訊
answer: D
explanation:
  summary: 完整序列可用時，雙向循環網路可將後文納入逐句表示。
  correct: 系統在對話結束後處理，後文已可取得。雙向網路結合正向與反向狀態，能讓某句的表示直接利用後面的指稱線索。
  wrong:
    A: 加深單向網路能增加轉換能力，但該句位置的狀態仍只讀過前文。
    B: 加寬狀態能儲存更多已讀資訊，無法使單向狀態讀到後面的句子。
    C: 延長訓練能調整既有權重，卻沒有改變逐句表示可見的資訊方向。
