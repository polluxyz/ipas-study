stem: |
  某搜尋平台原本用同一套 100 維特徵表示查詢與文件。兩個分站各自以本地文件擬合主成分分析，分別壓成 10 維，且得到不同的投影方向。查詢只用甲站的投影器，卻直接與乙站的 10 維文件做餘弦比較。若要統一搜尋，最適合怎麼調整？
options:
  A: 把兩站的主成分依各自解釋變異由大到小排列
  B: 使用同一組特徵前處理與投影器轉換查詢及文件
  C: 把兩站的 10 維向量都縮放為長度 1 後比較
  D: 把兩站的 10 維向量都乘上同一個正交矩陣
answer: B
explanation:
  summary: 可直接比較的向量，除了維度相同，還需要一致的座標意義。
  correct: 兩站各自擬合的主成分可能代表不同的原始特徵組合；同為第 1 維也不表示同一方向。共用前處理與投影器可讓查詢及文件落在同一座標系，再進行方向比較。
  wrong:
    A: 依解釋變異排序只表示各站內的變異大小。不同資料得到的第 1 主成分仍可能不是同一方向，排序無法對齊座標。
    C: 長度正規化只排除向量大小的影響，不能讓兩組不同主成分的座標軸具有相同意義。
    D: 對兩套座標一起做相同旋轉，會保留它們原來的內積關係，無法修正兩站之間原有的座標差異。
