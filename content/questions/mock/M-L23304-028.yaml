stem: |
  某團隊要比較 2 種優化器（決定模型參數如何更新的方法）。
  兩者適用的學習率範圍都是 0.00001 至 0.1，目前沒有新任務的試驗結果。
  類似專案顯示，較佳學習率可能因優化器而異，且效果主要隨倍數變化。
  批次大小在可用範圍內的影響較小，這輪優先探索每種優化器的學習率。
  系統有 20 個運算槽，每組配置均可在 3 小時內完成。
  下列提案都同時提交 20 組不同配置，並使用相同資料與評估流程。
  「對數等距」表示相鄰學習率的比值相同，兩端點都納入。
  搜尋範圍以 0.001 為界，分成對數尺度相等的上下兩段。
  哪個提案最能比較兩種優化器在整個學習率範圍的表現？
options:
  A: 每種優化器各用 2 個端點學習率，交叉搭配 5 個批次大小
  B: 每種優化器各用全範圍相同的 10 個對數等距值，固定批次大小
  C: 甲用下半段、乙用上半段，各取 10 個對數等距值，固定批次大小
  D: 每種優化器各用全範圍相同的 10 個原始數值等距值，固定批次大小
answer: B
explanation:
  summary: 比較優化器時，每個優化器都應探索共同的完整學習率範圍。
  correct: |
    B 使用 2×10=20 組配置，各優化器都得到相同的 10 個學習率。
    全範圍有 4 個十倍區間，對數等距可避免候選大多落在大數值區域。
    同一學習率下也能直接比較兩種優化器，無須把優化器差異與搜尋範圍差異混在一起。
    固定批次大小，可把本輪預算優先用於較重要的學習率。
    C 雖然整批涵蓋全範圍，卻讓每個優化器各缺少一半的數量級。
    因此僅辨認「對數等距」不足以選對提案，還要逐一檢查各優化器的覆蓋。
    指引介紹超參數與學習率的重要性；批次搜尋的覆蓋比較與對數配置屬補充。
  wrong:
    A: 2×2×5=20 組都能平行完成，但每個優化器只有 2 個學習率。多數預算用在影響較小的批次大小，無法觀察中間數量級的表現。
    C: 2×10=20 組皆不同，且整批跨越全範圍。但甲沒有探索 0.001 以上，乙沒有探索 0.001 以下，不能排除各自在未測區域表現更好。此提案固定相同批次大小，問題仍在各優化器的覆蓋不足。
    D: 2×10=20 組都能完成，但每個優化器有 9 個學習率落在 0.01 至 0.1。其餘較小數量級合計只有端點 0.00001，探索機會不均。
