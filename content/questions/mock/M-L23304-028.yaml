stem: 某團隊要在新任務做第一輪超參數探索，尚無試驗結果。系統有 20 個可同時訓練的運算槽，每次訓練需 3 小時。現有貝氏搜尋工具每次只提交 1 組，完成後才提交下一組；隨機搜尋可先提交整批。若第一輪目標是在 3 小時內取得 20 組不同配置的結果，哪項安排最適合？
options:
  A: 用現有貝氏搜尋逐組提交 20 次試驗
  B: 用隨機搜尋先產生並同時提交 20 組
  C: 用細網格搜尋依次提交 20 組試驗
  D: 用現有貝氏搜尋只提交中點配置反覆試驗
answer: B
explanation:
  summary: 搜尋方法的回饋依賴會影響可用的平行程度。
  correct: 本例的工具行為已指定。獨立產生的隨機配置可一起提交並占用 20 個運算槽。現有逐組等待的工具無法達到第一輪的時間目標。這不是說貝氏搜尋無法設計成批次，而是本例工具尚未提供這種能力。
  wrong:
    A: 每組等待前一組完成，會把多次 3 小時訓練串接，未使用可用的平行運算槽。
    C: 網格本身可以平行，但此選項依次提交，仍無法在一個訓練時段取得 20 組結果。
    D: 中點重複試驗可觀察隨機波動，卻沒有提供 20 組不同配置的探索結果。
