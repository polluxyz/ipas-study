codes: [L23202]
concepts: [voting-ensemble]
stem: |
  某二元告警系統的 3 個模型，對同一案件輸出正類機率 0.51、0.51、0.05。團隊把「各模型以 0.5 切分類別後等票表決」改成「機率等權平均後以 0.5 判定」。若不變更模型，改動後最正確的判斷為何？
options:
  A: "原方案判為正類，新方案仍判為正類"
  B: "原方案判為正類，新方案改判為負類"
  C: "原方案判為負類，新方案仍判為負類"
  D: "原方案判為負類，新方案改判為正類"
answer: B
explanation:
  summary: "區分類別多數決與機率平均的決策。"
  correct: "原先有兩票正類而判正類。改成平均後，正類機率為約 0.357，低於 0.5，因此判負類；機率平均保留了 0.05 與 0.51 之間的程度差異。"
  wrong:
    A: "原方案的兩票正類確實勝出，但新方案平均機率約為 0.357，應判為負類。"
    C: "新方案確實判負類，但原方案先切成類別後有兩票正類，原方案應判正類。"
    D: "這組判定把兩種整合方向顛倒；兩票正類使原方案判正類，低於門檻的平均機率使新方案判負類。"
