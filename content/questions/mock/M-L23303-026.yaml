stem: 某裂縫分割模型的測試影像中，背景像素占 99%。新模型將整張影像都判成背景，報告卻顯示像素準確率達 99%。本次驗收重點是裂縫區域的定位品質。下列補充指標何者最適合直接揭露這項失敗？
options:
  A: 計算背景類別的召回率，核對真實背景被判成背景的比例
  B: 計算裂縫類別的交集聯集比，核對預測區域與真實區域
  C: 計算背景像素所占比例，核對測試影像是否仍以背景為主
  D: 計算預測遮罩的零值比例，核對輸出背景的像素數量
answer: B
explanation:
  summary: 大量背景可讓整體像素準確率掩蓋前景定位失敗。
  correct: 裂縫類別的交集聯集比，直接比較預測裂縫與真實裂縫的交集及聯集。對有真實裂縫的測試影像，全部預測背景會沒有交集，因此能揭露前景定位失敗。評估時應明確處理沒有真實裂縫的影像。
  wrong:
    A: 全判背景可得到很高的背景召回率，這只顯示背景被涵蓋，無法驗收裂縫定位。
    C: 背景占比描述測試資料組成，不比較模型的裂縫預測與標註，不能衡量定位品質。
    D: 零值比例描述輸出數量，沒有核對真實裂縫位置。不同品質的遮罩可能具有相同零值比例。
