stem: 某工程師想用分類結果是否接近標籤來訓練模型，先對輸出取 argmax，再計算平方誤差。以下程式的 requires_grad 結果及訓練修正，哪項最正確？
options:
  A: True；保留 argmax，再將學習率調高。
  B: True；保留 argmax，再增加訓練輪數。
  C: False；把 pred 轉回浮點數即可接回原計算圖。
  D: False；應讓損失直接使用可微分的原始輸出。
answer: D
explanation:
  summary: 離散的 argmax 結果不能提供原始分類分數所需的反向梯度。
  correct: 補充：argmax 產生整數類別索引，不保留連到 logits 的可微分路徑。轉成浮點數也不會恢復這條路徑，因此 loss.requires_grad 為 False。訓練時應把原始輸出與標籤交給適合的可微分分類損失，argmax 留作評估分類結果。
  wrong:
    A: 調高學習率不會建立被離散選類操作切斷的梯度路徑。
    B: 增加輪數無法補回不存在的梯度路徑。
    C: 資料型別轉換不會把離散索引重新連回 logits。
