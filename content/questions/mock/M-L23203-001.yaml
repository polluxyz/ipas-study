code: |
  import torch
  logits = torch.tensor([[2.0, 0.0, -1.0], [0.0, 1.0, 2.0]])
  targets = torch.tensor([0, 2], dtype=torch.long)
  loss = torch.nn.CrossEntropyLoss()(logits, targets)
  print(torch.isfinite(loss).item())
