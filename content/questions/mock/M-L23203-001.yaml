code: |
  import torch
  logits = torch.tensor([[0.2, 0.8]], requires_grad=True)
  pred = logits.argmax(dim=1).float()
  loss = ((pred - torch.tensor([0.0])) ** 2).mean()
  print(loss.requires_grad)
