stem: 某報表問答服務要回答「全部分店的退貨總數」。來源表格有 24 列分店資料，每列只有該店的退貨數，沒有合計列。答案須精確可重算。最適合採用哪個核心流程？
options:
  A: 以擷取式問答選出一段最相關的連續原文字串
  B: 解析各列退貨數，依問題指定的範圍執行加總
  C: 以摘要模型選出退貨數最高的數列作為代表
  D: 以文件分類器辨認主題，再取該主題的常見數值
answer: B
explanation:
  summary: 需要來源中未直接出現的合計時，須安排數值運算。
  correct: B 先將文字或表格解析成可核對的分店與數值，再依問題加總，能保留重算依據。這個需求超出只從原文擷取連續答案字串的任務。
  wrong:
    A: 來源沒有合計值，單一原文字串不會直接包含所求總數；擷取可作取值步驟，不能取代加總。
    C: 最高退貨數只代表某店或部分分店，摘要中的代表數值不能代替全部分店的精確合計。
    D: 文件主題與常見數值不能決定這份表格的實際合計，沒有逐列運算就缺少本題要求的依據。
