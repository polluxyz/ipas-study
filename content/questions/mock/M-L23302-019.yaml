stem: 某材質分類器的骨幹可處理不同解析度，輸出通道固定為 128，空間大小則可能是 8×8 或 12×12。任務只需判斷整張圖的材質，不需保留位置。團隊要共用同一個 128 輸入的分類頭，最適合如何連接？
options:
  A: 對每個通道做全域平均池化，再送入固定分類頭
  B: 將全部空間位置展平後，直接送入固定分類頭
  C: 沿通道取平均後，直接展平送入固定分類頭
  D: 對每個通道做步幅 2 的池化，再展平送入固定分類頭
answer: A
explanation:
  summary: 以固定長度的通道摘要銜接可變空間大小。
  correct: 全域平均池化每個通道產生 1 個值，因此兩種解析度都得到 128 維向量，可銜接同一分類頭。
  wrong:
    B: 展平維度會隨空間大小改變，且不等於 128。
    C: 沿通道平均會保留空間格數，兩種解析度仍產生不同維度。
    D: 固定步幅池化只縮小空間大小，兩種輸入的展平維度仍不同。
