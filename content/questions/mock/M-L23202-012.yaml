stem: 某工程師使用軟間隔支援向量機，目標為最小化 ½||w||²+CΣξᵢ，其中 ξᵢ 衡量間隔違規。固定同一份資料與線性核，將 C 從 1 提高到 100。關於目標函數的改變，下列何者最正確？
options:
  A: 增加距離計算使用的鄰居數，使分類投票更加穩定
  B: 降低每單位違規的代價，使目標更偏向容忍間隔違規
  C: 提高每單位違規的代價，使目標更重視減少間隔違規
  D: 把線性核改成非線性核，使邊界可彎曲以貼合樣本
answer: C
explanation:
  summary: 由目標函數判讀 C 對軟間隔的作用。
  correct: C 是違規總量的乘數。提高 C 會增加每單位違規的目標代價，因此相對於小權重與寬間隔，求解會更重視減少違規；實際參數是否改變仍取決於資料。
  wrong:
    A: 鄰居數是 K 最近鄰分類的設定，不是此支援向量機目標中 C 的意義。
    B: 方向相反。提高 C 會提高違規代價，降低 C 才會相對更容忍違規。
    D: C 調整懲罰強度，不會更換核函數。題目也明示固定使用線性核。
