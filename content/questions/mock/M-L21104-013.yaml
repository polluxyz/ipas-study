stem: 某倉儲系統融合攝影機與距離感測器。感測器資料都能收到，但逆光時攝影機的辨識誤差會上升；距離感測器此時仍穩定。現有系統以固定權重融合。若要處理品質隨環境改變的問題，最適合優先測試哪項設計？
options:
  A: 提高攝影機的固定權重，再以整日平均誤差驗收
  B: 固定選擇輸出分數較大的來源，再以原分數比較
  C: 加入逆光品質訊號調整融合權重，分環境驗證效果
  D: 將兩個來源各自標準化，再沿用原本的固定權重
answer: C
explanation:
  summary: 模態仍可取得時，也須處理可靠度隨環境改變的情況。
  correct: 問題在於逆光時兩種來源的可靠度不同。使用品質訊號控制融合權重，並在正常與逆光情境驗證，可檢查系統是否在畫面劣化時減少不可靠的影像影響。
  wrong:
    A: 提高攝影機的固定權重會讓逆光錯誤更容易影響結果；整日平均也可能掩蓋逆光條件的退步。
    B: 分數較大不等於較可靠。兩個來源的分數尺度或校準情形可能不同，不能直接用數值大小取代品質判斷。
    D: 標準化能處理尺度差異，但不會讓固定權重知道逆光已降低攝影機可靠度。
