stem: 某工程師把 2 個線性轉換串接。以下使用 NumPy 的 @ 做矩陣乘法，A、B 如程式所示。程式輸出的 A@B 為何？
options:
  A: "[[2,0],[0,3]]"
  B: "[[2,4],[1,5]]"
  C: "[[4,6],[1,3]]"
  D: "[[3,2],[1,4]]"
answer: C
explanation:
  summary: 矩陣乘法方向。
  correct: 每個輸出元素由 A 的列與 B 的欄做內積。第一列得到 1×2+2×1=4 與 1×0+2×3=6；第二列得到 1 與 3。
  wrong:
    A: 這是逐元素相乘的結果；@ 使用列與欄的內積，與逐元素乘法不同。
    B: 這是 B@A 的結果。矩陣乘法一般不可交換，題目要求 A@B。
    D: 這是 A+B 的結果，不是合成線性轉換所需的矩陣乘積。
