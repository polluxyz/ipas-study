stem: 某團隊固定模型容量與訓練流程。獨立同分布的訓練樣本由 500 增至 8,000 筆後，訓練錯誤率由 1% 升至 7%，獨立驗證錯誤率由 20% 降至 9%。多次重抽樣也呈現相同趨勢。下列解讀何者最正確？
options:
  A: 資料增加使訓練誤差上升，表示模型的泛化已惡化
  B: 資料增加使兩種誤差接近，表示模型的容量已變小
  C: 資料增加縮小泛化落差，支持原先存在較高變異
  D: 資料增加使驗證誤差下降，表示觀測雜訊已消失
answer: C
explanation:
  summary: 增加資料後，訓練誤差上升仍可能伴隨泛化改善。
  correct: 更多獨立資料讓模型較難記住少數樣本，同時改善未見資料表現。訓練與驗證落差由 19 個百分點縮至 2 個百分點，支持原先的高變異問題有所緩解。
  wrong:
    A: 泛化應看未見資料的表現；本例驗證錯誤率下降，不能僅依訓練誤差上升判為惡化。
    B: 題設固定模型容量，誤差差距縮小反映估計與泛化行為，不能據此推論容量變小。
    D: 增加樣本能改善估計，卻不會因此移除資料生成過程中的觀測雜訊。
