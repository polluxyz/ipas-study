stem: 某工業問答系統同時接受「AX-804B 的校正方式」與「設備偏移時怎麼調整」等問題。純向量檢索能找到意義相近的維修說明，卻偶爾把 AX-804B 找成 AX-804D。團隊希望同時保留語意查詢能力與精確型號辨識。最適合採用哪項整合方式？
options:
  A: 將型號中的數字移除，再以向量相似度選擇維修文件
  B: 將型號視為一般詞彙，提高向量檢索取回的文件數量
  C: 結合關鍵詞與向量檢索，辨識到型號時加入精確篩選
  D: 對文件加入同義詞擴充，再以擴充文字建立向量索引
answer: C
explanation:
  summary: 精確識別碼與自然語意查詢需要相互補充的檢索訊號。
  correct: 關鍵詞訊號可保留型號字面資訊，向量訊號支援語意近似；已辨識型號時再使用精確篩選，可防止近似型號混用。整合後仍需以兩類問題驗證品質。
  wrong:
    A: 數字是型號識別的一部分，移除會降低區別不同設備的能力。
    B: 更多候選可能包含正確文件，也可能包含更多近似型號，未建立型號必須吻合的條件。
    D: 同義詞擴充可補充語意表達，但設備型號是精確識別碼，不是可互換的同義詞；此法未建立指定型號必須吻合的條件。
