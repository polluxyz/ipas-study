stem: 某混合檢索的關鍵詞分數與向量分數尺度不同。系統改用倒數名次融合：每份文件分數為 1／（10＋關鍵詞名次）＋1／（10＋向量名次），名次從 1 起算，不使用原始分數。甲在兩路名次分別為 1、20，乙分別為 3、2。只比較甲、乙，何者融合分數較高，分數約為多少？
options:
  A: 甲較高，甲的融合分數約為 0.1242
  B: 甲較高，甲的融合分數約為 1.0500
  C: 乙較高，乙的融合分數約為 0.1603
  D: 乙較高，乙的融合分數約為 0.1667
answer: C
explanation:
  summary: 名次融合以各清單排名組合訊號，無須直接相加不同尺度的原始分數。
  correct: 甲為 1／11＋1／30，約 0.1242；乙為 1／13＋1／12，約 0.1603，因此乙較高。乙在兩路都靠前，優於只在一路居首的甲。這是 115-1 科3 第22題所用名次融合概念的指定公式計算；不同融合常數可能影響排名，須依本題的 10 計算。
  wrong:
    A: 0.1242 是甲的正確分數，但乙約為 0.1603，甲並未勝出。
    B: 1.0500 是省略常數 10 後的 1／1＋1／20；省略常數會改變本題的分數與排序。
    D: 0.1667 使用乙的最佳名次 2 代表兩路，卻漏掉關鍵詞實際是第 3 名。
