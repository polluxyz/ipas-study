stem: 某餐點相簿要標示每張照片是否含有「麵、蛋、青菜」。同張照片可同時包含多項，業務不需要位置或數量。團隊目前強迫每張只選 1 類。哪種輸出規格最適合？
options:
  A: 改用類別權重補償，維持每張照片只輸出一個食物類別
  B: 讓 3 類分數總和為 1，每張只輸出最高分的食物類別
  C: 對 3 種食物各自輸出是否存在，容許同張照片多項成立
  D: 對每張照片輸出 1 個總食物數量，取代各種類別標記
answer: C
explanation:
  summary: 多種屬性可同時存在時，需要多標籤輸出。
  correct: 需求是每種食物的存在與否，類別之間不互斥。多標籤分類允許同張影像有多個成立的類別，也不需要額外預測邊界框或像素遮罩。
  wrong:
    A: 類別權重可調整各類的訓練影響，但不會讓單一輸出變成可同時成立的多個標籤。
    B: 只選最高分會省略其他同時存在的食物，互斥的單一輸出不符合需求。
    D: 總數不能指出有哪些食物，相同總數可能由不同食物組成。
