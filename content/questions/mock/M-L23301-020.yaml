stem: 某服務成本模型將「一般、優先、專人」3 個服務等級編成 1、2、3，直接當作線性迴歸的一個輸入。等級有順序，但升級所增加的成本未必等距。團隊希望各等級可有獨立成本差，且類別數很少。下列調整何者最適合？
options:
  A: 將等級改編成 0、1、2，保留單一線性輸入與截距
  B: 將等級改編成 10、20、30，保留單一線性輸入欄位
  C: 將等級編碼做平均值與標準差縮放，保留單一線性輸入
  D: 以一般等級作參照，為其餘等級建立獨立指示欄位
answer: D
explanation:
  summary: 順序關係不代表線性模型可以假設相鄰等級等距。
  correct: 一個數值欄位搭配一個線性係數，會讓相鄰等距編碼產生相同的預測增量。以參照類別加其餘指示欄位，可為各服務等級估計獨立成本差，不必假設升級效果等距。
  wrong:
    A: 整體減去一個常數可由截距吸收，相鄰等級仍相差 1，因此沒有解除相同增量的限制。
    B: 乘以相同常數只改變係數單位，等級之間仍等距，無法讓兩次升級具有不同效果。
    C: 減平均再除標準差是線性縮放，會保留等距關係，仍只有一個等級係數。
