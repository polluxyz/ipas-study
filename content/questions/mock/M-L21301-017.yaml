stem: 某服務實際正類比例為 2%。團隊已先切出獨立測試集，再將訓練集正類過採樣至 50%。現在要估計部署時「被模型判為正類的案件有多少是真的正類」。測試資料最適合如何安排？
options:
  A: 把測試正類也過採樣至 50%，再對該測試資料計算精確率
  B: 把測試負類刪到與正類同量，再對該測試資料計算精確率
  C: 把測試正類複製到與訓練集相同筆數，再合併測試負類評估
  D: 維持測試資料接近實際的 2% 正類比例，再計算精確率
answer: D
explanation:
  summary: 訓練重採樣不代表測試資料也要平衡。
  correct: 精確率會受正負類比例影響。訓練過採樣可協助模型學習少數類，但部署估計應使用獨立且接近實際類別比例的資料，才能反映真實環境中正類預測的可信程度。
  wrong:
    A: 把測試正類提高至 50% 會改變精確率的基準，不能直接代表正類只有 2% 的部署環境。
    B: 刪減負類同樣改變測試盛行比例，可能使誤報在實際案件中的影響被低估。
    C: 依訓練集筆數複製測試正類，沒有保留實際比例，也不會增加獨立的測試證據。
