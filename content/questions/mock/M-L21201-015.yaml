id: M-L21201-015
rev: 1
source: mock
subject: 1
type: 計算
codes: [L21201]
concepts: [return-on-investment, ai-total-cost]
stem: |
  某企業已支付 40 萬元完成資料盤點，這筆支出無法收回，無論是否繼續都不再改變。現在要決定是否投入下一階段，未來一年需新增建置費 60 萬元及維運費 20 萬元；相較停止專案，可新增現金效益 120 萬元。本題只評估「從現在起新增投入的 ROI」，公式為（未來新增效益－未來新增成本）／未來新增成本，不計折現。正確值為多少？
options:
  A: 0%
  B: 20%
  C: 約 33.3%
  D: 50%
answer: D
explanation:
  summary: 新增投資的報酬率應依本次決策會改變的未來收支計算。
  correct: 未來新增成本為 60＋20＝80 萬元，新增淨效益為 120－80＝40 萬元，ROI 為 40／80＝50%。已支付且不因決策改變的 40 萬元，不屬於本題指定的未來新增成本。
  wrong:
    A: 0% 將既有 40 萬元與未來 80 萬元合計為 120 萬元。這可用於另一種全期收支口徑，但不符合本題從現在起的新增投入邊界。
    B: 20% 將已付 40 萬元與新增建置 60 萬元合計為成本，卻漏掉未來維運 20 萬元，混用了不同期間與成本範圍。
    C: 約 33.3% 是把新增淨效益 40 萬元除以新增效益 120 萬元。題目指定的分母是新增成本 80 萬元。
guide_refs: [guide-1:4-5, guide-1:4-6]
author: codex
review:
  status: verified
  blind_answer: D
