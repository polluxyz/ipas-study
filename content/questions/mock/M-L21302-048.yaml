stem: 某企業助理在檢索時會核對文件權限，但相同使用者的完整答案可快取 10 分鐘。員工調離專案後，權限服務已撤銷存取，該員工仍能從自己的舊快取取得專案內容。最適合補強哪項控制？
options:
  A: 快取命中時核對依賴文件的現行權限，並接收撤權失效事件
  B: 將快取鍵由使用者帳號改為部門代碼，集中管理相同部門答案
  C: 在檢索流程增加登入驗證次數，維持快取命中時的直接回傳
  D: 將快取內容加密保存，於同一使用者再次提問時解密回傳
answer: A
explanation:
  summary: 快取回傳也是資料存取，不能繞過已變更的授權。
  correct: 舊答案可能依賴已撤權的文件。快取保存依賴資訊，回傳前核對目前權限，並用撤權事件清除相關項目，才能讓授權變更涵蓋快取路徑。
  wrong:
    B: 部門代碼不一定等於文件授權範圍，改成共用快取還可能擴大答案接觸範圍，未處理個人撤權。
    C: 登入驗證確認身分，不能代替文件授權。快取直接回傳也不會走到新增的檢索檢查。
    D: 儲存加密防護的是保存狀態。系統仍替已撤權的使用者解密並回傳，沒有執行現行授權。
