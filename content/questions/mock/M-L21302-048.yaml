stem: 某企業把 AI 推論、登入及報表功能包在同一個應用程式部署。推論每週更新，另外兩項每季才更新；尖峰時也只有推論需要增加算力。目前每次更新或擴容都得處理整套應用。團隊已具備服務間介接與監控能力，若要讓三項功能可分別更新，且只對推論增加算力，哪項設計最適合？
options:
  A: 將三項功能各自封裝為服務映像，透過介面呼叫，為推論容器設定副本數
  B: 將三項功能封裝為應用映像，部署多份容器，依推論請求量增加容器副本
  C: 將三項功能以程序內外掛載入，替換推論外掛，依推論負載增加工作執行緒
  D: 將三項功能設為應用內模組，以功能開關切換推論版本，調高推論執行緒配額
answer: A
explanation:
  summary: 功能的更新頻率與資源需求不同時，可用獨立服務分別管理。
  correct: 服務映像是封裝服務程式與執行環境的檔案。三項功能各有映像與容器後，可只發布推論映像，也可只增加推論容器的副本數。登入與報表可保留原有版本及副本數。這種微服務（可分別部署的功能服務）設計，讓更新與資源配置的單位對應各項功能。服務介面仍須驗證相容性，並持續監控故障與資源使用。
  wrong:
    B: 依推論請求量增加副本能回應負載，但每份應用映像都包含三項功能。增加一份容器也會帶入登入與報表，更新推論則須發布包含三項功能的映像。多份容器本身不會形成按功能分開的發布與資源單位。
    C: 程序內外掛可讓推論程式單獨替換，但三項功能仍使用同一程序的資源。增加工作執行緒（程序內執行工作的單位）只調整並行工作數，不等於新增可單獨配置算力的推論容器。推論耗盡程序資源時，仍可能影響登入與報表。
    D: 功能開關可切換已放入應用的新舊推論版本，但加入新版本仍須更新應用映像。調高執行緒配額只調整應用內的使用上限，沒有增加獨立的推論資源單位。這兩項操作未建立三項功能各自的發布與擴容邊界。
