stem: 某知識助理在生成開始前已確認文件權限。答案尚未送出時，管理員完成撤權；生成工作仍在執行。公司要求撤權完成後，尚未通過送出閘門的答案不得再交付；已送出的內容不在此題範圍。哪項設計最符合此要求？
options:
  A: 讓送出閘門與撤權共用順序控制，依當下權限攔截撤權後待送出的答案
  B: 讓生成工作保留起始時的權限快照，依啟動當時的許可交付所有既有工作
  C: 讓撤權事件只清除答案快取，依原本生成狀態交付沒有使用快取的答案
  D: 讓生成工作完成後再記錄撤權時間，依事後稽核結果刪除已交付的答案
answer: A
explanation:
  summary: 授權可能在生成期間改變，須把檢查落在實際交付的控制邊界。
  correct: 生成中的撤權競態屬補充。送出閘門須與撤權操作建立明確先後順序，並讀取符合該順序的現行授權。撤權先完成，就攔截尚未通過閘門的相關答案。只在生成起點檢查，或只加一次可能再被穿插的讀取，都不足以落實此要求。授權順序一致性的原理可參考 [Zanzibar 論文](https://www.usenix.org/conference/atc19/presentation/pang)。
  wrong:
    B: 起始快照無法反映生成期間的撤權，會使尚未交付的答案沿用過期許可。
    C: 此請求仍在生成，不需命中答案快取；清除快取不會阻止這次交付。
    D: 稽核能找出事後問題，卻不能阻止撤權後的交付，也無法收回使用者已看見的內容。
