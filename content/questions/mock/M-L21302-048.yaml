stem: 某企業把 AI 推論、登入及報表功能包在同一個應用程式部署。推論每週更新，另外兩項每季才更新；尖峰時也只有推論需要增加算力。目前每次更新或擴容都得處理整套應用。團隊已具備服務間介接與監控能力，若要讓三項功能可分別更新，且只對推論增加算力，哪項設計最適合？
options:
  A: 按功能拆成獨立服務，以明確介面串接，各服務分別發布與擴容
  B: 將整套應用封裝成同一容器，以相同映像增加副本並共同發布
  C: 讓三項功能共用一個執行程序，以功能開關控制發布並整體擴容
  D: 將三項功能放在同一服務，以統一排程輪流更新並提高主機規格
answer: A
explanation:
  summary: 功能的更新頻率與資源需求不同時，可用獨立服務分別管理。
  correct: 微服務（可分別部署的功能服務）讓推論、登入與報表各自維護發布單位，推論增加副本時無須連帶擴充其餘功能。服務間須約定輸入輸出介面，並驗證相容性、監控與故障處理。題目已具備相關維運能力，這種拆分能同時對應獨立更新與資源分配需求。
  wrong:
    B: 容器可統一執行環境，但同一映像仍包含整套應用。增加副本與發布時仍會連帶處理登入及報表，沒有建立各功能的獨立部署單位。
    C: 功能開關能控制功能是否啟用，但共用程序仍將三項功能綁在相同的部署與資源範圍，無法單獨擴充推論服務。
    D: 輪流排程可以調整更新作業的時間，提高主機規格則增加整體容量；兩者都未改變三項功能共用部署單位的問題。
