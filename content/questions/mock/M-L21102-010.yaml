stem: 某復健輔助系統要根據單張影像判斷手肘彎曲程度。現階段只分析同一手臂，輸出需提供肩、肘、腕 3 個指定位置，供後續幾何運算使用。哪種標註最直接符合需求？
options:
  A: 標出肩、肘、腕各點的名稱與座標
  B: 標出整條手臂的邊界框與手臂類別
  C: 標出整條手臂的像素遮罩與個體編號
  D: 標出每張影像屬於彎曲或伸直的類別
answer: A
explanation:
  summary: 關節幾何關係需要具名稱對應的關鍵點。
  correct: 肩、肘、腕是具有固定語意的點位。標註各點座標並保留名稱對應，才能讓後續運算知道哪個座標是角度頂點，哪兩個是手臂端點。
  wrong:
    B: 邊界框提供大致範圍，沒有指出肘的位置，也不能直接提供兩段手臂的方向。
    C: 遮罩表示輪廓，可能用於其他幾何估計，但不直接提供指定關節點及其名稱對應。
    D: 分類標籤可提供姿勢類別，卻沒有交付後續運算要求的三個位置。
