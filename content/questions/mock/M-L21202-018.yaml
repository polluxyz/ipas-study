stem: |
  某工單分流專案可調整模型門檻，以交換自動處理量與錯送風險。營運部掌握各種錯送的補救成本，模型團隊掌握不同門檻的錯誤分布，測試團隊負責驗收。計畫尚未決定可接受的營運損失。最適合採取哪種分工？
options:
  A: 營運部確認損失界線，模型團隊提出門檻比較，測試團隊依核定條件驗證
  B: 模型團隊依總準確率設定損失界線，營運部宣導操作，測試團隊確認介面
  C: 測試團隊依現有測例設定損失界線，模型團隊調參，營運部接收驗收結果
  D: 營運部依處理量指定模型門檻，模型團隊實作，測試團隊核對門檻設定值
answer: A
explanation:
  summary: 業務損失界線、模型取捨與驗證證據需要對應各部門的資訊。
  correct: 營運部能提供補救成本與可承受影響，模型團隊能量化門檻取捨，測試團隊再確認核定界線是否達成。這樣才能把業務風險轉成可檢驗的條件。
  wrong:
    B: 總準確率沒有表達不同錯送的損失。模型團隊只靠該指標設定界線，缺少營運成本依據；介面驗收也不足以確認風險。
    C: 測例是驗證條件的工具，不能自行決定企業可承受的損失。營運部只接收結果，會使主要成本資訊未進入決策。
    D: 處理量沒有涵蓋錯送的代價。直接指定門檻且只核對設定值，沒有驗證該門檻下的實際營運損失。
