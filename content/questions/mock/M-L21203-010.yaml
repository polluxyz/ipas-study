stem: 某公司曾核准接受 AI 商品標籤偶發誤分類，條件是只供內部搜尋且每季複評。現在業務要把相同標籤接到自動出貨限制，誤分類可能擋住客戶訂單。下次季度複評尚有 2 個月。哪項處理最適當？
options:
  A: 沿用既有接受紀錄，於下次季度複評再檢查新用途
  B: 沿用既有接受紀錄，以相同模型版本證明風險未變
  C: 因用途與後果改變先重評，經核准後再啟用出貨限制
  D: 將新用途加入系統清單，以完成登錄代替再次風險核准
answer: C
explanation:
  summary: 風險接受有用途條件，重大變更應提前重新評估。
  correct: 原核准只涵蓋內部搜尋的影響。自動限制出貨會改變錯誤後果，已超出接受條件。應在新功能啟用前重評風險與控制，而不是等待原定週期到期。
  wrong:
    A: 定期複評是常態安排，不能讓超出已核准用途的新風險直接延續至下一次會議。
    B: 模型版本不變不代表業務後果不變，同一錯誤接到出貨流程可能產生更大影響。
    D: 清單登錄只確認系統存在，未判斷新用途是否可接受，也沒有核定相應控制。
