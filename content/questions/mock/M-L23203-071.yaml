stem: 某設備影像專案比較來源模型微調與從頭訓練。兩者都符合部署限制，使用相同訓練資料、驗證切分與預算。多次實驗中，來源模型微調的驗證正確率約 62%，從頭訓練約 80%；來源模型在原任務達 94%。最合理的採用方向為何？
options:
  A: 採用來源模型，以原任務正確率作為主要依據
  B: 採用來源模型，以曾接受大量預訓練作為主要依據
  C: 優先採用從頭訓練方案，並確認目標任務的表現
  D: 優先採用來源模型，並增加原任務類別的輸出數
answer: C
explanation:
  summary: 是否採用遷移學習要看目標任務證據。
  correct: 相同條件下，目標任務多次驗證支持從頭訓練較佳。來源任務的高分不代表特徵能有效轉移，可優先採用較佳候選並以獨立測試確認。
  wrong:
    A: 94% 來自不同來源任務，不能取代目前任務的直接比較。
    B: 預訓練資料量只是可利用資源，不能推翻多次目標驗證所顯示的差距。
    D: 增加來源類別輸出改變了分類目標，沒有處理來源表示不適合新任務的問題。
