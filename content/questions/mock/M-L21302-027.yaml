stem: 某語音分析服務遇到短暫錯誤後，2,000 個用戶端都在整整 1 秒後重試，造成每秒同一時刻出現新的尖峰。服務可在錯開的流量下完成工作。已有最大重試次數與總等待期限，最適合再調整哪項機制？
options:
  A: 把重試等待統一改成 2 秒，維持所有用戶端相同的重試時間
  B: 在漸增的重試間隔加入隨機偏移，並遵守既有次數與期限
  C: 把重試等待統一改成 0.1 秒，讓用戶端更快取得服務恢復結果
  D: 將每次重試複製送往 2 個副本，再採用最先返回的成功結果
answer: B
explanation:
  summary: 重試需分散時間，避免同步重試形成新尖峰。
  correct: 固定且同步的重試會形成重複尖峰。漸增間隔減少反覆施壓，隨機偏移則分散各用戶端的重試時點；仍需受次數與總期限限制，避免重試無限擴張。
  wrong:
    A: 統一延長為 2 秒只改變尖峰週期，沒有分散用戶端同時重試的時點。
    C: 較短的同步間隔會更頻繁產生尖峰，可能讓服務更難恢復。
    D: 複製重試增加後端工作量，沒有針對同步到達的原因，可能加重尖峰負載。
