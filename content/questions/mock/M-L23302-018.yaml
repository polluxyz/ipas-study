stem: 某行動端模型以逐通道 3×3 卷積處理 32 個輸入通道，每個通道各用 1 個濾波器。下一步要學習通道間的組合，並輸出 64 個通道，空間尺寸不變。最適合接哪一層？
options:
  A: 再接逐通道 3×3 卷積，每個輸入通道各用 2 個濾波器
  B: 再接逐通道 1×1 卷積，每個輸入通道各用 2 個濾波器
  C: 再接逐通道最大池化，將每個通道複製成 2 份
  D: 再接一般 1×1 卷積，將 32 個通道映射為 64 個
answer: D
explanation:
  summary: 逐通道空間處理後，需以逐點卷積學習跨通道組合。
  correct: 一般 1×1 卷積在每個空間位置讀取全部 32 個通道，能學習跨通道映射並產生 64 個通道。
  wrong:
    A: 逐通道卷積即使增加濾波器，每個輸出仍只讀單一輸入通道，沒有學習跨通道混合。
    B: 逐通道的 1×1 卷積仍限制通道連線；擴成 64 個輸出不代表已跨通道組合。
    C: 池化與複製可改變表示，但不會學習不同通道的加權組合。
