stem: 某感測資料欄位以 -999 代表傳輸失敗。工程師把欄位轉成數值後，完整性檢查顯示沒有空值，平均值卻異常偏低。正常溫度可能低於 0 度。最適合先做哪項修正？
options:
  A: 依來源規格將 -999 轉成缺失標記，再檢查缺失率與填補方式
  B: 將溫度小於 0 的資料轉成缺失標記，再檢查缺失率與填補方式
  C: 對含 -999 的整欄數值做標準化，再依標準化結果計算平均值
  D: 以所有溫度的平均值取代 -999，再依填補後的整欄值做標準化
answer: A
explanation:
  summary: 來源的缺失代碼要先辨識，不能只檢查空值。
  correct: 數值型態不代表每個數值都有量測意義。應依來源規格識別缺失代碼，再決定缺失處理；否則 -999 會污染平均數等統計量，也使完整性檢查漏報。
  wrong:
    B: 負溫在本例可能是真實量測，將全部負值標為缺失會刪掉有效資訊。
    C: 標準化只轉換尺度，不會使傳輸失敗代碼變成真實量測，統計量仍被污染。
    D: 含 -999 的平均值已遭污染，直接拿該平均值填補會把錯誤帶入替代值。
