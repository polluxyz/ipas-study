stem: 某公司有 2 座工廠，驗收規定每座工廠在總分中各占 1/2。甲在 900 件測試品中答對 810 件，乙在 100 件中答對 60 件。報表先把正確件數合併，得到 87%。依指定權重，最正確的總分是多少？
options:
  A: 75%
  B: 81%
  C: 87%
  D: 90%
answer: A
explanation:
  summary: 總分的權重應由驗收對象決定，而不是由各廠收集的筆數決定。
  correct: 甲的準確率為 810/900=90%，乙為 60/100=60%。每廠各占一半，所以總分為 (90%+60%)/2=75%。合併件數的 87% 讓甲的權重變成 90%，不符合本題要求。
  wrong:
    B: 81% 相當於把甲的正確件數 810 除以全體 1,000 件，沒有納入乙的正確結果。
    C: 87% 是每件產品等權的結果，並非每座工廠等權。
    D: 90% 只反映甲廠表現，漏掉乙廠的驗收貢獻。
