stem: |
  某推薦器只靠使用者與商品的既有評分，分解出雙方的潛在向量，再以內積排序。新註冊會員沒有評分、點擊或個人資料，系統也沒有其他可辨識偏好的訊號。產品希望新會員第一次開啟就能看到推薦。最適合採取哪個做法？
options:
  A: 提高分解的潛在維度，產生新會員的個人偏好
  B: 對新會員的空白評分列做標準化，再取得偏好
  C: 延長同一份評分資料的訓練，細化新會員偏好
  D: 先提供非個人化推薦，取得互動後更新會員表示
answer: D
explanation:
  summary: 評分分解無法從不存在的個人訊號學出新會員偏好。
  correct: 既有評分可幫助學習商品與舊會員的結構，但新會員尚無訊號，無從判定其偏好向量。先提供熱門或多樣化的非個人化內容，待取得互動後更新表示，才有個人化的依據。
  wrong:
    A: 增加維度只增加表示容量，沒有增加新會員的觀測資料；無法因此知道這位會員與哪些商品相近。
    B: 標準化能調整已有數值的尺度，不能把沒有評分的空白列轉成可辨識的個人偏好。
    C: 延長訓練可改善既有資料的擬合，但同一份資料仍沒有新會員訊號，不能產生有依據的個人化偏好。
