stem: 某短句語意配對服務比較 4 種嵌入方案。相同硬體與測試集下，甲的配對 F1／單句延遲為 0.91／80 毫秒，乙為 0.88／15 毫秒，丙為 0.79／4 毫秒，丁為 0.87／35 毫秒。驗收要求 F1 至少 0.85，延遲最多 20 毫秒。下列選型何者最適合？
options:
  A: 選甲：大型語境編碼器，使用句向量
  B: 選乙：精簡語境編碼器，使用句向量
  C: 選丙：靜態詞向量，使用平均詞向量
  D: 選丁：中型語境編碼器，使用句向量
answer: B
explanation:
  summary: 嵌入選型須用目標任務實測，同時核對品質與延遲。
  correct: 乙的 F1 為 0.88，延遲為 15 毫秒，兩項都符合驗收。模型較大或表示較複雜，不能代替此服務的實測條件。
  wrong:
    A: 甲的 F1 最高，但單句延遲 80 毫秒超過上限，不能只按品質排名選用。
    C: 丙最快，但 F1 為 0.79，低於最低品質要求。
    D: 丁的品質達標，但延遲 35 毫秒仍超過 20 毫秒上限。
