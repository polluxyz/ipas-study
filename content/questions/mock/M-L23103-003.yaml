code: |
  import torch
  parameter = torch.nn.Parameter(torch.zeros(2))
  parameter.grad = torch.tensor([6.0, 8.0])
  torch.nn.utils.clip_grad_norm_([parameter], max_norm=5.0)
  print([round(x, 3) for x in parameter.grad.tolist()])
