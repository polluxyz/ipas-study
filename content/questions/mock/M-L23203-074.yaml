stem: 某分類器將 Dropout 丟棄率由 0.2 改為 0.9，其他設定不變。多次實驗顯示，訓練與驗證正確率都從約 85% 降至約 55%，兩者差距很小。若優先處理這次設定變動，最適合如何調整？
options:
  A: 提高丟棄率，再比較訓練與驗證的表現
  B: 增加權重懲罰，再比較訓練與驗證的表現
  C: 減少隱藏單元，再比較訓練與驗證的表現
  D: 降低丟棄率，再比較訓練與驗證的表現
answer: D
explanation:
  summary: 正則化過強可能使模型連訓練資料也學不好。
  correct: 提高丟棄率後，訓練與驗證一起變差，符合有效學習能力受限的情況。先降低這項過強限制，再重新比較兩種表現，較直接回應已知變動。
  wrong:
    A: 更高丟棄率會進一步減少每次可用的單元，不是優先緩解目前擬合不足的方向。
    B: 增加權重懲罰會再限制參數，沒有回應丟棄率過高後連訓練分數都下降的證據。
    C: 減少單元會再縮小模型容量，與優先恢復有效學習能力的方向相反。
