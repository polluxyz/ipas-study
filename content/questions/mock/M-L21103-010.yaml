stem: 某型錄要替 60 張商品照換背景。瓶身標誌與文字須逐像素保留。測試發現單靠文字要求保留瓶身，仍會改動標誌。系統已能取得精確商品遮罩。哪個流程最符合驗收條件？
options:
  A: 提高文字引導強度並生成整張照片，再檢查標誌大致相似
  B: 固定隨機種子後重畫整張照片，以相同種子維持瓶身像素
  C: 用遮罩限制背景編輯，並以原瓶身像素合成後逐項比對
  D: 把照片轉成素描後重建整張照片，利用輪廓維持瓶身文字
answer: C
explanation:
  summary: 逐像素保留要求需以原素材合成與比對落實。
  correct: 遮罩可界定背景修改區域，原瓶身則直接保留或合成回結果。這樣才能檢查保留區是否與原圖逐像素一致，並另行檢查邊界銜接。生成控制本身不應取代精確保留的驗收。
  wrong:
    A: 大致相似的標誌不符合逐像素保留，增加文字引導也不會把生成變成原像素複製。
    B: 隨機種子控制初始隨機性，不會在背景條件改變時鎖定瓶身像素。
    D: 素描保留部分輪廓而非完整色彩與文字像素，重建整張照片仍會改動原瓶身。
