stem: 某團隊把多份提示範本合併。需求已定為「恰好 80 字，且用固定 2 欄回覆」，但提示另一處仍要求「至少 150 字，且不要分欄」。產出規格反覆不符。模型權重不變，最適合先做哪項修正？
options:
  A: 以固定 2 欄示例引導輸出，保留舊版的長度要求
  B: 指定模型扮演資深編輯，由角色描述主導輸出格式
  C: 刪除衝突的舊要求，讓長度與格式只保留核定版本
  D: 每次產生多份候選，按目前兩組規格選出最高分者
answer: C
explanation:
  summary: 互相矛盾的輸出約束需先在提示中排除。
  correct: C 先修正無法同時滿足的規格，讓模型取得單一且一致的輸出要求。字數與欄位仍需在產出後檢查，修正提示不代表每次生成均會合格。
  wrong:
    A: 示例可引導格式，但仍與至少 150 字及不要分欄的指令衝突，不能建立一致的驗收目標。
    B: 指定角色可能影響用語，不能讓恰好 80 字與至少 150 字同時成立。
    D: 多次產生可能碰到符合其中一組要求的候選，但沒有消除提示要求互相衝突的原因。
