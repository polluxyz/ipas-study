stem: 某零件偵測驗收對 2 類同等重視，使用相同匹配規則下的類別 AP 等權平均作為 mAP。測試物件數為甲類 900、乙類 100。舊模型的甲／乙 AP 為 0.90／0.30，新模型為 0.80／0.50。關於新舊 mAP，下列何者正確？
options:
  A: 舊為 0.84，新為 0.77，新模型下降
  B: 舊為 0.90，新為 0.80，新模型下降
  C: 舊為 0.30，新為 0.50，新模型上升
  D: 舊為 0.60，新為 0.65，新模型上升
answer: D
explanation:
  summary: 等權類別 mAP 的取捨不由測試物件數決定。
  correct: 舊 mAP＝(0.90＋0.30)/2＝0.60，新 mAP＝(0.80＋0.50)/2＝0.65。乙類進步抵過甲類退步，因此等權平均增加 0.05。
  wrong:
    A: 0.84 與 0.77 按物件數加權，讓甲類占 90%，不是題目約定的類別等權 mAP。
    B: 這只比較甲類 AP，沒有納入乙類的改善，無法反映兩類同等重要的指標。
    C: 這只比較乙類 AP，雖然方向同樣上升，但省略甲類後得到的不是 mAP。
