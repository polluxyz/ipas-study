stem: |
  某工廠用偏依圖觀察模型如何隨轉速改變。歷史資料中，高轉速只搭配高冷卻流量。分析程式卻把每筆資料的轉速都替換為高轉速，保留各筆原有流量後平均預測，得到部分異常高的預測值。主管打算直接用曲線決定高轉速設定。下列判斷何者最正確？
options:
  A: 平均後已排除流量的影響，曲線上的高轉速預測可直接作為現場設定依據
  B: 只要增加轉速網格的點數，曲線就能補出高轉速與低流量的實際運作資料
  C: 應檢查替換產生的組合是否有資料支持，再評估曲線能否用於現場決策
  D: 將每筆預測改取中位數，就能把轉速與流量的相關關係從解釋中消除
answer: C
explanation:
  summary: 辨識相關特徵下偏依圖可能使用缺乏資料支持的組合。
  correct: 替換轉速時保留低流量，可能產生歷史資料未涵蓋的組合。模型在這些組合上的預測缺乏驗證，平均曲線不能直接當成可採用的操作設定。
  wrong:
    A: 取平均不會消除轉速與流量的相依，也不會使缺乏支持的組合變得可信。
    B: 增加網格只增加模型查詢位置，不會創造真實運作觀測。
    D: 改用中位數可以降低部分極端預測的影響，但不能解決組合缺乏資料支持的問題。
