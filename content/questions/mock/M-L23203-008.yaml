stem: 某工廠用 Transformer 編碼器分類 12 步控制指令。模型沒有位置編碼、位置偏置、遮罩或其他順序特徵，最後對所有位置取平均。工程師把同一組指令任意重排，模型仍給相同分數；但任務標籤取決於「先加熱再加壓」或相反順序。最適合優先補上什麼？
options:
  A: 加入位置表示，讓模型可區分指令的先後順序
  B: 只增加注意力頭數，讓沒有位置的模型自行辨識順序
  C: 隨機重排指令當成資料增強，仍維持每筆的原標籤
  D: 改用每種指令的出現次數，取代現有序列作為輸入
answer: A
explanation:
  summary: 內容注意力需搭配位置資訊才能表達順序。
  correct: A 補上任務所需的位置資訊。在題目排除其他順序來源後，自注意力對輸入重排會相應重排輸出，最後的平均彙整又消除位置差別。位置表示可破除此限制，但仍需訓練模型學會正確的順序關係。
  wrong:
    B: 更多注意力頭沒有引入順序資訊，平均彙整仍無法區分這種重排。
    C: 本題標籤取決於順序，任意重排卻維持標籤可能引入錯配，也沒有補上位置資訊。
    D: 次數特徵仍無法區分相同指令集合的不同順序，會丟失任務需要的資訊。
