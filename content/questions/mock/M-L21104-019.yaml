stem: 某雙感測器合成測試有 (0,0)、(0,1)、(1,0)、(1,1) 4 種狀態，出現次數相同。僅兩路狀態不同時標為異常。單看任一路時，異常機率均為 0.5。若要學到兩路是否相同的關係，哪項設計最適合？
options:
  A: 將兩路各自的異常機率做等權平均
  B: 將兩路各自的異常機率做加權平均
  C: 保留兩路狀態特徵，接可學交互作用的分類器
  D: 選擇單路驗證較佳的分支，作為最終輸出
answer: C
explanation:
  summary: 只融合已壓縮成相同機率的輸出，可能失去跨模態關係。
  correct: 每路單獨的異常機率都是 0.5，決策平均無法區分這 4 種狀態。保留兩路特徵後，具有非線性交互能力的分類器可學到「不同則異常」的關係。
  wrong:
    A: 等權平均在每種狀態都得到 0.5，無法辨別兩路狀態是否不同。
    B: 輸入機率都固定為 0.5，改成其他固定權重也不會產生可區分的跨模態訊息。
    D: 任一路單獨都缺少另一個狀態，無法由單路驗證選擇解決本題的交互判斷。
