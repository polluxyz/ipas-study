stem: 某雙感測器合成測試有 (0,0)、(0,1)、(1,0)、(1,1) 4 種狀態，各 250 筆。僅兩路狀態不同時標為異常。團隊串接兩路狀態後訓練兩個模型：邏輯迴歸準確率 0.50，含 1 個隱藏層（8 個神經元）的 MLP 準確率 1.00。對這個差距，哪項解讀與對應調整最正確？
options:
  A: 邏輯迴歸的樣本不足，將每種狀態的筆數加倍後可追上 MLP
  B: 邏輯迴歸受輸入尺度影響，將輸入標準化後可追上 MLP
  C: 邏輯迴歸只有線性邊界，加入兩路相乘的特徵後可追上 MLP
  D: 邏輯迴歸尚未收斂完成，將迭代上限加倍後可追上 MLP
answer: C
explanation:
  summary: 線性模型分不開異或關係時，增加資料或訓練步數都無法補救，要先改變模型能表達的邊界。
  correct: 任何一條直線最多分對這 4 種狀態中的 3 種，本例邏輯迴歸實測準確率為 0.50。異常可寫成 x1＋x2－2×x1×x2，加入 x1×x2 後變成線性可分，本例實測準確率為 1.00。MLP 的隱藏層能自行組合出這類非線性關係。指引談的是單一感知器無法處理 XOR；邏輯迴歸同樣只有線性邊界，這個延伸屬補充。
  wrong:
    A: 本例把每種狀態加倍成 500 筆，準確率仍為 0.50。4 種狀態的位置沒有改變，直線一樣分不開。
    B: 本例標準化後準確率仍為 0.50。標準化只平移與縮放座標，不會讓 4 種狀態變成可用直線分開。
    D: 本例把迭代上限加倍後準確率仍為 0.50。問題不在訓練步數，而在線性邊界無法表達這個關係。
