stem: |
  某維護中心今天只能替 1 台設備做預防保養。各設備的本期故障機率已校準，保養後可避免本期故障。甲、乙、丙、丁的故障機率依序為 0.4、0.6、0.2、0.8；每次故障損失依序為 300、100、500、50 單位。保養每台都花 20 單位，未保養且未故障不花費。若要讓這 4 台設備合計的預期總成本最低，最適合保養哪台？
options:
  A: 保養甲設備
  B: 保養乙設備
  C: 保養丙設備
  D: 保養丁設備
answer: A
explanation:
  summary: 保養資源有限時，應比較每台可減少的預期損失。
  correct: 未保養的預期故障損失依序為 120、60、100、40。扣除保養費後，預期可省 100、40、80、20 單位。保養甲可減少最多總成本，雖然甲的故障機率並非最高。
  wrong:
    B: 乙的預期可省成本為 0.6×100−20=40，低於甲的 100。只比較機率而忽略損失大小，無法找出最省的保養對象。
    C: 丙的單次故障損失最大，但預期可省成本只有 0.2×500−20=80，仍低於甲。單次損失不能取代機率加權的比較。
    D: 丁最容易故障，但每次損失較小，預期可省成本只有 0.8×50−20=20。最高機率不等於最高保養效益。
