concepts: [classification-model-selection, human-in-the-loop]
stem: |
  某表單分類系統只能將 10% 案件送人工複核。獨立驗證顯示：校準後的預測信心最低的 10% 案件包含大部分模型錯誤，人工在這批案件的正確率明顯較高。團隊希望維持其餘案件即時自動處理。最適合優先驗證哪項決策設計？
options:
  A: "依校準信心設置轉人工區間，並在複核配額內評估整體錯誤"
  B: "將每類的自動通過門檻一律降低，並在相同資料上評估整體錯誤"
  C: "將所有輸出改用機率最高類別，並在相同資料上評估整體錯誤"
  D: "依表單收到的先後順序抽取 10%，並在複核配額內評估整體錯誤"
answer: A
explanation:
  summary: "在人工配額有限時設計具拒判能力的分類流程。"
  correct: "獨立驗證支持低信心案件集中模型錯誤，且人工對這些案件較準確。優先把這類案件轉人工，可把複核資源用在預期能改善的案件；仍需驗證整體錯誤與配額。"
  wrong:
    B: "降低自動通過門檻會讓更多低信心案件直接自動處理，沒有利用人工對該批案件的相對優勢。"
    C: "只取最高機率類別仍要求每筆自動決策，沒有設計低信心轉人工的分工。"
    D: "到件順序未被證明可辨識模型錯誤，與已有驗證支持的低信心分流相比，不能有效針對問題案件。"
