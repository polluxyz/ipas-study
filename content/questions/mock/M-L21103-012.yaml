stem: 某展覽採用已訓練完成的標準無條件生成對抗網路。服務只需把隨機向量轉成海報紋理，不在線上訓練，也不要求品質評分。為簡化必要推論元件，哪個安排最正確？
options:
  A: 載入判別器，將隨機向量輸入後取得紋理影像
  B: 交替更新生成器與判別器，才取得每張紋理影像
  C: 將真實紋理送入判別器，把真假分數解碼成影像
  D: 載入生成器，將隨機向量輸入後取得紋理影像
answer: D
explanation:
  summary: 標準生成對抗網路的取樣輸出由生成器負責。
  correct: 訓練完成後，生成器已學會由潛在隨機向量產生樣本。本例只要求生成，不含線上訓練或評分，因此必要取樣路徑可只保留生成器。
  wrong:
    A: 判別器通常接收資料樣本並輸出真假判斷，不負責把隨機向量轉成影像。
    B: 交替更新屬於對抗訓練，不是每次取樣的必要步驟，且違反本例不在線上訓練的條件。
    C: 真假分數是判別訊號，標準網路沒有把該分數解碼為完整影像的取樣路徑。
