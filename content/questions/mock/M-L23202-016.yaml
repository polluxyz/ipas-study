stem: 某團隊用隨機森林預測零件退貨。獨立驗證表現尚可，但以節點不純度下降量計算時，具有 20 萬種值的流水序號排名第一。序號沒有已知業務意義，且沒有與其他特徵高度相關。若要檢查序號是否真的改善未見案件的預測，下列做法何者最適合？
options:
  A: 在驗證資料打亂序號，觀察固定模型的預測分數是否下降
  B: 將輸入欄位標準化，重新比較訓練資料的不純度排名
  C: 增加森林的樹木數量，改用更多樹累積序號的不純度下降量
  D: 用序號單獨重訓模型，根據訓練準確率判定其重要性
answer: A
explanation:
  summary: 不純度重要性可能偏好具有很多候選切分的欄位。
  correct: 在未參與訓練的資料打亂序號，會破壞序號與目標的對應。若固定模型的評估分數因此下降，才有證據表示模型利用該欄位取得驗證效益。高基數欄位在訓練時有很多切分機會，不宜只憑不純度排名保留。
  wrong:
    B: 標準化調整數值尺度，不會減少序號的取值數量，也沒有把重要性評估移到未見資料。
    C: 增加樹數可減少隨機波動，卻沒有改變重要性的定義，也沒有檢查未見資料的效益。
    D: 單一序號也可能被高容量模型用來記住訓練資料。訓練準確率高，不代表能改善未見案件的預測。
