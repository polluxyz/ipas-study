stem: 某團隊用逐日資料預測隔日需求，每列的歷史特徵已按當時可得資訊建立。模型是逐列處理的前饋神經網路，不在資料列之間傳遞狀態。團隊要保留未來驗證的意義，同時在訓練時使用隨機小批次。哪項安排最適合？
options:
  A: 先將全體資料隨機洗牌，再按比例分出訓練與驗證
  B: 先依日期切出前段訓練與後段驗證，再洗牌訓練列
  C: 先將整週資料保留為群組，再隨機分配訓練與驗證週
  D: 先依月份分塊，再把奇數月用於訓練、偶數月用於驗證
answer: B
explanation:
  summary: 時間切分與訓練資料的批次順序是不同決策。
  correct: 先保留時間界線，再洗牌訓練列，不會把未來驗證資料加入訓練。本例逐列獨立處理，已建立的歷史特徵也不會因訓練列順序改變而重算。
  wrong:
    A: 全體洗牌後才切分，可能把較晚觀測放進訓練，無法保留未來驗證的目標。
    C: 整週分組可避免同週拆散，但隨機分配週仍可能讓未來週參與較早週的預測。
    D: 交錯月份會讓後面的訓練月晚於前面的驗證月，沒有維持所需的時間方向。
