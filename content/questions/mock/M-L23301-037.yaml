stem: 某設備故障模型有 100 個二元特徵。其中一個保護開關旗標僅有 0.2% 的紀錄為 1，但領域人員指出，這些紀錄可能集中在嚴重故障前。團隊提議在檢查標籤關係前，依低變異規則刪除此欄。哪項判斷最正確？
options:
  A: 先提高旗標中 1 的比例，再以變異大小決定刪留
  B: 先將旗標標準化，再以縮放後的變異決定刪留
  C: 先按無標籤分群的輪廓分數，決定旗標刪留
  D: 先檢查故障關係與驗證表現，再決定旗標刪留
answer: D
explanation:
  summary: 出現次數少的特徵，仍可能有重要的預測價值。
  correct: 低變異只表示多數紀錄的值相同，並不表示少數的 1 與故障無關。本例已有可驗證的領域線索，應檢查標籤關係與保留此欄的驗證效果，避免單憑頻率刪掉稀少但有效的訊號。
  wrong:
    A: 提高 1 的比例會改變特徵分布，無法用來證明原始特徵有無預測價值。
    B: 標準化可以把非定值特徵的變異調成相同尺度，但不能建立旗標與故障的關係。
    C: 輪廓分數衡量群集分離程度，不直接衡量故障辨識能力，不能取代對故障標籤的驗證。
