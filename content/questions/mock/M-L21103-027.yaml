stem: 某設備回覆模型以流暢度、親切度、事實正確性各評 1 至 5 分。候選回覆把電壓規格寫錯，卻因另外 2 項高分而通過平均 4 分門檻。驗收要求關鍵規格不得出錯。最適合如何調整通過規則？
options:
  A: 將流暢度與親切度合併成一項，再沿用平均分門檻
  B: 增加親切度的評分級距，再將各項分數換成百分比
  C: 依各項分數的中位數判定，再沿用相同的通過門檻
  D: 增設關鍵規格錯誤的否決條件，再評其餘品質項目
answer: D
explanation:
  summary: 不能由其他品質分數補償的錯誤，應設為必要通過條件。
  correct: D 將關鍵規格正確列為必要條件，避免流暢與親切的高分抵銷不可接受的事實錯誤。其餘品質仍可評分，但無法讓違反必要條件的回覆通過。
  wrong:
    A: 合併表達維度只改變平均權重，仍可能讓表達分數補償關鍵規格錯誤。
    B: 改評分級距或換算百分比沒有建立關鍵規格的必要條件，事實錯誤仍可被其他高分抵銷。
    C: 三項取中位數時，兩項高分可能直接決定結果，反而容易排除較低的事實正確性分數。
