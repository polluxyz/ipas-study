stem: 某篩選器在固定驗證集有 100 位真正合格者，其中 60 位分數 0.9、20 位分數 0.6、20 位分數 0.2。規則須保留高分優先，且同分者使用相同通過機率。目標是讓合格者「期望通過率」達 70%，不要求單次人數固定。哪項規則最適合？
options:
  A: 0.9 分者通過，0.6 分者以 0.5 機率通過，0.2 分者不通過
  B: 0.9 分者通過，0.6 分者以 0.7 機率通過，0.2 分者不通過
  C: 0.9 分者通過，0.6 分者以 1.0 機率通過，0.2 分者不通過
  D: 0.9 分者通過，0.6 分者以 0.3 機率通過，0.2 分者不通過
answer: A
explanation:
  summary: 分數有同分群時，可用隨機後處理達成指定的期望召回率。
  correct: 期望通過人數為 60+20×0.5=70，除以 100 即為 70%。這個機率規則保持高分優先，也沒有在同分者間採不同規則。單次隨機結果可偏離 70 人。
  wrong:
    B: 期望通過人數為 60+20×0.7=74，對應 74%，超過指定目標。
    C: 期望通過人數為 80，對應 80%。確定式門檻在此同分分布不能取得 70%。
    D: 期望通過人數為 60+20×0.3=66，對應 66%，低於指定目標。
