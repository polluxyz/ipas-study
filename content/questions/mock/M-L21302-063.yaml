concepts: [concept-drift, model-monitoring]
stem: |
  某設備預警模型預測 7 天內是否故障。資料團隊把結果欄位改為 30 天內是否故障，監控仍直接用該欄位比對原模型，錯誤率突然升高。營運本期仍需要 7 天預警。決定是否因概念漂移啟動重訓前，最適合先做哪項檢查？
options:
  A: "調低分類門檻，檢查以新結果欄位計算的召回率是否改善"
  B: "按原有預測期間重建真值，檢查同一任務的品質是否退化"
  C: "增加隨機抽樣數量，檢查以新結果欄位計算的錯誤率是否穩定"
  D: "以近期輸入更新分布基準，檢查輸入與新基準的差異是否縮小"
answer: B
explanation:
  summary: "先排除標籤定義改變造成的監控任務錯配。"
  correct: "7 天故障與 30 天故障是不同預測目標。用較長期間的真值評估原任務，會把期間差異混入錯誤率。先恢復一致的真值定義，才能判斷原任務是否真的退化。"
  wrong:
    A: "降低門檻可能提高新欄位下的召回率，但沒有釐清原有 7 天任務的品質，也可能增加原任務誤報。"
    C: "更多抽樣能提高錯誤率估計的穩定性，卻不能修正把 30 天結果當成 7 天真值的任務錯配。"
    D: "更新輸入基準處理的是分布比較，不能修正真值所涵蓋期間改變的問題。"
