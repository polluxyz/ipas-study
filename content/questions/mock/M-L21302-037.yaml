stem: 某工廠更換相機後，同步部署新版辨識模型。新版發生大量漏判，回放顯示舊模型在新相機影像上也不合格；團隊另有已在新相機驗證的人工抽檢加規則流程。當下要降低漏判風險，最適合採取哪項措施？
options:
  A: 暫停模型自動放行，切入已驗證的替代檢驗流程並調查影像差異
  B: 將入口切回舊模型，依更換相機前的合格紀錄恢復自動放行
  C: 增加新版推論次數，以多次輸出的多數決恢復自動放行
  D: 延長新版的輸入佇列等待時間，以增加每批影像的集中處理量
answer: A
explanation:
  summary: 回復點需要適用於目前輸入條件，不能只依歷史合格紀錄選擇。
  correct: 新相機改變了兩個模型面對的輸入條件，舊模型已無合格的回復證據。先切入已在目前環境驗證的替代檢驗，可降低風險，再調查影像及模型問題。
  wrong:
    B: 舊模型在舊相機上的合格紀錄不能取代新相機驗證；回放已顯示切回仍有漏判風險。
    C: 同一模型的錯誤可能高度一致，重跑及投票不會自動修正新相機引起的系統性問題。
    D: 集中處理主要影響吞吐及延遲，不能改善已觀察到的影像辨識品質。
