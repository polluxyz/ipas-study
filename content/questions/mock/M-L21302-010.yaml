stem: 某購物網站讓 10% 使用者試用新版推薦。一次購物包含多次請求，使用者可能先收藏再結帳。團隊要比較完整購物歷程的轉換率，並限制新版接觸範圍。下列流量安排何者最適合？
options:
  A: 每次請求重新抽籤分版，讓每個請求都有相同機率接觸新版
  B: 以使用者識別碼固定分組，讓同一使用者的購物歷程維持同版
  C: 商品頁使用新版結帳頁使用舊版，讓兩版共同完成同一歷程
  D: 每隔一小時交換兩版流量，讓同一批使用者輪流體驗兩版
answer: B
explanation:
  summary: 跨多次請求的成效驗證要維持適當的分組單位。
  correct: 題目關心使用者完整歷程的轉換率。固定使用者分組可減少同一人交錯接觸兩版，讓完整歷程與對應版本較容易連結，也能控制接觸新版的使用者比例。
  wrong:
    A: 每次重抽會讓同一人於購物歷程中混用兩版，使完整歷程的結果難歸屬某一版。
    C: 以頁面拆版會讓同一歷程同時受到兩版影響，不能形成清楚的新舊版使用者對照。
    D: 每小時換版會使跨時段使用者混用兩版，也可能將時段流量差異混入模型效果。
