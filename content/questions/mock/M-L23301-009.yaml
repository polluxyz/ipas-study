stem: |
  某產線的兩個二元狀態旗標，各自與故障標籤幾乎沒有關聯。但工程師發現，兩旗標不同時容易故障，相同時多為正常。資料量與標註品質已確認。團隊原本打算依單一欄位的相關係數刪掉兩旗標。下列處理何者最適合？
options:
  A: 先刪除兩旗標再增加訓練樣本，讓其他欄位學到原有的狀態差異
  B: 先將兩旗標各自標準化，再以同一相關係數門檻重新決定是否刪除
  C: 先以各旗標的個別出現次數排序，只保留較常出現的旗標作為特徵
  D: 保留旗標並驗證其組合表示，避免單欄篩選漏掉交互作用訊號
answer: D
explanation:
  summary: 辨識單變量篩選可能漏掉組合才有用的特徵。
  correct: 題幹指出故障取決於兩旗標的組合，個別關聯低不代表組合無效。應比較保留原欄與加入組合表示的驗證結果，不能只依單欄統計刪除。
  wrong:
    A: 刪除後就失去旗標組合，增加樣本不會自動補回被移除的訊號。
    B: 線性縮放不會讓原本低相關的單欄變成能表達兩欄組合的特徵。
    C: 出現頻率不是對故障的組合判別能力，只留一欄會丟失比較條件。
