stem: 某分類器的少數類有 40 筆，每筆包含數值金額與 2 個互斥的方案旗標。團隊要先測試一種不產生新欄位值組合的過採樣方法，讓新增列的整列輸入都來自某筆既有少數類資料。哪項最符合要求？
options:
  A: 對少數類近鄰的全部欄位做線性插值，增加合成列
  B: 對少數類數值欄加入小幅高斯雜訊，旗標維持原值
  C: 對少數類的各欄分別有放回抽樣，再組合成新增列
  D: 對少數類的完整資料列有放回抽樣，再加入訓練集
answer: D
explanation:
  summary: 整列複製的過採樣可保留既有類別組合與欄位關係。
  correct: 整列有放回抽樣只重複既有少數類輸入，不會產生金額與方案的新配對。這符合本輪的限制，但重複樣本仍可能增加過擬合，後續須以獨立驗證評估。
  wrong:
    A: 跨欄插值會產生新數值，也可能讓互斥旗標變成分數，不符合整列輸入來自既有樣本的要求。
    B: 旗標雖未改變，金額已被擾動，新增列仍不是某筆既有輸入的整列複製。
    C: 逐欄抽樣保留各欄曾見值，卻可能形成從未出現過的跨欄組合，不等於整列抽樣。
