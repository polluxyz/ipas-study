stem: 某短訊分類器只記錄 80 個關鍵詞各自有無出現，不保留重複次數。團隊要求模型明確估計各類別中「出現」與「未出現」的機率，並把兩者都納入似然。下列樸素貝氏設計何者最適合？
options:
  A: 採多項式事件模型，以各詞出現次數作為輸入
  B: 採高斯事件模型，以各詞標準化數值作為輸入
  C: 採伯努利事件模型，以各詞 0/1 旗標作為輸入
  D: 採多項式事件模型，以各詞相對詞頻作為輸入
answer: C
explanation:
  summary: 依特徵的事件定義選擇樸素貝氏模型。
  correct: 每個詞是否出現是 0/1 事件，符合伯努利模型。其似然包含出現機率與未出現機率，因此能把某個詞未出現的資訊納入分類。這符合題目對事件建模的要求。
  wrong:
    A: 多項式模型以詞的計數建模。未出現詞的計數為 0，不會像伯努利模型那樣加入該詞未出現的機率項。
    B: 高斯模型假設各特徵為連續數值。將旗標標準化不會讓事件定義變成連續測量，也不符合指定的出現／未出現機率模型。
    D: 改用相對詞頻仍是多項式模型的詞權重，不會自動加入每個未出現詞的伯努利機率項。
