stem: 某溫控預測器在 1,000 筆驗證資料的平均絕對誤差為 2°C。驗收規定至少 90% 的預測須落在真值 ±3°C 內。工程師尚未保存誤差分布摘要，但保有逐筆預測與真值。哪項補充最能直接判斷是否達標？
options:
  A: 計算帶符號誤差的平均，再與 3°C 比較
  B: 計算均方根誤差，再與 3°C 比較
  C: 計算真值的標準差，再與 3°C 比較
  D: 計算絕對誤差不超過 3°C 的樣本比例
answer: D
explanation:
  summary: 平均誤差門檻與逐筆容許範圍的達標比例不同。
  correct: 驗收直接指定逐筆容許範圍，因此應統計 |真值−預測|≤3 的筆數，再除以 1,000。平均絕對誤差為 2，只給出平均大小，無法確定是否有至少 900 筆在範圍內。
  wrong:
    A: 帶符號誤差可因正負抵銷而很小，無法得知多少筆落在指定範圍。
    B: 均方根誤差加重較大誤差，仍是平均摘要，無法直接給出 90% 的達標比例。
    C: 真值標準差反映目標資料的分散程度，並非預測誤差是否在範圍內的比例。
