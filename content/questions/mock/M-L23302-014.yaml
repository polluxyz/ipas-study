stem: 某實驗室只有 2,000 筆經確認的正常製程資料，每筆 6 個已縮放特徵。正常區域呈彎曲形狀，故障樣本暫時無法取得。團隊要先學出正常區域的非線性邊界，再篩出邊界外的新樣本。下列方案何者最適合？
options:
  A: 以正常樣本訓練 RBF 核的單類別支援向量機
  B: 以正常樣本訓練二元支援向量機，將正常標成同類
  C: 以正常樣本訓練邏輯迴歸，將正類機率當異常分數
  D: 以正常樣本訓練單群 K-means，將中心所屬群作邊界
answer: A
explanation:
  summary: 依僅有正常樣本與非線性邊界需求選擇新穎樣本偵測模型。
  correct: 單類別支援向量機可僅以正常資料學習其所在區域，RBF 核可表達非線性邊界。這符合先描述正常區域、再檢查新樣本的需求。邊界外只代表偏離正常資料，是否故障仍須查核。
  wrong:
    B: 一般二元支援向量機需要兩個類別才能學習兩類間的分隔。將正常樣本都標同類，無法提供這種對比。
    C: 一般邏輯迴歸需不同類別的標籤來學習分類機率。單一正常標籤不足以建立故障與正常的判別。
    D: 單群 K-means 主要學習平均中心。群號本身不提供正常邊界，也不能表達題目要求的彎曲接受區域。
