stem: 某車隊透過維護站轉送模型套件。裝置會比對套件與同站提供的雜湊清單，但維護站若遭入侵，兩者都可能被替換。裝置已安全保存總部的驗證公鑰，總部簽署私鑰未外洩。哪項啟用條件最能確認套件確由總部核發？
options:
  A: 比對維護站公布的套件雜湊，並檢查套件檔案大小是否相符
  B: 使用預存的總部公鑰驗證套件簽章，通過後才准許啟用
  C: 比對套件的版本名稱與發行時間，再檢查檔案能否正常解壓
  D: 要求維護站先壓縮並加密套件，再由裝置解密後試跑模型
answer: B
explanation:
  summary: 受信任公鑰驗證的簽章能確認發布來源與套件完整性。
  correct: 攻擊者能改動轉送站的檔案與雜湊，卻沒有總部簽署私鑰。以裝置預先信任的公鑰驗證整份套件簽章，可檢查套件是否由對應私鑰核發及是否被更動。
  wrong:
    A: 套件與雜湊同由已遭入侵的站點提供，攻擊者可讓兩者相符，檔案大小也不證明發布身分。
    C: 版本名稱及時間都是可編輯的中繼資料；解壓成功只代表檔案格式可讀。
    D: 轉送站加密有助於傳送保密，但站點本身可加密被替換的套件，不能證明總部核發。
