stem: 某零售商準備導入需求預測模型。團隊在相同的未參與訓練月份比較新模型與「預測值直接取前一週同日銷量」的簡單方法。新模型平均絕對誤差為 12 件，簡單方法為 8 件，其他成本相同。主管只看到新模型訓練誤差很低。對導入成效，何者最正確？
options:
  A: 新模型訓練誤差低，足以證明已優於簡單方法
  B: 新模型使用較多特徵，足以證明有額外預測價值
  C: 新模型尚未在這份比較中展現優於簡單方法的價值
  D: 簡單方法沒有訓練參數，因此不能作為比較對象
answer: C
explanation:
  summary: 新模型需與合理的簡單基準比較未見資料上的表現。
  correct: 兩者在相同保留資料上比較，簡單方法的平均絕對誤差反而較低。新模型訓練分數再好，也不能代替這項增益比較。
  wrong:
    A: 訓練誤差衡量已見資料的擬合情況，不能證明對未見月份比簡單方法更好。
    B: 使用更多特徵不保證泛化表現較好，新增價值須由相同評估條件下的結果支持。
    D: 固定規則也能產生預測，適合作為基準。能否比較不取決於有沒有學習參數。
