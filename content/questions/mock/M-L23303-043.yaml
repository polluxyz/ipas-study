stem: 某設備模型輸出的故障機率已經校準。立即保養每台固定花費 30 單位，且可避免本期故障損失；不保養時，故障才損失 120 單位。沒有其他成本。若預期成本相同時選擇保養，應採哪個最低保養機率門檻？
options:
  A: 故障機率達 0.10 就保養
  B: 故障機率達 0.20 就保養
  C: 故障機率達 0.25 就保養
  D: 故障機率達 0.50 就保養
answer: C
explanation:
  summary: 固定行動成本要與不行動的預期損失比較。
  correct: 保養的成本固定為 30；不保養的預期成本為故障機率乘 120。當機率至少為 30/120=0.25 時，保養成本不高於不保養。保養費不只發生在誤報時，也會用於真正會故障的設備。
  wrong:
    A: 0.10 時不保養的預期成本只有 12，低於保養費 30，此門檻會過早啟動保養。
    B: 0.20 是把 30 與 120 當成兩種錯判成本套用另一種門檻公式的結果。本例保養費是每次行動都支出。
    D: 0.50 是常見預設門檻，沒有使用本例保養費與故障損失的比例。
