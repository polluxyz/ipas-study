stem: 某廠有 240 台辨識裝置，分屬 3 種加速晶片。候選模型只在其中一種晶片的 12 台裝置通過試行，另兩種晶片使用不同的推論引擎。下階段要擴大裝置範圍，哪項驗證設計最適合？
options:
  A: 將同種晶片的試行量增至 24 台，再以合併結果決定其餘裝置更新
  B: 每種晶片先選代表裝置，分別檢查轉換後的品質與持續推論表現
  C: 以候選模型轉換前的驗證分數，作為各種晶片共同的更新依據
  D: 比較各種晶片的標示運算速度，再按標示速度安排全面更新順序
answer: B
explanation:
  summary: 分批部署需要覆蓋不同硬體與推論引擎的實際行為。
  correct: 模型轉換與執行引擎可能帶來支援算子、數值或效能差異。各類硬體都先取代表裝置實測，才能判斷該類裝置是否適合擴大更新。
  wrong:
    A: 增加同類晶片的樣本可加強該類證據，仍未檢驗其他推論引擎的相容性與品質。
    C: 轉換前的分數不能證明各晶片實際執行後維持相同品質，也未涵蓋現場效能。
    D: 標示速度可作初步參考，不能代表模型算子支援、數值結果與持續負載的實際表現。
