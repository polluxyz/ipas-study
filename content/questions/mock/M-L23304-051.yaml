stem: 某企業的教師模型使用裝置不支援的注意力算子。裝置能高效執行另一種小型卷積架構，且兩者的輸入任務與輸出類別一致。團隊有代表性訓練資料，想保留教師的分類能力。最適合優先驗證哪項方案？
options:
  A: 將教師注意力權重轉成低位元，維持原有算子
  B: 稀疏化教師注意力權重，再用原有算子推論
  C: 縮短教師微調的訓練輪數，部署原有模型
  D: 採用小型卷積學生架構，以教師輸出協助訓練
answer: D
explanation:
  summary: 蒸餾能跨架構傳遞預測知識，便於配合裝置支援的運算。
  correct: 學生不必複製教師的內部架構。本例兩者任務與輸出類別一致，可以透過教師的預測訊號協助小型卷積模型學習，再量測學生在目標裝置的品質與速度。
  wrong:
    A: 降低權重精度可減少儲存與部分運算成本，但仍保留裝置不支援的注意力算子。
    B: 將部分權重設為零不等於替換注意力運算，也不能據此讓裝置支援該算子。
    C: 減少微調輪數可以節省訓練資源，卻不改變教師推論時需要的運算種類。
