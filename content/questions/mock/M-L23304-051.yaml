stem: 某工廠用知識蒸餾訓練小型學生模型。教師在亮面與霧面零件上都已通過品質驗證，但蒸餾資料只含亮面零件。學生在亮面資料表現良好，霧面資料表現偏低。正式部署會處理兩種零件，團隊也能取得兩種零件的訓練影像。若先維持學生架構與數值精度，哪項調整最能針對目前缺少的學習訊號？
options:
  A: 增加亮面影像的抽取次數，沿用亮面教師輸出蒸餾
  B: 提高現有教師輸出的權重，沿用亮面影像進行蒸餾
  C: 改由另一個更大教師提供輸出，沿用亮面影像蒸餾
  D: 納入亮面與霧面訓練影像，以對應教師輸出蒸餾
answer: D
explanation:
  summary: 教師會處理某種輸入，不代表學生在未涵蓋該輸入的蒸餾中已學到。
  correct: 學生只在蒸餾使用的輸入上接收教師訊號。現有資料沒有霧面影像，因此尚未讓學生學習教師對霧面零件的判斷。應補入兩種表面的代表性訓練影像，再以未參與蒸餾的資料分別驗證。此調整補足資料涵蓋範圍，仍須實測學生能否學好。
  wrong:
    A: 增加亮面影像的抽取次數，沒有提供教師如何處理霧面輸入的訊號，仍缺少該條件的學習機會。
    B: 提高教師輸出權重只加強現有亮面資料的影響，不會補入霧面條件的輸入與對應輸出。
    C: 現有教師在兩種表面都已通過驗證。更換教師但維持相同資料範圍，仍未讓學生取得霧面條件的學習訊號。
