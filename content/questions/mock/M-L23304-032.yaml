stem: 某梯度提升模型在降低學習率後，固定 100 棵樹的訓練與驗證誤差都比原設定高。資料與其他流程相同，曲線在第 100 棵時仍持續改善。團隊尚有訓練預算，想判斷較低學習率是否有潛力。下一步最適合如何調校？
options:
  A: 增加低學習率配置的樹數，監控驗證誤差
  B: 減少低學習率配置的樹數，監控驗證誤差
  C: 加強低學習率配置的正則化，維持樹數
  D: 擴大低學習率配置的驗證集，維持樹數
answer: A
explanation:
  summary: 降低每次提升幅度時，可能需要更多提升步驟。
  correct: 學習率降低後，每棵樹對整體預測的修正較小。本例曲線在既定樹數下仍改善，且訓練與驗證都變差，應增加樹數並監控驗證誤差，檢查學習率與樹數的搭配，而非直接判定低學習率無效。
  wrong:
    B: 減少樹數會進一步減少已偏小的累積修正，無法檢查多訓練是否能改善。
    C: 加強正則化主要限制擬合能力，沒有處理低學習率可能需要更多提升步驟的問題。
    D: 增加驗證資料可改變評估精度，但維持樹數仍無法檢查學習進度不足的假設。
