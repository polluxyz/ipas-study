stem: 某迴歸模型用公里表示距離，另一版本改用公尺，兩者都以相同數值的 λ 懲罰距離係數的平方，截距不懲罰。工程師希望兩版本受到相同實際強度的限制。下列處理何者最適合？
options:
  A: 把兩版本的距離都減去平均值後再訓練
  B: 把距離統一縮放到相同尺度後再訓練
  C: 將兩版本的訓練筆數各增加相同倍數
  D: 把兩版本的距離都做平方展開後再訓練
answer: B
explanation:
  summary: 係數懲罰的實際強度會受到特徵單位影響。
  correct: 同樣的預測關係換成公尺後，距離係數會變成原來的 1/1000，平方懲罰因而改變。先統一特徵尺度，可讓相同 λ 的限制具有可比較的意義。
  wrong:
    A: 移除平均值會改變中心位置，卻沒有消除公里與公尺的尺度差異。
    C: 增加筆數可能影響估計穩定度，但兩版本的單位差異仍會造成不同的懲罰。
    D: 平方展開可以增加非線性表示，卻會保留甚至放大兩種單位的尺度差異。
