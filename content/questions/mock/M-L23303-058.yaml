stem: 某用量模型在甲區與乙區各評估 500 筆樣本。兩區均方根誤差都為 5 度。真值的變異數以樣本數作分母，甲區為 100，乙區為 25。依 R²=1−均方誤差／真值變異數，哪項判斷最正確？
options:
  A: 甲區 R² 較高，表示甲區平均平方誤差較低
  B: 乙區 R² 較高，表示乙區真值較容易預測
  C: 甲區 R² 較高，但兩區均方根誤差相同
  D: 兩區 R² 相同，因為兩區均方根誤差相同
answer: C
explanation:
  summary: 不同真值變異會使相同均方誤差對應不同 R²。
  correct: 兩區均方誤差都是 25。甲區 R²=1−25/100=0.75，乙區為 0。甲區相對於該區平均數基準改善較多，不能因此推論其絕對誤差較小。兩區的均方根誤差同為 5 度。
  wrong:
    A: 甲區 R² 較高來自真值變異較大，兩區平均平方誤差都為 25。
    B: 乙區 R² 是 0，低於甲區；較小的真值變異不代表這個模型預測得較好。
    D: R² 還取決於真值變異，不能只由均方根誤差決定。
