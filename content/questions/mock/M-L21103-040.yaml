codes: [L21103]
concepts: [generation-safety-alignment]
stem: |
  某科普教材助理的內容政策允許介紹爆炸的物理原理，但禁止提供製作爆裂物的操作步驟。現有護欄只要看到「爆炸」就拒答，連合規教材也無法產出。團隊已有涵蓋兩類需求的人工標註測試集。下一輪最適合採取哪項改進？
options:
  A: 將「爆炸」的同義詞加入拒答字表，以違規攔截率驗收
  B: 對含「教材」的請求開放通行，以教材完成率作為驗收
  C: 依請求用途與內容判別，以違規放行及合規誤拒共同驗收
  D: 將「爆炸」從拒答字表移除，以整體請求通過率作為驗收
answer: C
explanation:
  summary: 內容護欄要辨識政策界線，並同時衡量放行與誤拒。
  correct: 同一詞彙可能出現在允許與禁止的需求中。依用途及實際內容判斷，再用兩類標註資料檢查違規放行與合規誤拒，才有證據確認政策是否落實。
  wrong:
    A: 擴充字表會攔下更多用詞相近的請求，但仍沒有區分科普原理與操作步驟，也可能增加合規教材的誤拒。
    B: 在請求加上教材字樣，不代表後續內容符合教材政策。單看教材完成率也無法發現違規步驟被放行。
    D: 移除詞彙可降低部分誤拒，卻沒有建立操作步驟的辨識方法。整體通過率無法區分有益放行與違規放行。
