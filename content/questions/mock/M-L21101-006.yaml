stem: 某零件客服的詞袋分類器將「微型連接器」切成數個常用詞，難以與其他連接器區分。團隊已有 400 筆人工確認的領域詞，現有斷詞器支援自訂字典，分類演算法與標註資料量暫不變，但允許重新擬合。最直接的試驗為何？
options:
  A: 將領域詞全部改寫成同一個未知詞，再以現有斷詞結果重新分類
  B: 把每份文件隨機打散成字串，讓模型減少對專業詞順序的依賴
  C: 只增加分類器輸出類別，讓模型替沒有保留的專業詞自行命名
  D: 把領域詞加入斷詞字典，固定驗證集比較切詞與分類結果
answer: D
explanation:
  summary: 領域詞邊界與下游文字特徵。
  correct: 本例使用詞袋特徵，切詞決定有哪些詞可供分類。利用已確認詞表測試自訂字典，能直接檢驗專業詞邊界是否改善；效果仍以固定驗證資料判定。
  wrong:
    A: 把不同領域詞合成同一未知詞會再損失區別，不能保留零件種類。
    B: 打散字串破壞詞彙結構，無法改善既有專業詞的切分。
    C: 增加輸出類別不會改變輸入的切詞，也沒有提供被移除的詞邊界。
