stem: 某團隊準備挑選 3 個二元分類器組成多數決模型。各候選在相同驗證集的準確率都為 90%，部署資源也達標。目前只收到單一模型分數，尚未取得逐筆預測。若要比較不同組合的互補性，下列資訊何者最有用？
options:
  A: 各模型訓練所需時間，以及訓練資料的總筆數
  B: 各模型在同一案件上的錯誤重疊，以及組合後的預測結果
  C: 各模型的檔案容量，以及可訓練參數的總數
  D: 各模型使用的演算法名稱，以及模型架構的相似程度
answer: B
explanation:
  summary: 相同的個別準確率，可能對應很不同的集成表現。
  correct: 多數決是否改善，要看同一案件上有多少模型同時犯錯。錯誤若高度重疊，個別分數相同也未必有集成效益。逐筆預測可直接比較候選組合，不能只用演算法名稱推論互補性。
  wrong:
    A: 時間與筆數影響開發成本，但不能指出哪些模型在同一案件互補，無法由此推估多數決錯誤。
    C: 容量與參數量影響部署資源，卻沒有提供錯誤是否重疊的資訊。本題候選已通過資源門檻。
    D: 不同架構可能產生多樣性，也可能學到相同錯誤。名稱與結構差異不能代替逐筆結果。
