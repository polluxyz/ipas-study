stem: 某交易模型要求每筆實際交易各占 1 列。交易 T101 與 T102 是不同的真實交易，但顧客、時間、品項、金額與標籤恰好相同。T101 因匯入重試，又在另一匯入批次出現一次，交易內容未變。交易編號由來源系統保證唯一，匯入批次只代表搬移作業。為保留真實交易次數，哪項資料清理方式最適合？
options:
  A: 以顧客、時間、品項與金額比對，相同組合保留 1 列
  B: 以來源交易編號比對，同一交易跨匯入批次保留 1 列
  C: 以來源交易編號比對，同編號出現多次便全部剔除
  D: 以匯入批次與交易編號比對，各批次同交易保留 1 列
answer: B
explanation:
  summary: 資料清理須依實際觀察單位辨識事件，不能只看輸入值相同。
  correct: 本例的觀察單位是實際交易，來源交易編號可辨識交易身分。T101 的再次匯入應合併，T102 則須保留。輸入與標籤相同的不同交易，仍各自代表真實發生的事件。
  wrong:
    A: T101 與 T102 在這些欄位相同，按此組合會將不同交易合併，少算實際事件。
    C: 再次匯入不表示原本交易無效。將 T101 的全部列剔除，會連有效交易一起刪掉，應保留其中 1 列。
    D: T101 出現在不同匯入批次，兩份都會留下。匯入批次區分搬移作業，不能取代實際交易的身分。
