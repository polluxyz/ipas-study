stem: 某平台用顧客的職業類別做近鄰比對。職業代碼原為 1、2、3，資料整理後改成 10、20、900，職業內容沒有改變。工程師直接以代碼計算歐氏距離，發現鄰居排序明顯改變。若要避免任意代號大小主導這項距離，哪項修正最適合？
options:
  A: 將職業代碼做 Z 分數標準化，再計算距離
  B: 將職業類別做獨熱編碼，再計算距離
  C: 將職業代碼除以該欄最大值，再計算距離
  D: 將職業依出現頻率排序編號，再計算距離
answer: B
explanation:
  summary: 任意類別代號不具有可解釋的距離。
  correct: 直接計算代碼差，會把任意編號差解讀成職業相似程度。獨熱編碼以類別身分建立欄位，不會因同一職業的代號改變而改變類別間的距離。
  wrong:
    A: 標準化改變整體尺度，仍保留任意代碼差的相對大小，沒有消除人為距離。
    C: 除以最大值只縮小數值，仍把編號差當作職業差異，不能修正無序類別的意義。
    D: 頻率排名描述職業出現的多寡，排名相近不表示職業相似，仍引入額外的距離假設。
