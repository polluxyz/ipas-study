stem: 某研究平台把 6 位數會員碼轉成未加鹽的雜湊後分享。攻擊者知道會員碼的格式，也取得相同的雜湊演算法。團隊聲稱演算法沒有反解函式，因此會員碼不可能被找出。針對這項聲稱，何者最正確？
options:
  A: 需先取得研究平台的私鑰，才可產生候選會員碼的相同雜湊
  B: 可列舉格式內的候選碼並比對雜湊，未必需要反解演算法
  C: 需先找到兩個不同會員碼的雜湊碰撞，才可比對目標會員碼
  D: 猜測難度主要由摘要位元數決定，會員碼的取值範圍影響較小
answer: B
explanation:
  summary: 雜湊難以反解，不代表低變化輸入無法被列舉猜中。
  correct: 已知格式限定了可嘗試的會員碼範圍。攻擊者可對候選值執行同一雜湊，再與分享值比對；這是猜測驗證，不必設計反解函式。
  wrong:
    A: 題目使用的是未加鹽的一般雜湊，不是以私鑰簽章或使用祕密金鑰的驗證碼，計算候選雜湊不需要平台私鑰。
    C: 碰撞是不同輸入得到相同摘要，與逐一嘗試可能的原始會員碼是不同問題；猜測驗證不以找到碰撞為前提。
    D: 較長摘要有助於抵抗碰撞等攻擊，卻不會增加可能的會員碼數量。列舉猜測主要受輸入範圍與每次計算成本影響。
