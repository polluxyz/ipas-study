stem: |
  某聯盟以聯邦學習交換 20 家機構的模型更新。原始資料留在本地，但中央聚合端目前會解開傳輸加密，讀到每家更新。內部安全要求中央只能取得約定的更新總和，不能查看單家更新，且已有可接受串通範圍的協議方案。最適合新增哪項控制？
options:
  A: "部署更強的傳輸加密，更新由中央解密後進行聚合"
  B: "部署集中式儲存加密，更新由中央按需解密後進行聚合"
  C: "部署符合串通假設的安全聚合，依協議完成更新總和運算"
  D: "部署短期更新檔保存，更新在完成中央聚合後刪除"
answer: C
explanation:
  summary: "把通訊保護與聚合端可見資訊的限制分開。"
  correct: "安全聚合可透過安全多方計算等協議，只讓中央取得約定聚合結果。保護須建立在協議的參與人數與串通假設上；聯邦學習本身或傳輸加密不等於隱藏單家更新。"
  wrong:
    A: "傳輸加密保護傳送途中，中央作為解密接收端仍可看見單家更新。"
    B: "儲存加密保護落地檔案，中央在運算時解密後仍可讀取單家輸入。"
    D: "縮短保存時間可降低長期留存風險，但中央在加總當下仍已接觸單家更新。"
