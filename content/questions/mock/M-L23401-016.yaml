stem: |
  某聯邦學習平台已採安全聚合，中央依協議只能看見本輪更新總和。平台仍會發布參與機構很少的輪次結果。稽核發現，接收者結合外部資訊，仍可能從精確總和推知單家機構的更新。若保留安全聚合，且以單家機構為保護單位，最適合補哪項控制？
options:
  A: "訂最低發布參與數，並增加安全聚合金鑰長度與定期輪替各機構金鑰"
  B: "訂最低發布參與數，並每輪隨機更換各機構代號再發布精確總和"
  C: "訂最低發布參與數，並依機構貢獻上限為結果設計機構層級差分隱私"
  D: "訂最低發布參與數，並改發布更新的精確算術平均與本輪參與數"
answer: C
explanation:
  summary: "安全聚合隱藏個別輸入，仍須管理聚合結果的推論風險。"
  correct: "安全聚合限制運算過程可見的個別輸入，無法消除精確結果本身可推知的資訊。應設定最低發布參與數，並以整家機構為單位限制更新貢獻，再設計擾動及跨輪隱私預算。參與門檻本身不提供差分隱私保證。指引提及聯邦學習的參數推導風險；安全聚合的保護邊界與機構層級差分隱私屬補充，依據為[安全聚合原始論文](https://arxiv.org/abs/1611.04482)與[客戶端層級差分隱私研究](https://arxiv.org/abs/1712.07557)。"
  wrong:
    A: "門檻可排除參與數過少的輪次；金鑰強度及輪替可降低密碼機制遭破解的風險。但達門檻後，接收者仍取得精確總和，並能分析總和所含的資訊。"
    B: "門檻可排除參與數過少的輪次，但更換代號不會改變精確總和，也不會消除外部資訊。代號處理不能取代對結果發布的隱私控制。"
    D: "門檻可排除參與數過少的輪次，但平均更新乘以已知參與數即可還原總和，仍保留相同的精確資訊。這項格式調整沒有降低結果的推論風險。"
