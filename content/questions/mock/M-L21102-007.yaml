stem: 某偵測器只輸出 2 個同類貨箱框，分數為 0.92 與 0.88，框的 IoU 為 0.60。兩框都通過分數門檻。後處理規則是先保留高分框，再刪除與它的 IoU 大於抑制門檻的低分框。抑制門檻由 0.50 改為 0.70 時，保留框數如何改變？
options:
  A: 由 2 個變成 1 個，因為門檻提高會刪除更多低分框
  B: 維持 1 個，因為同類物件在後處理最多只能保留 1 框
  C: 維持 2 個，因為通過分數門檻後不再比較框的重疊
  D: 由 1 個變成 2 個，因為 0.60 不再大於抑制門檻
answer: D
explanation:
  summary: 抑制門檻提高時，符合重疊刪除條件的框可能變少。
  correct: 門檻為 0.50 時，0.60 大於 0.50，低分框被刪除，只留高分框。改成 0.70 後，0.60 未超過門檻，兩框都留下。這是非極大值抑制的規則，不能與偵測評估的合格門檻混為一談。
  wrong:
    A: 本題刪除條件是 IoU 大於門檻，提高門檻會讓刪除條件更難成立，方向與選項相反。
    B: 同類並不代表只能保留一框。是否刪除還取決於框的重疊與指定抑制門檻。
    C: 分數篩選與重疊抑制是兩個判斷，通過分數篩選的框仍可能被後處理刪除。
