stem: 某模型有 3 個混合權重。系統要求每個權重非負且總和等於 1，這是每次輸出的硬性規則。工程師只對違規程度加入有限大小的懲罰，得到權重 (-0.02,0.42,0.60)。下列修正何者最符合需求？
options:
  A: 只增加資料筆數，讓更多觀測取代權重的範圍限制
  B: 對三個權重取絕對值後直接輸出，以修正非負條件
  C: 只降低訓練損失，將權重總和等於 1 當作驗收條件
  D: 在求解時明確施加非負及總和為 1 的可行域限制
answer: D
explanation:
  summary: 硬性限制需要由可行域或等效參數化保證。
  correct: 有限懲罰可以在訓練目標與違規程度間折衷，不能單憑它保證每次滿足硬性規則。明確限制可行域，才能同時約束非負與總和。
  wrong:
    A: 增加資料量不會自動把參數限制在指定區域內。範圍限制仍須由求解方式處理。
    B: 取絕對值後總和變成 1.04。這個操作只處理符號，未同時滿足總和限制。
    C: 權重總和已是 1，但第 1 個權重仍為負。只檢查總和不足以滿足兩項規則。
