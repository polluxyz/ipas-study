stem: 某商場要預測每位入場會員是否購物，來源有完整入場表與只記錄成交者的交易表。工程師用內連接合併，產生的訓練資料只剩有交易者。最適合如何修正資料準備？
options:
  A: 以入場紀錄為母表做左連接，確認交易回收完整後標記是否購物
  B: 以交易紀錄為母表做左連接，保留每筆成交交易對應的會員資料
  C: 維持內連接並增加成交資料筆數，讓不同金額的購物樣本更齊全
  D: 維持內連接並按交易金額分層，讓高額與低額購物者比例接近
answer: A
explanation:
  summary: 資料連接方式不能排除任務要預測的對象。
  correct: 任務母體是入場會員，必須保留未購物者。以入場表為母表連接，並確認觀察期間及交易回收完整，才能把未找到成交的入場紀錄標成未購物，建立正負兩類。
  wrong:
    B: 以交易為母表仍只包含成交事件，不能恢復未購物的入場會員。
    C: 增加成交者樣本仍然缺少未購物者，資料量無法修正選取母體錯誤。
    D: 金額分層只能調整成交者內部的分布，不能補回被內連接排除的未購物者。
