stem: 某製造商要補齊零件重量的缺值。已知零件有多種尺寸，尺寸與材質欄位完整，兩者能解釋大部分重量差異。用全體平均重量補值後，大型與小型零件都出現明顯偏差。若願意增加建模成本，哪項補值策略最值得優先驗證？
options:
  A: 將全體平均重量改為全體重量中位數
  B: 將每個重量缺值改為最近一筆已知重量
  C: 用尺寸與材質預測缺失的零件重量
  D: 將每個重量缺值改為最常出現的重量
answer: C
explanation:
  summary: 以相關特徵改善全體單一值補值的不足。
  correct: 預測補值能利用尺寸與材質對應的重量差異。它比全體單一代表值更能表達大小零件的不同，但仍須用保留資料檢查補值效果。
  wrong:
    A: 中位數可減少極端值影響，仍讓不同尺寸使用相同補值，沒有處理本例的群體差異。
    B: 資料列相鄰不代表尺寸與材質相近，最近一筆重量未必適合這個零件。
    D: 眾數仍是全體共用的單一重量，無法利用尺寸與材質已提供的資訊。
