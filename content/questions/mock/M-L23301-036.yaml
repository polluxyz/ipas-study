stem: 某維修模型使用「距上次維修天數」。新設備尚未維修時欄位留空；舊設備也可能因紀錄傳輸失敗而留空。設備是否曾維修可由資產表取得。團隊希望區分這兩種狀況，也保留今天剛維修的設備。哪項設計最適合？
options:
  A: 將兩種空值都填為 0，另保留設備出廠年齡
  B: 將兩種空值都填為中位數，另保留設備型號
  C: 將兩種空值都填為最大天數，另保留維修費用
  D: 新增曾維修與紀錄缺失旗標，再處理天數空值
answer: D
explanation:
  summary: 結構上不適用與紀錄遺失，應使用可辨識的特徵。
  correct: 未曾維修的設備沒有上次維修日期，傳輸失敗則是既有紀錄未取得。兩個旗標可保留這項差異；今天剛維修的天數為 0，也不會與未曾維修混在一起。天數仍可使用一致的補值流程。
  wrong:
    A: 0 也是今天剛維修的合法值。出廠年齡無法直接辨識未曾維修與傳輸失敗。
    B: 中位數會為兩種不同原因賦予相同天數，設備型號也無法指出個別設備是否遺失紀錄。
    C: 最大天數會把空值解讀成很久未維修。維修費用不保證能區分兩種空值原因。
