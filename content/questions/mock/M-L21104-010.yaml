stem: 某圖文模型判斷「紅杯在藍盤左邊」是否符合圖片。測試集有 400 組資料，模型得分很高。團隊懷疑模型只記住常見物件，沒有理解相對位置。哪種補測最能直接檢驗這項疑慮？
options:
  A: 增加含杯子與盤子的相似照片，保留原本的描述分布
  B: 將每張圖片做亮度調整，確認調整前後的預測一致
  C: 成對交換左右位置或描述關係，檢查判斷是否隨之改變
  D: 將描述轉成相同意思的近義句，確認文字變化可被接受
answer: C
explanation:
  summary: 以受控關係變化檢驗模型是否理解跨模態位置關係。
  correct: 保持杯子與盤子等物件不變，只改變左右關係，能讓物件共現線索失去區別力。模型應依圖片與描述是否匹配而改變判斷。測試時須重新確認每一組配對的真值。
  wrong:
    A: 新增相同物件分布可能繼續獎勵物件共現捷徑，無法隔離相對位置的理解能力。
    B: 亮度測試檢查影像擾動的穩定性，並未改變左右關係，不能直接回答關係理解問題。
    D: 近義句測試語句表示的穩定性，但關係真值不變，無法直接確認模型是否使用位置資訊。
