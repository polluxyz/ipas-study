subject: 1
type: 情境
codes: [L23203]
concepts: [autoencoder]
stem: |
  某工廠有 2,000 張清晰零件影像，可模擬部署相機常見的感測雜訊。團隊以自編碼器改善影像，要求輸出保留零件細節並去除雜訊。若可建立同一張圖的清晰與加噪版本，最適合的訓練資料配對為何？
options:
  A: "輸入加噪版本，目標為同一零件的清晰版本"
  B: "輸入清晰版本，目標為同一零件的加噪版本"
  C: "輸入加噪版本，目標為相同的加噪版本本身"
  D: "輸入清晰版本，目標為相同的清晰版本本身"
answer: A
explanation:
  summary: "將自編碼器的重建目標對齊去噪任務。"
  correct: "受擾輸入配上對應清晰目標，會讓重建損失評估雜訊去除後的內容。模型可學習從加噪影像恢復同一零件，而不是只複製輸入。"
  wrong:
    B: "這個方向要求模型從清晰圖產生受擾圖，與部署時希望移除雜訊的方向相反。"
    C: "以相同受擾圖作目標，並未在訓練目標中區分零件細節與要去掉的感測雜訊。"
    D: "這是清晰資料的自身重建，沒有利用已可建立的加噪與清晰配對來訓練受擾輸入的恢復能力。"
