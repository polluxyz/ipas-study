stem: 某材料搜尋系統會收到訓練時未出現的英文衍生詞。測試確認這些新詞包含多個已充分訓練的字元片段。團隊需要先組出新詞向量，不要求同一詞隨句子改變表示。哪個方案最適合？
options:
  A: 沿用整詞查表的 GloVe，將現有詞向量補零以增加向量維度
  B: 採用單詞詞袋，將詞彙表外的字串忽略後計算文件詞頻
  C: 沿用整詞查表的 Word2Vec，將新詞統一映射到未知詞向量
  D: 採用 FastText，利用已學得的字元子詞向量組合新詞表示
answer: D
explanation:
  summary: 已學過的子詞可為未登錄整詞提供組合表示。
  correct: FastText 會共享字元子詞的表示。本例新詞的多個片段已有訓練訊號，因此可利用片段組合向量。這提供可用的表示途徑，語意品質仍需另行測試。
  wrong:
    A: 補零只改向量長度，不會建立未登錄整詞的查表項目，也不會學得子詞關係。
    B: 忽略詞彙表外字串會丟失新詞資訊，無法產生本例要求的新詞向量。
    C: 未知詞共用向量無法利用各新詞的片段差異，未達成為不同新詞組合表示的需求。
