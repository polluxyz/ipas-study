stem: 某團隊比較 4 種正則化強度。儀表板的訓練總損失都包含各自強度的懲罰項，數值差距很大。上線目標是降低新訂單的金額預測誤差，沒有權重大小的額外驗收條件。為公平選模，最適合以哪項數值排序？
options:
  A: 包含正則化懲罰的最低訓練總損失
  B: 不包含正則化懲罰的平均訓練誤差
  C: 完成訓練後的模型權重平方和
  D: 同一驗證集上不含懲罰的預測誤差
answer: D
explanation:
  summary: 不同懲罰強度下，應用共同的驗證指標比較預測品質。
  correct: 正則化強度改變了訓練目標中懲罰項的比重。用同一驗證集、同一誤差定義評估，才能比較各模型對新訂單的預測能力。
  wrong:
    A: 各模型的總損失包含不同強度的懲罰，數值不只反映預測誤差；直接排序會把不同的訓練目標混在一起。
    B: 去掉懲罰項仍未解決使用訓練資料評估的問題。模型可能把訓練誤差壓低，卻對新訂單預測較差。
    C: 權重平方和反映參數幅度，不能單獨表示預測準確程度。本例也沒有要求以權重大小選模。
