stem: 某團隊做 5 折交叉驗證，得到平均準確率 0.82，折間標準差 0.04。5 個模型的訓練資料彼此大量重疊。主管想直接把 0.82±0.04 標成「95% 信賴區間」。對這份報告，何者最正確？
options:
  A: 標成平均泛化表現的 95% 信賴區間
  B: 標成含 95% 未來折分數的預測區間
  C: 標成平均準確率與折間標準差的摘要
  D: 標成新案件個別預測誤差的涵蓋範圍
answer: C
explanation:
  summary: 折間標準差不是平均泛化表現的 95% 信賴區間。
  correct: 標準差描述這 5 個分數的離散程度，沒有自動提供 95% 涵蓋率。各折訓練資料重疊也使分數相關。若要報信賴區間，須說明估計對象與適合資料結構的估計方法。
  wrong:
    A: 折數不能把 1 個標準差自動轉成具有指定涵蓋率的區間。
    B: 這份摘要沒有建立未來折分數的預測分布，平均加減 1 個標準差也沒有 95% 涵蓋率的保證。
    D: 折分數的波動不是單一案件的預測不確定性，不能套用到個別案件。
