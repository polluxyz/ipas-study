stem: 某團隊對一個 768×768 權重矩陣使用 LoRA。基底權重凍結，更新矩陣分解為 B(768×8) 與 A(8×768)，只訓練 A、B，不計偏差或其他層。新增可訓練參數共有多少？
options:
  A: 12,288
  B: 589,824
  C: 6,144
  D: 602,112
answer: A
explanation:
  summary: LoRA 可訓練參數。
  correct: A 有 8×768=6,144 個參數，B 也有 6,144 個。合計 12,288；凍結基底不列入可訓練參數。
  wrong:
    B: 這是基底矩陣的 768×768 個參數，題目已將基底凍結。
    C: 這只計算了 A 或 B 的其中一個矩陣，另一個也要訓練。
    D: 這把凍結基底與低秩矩陣全部相加，混淆儲存參數與可訓練參數。
