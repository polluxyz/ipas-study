stem: 某多標籤影像模型每張輸出 [刮傷,裂紋] 兩個獨立機率，兩者可同時成立。以各欄機率至少 0.5 判為 1。兩張圖的真值為 [1,1]、[0,1]，輸出機率為 [0.8,0.4]、[0.2,0.7]。驗收規則要求一張圖的全部標籤都正確才算該張正確。此規則下正確率為多少？
options:
  A: 25%，因為只有 1 個標籤判斷錯誤。
  B: 50%，因為只有第 2 張的整組標籤正確。
  C: 75%，因為 4 個標籤判斷中有 3 個正確。
  D: 100%，因為每張圖最高機率的標籤都正確。
answer: B
explanation:
  summary: 多標籤的整組正確率與逐標籤正確率不同。
  correct: 門檻化後預測為 [1,0]、[0,1]。第 1 張漏掉裂紋，因此整張不算正確；第 2 張才完全符合真值。整組正確率是 1/2=50%。逐標籤的 3/4=75% 回答另一個評估問題，不能替代題目指定規則。
  wrong:
    A: 1/4 是錯誤標籤所占比例，不是整張圖全部標籤正確的比例。
    C: 這是逐標籤正確率，會把第 1 張部分正確的結果納入。
    D: 只保留最高機率標籤忽略了同張圖可以有多個真實標籤。
