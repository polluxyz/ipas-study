stem: 某受控研究平台追蹤受試者的多次量測。分析人員只需代碼；發生量測異常時，另由獲授權的聯絡小組找回本人安排複測。團隊希望分析資料不直接顯示姓名。最適合採哪項資料設計？
options:
  A: 逐次產生獨立亂碼，刪除受試者與各次量測的對照
  B: 使用穩定代碼，將身分對照表限給聯絡小組存取
  C: 只保留每個年齡層的平均值，刪除個人量測紀錄
  D: 將不同受試者合併成群組代碼，保留群組量測紀錄
answer: B
explanation:
  summary: 受控回連需求適合以代碼及分開授權的對照表處理。
  correct: 穩定代碼可連結同一受試者的多次量測。身分對照表另由聯絡小組受控使用，讓分析人員不直接取得姓名，並保留必要的複測聯絡能力。這是可回連的去識別化設計，仍需管理識別風險。
  wrong:
    A: 逐次獨立換碼並刪除對照，會失去同一人的跨次關聯，也無法依異常量測找到本人複測。
    C: 年齡層平均值可支援群體統計，卻無法追蹤個人變化或定位需要複測的受試者。
    D: 群組代碼會混合不同受試者的紀錄，不能準確連結同一人的多次量測及聯絡身分。
