stem: 某企業有 5,000 筆獨立樣本，沒有時間與群組限制。評估要求每筆樣本輪流接受一次驗證，且每次模型至少使用 80% 樣本訓練。每次訓練固定耗時 20 分鐘，可用總時間為 3 小時，所有訓練依序執行。下列驗證方式何者最符合需求？
options:
  A: 將資料分成 10 折，輪流保留 1 折驗證
  B: 將資料分成 5 折，輪流保留 1 折驗證
  C: 每次保留 1 筆驗證，遍歷全部樣本
  D: 隨機保留 20% 驗證，只訓練及評估一次
answer: B
explanation:
  summary: 交叉驗證折數需要同時符合資料利用與運算預算。
  correct: 5 折驗證每次使用 80% 樣本訓練，每筆輪流驗證一次。5 次訓練合計 100 分鐘，符合 180 分鐘的預算。
  wrong:
    A: 10 折需訓練 10 次，共 200 分鐘。雖然每次訓練樣本較多，仍超過可用時間。
    C: 留一法需訓練 5,000 次，每次用較多樣本，卻遠超過總時間限制。
    D: 單次保留法只讓 20% 樣本接受驗證，其餘樣本沒有輪流作為驗證資料。
