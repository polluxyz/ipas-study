stem: 某知識助理先檢索 100 段，再以重排模型選出 10 段。失敗案例的必要證據根本未進入前 100 段，但團隊提議只更換更大的重排模型。對這項方案的判斷，何者最正確？
options:
  A: 應先改善候選召回，再評估重排是否需要更換
  B: 應先增加重排模型容量，再維持相同候選集合
  C: 應先把最終段落數提高到 100，再維持原檢索
  D: 應先提高生成答案的長度，再重測目前的候選
answer: A
explanation:
  summary: 候選集合缺少證據時，單靠候選內重排無法修復。
  correct: 重排的輸入只有已檢索的候選，必要證據不在集合內便沒有被選出的機會。應先檢查入庫、切塊與初步檢索，再評估候選排序品質。
  wrong:
    B: 更大模型可能改善候選內的順序，但沒有取得候選外的證據，無法直接解決本例缺漏。
    C: 將全部候選送入生成仍然缺少必要證據，還會增加無關內容與輸入成本。
    D: 生成長度不會改變檢索集合，寫出更多文字也不代表取得缺少的依據。
