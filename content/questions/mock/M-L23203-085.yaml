stem: |
  某設備連續 3 秒的訊號為 1、2、-1。系統每秒都要判斷截至該秒的累積訊號是否大於 1.5，超過時標為 1，否則標為 0。工程師用單向循環神經網路做簡化測試，初始狀態為 0，以下設定使每步表示等於目前累積值。

  out[:, t, :] 是第 t 步讀完後的表示。head 會對每個時間步的最後一軸套用同一分類器，並保留時間位置；分類時取 2 個分數中較大者的索引。應如何選取資料交給 head，才能完成逐秒判斷？
code: |
  import torch
  rnn = torch.nn.RNN(1, 1, nonlinearity='relu',
                     batch_first=True, bias=False)
  head = torch.nn.Linear(1, 2)
  with torch.no_grad():
      rnn.weight_ih_l0.fill_(1.0)
      rnn.weight_hh_l0.fill_(1.0)
      head.weight.copy_(torch.tensor([[-1.0], [1.0]]))
      head.bias.copy_(torch.tensor([1.5, -1.5]))
  x = torch.tensor([[[1.0], [2.0], [-1.0]]])
  out, _ = rnn(x)
  # 選取資料交給 head，再用 argmax(dim=-1) 取得逐秒標籤
code_lang: python
options:
  A: 取 out 的最後一步，複製成 3 份再交給 head
  B: 取 out 的第一步，複製成 3 份再交給 head
  C: 取 x 的每個時間步，逐秒交給同一個 head
  D: 取 out 的每個時間步，逐秒交給同一個 head
answer: D
explanation:
  summary: 逐秒分類需要每個時間步的累積表示，不能只用單一時間步代替整段。
  correct: 循環網路的 3 步表示依序為 1、3、2。將完整 out 交給 head，可分別得到分數 [0.5,-0.5]、[-1.5,1.5]、[-0.5,0.5]，標籤依序為 0、1、1。每秒的表示都保留截至該秒的歷史資訊，並對應該秒的判斷。
  wrong:
    A: 最後一步的累積值是 2，複製後標籤全為 1。這把整段結尾的判斷套到每秒，第 1 秒尚未累積到 2。
    B: 第一步的累積值是 1，複製後標籤全為 0。後續讀值帶來的變化沒有傳入各秒的分類。
    C: x 只保留當秒讀值，沒有循環網路累積的歷史資訊。分類結果為 0、1、0，第 3 秒會因只看到 -1 而判錯。
