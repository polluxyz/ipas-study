stem: 某倉庫模型依標誌在畫面中的箭頭方向，分為上、右、下、左 4 類。部署時確實會看到旋轉標誌。訓練集新增順時針 90 度旋轉，但原本向上的箭頭仍沿用「上」標籤。若保留此增強，最適合如何處理標籤？
options:
  A: 按旋轉後的畫面方向更新箭頭類別
  B: 按旋轉前的原始影像保留箭頭類別
  C: 將 4 個方向合併成單一箭頭類別
  D: 對旋轉樣本降低損失權重並保留類別
answer: A
explanation:
  summary: 增強可能改變任務標籤，方向分類須同步轉換類別。
  correct: 本題標籤依畫面方向定義。原本向上的箭頭順時針旋轉 90 度後向右，應標為右；其他方向也依相同旋轉關係更新。
  wrong:
    B: 保留原類別適用於旋轉不影響標籤的任務。本題要求辨別畫面方向，旋轉後標籤會改變。
    C: 合併類別可訓練箭頭存在偵測，但會失去業務要求的 4 種方向判斷。
    D: 降低權重可減少錯標樣本的影響，卻沒有修正旋轉影像與方向標籤的矛盾。
