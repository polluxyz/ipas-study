codes: [L23203]
concepts: [knowledge-distillation]
stem: |
  某分類系統的大型教師模型已通過驗證，但無法部署到行動裝置。團隊另設計小型學生網路，並希望學生學到教師對「刮傷、裂紋、正常」三類的相對判斷，而非只有教師選中的類別。最符合此目標的訓練方式為何？
options:
  A: "以教師選出的類別作為單一硬標籤，訓練學生預測該類別"
  B: "以教師的參數大小決定學生各層寬度，再僅用人工標籤訓練"
  C: "以教師輸出的類別分布作軟目標，搭配人工標籤訓練學生"
  D: "以教師各類別的總預測次數作目標，讓學生只匹配整體比例"
answer: C
explanation:
  summary: "以軟目標傳遞教師對相近類別的相對判斷。"
  correct: "教師的類別分布保留各類別的相對機率，例如某圖更像裂紋而不像正常。學生以軟分布學習並結合人工標籤，可取得只保留最高分類別時會丟失的資訊。"
  wrong:
    A: "硬標籤只留下選中的類別，沒有保留其他類別的相對判斷，未達題設的額外目標。"
    B: "依參數大小配置學生容量屬於架構安排，單用人工標籤不會傳遞教師對每張圖的類別分布。"
    D: "全體類別比例不含每張圖的條件判斷，即使總比例相同，也可能對個別影像給出錯誤類別。"
