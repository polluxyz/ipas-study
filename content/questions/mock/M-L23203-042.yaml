concepts: [knowledge-distillation]
stem: |
  某零件分類團隊要選擇知識蒸餾的教師。甲、乙兩張影像的正確類別皆為正常。3 個教師輸出的順序固定為 [正常,刮傷,裂紋]：
  - P：甲 [0.98,0.01,0.01]；乙 [0.98,0.01,0.01]。
  - Q：甲 [0.70,0.24,0.06]；乙 [0.70,0.06,0.24]。
  - R：甲 [0.34,0.33,0.33]；乙 [0.34,0.33,0.33]。
  團隊本次比較的目標，是讓學生學到兩張圖各自較接近哪種次要類別。若以「刮傷機率÷裂紋機率」比較，哪項判斷最正確？比值依序列出甲、乙的結果。
options:
  A: "P 的比值為 1.00、1.00，比 Q 更能表達兩張圖的混淆差異"
  B: "R 的比值為 1.00、1.00，比 Q 更能表達兩張圖的混淆差異"
  C: "Q 的比值為 4.00、0.25，比 P 更能表達兩張圖的混淆差異"
  D: "Q 的比值為 4.00、4.00，比 R 更能表達兩張圖的混淆差異"
answer: C
explanation:
  summary: "由次要類別的機率比，辨識教師提供的樣本差異。"
  correct: "Q 的甲圖比值為 0.24/0.06=4，乙圖為 0.06/0.24=0.25，分別偏向刮傷與裂紋。P 的兩個比值都為 1，未表達這種差異。Q 因此較符合本題的資訊傳遞目標，但不能只憑這兩筆分布保證學生準確率提高。指引介紹蒸餾與教師偏誤；次要類別機率比的判讀屬補充，依據為[蒸餾原始論文](https://arxiv.org/abs/1503.02531)。"
  wrong:
    A: "P 對兩張圖都把 0.98 給正常，但兩個次要類別同為 0.01。較高的最高類別信心，不能代替兩張圖不同的次要類別關係。"
    B: "R 雖然較平均，但兩張圖的次要類別比值仍同為 1。分布較平坦不代表含有較多與樣本相關的混淆差異。"
    D: "Q 確實呈現差異，但乙圖比值是 0.06/0.24=0.25，並非 4。若兩張圖都為 4，才是相同的次要類別方向。"
