stem: 某工程師對 80 筆資料做無正則化的普通最小平方迴歸。設計矩陣 X 的 3 欄線性獨立，並含一欄常數 1。以精確解求出係數，殘差定義為 r=y-Xw。忽略浮點誤差，下列驗收條件何者最正確？
options:
  A: 每筆殘差都為 0，且每個係數都為非負值
  B: 殘差平方和為 0，且殘差向量的長度為 0
  C: Xᵀr 為零向量，且殘差的總和為 0
  D: Xᵀr 等於 w，且殘差的平均值等於截距
answer: C
explanation:
  summary: 最小平方的殘差與設計矩陣的每一欄正交。
  correct: 最適解滿足 Xᵀ(y-Xw)=0。因 X 包含常數 1 欄，這一欄與 r 的內積就是殘差總和，因此殘差總和也為 0；不要求逐筆誤差消失。
  wrong:
    A: 最小平方只要求平方和最小，不要求每筆誤差為 0，也沒有對係數加入非負限制。
    B: 只有 y 能由 X 的欄線性組合精確表示時，才會有零殘差；本題沒有此條件。
    D: 無正則化的正規方程給出 Xᵀr=0，而不是 w。有截距時殘差平均為 0，並非截距值。
