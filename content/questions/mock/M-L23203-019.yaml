stem: 某設備每秒產生 1 筆資料，要求第 t 秒結束就回報該秒狀態，不能等待後續讀值。舊模型用完整 60 秒區段的雙向循環網路，為每秒輸出標籤。若只調整序列方向設計，最適合的改法為何？
options:
  A: 改用反向單向網路，從區段最後一秒往回讀取各秒讀值
  B: 維持雙向網路，等完整 60 秒區段到齊後再輸出各秒標籤
  C: 維持雙向網路，每秒輸出前先等候後 5 秒讀值進入反向分支
  D: 改用單向網路，將已到達的讀值與前一秒狀態用於預測
answer: D
explanation:
  summary: 零等待的逐時預測，不能依賴尚未到達的區段內容。
  correct: 單向網路可以用目前讀值和歷史隱藏狀態逐秒推論。舊模型在區段中的反向狀態會使用較晚讀值，必須等待那些讀值出現，與題目的回報期限不符。
  wrong:
    A: 反向單向網路從區段尾端開始讀，第 t 秒時尚未取得後面的讀值，仍要等待。
    B: 雙向模型等區段到齊才輸出，第 t 秒的標籤最多晚 60 秒才產生，不符合回報期限。
    C: 等候 5 秒可縮短延遲，但仍依賴尚未到達的讀值，不符合不能等待的要求。
