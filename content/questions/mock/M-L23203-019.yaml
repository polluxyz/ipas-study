stem: 某設備每秒產生 1 筆資料，該秒狀態取決於先前讀值的變化趨勢。系統要求第 t 秒結束就回報該秒狀態，不能等待後續讀值。舊模型用完整 60 秒區段的雙向循環網路，由每個時間步的隱藏狀態輸出該秒標籤。若不更換循環網路類型，最適合的改法為何？
options:
  A: 改用反向單向網路，讓隱藏狀態由較晚讀值逐步傳回較早讀值
  B: 保留雙向網路，將尚未到達的讀值補 0 後送入反向分支
  C: 改用單向網路，每秒輸出後將隱藏狀態歸零，只用當秒讀值
  D: 改用單向網路，將已到達的讀值與前一秒狀態用於預測
answer: D
explanation:
  summary: 零等待的逐時預測，不能依賴尚未到達的區段內容。
  correct: 單向網路可以用目前讀值和歷史隱藏狀態逐秒推論，既保留先前趨勢，也不需要後續讀值。舊模型的反向狀態會使用較晚讀值，必須等到那些讀值出現，與回報期限不符。
  wrong:
    A: 反向傳遞時，第 t 秒的隱藏狀態來自 t 秒之後的讀值。要等那些讀值到達才算得出來，仍不符合回報期限。
    B: 補 0 雖然不用等待，但反向分支訓練時看到真實的後續讀值，推論時改看補值，輸入分布與訓練不一致，輸出可能失準。
    C: 歸零後每秒只看當秒讀值，捨棄了題幹指出的先前趨勢。
