stem: 某零售團隊用 Apriori 搜尋頻繁商品組合。最小支持度為 5%，已知組合 {茶,杯} 的支持度為 4%。團隊準備檢查含 3 種商品的候選組合。依現有資訊，下列哪一項可直接剪除？
options:
  A: 含有「茶、杯、糖」的候選組合
  B: 含有「茶、糖、奶」的候選組合
  C: 含有「杯、糖、奶」的候選組合
  D: 含有「茶、糖、餅」的候選組合
answer: A
explanation:
  summary: 使用不頻繁子集排除不可能頻繁的超集。
  correct: 同時含茶、杯、糖的交易，也必須含茶與杯。因此，3 項組合的支持度不會高於已知的 4%，無法達到 5% 門檻。這個判斷不需要先數糖的出現次數。
  wrong:
    B: 這個組合不包含已知不頻繁的茶杯子集。只憑茶杯的支持度，不能判定茶糖奶也不頻繁。
    C: 杯糖奶沒有包含茶杯子集。杯出現在不頻繁組合中，不代表含杯的其他組合都不頻繁。
    D: 茶糖餅沒有包含茶杯子集。不能因茶杯不頻繁，就排除含茶但不含杯的候選。
