stem: 某商品抽取任務以合成名稱「甲乙牌電鑽」測試，要求同時標出整段產品名稱，以及其中「甲乙牌」的品牌名稱。現有標註法規定每個字只有 1 個標籤，且只能屬於 1 個不重疊實體。若要保留這 2 個巢狀範圍，最適合調整哪項設計？
options:
  A: 增加產品與品牌的類別權重後重新訓練
  B: 統一選取最長名稱作為產品的訓練標籤
  C: 改用能列出多個起訖範圍與類型的表示
  D: 增加原字串的子詞數量後沿用單層標籤
answer: C
explanation:
  summary: 巢狀實體需要能表示重疊範圍的輸出結構。
  correct: 兩個實體共享部分字元，單層且不允許重疊的表示無法同時容納。列出各實體的起點、終點與類型，可分別保存整段產品與內含品牌的範圍。
  wrong:
    A: 類別權重改變錯誤代價，沒有增加同一字元可參與多個實體的表示能力。
    B: 取最長名稱可以統一單層標註，但會捨去需求指定的內含品牌實體。
    D: 細分輸入不會解除每個字只能歸入一個不重疊實體的輸出限制。
