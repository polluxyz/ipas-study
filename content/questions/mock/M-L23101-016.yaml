stem: 某團隊比較甲、乙模型的任務成功率。簡單任務中，甲為 90%、乙為 80%；困難任務中，甲為 40%、乙為 30%。甲的評估資料有 90% 是困難任務，乙則只有 10%。團隊要比較兩個模型在未來相同任務組合的成功率。下列做法何者最適合？
options:
  A: 以各模型現有資料的整體成功率直接排序
  B: 以共同的簡單與困難任務比例加權兩模型成功率
  C: 分別取兩模型表現較好的任務成功率進行排序
  D: 分別取兩模型表現較差的任務成功率作整體估計
answer: B
explanation:
  summary: 比較條件表現時，應使用相同的任務組合。
  correct: 甲、乙在每種任務的條件成功率可比較，但現有任務比例不同。以未來共同的任務比例加權，才是在相同目標分布下比較。甲的現有整體率為 45%，乙為 75%，這個排序混入任務難度比例的影響。
  wrong:
    A: 現有整體率以不同權重混合條件成功率，主要反映的可能是任務組合，而非相同組合下的模型差異。
    C: 只取較好的簡單任務會忽略困難任務。它估計的是簡單任務表現，不是未來共同組合的成功率。
    D: 取較差任務可作保守指標，但不是包含兩種任務之目標組合的整體成功率。
