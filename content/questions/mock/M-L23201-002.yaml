stem: 某團隊以輪廓係數比較相同資料的分群結果，沒有真實類別標籤。某筆樣本與同群其他樣本的平均距離 a=6，與最近其他群的平均距離 b=2。已給定 s=(b−a)/max(a,b)。以下哪項對這筆樣本的解讀最正確？
options:
  A: s 約為 0.67；目前分群使這筆樣本與同群較接近。
  B: s 約為 −0.67；可直接證明這筆樣本的人工標籤錯誤。
  C: s 約為 −0.67；應檢查這筆樣本是否更靠近其他群。
  D: s 約為 0.67；可直接證明目前群數就是最佳群數。
answer: C
explanation:
  summary: 負輪廓係數提示群內距離比最近其他群距離更大。
  correct: 代入得到 (2−6)/6≈−0.67。這筆樣本與最近其他群更接近，值得檢查其分群歸屬。輪廓係數是依距離計算的內部指標，不能在沒有真實標籤時直接判斷人工標籤是否錯誤，也不能只靠一筆樣本決定最佳群數。
  wrong:
    A: 分子應為其他群距離減同群距離，符號寫反；本例與同群反而較遠。
    B: 距離指標提示幾何關係，不是人工標籤正誤的證據。
    D: 係數符號算反，且單筆係數不足以證明整體群數最佳。
