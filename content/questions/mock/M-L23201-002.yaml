stem: 某深度分類器在固定訓練與驗證切分上訓練 40 輪。訓練損失由 0.8 持續降至 0.02，驗證損失卻在第 12 輪最低後升到 0.9；資料及評估流程未改動。哪個判斷最有依據？
options:
  A: 這證明容量不足，應立即加深網路並繼續訓練
  B: 只要訓練損失接近零，就可忽略驗證損失
  C: 曲線顯示過擬合跡象，應用驗證資料選停止點並檢查正則化
  D: 把測試集每輪加入挑選，便能消除過擬合
answer: C
explanation:
  summary: 偏差與訓練驗證落差。
  correct: 訓練持續改善，但未見過資料的表現惡化，符合過擬合的典型跡象。停止點與正則化須依驗證規則選定，測試集留待最終評估。
  wrong:
    A: 容量不足常伴隨訓練也學不好，本題訓練損失已很低。直接增加容量未針對泛化落差。
    B: 訓練擬合不等於未見資料表現，忽略驗證會漏掉本題已觀察到的退步。
    D: 反覆用測試集選輪次會失去獨立評估角色，也沒有直接修正模型對訓練細節的擬合。
