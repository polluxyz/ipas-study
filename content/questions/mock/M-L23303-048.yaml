stem: 某產線以每秒影像偵測停機。同一次停機可能持續很久，也可能很短。新版在逐張影像的混淆矩陣上召回率提高，卻漏掉更多短暫停機。業務要求每次停機至少通知一次，重複通知不增加價值。哪項補充評估最適合？
options:
  A: 按停機事件彙整，計算曾被通知的事件比例
  B: 按影像筆數彙整，計算正常影像被誤報的比例
  C: 按影像筆數彙整，計算整批影像的準確率
  D: 按警報筆數彙整，計算全部警報的精確率
answer: A
explanation:
  summary: 評估單位應對齊業務要偵測的是每次事件。
  correct: 逐張召回率讓持續較久的停機占較多權重，可能掩蓋短暫停機被漏掉。以一次停機為一個單位，計算至少通知一次的比例，才直接對應本例需求。
  wrong:
    B: 正常影像被誤報的比例衡量假陽率，不能直接揭露有多少次短暫停機未被通知。
    C: 影像準確率混合正常與停機影像，仍以影像筆數加權，無法對齊每次事件的需求。
    D: 警報精確率檢查通知是否可信，無法指出沒有產生任何警報的停機事件。
