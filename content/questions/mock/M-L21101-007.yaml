stem: 某餐廳訂位助理已記錄「週五、晚間 7 點、4 人」。使用者補充「改成 6 人，時間不變」，系統卻清空日期與時間。哪項設計最符合任務導向對話的需求？
options:
  A: 保存訂位狀態，只更新人數，再確認完整訂位內容
  B: 每輪僅依最新一句重建所有欄位，缺少欄位一律清空
  C: 把使用者句子做正負面分類，依情緒決定要保留哪些訂位欄位
  D: 改以自由聊天產生餐廳介紹，等訂位完成後再回頭補齊日期
answer: A
explanation:
  summary: 多輪對話的狀態更新。
  correct: 使用者只修改人數，並明說時間不變。助理須保留先前已確認的訂位資訊，更新指定欄位，再確認狀態後執行訂位。
  wrong:
    B: 最新一句刻意省略已知資訊，整份重建會遺失仍有效的日期與時間。
    C: 情感分類不能判斷訂位欄位的更新語意，也不能替代狀態管理。
    D: 自由聊天沒有處理訂位必要欄位，不能確保執行時資料完整。
