stem: 某產線以固定曝光拍攝灰階影像，判斷塗層是否過暗；整體亮度本身是判斷依據。兩張紋理相同、亮度不同的影像，逐張減去各自平均亮度後變得相同，分類能力下降。若要調整數值尺度並保留這項訊號，下列做法何者最適合？
options:
  A: 逐張減去各自平均亮度，再除以各自像素的標準差
  B: 使用相同的固定縮放規則，保留影像之間的亮度差異
  C: 逐張以各自最暗和最亮像素，將像素映射到相同範圍
  D: 逐張扣除各自中位亮度，再用各自四分位距縮放像素
answer: B
explanation:
  summary: 正規化應保留任務需要的跨影像絕對亮度資訊。
  correct: 題目要辨識的就是整體亮度差。對每張圖各自置中，會消除這項差異。所有影像採相同且非零的線性縮放，例如固定除以相同像素尺度，可調整數值範圍並保留相對亮暗。
  wrong:
    A: 各自置中仍會先刪掉平均亮度資訊，後續除以標準差無法恢復已消失的差異。
    C: 逐張使用各自極值縮放，可能把亮度只差固定偏移的影像映成相同結果，仍會消除任務訊號。
    D: 各自扣除中位數也會去除整體亮度位移。改用穩健統計量不能解決跨影像訊號被消除的問題。
