stem: 某公司替 40 款相近機台辨識相同的 5 種故障。每款只有 60 張標註圖，共同紋理相似，但各款仍有外觀差異。部署時知道機台款式，且每次只執行該款的任務。若要利用共同資料又保留款式差異，哪項架構最適合優先比較？
options:
  A: 每款各自從隨機初值訓練完整網路，部署對應網路
  B: 合併全部款式訓練單一分類頭，輸入不提供款式資訊
  C: 用單一大網路輸出款式編號，再把款式視為故障類別
  D: 共用特徵骨幹並設款式專用小分類頭，部署對應頭
answer: D
explanation:
  summary: 相關任務可共用表示，並用小型任務頭保留差異。
  correct: 共享骨幹可從各款資料共同學習紋理，款式專用分類頭則能表達各款的差異。部署只需骨幹與當前款式的小分類頭，不需執行全部 40 個頭。是否改善仍以各款驗證結果確認。
  wrong:
    A: 每款獨立訓練無法共享其他款的樣本；每款僅 60 張圖時，完整網路的估計更容易不穩。
    B: 這能共享資料，但模型沒有款式條件，難以表達相同紋理在不同款式下的不同判斷。
    C: 款式編號與故障類別是不同目標，預測機台款式不能完成題目要求的故障辨識。
