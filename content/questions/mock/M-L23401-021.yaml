stem: |
  某商店的預測任務只需每週到店總次數。一週內固定有 200 位顧客，每人每天到店 2 次，共記錄 7 天。
  團隊比較下列摘要，三者都能提供任務所需總量，也都不含姓名：
  甲表：每人每日一列，含固定代碼、日期、兩次到店時段與次數。
  乙表：欄位同甲表，但每天為每人重抽隨機代碼，不提供跨日代碼對照。
  丙表：每店每週一列，只含週別、店別與到店總次數，不提供其他細分報表。
  接收方可讀取交付資料，也知道某顧客每天在 07:00 與 18:00 到店，且每天只有該顧客符合此時段組合。
  哪項方案對接收方連結該顧客跨日活動的風險最低，且仍滿足任務？
options:
  A: 採甲表並加密傳輸，讓到店時段受到通道保護
  B: 採乙表並每日換碼，讓跨日代碼無法直接比對
  C: 採丙表並保留週總量，減少逐日行為的連結
  D: 採甲表並限制帳號，讓資料僅供核准者讀取
answer: C
explanation:
  summary: 每日換碼仍可能留下行為連結線索，須比較摘要保留的資料形狀。
  correct: 三表都可得到每週 200×2×7=2800 次。甲表能用固定代碼跨日連結；乙表雖切斷代碼對照，接收方仍能每天依唯一的到店時段找到該顧客，再連起活動。丙表把 200 人的活動合成週總量，沒有個人列與每日時段，因此在題定資訊下可連結性最低。每日換碼與行為線索的比較屬補充推導；週總量仍可能有其他推測風險，不能據此宣稱完全匿名。
  wrong:
    A: 加密通道防止傳輸途中被讀取，但接收方仍能讀取甲表；固定代碼與時段都可連結活動。
    B: 每日換碼只移除跨日相同代碼，沒有移除每日唯一的時段組合，接收方仍能用已知行為逐日對應。
    D: 限制帳號可減少未授權存取，但題目評估能讀取資料的接收方；核准帳號仍可用甲表連結活動。
