stem: 某運動應用已確認，疲勞模型只需要每次活動的速度區間比例，不需要路線或起終點。手機目前每秒上傳座標，伺服器換算比例後留存座標 30 天。團隊要從資料進入伺服器前降低路線暴露，最適合如何調整？
options:
  A: 加密上傳座標，再由伺服器換算比例
  B: 將帳號改為代碼，保留逐秒座標欄位
  C: 在手機換算區間比例，只上傳該比例
  D: 縮短座標保存期，仍先上傳逐秒座標
answer: C
explanation:
  summary: 已知任務只需要衍生摘要時，可在來源端縮減收集範圍。
  correct: 手機先換算出任務所需的速度區間比例，便能避免把精細路線交給伺服器。題幹已確認模型不需要路線，故這項調整可同時保留用途與降低收集精度。
  wrong:
    A: 傳輸加密可保護通訊，但伺服器解密後仍收到精確座標，沒有縮減進入伺服器的資料。
    B: 帳號代碼化可降低直接身分暴露，但逐秒座標仍能揭露路線與起終點。
    D: 縮短保存期可降低留存風險，但資料已先進入伺服器，未達來源端縮減收集的目標。
