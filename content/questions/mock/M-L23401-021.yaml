stem: |
  某商店固定有 4 位顧客，連續記錄 5 天。每人每天到店 2 次，合成一列。
  團隊比較兩種交付版本，均供分析每日到店時段：
  甲表含代碼、日期與兩次到店時刻；每人使用不同的固定代碼，跨日不變。
  乙表的欄位與時刻同甲表，但每天獨立隨機換碼；代碼不跨日重用，也不提供對照。
  接收方只會取得其中一表。兩表均無姓名或其他欄位，每天的列序獨立打亂。
  每天 4 列的時刻組合如下，重複組合各代表不同顧客的一列，排列位置不代表同一人：
  第 1 天：07:00／18:00、07:00／18:00、08:00／17:00、09:00／19:00。
  第 2 天：07:00／18:00、08:00／17:00、08:00／17:00、09:00／19:00。
  第 3 天：07:00／18:00、07:00／18:00、07:00／18:00、08:00／17:00。
  第 4 天：07:00／18:00、08:00／17:00、09:00／19:00、09:00／19:00。
  第 5 天：07:00／18:00、07:00／18:00、08:00／17:00、08:00／17:00。
  接收方知道目標顧客每天都在 07:00 與 18:00 到店，除此之外沒有身分或行為資訊。
  「可確定連結」指：符合題定資訊的所有身分對應，都把目標顧客指向該日同一列；若仍有多個可能列就不計。
  分別取得甲表或乙表時，各能確定連結目標顧客幾天的紀錄？
options:
  A: 甲表可確定連結 5 天，乙表可確定連結 0 天
  B: 甲表可確定連結 5 天，乙表可確定連結 5 天
  C: 甲表可確定連結 5 天，乙表可確定連結 2 天
  D: 甲表可確定連結 2 天，乙表可確定連結 2 天
answer: C
explanation:
  summary: 固定代碼能延伸已確認的身分連結，每日換碼仍留下可獨立比對的行為線索。
  correct: 各日符合目標時刻的列數依序為 2、1、3、1、2。甲表在第 2 天或第 4 天可唯一找到目標，再用該固定代碼連結全部 5 天。乙表的每日代碼沒有跨日對照，因此只能確定第 2 天與第 4 天，共 2 天；其餘日期仍各有 2、3、2 個可能列。指引 6-3 說明外部資訊造成的再識別風險，6-7 說明交叉比對測試；固定代碼與每日換碼的逐日枚舉屬補充推導。乙表仍可連結部分紀錄，不能宣稱已完全匿名。
  wrong:
    A: 換碼不會改動時刻。乙表在第 2 天與第 4 天各只有一列符合目標的已知行為，所以仍能確定連結這 2 天。
    B: 第 1、3、5 天各有多列符合時刻。乙表沒有跨日代碼對照，也沒有其他身分線索，不能把任一候選列當成已確定的目標列。
    D: 甲表一旦從唯一時刻組合確定目標代碼，就能沿同一代碼找到其他日期的紀錄，不限於當日時刻組合唯一的 2 天。
