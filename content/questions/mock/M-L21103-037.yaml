stem: |
  某團隊比較 2 種文生圖提示，每種可生成 20 張圖片。模型、取樣器與步數使用相同設定，初始噪聲由隨機種子決定。團隊希望比較提示效果時，控制每對圖片的初始噪聲差異，也涵蓋多種噪聲起點。最適合採取哪種測試設計？
options:
  A: 每種提示各抽 20 個不同種子，比較兩組平均評分
  B: 兩種提示共用同一組 20 個種子，逐對比較圖片評分
  C: 兩種提示共用同一個種子，各重複生成 20 次後評分
  D: 每種提示各抽 20 個種子，選各組最高分的 5 張比較
answer: B
explanation:
  summary: 配對噪聲起點可控制提示比較中的隨機差異。
  correct: 同一對圖片使用相同種子，可讓初始噪聲一致。採用 20 個不同種子，又能觀察提示在多種起點下的表現，避免只依單一生成結果判斷。
  wrong:
    A: 不同種子會讓提示差異與初始噪聲差異同時進入比較。平均分數仍有參考價值，但沒有達到逐對控制噪聲的目的。
    C: 重複同一個起點無法涵蓋多種噪聲條件。即使執行 20 次，也不能替代跨種子的比較。
    D: 選取各組最佳圖片會偏向少數成功結果，也未控制圖片之間的噪聲起點，不能代表一般生成表現。
