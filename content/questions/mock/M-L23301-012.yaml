stem: |
  某感測模型使用訓練集的最小值與最大值，將電流線性縮放到 0 至 1，部署後固定沿用這組參數，沒有設定截斷。新設備出現經確認有效、且高於訓練最大值的電流，轉換結果大於 1。針對這個現象，下列判斷何者最正確？
options:
  A: 最小最大縮放的輸出上限就是 1，結果大於 1 代表計算式有誤，應先修正轉換程式
  B: 訓練範圍已不適用，應在部署端依每批新資料重算最小與最大值，讓結果回到 0 至 1
  C: 數值大於 1 超出模型可接受的輸入範圍，推論會發生運算錯誤，應先把這些讀值排除
  D: 固定縮放下可以出現此結果，應另行檢查新範圍資料的模型表現
answer: D
explanation:
  summary: 判斷訓練範圍縮放不等於對新資料強制限制範圍。
  correct: 固定的線性轉換會把高於訓練最大值的資料映到 1 以上。這不需要重新擬合才會發生。讀值已確認有效，應檢查新範圍對模型的影響，再決定處置。
  wrong:
    A: 0 到 1 只對訓練集範圍內的值成立。公式沒有上限，高於訓練最大值就會大於 1，計算式沒有錯。
    B: 每批重算會讓同一個讀值在不同批次得到不同的縮放值，與模型訓練時看到的尺度不一致。
    C: 大於 1 的數值仍可計算，不會因此發生運算錯誤。問題是模型在這個範圍可能外推失準，而且讀值已確認有效，不應直接排除。
