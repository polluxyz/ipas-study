stem: |
  某感測模型使用訓練集的最小值與最大值，將電流線性縮放到 0 至 1，部署後固定沿用這組參數，沒有設定截斷。新設備出現經確認有效、且高於訓練最大值的電流，轉換結果大於 1。針對這個現象，下列判斷何者最正確？
options:
  A: 表示轉換器已改用新設備重新估計範圍，應從紀錄找出自動擬合的步驟
  B: 表示電流缺失值被轉成極端值，應把這些新設備讀值改成缺失後補值
  C: 表示模型接收到的電流單位已改變，應直接將超出範圍的讀值除以 100
  D: 固定縮放下可以出現此結果，應另行檢查新範圍資料的模型表現
answer: D
explanation:
  summary: 判斷訓練範圍縮放不等於對新資料強制限制範圍。
  correct: 固定的線性轉換會把高於訓練最大值的資料映到 1 以上。這不需要重新擬合才會發生。讀值已確認有效，應檢查新範圍對模型的影響，再決定處置。
  wrong:
    A: 題幹已固定參數；沿用舊範圍本來就可能得到大於 1 的值，不能據此推定重新擬合。
    B: 有效且偏大的新讀值不是缺失值，沒有理由因超界就改為缺失。
    C: 單位變更需要額外證據，單憑縮放超界不能決定除以 100。
