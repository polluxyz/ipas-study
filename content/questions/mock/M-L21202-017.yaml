stem: |-
  某文件分類試辦要衡量「每位客戶等權的平均正確率」，並以 85% 為通過門檻。甲客戶有 900 份文件，正確 855 份；乙客戶有 100 份文件，正確 60 份。所有文件均獨立於調整流程。驗收報告應如何彙整？
options:
  A: 合併文件為 91.5%，達到門檻；文件較多的客戶應占較大權重
  B: 先算客戶再平均為 77.5%，未達門檻；兩位客戶各占一半權重
  C: 只取較低客戶為 60.0%，未達門檻；客戶等權就是採最低分數
  D: 先算客戶再平均為 22.5%，未達門檻；兩位客戶各占一半權重
answer: B
explanation:
  summary: 驗收指標的加權單位須符合事先約定的業務對象。
  correct: 甲、乙客戶正確率分別為 95%、60%。每位客戶等權，平均為（95%＋60%）／2＝77.5%，低於 85%。合併文件的 91.5% 回答的是每份文件等權，不能替代本次約定的客戶指標。
  wrong:
    A: 915／1,000＝91.5% 是文件層級正確率，會讓甲客戶占 90% 權重。
    C: 最低客戶分數是另一種驗收規則，等權平均仍須把兩位客戶的分數都納入。
    D: 甲、乙的錯誤率為 5%、40%，平均 22.5% 是錯誤率，不是要求的正確率。
