stem: 某工廠用 2 週 PoC（概念驗證，小範圍測試方案可行性），評估現有相機能否辨識細小裂痕。團隊已用代表性工件完成測試，確認影像解析度不足，模型無法達到原定辨識門檻。改善需要更換相機並重新估算成本。此輪已到結案時間，哪項交付安排最能支持後續投資決策？
options:
  A: 將本輪目標改為完成辨識介面，以原型可操作作為技術驗證成果
  B: 依原目標交付未達標證據，列出換相機的資源需求供後續決策
  C: 把失敗案件改交人工處理，以整體流程能完成作為技術可行證據
  D: 另挑裂痕較明顯的工件測試，以這批辨識結果作為本輪驗收依據
answer: B
explanation:
  summary: 概念驗證的交付須回答原定可行性問題，未達標結果也有決策價值。
  correct: 本輪要判斷現有相機能否支援裂痕辨識，可靠測試已提供否定證據。報告應保留目標、測試條件、結果與限制，並說明換相機所需資源，讓決策者判斷是否另行投資。完成概念驗證不等於方案必須被判為可行，也不能為了結案改用較容易達成的目標。
  wrong:
    A: 可操作的介面只能證明部分系統功能完成，不能回答現有影像能否辨識裂痕。改換目標會失去本輪應提供的可行性結論。
    C: 人工接手可以成為後續方案，但流程能結束不代表相機與模型已達辨識門檻。人工負荷與成本也須另行評估。
    D: 較明顯的裂痕改變了測試難度，不能代表原定細小裂痕的使用範圍。這批結果不能取代已完成的代表性測試。
