stem: |
  某文件分類 PoC 已針對同一批 300 件驗收文件調整規則 40 次，終於達到正確率門檻。主管希望取得可支持下一階段投入的獨立證據，另外還有未使用、具代表性的文件可供抽樣。最適合如何安排最終驗收？
options:
  A: 從已達標的 300 件隨機取出一半，確認調整後的分數
  B: 凍結規則與通過門檻，以未參與調整的文件做一次驗收
  C: 增加現有 300 件的重複測試次數，計算分數的平均值
  D: 移除現有 300 件中較常出錯的文件，再確認是否達標
answer: B
explanation:
  summary: 反覆用來調整的資料，不能再視為獨立的最終驗收證據。
  correct: 先固定規則與門檻，再以未參與調整的代表性文件驗收，可降低對已知案例的適配造成的樂觀估計。驗收結果才較能支持新資料上的表現判斷。
  wrong:
    A: 這些文件都已參與 40 次調整。事後抽出一半不會消除規則已受到它們影響的事實。
    C: 重複測試能觀察執行穩定性，但不會增加獨立案例，也不能確認對未見文件的適用程度。
    D: 依模型錯誤刪除文件會讓驗收資料偏向容易案例，降低測試代表性，分數因此上升不等於實際能力改善。
