stem: 某統計服務對同一批個人的資料執行 10 次不同查詢。每次都採純差分隱私機制，ε=0.2。工程師使用基本序列組合，總 ε 上界等於各次 ε 相加。若希望整批查詢的上界不超過 1，哪項設定最符合要求？
options:
  A: 將每次 ε 改為 0.1，10 次的基本組合上界為 1
  B: 維持每次 ε 為 0.2，10 次平均後上界仍為 0.2
  C: 將每次 ε 改為 0.5，較大的單次預算會減少累積
  D: 維持每次 ε 為 0.2，因查詢不同而取最大值 0.2
answer: A
explanation:
  summary: 同一批個人的多次發布要累計差分隱私預算。
  correct: 題目指定基本序列組合，因此 10 次 ε=0.2 的上界為 2。若每次改為 0.1，總上界為 10×0.1=1，符合要求。降低單次 ε 通常需要較強的擾動或其他效用取捨，不能只看單次發布。
  wrong:
    B: 基本序列組合是相加，不是取平均，10 次 0.2 的上界為 2。
    C: 每次 0.5 會累計為 5，高於原設定，也高於本題上限。
    D: 查詢內容不同不代表參與者不同。本例同一批個人反覆參與，不能以不同查詢為由改用最大值。
