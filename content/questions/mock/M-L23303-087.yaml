stem: |
  某展覽只剩 3 天。每天的案件分布相同，現行警報門檻每天誤報 50 件、漏報 10 件；候選門檻每天誤報 80 件、漏報 6 件。每件誤報花 2 單位，每件漏報損失 60 單位。切換到候選門檻另須支付一次性設定費 900 單位，保留現行門檻沒有設定費。只計展覽剩餘期間的總成本，最適合怎麼做？
options:
  A: 切換門檻，總成本為 1,420 單位
  B: 保留門檻，總成本為 1,800 單位
  C: 保留門檻，總成本為 2,100 單位
  D: 切換門檻，總成本為 2,460 單位
answer: C
explanation:
  summary: 門檻的誤判成本改善，須連同使用期間與切換費一起評估。
  correct: 現行每天花 50×2+10×60=700，3 天共 2,100。候選每天花 80×2+6×60=520，3 天加設定費共 2,460。候選的每日成本較低，但剩餘 3 天只省 540，無法抵銷 900 的設定費，因此保留現行門檻。
  wrong:
    A: 1,420 是候選 1 天的誤判成本 520 加設定費 900，漏算另外 2 天的誤判成本。
    B: 1,800 只計現行 3 天的漏報損失，漏掉 50×2×3=300 的誤報成本；保留門檻的總成本應為 2,100。
    D: 候選的 3 天總成本確實為 2,460，但高於現行的 2,100。不能只因候選每天的誤判成本較低，就判定剩餘期間應切換門檻。
