stem: 某統計服務先以公開且固定的區域規則，把每人唯一一筆紀錄分到互不重疊的 3 區。各區只發布 1 次有效的純差分隱私結果，ε 依序為 0.2、0.4、0.3。以新增或移除 1 人為保護單位，依平行組合公式計算的整批 ε 上界為何？
options:
  A: 0.4，取互斥個人分區中的最大預算
  B: 0.9，將各區發布的預算全部相加
  C: 0.3，取各區發布的預算算術平均
  D: 0.2，取各區發布的最小預算
answer: A
explanation:
  summary: 個人互斥的分區發布，可依平行組合取最大預算。
  correct: 任意新增或移除 1 人，只會影響其中 1 區的發布。公開固定的分區規則不另由資料學得，每人也沒有跨區出現，因此可用平行組合，整批上界為 max(0.2,0.4,0.3)=0.4。若同一人跨區出現，就不能沿用這項推理。
  wrong:
    B: 0.9 是序列組合公式相加的結果，不是本題指定的平行組合公式結果。
    C: 平均會低估處於 ε=0.4 區域者可能受到的影響，不是有效的平行組合上界。
    D: 最小值只代表保護較強的那一區，不能涵蓋 ε=0.4 的區域。
