stem: 某隨機森林使用「長度公分」與「長度毫米」兩欄，兩者來自同一次量測。分別刪除任一欄再重訓，驗證表現都幾乎不變。團隊想縮減輸入欄位，卻因此打算把兩欄一起移除。下列處理何者最適合？
options:
  A: 先比較保留一欄與兩欄皆刪的模型，再決定取捨
  B: 依各別刪欄結果移除兩欄，再以其他特徵重新訓練
  C: 先把兩欄各自標準化，再依原刪欄結果移除兩欄
  D: 先增加森林的樹數，再依原刪欄結果移除兩欄
answer: A
explanation:
  summary: 替代性特徵各別可刪，不表示整組資訊都可刪。
  correct: 兩欄承載同一量測資訊，刪除一欄時另一欄仍可提供訊號。應直接比較保留代表欄與整組刪除的驗證結果，才能判斷是否真的不需要長度資訊。
  wrong:
    B: 各別刪欄只顯示兩欄可能互相替代，沒有證明其他特徵能取代整組長度資訊。
    C: 標準化會改變尺度，但不會改變兩欄來自同一量測的替代關係。
    D: 增加樹數可改善集成穩定性，不能補上兩欄一起移除後失去的量測資訊。
