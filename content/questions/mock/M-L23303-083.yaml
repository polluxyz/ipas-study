stem: 某企業用 6,000 筆歷史案件訓練分類器，訓練準確率達 99%。目前尚未在其他有標籤案件上評估。主管問是否已出現過擬合，並準備據此決定是否採用。下列判斷與補充安排何者最適合？
options:
  A: 以高訓練準確率判定過擬合，降低模型容量後直接採用
  B: 以高訓練準確率排除過擬合，維持目前模型後直接採用
  C: 以增加訓練輪數檢查準確率是否持平，再決定是否採用
  D: 以獨立保留案件評估泛化表現，再判斷是否有明顯落差
answer: D
explanation:
  summary: 單看訓練準確率，不能確認或排除過擬合。
  correct: 99% 只描述模型對訓練案件的擬合程度。需要未參與建模的有標籤案件，才能判斷對未見資料的表現及是否存在明顯泛化落差。
  wrong:
    A: 高訓練準確率可能來自任務容易，也可能來自記住資料。尚無獨立評估時不能直接判定過擬合。
    B: 模型也可能只擅長訓練資料。高訓練準確率並不能排除對未見案件表現不佳。
    C: 繼續觀察同一份訓練資料只會提供擬合資訊，無法替代對未見案件的驗證。
