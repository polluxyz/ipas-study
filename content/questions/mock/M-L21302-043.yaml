stem: 某維修問答系統以嵌入模型甲將文件轉成 768 維向量。團隊更換查詢端為同樣輸出 768 維的模型乙，文件端仍用甲，檢索品質隨即下降。兩模型獨立訓練，沒有做過向量空間對齊。最適合優先採取哪項處理？
options:
  A: 對甲的文件向量與乙的查詢向量各自做長度正規化
  B: 將向量索引的搜尋候選數提高，再維持目前的兩端模型
  C: 將查詢端恢復為甲，並規劃兩端一致的嵌入版本
  D: 把向量距離改成內積，再以目前的兩端模型查詢
answer: C
explanation:
  summary: 向量維度相同不代表兩個嵌入模型具有相容的語意座標。
  correct: 獨立訓練的嵌入模型可能以不同座標表達語意。恢復兩端使用甲可先消除空間不相容；若要改用乙，須重新建立相容的文件表示並驗證檢索品質。
  wrong:
    A: 長度正規化調整向量大小，不能把兩個獨立模型的語意座標對齊。
    B: 增加候選數可改善近似搜尋漏找，但不會修正查詢與文件表示不相容的根本問題。
    D: 更換距離函數仍在比較兩個未對齊的空間，沒有建立兩端座標間的對應。
