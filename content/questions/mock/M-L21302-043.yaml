stem: 某知識服務準備更換嵌入模型，新舊索引已各自使用配套的查詢編碼器。新索引的文件版本與權限資料也已同步。團隊須確認檢索品質，並保留切回舊版的能力。哪項切換安排最完整？
options:
  A: 核對新索引文件筆數後直接切換，保留新編碼器並刪除舊索引節省空間
  B: 只比較兩個索引的向量平均值，相近便切換並讓新查詢共用舊版快取
  C: 以查詢及相關文件真值比較召回，分流驗證後成套切換並保留舊套件
  D: 比較兩版回答的平均字數後切換，只備份新索引以維持單一服務版本
answer: C
explanation:
  summary: 嵌入版本遷移須驗證檢索結果，並把可回復的服務組件視為一組。
  correct: 固定查詢與相關文件真值，可檢查新索引是否仍找得到應取回的證據。分流驗證能在受控範圍觀察服務行為；正式切換應包含索引、查詢編碼器及相關設定。保留相容舊套件並演練切回，才有實際的回復路徑。
  wrong:
    A: 筆數相同不能證明相關文件排進候選；刪除舊索引也會移除既有回復所需產物。
    B: 向量平均相近不是檢索正確的證據；跨版本快取還可能混用不同流程的結果。
    D: 回答字數不是證據召回率；只有新索引備份，無法恢復原來的整套查詢路徑。
