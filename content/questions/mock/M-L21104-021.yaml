stem: 某巡檢模型的影像在現場有 20% 缺失，缺失主要發生在高溫起霧時，這些時段也較常出現異常。團隊在完整測試資料中隨機遮掉 20% 影像，得到良好結果。若要確認缺失策略適合現場，最重要的補測為何？
options:
  A: 維持隨機遮罩方式，將測試筆數增加至原本 2 倍
  B: 只選原始影像齊全的事件，比較各分支的預測誤差
  C: 把隨機遮罩率提高到 40%，比較全體平均預測誤差
  D: 保留現場自然缺失事件，按起霧及異常狀態分組驗證
answer: D
explanation:
  summary: 相同缺失比例不代表涵蓋相同的缺失條件與錯誤風險。
  correct: 現場缺失與環境及異常狀態相關，隨機遮罩不一定重現這種分布。保留自然缺失事件並分組驗證，才能檢查高風險時段的缺失路徑表現。
  wrong:
    A: 增加筆數可減少隨機誤差，卻仍沿用與現場不同的缺失機制。
    B: 只選完整事件會排除最需要驗證的自然缺失群，無法回答起霧時的回退表現。
    C: 提高隨機缺失比例可以加強壓力測試，但比例加倍仍不等於缺失與異常相關的現場分布。
