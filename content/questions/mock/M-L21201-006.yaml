stem: 某公司希望自動核對報銷金額。輸入已是完整結構化欄位，核銷規則只有 12 條明確條件，且每筆結果都須逐條說明符合哪條規則。現有問題是人工重複輸入，沒有語意辨識需求。初步方案評估最適合採取哪項作法？
options:
  A: 先以規則引擎與表單整合建立基線，驗證能否解決重複作業
  B: 先訓練深度分類模型學習核銷結果，再以特徵重要性說明
  C: 先用大型語言模型判斷每筆報銷，再以提示限制回覆格式
  D: 先以分群模型找出報銷類型，再由群集編號決定核銷結果
answer: A
explanation:
  summary: 需求可由明確規則處理時，先驗證較簡單的自動化方案。
  correct: 本例的決定條件完整且固定，瓶頸是資料重複輸入。規則引擎可直接執行條件並留下規則依據，配合表單整合即可驗證主要需求。評估 AI 應與這項基線比較增量價值。
  wrong:
    B: 分類模型近似歷史結果，未必精確遵循每條規則；特徵重要性也不等於逐條核銷依據。
    C: 限制回覆格式不能保證規則執行正確，且本例沒有需要語言理解的輸入。
    D: 分群是依相似性分組，不會自然對應公司核銷條件，也不能提供逐條規則證據。
