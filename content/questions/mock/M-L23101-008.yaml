stem: 某團隊用固定方法，根據 400 筆獨立抽樣資料建立母體平均延遲的 95% 信賴區間，得到 18 至 22 毫秒。抽樣與建構方法符合適用條件。關於這個 95% 的解讀，下列何者最正確？
options:
  A: 重複同樣程序所得的區間，長期約 95% 涵蓋母體平均
  B: 母體平均會隨抽樣改變，且有 95% 的值落在此區間
  C: 未來每筆請求的延遲有 95% 會落在此區間
  D: 這批 400 筆資料中有 95% 的延遲落在此區間
answer: A
explanation:
  summary: 信賴水準描述區間建構程序的長期涵蓋率。
  correct: 頻率學派將母體平均視為固定值。重新抽樣會產生不同區間，95% 描述這些區間涵蓋母體平均的長期比例。
  wrong:
    B: 在題設的固定母體下，變動的是樣本及區間，不是母體平均。
    C: 平均值的信賴區間估計母體平均，並不是未來單筆請求的預測區間。
    D: 信賴區間不以涵蓋 95% 的樣本值為目標。樣本值的分散程度與平均估計的不確定性不同。
