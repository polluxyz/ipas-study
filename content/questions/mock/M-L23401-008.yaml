stem: 某模型訓練資料庫把備份與明文解密金鑰放在同一份可下載的封存檔。外包人員只獲准搬移備份，不應讀取內容。團隊要降低封存檔外洩後的資料揭露風險，哪項改進最直接？
options:
  A: 為整份封存檔建立數位簽章，由外包人員下載後驗證檔案完整性
  B: 為外包人員啟用加密傳輸，維持備份與明文金鑰共存的封存方式
  C: 將金鑰放入獨立受控服務，僅授權訓練身分取得必要的解密能力
  D: 為封存檔建立雜湊清冊，下載後比對備份與金鑰檔是否被修改
answer: C
explanation:
  summary: 備份加密的保密效果取決於解密金鑰能否獨立受到保護。
  correct: 將密文與明文金鑰一起交付，拿到封存檔的人就有機會解密。金鑰獨立管理並按用途授權，可讓搬移備份的身分不因取得備份就同時得到解密能力。
  wrong:
    A: 簽章可協助確認來源及完整性，不能阻止持有明文金鑰的人讀取資料內容。
    B: 加密傳輸保護傳送路徑，但外洩的是下載後的封存檔，檔內仍包含解密所需的金鑰。
    D: 雜湊可發現檔案內容變更，不能對已取得密文及解密金鑰的人提供內容保密。
