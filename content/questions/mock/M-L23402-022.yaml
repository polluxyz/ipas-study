stem: 某模型的驗證資料互相獨立，甲群 1000 位合格者中選到 800 位，乙群 10 位合格者中選到 8 位。兩群召回率點估計都是 0.8。團隊要決定是否宣告群體差距已獲可靠驗證。最正確的判斷為何？
options:
  A: 可用相同點估計確認兩群真實召回率一致
  B: 可合併兩群合格者後用單一召回率取代群體比較
  C: 可用乙群全體人數重新計算合格者召回率
  D: 應報告樣本量與估計區間，再補強乙群驗證證據
answer: D
explanation:
  summary: 相同點估計不代表不同樣本量下具有相同的證據強度。
  correct: 兩群點估計雖相同，乙群只有 10 位合格者，其召回率估計通常更不精確。應呈現各群樣本量與不確定性，並增加乙群的有效驗證資料，再評估是否滿足已訂定的差距容忍範圍。
  wrong:
    A: 點估計相同不構成真實率相同的證據，少量樣本仍可能對應很廣的合理率範圍。
    B: 合併後的結果主要由甲群決定，會移除原本要檢查的群體差距與乙群不確定性。
    C: 合格者召回率以真正合格人數為分母。改用全體人數會改變指標，不能提高本次比較的可靠度。
