stem: |
  某零售公司對相同顧客資料重跑 K-means，群數都設為 3。前處理相同，檢查後發現每群的成員集合都與前次相同，只有群編號互換。報表卻把「第 1 群人數變化」視為顧客行為轉變。下列修正何者最適合？
options:
  A: 將群編號改為連續數值特徵，再依編號的平均差異衡量行為變化
  B: 先按群中心與成員對齊兩次群組，再比較相對應群組的業務指標
  C: 提高群數後直接比較同號群組，利用更細分的編號保持群組意義
  D: 將每群依人數各自排序後編號，再以同號群組推定固定顧客輪廓
answer: B
explanation:
  summary: 辨識分群編號沒有跨次固定的業務意義。
  correct: K-means 的群編號只是輸出標記。成員相同而編號互換，不代表顧客行為改變。先建立群組對應，才能比較同一群體的指標。
  wrong:
    A: 群編號不是有距離意義的量，平均差不能表示行為變化。
    C: 增加群數會改變分群問題，仍不保證兩次的同號群具有相同意義。
    D: 人數相近或相同的群可能有不同輪廓，按規模排序不能可靠建立成員對應。
