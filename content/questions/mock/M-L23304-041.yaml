stem: 某團隊要把 2 個無偏迴歸模型等權平均，以降低預測誤差的變異數。兩個候選組合中的每個模型，誤差變異數皆為 1。甲組合的誤差共變異數為 0.9，乙組合為 0.1；評估資料與成本相同。僅依這些條件，哪個選擇最適合？
options:
  A: 選乙組合，平均誤差變異數為 0.55
  B: 選甲組合，平均誤差變異數為 0.50
  C: 選甲組合，平均誤差變異數為 0.95
  D: 選乙組合，平均誤差變異數為 0.10
answer: A
explanation:
  summary: 集成平均的降變異效果取決於模型誤差的相關程度。
  correct: 兩模型等權平均的誤差變異數為 (1+1+2×共變異數)/4。甲為 0.95，乙為 0.55，因此乙較適合。單模型誤差相近時，錯誤不高度同步的模型通常更有互補性。
  wrong:
    B: 0.50 是共變異數為 0 時的結果。本例甲的共變異數為 0.9，不能省略交叉項。
    C: 甲的 0.95 計算正確，但目標是降低變異數，乙的 0.55 更低。
    D: 0.10 只是兩模型誤差的共變異數，尚未加上各自變異數並套用平均權重。
