stem: 某聯邦服務已用安全聚合，伺服器看不到單一客戶端更新。但所有參與者仍可下載最終模型，演練發現可從模型輸出推測單一使用者的訓練資訊。團隊希望以「單一使用者加入或退出」為保護單位建立可量化保證。最適合補哪項設計？
options:
  A: 限制每位使用者的更新貢獻，並校準隨機雜訊與隱私預算
  B: 保留更新聚合方式，並提高伺服器備份檔案的加密強度
  C: 限制每輪傳輸的封包大小，並提高客戶端更新壓縮比例
  D: 保留最終模型發布方式，並為更新加上可驗證的數位簽章
answer: A
explanation:
  summary: 隱藏個別更新與限制最終模型的個人資訊洩漏，是不同保護目標。
  correct: 使用者層級差分隱私需界定單一使用者的貢獻，限制敏感度，再搭配適當雜訊與跨輪預算核算。安全聚合本身不構成最終模型的這種保證。
  wrong:
    B: 備份加密保護儲存內容，無法限制參與者從已下載模型中推測個人訓練資訊。
    C: 壓縮可降低通訊量，但沒有依使用者相鄰資料集校準的雜訊與預算，不能推出題定的隱私保證。
    D: 數位簽章驗證來源與完整性，不能限制最終模型對使用者資料的依賴程度。
