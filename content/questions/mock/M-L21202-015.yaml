stem: 某 AI 專案有 2 位模型工程師，能使用既有模型訓練。資料已獲存取許可，但 6 個來源的欄位格式常變，每天仍靠人工合併，尚無固定更新流程。首階段目標是每日自動取得可追溯的建模資料。預算只夠補 1 名專職人員，最適合優先補哪種角色？
options:
  A: 增加模型工程師，負責模型架構選擇與超參數搜尋
  B: 增加介面設計師，負責資料儀表板與操作畫面設計
  C: 增加測試工程師，負責模型分數比較與功能回歸測試
  D: 增加資料工程師，負責來源串接、欄位轉換與更新追蹤
answer: D
explanation:
  summary: 人力配置須優先補上阻礙本階段交付的能力。
  correct: 既有人員已能建模，缺口是多來源資料的持續整合。資料工程師負責串接、清理及轉換，可建立每日更新流程並保存來源紀錄，最直接對應首階段目標。
  wrong:
    A: 模型架構與調參會影響預測能力，但現階段已有建模人員；再增加相同能力不能優先補上資料更新缺口。
    B: 儀表板能協助觀察資料與操作，但呈現畫面不會建立來源串接和欄位轉換，仍缺每日自動更新流程。
    C: 模型比較與回歸測試可發現錯誤，卻不能代替持續收集、轉換及追蹤資料的工程工作。
