stem: 某圖文搜尋系統以 CLIP 的向量餘弦相似度排序，最高分為 0.84。產品經理打算在畫面標示「有 84% 機率是正確商品」，但系統沒有做機率校準或查核分數與正確率的關係。哪項判斷最正確？
options:
  A: 分數表示圖文向量接近程度，尚不能直接當成命中機率
  B: 分數落在 0 到 1 時，就能當成該商品正確的機率
  C: 把各商品分數除以總和，就能得到經實證校準的機率
  D: 最高分減去次高分後，就能得到該商品正確的機率
answer: A
explanation:
  summary: 相似度排序分數不等於校準過的正確機率。
  correct: 餘弦相似度反映向量方向接近程度，不能直接解讀成事件機率。要顯示命中機率，須使用具代表性的已查核資料驗證分數與命中率的關係，必要時另做校準。
  wrong:
    B: 數值範圍不是機率校準證據。餘弦相似度也可能為負，不能只看某次分數落在正值區間。
    C: 除以總和只改變分數表示，沒有用真實命中結果校準；分母還會隨候選商品改變。
    D: 前兩名差距可作排序區別的線索，但沒有自然對應到正確事件的機率。
