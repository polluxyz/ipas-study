stem: 某裝置提供稀疏矩陣加速。團隊實測非結構化剪枝版為 18 毫秒、準確率 93%；結構化剪枝版為 16 毫秒、準確率 88%。兩版容量均合格，要求延遲不超過 20 毫秒且準確率至少 92%。關於這次部署，哪個判斷最正確？
options:
  A: 選結構化版本，較短延遲可作為品質合格的證據
  B: 選結構化版本，通道數較少可作為品質合格的證據
  C: 選非結構化版本，該裝置的實測速度與品質均合格
  D: 選未剪枝版本，稀疏權重的部署效益以參數數量判定
answer: C
explanation:
  summary: 剪枝方案的選擇應依硬體支援與實測要求判定。
  correct: 此裝置具備稀疏加速能力，非結構化版本已實測符合速度與準確率要求。結構化剪枝較易配合許多硬體，但不能因此忽略本例結構化版本品質未達標的結果。
  wrong:
    A: 結構化版本的準確率只有 88%，低於 92% 的要求。更短延遲不能替代品質驗收。
    B: 較少通道反映結構縮減，不代表保留了足夠辨識能力；本例量到的準確率未達要求。
    D: 是否有部署效益應看實際執行結果，不能只看參數數量。本例已有符合要求的剪枝版本，沒有改選未剪枝版本的依據。
