stem: 某研究代理要依序完成 40 項只讀資料分析。每項分析結果都可獨立保存，來源有固定快照版本；但代理程序重啟後只剩最初問題，常從頭重新付費分析。團隊希望重啟後接續已完成的工作，最適合保存哪項資料？
options:
  A: 保存最終答案的格式模板與所有工具的連線位址
  B: 保存程序的資源用量與每項工具的平均回應時間
  C: 保存最初問題與隨機種子，重啟時重新生成分析計畫
  D: 保存任務檢查點、已完成結果與對應來源快照版本
answer: D
explanation:
  summary: 可接續的代理任務需要持久化進度及結果所依據的資料版本。
  correct: 檢查點記錄完成哪些步驟，已完成結果供後續使用，快照版本則確保結果仍對應同一批來源。重啟後可據此從未完成處接續，避免已完成的分析再執行。
  wrong:
    A: 模板與連線資訊可支援重新執行，卻未保存哪些分析已完成及其結果，不能接續進度。
    B: 資源與延遲紀錄有助於維運分析，但不是任務的語意狀態，也沒有保存可供接續使用的結果。
    C: 相同初始條件有助於重現部分行為，卻不會帶回已完成的結果；重新生成計畫仍可能從頭執行。
