stem: 某倉庫比較兩個需求預測器。在同一份驗證資料上，甲的平均絕對誤差為 4 箱、均方根誤差為 9 箱；乙分別為 5 箱與 7 箱。每多預測或少預測 1 箱，處理成本均增加相同金額，沒有額外的大誤差罰款，其他成本也相同。依此成本規則，哪項選擇最適合？
options:
  A: 選甲，以較低的平均絕對誤差作為依據
  B: 選乙，以較低的均方根誤差作為依據
  C: 選甲，以兩個誤差指標的差距較大作為依據
  D: 選乙，以兩個誤差指標的數值較接近作為依據
answer: A
explanation:
  summary: 每單位絕對偏差成本相同時，平均絕對誤差對應平均成本。
  correct: 本例成本與絕對誤差成正比，甲的平均絕對誤差較低，因此同樣案件數下的總處理成本也較低。
  wrong:
    B: 均方根誤差會更強調大誤差；本例沒有額外的大誤差懲罰，不能以它取代指定的線性成本。
    C: 甲的選擇結果雖相同，但指標差距不是成本規則。兩指標差距大通常反映誤差分布不均，並非優點本身。
    D: 兩指標接近可反映誤差分布的特性，卻不代表絕對偏差的平均成本較低。
