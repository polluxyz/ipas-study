stem: 某文件審查器只需判定兩項條件是否矛盾，兩項條件常位於不同段落。為節省記憶體，新版將各段獨立編碼後只保留段落類別票數，跨段矛盾的辨識率下降。若保留節省資源的方向，最適合優先檢查哪項設計？
options:
  A: 提高每段分類頭的寬度，保留現有票數彙整
  B: 加入關鍵段落間的資訊交換，再進行文件判斷
  C: 提高每段分類頭的丟棄率，保留現有票數彙整
  D: 增加各段獨立訓練的輪數，再進行票數彙整
answer: B
explanation:
  summary: 節省注意力成本時，仍要保留任務必要的跨段關聯。
  correct: 矛盾取決於兩項條件之間的關係，單獨段落的類別票數不保留完整配對資訊。可評估具有跨段連線的注意力或分層整合，並確認資源與正確率。
  wrong:
    A: 增加單段分類能力沒有恢復跨段條件的互相比較，票數彙整仍會丟失關係。
    C: 丟棄率處理過度依賴部分單元的問題，不能補回跨段資訊交換。
    D: 延長各段的獨立訓練沒有改變文件判斷可見的資訊，仍無法直接比較兩段條件。
