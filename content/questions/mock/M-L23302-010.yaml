stem: 某維修模型要同時預測 4 種互斥故障類別與剩餘壽命小時數。2 個目標都有標註，且團隊希望共用感測器特徵。最適合的起始架構與訓練安排為何？
options:
  A: 共用特徵層後接 5 類輸出，將壽命小時數視為第 5 個類別
  B: 共用特徵層後接 1 個連續輸出，將故障編號與小時數先相加
  C: 共用特徵層後接 4 類輸出，將各類機率加總當作壽命小時數
  D: 共用特徵層後分接分類頭與迴歸頭，分別計算並加權合併損失
answer: D
explanation:
  summary: 不同型態的多任務目標，須保留各自的輸出意義。
  correct: 分類頭可學習 4 類故障，迴歸頭可輸出連續壽命。分別使用相應損失後再加權，既能共用特徵，也能保留 2 個目標的尺度與意義。權重仍需以驗證資料調整。
  wrong:
    A: 壽命是連續數值，不是與 4 種故障互斥的第 5 個類別，這樣無法同時提供兩個目標。
    B: 相加會混淆單位及意義，也無法由單一和值還原唯一的故障類別與壽命。
    C: 4 類 Softmax 機率加總為 1，不能藉其總和表達不同的小時數。
