stem: 某維修模型要同時預測 4 種互斥故障類別與剩餘壽命小時數。2 個目標都有標註，且團隊希望共用感測器特徵。最適合的起始架構與訓練安排為何？
options:
  A: 共用特徵層後分接分類頭與迴歸頭，兩頭都以均方誤差擬合故障編號與小時數
  B: 共用特徵層後分接分類頭與迴歸頭，迴歸頭以 Sigmoid 輸出未縮放的小時數
  C: 共用特徵層後分接分類頭與迴歸頭，僅以分類交叉熵損失更新全部參數
  D: 共用特徵層後分接分類頭與迴歸頭，分別計算相應損失並加權合併
answer: D
explanation:
  summary: 不同型態的多任務目標，須保留各自的輸出意義。
  correct: 分類頭可學習 4 類故障，迴歸頭可輸出連續壽命。分別使用相應損失後再加權，既能共用特徵，也能保留 2 個目標的尺度與意義。權重仍需以驗證資料調整。
  wrong:
    A: 故障編號沒有大小關係，以均方誤差擬合會把編號差距當成數值差距，應改用分類損失。
    B: Sigmoid 的輸出落在 0 到 1 之間，無法表達未縮放的小時數，迴歸目標學不起來。
    C: 迴歸損失沒有參與更新時，迴歸頭得不到訓練，壽命輸出沒有學習依據。
