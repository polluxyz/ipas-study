stem: 某命名實體辨識模型的人工標籤以原始詞為單位。子詞切分後，一個詞可能變成 3 個子詞。團隊要求每個原始詞只選 1 個子詞位置計算監督損失，避免長詞占較多位置。哪項標籤對齊做法最適合？
options:
  A: 將原詞標籤複製到其每個子詞位置
  B: 把首子詞標為起點，其餘標為延續
  C: 將句子中的實體類型改為句級標籤
  D: 用詞位對應保留首子詞標籤，其餘忽略
answer: D
explanation:
  summary: 子詞標籤要依原詞對應安排，損失位置須符合訓練約定。
  correct: 切分器提供的詞位對應可辨識每個詞的第一個子詞。只在該位置保留標籤，其餘子詞與特殊符號不計損失，便符合一詞一個監督位置的要求。
  wrong:
    A: 複製到每個子詞會讓切成 3 段的詞貢獻 3 個監督位置，與要求不同。
    B: 起點與延續標記可描述實體範圍，但若每段都計損失，長詞仍占較多監督位置。
    C: 句級標籤可用於判斷句中是否有某類實體，卻不能提供原詞位置上的實體監督。
