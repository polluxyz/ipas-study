stem: 某工廠已從無警報零件作隨機抽樣，規劃拆檢以估計漏報。原抽中清單有 100 件，但 30 件因高溫區保存超時而無法檢查；高溫區也可能較易故障。其餘 70 件已拆檢。團隊打算直接按原抽樣機率放大這 70 件的結果。最適合先補哪項工作？
options:
  A: 只保留完成拆檢的清單，依原先隨機抽樣機率放大，維持抽樣估計的簡單性
  B: 把未完成拆檢者標為正常，依原抽中 100 件計算，以維持原先固定的樣本數
  C: 保留未完成者及原因，比較完成情形與高溫區的關聯，改善留樣並評估偏差
  D: 從目前可拆檢的零件補足 30 件，沿用原抽樣機率，以恢復相同樣本數的代表性
answer: C
explanation:
  summary: 最初隨機抽中，不代表最終取得真值的樣本仍具相同代表性。
  correct: 抽中後能否完成拆檢，形成另一層選擇。保存超時與高溫區相關，而高溫區又可能影響故障，完成的 70 件不一定代表原抽樣範圍。須保留原清單與未完成原因，檢查完成率的差異，改善後續留樣，並揭露或評估缺失結果對漏報估計的影響。僅用原抽樣權重不能自動消除這層偏差。
  wrong:
    A: 原抽樣機率描述最初被選中的機會，未涵蓋後來因保存條件而失去標籤的機會。
    B: 無法拆檢代表真值未知，不是已確認正常；直接標正常會系統性壓低估計漏報。
    D: 只從可拆檢者補件仍可能排除高溫區，補足數量不代表恢復相同抽樣設計或代表性。
