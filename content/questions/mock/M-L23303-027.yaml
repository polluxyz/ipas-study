stem: 某工廠只拆檢模型發出警報的零件，沒有警報的零件直接出貨。拆檢標籤可靠，團隊用已拆檢資料宣稱故障召回率很高。若要估計整條產線的故障召回率，下列補充安排何者最適合？
options:
  A: 增加警報零件的拆檢比例，再以更完整的警報標籤估計
  B: 只保留警報分數最高的零件，再以較明確的故障標籤估計
  C: 從無警報零件隨機抽樣拆檢，依抽樣設計估計漏報數量
  D: 對已拆檢零件增加複核次數，再以複核一致的標籤估計
answer: C
explanation:
  summary: 只檢查警報案件，無法得知未被模型找出的故障數。
  correct: 召回率需要知道被找出的故障與漏報故障。無警報零件尚未檢查，漏報數目前未知。對這部分作隨機抽樣拆檢，再依抽樣機率推估整體漏報，才能補足估計所需資訊。
  wrong:
    A: 更多警報標籤可改善警報內部的估計，卻仍沒有觀測未警報區域的故障。
    B: 只選最高分案件會進一步限縮觀測範圍，仍無法得知無警報區域的漏報數。
    D: 複核可檢查標註一致性，但題目已確認標籤可靠。複核同一批警報件不會增加未警報件的資訊。
