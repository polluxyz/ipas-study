stem: 某產線以 2048×2048 影像找出寬約 3 像素的裂縫。將整張圖縮至 128×128 後，人工也看不清裂縫。使用 256×256 原圖區塊時，全圖逐塊推論含重疊區域實測需 80 毫秒，結果彙整另需 5 毫秒。系統延遲上限為 100 毫秒。最適合優先採用哪項方案？
options:
  A: 原圖無重疊切塊，彙整全部區塊且各自獨立判讀
  B: 整圖縮至 128×128，加深網路後彙整多次辨識結果
  C: 原圖重疊切塊，彙整全部區塊並合併邊界辨識結果
  D: 原圖重疊切塊，只採分類信心最高的單一區塊結果
answer: C
explanation:
  summary: 模型選型也要保留任務所需的輸入細節。
  correct: 保持原圖尺度可避免把細裂縫縮至不足 1 像素寬。重疊區域能讓切塊邊界附近的裂縫在另一區塊中保有周邊資訊。彙整全部區塊並合併邊界結果，可涵蓋整張影像。實測總耗時為 85 毫秒，低於 100 毫秒上限。
  wrong:
    A: 無重疊切塊雖保留像素尺度，跨邊界裂縫卻可能失去連續形狀與周邊資訊。各區塊獨立判讀後再彙整，不能補回判讀時缺少的資訊。
    B: 縮圖後裂縫寬度約為 0.19 像素，細節容易流失。加深網路或多次辨識同一張縮圖，都無法保證還原流失的訊號。
    D: 分類信心最高的區塊可能只是容易辨識的正常區域。只採該區塊結果，會忽略其他區塊中的裂縫，未涵蓋全圖檢查需求。
