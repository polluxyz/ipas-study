stem: 某產線以 2048×2048 影像找出寬約 3 像素的裂縫。將整張圖縮至 128×128 後，人工也看不清裂縫。驗證顯示，含邊緣重疊的高解析度小區塊可保留裂縫，逐塊辨識仍符合延遲限制。最適合優先採用哪項方案？
options:
  A: 整圖縮小後加深分類網路
  B: 整圖縮小後擴大訓練批次
  C: 原圖分塊後彙整辨識結果
  D: 整圖縮小後延長訓練輪數
answer: C
explanation:
  summary: 模型選型也要保留任務所需的輸入細節。
  correct: 題幹已確認縮圖會使裂縫難以辨識，且分塊方案可保留訊號並符合延遲。先保留可見細節，模型才有資訊可用。
  wrong:
    A: 加深網路能增加表達能力，但不能恢復縮圖時已消失的裂縫訊號。
    B: 增加批次可改變運算效率與梯度估計，不能恢復輸入中的細節。
    D: 延長訓練只會反覆學習縮圖後的資訊，沒有解決裂縫訊號消失的問題。
