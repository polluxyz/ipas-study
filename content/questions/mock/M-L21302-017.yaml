stem: 某公司有 2 類影像工作。產品公開型錄可送公有雲，且月底才需完成高算力分析；未公開設計圖則依公司政策只能在內網處理。現有內網算力足以完成設計圖每日分析，但若再承接月底型錄便會超過交付期限。要兼顧資料限制與月底算力彈性，哪項部署最適合？
options:
  A: 兩類工作都在內網執行，並以現有設備排隊承接月底型錄的尖峰需求
  B: 兩類工作都送公有雲，透過加密傳輸保護未公開設計圖的傳送過程
  C: 公開型錄使用公有雲彈性算力，未公開設計圖維持內網處理
  D: 公開型錄放內網排程，未公開設計圖改由公有雲專用運算節點處理
answer: C
explanation:
  summary: 混合部署依資料限制與工作負載分配運算位置。
  correct: 公開型錄沒有內網限制，適合使用公有雲承接月底高算力需求；未公開設計圖則留在足夠且符合政策的內網環境。兩類任務不需互換執行位置。
  wrong:
    A: 題目已明示內網若再承接月底型錄就會超過交付期限。維持現有設備排隊無法滿足型錄的交付要求。
    B: 傳輸加密保護傳送過程，但資料仍會離開內網，不符合公司政策。
    D: 專用雲端節點仍在內網之外；這個安排也沒有把可外送的尖峰工作用來取得雲端彈性。
