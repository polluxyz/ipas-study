stem: 某團隊隨機抽取 30 台裝置，每台連續記錄 100 次延遲。同台讀值高度相關，不同裝置彼此獨立，每台量測次數相同。團隊要估計裝置母體的平均延遲，並以有放回重抽資料建立信賴區間。下列重抽單位何者最適合？
options:
  A: 以 3,000 筆讀值為單位，混合裝置後逐筆重抽
  B: 以每台的 100 個時間位置為單位，固定裝置不重抽
  C: 以 30 台裝置為單位，每次保留抽中裝置的整組讀值
  D: 以每台的最大延遲為單位，每次抽取 30 個最大值
answer: C
explanation:
  summary: 重抽樣須保留資料的群聚相依結構。
  correct: 抽樣的獨立單位是裝置。每次抽裝置並保留整組讀值，可保留同台相關性，也反映抽到不同裝置的波動。各台筆數相同，因此整組資料的平均與各台平均再平均相同。這是指引 3-7 統計推論條件的延伸應用。
  wrong:
    A: 逐筆重抽把同台相關讀值視為獨立資訊，可能低估裝置母體平均的抽樣不確定性。
    B: 固定裝置只重抽時間位置，沒有反映抽取不同裝置所帶來的波動。
    D: 最大值的平均估計的是裝置最大延遲的母體平均，與全部讀值所定義的平均延遲不同。
