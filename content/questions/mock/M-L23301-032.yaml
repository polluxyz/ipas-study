stem: 某設備的失效風險同時受每日班別與累積運轉時間影響。連續運轉 48 小時與剛啟動的設備，可能位於相同時刻卻有不同磨耗。若要讓模型區分 2 種影響，哪項特徵組合最適合？
options:
  A: 使用小時的正弦與餘弦，並將累積運轉時間對 24 取餘數
  B: 使用小時的獨熱編碼，並將累積運轉時間對 24 取餘數
  C: 使用累積運轉時間的正弦與餘弦，週期設定為 24 小時
  D: 使用時刻的週期編碼，並保留未取餘數的累積運轉時間
answer: D
explanation:
  summary: 週期相位與累積時間表示不同資訊。
  correct: 時刻的週期編碼表示每日班別位置。未取餘數的累積運轉時間可區分不同磨耗階段，避免把相隔整天的運轉狀態合併。
  wrong:
    A: 累積時間取餘數後，0、24、48 小時會相同，無法保留磨耗所需的差異。
    B: 時刻改用獨熱編碼仍無法補回累積時間取餘數時遺失的整天資訊。
    C: 只用固定 24 小時週期表示累積時間，會把多個不同的累積時長映射到相同位置。
