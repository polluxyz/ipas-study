stem: 某客服模型的每通電話可同時具有多個議題，議題有帳務、設備、合約 3 種。資料中有 [帳務, 設備]、[合約] 與空清單。若要保留每個議題是否出現，讓模型分別學到各議題的影響，最適合哪種表示？
options:
  A: 把每份完整議題清單當作一種類別，再為各種清單配置欄位
  B: 把每個議題配置一個整數代碼，再將同通電話的代碼相加
  C: 把每個議題配置一個二元欄位，再將同通電話出現者設為 1
  D: 把同通電話的議題數當成數值，再對該數值做 Z 分數轉換
answer: C
explanation:
  summary: 一筆可含多個類別時，用多個二元欄位保留各類別的出現狀態。
  correct: 3 個欄位固定對應帳務、設備、合約。第 1 通為 [1,1,0]，第 2 通為 [0,0,1]，空清單為 [0,0,0]。這是多個欄位可同時為 1 的表示，能保留個別議題，且能表達未見過的議題組合。
  wrong:
    A: 每種清單成為獨立類別，只能學各組合的效果，無法讓同一議題在不同組合中共用同一欄位。
    B: 代碼相加可能讓不同議題組合得到相同總和，也引入代碼大小的數值意義。
    D: 議題數保留數量，卻丟失是哪些議題；標準化不會還原這些身分資訊。
