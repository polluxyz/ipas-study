stem: 某檢索注意力在沒有候選文件時，會把該列 3 個分數都設為負無限。工程師用以下程式直接計算 Softmax，尚未另寫空集合處理。最正確的輸出判斷為何？
code: |
  import torch
  s = torch.full((1, 3), float('-inf'))
  p = torch.softmax(s, dim=-1)
  print(p.tolist())
  print(torch.isnan(p).any().item())
code_lang: python
options:
  A: 權重為 [0,0,0]，表示沒有可讀取的文件
  B: 權重為 [1/3,1/3,1/3]，表示文件具有相同分數
  C: 權重為 [1,0,0]，表示使用第 1 份文件作為預設
  D: 權重含有 NaN，該列需要明確的空集合處理
answer: D
explanation:
  summary: 全部候選被遮住時，正規化沒有可分配的有效機率質量。
  correct: 以負無限遮住整列後，Softmax 的數值計算無法產生有效分布，本例會得到 NaN。實作應先辨識空候選列，定義跳過或專用空表示。
  wrong:
    A: Softmax 不會自動把全遮罩列改成零向量；零向量也不滿足一般機率總和為 1 的要求。
    B: 有限且相同的分數可以得到均勻分布，但負無限整列在本程式會產生未定義運算。
    C: 程式沒有設定預設文件的邏輯，Softmax 不會自動選第 1 格。
