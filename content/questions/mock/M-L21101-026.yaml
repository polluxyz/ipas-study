stem: 某文字搜尋系統只比較向量方向。查詢向量 q＝(1,0)，文件甲＝(3,0)，文件乙＝(4,3)。指定使用餘弦相似度，即內積除以兩個向量長度的乘積。甲、乙分數分別為何？
options:
  A: 甲為 1.0，乙為 0.8
  B: 甲為 3.0，乙為 4.0
  C: 甲為 1.0，乙為 0.6
  D: 甲為 0.0，乙為 0.6
answer: A
explanation:
  summary: 餘弦相似度會消除向量長度對內積的直接影響。
  correct: q 的長度為 1，甲長度為 3，乙長度為 5。相似度分別是 3/(1×3)＝1.0、4/(1×5)＝0.8，因此甲與查詢的方向更接近。
  wrong:
    B: 這是未正規化的內積，沒有除以向量長度，會讓較大的乙得到較高分。
    C: 0.6 是乙第二個分量除以長度。查詢只在第一個分量非零，內積應採乙的 4，而非 3。
    D: 0.0 與 0.6 對應錯把查詢當成 (0,1)。題目指定 q＝(1,0)，應比較第一個方向的投影。
