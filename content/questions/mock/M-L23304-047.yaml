stem: 某瑕疵偵測模型剪枝後，整體準確率由 97% 變成 96.8%，推論延遲由 45 毫秒降為 22 毫秒。但裂紋召回率由 94% 降為 78%。驗收要求延遲不超過 30 毫秒，且裂紋召回率至少 90%。其他條件均已達標，最適合如何決策？
options:
  A: 採用目前版本，以整體準確率作為品質門檻
  B: 採用目前版本，以推論延遲作為主要品質證據
  C: 保留目前剪枝比例，調高裂紋判定門檻後重驗
  D: 保護辨識裂紋所需結構，重做剪枝與品質驗證
answer: D
explanation:
  summary: 剪枝的效益須同時符合延遲與重要類別的品質要求。
  correct: 目前版本雖然符合延遲要求，裂紋召回率卻低於驗收門檻。應調整剪枝範圍或比例，保留對裂紋辨識重要的結構，再驗證兩項要求是否同時達標。
  wrong:
    A: 整體準確率容易被數量較多的類別主導，不能取代已明訂的裂紋召回率門檻。
    B: 較短延遲證明速度改善，不能證明裂紋辨識品質合格。驗收要求包含兩者。
    C: 提高裂紋判定門檻會讓模型更難判成裂紋，不能作為改善裂紋漏判的方向。即使可降低誤報，也未解決本例的召回率問題。
