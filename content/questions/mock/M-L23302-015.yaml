stem: 某團隊以每個 10 分鐘時段的 12 個特徵，預測該時段的來件次數。次數可為 0、1、2，亦可能超過 20。初步檢查支持條件泊松假設，團隊希望直接預測非負的期望次數。下列模型設計何者最適合？
options:
  A: 用二元邏輯迴歸，將超過 0 次的機率直接當預測次數
  B: 用泊松迴歸搭配對數連結，估計各時段的期望次數
  C: 用未限制輸出的線性迴歸，直接估計各時段的期望次數
  D: 用多類別分類器辨識 0 至 20 次，取最大機率的次數
answer: B
explanation:
  summary: 依計數目標與輸出範圍挑選迴歸模型。
  correct: 泊松迴歸符合題目已支持的計數分布假設。對數連結將線性預測值轉成正的期望次數，能處理含 0 的觀測計數，也不將期望值限制在 1 或 20 以下。期望次數可為小數，不必等於最常見的整數次數。
  wrong:
    A: 發生至少 1 次的機率與期望次數不同。即使兩時段都有來件，期望可能分別是 2 次與 15 次，單一二元機率無法直接表示這種差異。
    C: 未限制輸出的線性模型可能給出負期望，且沒有採用題目已支持的計數分布。它可以是比較基準，但不符合本題指定需求。
    D: 取最大機率類別估計的是最可能次數，並非期望次數。固定 0 至 20 的類別也限制了超出範圍的輸出。
