stem: |
  某零件分類器要區分亮點位於左側或右側。現有 8×8 特徵圖在這兩種情況下，各通道的平均值相同。團隊將每個通道的整張圖取平均，再交給分類器，沒有加入座標。若要保留這項分類所需的資訊，下列調整何者最適合？
options:
  A: 增加平均值後方分類器的層數，讓分類器從相同平均值還原亮點位置
  B: 將各通道平均值乘以相同常數，讓左右位置轉成可分離的數值尺度
  C: 保留左右區域的獨立表示，再讓分類器比較兩區域的亮點特徵
  D: 增加平均值後方分類器的訓練輪數，讓兩類的相同輸入逐漸分開
answer: C
explanation:
  summary: 判斷空間平均可能刪除任務所需的位置差異。
  correct: 兩類的通道平均值相同，後方分類器就拿不到左右差異。保留左右區域的表示，才能讓分類器依位置作判斷。
  wrong:
    A: 增加後方層數無法從相同輸入恢復已丟失的位置差異。
    B: 相同數值乘以相同常數後仍相同，不會產生左右資訊。
    D: 增加訓練輪數無法解決兩種標籤對應相同表示的問題。
