stem: 某團隊先用驗證集選好模型設定，再把訓練集與驗證集合併，依選定設定重新訓練一次，產生新的模型權重。原先的測試集尚未參與任何選擇或訓練。對重新訓練後的模型，哪項評估方式最適合？
options:
  A: 用保留的測試集評估這次重新訓練的模型
  B: 用原訓練集與原驗證集的分數差估計泛化表現
  C: 用合併資料的交叉驗證平均分數代替新權重的獨立測試
  D: 用合併資料的訓練分數作為新權重的泛化分數
answer: A
explanation:
  summary: 合併訓練與驗證資料後，仍需評估新產生的模型。
  correct: 原測試集仍未參與選擇與擬合，可用於評估重新訓練後的新模型。驗證資料一旦加入訓練，就不能再視為未參與權重學習的觀測。
  wrong:
    B: 原訓練集與原驗證集都已用於這次權重學習，兩者分數差只能比較已學資料的擬合情況，無法提供新模型對未知資料的獨立評估。
    C: 交叉驗證會另外訓練各折模型，分數不等於這組新權重的實測結果。合併資料也已包含選擇設定時用過的驗證資料，不如保留測試集提供獨立的最終評估。
    D: 合併資料的訓練分數反映已學資料的擬合程度，不能代替未知資料上的泛化評估。
