stem: 某工程師將暫定權重 v=(0.8,0.5,-0.1) 調整成 w，要求每個 wᵢ≥0 且總和為 1。調整目標是最小化 Σ(wᵢ-vᵢ)²。以下 4 組都符合權重限制，哪組最適合？
options:
  A: (8/13, 5/13, 0)
  B: (0.80, 0.20, 0)
  C: (0.50, 0.50, 0)
  D: (0.65, 0.35, 0)
answer: D
explanation:
  summary: 最近的合法權重由距離最小化決定，與比例正規化不同。
  correct: 非負且總和為 1 的平方距離投影可寫成 wᵢ=max(vᵢ-τ,0)。取 τ=0.15，得到 (0.65,0.35,0)，總和為 1，平方距離為 0.055。它同時滿足此凸問題的最適條件。指引介紹權重限制，本題補充最近點投影。
  wrong:
    A: 先截去負值再除以總和可以得到合法權重，但平方距離約 0.05740，高於 0.055，並不是此距離目標的最近點。
    B: 此法保留第 1 個權重，只調小第 2 個，平方距離為 0.10；讓兩個正權重共同減少可降低調整成本。
    C: 平均分配前兩個權重可滿足限制，但平方距離為 0.10。題目要接近暫定權重，不是要求兩者相等。
