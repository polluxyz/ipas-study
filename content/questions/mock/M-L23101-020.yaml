stem: 某服務的延遲符合常態模型，母體標準差已知為 10 毫秒。團隊用同一批 100 筆獨立樣本，分別建立平均延遲的雙尾 90% 與 99% 信賴區間，臨界值取 1.645 與 2.576。99% 區間的總寬度約為 90% 區間的幾倍？
options:
  A: 0.64 倍
  B: 1.25 倍
  C: 1.57 倍
  D: 2.45 倍
answer: C
explanation:
  summary: 相同資料與模型下，提高信賴水準會增加區間寬度。
  correct: 區間總寬度為 2z×10/√100。兩個區間使用相同標準誤，因此寬度比為 2.576/1.645≈1.57。提高涵蓋水準須接受較寬的估計區間。
  wrong:
    A: 0.64 約為 1.645/2.576，顛倒了分子與分母，代表的是 90% 區間相對於 99% 的寬度。
    B: 1.25 約為兩個臨界值比值的平方根，但寬度與臨界值成正比，不需再開平方。
    D: 2.45 約為臨界值比值的平方；區間寬度不是與臨界值平方成正比。
