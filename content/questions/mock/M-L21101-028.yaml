stem: 某文字服務限制每次最多 64 個詞元，不計特殊符號。兩段文字都是 60 個字元，但既定切分器分別產生 40 與 90 個詞元。舊程式用字元數判斷能否一次送入。若要保留全文資訊，最適合改成哪項做法？
options:
  A: 以字元數乘固定平均比例，直接決定是否送入
  B: 以兩段文字的平均詞元數，決定共用輸入長度
  C: 以既定切分器計數，超限文字改走分段流程
  D: 把最低詞頻門檻提高後，重新建立分類器詞表
answer: C
explanation:
  summary: 模型長度限制依詞元計算，不能直接以字元數替代。
  correct: 相同字元數不保證相同詞元數。應以模型配套切分器量測，讓超過 64 個詞元的內容進入分段流程，並驗證後續彙整。
  wrong:
    A: 平均比例可粗估成本，卻不能保證每筆都在上限內；題目已顯示相同字元數可能有不同詞元數。
    B: 平均值無法保證較長的單筆合格。每次請求的限制必須逐筆檢查。
    D: 模型既定切分器的詞元長度不是由下游分類器詞頻門檻決定，改詞表也可能破壞模型輸入對應。
