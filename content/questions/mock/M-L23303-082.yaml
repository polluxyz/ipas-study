stem: 某平台在同一批 1,000 筆需求預測上，宣稱平均絕對誤差為 8 件，均方根誤差為 6 件。團隊確認兩個指標都使用相同的逐筆真值、預測值與等權重，也都以件數計算。主管要發布報告，哪項處理最適合？
options:
  A: 以均方根誤差較低為由宣告大誤差控制良好
  B: 先核對兩個指標的計算與報表欄位對應
  C: 以平均絕對誤差較高為由宣告小誤差較多
  D: 將兩個指標取平均後作為整體誤差發布
answer: B
explanation:
  summary: 同一組等權重誤差的均方根誤差，不會低於平均絕對誤差。
  correct: 均方根誤差對較大的絕對偏差給予更高影響。在相同資料與權重下，其值至少與平均絕對誤差相等，所報的 6 小於 8 需要核查。
  wrong:
    A: 這兩個數值在題定條件下不一致，不能先把數值大小解讀為模型已控制大誤差。
    C: 兩指標的順序不符合相同等權重資料的性質，不能用來推斷小誤差的數量。
    D: 直接平均會掩蓋計算或欄位對應問題，不能修正彼此矛盾的結果。
