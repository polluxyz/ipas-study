stem: 某團隊把同一批 200 位客戶分為 3 群。兩次執行後，每一對客戶是否同群的結果都相同，但群號由 0、1、2 改成 2、0、1。若要比較分群是否真的改變，下列判斷何者最正確？
options:
  A: 群號的數值差異代表客戶距離已改變，應比較群號的均方誤差
  B: 群號的大小代表客戶排序已改變，應比較群號的等級相關
  C: 群組成員的劃分維持相同，應使用不受群號置換影響的比較
  D: 群號的名稱就是業務類別，應以未對齊群號的分類準確率比較
answer: C
explanation:
  summary: 分群標籤通常只是名稱，群號置換不代表群組成員改變。
  correct: 兩次的同群關係逐對一致，所以分群劃分相同。群號沒有固定的類別語意或數值距離，適合使用依成員關係比較且不受群號置換影響的指標。
  wrong:
    A: 群號的數值差不是特徵空間的距離。對群號算均方誤差會把單純重新命名誤判為結果改變。
    B: 群號不具備業務上的順序。等級相關會引入題目未定義的排序關係。
    D: 非監督式分群的編號不會自動對應業務類別。未對齊名稱就算分類準確率，會懲罰純粹的編號置換。
