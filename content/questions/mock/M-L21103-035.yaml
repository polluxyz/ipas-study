stem: 某文案團隊要探索不同風格的虛構活動標語。目前使用非常低的取樣溫度，每次候選幾乎相同。提示與模型版本暫時固定，候選都會經人工篩選。若要擴大初稿的表達多樣性，最適合優先測試哪項生成設定？
options:
  A: 適度提高取樣溫度，並比較多樣性與可用比例
  B: 進一步降低取樣溫度，並比較多樣性與可用比例
  C: 改為逐步選最高機率詞元，並比較多樣性與可用比例
  D: 調低每步的候選詞數上限，並比較多樣性與可用比例
answer: A
explanation:
  summary: 創意初稿可透過取樣設定探索多樣性與品質的取捨。
  correct: A 適度放寬原先集中的取樣分布，較有機會取得不同表達。提高溫度也可能增加不合用的文字，因此須同時評估多樣性與人工可用比例，不能只計算生成數量。
  wrong:
    B: 再降低溫度會進一步偏向較高機率的詞元，通常使候選更集中，與擴大探索的目標相反。
    C: 逐步固定選最高機率詞元屬確定性的選擇，在相同條件下不適合用來擴大候選變化。
    D: 減少可取樣的候選詞元會排除部分較低機率的選擇，通常讓取樣更集中，不是擴大表達探索的方向。
