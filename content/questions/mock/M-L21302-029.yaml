stem: 某預測服務採藍綠部署，新舊環境共用資料庫。新版預計把金額由整數欄位改存成文字欄位，舊版程式只能讀取原整數欄位。團隊須保留切回舊版後處理最新交易的能力。最適合的資料變更安排為何？
options:
  A: 先新增欄位並維持兩版可讀，待回復期限結束再移除舊欄位
  B: 先備份切換前的資料庫，切回時以該備份替換共用資料庫
  C: 先完成金額欄位的型別轉換，再保留兩套環境供入口切換
  D: 先在綠環境增加推論副本，再於切換時同步改變欄位型別
answer: A
explanation:
  summary: 可回復的發布必須讓舊程式讀懂新版運作後的資料。
  correct: 先擴充資料格式並維持新舊欄位的一致性，可讓兩版讀取最新交易。等舊版不再是回復點後才移除舊欄位，能保留資料相容路徑。仍須測試雙寫或同步程序。
  wrong:
    B: 切換前的備份不含切換後的新交易，直接替換會遺失最新交易，無法滿足回復後繼續處理的要求。
    C: 入口切回只改變程式環境，不會讓舊程式理解已改變型別的資料；保留環境本身不足以回復。
    D: 副本增加可提高運算容量，卻不會修正舊程式對金額欄位的讀取方式。
