stem: 某設備成本模型使用 8 萬筆表格資料。團隊要求：其他輸入固定時，使用時數增加，預測維護成本不得下降；其他特徵仍需學習非線性與交互作用。下列起始模型設計何者最適合？
options:
  A: 用一般隨機森林，將使用時數列為高重要特徵
  B: 用一般梯度提升樹，提高使用時數的抽樣機率
  C: 用帶單調限制的梯度提升樹，限制使用時數方向
  D: 用一般深度網路，將使用時數縮放成正值輸入
answer: C
explanation:
  summary: 區分特徵的重要程度與模型的單調方向限制。
  correct: 單調限制可要求模型在其他輸入固定時，對指定特徵維持非遞減預測。梯度提升樹仍可對其他特徵學習非線性與交互作用。這是對模型可表達函數的限制，與某特徵排名高低不同。
  wrong:
    A: 特徵重要性只表示模型使用該特徵的程度，不能保證它對每個個案的變化方向。
    B: 提高抽樣機率會增加特徵參與建樹的機會，不會限制分裂後預測值必須隨時數增加而不下降。
    D: 把輸入轉為正值不會限制網路權重與整體函數方向。正值輸入也可能對應下降的輸出。
