stem: 某團隊以已統一尺度的感測特徵建立線性迴歸模型。只用 L1 懲罰時，相關特徵的入選名單隨資料切分明顯改變；只用 L2 懲罰時，係數較穩定，卻仍保留許多無用特徵。團隊希望兼顧稀疏篩選與相關特徵的係數穩定性。下一輪最適合優先比較哪項設定？
options:
  A: 維持純 L1 懲罰，搜尋更大的係數以加強稀疏篩選
  B: 維持純 L2 懲罰，搜尋更大的係數以加強權重收縮
  C: 合用 L1 與 L2 懲罰，聯合搜尋兩項懲罰的係數
  D: 移除 L1 與 L2 懲罰，改以最小訓練誤差選取模型
answer: C
explanation:
  summary: 需要稀疏篩選與係數穩定時，可聯合調整 L1 與 L2 懲罰。
  correct: Elastic Net 同時使用 L1 與 L2。L1 提供係數歸零的篩選效果，L2 則緩和相關特徵造成的係數不穩。這符合兩組實驗各自揭露的限制。兩個係數仍須依驗證結果調整，不能保證所有相關特徵都會保留。
  wrong:
    A: 加強 L1 可增加稀疏程度，但沒有加入穩定相關係數的 L2 限制；也可能刪去重要訊息。
    B: 加強 L2 可進一步收縮係數，但不提供 L1 式的稀疏篩選，無法同時回應兩項需求。
    D: 移除懲罰後，既沒有稀疏限制，也失去係數收縮的穩定作用。訓練誤差最低不能代替驗證表現。
