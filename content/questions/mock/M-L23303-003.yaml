stem: 某瑕疵分類器以瑕疵為正類。獨立驗證結果為 TP=45、FP=15、FN=5、TN=135。指定二元 F1=2TP/(2TP+FP+FN)。F1 最接近多少？
options:
  A: "0.818"
  B: "0.900"
  C: "0.750"
  D: "0.825"
answer: A
explanation:
  summary: 混淆矩陣與 F1。
  correct: 依公式 F1=90/(90+15+5)=90/110≈0.818。也可先算 precision=0.75、recall=0.90，再取調和平均。
  wrong:
    B: 0.900 可由本題召回率 45/(45+5) 得到，也恰等於準確率，但不是 F1。
    C: 這是精確率 45/(45+15)，未與召回率取調和平均。
    D: 這是精確率 0.75 與召回率 0.90 的算術平均，F1 使用調和平均。
