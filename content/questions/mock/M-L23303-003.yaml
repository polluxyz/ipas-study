stem: 某警報系統比較兩個門檻，甲的精確率 P=0.9、召回率 R=0.5；乙為 P=0.6、R=0.8。主管希望在綜合指標中提高召回率的相對重要性，指定 Fβ=(1+β²)PR/(β²P+R)，且 β=2。按 F2 選擇時，哪項結果最正確？
options:
  A: 選乙；甲約 0.55，乙約 0.75。
  B: 選甲；甲約 0.78，乙約 0.63。
  C: 兩者相同；F2 仍與 F1 一樣對待兩項指標。
  D: 選乙；甲約 0.70，乙約 0.70，但乙召回較高。
answer: A
explanation:
  summary: Fβ 的 β 大於 1 時，綜合分數提高召回率的相對重要性。
  correct: 補充：Fβ 是 F1 的延伸，β>1 偏重召回率。代入 β²=4，甲為 5×0.9×0.5/(4×0.9＋0.5)≈0.55；乙為 5×0.6×0.8/(4×0.6＋0.8)=0.75，因此選乙。β 不是把兩項指標做一般算術平均，也不是每次漏報成本的直接倍數。
  wrong:
    B: 這組約 0.78、0.63 接近偏重精確率的 F0.5，不是本題 F2。
    C: β 改變兩者相對權重，不能仍當成 F1 的等權調和平均。
    D: 0.70 是各自精確率與召回率的算術平均，不符合題目給定公式。
