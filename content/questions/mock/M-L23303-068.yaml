stem: 某維修平台比較兩版警報模型，兩版都在分數至少 0.5 時發出警報。同一測試集上，甲版精確率為 0.84、召回率為 0.63；乙版精確率為 0.74、召回率為 0.70。以上數值皆為精確值。驗收指標為此固定門檻下的 F1，計算結果四捨五入至小數第 3 位。哪項計算與比較正確？
options:
  A: 甲版較佳，甲版 F1 約為 0.720、乙版約為 0.719
  B: 乙版較佳，甲版 F1 約為 0.630、乙版約為 0.700
  C: 甲版較佳，甲版 F1 約為 0.735、乙版約為 0.720
  D: 乙版較佳，甲版 F1 約為 0.719、乙版約為 0.720
answer: A
explanation:
  summary: 精確率與召回率各有高低時，須計算 F1 才能比較。
  correct: F1=2×精確率×召回率／（精確率＋召回率）。甲版為 2×0.84×0.63／1.47=0.720；乙版為 2×0.74×0.70／1.44≈0.719444。甲版在本次固定門檻下的 F1 略高。兩版各有一項較高，不能只憑精確率或召回率代替 F1。
  wrong:
    B: 0.630 與 0.700 是兩版的召回率，未合併精確率，不能當成 F1。
    C: 0.735 與 0.720 是精確率與召回率的算術平均。F1 使用調和平均，不能直接將兩數相加後除以 2。
    D: 兩版的 F1 計算結果對調了。甲版約為 0.720，乙版約為 0.719，因此甲版略高。
