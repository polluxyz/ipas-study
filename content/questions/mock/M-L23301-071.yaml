stem: 某系統有 100 萬筆正常操作與 5,000 筆異常操作，準備減少正常類以縮短訓練時間。正常操作中有一種低溫啟動模式，外觀與異常相似，但經確認屬正常。初步隨機抽樣幾乎沒留下這種模式。下列調整何者最適合？
options:
  A: 提高異常類的抽樣倍數後沿用目前正常樣本
  B: 減少輸入欄位數後沿用目前正常樣本
  C: 按正常操作模式分組抽樣並保留低溫啟動案例
  D: 增加一般正常操作的抽樣量並排除低溫啟動案例
answer: C
explanation:
  summary: 欠採樣仍需保留重要的正常子類型。
  correct: 低溫啟動是容易與異常混淆的正常模式。分組抽樣可控制訓練規模，同時保留這類重要反例。
  wrong:
    A: 增加異常類不能補回缺少的正常模式，可能讓模型更容易把低溫啟動判為異常。
    B: 減少欄位可能降低運算成本，但目前資料缺少的是重要的樣本模式，不是欄位太多。
    D: 更多一般正常樣本不能替代低溫啟動的特徵。排除這些有效案例會保留原本的覆蓋缺口。
