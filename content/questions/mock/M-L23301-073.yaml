stem: 某企業從文件中取得 50,000 個候選特徵，想先縮小範圍，再比較多種分類器。第一階段只要求快速檢查單一特徵與標籤的關聯，尚不評估特徵組合。下列方法何者最適合這個階段？
options:
  A: 逐步加入特徵並反覆重訓分類器
  B: 反覆訓練分類器並刪除貢獻最低的特徵
  C: 列出候選特徵子集並比較分類器的驗證分數
  D: 計算特徵與標籤的統計關聯後進行初步篩選
answer: D
explanation:
  summary: 先做大量特徵的快速初篩，可使用不依賴分類器的統計方法。
  correct: 過濾法直接衡量特徵與標籤的統計關聯，符合先檢查單一特徵及快速縮小範圍的需求。後續仍需驗證組合效果。
  wrong:
    A: 逐步加入並重訓屬於包裝法，重點是特徵組合對模型的影響，成本也高於本階段所需。
    B: 反覆重訓與刪除是模型導向的特徵篩選，不是單一統計關聯的快速初篩。
    C: 比較子集的驗證分數要反覆建模，適合後續評估組合，與這一階段的任務不同。
