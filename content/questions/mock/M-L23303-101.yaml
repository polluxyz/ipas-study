stem: 某出貨量模型在保留資料上的預測如程式所示。皮爾森相關係數衡量兩組數值的線性關聯，平均絕對誤差則衡量逐筆差距。主管看到兩者相關係數為 1，就認定模型已準確預測箱數。依程式輸出，哪項判斷最正確？
options:
  A: 相關係數為 1，表示每筆預測的箱數都正確
  B: 相關係數為 1，仍存在平均 2.5 箱的絕對誤差
  C: 平均絕對誤差為 2.5，表示兩組數值沒有線性關聯
  D: 平均絕對誤差為 0，表示比例差異不影響預測準確度
answer: B
explanation:
  summary: 完美線性關聯不能保證預測數值與真值相等。
  correct: 補充：預測與真值的相關係數描述線性關聯，不等同預測誤差。程式印出 1.0 與 2.5。預測固定是真值的 2 倍，線性關聯仍為 1，但逐筆絕對誤差是 1、2、3、4 箱，平均為 2.5 箱。箱數是否準確仍須使用誤差指標判斷。
  wrong:
    A: 相關係數為 1 表示同方向的完美線性關聯，不要求兩組數值逐筆相等。本例每筆都高估。
    C: 誤差大小與線性關聯是不同面向。本例雖有 2.5 箱的平均絕對誤差，仍滿足 pred=2×y。
    D: 絕對誤差使用原始箱數相減，比例偏差仍會計入。四筆絕對誤差平均為 2.5，並非 0。
