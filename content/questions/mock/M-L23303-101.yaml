code: |
  import numpy as np
  y = np.array([1., 2., 3., 4.])
  pred = np.array([2., 4., 6., 8.])
  correlation = np.corrcoef(y, pred)[0, 1]
  mae = np.mean(np.abs(y - pred))
  print(round(correlation, 2), round(mae, 2))
