stem: 某模型在第 6 輪把歷來最低的驗證損失更新為 0.30，後續第 7、8、9 輪依序為 0.32、0.34、0.35。規則是連續 3 輪沒有更低損失便停止。系統每輪都有保存權重，但停止時記憶體仍是當輪權重。若要交付這次訓練中驗證損失最低的模型，最適合怎麼做？
options:
  A: 交付第 9 輪權重，再附上第 6 輪的驗證分數
  B: 載入第 6 輪權重，再用保留的測試集做最終評估
  C: 交付第 9 輪權重，再用訓練損失補充選擇依據
  D: 平均第 6 至 9 輪權重，再沿用第 6 輪的驗證分數
answer: B
explanation:
  summary: 停止的輪次與驗證最佳權重的輪次可能不同。
  correct: 停止規則會在第 9 輪觸發，但最低驗證損失出現在第 6 輪。早停若沒有自動恢復最佳權重，必須自行載入該輪保存檔。完成選擇後，才能以未參與選擇的測試集取得最終分數。
  wrong:
    A: 第 6 輪的分數屬於第 6 輪權重，不能標在第 9 輪權重上。
    C: 訓練損失不能取代指定的驗證損失來挑選交付權重。
    D: 平均權重會得到另一個模型，其驗證損失未知，不能沿用單輪分數。
