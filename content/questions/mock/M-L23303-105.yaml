stem: 某團隊已訓練好風險模型，之後在 1,000 筆資料上試了 30 個分類門檻，挑出 F1 最高的門檻。這 1,000 筆沒有用於模型權重訓練。若要報告所選門檻對新案件的最終表現，下列安排何者最適合？
options:
  A: 固定門檻，將原 1,000 筆打亂後再評分
  B: 固定門檻，將原 1,000 筆分層彙總後再評分
  C: 固定門檻，在另一批未參與門檻選擇的資料評分
  D: 固定門檻，在原 1,000 筆上改報準確率與 F1
answer: C
explanation:
  summary: 分類門檻也屬於會使用驗證資料進行的選擇。
  correct: 挑選門檻已經使用這 1,000 筆的標籤，因此該批資料屬於選擇流程的一部分。即使沒有更新模型權重，最高 F1 仍可能因挑選而偏樂觀。固定模型與門檻後，應另用未參與選擇的資料評估。
  wrong:
    A: 打亂只改變排列，不會撤回門檻選擇已使用過的標籤資訊。
    B: 分層彙總能看子群差異，不能讓原資料成為獨立於選擇的測試集。
    D: 增加指標可補充表現面向，但未更換參與過選擇的評估資料。
