stem: 某瑕疵模型以瑕疵為正類。初始測試結果為真正 30 件、假正 10 件、假負 20 件、真負 40 件。模型與門檻固定後，報表再納入 100 件均判對的正常品，原有案件的預測不變。更新後的準確率與正類 F1 分數依序最接近哪項？
options:
  A: 準確率 70.0%；正類 F1 為 0.667
  B: 準確率 85.0%；正類 F1 為 0.850
  C: 準確率 85.0%；正類 F1 為 0.667
  D: 準確率 85.0%；正類 F1 為 0.897
answer: C
explanation:
  summary: 新增真負會提高本例準確率，但不改變正類 F1。
  correct: 更新後真負為 140，總數為 200。準確率為 (30+140)/200=85%。正類 F1=2×30/(2×30+10+20)=0.667。真正、假正與假負都沒有改變，因此正類 F1 維持原值；準確率提高並不表示瑕疵辨識改善。
  wrong:
    A: 70% 是原先 100 件的準確率。新增 100 件正確正常品後，正確數與總數都增加，準確率改為 85%。
    B: 0.850 是更新後的準確率。正類 F1 由精確率與召回率決定，不能直接用準確率代替。
    D: 0.897 約為把新增 100 件誤加到真正後的 260/290。新增案件是真負，不能增加 F1 公式中的真正數。
