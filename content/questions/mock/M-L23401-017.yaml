source: mock
subject: 1
type: 情境
codes: [L23401]
concepts: [api-access-security, privacy-governance]
stem: |
  某模型訓練工作只需讀取指定專案資料與寫入指定模型目錄，通常運行 2 小時。現行做法把長效共用管理員憑證放進每個訓練容器；其中一個容器外洩後，憑證可存取其他專案。若要縮小未來單一工作外洩的影響，最適合的憑證設計為何？
options:
  A: "每個工作取得短效獨立憑證，權限限於指定資料與模型目錄"
  B: "每個工作取得不同管理員憑證，權限維持涵蓋全部專案資源"
  C: "全部工作共用長效專案憑證，權限限於指定資料與模型目錄"
  D: "全部工作共用管理員憑證，每次發現事故後立即更換新憑證"
answer: A
explanation:
  summary: "依工作範圍與生命週期限制憑證的影響範圍。"
  correct: "獨立憑證讓工作身分可區分，短效限制外洩後的有效時間，資源範圍權限限制跨專案存取。這些控制共同縮小單一工作遭入侵的影響。指引科目 1 的 5-15 頁說明身分驗證、授權及角色權限；每個工作取得短效獨立憑證的設計屬補充，參見 [AWS 權限管理最佳實務](https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html)。"
  wrong:
    B: "獨立憑證有助辨識與撤銷，但每份仍有全部管理權，無法縮小有效期間內的跨專案影響。"
    C: "限定專案可降低跨專案風險，但長效共用憑證仍會使同專案其他工作一起受影響，也無法按單一工作撤銷。"
    D: "事後輪替能中止已知外洩的憑證，卻未預先降低單一憑證的廣泛權限與共用影響。"
guide_refs: [guide-1:5-15]
