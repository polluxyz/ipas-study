stem: 某團隊發現 Transformer 在訓練時可同時計算多個文字位置，因此預期正式生成 200 個字時，也能用一次相同運算取得整段。服務採自迴歸生成，每個新字都接在已選出的字後面。對這項預期，何者最正確？
options:
  A: 生成時各位置可直接沿用訓練期間的並行方式
  B: 增加訓練批次即可讓整段生成改成一次運算
  C: 生成時仍有逐字依賴，需另外量測完整回覆延遲
  D: 增加注意力頭數即可讓後續字詞同步選取
answer: C
explanation:
  summary: 訓練能並行計算，不代表自迴歸生成能同時選定後續文字。
  correct: 自迴歸生成的下一步使用已選出的前文字詞。訓練可一次提供已知目標序列，但正式生成尚未取得後續選詞，所以仍需評估逐步生成的延遲。
  wrong:
    A: 訓練時已知的目標序列與生成時尚未選出的文字不同，不能直接沿用相同並行假設。
    B: 訓練批次影響同時處理多少訓練樣本，不會解除正式生成對先前選詞的依賴。
    D: 多頭注意力可學習不同關聯，不能改變自迴歸流程必須先取得前文的條件。
