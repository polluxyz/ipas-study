stem: 某檢測團隊以 2 個已縮放特徵區分正常與異常。正常樣本集中在中央，異常樣本分布於外圍環狀區域。團隊只比較支援向量機，且暫不另外設計特徵。若希望模型能表達這種封閉的非線性邊界，下列方案何者最適合？
options:
  A: 採徑向基底核，固定極大核寬度並維持懲罰係數為 1
  B: 採 1 次多項式核，以驗證資料調整分類錯誤的懲罰係數
  C: 採線性核，以驗證資料調整決策分數的分類判定門檻
  D: 採徑向基底核，以驗證資料調整核寬度與懲罰係數
answer: D
explanation:
  summary: 核函數的選擇決定支援向量機能表達的邊界形狀。
  correct: 徑向基底核可形成彎曲且封閉的分類區域，適合驗證中央與外圍環狀的分界。核寬度會影響邊界的平滑程度，懲罰係數會影響容忍錯誤的程度。兩者應以保留的驗證資料選擇，不能只依訓練結果判定。
  wrong:
    A: 核寬度若遠大於樣本間距，樣本間的核值會很接近。固定一般大小的懲罰係數時，模型可能過度平滑甚至接近固定輸出，難以區分中央與外圍。只選非線性核卻固定極端參數，仍不適合作為此任務的起始方案。
    B: 1 次多項式核只提供一次項與常數項，決策邊界仍為直線。調整懲罰係數無法讓直線形成封閉區域。
    C: 改門檻會移動線性分界，不能把直線變成封閉曲線。
