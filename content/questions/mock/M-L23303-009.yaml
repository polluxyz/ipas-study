stem: 某團隊用固定的 1,000 筆驗證資料比較同一線性分類器。訓練樣本由 2,000 增為 4,000、8,000 筆時，訓練準確率依序是 72%、71%、71%，驗證準確率是 70%、70%、70%。訓練已收斂，標籤品質已抽查，業務目標為 85%。依這組學習曲線，最值得優先驗證哪項方向？
options:
  A: 增加有效特徵或模型表達能力，再比較驗證表現
  B: 沿用同一模型繼續增加資料，視為唯一必要的修正
  C: 大幅加強正則化，因為訓練與驗證接近必屬高變異
  D: 移除固定驗證集，改用訓練準確率確認是否達標
answer: A
explanation:
  summary: 訓練與驗證同時停在低分，可優先檢查欠擬合。
  correct: A 是值得先做的實驗。分數接近且訓練資料增加後仍停滯，較支持偏差偏高或表示不足。可加入有依據的交互特徵，或比較能表達非線性的方法。這是診斷方向，不能只憑曲線證明唯一原因。
  wrong:
    B: 目前擴充資料未帶來明顯改善，不能斷言只有增加資料就足夠。
    C: 兩邊分數都低且差距小，較支持表達能力不足，不是典型高變異訊號。
    D: 移除驗證資料會失去未見資料的比較依據，也不會提升模型能力。
