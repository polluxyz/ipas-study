stem: 某團隊繪製學習曲線，訓練資料由 1000 筆增至 10000 筆時，訓練與驗證損失都提高。每次試驗卻都只准更新 100 步；新增資料後，每筆資料平均參與更新的次數下降，且訓練損失在第 100 步仍持續下降。若要判斷是否需要增加模型容量，應先做哪項對照？
options:
  A: 讓各資料量先獲得充分收斂機會，再比較曲線。
  B: 維持 100 步，直接把兩條高損失視為容量不足。
  C: 只比較第 100 步的驗證損失，排除訓練曲線。
  D: 先擴大模型容量，再把更高訓練損失視為過擬合。
answer: A
explanation:
  summary: 學習曲線的資料量比較須區分模型容量與尚未完成的最佳化。
  correct: 第 100 步仍下降，表示尚無訓練已收斂的證據。固定更新步數又增加樣本數，會改變每筆資料的平均學習機會。應先讓每個資料量都有足夠訓練，再比較訓練與驗證曲線，才能判斷持續高損失是否支持增加容量。
  wrong:
    B: 未充分訓練也可能讓兩條損失都高，現在不能直接歸因於容量。
    C: 只留一個終點分數，仍無法排除大資料版本沒有訓練完成的影響。
    D: 擴大容量前未排除訓練不足，且高訓練損失本身不是過擬合的證據。
