stem: 某團隊用固定的 1,000 筆驗證資料比較同一線性分類器。訓練樣本由 2,000 增為 4,000、8,000 筆時，訓練準確率依序是 72%、71%、71%，驗證準確率是 70%、70%、70%。訓練已收斂，標籤品質已抽查，業務目標為 85%。依這組學習曲線，最值得優先驗證哪項方向？
options:
  A: 增加有效特徵或模型表達能力，再比較驗證表現
  B: 增加同分布訓練資料，優先改善小樣本造成的高變異
  C: 提高正則化強度，優先抑制模型對訓練資料的過度擬合
  D: 延長相同設定的訓練，優先解決尚未充分優化的低準確率
answer: A
explanation:
  summary: 訓練與驗證同時停在低分，可優先檢查欠擬合。
  correct: A 是值得先做的實驗。分數接近且訓練資料增加後仍停滯，較支持偏差偏高或表示不足。可加入有依據的交互特徵，或比較能表達非線性的方法。這是診斷方向，不能只憑曲線證明唯一原因。
  wrong:
    B: 高變異常見訓練分數高、驗證分數低的落差；本例兩者都低且增加資料後驗證分數停在 70%，不支持優先靠擴充同分布資料解決高變異。
    C: 正則化主要限制模型複雜度以抑制過度擬合；本例訓練與驗證僅差 1 至 2 個百分點，且兩者都遠低於目標，加強限制可能加重欠擬合。
    D: 題幹已說明訓練收斂，缺少尚未充分優化的依據；沿用設定延長訓練，不能針對曲線呈現的偏差或表示不足提供改善。
