stem: 某殘差區塊的輸入形狀是 (8,32,24,24)，主路徑輸出是 (8,64,12,12)，格式依序為批次、通道、高、寬。工程師要將兩條路徑逐元素相加，且捷徑需保留可學習的通道映射。最適合的捷徑為何？
options:
  A: 用步幅 2 的最大池化，直接將池化輸出與主路徑相加
  B: 用步幅 1 的 1×1 卷積，把 32 通道映射成 64 通道
  C: 用步幅 2 的 1×1 卷積，把 32 通道映射成 64 通道
  D: 用恆等捷徑保留輸入，再沿通道方向接上主路徑輸出
answer: C
explanation:
  summary: 殘差相加前，捷徑須同時對齊空間尺寸與通道數。
  correct: 步幅 2 讓 24×24 變成 12×12，1×1 卷積則把 32 通道學習映射成 64 通道。兩條路徑因此可逐元素相加。
  wrong:
    A: 池化可縮小空間，但不會把 32 通道改為 64，也沒有題目指定的可學習通道映射。
    B: 通道數會對齊，但步幅 1 仍保留 24×24，無法與 12×12 的主路徑相加。
    D: 通道串接不是逐元素相加；而且兩條路徑的空間尺寸不同，這項串接也不能直接進行。
