stem: 某工程師比較訓練與驗證曲線。訓練曲線記錄「資料損失加 L2 懲罰」，驗證曲線只記錄資料損失。連續 8 輪驗證曲線都低於訓練曲線。若要判斷是否有泛化落差，最適合先做哪項檢查？
options:
  A: 提高 L2 強度，觀察模型權重是否縮小
  B: 在驗證集重抽樣，估計損失的抽樣波動
  C: 延長訓練至收斂，再依曲線差距判定擬合情況
  D: 以一致的資料損失定義，重新量測兩組資料
answer: D
explanation:
  summary: 比較曲線前，要先確認兩條曲線的量測定義一致。
  correct: 訓練曲線額外包含非負的懲罰項，因此曲線較高可能源自記錄內容不同。先在相同評估模式下，對兩組資料計算不含懲罰的資料損失，才有可比較的泛化落差。驗證值較低本身不構成資料洩漏的證據。
  wrong:
    A: 加大懲罰可能改變模型學習，也會直接拉高訓練曲線，卻沒有消除量測定義不同的問題。
    B: 重抽樣可估計抽樣波動，但無法移除只存在於訓練曲線的懲罰項，兩條曲線的量測仍不一致。
    C: 多訓練會改變參數與資料損失，但兩條曲線仍包含不同項目，不能據此釐清落差。
