stem: 某零件平台用圖文向量相似度搜尋商品。使用者常拍攝標籤查找型號，例如外觀相同的 K81 與 K18。語意搜尋能找對系列，卻常選錯型號；驗收要求型號逐字相符。最適合增加哪項處理？
options:
  A: 改寫型號的自然語言描述，再依圖文相似度重新排序
  B: 增加相似商品的回傳數量，再取圖文相似度最高者
  C: 放大圖文相似度的分數差距，再以最高分決定型號
  D: 辨識標籤文字並核對型號，再結合語意搜尋的候選
answer: D
explanation:
  summary: 語意相似與識別碼逐字相等是不同的搜尋需求。
  correct: 向量搜尋適合找語意接近的系列，但本題需要精確區分字元順序。先辨識標籤文字，再用型號欄位比對，可補上語意向量對細小字元差異不夠敏感的限制。
  wrong:
    A: 調整描述可補充語意，但型號是識別碼；自然語言相近不能證明 K81 與 K18 逐字相同。
    B: 擴大候選有助提高找回正確商品的機會，但最後仍按同一相似度挑選，不能完成型號一致性的驗收。
    C: 分數放大只改變數值差距，不會增加對字元順序的辨識證據，原先排錯的商品仍可能最高。
