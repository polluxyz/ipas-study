stem: 某翻譯系統已將 40 個來源詞編碼。解碼器正在生成第 6 個目標詞，需要依目前目標端狀態查詢來源內容。編碼器與解碼器之間的注意力，查詢、鍵、值應如何安排最正確？
options:
  A: 查詢來自目標端狀態，鍵與值來自來源端的編碼表示
  B: 查詢、鍵與值都來自目標端狀態，來源只決定終止字
  C: 查詢來自來源端表示，鍵與值來自尚未生成的目標詞
  D: 查詢、鍵與值都來自來源端表示，再直接當成第 6 個詞
answer: A
explanation:
  summary: 交叉注意力由目前的生成狀態選取來源資訊。
  correct: 目標端查詢用來決定此刻需要哪些來源資訊，來源端鍵負責比對，來源端值提供彙整內容。這讓每個目標位置能選取不同的來源線索。
  wrong:
    B: 三者都來自目標端時是目標自注意力，無法在這一步查詢來源表示。
    C: 尚未生成的詞在推論時無法取得，且這項安排把查詢方向與資訊來源對調。
    D: 三者都來自來源端時是來源自注意力，缺少目前目標端狀態，不能取代所問的跨端查詢。
