stem: 某檢索庫原有 100 篇文件，甲詞出現在 10 篇，乙詞出現在 20 篇。固定目標文件中，兩詞的詞頻比例皆為 0.1。新增 100 篇文件，每篇都有甲詞且都沒有乙詞。使用 TF-IDF＝詞頻比例×log10（文件總數／含詞文件數），不平滑、不正規化。重新估計 IDF 後，目標文件的兩詞權重排名如何變化？
options:
  A: 仍為甲高於乙，因為兩詞的目標文件詞頻都沒有改變
  B: 改為乙高於甲，因為甲的文件涵蓋比例升到乙之上
  C: 改為兩詞相等，因為新增文件使兩詞共用相同總數
  D: 仍為甲高於乙，因為文件總數增加使兩詞權重同比提高
answer: B
explanation:
  summary: 新增語料會改變文件涵蓋比例，也可能改變詞權重的排序。
  correct: 原先甲、乙權重約為 0.1000、0.0699。更新後總數為 200，含詞篇數為甲 110、乙 20，權重約為 0.0260、0.1000，因此排名反轉。固定的詞頻不能抵銷語料庫統計的改變。
  wrong:
    A: 詞頻固定只表示乘數不變，逆文件頻率仍須依更新後的語料重新計算。
    C: 兩詞雖共用文件總數，但含詞篇數分別是 110 與 20，所得權重不相同。
    D: 文件總數增加時，甲的含詞篇數也大幅增加，不能只看分子便判定兩詞同比提高。
