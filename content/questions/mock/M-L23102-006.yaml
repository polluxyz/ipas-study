stem: 某工程師以 X 的每列表示 1 筆資料，並用不含正則化的最小平方公式 w=(XᵀX)⁻¹Xᵀy 求解。X 的第 2 欄恰好是第 1 欄的 2 倍，其他條件正常。程式無法求出 XᵀX 的一般反矩陣。下列原因與處理何者最正確？
options:
  A: 目標 y 未做標準化；縮放 y 後即可恢復可逆性
  B: 數值尺度相差 2 倍；兩欄各自除以平均便可恢復可逆性
  C: 特徵欄位線性相依；可用偽逆求得最小平方解
  D: 樣本數多於欄位數；改取 XᵀX 的轉置即可求解
answer: C
explanation:
  summary: 辨認線性相依造成的奇異矩陣。
  correct: 兩欄成比例，代表至少 1 個方向的資訊重複。XᵀX 因此是奇異矩陣，沒有一般反矩陣。偽逆可在這種情況下求出最小平方解。
  wrong:
    A: XᵀX 只由 X 決定。縮放 y 不會改變 X 的線性相依關係。
    B: 各欄除以非零常數仍保留線性相依。縮放可以改變尺度，不能增加矩陣的秩。
    D: 樣本比特徵多不是不可逆的充分原因。XᵀX 已是對稱矩陣，轉置不會補回缺少的獨立資訊。
