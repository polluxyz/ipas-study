stem: |
  某設備助理在收到完整語音與照片後開始計時。語音辨識需 240 毫秒，影像編碼需 300 毫秒；兩者互不依賴，可由獨立資源同時執行。融合判斷需 100 毫秒，必須等兩者完成；之後產生首段語音需 120 毫秒。忽略其他耗時，若要求 550 毫秒內開始回話，哪個規劃最正確？
options:
  A: 先辨識語音再編碼影像，預計 520 毫秒開始回話
  B: 同時辨識語音與編碼影像，預計 760 毫秒開始回話
  C: 同時辨識語音與編碼影像，預計 520 毫秒開始回話
  D: 先編碼影像再辨識語音，預計 540 毫秒開始回話
answer: C
explanation:
  summary: 獨立模態可平行處理，後續融合仍須等待較慢的分支。
  correct: 平行分支需 max(240, 300)＝300 毫秒，再加融合 100 與首段語音 120，共 520 毫秒。此規劃符合 550 毫秒門檻。
  wrong:
    A: 先後執行兩個分支要累加 240 與 300，再加 100 與 120，共 760 毫秒。520 毫秒不是這個流程的結果。
    B: 760 毫秒把可同時執行的兩個分支也相加，錯估平行流程。獨立資源下應由較慢分支決定等待時間。
    D: 更換先後順序不會減少串行總耗時。兩個分支合計 540 毫秒之後，仍須執行融合與首段語音產生。
