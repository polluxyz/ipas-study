stem: 某影像團隊有 1,200 張原圖，每張各產生 4 張亮度變體。工程師先產生變體，再把全部圖片隨機切分，導致同一原圖的不同版本跨到訓練與測試。要估計對全新影像的表現，最適合如何調整？
options:
  A: 先把變體做亮度標準化，再對所有圖片重新隨機切分
  B: 先以原圖分配資料集，訓練時才為訓練原圖產生變體
  C: 先把測試集比例提高，再對包含變體的全部圖片隨機切分
  D: 先把每張原圖的變體數提高，再對全部圖片做分層切分
answer: B
explanation:
  summary: 資料增強前要先隔開原始樣本來源。
  correct: 同源變體共享原圖內容，跨資料集會使測試不再代表獨立的新影像。先按原圖切分，再於訓練資料做增強，可避免同源影像流入兩邊；測試可保留原圖作為固定評估。
  wrong:
    A: 亮度標準化不會消除同一原圖共享的內容，甚至可能讓變體更相似。
    C: 提高測試比例不保證同源圖片分開，仍可能產生跨集合的內容重疊。
    D: 更多變體增加同源重疊的機會，分層只能控制類別比例，不能自行隔開來源。
