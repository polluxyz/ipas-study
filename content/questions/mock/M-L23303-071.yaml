stem: 某購物平台的新推薦模型在離線相關性評分上較高，上線後點擊率也上升。但不少推薦商品缺貨，顧客付款後被退款並提出客訴，預期銷售收入未能實現。主管希望改善這類損失。最適合把哪項列為主要成效指標？
options:
  A: 每 1,000 次推薦曝光產生的商品點擊數
  B: 每 1,000 次推薦曝光產生的加入購物車次數
  C: 每 1,000 次推薦曝光產生的建立訂單次數
  D: 每 1,000 次推薦曝光產生的完成履約訂單數
answer: D
explanation:
  summary: 業務指標要對應流程最終需要的結果。
  correct: 每 1,000 次推薦曝光的完成履約訂單數，能反映推薦帶來的交易是否走到實際交付。缺貨後退款的訂單不會計入，因此可揭露點擊增加卻未帶來有效交易的問題。點擊、加入購物車與建立訂單可協助定位流失階段，但不能取代最終履約結果。
  wrong:
    A: 點擊只代表顧客對商品有興趣，即使商品缺貨也可能增加。
    B: 加入購物車較接近購買意圖，仍可能在庫存確認或結帳階段流失。
    C: 建立訂單不表示完成履約，本例缺貨訂單可能在建立後取消。
