stem: 某巡檢裝置更新模型後可能在外地斷網 8 小時。新版出錯時，現有回復工具須向雲端下載舊套件；儲存空間足以保留 2 套完整版本。團隊要提高斷網期間的回復能力，最適合的安排為何？
options:
  A: 將雲端舊套件分散存於兩個區域，裝置依序嘗試各下載位置
  B: 在裝置保留已驗證的舊套件，演練無網路的本機啟用與狀態回復
  C: 將舊套件預先放入維護站快取，裝置更新後回報下載進度
  D: 提高裝置的下載重試頻率，並縮短雲端套件下載的逾時時間
answer: B
explanation:
  summary: 斷網可回復須讓所需產物及切換能力預先存在裝置端。
  correct: 本機保留完整且已驗證的舊套件，可移除回復時的下載相依。演練還須確認設定及可變狀態相容，才能證明裝置斷網時真的能恢復。
  wrong:
    A: 多區域可改善個別雲端區域故障，但裝置本身沒有網路時仍無法下載。
    C: 維護站快取降低下載距離，卻仍要求裝置能連到維護站，未涵蓋外地斷網。
    D: 重試與逾時調整可應對短暫連線波動，不能讓斷網裝置取得雲端產物。
