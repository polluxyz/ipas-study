stem: 某團隊隨機抽取 30 台裝置，每台都用舊版與新版程式處理相同工作。不同裝置的基準延遲差異很大。各裝置彼此獨立，同台的新版減舊版延遲差近似常態。若要檢驗平均延遲差是否為 0，下列方法何者最適合？
options:
  A: 將 60 個延遲視為獨立樣本，做兩組平均數 t 檢定
  B: 先求每台的延遲差，再做單一樣本的 t 檢定
  C: 對兩組延遲的樣本變異數之比，做 F 檢定
  D: 合併兩版的延遲，做常態分布適合度檢定
answer: B
explanation:
  summary: 同一裝置的兩次量測應以配對差值分析。
  correct: 每台裝置提供一個差值。對 30 個獨立且近似常態的差值做平均數為 0 的單一樣本 t 檢定，就是配對 t 檢定，能保留裝置內的對應關係。
  wrong:
    A: 同台的兩次延遲有配對結構，當成 60 個獨立觀測會錯用獨立性的假設，也沒有利用裝置基準的抵銷。
    C: F 檢定針對變異數是否相同，並未檢驗平均延遲差是否為 0。
    D: 常態分布適合度檢定在檢查分布形狀。即使兩版的合併延遲符合常態，也不能據此判斷兩版的平均差是否為 0。
