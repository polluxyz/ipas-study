stem: 某零售商準備訂單金額預測資料。系統重送時會保留相同交易編號，但同一顧客也可能在 1 分鐘內購買 2 次相同商品。團隊希望移除傳輸重送紀錄，並保留真實的重複購買。最適合的清理規則為何？
options:
  A: 以交易編號辨識重送，核對內容一致後保留一筆
  B: 以顧客編號辨識重送，同一顧客當日只保留一筆
  C: 以商品與金額辨識重送，相同組合只保留一筆
  D: 以顧客與分鐘辨識重送，同分鐘只保留一筆
answer: A
explanation:
  summary: 去重依據須對應資料的業務單位。
  correct: 題目要保留每次真實交易，而重送紀錄沿用交易編號。以交易編號核對內容並去重，能移除傳輸造成的重複，又不合併不同的購買事件。
  wrong:
    B: 顧客編號代表顧客，不代表一次交易。按顧客去重會刪除同一顧客的其他有效交易。
    C: 不同交易可能具有相同商品與金額。這組欄位不能在本例唯一識別一筆交易。
    D: 同分鐘內可能有多次真實購買。用時間窗合併會把有效交易誤判成傳輸重送。
