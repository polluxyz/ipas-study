stem: 某申訴文字模型以分數達門檻者送複核。固定驗證集測得：門檻 0.1 的精確率／召回率為 0.50／0.99，0.3 為 0.68／0.96，0.5 為 0.78／0.92，0.7 為 0.90／0.80。驗收要求精確率至少 0.75，召回率至少 0.90。下列哪個門檻符合要求？
options:
  A: 採用 0.1 作為送複核門檻
  B: 採用 0.3 作為送複核門檻
  C: 採用 0.5 作為送複核門檻
  D: 採用 0.7 作為送複核門檻
answer: C
explanation:
  summary: 選擇文字分類門檻時，須同時檢查精確率與召回率限制。
  correct: 門檻 0.5 的精確率 0.78 與召回率 0.92 同時達標。其他候選各有一項未達要求，不能只依單一指標選擇。
  wrong:
    A: 0.1 的召回率高，但精確率只有 0.50，低於複核品質要求。
    B: 0.3 的召回率達標，但精確率 0.68 仍低於 0.75。
    D: 0.7 的精確率最高，但召回率 0.80 未達 0.90，會漏掉過多申訴。
