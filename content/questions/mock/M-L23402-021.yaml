stem: 某團隊可在受控訓練與驗證環境使用群體欄位。推論產品只輸入一般特徵，設計目標是減少合格者召回率的群體差距。團隊有重訓預算，且希望將此目標直接納入學習程序。下列方案何者最適合優先試驗？
options:
  A: 對每筆樣本施加相同倍率的訓練權重
  B: 用訓練時群體資訊加入機會平等約束
  C: 以全體資料擬合單一機率校準函數
  D: 以全體正確率選擇共用的推論門檻
answer: B
explanation:
  summary: 訓練時可用群體資訊建立約束，而推論模型仍只使用一般特徵。
  correct: 機會平等約束能在訓練過程比較各群真正合格者的召回率，直接對準本例目標。群體資訊可只供訓練時估計約束，學到的預測函數仍只使用一般特徵。需再用獨立資料確認效能與差距。
  wrong:
    A: 相同倍率不改變樣本之間的相對權重，沒有針對群體召回率差距施加學習要求。
    C: 全體校準對準分數與事件率的對應，並未直接限制各群合格者的召回率差距。
    D: 全體正確率可能偏重較大的群體，選共用門檻不能直接把機會平等要求納入學習。
