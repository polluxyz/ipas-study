stem: |
  某團隊比較公平性約束訓練的 4 個候選模型。同一驗證集的第一群有 400 位合格者，第二群有 100 位合格者。
  各模型選中的合格者人數如下，括號內依序為第一群、第二群：甲 (360,84)、乙 (336,80)、丙 (324,85)、丁 (328,82)。
  內部規則要求兩群召回率的絕對差不超過 4 個百分點，再從達標者中選整體召回率最高者。
  整體召回率指兩群合計選中的合格者人數，除以兩群合計的合格者人數。僅依本次點估計，應選哪個模型？
options:
  A: 甲模型
  B: 乙模型
  C: 丙模型
  D: 丁模型
answer: B
explanation:
  summary: 先計算群體召回率差距，再按合格者人數加權比較整體召回率。
  correct: 甲的兩群召回率為 90% 與 84%，差 6 個百分點，未達標。乙為 84% 與 80%，丙為 81% 與 85%，丁為 82% 與 82%，差距依序為 4、4、0 個百分點，均達標。乙的整體召回率為 (336+80)/500=83.2%，高於丙的 81.8% 與丁的 82%，故選乙。指引說明機會平等與公平性約束；本題的容忍值、候選數據與加權排序屬補充計算。
  wrong:
    A: 甲的整體召回率為 (360+84)/500=88.8%，雖然最高，但群體差距 6 個百分點超過容忍值，不能納入排序。
    C: 丙的兩群簡單平均為 (81%+85%)/2=83%，高於乙的 82% 與丁的 82%。但兩群合格者人數不同，簡單平均不等於題定的整體召回率。
    D: 丁的群體差距為 0，確實最小，但規則只要求差距達標。丁的整體召回率 82% 低於乙的 83.2%，不能改以差距最小選模型。
