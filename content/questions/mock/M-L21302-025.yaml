stem: 某庫存模型 API 接收 available_stock 整數，0 代表確實缺貨，欄位未傳才代表來源未知。服務目前以真假值判斷是否填預設值，造成 0 被改成平均庫存。最適合如何修正服務契約與驗證？
options:
  A: 以欄位是否存在判斷缺漏，並驗證整數型別及允許範圍
  B: 以欄位數值是否大於 0 判斷有效，其他值統一套用預設庫存
  C: 將整數轉成字串後判斷空字串，再將其他字串交給模型處理
  D: 將負數與 0 視為同一種未知狀態，再以平均庫存補足輸入
answer: A
explanation:
  summary: API 輸入要區分合法零值與欄位缺漏。
  correct: 欄位缺漏與數值為 0 的業務意義不同。服務應依契約檢查欄位是否存在，再分別驗證型別與範圍，保留合法的 0，避免前處理悄悄改變庫存語意。
  wrong:
    B: 大於 0 的判定會繼續排除合法的零庫存，仍使缺貨狀態被平均值取代。
    C: 轉成字串會改變整數契約；缺漏轉換也未必是空字串，不能可靠區分缺漏與合法數值。
    D: 把 0 視為未知直接混淆題幹定義的缺貨與未提供資料，仍會產生錯誤輸入。
