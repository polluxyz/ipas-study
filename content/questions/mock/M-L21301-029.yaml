stem: 某平台改用事件時間模型，預測會員註冊後多久首次購買。模型資料格式為（追蹤天數，事件指標）；1 表示已觀察到首次購買，0 表示追蹤結束時仍未購買。甲在第 8 天首次購買，之後仍留在平台；乙追蹤到第 12 天仍未購買，後續尚未觀察。哪項輸入最符合紀錄意義？
options:
  A: 甲（12，1）、乙（12，0），以本批資料共同的截止天數取代事件時間
  B: 甲（8，1）、乙（12，0），分別保留事件發生時間與已知的追蹤下限
  C: 甲（8，1）、乙（12，1），將資料截止時點視為乙的首次購買時點
  D: 甲（8，0）、乙（12，0），只有追蹤滿預定期間才將事件指標記為 1
answer: B
explanation:
  summary: 事件時間資料須同時保存時間與是否真正觀察到事件。
  correct: 這是右設限（只知道事件尚未在追蹤內發生）的補充應用。甲的首次購買時間已知，記為（8，1）；乙只知道到第 12 天仍未購買，記為（12，0），不能把 12 天當成真正的購買時間。這個標記保留未完成追蹤的資訊，並不保證追蹤中止沒有偏差。參考 [事件時間資料說明](https://www.ncbi.nlm.nih.gov/books/NBK543628/)。
  wrong:
    A: 甲已在第 8 天發生事件，改成第 12 天會錯記首次購買時間。
    C: 乙沒有購買事件；截止追蹤是觀察停止，不能當成事件發生。
    D: 事件一旦發生，首次購買時間已可判定，不必等到共同截止時點才標為 1。
