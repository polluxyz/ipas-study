stem: 某平台要預測新會員註冊後 30 天內是否首次購買。整理訓練資料時，部分會員才註冊 5 天，尚未購買；也有會員已觀察超過 30 天。團隊要用一般二元分類器建立完整觀察期的購買標籤。對尚未購買的會員，最適合如何準備訓練資料？
options:
  A: 將目前尚未購買的會員標為負類，再依註冊天數加權
  B: 等觀察滿 30 天，再按該期間是否購買建立正負標籤
  C: 將觀察未滿期的會員依已滿期會員的購買比例隨機標註
  D: 以目前是否購買建立標籤，再把已觀察天數加入特徵
answer: B
explanation:
  summary: 尚未完成目標觀察期的未購買紀錄，不能直接視為負類。
  correct: 只觀察 5 天未購買，不代表 30 天內不會購買。使用完整觀察期的會員建立標籤，才能讓正負標籤符合預測目標。之後仍需依使用情境切分資料。
  wrong:
    A: 加權能調整樣本影響力，但不能把尚未確認的負標籤變成正確標籤。
    C: 群體購買比例不能決定個別會員的結果，隨機標註會引入沒有實際事件依據的標籤。
    D: 目前是否購買對應的是不同長度的觀察期。加入觀察天數也沒有補齊尚未發生的未來結果，且註冊當時並無這段後續觀察資訊。
