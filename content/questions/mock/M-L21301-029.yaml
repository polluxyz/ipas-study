stem: 某物流商準備訂單預測資料。每筆訂單的商品規格相同，出貨量與出貨前取消量互不重疊，部分訂單仍在處理中。甲訂購 100 件，已出貨 70 件、取消 40 件；乙訂購 100 件，已出貨 70 件、取消 20 件。所有欄位都非負且沒有空值。哪項跨欄位品質檢查最適合？
options:
  A: 甲乙都可保留；出貨量與取消量分別未超過訂購量，各欄都在合理範圍
  B: 甲須回查、乙可保留；出貨量加取消量不得超過訂購量，可尚未處理完
  C: 甲乙都須回查；出貨量加取消量須等於訂購量，才符合訂單數量一致性
  D: 甲乙都可保留；先將出貨量扣掉取消量，淨出貨量未超過訂購量即合格
answer: B
explanation:
  summary: 單欄數值合法不代表跨欄位一致，檢核須依業務關係設定。
  correct: 同一件商品不會同時計入出貨與出貨前取消，兩者合計不能超過訂購量。甲合計 110 件，超過訂購的 100 件，應回查來源與狀態紀錄；乙合計 90 件，剩餘 10 件可以仍在處理，因此不違反這項規則。通過這項檢查只代表數量關係成立，其他準確性仍須另外核對。
  wrong:
    A: 甲的 70 件與 40 件各自都不超過 100 件，但合計已超過訂購量。分開檢查範圍會漏掉欄位間的邏輯衝突。
    C: 資料包含尚在處理的訂單，不必每筆都已全數出貨或取消。乙的 10 件餘額不能直接視為紀錄錯誤。
    D: 取消發生在出貨前，不是已出貨商品的退回量，不能從出貨量中扣除。這種淨額算法會掩蓋甲的數量超額。
