type: 情境
codes: [L23401]
concepts: [data-inventory, privacy-governance]
stem: |
  某客服分析專案的核准規則是「每筆對話自結案起保存 90 天」。團隊每週把尚未到期的對話複製到分析區，現行程式卻把每次複製日當成新的起算日。專案沒有新增保存用途。最適合採用哪項期限管理方式？
options:
  A: 以每次複製日期重算期限，另記原始對話結案日
  B: 由原始結案日決定到期日，讓分析副本沿用該日
  C: 以分析模型的更新日計算期限，按模型版本清除
  D: 由分析區最後存取日計算期限，按使用情況清除
answer: B
explanation:
  summary: 資料複製不會自行改變既定保存期限的起算事件。
  correct: 本例明定以結案為起算事件。應由結案日決定到期日，並讓副本承接期限。複製與讀取是作業事件，未經核准不能因此延長保存。
  wrong:
    A: 記錄結案日卻仍以複製日重新起算，會讓持續複製的對話不斷延後到期。
    C: 模型更新週期不同於對話的結案時間，以版本清除不能落實逐筆既定期限。
    D: 最後存取日適用於以閒置時間為條件的管理規則，不符合本例的結案起算規則。
guide_refs: [guide-3:6-4, guide-3:6-12]
author: codex
review:
  status: verified
  blind_answer: B
