stem: 某平台讓申請人對 AI 資格判定提出申訴。客服能說明分數，也能收件，但複核發現輸入資料錯誤後，沒有流程更正判定及恢復申請資格。要讓申訴機制能實際補救，哪項改善最適合？
options:
  A: 增加分數說明的圖表，讓客服更清楚呈現各項特徵貢獻
  B: 增加申訴收件的管道，讓申請人可使用電話或網頁提交
  C: 建立人工更正與重審流程，讓核准結果回寫資格系統
  D: 增加客服的回覆範本，讓申訴處理採用一致的說明格式
answer: C
explanation:
  summary: 申訴除了說明與收件，也要能更正業務結果。
  correct: 本例已有收件與說明能力，缺口在於錯誤被確認後仍無法補救。人工更正、重審及結果回寫，才能讓申訴改變實際業務結果，並留下可追蹤的處理紀錄。
  wrong:
    A: 特徵貢獻圖表能改善解釋，但無法更正資料及恢復被誤判者的資格。
    B: 增加收件管道能提高可近性，但不能補足收件後缺少更正與重審的問題。
    D: 一致的回覆格式有助溝通，卻不能使更正決定落實到資格系統。
