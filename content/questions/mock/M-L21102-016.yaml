stem: 某道路分割資料用整數遮罩表示類別：0 為背景、1 為道路、2 為車輛。訓練增強會同步縮放影像與遮罩。工程師發現遮罩經雙線性插值再四捨五入後，背景與車輛邊界可能出現道路標籤。最適合改用哪項做法？
options:
  A: 遮罩改用最近鄰插值，影像保留合適的連續插值
  B: 遮罩先改成浮點數插值，最後再轉回整數標籤
  C: 遮罩先做高斯平滑插值，最後再依中點分配標籤
  D: 遮罩先把類別值縮至 0 到 1，插值後再還原
answer: A
explanation:
  summary: 類別編號是離散標籤，不宜當成連續數值做插值。
  correct: 最近鄰插值從原有標籤選值，不會把 0 與 2 平均成類別 1。遮罩仍須與影像使用相同幾何變換，但插值方法可依標籤及影像的性質選擇。
  wrong:
    B: 浮點數可保留中間值，但最後轉回整數時仍可能把類別混合值當成另一個類別。
    C: 高斯平滑同樣混合相鄰類別編號；依數值中點分類，仍把無順序的類別當成連續量。
    D: 縮放數值範圍不改變平均插值的問題，還原後仍可能出現原邊界沒有的中間類別。
