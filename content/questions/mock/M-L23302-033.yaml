stem: 某影像分類團隊可用大型訓練主機，已得到品質良好的集成模型。但現場裝置只能執行小型模型，實測無法在時限內跑完整集成。團隊希望把集成模型學到的判斷轉移到小型模型，再檢查部署品質。下列方案何者最適合？
options:
  A: 降低輸入影像解析度，重新訓練原有的集成架構
  B: 降低集成成員的權重儲存精度，再評估現場資源
  C: 以集成模型的預測作教學訊號，訓練可部署的小模型
  D: 刪除部分集成成員，重新調整剩餘成員的投票權重
answer: C
explanation:
  summary: 訓練資源充足不表示現場能執行相同規模的模型。
  correct: 知識蒸餾以教師模型的輸出協助訓練較小的學生模型。學生可另行實測品質與延遲，符合把集成判斷轉入小型模型的方向，但不能預先保證品質不變。
  wrong:
    A: 降低影像解析度可能減少運算，但這仍是修改原集成的輸入，沒有把其判斷當作訊號教給另一個小模型。
    B: 降低權重精度可能節省記憶體，但這是原模型的數值壓縮，沒有建立從教師到學生的學習。
    D: 減少集成成員可能加速推論，但保留的是部分原成員，不是由完整集成教出的小型模型。
