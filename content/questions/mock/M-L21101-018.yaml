stem: 某英文搜尋系統會把字尾裁成非字典詞。新版需求是把複數與不規則動詞歸回字典原形，供編輯直接檢查；處理速度不是主要限制。最適合採用哪項前處理？
options:
  A: 採用詞形還原，搭配字典與詞性標註
  B: 採用字尾裁切，搭配較多的裁切規則
  C: 採用子詞切分，搭配既有的子詞詞彙表
  D: 採用詞頻篩選，搭配最低出現次數門檻
answer: A
explanation:
  summary: 依輸出用途選擇詞形正規化方法。
  correct: 詞形還原結合字典與詞性資訊，適合取得可讀的字典原形，也能處理字尾裁切無法直接處理的不規則變化。題目重視原形可讀性，優先程度高於速度。
  wrong:
    B: 詞幹提取可以歸併詞形，但裁切結果不以字典原形為目標。增加規則也不能取代對不規則詞與詞性的判斷。
    C: 子詞切分處理輸入單位與詞彙覆蓋，不會把不規則動詞自動轉成字典原形。
    D: 詞頻篩選決定保留哪些詞，不負責辨識複數或不規則動詞的原形。
