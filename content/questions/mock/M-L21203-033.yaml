stem: 某分類系統用另一個語言模型撰寫拒絕理由。100 位試讀者給理由文字的易懂程度平均 4.7 分，滿分為 5 分。風險小組另外要驗證理由是否反映分類模型真正使用的資訊。哪項測試最直接對應這個目的？
options:
  A: 在合理範圍擾動理由指出的特徵，對照實際模型輸出的變化
  B: 增加不同背景的試讀者，對照各群體的理由文字理解分數
  C: 將拒絕理由統一成固定格式，對照各批次文字的長度差異
  D: 加入專業詞彙的白話註解，對照試讀者閱讀所花的時間
answer: A
explanation:
  summary: 解釋容易理解，不等於解釋忠於模型的實際行為。
  correct: 擾動被指為重要的特徵並觀察分類輸出，可檢查理由描述與模型行為是否相符。測試須保留合理輸入範圍，並與其他特徵作比較；這提供忠實性的證據，不是現實世界因果效果的證明。
  wrong:
    B: 不同背景的理解分數可評估可讀性及使用者差異，沒有檢查分類模型是否使用理由所說的資訊。
    C: 固定格式與長度一致有助閱讀及管理，但即使每則理由格式相同，仍可能與模型判斷無關。
    D: 詞彙註解及閱讀時間衡量理解負擔，不能驗證理由與模型輸出之間的對應。
