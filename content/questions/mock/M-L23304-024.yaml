stem: 某模型一次剪去 80% 權重後，驗證準確率由 94% 降到 76%。團隊有再訓練預算，要比較不同剪枝比例造成的品質損失，並找出可恢復至 92% 的最小模型。最適合採哪種試驗？
options:
  A: 逐段提高剪枝比例，每段微調後記錄品質與模型成本
  B: 一次維持 80% 剪枝，僅記錄微調前的驗證準確率
  C: 逐段提高剪枝比例，每段只記錄訓練集的準確率
  D: 一次提高至 95% 剪枝，將減少的參數量作為品質指標
answer: A
explanation:
  summary: 剪枝比例需以微調後的驗證品質與成本共同決定。
  correct: 逐段剪枝與微調可觀察恢復能力，再以驗證品質限制挑選成本最低的候選，不預設 80% 就是合適比例。
  wrong:
    B: 只觀察單一比例的微調前結果，無法比較比例，也無法知道再訓練是否恢復品質。
    C: 訓練集表現不能替代題目要求的驗證品質，無法判斷是否恢復至目標。
    D: 參數量可表示壓縮成本，但不能表示預測品質；更高比例也不能證明符合準確率要求。
