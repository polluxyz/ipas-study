stem: 某設備商預測耗電量，已確認在預定使用範圍內，負載與耗電近似線性。歷史資料只涵蓋負載 20 至 60 單位，上線後還須預測 60 至 80 單位。線性迴歸與採葉節點平均的隨機森林都只輸入負載，在歷史範圍的驗證誤差接近。針對新增範圍，最適合的選型判斷為何？
options:
  A: 優先選隨機森林，並增加樹數來延伸超出歷史範圍的預測趨勢
  B: 優先選隨機森林，並增加樹深來建立歷史範圍以外的新葉節點
  C: 依歷史範圍內的平均誤差定案，再以相同切分增加驗證次數
  D: 優先驗證線性迴歸的外推，另收集新增範圍資料確認適用性
answer: D
explanation:
  summary: 相近的內插誤差不代表模型有相同的外推能力。
  correct: 已知物理關係支持近似線性，線性模型可延伸此趨勢。以訓練標籤的葉平均作預測的森林，通常不會自然延伸區間外的線性趨勢；仍應取得新增範圍資料驗證。
  wrong:
    A: 增加樹數可降低平均預測的變動，但葉平均仍由既有訓練標籤構成，不能因此建立新的外推趨勢。
    B: 更深的樹是在已有樣本間細分區域，沒有新增範圍資料時，無法靠加深長出該範圍的真實關係。
    C: 重複歷史範圍的切分仍只評估該範圍，未驗證上線新增區間，不能據此決定外推用途。
