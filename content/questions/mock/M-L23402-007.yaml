stem: 某資格篩選模型以合格者被選中的召回率評估機會差異。甲群原為 90%、乙群為 60%；候選版在同一獨立驗證集上，甲乙皆為 60%。團隊擬以「群體差距已消失」核准發布。最正確的審查判斷為何？
options:
  A: 可依群體差距核准，將甲群降低的召回率視為公平改善的必要代價
  B: 可依兩群相同核准，將共同的召回率視為對兩群都有利的品質提升
  C: 應改用全體準確率定案，將分群召回率留作發布後的輔助觀察
  D: 應併查各群絕對表現與傷害，不能只依差距縮小核准候選版
answer: D
explanation:
  summary: 公平差距縮小可能來自原本表現較好群體的退步。
  correct: 本例乙群沒有改善，甲群卻失去原有的合格者辨識能力。差距消失只描述此指標的群間關係，不能證明任務品質及實際傷害可接受，發布前須共同審查。
  wrong:
    A: 沒有證據顯示降低甲群召回率是改善公平的必要手段；直接接受退步會忽略可避免的漏選傷害。
    B: 相同不等於各群都進步。乙群持平、甲群下降，不能稱為對兩群都有利的品質提升。
    C: 全體準確率可能掩蓋合格者漏選及群體差異，不能取代本例既定的分群公平審查。
