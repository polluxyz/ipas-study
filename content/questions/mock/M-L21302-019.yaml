stem: 某影像分類服務為相同圖片快取結果，快取保留 24 小時。團隊切換到新版模型後，部分舊圖片仍回傳舊分類；確認流量已進新版，原因是快取鍵只有圖片雜湊。下列哪項調整最直接且能支援版本並存？
options:
  A: 只縮短結果的快取時間，讓不同模型版本共用現有圖片快取鍵
  B: 將圖片識別與模型及前處理版本納入快取鍵，分開保存各版結果
  C: 把圖片先壓縮成較小檔案，再用壓縮圖片雜湊取代現有快取鍵
  D: 將快取移到共用儲存，讓新版與舊版服務查詢同一份圖片結果
answer: B
explanation:
  summary: 推論結果的快取範圍要包含產生結果的版本。
  correct: 同一圖片經不同模型或前處理可能得到不同結果。把相關版本納入快取鍵，可讓新舊服務各取對應結果，不會把舊版輸出當成新版推論。
  wrong:
    A: 縮短時間只能縮短污染期間，仍會讓版本並存時共用錯誤範圍的結果。
    C: 圖片表示改變沒有識別模型版本；相同壓縮圖片仍可能被不同版本處理。
    D: 共用儲存不會自動區分版本，若鍵不變，仍可能取到另一版本的結果。
