stem: 某工程師固定採用最近的 3 個鄰居分類。3 筆的「距離、類別」依序為 (1,甲)、(2,乙)、(3,乙)，距離均不為 0。先做等權投票，再改成每票權重為 1/距離，其他條件不變。兩種方式的預測類別依序為何？
options:
  A: 乙、乙
  B: 乙、甲
  C: 甲、甲
  D: 甲、乙
answer: B
explanation:
  summary: 距離加權可能改變 K 最近鄰的多數決結果。
  correct: 等權時乙有 2 票、甲有 1 票，因此選乙。距離加權時甲為 1，乙為 1/2+1/3=5/6，小於甲，因此改選甲。
  wrong:
    A: 加權後不能繼續只比較筆數。乙的權重總和約 0.833，低於甲的 1。
    C: 第 1 種方式是等權投票，不能只看最近 1 筆。乙有 2 票，會勝過甲。
    D: 兩種結果的順序相反。等權時看票數，加權時比較各類別的權重總和。
