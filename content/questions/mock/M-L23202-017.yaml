stem: 某商店用 Apriori 找配件組合，最低支持度設為 5%。新到貨的專用轉接頭只出現在 1% 交易，主管卻希望探索它與其他商品的搭配。系統未產生任何含轉接頭的規則。若保留原始交易資料，下列調整何者最能直接處理這個原因？
options:
  A: 降低規則的最低信賴度，再由既有頻繁項目集產生規則
  B: 提高規則的最低提升度，再由既有頻繁項目集產生規則
  C: 降低項目集的最低支持度，再檢查含轉接頭的候選組合
  D: 交換規則的前件與後件，再由既有頻繁項目集產生規則
answer: C
explanation:
  summary: 支持度門檻可能在規則生成前就排除稀有商品。
  correct: 含轉接頭的組合，出現比例不會高於轉接頭本身。轉接頭未達最低支持度時，Apriori 會先排除它與其較大的組合。必須先調整項目集門檻，才有機會探索相關搭配，之後仍須確認筆數與規則可靠性。
  wrong:
    A: 信賴度用來篩選已發現項目集所產生的規則。降低它不能找回先被支持度排除的商品。
    B: 提高提升度會進一步篩選規則，不會讓低支持度商品重新成為頻繁項目集。
    D: 前件與後件交換不改變商品共同出現的支持度。已被排除的項目集仍不會出現。
