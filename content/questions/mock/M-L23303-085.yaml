stem: |
  某平台可將案件直接放行、直接攔截，或送人工複核。p 是已校準的違規機率。直接放行的預期成本為 100p，直接攔截為 40(1−p)，人工複核固定花 10 單位且可正確處置，不再產生誤判成本。人工量能足夠，其他成本為 0。人工複核嚴格比另 2 種處置便宜的完整機率區間，下列何者最正確？
options:
  A: 0.10 < p < 0.75
  B: 0.10 < p < 0.90
  C: 0.25 < p < 0.75
  D: 0.25 < p < 0.90
answer: A
explanation:
  summary: 加入人工複核後，須同時比較人工與兩種自動處置的成本。
  correct: 人工比放行便宜須滿足 10<100p，即 p>0.10；人工比攔截便宜須滿足 10<40(1−p)，即 p<0.75。兩條件同時成立的區間為 0.10<p<0.75，端點只打平，不符合嚴格較便宜。
  wrong:
    B: p 接近 0.90 時，攔截成本可低於 10。例如 p=0.80 時攔截只花 8，人工不會是最便宜的處置。
    C: 把 10/40=0.25 當下界，混用了攔截與放行的成本。p=0.20 時放行為 20、攔截為 32，人工已較便宜。
    D: 下界誤用 10/40，上界則誤用 1−10/100。這會漏掉人工有利的低機率案件，也納入攔截更便宜的高機率案件。
