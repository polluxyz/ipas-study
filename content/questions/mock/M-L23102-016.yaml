codes: [L23102]
concepts: [matrix-operations, feature-space]
stem: |
  某產線模型以矩陣乘法處理 12 個特徵。供應商更新資料介面後，欄位名稱與數量相同，但欄位順序改變。矩陣維度檢查通過，預測卻明顯異常。若要沿用原模型，最適合的修正為何？
options:
  A: "將每筆輸入再做長度正規化後，維持介面提供的欄位順序"
  B: "依訓練時的特徵名稱順序排列輸入，再交給原權重矩陣運算"
  C: "以訓練資料的均值與標準差轉換輸入，再與原權重矩陣相乘"
  D: "將各欄重新縮放至相同範圍後，維持介面提供的欄位順序"
answer: B
explanation:
  summary: "區分矩陣形狀相容與特徵座標對應正確。"
  correct: "權重矩陣的每個對應位置有特定特徵意義。欄數相同只保證乘法可執行，還須依訓練時的特徵順序排列，才能讓數值乘上正確權重。"
  wrong:
    A: "長度正規化改變數值尺度，不會把調換位置的特徵送回正確權重。"
    C: "標準化只調整數值中心與尺度，不能取代欄位順序與權重位置的對應。"
    D: "重新縮放處理的是數值尺度，不能修正欄位與權重的對應關係。"
guide_refs: [guide-3:3-12]
author: codex
review:
  status: verified
  blind_answer: B
