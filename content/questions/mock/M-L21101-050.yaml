id: M-L21101-050
rev: 1
source: mock
subject: 1
type: 情境
codes: [L21101]
concepts: [sentiment-analysis]
stem: |
  某平台把短評分為正面、負面與中立。對「依原定時間完成配送」這類單純紀錄，標註規則定為中立。另有 120 則短評因缺少上下文，標註者無法判斷態度。主管想把這批也直接標成中立。最適合採用哪項處理？
options:
  A: 將這批標為中立，另外提高中立樣本的訓練權重
  B: 將這批標為負面，優先納入客戶不滿的追蹤名單
  C: 將這批列為待釐清，補足上下文後再決定情感類別
  D: 將這批標為正面，依未出現抱怨詞的規則補齊標籤
answer: C
explanation:
  summary: 沒有表達態度與缺乏資訊而無法判斷，是不同狀況。
  correct: 中立是對已理解內容的情感判斷；本例則缺少判斷所需的上下文。先釐清再標註，可避免把資訊不足教成中立情感。
  wrong:
    A: 增加權重會強化這批不確定標籤的影響，不能使缺少上下文的文字成為中立證據。
    B: 看不出態度不表示客戶不滿。負面標籤需要文字或上下文中的負面評價支持。
    D: 缺少抱怨詞不等於表達滿意，也可能是語意不完整或情緒線索藏在上下文。
guide_refs: [guide-1:3-30, guide-1:3-37]
author: codex
review:
  status: verified
  blind_answer: C
