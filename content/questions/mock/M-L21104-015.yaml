stem: 某客服系統先把語音轉成文字，再判斷客戶是否不滿。抽查 200 通電話發現，部分客戶用反諷語氣說「服務真周到」，逐字稿正確，文字模型卻判為稱讚。若要利用資料中尚未使用的訊息，最適合加入哪項設計？
options:
  A: 擷取音高與語調特徵，和逐字稿語意共同判斷
  B: 增加逐字稿的文字長度，再以原文字模型判斷
  C: 將逐字稿翻譯成另一語言，再以譯文語意判斷
  D: 對逐字稿增加標點符號，再以原文字模型判斷
answer: A
explanation:
  summary: 轉錄文字可能保留字詞，卻未保留聲音中的情緒線索。
  correct: 本題已確認字詞轉錄正確。反諷可能透過音高、語調與節奏表達，結合聲學特徵與文字語意，才有機會使用文字之外的訊息。效果仍須以含反諷的電話樣本驗證。
  wrong:
    B: 更長逐字稿能補上下文，但無法直接恢復未輸入的語調。此處要處理的是字詞正確仍誤判的情況。
    C: 翻譯可支援跨語言處理，卻仍以相同字詞內容為主；沒有音訊線索時，譯文也可能把反諷保留成稱讚。
    D: 標點可改善句界與閱讀，但僅依逐字稿補標點，沒有取得音高或語調的額外證據。
