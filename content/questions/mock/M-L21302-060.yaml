stem: 某代理要彙整符合條件的全部售後案件。查詢工具固定每頁回傳最多 50 筆，還會提供下一頁游標；服務以穩定快照供分頁讀取。測試資料實有 120 筆，但代理讀完第一頁便宣告彙整完成。最適合如何補強工具整合？
options:
  A: 將第一頁總額依頁面上限放大，再交由代理產生彙整
  B: 由工具包裝層依游標讀到末頁，核對完整性後再回傳彙整
  C: 對第一頁連續重試多次，再以每次讀取的共同內容作彙整
  D: 提高生成答案的輸出長度上限，再以第一頁內容完成彙整
answer: B
explanation:
  summary: 分頁工具的回應上限不等於符合條件資料的總量。
  correct: 包裝層可明確執行分頁協定，沿游標讀到沒有下一頁，並核對資料筆數或完整性標記。將完整結果或確定性彙整交給代理，可避免把單頁誤認為全量。
  wrong:
    A: 每頁案件的金額與筆數可能不同，按頁面上限放大第一頁總額不能還原未讀資料。
    C: 重試相同第一頁只會再讀相同範圍，沒有使用游標前往後續頁面。
    D: 更長的生成輸出不會取得其他頁面的案件，不能補足輸入中缺少的資料。
