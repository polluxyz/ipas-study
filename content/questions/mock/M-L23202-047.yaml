stem: 某團隊用 DBSCAN 分析 2 維位置資料。人工確認有稠密與稀疏兩種有效群集；使用較小半徑會把稀疏群打散，使用較大半徑又會把相鄰稠密群合併。最少點數已檢查過多種設定。對後續選型，下列建議何者最適合？
options:
  A: 以較大半徑保留稀疏群，將合併結果作為有效群數
  B: 檢查密度差異，將能處理不同密度的分群法列入比較
  C: 以較小半徑分開稠密群，將稀疏群成員作為離群點
  D: 提高最少點數的門檻，讓稀疏群更容易成為有效群
answer: B
explanation:
  summary: 同一組密度門檻未必適合密度差異很大的群集。
  correct: 題目已出現保留稀疏群與分開稠密群的衝突，這是固定半徑與密度門檻的限制。應比較更能適應不同密度的候選，不宜只認定某個方向的調參就能解決。
  wrong:
    A: 加大半徑雖可能接起稀疏群，卻已觀察到會誤合併稠密群，不能直接將結果視為正確群數。
    C: 稀疏群已由人工確認有效，不能只為保留稠密群分隔就把整群當成雜訊。
    D: 提高最少點數會讓形成核心點更困難，不會讓稀疏群更容易達到密度要求。
