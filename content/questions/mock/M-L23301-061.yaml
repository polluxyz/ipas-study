stem: 某公司用帶 L2 正則化的線性模型預測維修成本。工程師只把長度欄位從公尺換成公分，並重新訓練；其他條件與正則化強度相同。主管認為物理資訊沒變，正則化對該欄位的效果也不會變。哪項判斷最正確？
options:
  A: 特徵數值放大後，L2 會按放大比例直接懲罰輸入值
  B: 只要固定正則化強度，就能抵消單位換算對係數的影響
  C: 係數所需的尺度會改變，同一懲罰強度的效果可不同
  D: 特徵的排序維持不變，正則化效果因此維持相同
answer: C
explanation:
  summary: 特徵單位會影響係數尺度與正則化的相對作用。
  correct: L2 正則化懲罰係數大小。長度放大後，表達相同預測關係所需的係數會縮小，懲罰的相對作用也會改變。比較前先統一尺度，並驗證正則化強度較合理。
  wrong:
    A: L2 懲罰的是模型係數的平方和，不是直接對輸入特徵值加上懲罰。
    B: 固定強度沒有補償單位換算造成的係數尺度改變，因此不能據此認定懲罰效果相同。
    D: 排序不變有助理解樹的分裂，但 L2 懲罰依據係數大小，不能只看排序。
