stem: 某組織內部用「乙群錄取率除以甲群錄取率」作為不利影響比，內部預警線為 0.8。甲群 200 人錄取 100 人，乙群 100 人錄取 40 人。僅依這些點估計，下列判斷何者最正確？
options:
  A: 比值為 0.4，低於預警線，未達統計均等
  B: 比值為 1.25，高於預警線，已達統計均等
  C: 比值為 0.8，等於預警線，已達統計均等
  D: 比值為 0.8，等於預警線，未達統計均等
answer: D
explanation:
  summary: 比值預警線與兩群比例相等，是不同的判準。
  correct: 甲錄取率為 0.5，乙為 0.4，指定方向的比值是 0.4/0.5=0.8，恰好等於內部預警線。但兩群錄取率仍不相等，因此不滿足本題的精確統計均等。內部門檻不是法律認定，也不能單獨證明是否有歧視。
  wrong:
    A: 0.4 是乙群的錄取率或兩群錄取人數之比，尚未除以甲群錄取率 0.5。
    B: 1.25 是把方向顛倒後的比值，而且兩群比例不等，仍不符合精確統計均等。
    C: 比值計算正確，但 0.8 的內部預警線不等於統計均等要求的比例相等。
