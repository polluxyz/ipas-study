stem: 某研究庫對同一批人發布 2 份資料。每份各自做到 K=5，但使用不同的準識別欄位。攻擊者結合已知背景，判定某人的候選代號在第一份為 {a,b,c,d,e}，第二份為 {a,f,g,h,i}。對合併發布的風險，哪個判斷最正確？
options:
  A: 合併後仍有 5 個候選，使用較小的單份群大小
  B: 合併後只剩 1 個候選，需評估兩份的共同資訊
  C: 合併後有 9 個候選，使用兩份候選的聯集大小
  D: 合併後有 25 個候選，使用兩份群大小的乘積
answer: B
explanation:
  summary: 各次單獨達成 K-匿名，不能直接推得合併後仍達成。
  correct: 同一個人必須同時符合兩份資料與背景條件，候選集合取交集，只有 a。因此合併資訊可把原本各 5 個候選縮成 1 個。發布評估要包含多次釋出與可用背景資訊。
  wrong:
    A: 單份最小群大小沒有計算兩份資訊相交後的限制，不能直接沿用 K=5。
    C: 聯集允許只符合其中一份條件，但已知身分必須同時符合兩份，應取交集。
    D: 乘積代表任意兩個代號的配對數；本題是在找同一人，不是在配對不同人。
