stem: 某工廠準備預測零件剩餘壽命。訓練資料中，累積使用時數與剩餘壽命的皮爾森相關係數為 -0.88，另一個欄位為 0.12。時數在推論時可取得，且沒有洩漏目標。篩選程式只保留相關係數大於 0.1 的欄位。最正確的修正為何？
options:
  A: 以相關強度而非正負篩選候選，再用驗證資料比較預測表現
  B: 先把負相關欄位改成缺失值，再以正相關欄位估計其內容
  C: 優先保留相關係數為正的欄位，以降低預測值往下變動的風險
  D: 先對時數做正值比例縮放，讓相關係數轉正後再使用門檻
answer: A
explanation:
  summary: 負相關仍可含有很強的線性預測訊號。
  correct: -0.88 表示強烈的反向線性關聯，不能因為係數是負數就排除。可依絕對值檢視線性關聯強度，再透過固定的驗證流程判斷欄位對模型是否有用。
  wrong:
    B: 把可取得且有強關聯的時數改成缺失值會主動丟失訊息，補值也無法恢復逐筆時數。
    C: 預測剩餘壽命可以利用反向關係。係數為正不代表預測價值較高或比較安全。
    D: 乘上正比例常數不會改變皮爾森相關係數的正負，無法修正只保留正相關的篩選規則。
