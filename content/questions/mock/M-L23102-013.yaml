stem: 某團隊對同一份中心化資料做主成分分析。最大特徵值沒有重複值，兩套工具得到的第一主成分方向恰好互為負向，其他設定相同。兩套工具各自以自己的方向計算分數再重建資料。下列比較何者最正確？
options:
  A: 非零分數正負相反，僅用第一主成分重建的結果相同
  B: 分數正負會相反，第二套工具保留的變異量較小
  C: 分數數值會相同，僅用第一主成分重建的結果相反
  D: 分數數值會相同，第二套工具選到另一個主成分
answer: A
explanation:
  summary: 特徵向量反向不會改變所代表的主成分軸。
  correct: 若方向由 v 換成 -v，分數由 Xv 變成 -Xv。重建時分數與方向一起反向，乘積仍為 (Xv)vᵀ，因此解釋變異與重建資料都相同。
  wrong:
    B: 反向不改變投影分數的變異數。特徵值與保留變異量沒有因此縮小。
    C: 非零投影分數會反向；分數與方向兩次負號相消，重建結果不會反向。
    D: 題目排除了最大特徵值重複造成的方向自由度。互為負向只是同一條軸的兩種表示。
