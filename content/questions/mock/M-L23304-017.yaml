stem: 某團隊使用對各特徵係數施加相同平方懲罰的線性模型，仍需保留非零懲罰。僅把長度從公尺改記為公分，其他特徵與資料不變，重新訓練後預測卻改變。團隊希望相同物理訊號不因計量單位不同而受到不同懲罰。下列做法何者最適合？
options:
  A: 先以訓練資料統一各特徵尺度，再調整正則化強度與驗證
  B: 降低全部特徵共用的懲罰係數，再以原始數值尺度重訓
  C: 提高全部特徵共用的懲罰係數，再以原始數值尺度重訓
  D: 保留原始數值尺度，改成對各係數施加相同絕對值懲罰
answer: A
explanation:
  summary: 係數懲罰的效果會受到輸入特徵尺度影響。
  correct: 同樣的預測效果，在數值放大後可由較小係數表示。直接對原始係數施加相同平方懲罰，會讓單位不同的表示承受不同限制。使用訓練資料建立一致尺度，再選擇懲罰強度，可減少這種單位造成的差異。
  wrong:
    B: 降低共用強度可減弱正則化，但只要仍有相同的係數懲罰，單位依賴就不會因此被消除。
    C: 提高共用強度會同時加重各欄限制，沒有修正單一欄位換單位所造成的相對懲罰差異。
    D: 絕對值懲罰也作用在係數上，仍會受特徵尺度影響。更換懲罰形式不是統一尺度的替代方案。
