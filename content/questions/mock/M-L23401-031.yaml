stem: 某聯邦模型由大型機構與小型機構共同訓練。新版在大型機構的驗證準確率升至 95%，小型機構卻由 88% 降至 72%；按資料量加權的整體分數仍上升。聯盟要求每家機構至少 85%，原始明細不離開本地。上線前最適合補哪項驗收安排？
options:
  A: 以大型機構的驗證結果代表聯盟，保留加權整體分數
  B: 以各機構訓練資料的準確率取代本地驗證結果
  C: 由各機構回報本地驗證指標，逐家核對品質門檻
  D: 以參與機構數與更新傳輸成功率取代品質門檻
answer: C
explanation:
  summary: 聯邦訓練的整體分數，可能掩蓋小型機構的品質下降。
  correct: 本例驗收要求適用每家機構，整體加權平均不能證明各家都合格。各機構可在本地保留驗證資料並回報必要指標，逐家核對門檻；這不需要集中原始明細。
  wrong:
    A: 大型機構的結果不能代表資料分布不同的小型機構，且題目已量到小型機構未達門檻。
    B: 訓練資料參與參數更新，不能取代獨立驗證對未見資料品質的估計。
    D: 機構數與傳輸成功率反映參與及通訊狀態，不能證明各家機構的預測準確率達標。
