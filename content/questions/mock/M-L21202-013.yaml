stem: 某委外 AI 分類專案即將交付，廠商將在 4 週後結束支援。公司只有 1 名維運工程師，驗收目標包括之後能自行更新模型與復原服務。廠商已交原始碼及模型檔。最適合再要求哪項驗收活動？
options:
  A: 由廠商在原展示環境執行，確認現有測試集的分類分數
  B: 由內部人員依交付文件重建環境，演練更新與復原
  C: 由廠商展示最新模型功能，提供後續可選購的服務清單
  D: 由內部人員清點程式檔數，核對模型與文件下載成功
answer: B
explanation:
  summary: 交付檔案不等於內部團隊已具備持續維運能力。
  correct: 支援即將結束，驗收需要證明內部能操作。讓維運工程師依文件重建環境並完成更新與復原，可檢查相依條件、步驟及知識移轉是否足夠，而不只確認廠商原環境能運作。
  wrong:
    A: 原展示環境的分數可驗模型品質，但廠商可能仍依賴未交接的設定與操作，不能證明內部能維運。
    C: 功能展示與加購清單有助後續採購討論，卻未驗證本次要求的自行更新與復原能力。
    D: 檔案清點能確認交付物是否收到，但無法證明文件可執行、相依完整或復原程序有效。
