  - f1-score
stem: 某文件抽取系統的測試集有 40 個實體，模型輸出 50 個實體。其中 30 個的邊界與類型都正確，另有 10 個只與真值部分重疊，其餘不匹配。每個真值最多匹配一次，只有邊界及類型都正確才算命中。實體層級 F1 分數最接近多少？
options:
  A: 66.7%
  B: 75.0%
  C: 80.0%
  D: 88.9%
answer: A
explanation:
  summary: 實體評分必須依指定的邊界與類型匹配規則計數。
  correct: 有效命中是 30 個，精確率為 30/50，召回率為 30/40。F1＝2×30/(50＋40)＝0.6667。部分重疊不符合本題匹配規則。
  wrong:
    B: 75% 是召回率，只考慮真值中的命中比例，沒有合併預測中誤報的影響。
    C: 80% 把部分重疊的 10 個也算入命中，再除以預測數；這既放寬匹配規則，也不是 F1。
    D: 88.9% 來自把 40 個都當命中後計算 F1；部分重疊的 10 個不能納入有效命中。
