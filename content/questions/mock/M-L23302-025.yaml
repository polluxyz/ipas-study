stem: 某系統判斷 2 張零件影像是否同款，交換影像甲與乙後，輸出須維持相同。團隊用共用編碼器取得 128 維向量，再接可訓練的二元判斷頭；整個前向流程沒有隨機運算。下列哪項連接方式能從結構上滿足交換不變性？
options:
  A: 把甲向量接在乙向量前方，送入一般二元判斷頭
  B: 把兩向量的逐維絕對差送入一般二元判斷頭
  C: 把甲向量減去乙向量，送入一般二元判斷頭
  D: 把兩向量分別乘以不同可訓練矩陣後相加，再送入判斷頭
answer: B
explanation:
  summary: 輸入沒有先後角色時，可用對稱的向量組合保留交換不變性。
  correct: 共用編碼器固定兩張圖的向量表示，而 |u-v|=|v-u|。交換影像不改變判斷頭的輸入，因此同一個確定性判斷頭會輸出相同結果。
  wrong:
    A: 串接順序會隨交換改變，一般判斷頭沒有必須給相同輸出的限制。
    C: 交換後差向量會變號，一般判斷頭可能輸出不同分數。
    D: 使用不同矩陣會給兩個輸入不同角色，交換後的加總通常不同。
