stem: |
  某公司以樸素貝式模型辨識設備警報。資料匯入時，同一個「壓力超標」旗標被複製成 4 個內容相同的欄位。重新訓練後，含該旗標的案件機率更接近 0 或 1，但獨立測試的分類正確率未提升。針對這次變動，下列處理何者最適合？
options:
  A: 保留 4 個欄位並減少訓練筆數，讓每個重複欄位取得較小的樣本權重
  B: 把 4 個欄位的名稱改成不同感測器，讓模型分別建立各欄位的條件機率
  C: 以測試集的警報比例修改先驗機率，讓重複欄位成為不同來源的證據
  D: 移除重複欄位後重新驗證，避免把同一項觀察重複當成獨立證據
answer: D
explanation:
  summary: 辨識重複特徵對樸素貝式證據累乘的影響。
  correct: 這 4 欄來自同一個旗標，不是 4 次獨立觀察。樸素貝式會分別使用各欄的類別條件機率，重複訊號可能放大信心。去除重複後，仍須重新檢查分類與機率表現。
  wrong:
    A: 減少樣本數不會消除欄位間的重複依存，也不等於降低每個欄位的權重。
    B: 欄位名稱不會改變數值來源，改名後仍是相同訊號。
    C: 修改先驗不會使重複欄位變成獨立觀察；測試集也不應參與模型設定。
