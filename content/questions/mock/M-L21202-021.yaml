stem: 某連鎖商店規劃在 40 間店導入 AI 補貨，第一輪只能選 1 間試點。多數店使用標準訂貨系統，每日訂單約 800 至 1,200 筆，包含一般品與促銷品。第一輪要確認常見業務流程及資料介面能否沿用到多數店。候選店都願意配合且已獲資料存取許可，哪間最適合優先試點？
options:
  A: 甲店：使用標準訂貨系統，每日約 1,000 筆，一般品與促銷品皆有
  B: 乙店：使用專用訂貨系統，每日約 5,000 筆，主要承接企業大宗訂單
  C: 丙店：使用標準訂貨系統，每日約 50 筆，目前只經營少數一般品項
  D: 丁店：使用新版訂貨系統，每日約 1,000 筆，資料介面由總部另行開發
answer: A
explanation:
  summary: 試點須能檢驗後續導入範圍常見的流程與資料條件。
  correct: 甲店的系統、訂單量與商品情境都接近多數店，較能檢驗資料介接及一般品、促銷品的作業流程。第一輪成果因此較適合支援後續規劃。這不代表一次試點能保證所有店適用，特殊系統與不同營運情境仍須安排後續驗證。
  wrong:
    B: 乙店雖有大量訂單，但專用系統與大宗交易流程偏離多數店。本輪若只在乙店成功，仍缺乏標準系統與一般零售流程的證據。
    C: 丙店介面相同，但訂單量及品項範圍較小，無法充分呈現多數店的作業負荷與促銷情境。容易管理不等於符合本輪驗證目的。
    D: 丁店使用新版系統與另行開發的介面，與多數店的標準系統條件不同。只驗證丁店，仍不足以確認標準介面可沿用。
