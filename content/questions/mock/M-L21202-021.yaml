stem: 某連鎖公司有 12 個據點，每週只能為 3 個據點啟用新派工模型，4 週後全部都要使用。維修時間會受全公司同時進行的旺季促銷影響。據點條件相近，團隊要評估模型效益，哪項導入安排最能降低促銷時序造成的混淆？
options:
  A: 隨機安排各據點的啟用週次，逐週比較已啟用與未啟用據點並納入週別
  B: 依各據點的準備順序啟用，合併全部啟用前與啟用後紀錄計算平均差
  C: 讓維修時間最長的據點先啟用，依改善最多的據點推估全面導入效果
  D: 依各據點的準備順序啟用，只在第 4 週全部啟用後比較各據點的差異
answer: A
explanation:
  summary: 分批導入的效益評估須區分模型效果與共同時間變化。
  correct: 階梯式試驗（按隨機順序分批導入）屬補充。隨機安排順序可減少據點特性決定啟用先後的偏差；部分據點尚未啟用的週次可提供同期對照，分析還須納入週別及據點差異。最後一週全數啟用，不能單靠該週建立未啟用對照。此法仍需足夠資料及適當分析，並非保證排除所有混淆。參考 [BMJ 試驗設計說明](https://www.bmj.com/content/350/bmj.h391.full.pdf)。
  wrong:
    B: 啟用後可能剛好進入不同促銷時段，單一前後差會把共同時間變化混入模型效果。
    C: 先挑最慢據點再挑改善最多者，會讓選擇條件影響結果，不能代表所有據點的成效。
    D: 第 4 週已沒有未啟用據點，只比較這一週的據點差異無法建立原流程的同期對照。
