stem: 某公司讓新派工模型以影子模式試行 2 週：模型接收真實工單並記錄建議，但現場仍按原派工流程工作。模型的分類正確率已達標。下階段計畫要驗證「採用新派工建議能否縮短維修時間」。哪項安排最適合？
options:
  A: 安排受控的實際派工試驗，對照新舊流程的維修時間
  B: 延長影子模式觀察期間，以現行流程的維修時間驗收
  C: 重播更多歷史工單，以模型建議的分類正確率驗收
  D: 增加模型回應速度測試，以產生建議的耗時作對照
answer: A
explanation:
  summary: 未影響現場動作的測試，不能直接驗證採用後的業務效果。
  correct: 影子模式能檢查真實輸入下的建議品質，但維修結果仍由原流程產生。要評估採用新建議的效果，需要讓適當案件實際使用新流程，並以可比較的對照評估維修時間。
  wrong:
    B: 延長觀察可增加模型建議的測試量，但現場仍採原流程，維修時間沒有反映採用新建議的效果。
    C: 分類正確率反映模型判別品質，無法單獨代表技師配置、交通與交接等因素形成的維修時間。
    D: 產生建議較快可能有助流程，但模型回應時間與案件完成維修的時間不同，不能代替目標成果。
