stem: 某客服平台以語言偵測分派翻譯服務。來信有固定的 200 字英文頁尾，正文可能是中文或日文。短正文常被整封判成英文。需求是辨認客戶自行撰寫的內容，最適合如何調整？
options:
  A: 把客戶帳號註冊地區作為每封來信的語言標籤
  B: 把英文頁尾重複加入語言偵測器的訓練資料
  C: 先辨認並排除固定頁尾，再對客戶正文偵測語言
  D: 先把整封信翻成英文，再對譯文執行語言偵測
answer: C
explanation:
  summary: 語言偵測的輸入範圍須對應要辨認的內容。
  correct: C 保留待辨認的正文，移除已知與客戶寫作無關的固定文字，直接降低頁尾主導判定的情況。若正文包含多種語言，還需另訂分段或混合語言規則。
  wrong:
    A: 註冊地區可作輔助資訊，但同一地區客戶可能用不同語言寫信，不能據此辨認實際正文。
    B: 增加頁尾樣本不會移除測試輸入中占比過高的固定英文，反而可能強化對模板的依賴。
    D: 翻成英文後判定的是譯文語言，原文的中文或日文差異已在這個流程中消失。
