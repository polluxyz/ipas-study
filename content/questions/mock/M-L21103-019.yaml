stem: 某文件問答系統每塊切成約 800 個詞元，嵌入器實際只編碼前 256 個詞元；完整原文仍有儲存。測試問題需要的獨立規格多在塊的後半部，對應區塊常未進入候選集。若先處理檢索表示遺漏，哪項修改最合適？
options:
  A: 提高生成模型的輸入上限，再沿用現有檢索索引
  B: 維持編碼上限，增加嵌入向量的輸出維度
  C: 按嵌入器上限重新切塊，完整編碼後重建索引
  D: 降低候選段落的相似度門檻，再沿用原有切塊
answer: C
explanation:
  summary: 切塊大小必須配合嵌入器的實際輸入上限。
  correct: 後半部沒有參與嵌入，向量就缺少相應規格的訊號。將文字切成嵌入器能完整讀取的區塊並重建索引，能直接處理編碼遺漏；還需按實際詞元與特殊符號預留空間。
  wrong:
    A: 生成模型能讀更多內容，不代表前段嵌入器已編碼後半部。區塊未進候選時，增加生成容量無法修補檢索表示。
    B: 增加維度可提高表示容量，但仍只編碼前 256 個詞元，後半部的規格沒有進入模型，無法藉較長向量補回。
    D: 放寬門檻可增加候選，但沒有讓後半部規格參與向量表示，可能增加雜訊，未直接修復已確認的編碼遺漏。
