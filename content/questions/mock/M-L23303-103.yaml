stem: 某文件系統可同時標記 3 種主題，矩陣每欄代表一種標籤，1 表示具有該標籤。這批 100 份文件的驗收規定，每種標籤的召回率都須至少為 0.8。第 3 種標籤很少見。程式印出各標籤的實際正例數、micro 召回率（先合併各標籤的命中與漏報）、macro 召回率（各標籤召回率的算術平均），以及逐標籤召回率。對這批驗收，何者最正確？
code: |
  import numpy as np
  from sklearn.metrics import recall_score
  y = np.zeros((100, 3), dtype=int)
  y[:90, 0] = 1
  y[:10, 1] = 1
  y[0, 2] = 1
  pred = y.copy()
  pred[:, 2] = 0
  micro = recall_score(y, pred, average='micro', zero_division=0)
  macro = recall_score(y, pred, average='macro', zero_division=0)
  per_label = recall_score(y, pred, average=None, zero_division=0)
  print(y.sum(axis=0).tolist())
  print(round(micro, 3), round(macro, 3))
  print(per_label.tolist())
code_lang: python
options:
  A: 依 micro=0.990 判達標；整體超過 0.8，足以確認每種標籤合格
  B: 依 macro=0.667 判未達標；平均低於 0.8，表示每種標籤都不合格
  C: 依逐標籤值暫緩判定；第 3 種沒有預測正例，召回率無法定義
  D: 依逐標籤值判未達標；第 3 種召回率為 0，未滿各標籤的門檻
answer: D
explanation:
  summary: 整體彙總值不能證明每種標籤都通過召回率門檻。
  correct: D 正確。實際正例數依序為 [90, 10, 1]，逐標籤召回率為 [1.0, 1.0, 0.0]。第 3 種唯一的正例被漏掉，因此這批驗收未達標。micro 把 100 次命中與 1 次漏報合計，得到 100/101，約 0.990，稀有標籤的失敗對總值影響很小。macro 為 2/3，約 0.667；它仍是平均值，不能指出哪種標籤未達標。逐標籤輸出才能逐一對照門檻。本例只判斷這批驗收，不能以 1 筆正例推定稀有標籤的長期召回率。
  wrong:
    A: micro 由各標籤的計數合併計算，多正例的標籤影響較大。整體值超過門檻，不表示每種標籤的召回率都超過門檻。
    B: 平均值低於門檻可以否定全部達標，卻不表示全部不合格。本例前 2 種標籤的召回率都是 1，只有第 3 種低於門檻。
    C: 召回率的分母是實際正例數。第 3 種有 1 筆實際正例，命中為 0，召回率可定義為 0/1=0。沒有預測正例會影響精確率的分母，不會讓這裡的召回率未定義。
