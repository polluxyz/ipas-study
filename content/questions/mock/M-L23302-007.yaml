stem: 某工廠已標註 1200 張影像，每張都有逐像素的裂縫遮罩。需求是輸出與原圖對齊的裂縫範圍，並保留細小邊界。以下架構設計何者最適合優先驗證？
options:
  A: 卷積擷取特徵後接全域池化，最後輸出整張影像的裂縫機率
  B: 卷積擷取特徵後接框座標頭，最後輸出每個裂縫的外接矩形
  C: 卷積擷取特徵後接嵌入頭，最後比較整張影像的向量距離
  D: 採編解碼分割網路，融合淺層特徵後輸出逐像素的裂縫分數
answer: D
explanation:
  summary: 有像素標註與邊界需求時，架構須提供對齊的密集輸出。
  correct: 編解碼分割網路可恢復空間解析度，融合淺層特徵可補充定位細節，例如 U-Net 的同尺度跳接。逐像素輸出才對應現有遮罩與裂縫邊界需求。
  wrong:
    A: 整張影像的單一機率只能判斷有無裂縫，不能給出每個像素的範圍。
    B: 外接矩形屬於物件偵測輸出，矩形內可能有很多非裂縫像素，無法直接表達細小邊界。
    C: 整張向量距離可比較影像相似程度，不提供與原圖對齊的像素遮罩。
