stem: 某團隊從 2 個社群鏡像站取得宣稱相同版本的外部模型檔，雜湊值卻不同。原發布者有獨立官方管道公布該版本的雜湊值。團隊目前只想確認哪個檔案與原發布檔一致，最適合採取哪項作法？
options:
  A: 核對官方獨立管道的雜湊值，再比對下載檔的雜湊值
  B: 比較兩個鏡像站的下載人數，再採用下載次數較多的檔案
  C: 比較兩個模型的測試準確率，再採用分類成績較高的檔案
  D: 比較兩個檔案的大小與名稱，再採用較接近產品文件的檔案
answer: A
explanation:
  summary: 確認下載內容一致性，需要可信來源提供的檔案識別依據。
  correct: 官方獨立管道提供可核對的基準。下載後自行計算的雜湊值與可信基準一致，才能支持檔案內容與發布版本一致。這只驗證一致性，不代表模型本身已通過安全或效能審查。
  wrong:
    B: 下載次數反映流行程度，也可能受操控，不能確認內容是否等於原發布檔。
    C: 被修改的模型仍可能在一般測試集得高分，任務成績不能作為檔案一致性的證據。
    D: 檔名與大小可被仿造，內容不同的檔案也可能有相同名稱及大小。
