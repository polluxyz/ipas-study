stem: 某偵測測試集只有 1 個類別、2 個真值物件。甲、乙保留的 3 個框及匹配結果相同，但信心由高到低的排序不同：甲為命中、誤報、命中，乙為命中、命中、誤報。AP 依整條精確率—召回率曲線彙整。對排序差異的解讀，何者最正確？
options:
  A: 兩者末端精確率相同，因此 AP 應相同
  B: 乙把誤報排到較後位置，因此 AP 較高
  C: 甲在中途保留較低召回率，因此 AP 較高
  D: 兩者真值匹配相同，因此只會影響 IoU
answer: B
explanation:
  summary: AP 會反映命中與誤報的信心排序，不只看末端指標。
  correct: 乙在召回率達 0.5 及 1.0 時都可維持精確率 1。甲在找齊第 2 個物件前先遇到誤報，使後續曲線低於乙。兩者末端都是精確率 2/3、召回率 1，AP 仍有差異。
  wrong:
    A: 末端精確率只描述全收下 3 框時的單一操作點。AP 還彙整較高門檻下的排序品質。
    C: 在相同真值數下，較低的中途召回率本身不是獎勵；甲先出現誤報使曲線表現較差。
    D: 信心排序不改變這些框與真值的幾何重疊，會改變沿排序累積的精確率與召回率。
