stem: 某向量檢索服務先取全庫最相近的 20 段，再過濾成目前使用者可讀的段落。一次測試只剩 1 段，但經完整搜尋確認，可讀範圍內有 5 段足以回答的資料。生成模型尚未接到內容。最適合先改善哪項設計？
options:
  A: 依授權範圍搜尋候選，或持續擴大候選後再做權限過濾
  B: 將取回段落的語意相似度門檻提高，再沿用固定候選數
  C: 對過濾後的 1 段增加重排次數，再交給生成服務處理
  D: 將候選數與最終回傳數都設為 5，再沿用先取後濾流程
answer: A
explanation:
  summary: 全庫先取固定數量再過濾，可能漏掉授權範圍內的相關內容。
  correct: 其他權限範圍的文件占用了有限候選名額。支援授權條件的搜尋，或擴大候選直到找到足量合格資料，可改善可讀範圍的召回；交給模型前仍須核對權限。
  wrong:
    B: 提高相似度門檻會使合格候選更少，沒有找回位於全庫前 20 名之外的可讀資料。
    C: 重排只能調整已取回的內容，無法從剩下的 1 段找出其他未進入候選的資料。
    D: 將候選縮成 5 段會更早截斷，並未解決權限過濾後不足的問題。
