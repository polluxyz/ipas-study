concepts: [data-outsourcing-governance, data-inventory]
stem: |
  某公司委託廠商標註 8,000 筆客服資料。原先審查只列廠商自有平台，實際流程另使用一家雲端標註平台，公司尚未取得該平台的資料處理資訊。主管要確認這條新增資料流是否可接受。最適合要求廠商補交哪組資料？
options:
  A: 標註員的平均產能、複核一致率與專案完工時程
  B: 接收資料的單位、儲存位置、使用用途及保存安排
  C: 標註模型的參數規模、訓練耗時與分類準確率
  D: 雲端平台的可用率、服務回應時間與客戶評價
answer: B
explanation:
  summary: 委外審查應追到實際接收與儲存資料的下游平台。
  correct: 新平台是實際資料流的一部分。接收單位、儲存位置、用途與保存安排，能支持公司核對既定範圍、責任及保護措施，不能只靠最初廠商的平台資訊判定。
  wrong:
    A: 產能與一致率可評估交付品質，不能說明下游平台如何接收、使用及保存客服資料。
    C: 模型規模與準確率可評估技術表現，無法補足下游接收者與資料處理流程。
    D: 可用率及評價可評估服務品質，不能證明實際資料流符合公司允許的處理範圍。
