stem: 某團隊的資料依類別排列，索引 0 至 7 是正常，8 至 9 是異常。每輪固定順序，批次大小為 4，且丟棄不足一批的尾端。以下模擬連續 3 輪實際使用的索引。若要讓所有類別都能參與訓練，哪項判斷最正確？
options:
  A: 3 輪後已涵蓋 10 筆；增加輪數可修正類別遺漏。
  B: 每輪只少 2 筆；增加批次大小可保證類別完整。
  C: 異常會在後續輪補入；只須維持目前資料順序。
  D: 3 輪都未見異常；須保留尾批或變更取樣安排。
answer: D
explanation:
  summary: 固定排序與丟棄尾批可能讓同一類資料永遠不參與更新。
  correct: 每輪都使用索引 0 至 7，集合不會因重跑 3 輪而擴大。異常剛好全在被丟棄的尾端。應保留尾批，或設計能涵蓋全部樣本的取樣安排；若使用每輪洗牌，還須檢查實際覆蓋情形。
  wrong:
    A: 24 次樣本使用包含大量相同樣本，不能當成已涵蓋全部 10 筆。
    B: 批次大小變大不保證尾端消失；例如大小 8 仍會丟掉相同異常。
    C: 每輪重新從相同順序開始，尾端不會自動接到下一輪。
