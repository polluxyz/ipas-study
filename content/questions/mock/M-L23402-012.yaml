stem: 某團隊讓主模型產生表示 z，再讓輔助網路從 z 猜測群體。輔助網路已能有效辨識群體，團隊希望透過對抗式去偏減少這些線索，同時保留任務效能。交替更新時，主模型與輔助網路的目標方向何者最適合？
options:
  A: 兩個網路都降低群體預測損失，主模型兼顧任務損失
  B: 輔助網路降低群體預測損失，主模型抵抗並兼顧任務損失
  C: 輔助網路提高群體預測損失，主模型降低任務損失
  D: 主模型提高任務預測損失，輔助網路降低群體損失
answer: B
explanation:
  summary: 對抗式去偏讓輔助預測器學得更好，主模型則抵抗群體線索。
  correct: 輔助網路必須努力辨識群體，才能提供有用的去偏訊號。主模型在降低任務損失的同時，反向抵抗輔助網路從表示判斷群體的能力。若兩者都努力改善群體辨識，表示反而更可能保留群體訊息。這屬訓練中介入。
  wrong:
    A: 兩個網路共同降低群體損失，等於合作保留群體可辨識訊息，沒有形成題目要的對抗。
    C: 故意讓輔助網路失敗，不代表表示已去除群體資訊；也失去要求主模型改變表示的訊號。
    D: 提高任務損失會主動損害主要預測目標，並未要求主模型降低群體線索。
