stem: |
  某平台預測設備在接下來 30 天是否故障，沒有故障者需觀察滿 30 天才能確定標籤。團隊想用最近 7 天剛做出的預測評估新版模型，並將目前未收到故障紀錄者都標為正常。若要評估完整 30 天目標，下列做法何者最適合？
options:
  A: 保留這批尚未到期的正常標籤，再以分層抽樣使兩版測試比例一致
  B: 改用已完成 30 天觀察且紀錄完整的預測批次，或等待本批標籤成熟
  C: 將故障判定門檻降到較低數值，再對目前正常標籤計算完整期間召回率
  D: 只保留已收到故障紀錄的設備，直接用這些案件代表完整期間的整體效能
answer: B
explanation:
  summary: 辨識觀察期間不足導致的評估標籤不完整。
  correct: 未到 30 天且尚未故障，不能證明完整期間不會故障。需要觀察期間已完成的批次，才能建立完整目標的正常與故障標籤。
  wrong:
    A: 分層抽樣只調整樣本配置，不能讓尚未完成的觀察變成完整標籤。
    C: 降低門檻不能修正尚未確定的真實標籤，仍無法估計完整期間的召回率。
    D: 只留已故障者會移除正常案例，不能代表包含正常設備的整體效能。
