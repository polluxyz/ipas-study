stem: |-
  某設備模型在同一預測時點，分別輸出未來 7 天及 30 天內「至少故障一次」的機率。兩者使用相同故障定義，未來 7 天包含在未來 30 天內，也沒有保養改變風險的情況。哪一組輸出必定違反這兩個事件的包含關係？
options:
  A: 甲設備：7 天內為 0.12，30 天內為 0.20
  B: 乙設備：7 天內為 0.18，30 天內為 0.14
  C: 丙設備：7 天內為 0.10，30 天內為 0.10
  D: 丁設備：7 天內為 0.00，30 天內為 0.05
answer: B
explanation:
  summary: 同一起點的累積事件機率，較長期間不能低於較短期間。
  correct: 7 天內至少故障一次的每個事件，也必然是 30 天內至少故障一次，所以短期機率不得高於長期。乙的 0.18 大於 0.14，兩個輸出不能同時是這些事件的一致機率。這項檢查只能找出邏輯不一致，不能證明其餘機率已校準。
  wrong:
    A: 短期 0.12 不高於長期 0.20，符合必要的包含關係。
    C: 兩者可以相等，例如在這個預測條件下，第 8 至30天沒有額外事件機率；不要求嚴格增加。
    D: 短期為零不妨礙第 8 至30天仍有故障風險，0.00 不高於 0.05。
