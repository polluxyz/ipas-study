stem: 某參數 w 只允許落在 [-2,-1] 或 [1,2]，目標為最小化 L(w)=(w-0.5)²。求解器從負區間起始，停在 w=-1。另一工程師認為目標是凸函數，因此這個局部最小值也必為全域最小值。下列判斷何者最正確？
options:
  A: 此問題為凸問題，w=-1 是唯一全域最適解
  B: 可行域不凸，w=-1 是局部最適但全域最適為 w=1
  C: 目標函數不凸，w=-1 與 w=1 是相同損失的解
  D: 可行域不凸，w=-1 與 w=1 都是全域最適解
answer: B
explanation:
  summary: 凸最佳化的結論同時需要凸目標與凸可行域。
  correct: 兩個可行點 -1 與 1 的中點 0 不可行，因此可行域不是凸集合。在負區間內 -1 是局部最小值，損失 2.25；正區間內 1 的損失為 0.25，才是全域最小值。不能只憑目標函數凸就套用凸問題的結論。
  wrong:
    A: 目標雖凸，但限制形成兩個分離區間。w=1 的損失更低，所以 -1 不是全域最適。
    C: 平方仿射函數是凸函數；兩點距離 0.5 不同，損失分別是 2.25 與 0.25。
    D: 兩點分別是各自區間內的局部最適解，但全域最適還要比較不同區間。w=-1 的損失較大，不能與 w=1 同列全域最適。
