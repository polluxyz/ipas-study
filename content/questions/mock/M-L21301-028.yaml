stem: 某集團合併 3 家公司的客戶資料與訂單。各公司都從客戶編號 0001 開始編碼，同一公司內的編號唯一，不同公司的相同編號通常是不同客戶。工程師只按客戶編號連接，造成訂單配上其他公司的客戶屬性。最適合採用哪項連接規則？
options:
  A: 按客戶編號連接後，以最新更新的客戶屬性覆蓋
  B: 將各公司的客戶編號補齊相同位數，再進行連接
  C: 以公司代碼與客戶編號組成的複合鍵進行連接
  D: 先以客戶編號合併客戶主檔，再依該編號連接
answer: C
explanation:
  summary: 跨來源連接須保留識別碼所屬的範圍。
  correct: 客戶編號只在同一公司內唯一。將公司代碼納入連接鍵，才能把訂單對應到正確公司的客戶，避免不同實體因編號碰撞而混在一起。
  wrong:
    A: 更新時間可處理同一實體的新舊資料，但不能證明不同公司的同號客戶是同一人。
    B: 補齊位數只統一文字格式，不會區分編號屬於哪家公司，碰撞仍會發生。
    D: 先依局部唯一的編號合併主檔，會先把不同客戶混成一筆，後續連接無法恢復正確身分。
