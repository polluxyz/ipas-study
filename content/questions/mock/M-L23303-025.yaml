stem: 某廠為了方便檢查，建立故障與正常各半的測試集。正式產線故障比例約 1%，兩類內的訊號分布與測試集相同。團隊打算把測試集的精確率直接當成產線警報中真故障的比例。下列補充評估何者最適合？
options:
  A: 依產線類別比例取得代表性樣本，或按該比例加權評估精確率
  B: 對等量兩類的測試集重複分層切分，再平均各次精確率
  C: 改報告原測試集的整體準確率，作為產線警報的品質估計
  D: 增加原測試集的獨立樣本量，再以等量兩類計算精確率
answer: A
explanation:
  summary: 精確率會受到被評估資料中的正類比例影響。
  correct: 精確率的分母包含真正故障警報與正常件誤報。當正常件在產線占比大增時，即使類別內辨識表現相同，誤報在警報中的占比仍會改變。應使用代表產線比例的樣本，或依已知抽樣比例加權計算。
  wrong:
    B: 重複分層切分可觀察估計的波動，但各次仍採兩類各半，沒有修正產線正類占比很低的問題。
    C: 準確率衡量全體案件是否判對，並非警報中有多少真故障，也同樣會受類別占比影響。
    D: 增加件數可降低抽樣波動，卻不會修正故障比例與產線不同的問題。
