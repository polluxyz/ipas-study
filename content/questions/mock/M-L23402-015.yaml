type: 情境
codes: [L23402]
concepts: [fairness-audit]
stem: |
  某資格分類器的兩個群體通過率與錯誤率已達內部群體指標。但稽核另要求「資格條件近似者，應得到近似結果」。目前沒有逐筆相似案例的比較紀錄。若要檢查這項額外要求，最適合補哪項證據？
options:
  A: "增加各群的通過人數統計，檢查兩群通過人數是否接近"
  B: "增加各群的平均預測分數，檢查兩群平均分數是否接近"
  C: "建立資格相似程度的準則，檢查相似案例對的決策差異"
  D: "增加全體樣本的正確比例，檢查整體準確率是否達門檻"
answer: C
explanation:
  summary: "區分群體公平指標與個體相似待遇的檢查。"
  correct: "群體平均達標不保證每對相似個體獲得相似待遇。應先界定與資格相關的相似準則，再比較案例對的輸出，才能直接檢查題設的額外要求。"
  wrong:
    A: "群體通過人數受群體規模影響，既不等於通過率，也沒有比較資格近似的個體。"
    B: "平均分數仍是群體摘要，不同個體間的大差異可能在平均時互相抵銷。"
    D: "整體準確率衡量與標籤一致的比例，不能直接檢查相似資格者的輸出差異。"
guide_refs: [guide-3:6-18, guide-3:6-25]
author: codex
review:
  status: verified
  blind_answer: C
