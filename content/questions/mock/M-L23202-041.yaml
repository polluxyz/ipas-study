stem: 某 K 最近鄰分類器使用固定縮放與距離，已知訓練資料的鄰近案例通常距離小於 2。新設備的 5 個最近鄰都標為正常，但距離皆超過 30。若要決定能否將此結果當成可靠正常判斷，何者最適合？
options:
  A: 依 5 票一致將正常判斷列為高可信結果
  B: 增加鄰居數後，以正常票數增加作為採用依據
  C: 先檢查新設備與既有案例的差異，再驗證適用性
  D: 改以最近 1 筆的標籤，作為新設備的可靠判斷
answer: C
explanation:
  summary: 鄰居投票一致不代表新樣本受到鄰近訓練資料支持。
  correct: K 最近鄰會從現有案例中選出最近者，即使每筆都很遠。新設備與既有案例的距離明顯超出常見範圍，須檢查表示與資料差異，並以新設備標註資料確認適用性。
  wrong:
    A: 一致票數只描述被選案例的標籤，不能消除這些案例與新設備都不相近的問題。
    B: 增加鄰居數可能改變票數，但新加入者距離也不會更近，不能只以正常票數增加證明可靠。
    D: 最近 1 筆仍距離很遠，改成單一案例沒有增加對新設備的局部資料支持。
