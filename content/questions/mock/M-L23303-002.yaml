code: |
  import numpy as np
  from sklearn.model_selection import StratifiedKFold
  X = np.zeros((1000, 1))
  y = np.array([0] * 950 + [1] * 50)
  cv = StratifiedKFold(n_splits=5, shuffle=True, random_state=7)
  print([int(y[valid].sum()) for _, valid in cv.split(X, y)])
