stem: 某團隊以 3,000 組「使用者提問—理想回覆」做監督式微調（Supervised Fine-Tuning，SFT）。目標是讀完提問後，產生欄位順序正確且內容完整的理想回覆。若兩段都保留在輸入序列，哪種損失計算方式最符合目標？
options:
  A: 對理想回覆各詞元計算預測損失
  B: 對使用者提問詞元計算預測損失
  C: 對理想回覆詞頻向量計算平方誤差
  D: 對提問與回覆的文字長度差計算損失
answer: A
explanation:
  summary: 作為條件的文字可以保留在輸入，但不必成為直接監督目標。
  correct: 提問提供回覆所需的條件，理想回覆才是要學習的目標。以回覆詞元計算直接的預測損失，可對準此任務；提問仍參與條件建模，並不代表移除它。
  wrong:
    B: 這會直接訓練重現提問，而不是以理想回覆提供目標，與此批資料的回覆學習目的不合。
    C: 詞頻向量可用來學習用詞分布，但沒有保留詞序。相同詞頻可對應不同欄位順序，不能取代理想回覆的序列預測目標。
    D: 長度差可當輔助限制，卻不會提供回覆中應出現哪些詞的監督，無法取代回覆的序列預測損失。
