stem: 某機械廠翻譯 200 份操作手冊。人工確認句法流暢，但同一零件名稱被譯成 3 種中文，操作員因而誤認零件料號。團隊已有核准的雙語零件表。哪項改善最直接？
options:
  A: 提高生成取樣的隨機程度，讓各份手冊使用更豐富詞彙
  B: 將流暢度設為唯一驗收項目，選用語句自然的翻譯結果
  C: 把核准零件表接入術語控制，逐項檢查名稱與料號對應
  D: 把翻譯結果依句子長度排序，優先採用較短的中文句子
answer: C
explanation:
  summary: 專業翻譯的術語一致性需以領域對照表驗證。
  correct: 錯誤集中於零件名稱而非句法。利用核准雙語表約束或校正術語，並檢查名稱與料號，能直接處理一物多譯造成的辨識問題。
  wrong:
    A: 增加詞彙變化可能使譯名更不一致，本例要維持固定專業對應而非追求表達多樣性。
    B: 測試已確認流暢但仍有零件混淆，只驗收流暢度會漏掉已知的術語錯誤。
    D: 句子長短與零件譯名是否一致沒有必然關係，不能修正錯誤的零件對應。
