stem: 某機械廠翻譯 200 份操作手冊。人工確認句法流暢，但同一零件名稱被譯成 3 種中文，歷年譯稿也混用這些譯名，操作員因而誤認零件料號。團隊已有核准的雙語零件表。哪項改善最直接？
options:
  A: 以核准零件表造句微調翻譯模型，讓模型自行學會各零件的譯名
  B: 將歷年譯稿建成翻譯記憶，優先重用相似原文的既有整句譯文
  C: 把核准零件表接入術語控制，逐項檢查名稱與料號對應
  D: 翻譯後請模型逐份統整用詞，使每份手冊內的譯名前後一致
answer: C
explanation:
  summary: 專業翻譯的術語一致性需以領域對照表驗證。
  correct: 錯誤集中於零件名稱而非句法。利用核准雙語表約束或校正術語，並檢查名稱與料號，能直接處理一物多譯造成的辨識問題。
  wrong:
    A: 微調可能改善譯名，但模型輸出無法保證每次都符合核准表，也沒有檢查料號，比術語控制間接。
    B: 歷年譯稿已混用多種譯名，重用整句譯文會把不一致的譯名帶進新手冊。
    D: 單份手冊內一致不代表跨手冊一致，也不保證採用的是核准譯名。
