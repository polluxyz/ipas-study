stem: 某推論流程要計算 A×B×C，矩陣形狀依序為 1000×2、2×1000、1000×1。可選 (A×B)×C 或 A×(B×C)。指定一般 m×k 與 k×n 矩陣相乘需 mkn 次純量乘法，忽略加法與浮點誤差。哪項比較最正確？
options:
  A: 先算 A×B；兩種次序都需 3000000 次乘法。
  B: 先算 A×B；乘法次數為另一種的 750 分之 1。
  C: 先算 B×C；乘積數值也會因結合次序而改變。
  D: 先算 B×C；乘法次數為另一種的 750 分之 1。
answer: D
explanation:
  summary: 矩陣乘法的結合次序會改變中間矩陣與運算量。
  correct: 先算 A×B 會產生 1000×1000 中間矩陣，共需 2000000＋1000000＝3000000 次乘法。先算 B×C 則先得到 2×1 中間矩陣，共需 2000＋2000＝4000 次。後者用量是前者的 1/750。忽略浮點誤差時，結合律保證兩種次序的乘積相同。
  wrong:
    A: 相同的最終形狀不代表相同運算量，中間矩陣大小不同。
    B: 先算 A×B 產生較大的中間矩陣，省算力的方向相反。
    C: 改變結合次序沒有交換矩陣順序；數學乘積仍相同。
