stem: 某日更模型的既有設定每次重訓需 1 小時。擴大超參數搜尋後，候選設定需 6 小時，平均每天可再減少 3 件錯誤，每件錯誤成本 2 單位。額外運算每小時花費 4 單位；推論與維運成本相同。團隊只以每日淨成本決定是否採用，哪項判斷最正確？
options:
  A: 採用新設定，每日淨成本減少 6 單位
  B: 保留既有設定，新設定每日淨成本增加 14 單位
  C: 採用新設定，每日淨成本減少 20 單位
  D: 保留既有設定，新設定每日淨成本增加 24 單位
answer: B
explanation:
  summary: 調校效益應扣除持續發生的額外運算成本。
  correct: 每天可減少的錯誤成本為 3×2=6；額外重訓費為 (6−1)×4=20，因此每日淨成本增加 14。依題目只看每日淨成本的規則，保留既有設定較合適。
  wrong:
    A: 6 是減少錯誤所節省的成本，尚未扣掉額外重訓費，不能當作淨節省額。
    C: 20 是額外重訓費，屬於增加的成本，並非淨節省額。
    D: 24 是新設定全部 6 小時的重訓費；比較還要扣掉既有重訓費與減少錯誤所省的成本。
