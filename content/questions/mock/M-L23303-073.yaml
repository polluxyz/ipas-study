stem: 某瑕疵分類專案事前約定，以獨立測試集的 F1 至少 0.80 作為驗收標準。模型與門檻定案後，測試結果為 F1 0.76、準確率 0.98、精確率 0.93。團隊認為其他數字較好，想調整報告結論。哪項處理最正確？
options:
  A: 改採準確率驗收，將這次結果判為達標
  B: 改採精確率驗收，將這次結果判為達標
  C: 依測試集重選門檻，再用同一批資料驗收
  D: 依約定的 F1 判為未達標，另行分析失敗原因
answer: D
explanation:
  summary: 最終測試應依事前指定的標準判讀。
  correct: 本次 F1 未達事前約定的 0.80，應如實判為未達標。其他指標可協助分析，不能在看過結果後挑有利指標取代原標準。若據此改善方案，需另留未參與改進的資料評估。
  wrong:
    A: 準確率量測整體正確比例，與約定的 F1 不同；事後替換無法證明原目標已達成。
    B: 精確率只衡量判為瑕疵的可信度，未同時反映漏掉的瑕疵，也不是事前指定的驗收指標。
    C: 同一批測試資料若被用來改門檻，就參與了方案選擇，重評結果不再是原先的獨立驗收。
