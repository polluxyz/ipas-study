stem: |
  某連鎖服務商想預測每位顧客的滿意程度，已有 10 萬筆填答完整的滿意度問卷。盤點發現，問卷連結只寄給提出客訴的人，未客訴顧客從未被邀請。若要評估能否建立適用於全體顧客的模型，最應優先補哪項資料工作？
options:
  A: 增加現有客訴問卷的標註人數，檢查填答與標籤一致性
  B: 平衡現有問卷中的客訴類型，重新配置各類型的抽樣比例
  C: 彙整更多月份的客訴問卷，擴充模型可使用的歷史樣本
  D: 從全體顧客抽樣邀請問卷，記錄回覆情形並檢查代表性
answer: D
explanation:
  summary: 資料完整且數量多，仍可能缺少目標人群的代表性。
  correct: 現有蒐集方式排除了未客訴顧客。先讓全體顧客有被抽樣邀請的機會，再追蹤未回覆與回覆分布，才能評估資料能否代表模型的使用對象。
  wrong:
    A: 複核可提升既有問卷的標註一致性，但不會補入未客訴顧客，因此無法處理人群涵蓋不足。
    B: 平衡客訴類型只會改變已收錄客訴者的比例，未被邀請的顧客仍不在資料中。
    C: 增加月份可涵蓋季節變化，卻會持續沿用只邀請客訴者的機制。更多相同來源樣本不能直接補足缺少的人群。
