stem: 某物流平台每天 08:00 預測當日延遲風險。倉庫在 07:00 已記錄裝貨量，但這份資料每天 10:00 才傳到平台。離線資料以倉庫的事件時間連接，得到很好的分數。若要重現 08:00 的實際預測條件，特徵最適合如何處理？
options:
  A: 依倉庫事件時間排序後沿用當日裝貨量
  B: 把當日裝貨量改為其高低排名後再輸入
  C: 把資料按日期切成訓練與驗證後沿用當日裝貨量
  D: 依平台收到資料的時間建立預測當下可用的特徵
answer: D
explanation:
  summary: 歷史事件已發生，不代表預測系統當下已拿到資料。
  correct: 平台 08:00 尚未收到當日裝貨量，離線使用會高估可用資訊。須依實際接收時間重建當下可取得的資料。
  wrong:
    A: 事件先發生仍不代表平台已收到。只按事件時間排序無法修正傳輸延遲帶來的資訊差異。
    B: 排名仍來自當時尚未收到的裝貨量，轉換表示方法不能改變可取得時間。
    C: 日期切分可避免部分時間上的混用，卻不能讓同一天 10:00 才收到的數值在 08:00 可用。
