stem: 某產品助理收到問題「新版為什麼取消離線功能？」。附上的新版規格明列支援離線使用。測試發現助理常順著問題編出取消原因。若要處理這種帶錯誤前提的提問，提示最適合增加哪項要求？
options:
  A: 先整理使用者提到的取消原因，再改成中性的產品說明
  B: 先核對問題前提與規格，前提不符時更正後再回答
  C: 先推測使用者最可能抱怨的缺點，再以安撫語氣回答
  D: 先列出同類產品取消功能的常見原因，再濃縮成答覆
answer: B
explanation:
  summary: 回答原因之前，須先確認被詢問的事件是否成立。
  correct: B 讓助理先驗證是否真的取消離線功能。規格與提問前提衝突時，應指出規格仍列有此功能，不能把問題中的假設當作已確認事實。
  wrong:
    A: 問題沒有提供真實取消原因，先整理取消原因仍接受了錯誤前提，中性語氣不能修正事實。
    C: 安撫與意圖推測可改善互動，但不能證明取消事件成立，也可能引入額外猜測。
    D: 同類產品的常見原因不是本產品取消功能的證據，不能由一般經驗推導這次事件。
