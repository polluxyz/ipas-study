stem: |
  某文件主題系統以非負矩陣分解取得 X≈WH。比較兩版報告時，工程師把 W 的第 1 個主題欄乘 2，並把 H 對應的第 1 個主題列除以 2，其他元素不變。主管看到 W 的該欄變大，認為第 1 主題對文件重建的貢獻加倍。哪項判斷最正確？
options:
  A: 該主題貢獻加倍，文件重建值也隨之增加
  B: 該主題貢獻不變，文件重建值也維持相同
  C: 該主題貢獻減半，文件重建值也隨之降低
  D: 該主題貢獻不變，文件重建誤差會因此減半
answer: B
explanation:
  summary: 一對分解因子的相反縮放會互相抵銷，不能只看其中一側的大小。
  correct: 第 1 主題對每格的貢獻是 W 的對應元素乘上 H 的對應元素。乘 2 再乘 1/2 的乘積不變，其餘主題也不變，因此 WH、重建貢獻與誤差皆相同。非負性仍維持，但因子的尺度選擇改變了。
  wrong:
    A: 只看 W 的放大會漏掉 H 同時縮小。兩者乘積不變，該主題對重建值的貢獻並未增加。
    C: 只看 H 的縮小會漏掉 W 同時放大。貢獻由一對因子的乘積決定，不能單看其中一側。
    D: 重建矩陣 WH 相同，與原始 X 的差也相同。這種因子縮放不會改善重建誤差。
