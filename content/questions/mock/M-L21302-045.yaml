stem: 某售後助理以問題的語意相似度重用已生成答案。測試中，「收貨 7 天能否退貨」與「收貨 30 天能否退貨」相似度很高，卻依公司退貨規則得到不同答案。系統已能抽出天數與商品類別。若要保留快取並防止此類誤用，最適合如何調整命中條件？
options:
  A: 調高語意相似度門檻，仍以問題整句的向量作為判準
  B: 以商品類別建立快取分區，再按區內的語意相似度命中
  C: 將日期與數字移出問題文字，再用剩餘語句進行比對
  D: 要求天數與商品類別吻合，再進行語意相似度比對
answer: D
explanation:
  summary: 語意相近的問題，仍可能因關鍵條件不同而不能共用答案。
  correct: 天數與商品類別會決定規則結果，必須納入快取的適用條件。先核對這些欄位，再比較語意，可保留同條件問題的重用機會，並攔截題目指出的誤命中。
  wrong:
    A: 高相似度仍可能同時涵蓋不同天數。只提高門檻沒有要求決策條件一致，不能可靠排除此類錯配。
    B: 商品類別分區只處理其中一個條件，同類商品的 7 天與 30 天問題仍可能共用答案。
    C: 移除數字會丟掉決定答案的天數，反而讓適用條件不同的問題更容易被視為相同。
