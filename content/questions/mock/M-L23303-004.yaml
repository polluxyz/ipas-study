stem: 某工程師用時間索引 0 至 7 模擬逐步預測。以下 TimeSeriesSplit 使用 3 個切分，每次驗證 2 筆，gap=0。程式列出各次最後訓練索引與最早驗證索引，結果為何？
options:
  A: "[(2,1),(4,3),(6,5)]"
  B: "[(1,2),(3,4),(5,6)]"
  C: "[(1,1),(3,3),(5,5)]"
  D: "[(5,6),(3,4),(1,2)]"
answer: B
explanation:
  summary: 時序交叉驗證的前後順序。
  correct: 每次訓練範圍擴大，驗證移到更晚的資料。3 組訓練最後索引都小於驗證起點，沒有用較晚索引訓練後預測較早索引。
  wrong:
    A: 這把訓練與驗證邊界倒過來，會讓較晚資料參與預測較早資料。
    C: 這讓訓練與驗證共用邊界索引，與本題不重疊切分不符。
    D: 這把切分順序反轉。程式會依驗證時間由早到晚產生切分。
