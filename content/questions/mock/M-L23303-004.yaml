code: |
  import numpy as np
  from sklearn.model_selection import TimeSeriesSplit
  cv = TimeSeriesSplit(n_splits=3, test_size=2, gap=0)
  pairs = [(int(train[-1]), int(valid[0]))
           for train, valid in cv.split(np.arange(8))]
  print(pairs)
