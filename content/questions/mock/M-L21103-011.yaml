stem: 某團隊已訓練一個變分自編碼器（以潛在分布產生資料的模型）。模型採標準常態分布作為潛在先驗。團隊現在要生成新圖，不指定任何原始圖像。哪個流程最符合此模型的生成方式？
options:
  A: 從指定潛在先驗抽取向量，將向量直接排成圖像像素
  B: 從指定潛在先驗抽取向量，再送入已訓練的解碼器
  C: 選取原圖送入編碼器，以其後驗均值解碼重建原圖
  D: 從指定潛在先驗抽取向量，再送入已訓練的編碼器
answer: B
explanation:
  summary: 無指定原圖的生成可由潛在先驗取樣後解碼。
  correct: 模型已指定潛在先驗，生成時可從該分布抽取向量，再由解碼器產生資料。編碼器主要用於從既有輸入估計潛在表示；無指定原圖的取樣不需要先編碼原圖。
  wrong:
    A: 潛在向量表示壓縮後的因素，不等於像素陣列，仍須經解碼器映射到影像空間。
    C: 這是以指定原圖為條件的重建流程，並非本例要求的從先驗取樣生成新圖。
    D: 編碼器由資料估計潛在分布，不負責將潛在向量轉為影像；生成時的方向應經過解碼器。
