subject: 1
type: 情境
codes: [L21101]
concepts: [sentiment-analysis, text-representation]
stem: |
  某外送平台抽查 600 則短評，發現不少評論只有餐點名稱與表情符號。人工可由笑臉或生氣表情辨別態度，但現行文字表示只接收中文字，其他字元在輸入前被刪除。團隊希望保留這類短評的情感線索，最適合先比較哪項方案？
options:
  A: 將常見表情映成固定文字標記，再納入模型訓練
  B: 依餐點名稱建立菜色類別，再以菜色預測滿意度
  C: 以現有中文字詞增加同義詞，再擴充短評訓練集
  D: 依評論長度設定樣本權重，再加強短篇評論訓練
answer: A
explanation:
  summary: 文字表示須讓非文字的情感線索進入分類流程。
  correct: 固定標記可讓原本只接受中文字的流程保有表情差異，並讓模型由標註資料學習標記與情感的關係。仍需測試表情和上下文，不宜把每個表情直接視為固定情感答案。
  wrong:
    B: 菜色類別可表達評論的對象，不能取代同一道菜收到讚賞或抱怨的差異。
    C: 中文同義詞可增加措辭變化，但本例被刪除的線索是表情，無法由菜名同義詞補回。
    D: 樣本權重可加強短評對訓練的影響，但模型仍看不到用來區分態度的表情。
