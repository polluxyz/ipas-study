stem: |
  某零件辨識工具只顯示前 5 個候選，由技師從中確認，兩版的查找時間相同。固定測試集上，甲版首名正確率為 92%、前 5 名包含正解的比例為 95%；乙版依序為 89%、98%。本階段驗收只要求盡量減少「候選中沒有正解」的情況。下列選擇何者最符合規則？
options:
  A: 選甲版，因為首名正確率較高可直接代表前 5 名候選的涵蓋能力
  B: 選乙版，因為前 5 名涵蓋正解的比例較高，符合候選清單的驗收目標
  C: 選甲版，因為首名與前 5 名的正確率較接近，表示候選清單更完整
  D: 兩版視為相同，因為清單都顯示 5 個候選且查找所需時間相同
answer: B
explanation:
  summary: 依實際候選確認流程選擇 Top-k 評估方式。
  correct: 技師可從前 5 名中選正解，本階段要求正解出現在清單內。乙版前 5 名涵蓋率較高，因此比首名分數更符合這項驗收目標。
  wrong:
    A: 首名正確率適用於只採第一名的流程，不能取代題幹指定的清單涵蓋率。
    C: 兩種正確率的差距不是候選是否含正解的指標，甲版的涵蓋率仍較低。
    D: 清單長度與查找時間相同，不代表清單內容包含正解的機會相同。
