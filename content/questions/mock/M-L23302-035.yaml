stem: 某門市要預測明日來客數。過去 2 年中，同一星期幾的來客數相近，但平日與週末差異明顯，近期沒有顯著成長趨勢。團隊要在複雜模型前，先建立能反映這項週期的簡單基準。下列做法何者最適合？
options:
  A: 以昨日的來客數作為明日預測
  B: 以最近 7 天的平均來客數作為明日預測
  C: 以過去 2 年全部日期的平均來客數作為明日預測
  D: 以明日所對應的上週同日來客數作為明日預測
answer: D
explanation:
  summary: 基準模型應保留已知且重要的週期結構。
  correct: 上週同日與預測日屬於相同星期幾，能以簡單方法保留平日與週末的差異。可先把它作為週期基準，再驗證複雜模型是否帶來額外改善。
  wrong:
    A: 昨日不一定與明日屬於相同型態，尤其跨越平日與週末時，無法保留題目指出的星期週期。
    B: 連續七天平均混合平日與週末，會抹去不同星期幾的系統性差異。
    C: 全部日期的平均值提供整體水準，但沒有表達星期週期，基準會漏掉題目已知的主要結構。
