stem: 某公司用模型替 10,000 件客服信預標類別，並規劃「低信心件送人工、高信心件直接收錄」。專案希望另外估計整批高信心標籤的錯誤率，品質抽查預算只夠 200 件。哪項抽樣最適合這個估計目的？
options:
  A: 抽取低信心件中最接近分類門檻的 200 件進行複核
  B: 從高信心件中機率抽樣 200 件，使用獨立人工標籤複核
  C: 抽取高信心件中分數最高的 200 件進行複核
  D: 抽取已被使用者回報為錯誤的 200 件進行複核
answer: B
explanation:
  summary: 估計高信心自動標籤的品質，抽查須代表這批資料。
  correct: 從目標的高信心資料中進行機率抽樣，再以獨立人工標籤核對，可估計這批資料的錯誤率。抽查結果仍有抽樣不確定性，需要保存抽樣方法與複核紀錄。
  wrong:
    A: 低信心件適合用來找難例及補標，但不是要估計的高信心資料，錯誤率不能直接套用。
    C: 分數最高的樣本只代表高信心資料中的極端子集，無法代表整批自動收錄標籤。
    D: 被回報的錯誤件經過使用者選擇，沒有代表整批高信心資料，會產生抽樣偏差。
