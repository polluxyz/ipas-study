stem: 某團隊依 NIST AI RMF 1.0 的 MEASURE 2.12 評估能源使用。甲模型訓練耗電 800 度，每次推論 0.02 度；乙模型訓練耗電 200 度，每次推論 0.04 度。預計各執行 50,000 次推論，不再訓練，其他耗電相同。只比較訓練加推論的耗電總量，下列何者最正確？
options:
  A: 甲共 1,000 度，乙共 2,000 度，甲較低
  B: 甲共 1,800 度，乙共 2,200 度，甲較低
  C: 甲共 800 度，乙共 200 度，乙較低
  D: 甲共 2,800 度，乙共 1,200 度，乙較低
answer: B
explanation:
  summary: 比較能源使用時，應在相同工作量下合計相關階段。
  correct: 甲為 800 ＋ 50,000 × 0.02 ＝ 1,800 度；乙為 200 ＋ 50,000 × 0.04 ＝ 2,200 度。MEASURE 2.12 涵蓋訓練及管理活動的環境影響與永續性；本例只就題目限定的耗電比較，不代表完整環境評估。
  wrong:
    A: 1,000 與 2,000 度只包含推論耗電，沒有加入兩個模型各自的訓練耗電。
    C: 只看訓練會忽略 50,000 次推論。乙的訓練較省電，但每次推論耗電較高。
    D: 這組結果將兩個模型的每次推論耗電互換，甲應使用 0.02 度，乙應使用 0.04 度。
