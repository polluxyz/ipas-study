stem: 某物流模型使用運送距離與貨物重量。兩欄都有少數經確認有效的極端大值。團隊要保留原始觀測，不刪除或截尾，並希望縮放所用的中心與尺度較少受極端值影響。哪項前處理最符合需求？
options:
  A: 使用各欄的平均值與標準差縮放
  B: 使用各欄的中位數與四分位距縮放
  C: 使用各欄的最小值與最大值縮放
  D: 使用各筆資料的向量長度縮放
answer: B
explanation:
  summary: 以中位數與四分位距設定縮放尺度，可減少極端值影響。
  correct: 中位數與四分位距主要由資料中央部分決定，較不易被少量極大值拉動。這種縮放不需要刪除或截尾，也不代表極端觀測轉換後就消失。
  wrong:
    A: 平均值與標準差都會受到極端值影響，不符合中心與尺度要較穩健的要求。
    C: 最小值與最大值直接取自範圍兩端，極端大值可能壓縮多數資料的轉換範圍。
    D: 逐筆依向量長度縮放改變的是每筆資料的整體大小，並非穩健估計各欄的中心與尺度。
