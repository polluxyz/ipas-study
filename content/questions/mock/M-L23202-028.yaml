concepts: [support-vector-machine, resource-aware-model-selection]
stem: |
  某客服分類器採徑向基底核支援向量機，部署時直接逐一計算輸入與支援向量的核值。新版與舊版的特徵維度、核設定及硬體相同，支援向量由 800 筆增至 8,000 筆。兩版準確率皆達標。若要評估新版的即時部署風險，最應優先補哪項檢查？
options:
  A: "比較兩版訓練時的迭代次數與每輪損失下降幅度"
  B: "比較兩版訓練資料的總筆數與正負類別的樣本比例"
  C: "量測兩版逐筆推論延遲與儲存支援向量的記憶體需求"
  D: "比較兩版分類門檻的數值與輸出分數的平均水準"
answer: C
explanation:
  summary: "辨識核支援向量機的支援向量數與部署成本。"
  correct: "題設的直接核推論需要遍歷支援向量。支援向量增多會增加核值計算與儲存需求，即使準確率達標，仍須在目標設備量測延遲與記憶體。"
  wrong:
    A: "迭代次數與訓練損失主要反映離線訓練過程，不能直接驗證逐筆推論的服務成本。"
    B: "訓練樣本規模可能影響訓練成本，但部署實際使用的是支援向量，不能取代對推論的量測。"
    D: "門檻與平均分數影響決策，並未衡量本例核計算次數與支援向量儲存增加的成本。"
