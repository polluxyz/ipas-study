stem: |
  某會議助理要將逐字稿標在畫面中的發言者旁。測試影片有 4 人同框，語音轉文字已正確，但系統只按座位順序輪流指定發言者，常把句子標錯人。錄音與影片時間已同步。最適合增加哪種處理？
options:
  A: 辨識語音的說話者區段，結合對應時間的嘴部活動配對
  B: 提高語音轉文字的詞彙覆蓋率，再按既有座位順序配對
  C: 將逐字稿依句意重新分段，再按各句文字長度指定人物
  D: 強化各人物的臉部身分辨識，再按既有座位順序配對
answer: A
explanation:
  summary: 辨識說了什麼，與確認畫面中是誰在說話，是不同任務。
  correct: 語音中的說話者區段提供發言活動，嘴部活動提供畫面中的候選人物。將兩者在同一時間窗配對，才有直接證據把句子連到發言者。
  wrong:
    B: 本例逐字稿已正確。提高詞彙覆蓋率處理的是轉錄內容，不會修正按座位輪流指定發言者的規則。
    C: 句意與文字長度可協助排版或分句，不能提供某個時間是哪位人物發聲的證據。
    D: 臉部身分辨識能確認畫面中有哪些人，但同框人物不一定正在發言。仍按座位順序配對會保留相同錯誤。
