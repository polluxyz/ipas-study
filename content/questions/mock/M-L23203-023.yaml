stem: 某設備廠用自編碼器的重建誤差篩查故障。訓練資料混入大量反覆發生的磨耗故障，模型已能精確重建這些故障訊號，因此實際故障的誤差也很低。若維持以正常狀態重建誤差偵測偏離的方案，下列處理何者最適合？
options:
  A: 增加解碼器容量，以更精細的重建結果重新設定異常門檻
  B: 延長目前混合資料的訓練輪數，以更低的平均誤差設定門檻
  C: 增加相同磨耗故障的訓練筆數，以更多重建範例穩定訓練
  D: 整理代表性正常資料重訓，再以獨立正常與故障樣本驗證
answer: D
explanation:
  summary: 重建誤差反映模型是否熟悉訊號，不等同工程上的故障定義。
  correct: 模型若學會重建常見故障，故障就不一定呈現高誤差。以正常狀態作為參考時，應先整理訓練資料，使模型主要學習正常型態，再驗證故障能否被區分。即使採正常資料訓練，也要實測不同故障的辨識能力。
  wrong:
    A: 增加容量可能讓故障重建得更好，進一步縮小正常與故障的誤差差異。這沒有修正參考資料混入故障的原因。
    B: 降低混合資料的平均重建誤差，不表示正常與故障更容易區分。延長訓練仍會學習混入的故障型態。
    C: 增加同類故障範例，會強化模型對故障型態的熟悉程度，與建立正常狀態參考的目的不符。
