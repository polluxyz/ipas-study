stem: 某合約分類器原先一次處理 512 個詞，擬改成 4096 個詞以比較跨段條款。模型使用標準全域自注意力，明確儲存每個頭的完整注意力矩陣。團隊只按詞數比例規劃記憶體。若其他設定不變，下列判斷何者最正確？
options:
  A: 完整注意力只比較相鄰詞，主要增加的是固定視窗內的配對
  B: 完整注意力包含詞與詞的配對，矩陣大小隨詞數平方增長
  C: 同一組權重可供各詞共用，主要記憶體不受詞數變動影響
  D: 位置編碼已提供詞序，主要增加的是新增位置的參數儲存
answer: B
explanation:
  summary: 完整自注意力矩陣的兩個軸都隨序列長度增加。
  correct: 每個查詢位置都對全部鍵位置產生注意力分數，因此單一頭的矩陣有詞數乘以詞數個元素。只按詞數的線性比例估算，會低估這部分記憶體。分段或稀疏注意力可另行評估，但也要確認跨段條款的需求。
  wrong:
    A: 只比較鄰近詞是局部注意力的設計。本題使用全域自注意力，並非固定鄰近視窗。
    C: 共用參數不代表中間運算結果大小固定。注意力分數矩陣仍須按本次序列儲存。
    D: 位置編碼提供順序資訊，不會取消不同位置之間的注意力配對。主要矩陣仍有兩個隨詞數增加的軸。
