stem: 某會議資料集準備提供給外部研究團隊。公司已模糊影片人臉，並把逐字稿姓名換成代號；但錄音仍含員工自報姓名，影片也可看見姓名桌牌。若要評估去識別處理是否足夠，最適合採取哪項檢查？
options:
  A: 檢查逐字稿姓名替換率，以文字處理結果代表整批資料
  B: 檢查影片人臉模糊程度，以畫面處理結果代表整批資料
  C: 逐一檢查各模態的識別線索，再測試跨模態連結的風險
  D: 檢查傳輸檔案的加密強度，以傳輸保護代表去識別效果
answer: C
explanation:
  summary: 多模態資料的識別風險須同時考慮各來源及其連結。
  correct: 姓名可能出現在聲音與桌牌，單獨處理文字及人臉並未移除這些線索。應檢查每種模態，並評估組合後能否連回個人。
  wrong:
    A: 文字姓名替換不能移除錄音中的自報姓名，也不能遮住影像中的桌牌；文字替換率無法代表整批風險。
    B: 人臉模糊處理的是臉部特徵，桌牌與聲音仍可辨識身分，因此只驗人臉不夠。
    D: 加密可降低傳輸途中遭讀取的風險；研究團隊解密使用後，資料內的識別線索仍然存在。
