stem: 某辨識服務採滾動更新。每筆請求最多需 8 秒，新副本已可正常接流量；舊副本卻一被替換就立即終止，導致原本處理到一半的請求失敗。若不改模型，最適合的更新調整為何？
options:
  A: 增加新副本的數量，讓舊副本維持被替換時立即終止
  B: 先停止舊副本接新請求，待既有請求完成或寬限到期再終止
  C: 將舊副本的終止寬限延長為 8 秒，寬限期間仍持續接收新請求
  D: 延長客戶端的等待時間，讓舊副本維持被替換時立即終止
answer: B
explanation:
  summary: 更新時須分開處理停止接流量與結束既有請求。
  correct: 新副本就緒解決接班問題，舊副本仍需要處理中的請求收尾。停止接收新請求後保留適當寬限，並涵蓋正常最長處理時間，可減少更新中被強制中斷的請求。
  wrong:
    A: 新副本數量不會接續舊程序執行到一半的請求，立即終止仍會造成中斷。
    C: 寬限期間仍接新請求，到期時又會有處理到一半的請求被中斷；須先停止接新請求，既有請求才能收尾。
    D: 客戶端多等一段時間也無法讓已被終止的伺服器完成請求，須調整伺服器收尾流程。
