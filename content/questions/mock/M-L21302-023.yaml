stem: 某辨識服務採滾動更新。每筆請求平均 3 秒、最多 8 秒，新副本已可正常接流量；舊副本卻一被替換就立即終止，導致原本處理到一半的請求失敗。若不改模型，最適合的更新調整為何？
options:
  A: 先將舊副本移出流量入口，移出後立刻終止，由新副本處理後續請求
  B: 先停止舊副本接新請求，待既有請求完成或 10 秒寬限到期再終止
  C: 將舊副本的終止寬限延長為 8 秒，寬限期間仍持續接收新請求
  D: 先停止舊副本接新請求，等待平均處理時間 3 秒後再終止
answer: B
explanation:
  summary: 更新時須分開處理停止接流量與結束既有請求。
  correct: 新副本就緒解決接班問題，舊副本仍要讓處理中的請求收尾。停止接收新請求後，10 秒寬限涵蓋最長 8 秒的處理時間；請求提前完成時也可提前終止。
  wrong:
    A: 移出後不再有新請求進入舊副本，但處理中的請求會隨程序終止而失敗。
    C: 寬限期間仍接新請求，到期時又會有處理到一半的請求被中斷；須先停止接新請求，既有請求才能收尾。
    D: 3 秒只是平均值。超過 3 秒的請求最長要 8 秒才完成，會在終止時被中斷。
