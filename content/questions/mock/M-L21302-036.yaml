stem: 某邊緣預警模型在雲端訓練時，使用本機感測值及雲端即時取得的氣象欄位。現場模擬發現，斷網後氣象欄位持續沿用過期值，誤報明顯增加。本機有足夠算力，團隊正在設計可斷網運作的下一版。最適合的模型與部署調整為何？
options:
  A: 將現有模型量化後放到本機，沿用相同的氣象欄位更新方式
  B: 將雲端氣象查詢改為更長的快取期限，維持現有模型的驗證結果
  C: 為現有本機模型增加執行副本，維持相同的特徵取得與輸入規則
  D: 建立並驗證不依賴即時雲端欄位的本機版本，另驗證切換條件
answer: D
explanation:
  summary: 本機推論的可用性也取決於模型輸入是否能在本機取得。
  correct: 算力在本機不代表輸入也可離線取得。下一版須以可取得的本機特徵重新建模或設計已驗證的替代輸入，並確認斷網切換時的品質與安全條件。
  wrong:
    A: 量化減少運算成本，不能產生斷網時缺少的新氣象資訊，也未解決過期輸入造成的誤報。
    B: 延長快取只讓舊氣象資料使用更久，原驗證結果不能證明在長時間過期輸入下仍可靠。
    C: 增加副本提高服務冗餘，副本仍使用同樣的過期輸入，無法修正共同的資料相依問題。
