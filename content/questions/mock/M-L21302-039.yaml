stem: 某分貨模型新版準確率較高，輸出格式也通過檢查。但類別代碼 2 在新版表示「送人工檢驗」，舊版則表示「直接出貨」，下游分貨程式仍依舊版解讀。大量發布前，哪項驗證最能攔截這種整合錯誤？
options:
  A: 檢查回應欄位的資料型別與必填條件，再比對模型服務的成功率
  B: 比較新舊模型在相同測試資料的準確率，再檢查模型權重版本
  C: 以代表輸入驗證類別的語意映射，核對下游實際採取的業務動作
  D: 在影子環境記錄各類別代碼的頻率，再比對輸出欄位的位元組數
answer: C
explanation:
  summary: 輸出格式相容不代表下游理解的業務語意相容。
  correct: 同一數字的業務意義已改變，模型分數及格式檢查都可能通過。驗證從代表輸入、類別映射到下游動作的完整鏈路，才能發現錯誤出貨。
  wrong:
    A: 代碼仍是合法數字，欄位檢查及請求成功率可維持正常，卻無法確認動作是否符合新語意。
    B: 準確率比較回答模型是否正確分類，權重版本回答載入哪個模型，兩者均未驗證下游如何解讀代碼。
    D: 輸出頻率及大小可觀察分布或格式變化，不能確定代碼與真實業務動作的對應是否正確。
