stem: 某 AI 訂單流程依序預留庫存、扣款、建立配送。紀錄已確認前兩步成功，配送系統則明確拒絕此地址，重試也無法完成。公司規則要求取消整筆訂單，庫存與付款系統都提供可追蹤的釋放及退款操作。最適合採取哪項復原安排？
options:
  A: 清除流程的成功紀錄，再從預留庫存重新執行完整訂單以取得一致結果
  B: 只將訂單畫面改為取消，讓成功扣款與庫存預留留待下次對帳時處理
  C: 依成功步驟紀錄執行退款及釋放庫存，追蹤各項補償結果直到完成
  D: 將配送錯誤改為成功狀態，再把已扣款且已預留的訂單交給後續流程
answer: C
explanation:
  summary: 跨系統流程部分完成時，取消業務需要補償已成功的副作用。
  correct: 補償交易（用後續動作抵銷已完成的業務效果）屬補充。原扣款與預留已生效，取消狀態不會自動撤銷這些效果。應依紀錄分別退款及釋放，保存各項結果；補償若失敗，仍須可重試或轉人工處理。不能刪掉紀錄後盲目重做成功步驟。參考 [Microsoft 補償交易模式](https://learn.microsoft.com/en-us/azure/architecture/patterns/compensating-transaction)。
  wrong:
    A: 清除成功紀錄會失去副作用的依據，重新執行還可能再次扣款或預留庫存。
    B: 顯示取消不會改變付款與庫存系統的既有狀態，未完成本次取消所需的復原。
    D: 地址已被明確拒絕，修改狀態不能建立配送，也不符合取消訂單的業務規則。
