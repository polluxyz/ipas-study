stem: |
  某製造商有 5 萬張檢測照片與 5 萬筆產品出貨後的故障結果，計畫用照片預測產品風險。照片以拍攝批次命名，故障紀錄使用產品序號，兩套編號沒有現成對照。兩邊各自的欄位都完整。確認監督式建模可行性時，最適合先做什麼？
options:
  A: 依兩邊資料列的先後順序配對，保留相同數量的完整樣本
  B: 將照片與故障紀錄各自隨機排序，利用大量資料平均配對誤差
  C: 查證可追溯的編號對照，抽樣核對照片與產品結果的關聯
  D: 先依故障比例平衡兩邊筆數，再以批次中的位置完成配對
answer: C
explanation:
  summary: 跨來源資料要能可靠連結，才能建立有效的輸入與標籤配對。
  correct: 照片與出貨後故障結果必須對應同一產品或明確定義的追溯單位。先查證編號對照並抽樣核對，才能確認配對品質及實際可用樣本量。
  wrong:
    A: 筆數相同與列順序不能證明屬於同一產品。未經查證的配對可能把其他產品的結果當成標籤。
    B: 隨機排序會破壞可能存在的關聯，不能利用大樣本平均得到正確的個別產品標籤。
    D: 平衡故障比例處理的是類別分布，無法建立編號關係。批次中的位置也未被證明可對應產品序號。
