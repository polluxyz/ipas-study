stem: 某材質辨識專案只有 900 張標註影像。團隊可選擇規模相同的兩個預訓練骨幹：甲學過相近的工業紋理，乙主要學過自然場景。兩者皆能在目標硬體運作。若第一輪實驗只能比較一個骨幹與從零訓練的基準，最適合先比較哪項方案？
options:
  A: 以甲的預訓練表示建立分類器，與從零訓練基準比較
  B: 以乙的預訓練表示建立分類器，依預訓練總樣本數選用
  C: 將甲乙的預訓練權重全部重新隨機化，再訓練分類器
  D: 把甲乙的同位置權重直接取平均，再訓練分類器
answer: A
explanation:
  summary: 有限標註下，應優先檢驗與目標領域相關的既有表示。
  correct: 甲的預訓練內容較接近材質紋理，較有理由優先檢驗其特徵能否轉用。這是安排實驗的依據，不是直接宣告甲較準；仍需和基準在共同驗證資料上比較。
  wrong:
    B: 單看來源樣本數不能判斷表示是否適合材質任務，題目也未提供乙在目標領域較好的證據。
    C: 重新隨機化會丟棄預訓練所學的表示，無法檢驗重用相近紋理知識的價值。
    D: 即使規模相同，不同模型內的特徵通道也未必對齊，直接平均權重沒有保留有用表示的保證。
