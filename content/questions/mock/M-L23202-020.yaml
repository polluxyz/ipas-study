stem: 某工程師以標準逐群擴展的 DBSCAN 分析感測點。固定鄰域半徑與最少點數後，甲、乙兩組核心點之間沒有核心點相連路徑。非核心點 P 同時落在兩組某個核心點的鄰域內。甲群先訪問 P。下列結果何者最正確？
options:
  A: 甲、乙合併成 1 群，P 留在合併後的群組內
  B: 甲、乙保留為 2 群，P 同時列在兩群成員內
  C: 甲、乙保留為 2 群，P 列在先到達的甲群內
  D: 甲、乙保留為 2 群，P 列在群組外的雜訊內
answer: C
explanation:
  summary: 判斷共享邊界點是否能連接兩組核心點。
  correct: P 可由甲群核心點到達，因此可列為甲群的邊界點。非核心點不負責向外擴展密度連接，不能僅因同時靠近兩群就合併兩組核心點。標準逐群實作會將這種共享邊界點留給先到達的群。
  wrong:
    A: 能讓核心群相連的路徑須由核心點延展。共享的非核心點不會把兩個核心群接成同一群。
    B: 標準 DBSCAN 為每個已分群樣本給 1 個群標籤，不採同一樣本同屬兩群的軟分群方式。
    D: P 雖不是核心點，卻在核心點的鄰域內，符合邊界點條件，不會只因自身密度不足就列為雜訊。
