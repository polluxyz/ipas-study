codes: [L23302]
concepts: [loss-function-selection, cost-sensitive-loss]
stem: |
  某物流模型預測次日所需車數。內部成本規則是：每少估 1 輛損失 4 單位，每多估 1 輛損失 1 單位，差額成本線性累加。團隊可選不同迴歸損失，希望訓練目標直接對齊此成本。最適合優先採用哪項設計？
options:
  A: "採對稱絕對誤差損失，將每筆訓練樣本的損失乘以 4"
  B: "採對稱平方誤差損失，讓較大差額在兩方向都受較重處罰"
  C: "採方向不同的線性損失，少估差額權重為 4、多估為 1"
  D: "採方向不同的線性損失，少估差額權重為 1、多估為 4"
answer: C
explanation:
  summary: "依高估與低估的不同成本設計迴歸目標。"
  correct: "題設成本由誤差方向與差額共同決定。少估差額乘以 4、多估乘以 1 的分段線性損失，才直接反映每筆預測造成的成本。"
  wrong:
    A: "兩方向都乘以相同常數，只改變整體損失尺度，沒有反映少估比多估更昂貴。"
    B: "平方誤差對兩方向仍對稱，且對大誤差額外加重，與題設線性且不對稱的成本不一致。"
    D: "這組權重使多估比少估更昂貴，方向與題設的成本規則相反。"
guide_refs: [guide-3:4-4, guide-3:5-23]
author: codex
review:
  status: verified
  blind_answer: C
