stem: |
  某客服分類系統有 3 類問題，占比分別為 90%、8%、2%。驗收規則要求每一類的辨識品質在總分中具有相同權重，不隨案件數改變。團隊已為每類計算 F1 分數。下列彙總方式何者最符合規則？
options:
  A: 先依各類案件占比加權 F1，再以加權總和評估分類器
  B: 先合併各類的正確與錯誤筆數，再計算整體的微平均 F1
  C: 先選出案件數最多的類別，再以該類 F1 代表主要服務品質
  D: 先計算每類 F1，再將 3 個分數等權平均作為宏平均 F1
answer: D
explanation:
  summary: 依類別等權要求選擇多類別指標的彙總方式。
  correct: 宏平均讓每類的 F1 各占相同權重，符合題幹的驗收規則。它可讓少量類別的低分直接影響總分，不因該類案件少而降低其權重。
  wrong:
    A: 按案件占比加權會讓 90% 的大類主導總分，與類別等權要求不同。
    B: 微平均先合併筆數，樣本多的類別影響較大，不是各類等權平均。
    C: 只評估大類會漏掉其餘 2 類，不符合每類都納入的規則。
