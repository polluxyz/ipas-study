stem: 某模型以批次正規化處理中間特徵，每批 32 筆。訓練樣本彼此獨立，卻依機台排序，常整批來自同一機台；不同機台的特徵均值差異明顯。若希望每批統計更能代表整體訓練資料，最適合優先調整什麼？
options:
  A: 打散跨機台的獨立樣本，再組成新的訓練批次
  B: 重複取用同機台的樣本，再組成新的訓練批次
  C: 減少每批使用的樣本數，保留原本的機台排序
  D: 增加後段分類層的單元，保留原本的批次組成
answer: A
explanation:
  summary: 批次組成會影響批次正規化使用的統計。
  correct: 題幹已排除必須維持時間次序的情況。混合不同機台可降低單一機台對整批均值與變異的主導，較符合建立整體代表性統計的目標。
  wrong:
    B: 重複相同機台的樣本仍只有該機台的分布，不能增加對其他機台的代表性。
    C: 縮小同機台批次沒有增加分布多樣性，還可能讓當批統計的估計更不穩。
    D: 增加分類層容量不會改變批次樣本來自哪些機台，因此沒有改善統計的代表性。
