stem: 某廠有 300 台邊緣裝置。新版模型改用新的影像正規化方式，但部分裝置更新中途斷線，留下新版權重與舊版前處理，造成辨識異常。若要避免再次出現這種組合，最適合的更新設計為何？
options:
  A: 先將權重廣播到各裝置，隔天再依裝置回報更新前處理設定
  B: 將權重與前處理組成版本套件，完整驗證後才一起啟用
  C: 只比對新版權重檔大小，檔案大小吻合後立即切換推論程序
  D: 先在雲端量測新版分數，裝置端持續沿用各自原有的前處理
answer: B
explanation:
  summary: 邊緣更新須維持模型與前處理的版本相容。
  correct: 權重與前處理共同決定輸入意義。以相容版本套件交付，在裝置確認完整且試推論通過後一起切換，可避免中途斷線導致新舊組件混用；切換前可維持既有可用套件。
  wrong:
    A: 分兩階段且沒有一起啟用的機制，仍會出現新版權重搭配舊前處理的期間。
    C: 檔案大小不能證明前處理相容或模型可正常執行，沒有處理組件混版原因。
    D: 雲端分數無法保證裝置用舊前處理仍能正確推論，也沒有處理中斷更新的一致性。
