stem: 某企業比較同一種差分隱私計數機制的兩組設定。兩者採相同的個人保護單位、資料及查詢，只有 ε 不同。ε=0.3 的報表誤差較大，但仍符合業務容忍範圍；ε=1.2 的誤差較小。主管希望優先加強個人隱私保證，最適合採哪項判斷？
options:
  A: 採 ε=1.2，較高預算代表更嚴格的隱私限制
  B: 採 ε=0.3，較低預算代表更嚴格的隱私限制
  C: 採 ε=1.2，較小誤差代表個人資訊較難被推知
  D: 採 ε=0.3，較大誤差代表資料已不需存取控制
answer: B
explanation:
  summary: 在其他條件一致時，較小的 ε 對應較強的差分隱私保證。
  correct: ε 限制個人加入或退出資料時，輸出分布可以改變的程度。其他條件相同時，較小的 ε 給出較嚴格限制；本例較大報表誤差仍可接受，因此符合優先強化隱私的目標。
  wrong:
    A: 較高 ε 容許更大的隱私損失，並不是更嚴格的隱私限制。
    C: 較小統計誤差表示效用可能較好，不表示隱私保證較強；本例選模目標是優先加強隱私。
    D: 差分隱私保護發布機制，不能取代原始資料的權限限制。報表誤差大也不會自動消除未授權存取的風險。
