stem: 某新聞系統已正確框出一個公司全名與一個簡稱，並標成組織。編輯確認這兩個名稱都指向公司資料庫的編號 C17。系統目前仍把兩個名稱算成兩家公司。最適合補上哪項處理？
options:
  A: 把名稱連結到公司實體編號後去重
  B: 把組織名稱重新切成更細的子詞
  C: 把每個組織名稱重新標註為專有名詞
  D: 把共同出現在同篇報導的名稱分為一群
answer: A
explanation:
  summary: 辨識文字實體與對應同一資料庫實體是不同工作。
  correct: 命名實體辨識已完成邊界與類型判定。現在缺少的是把別名對到同一個實體編號的連結步驟，才能按公司而非按字串去重。
  wrong:
    B: 切詞會改變輸入單位，但不建立名稱與 C17 的對應關係，無法據此合併別名。
    C: 詞性標註只描述語法角色。兩者同為專有名詞不代表指向同一家公司。
    D: 共現分群可找出常一起出現的公司，但同篇報導也可能談競爭者，不能用共現取代實體身分。
