stem: 某團隊使用線性分類器預測包裹是否需改道。運送方式有「空運、海運、陸運」3 類，沒有自然高低順序。工程師原本將三類編成 1、2、3，再當成單一數值欄。若要讓模型分別估計各運送方式的影響，哪項調整最適合？
options:
  A: 將類別整數標準化，再以同一欄估計運送方式的影響
  B: 依樣本數替三類編號，再以同一欄估計運送方式的影響
  C: 重新排列類別的整數，再以同一欄估計運送方式的影響
  D: 採用獨熱編碼並處理冗餘，分別估計各類別的影響
answer: D
explanation:
  summary: 無序類別不宜在一般線性模型中當作等距數值。
  correct: 單一數值係數會把類別編號的差距當作可比較的數量。獨熱編碼可讓模型對各運送方式使用不同係數；搭配截距時可保留基準類別，處理冗餘欄位。
  wrong:
    A: 標準化只是改變數值尺度，仍會保留類別之間被人為指定的順序與等距關係。
    B: 依樣本數決定編號仍是單一數值欄，無法讓一般線性分類器分別估計三類的效果。
    C: 改變編號順序只是換一組人為順序，沒有解除單一線性係數對類別差距的限制。
