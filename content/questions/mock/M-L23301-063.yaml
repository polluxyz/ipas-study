stem: 某零售商把明顯右偏的購買金額做 Z 分數標準化，轉換後平均數為 0、標準差為 1。主管想把這兩個數字當成「金額已變成常態分布」的驗收證據。哪項判斷最正確？
options:
  A: 平均數為 0 就表示左右兩側的觀測數相同
  B: 中心與尺度已調整，仍需另外檢查分布形狀
  C: 標準差為 1 就表示每個金額出現的機率相同
  D: 金額轉成負值就表示已消除偏態與極端值
answer: B
explanation:
  summary: Z 分數標準化不保證資料呈常態分布。
  correct: 減去平均數再除以標準差只改變位置與尺度，不會自動消除右偏。常態分布的判斷還需要檢查形狀，不能只憑兩個摘要數字。指引 5-7 把 Z 分數標準化寫成轉為常態分布，這個說法需要校正：Z 分數只調整位置與尺度，偏態形狀不變。
  wrong:
    A: 平均數是數值總和的中心，不保證中心兩側樣本數相同；這也不是常態分布的充分條件。
    C: 標準差描述分散程度，不表示各金額等機率，更不表示常態分布。
    D: 負值代表低於平均數，偏態與相對極端程度仍可能保留。
