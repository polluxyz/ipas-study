stem: 某維修助理在 200 筆驗收問題中，必要文件大多能進入生成上下文，每個回答也都附有可開啟的文件連結。但抽查發現，答案聲稱「可帶電更換」，引用段落實際只說明斷電後的更換步驟。最適合新增哪項品質檢查？
options:
  A: 檢查每個連結能否開啟，並統計每個答案的引用數量
  B: 將答案拆成關鍵主張，核對引用是否支持各項操作條件
  C: 量測答案與問題的文字相似度，再統計回答是否切題
  D: 檢查檢索文件的排名，並提高必要文件進入上下文的比例
answer: B
explanation:
  summary: 引用存在不代表引用內容支持答案主張。
  correct: 本例缺陷在於生成的操作條件超出引用依據。將主張與證據逐項對照，特別核對前提、限制與例外，才能識別有連結但內容不受支持的答案。
  wrong:
    A: 連結可開啟與引用數量只證明來源可存取，不能證明帶電操作得到來源支持。
    C: 切題程度不等於證據忠實度。錯誤答案也可能使用與問題相同的術語而得到高相似度。
    D: 提升檢索召回有其作用，但必要內容已進入上下文時，仍須檢查生成是否正確使用那些內容。
