stem: 某客服助理回答「K81 型機器在本季的保養週期」。檢索找到 3 份來源：甲是前季正式公告，K81 每 8 週保養；乙是本季已生效的正式修訂，K81 每 6 週，並明文取代甲；丙是今天刊登但未核准的草案，K18 每 4 週。公司規則以適用機型且已生效的正式文件為準。應如何處理？
options:
  A: 採丙的 4 週，因為今天刊登的文件比本季公告更新，應優先反映最新內容
  B: 採乙的 6 週，因為機型及生效期間相符，且正式修訂已明文取代舊公告
  C: 採甲的 8 週，因為最早正式發布的規範具有優先效力，修訂僅提供參考
  D: 採 3 份文件週期的平均值，因為整合不同來源可降低單一文件錯誤風險
answer: B
explanation:
  summary: 矛盾證據須依適用範圍、生效狀態與取代關係判定。
  correct: 乙同時符合 K81、本季已生效及正式文件的條件，並已取代甲，應採 6 週並引用乙。丙雖較晚刊登，仍是未核准草案且機型不同。文件的刊登新舊不能取代適用性與效力檢查。
  wrong:
    A: 丙的刊登日期較新，但尚未生效且適用 K18，不能回答本題的 K81 現行週期。
    C: 乙已明文取代甲，沿用甲會把過期規則當成現行規則。
    D: 不同文件的效力與適用範圍不同，週期不是可用平均消除衝突的量測誤差。
