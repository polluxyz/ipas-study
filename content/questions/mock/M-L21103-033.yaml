stem: 某生成服務每批有 2,000 次請求。每次輸入 1,000 個詞元，產生 2 份各 200 個詞元的候選，最後只採用 1 份。假設輸入每千詞元 0.01 元、輸出每千詞元 0.03 元。每次輸入只計費 1 次，兩份候選皆計輸出費，沒有其他費用。整批費用為何？
options:
  A: 20 元
  B: 32 元
  C: 44 元
  D: 64 元
answer: C
explanation:
  summary: 多候選生成須計入全部已產生的輸出詞元。
  correct: C 的輸入費為 2,000×1,000÷1,000×0.01＝20 元；輸出費為 2,000×2×200÷1,000×0.03＝24 元，合計 44 元。是否採用候選不影響本題的輸出計費。
  wrong:
    A: 20 元只含輸入費，沒有計入兩份候選的輸出費。
    B: 32 元只計入每次採用的 1 份候選，漏掉另 1 份已生成候選的 12 元。
    D: 64 元把輸入費也隨 2 份候選計了 2 次；題目已指定每次輸入只計費 1 次。
