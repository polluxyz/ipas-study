stem: 某分類器訓練時有振動與溫度，但部署時只有溫度。固定測試集有 100 筆，所有溫度值完全相同，其中 60 筆正常、40 筆故障。只准使用溫度，且相同輸入須輸出相同類別。若不增加可用資訊，這 100 筆的最高準確率與架構判斷何者最正確？
options:
  A: 40%；把網路加深就能區分相同溫度的兩類。
  B: 60%；增加容量仍無法區分完全相同的輸入。
  C: 60%；增加容量後必能在這批資料達到 100%。
  D: 100%；沿用訓練時的容量便可推回遺失振動。
answer: B
explanation:
  summary: 相同可用輸入對應不同真值時，增加容量不能補回未觀測資訊。
  correct: 所有可用輸入相同，確定性的分類器只能對全部資料輸出同一類。選多數的正常類可答對 60 筆，準確率上限是 60%。提高容量不會新增可區分樣本的資訊。應評估可取得的新欄位，或按部署可用輸入重新設計並驗證模型。
  wrong:
    A: 應選多數類才能達最高準確率；加深模型也不會讓相同輸入自行變得可區分。
    C: 60% 是現有輸入限制下的上限，不是增加容量即可突破的欠擬合分數。
    D: 題目沒有任何可從溫度還原振動的資訊，不能保證推回遺失欄位。
