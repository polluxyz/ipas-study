stem: 某價格模型的訓練誤差與獨立驗證誤差都很高，增加相同分布的訓練樣本後仍沒有改善。已排除錯標、尺度錯誤與訓練未收斂。模型目前只有單一線性項。下一步最值得驗證什麼？
options:
  A: 再加強正則化，讓模型可使用的容量更小
  B: 加入有依據的非線性特徵或提高容量，檢查能否同時降低兩種誤差
  C: 只增加訓練樣本，容量與特徵完全不變
  D: 只選訓練誤差最低的版本，停止檢查驗證誤差
answer: B
explanation:
  summary: 容量與欠擬合。
  correct: 連訓練規律也未學好，且已排除資料與收斂問題，符合欠擬合線索。增加適當表示或容量後仍須以固定驗證規則比較。
  wrong:
    A: 限制更強通常不會解決本題已出現的擬合不足，可能讓訓練誤差更高。
    C: 題目已觀察同分布加量沒有改善，仍須檢查模型表示與容量限制。
    D: 選擇規則不能解決兩邊都高的誤差，也失去判定泛化改善的證據。
