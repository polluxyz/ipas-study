stem: 某問答系統災難復原演練只還原向量與近鄰索引。查詢可以回傳區塊識別碼，但區塊原文、文件版本與授權中繼資料沒有備份，導致無法產生可核對的回答。若要讓下次還原後能提供原有服務，最適合如何安排備份？
options:
  A: 增加近鄰索引的備份頻率，並為每份索引保留較多副本
  B: 保存一致版本的向量、區塊原文、來源對應與授權資料
  C: 保存索引的搜尋參數與效能基準，再據此調校還原環境
  D: 保存生成模型權重與回答提示，再重新匯入現有向量檔
answer: B
explanation:
  summary: 可復原的知識服務需要向量及其相互對應的內容與治理資料。
  correct: 向量支援搜尋，原文支援生成，來源版本支援核對，授權資料限制可讀範圍。這些資料須有一致的對應與版本，才能重建可用且授權正確的服務。
  wrong:
    A: 更多索引副本仍缺少原文與授權資料，無法解決區塊識別碼找不到對應內容的問題。
    C: 搜尋參數與基準可支援效能調校，但沒有保存區塊原文及授權對應，仍無法組成可核對的回答。
    D: 生成模型與提示不包含本次知識庫的原文及授權對應，不能從缺少內容的向量檔恢復這些資料。
