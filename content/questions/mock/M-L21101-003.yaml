stem: 某新聞平台有 8,000 則財經與農業短訊。「蘋果公布新款筆電」與「蘋果收成受到寒流影響」都把「蘋果」切成同一個詞。靜態詞向量對同一詞固定查表。團隊想讓該詞的表示利用當次完整句子，應優先比較哪個方案？
options:
  A: 把同一份靜態詞向量由 100 維補零到 300 維
  B: 提高詞頻統計精度，讓同一詞在兩句中共享更多計次
  C: 刪除目標詞周圍的文字，只保留「蘋果」送入模型
  D: 用雙向語境型模型產生詞位表示，並驗證領域資料的效果
answer: D
explanation:
  summary: 語境型表示與多義詞。
  correct: 雙向語境型表示能納入該詞前後的句子線索。它提供區分公司與水果的資訊，但仍需在目標資料驗證，不能保證每句都判對。
  wrong:
    A: 補零不增加上下文資訊。同一個詞在兩句中仍會得到相同的查表向量。
    B: 共用詞頻不能表示當次句子的不同用法，沒有解決固定查表的限制。
    C: 移除周圍文字會丟失本題需要的消歧線索，無法利用完整句子。
