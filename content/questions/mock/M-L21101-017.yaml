stem: 某詞袋分類器已固定詞彙表與輸入欄位。新一週文本經同一斷詞器產生 1,000 次詞出現，其中 60 次不在詞彙表內；這 60 次只來自 2 種新詞。團隊定義未知詞比例為「未收錄的詞出現次數／全部詞出現次數」。尚未確認新詞是否影響分類，哪項報告與處置最適合？
options:
  A: 報告未知詞比例 6%，檢查相關錯例後再決定是否更新整套模型
  B: 報告未知詞比例 0.2%，檢查相關錯例後再決定是否更新整套模型
  C: 報告未知詞比例 6%，直接替現有分類器追加 2 個新詞輸入欄位
  D: 報告未知詞比例 0%，因為未收錄詞不會進入現有分類器的向量
answer: A
explanation:
  summary: 未知詞監測要依約定的計數單位，並與既有模型輸入契約分開判斷。
  correct: 未知詞比例是 60／1,000＝6%，不是新詞種類數的比例。先檢查未知詞集中在哪些文本及錯誤，再決定是否更新詞彙表與配套模型。忽略新詞不代表新詞不存在，也不能只擴充欄位卻沿用原分類權重。
  wrong:
    B: 2 是新詞種類數，分母卻是出現次數，混用計數單位會低估實際覆蓋缺口。
    C: 現有分類器已固定輸入欄位；新增詞彙需同步處理表示與權重，不能直接追加欄位。
    D: 未知詞未進入向量是表示方法的行為，不能據此把文本中的未知詞出現次數記為零。
