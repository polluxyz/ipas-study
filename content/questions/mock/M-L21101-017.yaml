stem: 某分類專案有 8,000 封訓練郵件與 2,000 封驗證郵件。工程師先合併兩組郵件建立詞彙表與逆文件頻率，再只用訓練標籤擬合分類器。目標是模擬未見郵件的表現，最適合如何修正？
options:
  A: 只用訓練郵件建立詞彙表與逆文件頻率，再轉換驗證郵件
  B: 保留合併後的逆文件頻率，只從分類器移除驗證郵件標籤
  C: 對兩組郵件各自建立逆文件頻率，再直接比較分類器表現
  D: 只用驗證郵件建立詞彙表，讓評估更貼近即將處理的資料
answer: A
explanation:
  summary: 評估未見文字時，特徵轉換的統計也必須只由訓練資料擬合。
  correct: 詞彙表與逆文件頻率都會從文本學得統計。先看驗證文本再建立這些統計，已讓驗證資訊參與建模。應在訓練集擬合轉換，再用同一轉換處理驗證集。
  wrong:
    B: 題目本來就未使用驗證標籤，但無標籤的詞彙分布仍會洩漏評估資料的資訊。
    C: 兩組各自擬合會改變特徵欄位或尺度，驗證輸入不再沿用分類器訓練時的表示。
    D: 以驗證文本決定詞彙表仍讓評估資料參與建模，也不能模擬真正未見的郵件。
