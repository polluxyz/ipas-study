stem: 某聲音模型要標記 6 種可共存事件。每段只完成其中 2 種事件的正負標註，其他 4 種是未知，不能視為不存在。團隊希望每個已標註的「樣本、事件」配對等權。最適合如何計算訓練損失？
options:
  A: 把未知事件填成 0，對 6 種事件的二元交叉熵取平均
  B: 把已知正事件轉成分布，對 6 種事件計算類別交叉熵
  C: 把未知事件填成 0.5，對 6 種事件計算二元交叉熵
  D: 僅加總已標註配對的二元交叉熵，再除以已標註配對數
answer: D
explanation:
  summary: 未知標籤與負標籤不同，損失須明確排除未知配對。
  correct: 遮罩應同時用於損失加總與有效配對計數。這樣只用已知正負標註訓練，且每個已知配對具有相同權重。
  wrong:
    A: 填成 0 會把未知事件當成負例，讓模型對尚未確認的事件學習負向訊號。
    B: 事件可同時發生，不能以互斥類別分布取代各事件的正負判斷。
    C: 填成 0.5 會要求未知事件的機率靠近 0.5，額外引入並未標註的訓練目標。
