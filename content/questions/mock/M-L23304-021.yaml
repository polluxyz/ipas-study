stem: 某工程師原計畫每完成 2 輪才把學習率減半，每輪有 3 個批次。下列 StepLR 卻放在每批更新後。完成第 1 輪後的學習率，以及符合原計畫的呼叫位置，何者最正確？
code: |
  import torch
  w = torch.nn.Parameter(torch.tensor(1.0))
  opt = torch.optim.SGD([w], lr=0.1)
  sched = torch.optim.lr_scheduler.StepLR(opt, step_size=2, gamma=0.5)
  for batch in range(3):
      opt.zero_grad()
      w.square().backward()
      opt.step()
      sched.step()
  print(round(opt.param_groups[0]['lr'], 4))
code_lang: python
options:
  A: 0.1；維持每批更新後呼叫 sched.step()
  B: 0.05；改為每輪全部批次更新後呼叫 sched.step()
  C: 0.025；改為每輪全部批次更新後呼叫 sched.step()
  D: 0.0125；維持每批更新後呼叫 sched.step()
answer: B
explanation:
  summary: 排程計數的時間單位由 step 的呼叫位置決定。
  correct: 初始 0.1，3 次排程步進只在第 2 次減半，結果為 0.05。改成每輪呼叫 1 次，step_size=2 才代表 2 輪。
  wrong:
    A: 此程式完成 3 次排程步進，已在第 2 次減半，並非維持 0.1。每批呼叫也不符合每 2 輪的計畫。
    C: 0.025 需完成 4 次步進才會出現；本例只有 3 次。呼叫位置的修正本身正確。
    D: 0.0125 對應每次都減半的 3 次結果，但 step_size=2 並非每次減半。
