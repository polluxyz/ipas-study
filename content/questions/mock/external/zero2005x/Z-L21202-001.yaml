stem: 某銀行在貸款核准當日，預測客戶未來 6 個月是否違約。離線測試 AUC高達 0.995，團隊十分振奮。經檢視特徵清單，其中包含「催收通知發送次數」與「帳戶凍結狀態」。這 2 個欄位都在 6 個月預測期限結束、確認客戶違約後才首次記錄，核准當日無法取得。下列判斷何者最為適當？
options:
  A: 指標優異代表特徵工程成功，應盡快上線
  B: 應再增加更多特徵以進一步提升 AUC
  C: 剔除違約後產生的特徵，按預測時點重新評估
  D: AUC過高代表資料量不足，應增加樣本數
answer: C
explanation:
  summary: 預測當下不可取得的結果資訊不能當特徵。
  correct: 這 2 個欄位都在預測期限結束、確認違約後才記錄，核准當日無法取得。模型使用這些欄位等於讀到事後結果，造成資料洩漏。應剔除這些特徵，再用核准當日可取得的資料重新訓練與評估；0.995 的 AUC 不能代表實際預測能力。
  wrong:
    A: 極高 AUC 也可能由不合法的預測資訊造成，不能單憑分數立即放行。
    B: 這 2 個欄位已確認屬於事後資訊，增加特徵無法消除既有的資料洩漏。
    D: 資料量不足不會必然造成 AUC 偏高；增加樣本也不能直接回答欄位是否含事後資訊。
