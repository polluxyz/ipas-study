stem: 某電商團隊進行「商品點擊率（CTR）預測」建模，特徵中包含「商品細分類別」（共 500
  個類別，屬高基數類別特徵）。初階工程師在資料切分前，直接以全體資料計算每個類別的目標點擊率平均值，作為新特徵取代原始類別（即全域目標編碼 Target
  Encoding），再切分訓練集與測試集。模型在離線驗證時表現驚人，上線推論時效果卻嚴重雪崩。造成此現象的核心原因與標準處置為何？
options:
  A: 梯度提升樹本質上無法支援連續型數值特徵，應改回 One-Hot 編碼
  B: 500 個類別基數太低，必須收集超過 10,000 個類別才能發揮目標編碼效果
  C: 應將商品類別直接按英文字母順序以 1 到 500 連續整數編碼，此為完全無偏之做法
  D: 先切分，訓練資料用折外目標編碼，並加入平滑與適量雜訊
answer: D
explanation:
  summary: 目標編碼不能看到待評估資料的標籤。
  correct: 全資料類別均值含測試標籤，造成資訊洩漏。應先切測試集；訓練列用其他訓練折估計編碼，測試列只用訓練集映射。平滑可降低稀有類別估值的不穩定。
  wrong:
    A: 提升樹可以用連續數值切分，問題不是數值型態，換回獨熱編碼也不會證明原流程正確。
    B: 類別數多寡沒有移除測試標籤流入的問題；增加類別還可能加劇小樣本估值波動。
    C: 任意整數會引入沒有實際意義的順序，並非完全無偏的替代方案。
