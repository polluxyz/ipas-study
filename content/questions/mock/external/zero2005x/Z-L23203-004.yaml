stem: 輸入形狀為 (28,28,1)，第一層為 Conv2D(`filters=32`, `kernel_size`=3, `padding='same'`)，第二層為MaxPooling2D(`pool_size=2`)。關於這兩層之敘述，下列何者錯誤？
options:
  A: 卷積層輸出形狀為 (28,28,32)
  B: 卷積層的權重數為 3×3×1×32 = 288，加上 32個偏置
  C: 池化層輸出形狀為 (14,14,32)
  D: 池化層具有可訓練參數，其數量隨`pool_size`增加
answer: D
explanation:
  summary: 池化層通常只有固定運算，沒有需要學習的權重。
  correct: 本題選錯誤敘述。一般最大池化只取區域最大值，不因池大小增加而產生訓練參數。
  wrong:
    A: 步幅預設為 1 且使用 same，卷積輸出為 (28,28,32)。
    B: 每個濾波器有 9 個權重與 1 個偏置，共 320 個參數。
    C: 預設以 2 為池化步幅，空間邊長減半，通道數仍是 32。
