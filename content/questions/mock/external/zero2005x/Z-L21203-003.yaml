stem: 關於我國《人工智慧風險分類框架》v1.0，下列敘述何者錯誤？
options:
  A: 該框架由數位發展部依《人工智慧基本法》第 16條訂定，性質為參考框架
  B: 該框架適用於所有 AI應用，包括軍事相關之 AI應用，且對民間企業具直接法律拘束力
  C: 框架依序盤點應用情境、識別風險、評估風險與應對風險；各機關可按評估結果檢視既有措施及管理規範
  D: 風險類型表彙整已知之 20項風險子類型，並區分為三大類
answer: B
explanation:
  summary: 框架的用途與法律性質要分開判讀。
  correct: 題目問錯誤敘述。框架排除軍事用途，也不是直接對所有企業設義務的法規命令，B 同時誤述適用範圍與效力。
  wrong:
    A: 主管機關依基本法第 16 條推動框架，供各業管理規範依循；對產業亦具有參考作用，此項基本配對正確。
    C: 先確認有哪些應用，再找風險、評估影響並安排應對，符合框架的四個操作階段。
    D: 框架表 1 分成 A、B、C 三類，附錄說明依 20 個子類型填寫評估表，並非固定不變的封閉清單。
