stem: 訓練集有 50,000筆樣本，批次大小設為 128，訓練 10個 epoch（不丟棄最後一批）。總共進行多少次參數更新？
options:
  A: 3,900
  B: 3,910
  C: "390"
  D: "391"
answer: B
explanation:
  summary: 不足一批仍更新時，先對每輪批數向上取整。
  correct: 50000/128=390.625，每輪有 391 批；10 輪合計 3910 次更新。
  wrong:
    A: 3900 相當於每輪丟棄最後 80 筆，與題意不符。
    C: 390 只計完整批次，且漏乘 10 輪。
    D: 391 是單輪更新次數，還要乘以 10。
