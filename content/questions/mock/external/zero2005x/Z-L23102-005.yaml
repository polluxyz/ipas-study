stem: 非負矩陣分解（NMF）將資料矩陣 X 近似分解為 X ≈ WH，並要求 X ≥ 0、W ≥ 0、H ≥ 0。關於「≥ 0」的意義，下列何者正確？
options:
  A: 代表矩陣的行列式大於或等於 0
  B: 代表矩陣內每一個元素都大於或等於 0
  C: 代表矩陣所有元素的總和大於或等於 0
  D: 代表矩陣的所有特徵值都大於或等於 0
answer: B
explanation:
  summary: 非負矩陣的限制逐一施加在每個元素。
  correct: X、W、H 的每一格都不能小於 0。這項限制不允許靠正負元素相互抵銷來重建資料。
  wrong:
    A: 行列式是方陣的整體數值，不能代替每個元素的非負限制。
    C: 總和為正的矩陣仍可能包含負元素。
    D: 特徵值非負與逐元素非負是不同條件。
