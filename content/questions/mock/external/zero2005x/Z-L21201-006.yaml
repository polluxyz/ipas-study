stem: 某連鎖零售企業評估導入「生成式 AI 智能客服助手」以分擔第一線諮詢負荷。專案小組向董事會提報三年期總持有成本（TCO）時，僅編列了「雲端大語言模型 API 呼叫費 150 萬元」與「初始系統串接開發費 150 萬元」，合計 300 萬元。評審委員會指出其 TCO 評估有重大結構性疏漏。下列何者為 AI 導入專案中最常被低估且應優先補列的關鍵成本？
options:
  A: 將初始串接費按每年150萬元估列，補足三年內的系統整合成本
  B: 按自建推論伺服器估列設備折舊，補足雲端API服務的硬體成本
  C: 補列知識庫更新、人工抽檢、提示迭代、漂移監控與組織調整成本
  D: 將三年API費按每次呼叫拆算後再加總，另列為模型推論運算成本
answer: C
explanation:
  summary: 總持有成本要包含持續維運與人力。
  correct: 知識更新、品質覆核、提示迭代及監控都會持續用到人力。只算呼叫與串接費，會低估三年持有成本。
  wrong:
    A: 題目已將150萬元列為初始串接費，不能在沒有年度開發需求的證據下每年重列同額。一次性費用與持續維運費須分開估計。
    B: 本案採雲端 API，未規劃自建推論設備，服務商的硬體支出已反映於服務價格。自行估列一套未採購伺服器的折舊，無法補上本案的維運人力缺口。
    D: 原預算已含三年 API 呼叫費。按呼叫次數拆算可驗證估算，但再把同筆費用加回總額會重複計算，並未補列持續維運工作。
