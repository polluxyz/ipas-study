stem: 某連鎖零售企業評估導入「生成式 AI 智能客服助手」以分擔第一線諮詢負荷。專案小組向董事會提報三年期總持有成本（TCO）時，僅編列了「雲端大語言模型 API 呼叫費 150
  萬元」與「初始系統串接開發費 150 萬元」，合計 300 萬元。評審委員會指出其 TCO 評估有重大結構性疏漏。下列何者為 AI 導入專案中最常被低估且應優先補列的關鍵成本？
options:
  A: 全面廢除原有客服系統所需支付的違約懲罰性賠償金
  B: 向目的事業主管機關繳納之法定 AI 演算法專利註冊保證金
  C: 補列知識庫更新、人工抽檢、提示迭代、漂移監控與組織調整成本
  D: 機房散熱電費，因為模型推論必然導致全公司用電量呈百倍暴增
answer: C
explanation:
  summary: 總持有成本要包含持續維運與人力。
  correct: 知識更新、品質覆核、提示迭代及監控都會持續用到人力。只算呼叫與串接費，會低估三年持有成本。
  wrong:
    A: 導入客服助手不代表必須廢除舊系統，題目也未提供解約條款，不能視為必然成本。
    B: 題目沒有這種法定保證金的依據；成本表不能把不存在或無法證實的費用當成必要項。
    D: 本例用雲端 API，未提供全公司用電百倍增加的根據，不能把該假設當成最主要缺漏。
