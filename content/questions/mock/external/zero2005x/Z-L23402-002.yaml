stem: 關於公平性指標之敘述，下列何者最為正確？
options:
  A: 公平性的定義與優先順序都可由最佳化演算法自動判定，組織不必另外考慮應用脈絡、價值取捨或記錄理由
  B: 只要模型準確率夠高，各種公平性指標自然都會滿足
  C: 除非群體基率相同或模型完美，均等賠率與預測值均等不能同時滿足；組織應擇主要目標並記錄理由
  D: 統計均等是唯一正確的公平性定義，其餘皆不應採用
answer: C
explanation:
  summary: 公平性指標可能互相牴觸，但不可能定理有適用條件。
  correct: 不同基率且存在非退化錯誤時，均等賠率與預測值均等往往衝突。但原選項只列相同基率與完美模型為例外，忽略零偽陽性但有漏檢的情況，故保留原答並標爭議。
  wrong:
    A: 選哪種公平目標牽涉價值與風險判斷，不能只靠演算法代決。
    B: 整體準確率沒有描述錯誤如何分配到各群體。
    D: 統計均等只是一種目標，沒有跨任務唯一正確的公平定義。
