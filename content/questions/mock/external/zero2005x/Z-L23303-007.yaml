stem: 二元分類的標籤為 0／1。執行下列程式後，變數fp的值代表什麼？
code: |-
  from sklearn.metrics import confusion_matrix
  tn,fp, fn, tp = confusion_matrix(y_true, y_pred).ravel()
code_lang: python
options:
  A: 真陽性數，即模型正確找出的正樣本數
  B: 偽陽性數，即實際為負卻被預測為正的樣本數（誤報）
  C: 偽陰性數，即漏檢數
  D: 真陰性數
answer: B
explanation:
  summary: scikit-learn 的預設標籤順序會讓 TN 位在左上。
  correct: 在 0、1 兩類皆存在時，列為實際、欄為預測；ravel 依序取 TN、FP、FN、TP，所以 fp 是負類被判成正類的數量。
  wrong:
    A: 真陽性對應 tp，是攤平後的第 4 格。
    C: 漏檢對應 fn，是第 3 格。
    D: 真陰性對應 tn，是第 1 格。
