stem: 某 PCA結果的前五個特徵值依序為 λ = [40,25,15,12,8]（共五個成分）。若要保留累積解釋變異達80%，至少須保留幾個主成分？
options:
  A: 4個
  B: 5個
  C: 2個
  D: 3個
answer: D
explanation:
  summary: 達到門檻後就停止增加主成分。
  correct: 總變異為 100；前 2 個為 65%，前 3 個為 80%。題目要求最少數量，所以答案是 3 個。
  wrong:
    A: 4 個雖達標，但已超過必要的最少數量。
    B: 5 個保留全部資訊，也超出最少需求。
    C: 2 個只保留 65%，沒有達標。
