stem: 關於我國 AI治理相關文件之機關與性質，下列配對何者正確？
options:
  A: 《人工智慧基本法》之中央主管機關為數位發展部；國科會依基本法第 16 條訂定《人工智慧風險分類框架》，供各目的事業主管機關參考
  B: 兩者皆由行政院直接訂定，性質均為法律
  C: 《人工智慧基本法》為行政指引；《人工智慧風險分類框架》為法規命令
  D: 《人工智慧基本法》之中央主管機關為國科會；《人工智慧風險分類框架》由數位發展部依該法第 16條訂定
answer: D
explanation:
  summary: 分清楚基本法主管機關與風險框架訂定機關。
  correct: 基本法第 2 條將中央主管機關定為國科會；第 16 條由數位發展部推動風險分類框架，兩個角色不同。
  wrong:
    A: 此項把兩個機關的角色對調；基本法中央主管機關不是數位發展部。
    B: 法律與主管機關發布的框架具有不同形式及用途，不能一概稱為行政院直接訂定的法律。
    C: 基本法是法律；框架用來引導主管機關形成風險管理規範，不能倒置為法律與行政指引的性質。
