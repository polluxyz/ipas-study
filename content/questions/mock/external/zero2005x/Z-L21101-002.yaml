stem: 關於 Transformer架構之敘述，下列何者錯誤？
options:
  A: 多頭注意力的主要目的，是讓模型在不同表示子空間中平行捕捉多種類型的關聯
  B: 不含位置資訊且無遮罩的自注意力具有置換等變性，重排輸入位置時，輸出位置也會隨之重排
  C: 自注意力相對於 RNN的最大優勢，是將序列長度 n的計算複雜度由 O(n²)降為 O(n)
  D: 自注意力中除以√dk，是為避免內積數值過大使 softmax進入飽和區而產生梯度消失
answer: C
explanation:
  summary: 自注意力的平行處理不等於線性計算成本。
  correct: 題目問錯誤敘述。標準全注意力要比較所有位置對，成本含 n²；相較遞迴模型的優勢主要是能平行處理序列，而非降為 O(n)。
  wrong:
    A: 各注意力頭用不同投影學習關聯，可同時觀察多種表示關係。此項符合多頭設計。
    B: 此項限定沒有位置資訊與遮罩的注意力。重排詞向量只會使對應輸出一起重排，不會改變各詞的內容表示；不能把這項性質直接套用到含因果遮罩的模型。
    D: 點積隨維度增大可能使 softmax 過度集中。除以鍵向量維度的平方根，可使分數尺度較穩定。此敘述不是題目要找的錯誤。
