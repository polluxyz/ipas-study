stem: 某市府欲分析空拍影像，計算各行政區的「綠覆蓋率」，即植被像素佔總像素的百分比，不需區分個別樹木。下列任務型態何者最為適當？
options:
  A: 影像分類
  B: 語意分割
  C: 物件偵測
  D: 實例分割
answer: B
explanation:
  summary: 面積比例需要像素類別，不需要物件身分。
  correct: 逐像素標示植被後即可累計面積。題目不需每棵樹的身分，因此語意分割足以達成。
  wrong:
    A: 分類只輸出整張圖的類別，無法直接計算植被像素占比。
    C: 框出樹木位置不能分離框內的背景，也不能直接精準累計植被面積。
    D: 實例分割另要區分同類物件的個別實例，本例未要求此層資訊，增加的成本沒有必要。
