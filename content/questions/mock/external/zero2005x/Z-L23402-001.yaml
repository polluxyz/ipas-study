stem: 某人力資源科技公司開發 AI履歷篩選系統。稽核發現：模型未使用性別欄位，但「畢業學校」「居住郵遞區號」「曾任職產業」三項特徵的組合，使某一性別群體的通過率顯著低於另一群體。下列處置何者最為適當？
options:
  A: 維持現有特徵，以整體準確率與召回率追蹤改善，將兩項總體指標達標作為通過公平性稽核的依據
  B: 檢查代理變數，敏感屬性限稽核使用；比較群體通過及誤判率，再依脈絡選指標矯正
  C: 分別調整兩群體的門檻，使兩群通過率相等，並以這個結果判定群體的偽陽性率與偽陰性率也已相等
  D: 先移除學校、郵遞區號與產業，再比較刪除前後的整體準確率，以準確率未下降作為性別代理資訊已排除的依據
answer: B
explanation:
  summary: 移除敏感欄位不代表其他特徵不會攜帶相同資訊。
  correct: 學校、地區與產業可能共同代理敏感屬性。應在受控稽核下比較各群體的通過與錯誤表現，再決定適合任務的修正方式。
  wrong:
    A: 整體準確率與召回率可能掩蓋某群體的低通過率或高誤判率，不能取代分群稽核。
    C: 通過率相等不代表偽陽性率與偽陰性率相等。這些指標使用不同分母，須分別比較後再依任務取捨。
    D: 整體準確率未下降只能描述預測表現，不能驗證代理資訊已排除；其餘欄位仍可能共同攜帶性別訊號。
