stem: 某資料集的「年收入」欄位缺失率為 22%，且分析顯示高收入者較不願填答。下列處置何者最為適當？
options:
  A: 用已填答者的年收入平均值填補全部缺失，將未填答視為與收入無關，因此不需記錄缺失指示或揭露偏誤
  B: 屬非隨機缺失；保留缺失指示，審慎插補並揭露偏誤風險
  C: 刪除所有含缺失的列
  D: 以 0填補
answer: B
explanation:
  summary: 缺失與欄位未觀測值相關，不能只靠平均填補假裝無偏。
  correct: 高收入者較易不填，符合非隨機缺失的描述。保留缺失指示、檢查假設並揭露敏感度與偏誤，比直接抹去缺失更妥當。
  wrong:
    A: 觀測者平均可能低於缺失者平均，直接套用會掩蓋系統性差異。
    C: 刪除缺失列可能讓高收入群更缺乏代表性。
    D: 0 代表已知沒有收入，與未取得收入資料不同。
