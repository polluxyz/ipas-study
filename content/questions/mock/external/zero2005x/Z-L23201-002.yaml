stem: 某工程師使用`LogisticRegression`(`C=0.01`)訓練模型，發現嚴重欠擬合。下列調整何者最為適當？
options:
  A: 增加訓練 epoch數
  B: 將C進一步調小為 0.001
  C: 將 C 調大，例如設為 10
  D: 改用`Lasso`(`alpha=10`)
answer: C
explanation:
  summary: C 與正則化強度反向變化。
  correct: 在已收斂且限制過強的前提下，提高 C 可減弱正則化，讓邏輯斯迴歸更能配合資料。
  wrong:
    A: 單純增加迭代不會改變正則化目標；需先分辨未收斂與容量受限。
    B: 把 C 再調小會加強限制，與改善欠擬合的方向相反。
    D: Lasso 是迴歸估計器，且較大的 alpha 會加強限制。
