stem: |-
  以下 Keras 程式建立手寫數字分類模型，輸入為 28×28 灰階影像，標籤 `y` 為 0～9 的整數：

  `Conv2D` 層的輸出形狀與參數量分別為何？
code: |-
  from tensorflow.keras import layers, models

  model = models.Sequential([
      layers.Input(shape=(28, 28, 1)),
      layers.Conv2D(16, (3, 3), padding="valid", activation="relu"),
      layers.MaxPooling2D((2, 2)),
      layers.Flatten(),
      layers.Dense(10, activation="softmax"),
  ])
  model.compile(optimizer="adam",
                loss="sparse_categorical_crossentropy", metrics=["accuracy"])
code_lang: python
options:
  A: (26, 26, 16)，160 個參數
  B: (28, 28, 16)，144 個參數
  C: (26, 26, 16)，144 個參數
  D: (13, 13, 16)，160 個參數
answer: A
explanation:
  summary: valid 卷積會縮小邊長，參數另計每個濾波器的偏置。
  correct: (28−3)+1=26，16 個濾波器得到 26×26×16。權重 3×3×1×16=144，再加 16 個偏置，共 160。
  wrong:
    B: 28 是 same 填充的結果，144 又漏了偏置。
    C: 輸出形狀正確，但參數尚未加上 16 個偏置。
    D: 13 是後續池化後的邊長，不是卷積直接輸出。
