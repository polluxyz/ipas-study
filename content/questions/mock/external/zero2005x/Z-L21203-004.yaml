stem: 某證券商規劃導入 AI投資建議系統，直接向散戶客戶推播個股操作建議，並使用客戶完整的交易與資產資料。依金管會《金融業運用 AI指引》所列的 6 項風險評估考量因素，下列評估何者最為適當？
options:
  A: 因指引僅為監理期待而非法律，證券商可自行決定是否適用
  B: 只要模型使用開源套件並公開架構，即可降低風險等級
  C: 因系統僅提供「建議」而非自動下單，故所有高風險指標均不成立
  D: 依客戶服務與個資使用等因素評為高風險，採強化記錄、監控、審查及稽核
answer: D
explanation:
  summary: 對客戶權益與個資的影響是金融 AI 風險因素。
  correct: 本例直接影響散戶投資判斷，也大量使用交易與資產資料，宜綜合評為高風險並強化記錄、監控與審查。外部獨立驗證依風險與資源評估，非所有案例一律強制。
  wrong:
    A: 指引屬行政指導，仍是金融業風險管理的參考。不能從此推論既有法律、自律要求與客戶保護都可任意忽略。
    B: 可檢視程式不會消除資料敏感性與財產損害；開源本身不是降低風險分類的充分條件。
    C: 直接提供投資建議仍會影響資產決策，不會因未代為下單就使相關風險全部歸零。
