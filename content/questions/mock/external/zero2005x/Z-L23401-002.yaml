stem: 攻擊者在公開的訓練資料集中混入少量特製樣本，使模型在遇到特定觸發圖案時輸出攻擊者指定的類別，而在一般樣本上表現正常。此攻擊型態為何？
options:
  A: 成員推論攻擊
  B: 對抗樣本攻擊
  C: 資料毒化（含後門植入）
  D: 模型竊取
answer: C
explanation:
  summary: 先污染訓練資料，再用觸發圖案啟動偏誤，屬後門毒化。
  correct: 攻擊者改動學習來源，使模型記住特定觸發模式。一般樣本正常而觸發樣本異常，是後門攻擊的典型特徵。
  wrong:
    A: 成員推論在判斷樣本是否參與訓練，並非指定模型遇到圖案時輸出哪一類。
    B: 常見逃避型對抗樣本是在推論輸入加入擾動，沒有修改訓練資料。
    D: 模型竊取要重建模型行為，目的不是先植入觸發分類規則。
