stem: 某醫材廠導入 AI視覺檢測導管瑕疵。團隊主張：「我們已設置人工複檢關卡，且模型召回率達99%，因此本應用不應被認定為高風險 AI應用。」依《人工智慧風險分類框架》v1.0，下列評論何者最為正確？
options:
  A: 因該框架對非公務機關不具直接拘束力，故醫材廠無須進行任何 AI風險評估
  B: 先依固有風險評估；人工複檢不排除醫材應用被判為高風險
  C: 團隊主張正確，人工複檢已充分緩解風險
  D: 只要召回率達 99%以上，即可依框架自行豁免高風險認定
answer: B
explanation:
  summary: 固有風險評估與風險緩解是不同階段。
  correct: 風險分類框架 3.3.2 先檢視應用本身的危害可能；複檢措施的效果於應對階段再看。醫材若可能嚴重影響生命安全，仍需評估是否屬高風險。
  wrong:
    A: 框架主要供主管機關使用，並不表示業者可忽略既有醫材規範與安全責任。
    C: 有人複檢並不能直接證明應用本身不會造成嚴重傷害，需先評估危害再判斷措施是否足夠。
    D: 單一召回率沒有涵蓋危害程度與所有失效情境，框架也未設此數值作為自行豁免條件。
