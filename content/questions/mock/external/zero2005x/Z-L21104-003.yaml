stem: 某團隊建置「振動時序＋熱像圖＋維修工單文字」的預測性維護模型。上線後懷疑熱像圖並未真正被使用。下列驗證方法何者最為直接有效？
options:
  A: 增加熱像圖的解析度後重新訓練，觀察效能是否提升
  B: 提高熱像圖在損失函數中的權重，直到效能提升為止
  C: 檢查熱像圖的檔案大小與影像品質是否符合規格
  D: 移除熱像圖做消融比較，檢查評估效能是否下降
answer: D
explanation:
  summary: 模態消融可直接檢查增益。
  correct: 控制評估條件，只移除熱像圖再比較效能，可觀察這個模態的額外貢獻。若差異很小，表示在該測試條件下其增益有限，仍須注意模態間資訊重複。
  wrong:
    A: 提高解析度會同時改變資料與運算負擔，無法直接隔離原模型是否依賴熱像圖。
    B: 強制調權重會改變模型；即使分數上升，也不是對原模型是否使用熱像圖的直接測試。
    C: 檔案合格只能證明資料可用，無法證明模型決策真正利用了其中資訊。
