stem: 下列程式的問題為何？
code: |-
  scaler= StandardScaler()
  X_train_s= scaler.fit_transform(X_train)
  X_test_s= scaler.fit_transform(X_test)
  model.fit(X_train_s,y_train)
code_lang: python
options:
  A: 測試集重新 fit 使用了測試統計量，屬資料洩漏且尺度不一致；改用 scaler.transform(X_test)
  B: 應改用`MinMaxScaler`即可避免
  C: 先合併訓練與測試資料，再由合併資料估計平均與標準差，以相同尺度作為理由保留這份共同轉換器
  D: 沒有問題，兩個資料集各自標準化較為公平
answer: A
explanation:
  summary: 測試資料應沿用訓練階段學到的縮放參數。
  correct: 測試集重新 fit 會使用測試統計量，且改變座標尺度。訓練 fit 完後，測試只呼叫 transform，才能維持同一組轉換。
  wrong:
    B: 更換縮放公式不能解決測試階段重新估參數的流程問題。
    C: 合併後 fit 會讓測試集參與前處理參數估計，評估不再獨立。
    D: 各自估平均與標準差，會讓相同原始數值產生不同座標。
