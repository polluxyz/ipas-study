stem: 某預測框與真實框皆為軸對齊矩形。預測框面積 400、真實框面積 500，兩者交集面積 200。其 IoU為何？
options:
  A: "0.22"
  B: "0.29"
  C: "0.50"
  D: "0.40"
answer: B
explanation:
  summary: IoU 的分母是聯集面積。
  correct: 聯集為 400+500−200=700。交集除以聯集得 200/700≈0.286，四捨五入為 0.29。
  wrong:
    A: 200/(400+500)≈0.22 將交集重複算進分母，需扣除一次。
    C: 200/400=0.50 的分母只是預測框，不是聯集。
    D: 200/500=0.40 只用了真實框面積，沒有計入預測框超出真實框的部分。
