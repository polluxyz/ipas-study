stem: 某資料集含「郵遞區號」欄位，共 3,000 個相異值。探索分析顯示，此欄位與目標明顯相關。線上服務只接收最多 64 維的輸入特徵向量，稀疏儲存也不會放寬維度上限。若使用線性模型，下列編碼方式何者最為適當？
options:
  A: 依郵遞區號大小順序編碼，直接把整數輸入線性模型，並讓數字差距代表地區之間固定的線性影響
  B: 採折外且平滑的目標編碼，或依地理意義合併較粗區域
  C: 直接刪除該欄位
  D: One-Hot編碼，產生 3,000個二元欄位
answer: B
explanation:
  summary: 高基數類別要兼顧維度與目標洩漏。
  correct: 折外統計不使用當筆所在折的標籤，平滑可降低低頻類別的不穩定。依實際地理意義合併區域，也是可比較的方案。
  wrong:
    A: 數值郵遞區號不代表線性的地域差距，直接排序會引入不當關係。
    C: 探索分析已顯示地域與目標相關，直接刪除會丟失已觀察到的訊號。應先比較符合維度上限的編碼方案。
    D: 3,000 維超過服務的 64 維上限。稀疏儲存可降低儲存成本，但仍有 3,000 個特徵，不能滿足輸入介面的維度限制。
