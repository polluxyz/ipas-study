stem: 關於三種生成模型之特有問題，下列配對何者正確？
options:
  A: VAE推論速度慢；GAN生成結果偏模糊；Diffusion容易發生模式崩潰
  B: VAE生成結果偏模糊；GAN容易發生模式崩潰；Diffusion推論速度慢
  C: VAE容易發生模式崩潰；GAN生成結果偏模糊；Diffusion推論速度慢
  D: 三者皆容易發生模式崩潰，差異僅在生成品質
answer: B
explanation:
  summary: 區分生成模型常見的訓練與取樣限制。
  correct: VAE 的機率重建常犧牲細節；GAN 可能只生成少數樣式；典型擴散取樣要多次去噪。這是各自常見限制，並非所有變體必然如此。
  wrong:
    A: VAE 通常可直接解碼取樣，沒有典型多步擴散的相同成本；其餘配對也混淆了常見問題。
    C: 模式崩潰是 GAN 常見風險；VAE 則較常出現平滑而不銳利的重建。此項把兩者對調。
    D: 不能把不同模型的失效方式都稱為模式崩潰。生成多樣性、細節與取樣成本應分別判讀。
