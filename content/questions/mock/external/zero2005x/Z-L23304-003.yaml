stem: 某梯度提升模型的訓練集 F1為 0.97、驗證集 F1為 0.71。下列處置何者最不適當？
options:
  A: 加入子取樣與特徵抽樣（比例小於 1）
  B: 以驗證集監控並啟用早停
  C: 大幅增加`max_depth`與`n_estimators`以提升模型容量
  D: 降低`max_depth`並提高`min_child_weight`
answer: C
explanation:
  summary: 訓練好但驗證差時，先限制容量或增加泛化控制。
  correct: 本題選最不適當處置。把深度與樹數都大幅加大，可能讓模型更容易記住訓練細節，與已見的過擬合差距不符。
  wrong:
    A: 子取樣和特徵抽樣可降低對特定資料的依賴，效果需驗證。
    B: 監控驗證分數再停止，可避免繼續加入無益的提升步數。
    D: 降低深度及提高 min_child_weight 可限制樹的細分；後者是葉節點 Hessian 加總門檻，不直接等於樣本筆數。
