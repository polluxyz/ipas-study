stem: 下列哪一種模型不需要對特徵進行縮放？
options:
  A: 具 L2正則化之邏輯斯迴歸
  B: K近鄰演算法
  C: 支援向量機
  D: 梯度提升樹
answer: D
explanation:
  summary: 樹模型依單一特徵閾值分割，通常不需縮放。
  correct: 梯度提升樹主要利用特徵排序尋找切點。一般線性尺度轉換不改變排序，所以通常不需為模型本身標準化。
  wrong:
    A: L2 懲罰作用於係數，尺度不同會改變各欄位受到的相對限制。
    B: K 近鄰用距離找鄰居，大量尺欄位可能主導距離。
    C: 支援向量機的距離與懲罰設定會受特徵尺度影響。
