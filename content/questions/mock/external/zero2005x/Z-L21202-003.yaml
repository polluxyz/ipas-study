stem: 某電商導入詐欺交易攔截模型。上線後攔截率（召回率）由 62%提升至 81%，但客服部門回報「正常交易被誤攔」的客訴量成長為原來的
  3.4倍。專案團隊主張模型指標達標故應維持現狀。下列評論何者最為適當？
options:
  A: 團隊主張正確，召回率提升即代表專案成功
  B: 應直接把召回率目標再提高到 90%，以徹底解決詐欺問題
  C: 客訴屬客服部門的問題，與 AI專案無關
  D: 設定誤攔客訴護欄；超標時重評閾值與人工覆核流程
answer: D
explanation:
  summary: 主要指標改善時，仍要監控副作用。
  correct: 誤攔與客訴是會影響服務的副作用。規劃時應定義可接受上限，超標後重新檢查閾值與人工覆核，兼顧漏攔與誤攔成本。
  wrong:
    A: 召回率提高可能伴隨更多誤攔，不能把單一指標改善視為所有目標都達成。
    B: 單純追求更高召回可能進一步增加誤攔，不能解決目前的客訴問題。
    C: 模型改變了正常交易處理，客訴正是其業務影響，需由跨部門共同處理。
