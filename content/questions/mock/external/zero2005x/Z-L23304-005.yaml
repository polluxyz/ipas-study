stem: 某工程師欲同時完成調參與泛化評估，寫下列程式。其問題為何？
code: |-
  gs= GridSearchCV(model, param_grid, cv=5)
  gs.fit(X,y)#X,y為全部資料
  print(gs.best_score_)#作為最終效能
code_lang: python
options:
  A: 沒有問題
  B: 全資料已參與調參；應先保留測試集，或改用外層評估、內層搜尋的巢狀交叉驗證
  C: 應把cv改為 3以加快速度
  D: 將 GridSearchCV 改成 RandomizedSearchCV，仍使用全部資料搜尋並直接報告 best_score_，即可消除選擇偏誤
answer: B
explanation:
  summary: 模型選擇與最終評估需要不同的資料角色。
  correct: 全部資料參與搜尋後，最高的內層分數沒有獨立驗證選擇結果。可預留測試集，或每個外層訓練折內各自做參數搜尋。
  wrong:
    A: 直接把被挑出的分數當最終效能，忽略了選擇造成的偏差。
    C: 改折數沒有保留未參與選擇的資料。
    D: 隨機搜尋也會選出較高分的設定，仍需要獨立評估。
