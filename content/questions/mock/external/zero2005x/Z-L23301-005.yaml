stem: 某團隊欲以資料增強擴充胸部 X光片訓練集。下列增強方式何者最不適當？
options:
  A: 水平翻轉
  B: 隨機裁切後縮放回原尺寸
  C: 小幅度旋轉（±10度）
  D: 亮度與對比度微調
answer: A
explanation:
  summary: 影像增強必須保留任務需要的解剖與標籤資訊。
  correct: 原答選水平翻轉，理由是會改變左右解剖位置。但題目沒有界定裁切範圍，裁切也可能移除病灶，因此單一最不適當選項的條件不足。
  wrong:
    B: 裁切只有在保留必要解剖與病灶時才適當；原題未提供這項限制，列為爭議。
    C: 小角度旋轉可能模擬擺位差異，但仍須依任務驗證標籤不變。
    D: 輕微曝光變化可能合理，幅度仍需經資料與任務檢查。
