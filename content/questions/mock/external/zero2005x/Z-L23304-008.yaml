stem: |-
  以下程式對隨機森林做超參數搜尋，最後在測試集上評估：

  關於 `gs.best_score_` 與 `gs.score(X_test, y_test)`，下列敘述何者正確？
code: |-
  from sklearn.model_selection import GridSearchCV
  from sklearn.ensemble import RandomForestClassifier

  grid = {"n_estimators": [100, 300],
          "max_depth": [4, 8, None],
          "min_samples_leaf": [1, 5]}
  gs = GridSearchCV(RandomForestClassifier(random_state=0), grid,
                    cv=5, scoring="roc_auc", n_jobs=-1)
  gs.fit(X_train, y_train)
  print(gs.best_params_, round(gs.best_score_, 3))
  print(round(gs.score(X_test, y_test), 3))
code_lang: python
options:
  A: best_score_ 是被選中配置的平均驗證 AUC，可能偏樂觀；最終應報未參與搜尋的測試分數
  B: "`best_score_` 就是測試集 AUC"
  C: "`best_score_` 是訓練集 AUC"
  D: gs.score(X_test,y_test) 會忽略搜尋器的 scoring，直接改用隨機森林預設準確率，無須另外指定指標
answer: A
explanation:
  summary: 搜尋器的 score 沿用指定的評分方式。
  correct: best_score_ 是候選中最佳的平均驗證 AUC；gs.score 在測試集也採 roc_auc。測試資料必須未參與選擇才適合作為最終評估。
  wrong:
    B: 搜尋在訓練集內進行，best_score_ 沒有使用外部測試集。
    C: 這個屬性記錄驗證折平均，而非訓練資料上的擬合分數。
    D: 已指定 scoring="roc_auc"，score 不會回到分類器預設準確率。
