stem: 某團隊直接以深度神經網路建模，準確率達 84%，主管詢問「這樣算好嗎」。下列回應何者最為適當？
options:
  A: 應直接加深網路至 50層以提升準確率
  B: 改用召回率或 F1 取代準確率，再依分數絕對大小決定是否上線，不必為這些新指標另外建立比較基準
  C: 84%屬高準確率，可直接上線
  D: 先建立基準線；若多數類策略已有 82%，再評估增加 2 個百分點是否值得成本
answer: D
explanation:
  summary: 模型分數要和相同資料上的基準比較。
  correct: 84% 與多數類基準 82% 只差 2 個百分點。仍需檢查錯誤成本、少數類表現與部署成本，不能僅憑絕對分數上線。
  wrong:
    A: 尚未診斷誤差來源，直接加層數沒有依據。
    B: 更換指標後仍要使用相同指標的基準來比較。
    C: 高準確率可能來自多數類比例，未必代表模型具實用增益。
