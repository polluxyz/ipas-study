stem: |-
  二元分類資料 `X`、`y`（`y` 為 0／1），以下程式評估支援向量機的表現，輸出如下：

  本例已得到下列輸出：

  ```text
  [0.81 0.79 0.84 0.62 0.8 ] 0.772
  ```

  若把資料換成三個類別的 `y`，其餘程式不變，最可能發生什麼事？
code: |-
  from sklearn.model_selection import StratifiedKFold, cross_val_score
  from sklearn.pipeline import make_pipeline
  from sklearn.preprocessing import StandardScaler
  from sklearn.svm import SVC

  pipe = make_pipeline(StandardScaler(), SVC(C=1.0))
  cv = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)
  scores = cross_val_score(pipe, X, y, cv=cv, scoring="f1")
  print(scores.round(2), scores.mean().round(3))
code_lang: python
options:
  A: 正常執行，scoring="f1" 會自動辨識 3 個類別，對各類 F1 取平均後回傳 5 個有效分數
  B: '`scoring="f1"` 只適用於二元分類，執行時會報錯；應改用 `"f1_macro"` 或 `"f1_weighted"`'
  C: 自動改用準確率評分
  D: "`StratifiedKFold` 不支援多類別，會報錯"
answer: B
explanation:
  summary: 多類別 F1 要明確指定平均方式。
  correct: scoring="f1" 採二元平均方式，不能直接評分三類標籤。cross_val_score 預設 error_score=np.nan，各折評分失敗會產生警告並填入 NaN，因此回傳 5 個 NaN，平均也為 NaN；指定 error_score="raise" 才會向外拋出 ValueError。改用 f1_macro 或 f1_weighted 可明確指定多類別平均方式。
  wrong:
    A: f1 不會自動切換成多類平均。
    C: 評分失敗不會自動改成準確率。
    D: StratifiedKFold 可用於一般多類別標籤，不是此處失敗原因。
