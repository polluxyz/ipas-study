stem: 在相同的運算預算下（例如各試 60組），關於網格搜尋與隨機搜尋之比較，下列敘述何者最為正確？
options:
  A: 採用 3×4×5 的網格評估 60 組時，每個參數都能測到 60 個不同取值，與連續隨機抽樣的覆蓋相近
  B: 固定隨機種子會讓 60 次抽樣重複同一組參數，需在每次抽樣前改種子才能探索不同組合
  C: 將網格每個維度的刻度數加倍，總組合數也只增加為 2 倍，可用少量額外預算加密高維搜尋
  D: 多數參數影響小時，隨機搜尋通常更有效率，可探索重要參數的更多取值
answer: D
explanation:
  summary: 固定預算時，隨機搜尋可讓重要參數試到更多不同值。
  correct: 若許多參數影響不大，規則網格可能反覆測到相同的重要參數值；隨機抽樣有機會更有效使用有限試驗次數。
  wrong:
    A: 3×4×5 網格有 60 個組合，但各參數只有 3、4、5 個不同取值。組合數不能當成每個參數的取值數。
    B: 搜尋開始時固定種子，可重現整段抽樣序列；同一序列仍可產生不同組合。每次抽樣前重設成同一種子，才可能反覆得到相同結果。
    C: 網格組合數是各維度刻度數的乘積。若有 k 個參數，每個維度加倍後，組合數增為 2^k 倍，而非僅 2 倍。
