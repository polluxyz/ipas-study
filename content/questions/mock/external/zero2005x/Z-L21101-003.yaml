stem: 某語料庫共有 1,000份文件。詞 A出現在全部 1,000份文件中，於文件 d內出現 12次；詞 B出現在 10 份文件中，於文件 d 內出現 3 次。本題 TF
  使用未正規化的出現次數。以 TF-IDF = TF(t,d) × log₁₀[N ÷ DF(t)] 計算，下列何者正確？
options:
  A: 詞 A權重較高，因為其出現頻率為詞 B的四倍
  B: 詞 A權重為 12，詞 B權重為 3
  C: 兩者權重相同
  D: 詞 A權重為 0，詞 B權重為 6
answer: D
explanation:
  summary: 依指定的未平滑 IDF 計算詞權重。
  correct: 本例以出現次數作 TF。A 得 12×log10(1000/1000)=0；B 得 3×log10(1000/10)=6。指引另例使用正規化詞頻，本題依指定口徑。
  wrong:
    A: 只比較 12 與 3 忽略了文件頻率。詞 A 出現在每篇文件，其 IDF 會抵銷詞頻。
    B: 12 與 3 是原始次數，還未乘上 IDF，因此不是題目要求的最終權重。
    C: 兩詞的 IDF 分別為 0 與 2，乘上各自的 TF 後不相等。
