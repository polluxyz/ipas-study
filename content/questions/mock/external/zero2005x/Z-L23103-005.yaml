stem: |-
  某模型訓練時損失持續震盪且不收斂。工程師檢視設定如下。最可能的問題與修正為何？

  程式為訓練設定示意，lr 表示學習率，不指定函式庫版本。
code: |-
  optimizer= Adam(lr=0.5)
  batch_size= 8
code_lang: python
options:
  A: 應移除 Adam改用 AdaGrad，因其學習率會自動遞減
  B: 調低 Adam 學習率（例如 0.001），並試驗較大批次
  C: 應改用 sigmoid作為隱藏層激活函數
  D: 應增加訓練 epoch數，震盪會自然消失
answer: B
explanation:
  summary: 先調整過大的更新幅度，再比較批次造成的梯度波動。
  correct: 0.5 是很大的 Adam 初始步長，批次 8 又可能帶來較大波動。先試較小步長與較大批次，再用曲線確認是否收斂。
  wrong:
    A: AdaGrad 的步長也需設定與驗證，換名稱不能取代修正過大的初始值。
    C: 更換為 sigmoid 沒有直接控制步長，還可能使部分梯度變小。
    D: 若更新持續越過穩定區，只增加輪數並不能保證收斂。
