stem: OpenAI 的 CLIP（Contrastive Language-Image Pre-training）模型開創了多模態基礎模型的新典範。下列關於 CLIP
  的架構設計與對比學習（Contrastive Learning）機制之敘述，何者最為正確？
options:
  A: 對比式學習的損失函數要求模型必須能完整自回歸還原文字中的每一個字元
  B: CLIP 僅能用於封閉集合的影像分類，無法實現零樣本（Zero-shot）分類與跨模態以圖搜圖
  C: CLIP 採用單一共享權重的神經網路，影像與文字必須在第一層即進行空間維度的特徵拼接
  D: 圖文雙編碼器以對比學習提高配對相似度、降低非配對相似度
answer: D
explanation:
  summary: 圖文對比學習把配對資料對齊到共享空間。
  correct: 雙編碼器把圖片與文字投影到可比較的表示，對比目標使真配對相對其他批次候選更接近。這支援文字找圖與零樣本分類。
  wrong:
    A: 對比目標學習配對相似度，不要求逐字自迴歸重建原文；那是另一種生成目標。
    B: 以文字建立類別描述後可比對圖片，正是其常見零樣本使用方式，並不限固定分類頭。
    C: 兩種輸入由各自編碼器處理，不是強制從第一層共用權重或拼接原始特徵。
