stem: 某產線的 AI 瑕疵偵測服務需達到 99.9% 可用性。團隊提出四項設計，下列哪一項**同時**處理了「機器故障」與「模型服務暫時失效」兩種情境？
options:
  A: 將模型量化以降低延遲
  B: 為推論服務加上每小時一次的自動重訓排程
  C: 提高監控告警的敏感度，並要求值班人員 5 分鐘內回應
  D: 跨可用區設推論副本，主模型連續失敗時回退舊版
answer: D
explanation:
  summary: 備援副本與舊版回退處理不同失效來源。
  correct: 分散副本可承受個別機器故障；新版模型持續失敗時回退舊版，則提供另一種服務恢復路徑。兩者合用才同時涵蓋題目的兩種情境。
  wrong:
    A: 量化可減少資源與延遲，但設備故障或模型服務失效時，仍需備援與回復路徑。
    B: 定期重訓沒有在服務失效時立刻接替的功能，還可能引入新版本問題。
    C: 告警有助發現問題，但人員回應之前仍可能中斷，並未提供即時容錯。
