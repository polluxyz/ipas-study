stem: 關於 AI專案成本效益分析，下列敘述何者最不適當？
options:
  A: 高風險 AI應用之合規成本（稽核軌跡、獨立評測、人工覆核人力）應納入總持有成本
  B: 多年期方案比較應採用 NPV，因為 ROI未考慮金錢的時間價值
  C: 應將「決策速度提升」「員工滿意度改善」等無形效益折算後計入 ROI分子，以完整反映專案價值
  D: 應將模型上線後的重新訓練、例行監控、告警處理與定期效能驗證編列為年度維運預算，避免只估建置費
answer: C
explanation:
  summary: 無形效益估值需要可查核的假設。
  correct: 無形效益若有可查核的估值方法，且未重複計算，可合理納入成本效益分析。缺乏可靠估值時才宜另列質性效益，並以敏感度分析檢視假設的影響。題目未交代折算依據，不能只因效益無形就判定不得換算，因此無法唯一判定哪項最不適當。
  wrong:
    A: 稽核與人工覆核需要人力及工具，不能只計模型建置費；把這些列入總成本合理。
    B: NPV 會依期間折現現金流，較能反映多年期方案的時間價值，與單一 ROI 比率提供不同資訊。
    D: 重訓與監控是上線後仍會發生的成本，將它們放入後續年度預算合理。
