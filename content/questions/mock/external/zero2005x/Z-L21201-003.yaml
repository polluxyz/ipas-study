stem: 某醫療器材商評估導入 AI影像判讀。團隊完成 POC，離線測試指標亮眼，遂主張可直接進入正式上線。風控主管認為不妥。下列理由何者最為適當？
options:
  A: 離線指標必然高於線上指標，因此直接把驗收目標調高 10%，再沿用原離線測試通過即核准上線，無須另外驗證臨床流程或設計人工覆核
  B: 應先更換為更大的模型以確保準確率，再考慮上線
  C: POC只驗證技術可行性，尚未驗證業務價值與真實流程可行性；且醫材涉及生命安全法益，合規成本與人工覆核設計須先確認
  D: POC已通過即代表所有可行性層次皆已滿足，風控主管的顧慮並無依據
answer: C
explanation:
  summary: 離線概念驗證通過仍不足以直接上線。
  correct: 原答案 A 的上線結論合理：離線結果不能證明臨床流程與安全要求已滿足。但「POC 只驗證技術」過度限縮；POC 的範圍也可以包含流程與業務效益。
  wrong:
    A: 離線與線上的差距沒有固定方向或 10% 的通用修正量，應實地驗證而非任意調目標。
    B: 更大模型不保證較適合，也不能代替流程驗證、風險評估與必要的法遵確認。
    D: 局部驗證通過不能推論所有可行性均獲證明；仍要確認正式環境、責任與監控措施。
