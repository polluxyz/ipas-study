stem: 關於隨機森林（Random Forest）演算法中的自助抽樣（Bootstrap Aggregating）與袋外（Out-of-Bag, OOB）評估機制，下列敘述何者最為正確？
options:
  A: 只有設定 `oob_score`=True 時，隨機森林才能進行樹與特徵的隨機抽樣訓練
  B: 每棵樹約有 (1−1/N)^N ≈ 36.8% 的樣本未抽中；這些袋外資料可用於無偏評估單樹與森林的泛化效能
  C: 袋外資料評估結果會受到嚴重的資料洩漏（Data Leakage）影響，因此不能作為模型泛化能力的評估依據
  D: 自助抽樣採不放回方式，每棵樹固定只抽原資料的 50%，因此每筆資料恰好有一半機率被當作袋外資料
answer: B
explanation:
  summary: 袋外預測要排除曾看過該樣本的樹。
  correct: 每棵樹從 N 筆資料有放回抽取 N 次時，單筆資料未被抽中的機率為 (1−1/N)^N；N 充分大才接近 36.8%。評估森林時，每筆資料只由未抽中它的樹投票。袋外分數可估計泛化表現，但樣本量、特徵數及森林參數可能造成系統性偏差，不能保證單樹與森林的估計皆無偏。
  wrong:
    A: oob_score 控制是否另計袋外分數，不是啟用森林隨機化的總開關。
    C: 袋外機制本身不等於洩漏；但前處理與調參仍須另外檢查。
    D: 自助抽樣有放回，並非固定不放回抽取一半。
