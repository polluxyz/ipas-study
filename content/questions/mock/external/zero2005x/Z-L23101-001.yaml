stem: 某罕見疾病盛行率為 2%。篩檢工具的靈敏度（召回率）為 95%、特異度為 90%。若某人篩檢結果為陽性，其實際患病機率最接近下列何者？
options:
  A: 95%
  B: 90%
  C: 16%
  D: 2%
answer: C
explanation:
  summary: 陽性後的機率要納入疾病盛行率。
  correct: 以 10,000 人估算，真陽性為 190 人，偽陽性為 980 人。陽性者患病率為 190/1170，約 16.24%。
  wrong:
    A: 95% 是患病者驗出陽性的比例，題目問的是陽性者患病的比例。
    B: 90% 是特異度，描述未患病者驗出陰性的機率。
    D: 2% 是檢測前的患病比例，尚未用陽性結果更新。
