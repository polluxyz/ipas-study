stem: 輸入特徵圖尺寸為 64×64，卷積核大小 5×5，填充 P = 2，步幅 S = 2。輸出特徵圖的邊長為何？
options:
  A: "32"
  B: "30"
  C: "64"
  D: "33"
answer: A
explanation:
  summary: 卷積邊長先除以步幅向下取整，再加 1。
  correct: (64−5+2×2)/2=31.5，取整後加 1，輸出邊長為 32。
  wrong:
    B: 30 是忽略兩側填充後的結果。
    C: 64 對應這組核與填充在步幅 1 時的邊長。
    D: 31.5 應向下取整，不是先進位。
