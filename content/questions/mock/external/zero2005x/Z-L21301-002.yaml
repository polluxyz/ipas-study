stem: 下列哪一種模型不需要對特徵進行縮放？
options:
  A: 具正則化之邏輯斯迴歸
  B: 支援向量機
  C: 梯度提升樹
  D: K近鄰演算法
answer: C
explanation:
  summary: 樹模型依特徵排序切分，通常不依賴尺度。
  correct: 梯度提升樹用單一欄位的門檻切分，單調縮放不改變數值的排序，通常不需要事先縮放。
  wrong:
    A: 有正則化時，係數受到的懲罰與特徵尺度交互影響；尺度差異會改變實際懲罰強度。
    B: 常見 SVM 的距離、內積或核函數會受尺度影響，特徵尺度處理通常很重要。
    D: K 近鄰以距離尋找相近樣本，大尺度欄位容易主導距離，通常需檢查縮放。
