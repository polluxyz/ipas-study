stem: 某醫療篩檢模型的漏檢（未檢出真正病患）後果嚴重，而誤報僅需增加一次複檢。若模型目前使用預設閾值 0.5，下列調整何者最為適當？
options:
  A: 調低閾值至 0.3，以提高召回率，並以複檢流程承接增加的誤報
  B: 維持 0.5，因其為統計上的最佳值
  C: 改以準確率作為唯一驗收指標
  D: 把閾值由 0.5 調高至 0.8，優先減少需要複檢的警示，以較高精確率取代漏檢風險的控制
answer: A
explanation:
  summary: 漏檢成本較高時，可降低閾值並監控新增誤報。
  correct: 較低閾值會納入更多疑似病患，召回率可提高或維持。新增誤報需由複檢承接，實際閾值仍以驗證成本決定。
  wrong:
    B: 0.5 是常用預設，不能取代錯誤成本與資料分布的分析。
    C: 只看準確率會掩蓋低盛行率下的重要漏檢。
    D: 較高閾值更嚴格，通常會增加漏檢風險。
