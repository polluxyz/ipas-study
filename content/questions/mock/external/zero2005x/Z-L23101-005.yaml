stem: 關於單純貝氏分類器之敘述，下列何者最為正確？
options:
  A: 單純貝氏必須靠大量標註樣本才能收斂，因此樣本較少時應一律改用參數更多的深層網路
  B: 其條件獨立假設在文本分類中完全成立，因此效果良好
  C: 條件獨立常不成立，分類仍可能實用；輸出機率不宜未校準就直接計算期望損失
  D: 因假設不成立，故此模型在任何情境下皆不應使用
answer: C
explanation:
  summary: 分類排序可用，不表示輸出機率已校準。
  correct: 單純貝氏把給定類別後的特徵視為獨立。即使近似假設不完全成立，分類仍可能有效；涉及機率成本決策時要另檢查校準。
  wrong:
    A: 模型估計簡單，常可用作資料較少時的比較起點。
    B: 文本中的詞會共同出現，不能把條件獨立當成已驗證的事實。
    D: 假設只是近似不代表完全無用，仍可用保留資料評估。
