stem: 關於單純貝氏分類器之敘述，下列何者最為正確？
options:
  A: 類別先驗已反映樣本比例，因此將各特徵的邊際機率相乘，即可代替給定類別後的條件機率
  B: 文本分類準確率高於基準，即可判定詞語在給定類別後彼此獨立，無須另行驗證此假設
  C: 條件獨立常不成立，分類仍可能實用；輸出機率不宜未校準就直接計算期望損失
  D: 將各類別分數除以分數總和後，輸出即已完成機率校準，可直接代入不同錯判成本計算期望損失
answer: C
explanation:
  summary: 分類排序可用，不表示輸出機率已校準。
  correct: 單純貝氏把給定類別後的特徵視為獨立。即使近似假設不完全成立，分類仍可能有效；涉及機率成本決策時要另檢查校準。
  wrong:
    A: 單純貝氏相乘的是給定類別後各特徵的條件機率。類別先驗不能把不分群的邊際機率轉成這些條件機率。
    B: 準確率衡量分類結果，不能驗證條件獨立。詞語即使在同一類別內仍可能相關，模型也可能有實用的分類表現。
    D: 分數加總為 1 只是正規化。機率校準還要檢查預測機率與實際發生率是否一致，不能由加總結果推定。
