stem: NumPy 二維陣列 A 的形狀為 (64,128)，B 的形狀為 (128,10)。下列運算何者會拋出錯誤？
options:
  A: A.T@ A
  B: A * B
  C: B.T @ B
  D: A@ B
answer: B
explanation:
  summary: 矩陣乘法與逐元素相乘使用不同的維度規則。
  correct: 把 A、B 視為 NumPy 二維陣列時，(64,128) 與 (128,10) 無法逐元素廣播，所以 A * B 會失敗。
  wrong:
    A: A.T 的形狀為 (128,64)，乘 A 後得到 (128,128)。
    C: B.T 乘 B 的內側維度同為 128，結果為 (10,10)。
    D: 矩陣乘法內側維度同為 128，結果為 (64,10)。
