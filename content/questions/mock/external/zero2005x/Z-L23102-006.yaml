stem: 某推薦系統工程師欲對使用者-商品評分矩陣（高維稀疏矩陣）進行矩陣分解以萃取潛在特徵（Latent Factors）。在比較標準 PCA 與截斷奇異值分解（TruncatedSVD）時，下列敘述何者最為正確？
options:
  A: 奇異值矩陣 $\Sigma$ 的對角線元素（奇異值）可能為負數，其絕對值最小者代表最主要的資料變異方向
  B: TruncatedSVD 與標準 PCA 一樣，必須先中心化全部欄位，再把稀疏輸入轉為稠密矩陣才能求解
  C: 採用支援稀疏矩陣且不要求全域中心化的 TruncatedSVD
  D: SVD 只能分解正方形且可逆的方陣，若資料筆數不等於特徵數則無法執行分解
answer: C
explanation:
  summary: 截斷 SVD 可直接利用稀疏結構。
  correct: TruncatedSVD 不先減去各欄平均，可避免中心化使大量零元素變成非零，適合文字與評分等稀疏矩陣。
  wrong:
    A: 奇異值不小於 0；通常優先保留大的奇異值來近似主要訊號。
    B: TruncatedSVD 不必先把稀疏輸入全部轉成稠密矩陣。
    D: SVD 可分解長方形矩陣，也不要求矩陣可逆。
