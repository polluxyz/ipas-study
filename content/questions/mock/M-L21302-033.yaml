stem: 某戶外辨識盒在冷機測試前 5 分鐘可於 35 毫秒完成推論。晴天連續運轉 40 分鐘後，散熱保護使運算時脈降低，延遲升至 90 毫秒；服務上限為 60 毫秒。團隊要驗收下一版，哪項測試最能處理這次漏掉的風險？
options:
  A: 在代表性環溫與負載下持續運轉，記錄溫度、時脈及延遲變化
  B: 增加冷機測試的影像種類，彙整各種類的辨識正確率與信心分數
  C: 在室內固定低溫下重複短測，取得更多次的啟動速度與平均延遲
  D: 比較模型檔案大小與運算量，以較低運算量作為現場速度依據
answer: A
explanation:
  summary: 邊緣驗收須涵蓋熱狀態穩定後的持續效能。
  correct: 已知延遲惡化與溫度造成的降頻同時出現。代表性環境的長時間測試能驗證散熱與運算限制，避免僅憑冷機速度接受無法持續達標的版本。
  wrong:
    B: 影像多樣性有助於品質驗證，卻未涵蓋高溫持續運轉引起的降頻問題。
    C: 短時間低溫測試偏向重現冷機狀態，樣本增加仍不能涵蓋現場熱狀態。
    D: 運算量可協助比較候選，但裝置的時脈與散熱會影響實際延遲，仍須持續實測。
