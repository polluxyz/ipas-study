stem: 某分類專案有 2 種機台與 2 種缺陷標籤。每筆樣本彼此獨立，部署會使用這 2 種機台。4 種「機台與標籤」組合各至少 40 筆。驗收要求 5 折中的每折都近似保留這 4 種組合的比例。最適合如何建立切分？
options:
  A: 以缺陷標籤分層，模型仍預測缺陷標籤
  B: 以機台與標籤組合分層，模型仍預測缺陷標籤
  C: 以機台編號分層，模型仍預測缺陷標籤
  D: 以亂數排序後等分，模型仍預測缺陷標籤
answer: B
explanation:
  summary: 分層依據可以配合評估要求，模型目標不必跟著改。
  correct: 要保留聯合分布，切分時可將機台與標籤組合當作分層標記。每組至少 40 筆，足以分配到 5 折。訓練的預測目標仍是缺陷，不是把組合標記當成新任務。
  wrong:
    A: 只控制缺陷比例，不能保證每個缺陷內的兩種機台比例也接近整體。
    C: 只控制機台比例，未控制各機台內的缺陷比例，不能直接滿足 4 種組合的分層要求。
    D: 隨機等分可讓比例在平均上接近整體，但沒有按 4 種組合分層，不能像指定組合分層一樣控制每折的比例。
