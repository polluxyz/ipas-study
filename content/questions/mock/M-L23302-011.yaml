stem: 某租借平台預測歸還時間。業務以預測與實際相差的分鐘數計算損失，提早或延後每 1 分鐘的代價相同，也沒有額外的大誤差加成。現有候選都是連續值迴歸模型。若訓練目標要直接對齊平均業務損失，下列選擇何者最適合？
options:
  A: 使用平均誤差的絕對值作為訓練損失
  B: 使用均方誤差作為訓練損失
  C: 使用平均絕對誤差作為訓練損失
  D: 使用平均絕對百分比誤差作為訓練損失
answer: C
explanation:
  summary: 損失函數應對齊每筆錯誤實際產生的代價。
  correct: 逐筆以相差分鐘數的絕對值計費，再對案件平均，正是平均絕對誤差的形式。提早與延後都產生成本，不會互相抵銷，也不因個案原本所需時間而改變單位分鐘代價。
  wrong:
    A: 先平均帶正負號的誤差，會讓提早與延後互相抵銷，低估逐筆發生的業務損失。
    B: 平方誤差會對大偏差額外加重懲罰，與每分鐘固定代價的規則不同。
    D: 百分比誤差會依真實時間的大小重新加權，同樣相差一分鐘可能有不同代價，不符合規則。
