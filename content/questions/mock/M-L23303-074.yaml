stem: 某團隊把 8,000 筆案件用於訓練，另留 2,000 筆有標籤案件監控早停。每輪訓練都會比較這 2,000 筆的預測與標籤，但不以這些案件的誤差更新模型權重。主管認為沒有更新權重，驗證標籤就不會影響結果。哪項判斷最正確？
options:
  A: 驗證標籤不參與權重更新，因此不會影響最後選到的模型
  B: 驗證標籤只用於計算指標，因此驗證資料不必代表部署來源
  C: 驗證標籤能協助選擇停止時點，不需用來直接更新模型權重
  D: 驗證標籤不參與權重更新，因此驗證分數可替代獨立測試
answer: C
explanation:
  summary: 有標籤的驗證集能提供回饋，而不直接參與權重更新。
  correct: 驗證標籤用於計算指標與選擇停止時點，無須直接參與權重更新。這樣能觀察已學權重對未參與擬合資料的表現；因已用於早停，仍不能取代最終測試集。
  wrong:
    A: 驗證標籤透過各輪指標影響停止時點，因而影響最後保留哪一輪的模型。
    B: 驗證資料需要代表希望觀察的部署情境，才能用指標合理地選擇停止時點。
    D: 驗證資料雖不直接更新權重，卻已參與停止時點的選擇，不能取代獨立測試。
