stem: 某保險公司的 AI 建議由審查員覆核。稽核將 20 件含明顯錯誤理由的建議混入演練，發現審查員多因先看到模型高分而直接同意。若要降低對模型的盲從，哪項改善最直接？
options:
  A: 讓審查員先記錄獨立判斷，再比較建議並以錯誤案例驗證覆核
  B: 把模型高分改成醒目的信心圖示，再要求審查員逐件按確認
  C: 縮短每件覆核的目標時間，再以每日確認件數追蹤覆核品質
  D: 加強模型歷史成績的訓練，再以操作人員對模型的信任度驗收
answer: A
explanation:
  summary: 人工覆核須驗證能辨識錯誤，不能只確認有人按下同意。
  correct: 先保留獨立判斷可減少高分提示先形成的影響，再透過差異說明與錯誤案例檢查覆核能力。本例應追蹤錯誤建議被攔下的情況，而不是把確認動作視為有效監督。
  wrong:
    B: 更醒目的高分提示可能強化既有盲從；逐件確認仍不證明有獨立檢查理由。
    C: 確認速度與件數衡量處理效率，無法驗證審查員能否辨識刻意混入的錯誤。
    D: 本例問題是過度信任，強化歷史成績及信任度不會直接證明能識別當前錯誤。
