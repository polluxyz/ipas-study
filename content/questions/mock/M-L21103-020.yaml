stem: 某內部問答服務只回答文件有依據的問題。目前不設最低相關性門檻，每次固定取最接近的 4 段；知識庫沒有相關資料時，仍會塞入 4 段相對接近但無用的文字。若要讓檢索結果能反映「沒有足夠依據」，最適合測試哪項策略？
options:
  A: 將固定段數由 4 增到 20，提供更多候選
  B: 只保留最高分的 1 段，取代原先的 4 段
  C: 對同批候選分數正規化，仍固定取前 4 段
  D: 以驗證查詢校準相關性門檻，容許空結果
answer: D
explanation:
  summary: 固定取前幾名無法表示知識庫是否存在足夠相關資料。
  correct: 最近的文件只是候選間的相對排名，不表示它達到可用的相關程度。以有依據與無依據的查詢校準門檻，容許零段通過，再讓系統回覆資料不足，才有明確的拒答依據。
  wrong:
    A: 增加段數可改善漏找的機會，但知識庫缺少資料時仍會回傳相對最接近的段落，不能直接表示沒有依據。
    B: 減少段落可降低雜訊，卻仍強制選一段；最高分是相對排名，不代表它足以支持答案。
    C: 批內正規化會改變分數尺度，但仍是相對比較；若仍固定取四段，就沒有拒絕無關候選的機制。
