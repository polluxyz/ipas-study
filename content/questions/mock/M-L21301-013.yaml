stem: 某平台有 2,000 位商家，每家各有 12 個月的紀錄。模型將用於從未合作的新商家。團隊若要估計新商家的預測表現，最適合如何建立測試集？
options:
  A: 把每家商家的月份隨機分到訓練與測試，保留各商家的歷史紀錄
  B: 以商家為單位保留測試商家，使其紀錄不出現在訓練資料中
  C: 保留每家商家的最後一個月作測試，其餘月份用於模型訓練
  D: 先把商家識別碼移出特徵，再把各月份紀錄隨機分到測試集
answer: B
explanation:
  summary: 資料切分單位要符合實際要泛化的對象。
  correct: 評估目標是未見過的商家，因此訓練與測試需隔開商家。否則同一商家的固定特性可能同時出現於兩邊，分數反映的是熟悉商家的新紀錄，無法直接代表新商家表現。
  wrong:
    A: 同一商家仍跨越兩份資料，測到的偏向既有商家新月份的表現。
    C: 最後月份切分適合評估既有商家的未來紀錄，沒有隔開新商家的群組差異。
    D: 移除識別碼不會移除其他穩定的商家特性，同商家紀錄仍可能形成相依。
