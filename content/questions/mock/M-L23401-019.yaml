stem: 某聯盟有 40 個客戶端，本地資料不離開裝置。更新已透過加密通道傳送，但聚合伺服器會解密並保存各客戶端的更新。安全目標是讓該伺服器只取得本輪更新的總和，不取得個別更新。客戶端可參與額外協定，最適合採哪項措施？
options:
  A: 輪替傳輸金鑰並改用更短的連線週期
  B: 使用安全聚合並設定協定所需的參與門檻
  C: 對伺服器已保存的個別更新做磁碟加密
  D: 改用數位簽章驗證各客戶端更新的來源
answer: B
explanation:
  summary: 安全聚合保護聚合過程中的個別更新可見性。
  correct: 安全聚合透過多方協定讓伺服器取得整批加總，並隱藏各客戶端的更新。實作需滿足協定對參與數與串通的假設。這對應本例把聚合伺服器本身納入威脅的需求。
  wrong:
    A: 輪替傳輸金鑰可減少通訊金鑰暴露的影響，但伺服器仍是合法解密端，仍看得到個別更新。
    C: 磁碟加密保護離線儲存媒體，不能阻止正常運作的伺服器讀取已解密的個別更新。
    D: 簽章可驗證來源及完整性，不能隱藏更新內容，與限制伺服器可見性的目標不同。
