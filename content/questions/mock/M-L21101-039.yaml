stem: 某文件管理系統先分成「採購、銷售」2 大類，再分到各自的細類。業務規則要求大類與細類一致。目前兩個分類器獨立取最高分，會輸出「採購／客戶退貨」，但客戶退貨屬於銷售。若保留這套階層分類流程，最適合如何調整？
options:
  A: 選出大類後，僅在該大類的合法細類中判定
  B: 校準兩個模型的分數，輸出各自的最高分類別
  C: 加入各模型的信心門檻，通過門檻後獨立分派
  D: 重訓時提高少見細類權重，沿用各模型獨立輸出
answer: A
explanation:
  summary: 階層分類的輸出須遵守父類與子類的對應。
  correct: A 在細類判定時限制候選集合，直接排除不屬於所選大類的組合。大類本身仍可能判錯，但不會再因獨立選擇而產生不合法的父子配對。
  wrong:
    B: 機率校準改善分數與實際正確率的對應，沒有強制父子類別相容，兩邊最高分仍可能衝突。
    C: 門檻可拒絕低信心結果，但兩個互相衝突的結果也可能同時超過門檻。
    D: 類別權重處理訓練時不同類別的重要性，不能取代輸出端的合法組合限制。
