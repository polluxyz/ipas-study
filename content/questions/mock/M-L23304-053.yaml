stem: 某模型單獨做剪枝或單獨做量化，都在同一驗證流程達到 92% 的準確率要求。團隊還要減少容量，打算把兩種技術串在同一模型。對合併方案的品質驗收，哪項安排最適合？
options:
  A: 採兩個單獨版本中較高的準確率作為合併結果
  B: 採兩個單獨版本的平均準確率作為合併結果
  C: 對合併模型重測準確率，必要時調整壓縮與微調
  D: 對合併模型只測容量，沿用兩個單獨版本的品質結論
answer: C
explanation:
  summary: 壓縮技術可合用，但單獨通過不代表組合也通過。
  correct: 剪枝會改變模型結構或權重，量化又會引入數值近似。兩者串接後的誤差可能互相影響，應對實際交付的合併模型重新驗收，並保留調整壓縮程度及微調的空間。
  wrong:
    A: 較高的單獨準確率不是合併模型的量測值，不能用來證明新的權重與運算流程達標。
    B: 取平均不會模擬兩種壓縮對同一模型的交互影響；合併後品質可能低於兩者。
    D: 容量合格只能證明資源條件符合，無法證明經過兩次壓縮的模型仍保有足夠準確率。
