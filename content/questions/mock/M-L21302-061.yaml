concepts: [distribution-drift-detection, model-monitoring]
stem: |
  某補貨模型只比較「本週」與「前週」的輸入分布。連續 8 週的相鄰差異都未達告警線，但本週與上線驗收期的差異已很大，成熟標籤也顯示誤差逐月增加。若要捕捉這類緩慢累積的變化，最適合如何調整監控？
options:
  A: "保留相鄰週比較，另加固定驗收期的分布與品質比較"
  B: "縮短相鄰比較視窗，改成只比較相鄰兩天的分布差異"
  C: "每週以最新分布更新驗收基準，重設累積的差異紀錄"
  D: "改用每週服務延遲的長期趨勢，作為是否啟動重訓的依據"
answer: A
explanation:
  summary: "辨識移動參考期可能漏掉的累積漂移。"
  correct: "相鄰兩週差異小，不代表相對上線時的偏移也小。保留固定驗收參考可呈現累積變化，再結合成熟標籤的誤差判斷是否需要調查與重訓。"
  wrong:
    B: "縮到相鄰兩天可能讓每次差異更小，仍沒有衡量相對原驗收分布的累積變化。"
    C: "基準持續追隨新分布，會把尚未確認可接受的偏移吸收為正常狀態。"
    D: "延遲的長期趨勢可呈現服務效能，但不能呈現輸入相對驗收期的偏移或預測品質變化。"
guide_refs: [guide-1:5-19, guide-1:5-20]
