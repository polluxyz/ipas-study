stem: |
  某團隊要儲存 1,200×600 的資料矩陣，改存低秩近似的兩個因子，形狀為 1,200×20 與 20×600。每個數值占用空間相同，只計兩個因子的數值，不存原矩陣及其他資訊。相較原矩陣，所需空間約為多少？
options:
  A: 原空間的 3.3%
  B: 原空間的 5.0%
  C: 原空間的 50.0%
  D: 原空間的 95.0%
answer: B
explanation:
  summary: 低秩表示的空間成本，要加總兩個因子的元素數。
  correct: 原矩陣有 1,200×600=720,000 個數。兩個因子合計為 1,200×20+20×600=36,000 個數，占 36,000/720,000=5%。節省比例則是 95%，兩者不可混淆。
  wrong:
    A: 只計 1,200×20 的 24,000 個數才約為 3.3%。還需要第二個因子的 12,000 個數才能重建近似矩陣。
    C: 50% 不能由因子的元素數得到。兩個因子並不表示各占原空間一半，須按實際形狀計算。
    D: 95% 是省下的空間比例，不是儲存因子所需的比例。題目問所需空間，答案應為 5%。
