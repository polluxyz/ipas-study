stem: 某團隊用同一批年齡與消費額資料比較近鄰分類器與一般數值分裂的決策樹。消費額比年齡大數千倍，改做逐欄標準化後，近鄰名單改變，但決策樹可沿用相同的樣本排序尋找分裂。哪項解釋最正確？
options:
  A: 標準化會刪除無關特徵，近鄰因而更集中於有效的欄位
  B: 標準化會將右偏分布轉為常態，近鄰因而變得較穩定
  C: 標準化會解除特徵間的相關性，近鄰因而不受共線性影響
  D: 近鄰依距離判斷相似度，樹依各欄排序選擇分裂
answer: D
explanation:
  summary: 同一縮放對距離式模型與樹模型的作用不同。
  correct: 逐欄縮放會改變各特徵對歐氏距離的相對貢獻，近鄰可能改變。正向線性縮放保留各欄的大小順序，因此數值樹可在對應位置切出相同樣本群。
  wrong:
    A: 標準化調整各欄的位置與尺度，不會依預測能力刪除欄位；特徵選擇是另一個步驟。
    B: 標準化不保證把偏態分布變成常態；本例的近鄰改變來自距離中各欄相對尺度的改變。
    C: 逐欄標準化不會消除特徵間的相關性，不能據此認定共線性問題已解決。
