stem: 某評論分類器使用原始次數乘上逆文件頻率。促銷詞在單篇重複 200 次時，影響遠大於出現 20 次。團隊要保留次數的大小關係，但讓每次增加的貢獻逐漸減少，並沿用既有詞彙與逆文件頻率。哪項調整最適合？
options:
  A: 將正詞頻 tf 改成 1 + log(tf) 後再加權
  B: 將正詞頻 tf 改成 tf 的平方後再加權
  C: 將每個詞的計數改成是否出現後再加權
  D: 將各詞次數除以訓練資料中該詞最大次數再加權
answer: A
explanation:
  summary: 次線性詞頻可保留重複次數差異，並減緩權重成長。
  correct: 1 + log(tf) 隨正詞頻增加而增加，但成長速度逐漸減慢。重複 200 次與 20 次仍有不同權重，差距卻不再是原始詞頻的 10 倍。零次詞仍維持零權重。
  wrong:
    B: 平方會放大高詞頻的影響，重複促銷詞對權重的支配反而更強。
    C: 二元值把出現 20 次與 200 次視為相同，無法保留題目要求的次數差異。
    D: 每個詞都除以固定常數，次數增加時權重仍等比例增加，不會產生逐漸減少的邊際貢獻。
