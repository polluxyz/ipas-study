codes: [L21103]
concepts: [synthetic-content-authenticity, generative-content-rights]
stem: |
  某新聞平台收到一張城市淹水圖片。檔案附有可信製作方簽署的來源紀錄，記載圖片經 AI 生成；驗證也確認圖片與該紀錄相符，簽署後未被變更。編輯尚未查到現場報導。對於這份驗證結果，下列判斷何者最正確？
options:
  A: 可證明畫面中的淹水地點與當下水位符合現況
  B: 可證明製作時使用的素材已具備完整商業授權
  C: 可核對簽署來源與檔案完整性，尚不能證實災情
  D: 可確認圖片經過事實查核，適合作為災情的證據
answer: C
explanation:
  summary: 來源與完整性驗證的範圍不同於內容事實查核。
  correct: 驗證能支持來源紀錄與目前檔案的關聯，以及簽署後的完整性。紀錄已指出圖片由 AI 生成，災情是否發生仍需要獨立的現場或其他可靠證據。
  wrong:
    A: 來源紀錄沒有量測現場水位，也沒有確認圖片地點。檔案未被變更不能證明畫面符合現況。
    B: 簽署來源與素材授權是不同的證據。題目沒有提供素材清單、授權範圍或權利查核結果。
    D: 簽署與完整性檢查不等於事實查核。製作方也能為虛構場景簽署來源紀錄。
