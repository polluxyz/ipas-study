stem: |
  某瑕疵分類器的非負特徵圖中，細小亮點會產生少數高反應。任務只判斷區域內是否出現亮點，不需估計亮點面積。驗證已確認背景雜訊不會產生高反應，但平均池化常把亮點稀釋。若保持相同池化視窗與輸出尺寸，最適合優先試哪項調整？
options:
  A: "改取視窗內最小反應，保留區域中最弱的特徵值"
  B: "改取視窗內最大反應，保留區域中最強的特徵值"
  C: "改取視窗內反應中位數，保留區域中居中的特徵值"
  D: "改取視窗內反應的幾何平均，保留區域的乘積摘要"
answer: B
explanation:
  summary: "依稀疏且可靠的局部反應選擇池化摘要。"
  correct: "題設的目標是保留少數高反應是否存在，且已排除背景高反應的干擾。最大池化可保留視窗內最高值，較符合這種存在性判斷；若目標改成面積或平均強度，選擇可能不同。"
  wrong:
    A: "最小值著重最弱反應，少數高反應不會提高最小值，因此容易忽略亮點。"
    C: "亮點只占少數位置時，中位數仍可能接近背景，無法處理高反應被多數背景稀釋的問題。"
    D: "幾何平均仍整合整個視窗；若背景反應接近零，少數亮點也難以在摘要中保留高值。"
guide_refs: [guide-3:4-68, guide-3:4-69]
