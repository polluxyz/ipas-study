stem: 某團隊用梯度下降最小化 L(w)=(w-3)²。初始 w=1，學習率 0.1，以下只更新 1 次。程式印出的數值最接近多少？
options:
  A: "1.4"
  B: "0.6"
  C: "3.0"
  D: "1.2"
answer: A
explanation:
  summary: 梯度下降更新。
  correct: w=1 時梯度為 2×(1-3)=-4。依 w←w-0.1×梯度，得到 1-0.1×(-4)=1.4。
  wrong:
    B: 這把梯度更新方向反轉為加上梯度，會往遠離此最小值的方向移動。
    C: 單次固定學習率更新不等於直接求出最小值；本次只走到 1.4。
    D: 這是漏掉平方微分產生的係數 2，只使用 w-3 當梯度。
guide_refs:
