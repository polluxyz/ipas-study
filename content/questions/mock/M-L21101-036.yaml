stem: 某客服搜尋每次顯示 5 筆文件。甲、乙系統對每個測試問題都能在前 5 筆找到 1 筆正確文件，但甲常排第 1，乙常排第 5。使用者找到第一筆正確文件便停止閱讀。若要區分這種差異，下列哪項評估最適合？
options:
  A: 計算首筆正確文件名次倒數的查詢平均
  B: 計算前 5 筆至少命中一次的查詢比例
  C: 計算前 5 筆命中數占全部相關文件的比例
  D: 計算前 5 筆中正確文件占回傳文件的比例
answer: A
explanation:
  summary: 首筆正確結果的名次能反映找到答案前的閱讀負擔。
  correct: 名次倒數對第 1 名記為 1、第 5 名記為 0.2，再跨查詢平均，能區分兩者。這對應平均倒數排名，適合重視首筆相關結果的搜尋任務。
  wrong:
    B: 前 5 筆是否命中只判斷有無，兩系統都命中，無法區分正確文件的排序。
    C: 召回比例計算找到多少相關文件。本題兩系統找到的數量相同，改變名次不會改變此比例。
    D: 前 5 筆精確率在兩者均為 1/5，不包含正確文件位於第幾名的資訊。
