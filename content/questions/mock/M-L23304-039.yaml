stem: 某卷積層以整個權重張量共用尺度做對稱 8 位元量化。一組輸出通道的權重約介於 -8 與 8，另一組約介於 -0.02 與 0.02。後者大量被捨入為 0，且沒有超出量化範圍。部署引擎支援每個輸出通道使用獨立尺度。若維持 8 位元，最適合優先測試哪項修正？
options:
  A: 擴大全張量的共同範圍後重做量化
  B: 提高剪枝比例後沿用共同量化尺度
  C: 依各輸出通道的範圍設定量化尺度
  D: 增加校準樣本後保留現有權重尺度
answer: C
explanation:
  summary: 共用尺度可能使小幅值通道失去有效解析度。
  correct: 大幅值通道決定共用尺度時，量化間距可能大於小幅值通道的權重。每通道尺度能讓小幅值通道使用較細間距，再驗證品質與引擎執行結果。
  wrong:
    A: 擴大共同範圍會增加相鄰整數代表的權重差距，反而更容易把小權重捨入為 0。
    B: 剪枝會移除權重，不能改善剩餘小幅值權重的數值解析度。
    D: 本例已指出問題來自固定的權重尺度。增加樣本但保留該尺度，無法改變小權重的編碼間距。
