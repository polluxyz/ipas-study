stem: 某訓練流程在連續 3 輪驗證損失未改善時降學習率，卻在連續 2 輪未改善時早停。過去試驗顯示，降率後還需 2 輪才可能出現改善。團隊希望保留早停，又能評估降率效果。最適合如何調整？
options:
  A: 延長早停容忍輪數，涵蓋降率時點及之後的觀察輪數
  B: 縮短早停容忍輪數，讓停止點更接近驗證損失最低點
  C: 延後降率觸發輪數，維持目前早停容忍輪數
  D: 提高降率後的學習率，維持目前早停容忍輪數
answer: A
explanation:
  summary: 早停與降學習率必須共同安排觀察時間。
  correct: 目前早停先於降率發生，根本無法觀察降率效果。延長容忍輪數，才能讓排程觸發並留下恢復改善的時間。
  wrong:
    B: 更早停止會讓降率策略更沒有機會生效。
    C: 延後降率仍會被原本的早停截斷，兩者的先後衝突未解決。
    D: 修改降率幅度不會改變第 2 次未改善就停止的事實，流程仍到不了降率時點。
