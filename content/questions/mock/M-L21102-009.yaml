stem: 某賣場以每秒 20 張影像統計顧客停留時間。逐張偵測框相當準確，但同一位顧客跨影格沒有固定編號，系統把連續出現視為多位顧客。最適合新增哪項處理？
options:
  A: 提高逐張偵測的信心門檻後再統計框數
  B: 對每張影像分割人物像素後再統計面積
  C: 對逐張人物框執行非極大值抑制再計數
  D: 建立跨影格的物件關聯與持續軌跡編號
answer: D
explanation:
  summary: 跨影格停留統計需要物件身分的持續關聯。
  correct: 視覺追蹤利用位置、運動或外觀等資訊，把不同影格的偵測結果連成同一條軌跡。持續的軌跡編號才可用來估計每位顧客的停留時間。
  wrong:
    A: 門檻可減少低信心框，卻沒有建立跨影格的同一人對應，不能把框數當成獨立顧客數。
    B: 分割能改善人物區域範圍，但若不做跨影格關聯，仍無法知道兩張圖中的人物是否相同。
    C: 非極大值抑制主要處理單張影像的重複框，不會建立不同時間的人物軌跡。
