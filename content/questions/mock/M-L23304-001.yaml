code: |
  import numpy as np
  from sklearn.model_selection import GridSearchCV
  from sklearn.svm import SVC
  X = np.arange(48, dtype=float).reshape(24, 2)
  y = np.array([0, 1] * 12)
  search = GridSearchCV(SVC(), {"C": [0.1, 1, 10], "gamma": [0.01, 0.1]},
                        cv=4, refit=True, n_jobs=1)
  search.fit(X, y)
