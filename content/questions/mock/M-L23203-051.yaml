stem: 某團隊凍結視覺骨幹，只訓練分類頭。原流程每輪對影像重新隨機裁切，標籤在合理裁切下不變。團隊想把每張原圖只算 1 次骨幹特徵並快取，以精確重現原本的每輪裁切訓練。最正確的判斷為何？
options:
  A: 單一快取固定骨幹看到的視角，原流程則逐輪使用新裁切的特徵
  B: 單一快取和原流程都逐輪取得新裁切影像的骨幹特徵
  C: 單一快取在分類頭初始化時，就重現原流程的逐輪視角變化
  D: 單一快取和原流程只在梯度計算不同，前向特徵保持相同
answer: A
explanation:
  summary: 固定權重仍會對不同影像輸入產生不同特徵。
  correct: 隨機裁切改變骨幹的輸入。每張圖只存 1 組特徵會失去逐輪變化的視角；若接受這項變動，仍須把它當成不同訓練方案驗證。
  wrong:
    B: 讀取每張圖的單一快取不會重新處理當輪裁切，無法取得新裁切的骨幹特徵。
    C: 初始化影響分類頭起點，不會產生不同裁切的空間內容。
    D: 裁切先改變影像內容與前向特徵，即使不算骨幹參數梯度也有作用。
