stem: 某文件分類器目前只支援 8 類。新收到的保險文件不屬於這 8 類，卻常被判為「採購」，且分數偏高。系統須把範圍外文件轉給專人。團隊已收集各種範圍外案例，最適合增加哪項機制？
options:
  A: 校準已知 8 類的機率，以最高分決定每份文件類別
  B: 訓練資料加入各已知類的同義詞，推論維持 8 類分類
  C: 以已知類與範圍外案例驗證拒判規則，再接人工分流
  D: 將 8 類訓練量調成相同，沿用現有的分類輸出方式
answer: C
explanation:
  summary: 有限類別分類器需要另驗證範圍外文件的拒判能力。
  correct: C 把未知文件能否被辨認並分流納入驗證。既有分類分數偏高，不能假設只選最大值就能辨識範圍外資料，拒判規則也不能只在已知類上評估。
  wrong:
    A: 已知類上的校準可改善機率品質，但最後仍強制選出一個已知類，沒有範圍外文件的分流結果。
    B: 同義詞增強可增加已知類的語言變化，卻沒有建立範圍外判定目標，仍將新文件塞入已知類。
    D: 等量取樣處理已知類之間的不平衡，沒有加入拒判結果，範圍外文件仍會被分派到已知類。
