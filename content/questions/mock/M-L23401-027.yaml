stem: 某公司每週發布一次通過差分隱私設計的分區人數表。週內資料與報表需求不變，但儀表板每天有 200 次重新整理。團隊希望減少重複發布造成的隱私預算消耗，又保留原有分區資訊。哪項設計最適合？
options:
  A: 每次整理都對原始計數重新加噪，回傳新的分區表
  B: 每次整理都讀取本週已發布的同一份加噪分區表
  C: 每次整理都產生一份新加噪表，再平均歷次結果
  D: 每次整理都改用新的亂數種子，重跑原始計數查詢
answer: B
explanation:
  summary: 同一發布結果的重用，可避免為未變的需求反覆建立新發布。
  correct: 本週已發布的表不需再次讀取私有原始資料，重複顯示同一份結果不會新增一次獨立的資料發布。若每次都重新查詢並產生新雜訊，則必須評估這些新發布的累積隱私損失。
  wrong:
    A: 重新加噪仍是新的私有資料發布，不能因查詢內容相同就忽略累積隱私預算。
    C: 多次獨立加噪結果的平均會減少雜訊影響，不能只按單次發布的隱私成本估計。
    D: 更換亂數種子會產生新的隨機結果，不會重設已使用的隱私預算；原始資料的每次新查詢仍需納入評估。
