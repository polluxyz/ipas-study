stem: 某團隊用詞頻建立樸素貝氏郵件分類器。詞彙「保固」已在詞彙表中，但在 300 封正常郵件內出現 0 次，於 200 封垃圾郵件內出現多次。未使用平滑時，一封含「保固」的郵件即使其他詞很像正常郵件，其正常類別的似然乘積仍變成 0。最直接的修正為何？
options:
  A: 將各類別最後分數除以總分數，重新正規化類別分數
  B: 對各類別的詞頻加入拉普拉斯平滑，重新估計條件機率
  C: 只提高正常類別的先驗機率，保留各詞的條件機率
  D: 將每封信的詞頻除以該信總詞數，保留原有零計數
answer: B
explanation:
  summary: 處理樸素貝氏的零計數問題。
  correct: 拉普拉斯平滑在計數中加入偽計數，並相應調整分母，使已知詞彙在某類別內未出現時仍有非零條件機率。這能避免單一零值讓整個乘積歸零。
  wrong:
    A: 正規化改變分數的共同尺度，零分數除以正總分仍是零，無法補上零計數。
    C: 非零先驗乘以零似然仍為零。只調先驗無法處理某個詞的條件機率為零。
    D: 詞頻縮放後，原本為零的計數仍為零，沒有提供未出現詞的平滑估計。
