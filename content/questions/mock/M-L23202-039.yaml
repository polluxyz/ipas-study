stem: 某維修平台使用線性支援向量機，輸出 decision_function 分數。1 筆案件得分為 2.4，系統要顯示可供成本決策使用的故障機率。團隊另有具代表性、未參與擬合的標註資料。下列處理何者最適合？
options:
  A: 將分數除以這批案件的最高分數，再當成故障機率
  B: 將分數直接送入 Sigmoid 函數，再當成故障機率
  C: 用保留資料擬合分數到機率的校準映射，再檢查校準
  D: 用分數是否大於 0 產生 0 或 1，再當成故障機率
answer: C
explanation:
  summary: 支援向量機的決策分數須經驗證，才能作為機率使用。
  correct: 決策分數反映分類邊界的位置，數值 2.4 本身不是故障機率。以未參與模型擬合的資料估計校準映射，才能檢查預測機率與實際頻率是否相符。
  wrong:
    A: 除以批次最大值會使同一案件的結果受其他案件影響，也沒有建立分數與事件頻率的關係。
    B: 固定的 Sigmoid 只把分數壓入 0 到 1，未估計適合該模型與資料的斜率及截距。
    D: 閾值化得到的是類別決策，0 或 1 無法表示各案件的風險程度。
