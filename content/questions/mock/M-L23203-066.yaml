stem: 某設備有兩種操作：「先升溫再升壓」與「先升壓再升溫」。兩種操作各感測值的平均與最大值相同，安全結果卻不同。現有分類器只接收這些彙總值。若要讓循環網路辨識差異，最適合如何準備輸入？
options:
  A: 按採樣時間輸入讀值序列，保留各步之間的順序
  B: 按感測值大小排序讀值，形成規律一致的序列
  C: 把各項平均值與最大值重複輸入多個時間步
  D: 以各項平均值與最大值建立更多隱藏層輸入
answer: A
explanation:
  summary: 先後次序屬於輸入資訊，模型無法從相同彙總值還原。
  correct: 兩種操作的差異在發生次序。保留按時間排列的讀值後，循環狀態才有機會學到升溫與升壓的先後關係。
  wrong:
    B: 依數值大小排序會改變事件順序，可能把兩種不同操作轉成相同表示。
    C: 重複相同彙總值沒有增加時間資訊，循環計算也不能還原已丟失的次序。
    D: 增加層數可增加運算能力，但相同彙總輸入仍無法區分這兩種操作。
