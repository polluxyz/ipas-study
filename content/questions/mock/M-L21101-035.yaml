stem: 某文字檢索庫用甲模型建立 768 維文件向量。新版查詢改用獨立訓練的乙模型，也輸出 768 維向量，但未做跨模型對齊。搜尋結果因而失準。若決定採用乙模型，最適合如何恢復同一語意空間中的比較？
options:
  A: 以乙模型配套流程重編文件，重建檢索索引
  B: 將甲文件與乙查詢向量各自正規化為單位長度
  C: 依兩套向量各自的維度均值與標準差做標準化
  D: 調高甲文件與乙查詢之間的餘弦相似度門檻
answer: A
explanation:
  summary: 向量維度相同不代表獨立模型的語意座標一致。
  correct: 文件與查詢須使用相容的表示空間。改用乙的文件編碼流程重建索引，才能與乙的查詢表示配套；相同維度只保證運算形狀相容。
  wrong:
    B: 單位長度正規化處理向量大小，不會學得甲、乙之間的語意座標對應。
    C: 逐維標準化調整尺度與中心，不會建立獨立模型之間缺少的語意對齊。
    D: 提高門檻會改變回傳數量，但不能修正相似度已失去語意對應的問題。
