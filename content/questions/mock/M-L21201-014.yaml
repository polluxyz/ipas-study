concepts: [it-readiness, data-readiness]
stem: |
  某租賃商希望 AI 每 10 分鐘依最新剩餘設備調整報價。現有系統只在月底匯出一次庫存報表，尚未確認是否能讀取日內庫存變動。廠商已用完整歷史資料展示良好預測分數。正式評估投入前，最應優先查證哪個條件？
options:
  A: 歷史報表能否加入更多月份，以改善長期季節性的估計
  B: 庫存變動能否及時取得，並以可用介面供報價流程使用
  C: 預測模型能否再增加參數，以改善歷史報表的擬合程度
  D: 推論伺服器能否增加副本，以提高同時報價的服務容量
answer: B
explanation:
  summary: 即時決策的可行性取決於決策當下能否取得所需資料。
  correct: 每 10 分鐘調整報價需要相應的新庫存資訊。月底報表與歷史展示不能證明這項條件成立，必須查證變動資料的取得頻率與接入方式。
  wrong:
    A: 增加歷史月份可協助分析季節性，但不能提供當天設備已出租或歸還的變動。
    C: 模型容量可影響資料擬合，卻無法讓尚未取得的日內庫存自動出現在輸入中。
    D: 增加副本可提高服務容量，但每個副本仍需有效的最新庫存輸入，不能替代資料更新條件的查證。
guide_refs: [guide-1:4-4, guide-1:4-7]
author: codex
review:
  status: verified
  blind_answer: B
