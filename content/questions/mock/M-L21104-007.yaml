stem: 某倉儲機器人融合攝影機與雷達偵測棧板。兩者已同步到同一時刻，但攝影機位置以影像像素表示，雷達位置以裝置前方的公尺表示。直接依座標數值接近程度配對後，同一棧板常被當成 2 個物件。最應優先採取哪項處理？
options:
  A: 提高兩種感測器的取樣頻率，依原座標重新配對
  B: 校正感測器的空間對應，轉至可比較的座標後配對
  C: 將兩種座標各自標準化，再依數值接近程度配對
  D: 降低重複物件的判定門檻，依原座標合併相近結果
answer: B
explanation:
  summary: 時間同步後，仍須建立跨感測器的空間對應。
  correct: 影像像素與雷達的公尺座標描述不同空間基準。先校正感測器的相對位置與投影關係，才能判斷兩筆觀測是否屬於同一棧板。單位縮放不能取代幾何對應。
  wrong:
    A: 增加取樣頻率改善時間密度；本例已同步，錯誤來自空間基準不同。
    C: 各自標準化只改變數值尺度，未建立像素與實際位置的投影關係。
    D: 調整合併門檻仍比較不相容的座標，可能把不同棧板合併，不能修復配對依據。
