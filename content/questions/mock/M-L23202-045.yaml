stem: 某公司要每天重訓 300 棵樹的分類模型。隨機森林與逐輪修正誤差的梯度提升樹，驗證品質都已達標。公司有多個可同時工作的處理器，希望把不同樹的建置工作獨立分派。就兩種方法的訓練相依關係而言，下列判斷何者最正確？
options:
  A: 優先選梯度提升樹，將各輪的殘差模型獨立建置
  B: 兩種方法相同，各棵樹都要等前一棵的預測結果
  C: 兩種方法相同，將樹數平均分配便可獨立完成
  D: 優先選隨機森林，將不同抽樣的樹獨立建置
answer: D
explanation:
  summary: 跨樹的平行訓練需考慮樹與樹之間的相依關係。
  correct: 隨機森林各棵樹不必依前一棵的誤差建立，因此可分派獨立的建樹工作。這符合題目的平行工作需求，但實際加速仍受資料傳輸與硬體影響。
  wrong:
    A: 梯度提升的後續樹需要目前集成的誤差資訊，不能把不同輪次視為獨立工作。
    B: 隨機森林不需等待前一棵樹的預測；這種先後相依主要出現在逐輪提升。
    C: 平均分配樹數不會解除提升輪次的相依。提升法可平行處理部分建樹運算，但不等於各輪獨立。
