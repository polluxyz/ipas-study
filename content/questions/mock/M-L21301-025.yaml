stem: 某團隊比較工單分類模型與基準模型。基準模型在舊產品的 2,000 件驗證資料上 F1 為 0.86；新模型在新增產品的另一批 2,000 件資料上為 0.89。兩批都沒有參與訓練，但產品組合不同。若要判斷新模型是否優於基準，哪項比較最適合？
options:
  A: 以同一批代表目標產品的保留資料，評估兩個模型
  B: 以兩批資料各自的分數，挑選目前 F1 較高的模型
  C: 以兩批資料各自的分數，按樣本數加權後判斷差距
  D: 以兩批資料各自的分數，按類別比例校正後判斷差距
answer: A
explanation:
  summary: 比較模型須控制評估資料的差異。
  correct: 兩個分數同時受到模型及產品組合影響，無法直接把差額歸給模型。應使用同一批能代表目標場景的保留資料和相同指標，讓兩個模型面對可比較的條件。
  wrong:
    B: 0.89 較高可能來自新增產品較容易分類，而非新模型較好；各自不同的驗證集不足以支持排名。
    C: 樣本數加權不能移除產品組合差異，且兩批樣本數相同，仍缺少在共同資料上的模型比較。
    D: 即使調整類別比例，產品本身的特徵、類內難度與模型適用範圍仍可能不同，不能只憑校正後的個別分數排名。
