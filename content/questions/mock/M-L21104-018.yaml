stem: 某圖文分類器做決策融合。影像輸出順序為「正常、異常」，機率為 (0.9,0.1)；文字輸出順序為「異常、正常」，機率為 (0.2,0.8)。兩路在各自測試中都表現正常，但直接逐位置平均後常判成不確定。最應先修正哪項處理？
options:
  A: 各分支只保留最大機率，再平均成單一分數
  B: 把文字機率先換成對數，再與影像機率平均
  C: 按類別名稱重排兩路機率，再進行決策融合
  D: 提高影像的固定權重，再對原位置直接平均
answer: C
explanation:
  summary: 決策融合前須確認每個位置代表相同類別。
  correct: 文字向量換成「正常、異常」順序後是 (0.8,0.2)，兩路其實都支持正常。直接逐位置平均把不同類別混在一起，應先對齊類別，再依約定融合。
  wrong:
    A: 只保留最大值會失去該值所屬的類別，無法判斷兩路支持的是否同一類。
    B: 對數轉換可用於特定融合公式，但不會修正同一位置代表不同類別的問題。
    D: 提高權重會減少文字影響，仍然在混合不同類別的位置，沒有修正對應錯誤。
