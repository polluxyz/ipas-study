stem: |
  某工廠原本在收完 60 秒訊號後，使用雙向遞迴神經網路判斷整段是否異常。新需求改成每秒立即輸出警報，只能使用當下與過去訊號。團隊打算沿用原模型在完整片段中各秒的輸出。針對新需求，下列調整何者最適合？
options:
  A: 改用只讀取已到達訊號的模型，並按即時警報流程重新驗證
  B: 保留完整片段的反向分支，改以較大的訓練批次降低警報延遲
  C: 保留完整片段的雙向輸出，改以隨機切分各秒資料驗證警報
  D: 保留完整片段的輸入範圍，改以較低的警報門檻提早輸出
answer: A
explanation:
  summary: 判斷雙向序列表示與即時資料可用時間是否相容。
  correct: 完整片段的反向分支會讀取該秒之後的訊號，現場當下還拿不到這些資料。應改用只依可取得歷史做預測的設計，再依相同時間限制驗證。
  wrong:
    B: 訓練批次大小不會改變反向分支需要後續訊號的條件。
    C: 隨機切分不能消除完整片段內的未來資訊，評估仍不符合即時條件。
    D: 降低門檻只改變決策方式，不會讓尚未到達的訊號提早可用。
