stem: 某工廠以壓力預測閥門失效。99% 讀值低於 80，少數讀值為 110 至 130。維修紀錄確認高值真實，且多發生於失效前。主管提議把超過 80 的值都改成 80。若目標是保留早期預警訊號，哪項處理最適合？
options:
  A: 改以平均壓力填補高值，以降低尾端對模型的影響
  B: 刪除高值所在紀錄，以符合主要壓力範圍的分布
  C: 將高值截成 80，以提高失效前讀值的一致程度
  D: 保留合法高值並評估高壓標記，另驗證失效召回率
answer: D
explanation:
  summary: 罕見但真實的極端值可能是預測目標的重要訊號。
  correct: 題幹已確認高壓是真實現象，並與失效前狀態有關。保留高值可讓模型利用幅度差異，高壓標記則可作為額外候選特徵。應以獨立資料比較失效召回率，而非只為了分布整齊就截斷。
  wrong:
    A: 平均值填補適合處理特定缺值或錯誤值，會抹去本例已確認真實的高壓訊號。
    B: 刪除高值會減少失效前的重要樣本，讓訓練資料更難代表預警情境。
    C: 截成 80 會把不同程度的高壓混為相同數字，本例沒有證據顯示這樣有利於預警。
