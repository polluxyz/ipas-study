stem: 某設備預警資料有 10,000 筆，其中實際故障為 100 筆。基準模型全部預測為未故障。若以故障為正類，準確率與故障召回率分別為多少？
options:
  A: 99% 與 99%
  B: 1% 與 0%
  C: 0% 與 100%
  D: 99% 與 0%
answer: D
explanation:
  summary: 不平衡分類的指標選擇。
  correct: 判對的 9,900 筆全是未故障，所以準確率為 9,900/10,000=99%。100 筆故障一筆都沒抓到，因此召回率為 0/100=0%。
  wrong:
    A: 準確率的分母是全部資料；召回率只看實際故障，不能沿用 99%。
    B: 1% 是故障盛行率。本模型判對的是未故障的 99%，不是故障比例。
    C: 本模型沒有抓到故障，也沒有把全部資料都判錯；兩個值均與計數不符。
