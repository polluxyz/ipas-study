stem: |
  某企業完成 20,000 份文件的標註。團隊依模型信心分成高信心與低信心兩層，各層內隨機抽查，再由專家獨立判讀。結果如下。

  | 信心層 | 整批文件數 | 抽查數 | 標註錯誤數 |
  | --- | --- | --- | --- |
  | 高信心 | 18,000 | 100 | 2 |
  | 低信心 | 2,000 | 100 | 20 |

  若以各層抽查錯誤率估計該層錯誤率，整批文件的標註錯誤率估計值最接近多少？
options:
  A: 約 11.00%，按抽查筆數合併錯誤比例
  B: 約 18.20%，依兩層比例與各層錯誤率加權
  C: 約 3.80%，按各層占整批的文件比例加權
  D: 約 0.11%，將抽查錯誤數除以整批文件數
answer: C
explanation:
  summary: 分層抽查的整體錯誤率，須依各層在整批中的比例加權。
  correct: 高信心層的錯誤率估計為 2/100，低信心層為 20/100。兩層占整批的比例分別為 0.9 與 0.1，因此整體估計為 0.9×0.02＋0.1×0.20＝0.038，即 3.80%。兩層抽查數相同，不代表兩層在整批中等權。
  wrong:
    A: 22/200＝11% 是抽查資料中的錯誤比例。低信心層占抽查的一半，卻只占整批的 10%，不能直接用此比例估計整批。
    B: 此計算交換了兩層的權重。占整批 90% 的是高信心層，應把較低的錯誤率乘上 0.9。
    D: 22 件只是抽查找到的錯誤，未涵蓋沒有抽中的文件。須先估計各層錯誤率，再推估整批比例。
