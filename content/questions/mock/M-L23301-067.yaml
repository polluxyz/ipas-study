stem: 某企業用模型預標註 20,000 份文件，再由人員確認。團隊有預算另請專家覆核 200 份，目的是估計整批確認後仍有多少標籤錯誤。文件沒有群組限制，專家可獨立判讀。下列抽查方式何者最適合？
options:
  A: 抽查模型信心最低的 200 份文件
  B: 抽查人員修改過預標籤的 200 份文件
  C: 從整批文件隨機抽取 200 份再獨立判讀
  D: 抽查原模型重新預測時標籤改變的 200 份文件
answer: C
explanation:
  summary: 估計整批殘留標註錯誤，需要涵蓋整批的抽樣方式。
  correct: 本例要估計整體錯誤比例。從整批隨機抽取，再由專家獨立判讀，可涵蓋未修改及高信心文件內的隱藏錯誤。
  wrong:
    A: 低信心樣本適合尋找疑難案例，但其錯誤比例不能直接代表整批文件。
    B: 被修改過的文件不是整批的隨機樣本。人員直接接受的預標籤也可能錯誤。
    D: 只抽預測改變的文件，會集中於模型不穩定的案例，也無法發現持續被錯分的文件。
