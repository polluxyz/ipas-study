stem: 某團隊固定兩個已訓練的分類器，在同一批 800 位獨立受測者上比較準確率差。每人同時有甲、乙的預測。團隊要用有放回抽樣估計這個差值的不確定性。為保留同一人上的錯誤相關性，哪項抽樣方式最適合？
options:
  A: 每輪抽受測者索引，同步取出該人的標籤與兩個預測
  B: 每輪分開抽甲乙的預測索引，再各自計算準確率相減
  C: 每輪固定受測者標籤，打亂兩個模型預測後再相減
  D: 每輪只抽甲模型判對的人，再比較兩模型準確率差
answer: A
explanation:
  summary: 比較同一批樣本上的兩個模型，要保留配對關係。
  correct: 同一受測者的標籤與兩個預測構成一組配對資料。每輪用同一組抽樣索引計算兩個準確率，再取差，可保留兩模型在同一人上的錯誤相關性。本例估計固定模型在受測母體上的差異，不包含重新訓練造成的變異。
  wrong:
    B: 分開抽樣會破壞同一人的配對關係，不能保留題幹要求的錯誤相關性。
    C: 打亂預測與標籤的對應會改變原有的預測正誤，不是在重抽既有受測者。
    D: 只選甲判對的人會引入依模型表現選樣的偏誤，不再代表原受測母體。
