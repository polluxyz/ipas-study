stem: 某團隊在相同 400 筆測試資料上比較甲、乙分類器。兩者都答對 150 筆，都答錯 50 筆，只有甲答對 180 筆，只有乙答對 20 筆。若只求甲減乙的準確率差，不做統計顯著性推論，哪項計算最正確？
options:
  A: (180−20)/400=40 個百分點。
  B: (180−20)/(180＋20)=80 個百分點。
  C: (150＋180)/400=82.5 個百分點。
  D: (180−20)/(400−50)約為 45.7 個百分點。
answer: A
explanation:
  summary: 配對準確率差由答對與答錯不一致的案例決定，但分母仍是完整測試集。
  correct: 甲準確率為 (150＋180)/400=82.5%，乙為 (150＋20)/400=42.5%。相減後共同答對的 150 筆抵消，共同答錯也不產生差值，因此差為 (180−20)/400=40 個百分點。不一致案例決定分子，並不代表只用不一致案例作分母。
  wrong:
    B: 這是僅在不一致案例內計算的淨勝比例，並非完整測試集的準確率差。
    C: 82.5% 是甲的準確率，沒有扣掉乙的準確率。
    D: 雙方都答錯的案例仍屬測試母數，不能從準確率分母排除。
