stem: 某零件檢索系統以 64 維向量的歐氏距離排序候選。團隊將查詢向量與全部庫存向量，同時乘上同一個正交矩陣，只旋轉座標而不縮放或降維。忽略浮點誤差，且候選間沒有同距離情形。關於轉換後的檢索結果，下列判斷何者最正確？
options:
  A: 各向量的長度不變，但候選排序仍會隨旋轉角度改變
  B: 各候選與查詢的距離不變，候選排序維持相同
  C: 各候選的距離等比例縮小，但候選排序維持相同
  D: 各向量的長度不變，但原本相近的候選會更靠近
answer: B
explanation:
  summary: 同一正交轉換保留向量之間的歐氏距離。
  correct: 查詢與候選一起旋轉時，兩者差向量也只旋轉。正交轉換保留差向量的長度，因此每個距離與排序都不變。這項結論需要雙方使用同一轉換；只旋轉查詢就不成立。
  wrong:
    A: 正交轉換不只保留單一向量的長度，也保留任意兩向量之差的長度。不能據此推論排序會改變。
    C: 旋轉沒有加入縮放。距離保持原值，並非縮成較小比例。
    D: 轉換沒有依候選相似程度調整距離。原本相近的候選不會因旋轉而額外靠近。
