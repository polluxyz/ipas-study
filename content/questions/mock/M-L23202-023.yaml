stem: 某團隊的隨機森林把隨機產生、具有 5 萬個不同值的流水號列為最高重要特徵。該分數來自訓練時不純度的下降量。團隊要檢查流水號是否真的有助於新資料預測。下列做法何者最適合？
options:
  A: 增加樹的數量，再比較同一訓練資料的不純度排名
  B: 在保留資料打亂流水號，觀察預測分數的下降程度
  C: 提高流水號可用的切分點數，再比較原重要性分數
  D: 把重要性分數正規化，再比較流水號與其他欄位
answer: B
explanation:
  summary: 辨識不純度重要性對多取值特徵的偏好。
  correct: 可切分的值越多，特徵越可能在訓練資料中取得不純度下降，卻未必能改善新資料預測。在保留資料上打亂流水號，能檢查模型對這個欄位的依賴是否帶來預測價值。此處測的是模型依賴，不是因果效果。
  wrong:
    A: 增加樹數可降低隨機波動，但仍沿用同一種可能偏好多取值欄位的分數，不能取代新資料檢查。
    C: 增加切分候選可能讓流水號更容易貼合訓練資料，並沒有檢查它能否改善保留資料的表現。
    D: 正規化改變分數尺度，不改變分數的來源，無法修正多取值特徵獲得較多切分機會的問題。
