stem: 某設計團隊用一般自編碼器壓縮零件圖，已知圖面的重建效果良好。團隊希望不輸入既有圖面，直接從標準常態分布抽取潛在向量產生新樣式，但輸出常失真。若要讓這種取樣方式與訓練目標連結，下列方向何者最適合？
options:
  A: 加深一般自編碼器的解碼器，僅以原圖重建損失重新訓練
  B: 降低一般自編碼器的重建損失權重，改以較小梯度更新解碼器
  C: 採用變分自編碼器，將重建目標與潛在分布的先驗約束結合
  D: 擴大一般自編碼器的潛在維度，僅以原圖重建損失重新訓練
answer: C
explanation:
  summary: 能重建已知圖面，不代表任意先驗取樣都落在已學到的潛在區域。
  correct: 一般自編碼器的重建訓練，未必讓編碼結果符合標準常態先驗。變分自編碼器會同時學習重建與潛在分布的約束，讓從指定先驗取樣具有訓練依據。產生圖面的可用性仍須另行驗證。
  wrong:
    A: 加深解碼器增加表達能力，卻沒有要求潛在編碼符合取樣使用的先驗分布。重建提升仍不能解決取樣區域不匹配。
    B: 縮小重建梯度影響學習強度，不會建立潛在分布與標準常態先驗的對應。
    D: 擴大潛在維度增加表示空間，卻不會把編碼分布約束成指定先驗，空間中的未學區域仍可能存在。
