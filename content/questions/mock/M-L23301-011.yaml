stem: |-
  某公司要重建會員在 6 月 1 日 00:00 的預測特徵。當時可取得的會員級別歷程為：一般級有效於 5 月 1 日 00:00 至 6 月 1 日 00:00；進階級有效於 6 月 1 日 00:00 至 7 月 1 日 00:00；尊榮級自 7 月 1 日 00:00 起有效。有效區間含起點、不含終點。歷程各列已提前入庫。連接會員資料時，應如何選擇級別？
options:
  A: 以會員編號及有效區間連接，取進階級作為該時點的特徵
  B: 以會員編號取最後一筆歷程，取尊榮級作為該時點的特徵
  C: 以會員編號及區間終點連接，取一般級作為該時點的特徵
  D: 以會員編號保留全部級別列，取 3 列共同作為該時點的特徵
answer: A
explanation:
  summary: 歷程資料連接須同時符合實體與預測時點的有效區間。
  correct: 6 月 1 日 00:00 已不屬於一般級的區間，卻正好是進階級的起點，因此選進階級。尊榮級雖已提前入庫，當時尚未生效。資料是否已可取得與內容是否在該時點有效，是兩項不同檢查。
  wrong:
    B: 最後一筆代表較晚才生效的尊榮級，不能用整理資料時的最新狀態覆蓋歷史狀態。
    C: 一般級的終點不包含在有效區間內，剛好到邊界時應改用下一個已生效區間。
    D: 本題要重建單一時點的級別，全部歷程列描述不同期間，不能當成同時有效。
