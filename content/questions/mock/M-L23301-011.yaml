stem: |
  某客服團隊要訓練「每通電話是否需要升級處理」的模型。原始資料每通電話只有 1 列；合併客服技能表後，一名客服若具備 3 項技能，同一通電話就出現 3 列。主管希望每通電話對訓練的基本權重相同。下列處理何者最適合？
options:
  A: 先將技能整理成每名客服 1 列，再合併並核對每通電話的列數
  B: 保留合併後的列數並按列隨機抽樣，讓多技能客服提供更多樣本
  C: 依合併後的每列重新產生電話編號，讓訓練資料具有不同識別碼
  D: 刪除與客服技能有關的輸入欄位，讓重複電話保留相同權重
answer: A
explanation:
  summary: 判斷資料合併的列數膨脹是否改變觀察單位權重。
  correct: 觀察單位是電話，不是客服技能。先把技能彙整為每名客服一列，再合併，可避免一對多關聯複製電話。合併後仍須核對電話編號的唯一性與總列數。
  wrong:
    B: 按膨脹後的列抽樣，仍會讓多技能客服的電話取得較高抽中機會。
    C: 改識別碼只改標記，不會把同一通電話變成新的獨立觀察。
    D: 刪除欄位不會移除重複列，同一通電話仍會多次影響訓練。
