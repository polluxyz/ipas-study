stem: 某分類器在同一批 1,000 筆驗證資料上，連續 5 輪的準確率維持 90%。這段期間二元交叉熵持續升高，分類門檻維持 0.5。工程師檢查每筆機率時，哪種變化最能解釋兩條曲線的差異？
options:
  A: 錯誤樣本跨過門檻變為正確，其餘分數不變
  B: 正確樣本的機率更靠近真實標籤，其餘分數不變
  C: 分類結果維持相同，錯誤樣本的錯判信心增強
  D: 各樣本分數維持相同，模型的參數數量增加
answer: C
explanation:
  summary: 分類準確率只看門檻結果，交叉熵還看機率。
  correct: 例如真實為 1 的個案，機率從 0.2 降到 0.01，兩次都被判為 0，但其負對數損失明顯增大。如果其他個案變化不足以抵銷，平均交叉熵就會上升。準確率不變不能證明機率品質也不變。
  wrong:
    A: 錯誤改正而其餘分數不變，會直接提高準確率並降低交叉熵，不能解釋題目中的曲線。
    B: 正確樣本對真實標籤分配更高機率，會降低交叉熵，方向與題目觀察相反。
    D: 同一批標籤與同一批分數會得到相同交叉熵，參數數量不是這項評估公式的輸入。
