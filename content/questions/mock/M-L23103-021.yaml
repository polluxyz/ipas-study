stem: 某團隊中斷訓練後還原權重 w=10，卻漏存動量 v=4。更新規則為 v←0.9v+g、w←w−0.1v。下一批梯度 g=2。若目標是接續原本的更新軌跡，下列處理何者最適合？
options:
  A: 把學習率改為 0.28，並將動量狀態設為 0
  B: 把動量狀態還原為 4，並沿用原本更新設定
  C: 把動量係數改為 0.4，並將動量狀態設為 0
  D: 把權重先減去 0.4，並將動量狀態設為 0
answer: B
explanation:
  summary: 動量狀態也是延續訓練所需的資訊。
  correct: 還原 v=4 後，下一次 v=5.6、w=9.44。動量包含先前梯度資訊，只有權重不足以接續相同軌跡。
  wrong:
    A: 此設定能湊出下一步相同的位移，卻沒有還原歷史動量；後續梯度改變時，軌跡仍會分歧。
    C: 動量清零後，第一步不受動量係數影響，得到 v=2、w=9.8，無法接續原狀態。
    D: 先改權重再清零會得到 w=9.4，而且後續更新仍缺少原有的動量資訊。
