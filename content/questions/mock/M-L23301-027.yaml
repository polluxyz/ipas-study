stem: 某維修模型要以「故障後經過的小時數」作為特徵。資料包含超過 1 天的等待時間。下列程式讓 1 天 5 小時變成 5 小時。若要保留完整經過時間，哪個運算最正確？
code: |
  import pandas as pd
  elapsed = pd.Series(pd.to_timedelta(["1 days 05:00:00", "0 days 02:00:00"]))
  print((elapsed.dt.seconds / 3600).tolist())
code_lang: python
options:
  A: 使用 elapsed.dt.days * 24 取得小時數
  B: 使用 elapsed.dt.total_seconds() / 3600 取得小時數
  C: 使用 elapsed.dt.seconds / 3600 取得小時數
  D: 使用 elapsed.dt.components.hours 取得小時數
answer: B
explanation:
  summary: 時間差的秒數部分與完整秒數不同。
  correct: total_seconds() 包含天數與剩餘時間，除以 3600 可取得完整小時數。本例會得到 29.0 與 2.0。
  wrong:
    A: days 只保留整天部分，第一筆會變成 24，第二筆會變成 0，遺失不足 1 天的時間。
    C: seconds 是扣除整天後的秒數部分，這正是造成 29 小時變成 5 小時的原因。
    D: components.hours 只取小時部分，無法保留整天所代表的 24 小時。
