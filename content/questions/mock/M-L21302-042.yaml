stem: 某推薦服務目前每次停用新版都要重新安裝舊版，作業需 25 分鐘。舊版可與新版同時常駐且已驗證相容；營運要求異常時在 1 分鐘內停止新版產生的推薦。最適合優先改變哪項發布設計？
options:
  A: 縮短重新安裝流程的測試時間，以減少每次回復所需的準備程序
  B: 將安裝與流量啟用拆開，以已演練的路由開關切回常駐舊版
  C: 將新版的建置工作移到更快的機器，以縮短下一次模型產出時間
  D: 增加新版自動重新啟動次數，以減少人工介入重新安裝的頻率
answer: B
explanation:
  summary: 預先保留可用版本並分開啟用，可縮短異常時的切換路徑。
  correct: 舊版已可常駐且相容，異常時無須重新安裝。將部署產物與流量啟用分開，並演練路由切換及實際回應確認，才可驗證是否在營運要求內停止新版曝光。
  wrong:
    A: 刪減測試可能降低回復可靠性，也不能證明原本長達 25 分鐘的安裝可在 1 分鐘內完成。
    C: 建置速度影響產物準備，不會直接縮短異常當下已部署版本的停用路徑。
    D: 重啟可處理部分暫時故障，但若新版推薦邏輯有問題，重啟後仍會產生同樣結果。
