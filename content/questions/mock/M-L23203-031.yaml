stem: 某設備序列模型使用 LSTM（以閘門控制長期記憶的網路）。工程師要暫時保留前一步訊號，並控制本步對外輸出。前一步細胞狀態為 1，隱藏輸出為 0.5；本步遺忘門接近 1、輸入門接近 0、輸出門接近 0。下列判斷何者最正確？
options:
  A: 細胞狀態接近 0，隱藏輸出會保留前一步的數值
  B: 細胞狀態大致保留，隱藏輸出可同時接近 0
  C: 細胞狀態由當前候選取代，隱藏輸出可接近 0
  D: 細胞狀態與隱藏輸出都大致保留前一步的數值
answer: B
explanation:
  summary: 區分 LSTM 的細胞記憶與對外隱藏輸出。
  correct: 遺忘門接近 1 會保留原細胞狀態，輸入門接近 0 會抑制當前候選寫入。輸出門接近 0 時，即使細胞狀態仍非零，隱藏輸出也可接近 0。因此，不能只看隱藏輸出就判定記憶已清除。
  wrong:
    A: 細胞記憶的保留主要由遺忘門與輸入門控制。輸出門接近 0 不會直接將細胞狀態清零。
    C: 候選寫入須經輸入門。輸入門接近 0 時，候選對本步細胞狀態的影響很小。
    D: 細胞狀態大致保留，但隱藏輸出還要乘上接近 0 的輸出門，兩者不必同時保持原值。
