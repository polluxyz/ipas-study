stem: 某設備維修平台要從每份 40 句的紀錄選出 3 句重點。驗收要求每句必須是原文完整句子，並能回到原位置；允許重點之間不連貫。哪個摘要流程最適合？
options:
  A: 讓生成模型重新組織全文，再以文法正確性選出 3 句
  B: 先將每個句子改成統一語氣，再挑選資訊量最大的 3 句
  C: 對原文句子排序，擷取其中 3 句並保留來源位置
  D: 先把全文翻譯成另一種語言，再回譯成 3 句中文重點
answer: C
explanation:
  summary: 必須逐句保留原文時，應採擷取句子的摘要流程。
  correct: 需求限制輸出必須取自原文完整句子。對句子評分後直接選取，並保存句子位置，可符合文字與來源追溯要求。這屬於抽取式摘要，重點是選句而非重新撰句。
  wrong:
    A: 文法正確不代表句子曾出現在原文，重新組織的生成流程不符合逐句保留要求。
    B: 先統一語氣就可能改動句子內容，即使選到重要資訊，也不符合原句限制。
    D: 翻譯再回譯可能改動用字與句法，不能滿足輸出必須等於原文完整句子的條件。
