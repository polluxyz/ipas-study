stem: 某聯邦學習試驗的原始資料都留在各機構。量測顯示，同步模型更新占訓練時間的 80%，本地計算仍有餘裕，各機構資料分布也相近。團隊想先測試降低通訊開銷的方案，同時重驗模型品質。最適合先調整哪個方向？
options:
  A: 縮短每輪本地更新時間，提高中央同步頻率
  B: 增加每輪本地更新次數，降低中央同步頻率
  C: 提高更新參數的數值精度，維持中央同步頻率
  D: 擴大各機構共享的模型，維持中央同步頻率
answer: B
explanation:
  summary: 聯邦學習可透過本地計算與同步頻率的取捨降低通訊需求。
  correct: 在每次傳輸前做更多本地更新，可以用較多本地計算換取較少同步輪次。本例通訊耗時高且本地計算有餘裕，適合先試這個方向；仍須驗證本地更新增加後是否影響收斂與品質。
  wrong:
    A: 提高同步頻率可讓各方參數更常對齊，但會增加傳輸次數，與本例優先降低通訊開銷的方向相反。
    C: 提高數值精度可能減少更新的近似誤差，但通常會增加每次傳輸的資料量，並未降低同步次數或通訊負擔。
    D: 更大模型可能提高表達能力，也會增加每次更新的傳輸量，不是降低目前通訊開銷的優先方向。
