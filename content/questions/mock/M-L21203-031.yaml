stem: 某助理在輸出前串接 2 道敏感資訊偵測器。兩道採相同權重與前處理，且判斷皆不含隨機性。團隊分別測得每道漏報率為 10%，便宣稱串接後漏報率為 1%。針對此風險估計，哪項處置最適合？
options:
  A: 增加兩道偵測器各自的測試量，再把兩者漏報率相乘
  B: 對兩道漏報率取算術平均，再以平均值的平方估計
  C: 比較兩道偵測器的平均回應時間，再依先後順序折算
  D: 量測同一批敏感輸出連續通過兩道的比例，檢查共同漏報
answer: D
explanation:
  summary: 多道防護的錯誤若相依，不能直接把漏報率相乘。
  correct: 相乘的估法需要適當的獨立性條件。兩道偵測器使用相同權重與處理方式，對相同內容會產生相同判斷，漏報會重疊。應測量完整串接流程的共同漏報，而非假設兩道互相補足。
  wrong:
    A: 增加樣本可改善每道漏報率的估計精度，卻不會讓相同的偵測器變成獨立防線。
    B: 先平均再平方仍隱含相同的獨立性問題，不能由個別漏報率推導共同漏報。
    C: 回應時間與執行順序不會改變相同模型的判斷規則，不能用時間折算漏報率。
