stem: 某企業本期可投入 80 萬元及 8 人週，選擇不可拆分的 AI 專案。甲需 50 萬元、5 人週，預期淨效益 90 萬元；乙需 30 萬元、4 人週，淨效益 65 萬元；丙需 25 萬元、3 人週，淨效益 45 萬元。各案互不影響，淨效益可直接相加。若要在兩項資源限制內使淨效益最大，應選哪組？
options:
  A: 只選甲專案
  B: 選甲與乙專案
  C: 選乙與丙專案
  D: 選甲與丙專案
answer: D
explanation:
  summary: 專案組合須同時符合預算與人力限制。
  correct: 甲加丙共需 75 萬元及 8 人週，淨效益為 135 萬元。甲加乙雖不超出預算，卻需 9 人週；乙加丙的淨效益只有 110 萬元。甲加丙是可行組合中淨效益最高者。
  wrong:
    A: 單選甲符合限制，但只使用 5 人週且淨效益為 90 萬元；加入丙仍可行，淨效益更高。
    B: 甲加乙需 80 萬元及 9 人週。只看預算會漏掉人力超額，因此不是可執行的組合。
    C: 乙加丙需 55 萬元及 7 人週，雖然可行，淨效益 110 萬元仍低於甲加丙的 135 萬元。
