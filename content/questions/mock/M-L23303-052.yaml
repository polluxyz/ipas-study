stem: 某團隊原本只用甲廠資料訓練設備模型。新增大量乙廠資料後，在固定且具代表性的甲廠驗證集上，錯誤率由 8% 升至 13%；乙廠錯誤率則下降。兩廠的訊號與故障關係不同，各次都已收斂，實際部署仍只服務甲廠。哪項處置最有依據？
options:
  A: 直接增加乙廠資料，樣本總數變大便保證甲廠改善。
  B: 分開追蹤甲廠指標，評估資料來源權重或分廠建模。
  C: 改以兩廠合併分數驗收，讓新增資料抵銷甲廠退化。
  D: 只降低模型容量，將甲廠退化直接認定為高變異。
answer: B
explanation:
  summary: 不同來源的新增資料可能改變學習目標，不能保證改善目標環境。
  correct: 新增資料來自另一種訊號與故障關係，已不符合單純增加同分布樣本的前提。部署目標只有甲廠，應保留甲廠指標，並驗證來源加權、來源特徵或分廠模型能否改善甲廠。乙廠改善或合併分數變好，都不能替代甲廠驗收。
  wrong:
    A: 更多資料的來源不同，可能繼續使訓練目標偏向乙廠，沒有改善甲廠的保證。
    C: 合併會改變驗收對象，可能掩蓋實際服務對象的退化。
    D: 題目顯示來源關係不同，不能僅憑退化就診斷為容量造成的高變異。
