stem: |
  某工廠把 20 個感測器特徵壓成 2 個主成分，能保留 95% 的變異。這 2 個主成分的係數涵蓋全部 20 個感測器，每個感測器至少有 1 個係數非零，且其感測值無法由其他感測值精確推回。採購主管希望只留下 2 個實體感測器，仍算出每筆資料原有的主成分分數。哪項判斷最正確？
options:
  A: 保留變異貢獻最大的 2 個感測器即可沿用
  B: 保留與兩個主成分最相關的感測器即可沿用
  C: 仍需提供原特徵，若要減少感測器須另評估
  D: 保留原變異最大的 2 個感測器，其餘以平均數補入
answer: C
explanation:
  summary: 主成分是原始特徵的線性組合，降成 2 維不等於只需 2 個感測器。
  correct: 每個主成分由多個原始感測值加權而成。題幹中每個感測器至少參與其中一個主成分，不能由輸出只有 2 維推得只需 2 個輸入。若要省硬體，須另做特徵選擇並驗證新流程。
  wrong:
    A: 變異較大的 2 個原始感測器，不等於 2 個主成分。只留下它們會缺少其餘非零係數對應的輸入，無法直接沿用既有轉換。
    B: 相關程度高不代表能精確替代整個線性組合。其餘感測器仍有非零係數，直接省略會改變主成分分數。
    D: 以平均數補入會失去其他感測器當筆的變化。那些感測器的係數非零，因此不能保證仍得到原有的主成分分數。
