stem: 某工程師在同一組固定參數下檢查梯度估計。4 筆樣本的梯度分別為 1、3、5、7，每次獨立且等機率有放回抽樣。批次梯度使用平均值。程式列出批次大小為 1 與 4 時，全部可能批次均值的平均與變異數。哪項判斷最正確？
code: |
  from itertools import product
  import numpy as np
  for batch in [1, 4]:
      means = np.array([np.mean(x) for x in product([1, 3, 5, 7], repeat=batch)])
      print(batch, means.mean(), means.var())
code_lang: python
options:
  A: 期望值不變；變異數降為原來的四分之一
  B: 期望值增為 4 倍；變異數降為原來的四分之一
  C: 期望值不變；變異數降為原來的二分之一
  D: 期望值增為 4 倍；變異數維持原來的大小
answer: A
explanation:
  summary: 獨立樣本的梯度取平均，可降低估計變異而不放大期望值。
  correct: 批次大小 1 的均值期望為 4、變異數為 5；大小 4 時仍以平均計算，期望維持 4，變異數為 5/4=1.25。獨立有放回抽樣讓平均的變異數依批次大小縮小，不是讓梯度期望乘上筆數。
  wrong:
    B: 把梯度相加才會讓期望隨筆數放大；本例使用平均，因此期望仍是 4。
    C: 標準差會縮成二分之一，變異數則是標準差的平方，所以縮成四分之一。
    D: 此判斷同時混淆加總與平均，也忽略獨立抽樣取平均能降低估計變異。
