stem: 某研究室要從同一份 30 頁報告各產生 150 字摘要。財務人員只關心成本，維運人員只關心故障處理。一般摘要常被篇幅最多的市場背景占滿。模型可讀完整報告，最適合優先測試哪項調整？
options:
  A: 把讀者的關注問題加入摘要輸入與選材規則
  B: 先按各段落的長度比例分配摘要的字數配額
  C: 先生成一份通用摘要，再依讀者替換專業用語
  D: 把全文出現最多的詞指定為兩份摘要的重點
answer: A
explanation:
  summary: 依查詢產生摘要時，重點由讀者需求決定。
  correct: A 使成本與故障處理成為不同摘要的資訊選擇依據，直接處理通用摘要偏向主要篇幅的問題。仍須核對摘要是否有來源支持及是否遺漏需求中的重點。
  wrong:
    B: 按篇幅配置會繼續讓市場背景占較多字數，篇幅不代表對特定讀者的重要性。
    C: 替換用語能改變表達方式，卻無法補回通用摘要在選材時已省略的成本或故障資訊。
    D: 高頻詞可能主要來自市場背景，不能代替財務與維運各自的資訊需求。
