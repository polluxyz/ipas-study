stem: 某產線以單一溫度 T 判斷瑕疵風險。先導資料顯示，低於 40°C 與達 60°C 的區段均屬低風險，其餘區段屬高風險。第一版只使用原始 T，不增加平方項或區間旗標。部署要求每筆至多做 2 次條件比較，並可列出完整判斷路徑。下列候選何者在結構上能表達這種兩端低、中間高的規則？
options:
  A: 使用深度最多為 2 的決策樹，依溫度做條件分裂
  B: 使用深度最多為 1 的決策樹，依溫度做條件分裂
  C: 使用原始溫度的邏輯迴歸，以固定機率門檻分類
  D: 使用原始溫度的線性支援向量機，以分數正負分類
answer: A
explanation:
  summary: 中間高風險區間需要兩個切分點，模型須有相應的表達能力。
  correct: 深度為 2 的樹可先判斷 T 是否小於 40，再於另一分支判斷 T 是否小於 60，形成低、高、低的 3 段規則。每筆最多經過 2 次比較，路徑也可直接列出。這表示結構足以表達規則，實際訓練品質仍須另行驗證。
  wrong:
    B: 深度為 1 的樹只有一次切分，最多形成 2 段，無法同時切出中間區段的兩個邊界。
    C: 單一原始溫度的線性分數經機率轉換後，只會單調增加、單調減少或保持不變。固定門檻無法把中間區段單獨判為高風險。
    D: 單一原始溫度的線性分數，依正負分類時最多產生一個切分點。需要非線性特徵或核函數才可能表達中間區段。
