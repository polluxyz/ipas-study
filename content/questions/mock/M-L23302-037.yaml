stem: 某物流公司要在訂單成立當下預測是否延遲。候選甲使用「完成配送後的顧客評分」，驗證較準；候選乙只使用訂單成立時可取得的資料，品質已達門檻。若要選擇可實際執行的第一版，下列方案何者最適合？
options:
  A: 採乙，使用訂單成立時已具備的輸入完成預測
  B: 採甲，將當下尚未取得的評分填成歷史平均值
  C: 採甲，部署時再把評分欄位的模型權重設成零
  D: 採甲，將評分的全域重要性報表加入驗收文件
answer: A
explanation:
  summary: 選模前要確認輸入能否在預測時間取得。
  correct: 乙的訓練與部署輸入時間相符，且品質已達門檻。甲使用事件完成後才出現的資訊，離線分數不能代表在訂單成立當下的預測能力。
  wrong:
    B: 甲的驗證用到實際事後評分，部署改填平均值會改變輸入分布，原驗證分數不再能證明品質。
    C: 任意移除已訓練模型的一項作用不等於重新訓練並驗證，樹模型也不一定有可直接設零的單一欄位權重。
    D: 重要性報表能描述模型如何使用評分，不能讓事後資料在預測時提早取得。
