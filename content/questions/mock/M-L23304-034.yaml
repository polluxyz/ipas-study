stem: 某工程師做短程學習率尋找，從 0.00001 逐批提高到 1，最後損失明顯發散。他已保存尋找前的模型與 Adam（結合動量與自適應步長的優化器）狀態，接著要從原起點正式訓練。若只換回小學習率仍不穩定，最適合先採哪項操作？
options:
  A: 恢復尋找前的模型與優化器，再設定正式學習率
  B: 保留尋找後的模型與動量，改用較小學習率
  C: 恢復尋找前的模型，沿用尋找後的動量狀態
  D: 保留尋找後的模型，重設優化器的動量狀態
answer: A
explanation:
  summary: 學習率尋找會更新權重與優化器狀態，不能當成無副作用的量測。
  correct: 逐批提高學習率的過程已改變模型與 Adam 的梯度歷史，末段發散也可能留下不適當的參數。要從原起點正式訓練，應恢復尋找前保存的兩者狀態，再設定選定的學習率。
  wrong:
    B: 調低學習率不會逆轉先前發散造成的權重變動，也不會清除已累積的動量與平方梯度狀態。
    C: 權重與優化器歷史來自不同訓練位置，沿用尋找後狀態不等於恢復原起點。
    D: 重設優化器能清除歷史，但權重仍是尋找後的值，未回到指定的原起點。
