stem: 某團隊已還原模型權重、動量、學習率與所有亂數狀態，但資料載入器的游標沒有還原。原本下一筆應為 x=2，恢復後卻讀到 x=1。模型為 y_hat=w×x，兩筆目標皆為 0，損失 L=(w×x)²/2。以下用相同已還原狀態各算 1 步。哪項結果與修正最正確？
options:
  A: 0.51、0.81；須再還原資料順序與目前讀取位置。
  B: 0.51、0.51；只要亂數狀態相同，游標不會影響更新。
  C: 0.60、0.90；只需還原權重，歷史動量可直接忽略。
  D: 0.81、0.51；交換兩筆資料後便能保持下一步完全相同。
answer: A
explanation:
  summary: 精確接續訓練也需要還原下一步實際讀取的資料。
  correct: 相同 w=1 時，梯度為 w×x²。x=2 得梯度 4，更新後 w=1−0.1×(0.9×1＋4)=0.51；x=1 得梯度 1，更新後為 0.81。狀態與亂數相同不能抵銷下一筆輸入不同。要精確接續，還須還原取樣順序與讀取位置，或用可確定重建下一批的機制。
  wrong:
    B: 亂數狀態不包含所有資料游標資訊；題目已明示下一筆資料不同。
    C: 這組結果忽略了已還原的動量，且只還原權重仍無法控制下一筆資料。
    D: 把兩種結果順序寫反；改換下一筆資料不會保留相同下一步更新。
