stem: 某工程師做短程學習率尋找，把學習率逐批提高到 1.0，結束時 SGD 的動量緩衝（累積的歷史更新量）為 −4.0。接著把權重恢復成尋找前的 2.00，預定使用學習率 0.1、動量係數 0.9，但沒有核對優化器實際的設定。下一批梯度為 1.0，更新規則是 v←0.9v＋g、w←w－ηv（η 為學習率）。工程師預期 w 變成 1.90，實際卻是 2.26。哪項原因與這個數字相符？
options:
  A: 優化器仍保留尋找末段的動量緩衝，未隨權重恢復
  B: 學習率仍停在尋找末段的 1.0，未隨權重恢復
  C: 本步梯度符號被反向，模型往損失上升方向更新
  D: 上一批梯度未清除，本步累加成 2.0 後才更新
answer: A
explanation:
  summary: 學習率尋找會同時改變權重與優化器狀態，正式訓練前兩者都要恢復。
  correct: v＝0.9×(−4.0)＋1.0＝−2.6，w＝2.00－0.1×(−2.6)＝2.26，與實際相符。動量緩衝恢復成 0 時，v＝1.0，w＝1.90，才是預期值。指引的公式把學習率併入 v；本題依題幹的寫法計算。學習率尋找屬指引外補充。
  wrong:
    B: 學習率為 1.0 時，動量緩衝為 0 得 w＝1.00，保留舊緩衝得 w＝2.00－1.0×(−2.6)＝4.60，都不是 2.26。
    C: 動量緩衝為 0 且梯度為 −1.0 時，w＝2.00＋0.1×1.0＝2.10，不是 2.26。
    D: 動量緩衝為 0 且梯度為 2.0 時，w＝2.00－0.1×2.0＝1.80，不是 2.26。
