stem: 某資料集有 6,400 筆，批次可整除資料量，每批更新 1 次，沒有梯度累積。甲用批次 64 訓練 10 輪；乙改用批次 256，也訓練 10 輪。程式列出更新次數。若要先排查乙收斂較慢是否來自更新次數減少，最適合增加哪組對照？
code: |
  n = 6400
  for batch, epochs in [(64, 10), (256, 10), (256, 40)]:
      print(batch, epochs, (n//batch)*epochs)
code_lang: python
options:
  A: 批次 256 訓練 5 輪，維持較少資料曝光
  B: 批次 64 訓練 40 輪，增加小批次更新
  C: 批次 256 訓練 10 輪，改記錄每輪耗時
  D: 批次 256 訓練 40 輪，對齊甲的更新次數
answer: D
explanation:
  summary: 相同輪數不代表不同批次大小具有相同更新次數。
  correct: 甲更新 1,000 次，乙只更新 250 次。批次 256 訓練 40 輪會更新 1,000 次，可作為排查更新次數影響的對照。這會增加資料曝光量，仍不能把兩種訓練視為數學上等價，也不保證效能相同。
  wrong:
    A: 5 輪只有 125 次更新，與甲的差距更大，沒有對齊要排查的更新次數。
    B: 小批次訓練 40 輪會更新 4,000 次，增加另一側的預算，沒有補上大批次更新較少的對照。
    C: 每輪耗時可說明效率，但乙仍只有 250 次更新，無法觀察對齊更新次數後的收斂。
