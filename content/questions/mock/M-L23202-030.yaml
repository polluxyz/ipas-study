type: 計算
codes: [L23202]
concepts: [k-means, categorical-encoding]
stem: |
  某會員分群用歐氏距離比較「每月購物次數、每月到店次數、偏好通路」。甲為 (2,1,門市)，乙為 (5,5,手機)。通路依 [門市,手機,網頁] 完整獨熱編碼，不刪欄位。團隊將每個獨熱欄位都乘以同一正數 w，兩個次數欄位保持原值。若要求通路區塊與兩個次數欄位對這一對會員的平方距離貢獻相等，w 與總歐氏距離應約為多少？
options:
  A: "w 約 3.54；總歐氏距離約 7.07"
  B: "w 約 5.00；總歐氏距離約 8.66"
  C: "w 約 2.50；總歐氏距離約 6.12"
  D: "w 約 2.24；總歐氏距離約 5.92"
answer: A
explanation:
  summary: "計算完整獨熱區塊與數值區塊的距離貢獻。"
  correct: "兩個次數欄位的平方距離為 (5−2)²+(5−1)²=25。通路向量為 [w,0,0] 與 [0,w,0]，平方距離為 2w²。令 2w²=25，得 w=5/√2，約 3.54；總距離為 √(25+25)=√50，約 7.07。指引介紹縮放與獨熱編碼；本題區塊權重的推導屬延伸補充。"
  wrong:
    B: "w=5 時通路貢獻為 2×5²=50，是數值區塊的 2 倍。這相當於把不同通路誤認為只有 1 個獨熱欄位改變。"
    C: "w=2.5 時通路貢獻為 2×2.5²=12.5，只有數值區塊的一半。兩個非零差不能先直接相加，再當作歐氏距離。"
    D: "以未四捨五入的 w=√5 計算，通路貢獻為 2×5=10，與 25 不相等。獨熱欄位乘以 w，對平方距離的影響是乘以 w²。"
guide_refs: [guide-1:5-4, guide-3:5-8]
author: codex
