type: 情境
codes: [L23202]
concepts: [k-means, categorical-encoding]
stem: |
  某會員分群以 K-means 的歐氏距離處理「偏好通路」。3 個通路沒有先後或遠近關係，卻被編為 1、2、3。只調換通路代碼的對應，群結果就改變。其他特徵與前處理均未變。最適合優先驗證哪項調整？
options:
  A: "改用不引入通路次序的類別表示，再檢查距離與分群結果"
  B: "將通路代碼做最小最大縮放，再檢查距離與分群結果"
  C: "將通路代碼改編為 10、20、30，再檢查距離與分群結果"
  D: "增加群中心的隨機初始次數，再檢查距離與分群結果"
answer: A
explanation:
  summary: "避免名目類別的任意代碼被解讀為距離。"
  correct: "整數代碼讓 1 與 2 的距離小於 1 與 3，但題設通路沒有這種遠近。可先驗證獨熱表示等不引入任意次序的編碼，再評估整體距離設定。"
  wrong:
    B: "最小最大縮放保留代碼的次序及相對間隔，仍把任意代碼當成有遠近的數值。"
    C: "乘以同一比例仍保留任意的數值距離，甚至可能提高該欄位對整體距離的影響。"
    D: "多次初始化可降低局部起點不佳的影響，不能修正距離本身帶入的錯誤類別關係。"
