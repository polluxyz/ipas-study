concepts: [privacy-governance, data-inventory]
stem: |
  某分析平台的到期資料已依內規刪除，刪除清單另有保存。系統故障後，工程師要從 14 天前的備份還原，備份內含這段期間已到期的資料。平台要求還原後不得恢復使用這批到期資料。最適合如何安排恢復流程？
options:
  A: 還原到隔離區，套用到期刪除清單並核對後再開放
  B: 還原到隔離區，套用備份製作當時的刪除清單再開放
  C: 還原到隔離區，依此次匯入日期重算保存期限再開放
  D: 還原到隔離區，依備份中的讀取權限核對後再開放
answer: A
explanation:
  summary: 備份還原須承接期間已執行的到期處置。
  correct: 還原會讓已刪除資料重新出現。先在隔離區套用刪除清單並核對，才能在開放服務前排除已到期資料，符合本例的恢復要求。
  wrong:
    B: 備份製作當時的清單不含後來到期的資料，無法排除這段期間已執行的刪除對象。
    C: 還原是技術上的恢復事件，沒有改變資料用途或核准的保存起算條件。
    D: 權限清冊處理誰可以讀取，不代表備份內的每筆資料仍在允許使用的期限內。
