stem: 某混合部署系統由雲端每分鐘產生一次設備設定建議，邊緣端依當前狀態執行。斷網後重連時，佇列會先送達 20 分鐘前的建議；裝置與雲端時鐘已同步。團隊要防止過期建議覆蓋近期設定，最適合加入哪項接受規則？
options:
  A: 依訊息抵達順序逐筆套用，再將最後收到的建議保留為目前設定
  B: 以模型版本作為排序依據，同一模型產生的建議都依序套用
  C: 核對建議的產生時間、有效期限與序號，再決定是否套用
  D: 以訊息重新傳送的次數排序，優先套用重試次數較多的建議
answer: C
explanation:
  summary: 跨環境同步要區分抵達時間與建議本身的時效及順序。
  correct: 重連後的抵達順序不代表建議的新舊。以產生時間、有效期限和序號檢查，可拒絕失效或比已套用狀態更舊的建議；時鐘同步支援本例的時間判斷。
  wrong:
    A: 延後傳送與重試可讓舊訊息較晚抵達，最後收到的不見得適合目前狀態。
    B: 同一模型也會在不同設備狀態產生不同建議，模型版本不能辨識建議的即時性與順序。
    D: 重試次數反映傳輸過程，不代表建議較新或仍有效，可能反而優先套用積壓訊息。
