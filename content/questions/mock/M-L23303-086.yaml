stem: |
  某設備模型輸出未保養時的本期故障機率 p，機率已校準。保養固定花 12 單位，但只能把故障機率降為原來的 25%，故障時仍損失 80 單位。不保養則只在故障時損失 80 單位，其他成本為 0。預期成本相同時選擇保養。最適合把最低保養門檻設為多少？
options:
  A: p 至少為 0.15
  B: p 至少為 0.20
  C: p 至少為 0.60
  D: p 至少為 0.75
answer: B
explanation:
  summary: 保養效益要扣除保養後仍可能發生的故障損失。
  correct: 不保養的預期成本是 80p，保養則是 12+80×0.25p=12+20p。保養較省或打平的條件為 12+20p≤80p，因此 p≥12/60=0.20。
  wrong:
    A: 12/80=0.15 把保養當成可避免全部故障。p=0.15 時，不保養花 12，保養的預期成本是 15，保養反而較貴。
    C: 12/(80×0.25)=0.60 誤把保養後殘留的風險當成避免的風險。應使用降低的 75% 風險計算保養效益，得到門檻 0.20。
    D: 0.75 是故障機率的相對降幅，不能直接當作待保養設備的風險門檻。門檻還取決於保養費與故障損失。
