stem: 某家電商每月收到 12,000 封客服信件，要把每封信分派給「維修、帳務、配送」其中 1 個部門。團隊先做正面、負面、中立情感分類，卻無法決定收件部門。最適當的調整為何？
options:
  A: 依信件情緒強度排序，按各部門的可用人力依序分派信件
  B: 將信件向量分成 3 群，依群集編號排序對應 3 個部門
  C: 依服務需求標註部門類別，訓練並驗證文字分類模型
  D: 沿用情感模型信心分數，按高、中、低區間對應 3 個部門
answer: C
explanation:
  summary: 分類目標必須對應實際分派任務。
  correct: 情感方向與服務主題不同。部門分派需要能反映維修、帳務或配送需求的標籤，再依此評估文字分類，情感資訊最多作輔助。
  wrong:
    A: 情緒強度可協助安排處理優先順序，人力可用於平衡負載，但兩者都沒有辨識信件所需的服務部門。
    B: 群集可能反映服務主題，也可能反映其他差異；群集編號沒有部門語意，須先檢驗群集內容並建立對照。
    D: 這個分數代表模型對情感判定的信心，高低區間不代表維修、帳務或配送需求。
