stem: 某 AI 文件服務會把完整提示內容存入一般除錯日誌 90 天，所有維運人員都可查閱。提示有時含尚未公開的併購資料。事件調查通常只需請求識別碼、模型版本、錯誤類別與時間；少數案件才需看原文。哪項日誌設計最適合？
options:
  A: 保留完整提示並壓縮日誌，讓維運人員查詢較小的檔案
  B: 保留完整提示但遮住檔名，讓維運人員透過請求識別碼搜尋
  C: 保留完整提示並延後集中上傳，讓維運人員在內網查閱
  D: 一般日誌只記必要欄位，必要原文另設受限保存與核准調閱
answer: D
explanation:
  summary: 追查能力與敏感原文的廣泛留存應分開設計。
  correct: 已知一般調查只需少量欄位，沒有理由讓每位維運人員常態讀取完整提示。必要欄位保留追查線索；少數需要原文的案件則採獨立權限、保存期限及核准程序。
  wrong:
    A: 壓縮降低儲存量，不會減少提示中包含的機密，也不會限制解壓後的存取範圍。
    B: 遮住檔名不會移除提示內的併購資料；依請求識別碼仍可查到完整原文。
    C: 內網與延後上傳可調整傳輸風險，但沒有縮減一般日誌中的原文或讀取者。
