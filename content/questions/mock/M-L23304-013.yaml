stem: 某模型已將 80% 零散權重設為零，但仍以原形狀的稠密矩陣儲存。裝置只使用稠密矩陣運算，實測延遲幾乎不變。團隊希望在相同裝置上取得可量測的加速，最適合的方向為何？
options:
  A: 將剩餘零散權重再減半，維持原矩陣形狀與相同的稠密運算
  B: 將權重另存成壓縮檔，推論時解壓回原形狀再執行稠密運算
  C: 只刪除剪枝遮罩的檔案，讓原矩陣在推論時改用相同的稠密運算
  D: 評估移除整個通道的結構化剪枝，重建較小張量後重新量測
answer: D
explanation:
  summary: 零散的零權重，未必能降低稠密運算的實際工作量。
  correct: 稠密核心仍依原張量形狀運算，零值比例不會直接變成加速比例。結構化剪枝可縮小張量尺寸，較符合此裝置的運算方式；仍須檢查準確度並量測實際延遲。
  wrong:
    A: 在形狀與稠密核心都不變時，增加零值仍未減少核心執行的稠密矩陣運算。
    B: 檔案壓縮可縮小磁碟儲存，但解壓後的張量形狀及稠密運算量不變，還增加載入工作。
    C: 刪除遮罩相關檔案不等於重建較小矩陣；保留原形狀仍需執行相同稠密運算。
