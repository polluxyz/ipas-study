stem: 某平台允許下載精確人數統計，不提供姓名。查詢者知道某部門原有 50 人，且當月只新增 1 位已知員工。兩次報表中的某疾病人數由 7 變成 8，期間沒有其他人員或疾病狀態變更。此設計最需要評估哪種風險？
options:
  A: 模型成員推論，從預測信心識別訓練紀錄
  B: 傳輸竄改，從兩次報表差異推定封包遭修改
  C: 標註偏見，從兩次報表差異推定疾病判準改變
  D: 差分查詢推知個人屬性，從報表增量得知疾病
answer: D
explanation:
  summary: 精確的多次聚合結果可能組合出個人的敏感屬性。
  correct: 已知唯一新增者是誰，又知道疾病計數只多 1，查詢者可把新增者與疾病連結。這是結合外部背景與多次聚合輸出的推測風險。單份報表沒有姓名，並不足以評估整個發布機制的隱私效果。
  wrong:
    A: 題目沒有模型預測信心，也沒有要判斷是否參與訓練；洩漏來自精確統計的差額。
    B: 兩份報表反映不同時點的真實總數，差異並不是傳輸遭竄改的證據。
    C: 題目提供的是人員加入與計數增量，不能據此推出疾病標註標準發生偏見。
