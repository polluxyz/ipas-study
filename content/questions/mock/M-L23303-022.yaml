stem: 某模型每天收盤後預測未來 7 天內是否違約。日期 t 的標籤到 t+7 收盤才完整，其他特徵當天即可取得。團隊要模擬第 100 天收盤後的實際訓練，並在之後日期驗證。若資料沒有入庫延遲，訓練標籤最晚能取哪一天的樣本？
options:
  A: 第 100 天，因為訓練特徵在第 100 天收盤已可取得
  B: 第 99 天，因為只要訓練列日期早於預測日即可
  C: 第 93 天，其完整標籤在第 100 天收盤可取得
  D: 第 107 天，因為可用驗證期間補齊訓練樣本的標籤
answer: C
explanation:
  summary: 時間驗證除了特徵日期，也要檢查訓練標籤何時可知。
  correct: 第 100 天收盤訓練時，只能使用 t+7≤100 的完整標籤，所以 t 最晚為 93。第 94 至 100 天的特徵雖已存在，完整標籤仍涉及未來。實際驗證應依標籤可知時間排除這些尚未成熟的訓練列。
  wrong:
    A: 特徵可取得不等於標籤已完整。第 100 天的標籤要到第 107 天才能確定。
    B: 日期早 1 天仍不足以涵蓋 7 天標籤觀察期，第 99 天的標籤要到第 106 天才完整。
    D: 使用第 100 天以後才知道的標籤，無法模擬第 100 天實際可進行的訓練。
