stem: 某票務平台準備逐步部署新版排序模型。先在深夜低流量環境導入 5%，延遲與成功率都達標，但新版尚未接觸開賣尖峰的大量並行請求。下一階段要判斷能否擴大接管尖峰流量，哪項做法最適合？
options:
  A: 保持深夜的流量條件，增加觀察天數後直接核准尖峰全面接管
  B: 依深夜延遲的平均值設定容量，據此安排尖峰時段全面切換
  C: 先驗證代表性尖峰負載，再於可控流量下依門檻逐步擴量
  D: 先比較新版與舊版的離線排序分數，再依較高分數決定擴量
answer: C
explanation:
  summary: 擴量證據須涵蓋下一階段的實際負載條件。
  correct: 深夜成功只支持低負載下的觀察，沒有驗證尖峰並行能力。先在受控環境驗證代表性尖峰負載，再以監控與回復門檻逐步擴量，才能補足接管尖峰前的證據。
  wrong:
    A: 低負載多觀察幾天仍未涵蓋尖峰並行條件，無法支持直接全面接管。
    B: 平均延遲不能直接決定尖峰容量，排隊、並行與尾端延遲也可能隨負載改變。
    D: 離線排序品質不驗證服務在尖峰負載的穩定性，不能取代容量與擴量門檻。
