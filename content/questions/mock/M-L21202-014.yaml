stem: 某客服 AI 已通過模型測試，準備讓 30 位員工試用。觀察發現，員工會按「採用建議」，但遇到錯誤內容時，不知道如何修訂或轉回人工流程。公司可再安排 2 小時訓練，成功指標是員工能完成異常案件處理。最適合安排哪種訓練？
options:
  A: 講解模型架構與訓練資料來源，再測驗技術名詞辨識
  B: 示範一般案件的快速採用，再測驗每分鐘按鍵次數
  C: 演練錯誤建議的修訂與轉接，再觀察完整案件操作
  D: 介紹競品的功能與模型成績，再測驗功能比較題目
answer: C
explanation:
  summary: 採用訓練的內容與驗收須對應員工實際缺少的操作能力。
  correct: 問題是例外處理能力不足。以含錯誤建議的案件演練修訂與轉接，再觀察員工完成流程，可直接驗證成功指標，也能找出介面或說明仍不清楚的地方。
  wrong:
    A: 架構知識有助理解工具，但記住技術名詞不能證明員工會修訂錯誤建議或轉接案件。
    B: 一般採用操作已會執行，再練按鍵速度會提升熟練度，卻沒有補上異常案件的處理能力。
    D: 競品比較可支援採購或市場認識，但不能直接改善目前系統的修訂與人工轉接操作。
