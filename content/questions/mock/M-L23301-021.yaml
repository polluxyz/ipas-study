stem: 某設備模型以每分鐘「超過壓力門檻的讀值筆數」作為特徵。韌體更新後，固定取樣頻率由每秒 1 筆改成每秒 10 筆；實際壓力歷程相同，卻出現較大的特徵值。資料沒有遺漏且取樣均勻。若要讓特徵反映超標時間占比，下列做法何者最適合？
options:
  A: 以每分鐘超標讀值數除以該分鐘總讀值數，重新驗證模型
  B: 將超標讀值筆數取對數，保留各分鐘原有的取樣筆數差異
  C: 將超標讀值筆數做平方根轉換，重新估計訓練資料的尺度
  D: 以該分鐘的最高壓力取代超標讀值筆數，重新驗證模型
answer: A
explanation:
  summary: 計數特徵需要區分事件持續程度與取樣頻率。
  correct: 均勻且完整的取樣下，超標筆數除以總筆數可近似超標時間比例。這項比例不會只因每秒取得更多讀值而等倍增加。重新定義特徵後，需同步處理訓練與部署資料並重測效能。
  wrong:
    B: 對數只壓縮數值範圍，不能消除取樣頻率造成的系統性差異，也不會把筆數變成時間占比。
    C: 平方根同樣只壓縮計數尺度。頻率較高時仍會得到較大數值，沒有加入相對於觀測量的分母。
    D: 最高壓力表示尖峰幅度。短暫尖峰與長時間超標可以有相同最高值，不能代表超標時間占比。
