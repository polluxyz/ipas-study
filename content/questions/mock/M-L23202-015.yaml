stem: 某物流公司用 K-means 將相同的標準化資料分成 5 群。不同初始中心得到不同成員集合，且各次都已收斂。公司仍採「群內平方距離總和越小越好」的目標。若要降低單次起點不佳的影響，下列做法何者最適合？
options:
  A: 固定首次起點並增加迭代上限，保留該次已收斂的中心
  B: 採多組起點重新求解，選擇訓練耗時最短的一組
  C: 採多組起點重新求解，選各群人數最接近相等的一組
  D: 採多組起點重新求解，選群內平方距離總和最小的一組
answer: D
explanation:
  summary: K-means 的不同起點可能收斂到不同局部解。
  correct: 多組起點會探索不同的中心配置。以相同資料、尺度與群數比較群內平方距離總和，才能依既定目標選出較佳候選。多次求解可減少壞起點的影響，但不是全域最小值的保證。
  wrong:
    A: 首次結果已收斂，延長同一路徑通常不會移到另一個中心配置。迭代上限解決的是過早停止。
    B: 訓練時間衡量計算成本，不代表群內平方距離較小。最快收斂的起點也可能落在較差的局部解。
    C: 群人數相近是另一種選擇標準。群內平方距離最小的結果不必具有等量成員。
