stem: 某研究代理可呼叫多個按次收費的搜尋工具，每項工具在執行前都能取得此次費用上限。任務有固定支出上限，但代理有時因反覆搜尋而超支。多個搜尋也可能同時執行。最適合在哪裡落實預算限制？
options:
  A: 在任務提示中列出預算，並要求代理於結案時計算花費
  B: 在工具入口以不可分割的操作預留費用，餘額不足便拒絕執行
  C: 在每日帳單彙整後，依超支程度調低次日的任務額度
  D: 在代理輸出答案前檢查總費用，超標時改用較短的答案
answer: B
explanation:
  summary: 硬性支出限制須在產生費用前，由工具執行層強制檢查。
  correct: 工具入口可在執行前以費用上限預留額度，結束後再結算實際費用。檢查與預留須作為不可被其他呼叫穿插的操作，讓同時到達的呼叫不能重複使用同一份餘額，才能維持任務上限。
  wrong:
    A: 提示是行為指引，結案時計算也已晚於付費呼叫，不能提供強制的事前限制。
    C: 帳單彙整可協助後續調整，但無法阻止當前任務在執行中超支。
    D: 工具已執行便已產生成本。縮短最後答案可能減少生成費，卻不能撤回已發生的工具費。
