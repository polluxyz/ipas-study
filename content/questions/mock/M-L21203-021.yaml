stem: 某 AI 工安警示系統在一般測試集達到 98% 正確率。資安團隊另外模擬攻擊者，嘗試以刻意設計的輸入使警示失效，找到一般抽樣未出現的失敗案例。對這項測試的作用，下列判斷何者最正確？
options:
  A: 可用攻擊案例的成功防禦比例，直接取代一般現場資料的正確率估計
  B: 可用攻擊案例的出現頻率，直接估計未來現場發生此風險的機率
  C: 可用這次未找到問題的情境，作為下一版免做安全測試的依據
  D: 可補充主動尋找失效路徑的證據，與代表性資料的效能評估併用
answer: D
explanation:
  summary: 主動攻擊測試與一般效能評估各自提供不同證據。
  correct: 刻意尋找失效輸入能補足一般測試未涵蓋的攻擊路徑。但這些案例是針對弱點挑選的，不代表現場樣本分布。應將攻擊測試與一般效能評估互補使用，並持續驗證防護。
  wrong:
    A: 攻擊案例具有挑選偏差，成功防禦比例不能取代在代表性現場資料上的正確率。
    B: 測試者主動搜尋特定攻擊，案例頻率不等於現場事件的自然發生機率。
    C: 一次測試未發現問題只涵蓋當次範圍，新版本或新攻擊仍需重新評估。
