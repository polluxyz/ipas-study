stem: 某 AI 助理首年建置費 40 萬元，全年固定維運費 60 萬元。若需求全由系統處理，首年可避免支出 120 萬元；效益與實際採用率成正比，成本不隨採用率變動。採用率可能落在 40% 至 90%，目前未實測。評審最應要求補哪項證據，才能判斷首年收支是否為正？
options:
  A: 以代表性流程實測採用率，估計可避免支出的範圍
  B: 以較大模型重跑離線題庫，估計參數增加後的分數
  C: 以資料壓縮測試量測儲存量，估計輸入檔案的大小
  D: 以介面壓力測試量測吞吐，估計每秒可接受的請求
answer: A
explanation:
  summary: 財務結論會隨採用程度翻轉時，須優先驗證採用假設。
  correct: 首年成本共 100 萬元。採用率為 40% 時效益是 48 萬元，為 90% 時效益是 108 萬元，收支結論不同。應優先實測採用率，確認預估效益是否有足夠依據。
  wrong:
    B: 離線題庫可檢查模型能力，卻不能直接推得員工在實際流程中的採用比例；參數增加也不等於支出減少。
    C: 儲存量可支援容量規劃，但本題維運成本已固定，檔案大小不是造成首年收支翻轉的關鍵未知量。
    D: 吞吐量可驗證系統能否承受負載，但能處理多少請求不代表實際需求會採用系統，仍缺效益假設的證據。
