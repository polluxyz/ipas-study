stem: 某分類模型離線 F1 為 0.88，上線後只有 0.61。團隊用相同版本模型重播同一批案件，發現離線與線上產生的特徵向量不同，標籤與原始輸入則相同。若要釐清這項落差，最適合優先做哪項檢查？
options:
  A: 比較不同隨機種子的交叉驗證平均分數
  B: 逐欄核對兩套前處理的編碼、單位與補值
  C: 增加搜尋的模型深度與學習率組合數量
  D: 改用另一個分類指標比較線上的預測結果
answer: B
explanation:
  summary: 同筆資料的前處理不一致會造成離線與線上落差。
  correct: 相同原始案件經相同模型卻得到不同特徵，已直接指向前處理差異。逐欄核對能定位編碼、單位或補值的不一致，之後再評估模型本身的泛化問題。
  wrong:
    A: 交叉驗證可檢查離線切分波動，不能直接定位同一案件產生不同特徵的原因。
    C: 調參可改變模型能力，但不能先解釋兩套特徵轉換為何不一致。
    D: 換指標可觀察其他表現面向，無法修正模型收到不同特徵的問題。
