stem: 某平台在交易成立時預測「30 天內是否退貨」。每筆交易滿 30 天後才有完整標籤。模型與前處理均未更換，但新儀表板將最近 7 天尚未登記退貨的交易一律當成未退貨，線上 F1 因而下降。若要先確認這項下降是否代表模型退步，哪項評估安排最適合？
options:
  A: 保留最近 7 天全部交易，改以準確率比較新舊表現
  B: 保留交易當時的預測，待整批滿 30 天再核對完整標籤
  C: 保留最近 7 天已有退貨的交易，用已知結果重算 F1
  D: 保留最近 7 天全部交易，調高門檻後重算儀表板 F1
answer: B
explanation:
  summary: 評估有固定觀察期間的事件，須等標籤完整再核對當時預測。
  correct: 本例補充真值延遲的評估情境。尚未登記退貨不代表 30 天內不會退貨，過早當成負類可能把正確警報記為誤報。應保存交易成立時的預測，待整批滿 30 天再評估，並與相同觀察期間的歷史批次比較。這能先排除標籤未完整造成的假象，但不保證模型沒有其他退化。
  wrong:
    A: 換成準確率仍使用未完整的標籤，無法判斷指標變化來自模型還是觀察期間不足。
    C: 只保留已退貨交易會排除其他交易，不能估計原本整批交易上的 F1，也無法完整計算誤報。
    D: 調高門檻可能減少目前報表中的警報，卻沒有修正尚未完整的真值，不能據此確認模型品質。
