stem: |
  某廣告平台的政策禁止在成品中放置仇恨標語。文生圖請求先經文字檢查，測試提示都符合政策，但抽查發現部分生成圖片在招牌上出現違規文字。若要直接補上這個缺口，最適合增加哪項控制？
options:
  A: 檢查成品中的影像與可辨識文字，通過後才允許發布
  B: 對輸入提示增加同義詞比對，通過後直接發布生成圖
  C: 核對成品與提示的語意相似度，達到門檻就允許發布
  D: 在生成圖附上 AI 來源標示，完成標示後就允許發布
answer: A
explanation:
  summary: 輸入合規不能替代對生成成品的內容檢查。
  correct: 違規標語出現在生成結果，因此需要檢查成品。辨識圖片內文字並連同視覺內容檢查，再決定是否發布，才能涵蓋輸入提示沒有呈現的風險。
  wrong:
    B: 輸入字詞比對能檢查使用者要求，卻看不到生成過程額外產生的招牌文字，無法直接攔下本例成品。
    C: 語意相似度衡量是否符合提示主題，不是仇恨內容的判定工具。圖片可能符合廣告主題卻同時含有違規標語。
    D: 來源標示可揭露使用 AI 製作，但不會檢查或移除違規標語，也不能替代平台的發布政策。
