stem: 某倉庫 AI 曾將易碎品送往錯誤輸送帶。現場人員及時攔下 3 次，尚未造成貨損。團隊想在損害發生前修正風險。最適合如何處理這些紀錄？
options:
  A: 將攔下的案件計入人工處理效率，依貨損報表決定風險改善順序
  B: 將攔下的案件計入成功配送量，依整體配送成功率決定改善順序
  C: 將攔下的案件計入人員訓練成果，依訓練完成率決定改善順序
  D: 將險些造成損害的案件納入風險追蹤，分析成因並驗證防護措施
answer: D
explanation:
  summary: 未造成損害的失效事件也能提供風險證據。
  correct: 人工攔截阻止了損害，但模型送錯輸送帶的路徑仍存在。追蹤險些出事的案件，可以在貨損前發現共同原因，並驗證是否已有可靠的預防或攔截措施。
  wrong:
    A: 人工處理效率有營運價值，但只依已發生貨損排序，會漏掉尚未造成損害的失效路徑。
    B: 最終配送成功可能仰賴臨時攔截，成功率無法呈現模型本身的失效風險。
    C: 訓練完成率反映人員是否受訓，不能直接確認送錯路徑的原因與控制效果。
