stem: 某公司要建立每張訂單一列的訓練資料。訂單表有 10,000 列，明細表平均每張訂單有 3 項商品。直接依訂單編號連接後變成 30,000 列，且大訂單出現更多次。若模型目標仍是每張訂單的總成本，最適合如何準備？
options:
  A: 保留連接後的每列資料，將訂單總成本複製到每筆商品明細
  B: 保留連接後的每列資料，將訂單總成本除以該訂單的商品項數
  C: 每張訂單隨機保留一筆明細，將該筆商品內容代表整張訂單
  D: 先依訂單彙總明細特徵，再與訂單表連接並檢查一單一列
answer: D
explanation:
  summary: 連接後的資料粒度要與預測單位一致。
  correct: 建模單位是訂單，應將明細彙總為訂單層級的特徵，再核對連接鍵與列數。直接保留一對多連接結果，會讓商品項數較多的訂單在訓練時獲得較高權重。
  wrong:
    A: 複製總成本會讓一張訂單重複參與訓練，項數越多權重越高。
    B: 除以項數改成不同的目標值，且仍保留每筆明細一列，已不符合訂單總成本的任務。
    C: 抽一筆明細會丟失其他商品資訊，不能保留完整的訂單特徵。
