stem: 某團隊已有 600 筆人工標註資料與 20,000 筆未標註資料，每週只能再請人標 100 筆。目標是利用模型挑出最值得補充人工答案的案例。下列流程何者最符合此目標？
options:
  A: 挑高信心樣本，採模型預測作標籤後加入訓練
  B: 挑有資訊價值的樣本，取得人工標籤後加入訓練
  C: 挑各群中心作壓縮表示，保留為未標註資料訓練
  D: 挑兩種擾動的樣本，以預測一致性作為訓練目標
answer: B
explanation:
  summary: 主動學習用模型協助選樣，再向人取得新標籤。
  correct: 本題的限制是人工標註名額，目標是決定把名額用在哪些樣本。模型選樣、人員提供答案、再更新模型，符合主動學習的流程。
  wrong:
    A: 這是偽標籤策略，增加的是模型產生的標籤，沒有取得本題要補充的人工答案。
    C: 群中心壓縮可保留資料結構，但若不取得人工答案，就沒有完成標註名額的選樣與使用。
    D: 一致性訓練利用未標註資料的擾動，並未決定哪些資料應送人工標註。
