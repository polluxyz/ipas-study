stem: 某履歷抽取模型對 100 個真值各產生 1 個候選。人工核對發現：70 個邊界及類型都正確，20 個類型正確但漏掉名稱尾字，10 個邊界正確但類型錯誤。若下一輪要優先減少最大的錯誤來源，最適合安排哪項工作？
options:
  A: 增加不同實體類型的類別權重試驗
  B: 加強名稱結尾的邊界標註與訓練樣本
  C: 建立同名實體連到資料庫的比對規則
  D: 補標實體之間的任職關係訓練樣本
answer: B
explanation:
  summary: 先區分實體邊界錯誤與類型錯誤，再決定改善目標。
  correct: 最大錯誤群是 20 個漏掉尾字的候選。補強名稱結尾的標註一致性與訓練案例，能直接對準這類範圍錯誤。
  wrong:
    A: 類別權重主要調整類型學習的代價，與漏掉名稱尾字的邊界錯誤不同。
    C: 實體連結處理名稱指向哪個資料庫對象，不能直接補正原文名稱的擷取邊界。
    D: 任職關係標註用於關係抽取；本題最大的錯誤發生在單個實體的範圍。
