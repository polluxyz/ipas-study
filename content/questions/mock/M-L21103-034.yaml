stem: 某客服模型測試以「文字逐字相同」判分。標準答案是「請於七日內寄回」，候選是「請在 7 天內寄回商品」。人工核對 120 組這類差異，確認期限與行動皆一致，但自動分數為 0。最適合如何修正這類驗收？
options:
  A: 擴增同類測試案例的筆數，繼續用逐字相同判分
  B: 改按候選答案的字數接近程度，判定資訊是否正確
  C: 改按候選答案的生成機率高低，判定資訊是否正確
  D: 先統一等價數字與用語，再核對期限及行動的語意
answer: D
explanation:
  summary: 可接受同義表達的任務，不宜只用逐字比對驗收。
  correct: D 對表面形式的等價差異作正規化，再檢查真正影響任務的期限與行動。這樣可辨認七日與 7 天的同義關係，同時仍能擋下期限或行動被改變的錯誤。
  wrong:
    A: 增加測試案例可減少抽樣波動，但逐字比對仍會把同義答案判錯，沒有修復指標與任務的落差。
    B: 長度相近的句子仍可能把七日改成三日，字數不能代表期限與行動一致。
    C: 生成機率反映模型對字詞序列的偏好，不直接證明內容符合來源與業務要求。
