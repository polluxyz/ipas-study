stem: 某系統用事件日誌預測接下來 7 天需求。日誌每天有 2 至 200 列，且有些天沒有事件。團隊按時間排序後使用每折 70 列的驗證區段，但各折涵蓋天數不同。若要比較固定 7 天部署期間，哪項調整最適合？
options:
  A: 維持每折 70 列驗證，增加折數並改用更多時間起點
  B: 改成每折 140 列驗證，將較大的列數視為完整的一週
  C: 維持每折 70 列驗證，讓訓練列數與驗證列數保持固定比例
  D: 依時間戳指定連續 7 天作驗證，並將訓練限制在起點之前
answer: D
explanation:
  summary: 按列數切分不等於按相同經過時間切分。
  correct: 每天事件量不同時，固定列數會對應不同長度的日曆期間。以時間戳設定 7 天邊界，才能對齊實際部署的預測期間。沒有事件的日子也屬於這段期間。
  wrong:
    A: 增加起點能擴充觀察次數，但每折期間仍取決於事件密度。
    B: 增加固定列數仍不能保證涵蓋 7 天，事件稀疏與密集期間會有差異。
    C: 固定列數比例控制的是資料量，沒有固定驗證的經過時間。
