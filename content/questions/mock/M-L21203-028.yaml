stem: 某企業的文件助理在檢索時會依員工權限篩選文件，但答案快取只以提問文字為索引，保存 15 分鐘。主管問過的薪資問題被快取後，無薪資權限的員工問同一句話，便直接收到主管的答案。哪項調整最適合？
options:
  A: 將答案快取改成加密儲存，沿用提問文字作為快取索引
  B: 提高檢索文件的相關性門檻，沿用現有答案快取的查詢流程
  C: 讓快取重用檢查目前的授權範圍，失去權限時使對應快取失效
  D: 縮短答案快取的保存時間，讓相同問題較快重新進入檢索流程
answer: C
explanation:
  summary: 答案快取不能繞過原本在檢索階段執行的授權限制。
  correct: 權限篩選只在檢索執行，快取命中便跳過此步驟。快取重用必須綁定並檢查授權範圍，也要處理權限撤回，才能避免把主管可讀的答案送給未獲授權的人。
  wrong:
    A: 儲存加密保護落地資料，但應用程式仍會解密並回傳給快取命中的員工，授權缺口未修正。
    B: 快取命中時不會再次檢索，調整檢索相關性無法保護這條回應路徑。
    D: 較短保存時間可縮短暴露期間，但未到期的答案仍會跨權限回傳，沒有建立授權檢查。
