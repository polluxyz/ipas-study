stem: 某庫存團隊讓候選補貨模型接收正式請求的複本，準備比較新舊建議。測試時發現候選服務也會呼叫正式採購系統。團隊要保留真實輸入的測試價值，並避免候選結果改變庫存。最適合的處理為何？
options:
  A: 為候選服務使用獨立的正式採購帳號，另行標記產生的訂單
  B: 將候選服務的採購呼叫改成每日批次，再比對新舊補貨結果
  C: 將候選服務的寫入導向隔離的模擬端，正式採購仍由現行版執行
  D: 為候選服務的採購呼叫加入唯一識別碼，將各次呼叫分別記錄
answer: C
explanation:
  summary: 影子測試要隔離業務寫入，不能只隔離回傳畫面。
  correct: 讓候選模型接收真實輸入並寫入隔離的模擬端，可以觀測建議及介接流程。正式採購仍由現行版決定，可避免影子測試產生真實庫存變動。
  wrong:
    A: 獨立帳號可改善追蹤，但帳號仍有正式建單能力，候選結果依然會改變庫存。
    B: 批次延後了寫入時間，沒有隔離採購副作用，仍會產生真實訂單。
    D: 唯一識別碼有助於追蹤與去重，但不能阻止候選服務新增與現行版不同的真實訂單。
