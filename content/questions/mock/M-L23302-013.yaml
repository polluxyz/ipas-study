stem: 某串流分類器先收到類別 0、1，已知完整任務還包含稍後才到達的類別 2。工程師使用 SGDClassifier.partial_fit 延續同一模型，不能等到全部資料到齊。第一次呼叫的 classes 應如何設定，才能容納已知的完整任務？
options:
  A: 先用 classes=[0,1]，首次遇到 2 時再擴成 [0,1,2]。
  B: 先用 classes=[0,1]，後續省略 classes 就能自動新增 2。
  C: 先用 classes=[2]，因為只有尚未出現的類別需要登記。
  D: 先用 classes=[0,1,2]，即使第一批沒有任何類別 2。
answer: D
explanation:
  summary: 增量分類器首次更新須知道整段任務的完整類別集合。
  correct: 補充：SGDClassifier.partial_fit 的首次呼叫須提供完整 classes，第一批的 y 不必包含全部類別。先登記 [0,1,2]，模型才能建立相容的類別結構。後續沿用同一類別集合，不能靠省略參數或改傳新清單，自動擴充成新任務。
  wrong:
    A: 後續 classes 須與首次呼叫一致，不能用它直接增加模型未登記的類別。
    B: 省略 classes 代表沿用既有集合，不是自動辨識並擴充新類別。
    C: classes 是完整任務集合，不是只列未出現的類別；否則首批 0、1 也不在集合內。
