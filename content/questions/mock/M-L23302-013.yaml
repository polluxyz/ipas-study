stem: |
  某設備故障分類任務有 3,000 筆資料。團隊取同一分布的 2,000 筆作為候選訓練資料，另 1,000 筆作為固定獨立驗證資料。團隊比較最大深度為 3 與不限制深度的決策樹。每次從候選資料抽取 400 筆，兩種模型使用相同的當次樣本。團隊固定演算法的亂數設定，重訓各 20 次，結果如下。

  | 模型 | 平均訓練準確率 | 平均驗證準確率 | 預測曾改變類別的驗證個案比例 |
  | --- | --- | --- | --- |
  | 最大深度為 3 | 78.4% | 73.1% | 63.5% |
  | 不限制深度 | 100% | 67.8% | 96.4% |

  最後一欄指同一驗證個案在 20 次重訓後，至少出現過 2 種預測類別的比例。兩種模型都符合部署資源限制。團隊要保留一種容量設定作為後續調整的起點。依目前證據，哪項選擇最合理？
options:
  A: 保留不限制深度的樹，因為訓練全部答對，表示換訓練樣本時也較穩定。
  B: 保留不限制深度的樹，因為預測改變較多，表示模型仍欠擬合而需較高容量。
  C: 改成最大深度為 1 的樹，因為只要繼續減少容量，驗證表現便會持續改善。
  D: 保留最大深度為 3 的樹，因為驗證表現較好，且換樣本後的預測較少改變。
answer: D
explanation:
  summary: 模型容量應兼顧驗證表現與對訓練樣本變動的敏感程度。
  correct: 最大深度為 3 的樹，在相同驗證資料上的平均準確率較高。訓練樣本更替時，曾改變預測的個案比例也較低。這兩項證據支持先保留此容量，而非只為追求訓練滿分而使用無深度限制的樹。較低的曾變比例表示本次實驗中，有較少驗證個案曾隨訓練樣本改變預測；這不代表其正式預測變異數必然較低。後續仍須比較其他深度；不能斷定深度越小越好，也不能保證深度為 3 適用所有資料。
  wrong:
    A: 訓練全部答對只反映對當次資料的擬合。驗證平均較低且換樣本後預測較常改變，並不支持較穩定的判斷。
    B: 對訓練樣本變動敏感反映高變異的風險，不能當成欠擬合的證據。無深度限制的樹已在訓練資料達到 100%，目前也沒有提高容量的成效依據。
    C: 表中只比較深度為 3 與不限制深度的樹，沒有深度為 1 的結果。容量太小可能增加偏差，不能由目前較淺的樹較好，推論繼續減少深度必然改善。
