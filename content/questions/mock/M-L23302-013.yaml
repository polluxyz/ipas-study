stem: 某團隊有 800 萬封已標註短訊，特徵是固定 10 萬維的稀疏詞向量。記憶體只能容納 1 個資料批次，線性邊界的初步驗證已達需求。團隊要分批讀完資料並延續同一模型的更新。下列起始方案何者最適合？
options:
  A: 以核支援向量機逐批重新擬合，部署最後批次的模型
  B: 以最近鄰分類器保留最新批次，用該批次樣本預測
  C: 以一般邏輯迴歸各批獨立擬合，用最後一批係數預測
  D: 以支援增量更新的線性分類器，逐批延續同一組參數
answer: D
explanation:
  summary: 依記憶體限制區分分批重建與延續模型更新。
  correct: 資料無法同時放進記憶體，且已有可行的線性邊界，因此可先用支援增量更新的線性分類器。每批沿用前批參數，再以新資料更新。固定特徵定義讓各批輸入一致，仍須另外安排收斂與驗證檢查。
  wrong:
    A: 各批獨立 fit 不會把前批支援向量與學習結果自動延續。只保留末批模型，不能代表已用全部批次更新同一模型。
    B: 最近鄰的預測依賴保留的樣本。只保留末批資料會丟掉其他批次的鄰居，不是延續累積全部資料的模型更新。
    C: 每批重新 fit 並保留末批模型，會以末批結果取代先前結果。分批載入與增量更新是不同的操作。
