codes: [L23402]
concepts: [historical-bias, label-bias]
stem: |
  某照護分配模型以過去醫療支出作為照護需求標籤。抽查發現，甲乙兩群的獨立健康評估相近，但乙群因就醫障礙而歷史支出較低，模型因此較少分配資源給乙群。兩群樣本量充足，支出也記錄正確。最適合優先處理哪項問題？
options:
  A: "檢查支出作為需求代理的偏差，採用更貼近實際需求的標籤驗證"
  B: "對乙群的低支出案例增加訓練抽樣權重，再檢查支出預測誤差"
  C: "以更深的模型學習健康特徵與支出關係，再比較支出預測準確度"
  D: "移除群體特徵後重新預測支出，將結果作為照護資源的分配依據"
answer: A
explanation:
  summary: "辨識歷史資源使用量作為真實需求代理時的偏差。"
  correct: "支出記錄正確，不代表支出能公平反映需求。就醫障礙使相同健康需求對應不同支出，若以支出作目標，就可能把歷史取得資源的差異轉成未來分配依據。"
  wrong:
    B: "重複抽取相同低支出標籤不會補足未被支出反映的需求，反而可能加強原有代理關係。"
    C: "更準確地預測支出仍可能複製歷史就醫障礙，無法直接修正支出與需求之間的差距。"
    D: "移除群體欄位不能修正標籤本身的代理偏差，其他健康與行為特徵也可能保留相關模式。"
