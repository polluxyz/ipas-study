stem: 某企業有 4 個 AI 作業系統，分別通過單一系統的可用性驗收。演練卻發現它們共用同一家模型供應商；供應商中斷時，4 個系統會同時失效。若要補足企業層級的風險評估，最適合加入哪項分析？
options:
  A: 比較各系統自己的歷史中斷率，按中斷率由低至高排序
  B: 盤點跨系統的共同相依，評估同時失效的業務衝擊
  C: 比較各系統自己的離線準確率，按準確率安排維護
  D: 盤點各系統自己的資料總量，按資料量配置備份空間
answer: B
explanation:
  summary: 企業風險評估要涵蓋多系統的共同相依。
  correct: 個別可用性合格，不表示多個系統的失效彼此獨立。共同供應商會形成集中風險，應評估多個業務同時失去 AI 支援的影響，並據此設計替代方案或相依分散措施。
  wrong:
    A: 單一系統的歷史中斷率沒有呈現供應商中斷時的共同失效與累積業務衝擊。
    C: 離線準確率評估預測品質，無法量出供應商中斷造成的共同相依風險。
    D: 資料備份有助恢復資料，資料量本身不能反映共同模型供應商失效的影響。
