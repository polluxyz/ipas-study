stem: 某購物平台試行新版促銷模型 2 天，點擊率提高，延遲也達標。發布計畫的品質門檻是「購買後 14 天內未退款的訂單比例」，本批訂單尚未到觀察期。現有資料未觸發任何回復條件。下列發布決策何者最適合？
options:
  A: 以目前點擊率作為品質替代值，將試行範圍擴大至全面使用
  B: 以目前未退款的訂單計算品質，達到原門檻後立即擴大試行
  C: 以候選模型的離線分類分數補入品質報表，再進行下一階段
  D: 維持受控試行範圍，等訂單觀察期到齊後再評估品質門檻
answer: D
explanation:
  summary: 擴量所需的延後業務結果，不能由短期替代指標補足。
  correct: 計畫要求退款觀察期到齊，才有可比較的最終訂單結果。尚未發現回復條件時可維持受控範圍，但點擊與延遲合格不足以核准擴量。
  wrong:
    A: 點擊增加可能伴隨更多衝動購物及後續退款，不能直接代表既定的未退款品質。
    B: 未到觀察期的訂單仍可能退款，提早把目前狀態當最終結果會高估品質。
    C: 離線分類分數衡量模型在測試資料的表現，不能補出本次促銷實際尚未發生的退款結果。
