stem: 某維修代理要查設備 R7 的庫存，卻把展示名稱「北區倉」填入 warehouse_id。工具回傳「欄位應為倉庫代碼」，並列出可呼叫的倉庫查詢工具。代理仍有 3 次呼叫額度。依 ReAct 的觀察與行動循環，下一步最適合如何安排？
options:
  A: 延長重試間隔，再以相同參數查詢設備庫存
  B: 更換模型的文字表達，再以相同參數查詢庫存
  C: 先查展示名稱對應的代碼，再以有效代碼查庫存
  D: 切換到備援庫存工具，沿用展示名稱作為代碼
answer: C
explanation:
  summary: 參數錯誤應依工具觀察修正，不能只套用暫時性故障的重試。
  correct: 回傳已指出輸入格式錯誤，也提供取得代碼的途徑。先查倉庫代碼再重送，可在剩餘額度內修正錯誤原因。這是讓下一步行動受工具觀察影響。
  wrong:
    A: 等待可能改善流量限制或暫時中斷，但不會把展示名稱轉成合法代碼，相同輸入仍不符合欄位要求。
    B: 錯誤在送出的欄位值，改變回覆措辭不會修正工具參數。必須取得實際代碼。
    D: 備援可處理服務不可用的情況；若沿用錯誤的識別方式，仍沒有解決展示名稱與代碼不同的問題。
