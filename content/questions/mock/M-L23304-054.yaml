stem: 某教師模型在代表性資料上準確率為 96%。20 萬參數的學生經蒸餾後，訓練與驗證準確率都停在 78%；降低正則化強度及延長訓練仍未改善。部署容量可容納 300 萬參數，且希望學生獨立推論。最適合優先測試哪項調整？
options:
  A: 提高學生權重懲罰強度，維持 20 萬參數
  B: 擴大學生至 300 萬參數，重新進行蒸餾
  C: 擴大教師至原來的兩倍，維持 20 萬學生
  D: 剪除學生更多運算通道，沿用目前蒸餾方式
answer: B
explanation:
  summary: 學生容量過小時，蒸餾也可能受限於欠擬合。
  correct: 學生連訓練資料都未能學好，降低正則化及延長訓練也未改善，容量不足是值得優先測試的原因。部署仍有空間，可擴大學生再蒸餾，並重驗品質與延遲。教師準確率高不保證任意大小的學生都能達到相同品質。
  wrong:
    A: 加強權重懲罰會進一步限制學生的學習能力，較適合處理過擬合，與本例訓練與驗證都偏低的表現不符。
    C: 更大的教師可能提供更好的目標，但本例現有教師已明顯優於學生。只擴大教師沒有處理學生本身容量不足的可能原因。
    D: 剪去更多通道會進一步減少學生容量，可降低推論成本，卻不是改善目前欠擬合的優先方向。
