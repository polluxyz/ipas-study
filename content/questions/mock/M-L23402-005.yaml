stem: 某面試系統有 400 位應徵者。女性青年、女性中年、男性青年、男性中年各 100 人，通過人數依序為 20、80、80、20。只按性別或只按年齡計算，通過率都是 50%。若要檢查是否有被總體數字掩蓋的群體差異，最適合怎麼做？
options:
  A: 沿用性別通過率，因男女相同即可代表每個子群相同
  B: 改看全體準確率，讓資格判斷取代子群的通過率比較
  C: 增加性別與年齡的交叉分組，分別檢查樣本量與通過率
  D: 合併全部應徵者，讓共同的 50% 通過率作為各子群估計
answer: C
explanation:
  summary: 單一屬性的整體比例相同，仍可能掩蓋交叉群體差異。
  correct: 按性別或年齡彙整時，各組都是 100/200=50%。但交叉分組後，通過率分別是 20%、80%、80%、20%，差異被彙整抵銷。應比較交叉群體並檢查樣本量；這能發現差異，但還不能僅憑比例推定原因或完成公平性判定。
  wrong:
    A: 男女總體相同不能推出女性青年與女性中年相同，本例兩者相差 60 個百分點。
    B: 題幹沒有提供資格真值，無法計算準確率；即使有準確率，也不能取代交叉群體檢查。
    D: 共同估計會隱藏已觀察到的子群差異，與本題要找出被掩蓋差異的目標相反。
