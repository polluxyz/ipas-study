stem: 某售後助理看到使用者有 2 筆尚未出貨的訂單，商品相同但收件地址不同。使用者只說「幫我取消那一筆」，前文沒有指定訂單。系統必須取消指定的單一訂單。哪個回應最適合？
options:
  A: 選較早出現於訂單清單的項目，沿用清單順序消除歧義
  B: 選最近建立的訂單，依時間接近程度推定使用者所指
  C: 選金額較低的訂單，先減少取消錯誤時的可能損失
  D: 詢問訂單編號或收件地址，確認所指對象後再取消
answer: D
explanation:
  summary: 任務所需的指涉資訊不足時，應先澄清對象。
  correct: 兩筆訂單都符合目前描述，前文也沒有可消除歧義的資訊。詢問能區分兩筆訂單的欄位，才能把取消動作對應到使用者指定的訂單。
  wrong:
    A: 清單順序是系統的呈現方式，使用者沒有以順序指定對象，不能據此消除指涉歧義。
    B: 建立時間不是使用者提供的選擇條件，無法據此判定「那一筆」是哪筆。
    C: 金額只影響可能的損失，不能證明所選訂單符合使用者意圖。
