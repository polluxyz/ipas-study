stem: 某三模態警報系統對影像、聲音、振動的權重為 0.5、0.3、0.2。本筆振動缺失，影像與聲音異常分數為 0.8、0.5。已驗證的缺失策略是只取可用分支，將其原權重除以可用權重總和，再加權平均；分數達 0.65 就警報。本筆結果應為何？
options:
  A: 分數 0.5500，未達警報門檻
  B: 分數 0.6500，達到警報門檻
  C: 分數 0.6875，達到警報門檻
  D: 分數 0.8000，達到警報門檻
answer: C
explanation:
  summary: 可用分支的加權平均須依既定策略重新正規化權重。
  correct: 可用權重總和為 0.5＋0.3＝0.8。分數＝(0.5×0.8＋0.3×0.5)/0.8＝0.6875，達到 0.65 門檻。這是已驗證的回退規則，不是補出振動真值。
  wrong:
    A: 0.55 是未除以可用權重總和的加權和，等同讓缺失分支以零分參與，與題定策略不同。
    B: 0.65 是將兩個可用分數直接等權平均，忽略原本 0.5 與 0.3 的權重差異。
    D: 0.80 只採影像分數，沒有將可用的聲音分支依原權重納入。
