stem: 某邊緣裝置已安裝模型第 6 版，安全政策將最低可用版本設為第 5 版。維運收到未過期、簽章有效的第 4 版套件；該版曾合法發布，但後來因漏洞停用。正式回復流程允許另案核准、限指定裝置且限時的降版例外。目前沒有例外核准。哪項更新控制最適合？
options:
  A: 驗章成功後安裝第 4 版，因為有效簽章已證明該套件目前仍獲准使用
  B: 以套件抵達時間作為新舊順序，讓最後收到的合法套件覆蓋現行版本
  C: 驗章之外也檢查最低可用版本，拒絕此次安裝並另循受控例外流程
  D: 只要曾成功安裝便納入永久白名單，讓舊套件在故障時不受版本限制
answer: C
explanation:
  summary: 合法簽署的舊套件仍可能違反現行最低版本政策。
  correct: 防止舊版重放屬補充。簽章可驗證套件來源與完整性，不能單獨證明第 4 版仍符合目前政策。裝置須另外保存可信的版本限制，並拒絕未核准的降版。若確有回復需求，應由題目所述的限裝置、限時例外另行核准與留痕。版本比對防降版的原理可參考 [TUF 更新規格](https://theupdateframework.github.io/specification/latest/)。
  wrong:
    A: 簽章有效與目前可用是兩項不同條件，已停用版本也可能保有真實的合法簽章。
    B: 重放者可以晚送舊套件，抵達時間無法代表發布版本或安全核准順序。
    D: 永久白名單會使已停用版本持續繞過限制，失去限時例外的控制意義。
