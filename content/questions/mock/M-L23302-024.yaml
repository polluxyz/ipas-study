stem: 某備料模型以真實需求 y 與預測量 ŷ 計算成本。少估的前 5 單位每單位損失 4 元，超過 5 的部分每單位損失 10 元；多估則每單位損失 1 元。令 u＝max（y－ŷ，0），o＝max（ŷ－y，0）。要讓逐筆訓練損失直接反映成本，哪個公式及 y＝20、ŷ＝12 的結果正確？
options:
  A: L＝4×min（u，5）＋10×max（u－5，0）＋o；本筆為 50 元
  B: L＝4×min（u，5）＋4×max（u－5，0）＋o；本筆為 32 元
  C: L＝10×min（u，5）＋10×max（u－5，0）＋o；本筆為 80 元
  D: L＝4×min（u，5）＋10×max（u，0）＋o；本筆為 100 元
answer: A
explanation:
  summary: 少估成本跨容量後改變斜率，須按區段計算各段增量。
  correct: 本筆少估 8 單位，前 5 單位損失 5×4＝20 元，另外 3 單位損失 3×10＝30 元，共 50 元。A 的兩個區段只各收取該段的少估量，並另加多估成本。固定的單一方向權重無法同時表達兩段不同單價。
  wrong:
    B: 32 元只用前段的 4 元單價，漏掉超過 5 單位部分的較高成本。
    C: 80 元把前 5 單位也改收 10 元，題目規則只對超過部分提高單價。
    D: 100 元讓前 5 單位同時按 4 元及 10 元收費，對前段再次計入成本。
