concepts: [drift-detection, model-retraining]
stem: |
  某服務每日有 200 萬筆輸入。分布檢定常得到很小的 p 值，但差異幅度很小，抽樣真值的品質指標仍達標。現行規則只要 p 值低於門檻就重訓，每天耗盡訓練配額。團隊要保留漂移預警，最適合的重訓觸發設計為何？
options:
  A: "提高每次檢定樣本量，仍以同一 p 值門檻觸發重訓"
  B: "改用輸入平均值作判斷，只在平均值變動時啟動重訓"
  C: "改以服務回應時間判斷，只在推論延遲上升時啟動重訓"
  D: "將差異幅度與持續性納入調查，結合真值品質決定重訓"
answer: D
explanation:
  summary: "區分統計顯著與需要重訓的實務影響。"
  correct: "大量樣本可使微小差異達到統計顯著。p 值可當預警訊號，但重訓還須考量差異大小、持續情形及預測品質，才能把有限配額用在有影響的變化。"
  wrong:
    A: "提高樣本量通常提高偵測微小差異的能力，不會處理觸發過於頻繁的原因。"
    B: "平均值可能不變而尾端或類別比例已改變，單看平均會漏掉有影響的漂移。"
    C: "延遲反映服務效能，不代表模型對新資料的預測品質，無法取代漂移與真值監控。"
