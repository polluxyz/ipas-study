stem: 某公司有 100 個客戶欄位，包含年齡、收入與消費次數，欄位順序由匯出工具隨機排列。團隊想排成 10×10 方格，再套用原本辨識影像的二維卷積網路。對此方案的初步評估，何者最正確？
options:
  A: 方格維度相同，可沿用影像模型對相鄰位置的假設
  B: 每個欄位先標準化，可建立方格內相鄰位置的關係
  C: 應先確認鄰近欄位是否具有可供卷積利用的關係
  D: 改用較大的卷積核，可建立欄位之間的業務關係
answer: C
explanation:
  summary: 資料排成方格，不代表資料具有影像的局部結構。
  correct: 卷積利用鄰近位置的結構與重複模式。任意排列的客戶欄位不具備這項依據，應先評估資料關係，再與適合表格資料的模型比較。
  wrong:
    A: 形狀符合只能讓運算執行，不能證明相鄰欄位具有類似影像像素的關係。
    B: 標準化調整尺度，不會把任意欄位排列變成具有局部意義的空間結構。
    D: 擴大卷積核會擴大觀察範圍，卻不能替任意相鄰欄位建立業務上的關係。
