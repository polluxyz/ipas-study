stem: 某團隊已用訓練集建立分類模型，接著要從 20 個候選警報門檻中挑出 F1 最高者，最後報告整套方案對未知資料的表現。團隊另有驗證集與尚未使用的測試集。哪項資料用途安排最適合？
options:
  A: 用測試集選門檻，再用測試集報告最後的 F1
  B: 用驗證集選門檻，再用測試集報告最後的 F1
  C: 用驗證集選門檻，再用驗證集報告最後的 F1
  D: 用測試集選門檻，再用訓練集報告最後的 F1
answer: B
explanation:
  summary: 門檻也是需要選擇的設定，應與最終評估分離。
  correct: 挑選門檻會使用標籤比較方案，因此屬於驗證階段。保留未參與選擇的測試集，才能較合理地評估已選定門檻的完整方案。
  wrong:
    A: 測試集同時參與門檻選擇與最終評分，最高分容易包含選擇帶來的樂觀偏差。
    C: 驗證集已用來挑出表現最好的門檻，不能再把同一分數當成獨立的最終評估。
    D: 測試集被用於選擇，而訓練集又是模型已學過的資料，兩者用途都無法提供所需的獨立評估。
