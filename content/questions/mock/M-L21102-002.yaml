stem: 某倉儲系統評估單一貨箱的定位。預測區域面積為 120 平方像素，真實區域為 100 平方像素，兩者交集為 60 平方像素。這一對區域的 IoU（交集面積除以聯集面積）為多少？
options:
  A: "0.500"
  B: "0.600"
  C: 約 0.273
  D: "0.375"
answer: D
explanation:
  summary: IoU 定位評估。
  correct: 聯集面積為 120+100-60=160。IoU 為 60/160=0.375，交集不能在聯集中重複計算。
  wrong:
    A: 這是交集除以預測區域，沒有使用聯集作分母。
    B: 這是交集除以真實區域，不是本題指定的 IoU。
    C: 這是 60/(120+100)，聯集分母未扣除重複的交集。
