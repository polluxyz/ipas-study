stem: 某影像只有 1 個真實貨箱，偵測器保留甲、乙 2 個同類框。甲的信心分數為 0.95，與真值的 IoU 為 0.60；乙分別為 0.80、0.85。評估按信心由高到低配對，IoU 至少 0.50 才合格，且每個真值只能被配對 1 次。沒有其他框或後處理。甲、乙應如何計入評估？
options:
  A: 甲、乙都計命中，因為兩個框的 IoU 都達到配對門檻
  B: 甲計誤報、乙計命中，因為乙與真值的重疊程度較高
  C: 甲計命中、乙不列入，因為同一物件的其餘框可忽略
  D: 甲計命中、乙計誤報，因為真值已被較高信心框配對
answer: D
explanation:
  summary: 一對一配對會把同一物件的額外預測計為誤報。
  correct: 甲先接受評估，IoU 達標且真值尚未配對，因此計 1 次命中。輪到乙時，同一真值已被使用，乙計為誤報。結果是命中 1、誤報 1、漏報 0；乙的 IoU 較高不會改變題目指定的處理順序。
  wrong:
    A: 重疊達標只是必要條件，還須有尚未配對的真值，不能讓同一貨箱貢獻兩次命中。
    B: 這是改按 IoU 排序的結果，題目指定按信心由高到低處理。
    C: 題目評估全部保留框，沒有忽略額外框的規則；額外偵測仍計誤報。
