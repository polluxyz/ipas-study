stem: 某團隊先以 z=(x−μ)/σ 逐欄標準化 2 個感測特徵，再做 PCA。訓練平均值 μ=(10,100)，標準差 σ=(2,10)。某筆壓縮資料經 PCA 反向投影後，在標準化空間得到 z_hat=(1,−0.5)。報表要顯示原始單位的重建值 x_hat，應輸出哪一組？
options:
  A: (1, −0.5)
  B: (11, 99.5)
  C: (12, 95)
  D: (22, 995)
answer: C
explanation:
  summary: PCA 反向投影後，仍須還原前置標準化的尺度與平均值。
  correct: z_hat 仍是標準化座標，原始單位要逐欄計算 x_hat=z_hat×σ＋μ。因此第一欄是 1×2＋10=12，第二欄是 −0.5×10＋100=95。PCA 的反向投影只還原 PCA 那一步，沒有自動取消外部標準化。
  wrong:
    A: 這仍是標準化空間中的結果，沒有換回原始單位。
    B: 這只加回平均值，漏掉先乘各欄標準差的步驟。
    D: 這是把平均值加在乘法之前，錯把 (z_hat＋μ)×σ 當成反標準化。
