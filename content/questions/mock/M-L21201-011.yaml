stem: 某企業要求案件從收件到核准不超過 24 小時。目前文件分類約需 20 分鐘，分類後固定等主管隔日批次核准，平均再等 48 小時。AI 原型能把分類縮短至 2 分鐘。現有預算只足以先推進一項改善。評估下一筆投入時，最適合先確認哪件事？
options:
  A: 分類模型能否擴大標籤數，提升可處理的文件種類
  B: 分類模型能否再降至 1 分鐘，增加每小時處理量
  C: 核准等待能否縮短，並量測整體案件完成時間
  D: 分類模型能否提高離線準確率，減少少數分類錯誤
answer: C
explanation:
  summary: 導入評估要確認改善能否解除影響目標的主要瓶頸。
  correct: 業務要求是整體核准時間。分類從 20 分鐘降至 2 分鐘，仍留下約 48 小時等待，無法達到 24 小時目標。先確認核准流程的可改善程度，才能判斷下一筆投入是否對應主要瓶頸。
  wrong:
    A: 增加標籤數可擴充分類範圍，但沒有處理占用主要時間的核准等待，無法證明能達成時限。
    B: 再省 1 分鐘有局部效率價值，但與 48 小時等待相比，不能解決本題的整體時限問題。
    D: 準確率關係到分類品質，但題幹未指出重分類是延誤主因；提高分數不會自動縮短固定核准等待。
