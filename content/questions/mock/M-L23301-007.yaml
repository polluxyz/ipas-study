stem: 某平台的支出欄位只在手機通路較常遺失，通路欄位完整。已確認在同一通路內，支出是否遺失與真實支出無關；不同通路的支出分布則明顯不同。若使用其他欄位預測缺失支出，下列設計何者最能配合已知缺失條件？
options:
  A: 將通路納入補值模型，利用同條件資料估計支出。
  B: 移除通路後補值，避免把缺失原因帶進模型。
  C: 用全體支出均值補值，視兩通路的支出分布相同。
  D: 將缺失支出直接補零，保留未觀測支出的原意。
answer: A
explanation:
  summary: 缺失取決於已觀測條件時，補值模型應納入相關條件。
  correct: 通路同時與支出分布及缺失機率有關。納入通路可讓補值使用相對應的條件分布，避免把手機與其他通路混成同一群。這與缺失由未觀測支出本身決定的情況不同；題目已明示同一通路內不再依賴真實支出。
  wrong:
    B: 通路是已完整觀測、且可解釋缺失與支出差異的欄位，移除會丟失補值所需資訊。
    C: 題目已指出通路間分布不同，全體均值會忽略這項條件差異。
    D: 缺失代表不知道支出，不等於支出確實為零。
