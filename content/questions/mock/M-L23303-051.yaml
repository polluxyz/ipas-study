stem: 某系統在相同案件上比較 2 個候選：甲有真正 60、假正 20、假負 40；乙有真正 90、假正 80、假負 10。兩者 F1 都約為 0.667。漏報每次成本是誤報的 5 倍，其他結果不計成本。主管認為 F1 相同即可任選，哪項回應最正確？
options:
  A: 依相同 F1 判定甲乙的總成本相同
  B: 依精確率判定甲的總成本較低
  C: 依錯誤成本判定乙的總成本較低
  D: 依總錯誤件數判定甲的總成本較低
answer: C
explanation:
  summary: F1 不能直接取代不對稱業務成本。
  correct: 甲的 F1 為 120/(120+20+40)，乙為 180/(180+80+10)，皆約 0.667。若誤報單位成本為 1，甲成本為 20+40×5=220，乙為 80+10×5=130，應選乙。
  wrong:
    A: F1 的相同數值不表示錯誤方向相同，更不表示乘上不同成本後仍相同。
    B: 甲的精確率較高，但漏報有 40 次，比乙更多，因此漏報成本也更高。
    D: 甲的總錯誤件數雖較少，但漏報較昂貴，不能用未加權件數取代總成本。
