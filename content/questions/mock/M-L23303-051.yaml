stem: |
  某設備警報系統在同一批驗證案件上比較 2 個候選。
  甲有假正（誤報）30 次、假負（漏報）25 次；乙依序為 90 次、15 次。
  每次誤報成本固定為 1 單位，每次漏報成本為 r 單位。
  財務部只確認 r 介於 4 與 8 之間，含端點，其他結果不計成本。
  主管想核可一個「在整個成本範圍內，總成本都不高於另一候選」的方案。
  損益平衡點指兩者總成本相等時的 r。哪項判斷最正確？
options:
  A: 損益平衡點為 3；範圍內乙都不較貴，可核可乙
  B: 損益平衡點為 9；範圍內甲都不較貴，可核可甲
  C: 損益平衡點為 6；範圍內優劣會互換，須確認成本
  D: 損益平衡點為 6；範圍中點成本相等，可任選一個
answer: C
explanation:
  summary: 成本範圍跨過損益平衡點時，不能核可全範圍都較省的候選。
  correct: |
    甲的總成本為 30+25r，乙為 90+15r。
    兩者相等時，r=(90-30)/(25-15)=6。
    r=4 時，甲為 130、乙為 150；r=8 時，甲為 230、乙為 210。
    r 小於 6 時甲較省，大於 6 時乙較省，等於 6 時兩者皆為 180。
    因此沒有一個候選符合主管的全範圍要求。
    若要依實際成本選擇，須先確認 r 位於分界的哪一側。
    本題不要求最壞成本最小，而是檢查整個範圍是否都不較貴。
    指引介紹錯誤代價與業務成本；成本範圍跨越分界的判斷屬補充。
  wrong:
    A: 損益平衡點須用多出的誤報數除以減少的漏報數，得到 60/10=6，並非 3。r=4 時，乙仍比甲貴 20 單位。
    B: 以乙的 90 次誤報直接除以漏報差 10，會漏掉甲也有 30 次誤報。正確分界為 6；r=8 時甲比乙貴 20 單位。
    D: 中點 r=6 時相等，只能說明這一點的成本。範圍兩端的優劣相反，任選一個都無法符合主管的全範圍要求。
