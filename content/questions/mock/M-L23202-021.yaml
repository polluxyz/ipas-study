stem: 某研究團隊對 120 個零件建立完整的凝聚式分群樹。團隊需要同時提供粗略分類與細部分類，且每個細群都須完整隸屬某個粗群。距離與連結準則均已選定。下列安排何者最適合？
options:
  A: 對各種群數獨立重跑 K-means，再直接用同號群建立隸屬
  B: 對各種半徑獨立重跑 DBSCAN，再按各群人數建立隸屬
  C: 對各種初始化各跑 1 次分群，再按群中心距離建立隸屬
  D: 在同一棵分群樹選取不同切割高度，保留各層的隸屬
answer: D
explanation:
  summary: 利用同一棵階層分群樹保留粗細群組的巢狀關係。
  correct: 凝聚式分群樹記錄逐次合併關係。在同一棵樹選不同高度，細群會沿既有合併路徑隸屬較粗的群。這能提供題目要求的巢狀分類，不需另外猜測群號的對應。
  wrong:
    A: 獨立執行的 K-means 可能重分配成員。同號群不代表相同語意，也不保證細群完整落在某個粗群。
    B: 獨立結果的人數相近不代表成員隸屬。僅按人數配對可能把包含不同零件的群接在一起。
    C: 群中心距離只能協助比較群組，不能保證細群全部成員都落在對應粗群內。
