stem: 某公司每週更新 AI 客服風險清單。新控制會把含敏感資訊的回覆攔下，但試行後出現大量重試，造成回覆延遲並塞滿人工佇列。若要判斷這項控制是否有效，最適合採取哪項作法？
options:
  A: 比較導入前後的外洩率、重試延遲與人工佇列，外洩率只統計遭控制攔下的回覆
  B: 比較導入前後的外洩率、重試延遲與人工佇列，延遲從使用者首次提問起算
  C: 比較導入前後的外洩率、重試延遲與人工佇列，佇列只統計當日已結案的案件
  D: 比較導入前後的外洩率、重試延遲與人工佇列，延遲從最後一次重試起算
answer: B
explanation:
  summary: 風險控制的效益與副作用都要納入驗證。
  correct: 攔截降低外洩機會，但重試及人工負荷可能引入新的服務風險。判斷控制是否有效，要正確量測外洩、使用者實際等待與人工佇列。延遲從首次提問起算，才會包含攔截造成的重試與等待。
  wrong:
    A: 遭攔下的回覆沒有送到使用者手上。只統計這些回覆，看不到漏攔後真正外洩的案件，無法判斷外洩是否減少。
    C: 尚未結案的案件正是佇列塞住的部分。只統計已結案案件，會低估人工負荷與積壓。
    D: 從最後一次重試起算，會排除前面重試花掉的時間，低估使用者實際等待。
