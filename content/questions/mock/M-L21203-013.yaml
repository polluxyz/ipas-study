stem: 某公司每週更新 AI 客服風險清單。新控制會把含敏感資訊的回覆攔下，但試行後出現大量重試，造成回覆延遲並塞滿人工佇列。若要判斷這項控制是否有效，最適合採取哪項作法？
options:
  A: 以攔截次數增加作為成功依據，沿用原定回覆與轉人工流程
  B: 同時量測外洩減少與重試延遲，調整控制並驗證人工承接能力
  C: 以平均回答品質作為成功依據，將人工佇列歸入客服效率評估
  D: 以模型推論時間作為成功依據，將重試時間移出服務評估範圍
answer: B
explanation:
  summary: 風險控制的效益與副作用都要納入驗證。
  correct: 攔截降低外洩機會，但重試及人工負荷可能引入新的服務風險。應同時評估目標風險是否下降、端到端服務是否可用，以及人工流程能否承接，再調整控制與觸發條件。
  wrong:
    A: 攔截次數不等於外洩風險降低的完整證據，也沒有處理控制造成的重試與佇列問題。
    C: 平均回答品質可能忽略未成功回覆的案件，人工佇列也是這項控制引發的系統影響。
    D: 模型推論時間排除了使用者實際經歷的重試與等待，會掩蓋控制造成的服務代價。
