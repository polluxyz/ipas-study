stem: 某公司每週更新 AI 客服風險清單。新控制會把含敏感資訊的回覆攔下，但試行後出現大量重試，造成回覆延遲並塞滿人工佇列。若要判斷這項控制是否有效，最適合採取哪項作法？
options:
  A: 以外洩事件數作為成功依據，將重試延遲與人工佇列交由客服部門另案追蹤
  B: 以外洩事件、含重試的端到端延遲及人工佇列作為依據，再調整控制條件
  C: 以攔截次數與模型推論時間作為依據，兩項達標就維持目前的控制條件
  D: 以外洩事件與回覆延遲作為依據，回覆延遲只計入一次就成功的案件
answer: B
explanation:
  summary: 風險控制的效益與副作用都要納入驗證。
  correct: 攔截降低外洩機會，但重試及人工負荷可能引入新的服務風險。應同時評估目標風險是否下降、端到端服務是否可用，以及人工流程能否承接，再調整控制與觸發條件。
  wrong:
    A: 外洩減少是必要證據，但把控制造成的延遲與佇列移到另案，無法判斷這項控制的整體效果。
    C: 攔截次數不等於外洩減少。模型推論時間也不含使用者實際經歷的重試與等待。
    D: 只計一次就成功的案件，會排除重試與轉人工的案件，正好漏掉控制造成的延遲。
