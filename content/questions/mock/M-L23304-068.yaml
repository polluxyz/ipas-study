stem: 某神經網路在前 4 輪直接使用學習率 0.01 時，梯度與損失常明顯震盪；但若前 4 輪先使用較小步幅，之後切到 0.01，訓練就穩定且下降快速。總預算為 60 輪，團隊希望兼顧初期穩定與中段速度。哪個排程最符合這項實驗證據？
options:
  A: 前 4 輪維持 0.01，第 5 輪降至 0.001
  B: 前 4 輪由 0.01 升至 0.02，之後降回 0.01
  C: 前 4 輪由 0.001 升至 0.01，之後維持 0.01
  D: 前 4 輪維持 0.02，第 5 輪降至 0.001
answer: C
explanation:
  summary: 學習率預熱讓初期使用小步幅，再進入可穩定使用的目標步幅。
  correct: 實驗指出不穩定集中在初期，且過渡期後可穩定使用 0.01。前 4 輪由低至高的預熱排程，最符合先穩定初期、再保留中段速度的目標；仍應持續監控驗證表現。
  wrong:
    A: 初期仍直接使用已觀察到會震盪的 0.01，降率時機落在過渡期之後，沒有對準問題發生的階段。
    B: 前 4 輪從已不穩的 0.01 再提高到 0.02，會擴大初期步幅，與小步幅有效的實驗結果相反。
    D: 初期使用更高步幅，之後又降到較低步幅，既未穩定初期，也未保留已驗證有效的中段學習率。
