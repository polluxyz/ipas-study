stem: 某二元風險模型使用 8 個已確認的特徵，先導分析支持加成的線性對數勝算關係。業務要求正式分數能由固定截距與各特徵乘上係數後相加重現。候選品質相近，最適合優先選哪種模型？
options:
  A: 採隨機森林，以整體特徵重要性作為加總係數
  B: 採梯度提升樹，以各特徵分裂次數作為加總係數
  C: 採邏輯迴歸，以已訓練係數計算機率轉換前的分數
  D: 採深度網路，以局部近似係數代替正式模型分數
answer: C
explanation:
  summary: 需要固定加成分數時，應選擇結構直接相符的模型。
  correct: 邏輯迴歸的機率轉換前分數是截距加上各特徵的線性項，符合題目要求的重現方式，也和先導分析的假設一致。這些係數描述模型關係，不直接代表因果效果。
  wrong:
    A: 隨機森林的重要性不是帶方向的加成係數，用重要性加總無法重現森林的預測分數。
    B: 分裂次數衡量特徵使用頻率，不能替代每棵樹的條件分支與葉節點輸出。
    D: 局部近似只描述某個鄰近區域，不等於正式深度網路共用的一組固定加成係數。
