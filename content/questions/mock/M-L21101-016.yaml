stem: 某長文分類模型每次只能讀取 512 個詞元，服務固定截取文章開頭。人工發現 1,800 個詞元的文件常在末段才寫出判定所需的故障原因。模型本身暫不更換。最適合優先測試哪項調整？
options:
  A: 保持只輸入開頭，以補齊符號取代末段的缺漏內容
  B: 將全文分成可讀區段，設計並驗證各段證據的彙整方式
  C: 保持只輸入開頭，增加訓練輪數以強化末段原因辨識
  D: 保持只輸入開頭，增加分類頭寬度以擴充可讀文章範圍
answer: B
explanation:
  summary: 被前處理截掉的判定證據不會進入模型。
  correct: 問題是故障原因未被送入模型。分段處理可讓末段也參與分類，再依任務設計文件層級的彙整規則。必須驗證彙整能保留故障證據，不能只靠增加模型訓練量。
  wrong:
    A: 補齊符號沒有故障原因的語意內容，只能調整長度，不能重建被刪除的證據。
    C: 增加訓練輪數不會讓模型看見被截掉的末段，缺少輸入證據的問題仍存在。
    D: 分類頭寬度不決定文字輸入長度，也不會自動讀到未送入的詞元。
