stem: 某即時系統的資料關係約每 10 分鐘改變。兩個候選的推論都達標，單次重訓期限均為 8 分鐘。甲每隔 10 分鐘啟動，重訓耗時 2 分鐘，歷史準確率 94%。乙每隔 5 分鐘啟動，重訓耗時 4 分鐘，歷史準確率 92%。每次重訓只納入啟動當下已取得的資料，完成後立即替換線上模型。假設標註即時可得，排程長期穩定，沒有其他延遲。團隊先以資料截止時間的最大落後，是否超過 10 分鐘作初步比較。下列判斷何者最適合？
options:
  A: 採甲，以 2 分鐘重訓耗時判斷資料仍夠新
  B: 採乙，以約 9 分鐘最大落後判斷資料仍夠新
  C: 採甲，以 94% 歷史分數判斷更新後品質較佳
  D: 兩者皆可，以 10 與 5 分鐘判斷最大落後皆合格
answer: B
explanation:
  summary: 持續更新時，資料新鮮度取決於啟動間隔與重訓耗時。
  correct: 新版完成前，線上仍使用上一版，其資料截止於上一次重訓啟動時。最大落後的上限為「啟動間隔＋重訓耗時」。甲為 10＋2＝12 分鐘，超過 10 分鐘的資料變動週期；乙為 5＋4＝9 分鐘，未超過。因此乙較符合這項資料新鮮度要求。兩者單次重訓都在 8 分鐘內，不能只靠重訓期限決定。這是更新策略的評估依據，線上品質仍須持續實測。
  wrong:
    A: 2 分鐘只代表新版剛完成時的資料落後。等待下一版完成期間，甲的資料落後會接近 12 分鐘，不能只看單次重訓耗時。
    C: 較高的歷史準確率沒有反映持續運作中的資料落後，不能證明甲在資料關係改變後仍有較佳品質。
    D: 只用啟動間隔，漏算了新版重訓期間仍在使用舊版的時間。兩段時間須相加，甲與乙的上限分別是 12 與 9 分鐘。
