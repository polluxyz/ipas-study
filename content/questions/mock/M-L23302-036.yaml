stem: 某系統的資料關係約每 10 分鐘改變，必須在每批新標註到齊後 8 分鐘內完成重訓。兩個候選推論都達標；甲每次重訓要 40 分鐘，乙要 4 分鐘。甲在歷史資料的分數略高。選型時，下列處理何者最適合？
options:
  A: 採甲，將重訓工作改為每 40 分鐘才啟動一次
  B: 採乙，並以持續按時更新的條件評估線上品質
  C: 採甲，增加同時等待重訓的批次數量
  D: 採甲，改以更長期間的歷史平均分數驗收
answer: B
explanation:
  summary: 更新頻率也會限制模型是否能在現場持續使用。
  correct: 乙能在重訓期限內更新，才有機會使用新批資料回應快速變化。應比較持續運作下的品質，不能只用較舊資料上的分數忽略更新時效。
  wrong:
    A: 降低更新頻率會讓模型錯過題目要求的更新期限，歷史分數較高不能補足時效不足。
    C: 增加等待批次不會縮短單次四十分鐘的重訓時間，反而可能累積尚未學習的新資料。
    D: 拉長歷史平均期間會掩蓋短期過期的問題，不能確認每批更新是否及時。
