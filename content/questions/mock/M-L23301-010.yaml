stem: |
  某工廠清理壓力資料。待機時正常範圍為 2 至 3，運轉時為 12 至 14；待機壓力 5 或運轉壓力 10 都可能是異常。運轉模式在讀值產生時即可取得。現有流程只按全體壓力大小篩選，難以辨識這些模式內的偏離。下列改善方向何者最適合？
options:
  A: 以壓力 10 作全體資料的共同上限，再將超出上限者列為異常
  B: 依待機與運轉分別建立正常範圍，再檢查各模式內的偏離程度
  C: 以壓力 15 作全體資料的共同上限，再將未超出上限者列為正常
  D: 將各筆壓力轉成全體資料的百分位，再用同一高百分位篩選異常
answer: B
explanation:
  summary: 依運轉條件判斷偏離，避免全體門檻遮蔽模式內的異常。
  correct: 相同壓力在不同模式中意義不同。以模式建立參考範圍，才能將待機時偏高與運轉時偏低的讀值列為候選。模式資訊在當下可用，因此也能一致套用到新資料。
  wrong:
    A: 共同上限 10 會把正常運轉的 12 至 14 列為異常，也無法辨識待機壓力 5。
    C: 共同上限 15 會讓題幹列出的 2 種異常都落在正常範圍內。
    D: 全體百分位保留全體大小排序，仍沒有加入模式條件，無法識別各模式自己的正常範圍。
