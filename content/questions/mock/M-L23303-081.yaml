stem: 某工廠驗證耗電量預測模型。獨立驗證批次的 4 台設備實際耗電量均為 100 度，模型預測依序為 98、99、101、102 度。報告規定直接依「R²＝1－殘差平方和／真值相對平均值的平方差總和」計算，沒有另訂分母為 0 的替代規則。這批資料的 R² 應如何記錄？
options:
  A: 記為 0，因為模型預測不如使用真值平均數的基準
  B: 標為無法定義，因為真值無變異使公式分母為 0
  C: 記為負值，因為模型的殘差平方和大於真值總變異
  D: 記為 1，因為真值固定代表模型已解釋了全部變異
answer: B
explanation:
  summary: 使用 R² 前，須確認真值的總變異是否為 0。
  correct: 真值平均為 100 度，每筆真值與平均值的差都為 0，因此公式分母為 0。殘差平方和為 4＋1＋1＋4＝10，不能把 10／0 當成一般實數運算。依題定公式，R² 無法定義；仍可另以均方誤差 10／4＝2.5 度平方記錄預測偏差。指引提供 R² 公式，本例由分母條件判斷公式的適用限制。
  wrong:
    A: R² 為 0 的一般解讀，以真值總變異大於 0 為前提。本例平均數基準的平方誤差為 0，模型的平方誤差卻為 10；題目也沒有把特殊情況記為 0 的規則。
    C: 真值總變異大於 0 時，殘差平方和較大才可算出負 R²。本例分母為 0，不能只比較兩個平方和就直接寫成負值。
    D: 真值固定不代表預測正確，本例仍有預測偏差。公式分母為 0 時，不能用「解釋全部變異」推出 R² 為 1。
