stem: 某需求模型在固定資料上訓練。第 10 輪的訓練與驗證平均絕對誤差分別為 8、10 件；第 20 輪為 3、7 件。兩輪均以相同方式量測資料誤差。主管因兩者差距從 2 件擴大為 4 件，認為第 20 輪的驗證預測已惡化。哪項判斷最正確？
options:
  A: 差距擴大代表第 20 輪的驗證誤差較大
  B: 驗證誤差仍在降低，差距擴大不足以支持該結論
  C: 訓練誤差降低代表之後各輪的驗證誤差也會降低
  D: 驗證誤差高於訓練誤差，代表第 10 輪已無法使用
answer: B
explanation:
  summary: 判讀訓練與驗證落差，也要看驗證誤差本身的變化。
  correct: 驗證平均絕對誤差從 10 降為 7，第 20 輪在這份驗證資料上更好。差距擴大值得持續觀察，但不能直接說驗證表現已惡化。
  wrong:
    A: 差距擴大可能是訓練誤差下降得更快。本例驗證誤差實際下降，並未變大。
    C: 訓練誤差與未來驗證誤差沒有這種保證，後續仍可能出現驗證誤差上升。
    D: 驗證誤差略高於訓練誤差很常見，是否可用仍須看驗收標準與未見資料表現。
