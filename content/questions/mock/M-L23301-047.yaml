stem: 某監測模型有 60 個特徵，分別來自 6 種感測器。只要保留某感測器的任一特徵，就需支付該感測器的完整成本。團隊要在相同預測品質下減少硬體成本，最適合如何進行特徵選擇？
options:
  A: 按感測器分組移除特徵，以驗證品質與總成本比較
  B: 按單一特徵的重要性排序，保留固定數量的前幾名
  C: 按單一特徵的變異量排序，保留固定數量的前幾名
  D: 按感測器的特徵數排序，優先保留產生較多特徵者
answer: A
explanation:
  summary: 特徵選擇的成本單位應與實際硬體成本一致。
  correct: 只有移除某感測器的全部特徵，才能省下該感測器的成本。把感測器當成選擇單位，再比較各組的驗證品質與總成本，才對應題目的目標。
  wrong:
    B: 固定特徵數可能仍分散在全部 6 種感測器上，特徵較少不代表硬體成本下降。
    C: 變異量沒有考慮預測能力，也沒有反映同一感測器的成本共用關係。
    D: 產生較多特徵不等於預測價值較高，也無法證明這些感測器符合最低成本目標。
