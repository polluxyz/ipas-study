stem: 某團隊合併兩座工廠的重量特徵。甲廠 2.5 代表公斤，乙廠 2500 代表公克，兩者是同樣重的零件。欄位目前都叫 weight，團隊準備共同訓練距離式模型。最適合先做哪項處理？
options:
  A: 把兩廠合併後共同標準化，讓尺度轉換吸收單位差異
  B: 依來源將重量轉成相同單位，再檢查分布與縮放
  C: 把 weight 轉為字串類別，讓模型從代碼學習重量
  D: 依全體重量的四分位距，先移除超出範圍的讀值
answer: B
explanation:
  summary: 相同欄位的物理單位要先統一，再進行數值縮放。
  correct: 2.5 公斤與 2500 公克應轉成相同數值。若直接混合，共同標準化只對錯誤的混合尺度做線性轉換，無法辨識來源單位。應先按來源統一重量單位，再評估後續縮放。
  wrong:
    A: 共同平均與標準差不知道哪筆使用公斤或公克，不會自動修正 1000 倍的單位差。
    C: 把重量改成字串會失去重量的連續大小關係，也未建立兩種單位的對應。
    D: 有效重量可能因單位差被誤判為離群值；應先修正欄位一致性，再判斷異常。
