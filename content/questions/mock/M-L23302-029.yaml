stem: 某模型每次接收 4 至 20 顆零件的量測向量，輸出整批品質。零件輸入順序沒有意義，任意重排後結果應相同；零件數量也要影響預測。部署端希望沿用同一組固定參數，哪項設計最適合？
options:
  A: 依輸入順序串接向量，補零後交給一般全連接網路
  B: 依輸入順序交給循環網路，以最後隱藏狀態預測
  C: 共用網路轉換每顆零件，向量加總並附筆數後預測
  D: 共用網路轉換每顆零件，只取第一顆向量交給預測頭
answer: C
explanation:
  summary: 無序且長度可變的輸入，可用共享轉換與對稱聚合。
  correct: 每顆零件使用相同轉換，向量加總不受排列順序影響，輸出維度也固定。附加的筆數明確保留數量資訊，再由預測頭學習整批品質。
  wrong:
    A: 一般全連接網路把不同位置視為不同輸入，補零只解決長度，不能保證排列後結果相同。
    B: 循環網路的隱藏狀態依處理順序更新，一般不具備任意排列不變性。
    D: 第一顆會隨排列改變，且其餘零件與零件數未被聚合，無法表達整批條件。
