stem: 某倉庫要調整搬運車的派工策略。每次指派會改變後續車輛位置與塞車情形，目標是降低整個班次的總等待時間。團隊有可安全反覆試行的模擬環境，但沒有每個狀態的最佳指派標籤。最適合優先評估哪種建模方式？
options:
  A: 以每次行駛距離為目標訓練迴歸器，每步選距離最短的任務
  B: 以歷史派工員的動作訓練分類器，每步重現既有派工規則
  C: 以車輛當下位置進行分群，每步優先指派同群內最近任務
  D: 在模擬環境中訓練強化學習策略，以班次累積回饋評估行動
answer: D
explanation:
  summary: 行動會影響後續狀態時，要考慮跨步驟的累積結果。
  correct: 題目有安全互動的模擬環境，行動會改變後續狀態，目標也跨越整個班次。強化學習可透過互動與累積回饋學習派工策略，無須每個狀態都有最佳動作標籤。仍須在模擬環境驗證並限制實際部署風險。
  wrong:
    A: 最短單次距離是局部目標，可能造成後續車輛擁塞，不能直接代表整班總等待時間最小。
    B: 歷史動作不是題目提供的最佳指派標籤。模仿既有派工也沒有直接最佳化班次累積等待的目標。
    C: 位置分群描述當下的空間結構，群內最近原則沒有評估動作對後續塞車與等待的影響。
