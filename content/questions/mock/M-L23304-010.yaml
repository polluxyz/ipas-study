stem: 某團隊把 4 筆資料分成 2 個等大小微批次，每個微批次的平均損失都乘 1/2 後才累積梯度，最後更新 1 次。模型含訓練模式的 BatchNorm。工程師認為這必定等同 4 筆一起前向傳播。以下比較兩種前向結果，哪項判斷最正確？
code: |
  import torch
  x = torch.tensor([[0.0], [2.0], [10.0], [12.0]])
  large = torch.nn.BatchNorm1d(1, affine=False, track_running_stats=False)
  micro = torch.nn.BatchNorm1d(1, affine=False, track_running_stats=False)
  y_large = large(x)
  y_micro = torch.cat([micro(x[:2]), micro(x[2:])])
  print([round(v, 3) for v in y_large.flatten().tolist()])
  print([round(v, 3) for v in y_micro.flatten().tolist()])
code_lang: python
options:
  A: 不保證相同；每個微批次使用的平均值與變異數不同。
  B: 必定相同；損失權重正確便會統一前向使用的統計量。
  C: 必定相同；延後更新權重會讓 BatchNorm 等到最後才計算。
  D: 不保證相同；原因只是兩種方法使用的樣本總數不同。
answer: A
explanation:
  summary: 正確累積梯度權重，不能消除批次相依的前向運算差異。
  correct: 補充：訓練模式的 BatchNorm 在每次前向傳播使用當次批次的統計量。本例兩個微批次分別以約 1 與 11 為中心，整批則以 6 為中心，輸出因而不同。損失乘上正確比例只能處理損失加權，不能把已計算的正規化結果改成大批次結果。
  wrong:
    B: 損失權重作用於後續反傳，不會改變前向時已使用的平均值與變異數。
    C: BatchNorm 在每次前向就計算當次統計，不是等到優化器更新才處理。
    D: 兩種方法都使用相同 4 筆資料；差別是分批運算的統計範圍。
