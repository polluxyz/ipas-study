stem: 某耳機品牌分析 3,000 則評論，其中常見「音質清楚，但配戴會痛」。產品團隊要分別決定聲學與外型的改善優先順序，現有系統只給整則評論 1 個正負標籤。最適合如何調整？
options:
  A: 分別辨識音質與配戴的評價對象，再判斷各自情感方向
  B: 擷取每則評論最後的情感詞，讓各評價對象共用該標籤
  C: 增加整則評論的正負級距，依總分同步評估音質與配戴
  D: 統計音質與配戴的提及次數，以提及較多者代表較滿意
answer: A
explanation:
  summary: 同一則評論可對不同產品面向表達相反態度。
  correct: 本例對音質是肯定，對配戴是負面。以評價對象分開標註情感，才能把回饋對應到聲學與外型的改善需求。整句的單一極性會掩蓋這項差異。
  wrong:
    B: 最後的情感詞可能只描述其中一個面向，共用標籤會把配戴的不滿錯套到音質。
    C: 增加整句分數的級距仍沒有把情感對應到不同面向，無法分別判斷音質與配戴。
    D: 提及次數反映討論量，不能判定滿意或不滿意，負評也可能帶來大量提及。
