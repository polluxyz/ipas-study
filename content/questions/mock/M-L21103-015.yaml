stem: 某語音客服把「房號 202」與「總價 202 元」送入同一合成服務。驗收要求前者念成「二零二」，後者念成「二百零二元」。聲音清晰自然，但兩處數字都被念成「二百零二」。最適合優先調整哪個環節？
options:
  A: 依欄位語意指定數字讀法，再檢查合成語音的內容
  B: 調整音色與音高設定，利用相同數字字串產生不同角色聲音
  C: 提高輸出音訊取樣率，讓數字音節的高頻資訊保留更完整
  D: 調整播放音量與語速，讓房號與金額使用相同的數字讀法
answer: A
explanation:
  summary: 數字發音要依文字語意決定，不能只驗收音質。
  correct: 房號需要逐位讀出，金額則依數值讀出。應在文字前處理或服務支援的讀音控制中指定適當讀法，再檢查實際語音內容。聲音清晰不代表數字語意表達正確。
  wrong:
    B: 音色與音高控制聲音特徵，不能直接決定數字應逐位念還是按數值念。
    C: 提高取樣率影響音訊表示與頻率保留，不會把錯誤的數字讀法改成正確讀法。
    D: 音量與語速不改變數字的語意讀法，而驗收已要求房號與金額使用不同讀法。
