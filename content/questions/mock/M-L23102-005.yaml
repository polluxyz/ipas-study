stem: |
  某工廠以主成分分析（PCA）壓縮感測特徵。保留的成分已解釋 99.5% 變異，但故障辨識率由 82% 降至 51%。資料切分與模型訓練均已檢查，沒有異常。若要判斷是否適合沿用這組降維結果，下列做法何者最適合？
options:
  A: 提高保留變異的門檻至 99.6%，以該比例作為辨識能力的驗收依據
  B: 把保留成分依特徵值由小到大排列，以排列順序恢復故障判別資訊
  C: 檢查被捨棄方向是否含故障訊號，再以故障辨識表現決定保留範圍
  D: 把保留成分再做一次相同維數的 PCA，以第二次投影補回故障資訊
answer: C
explanation:
  summary: 判斷保留資料變異與保留任務訊號的差別。
  correct: PCA 依輸入資料的變異選方向，不以故障標籤為目標。小變異方向也可能帶有判別訊號。辨識表現已明顯下降，應檢查捨棄方向，並依任務驗證結果決定降維範圍。
  wrong:
    A: 增加保留比例可以作為實驗候選，但 99.6% 本身不能證明故障訊號已保留，不能取代任務驗收。
    B: 重新排列成分不會改變保留的子空間，也不會帶回已捨棄的資訊。
    D: 只對既有投影結果再次旋轉，無法重建已被第一次降維刪去的方向。
