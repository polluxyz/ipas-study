stem: 某文件系統只將模型判為「疑似錯誤」的 8% 文件交由人工覆核，其他文件沒有真值。團隊想知道整體漏判情形，以決定是否重訓。下列資料回收調整何者最適合？
options:
  A: 把未送覆核的文件標為正確，與已覆核結果合併計算整體漏判率
  B: 擴增疑似錯誤文件的覆核量，依該類文件的正確率推估整體漏判率
  C: 在未送覆核文件中隨機抽查，記錄抽樣比例並結合覆核結果評估
  D: 先以現行模型重跑未送覆核文件，再將一致的預測結果當作真值
answer: C
explanation:
  summary: 評估漏判需要取得模型未挑出的案例之真值。
  correct: 只覆核模型挑出的文件，無法直接觀察未挑出範圍的漏判。對未送覆核文件另做隨機抽查，並保留抽樣比例，才能在合理加權與不確定性說明下評估整體漏判情形。
  wrong:
    A: 沒有覆核結果不代表文件正確。直接標成正確會把未被發現的錯誤排除。
    B: 增加已挑出文件的覆核量，仍沒有未挑出文件的真值，無法辨識該範圍的漏判。
    D: 同一模型重跑的一致性不是正確性的證據，不能取代獨立覆核真值。
