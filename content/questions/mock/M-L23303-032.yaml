stem: 某輕量模型每次部署只能使用 300 筆獨立資料訓練。離線共有 1,000 筆，沒有時間或群組限制。團隊要估計「使用 300 筆訓練」的流程表現。哪項驗證設計最直接符合這個目標？
options:
  A: 使用重複隨機切分，每次以 300 筆訓練、700 筆驗證
  B: 使用一般 10 折驗證，讓每次模型使用 900 筆訓練
  C: 使用一般留一驗證，讓每次模型使用 999 筆訓練
  D: 使用重複 5 折驗證，讓每次模型使用 800 筆訓練
answer: A
explanation:
  summary: 評估時的訓練資料量應對齊要估計的流程。
  correct: 固定每次訓練 300 筆，可直接觀察目標資料量下的模型表現。每次驗證列須與當次訓練列互斥，前處理也只在當次訓練資料內擬合。
  wrong:
    B: 這估計的是以 900 筆訓練的流程，無法直接代表只能用 300 筆的部署流程。
    C: 留一法讓訓練量接近 1,000 筆，與目標 300 筆差距更大。
    D: 重複切分有助觀察波動，但每次使用 800 筆，仍未對齊目標訓練量。
