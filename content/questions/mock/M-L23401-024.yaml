stem: 某零售商準備分享顧客消費資料。分析只需比較「30–39 歲、40–49 歲」等年齡層的消費分布，不需追蹤個別顧客。姓名與聯絡方式已移除，但資料仍含完整出生年月日。最適合如何處理出生日期？
options:
  A: 轉成分析所需的年齡區間，再檢查其餘欄位組合
  B: 轉成可一致比對的出生日期雜湊，再保留全部列
  C: 轉成遮蔽年份的月日欄位，再檢查日期格式
  D: 轉成固定偏移天數的新日期，再保留日期間距
answer: A
explanation:
  summary: 泛化應保留分析需要的層級，減少多餘的識別細節。
  correct: 年齡區間已能支援本例的分組分析，沒有必要交付完整日期。轉成區間可降低資料精細度，但仍需檢查年齡區間與其他欄位的組合是否足以識別個人。
  wrong:
    B: 雜湊保留相同值的比對能力，卻無法直接取得所需的年齡區間；日期取值有限時也可能被列舉比對。
    C: 留下月日仍保有生日細節，卻刪除了判斷年齡層所需的年份，與分析需求不符。
    D: 固定偏移保留精細日期的對應規律，可能被已知日期推回，也沒有直接提供所需的年齡分組。
