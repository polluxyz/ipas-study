stem: 某旅館的需求模型每天因旅客人數分布觸發漂移告警。團隊確認週末人數本來就比平日高，且這種規律已納入訓練；目前卻把每個週末都與平日基準相比。近期已成熟的真值也未顯示預測惡化。最適合的監控調整為何？
options:
  A: 按可預期的週期建立對照基準，並持續監控預測品質與新異常
  B: 調高整個人數欄位的固定門檻，使週末的告警次數符合預算
  C: 改以全年累積平均人數監控，將各種日期合併成單一基準
  D: 只要模型權重未變就停用人數監控，改監控服務延遲與流量
answer: A
explanation:
  summary: 已知週期應納入漂移監控的比較條件。
  correct: 將週末與平日直接相比會把已知週期差異當成新變化。依週期選取可比較的基準，並保留真值品質與異常監控，才能提高告警的可解讀性，而不把週末的新問題一併忽略。
  wrong:
    B: 按告警預算一律提高門檻沒有處理比較條件，也可能掩蓋其他日期的異常。
    C: 全年累積平均仍混合不同週期，且新異常可能被長期資料稀釋。
    D: 模型權重未變不代表輸入環境未變。服務延遲與流量也無法代替資料品質監控。
