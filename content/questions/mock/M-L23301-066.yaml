stem: 某客服團隊讓 2 名人員各自標註同一批 500 件申訴，兩人的標籤有 98% 相同。後續專家抽查發現，兩人都依同一份過時規則，把部分應屬緊急的案件標為一般。主管要判斷標註品質，下列結論何者最正確？
options:
  A: 兩人判斷高度一致，可將 98% 視為標籤的正確率
  B: 一致率反映判斷相符，仍需檢查共同規則的正確性
  C: 專家與標註者意見不同，可用增加標註人數解決規則問題
  D: 兩人使用相同規則，可用模型對標籤的擬合程度確認正確率
answer: B
explanation:
  summary: 標註者彼此一致，不代表共同採用的規則正確。
  correct: 兩人可能一致地套用錯誤規則。98% 只描述兩份標籤相符的程度，不能替代對現行業務規則及真實案件的核對。
  wrong:
    A: 彼此相同與符合正確判定是不同條件。共同的系統性錯誤也會形成很高的一致率。
    C: 增加人數可以降低個別判斷的偶然性，但若繼續沿用過時規則，多人仍可能做出相同錯誤。
    D: 模型可以學會過時規則產生的標籤。對這些標籤擬合得好，不能證明標籤符合現行業務要求。
