stem: 某採購代理呼叫建立訂單工具後，等候 10 秒仍未收到回覆。工具可能已完成寫入；同一個請求識別碼重送時，服務會回傳同一張訂單，換識別碼則視為新訂單。代理要恢復流程並避免重複採購，最適合採取哪項做法？
options:
  A: 保留請求識別碼重送，取得對應訂單後核對狀態
  B: 產生新的請求識別碼重送，取得回覆後核對狀態
  C: 縮短等候時間並重建請求，每次使用新識別碼
  D: 轉派另一採購代理，讓它以新識別碼重建請求
answer: A
explanation:
  summary: 寫入工具逾時時，須區分未收到回覆與操作未完成。
  correct: 逾時不能證明訂單尚未建立。本例服務以請求識別碼辨認同一次操作，沿用識別碼可取得同一訂單，再確認實際狀態，避免把重試變成另一筆採購。
  wrong:
    B: 新識別碼代表新操作，若第一次已寫入，第二次會再建立訂單。核對第二次結果不能消除第一次訂單。
    C: 縮短等候時間可減少等待，卻無法取消已送出的寫入。每次改識別碼會增加重複訂單的風險。
    D: 轉派可以更換執行者，卻不會改變外部服務已接收請求的狀態。新識別碼仍可能建立第二張訂單。
