stem: 某工廠用卷積神經網路辨識裂紋，訓練影像中的零件幾乎都水平擺放。部署時零件可轉動 90 度，裂紋類別不受方向影響。模型在旋轉後影像的辨識率大幅下降，但對水平平移仍穩定。若要針對這項差異改善訓練，下列做法何者最適合？
options:
  A: 增加符合現場角度的旋轉樣本，保留對應裂紋類別後重訓
  B: 增加水平方向的平移樣本，保留對應裂紋類別後重訓
  C: 提高池化層的步幅，減少特徵圖中需要保留的空間位置
  D: 提高卷積層的步幅，擴大相鄰特徵取樣位置之間的距離
answer: A
explanation:
  summary: 卷積的權重共享不等於模型已學會旋轉不變性。
  correct: 水平平移與旋轉是不同變化。一般卷積的空間權重共享，不能保證旋轉零件後仍辨識相同裂紋。題目已確認旋轉不改變類別，因此加入現場角度的訓練樣本可直接補足方向覆蓋，並應另用旋轉測試資料驗證。
  wrong:
    B: 平移增強改善的是位置變化。模型已對水平平移穩定，增加這類樣本沒有直接補足旋轉方向。
    C: 較大的池化步幅主要降低空間解析度，並不建立旋轉後裂紋與標籤的對應，還可能丟失細紋。
    D: 增大卷積步幅會減少取樣位置。這項操作沒有讓卷積核自動對應不同角度，可能反而漏掉細節。
