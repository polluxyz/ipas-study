stem: |
  某銀行計畫與多家合作機構共同訓練一個 AI 信用風險預測模型，為避免客戶交易資料在傳輸與運算過程中外洩，技術團隊評估使用同態加密（Homomorphic Encryption）技術。下列何者最能正確描述同態加密在此應用中的關鍵特性？
options:
  A: 系統以隨機雜訊（Noise）干擾輸出，確保統計結果不洩漏個資
  B: 各參與銀行透過安全通道交換私鑰，確保模型參數一致
  C: 將原始資料壓縮並同時加密，以減少加密後資料量與運算時間
  D: 資料在加密狀態下仍可進行數值運算，模型訓練可於未解密資料上完成
answer: D
explanation:
  summary: 答案 D：同態加密允許對密文做支援的運算，計算端不必先解密。
  correct: 在合適的同態加密方案下，平台可對密文執行所支援的加法、乘法等運算，輸出仍是密文，再由有權限持有金鑰的一方解密。題述模型訓練須能改寫為方案允許的運算，並妥善設計多方金鑰安排與運算成本；不能理解成任意模型都可直接、低成本地在密文上訓練。
  wrong:
    A: 對統計輸出加入經校準的隨機噪聲是差分隱私的典型思路，不是同態加密的定義。
    B: 交換私鑰不是同態加密的必要特性，也不是確保模型參數一致的方法；私鑰交付會改變能解密的信任邊界。
    C: 同態密文通常有明顯體積與運算負擔，不以壓縮資料來減少成本作為其關鍵特性。
  rule: 同態加密保護的是受支援的密文運算過程，輸出仍需由獲授權者依金鑰機制解讀。
