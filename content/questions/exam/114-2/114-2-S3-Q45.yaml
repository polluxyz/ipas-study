  在實務應用中，我們常使用遷移學習(transfer learning)技巧，即載入預訓練模型（如 VGG16），凍結部分層的參數，只針對特定任務重新訓練最後幾層，這種做法可節省訓練時間並提升模型效能。假設你要對 VGG16 進行遷移學習(transfer learning)，希望凍結卷積層的參數，只訓練最後全連接層(classifier)。下列哪段程式碼寫法正確？
code: |
  from torchsummary import summary
  from torchvision import models
  model = models.vgg16(weights='IMAGENET1K_V1')
  summary(model, (3,150,150))
code_lang: python
options:
  A: |-
    ```python
    import torch
    import torchvision.models as models

    model = models.vgg16(pretrained=True)
    for param in model.parameters():
        param.requires_grad = False
    model.classifier[6] = torch.nn.Linear(4096, 10)
    ```
  B: |-
    ```python
    import torch
    import torchvision.models as models

    model = models.vgg16(pretrained=True)
    for param in model.features.parameters():
        param.requires_grad = False
    model.classifier[6] = torch.nn.Linear(4096, 10)
    ```
  C: |-
    ```python
    import torch
    import torchvision.models as models

    model = models.vgg16(pretrained=True)
    for param in model.classifier.parameters():
        param.requires_grad = False
    model.classifier[6] = torch.nn.Linear(4096, 10)
    ```
  D: |-
    ```python
    import torch
    import torchvision.models as models

    model = models.vgg16(pretrained=True)
    model.requires_grad = False
    model.classifier[6] = torch.nn.Linear(4096, 10)
    ```
answer: B
explanation:
  summary: "官方答案：B。題幹的 classifier 指向 VGG 分類器模組，B 最符合重新訓練最後幾層的要求。"
  correct: "B 只對 `model.features.parameters()` 設定 `requires_grad=False`，凍結卷積部分，保留 classifier 的三個 Linear 可訓練。再把 `classifier[6]` 換成輸出 10 類的新 Linear，其參數預設也可訓練；後續仍須把欲更新的參數交給 optimizer。題幹說重新訓練「最後幾層」，括號 classifier 也是 VGG 的分類器模組名，兩者支持 B 的讀法。若把要求縮成只訓練最後一個 Linear，A 也做得到，但這比題幹的模組範圍更窄。指引談過預訓練與微調概念，未教授 VGG 的凍結迴圈、classifier 範圍及新層的梯度預設值，因此不填無法直接支持 API 的指引頁碼。依據：[VGG 官方結構](https://docs.pytorch.org/vision/stable/_modules/torchvision/models/vgg.html) 及 [PyTorch 遷移學習教學](https://docs.pytorch.org/tutorials/beginner/transfer_learning_tutorial.html#convnet-as-fixed-feature-extractor)。"
  wrong:
    A: "先凍結所有既有參數，再換上的 Linear 預設 requires_grad=True，所以只有新的 classifier[6] 可訓練。這能做到只訓練最後一個 Linear，不能說它無法學習；但題幹的「最後幾層」及 classifier 模組名指向整個分類器，B 更符合此範圍。"
    C: >-
      凍結的是舊 classifier，並未凍結 features；換上新層後，卷積與最後 Linear 仍可訓練，違反凍結卷積的要求。
    D: >-
      設定 model.requires_grad 只是對模型物件增加一般屬性，不會遞迴改變各 Parameter 的 requires_grad；須逐參數設定或呼叫 requires_grad_()，原寫法沒有凍結卷積。
  rule: 判斷凍結範圍要逐一看 Parameter 的 requires_grad，並注意凍結後換上的新模組預設仍可訓練。
