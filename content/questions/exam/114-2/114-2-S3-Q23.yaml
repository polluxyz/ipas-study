stem: |
  一家再生能源公司希望預測未來三個月太陽能發電量的波動範圍。由於氣候條件具有高度隨機性，且輸入變數（如日照時數、雲量、溫度）之間存在不確定關係，工程團隊決定以隨機抽樣方式模擬多種可能情境，以估算整體發電量的機率分佈與風險區間。請問此時所採用的技術最符合下列哪一種方法？
options:
  A: 蒙地卡羅方法（Monte Carlo Method）
  B: K-means 聚類（K-means Clustering）
  C: 支持向量迴歸（Support Vector Regression, SVR）
  D: 特徵選取（Feature Selection）
answer: A
explanation:
  summary: 答案 A：反覆隨機抽樣模擬情境，再統計輸出，是蒙地卡羅方法。
  correct: 先為日照、雲量、溫度等輸入設定合理的聯合分布或相依抽樣方式，再反覆抽樣並計算發電量，便可用模擬結果估計機率分布、分位數與風險。若忽略變數相依性或輸入分布設定錯誤，模擬很多次也不代表風險估計可信。兩科指引未明確教授蒙地卡羅流程，本題屬機率應用的延伸。
  wrong:
    B: K-means 將既有資料按距離分成群，並非藉輸入隨機抽樣傳遞不確定性的模擬方法。
    C: SVR 可預測連續輸出，但單靠 SVR 不會完成題述的反覆隨機情境抽樣與分布估計。
    D: 特徵選取決定保留哪些輸入欄位，不是用隨機模擬求發電量風險區間。
  rule: 以多次隨機情境傳遞輸入不確定性並統計輸出時，辨認為蒙地卡羅模擬。
