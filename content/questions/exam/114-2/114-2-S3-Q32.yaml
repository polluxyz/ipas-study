stem: |
  某電信公司開發客戶流失預測模型，使用大量顧客行為特徵，例如通話時長、上網頻率、帳單金額、客服聯絡次數等。在訓練過程中，團隊發現部分特徵彼此高度相關，但同時也懷疑有些特徵對流失預測的貢獻度有限。若希望模型在避免過擬合（Overfitting）的同時，能自動篩選出較具代表性的特徵，採用下列哪一種方法最為合適？
options:
  A: 使用早期停止法（Early Stopping）控制訓練回合數，避免過擬合（Overfitting）
  B: 同時移除多重共線性特徵並採用 L2 正則化（Ridge），以確保模型穩定收斂
  C: 僅使用 L2 正則化（Ridge），抑制所有權重幅度但保留全部特徵
  D: 採用 L1 正則化（Lasso），透過懲罰項使部分特徵係數縮為 0
answer: D
explanation:
  summary: 答案 D：L1 可同時懲罰權重並把部分係數壓到零，達到自動篩選。
  correct: 題幹同時要求抑制過擬合與自動選特徵。L1 懲罰可使部分係數為零，因此比只縮小全部係數的 L2 更符合要求。高度相關的特徵之間，Lasso 可能任選其中一個，選取結果不一定穩定；不能把留下的特徵直接解讀為唯一真正重要或有因果作用的變數。
  wrong:
    A: 早停限制訓練長度，能抑制過擬合，卻不保證把不重要特徵的係數設為零。
    B: 先另行移除共線性特徵再做 L2 可以是合理流程，但自動篩選不是 L2 懲罰本身提供的效果；也不能僅靠這兩步保證穩定收斂。
    C: L2 通常讓係數連續縮小而不產生稀疏解，無法直接完成題目要求的自動特徵篩選。
  rule: 若題目同時要求正則化與以零係數自動選特徵，L1 比單純 L2 更直接。
