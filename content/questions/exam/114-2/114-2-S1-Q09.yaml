stem: |
  某企業在訓練生成式 AI 模型時，導入資料增強（Data Augmentation）技術以擴充訓練資料，但觀察到模型效能反而下降。下列哪一項最可能的原因與對應改善策略最為正確？
options:
  A: 增強樣本未經隨機初始化，導致模型梯度更新不穩定，應重新設計訓練啟動流程；
  B: 增強後資料的特徵分佈與原始資料不一致，影響模型的泛化能力，應檢查並調整增強策略以維持語意一致性；
  C: 增強樣本的比例過高，造成模型對特定資料產生偏好，應適度提高增強比例並調整學習率；
  D: 增強後資料的標註可信度下降，導致訓練訊號偏差，應以半監督學習方式重新校正資料
answer: B
explanation:
  summary: 答案 B；資料增強要維持任務語意，並符合實際部署情境。
  correct: 增強不是單純把樣本變多，而是加入對任務仍合理的變化。若文字替換改變原意、影像裁切移除關鍵物件，新增資料就可能帶來錯誤的學習訊號。B 同時提出分佈偏離的可能原因及檢查增強策略的對應措施；應以獨立驗證資料評估，避免讓不合理變換損害泛化。
  wrong:
    A: 隨機初始化通常指模型參數，並不是每份增強資料都必須經過的程序；重設訓練啟動流程不能直接修正語意錯誤。
    C: 若問題已是增強比例過高，繼續提高比例可能加重偏差，調整學習率也無法修復無效樣本。
    D: 標註品質下降確實可能使效能變差，但半監督學習不會自動校正錯誤增強；應先檢查標籤是否仍成立及資料品質。
  rule: 每種增強都先問任務語意是否保留，再用獨立驗證集判斷是否有益。
