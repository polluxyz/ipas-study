stem: |
  某企業需分析半結構化的系統日誌（JSON 格式），以提取關鍵的時序特徵供故障預測模型使用。考量日誌結構複雜且包含巢狀欄位（Nested Fields），下列哪一種策略最有效且實務可行？
options:
  A: 先將 JSON 資料扁平化轉成 CSV，再對欄位計算統計量（如均值、次數）作為特徵；
  B: 使用遞歸神經網路（RNN）直接輸入原始 JSON 字串進行時序特徵抽取；
  C: 設計遞迴函式展開巢狀欄位，並基於時間窗口（Time Window）進行聚合與特徵萃取；
  D: 只保留時間戳記欄位，忽略其他巢狀內容以簡化特徵工程
answer: C
explanation:
  summary: "答案 C。先解析巢狀欄位，再依事件時間建立窗口特徵，才能保留故障前的變化訊號。"
  correct: "C 同時對應兩項需求：遞迴展開日誌中的巢狀欄位，取得事件種類、數值與時間；再按設備及歷史時間窗口計算事件次數、平均值或變化趨勢。窗口必須只用預測時點以前已可取得的事件，以免把故障後資訊洩漏給模型。指引介紹時間解析與聚合特徵，但沒有完整教授巢狀 JSON 的遞迴處理。"
  wrong:
    A: "轉成表格是可行的前處理，也能與時間窗口搭配；問題在於選項只描述一般欄位統計，未明確保留事件時間與窗口關係，對本題的時序需求不如 C 完整。"
    B: "RNN 需要合適的序列表示與編碼，不能僅把任意原始 JSON 字串當作已整理好的時序特徵；還要處理結構、事件邊界與時間間隔，成本與可解釋性也需評估。"
    D: "時間戳可推導間隔或週期，但捨棄事件類型、設備狀態與數值，會失去判斷故障的重要訊號。"
  rule: "時序特徵須先解析事件欄位，再以預測當下可取得的歷史窗口聚合。"
