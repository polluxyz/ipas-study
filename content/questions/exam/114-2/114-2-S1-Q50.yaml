stem: |
  某設計師使用公司內部建置的生成式 AI 工具製作行銷素材，並輸入提示語（Prompt）：「請生成一張模特兒手持品牌飲料、背景為海邊夕陽的照片」。系統能正確生成主要主題與場景，但輸出的圖像中，品牌標誌顏色常有誤差，或人物手部姿勢顯得不自然。若從多模態生成模型的技術機制分析，此現象最可能是下列哪一項原因所造成？
options:
  A: 擴散式生成模型的去雜訊過程出現隨機梯度漂移，導致影像像素錯誤；
  B: 提示語過長造成 Transformer 的位置編碼超出上下文限制，導致生成混亂；
  C: CLIP 模型中的文字編碼器與影像編碼器在語意嵌入空間未充分對齊，導致跨模態理解偏差；
  D: 模型未採用對比學習（Contrastive Learning）損失函數，無法建立多模態語意關聯
answer: C
explanation:
  summary: "官方答案 C。跨模態對齊不足是可能機制，但題幹不足以把局部生成瑕疵歸因於 CLIP。"
  correct: "官方選 C。若系統確實依賴 CLIP 的圖文表示，且細部屬性對應不足，跨模態表示可能是應檢查的一環。然而題幹沒有指定 CLIP，也沒提供編碼器對齊的診斷證據；品牌顏色、手部形狀還可能受資料、條件注入、生成器能力或有損編碼影響。故獨立判斷是無充分依據支持唯一最可能原因。以 [Stable Diffusion 官方模型卡](https://huggingface.co/CompVis/stable-diffusion-v1-4#limitations)為例，人物、組合關係與有損編碼是分別列出的限制，不能都歸因於 CLIP 的兩個編碼器。"
  wrong:
    A: "一般擴散推論是在固定參數下逐步更新噪聲樣本，不能把局部畫錯直接稱為隨機梯度漂移；題目也沒有提供異常梯度或取樣診斷證據。"
    B: "題目提示語並未呈現異常長度，也沒有提供 tokenizer 與上下文限制；不能直接推論位置編碼越界造成混亂。"
    D: "對比損失是建立跨模態表示的一種方法，條件生成或其他配對學習目標也能建立語意關聯；未用對比損失不等於無法處理多模態。"
  rule: "生成瑕疵須沿資料、表示、條件化與生成流程診斷，不能只憑外觀指定某個編碼器為根因。"
