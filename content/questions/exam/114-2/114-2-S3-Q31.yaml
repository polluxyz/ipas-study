stem: |
  某能源公司利用歷史氣象與用電資料，開發長期電力需求預測模型，採用深度神經網路架構進行訓練。在訓練過程中，模型在訓練集上的損失值持續下降，但在驗證集上，損失在第 80 輪後開始波動，呈現週期性上升與下降。團隊懷疑模型受到季節性資料波動與隨機噪音影響，導致驗證損失難以穩定收斂。若要在此情境下合理運用早期停止法（Early Stopping）以確保模型具最佳泛化能力，下列哪一項策略最為適當？
options:
  A: 直接根據訓練集損失最低點停止訓練，以確保模型充分擬合所有樣本
  B: 監控驗證集損失並設定適度的耐心值（Patience），在連續多輪未改善後再停止訓練
  C: 改以測試集損失作為早停依據，以提升模型最終評估一致性
  D: 將所有資料重新合併後訓練至收斂，避免因資料分割導致評估波動
answer: B
explanation:
  summary: 驗證損失有短期波動時，用 Patience 避免早停過於敏感。
  correct: 早停應觀察驗證損失，並以目前最佳值為基準；設定 Patience 後，短暫變差不會立刻中止訓練，只有連續若干輪沒有足夠改善才停止。可搭配保留最佳權重，在結束時還原驗證表現最好的模型。這能降低過早或過晚停止的風險，但不保證一定找到全域最佳的泛化表現。
  wrong:
    A: 訓練損失持續降低，可能只是模型更貼合訓練樣本，不能代表未見資料也同步改善，因而不適合作為此題的早停依據。
    C: 用測試集決定停止時點，等於讓測試結果參與模型選擇，會失去最終獨立評估的作用。
    D: 合併全部資料後沒有獨立的驗證訊號，即使訓練損失收斂，也無法據此確認泛化能力或避免過擬合。
  rule: 早停要監控驗證表現並容忍短期波動，測試集不參與決策。
