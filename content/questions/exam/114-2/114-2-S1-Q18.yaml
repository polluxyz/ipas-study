stem: |
  當 Transformer 模型發生「注意力分布過於平均（Attention Collapse）」的情形時，導致模型無法有效聚焦於關鍵資訊，下列哪一項策略可有效改善此問題？
options:
  A: 提高 Query-Key 點積（Dot Product）的縮放常數；
  B: 在 Softmax 前加入高斯雜訊（Gaussian Noise）；
  C: 使用 ReLU 函數取代 Softmax；
  D: 對注意力權重施加稀疏化約束（Sparsity Constraint）
answer: D
explanation:
  summary: 官方答案 D；有效稀疏化可集中注意力，但 A 的縮放方向未定義。
  correct: 若模型確實因注意力過度分散而忽略關鍵位置，可用能產生選擇性的稀疏機制抑制無關權重，所以 D 符合題意。例如 [Sparsemax 原始論文](https://arxiv.org/abs/1602.02068) 提供可輸出零權重的替代映射。限制是普通非負且總和為一的注意力向量，其 L1 範數固定為一，直接加 L1 懲罰不會促成稀疏；不能把任意「稀疏化約束」都視為有效。A 的效果取決於縮放採乘法或除法；權重更集中，也不保證集中在真正關鍵的位置或改善整體效能。
  wrong:
    A: 不能無條件判錯。若縮放常數指乘在非相等點積分數上的正係數，提高它會使 Softmax 更尖銳；若指分母則更平均。題目未說明是哪一種，且分數完全相等時乘常數仍相等。實際乘法定義可查 [PyTorch 注意力官方文件](https://docs.pytorch.org/docs/2.15/generated/torch.nn.functional.scaled_dot_product_attention.html)。
    B: 加雜訊可能打破當次平手或作為正則化，但不保證提高關鍵位置的權重，也可能放大無關訊號。
    C: 直接以 ReLU 替代不再保證權重總和為一，還可能得到全零向量；若未重新設計正規化與訓練，不能視為通用解法。
  rule: 判斷注意力是否更集中時，要先寫清楚縮放公式與稀疏機制，而非只看策略名稱。
