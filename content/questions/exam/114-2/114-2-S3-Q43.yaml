  在神經網路中，了解各層的運算量分佈，有助於模型壓縮與硬體加速的策略設計。請問在 VGG16 中，下列何者運算量(FLOPs)最多？
code: |
  from torchsummary import summary
  from torchvision import models
  model = models.vgg16(weights='IMAGENET1K_V1')
  summary(model, (3,150,150))
code_lang: python
options:
  A: |-
    卷積層(Conv2d)
  B: |-
    全連接層(Linear)
  C: |-
    ReLU 激活函數
  D: |-
    池化層(MaxPool2d, AdaptiveAvgPool2d)
answer: A
explanation:
  summary: 答案：A。卷積核在各個空間位置重複運算，題示卷積層的總運算量高於全連接層。
  correct: >-
    對單張影像，一般卷積層的乘加次數約為輸出高×輸出寬×輸出通道×輸入通道×卷積核高×卷積核寬。 例如第二個卷積層為 150×150×64×64×3×3 = 829,440,000 次乘加；光這一層就超過三個 Linear 合計的 123,633,664 次。 依題示所有尺寸計算，13 個卷積層約有 6,615,491,328 次乘加，因此卷積最多。 此處略去偏差加法，並用 MAC 表示一次乘加；若把一次乘與一次加各算一個 FLOP，兩類的主項皆乘以 2，不改變比較結果。
  wrong:
    B: >-
      Linear 的權重雖多，但每張影像只作一次對應的矩陣向量運算，沒有卷積在整張特徵圖上的空間重用倍數。
    C: >-
      ReLU 每個元素只需一次與 0 的比較，計算成本遠低於卷積每個輸出元素所需的通道與卷積核乘加。
    D: >-
      池化需要區域比較或加總，並非完全不運算；但它不作輸入通道與輸出通道間的大量權重乘加，題示成本低於卷積。
  rule: 比較卷積計算量要把權重使用次數乘上輸出空間大小，不能只用參數數量判斷 FLOPs。
