stem: |
  某電子商務公司為開發商品評論情感分析模型，希望模型能捕捉評論中不同特徵之間的關聯影響，例如「商品價格」與「顧客滿意度」的互動效果。下列哪一種特徵工程設計方式最適合用於建立互動特徵（Interaction Features）？
options:
  A: 將單一特徵取平方
  B: 對所有特徵進行對數轉換
  C: 將兩個或多個特徵進行乘積或交互組合
  D: 對特徵進行標準化
answer: C
explanation:
  summary: 答案 C：不同特徵的乘積或交叉組合，可以表達互動效果。
  correct: 例如在線性預測式中加入「價格×滿意度」後，價格對輸出的影響可隨滿意度改變，不再只能各自相加。類別特徵也可建立交叉類別；是否有幫助仍須在適當驗證流程檢查，不能只因多造特徵就認定效果較好。科目 1 第 5.1 節明列特徵組合與互動作用，科目 3 並未明確展開此製作方法。
  wrong:
    A: 單一特徵平方描述該特徵本身的非線性效果，沒有形成不同特徵之間的互動。
    B: 各欄位分別取對數是單變數轉換，不會自動產生跨欄位的交叉項。
    D: 標準化調整位置與尺度，不會自行建立兩個不同特徵的聯合作用項。
  rule: 區分單變數轉換與互動特徵：互動項必須結合不同特徵來表達彼此影響。
