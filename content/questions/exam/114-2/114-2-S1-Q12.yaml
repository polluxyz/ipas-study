stem: |
  某金融科技公司建立房價預測模型，使用多項特徵（如建坪、房齡、樓層、總價等）進行線性迴歸分析（Linear Regression Analysis）。資料分析師發現多個特徵之間存在高度相關性，導致模型係數不穩定、預測誤差上升。為解決此問題，下列哪一種方法最適合？
options:
  A: 繼續保留所有特徵，不進行任何處理；
  B: 使用主成分分析（PCA）將相關特徵轉換為彼此獨立的主成分；
  C: 新增更多原始變數以提升模型表現；
  D: 改用分類模型進行預測
answer: B
explanation:
  summary: 官方答案 B；PCA 可處理相關特徵，但不相關不等於統計獨立。
  correct: 將中心化的特徵投影到正交的主成分方向後，訓練樣本上的主成分共變異數為零；再以選取的主成分進行迴歸，可降低高度共線帶來的不穩定。B 的「彼此獨立」應改理解為不相關，不能宣稱一般資料因此統計獨立。若保留全部非退化主成分，僅旋轉座標也不保證降低預測誤差；還要驗證保留數量。另若「總價」就是待預測房價，將它列入輸入會形成目標洩漏，必須排除。
  wrong:
    A: 題目已指出相關特徵使係數不穩，完全不處理不能針對性緩解此問題。
    C: 單純增加原始變數可能帶來更多冗餘甚至更嚴重共線性；是否有用要看新增資訊，不能由數量推論。
    D: 房價是連續數值，直接改分類會改變任務定義，也沒有處理原本的相關特徵問題。
  rule: 使用 PCA 時要區分正交、不相關與獨立，並用驗證結果決定保留的成分數。
