concepts: [model-monitoring, distribution-drift-detection]
stem: |
  某企業已將 AI 模型部署於生產環境，為確保系統持續穩定運作，並能提前偵測模型效能可能衰退，技術團隊希望透過監控指標進行預警。
  下列哪一項監控指標最具預測效力，能提早發現模型效能下滑風險？
options:
  A: 系統 CPU 與記憶體使用率波動幅度；
  B: 模型推論結果的置信度（Confidence）分佈變化趨勢；
  C: API 平均回應時間與延遲百分位數變化；
  D: 輸入特徵與訓練資料分布差異的 PSI（Population Stability Index）指數
answer: D
explanation:
  summary: "答案 D。PSI 可監測輸入分布偏移，但不能單憑它斷言準確率將下降或預警力最強。"
  correct: "官方選 D。若關注輸入資料逐漸偏離訓練基準、且真實標籤尚未回流，PSI 可比較固定分箱的比例差異，作為分布風險的早期訊號。指引介紹資料漂移與監控，未教 PSI 的計算。PSI 不使用預測是否正確的資訊，分布變了不必然變差，輸入不變也可能發生概念漂移；題幹未給漂移型態、標籤回流或校準條件，無法證明它普遍比置信度監控更有效，也不能反過來認定 B 永遠較佳。"
  wrong:
    A: "資源使用率主要反映系統負載或容量壓力，對模型在新資料上的判斷品質沒有直接度量；系統可正常運作而準確率下降。"
    B: "置信度分布可由推論輸出計算，不需真實標籤，也可作預警；但未校準或遇分布外樣本時，模型可能仍自信地答錯。若假設是輸入分布改變，PSI 對應較直接；題目未給此假設，不足以嚴格排除 B。"
    C: "回應時間與延遲百分位可發現服務效能問題，但即使它們保持穩定，模型仍可能因資料或概念改變而失準。"
  rule: "漂移統計量是調查訊號，須配合置信度及回流標籤驗證，不能直接當成準確率。"
