stem: |
  考慮擲出骰子並採用 Monte Carlo 方法估算條件機率，參考附圖程式碼。
  事件 A：擲出偶數
  事件 B：擲出大於 3
  請問下列何者為條件機率 P(A∣B)的正確值？
code: |
  import numpy as np

  np.random.seed(123)
  n = 100000
  dice_rolls = np.random.randint(1, 7, size=n)

  A = (dice_rolls % 2 == 0)
  B = (dice_rolls > 3)
  A_and_B = A & B
code_lang: python
options:
  A: |-
    A_and_B.sum() / (A.sum() * B.sum())
  B: |-
    A_and_B.sum() / (A.sum() + B.sum())
  C: |-
    A_and_B.sum() / A.sum()
  D: |-
    A_and_B.sum() / B.sum()
answer: D
