stem: |
  某金融科技公司欲導入 AI 模型協助客服郵件自動分類（投訴、詢問、表揚）。團隊同時考慮兩種模型設計：
  方案 A（生成式路徑）：採用 VAE 建構潛在語意空間，再結合下游分類器進行標籤預測；
  方案 B（鑑別式路徑）：採用 BERT Classifier 直接根據輸入文本進行監督式分類。
  現有標註資料約 2,000 筆，資料分佈均勻但擴充成本高。若團隊希望公平比較兩種模型的資料利用效率與泛化能力，下列哪一種實驗設計最能突顯兩者的本質差異？
options:
  A: 在完整資料集上分別訓練兩者，並比較其分類準確率（Accuracy）與推論時間
  B: 在低資源情境（Low-resource Setting）下，逐步減少標註比例（100%、50%、10%），比較其 F1-score
  C: 使用 GAN 自動生成文本樣本補足資料，觀察兩模型在資料增強後的精確率（Precision）差異
  D: 在相同訓練資料上固定輸入維度，僅調整模型參數量，比較其對過擬合的敏感度
answer: B
explanation:
  summary: 透過改變可用標註量，比較兩種模型在資料逐漸減少時的分類表現。
  correct: B 直接操控訓練時可取得的標註比例，能比較哪個流程在低標註量下仍維持較好的 F1，符合資料利用效率的問題。實驗應固定獨立評估集，讓兩模型使用相同訓練子集與 F1 平均方式，並重複抽樣觀察波動；結果並不預設 VAE 路徑一定較佳。
  wrong:
    A: 只比較完整資料量下的單一結果，無法看出標註減少時兩者的退化幅度；推論時間主要反映運算效率。
    C: 加入 GAN 後，結果同時受合成資料品質及增強策略影響，難以單獨判斷原本兩個模型的標註利用效率。
    D: 改變參數量主要檢查模型容量的影響，未直接測量對標註資料量的需求，也不容易在兩種不同架構間公平控制。
  rule: 比較標註利用效率時，要固定評估集並改變訓練標註量。
