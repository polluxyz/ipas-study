stem: |
  在二元分類問題中，若精確率（Precision）為 0.8，召回率（Recall）為 0.6，則 F1 分數（F1 Score）為何？
options:
  A: "0.686"
  B: "0.700"
  C: "0.720"
  D: '0.750'
answer: A
explanation:
  summary: 將 Precision 與 Recall 代入調和平均公式計算 F1。
  correct: F1 = 2PR/(P + R) = 2 × 0.8 × 0.6/(0.8 + 0.6) = 0.96/1.4 ≈ 0.685714，四捨五入到小數第三位是 0.686，故選 A。
  wrong:
    B: 0.700 是兩者的算術平均 (0.8 + 0.6)/2；F1 採用調和平均，兩者不相等時會小於算術平均。
    C: 0.720 超過這兩個數值的算術平均 0.700，不可能是此處的調和平均。
    D: 0.750 同樣高於算術平均 0.700，並非代入 F1 公式後的結果。
  rule: 合併精確率與召回率時，要算調和平均，不能算術平均。
