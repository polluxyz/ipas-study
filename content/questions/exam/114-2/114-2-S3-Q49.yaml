code_lang: python
options:
  A: |-
    activation="relu" 其數學式為 $f(x)=\frac{1}{1+e^{-x}}$
  B: |-
    空格 1 值為 110，空格 2 值為 100
  C: |-
    空格 1 值為 100，空格 2 值為 110
  D: |-
    activation="sigmoid" 一般用於多類別分類預測模型
answer: C
explanation:
  summary: 答案：C。9 維輸入接 10 個單元需 100 個參數，接著的 10 到 10 層需 110 個參數。
  correct: >-
    `dataset_train[:, 0:9]` 取得第 0～8 欄，所以模型輸入有 9 個特徵；第 9 欄 survived 是標籤，不應另算成輸入。 Dense 預設使用偏差，參數數目是輸入維度×輸出單元數 + 輸出單元數：第一層為 9×10+10=100，第二層為 10×10+10=110。 最後 10 到 1 層則有 10×1+1=11 個，和摘要一致；三層合計 221 個。 `Input` 只指定形狀，ReLU、Sigmoid 激活也不額外增加這些 Dense 層的可訓練參數，參見 [Dense 官方文件](https://keras.io/api/layers/core_layers/dense/)。
  wrong:
    A: >-
      題示公式 1/(1+e^(-x)) 是 Sigmoid；預設 ReLU 是 max(0,x)，負輸入變為 0，正輸入保留。
    B: >-
      把兩層的數字顛倒了；第一層只有 9 個輸入，第二層才接收前一層的 10 個輸出。
    D: >-
      本題單一 Sigmoid 輸出搭配 binary_crossentropy，用於存活／死亡的二元分類；互斥多類別通常用多個 Softmax 輸出，雖然多標籤任務也可逐標籤用 Sigmoid，但那不是本題設定。
  rule: Dense 的參數量等於輸入維度乘輸出單元數再加偏差數，計算前先排除標籤欄並沿資料流確認每層維度。
