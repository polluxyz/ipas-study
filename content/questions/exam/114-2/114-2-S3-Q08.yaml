stem: |
  資訊增益（Information Gain）常用於衡量特徵對分類結果的不確定性貢獻程度，並據以進行特徵選擇。此方法主要應用於下列哪一類模型架構中？
options:
  A: 使用 L1 正則化進行特徵篩選的線性模型
  B: 利用激活函數（Activation Function）進行特徵擷取的深度神經網路
  C: 透過核函數（Kernel Function）將特徵映射至高維空間的分類模型
  D: 透過遞迴分裂方式建立分類規則的決策樹模型
answer: D
explanation:
  summary: 答案 D：決策樹可用資訊增益挑選遞迴分裂的特徵與切點。
  correct: 資訊增益等於父節點的熵，減去各子節點熵依樣本比例加權後的總和。分裂後類別越純，不確定性下降越多；採熵準則的分類樹可據此比較候選切分。決策樹也可用 Gini 等其他準則，並非每棵樹都必用資訊增益。
  wrong:
    A: L1 以係數絕對值懲罰促成稀疏化，與比較分裂前後的熵不同。
    B: 激活函數負責神經網路的非線性轉換，通常不是依資訊增益選擇遞迴規則。
    C: 核函數描述特徵相似度或隱含映射，常見於 SVM，與樹節點的熵減少不同。
  rule: 看到分裂前後的熵減少量，應聯想到決策樹的資訊增益準則。
