  blind_answer: C
  dispute: 官方答案 C。Softmax 給各位置輸出不等於保留所有原始輸入資訊；全部 logits 加同一常數仍得相同機率，因此不能教成無損轉換。官方答案保留，選項的資訊保留措辭有疑義。
