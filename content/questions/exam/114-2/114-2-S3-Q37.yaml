stem: |
  某跨銀行風控平台希望整合多家銀行的用戶行為資料，用於訓練信用風險預測模型。由於競爭與法規限制，各銀行僅願意提供加密後資料，且資料在任何時間不得被平台解密。同時，平台需建立安全通訊協議以確保資料在傳輸過程未被竄改或重放。
  下列哪一組技術最能完整對應上述需求？
options:
  A: 對稱加密（Symmetric Encryption）＋ 單向雜湊（Hash Function）＋ 非對稱加密（Asymmetric Encryption）＋ 差分隱私（Differential Privacy）
  B: 同態加密（Homomorphic Encryption）＋ 非對稱加密（Asymmetric Encryption）＋ 單向雜湊（One-way Hash Function）＋ 對稱加密（Symmetric Encryption）
  C: 差分隱私（Differential Privacy）＋ 對稱加密（Symmetric Encryption）＋ 同態加密（Homomorphic Encryption）＋ 數位簽章（Digital Signature）
  D: 同態加密（Homomorphic Encryption）＋ 安全多方計算（Secure Multi-party Computation, MPC）＋ 雜湊函數（Hash Function）＋ 對稱加密（Symmetric Encryption）
answer: B
explanation:
  summary: 官方答案 B：須補足認證與防重放協議條件才成立，題面無法唯一確認。
  correct: 若另假設非對稱密碼用於經認證的金鑰協商、對稱加密搭配可靠訊息認證，且以受認證保護的序號或 nonce 驗證新鮮性並拒絕重複，B 可組成滿足需求的系統：同態加密負責密文運算，其餘機制保護通訊。但這些條件不是列出加密與一般雜湊就會自動成立；攻擊者可連資料與未受認證的雜湊一起替換，也能重送合法舊訊息。依題面判斷，條件不足，不能唯一確認 B；C 雖明列簽章，也不代表已完整防重放。指引 6-11 支援同態運算，未教授此完整通訊協議。
  wrong:
    A: 沒有明列可在密文上完成模型運算的同態加密或相應安全計算機制；一般加密與差分隱私不會自行滿足平台不得解密又要運算的需求，也未交代防重放。
    C: 不能簡單判為不合理：同態加密可負責運算，數位簽章可驗證來源與完整性，對稱加密保護通訊，差分隱私是額外措施。但合法舊簽章仍可重放，還須綁定並檢查新鮮性資料；因此 C 有其理由，卻也不是題面已充分保證的完整正解。
    D: 同態加密與安全多方計算可用於保護計算，不能只因同時出現就判錯；但一般雜湊不等於訊息認證，且未明列新鮮性與重複拒絕規則，同樣無法保證題定的通訊安全。
  rule: 密文運算、機密性、來源與完整性驗證、防重放各需相應機制，不能由密碼原語清單推定完整協議安全。
