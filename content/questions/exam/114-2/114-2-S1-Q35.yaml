stem: |
  某媒體公司計畫導入 CLIP（Contrastive Language–Image Pre-training）模型，以協助大量影像自動標註與搜尋，並希望在無需新增標訓資料的情況下，僅透過文字提示（Text Prompt）即可識別影像內容。請問此應用情境中，CLIP 能夠達成的關鍵技術特性為何？
options:
  A: 透過圖文對比式學習（Contrastive Learning）將影像與文字映射至共同嵌入空間（Shared Embedding Space），可直接以語意相似度進行零樣本分類；
  B: 透過影像增強與特徵擴散降低標訓資料需求；
  C: 以監督式學習結合多層感知器（Multilayer Perceptron, MLP）進行影像特徵分類；
  D: 以自迴歸生成模型（Autoregressive Model）逐步生成文字標籤描述影像內容
answer: A
explanation:
  summary: "答案 A。CLIP 以配對圖文的對比學習建立可比較的表示，支援文字提示的零樣本分類。"
  correct: "A 的機制是先在預訓練階段拉近配對圖文、拉遠不配對圖文的表示；推論時將影像與候選類別的文字提示分別編碼，依相似度選出類別。此處不需新增下游任務標註，不代表預訓練沒用過圖文配對資料；文字提示也不保證涵蓋所有未知物件。"
  wrong:
    B: "影像增強可以是訓練工具，但特徵擴散並不是 CLIP 以文字提示進行分類的核心，沒有解釋共同圖文表示。"
    C: "固定分類頭的監督式分類通常針對既定類別學習；僅加 MLP 無法說明為何能直接用新的文字類別提示作零樣本判別。"
    D: "原始 CLIP 主要編碼並比較影像與文字，不是靠自迴歸解碼器逐字產生描述；產生圖片說明需額外生成模型設計。"
  rule: "CLIP 的零樣本分類是比較影像與候選文字提示的嵌入相似度。"
