stem: |
  在自然語言處理中，檢索增強生成（Retrieval-Augmented Generation, RAG）是一種結合語言模型與向量搜尋的技術，可有效減少模型知識過時與產生幻覺的問題。若要建立一套高效能的 RAG 系統，下列何者為在「檢索階段」最關鍵的挑戰？
options:
  A: 確保檢索到的文件能被完整納入語言模型的上下文視窗（Context Window）中進行生成；
  B: 選擇使用 Faiss 或 ScaNN 等近似最近鄰搜尋函式庫；
  C: 降低嵌入模型（Embedding Model）在高維空間中的計算成本與記憶體占用；
  D: 避免向量檢索結果僅具語意相似但與查詢意圖無實質關聯的情況
answer: D
explanation:
  summary: 答案 D；檢索應找能支援答案的證據，不能只追求向量相似。
  correct: 相似度高的段落可能只談相同主題，卻沒回答查詢的條件或事實。RAG 的檢索品質要看文件是否能支援使用者真正要問的問題；可透過分塊、查詢處理、混合搜尋或重排序改善，並以任務資料驗證。若送入生成器的證據本身不相關，後續流暢的文字仍可能答非所問。
  wrong:
    A: 上下文容量是檢索後的內容選取與組裝問題，通常應挑選必要片段，而非要求把所有檢索文件完整塞入。
    B: 函式庫選擇會影響速度、規模及工程成本，但不能單獨保證找到真正相關的證據。
    C: 嵌入的成本與記憶體確實影響效率，卻沒有直接解決相似內容與查詢意圖不符的品質問題。
  rule: 評估 RAG 檢索時，先檢查命中文件能否支援答案，再衡量速度與資源成本。
