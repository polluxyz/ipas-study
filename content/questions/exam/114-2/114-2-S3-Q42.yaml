  在深度神經網路中，不同層的參數量（parameter count）差異極大。有些層雖然數量少但計算量大，有些則相反。了解參數分佈情形，有助於模型壓縮與遷移學習設計。請問在 VGG16 中，下列何者的參數量最多？
code: |
  from torchsummary import summary
  from torchvision import models
  model = models.vgg16(weights='IMAGENET1K_V1')
  summary(model, (3,150,150))
code_lang: python
options:
  A: |-
    卷積層(Conv2d)
  B: |-
    全連接層(Linear)
  C: |-
    ReLU 激活函數
  D: |-
    池化層(MaxPool2d, AdaptiveAvgPool2d)
answer: B
explanation:
  summary: 答案：B。題示 VGG16 的三個 Linear 層合計約占 89.36% 的參數。
  correct: >-
    直接加總摘要中的三個全連接層：102,764,544 + 16,781,312 + 4,097,000 = 123,642,856。 相較之下，13 個卷積層共 14,714,688 個參數，因此全連接層最多。 主要來源是第一個 Linear：AdaptiveAvgPool2d 產生 512×7×7 個數值，攤平後有 25,088 維，連到 4,096 個單元並包含偏差，就要 (25,088+1)×4,096 個參數。 這是儲存及學習的參數數目，不等於每次推論的運算次數。
  wrong:
    A: >-
      卷積會在不同空間位置重用同一組卷積核；雖然層數較多，合計參數仍少於題示三個 Linear 層。
    C: >-
      本模型的 ReLU 只將負值設為 0，沒有可訓練權重或偏差，因此摘要參數為 0。
    D: >-
      題示最大池化與自適應平均池化依區域取最大值或平均值，沒有可訓練參數；輸出張量有元素不代表有參數。
  rule: 比較參數量先加總權重與偏差；卷積的空間重用次數影響計算量，不能重複算進參數量。
