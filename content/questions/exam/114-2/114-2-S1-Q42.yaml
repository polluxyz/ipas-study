stem: |
  若部署一個深度學習模型至金融風控系統，該模型採用鑑別式架構（如 Transformer Classifier）。然而上線後，模型對新樣本的分類錯誤率顯著上升，經檢查發現，輸入資料分佈已與原訓練集明顯不同。針對此情形，下列哪一種應對策略最為適合？
options:
  A: 改用生成對抗網路（GAN）生成新樣本並混入訓練集；
  B: 改用邏輯迴歸模型（Logistic Regression）以提升穩定性；
  C: 增加模型容量（Model Capacity），以學習更多樣本差異；
  D: 使用變分自編碼器（VAE）監控潛在空間分佈，偵測輸入資料偏移
answer: D
explanation:
  summary: "答案 D。VAE 可提供輸入偏移監控訊號，但偵測不能修復已發生的分類退化。"
  correct: "官方選 D。若把應對理解為建立後續監控，使用訓練基準與線上資料的 VAE 潛在表示比較分布，確實比無依據換分類器或加容量更切中資料偏移。不過，題目已確認偏移及錯誤率上升，D 僅偵測而不適應新分布，不能稱完整改善方案；仍需取得具代表性的新資料與標籤、評估並再訓練或校準。VAE 訊號亦須驗證，生成模型不保證辨識所有分布外資料，見 [Nalisnick 等人的研究](https://arxiv.org/abs/1810.09136)。指引未教授用 VAE 潛在分布監控漂移的具體方法。"
  wrong:
    A: "若 GAN 只學舊分布，再生成更多舊樣本不會自動涵蓋新分布；若已有新分布資料可訓練生成器，也需先驗證生成品質及對分類的幫助，不能直接當成最佳處方。"
    B: "較簡單的邏輯迴歸可能在部分任務有穩定性優勢，但更換模型類型本身沒有修正訓練與線上分布差異，也可能欠擬合。"
    C: "增加容量可能擴大可擬合範圍，但缺少新分布的資料與適當驗證時，不能保證適應偏移，還可能提高過擬合風險。"
  rule: "發現資料偏移後，須分開處理監控偵測與有新資料支持的模型更新。"
