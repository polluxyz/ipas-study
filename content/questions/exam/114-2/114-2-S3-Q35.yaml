stem: |
  某公司針對製程感測器資料進行主成分分析（PCA），經標準化與協方差矩陣分解後，得到三個主成分的特徵值如下：λ1=6.0, λ2=3.0, λ3=1.0。若團隊決定僅保留能解釋至少 80% 總變異量的主成分，以進行後續模型建構，下列哪一項敘述最合理且數據解讀正確？
options:
  A: 前兩個主成分合計解釋 90%的總變異量，因此可安全降維至二維，且仍保留大部分資訊
  B: 第一主成分解釋 60%的變異量，表示資料結構呈現明顯線性關係，僅保留一維即可避免過擬合
  C: 雖然前兩個主成分可解釋超過 80% 變異量，但第二主成分貢獻仍高達 30%，不宜捨棄第三主成分
  D: 三個特徵值相差不大，顯示各主成分變異均衡，降維可能導致資訊損失
answer: A
explanation:
  summary: 答案 A：依給定特徵值計算，前兩個主成分保留 90% 變異量，達到 80% 門檻。
  correct: 按題目提供的特徵值，總和為 6+3+1=10；第一個主成分占 60%，前兩個合計 (6+3)/10=90%，因此至少須保留兩個才能達到 80%。A 的「安全」只能解讀為滿足題定變異門檻，不能保證不損失預測訊號。若原始資料僅有三個單位變異數特徵，且變異數慣例相同，則特徵值總和應為 3；原題未明示原始欄數與標準化方式，本解析仍依題給數值計算。
  wrong:
    B: 第一主成分的 60% 未達 80% 門檻；變異占比也不足以證明資料具有指定線性關係，或保證一維就能避免過擬合。
    C: 第二主成分占 30% 正是保留前兩個的理由；第三個僅占 10%，在題定 80% 規則下沒有必須保留的依據。
    D: 三者的比例是 60%、30%、10%，並非變異均衡。降維會損失部分變異，但本題已容許在達門檻下捨棄它。
  rule: PCA 先以特徵值除以總和，再選累積解釋比例首次達門檻的最少主成分數。
