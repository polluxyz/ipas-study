stem: |
  在郵遞區號自動辨識的研究中，研究人員收集了一份手寫數字影像資料集，每一張影像為 8×8 的灰階圖片，共包含多個手寫數字樣本。這份資料集來自 UCI Machine Learning Repository，常被用於數字辨識與機器學習方法的教學與實驗。
  在過程中，研究人員發現資料中可能存在雜訊，例如筆跡模糊或影像中附加的干擾點，這會影響後續分類模型的效能。因此，他們希望透過資料降噪的方法，提升後續分類的準確度。同時，他們也想透過 KNN (K-Nearest Neighbors) 搭配交叉驗證來評估模型表現，確保模型在不同資料切割下都能有穩定的預測能力。

  ```python
  from sklearn.datasets import load_digits
  digits = load_digits()
  digits.data.shape
  ```

  ```text
  (1797, 64)
  ```

  部分樣本經繪製後的外觀如下圖所示：
  根據這份資料來回答 46~47 題。

  ```python
  import numpy as np
  noisy = np.random.normal(digits.data, 4)
  ```

  假設研究人員已將含有雜訊的手寫數字影像存放在變數 noisy 中。部分資料經視覺化後的外觀如下：
  他們嘗試使用 PCA 進行降噪，並希望能保留影像的主要特徵，同時去除影像中的雜訊。然而，當程式執行後，觀察到影像仍然含有明顯的雜訊。研究人員懷疑是程式中某個步驟的設定不正確，導致 PCA 沒有發揮降噪的作用，需要修改程式碼才能讓降噪有效。請問哪一段程式碼需要修改，才能讓 PCA 對 noisy 影像有效去噪？
code: |
  from sklearn.decomposition import PCA          #程式碼A
  pca = PCA()                                   #程式碼B
  pca.fit(noisy)                                 #程式碼C
  components = pca.transform(noisy)              #程式碼D
  filtered = pca.inverse_transform(components)   #程式碼E
code_lang: python
options:
  A: |-
    程式碼 A
  B: |-
    程式碼 B
  C: |-
    程式碼 C
  D: |-
    程式碼 D
answer: B
explanation:
  summary: 答案：B。PCA() 在本題保留全部 64 個主成分，投影再重建幾乎原樣保留了雜訊。
  correct: >-
    這組資料有 1,797 筆、64 維；未指定 n_components 的 PCA 在題示預設設定下保留全部 64 個方向。
    `fit(noisy)` 學投影方向，`transform` 轉到主成分座標，`inverse_transform` 轉回像素座標；保留全部方向只是更換座標系，無法藉捨棄成分濾除雜訊。
    因此應修改 B，例如 `PCA(n_components=20)`，保留部分方向再重建。
    20 只是可嘗試的設定，並非保證最佳；去噪須以主要訊號集中於保留方向、部分雜訊落在捨棄方向為條件，應比較重建與後續驗證表現。
    指引介紹 PCA 的降維及雜訊過濾用途；預設保留量與重建 API 見 [PCA 官方文件](https://scikit-learn.org/stable/modules/generated/sklearn.decomposition.PCA.html)。
  wrong:
    A: >-
      匯入 sklearn.decomposition 的 PCA 類別並沒有錯；只更換匯入步驟，不會解決保留全部主成分的問題。
    C: >-
      fit 用含雜訊資料學習主要方向是這類無監督去噪的常見作法；它本身不代表設定錯誤，問題是沒有限制保留維度。
    D: >-
      transform 是投影到已學得的主成分空間，之後仍須 inverse_transform 重建像素；只改投影呼叫而不減少保留成分，不能解決原問題。
  rule: PCA 去噪須捨棄部分主成分再重建，保留全部方向通常只會還原含雜訊的輸入。
