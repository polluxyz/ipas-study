stem: |
  某企業部署生成式 AI 系統協助行銷與內容產出，但近期遭質疑部分生成內容可能涉及著作權侵權。為降低企業在法律層面的潛在責任與風險，下列哪一項策略最能有效預防侵權問題產生？
options:
  A: 對生成內容進行語意相似度比對，自動標註可能涉及既有著作的輸出結果，以降低侵權風險；
  B: 建立訓練資料篩選與授權驗證機制，排除未授權或高風險資料來源；
  C: 在訓練與微調過程中採用差分隱私技術，避免模型記憶特定受著作權保護的樣本；
  D: 在模型輸出端嵌入浮水印（Watermarking）或數位指紋（Digital Fingerprint）技術，以確保生成內容可追溯
answer: B
explanation:
  summary: 答案 B；先確認訓練來源與使用權限，是題目中的事前風險控制。
  correct: 在資料納入訓練前，記錄來源、核對授權範圍並排除高風險素材，能從資料入口降低風險，因此 B 最符合預防導向。這是四種措施的職責比較，並非認定所有未授權使用必然違法，也不保證生成結果一定無侵權；實務仍需輸出檢查與權利爭議處理。[NIST 生成式 AI 風險指引](https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf) 亦將訓練資料審查與輸出風險措施並列。
  wrong:
    A: 相似度比對可作為輸出端的輔助偵測，但相似不等於法律侵權，未命中也不代表安全；它不能取代訓練資料來源與授權管理。
    C: 差分隱私限制單筆資料對模型結果的影響，可降低某些記憶與隱私風險；它不會授予著作使用權，也不是著作權合規的保證。
    D: 浮水印與指紋有助識別或追溯內容來源，不能因此阻止生成內容重現他人受保護的表達。
  rule: 來源授權、輸出檢查與可追溯性各有作用，任何一項技術都不等於全面的權利保證。
