concepts: [drift-detection, model-monitoring]
stem: |
  某企業的 AI 模型已部署於線上服務環境中，用於即時預測顧客流失機率。近期團隊注意到模型預測準確率逐漸下降，但系統運作正常且未出現錯誤訊息。經分析發現，近期輸入資料的分布與模型訓練資料相比出現顯著偏移。若要在 MLOps 流程中主動偵測並預警此類問題，最應採用下列哪項措施？
options:
  A: 建立即時的資料漂移（Data Drift）與概念漂移（Concept Drift）監測機制；
  B: 將模型轉換為量化版本以降低延遲；
  C: 增加模型超參數調整次數以強化適應性；
  D: 使用固定隨機種子（Random Seed）確保訓練穩定
answer: A
explanation:
  summary: "答案 A。資料與概念漂移監控能補足系統正常、模型卻失準的監測缺口。"
  correct: "A 同時關注輸入分布是否改變，以及相同輸入與結果之間的關係是否改變；應把漂移告警、回流標籤的模型品質與重訓或回退流程連接起來。輸入分布偏移只能證明資料漂移的訊號，不足以單獨證明概念漂移；後者通常需標籤或有效的品質回饋確認。指引的模型漂移用詞較概括，學習時應分清分布變化與實際效能衰退。"
  wrong:
    B: "量化主要減少模型儲存與推論資源，還可能帶來精度損失；沒有建立資料分布或品質變化的告警。"
    C: "增加調參次數不會自動取得新分布標籤，也不是持續監控機制；若仍依舊驗證集挑選，可能無法反映線上問題。"
    D: "固定種子有助於重現同一實驗條件下的部分隨機過程，但不能阻止使用者行為與真實資料分布隨時間改變。"
  rule: "系統可用不代表模型有效，需同時監控輸入漂移與有標籤的預測品質。"
