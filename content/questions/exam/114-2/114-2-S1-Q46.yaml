stem: |
  某企業的 AI 模型已部署於線上服務環境中，用於即時預測顧客流失機率。近期團隊注意到模型預測準確率逐漸下降，但系統運作正常且未出現錯誤訊息。經分析發現，近期輸入資料的分布與模型訓練資料相比出現顯著偏移。若要在 MLOps 流程中主動偵測並預警此類問題，最應採用下列哪項措施？
options:
  A: 建立即時的資料漂移（Data Drift）與概念漂移（Concept Drift）監測機制；
  B: 將模型轉換為量化版本以降低延遲；
  C: 增加模型超參數調整次數以強化適應性；
  D: 使用固定隨機種子（Random Seed）確保訓練穩定
answer: A
