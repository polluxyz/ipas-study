stem: |
  一家零售電商公司希望建立顧客流失預測模型，用以判斷哪些會員可能在三個月內不再消費。團隊以去年會員資料進行訓練，並僅採用「曾經購買三次以上」的活躍顧客紀錄作為樣本。模型上線後，對整體會員進行預測時，發現模型對於新註冊會員與低消費會員的預測準確率明顯偏低。下列何者為造成此現象最可能的原因？
options:
  A: 特徵設計未排除與會員忠誠度高度相關的變數，導致特徵偏差（Feature Bias）
  B: 標記（Label）由人工標註，導致標籤偏差（Label Bias）
  C: 訓練樣本僅涵蓋高活躍顧客，造成取樣偏差（Sampling Bias）
  D: 模型未進行超參數調整，導致過擬合（Overfitting）
answer: C
