stem: |
  某企業嘗試以 N-gram 語言模型（N-gram Language Model）建立客服自動回覆系統，但發現模型生成的句子雖在片段上合理，卻缺乏整體語意連貫性。此問題最可能源自 N-gram 模型的哪一項限制？
options:
  A: N-gram 模型在訓練過程中需要龐大計算量，導致長句無法收斂；
  B: N-gram 模型僅根據固定長度的前序詞建立機率估計，難以捕捉長距離依賴關係（Long-range Dependencies）；
  C: N-gram 模型缺乏語意嵌入（Semantic Embedding）層，因此無法表徵詞語間的語意相似度；
  D: N-gram 模型假設詞與詞之間相互獨立，導致無法建構上下文語意關聯
answer: B
explanation:
  summary: 答案 B；固定長度的歷史視窗限制了 N-gram 的長距離建模。
  correct: N-gram 語言模型以最近 N−1 個詞近似下一詞的條件機率；例如 trigram 只直接查看前兩個詞。超出視窗的主題、指涉或前文約束不會直接參與該次估計，因此局部詞組可能合理，整段仍缺乏連貫性。增加 N 可以延長視窗，但也會提高資料稀疏與估計困難。
  wrong:
    A: 傳統 N-gram 常以次數統計與平滑估計機率，不以長句梯度訓練無法收斂作為主要限制。
    C: 傳統 N-gram 確實不依賴詞嵌入，但沒有嵌入不等於無法利用局部詞序；本題整體連貫性的直接限制是歷史視窗太短。
    D: Bigram、trigram 都保留局部條件依賴；把所有詞視為互相獨立只對 unigram 的簡化假設適用。
  rule: 遇到序列連貫性問題，先確認模型每次預測實際能看見多長的歷史。
