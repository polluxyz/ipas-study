stem: |
  某電商平台導入 AI 情感分析模型，用以自動偵測顧客評論中的負面情緒並觸發客服機制。然而，上線後發現模型在面對不同語言或族群書寫風格的評論時表現不一致，例如部分語氣強烈的正面評論被誤判為負面，而禮貌但含批評意圖的評論卻被判為中性。若從技術與資料治理的角度分析，下列哪一項描述不正確？
options:
  A: 模型未啟用詞嵌入正規化（Embedding Normalization）可能造成語意距離不穩定，導致預測誤差；
  B: 訓練語料若偏向特定文化或語氣特徵，可能使模型產生內隱偏誤（Implicit Bias）；
  C: 模型若訓練資料來源不平衡，容易導致對不同語言或族群風格的情緒判斷不準確；
  D: Transformer 架構能捕捉上下文語意，但若訓練資料偏差仍存在，模型仍可能學習到偏誤判斷
answer: A
explanation:
  summary: "官方答案 A。題目問不正確，但未給嵌入與分類方式，無法嚴格證明 A 不可能成立。"
  correct: "官方選 A，合理的出題意圖是：不同文化、語言風格的誤判，較直接連到語料代表性及語用理解，不能未經診斷就歸因未做詞嵌入正規化。不過 A 說的是可能，正規化在使用向量距離或長度敏感分類規則的系統中確實可能改變預測；題幹未交代這些條件，因此獨立判斷為缺少唯一可證錯項。指引支持資料偏見與語用風險，沒有支持未正規化必然無關的命題，需交非作者審查爭議。"
  wrong:
    B: "此敘述可成立：文化或語氣集中於部分語料時，模型可能把那些群體的用語模式當成通用規則，所以不能選作不正確項。"
    C: "此敘述可成立：來源與群體比例失衡會讓部分語言風格的訓練訊號不足，但比例不平衡是否造成傷害仍應分群評估；它不是必然誤判的定律。"
    D: "此敘述可成立：上下文建模能力不等於資料無偏，Transformer 仍可能學到訓練語料的偏差，所以也不能選作不正確項。"
  rule: "診斷跨群體語言誤差應檢查資料與語境，不能把未交代的表示設定直接判成原因或無關。"
