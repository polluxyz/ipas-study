stem: |
  在多模態 AI 模型訓練或推論過程中，遇到某一模態資料缺失（例如僅有影像資料但缺少文本說明），下列哪一種策略最有效維持模型效能？
options:
  A: 以零向量或固定向量填充缺失模態輸入；
  B: 訓練具備模態缺失感知能力的模型，使其適應缺失狀況；
  C: 利用生成模型（如 GAN 或自迴歸模型）預測並補全缺失模態資料；
  D: 直接捨棄缺少模態的樣本，避免干擾訓練或推論
answer: B
explanation:
  summary: 官方答案 B；缺失感知訓練直接對準題意，C 在可可靠補全時也能使用。
  correct: 在可重新訓練的條件下，可提供模態可用性指標，並在訓練中隨機捨棄部分模態，使融合模型學會利用仍存在的訊息；B 因而直接對應缺失情境，是本題的標準最佳答案。[ModDrop 原始研究](https://arxiv.org/abs/1501.00102) 支持模態捨棄的可行性，但效益取決於資料與缺失模式，未證明 B 普遍優於可靠的生成補全。C 有條件可用也不代表已證明本題有多個最佳答案；比較實際效能仍須確認缺失機制、可否重訓及補全品質，兩種方法亦可結合。指引未明確教授缺失模態感知訓練與模態捨棄。
  wrong:
    A: 固定填值是可用基線，但若模型沒見過該情況或不知道模態已缺失，可能把填值當真實訊號；配合缺失指標與訓練後才較可靠。
    C: 當其他模態足以可靠預測缺失資訊時，生成補全可能有效，不能一概判錯；但模態關係不足時會補出不可靠資訊，且增加運算成本。這些適用條件支持 C 可用，尚不足以證明它與 B 同等最佳。
    D: 訓練時刪除會減少樣本並可能改變資料分佈；推論時直接捨棄則無法對該個案提供預測，不是維持服務能力的通用解法。
  rule: 處理模態缺失時，先核對缺失機制與可用資訊，再比較缺失感知訓練、補全及可靠回退。
