stem: |
  某研究團隊正在訓練一個針對低資源語言（如少數民族語言）的語言模型，但該語言僅有約 1 萬筆語料可用。在訓練過程中出現明顯的過擬合現象，若希望在不新增真實語料的前提下提升模型的泛化能力，採用下列哪一種方法最為適合？
options:
  A: 將 Transformer 的隱藏層維度擴增至 1024，以提升表徵能力；
  B: 採用反向翻譯（Back-Translation）技術，以生成額外目標語句的偽平行語料（Pseudo‑Parallel Corpus）；
  C: 對詞嵌入矩陣（Embedding Matrix），施加 L1 正則化以壓縮模型參數；
  D: 將多語言 BERT（mBERT）中所有 Transformer 層全部凍結以保留預訓練知識
answer: B
explanation:
  summary: 官方答案 B；反向翻譯須有可用翻譯資源，純語言模型情境的前提不足。
  correct: 若已有品質足夠的翻譯工具，往返翻譯可改寫既有語句，增加文字表達變化；在這個補充條件下，B 可理解為資料增強的作法。但標準反向翻譯是把既有目標語句譯成合成來源句，配成偽平行資料，並不自動增加不同的目標語句。題目談的是純語言模型，未交代翻譯模型、其他語料或訓練目標，因此不能無條件判 B 最適合；指引未明確教授這項方法。定義見 [Sennrich 等原始論文](https://arxiv.org/abs/1511.06709)，此題需複審。
  wrong:
    A: 增大隱藏維度通常增加可訓練參數；只有約一萬筆資料且已過擬合時，沒有理由認為單純擴容就能改善泛化。
    C: L1 正則化確實可能降低有效模型複雜度，是合理候選，不能說必然無效；但只約束嵌入矩陣未必足夠，權重稀疏也不會自動減少儲存矩陣的形狀。題目沒有驗證結果可排除適當正則化。
    D: 全凍結可保留預訓練表示並減少更新參數，但也限制領域適應；mBERT 的語言涵蓋與任務相容性未交代，不能保證適合該低資源語言模型。
  rule: 用合成文字緩解過擬合前，先確認生成資源、語意品質與合成資料是否符合訓練目標。
