concepts: [service-scaling]
stem: |
  某 AI 服務系統每次推論請求需約 1 秒完成，且必須支撐高達 10,000 次請求每秒（RPS）的流量。為確保系統具備高可用性且能穩定應付流量峰值，下列哪一種架構方案最為合適？
options:
  A: 依賴單台超高效能伺服器進行垂直擴展，提升硬體規格；
  B: 採用容器化部署並水平擴展服務實例，結合自動彈性伸縮機制（Auto Scaling）；
  C: 限制最大併發連線數，以避免系統過載；
  D: 增加批次處理大小，一次同時處理上千筆請求
answer: B
explanation:
  summary: "答案 B。高吞吐與高可用需要多實例分擔流量，再依容量訊號調整實例數。"
  correct: "B 可藉負載平衡讓多個容器實例分擔請求，並以彈性伸縮吸收流量變化；搭配跨故障域部署與健康檢查，可降低單點故障風險。若平均每秒完成 10,000 筆且平均系統停留時間為 1 秒，穩態平均在途量約為 10,000 筆；這不是伺服器台數，仍須量測每實例併發、吞吐與伸縮延遲，預留容量。容器化本身不保證足夠效能。"
  wrong:
    A: "升級單機有硬體與成本上限，也保留單點故障；在高峰流量與可用性要求下，缺少跨實例分散負載的機制。"
    C: "併發限制可作保護措施，但若容量不足，請求仍會排隊或被拒絕，不能單靠限流達成指定吞吐。"
    D: "批次推論有機會提高設備利用率，卻可能增加等待時間；單靠加大批次沒有解決多實例容量及故障備援。"
  rule: "推論服務擴容須以實測吞吐規劃多實例容量，並同時處理伸縮延遲與故障備援。"
