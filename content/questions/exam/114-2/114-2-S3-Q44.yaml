  VGG16 層數深且結構規則，由多層卷積、池化及全連接層組成。了解各層的輸入/輸出維度、參數量及記憶體需求，有助於掌握 CNN 模型的組成邏輯與實作技巧。根據 VGG16 的模型架構，下列敘述何者正確？
code: |
  from torchsummary import summary
  from torchvision import models
  model = models.vgg16(weights='IMAGENET1K_V1')
  summary(model, (3,150,150))
code_lang: python
options:
  A: |-
    AdaptiveAvgPool2d 的輸出會被攤平後傳入第一個全連接層；由於前一層池化輸出空間為 4×4，所以第一個線性層的輸入維度是 512×4×4 = 8192
  B: |-
    Linear-33（第一個全連接層）報出的 102,764,544 參數只包含權重，偏差（bias）沒有算在內
  C: |-
    根據列出的「Estimated Total Size (MB) = 624.98」，表示訓練此模型只需大約 625MB 的 GPU 記憶體（包含所有 optimizer state 與梯度），所以一張 1 GB 的 GPU 就足夠訓練
  D: |-
    VGG16 包含 13 層卷積層（conv）與 3 層全連接層（FC），總參數數目約為 138,357,544（約 138.36M）
answer: D
explanation:
  summary: 答案：D。VGG16 的 16 指 13 個卷積層加 3 個全連接層，題示共有 138,357,544 個參數。
  correct: >-
    按摘要逐層數出 13 個 Conv2d 與 3 個 Linear；VGG16 名稱中的 16 不把 ReLU、Dropout 與池化另算成有權重的層。
    卷積參數 14,714,688 加上全連接參數 123,642,856，得到 138,357,544，約 138.36M。
    資料會先經 features、AdaptiveAvgPool2d，再攤平進 classifier；此處自適應池化明確輸出 7×7，所以不能沿用先前的 4×4 尺寸。
  wrong:
    A: >-
      4×4 是 MaxPool2d-31 的輸出；下一層自適應平均池化已改成 7×7，因此攤平維度為 512×7×7=25,088，而非 8,192。
    B: >-
      Linear 預設包含偏差，每個輸出單元各一個；25,088×4,096 個權重加 4,096 個偏差，才是表內的 102,764,544。
    C: >-
      摘要的 Estimated Total Size 是特定假設下的估計，不能保證涵蓋 optimizer state、所有梯度、實際批次與執行工作空間；不能由它斷定 1 GB GPU 足夠訓練。
  rule: 核算網路尺寸與參數時，依實際資料流逐層追蹤，並把 Linear 的權重與偏差分開計算。
