stem: |
  某資料科學團隊正在開發一個客戶相似度比對系統，用於計算所有客戶之間的相似度分數。若系統需逐一比對每一位客戶與其他所有客戶的資料組合，此時演算法的時間複雜度最可能為哪一種？其代表意義為何？
options:
  A: O(n) — 執行時間與資料量成線性關係
  B: O(n²) — 執行時間與資料量平方成正比
  C: O(1) — 執行時間固定不變
  D: O(log n) — 執行時間與資料量呈對數成長關係
answer: B
