stem: |
  某資料科學團隊正在開發一個客戶相似度比對系統，用於計算所有客戶之間的相似度分數。若系統需逐一比對每一位客戶與其他所有客戶的資料組合，此時演算法的時間複雜度最可能為哪一種？其代表意義為何？
options:
  A: O(n) — 執行時間與資料量成線性關係
  B: O(n²) — 執行時間與資料量平方成正比
  C: O(1) — 執行時間固定不變
  D: O(log n) — 執行時間與資料量呈對數成長關係
answer: B
explanation:
  summary: 答案 B：所有客戶逐一兩兩比對，配對數隨 n 的平方成長。
  correct: 若對每位客戶檢查其餘 n−1 位，共有 n(n−1) 次有序比對；利用相似度對稱性只算不重複配對時為 n(n−1)/2。兩者主導項都是 n²，因此在單次比對成本固定下屬 O(n²)。若同時計入 d 維特徵的逐欄運算，常見成本是 O(n²d)。兩科指引未明確教授本題的大 O 推導。
  wrong:
    A: 線性成本對應每筆資料只做固定量工作；本題每位客戶還要與其他客戶逐一比較。
    C: 客戶數增加時，待比較的組合數也增加，所以執行時間不是與 n 無關的常數。
    D: 對數成長常見於每步縮小搜尋範圍的流程；題目要求完整列舉配對，沒有這種縮減。
  rule: 完整兩兩配對通常是平方級成本，即使利用對稱性減半也不改變大 O 階數。
