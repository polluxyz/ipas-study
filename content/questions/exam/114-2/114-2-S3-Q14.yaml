stem: |
  下列哪一種 AI 應用情境中，模型的可解釋性（Explainability）最為關鍵？
options:
  A: 電商平台利用深度學習模型預測用戶的下一次購買時間，以優化推播行銷策略
  B: 新創公司使用機器學習演算法自動調整廣告出價策略，以提升點擊轉換率
  C: 醫院導入 AI 模型分析病患影像並給出腫瘤惡性可能性，作為臨床醫師診斷依據
  D: 銀行導入 AI 模型預測客戶流失率，並自動推薦留客優惠方案
answer: C
explanation:
  summary: 答案 C：作為臨床診斷依據的模型，需要讓醫師理解判斷理由與限制。
  correct: 腫瘤判讀直接影響診斷與後續處置，醫師需要檢視模型依據、辨認不合理訊號，並結合其他臨床證據判斷是否適用。因此在所列情境中，可解釋性對決策責任與風險控管最為直接；可解釋也不代表模型必然正確或已完成臨床驗證。
  wrong:
    A: 購買時間預測也可用解釋協助行銷，但題定用途主要是改善推播，對個人健康與臨床決策的直接影響較低。
    B: 廣告出價需要監控成效與限制，解釋有其價值；在本題比較下，不及臨床診斷的可追溯需求直接。
    D: 銀行流失與留客模型也需要合理解釋，但本題不是貸款核准或信用處分；不能只因金融業就忽略實際用途的差異。
  rule: 可解釋性需求應依決策後果、問責與人工覆核需要判斷，不能只看產業名稱。
