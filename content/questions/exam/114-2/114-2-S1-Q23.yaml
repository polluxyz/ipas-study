concepts: [phased-rollout]
stem: |
  某大型醫院即將部署一套輔助診斷的 AI 系統，為降低對臨床流程的衝擊，同時確保風險可控與回饋可收斂，應採取何種『漸進式部署』（Phased Rollout）策略最為合適？
options:
  A: 從單一專科（如放射科）或特定病房開始啟用，逐步擴展至全院；
  B: 先部署於病例量較高的急診單位，加速收集高頻使用回饋；
  C: 僅在夜班或離峰時段啟用，避免影響主要臨床工作負載；
  D: 在使用者界面啟用提示模式，讓全院同步體驗但不影響診斷流程
answer: A
explanation:
  summary: 答案 A；先限制啟用範圍，再依觀察結果逐步擴大。
  correct: 先選可控的單一專科或病房，明確安排監測、臨床責任、回饋管道及回退條件，再決定是否擴展到下一範圍。這樣能限制首次導入的影響，並讓流程問題在較小範圍內被發現，因此 A 最符合題目要求。指引的小範圍試點與逐步落地支持此原則，正式擴量仍須依驗證結果決定。
  wrong:
    B: 高病例量可加快回饋，但急診通常時效壓力與風險都高，病例多本身不是控制首次導入衝擊的理由。
    C: 限制時段並未定義逐步擴展的單位與門檻，夜班也可能人力較少，不保證更容易控管風險。
    D: 提示模式可降低自動決策影響，但全院同時開放仍擴大接觸範圍；提示也可能影響判斷，不能假設完全不影響診斷流程。
  rule: 漸進式部署要同時界定初始範圍、擴量門檻、監測指標與可執行的回退方式。
