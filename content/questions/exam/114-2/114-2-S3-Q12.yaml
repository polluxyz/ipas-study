stem: |
  某智慧製造公司開發一套設備故障預測系統，利用感測器資料訓練深度神經網路（Deep Neural Network, DNN）模型，以提前偵測異常運作跡象。在訓練過程中，團隊發現模型收斂速度不穩定：有時過快導致過擬合，有時又遲遲無法達到最佳準確率。開發團隊可以藉由調整下列哪一項超參數（Hyperparameter）以改善此問題？
options:
  A: 每個神經元的輸出結果
  B: 損失函數（Loss Function）在訓練過程中的梯度變化值（Gradient）
  C: 學習率（Learning Rate），控制模型權重更新的速度
  D: 模型在訓練後產生的權重值
answer: C
explanation:
  summary: 答案 C：學習率是控制權重更新步長的超參數。
  correct: 以梯度下降為例，w 下一步 = w 現值 − η×梯度，其中 η 是學習率。過大可能跨過低損失區域並震盪，過小可能進展緩慢，因此可調整其值或排程改善收斂。題幹把收斂快與過擬合相連只能當作個案觀察，兩者沒有必然因果；過擬合仍須看驗證表現並採適當正則化。
  wrong:
    A: 神經元輸出由當前輸入、權重與激活函數計算得出，不是直接設定更新速度的超參數。
    B: 梯度是在當前參數與資料下計算出的導數；可調整使用梯度的方式，但梯度值本身不是這裡的超參數。
    D: 訓練後權重是學習所得的模型參數，不是預先指定的學習率。
  rule: 區分超參數與訓練結果：學習率控制更新幅度，權重、梯度與輸出則由訓練計算產生。
