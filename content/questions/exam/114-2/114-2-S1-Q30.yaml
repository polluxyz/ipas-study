concepts: [non-repudiation]
stem: |
  某銀行計劃將 AI 詐欺偵測模組整合至核心交易系統，主管機關要求全流程必須符合金融監管對「不可否認性（Non-repudiation）」的資訊安全規範，以確保日後能進行法務追蹤與稽核。下列哪一項措施最能確保此要求的落實？
options:
  A: 為每筆 AI 模型推論記錄其輸入與輸出結果的加密雜湊值（Hash），並簽署數位簽章以確保不可竄改性；
  B: 優化模型效能以降低平均推論延遲至 100ms 以下，提升使用者體驗；
  C: 增加主機備援數量，以確保系統在故障時持續可用；
  D: 將模型推論請求導入負載平衡器，避免單點壅塞導致服務延遲
answer: A
explanation:
  summary: "答案 A。雜湊搭配可驗證身分的數位簽章，才與推論紀錄的不可否認性直接相關。"
  correct: "A 可對每筆輸入、輸出紀錄的摘要簽章，驗證時重新計算摘要並驗章，以發現內容變動並提供簽署來源的證據。雜湊本身不是加密，也不能單獨證明由誰產生紀錄；簽章是讓竄改可被驗出，並非阻止所有寫入。還須可信金鑰與身分綁定、完整紀錄保存及必要時間證據，不能聲稱單靠簽章就滿足所有法律要求。科目 1、3 指引未明確教授此簽章稽核流程；概念依 [NIST 不可否認性定義](https://csrc.nist.gov/glossary/term/non_repudiation)補充。"
  wrong:
    B: "100ms 是延遲目標，屬效能與使用體驗；速度快不會留下可驗證來源或完整性的證據。"
    C: "備援可降低服務中斷風險，處理的是可用性；無法自行證明某筆推論紀錄未被更改或由誰簽署。"
    D: "負載平衡把流量分配到不同節點，改善吞吐與壅塞，沒有提供推論內容與簽署身分的綁定。"
  rule: "不可否認性需以可信身分的簽章與完整稽核紀錄提供來源證據，單存雜湊不足。"
