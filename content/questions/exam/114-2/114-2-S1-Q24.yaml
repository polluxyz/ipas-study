stem: |
  某金融機構的 AI 風控系統遭受對抗性攻擊，駭客透過對輸入特徵進行微小但惡意的擾動，成功欺騙了模型。為了從根本上解決模型自身對這類攻擊的脆弱性，下列何者並非針對此種攻擊型態的技術手段？
options:
  A: 強化資料前處理，用以過濾掉格式不符或數值極端異常的輸入；
  B: 在模型訓練階段導入對抗樣本訓練，以提升模型對惡意特徵擾動的辨識與防禦能力；
  C: 於推論後階段使用規則引擎，以確保模型的預測結果不違反既有的業務硬性規定；
  D: 在模型部署環境中強化網路防火牆，以阻擋來自未授權來源的網路連線
answer: D
explanation:
  summary: 官方答案 D；防火牆不直接修正模型對有效輸入中微小擾動的脆弱性。
  correct: 防火牆依連線與流量規則控制存取，D 是官方選定的連線防線；攻擊者若能走合法介面送入格式正常的擾動輸入，仍可能欺騙模型。若以「是否作用在攻擊路徑上」作寬鬆判準，A 的輸入檢查與 C 的輸出規則都可降低風險，D 則未直接處理特徵擾動。但題幹另要求「從根本上解決模型自身脆弱性」；A、C 也不必然改變模型決策邊界，不能把這個嚴格要求直接換成攻擊路徑相關性。兩種判準不同，構成措辭歧義；這不代表已證明 A、C、D 三項同等最佳，官方仍以 D 計分。指引未完整教授此種微小擾動攻擊與各層防禦的差別；原理見 [對抗樣本原始論文](https://arxiv.org/abs/1412.6572)。
  wrong:
    A: 前處理能攔下格式錯誤或極端異常輸入，是攻擊路徑上的風險控制；但細微對抗擾動仍可能落在有效範圍內，這不保證根治模型自身脆弱性。它符合寬鬆的防線判準，與「從根本上」的要求仍有差別，不能把兩者混為一談。
    B: 對抗訓練把特定威脅模型下的擾動樣本納入學習，是四項中最直接改善模型抗擾動能力的方法；仍不保證抵抗所有攻擊。
    C: 規則引擎能阻止違反硬性規則的決策落地，卻可能漏掉符合規則的錯誤預測；它限制業務後果，不代表模型本身已更強健，與題幹「根本上」仍有落差。
  rule: 安全對策要對準威脅層次，分清存取控制、輸入驗證、模型強健性與決策護欄。
