stem: |
  某公司導入 AI 履歷篩選系統，用於自動決定是否進入面試。模型對男性應徵者的面試通過率為 55%，對女性應徵者為 30%。在其他條件不變的情況下，工程師需評估模型是否符合統計均等（Statistical Parity）的公平性定義。下列何者最正確？
options:
  A: 符合統計均等，因為模型未使用性別作為輸入特徵
  B: 符合統計均等，因為兩個族群皆有部分應徵者被錄取
  C: 不符合統計均等，因為不同群體的正向決策比例（通過率）存在明顯差異
  D: 不符合統計均等，因為女性族群的預測準確率較低
answer: C
explanation:
  summary: "答案 C。統計均等比較各群體獲得正向決策的比例。"
  correct: "面試通過是正向結果，男性為 55%、女性為 30%，差距是 25 個百分點，因此依題目給定比率不符合嚴格的統計均等。這不要求先知道誰實際適任，也不能單由通過率判斷準確率；若要作母體推論，另需樣本數與不確定性。"
  wrong:
    A: "即使不輸入性別，其他欄位仍可能與性別相關；是否達到均等須直接比較輸出比例。"
    B: "兩群都有正向結果不代表比例相同，統計均等不是只要求每群至少錄取一人。"
    D: "通過率不含真實適任標籤，不能據此推論女性準確率較低；其不符的直接理由是正向比例不同。"
  rule: "統計均等看各群體正向率，機會平等才以實際正例為條件。"
