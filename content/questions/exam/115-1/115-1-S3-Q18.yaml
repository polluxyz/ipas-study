stem: |
  某工程師設計用於醫療 X 光影像分類的 CNN，發現卷積層後直接接全連結層導致參數量高達 5,000 萬，訓練速度極慢。為降低模型參數量與計算成本，他在卷積層後加入池化層（Pooling Layer）。下列何者為池化層在此設計中最主要解決的問題？
options:
  A: 降低特徵圖空間維度，減少參數與計算量
  B: 提供非線性表達能力，以提升模型學習複雜度
  C: 改善梯度消失問題，以強化反向傳播穩定性
  D: 提升模型泛化能力而不影響特徵維度
answer: A
explanation:
  summary: "答案 A。縮小特徵圖，能減少後接全連結層的輸入單元。"
  correct: "將 H×W×C 特徵圖攤平後接 K 個輸出，全連結層約有 HWC×K 個權重。若池化讓高與寬各減半，在通道與輸出數不變時，這部分權重約降為四分之一。一般最大或平均池化本身沒有可訓練權重；省下的參數主要來自後續全連結層。"
  wrong:
    B: "最大池化雖具有非線性運算，題目的主要問題卻是攤平後輸入太大；增加非線性不能完整解釋參數減少。"
    C: "池化不是為反向傳播加入捷徑的主要機制；本題的參數爆量應由空間尺寸分析。"
    D: "常見下採樣池化正會改變特徵圖尺寸，因此不影響維度的描述與此設計不符。"
  rule: "估算池化的參數效益時，要追蹤特徵圖縮小如何影響後續層。"
