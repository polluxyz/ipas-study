stem: |
  某公司希望開發一個工業零件瑕疵辨識分類模型，共有 10 個類別，但每類僅約 50 張人工標註影像（總計約 500 張）。由於標註成本高昂，短期內無法擴充資料集。在此情境下，工程師需要在有限標註資料下建構高效能模型。請問下列哪一種策略最為適合？
options:
  A: 使用在大型資料集預訓練完成的卷積神經網路（CNN），並進行遷移學習微調；
  B: 從頭訓練大型 Vision Transformer（ViT），完全使用現有 500 張影像；
  C: 使用 K-means 對影像進行分群，並直接將群集結果作為分類模型輸出；
  D: 複製既有的資料以增加標註影像數量，並從頭訓練深度 CNN 模型
answer: A
explanation:
  summary: "A。僅約五百張標註影像時，重用預訓練視覺特徵較合適。"
  correct: "A 把大型資料集預訓練 CNN 的分類頭改為十類，再以小學習率微調，或先凍結骨幹訓練分類頭，減少從零估計大量參數的負擔。仍須檢查來源與工業影像的落差，並用獨立資料評估。[PyTorch 視覺遷移學習教學](https://docs.pytorch.org/tutorials/beginner/transfer_learning_tutorial.html)"
  wrong:
    B: "從零訓練大型 ViT 通常需要更多資料與適當正則化；只用五百張影像容易過擬合，也未利用任何預訓練知識。"
    C: "K-means 群集不保證對應十種人工定義的瑕疵類別，不能直接取代監督式分類輸出。"
    D: "單純複製不增加新外觀、角度或瑕疵資訊，不能補足大型 CNN 從零訓練所需的資料多樣性。"
  rule: "少量標註影像先考慮遷移學習，再驗證來源特徵能否適用目標場域。"
