stem: |
  某資料工程師嘗試對包含 300 個特徵的使用者行為資料集使用 DBSCAN 進行群集分析，但發現幾乎所有資料點都被判定為雜訊點（Noise Points），難以形成有意義的群集，即使不斷調整ε（Epsilon）與 MinPts 參數也無濟於事。請問下列何者為此問題最可能的根本原因？
options:
  A: 在高維空間中，維度詛咒（Curse of Dimensionality）使得資料點之間的距離趨於相近，導致 DBSCAN 的密度估計失效；
  B: DBSCAN 演算法僅適用於低維資料，無法處理高維資料；
  C: 300 個特徵的資料必然不具備群集結構，因此無法進行有效的分群；
  D: 高維空間中核心點的數量會受到數學限制，導致無法形成群集
answer: A
explanation:
  summary: "A。高維距離對比減弱，可能讓固定半徑的密度分群失去辨識力。"
  correct: "A 是選項中最合理的原因：無關或雜訊維度多時，資料稀疏且距離容易集中，DBSCAN 鄰域便難呈現清楚密度差異。應檢查縮放、距離度量、特徵選擇或降維；僅憑三百維且多為雜訊不能證明唯一根因，也不表示每種半徑都只會產生雜訊。"
  wrong:
    B: "演算法能接受高維輸入，困難在距離辨識力、參數及運算成本，不是禁止高維資料。"
    C: "特徵數不能決定是否存在群集，高維資料仍可能有低維結構或明顯群集。"
    D: "核心點由半徑內樣本數是否達門檻決定，沒有僅依維度就禁止形成足夠核心點的通則。"
  rule: "高維分群失效先查距離與特徵品質，不把維度數直接當成無群集的證明。"
