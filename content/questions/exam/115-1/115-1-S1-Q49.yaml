stem: |
  某零售電商平台已建立模型監控儀表板，用於追蹤線上推薦模型的運作狀態與效能表現。維運工程師需判斷哪些指標屬於「線上持續監控（Continuous Monitoring）」的範疇。下列指標中，哪一項最不適合在即時監控系統中追蹤，而應改由離線實驗追蹤系統管理？
options:
  A: 訓練實驗中每個 Epoch 的學習率（Learning Rate）變化曲線與超參數（Hyperparameter）設定軌跡；
  B: 線上推論 API 的 P50/P95/P99 回應延遲與每日請求量（RPS）趨勢；
  C: 輸入特徵分佈的族群穩定性指數（Population Stability Index, PSI），偵測資料漂移；
  D: 模型預測結果分佈（如 CTR）與定期回收的人工標註結果之對比
answer: A
explanation:
  summary: "A。最不適合線上即時監控的是訓練參數與逐 Epoch 學習率軌跡。"
  correct: "A 屬訓練實驗過程，應連同資料版本、參數及模型產物存入實驗追蹤系統，支援比較與重現。線上監控著重已部署服務的健康、輸入變化與預測品質；兩者可互相連結，但管理目的不同。"
  wrong:
    B: "延遲分位數與請求速率反映線上負載及尾端體驗，適合持續監控；RPS 是每秒請求速率，可看每日趨勢，但不等於每日總請求量。"
    C: "PSI 比較特徵分布，可用於資料漂移監控；須指定參考期、分箱與樣本窗，不表示每筆請求各算一次。"
    D: "預測與回收標籤的比較可查真實品質；標籤有延遲時可定期回算，持續監控不要求所有指標都零延遲。"
  rule: "訓練過程放實驗追蹤，部署後健康與品質放持續監控，再以版本識別串接。"
