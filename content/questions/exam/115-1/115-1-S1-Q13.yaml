stem: |
  某公司評估兩種方案，將大型語言模型客製化為內部客服助理：方案 A 為提示微調（Prompt Tuning），在輸入端加入可學習的軟提示（Soft Prompt）；方案 B 為傳統微調（Fine-Tuning），以標註問答資料調整模型。兩方案最本質的技術差異為何？
options:
  A: 提示微調主要用於降低推論延遲，而傳統微調則用於提升模型容量；
  B: 兩者技術本質相同，差別僅在於學習率（Learning Rate）設定不同；
  C: 傳統微調通常需要更新模型參數，而提示微調主要透過調整輸入表示來影響模型行為；
  D: 提示微調與傳統微調的差異僅在於是否使用預訓練模型
answer: C
