stem: |
  某工程師建立房價預測模型，輸入特徵包含屋齡與距捷運站距離（公尺）。他發現距捷運站距離分布嚴重右偏，經對數（Log）轉換後模型表現明顯改善；但將同樣轉換套用於屋齡後，模型表現反而下降。下列何者為最可能的原因？
options:
  A: 屋齡與房價若呈線性關係，Log 轉換反而破壞此結構
  B: Log 轉換會壓縮所有特徵的變異數，導致模型失去鑑別能力
  C: Log 轉換不適用於有單位的連續變數，應改用 Box-Cox
  D: 兩特徵須套用相同轉換，否則尺度不一致導致梯度不穩定
answer: A
explanation:
  summary: "答案 A。特徵轉換要配合與目標的關係，不能一律取對數。"
  correct: "若屋齡與價格原本接近線性，簡單線性模型改用 log(屋齡) 後，相當於改變可擬合的函數形狀，可能增加偏差。A 是合理的條件性原因；表現下降本身不能證明原關係必然線性，仍須看模型、資料與驗證。也不能將單一特徵右偏等同於一定需要常態化。"
  wrong:
    B: "對數會非線性改變距離，但不能說所有資料的變異數都必然縮小；數值範圍與單位也會影響比較，且題幹已有一個轉換後改善的特徵。"
    C: "具有單位不是禁用對數的理由，可相對固定參考量定義；Box-Cox 也不是專為解決單位問題，標準 log 與 Box-Cox 另有正值等條件。"
    D: "不同特徵可依需求採不同轉換；尺度若需調整可另外標準化，不必強制兩者使用同一函數。"
  rule: "特徵轉換先看任務關係、模型假設與驗證表現，不以偏態作唯一依據。"
