stem: |
  某工廠設備監測系統需偵測馬達軸承的異常振動，但過去僅記錄了大量正常運作的振動時序資料，缺乏任何已確認故障的標註樣本。請問下列何種任務範疇最符合此情境下的異常偵測需求？
options:
  A: 監督式二元分類（Supervised Binary Classification）
  B: 非監督或半監督異常偵測（Unsupervised / Semi-supervised Anomaly Detection）
  C: 強化學習（Reinforcement Learning）
  D: 自監督學習（Self-supervised Learning）
answer: B
explanation:
  summary: "答案 B。只有正常資料時，可先學正常行為，再判斷新樣本偏離程度。"
  correct: "可利用正常資料建立分布、重建模型或單類別邊界，再對偏離正常範圍的新資料報警。已知訓練資料全正常時，更精確可稱新奇偵測或單類別學習；B 把非監督與半監督異常偵測合列，是四項中最貼近的任務範疇。門檻仍需驗證，不能因訓練時沒有故障就保證能識別所有故障。"
  wrong:
    A: "一般監督式二元分類需要足夠的正常與故障標註，題目缺少故障類別，無法直接依此設定訓練。"
    C: "強化學習以行動、環境回饋與累積獎勵為核心；此處是觀測訊號的異常判斷。"
    D: "自監督可用預測或重建任務學表示，也能成為異常偵測的一環；但它描述訓練訊號來源，本身沒有定義異常判決與門檻，不如 B 直接對應任務。"
  rule: "只有正常訓練樣本時，先學正常模式，再另外設計異常分數與門檻。"
