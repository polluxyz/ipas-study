    by: EX-E7
  blind_answer: A
  dispute: 官方答案 A。典型 XGBoost 正則化目標為葉節點數與葉權重懲罰，樹深度由結構或超參數控制，不能直接把深度寫成該核心目標的獨立懲罰項。A 最接近出題意圖但有此實質措辭瑕疵，官方計分保留 A。
