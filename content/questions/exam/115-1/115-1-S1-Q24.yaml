stem: |
  某即時詐欺偵測系統對模型回應時間有嚴格限制，若推論延遲過高將影響交易核准流程。維運工程師在模型上線前進行延遲測試（Latency Testing）時，主要評估的目標為何？
options:
  A: 評估模型推論過程中的記憶體使用量，以確認部署資源是否足夠；
  B: 驗證模型對異常或攻擊輸入的穩定性與安全性；
  C: 評估模型在不同使用者族群上的預測結果是否一致；
  D: 評估模型從接收輸入到產生預測結果所需的回應時間是否符合系統要求
answer: D
explanation:
  summary: "答案 D。延遲測試確認一筆推論回應所需時間是否合乎要求。"
  correct: "D 正確：量測從接收輸入到產生預測所花的時間，判斷能否配合交易核准時限。科目 1 指引 5.2 將延遲列為系統效能指標。實務應先定義是否涵蓋前處理、特徵讀取、排隊及網路，並於代表性負載下看尾端延遲，不能只看平均模型運算時間。"
  wrong:
    A: "記憶體占用屬資源需求量測，可能影響延遲，但不是延遲測試直接量測的目標。"
    B: "異常或攻擊輸入的處理能力屬穩健性與安全測試；它們與回應時間是不同面向。"
    C: "不同群體的結果比較屬公平性評估，須依任務選擇公平指標，不能代替單筆回應耗時的測試。"
  rule: "延遲看一筆請求花多久，吞吐量看單位時間完成多少，資源與公平性另行評估。"
