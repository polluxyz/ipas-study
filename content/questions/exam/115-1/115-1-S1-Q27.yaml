concepts: [human-in-the-loop]
stem: |
  某醫院計劃導入一套 AI 醫療影像診斷輔助系統，用於輔助放射科醫師判讀 CT 影像。院方技術委員會討論在人命攸關且需確保最終臨床決策責任由人類承擔的情境下，從系統設計架構層面，最關鍵的安全機制為何？
options:
  A: 採用人機協作（Human-in-the-Loop, HITL）架構，由醫師最終審核決策；
  B: 模型信心低於閾值（Threshold）即自動關機；
  C: 隨機切換模型並以多數決決策；
  D: 對輸入影像加入隨機擾動
answer: A
explanation:
  summary: "A。人類承擔最終責任的高風險決策，須保留實際人工覆核權。"
  correct: "A 讓 AI 提供判讀建議，由醫師結合病史與臨床資訊確認、修正或拒絕，再決定最終處置。有效 HITL 應提供足夠資訊、介入與覆寫權及覆核紀錄，而非只是形式上要求醫師按確認。"
  wrong:
    B: "低信心可觸發轉交醫師，但自動關機會中斷服務，未建立完整接手流程。"
    C: "多模型投票仍是自動決策，隨機切換沒有把最終判斷權交給醫師。"
    D: "擾動可用於某些穩健性測試，但不構成人工覆核機制，任意改動臨床輸入還可能降低品質。"
  rule: "高風險輔助決策要讓人能理解、介入與覆寫，並明確保留責任。"
