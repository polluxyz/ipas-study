stem: |
  某醫療新創團隊將原有 3 層 CNN 升級為 16 層架構以提升 CT 影像腫瘤偵測率，但發現訓練損失反而高於 3 層版本且收斂困難。工程師懷疑是網路深度造成的訓練問題，下列診斷與對策何者最正確？
options:
  A: 網路層數增加導致參數量過多，應減少每層卷積濾波器（Filters）數量以降低模型複雜度
  B: 深層網路可能出現梯度消失問題，導致淺層權重難以更新；應採用 ResNet 的殘差連接（Skip Connection）以改善梯度傳遞
  C: 16 層模型對 CT 影像而言仍過淺，應進一步增加網路深度以學習更高階特徵
  D: 問題可能來自激活函數（Activation Function），將 ReLU 改為 Sigmoid 可改善梯度傳遞問題
answer: B
explanation:
  summary: "答案 B。更深網路訓練不佳時，殘差路徑是合理的最佳化對策。"
  correct: "深度增加可能使淺層梯度傳遞及最佳化更困難。殘差區塊以輸入加上學得的變換形成輸出，提供較直接的訊息與梯度路徑，有助減輕深層模型退化。只憑訓練損失較高不能確診梯度消失，但 B 使用「可能」，其診斷與對策最符合題意。"
  wrong:
    A: "參數多可能影響資源或泛化，但訓練損失上升不等於已證明容量過大；減少濾波器也沒有直接建立梯度捷徑。"
    C: "已有加深後收斂困難的現象，沒有證據表示再加深就會改善，反而可能增加最佳化負擔。"
    D: "Sigmoid 在飽和區的導數很小，替換 ReLU 可能使梯度傳遞更困難，不能當作一般解方。"
  rule: "深層模型連訓練集都學不好時，先查最佳化與梯度路徑。"
