stem: |
  某電商平台的工程師在開發商品評論情感分析系統時，發現使用 One-Hot 編碼無法表達詞語之間的語意關係，且隨著詞彙表擴大，向量維度與記憶體需求快速增加。工程師因此改用 Word2Vec 進行詞語表示。請問 Word2Vec 從根本上解決了上述問題的哪項限制？
options:
  A: 建立詞語之間的序列依賴關係，以捕捉長距離上下文語意；
  B: 根據詞語在語料中的出現頻率調整其重要性，使模型更重視高頻詞；
  C: 降低詞彙表示的維度，同時保留語意結構，避免高維稀疏表示所帶來的限制；
  D: 透過監督式學習利用標註語料，提升詞語分類的準確性
answer: C
explanation:
  summary: "答案 C。Word2Vec 用低維稠密表示學習詞彙的語意關係。"
  correct: "C 正確：One-hot 對每個詞配置一個詞表維度，不同詞的向量彼此正交；Word2Vec 則從上下文共現學習固定維度的實數向量，使相似用法可反映於向量關係。科目 1 指引 3.1 的詞嵌入說明對應這項改善。它仍是靜態詞向量，並未完整解決多義詞隨語境改變的問題。"
  wrong:
    A: "Word2Vec 利用局部上下文學表示，並不直接建立整段文本的長距離序列依賴；這不是本題替換 One-hot 的根本優勢。"
    B: "詞頻加權較接近 TF-IDF 類思路；Word2Vec 的關鍵是學習稠密向量，而非單純提高高頻詞的重要性。"
    D: "Word2Vec 的預測目標來自語料本身的詞與上下文，不要求人工標註的情感或詞語分類標籤。"
  rule: "One-hot 區分詞的身分，詞嵌入進一步以低維向量表達詞的使用關係。"
