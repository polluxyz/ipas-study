stem: |
  某 IoT 平台接收工廠溫度感測器資料，發現在常態分佈（均值 25°C，標準差 2°C）的數萬筆紀錄中，出現數筆「999°C」的極端值，研判為感測器通訊錯誤（網路封包延遲導致數值溢位）所致，且該異常數值在實際情況下不可能發生。在進行模型訓練前的資料清洗階段，針對這類離群值，最適當的處理策略為何？
options:
  A: 保留所有原始數值，並使用平均數（Mean）作為特徵輸入模型；
  B: 對數據進行 Z-score 標準化，使數值落於約[-3, 3]範圍；
  C: 將 999°C 以獨熱編碼（One-Hot Encoding）轉為獨立類別特徵；
  D: 刪除異常的 999°C 記錄，或以中位數（Median）進行填補
answer: D
