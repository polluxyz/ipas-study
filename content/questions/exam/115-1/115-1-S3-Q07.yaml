stem: |
  某金融團隊建立信貸風險模型，特徵工程後共產生 200 個變數，其中「月收入」、「年收入」、「季收入」三者高度相關。模型上線後業務單位反映：每次重新訓練後，模型輸出的重要特徵清單在這些高度相關特徵間反覆變動，難以向審查單位解釋。請問下列何者為造成此現象最可能的原因？
options:
  A: 模型使用 L2 正則化，導致所有特徵係數被壓縮至接近零，重要性難以區分
  B: 模型使用 L1 正則化，面對高度相關特徵時隨機保留其中之一，導致每次訓練保留的特徵不穩定
  C: 模型未使用任何正則化，過擬合導致係數每次收斂至不同極值
  D: 特徵數量過多導致梯度消失，應優先進行 PCA 降維再套用正則化
answer: B
explanation:
  summary: "官方答案 B。L1 可能使相關特徵的入選不穩定，但題幹不足以確診原因。"
  correct: "若模型使用 L1，且重新訓練的資料或求解條件有所變動，可互相替代的收入特徵可能由不同成員取得非零係數，因此 B 符合常見機制。但 L1 並沒有必然的「隨機挑一個」步驟；固定資料與確定性流程可能一直選到同一個特徵。題幹未指明模型或正則化，這是合理候選原因，不能當成已證實診斷。"
  wrong:
    A: "L2 一般收縮係數而保留相關特徵，不以稀疏挑選其中一個為主要效果；而且壓縮程度取決於懲罰強度，不是必然全部接近零。"
    C: "無正則化與共線性也可能造成估計不穩定，因此不能僅由題幹完全排除；但過擬合不必導致不同極值，線性最小平方法更不能一概如此描述。"
    D: "200 個特徵不等於發生梯度消失；題幹沒有提供深層梯度傳遞問題的證據，也不足以指定 PCA 為優先解法。"
  rule: "相關特徵可替代時，L1 的稀疏選取可能不穩定，但仍須查明資料與求解設定。"
