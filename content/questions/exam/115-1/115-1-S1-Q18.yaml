concepts: [cross-modal-alignment]
stem: |
  某醫院的 AI 研究團隊正在開發一套整合「CT 影像+電子病歷文本+基因序列」三種模態資料的癌症預測模型。請問在此場景中採用「跨模態對齊（Cross-Modal Alignment）」技術主要解決什麼問題？
options:
  A: 使模型僅聚焦於 CT 影像資料，避免文本與基因資料引入雜訊；
  B: 自動生成跨模態配對標註，以減少人工標記需求；
  C: 降低多模態資料的儲存與計算成本，以提升訓練效率；
  D: 將不同模態的資料表示對齊至共同語意空間，使模型能建立跨模態之間的語意關聯
answer: D
explanation:
  summary: "答案 D。跨模態對齊讓不同形式的表示建立語意對應。"
  correct: "D 正確：CT、病歷與基因資料的維度和表示方式不同；對齊的目的是讓相關資訊能在共同語意表示中互相比較或關聯，而非直接把原始數值放在同一尺度。科目 1 指引 3.4 以圖文共享空間說明這種原理；本題將其延伸至醫療多來源資料，仍須設計配對資料與學習目標。"
  wrong:
    A: "只保留 CT 會放棄其他模態，而不是解決模態間如何對應的問題。"
    B: "自動配對標註可能是其他方法的功能，對齊本身不保證產生正確標註，常反而需要已知配對或關聯訊號。"
    C: "降低儲存量或計算量屬效率優化，並非建立跨模態語意關聯的主要目標；對齊訓練還可能增加成本。"
  rule: "跨模態對齊解決表示之間的語意對應，融合才進一步結合資訊做判斷。"
