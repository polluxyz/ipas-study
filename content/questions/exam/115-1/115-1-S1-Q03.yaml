stem: |
  某工程師在建構搜尋引擎的詞向量模型時，語料庫規模達數十億 token，且包含大量長尾詞彙（Long-tail Terms）。他在 Word2Vec 的 CBOW 與 Skip-gram 兩種訓練策略之間進行選擇，需考量訓練效率與低頻詞表示品質之差異。下列何者最能準確地反映兩者在此情境下的取捨？
options:
  A: CBOW 對長尾詞表現更好，因為它透過多個上下文詞的平均來強化稀疏詞的訓練訊號；
  B: CBOW 訓練速度較快、整體語意平滑，但對低頻詞的向量品質較差；Skip-gram 以中心詞預測周圍詞，對長尾詞累積更多訓練樣本，向量品質較優；
  C: Skip-gram 訓練速度更快，因為每次只需預測單一目標詞，計算量低於 CBOW；
  D: 兩者對低頻詞的表現完全相同，差異僅在於訓練時的 Batch 組織方式
answer: B
explanation:
  summary: "答案 B。CBOW 偏向訓練效率，Skip-gram 通常較照顧低頻詞。"
  correct: "B 正確：CBOW 彙整周圍詞來預測中心詞；Skip-gram 則把一個中心詞與多個周圍詞分別組成預測配對。後者讓稀少的中心詞也有多個訓練訊號，通常較利於長尾表示，但計算較多。這是科目 1 指引 3.1 的一般選型取捨，實際品質仍取決於語料、視窗及採樣設定，不是所有資料上的保證。"
  wrong:
    A: "上下文平均有平滑作用，卻不代表低頻詞的表示必然更好；此處把常見的兩者取捨倒置。"
    C: "一個 Skip-gram 配對雖只預測一個上下文詞，同一中心位置會產生多個配對，不能據此認定整體比 CBOW 快。"
    D: "兩者的預測方向及學習目標不同，並非僅改批次排列；詞頻分布也會影響其表示品質。"
  rule: "CBOW 用上下文猜中心詞，Skip-gram 用中心詞猜上下文並通常較利於低頻詞。"
