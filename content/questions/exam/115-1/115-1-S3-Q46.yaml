stem: |
  請依據下方資訊回答第 46~48 題。
  使用 CIFAR-10 資料集以建立卷積神經網路（CNN），進行彩色影像之分類與辨識分析。CIFAR-10 為一常用之影像分類基準資料集，內容包含 10 個類別，共計 60000 張彩色影像，其中訓練集含 50000 張影像，測試集則含 10000 張影像。每張影像解析度為 32 × 32 像素，並具有三個通道（channel），分別對應紅、綠、藍三原色。以下程式碼片段示範資料載入與處理流程。

  下圖顯示資料集的第 1 筆部分資料。

  ```text
  >>> x_train[0]
  array([[[ 59,  62,  63],
          [ 43,  46,  45],
          [ 50,  48,  43],
          ...,
          [158, 132, 108],
          [152, 125, 102],
          [148, 124, 103]],

         [[ 16,  20,  20],
          [  0,   0,   0],
          [ 18,   8,   0],
          ...,
  ```

  ```text
  >>> y_train[0]
  array([6], dtype=uint8)
  ```

  參考下圖資料處理，下列哪一項描述組合正確？

  描述 A：x_train, x_test 將影像範圍壓縮到 0~31 範圍
  描述 B：可以增加模型的泛化能力
  描述 C：x_train, x_test 資料轉換結果相當於 z-score 標準化
  描述 D：資料轉換目的是避免梯度爆炸或梯度消失
  描述 E：y_train 將 label 轉換為獨熱編碼（One-hot Encoding）
  描述 F：y_train 適合輸出層使用 softmax 函數
code: |
  import tensorflow as tf
  from tensorflow.keras import datasets, layers, models
  import matplotlib.pyplot as plt

  (x_train, y_train), (x_test, y_test) = datasets.cifar10.load_data()

  x_train, x_test = x_train / 255.0, x_test / 255.0
  y_train = tf.keras.utils.to_categorical(y_train, 10)
  y_test = tf.keras.utils.to_categorical(y_test, 10)
code_lang: python
options:
  A: 描述 A、描述 C、描述 F
  B: 描述 B、描述 D、描述 E、描述 F
  C: 描述 B、描述 C、描述 E、描述 F
  D: 描述 A、描述 B、描述 D、描述 E、描述 F
answer: B
explanation:
  summary: 官方答案為 B；除以 255 得到 0 到 1 的像素，to_categorical 產生獨熱標籤，但泛化改善與梯度問題的敘述需要條件限制。
  correct: 對原本介於 0 到 255 的像素，除以 255.0 後範圍是 0 到 1；to_categorical(y_train, 10) 則將類別索引變成 10 維獨熱向量，例如類別 6 只有索引 6 的分量為 1，適合 softmax 多類別輸出，因此描述 E、F 明確成立。若將描述 B、D 理解為輸入縮放可能改善訓練條件、間接有利於泛化與數值穩定，官方 B 最接近出題意圖。然而單純除以 255 並不保證泛化提升，也不能防止所有梯度爆炸或消失；嚴格讀法下沒有只包含明確成立描述的選項，應保留這項題意疑義。
  wrong:
    A: 包含錯誤的描述 A、C；像素上限是 255/255=1，而非 31，且程式沒有減去平均數再除以標準差，不是 z-score 標準化。描述 F 成立也無法使整組正確。
    C: 描述 C 明確不成立；z-score 應使用 (x-平均數)/標準差，這裡只有固定比例縮放。描述 E、F 雖成立，仍不能補救這個錯誤。
    D: 描述 A 明確不成立；資料範圍縮放到 0 到 1，而非 0 到 31。此外描述 B、D 的效益仍需依實際模型與資料驗證。
  rule: 先由轉換公式核對範圍與標籤形狀，再把可能改善訓練的作用與保證泛化或梯度穩定的說法分開。
