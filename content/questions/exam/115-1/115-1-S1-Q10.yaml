stem: |
  某工廠導入即時影像瑕疵偵測系統，需在高頻影像流中進行快速推論。工程師在 YOLO 與 Faster R-CNN 兩種物件偵測架構之間進行評估，請問下列哪一個針對兩者在偵測流程設計上的差異最為正確？
options:
  A: YOLO 採用單階段偵測，直接從整張影像預測物件位置與類別；Faster R-CNN 則先產生候選區域再進行分類；
  B: YOLO 與 Faster R-CNN 皆採用兩階段流程，但在特徵擷取方式上有所不同；
  C: YOLO 採用單階段架構，主要透過增加候選區域數量來提升偵測準確率；
  D: Faster R-CNN 採用單階段偵測方式，將物件定位與分類整合於同一模型中
answer: A
explanation:
  summary: "答案 A。YOLO 直接偵測，Faster R-CNN 先提議區域再精修。"
  correct: "A 正確：YOLO 的單階段路徑直接由影像特徵預測框與類別；Faster R-CNN 先由區域提議網路取得候選位置，再對候選區域分類及修正框。對應科目 1 指引 3.2；細部流程可對照 [YOLO](https://arxiv.org/abs/1506.02640)與 [Faster R-CNN](https://arxiv.org/abs/1506.01497)原論文。階段數指偵測流程，不是神經網路層數。"
  wrong:
    B: "YOLO 不是先產生候選區域、再逐區分類的兩階段流程，因此不是兩者都採兩階段。"
    C: "單階段的核心是直接預測，而不是增加供第二階段處理的候選區域；預測數量也不保證準確率提高。"
    D: "Faster R-CNN 的提議及區域判斷仍是兩個階段；即使共享特徵並可聯合訓練，也不會因此變成單階段。"
  rule: "分辨偵測階段數，要看是否先產生候選區域再做區域分類與框修正。"
