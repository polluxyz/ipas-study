stem: |
  請依據下方資訊回答第 46~48 題。
  使用 CIFAR-10 資料集以建立卷積神經網路（CNN），進行彩色影像之分類與辨識分析。CIFAR-10 為一常用之影像分類基準資料集，內容包含 10 個類別，共計 60000 張彩色影像，其中訓練集含 50000 張影像，測試集則含 10000 張影像。每張影像解析度為 32 × 32 像素，並具有三個通道（channel），分別對應紅、綠、藍三原色。以下程式碼片段示範資料載入與處理流程。

  下圖顯示資料集的第 1 筆部分資料。

  ```text
  >>> x_train[0]
  array([[[ 59,  62,  63],
          [ 43,  46,  45],
          [ 50,  48,  43],
          ...,
          [158, 132, 108],
          [152, 125, 102],
          [148, 124, 103]],

         [[ 16,  20,  20],
          [  0,   0,   0],
          [ 18,   8,   0],
          ...,
  ```

  ```text
  >>> y_train[0]
  array([6], dtype=uint8)
  ```

  參考下圖建立模型結果，下列哪一項描述組合正確？

  （圖示標記轉錄）圖中區塊 1 為 Input 至第一個 Dropout(0.25)，區塊 2 為兩個 64 濾波器 Conv2D 至第二個 Dropout(0.25)，區塊 3 為兩個 128 濾波器 Conv2D 至第三個 Dropout(0.25)，區塊 4 為 Flatten 至最後 Dense(10)。

  描述 A：區塊 1 layers.Input(shape=(32, 32, 3))主要目的是進行資料標準化
  描述 B：區塊 1 layers.Conv2D(32, kernel_size=(3,3), padding="same", activation="relu")考慮輸入為(32,32,3)，則輸出 shape 為(32,32,3)
  描述 C：區塊 1 layers.BatchNormalization()放在 Conv2D 之後可以減少梯度消失或爆炸
  描述 D：區塊 2 layers.Dropout(0.25)可以隨機將 25%神經元輸出設定為 1
  描述 E：區塊 3 layers.Dropout(0.25)可以減少過度擬合（Overfitting）
  描述 F：區塊 4 Flatten 層的作用是將 3D 特徵圖展開為平放 1D 向量
code: |
  import tensorflow as tf
  from tensorflow.keras import datasets, layers, models
  import matplotlib.pyplot as plt

  (x_train, y_train), (x_test, y_test) = datasets.cifar10.load_data()

  model = models.Sequential([
      layers.Input(shape=(32, 32, 3)),
      layers.Conv2D(32, kernel_size=(3,3), padding="same", activation="relu"),
      layers.BatchNormalization(),
      layers.Conv2D(32, (3,3), activation='relu', padding='same'),
      layers.BatchNormalization(),
      layers.MaxPooling2D((2,2)),
      layers.Dropout(0.25),

      layers.Conv2D(64, (3,3), activation='relu', padding='same'),
      layers.BatchNormalization(),
      layers.Conv2D(64, (3,3), activation='relu', padding='same'),
      layers.BatchNormalization(),
      layers.MaxPooling2D((2,2)),
      layers.Dropout(0.25),

      layers.Conv2D(128, (3,3), activation='relu', padding='same'),
      layers.BatchNormalization(),
      layers.Conv2D(128, (3,3), activation='relu', padding='same'),
      layers.BatchNormalization(),
      layers.MaxPooling2D((2,2)),
      layers.Dropout(0.25),

      layers.Flatten(),
      layers.Dense(256, activation='relu'),
      layers.BatchNormalization(),
      layers.Dropout(0.5),
      layers.Dense(10, activation='softmax')
  ])
