stem: |
  某工程師訓練文本情感分類模型，訓練集 F1=0.96、驗證集 F1=0.71，落差明顯，顯示模型出現過擬合。下列哪一種策略能最直接從降低模型複雜度的角度緩解過擬合？
options:
  A: 增加訓練 Epoch 數至 200，讓模型充分學習訓練資料的所有細節
  B: 引入更多原始文本特徵（包括原始 URL、HTML 標籤），增加特徵多樣性
  C: 對 Embedding 層與全連結層加入 L2 權重衰減（Weight Decay），懲罰參數值
  D: 移除驗證集並將其併入訓練集，以增加模型可見的訓練樣本數
answer: C
explanation:
  summary: "答案 C。以權重懲罰降低有效複雜度，抑制過度貼合訓練資料。"
  correct: "訓練與驗證 F1 相差 0.25，題幹已將其判為過擬合；加入 L2 類型的權重控制可限制過大參數，使模型較不容易依賴訓練集的偶然細節。這裡降低的是有效容量，不表示刪掉層或減少參數個數。若使用 Adam，L2 加入目標與 AdamW 的解耦權重衰減也須在實作時區分。"
  wrong:
    A: "延長訓練可能進一步擬合雜訊，沒有直接限制模型容量，也不能保證改善泛化。"
    B: "未篩選的 URL 與 HTML 可能加入識別性雜訊或捷徑，增加特徵不等於降低複雜度。"
    D: "增加訓練資料在適當評估設計下可能有益，但直接移除驗證集失去調參依據，且不是本題指定的複雜度控制策略。"
  rule: "以參數懲罰抑制過擬合時，區分有效容量下降與參數數量減少。"
