stem: |
  某工程師建置企業內部知識問答的 RAG 系統，上線後發現部分問題檢索結果與查詢語意不符。分析後確認問題出在向量搜尋的語意匹配不準確。於檢索階段，採取下列哪種方法最能直接改善此問題？
options:
  A: 將切片大小（Chunk Size）由 512tokens 縮小至 128tokens，以提升檢索精細度
  B: 調整向量相似度閾值（Similarity Threshold），以過濾低相關檢索結果
  C: 採用混合搜尋（Hybrid Search）：結合語意向量搜尋與關鍵字搜尋（BM25），並以 RRF（Reciprocal Rank Fusion）融合排序
  D: 將檢索結果隨機洗牌（Shuffle）後回傳給 LLM，避免位置偏誤（Position Bias）
answer: C
