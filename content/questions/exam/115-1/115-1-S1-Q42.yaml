stem: |
  某保險公司將理賠金額預測模型正式部署上線，MLOps 團隊設計監控機制。三個月後模型整體均方根誤差（RMSE）無明顯變化，但業務單位反映高額理賠案件的預測誤差明顯增加。經分析，高額理賠案件僅佔約 5%的樣本比例，且未被監控機制及時發現。請問最可能的設計缺陷為何？
options:
  A: 監控頻率不足，應由每日批次監控改為即時串流監控；
  B: 高額理賠案件屬於長尾分布，難以透過監控指標偵測，因此無法透過監控機制發現問題；
  C: RMSE 無法有效反映高額誤差，應改以平均絕對誤差（MAE）作為主要監控指標；
  D: 僅監控整體 RMSE，未針對不同理賠金額區間進行分群監控
answer: D
explanation:
  summary: "D。整體誤差指標可能掩蓋少數高價值子群的退化。"
  correct: "D 應依理賠金額區間分群，分別看 RMSE、樣本數及業務損失。占比固定時，整體 RMSE 的平方是各群 MSE 的占比加權和；高額群僅占 5%，其退化可能被其他 95% 的改善抵銷，整體穩定不代表各群穩定。"
  wrong:
    A: "提高頻率只能更快看到同一整體數值，不能修補缺少分群的缺陷。"
    B: "少數與長尾案例仍可設分群誤差、分位數及業務告警；樣本少增加估計不確定性，不是不能監控。"
    C: "RMSE 先平方誤差，本來對大誤差較敏感；改成整體 MAE 不會自動解決子群被平均掩蓋的問題。"
  rule: "整體品質穩定仍須查關鍵子群，監控粒度應對齊業務風險。"
