  blind_answer: B
  dispute: 官方答案 B。多輪歷史不代表題設必須每輪即時回覆；若容許非同步，C 的 Batch 成本也可達目標。B 是通常互動方案，但題面未給延遲上限，不能補入即時限制唯一排除 C。保留官方計分、題設費率與摘要額外成本條件。
