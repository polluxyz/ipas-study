concepts: [rag-token-budget]
stem: |
  一位機器學習工程師正在優化公司內部的 RAG 法律文件問答系統。近期因營運成本壓力，公司要求在不更換模型且不影響回答品質的前提下，將整體 token 成本降低至目前的 60%，且目前成本主要集中於輸入 tokens。工程師在檢查系統後，盤點出目前的使用情況如下：
  ◆使用模型：GPT-4o（輸入$5／1M tokens、輸出 $15／1M tokens）
  ◆每次查詢：將前 10 筆檢索文件區塊全部加入 Prompt（每塊約 600 tokens）
  ◆System Prompt：每次請求均包含約 500tokens 的公司背景說明
  ◆對話機制：保留完整對話歷史，平均累積約 8,000tokens
  ◆每日查詢量：約 5,000 次
  ◆平均輸出：約 300tokens／次
  在上述限制與系統現況下，請問下列哪一項優化組合，最能在維持回答品質的前提下有效降低 token 成本？
options:
  A: 將輸出 max_tokens 從 1,000 壓縮至 200，強制模型給出更短的回答，以降低輸出費用；
  B: 將 System Prompt 改為 Prompt Caching 或靜態前綴重用，並對對話歷史實作摘要壓縮，以保留語意而非完整對話；
  C: 將所有查詢改為 Batch API 模式送出，透過非同步處理降低單次費用；
  D: 在 Prompt 中明確要求模型「回答時盡量簡短」，透過指令引導模型自行縮減輸出長度
answer: B
explanation:
  summary: "官方答案 B。B 是通常互動式問答的合理方案；原題未明定回應時限，接受非同步時 C 也可能達成成本目標。"
  correct: "B 在保留互動式問答、摘要不遺失關鍵法律事實且快取確實命中的條件下較合理。依題設費率，輸入為 10×600+500+8,000=14,500 tokens，總費用為 14,500×5/1,000,000+300×15/1,000,000=$0.077，目標為 $0.0462。忽略快取及摘要生成費、輸出不變時，歷史須壓至不超過 1,840 tokens 才達標。僅重用靜態字串仍會計費；500-token 固定前綴本身也不足以滿足 GPT-4o 當時 1,024-token 的快取門檻。依據：[OpenAI 快取教材](https://developers.openai.com/cookbook/examples/prompt_caching101)。指引未直接教授此 API 成本組合；原題又未給壓縮率與品質驗證，不能宣稱 B 必定達標。"
  wrong:
    A: "把實際平均輸出由 300 減至 200，即使全部請求都能完成，單次只省 $0.0015，約 1.95%，不足以降至六成；硬截斷還可能破壞完整性。"
    C: "不能一概判錯。[Batch API 官方文件](https://developers.openai.com/api/docs/guides/batch)說明非同步處理可有 50% 折扣；同模型與相同 token 用量下可降至約 $0.0385，但無法保證即時回應。多輪歷史本身不代表必須即時回覆；原題沒有明訂延遲限制，若容許非同步，C 也能符合成本目標。若另要求即時互動，則非同步批次不合適。"
    D: "簡短指令只針對輸出且不保證長度；即使完全省掉原有輸出費 $0.0045，也只省約 5.84%，無法解決主要輸入成本。"
  rule: "token 成本優化須以實際輸入、輸出與快取計價驗算，並明定品質及回應時限。"
