stem: |
  某信用風險模型：訓練 AUC=0.97、驗證 AUC=0.72、少數違約樣本預測波動極大及不同 K-fold 切分結果差異明顯。下列何者為最可能的問題？
options:
  A: 高偏差
  B: 高變異
  C: 過擬合
  D: 資料漂移
answer: B
explanation:
  summary: 由不同資料切分造成的預測與評估波動，辨識模型對訓練樣本過度敏感的高變異現象。
  correct: 官方答案為 B。模型在不同 K-fold 切分下表現差異大，且少數樣本的預測不穩定，最直接對應高變異，也就是訓練資料稍有改變，模型輸出就明顯變動。訓練與驗證 AUC 的大幅落差亦顯示泛化不佳；但這同時支持選項 C，因此需保留爭議。重複交叉驗證可量測這種波動，卻不會自動降低模型對訓練樣本的敏感度。
  wrong:
    A: 高偏差通常表示模型無法充分學到資料規律，連訓練表現也不理想。此處訓練 AUC 已達 0.97，較不符合這種描述。
    C: 此選項不能嚴格判為錯誤。訓練表現很好而驗證表現較差，確實符合過擬合的典型徵兆；官方以跨切分波動指向較具體的高變異，但兩者並非互斥。
    D: 資料漂移需有輸入分布或資料關係改變的證據。題目只描述切分間的不穩定及訓練、驗證落差，沒有提供時間或分布變動資訊。
  rule: 跨切分波動要看高變異，訓練驗證落差看過擬合，兩者可並存。
