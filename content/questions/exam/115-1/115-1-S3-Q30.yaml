    by: QC
  blind_answer: B
  dispute: |
    官方答案 B。支持 B 的依據是不同 K-fold 切分造成明顯差異，並且少數違約樣本的預測劇烈波動，符合高變異對訓練樣本變動敏感的特性。爭議在於訓練 AUC=0.97、驗證 AUC=0.72 也支持 C「過擬合」，而高變異與過擬合可以同時存在，不能把 C 視為概念上錯誤。判定：保留官方 B 作為計分答案，學習時同時理解其過擬合徵兆與跨切分穩定性問題。高變異的定義可參考 [scikit-learn 官方偏差與變異示例](https://scikit-learn.org/stable/auto_examples/ensemble/plot_bias_variance.html)。
