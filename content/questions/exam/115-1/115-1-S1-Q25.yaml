stem: |
  某企業欲將其 AI 輔助決策系統提交給外部稽核單位審查，並宣稱符合 NIST《AI 風險管理框架》（NIST AI RMF）中可驗證性（Verifiability）的要求。為讓第三方稽核人員能獨立重現模型評估結果，下列哪一項技術實踐最直接符合此要求？
options:
  A: 將模型測試準確率優化至 99%以上，以達到業界公認的高可靠標準；
  B: 建立可追溯的測試資料與評估流程，並記錄模型訓練與評估過程中的關鍵設定，以確保結果可被重現；
  C: 加快模型迭代速度，縮短版本發布週期以盡快累積外部驗證數據；
  D: 擴充訓練資料量至數百萬筆，以統計方式確保模型的泛化能力達標
answer: B
