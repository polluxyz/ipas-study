stem: |
  某製造業公司計劃將 AI 導入生產線瑕疵檢測流程，目前瑕疵樣本約 800 張（含各類瑕疵類型）、正常樣本約 15,000 張，現有 IT 基礎設施為地端伺服器且無 GPU，且生產線環境需於地端即時完成推論，檢測需求為每片零件須在 100 毫秒內完成檢測，且預算為中等、無法於短期內大規模採購硬體。工程師正在規劃第一階段的 AI 導入方案，請問下列哪一種規劃最為合適？
options:
  A: 從零訓練一個大型 CNN 模型，並採購高階 GPU 伺服器以滿足推論速度需求；
  B: 採用預訓練模型進行 Transfer Learning，針對瑕疵樣本進行 Fine-tuning，並使用模型量化（Quantization）或蒸餾（Distillation）技術壓縮模型以符合延遲需求，部署於地端；
  C: 因樣本數不足，建議先暫緩 AI 導入，待蒐集至少 10 萬筆瑕疵樣本後再啟動專案；
  D: 將所有影像上傳至雲端，使用第三方 AutoML 平台自動訓練並部署，以節省開發時間
answer: B
explanation:
  summary: "答案 B。先利用預訓練表示，再以壓縮與實測滿足地端資源限制。"
  correct: "B 正確：遷移學習可降低少量瑕疵資料從零建模的負擔；量化減少數值精度與模型負擔，蒸餾則讓較小模型學習教師訊號，適合評估 CPU 地端推論。科目 1 指引 3.4 及科目 3 指引 5.2、5.4 支援資源與壓縮取捨。這只是最合理的第一階段方案，訓練資源仍須安排，且應在目標 CPU 測量完整檢測延遲及各瑕疵召回率，不能保證壓縮後必低於 100 毫秒。"
  wrong:
    A: "從零訓練大型模型對資料與算力要求高，再採購高階 GPU 不符短期硬體與預算條件。"
    C: "不存在所有瑕疵任務一律需要十萬筆的門檻；可先做受控試點，按各類樣本覆蓋與驗證結果決定補資料方向。"
    D: "把所有影像交給雲端服務推論，不符生產線必須在地端即時完成的限制；使用 AutoML 也不會自動消除此部署要求。"
  rule: "選型要同時滿足資料、硬體、部署位置與延遲限制，壓縮後仍須驗證效能與準確度。"
