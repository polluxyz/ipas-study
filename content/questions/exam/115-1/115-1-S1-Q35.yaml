stem: |
  某生物醫學研究機構正在建構一個整合「基因序列特徵」與「電子病歷文本特徵」的疾病風險預測模型。由於高維數值特徵和語意文本特徵的性質差異顯著，請問下列哪一種特徵處理與選擇策略最為合適？
options:
  A: 將所有特徵合併為單一特徵矩陣後，使用主成分分析（PCA）進行降維，作為模型輸入；
  B: 採分層策略，先對基因序列特徵進行特徵選擇，再對文本特徵進行語意表示，最後將兩類特徵融合（Feature Fusion）後輸入模型；
  C: 將所有特徵合併後，使用隨機森林（Random Forest）的特徵重要性進行一次性排序與篩選；
  D: 將文本特徵轉換為簡單統計特徵（如詞頻）後與基因特徵一併建模，以降低特徵處理複雜度
answer: B
explanation:
  summary: "B。異質模態先分別建立有效表示，再對齊並融合。"
  correct: "B 先依基因資料特性選擇特徵，再把病歷文字轉為能表達語境的向量，依病患或樣本對齊後融合。這保留各模態的結構與語意；特徵篩選、表示學習等擬合步驟須限於訓練資料，避免洩漏。"
  wrong:
    A: "PCA 先需要數值表示；即使文本已編碼，直接合併後只追求最大變異，也未必保留疾病相關語意。可作基線，但未先處理模態差異。"
    C: "隨機森林可篩選編碼後的數值特徵，但一次重要性排序不能代替文本語意表示，也不能直接處理原始病歷文字。"
    D: "詞頻可作基線，但易忽略語序、否定及上下文；只因簡化處理就捨棄語意，不符合題幹需求。"
  rule: "多模態融合前，先建立各自適合任務的表示並完成樣本對齊。"
