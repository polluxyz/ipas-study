stem: |
  某工程師的多元線性迴歸模型包含 150 個特徵，其中許多特徵高度相關（如「建坪」與「總面積」）。他同時希望控制過擬合且保留所有特徵的解釋能力，不讓任何特徵係數歸零，下列哪一項正則化方案最適當？
options:
  A: Lasso 迴歸（L1 正則化）：透過絕對值懲罰使部分係數歸零，具有特徵選擇效果
  B: Ridge 迴歸（L2 正則化）：透過平方懲罰縮小所有係數，在共線性下穩定估計且不歸零
  C: Elastic Net（L1+L2）：結合稀疏性與穩定性，但部分係數仍可能被壓為 0
  D: 無正則化的 OLS 迴歸：不控制過擬合，在共線性下係數估計不穩定
answer: B
explanation:
  summary: "答案 B。Ridge 用 L2 收縮穩定估計，不以稀疏化剔除特徵。"
  correct: "L2 在目標加入係數平方和，能減輕共線性造成的係數不穩定，並抑制過大係數。它不像 L1 以產生零係數來選特徵，因而較符合保留變數的意圖。但「不歸零」不是任何資料下都絕無零係數的數學保證；特定對稱或無關資料仍可能得到零，相關特徵係數也不是可識別的獨立因果效果。"
  wrong:
    A: "Lasso 的 L1 懲罰可使部分係數恰為零，與題目不希望主動刪除特徵的要求不符。"
    C: "Elastic Net 含有 L1 成分，仍可能產生稀疏解；雖可改善相關特徵的群組效果，卻不能保證保留所有非零係數。"
    D: "未正則化的 OLS 沒有係數懲罰；嚴重共線性時估計可能高度不穩定，不能同時滿足穩定與控制過擬合的需求。"
  rule: "想收縮係數而不主動稀疏選特徵時，優先考慮 L2，並核對尺度與共線性。"
