stem: |
  某工程師正在實作一個 CNN 影像分類模型，在 PyTorch 中定義模型架構時，需要在卷積擷取特徵後接上全連結層（Fully Connected Layer）進行分類。在模型程式碼中，需要在卷積輸出與全連結層之間插入什麼操作？
options:
  A: 使用全域平均池化（Global Average Pooling）將特徵圖壓縮後再接全連結層；
  B: 使用 Flatten 將特徵圖展平成一維向量；
  C: 直接將卷積輸出接到全連結層，系統會自動轉換維度；
  D: 先對特徵圖做 Softmax，再輸入全連結層
answer: B
