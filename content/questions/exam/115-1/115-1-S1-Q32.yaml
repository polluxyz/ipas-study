stem: |
  某工程師正在實作一個 CNN 影像分類模型，在 PyTorch 中定義模型架構時，需要在卷積擷取特徵後接上全連結層（Fully Connected Layer）進行分類。在模型程式碼中，需要在卷積輸出與全連結層之間插入什麼操作？
options:
  A: 使用全域平均池化（Global Average Pooling）將特徵圖壓縮後再接全連結層；
  B: 使用 Flatten 將特徵圖展平成一維向量；
  C: 直接將卷積輸出接到全連結層，系統會自動轉換維度；
  D: 先對特徵圖做 Softmax，再輸入全連結層
answer: B
explanation:
  summary: "官方答案 B，對應典型 Flatten 分類頭；題幹未給足架構條件，無法排除 A 的全域平均池化。"
  correct: "B 適用於分類頭使用每張影像全部卷積特徵的架構：N×C×H×W 經 torch.flatten(x, 1) 變成 N×(C·H·W)，再接 in_features=C·H·W 的 nn.Linear；須保留批次軸 N。但 A 也可構成有效分類頭，題幹條件不足，不能宣稱所有 CNN 都須直接展平全部空間特徵。[PyTorch Linear 文件](https://docs.pytorch.org/docs/2.15/generated/torch.nn.Linear.html)"
  wrong:
    A: "A 也有合法實作，不能一概判錯。全域平均池化彙整每通道的空間資訊，例如 x.mean(dim=(2, 3)) 可直接把 N×C×H×W 變成 N×C，不需另加 Flatten，就能接 Linear(C, 類別數)，也保留批次軸。若選用 AdaptiveAvgPool2d(1)，其輸出才是 N×C×1×1，須再整理形狀；不能由這個 API 推論所有池化架構都必須展平。題幹未限制分類頭大小或池化實作，因此 A 是合理替代架構。[PyTorch 多軸平均](https://docs.pytorch.org/docs/2.15/generated/torch.mean.html)；[池化輸出形狀](https://docs.pytorch.org/docs/2.15/generated/torch.nn.AdaptiveAvgPool2d.html)"
    C: "nn.Linear 對最後一軸運算，不會自動合併卷積軸；直接接入可能尺寸不符，或只沿寬度運算而非完成預期整張影像分類。"
    D: "Softmax 改變數值分布而不合併張量軸，不能解決卷積輸出與分類頭的形狀銜接。"
  rule: "卷積接分類頭先核對批次軸與 Linear 的最後一軸，展平與池化後分類都可行。"
