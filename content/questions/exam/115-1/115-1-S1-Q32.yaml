  blind_answer: B
  dispute: 官方答案 B。Flatten 是典型 CNN 與全連接層的銜接方式；但 A 的一般全域平均池化也可直接得到保留批次軸的 N×C 表示，接分類頭時不需特定 Flatten。題面未限定分類頭或特定 API，保留官方 B 與架構條件不足的疑義。
