stem: |
  某 AI 團隊同時開發多個影像辨識系統，並在訓練流程中統一加入資料擴增策略（包含隨機水平翻轉）以提升模型泛化能力。實驗後發現，部分任務的測試表現明顯下降。下列哪一項任務最可能因該資料擴增策略引入語意錯誤（Semantic Inconsistency），使同一樣本在翻轉後對應不同類別標籤，進而影響模型學習？
options:
  A: 寵物監控中的貓狗分類
  B: 車輛辨識中的車型分類
  C: 手寫數字辨識
  D: 道路場景中的行人偵測
answer: C
explanation:
  summary: "答案 C。增強後仍沿用標籤，前提是轉換不改變辨識語意。"
  correct: "數字類別依筆畫形狀與方向區分，水平鏡射可能破壞字形語意；若仍強制套原標籤，就會加入不合理的訓練樣本。不是每個鏡射數字都會變成另一個合法數字，也可能只成為不自然字形；四項中，數字辨識最不能預設具有翻轉不變性。"
  wrong:
    A: "通常將貓或狗左右鏡射後，動物種類不會因此改變，故較能保留分類標籤。"
    B: "在一般車型分類且沒有左右專屬類別的假設下，鏡射通常仍屬同一車型；若任務另含方向標籤才須額外處理。"
    D: "鏡射後仍是行人，但偵測框座標必須同步變換；只翻圖片而不改框是標註錯誤，與本題的類別語意問題不同。"
  rule: "使用資料增強前，先確認類別語意與空間標註都能隨轉換保持一致。"
