stem: |
  一家電商公司已將推薦系統 AI 模型上線三個月，業務主管要求專案團隊評估導入成效。團隊根據下圖數據得出結論：「因為 AUC 高達 0.91，模型表現優異，AI 導入成效良好。」請問此評估結論存在什麼根本問題？
options:
  A: 僅依賴離線指標 AUC 判斷模型成效，忽略線上業務指標（如 CTR 與營收）的變化，可能導致錯誤結論；
  B: AUC 已達 0.91，代表模型排序能力優異，即使 CTR 略為下降，仍可視為推薦品質提升；
  C: CTR 從 3.2%降至 3.1%，顯示模型效果變差，應立即還原（Rollback）至舊模型；
  D: 平均訂單金額提升至$1,020，代表模型已成功優化營收，因此無需考慮其他指標
answer: A
explanation:
  summary: "答案 A。離線排序分數不能單獨證明線上業務成效。"
  correct: "A 正確：AUC 0.91 表示在該離線評估資料上的排序能力；圖中 CTR 從 3.2% 降為 3.1%，客單價從 $850 升為 $1,020，並新增每月 $12,000 推論費用，須連同轉換率、流量、總收益與成本評估。CTR 是下降 0.1 個百分點，客單價增加 20%，兩者不足以直接算出淨效益。科目 1 指引 4.1 與 5.2 要求連結技術與業務指標；前後比較也不能直接證明因果，宜補對照評估。"
  wrong:
    B: "AUC 高不保證實際推薦曝光、點擊或購買增加，也沒有導入前 AUC 可證明排序能力改善。"
    C: "CTR 下滑應調查，但還須確認波動、樣本及業務目標；僅憑這一數字不能推導必須立即回退。"
    D: "總營收還受訂單量影響，淨效益還須扣除成本；客單價上升不能單獨證明營收或獲利改善。"
  rule: "AI 導入成效須同看離線指標、線上業務結果與總成本，並區分相關與因果。"
