stem: |
  某製造廠開發產線瑕疵檢測模型時，資料集存在嚴重類別不平衡問題，其中良品約占 99%，瑕疵品僅占 1%。若直接使用原始資料進行訓練，模型容易偏向預測多數類別（良品），導致對少數類別（瑕疵品）辨識能力不足。在不調整模型架構與學習演算法的前提下，僅透過資料前處理方式改善此問題，下列何者最適當？
options:
  A: 使用 SMOTE 等過採樣方法進行少數類別擴增；
  B: 加入 L1／L2 正則化（Regularization）以防止過擬合；
  C: 大幅增加深度神經網路的層數，以強化特徵萃取能力；
  D: 複製更多良品數據，以進一步提升模型的準確率（Accuracy）
answer: A
explanation:
  summary: "A。僅能調整資料前處理時，可用少數類過採樣改善訓練比例。"
  correct: "A 在訓練資料內增加瑕疵樣本；SMOTE 由少數類樣本與其近鄰插值產生新點。應先切分資料，再於各訓練折內過採樣，驗證與測試維持真實比例；原始影像的插值還須確認瑕疵語意有效，不能把 SMOTE 當成所有影像問題的必選法。"
  wrong:
    B: "L1／L2 改變訓練目標或參數約束，不是僅做資料前處理，也未直接補足少數類樣本。"
    C: "增加層數是改架構，違反題目限制，且不一定解決不平衡。"
    D: "再複製已占 99% 的良品會擴大偏斜；高準確率還可能掩蓋瑕疵召回率不足。"
  rule: "過採樣只作用於訓練資料，評估仍須反映真實類別比例。"
