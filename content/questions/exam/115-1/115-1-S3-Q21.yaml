stem: |
  某工程師將一個大型預訓練模型部署至資源受限的行動裝置，發現模型體積過大且推論效率不足。為降低模型大小並提升推論速度，他將原本 32-bit 浮點數權重轉換為 8-bit 整數。在不重新訓練模型的前提下，請問此過程稱為何？
options:
  A: 知識蒸餾（Knowledge Distillation）
  B: 權重剪枝（Pruning）
  C: 張量分解（Tensor Decomposition）
  D: 模型量化（Quantization）
answer: D
explanation:
  summary: "答案 D。改變權重表示精度屬於模型量化。"
  correct: "由 FP32 映射到 INT8 是以較低位元數表示權重；題目又排除重新訓練，因此屬訓練後量化。只計權重的原始儲存，每個數由 32 位降為 8 位，約剩四分之一；量化尺度、偏置等額外資料及硬體支援仍會影響實際大小與速度。"
  wrong:
    A: "知識蒸餾通常由教師輸出引導學生模型學習，不是單純把既有權重改成低精度表示。"
    B: "剪枝移除或遮蔽權重、通道等結構，重點是稀疏或結構縮減，並非改變數值位元數。"
    C: "張量分解將權重拆成較小因子以降低秩或運算，與此處 FP32 到 INT8 的操作不同。"
  rule: "位元精度下降是量化，權重刪減是剪枝，教師教學生是蒸餾。"
