stem: |
  某智慧製造公司在產線上部署工業相機進行即時外觀瑕疵檢測，原先將影像傳至雲端進行 AI 推論，但因網路延遲與連線不穩導致系統無法滿足即時需求（需低於 200ms）。工程師因此改為將模型部署於產線端的邊緣裝置後，但仍未達系統需求。在不更換硬體設備的前提下，下列哪一組技術最能有效降低推論延遲，同時維持合理準確率？
options:
  A: 減少訓練資料的使用數量，並重新訓練模型以提升推論效率；
  B: 使用批次推論（Batch Inference）處理多張影像以提升計算效率；
  C: 採用模型集成（Model Ensemble），透過多模型投票提升準確率；
  D: 將模型由 FP32 量化為 INT8，並進行推論加速優化
answer: D
explanation:
  summary: "D。硬體支援的 INT8 量化配合推論優化，可降低既有裝置上的成本。"
  correct: "D 降低數值精度，搭配支援 INT8 的後端、算子融合及記憶體優化，可能減少運算與搬移負擔。須以代表資料校準或量化感知訓練，實測端到端延遲及準確率；INT8 不保證在每種硬體都加速，也不保證必達 200ms。"
  wrong:
    A: "推論成本主要由模型、輸入與執行方式決定，減少訓練樣本不會直接讓相同模型變快，還可能降低品質。"
    B: "批次可提高吞吐量，但等待湊批可能增加單張延遲，不能只憑計算效率推論符合即時需求。"
    C: "集成通常執行多個模型，增加運算與記憶體負擔，與降低既有邊緣裝置延遲的目標相反。"
  rule: "低延遲優化要同時量測端到端時間、硬體支援與準確率。"
