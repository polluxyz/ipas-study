stem: |
  某工程師正在建置一套法律文件解析系統，在進行資訊擷取（Information Extraction）前，需要對文本進行詞性標註（Part-of-Speech Tagging, POS Tagging）。請問此步驟的主要目的為何？
options:
  A: 將文本翻譯為其他語言以利跨語言分析；
  B: 將文本切分為基本詞彙單位，以便後續處理；
  C: 判斷文本中各詞彙的情感傾向；
  D: 為每個詞彙標記其語法類別，如名詞、動詞與形容詞
answer: D
explanation:
  summary: "答案 D。詞性標註辨識各詞在句子中的語法身分。"
  correct: "D 正確：先找出詞彙的名詞、動詞等類別，才能讓後續規則或模型利用語法線索擷取人物、行為及其關係。這是科目 1 指引 3.1 的文本前處理任務。"
  wrong:
    A: "這是機器翻譯，輸出另一種語言的文本，並未為原文各詞指定語法類別。"
    B: "這是斷詞，處理詞彙邊界；切出一個詞之後，仍須另行判定其詞性。"
    C: "這是情感分析，判定正負向或情緒，不等於判定名詞或動詞。"
  rule: "問語法類別選詞性標註，問詞彙邊界選斷詞。"
