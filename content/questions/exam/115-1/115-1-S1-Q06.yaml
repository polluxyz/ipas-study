concepts: [image-segmentation]
stem: |
  某自駕車感知系統需要在同一張影像中同時完成道路、建築、行人的逐像素分類，並且能夠區分畫面中兩名相鄰行人（標記為「行人#1」和「行人#2」）。工程師在選擇語義分割（Semantic Segmentation）與實例分割（Instance Segmentation）時，請問兩者的根本差異為何？
options:
  A: 實例分割對每個像素進行分類但不產生 Bounding Box；語義分割產生 Bounding Box 但不進行像素級標記；
  B: 實例分割僅用於影像層級的類別分類，語義分割才進行逐像素標記；
  C: 語義分割將每個像素分配至預定義類別，但同一類別內的不同個體無法區分；實例分割能對同一類別的不同物件（如兩名行人）分別建立獨立遮罩（Mask）；
  D: 語義分割與實例分割皆為逐像素分類任務，但兩者在是否需要區分不同物件個體上並無差異
answer: C
explanation:
  summary: "答案 C。兩種分割的關鍵差別是能否區分同類物件的個體。"
  correct: "C 正確：語意分割讓兩名行人的像素都屬於行人類；實例分割額外保留個體身分，各自輸出遮罩，才能辨識行人一與行人二。科目 1 指引 3.2 比較的正是這個輸出差異。若系統還要求道路等背景類別與個體分割全面整合，另有全景分割設計，但不改變本題所問的基本差別。"
  wrong:
    A: "語意分割也產生像素標籤，不是只產生邊界框；實例分割方法也可能同時輸出框，不能以有無框作根本區分。"
    B: "影像層級分類通常只給整張圖標籤；實例分割會定位並標示各物件所占像素。"
    D: "兩者恰好在同類個體是否分開上有差異；把兩名行人合為一類像素，仍不足以標記各自身分。"
  rule: "逐像素分類看語意分割，還要分開同類個體則看實例分割。"
