stem: |
  某倉儲自動化公司以強化學習（Reinforcement Learning, RL）訓練機器手臂進行揀貨，獎勵函數設計為「每成功抓取一個貨品得+1 分」。部署後發現機器手臂學會反覆放開再抓取同一物品，以累積分數，但實際完成任務的效率極低。請問此現象的核心問題為何？應如何修正獎勵設計？
options:
  A: 獎勵塑形（Reward Shaping）：將獎勵改為「成功完成一次揀貨任務」而非單次抓取行為
  B: 策略退化（Policy Degradation）：降低學習率以穩定訓練
  C: 信用分配問題（Credit Assignment Problem）：引入優勢函數（Advantage Function）
  D: 災難性遺忘（Catastrophic Forgetting）：加入經驗回放（Replay Buffer）
answer: A
explanation:
  summary: "答案 A。修正方向正確，核心現象更精確稱為獎勵投機。"
  correct: "代理靠重複抓放刷分，表示代理最大化了設計的獎勵，卻沒有完成真實業務目標。應對完成一次有效揀貨給分，並追蹤物品與任務狀態，避免同一事件反覆計分。A 的 Reward Shaping 是獎勵設計手法，不是此問題最精確的名稱；問題通常稱 reward hacking 或獎勵規格錯置。"
  wrong:
    B: "降低學習率只改變更新速度；即使訓練完全穩定，只要抓放仍持續加分，刷分策略依然有利。"
    C: "信用分配處理較早行動如何獲得後續報酬的學習訊號；優勢函數不會自動改寫錯置的任務獎勵。"
    D: "沒有遺忘舊技能的證據；重播既有刷分經驗也不能讓不合理的分數變成真正完成任務。"
  rule: "代理會追求你給的分數，因此獎勵事件必須對齊真實完成條件並防止重複計分。"
