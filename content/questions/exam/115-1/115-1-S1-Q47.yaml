stem: |
  某電商平台將新的推薦模型部署至線上系統，為降低風險，團隊採用漸進式部署策略（Phased Rollout），先將新模型流量從 5%逐步提升至 100%。在部署初期，團隊發現轉換率（Conversion Rate）略有提升，但在流量提升至 30%時，系統延遲（Latency）明顯上升，且部分使用者體驗變差。請問在此情境下，最適當的下一步策略為何？
options:
  A: 立即將新模型全面部署至 100%，以觀察整體效果並評估系統表現變化；
  B: 還原（Rollback）至舊模型並停止新模型測試流程，以確保系統穩定與使用者體驗品質；
  C: 維持目前 30%流量並持續觀察，即使延遲問題存在也暫不進行調整；
  D: 暫停流量提升，針對延遲問題進行效能分析與優化後再繼續部署
answer: D
