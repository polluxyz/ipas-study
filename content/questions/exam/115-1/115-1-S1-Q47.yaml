stem: |
  某電商平台將新的推薦模型部署至線上系統，為降低風險，團隊採用漸進式部署策略（Phased Rollout），先將新模型流量從 5%逐步提升至 100%。在部署初期，團隊發現轉換率（Conversion Rate）略有提升，但在流量提升至 30%時，系統延遲（Latency）明顯上升，且部分使用者體驗變差。請問在此情境下，最適當的下一步策略為何？
options:
  A: 立即將新模型全面部署至 100%，以觀察整體效果並評估系統表現變化；
  B: 還原（Rollback）至舊模型並停止新模型測試流程，以確保系統穩定與使用者體驗品質；
  C: 維持目前 30%流量並持續觀察，即使延遲問題存在也暫不進行調整；
  D: 暫停流量提升，針對延遲問題進行效能分析與優化後再繼續部署
answer: D
explanation:
  summary: "D。先停擴量並分析延遲；是否回滾仍取決於服務護欄與影響程度。"
  correct: "D 適用於目前影響可控制且未達回滾門檻時：停止擴大流量，定位排隊、批次、資源或相依服務瓶頸，改善並驗證後再繼續。題幹未給延遲 SLO 或損害程度，不能推論維持 30% 必定安全；若已越過護欄就應降流量或回滾。"
  wrong:
    A: "已有延遲及體驗惡化訊號，放到 100% 會擴大曝險，不符合漸進部署目的。"
    B: "回滾不是普遍錯誤；若違反服務目標或影響嚴重，便應執行。但題幹未給門檻，直接回滾並停止測試比先分析修正更強，官方以 D 為最佳仍有條件不足的疑義。"
    C: "不擴量只是第一步，已見效能問題卻不分析或調整，無法確認風險受控。"
  rule: "漸進部署同時設擴量與回滾門檻，業務提升不能抵銷服務護欄違反。"
