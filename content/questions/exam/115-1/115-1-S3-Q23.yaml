stem: |
  某團隊開發法律文件生成系統，需根據合約前半段內容自動生成後半段條款。工程師分別使用 BERT 與 GPT-2 進行微調，但發現 BERT 的生成效果明顯較差，且即使增加訓練資料也無法改善。下列何者為最主要原因？
options:
  A: BERT 缺乏法律領域知識，因此生成能力較差
  B: BERT 的分詞方式影響語意理解，導致生成效果不佳
  C: BERT 模型規模較小，因此生成能力不足
  D: BERT 無法根據前文逐步生成後續文字，較不適合此類任務
answer: D
