stem: |
  某自駕車公司的 AI 訓練團隊面臨標註成本高的問題，無法取得足夠的真實惡劣天氣（大雨、濃霧）駕駛場景資料，工程師提議使用合成資料（Synthetic Data）來補充訓練集。請問下列何者最能正確敘述合成資料在 AI 訓練中的角色？
options:
  A: 合成資料主要用於文字任務的資料擴增，影像任務仍需依賴真實資料；
  B: 合成資料可完全取代真實資料，直接用於模型訓練；
  C: 合成資料主要用於降低模型推論時的計算成本；
  D: 合成資料可在控制條件下產生多樣化場景，用於擴充訓練資料並提升模型的泛化能力
answer: D
explanation:
  summary: "D。合成資料可補足稀有場景，泛化效果仍須用真實資料驗證。"
  correct: "D 可用模擬或生成方法控制雨量、霧度、光照及物件位置，補充不易蒐集的駕駛情境。能否改善真實道路表現取決於合成品質與分布差距，仍須保留真實場景測試，不能保證只要增加合成資料就會變好。"
  wrong:
    A: "合成資料也可用於影像、模擬環境等任務，並非文字專用。"
    B: "不能無條件假設合成與真實分布相同；即使訓練大量使用合成樣本，仍須真實資料驗證，不能保證完全取代。"
    C: "本題是訓練階段補資料，沒有直接改變模型大小或推論算子，主要用途不是降低推論成本。"
  rule: "用合成資料補訓練涵蓋範圍，再用真實情境確認泛化效果。"
