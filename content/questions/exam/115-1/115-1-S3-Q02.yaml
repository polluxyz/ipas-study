concepts: [mean-squared-error]
stem: |
  某工程師在建立房價預測模型時，訓練資料中存在少數豪宅（成交價超過一般物件 10 倍以上）。若工程師希望模型對這些極端高價物件的預測誤差更敏感，並在訓練時產生較大的梯度更新影響，應優先選擇下列哪種損失函數？
options:
  A: 平均絕對誤差（MAE）：對誤差進行線性懲罰，對離群值較不敏感，梯度近似固定
  B: Huber 損失（Huber Loss）：小誤差採平方懲罰，大誤差轉為線性懲罰，以降低離群值影響
  C: 均方誤差（MSE）：對誤差進行平方處理，使大誤差產生更大的懲罰與梯度
  D: 交叉熵損失（Cross-Entropy Loss）：用於分類問題的機率分布差異衡量
answer: C
explanation:
  summary: "答案 C。平方誤差會讓大殘差在損失與梯度中占更大比重。"
  correct: "令殘差 e = 預測值 − 真值，MSE 是各筆 e² 的平均，對某筆預測值的導數為 2e/n。相同權重下，殘差絕對值增為 10 倍，該筆平方損失增為 100 倍，梯度絕對值增為 10 倍。敏感性來自殘差大小，並非房價高就必然產生大梯度。"
  wrong:
    A: "MAE 對非零殘差的導數絕對值為固定的 1/n，不會隨殘差增大而持續增強梯度。"
    B: "Huber 在大殘差區採線性形式並限制梯度幅度，目的正是抑制極端誤差的影響。"
    D: "此處要預測連續房價，並未將價格設為類別或機率分布；一般分類交叉熵不符合這個輸出設定。"
  rule: "要加重大殘差的更新影響，先看損失導數是否隨殘差增長。"
