concepts: [realtime-feature-pipeline]
stem: |
  某電商公司計畫導入即時推薦系統，希望使用者進入網站後能在 100 毫秒內取得推薦結果，且推薦結果需依據最新使用者行為進行調整。系統需支援每日約 50 萬活躍使用者，尖峰時段每秒約 3,000 筆請求（QPS）。目前公司已累積歷史購買紀錄與瀏覽行為資料，並持續接收即時點擊流（Streaming Data）。IT 基礎架構採用雲端環境，團隊配置為 2 名資料工程師與 1 名機器學習工程師。某工程師提出以下導入規劃：
  (1)使用批次訓練（Batch Training）建立協同過濾模型
  (2)將模型部署為 REST API 提供即時推論服務
  (3)使用 Kafka 串流處理即時使用者行為特徵
  (4)將所有即時資料先寫入資料倉儲（Data Warehouse）再進行特徵計算
  (5)使用 Redis 或 Feature Store 快取即時特徵
  請問以下哪一項最合理的技術導入規劃組合與調整建議？
options:
  A: 保留(1)(2)(3)，移除(4)，並加入(5)以降低延遲；
  B: 保留(1)(4)，移除(3)，以確保資料一致性與系統穩定；
  C: 保留(2)(4)(5)，移除(1)，改用即時線上學習（Online Learning）；
  D: 全部保留(1)~(5)，可同時兼顧即時性與資料完整性
answer: A
explanation:
  summary: "答案 A。保留批次訓練與即時推論，縮短即時特徵讀取路徑。"
  correct: "A 正確：歷史資料可離線批次訓練，線上 REST 服務讀取串流管線更新的即時特徵，再回傳推薦。把資料倉儲入庫與特徵計算設為每次請求必經步驟，會增加延遲；改由 Redis 或具低延遲線上服務層的 Feature Store 提供特徵較合理。資料仍可非同步保留於倉儲。科目 1 指引 5.2 支援 API、快取與延遲評估，但未細教 Kafka／Redis 此一組合；100 毫秒與 3,000 QPS 是否達成仍須壓測。"
  wrong:
    B: "移除串流更新、仍讓即時特徵依賴倉儲計算，難以兼顧最新行為與快速回應，資料一致性也不會因此自動得到保證。"
    C: "即時推論不要求每次都更新模型權重；改為線上學習增加維運複雜度，且保留倉儲必經路徑仍未直接處理瓶頸。"
    D: "所有功能都保留在同步路徑，會繼續等待倉儲寫入與計算；完整留存可以用非同步流程完成，不必阻擋推薦回應。"
  rule: "即時推論、即時特徵與線上學習是不同需求，應先移除回應路徑上的非必要等待。"
