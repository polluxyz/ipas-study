stem: |
  某醫療團隊建立肺炎診斷系統，採用晚期融合（Late Fusion）策略，將胸腔 X 光影像與病患問診文字分別進行預測後再整合結果。測試發現，當問診紀錄品質不佳（如描述簡短或資訊缺漏）時，整體模型效能僅小幅下降。關於此現象，下列何者最不可能為其原因？
options:
  A: 各模態獨立進行預測，可降低單一模態品質不佳對整體結果的影響
  B: 融合階段可調整不同模態的權重，使低品質模態影響降低
  C: 各模態使用獨立模型，使錯誤不會在特徵層被放大
  D: 晚期融合會在輸入階段整合多模態特徵，因此能避免低品質資料影響
answer: D
explanation:
  summary: "D。最不可能原因是把晚期融合誤說成輸入階段整合。"
  correct: "D 與題幹定義衝突：本題晚期融合是影像與文字模型各先預測，再整合分數或決策，並非輸入端整合。指引科目 1 的 3-77 稱晚期融合為特徵層級整合，用語需澄清；作答依本題明示的決策融合流程。[多模態學習分類綜述](https://arxiv.org/abs/1705.09406)"
  wrong:
    A: "這是可能原因：影像分支可獨立預測，不必先把低品質文字混入影像特徵；下降幅度仍看分支能力與融合設計，不保證必然很小。"
    B: "這是可能原因：若融合器能依品質降低文字權重，就可能減少其干擾；題幹未保證使用自適應權重，只能說與觀察相容。"
    C: "這是可能原因：獨立表示可避免低品質文字在共同特徵層直接干擾影像；錯誤仍可能透過最終分數融合傳播，不能讀成完全無影響。"
  rule: "判斷融合階段看整合的是原始輸入、特徵，還是各模態的預測。"
