stem: |
  某金融機構的 AI 信用評分模型需上傳至第三方雲端服務商進行推論。法務部門要求：在不解密資料的前提下，由單一雲端服務商直接對加密資料進行模型運算。下列哪種隱私保護技術最符合此需求？
options:
  A: 聯邦學習（Federated Learning）
  B: 同態加密（Homomorphic Encryption）
  C: 差分隱私（Differential Privacy）
  D: 安全多方計算（Secure Multi-Party Computation, MPC）
answer: B
explanation:
  summary: "答案 B。同態加密支援在密文上計算，再由持鑰方解密結果。"
  correct: "資料持有者先加密，雲端使用支援的密文算子執行模型對應運算，再回傳加密結果；服務商在這段計算中不必取得明文。實際仍受算子、數值近似及計算成本限制，不代表任何模型都能零成本直接搬到密文執行。"
  wrong:
    A: "聯邦學習主要讓資料留在各端、交換模型更新，不等同於單一雲端直接計算密文輸入。"
    C: "差分隱私透過隨機化限制個體資料對可觀察輸出的影響，不提供密文加法或乘法的計算能力。"
    D: "MPC 通常由多方以秘密分享等協定共同計算，需配合相應信任與互動假設；題目指定單一服務商直接計算加密資料，較符合 HE，而非該多方流程。"
  rule: "需求若是服務商看不到明文卻要直接運算，先辨認同態加密。"
