stem: 在 AI 導入專案的初期規劃階段，下列哪一項屬於「人員規劃」的重點內容？
options:
  A: API 規格設計
  B: 模型優化參數
  C: AI 專案所需的跨部門協作角色
  D: 作業系統版本
answer: C
explanation:
  summary: 區分人員規劃與技術設計。
  correct: 人員規劃需列出業務、資料、開發與維運等角色，並明確指定各角色的責任與合作方式。跨部門協作角色符合此需求。
  wrong:
    A: API 規格描述系統如何交換資料，屬介面設計。
    B: 模型優化參數屬模型訓練與調校，並非人員分工。
    D: 作業系統版本是執行環境條件，並非專案角色。
  rule: 人員規劃回答誰負責，以及各角色如何合作。
