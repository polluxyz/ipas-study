stem: T-接近性（T-Closeness）技術主要是為了降低什麼風險？
options:
  A: 機率分佈差異造成的識別風險
  B: 資料重複風險
  C: 訓練時間過長
  D: 演算法震盪問題
answer: A
explanation:
  summary: 辨識敏感屬性分佈差異造成的揭露風險。
  correct: T-Closeness 限制同一等價群組的敏感屬性分佈，與整份資料的分佈相差多少。這可減少攻擊者因知道群組而推斷個人敏感屬性的額外資訊。
  wrong:
    B: 資料重複是品質或儲存問題，不是 T-Closeness 的主要限制對象。
    C: T-Closeness 不以縮短模型訓練時間為目的。
    D: 優化震盪屬訓練穩定性問題，與資料發布時的分佈接近條件不同。
  rule: T-Closeness 比較群組與全體的敏感屬性分佈，以降低屬性揭露。
