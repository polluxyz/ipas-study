stem: 下列何者為自然語言處理（NLP）中的詞嵌入技術，能將文字轉換為向量以利機器學習處理？
options:
  A: TF-IDF
  B: Word2Vec
  C: Stop Words
  D: Bag-of-Words
answer: B
explanation:
  summary: 辨識能學得語意表示的詞嵌入模型。
  correct: Word2Vec 以詞的鄰近關係訓練向量，讓語境相近的詞得到相近表示。題目要的是詞嵌入技術，因此選 Word2Vec。
  wrong:
    A: TF-IDF 依詞頻與文件頻率給權重；雖可形成數值向量，並非本題所指的學習式詞嵌入。
    C: Stop Words 是常見且資訊量較低的詞，屬於前處理考量，並非詞向量模型。
    D: Bag-of-Words 計算詞的出現次數，不會藉由鄰近語境學得稠密語意表示。
  rule: 將詞頻表示與學得語意的詞嵌入分開判斷。
