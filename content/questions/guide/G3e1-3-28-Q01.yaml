stem: 若欲描述隨機變數在連續範圍內取值的機率分佈，最適合使用下列哪一種函數？
options:
  A: 機率質量函數（PMF）
  B: 條件機率
  C: 機率密度函數（PDF）
  D: 累積分佈函數（CDF）
answer: C
explanation:
  summary: 區分機率密度與累積機率的表示。
  correct: 官方答案為機率密度函數。對有密度的連續型變數，密度曲線的區間面積才是該區間的機率，曲線高度不是單點機率。
  wrong:
    A: 機率質量函數列出離散取值的機率，與本題預期的連續密度不同。
    B: 條件機率是在指定事件或條件下計算機率，沒有直接指定連續分佈的表示方式。
    D: 累積分佈函數同樣能完整描述連續型變數的分佈，且可由兩端累積值之差求區間機率。因此 D 不能被一概判錯，原題用語有歧義。
  rule: 連續密度以積分求區間機率；累積分佈以端點值之差求機率。
