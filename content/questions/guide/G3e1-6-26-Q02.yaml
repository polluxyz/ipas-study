stem: 以下哪一種資料處理方式屬於「隨機擾動（Noise Injection）」？
options:
  A: 把姓名改成代號
  B: 將薪資加入隨機誤差
  C: 將地址改成縣市級別
  D: 以星號遮蔽身分證號
answer: B
explanation:
  summary: 辨識向數值加入隨機誤差的擾動方法。
  correct: 在薪資數值上加入隨機誤差，會以隨機方式改動原值，因此符合 Noise Injection。只有加入雜訊並不能保證已達成差分隱私，仍需明確的機制及參數。
  wrong:
    A: 把姓名改成代號是代碼替代，不必然涉及隨機改動原數值。
    C: 把地址改成較粗的縣市層級是泛化，並非向數值加隨機誤差。
    D: 以星號遮住部分內容屬遮蔽，不是隨機擾動數值。
  rule: 向觀測值加入隨機誤差是擾動；它不自動等於差分隱私。
