stem: 在進行 AI 導入評估時，為確保企業體系具備執行能力，應考量下列哪一項？
options:
  A: 使用者介面風格
  B: 技術成熟度與部署資源
  C: 品牌識別度
  D: 客服滿意度
answer: B
explanation:
  summary: 辨識導入前的技術與資源準備。
  correct: 要讓方案能實際執行，需確認技術是否可用，以及運算、系統和部署資源是否足夠。此項直接對應執行能力。
  wrong:
    A: 介面風格影響操作感受，但不能證明模型能完成開發與部署。
    C: 品牌識別度關乎市場認知，不代表企業已具備技術與部署條件。
    D: 客服滿意度可作為業務成果指標，並非執行能力本身。
  rule: 可行性評估要確認技術、資料與資源能支持方案落地。
