stem: 交叉驗證中，哪一種方法在每次驗證中只留下一筆樣本作為驗證集，其餘皆用於訓練？
options:
  A: K-fold
  B: Stratified K-fold
  C: LOOCV
  D: Repeated K-fold
answer: C
explanation:
  summary: 辨識每次只保留一筆驗證樣本的切分法。
  correct: 留一法對 n 筆資料建立 n 次切分，每次用其中 1 筆驗證、其餘 n-1 筆訓練。每筆樣本恰好輪流作為一次驗證資料。
  wrong:
    A: 一般 K-fold 每次保留一整摺，只有 K 等於樣本數時才等同留一法，因此 C 是更精確的名稱。
    B: Stratified K-fold 著重各摺類別比例，不以每次驗證只有一筆為定義。
    D: Repeated K-fold 反覆進行 K 摺切分，並未限定每摺只有一筆。
  rule: 每次驗證 1 筆、共驗證 n 次，稱為留一法。
