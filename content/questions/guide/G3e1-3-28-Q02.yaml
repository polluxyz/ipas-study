stem: 若一個隨機變數服從伯努利分佈（Bernoulli Distribution），則該變數可能取值為下列哪一組？
options:
  A: 任何實數
  B: 0 或 1
  C: 正整數
  D: 任意整數
answer: B
explanation:
  summary: 辨識伯努利變數的兩個標準取值。
  correct: 伯努利變數以 1 表示成功、0 表示失敗。若成功機率為 p，兩個取值的機率分別是 p 與 1-p。
  wrong:
    A: 任何實數的取值範圍不符合單次二元試驗的標準編碼。
    C: 正整數集合不包含 0，也不限於單次試驗的兩個結果。
    D: 任意整數包含許多其他數值，超出伯努利變數的兩個標準取值。
  rule: 單次二元試驗用伯努利分佈，標準編碼為 0 與 1。
