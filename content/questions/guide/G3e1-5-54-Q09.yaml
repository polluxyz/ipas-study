stem: 在優化器中，哪一個方法會自動調整每個參數的學習率，特別適用於稀疏資料？
options:
  A: Momentum
  B: Adagrad
  C: Adam
  D: SGD
answer: B
explanation:
  summary: 辨識稀疏特徵情境常見的逐參數更新縮放。
  correct: 官方選 Adagrad，因為它依各參數的累積平方梯度調整有效步長，常用於稀疏特徵。題幹未指明累積方式，因此不足以排除另一個自適應方法 Adam。
  wrong:
    A: Momentum 結合歷史梯度方向，不以 Adagrad 的累積平方和逐參數縮放。
    C: Adam 也會依各參數的一階及二階動量估計調整更新，因此不能說 Adam 不具自適應能力。官方偏好 B，但題幹條件不足以讓 C 完全不合理。
    D: 基本 SGD 不會自動維護各參數的自適應縮放統計量。
  rule: Adagrad 用累積平方梯度；Adam 用衰減的一階與二階動量。
