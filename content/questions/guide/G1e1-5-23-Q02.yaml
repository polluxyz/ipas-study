stem: 在特徵工程中，進行特徵標準化（如 Z-score 標準化）的主要目的是？
options:
  A: 增加欄位數量
  B: 提升資料壓縮效率
  C: 將特徵縮放至相同尺度，利於模型學習
  D: 將文字轉換為向量
answer: C
explanation:
  summary: 辨識特徵標準化處理尺度差異的用途。
  correct: Z-score 以訓練資料的平均數與標準差換算各特徵，使不同單位的數值能在相近尺度下使用。這對依距離或梯度訓練的模型尤其有幫助。
  wrong:
    A: 標準化換算既有欄位數值，不以增加欄位為目的。
    B: 標準化不是資料壓縮演算法，也不保證檔案變小。
    D: 文字轉向量需編碼或嵌入方法，並非 Z-score 的功能。
  rule: 標準化調整特徵尺度；參數只由訓練資料估計。
