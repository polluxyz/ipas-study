stem: CLIP 模型結合了哪兩種模態進行訓練？
options:
  A: 聲音與影像
  B: 影像與文字
  C: 文字與數值
  D: 圖形與表格
answer: B
explanation:
  summary: 辨識 CLIP 預訓練所用的配對模態。
  correct: CLIP 以圖片及其文字描述作為配對資料，訓練兩種編碼器的表示互相對應。原指引答案字母為 B；答案標籤只印「文字」，完整選項則是「影像與文字」。
  wrong:
    A: 聲音並非原始 CLIP 圖文對比訓練的配對模態。
    C: CLIP 的文字搭配圖片，不是一般數值資料。
    D: 圖形與表格不是原始 CLIP 任務指定的模態組合。
  rule: CLIP 對齊圖片表示與文字表示。
