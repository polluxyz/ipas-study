stem: 在評估企業 AI 導入可行性時，下列哪一項屬於「商業價值評估」的考量？
options:
  A: 模型參數量大小
  B: 開發人員數量
  C: 預期效益與回報
  D: 演算法選擇難度
answer: C
explanation:
  summary: 區分商業價值與技術、人力條件。
  correct: 商業價值評估關心專案能帶來多少成果，以及成果是否值得投入資源。預期效益與回報直接回答這個問題。
  wrong:
    A: 模型參數量主要影響運算與部署成本，不能單獨表示專案能創造的商業價值。
    B: 開發人員數量是人力條件，仍須與成本及成果一起評估才可判斷價值。
    D: 演算法選擇難度屬技術可行性考量，不等於預期回報。
  rule: 商業價值先看能改善什麼業務成果。
