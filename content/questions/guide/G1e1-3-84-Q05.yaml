stem: 若需在一張影像中辨識出多個目標並標示其位置，最適合使用何種技術？
options:
  A: 影像增強
  B: 影像分類
  C: 目標偵測
  D: 圖像生成
answer: C
explanation:
  summary: 辨識同時輸出物件類別與位置的技術。
  correct: 目標偵測會為各個目標提供類別與位置，常以邊界框呈現，因此適合一張圖片內有多個目標的需求。
  wrong:
    A: 影像增強調整亮度、對比或其他影像品質，不會自行完成目標辨識與定位。
    B: 影像分類通常只回傳圖片的類別，沒有各個目標的位置。
    D: 圖像生成負責產出影像，並非找出既有影像中的目標位置。
  rule: 需求同時包含「多個目標」與「位置」時，優先辨識目標偵測。
