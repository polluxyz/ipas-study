stem: 多模態人工智慧的核心目標為何？
options:
  A: 提升硬體運算效能
  B: 同時處理並整合來自不同感知類型的資料
  C: 專注於純文字輸入的分析
  D: 僅適用於影像分類任務
answer: B
explanation:
  summary: 辨識多模態 AI 的資料整合目標。
  correct: 文字、聲音與影像提供不同線索。多模態 AI 將這些線索合併或對齊，讓模型利用單一資料類型缺少的資訊。
  wrong:
    A: 更快的硬體有助於運算，但不是多模態技術的核心定義。
    C: 只分析純文字屬於單一模態，沒有整合其他資料類型。
    D: 多模態可用於對話、檢索及影片理解，範圍不只影像分類。
  rule: 多模態的判斷重點是整合不同類型的資料。
