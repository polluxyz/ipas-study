stem: 生成對抗網路（GAN）的訓練包含哪兩個核心組件？
options:
  A: 分類器與分群器
  B: 產生器與鑑別器
  C: 強化器與回饋器
  D: 解碼器與編碼器
answer: B
explanation:
  summary: 辨識生成對抗網路的兩個訓練角色。
  correct: 產生器嘗試做出能混淆鑑別器的樣本。鑑別器學習區分真實樣本與生成樣本，兩者交替更新形成對抗訓練。
  wrong:
    A: 分類器與分群器分別解決分類和群組探索，並非 GAN 的標準角色搭配。
    C: 強化器與回饋器不是 GAN 的標準組件名稱。
    D: 編碼器與解碼器可用於自編碼器；這組名稱沒有表達 GAN 必要的真假對抗角色。
  rule: GAN 以產生器製造樣本，以鑑別器判斷真偽。
