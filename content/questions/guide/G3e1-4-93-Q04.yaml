stem: 支援向量機（Support Vector Machine, SVM）若用於迴歸問題，稱為什麼？
options:
  A: Logistic Regression
  B: Decision Tree Regression
  C: Random Forest
  D: Support Vector Regression
answer: D
explanation:
  summary: 辨識支援向量方法的迴歸版本。
  correct: Support Vector Regression 是支援向量迴歸。它以容忍誤差帶及帶外懲罰建模連續目標，並控制函數複雜度。
  wrong:
    A: Logistic Regression 雖含迴歸一詞，通常用於分類機率估計，並非 SVM 的迴歸版本。
    B: Decision Tree Regression 以樹的分裂及葉節點值做預測，屬另一種模型。
    C: Random Forest 是多棵決策樹的集成，並非支援向量方法的名稱。
  rule: SVM 對應的連續目標模型稱為 SVR。
