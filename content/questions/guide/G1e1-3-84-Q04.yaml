stem: 在電腦視覺中，影像分類（Image Classification）的主要任務是？
options:
  A: 區分影像中不同實體的邊界
  B: 產生新的影像內容
  C: 為整張圖片指定一個標籤
  D: 判斷影像是否含有文字
answer: C
explanation:
  summary: 依輸出範圍區分影像分類與其他視覺任務。
  correct: 影像分類以整張輸入圖片作為判斷對象，輸出預定類別，例如把圖片判為犬類。題目指定單一標籤，因此選此項。
  wrong:
    A: 標示不同實體的邊界涉及分割或實體定位，超出整張圖片的類別輸出。
    B: 產出新圖片是生成任務，並非判斷既有圖片的類別。
    D: 判斷是否含文字可視為特定的二元分類應用，並非影像分類的一般定義；官方解析將此項稱為目標偵測，這個說法過窄。
  rule: 整張圖片給類別是分類；指出物件位置才涉及偵測。
