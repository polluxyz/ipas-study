stem: 若企業想確保 AI 模型在不同群體間「真正該被選擇者」皆有同等機會被正確預測，應採用哪一個公平性指標？
options:
  A: Equal Opportunity
  B: Demographic Parity
  C: K-Anonymity
  D: T-Closeness
answer: A
explanation:
  summary: 辨識要求不同群體真陽率一致的公平性。
  correct: Equal Opportunity 比較各群體中真實正例被正確預測為正例的比例，也就是真陽率。題目強調真正該被選擇的人，因此符合此指標。
  wrong:
    B: Demographic Parity 比較各群體整體被選中的比例，不以真實正例為條件。
    C: K-Anonymity 是資料發布時的匿名性條件，不是分類真陽率的群體公平指標。
    D: T-Closeness 限制敏感屬性的分佈差異，主要處理資料揭露風險。
  rule: 只比較真實正例在各群體的真陽率，對應機會平等。
