stem: 在 AI 系統整合過程中，為確保模型可與業務流程無縫對接，通常需要哪種角色協作？
options:
  A: 社群經營人員
  B: 資料標註員
  C: 產品經理與工程人員
  D: 硬體維修技術員
answer: C
explanation:
  summary: 辨識模型整合所需的業務與工程協作。
  correct: 產品經理釐清模型結果如何支援業務決策，工程人員負責資料介面、服務串接及錯誤處理。兩者合作才能把模型接進實際流程。
  wrong:
    A: 社群經營可提供使用情境，但不能單獨完成模型與系統的整合。
    B: 資料標註員負責標籤品質，並非業務流程與服務介面整合的主要組合。
    D: 硬體維修技術員維護設備，不能取代業務需求與軟體整合工作。
  rule: 模型整合需要業務需求的負責者與工程實作者共同參與。
