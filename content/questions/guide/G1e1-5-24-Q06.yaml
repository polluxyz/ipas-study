stem: 在設計 AI 應用系統架構時，使用容器技術（如 Docker）的主要優點為？
options:
  A: 加快資料標註速度
  B: 提升 API 回應速度
  C: 促進模型跨平台部署與環境一致性
  D: 減少模型所需參數量
answer: C
explanation:
  summary: 辨識容器對執行環境一致性的作用。
  correct: 容器映像可一起封裝應用程式及所需套件，使相容平台能使用一致的執行環境。跨處理器架構或特殊硬體仍需提供相容映像及驅動。
  wrong:
    A: 容器不會直接產生或校正資料標籤。
    B: 容器方便管理環境，但不保證 API 的回應一定變快。
    D: 容器不會自行刪減模型參數，模型壓縮需其他方法。
  rule: 容器主要處理應用與相依環境的封裝及一致性。
