stem: 機器學習模型若過度學習訓練資料中的雜訊，導致泛化能力下降，此現象稱為什麼？
options:
  A: 欠擬合（Underfitting）
  B: 過擬合（Overfitting）
  C: 特徵縮放（Feature Scaling）
  D: 梯度爆炸（Gradient Explosion）
answer: B
explanation:
  summary: 辨識學到訓練雜訊而降低泛化的現象。
  correct: 過擬合時，模型把只存在於訓練樣本的細節當成可泛化規律，因此訓練表現很好，遇到新資料時卻出現明顯落差。
  wrong:
    A: 欠擬合代表模型未充分學到訓練資料的主要模式，通常連訓練表現也不佳。
    C: 特徵縮放是改變數值尺度的處理，並非學到雜訊的現象名稱。
    D: 梯度爆炸是訓練時梯度過大的數值問題，與題目描述的泛化落差不同。
  rule: 訓練很好、未見資料明顯較差，是過擬合的重要線索。
