stem: 若企業欲降低 AI 模型因少數群體樣本過少而造成的過擬合風險，可以採用哪種資料增強方法？
options:
  A: SMOTE
  B: Softmax
  C: Momentum
  D: Dropout
answer: A
explanation:
  summary: 辨識以插值合成少數類別樣本的方法。
  correct: SMOTE 在少數類別樣本與其近鄰之間合成新點，是四項中直接增加訓練樣本的方法。是否改善泛化與公平性需另行驗證，不能保證一定降低過擬合。
  wrong:
    B: Softmax 將分數轉成類別機率，不會生成新訓練樣本。
    C: Momentum 平滑訓練更新方向，不會擴增少數樣本。
    D: Dropout 能提供正則化，但它不屬於合成少數類別樣本的資料增強方法。
  rule: SMOTE 合成的是少數目標類別樣本；公平性改善仍需分群驗證。
