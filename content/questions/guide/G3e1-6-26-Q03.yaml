stem: 在 AI 偏見治理中，對不同群體調整模型預測閾值，屬於哪一種偏見修正方法？
options:
  A: 資料泛化
  B: 結果門檻調整
  C: 模型剪枝
  D: 資料增強
answer: B
explanation:
  summary: 辨識訓練完成後調整決策門檻的去偏方法。
  correct: 在既有預測分數上，為不同群體選擇決策門檻，屬結果門檻調整。它改變模型輸出如何轉成最後決策，分類為後處理方法。
  wrong:
    A: 資料泛化改變資料精細程度，並非對預測分數設定不同門檻。
    C: 模型剪枝移除參數或結構，並非本題的群體門檻設定。
    D: 資料增強產生額外訓練樣本，發生在不同的處理階段。
  rule: 模型分數已產生後再調整決策門檻，屬後處理。
