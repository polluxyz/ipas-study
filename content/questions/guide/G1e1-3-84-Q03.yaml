stem: 語言模型 BERT 的主要特性為何？
options:
  A: 使用遞迴神經網路
  B: 無法處理上下文資訊
  C: 為單向語言模型
  D: 具雙向上下文理解能力
answer: D
explanation:
  summary: 辨識 BERT 的雙向語境表示。
  correct: BERT 的編碼器可同時利用目標詞前後的線索。預訓練時以遮蔽詞預測等任務學習這種雙向表示。
  wrong:
    A: BERT 的核心是 Transformer 編碼器，不是以遞迴神經網路作為主要架構。
    B: 利用周圍詞的資訊正是 BERT 的用途，並非不能處理上下文。
    C: BERT 的表示可參考左右文；此處的單向描述與模型特性不符。
  rule: BERT 的語境表示同時參考詞的前後文。
