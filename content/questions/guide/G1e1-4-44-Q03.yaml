stem: 企業進行 AI 導入前的評估分析，通常第一步應聚焦於？
options:
  A: 演算法選擇
  B: 資料標註工具
  C: 業務痛點與需求辨識
  D: 建立測試模型
answer: C
explanation:
  summary: 辨識 AI 導入評估的起點。
  correct: 先釐清企業面臨的問題與期望成果，才能決定是否需要 AI，以及要採用哪種任務和驗收指標。
  wrong:
    A: 沒有先定義需求，就無法判斷演算法是否適合要解決的問題。
    B: 標註工具是資料作業的選擇，必須先知道要蒐集與標註什麼。
    D: 測試模型用來驗證特定假設，建立之前應先明確定義問題。
  rule: 先定義業務問題，再決定資料與模型。
