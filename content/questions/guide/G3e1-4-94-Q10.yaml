stem: 在決策樹模型中，用於判斷分裂效果好壞的指標，常見的是下列哪一種？
options:
  A: 機率密度函數（Probability Density Function）
  B: 均方根誤差（Root Mean Squared Error）
  C: 基尼不純度（Gini Impurity）
  D: 卷積核大小（Kernel Size）
answer: C
explanation:
  summary: 辨識分類樹常用的節點不純度。
  correct: 基尼不純度由節點內的類別比例計算。分類樹可比較分裂前後的不純度下降量，挑選讓子節點更純的切分。
  wrong:
    A: 機率密度函數描述連續分佈，不是分類樹常見的類別純度指標。
    B: 均方根誤差可衡量迴歸預測品質，迴歸樹亦常以平方誤差類準則分裂。原題未限定分類樹，所以 B 不能被描述成與所有決策樹都無關。
    D: 卷積核大小是卷積網路的設定，並非樹節點的分裂品質。
  rule: 分類樹可看基尼或熵；迴歸樹通常看數值誤差的下降。
