stem: 關於模型選擇，下列哪一項敘述較為正確？
options:
  A: 模型越複雜越好
  B: 模型應優先考慮開發成本與可部署性
  C: 只要準確率高就不需考慮其他指標
  D: 模型無須考慮資料量大小
answer: B
explanation:
  summary: 辨識模型選擇需要兼顧實務限制。
  correct: 模型必須能在可用預算與環境中開發、部署及維護。B 在四項中較合理，但實務仍須先滿足任務品質、資料適配及其他必要限制。
  wrong:
    A: 複雜模型可能增加成本或過擬合，不能只因較複雜就判定較好。
    C: 高準確率可能掩蓋少數類別的錯誤，也不反映延遲、成本與可解釋性。
    D: 資料量影響可訓練的模型與泛化能力，不能完全忽略。
  rule: 模型選擇要同時檢查品質、資料條件與部署成本。
