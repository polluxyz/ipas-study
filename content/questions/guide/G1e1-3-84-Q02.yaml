stem: 在自然語言處理應用中，哪一項任務主要目的是從文字中識別出人名、地名、組織等資訊？
options:
  A: 情感分析
  B: 主題建模
  C: 命名實體識別
  D: 語音辨識
answer: C
explanation:
  summary: 辨識抽取人名、地名與組織名的任務。
  correct: 命名實體識別會在句子中標出具名片段，再賦予人名、地點或組織等類型，符合題目的輸出要求。
  wrong:
    A: 情感分析判斷文字的正負情緒或態度，輸出不是人名與地名。
    B: 主題建模找出文件的潛在主題，並不以標出每個具名片段為主要目標。
    D: 語音辨識把聲音轉成文字，後續才可能對轉錄文字做實體識別。
  rule: 先看任務要輸出情緒、主題、具名片段或轉錄文字。
